title: "Arlington General Contracting — Permits to Punch List, 98223"

intro: |
  Two very different housing eras sit inside the 98223 zip code. Downtown Arlington near the Stillaguamish River has Craftsman bungalows from the 1930s through the 1950s. Open a wall and you find knob-and-tube wiring. Post-and-pier foundations need evaluation before finish work starts. Out toward Smokey Point, the 1990s-2000s subdivisions are hitting the 30-year mark. KitchenAid range hood rough-ins and bathroom overhauls in those homes need Snohomish County PDS permits before the first framer arrives.

localContext: |
  Arlington splits into two building worlds. The older core along Olympic Avenue NE and Division Street — homes from the 1920s through the 1950s — has balloon-frame walls. No vapor barrier in the crawlspaces. Galvanized supply lines that corrode from the inside out. Hardie cement-board siding replacements come up often once water damage appears behind original cedar shakes on north-facing walls. The area pulls in 37 inches of rain a year. That moisture hides behind finishes until demo day.

  Legion Memorial Park sits a few blocks from some of the oldest housing stock in downtown Arlington. Streets like 3rd Street NE and Burke Avenue have homes that routinely surprise contractors mid-project. Sister joist and rim joist repairs are common mid-demo finds in that area. North-facing walls near the old downtown core show moss and rot faster than anything in the Smokey Point subdivisions.

  Unincorporated parcels outside Arlington city limits go through Snohomish County PDS. Plan review on a kitchen addition or structural remodel runs 6-10 weeks. Inside city limits, Arlington Community Development handles permitting. Different submittal process, different inspection schedule — confusing if you haven't done it before.

  Out along Highway 9 toward Silvana and the Cascade foothills, rural residential lots add setback and FAR calculations that trip up contractors unfamiliar with Snohomish County's unincorporated rules. Freeze-thaw cycles run hard from November through March in this corridor. Footings, deck ledger boards, and ground-contact PT lumber need to meet IRC requirements for that exposure — not just what passes a quick visual check.

commonProblems:
  - title: "Multi-Trade Scheduling Falls Apart Without a GC Holding It Together"
    description: "Electrical rough-in can't happen until framing passes inspection. Plumbing rough-in has to coordinate with HVAC before drywall goes up. One sub going dark for two weeks on a $120K Arlington renovation cascades into a month of delays. TopVolk manages MEP coordination directly — framing, electrical, plumbing, and mechanical all on one schedule, with rough-in and final inspections tracked against Snohomish County PDS timelines."
  - title: "Snohomish County PDS Plan Review Catches Homeowners Off Guard"
    description: "A bathroom conversion or a structural wall removal in an unincorporated Arlington parcel triggers full Snohomish County PDS review. That's not a quick over-the-counter approval. Missing that step means red tags and stop-work orders mid-project. We handle AHJ submittals, plan sets with correct setback and FAR calculations, and rough-in inspection scheduling before demo starts."
  - title: "Demo Reveals Structural Surprises That Weren't in the Original Budget"
    description: "Older Arlington homes — 1940s-60s construction near downtown along Olympic Avenue NE — often expose undersized LVL beam spans, rotted rim joist sections, and crawlspace moisture damage. None of it shows during the walkthrough. Stillaguamish River floodplain properties near Division Street compound the problem. High water tables push vapor into unprotected crawlspaces for months at a time. Every change order comes with a line-item breakdown and your sign-off before work continues. Deadline penalties are written into the contract — we have no incentive to drag scope changes out."

