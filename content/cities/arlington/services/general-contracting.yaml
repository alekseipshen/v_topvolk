title: "Arlington General Contracting — Snohomish County Permits, Handled"

intro: |
  Homes along Old Tote Road and the blocks east of I-5 in the 98223 zip code were built mostly between 1965 and 1985 — good bones, but cramped kitchens, tile-over-tile bathrooms, and electrical panels that weren't sized for a Bosch induction range or a Mitsubishi mini-split. Pulling permits through Snohomish County PDS adds real lead time here — sometimes 6-10 weeks before a framing inspection gets scheduled. Vladislav Volkov manages all of that directly, no handoffs to a project coordinator you'll never meet again.

localContext: |
  The 98223 zip spans from older downtown Arlington blocks — post-war ranchers, 1970s split-levels near the Stillaguamish River corridor — out to newer subdivisions around Smokey Point and SR-530 built in the late 1990s and early 2000s. Older stock frequently hides galvanized plumbing, undersized electrical service, and post-and-pier foundations that need shoring before any load-bearing wall comes down. Newer tracts look updated but carry builder-grade finishes, hollow-core doors, and minimal insulation — all worth addressing during a full remodel.

commonProblems:
  - title: "Structural Surprises During Demo on 1970s Arlington Ranchers"
    description: "Pull a wall in a 1968 rancher off Olympic Avenue and there's a real chance you'll find a load-bearing element with no LVL beam carrying the load — just a doubled 2×6 with notched plumbing running through it. Catching that after demo starts costs money fast. Structural issues discovered mid-project regularly push a $90K remodel north by $15–25K if there's no contingency built in."
  - title: "Snohomish County PDS Plan Review — The Wait Is Real"
    description: "Snohomish County PDS handles all permit applications for Arlington. Plan review on a kitchen addition or ADU runs 6–12 weeks depending on current workload — and submitting incomplete drawings sends you to the back of the queue. Every TopVolk application goes in complete the first time: stamped structural drawings, site plan, energy compliance worksheets, and correct FAR calculations."
  - title: "Multi-Trade Scheduling Collapses Without a Single Point of Contact"
    description: "Electrical rough-in must happen before insulation, insulation before drywall, drywall before tile — one sub missing a rough-in inspection compresses the entire schedule. Homeowners coordinating their own trades while timing a KitchenAid appliance delivery and a Milgard window install typically lose two to three weeks to sequencing gaps. MEP coordination through one GC prevents that."

faq:
  - q: "How fast can you get to Arlington for a general contracting consultation?"
    a: "Arlington is about 45 minutes from Shoreline via I-5 North — Vladislav runs site visits in Snohomish County most weeks. Call (206) 591-1096 to get on the schedule. Free on-site consultation with the actual contractor, not a commissioned closer."
  - q: "Do you handle kitchen remodels where we're upgrading to higher-end appliances like Samsung or Bosch?"
    a: "Yes. Upgrading from a builder-grade range to a Bosch or Samsung typically means running a new 240V circuit and sometimes upsizing the panel. Range hood CFM needs to match the appliance output. All of that gets scoped and priced in the initial estimate — no surprises at rough-in."
  - q: "What does a full home renovation in Arlington cost and how long does it take?"
    a: "A full-floor remodel — kitchen, bath, updated electrical and plumbing — in a 1,600 sq ft Arlington rancher typically runs $120K–$180K depending on finishes. Timeline is 4–6 months, including Snohomish County PDS permitting. Vladislav provides line-item pricing upfront, and deadline penalties are written into the contract. WA Licensed Contractor, 100+ projects completed since 2017."