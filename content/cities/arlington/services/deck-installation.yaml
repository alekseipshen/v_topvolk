title: "Arlington Deck Installation - Built for Snohomish County Rain"

intro: |
  Stillaguamish Valley rainfall hits 98223 hard — standing water near Haller Park through April is normal, and decks take the brunt. Arlington's 1990s and 2000s tract homes have ledger boards that predate current IRC flashing requirements. Composite decking — Trex Transcend or TimberTech AZEK — lasts 25+ years in this climate, compared to cedar that surface-checks within five seasons. TopVolk has completed 100+ renovation projects across Snohomish County since 2017. Call (206) 591-1096 to schedule a site visit with Vladislav.

localContext: |
  Housing along Highway 530 and in subdivisions like Gleneagle runs from 1980s ranchers to early-2000s two-stories — both built with PT ledger boards lagged to rim joists, minimal flashing, before current IRC requirements tightened. Zip code 98223 also sits in Cascade foothills range where frost depth reaches 15-18 inches in a hard winter. Post footings here need to go deeper than what inspectors in coastal Snohomish County cities like Lynnwood typically require.

commonProblems:
  - title: "Ledger Rot from Pre-2005 Flashing Shortcuts"
    description: |
      Homes built before 2005 in 98223 rarely have Z-flashing or self-adhesive membrane behind the ledger board. That gap wicks water into the rim joist through Arlington's long rain season. Surface rot on deck boards usually means the structural attachment is already compromised. Every ledger TopVolk installs gets kick-out flashing and a waterproof membrane before any decking goes down.
  - title: "Footings That Don't Reach Frost Depth"
    description: |
      Snohomish County PDS requires deck footings to extend below local frost depth — 15 to 18 inches in Arlington's foothills location. 1990s decks poured at 10-12 inches heave and crack within a few winters. Posts in ground contact also need UC4B rated pressure-treated lumber, not just standard PT framing stock from the lumber yard.
  - title: "Cedar Decking Failing Fast on North-Facing Lots"
    description: |
      North-facing decks in Arlington's tree-lined neighborhoods stay damp between rain events. Cedar grows moss within two or three seasons and begins surface-checking by year five. Fiberon, Trex, or TimberTech AZEK cap composite products shed water instead of absorbing it — no annual sealing, no moss, and the higher upfront cost typically offsets maintenance savings within a decade.

faq:
  - q: "How fast can you get to Arlington for Deck Installation?"
    a: |
      Arlington is about 45 minutes north on I-5 from Seattle. Site visits in 98223 get scheduled within a week. Vladislav — the owner, a WA Licensed Contractor — comes to your property himself, not a sales rep. Call (206) 591-1096 to set a time.
  - q: "Trex, TimberTech, or cedar — what deck material holds up best in Arlington's climate?"
    a: |
      Cedar is cheapest to install but needs annual sealing and moss control on PNW north-facing decks. Trex Transcend and TimberTech AZEK are capped composites rated 25+ years without sealing. TimberTech's full PVC core handles freeze-thaw cycles better — relevant for Arlington foothills winters. Most Snohomish County homeowners go composite on decks they plan to keep.
  - q: "Does a deck in Arlington require a permit, and how long does the process take?"
    a: |
      Any deck over 200 sq ft or 30 inches above grade needs a permit — City of Arlington or Snohomish County PDS depending on the address. Plan review runs 4-8 weeks. We handle the permit application, ledger inspection, and final inspection. If we miss the agreed completion deadline, we pay a penalty — written into the contract. A 400 sq ft deck runs 3-4 months start to finish including permit time.