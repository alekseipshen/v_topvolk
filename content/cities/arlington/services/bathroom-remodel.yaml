title: "Arlington Bathroom Remodel — Moisture Damage Starts Behind the Tile"

intro: |
  The Stillaguamish Valley pulls heavy rain off the Cascades from October through May, and the tract builds scattered through 98223 were framed with paper-faced drywall as shower backer — not cement board. Original Moen pressure-balance valves from those builds are past their serviceable life. Behind the tile, the substrate is often wet. Arlington bathrooms regularly need a full membrane system, not just new fixtures.

localContext: |
  Most of the housing stock along the 98223 corridor — neighborhoods off Olympic Avenue, the subdivisions east toward Bryant Road — dates from the late 1980s through early 2000s. Builder-grade fiberglass pans, zero waterproofing behind ceramic tile, and cast-iron drain stacks in some of the older ranch homes dating to the 1960s. Snohomish County PDS handles all permitting for Arlington; plumbing relocations require a rough-in inspection before drywall goes back up.

commonProblems:
  - title: "Wet Substrate Behind Fiberglass Shower Surrounds"
    description: "Pop off a grout cap in a 1990s Arlington master bath and you'll often find soft, black-stained OSB where there should be cement board. The fix isn't just waterproofing — it's full demo, substrate replacement, and a Schluter Kerdi or RedGard membrane system over new Hardiebacker before tile goes back. Skipping this step means redoing the work in five years."
  - title: "Undersized Exhaust Fans Driving Ceiling Mold"
    description: "Builder-spec fans in Snohomish County tract homes run 50 CFM — barely enough for a half bath. A standard 8x10 master bath with a long shower needs 80-110 CFM minimum. Moisture migrates into attic framing. Replacing the fan housing with a Broan or Panasonic WhisperCeiling unit rated for the actual room volume is standard scope on every gut remodel we do in Arlington."
  - title: "Garden Tub Removal and Walk-In Shower Conversion"
    description: "The 1990s garden tub was a builder checkbox — most homeowners want it out. Going from tub to a curbless walk-in shower with a linear drain means rerouting the existing drain rough-in, installing a Kohler or Moen pressure-balance valve at the new shower position, and tiling to IRC fixture-clearance specs. The Snohomish County PDS plumbing permit is part of our project scope, not an afterthought."

faq:
  - q: "How fast can you get to Arlington for a bathroom remodel consultation?"
    a: "Arlington is about 50 miles north of Seattle on I-5 — Vladislav schedules on-site consultations in Snohomish County cities regularly. Call (206) 591-1096. You'll talk directly to the contractor, not a sales rep, and get a line-item quote, not a vague range."
  - q: "Do you work with Moen, Kohler, and Schluter fixtures on Arlington remodels?"
    a: "Yes. Moen and Delta pressure-balance valves are standard replacements in 98223 tract homes. Kohler fixtures go in on most master baths we remodel. Schluter Kerdi strip drains and waterproofing membranes are on every tiled shower — no exceptions. Rinnai tankless water heaters come up on projects where the old tank is undersized for the new layout."
  - q: "What does the permit process look like for a bathroom remodel in Arlington?"
    a: "Arlington falls under Snohomish County PDS — not Seattle SDCI. Plumbing relocations need a permit and rough-in inspection before walls close. Plan review runs 3-5 weeks. Full gut-and-rebuild master bath: 8-12 weeks from permit submittal to blue tape walkthrough. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023 — deadline commitments are written into the contract. Call (206) 591-1096 to start the scope conversation."