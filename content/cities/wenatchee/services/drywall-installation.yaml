      path — sometimes a remote consult first saves everyone time. No sales staff involved;
      you talk directly to Vladislav.

  - q: "What does drywall installation cost in Wenatchee?"
    a: |
      Basic hang-and-finish on new construction or an addition typically runs $2.50–$4.50
      per square foot of drywall installed, including materials, tape, and Level 4 finish.
      Level 5 skim coat on existing walls adds $1.50–$2.50 per square foot on top of that.
      ADU firecode assemblies using 5/8" Type-X on both sides of a separation wall run
      closer to $5.00–$7.00 per square foot fully finished, depending on height and blocking
      requirements. Soundproofing with resilient channel or QuietRock pushes the number
      higher depending on room size. The free on-site estimate includes exact pricing by
      scope. Call (206) 591-1096 to schedule — no ballparks, just real numbers.

  - q: "What permits does drywall work in Wenatchee require?"
    a: |
      Like-for-like drywall repair inside existing walls generally doesn't need a permit
      in Wenatchee. But if the drywall work is part of a remodel that involves moving walls,
      altering structural elements, or building out an ADU, a building permit is required
      through the City of Wenatchee Building Department. ADU projects require a full plan
      set and go through plan review — currently running 4–8 weeks depending on project
      complexity and queue volume. TopVolk Construction is a WA Licensed Contractor and
      handles permit applications, plan preparation coordination, and building department
      communication as part of the project scope. You don't have to manage the paperwork
      or track the review status yourself.

  - q: "Can you match existing plaster or texture finishes in older Wenatchee homes?"
    a: |
      The 1920s–1940s homes near downtown Wenatchee often have veneer plaster over gypsum
      lath — that finish has a density and surface sheen that standard joint compound alone
      can't replicate without a bonding primer and a lime-based finish coat applied over
      the patch. For the 1960s and 1970s homes in Sunnyslope with orange-peel or knockdown
      texture, spray matching is done with a hopper gun dialed to the existing pattern
      before any priming. Patching into these surfaces without matching texture first is
      the most common mistake DIY repairs make — paint doesn't hide the transition.
      Matching samples are compared to the existing wall under raking light before we
      commit to any area.

  - q: "How long does a drywall project in Wenatchee typically take?"
    a: |
      A single-room hang-and-finish — say a remodeled bathroom or bedroom — typically
      runs 3–5 working days: hang day, first coat and tape, second and third coats on
      separate days, then sand and prime. A full kitchen or open-plan remodel targeting
      Level 5 finish runs 7–12 working days depending on square footage and coat count.
      ADU separation wall assemblies with resilient channel and double-layer 5/8" Type-X
      add a day or two for the decoupled fastening sequence. Drywall scope is scheduled
      after rough-in inspection clears — no finish work begins before mechanical and
      electrical are signed off by the AHJ.

