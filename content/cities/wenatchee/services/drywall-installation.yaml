title: "Wenatchee Drywall Installation — Level 5 Finishes & ADU Firecode Work"

intro: |
  Temperature swings in the Wenatchee Valley are punishing compared to almost anywhere
  west of the Cascades — summer highs pushing into the triple digits along the Columbia
  River corridor, January nights dropping to single digits, and that expansion-contraction
  cycle working on your framing and drywall year after year. You'll see it first in the
  corner bead seams, then along the ceiling joints. The older apple-era homes near downtown
  on Chelan Avenue (98801) tell a different drywall story than western Washington — it's
  less about chronic rain moisture and more about thermal movement and original
  lath-and-plaster that's finally hitting its limit after 80-plus years. The Sunnyslope
  neighborhood above town adds a different layer: 1970s ranch homes with spray-applied
  acoustic ceilings that look worse every year under modern lighting. TopVolk Construction
  handles drywall scopes from full hang-and-finish on ADU separation walls using 5/8"
  Type-X Sheetrock to Level 5 skim coats on remodeled kitchens — with CertainTeed GlasRoc
  for wet areas and mold-resistant Purple Board in any below-grade space. Vladislav Volkov
  is a WA Licensed Contractor, 100+ projects completed since 2017. Call (206) 591-1096 for
  a free on-site estimate with exact line-item pricing.

localContext: |
  The Columbia River splits Wenatchee's residential history cleanly. The older west-bank
  neighborhoods — downtown, the streets around Pybus Public Market, the Miller and Okanogan
  Avenue corridors — make up most of 98801, and that zip holds a heavy concentration of
  1920s through 1940s housing. Gypsum lath with two-coat plaster, some knob-and-tube
  electrical still present in walls, foundations that have settled more than once. Patching
  into that substrate without matching the finish profile takes bonding primer, a lime-based
  skim coat, and patience — not just a sheet of 1/2" drywall screwed over the damage.
  The 98802 zip — Sunnyslope, South Wenatchee, and the bench areas that developed through
  the 1960s and 1970s — is ranch and split-level territory, with textured ceilings, dated
  tape work, and popcorn that needs to come off before any serious renovation photography.
  ADU projects in both zip codes fall under WA HB 1337 (2024), which allows up to two
  ADUs per single-family lot and triggers 5/8" Type-X firecode drywall on any separation
  wall or ceiling. The City of Wenatchee Building Department handles permits for these
  scopes, with plan review running 4–8 weeks for ADU additions and roughly 1–3 weeks for
  interior-only remodels.

commonProblems:
  - title: "Popcorn Ceiling Removal in 1970s Ranch Homes — Sunnyslope and South Wenatchee"
    description: |
      The ranch houses built through Sunnyslope and South Wenatchee in the late 1960s and
      1970s got spray-applied acoustic texture on almost every ceiling — and that finish is
      aging out fast. It absorbs dirt, chips unevenly, and looks rough under any directional
      light fixture. Removal is a wet-scrape process followed by a full skim coat, typically
      1/8" of USG Sheetrock All-Purpose compound applied in two passes and sanded to a
      Level 4 or Level 5 finish. Homes built before 1978 require an asbestos test before
      any wet scraping — Wenatchee has certified labs that turn results around in 48 hours.
      After scraping, damaged paper facing almost always needs a PVA primer sealer before
      any skim work goes on, or the compound will bubble and delaminate. A standard living
      room ceiling around 200 sq ft typically runs $600–$1,100 for scrape-and-skim,
      depending on the condition of the substrate.

  - title: "Level 5 Finish for Sidewall Lighting in Remodeled Kitchens and Baths"
    description: |
      Recessed cans, under-cabinet strips, and pendant fixtures all graze the wall surface
      at a low angle — and that grazing light will find every imperfection in a standard
      Level 4 tape job. Level 5 means a full skim coat of joint compound applied over the
      entire taped surface, not just the seams and fastener heads. It's the only finish that
      holds up cleanly under directional lighting without showing as a textured mess six
      months after paint dries. For kitchens in the older 98801 homes where framing has
      some age movement baked in, the skim work also addresses shallow waves in the drywall
      plane before the finish coat. USG Sheetrock All-Purpose applied thin in two passes,
      finish-sanded to 220 grit, is the standard process. Labor and materials for a typical
      kitchen — roughly 450 sq ft of wall surface — run $1,400–$2,200 for Level 5 work,
      not including patching around new electrical rough-in locations.

  - title: "5/8\" Type-X Firecode Drywall for ADU Separation Walls — Permit Compliance"
    description: |
      WA HB 1337 opened up a significant number of ADU projects in Wenatchee — attached
      units above garages, DADUs in backyards, basement conversions. Any wall or ceiling
      assembly separating an ADU from the main dwelling or from an attached garage needs
      5/8" Type-X Sheetrock on both sides to meet the IRC one-hour fire-resistance assembly
      requirement. Substituting standard 1/2" drywall fails the rough-in inspection —
      Wenatchee's building department checks this at framing, not just at final. Fastener
      pattern, blocking at butt joints, and setting-type compound (not all-purpose) on the
      tape joints all matter for the assembly to achieve its rated performance. TopVolk
      Construction is a WA Licensed Contractor and handles permit coordination with the City
      of Wenatchee Building Department for ADU drywall scopes as part of the project. Plan
      for 2–3 weeks from permit issuance to final inspection on a straightforward
      garage-conversion ADU, assuming no structural surprises in the existing framing.

  - title: "Mold-Resistant Purple Board for Basements and Laundry Rooms"
    description: |
      Wenatchee's climate is drier than anything west of the pass, but basements and
      below-grade spaces still collect moisture — particularly in spring when snowmelt raises
      the water table and temperature differentials cause condensation on concrete foundation
      walls. Standard drywall in those locations fails within a few years: the paper face
      wicks moisture, the gypsum softens, and mold establishes behind the board before you
      notice surface bubbling. National Gypsum's Purple Board uses a fiberglass mat face
      instead of paper and won't support mold growth under normal moisture exposure. Pair it
      with a 6-mil poly vapor barrier on the concrete wall and DriCore subfloor panels if
      the slab has any moisture history showing in spring. A typical 400 sq ft basement
      drywall scope using Purple Board runs $1,800–$3,200 installed, depending on ceiling
      height and how much blocking needs to go in for code-compliant fastener spacing on
      concrete-adjacent walls.

  - title: "Soundproofing Between ADU Shared Walls — Resilient Channel and QuietRock"
    description: |
      An ADU above a garage or an attached unit sharing a wall with the main house creates
      a noise problem that fire-rated drywall alone doesn't address. Double-layer 5/8"
      Type-X satisfies the IRC fire assembly requirement but does almost nothing for airborne
      sound transmission. Resilient channel decouples the drywall plane from the framing —
      the channel flexes under vibration and breaks the direct transmission path through the
      studs. QuietRock 530 is the single-panel alternative: a 5/8" panel with a
      constrained-damping layer inside that performs comparably to a resilient channel
      assembly in less overall wall thickness. The STC rating difference between a standard
      stud wall and a resilient channel assembly is roughly 20–25 points — the practical
      difference between clearly hearing a conversation next door and barely detecting muffled
      sound. Labor for resilient channel and double-layer drywall on a 300 sq ft shared wall
      typically runs $1,200–$1,800, not including framing adjustments for the added
      wall depth.

faq:
  - q: "How fast can you get to Wenatchee for a drywall estimate?"
    a: |
      Wenatchee is roughly 2.5 hours from Seattle via US-2 over Stevens Pass — a drive
      Vladislav makes for the right project scope. For projects above $30K in total
      renovation scope, the on-site estimate is free and produces a written line-item quote
