title: "Wenatchee Door Installation — Heat, Hard Winters, Old Craftsman Homes"

intro: |
  The temperature swings in Wenatchee are unlike anything on the wet side of the Cascades. July
  pushes into the upper 90s, January drops to single digits, and that kind of thermal cycling does
  real damage to wooden entry doors over a 20-year stretch. Homes along Wenatchee Avenue in the
  old downtown core — 1930s and 1940s craftsman bungalows that predate the post-war boom — have
  original fir door frames that have been freezing, thawing, and baking under high-elevation UV
  for eight decades. The result is cold air you can feel at knee height in December even with the
  storm door latched. Sunnyslope homes built in the 1960s and 70s face a different problem:
  corroded aluminum threshold assemblies and disintegrated weatherstripping that stopped sealing
  years ago. TopVolk Construction replaces entry, patio, and interior doors throughout Chelan
  County — often with Therma-Tru fiberglass units when low maintenance is the goal, or Douglas-fir
  solid wood when the customer is matching period details — and we pull the permits, flash the
  rough opening properly, and get the AHJ sign-off before we call it done.

localContext: |
  Most of Wenatchee's older housing stock sits in the 98801 zip — downtown blocks, Sunnyslope, and
  the hillside lots climbing toward Wenatchee Heights. Homes here range from 1920s craftsman
  bungalows with post-and-pier foundations to mid-century ranchers from the 1950s and early 60s.
  East Wenatchee, across the Columbia in the 98802 zip, skews slightly newer but still has plenty
  of 1970s and 80s tract builds where original hollow-core interior doors are finally giving out
  after 40-plus years of daily use. The climate difference from western Washington matters directly
  for door installation: less ambient moisture means less mildew on door bottoms, but more UV,
  more thermal cycling, and colder dry winters with significant freeze-thaw pressure on exterior
  thresholds. Wood doors in Wenatchee tend to shrink and gap rather than swell and stick the way
  they do in Ballard or Bellevue. A properly installed exterior door here needs sill pan flashing,
  a continuous sill seal bead, and an adjustable threshold sweep — otherwise you're just shuffling
  cold air from one side of the door to the other. Interior door replacement during kitchen or
  bathroom remodels is straightforward, but swing direction and casing profile matter a lot in
  older homes where the trim dimensions don't match anything at a big-box store.

commonProblems:
  - title: "Entry Door Frame Rot from Wenatchee's Freeze-Thaw Cycles"
    description: |
      Old-growth fir was standard framing material in 1930s and 40s Wenatchee construction, and it
      held up well — but entry door frames in the 98801 zip are now 80-90 years old, and many have
      soft spots at the sill and bottom jamb corners from repeated freeze-thaw cycles. The damage
      usually shows up as bubbling paint near the threshold, and probing with a screwdriver sinks
      right into the wood. A proper fix isn't just swapping the door slab — you need to cut out the
      deteriorated framing, sister in new pressure-treated (PT) lumber at the sill zone, and install
      a sill pan flashing assembly (Schluter Kerdi membrane or a formed metal pan) before the new
      door unit goes in. We typically spec Therma-Tru fiberglass door systems for these replacements
      because the slab will outlast wood by decades under Wenatchee's UV load. Timeline is 1-2 days
      per entry door including frame repairs. Budget $1,800–$3,500 depending on how far the rot has
      spread into the rough opening.

  - title: "Aging Patio Sliders That Leak and Bind in Sunnyslope Homes"
    description: |
      Aluminum sliding doors from the 1970s and 80s were standard in Sunnyslope and other hillside
      neighborhoods — cheap to install at the time, and thermal performance wasn't anyone's priority.
      Forty years on, the frames are bowed, the weatherstripping is gone, and the roller assemblies
      grind or stop moving entirely. Air infiltration from a failed patio slider can add $80–$150 per
      month to heating costs through a Wenatchee winter. Replacing with a Milgard Tuscany vinyl-
      framed slider — or upgrading to a French door configuration if the rough opening allows it —
      makes a noticeable difference immediately. A French door swap requires checking the king stud
      and jack stud spacing and often trimming or extending the rough opening width by a few inches.
      Installation including framing adjustment runs $3,500–$7,000 depending on unit size and whether
      the sill needs rebuilding. The City of Wenatchee Building Division requires a permit for any
      structural modification to the rough opening, which we handle as part of the project.

  - title: "Permit Requirements for Door Replacement in Wenatchee"
    description: |
      Straight door-in-door replacements — same size, same location — don't require a permit with
      the City of Wenatchee Building Division in most cases. A permit is required when you're
      modifying the rough opening size, adding a new door where none existed, or altering the
      structural header — like upsizing from a 3-0 single entry to a double door, or converting a
      window to a sliding patio door. The plan review process for these smaller scope projects
      typically takes 1-2 weeks at the City of Wenatchee, considerably faster than Seattle SDCI's
      4-12 week cycle. Homes in unincorporated Chelan County go through Chelan County Community
      Development rather than city hall — a different application process with its own fee schedule.
      TopVolk Construction is a WA Licensed Contractor and handles the permit drawings, application
      submission, and AHJ coordination as part of the project scope. 100+ projects completed since
      2023 — the permit process is not something you'll need to figure out on your own.

  - title: "What Entry Door Replacement Actually Costs in Wenatchee"
    description: |
      A mid-range fiberglass entry door — Therma-Tru Benchmark or Smooth-Star series — typically
      runs $2,200–$4,500 installed in Wenatchee, including new brickmold exterior casing, threshold,
      and weatherstripping. That price assumes the rough opening framing is in good shape. Add
      $400–$900 if the jamb needs partial replacement, and another $300–$600 for a sill pan flashing
      assembly if water has been getting underneath. Solid wood doors in Douglas-fir or mahogany
      start around $3,000 installed and climb quickly for custom-profile units matching 1930s
      craftsman trim. Pella or Marvin clad-wood entry systems with sidelights run $7,000–$12,000
      installed. Smart lock integration — Schlage Encode or August WiFi Smart Lock — adds $200–$400
      to the project. Every quote from Vladislav is line-item — materials, labor, permit fees called
      out separately — and the contract includes a penalty clause for missed deadlines. Not a verbal
      promise. Written in.

  - title: "Weatherstripping Failure and Smart Lock Retrofits on Older Wenatchee Doors"
    description: |
      Compression weatherstripping on entry doors lasts 5-10 years before it loses its seal. The
      signs are drafts at the door perimeter in winter, visible light gaps when the door is closed,
      and heating bills that don't match your thermostat settings. In Wenatchee, where heating
      degree days stack up from November through March, a leaky door seal is a real monthly cost.
      Replacing just the weatherstripping and door sweep on an existing door runs $150–$350 and
      can buy another 5-7 years if the door slab and frame are otherwise sound. Adding a smart
      lock at the same time — Schlage Encode is the most straightforward retrofit for standard
      residential deadbolts — requires checking whether the existing door prep accepts a standard
      2-1/8-inch bore or needs a new hole cut. Most Wenatchee homes from the 1960s onward have
      standard bore patterns. Original craftsman doors sometimes have non-standard hardware mounting
      that needs an adapter plate or a custom mortise conversion. We do smart lock installs as a
      standalone service or bundled into a full door replacement.

faq:
  - q: "How fast can you get to Wenatchee for door installation?"
    a: |
      Wenatchee is roughly 2.5 hours from the Seattle base via US-2 over Stevens Pass or via I-90
      and SR-97 through Ellensburg. Vladislav schedules Chelan County site visits on set days to
      avoid wasted round trips — call (206) 591-1096 to check availability and get on the calendar.
      From first site visit to a signed contract with line-item pricing usually takes 3-5 business
      days. Installation on a standard single entry door replacement is 1-2 days of on-site work.
      One scheduling note: we avoid setting threshold and caulk work during freeze events — adhesives
      and sealants won't cure below about 40°F, and Wenatchee winters produce those conditions
      regularly from December through February.

  - q: "What does door installation cost in Wenatchee?"
    a: |
      Entry door replacement runs $2,200–$4,500 for a mid-range fiberglass unit installed, or
      $3,000–$7,000 for wood or clad-wood with sidelights. Full entry system upgrades — double
      door, transom, new framing header — run $7,000–$12,000+. Patio door replacements, swapping
      an old aluminum slider for a Milgard or Pella vinyl unit, typically come in at $3,500–$7,500
      installed. Interior door replacements during a remodel are $400–$900 each including casing.
      Those are real project ranges, not manufactured marketing numbers. The actual quote depends
      on rough opening condition, header size, and finish hardware selection. Call (206) 591-1096
      or schedule a free on-site consultation — Vladislav will give you a line-item price you can
      actually plan around.

  - q: "Do I need a permit for door replacement in Wenatchee?"
    a: |
      Replacing a door in the same opening with the same size unit — no structural changes — doesn't
      require a permit from the City of Wenatchee Building Division in most cases. A permit is
      needed when you're enlarging the rough opening, cutting a new opening, or modifying the
      structural header above the door. Examples that trigger a permit: upsizing to a double entry,
      converting a window to a patio door, or adding a new exterior door on a wall that didn't
      previously have one. Homes outside city limits go through Chelan County Community Development
      with a separate application process. TopVolk Construction is a WA Licensed Contractor and
      handles all permit drawings and AHJ submittals as part of the project — you don't have to
      sort out the jurisdiction question yourself.

  - q: "Can you match original door trim and hardware on older Wenatchee craftsman homes?"
    a: |
      Yes, and it takes more than pulling a style from a catalog. Original craftsman entry doors
      often used mortise locksets with non-standard backset dimensions — typically 2-3/8 inch to
      2-3/4 inch — and solid brass or bronze hardware with specific profile details that modern
      big-box stock doesn't replicate. We source reproduction craftsman hardware from Emtek and
      Baldwin, both of which offer period-accurate profiles in solid brass and oil-rubbed bronze.
      Smart lock integration is also possible: the Schlage Encode comes in an aged bronze finish
      that reads correctly on craftsman trim, and the deadbolt bore is standard enough to retrofit
      without remaking the door. If the original slab is structurally sound but the hardware is
      failing, a hardware-only replacement often saves the original door entirely.

  - q: "How long will a replacement door hold up in Wenatchee's climate?"
    a: |
      Therma-Tru and Pella fiberglass door lines carry limited lifetime warranties on the slab
      itself. The finish is a different story — Wenatchee's high UV exposure means plan to repaint
      or re-stain a fiberglass door every 5-8 years, compared to every 3-5 years for painted wood.
      Threshold assemblies, weatherstripping, and door sweeps are wear items regardless of door
      material — budget to replace them every 7-12 years. Aluminum-clad wood doors from Marvin or
      Andersen hold up particularly well here because the exterior cladding handles UV and thermal
      cycling while the wood core stays dimensionally stable. Hardware longevity is actually better
      in Wenatchee than on the wet side of the Cascades — less corrosion — though freeze cycles
      can stress cheaper hinge pins over time.

  - q: "Do you serve East Wenatchee, Leavenworth, and other nearby areas?"
    a: |
      TopVolk Construction covers all of Chelan County — East Wenatchee (98802), Leavenworth,
