title: "Wenatchee Deck Installation — Built for Hot Summers and Hard Winters"

intro: |
  Sunnyslope homes in 98801 sit elevated with sightlines toward the Columbia River — those views
  are exactly why decks here get used hard from May through October. But Wenatchee's temperature
  swings are wider than most contractors from the west side of the Cascades factor in: July highs
  pushing into the mid-90s, January lows dropping below 20°F. That freeze-thaw cycle stresses post
  footings and deck boards in ways a Seattle-spec build won't handle. Composite decking — Trex or
  TimberTech — holds up better than cedar here because the UV exposure is brutal without the marine
  overcast that filters it west of the pass. Cedar grays and checks fast in this climate without
  regular sealing. Vladislav Volkov has built decks across the Seattle metro and into the Wenatchee
  Valley, and the material conversation starts differently on this side of the Cascades. Call
  (206) 591-1096 to talk specifics before the summer build season fills up.

localContext: |
  Homes in the 98801 zip — the older residential blocks between the Columbia and Wenatchee Avenue —
  tend to be Craftsman and post-war bungalows built before 1960. Post-and-pier foundations are
  common in that housing stock, which means the existing rim joist on the back of the house often
  needs a real look before any ledger board gets through-bolted to it. Wenatchee Heights and the
  hillside neighborhoods above downtown mix mid-century ranchers with 1990s construction, and those
  builds in 98802 are more code-compliant for deck attachment — but builder-grade framing still
  benefits from a structural review before adding a loaded 12×16 deck. The City of Wenatchee runs
  its own building permits office, separate from Chelan County for unincorporated areas. Deck
  permits here require a site plan, a framing plan, and a ledger attachment detail with flashing
  shown. Frost depth matters more in Wenatchee than in Seattle: footings typically need to go 18–24
  inches to clear the freeze line, sometimes deeper on north-facing hillside lots.

commonProblems:
  - title: "Cedar vs. Composite: Getting the Material Right for Wenatchee's Drying Climate"
    description: |
      Cedar performs well in Seattle's wet climate because consistent moisture keeps the wood from
      drying out and cracking. Wenatchee flips that equation. Low humidity and intense summer sun
      age cedar fast — boards gray, check (surface crack), and cup within 3–5 years without annual
      sealing. Trex Enhance or TimberTech Legacy composite decking handles the temperature cycling
      better: factory-baked color doesn't fade the way topcoat stains do, and the boards expand and
      contract predictably across those 70-degree seasonal swings. Composite runs $10–$16 per square
      foot of material vs. $4–$7 for cedar, but the 25-year no-fade warranty changes the 10-year
      math significantly. For ground-level decks in Sunnyslope where airflow under the frame is
      limited, composite also resists the mold and mildew that cedar traps in shaded areas. The
      right call depends on shade, slope, and how often you want to spend a weekend sanding.

  - title: "Post Footings and Frost Line: Eastern WA Decks Need Deeper Piers"
    description: |
      Frost heave is the deck failure that doesn't show up until spring — posts tilt, the frame
      racks, and the ledger connection loosens. West-side contractors sometimes spec 12-inch
      footings that pass inspection in Seattle but fail in Wenatchee where ground freezes deeper
      and more reliably. Chelan County code requires footings to extend below the frost depth —
      typically 18–24 inches here, and deeper on north-facing lots in Wenatchee Heights. Setting
      6×6 ground-contact PT (pressure-treated) posts in tube-form concrete piers with a post base
      anchor keeps the wood off the soil and away from year-round moisture wicking. Burying the
      post directly in concrete is a common shortcut that creates rot at the soil line within
      10–15 years. City of Wenatchee inspectors check footing depth and diameter at the rough-in
      inspection — concrete can't be poured until that sign-off is in hand.

  - title: "Ledger Flashing: The Detail That Fails Most Permits and Causes Hidden Rot"
    description: |
      The ledger board connects the deck frame to the house, and improper flashing at that joint
      is how water gets behind the rim joist and rots out floor framing from the inside — slowly,
      over 5–10 years, before anyone notices. City of Wenatchee requires a stamped ledger detail
      on the permit drawings showing how the flashing laps the housewrap and integrates with the
      siding. On older homes in the 98801 zip — those with original T-111 panel siding or cedar
      clapboard — pulling siding to properly flash the ledger is required work, not optional.
      Ledger through-bolts (1/2-inch minimum, staggered per IRC table) need to hit solid rim joist
      or band joist, not just sheathing. Inspectors check the ledger connection and flashing at
      rough-in before decking goes down. Skipping this step is the single most common reason decks
      get red-tagged during a home sale. TopVolk pulls the permit and handles the full inspection
      sequence — call (206) 591-1096 to schedule an on-site look.

  - title: "Guardrail and Stair Code: What Wenatchee's Building Department Will Flag"
    description: |
      Any deck surface more than 30 inches above grade requires guardrails at least 36 inches high
      per IRC — and the City of Wenatchee enforces this at final inspection. Baluster spacing
      can't exceed 4 inches (the 4-inch sphere rule). Stair stringers need proper rise/run: maximum
      7¾-inch rise, minimum 10-inch run per step. Stairs also require a graspable handrail — a
      flat 2×6 cap rail doesn't qualify; the grip profile has to fall between 1¼ and 2-inch
      diameter so you can actually close your hand around it. For hillside lots on Sunnyslope or
      Wenatchee Heights, stair runs get long and the stringer layout has to account for actual grade
      changes across the slope. Getting those calculations right before framing starts saves
      expensive rework. A properly framed, code-compliant stair section with graspable handrail
      typically adds $1,200–$2,200 to the project depending on run length and material.

  - title: "Decks Over Living Space: Waterproofing When There's a Room Underneath"
    description: |
      Some Wenatchee homes on elevated lots — particularly along the Columbia River corridor — have
      a finished lower level or garage directly beneath where a deck will sit. That changes the
      project scope entirely. Composite decking alone won't waterproof the space below. A drainage
      system has to be built into the framing: either a Trex RainEscape channel-and-gutter system
      installed between joists before decking goes down, or a Duradek membrane applied over solid
      subdecking. Both require framing coordination — joist spacing, blocking placement, and
      drainage outlet locations all have to be planned before a single joist hanger goes in. The
      cost increase is real: a simple 300 sq ft ground-level deck runs $18,000–$28,000 installed
      with permits; a waterproofed second-story deck over living space adds $6,000–$10,000 to
      that range depending on the system. Worth understanding before a project goes to permit.

faq:
  - q: "How fast can you get to Wenatchee for a deck consultation?"
    a: |
      Wenatchee is about 2.5 hours from Seattle via US-2 over Stevens Pass — a direct shot east
      through the Cascades. Vladislav schedules Wenatchee consultations on dedicated travel days
      to keep the project economics reasonable for homeowners here. From first call to a signed
      contract typically runs 2–3 weeks; City of Wenatchee plan review for a standard deck
      takes 3–6 weeks after permit submittal. Active construction on a 300–400 sq ft deck runs
      2–3 weeks once permits are in hand. The earlier you call in the season, the better the
      booking window — summer slots fill by April. Call (206) 591-1096 to get scheduled.

  - q: "What does a new deck installation cost in Wenatchee?"
    a: |
      A standard 300 sq ft PT-framed deck with Trex composite decking, code-required 36-inch
      guardrails, and one stair section runs roughly $20,000–$30,000 installed in Wenatchee,
      permits included. Cedar decking brings the range down to $14,000–$22,000 but adds
      maintenance cost over time. Larger decks (500+ sq ft), multi-level builds, or second-story
      decks requiring waterproofing push past $40,000. What moves the number most: site slope,
      ledger complexity, material grade, and existing structure demo. Vladislav provides line-item
      quotes after an on-site visit — not "starting at" ranges. The consultation is free. Call
      (206) 591-1096 to schedule.

  - q: "Do I need a permit for a deck in Wenatchee, and who handles the paperwork?"
    a: |
      Yes — the City of Wenatchee requires a building permit for any deck attached to the
      structure, and for freestanding decks above 30 inches. The permit package needs a site
      plan showing the deck footprint and setbacks, plus a framing plan with ledger attachment
      and flashing detail. For properties outside city limits, Chelan County Building Department
      handles permits separately. TopVolk prepares and submits the full permit package —
      homeowners don't need to navigate the portal themselves. Plan review typically takes 3–6
      weeks. Both rough-in inspection (footings and framing) and final inspection are required
      holds. TopVolk is a WA Licensed Contractor and coordinates both inspection calls with the
      building department directly.

  - q: "What's the difference between Trex and TimberTech — which works better for Wenatchee?"
    a: |
      Both are solid composite lines with 25-year fade and stain warranties. Trex Enhance is
      the mid-tier at roughly $9–$13 per square foot for material; Trex Transcend is the
      premium option with deeper wood grain texture at $14–$18. TimberTech Legacy and Terrain
      occupy similar price tiers and carry a slightly more pronounced grain pattern on some
      profiles. For Wenatchee's climate — higher UV load and wider temperature swings than
      Seattle — both brands perform well. What matters more than the brand is proper hidden
      fastener installation (Trex Hideaway clips or TimberTech equivalent) so boards can
      expand and contract without surface screws backing out over time. Vladislav installs
      both; the choice usually comes down to budget and preferred color line.

  - q: "How long will a new deck last, and what does the material warranty cover?"
    a: |
      A properly built PT frame — posts set below frost line with post base anchors, ground-
      contact rated lumber for all members near soil — should last 25–30 years before the
      structure needs significant work. Composite decking warranties (Trex Transcend,
      TimberTech Terrain) run 25 years for fade and stain on the boards themselves. The
      warranty covers the material; it doesn't cover damage from improper installation —
      fasteners driven through the board face, missing expansion gaps, or board-to-soil
      contact. That's why the installation details matter as much as the product choice.
      Cedar in Wenatchee's drying climate needs re-sealing every 2–3 years to prevent
      checking and cupping. Composite requires an annual wash and clearing debris from
      between boards.

  - q: "Do you cover East Wenatchee and other nearby communities?"
    a: |
      TopVolk takes deck projects in Wenatchee, East Wenatchee, Cashmere, and Leavenworth.
      East Wenatchee sits in Douglas County, which has its own building permit jurisdiction
      separate from the City of Wenatchee and Chelan County — that affects permit prep but
      not the project itself. Scheduling for this part of eastern Washington is planned in
      advance; Vladislav coordinates a project calendar for the Wenatchee Valley to keep
      travel efficient. Call (206) 591-1096 early in the season — February through April is
      the right window to get on the summer build schedule. Permits take time, and the
      best decks get built when framing isn't rushed.