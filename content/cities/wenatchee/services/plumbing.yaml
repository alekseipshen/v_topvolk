title: "Wenatchee Plumbing — Galvanized Pipes, Hard Water, Cold Winters"

intro: |
  Galvanized supply lines in Wenatchee's pre-1960 housing stock don't fail all at
  once — they narrow from the inside out, year by year, until water pressure at the
  kitchen faucet is barely enough to fill a pot. The Mission neighborhood and the
  blocks radiating off Fifth Street in the 98801 zip hold a dense concentration of
  these homes, built through the 1930s and 1940s when the apple packing industry was
  driving construction across Chelan County. Columbia River basin water is
  mineral-heavy — dissolved calcium and magnesium accelerate lime scale buildup
  inside old steel pipe faster than most homeowners expect. TopVolk Construction LLC
  handles full pipe replacement — galvanized to PEX-A or copper — as part of
  bathroom and kitchen remodels, or as a standalone repiping when a camera inspection
  reveals the blockage. Vladislav Volkov has completed plumbing scope on 100+
  projects since 2017, coordinating directly with the City of Wenatchee Building
  Division on every permit-required job. Call (206) 591-1096 to schedule an on-site
  assessment.

localContext: |
  The 98801 zip covers Wenatchee's older residential core — the Wenatchee Heights
  area, blocks east of Wenatchee Avenue, and the neighborhoods near Pybus Public
  Market where bungalows from the 1920s through 1950s still run galvanized supply
  lines and cast-iron drains. Out in 98802, which covers portions of South Wenatchee
  and the areas climbing toward the orchard benchlands, mid-century ranchers and
  1970s construction are common — some with polybutylene supply pipe, some with
  original cast-iron that's starting to root-intrude at the joints. Chelan County
  sits on the east side of the Cascades, which means hard winters: overnight lows
  regularly hit the teens and single digits in January and February, a real freeze
  risk for pipes running through uninsulated crawlspaces and exterior walls. The
  Columbia River basin water supply also carries higher mineral content than western
  Washington municipal sources — that hardness shows up as lime scale inside tankless
  water heater heat exchangers and on aerator screens throughout the house. Plumbing
  work touching supply lines, drains, gas, or water heaters within city limits
  requires a permit through the City of Wenatchee Building Division; unincorporated
  parcels east and north of city limits fall under Chelan County Community
  Development.

commonProblems:
  - title: "Galvanized Pipe Replacement in Pre-1960 Wenatchee Homes"
    description: "Galvanized steel pipe corrodes from the inside out, and in Wenatchee's
      mineral-rich water supply the process runs faster than most homeowners expect.
      By the time a faucet runs slow or a pressure gauge shows under 40 psi at the
      fixture, the interior bore is often reduced 60-70% with iron oxide and calcium
      scale. The fix is full replacement — PEX-A (Uponor or Viega brand tubing)
      for supply lines is flexible enough to snake through existing wall cavities
      without full demo, or Type L copper where rigid pipe is preferred. In a
      typical 98801 bungalow, expect 4-6 days of work including rough-in inspection
      and final inspection with the City of Wenatchee Building Division. Project
      cost runs $8,000–$18,000 depending on home size, crawlspace access conditions,
      and whether cast-iron drain lines need concurrent replacement."

  - title: "Polybutylene Supply Pipe Failure in 1980s South Wenatchee Construction"
    description: "Homes built between roughly 1978 and 1995 in South Wenatchee and
      parts of the 98802 zip may contain polybutylene supply pipe — gray plastic
      tubing that degrades from chlorine in municipal water and eventually develops
      pinhole leaks or fitting failures at the acetal plastic crimp fittings. It
      looks intact on the outside until it isn't. Full replacement is the standard
      recommendation; partial repairs at one fitting location tend to fail elsewhere
      within a few years. Replacement with PEX-B or PEX-A runs $7,000–$15,000 for
      a typical single-story rancher. The project requires a permit from the City
      of Wenatchee or Chelan County Community Development depending on parcel
      location, and permit turnaround for a straightforward repiping typically
      runs 1–2 weeks."

  - title: "Tankless Water Heater Conversion and Gas Line Upsizing"
    description: "Switching from a 40- or 50-gallon tank to a Rinnai RU199iN or
      Navien NPE-240A2 in a Wenatchee home usually requires upsizing the gas
      supply branch from ½-inch to ¾-inch or larger — demand-fired burners pull
      180,000–199,000 BTU at peak, which a standard residential branch line can't
      supply without pressure drop. That gas line work requires its own permit and
      inspection. Chelan County's cold winters make the freeze protection feature
      matter: both Rinnai and Navien units have integrated freeze protection rated
      to roughly -22°F, but exterior vent terminations and condensate drain lines
      still need insulation in exposed locations. Hard water is the other variable —
      without a whole-house softener or inline TAC (template-assisted crystallization)
      system, the heat exchanger in any tankless unit scales up within 3–5 years.
      TopVolk handles full installation as a WA Licensed Contractor, including gas
      line upsizing, venting, and permit coordination through the City of Wenatchee
      Building Division."

  - title: "Pressure Regulator Installation for High-Pressure City Water"
    description: "City water pressure in lower-elevation zones of Wenatchee — areas
      near the Columbia River and off Wenatchee Avenue — can run above 80 psi during
      off-peak hours. Washington plumbing code (WAC 51-56) requires a pressure
      reducing valve when static pressure exceeds 80 psi, and unregulated high
      pressure wears out supply stops, washing machine hoses, and dishwasher inlet
      valves faster than they should. A quality PRV — Watts 25AUB or Wilkins 600
      series — installed at the meter location with a thermal expansion tank on the
      water heater runs $400–$700 in parts; labor and permit bring the total to
      $900–$1,400. Half-day job. If your Moen or Kohler fixtures are cycling through
      supply stops every couple of years, a pressure test is the right first step
      before replacing hardware again. Call (206) 591-1096 to schedule a diagnostic
      visit."

  - title: "Drain Line Rerouting for Kitchen Islands and Basement Bathrooms"
    description: "Adding a kitchen island with a sink in a Wenatchee rancher or
      split-level almost always means rerouting a drain line under a concrete slab
      or through a finished floor — cutting concrete or opening subfloor. The drain
      needs a minimum ¼-inch-per-foot slope per IRC Section P3005, and an island
      set more than 6–8 feet from an existing stack typically needs an air admittance
      valve (AAV) or dedicated wet vent to handle drainage without gurgling at the
      trap. Basement bathroom additions are similar: if the drain elevation sits
      below the main sewer line, a Zoeller or Liberty sewage ejector pump system
      is required. These projects range from $2,500–$6,000 for drain-only rerouting
      up to $8,000–$12,000 for a full basement bathroom rough-in. All work requires
      a permit and rough-in inspection before concrete or subfloor goes back down."

