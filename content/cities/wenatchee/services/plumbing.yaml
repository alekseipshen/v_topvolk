  - q: "What does a full repiping cost in Wenatchee?"
    a: "A complete galvanized-to-PEX-A repiping in a typical Wenatchee bungalow or
      mid-century rancher runs $8,000–$18,000 depending on square footage, fixture
      count, and crawlspace access conditions. Homes that also need cast-iron drain
      replacement push the number higher — combined supply and drain replacement
      typically runs $15,000–$28,000. The City of Wenatchee permit fee for a
      repiping project is usually $200–$400. TopVolk provides a fixed-price quote
      after an on-site walkthrough — no vague ballpark ranges that expand after
      demo starts. Schedule a free on-site consultation at (206) 591-1096."

  - q: "Do plumbing projects in Wenatchee require a city permit?"
    a: "Yes — the City of Wenatchee Building Division requires permits for water
      heater replacements (including seismic strapping per WA code), full repipes,
      gas line modifications, and any new fixture rough-ins. Work on unincorporated
      parcels falls under Chelan County Community Development instead. Permit
      turnaround for residential plumbing in Wenatchee typically runs 1–2 weeks for
      straightforward work; gas or sewer projects can take 2–4 weeks. TopVolk
      Construction LLC is a WA Licensed Contractor and handles permit applications,
      plan submission, and inspection scheduling as part of every project — you do
      not navigate that process yourself."

  - q: "Can you handle water heater replacement with seismic strapping in Wenatchee?"
    a: "Washington State requires seismic strapping on all water heater installations
      per WAC 51-56 — both upper and lower straps anchored to blocking between studs,
      not just into drywall. A standard 50-gallon gas water heater swap — removing
      the old unit, installing a new Rheem or Bradford White with proper strapping,
      connecting gas and water lines, and pulling the City of Wenatchee permit —
      typically takes 3–4 hours and costs $800–$1,400 including the permit fee.
      Upgrading to a Rinnai or Navien tankless unit adds gas line and venting work;
      that full scope runs $3,500–$6,000 installed. Call (206) 591-1096 for a
      line-item quote."

