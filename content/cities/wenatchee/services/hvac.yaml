title: "Wenatchee HVAC — Heat Pumps & Cooling for High Desert Summers"

intro: |
  Apple country sits in a rain shadow east of the Cascades, and that geography
  creates a climate most Seattle-side contractors aren't prepared for: July and
  August in the Wenatchee Valley regularly hit 95-100°F, and December nights
  drop into the teens or single digits near the Columbia River benchland. A house
  with no cooling isn't just uncomfortable here — it's a health problem. That
  same temperature swing is also why Wenatchee is one of the better places in
  Washington to run a cold-climate heat pump: the dry summers let the refrigerant
  cycle run efficiently, and modern Mitsubishi Hyper Heat equipment handles
  heating down to -13°F without leaning on electric resistance strips. Vladislav
  Volkov at TopVolk Construction has installed and converted systems from the
  Sunnyslope neighborhood to the older blocks near Wenatchee Avenue, handling
  everything from ductless mini-split installs to full gas-to-heat-pump
  conversions. The Inflation Reduction Act changed the math on this work
  significantly — federal credits plus Chelan County PUD rebates can offset
  $3,000-4,000 off a typical project. Call (206) 591-1096 to talk through what
  makes sense for your specific house.

localContext: |
  The 98801 zip covers Wenatchee's older core — Craftsman bungalows and
  two-story farmhouses built during the orchard-boom years, roughly 1910-1945,
  when heating meant a coal or oil furnace later converted to gas. Those houses
  on the streets running north of Fifth Street and east toward Orondo Avenue
  typically have gravity-fed ductwork: oversized trunk lines in the basement, no
  return air in the bedrooms, and heating that pools at the ceiling while the
  floor stays cold. The original sheet metal hasn't been touched in decades and
  leaks conditioned air into unconditioned crawlspaces at rates that drive up
  utility bills year-round. Out in the 98802 zip — the East Wenatchee subdivisions
  climbing up the Columbia River bluff — you're looking at 1970s-90s forced-air
  systems with R-11 wall insulation and builder-grade equipment approaching or
  past its 20-year design life. Chelan County's climate zone 5 rating means any
  replacement equipment needs to be sized correctly for real winters, not just
  for the mild shoulder seasons — an undersized system that looks fine in October
  falls apart in January when overnight temps hit 10°F near Mission Ridge.

commonProblems:
  - title: "Gas Furnace to Heat Pump Conversion — Sizing for Wenatchee's Climate Zone 5"
    description: |
      Converting a gas furnace in Sunnyslope or the Squilchuck Road corridor
      means dealing with two things most quotes skip: duct sizing and the Chelan
      County PUD rebate paperwork. Gas systems supply air at 130-140°F; heat pumps
      run at 90-100°F, so the same ductwork that felt fine with the furnace will
      leave bedrooms cold when it's 18°F outside. Properly sizing a heat pump for
      climate zone 5 matters — an undersized unit short-cycles in August and runs
      continuous emergency heat all January. Mitsubishi's Hyper Heat MXZ series
      maintains rated heating capacity down to -13°F, which matters on the coldest
      Wenatchee nights. The IRA Section 25C credit covers up to $2,000 of equipment
      cost; Chelan County PUD adds $300-600 on top depending on system efficiency.
      Budget $9,000-16,000 installed depending on home size, duct condition, and
      whether the electrical panel needs a circuit upgrade for the new outdoor unit.

  - title: "Ductless Mini-Split Installation for Additions and ADUs"
    description: |
      Wenatchee has seen real ADU activity since WA HB 1337 passed in 2024, and a
      detached garage conversion or a new addition off the back of a 1960s ranch in
      East Wenatchee almost never has existing ductwork running to it. Ductless
      mini-splits are the practical solution — no ductwork to run, and the system
      handles both the 95°F July heat and the 15°F January nights from a single
      unit. Daikin's Aurora 9,000-12,000 BTU single-zone systems work well for
      spaces under 450 sq ft. For a full DADU or a multi-room addition, a
      Mitsubishi MXZ multi-zone outdoor unit can drive up to five indoor heads off
      one compressor. Refrigerant line sets get run through the wall framing during
      rough-in, with commissioning and refrigerant charge on the second day. Single-
      zone installs run $3,500-5,500; a full ADU with two or three heads typically
      lands at $7,000-11,000 installed. Chelan County PUD's heat pump rebate
      program covers mini-splits as well.

  - title: "Ductwork Leakage and Rebalancing in Older Wenatchee Homes"
    description: |
      Hot rooms in summer and cold bedrooms in winter are the most common complaint
      in Wenatchee's 1930s-1960s housing stock — specifically the 98801 zip with
      original galvanized trunk lines and poorly sealed boot connections. Sheet metal
      ductwork in unconditioned crawlspaces loses 20-30% of conditioned air before
      it reaches a register, which shows up as high Chelan County PUD bills and
      rooms that won't reach temperature no matter how long the system runs. Duct
      sealing with Aeroseal or hand-applied mastic compound — applied at every boot,
      elbow, and splitter box — typically cuts measured leakage from 30% down to
      under 5%. Rebalancing involves adjusting volume dampers, and in homes with
      original single-return layouts, sometimes adding a supplemental return air
      plenum to stop the system from starving for airflow. This work runs $800-2,500
      depending on crawlspace access and linear footage. Chelan County PUD Energy
      Services offers rebates for verified duct sealing by a WA Licensed Contractor.

  - title: "Adding Central AC to an Existing Forced-Air System"
    description: |
      Adding central air to an existing furnace sounds simple — just bolt on a coil
      and a condenser. The problem is that most 1970s and 80s forced-air furnaces in
      the 98802 zip were sized for heat only, with supply plenums and trunk lines
      that can't move enough CFM for a cooling coil without significant static
      pressure drop. A Manual J load calculation and a duct blower test should
      happen before any equipment gets quoted — skip those steps and you end up with
      a 3-ton condenser that trips the high-pressure limit because the duct system
      is too restrictive. If the existing ductwork passes, an A-coil gets mounted on
      the supply plenum above the furnace, refrigerant lines run to an outdoor Trane
      or Carrier condenser, and the system is typically commissioned in 2-3 days.
      For a 1,800 sq ft ranch in East Wenatchee, a correctly sized central AC
      addition runs $5,500-8,500 installed — electrical panel capacity and condenser
      pad location affect where that number lands.

  - title: "High-Efficiency Furnace Replacement With PVC Venting"
    description: |
      Gas furnaces installed in Wenatchee homes in the late 1990s and early 2000s —
      common throughout the neighborhoods north of Wenatchee Avenue and across East
      Wenatchee — run at 80% AFUE or below. That means 20 cents of every heating
      dollar goes straight up the flue. Replacing with a 96% AFUE unit like the
      Lennox EL296V or Carrier Infinity 96 closes that gap significantly. The
      installation change that surprises most homeowners is venting: high-efficiency
      condensing furnaces exhaust through Schedule 40 PVC pipe rather than the
      B-vent chimney connector on the old unit, so the existing flue gets abandoned
      and capped. That scope change — chimney liner removal plus new PVC combustion
      air and exhaust penetrations — needs to be in the quote upfront, not added as
      a change order. The IRA Section 25C credit covers up to $600 on qualifying
      high-efficiency gas equipment. Full replacement with PVC venting runs
      $3,800-6,500 depending on BTU output and how the venting routes through
      the structure.

faq:
  - q: "How fast can you get to Wenatchee for HVAC work?"
    a: |
      Wenatchee is about 2.5 hours from the Seattle Metro via US-2 over Stevens
      Pass or I-90 through Snoqualmie Pass. TopVolk schedules site visits to the
      Wenatchee Valley in clusters — typically Vladislav can be out to the
      98801-98802 area within 5-10 business days for an initial on-site estimate.
      You're meeting the person who manages the project, not a sales rep who hands
      you to a crew you've never spoken to. Install timelines once the project is
      scoped and permitted: a single mini-split takes 2 days; a full heat pump
      conversion with ductwork modifications runs 3-5 days. Call (206) 591-1096
      to get on the schedule.

  - q: "What does HVAC replacement or installation cost in Wenatchee?"
    a: |
      System type and home size drive the number more than anything else. A single-
      zone ductless mini-split (Mitsubishi or Daikin) runs $3,500-5,500 installed.
      Full heat pump conversion from gas — coil, condenser, refrigerant line sets,
      electrical circuit — typically runs $9,000-16,000 for a 1,500-2,200 sq ft
      home. Central AC addition on an existing furnace: $5,500-8,500 depending on
      duct condition and panel capacity. High-efficiency gas furnace replacement:
      $3,800-6,500. Chelan County PUD rebates and IRA federal tax credits can
      offset $1,500-4,000 depending on equipment type and household income. Every
      TopVolk quote is line-itemized — equipment, labor, permit fees, and any
      electrical work are listed separately. Call (206) 591-1096 for a free
      on-site estimate.

  - q: "Do you pull permits for HVAC work in Wenatchee, and what's required?"
    a: |
      Mechanical permits are required in Wenatchee for new system installations,
      equipment replacements that change fuel type or system configuration, and
      ductwork modifications. The City of Wenatchee Building Department handles
      permits for properties inside city limits — mechanical permit plan review
      typically runs 5-10 business days. For properties in unincorporated Chelan
      County outside city limits, permits go through the Chelan County Community
      Development Department instead. A straight like-for-like equipment swap
      (same fuel, same configuration) often doesn't require a permit, but it's
      worth confirming before assuming. TopVolk pulls all mechanical permits as
      the WA Licensed Contractor of record — you don't need to navigate the
      building department yourself. All work gets inspected and signed off before
      the project closes.

  - q: "Do cold-climate heat pumps actually work in Wenatchee winters?"
    a: |
      This is the right question to ask before buying anything. Standard heat pumps
      lose efficiency below 35°F, which is why older models had a rough reputation
      in places like Wenatchee that see real winters. Cold-climate heat pumps —
      specifically Mitsubishi's Hyper Heat H2i series and Daikin's Aurora line —
      are rated for full heating capacity down to 5°F and partial capacity down to
      -13°F. That covers the vast majority of Wenatchee winters without the electric
      resistance backup strips carrying the load. Correct sizing using a Manual J
      calculation for climate zone 5 is non-negotiable — rule-of-thumb BTU guesses
      leave systems undersized. A properly sized Hyper Heat system in a 1,600 sq ft
      Wenatchee home handles roughly 95% of annual heating hours on the compressor
      alone, with resistance backup running only on the coldest handful of nights.

  - q: "What warranty covers the HVAC equipment and the installation work?"
    a: |
      Equipment warranties depend on the brand and registration. Mitsubishi's
      Diamond contractor program covers 12 years on compressor and parts when
      installed by a registered dealer and registered within 60 days of install.
      Daikin's Comfort Pro program offers comparable 12-year parts coverage. Carrier
      and Lennox both run 10-year parts warranties with registration. TopVolk's
      workmanship warranty covers three years on the installation itself — if a
      refrigerant connection, electrical connection, or condensate drain fails in
      the first two years due to the install, it gets fixed at no charge. HVAC
      equipment in Wenatchee's climate should last 15-20 years with annual
      maintenance: filter changes every 1-3 months depending on season, coil
      cleaning annually, and refrigerant level checks every 3-5 years.

  - q: "Does TopVolk cover areas outside Wenatchee city limits?"
    a: |
      Yes — the broader Wenatchee Valley is fully within the service area, including
      East Wenatchee, Cashmere, Leavenworth, and Chelan city. Properties out toward
      Mission Ridge Road or along the Columbia River north of Wenatchee are handled
      the same way as in-city projects. For homeowners in Entiat or Manson, we
      batch site visits to the north county to keep scheduling efficient. Typical
      window from first call to on-site estimate is 5-10 business days; after
      contract signing, project start dates run 2-6 weeks out depending on
      equipment lead time (mini-split heads sometimes take 1-2 weeks to arrive)
      and permit timeline. Call (206) 591-1096 or schedule a free consultation
      to get the process started.