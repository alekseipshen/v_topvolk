title: "Wenatchee Garage Construction — Built for Columbia River Climate"

intro: |
  Freeze-thaw cycles hit Wenatchee concrete harder than anywhere west of the Cascades.
  Sitting at 860 feet where cold air funnels down the Columbia River corridor, the 98801
  zip code sees 20-30 temperature swings annually that crack an undersized, under-reinforced
  slab within three to five winters. The mid-century ranchers and older bungalows across
  South Wenatchee and up on the bench lots of Wenatchee Heights typically have single-car
  garages sized for a 1965 vehicle — no insulation, no vapor barrier, one 15-amp circuit
  if anything. TopVolk Construction, owner-operated by Vladislav Volkov and a WA Licensed
  Contractor since 2023, has handled new garage builds across Chelan County including
  detached structures near Pybus Public Market and two-story garage/DADU combinations
  on the rocky bench land above the Columbia River. WA HB 1337 changed the calculation
  for homeowners who want a living unit above a new garage, and the permit process through
  the City of Wenatchee Community Development is navigable when you know exactly what
  drawings they need. Call (206) 591-1096 to schedule a free on-site estimate.

localContext: |
  The 98801 zip covers the core of Wenatchee, where most residential lots were platted
  between the 1920s and 1970s. Original garages on those blocks — where they still stand —
  are typically detached single-car structures with minimal foundations, no insulation,
  and electrical service that predates modern code. Across the Columbia River in 98802 is
  East Wenatchee, which falls under Douglas County's permit jurisdiction rather than
  Chelan County's — so your project address determines which building department reviews
  your plans before a single footing gets dug. Inside Wenatchee city limits, applications
  go through City of Wenatchee Community Development; parcels outside the city go to
  Chelan County Community Development, with different setback rules and plan review
  timelines. FAR limits in R-1 zoning constrain how much total covered square footage
  a lot can carry, which becomes a real constraint when adding a two-story garage/DADU
  to a lot already holding a 1,600-square-foot house. The rocky basalt substrate common
  on the bench lots above Wenatchee Avenue also drives up excavation costs compared
  to the flatter river-bottom parcels closer to downtown.

commonProblems:
  - title: "Building a DADU Above a New Detached Garage Under WA HB 1337"
    description: |
      WA HB 1337, effective July 2023, allows most single-family lots in Washington to add
      up to two ADUs — including a detached ADU above a new garage — without a rezone or
      conditional use permit. In Wenatchee's R-1 zones, that means a homeowner can build a
      two-car garage with 400-600 square feet of living space above it and rent it or house
      family without going through a variance process. The structural demands are real: an
      LVL beam spanning the full garage bay to carry the upper-floor load, PSL posts at the
      bearing points, and R-49 insulation in the roof assembly to meet Washington State
      Energy Code. The floor/ceiling assembly between the garage and the living unit also
      needs both a vapor barrier and a fire separation per IRC Section R302. TopVolk handles
      the complete scope — structural framing, MEP coordination for plumbing and mechanical,
      and all permit filing with Wenatchee Community Development. From permit approval to
      final inspection, a combined garage and DADU structure typically takes 10-14 weeks.

  - title: "Concrete Slab Failures from Wenatchee's Freeze-Thaw Cycles"
    description: |
      A 4-inch unreinforced slab poured in a Wenatchee garage will crack — often within
      three winters. The Columbia River corridor sees aggressive temperature cycling, and any
      slab without fiber reinforcement and a properly compacted sub-base fails at the control
      joints before the decade is out. The correct spec is a minimum 4-inch fiber-reinforced
      concrete slab over 4 inches of compacted crushed gravel, with 6-mil poly vapor barrier
      underneath — non-negotiable for any garage being finished as a workshop or converted to
      living space. Slabs supporting a second-story DADU require a structural engineer to
      specify thickness and whether grade beams or continuous perimeter footings are needed.
      Wenatchee soil varies considerably: bench lots above Wenatchee Avenue often hit rocky
      basalt that drives up excavation costs, while lower lots near the Columbia can have
      sandy alluvial soils requiring more base prep work. Slab work on a standard 24x24
      garage typically runs $8,000-$14,000 here depending on substrate conditions and
      reinforcement spec.

  - title: "Permit Setbacks and Site Plan Requirements in Wenatchee"
    description: |
      The City of Wenatchee won't approve a garage permit without a site plan showing all
      existing structures, the proposed footprint, and setback dimensions from every property
      line. Standard R-1 residential zoning requires a 5-foot setback from side and rear
      property lines for accessory structures; the front setback is typically 20 feet or
      more depending on the lot. FAR calculations determine how much total covered square
      footage the lot can carry — on a smaller Wenatchee lot already holding a 1,800-square-foot
      house, adding a two-story garage/DADU can press right up against the limit.
      TopVolk Construction, a WA Licensed Contractor, prepares the site plan, calculates
      lot coverage, and handles the full permit submission with Wenatchee Community
      Development. Plan review for a new accessory structure runs 4-8 weeks currently.
      Applications missing the site plan or structural drawings get kicked back, adding
      2-3 weeks to the start date — so getting the submission package right the first
      time matters more than moving fast on a flawed submittal.

  - title: "What a New Garage Actually Costs to Build in Wenatchee"
    description: |
      A basic 24x24 detached garage — fiber-reinforced slab, stick-framed walls, pre-engineered
      roof trusses, one insulated garage door, and a 100-amp subpanel — runs $45,000-$65,000
      completed in the Wenatchee area. Add a DADU above and the total climbs to
      $110,000-$160,000 depending on finish level, whether full plumbing is included, and
      the mechanical system choice. Rocky excavation on the bench lots near Wenatchee Heights
      can add $3,000-$8,000 before a single wall goes up. An insulated Clopay or Wayne Dalton
      garage door with cold-climate weatherstripping adds $1,800-$3,500 over a standard door.
      EV charger circuit pre-wire — a 50-amp conduit stub-out during framing — costs
      $400-$700 at rough-in versus $1,200-$2,000 to retrofit through finished walls later.
      TopVolk provides a written line-item quote after the on-site visit. No allowances that
      expand post-contract, no vague ranges — a real number with the scope clearly defined
      before anything gets signed.

  - title: "Insulation, EV Pre-Wire, and Workshop Setup During New Construction"
    description: |
      The cheapest time to run a 50-amp or 60-amp EV charger circuit is during framing,
      before the drywall goes up. In a new Wenatchee garage build, that means conduit from
      the main panel to the parking position of your choice — sized for a Tesla Model Y,
      Ford F-150 Lightning, or Rivian R1T — stubbed out and waiting for the charger when
      you're ready. Same logic applies to insulation: a garage workshop in Wenatchee's
      climate needs at least R-15 in the walls and R-38 in the ceiling to stay above
      freezing on January mornings without running heat nonstop. A Mitsubishi mini-split
      handles both winter heating and summer cooling efficiently in a finished garage.
      For garage doors, a steel insulated door with polyurethane foam core — R-12 to R-18
      rating — paired with quality weatherstripping stops thermal cycling from working the
      slab edge and keeps the space usable year-round. These upgrades add roughly 15-20%
      to the base build cost but pay back quickly in comfort and reduced utility bills.

faq:
  - q: "How fast can you get to Wenatchee for a garage project?"
    a: |
      TopVolk Construction is based in the Seattle metro, and Wenatchee is roughly 2.5 hours
      east via US-2 over Stevens Pass — or about the same time via I-90 to US-97 north,
      depending on pass conditions. Vladislav schedules Chelan County site visits in clusters
      to keep the logistics efficient. From initial call to on-site estimate is typically
      5-7 days. From signed contract to permit submission, plan on 1-2 weeks for drawings
      and the site plan package. If you're still in the early stages and just want to understand
      what a new garage or garage/DADU should actually cost on your specific lot, that first
      visit is free — a site walk with the person managing the build, not a salesperson running
      numbers off a price sheet. Call (206) 591-1096 to get on the calendar.

  - q: "What does a new detached garage cost to build in Wenatchee?"
    a: |
      A standard 24x24 two-car garage — fiber-reinforced slab, framed walls, pre-engineered
      trusses, one insulated door, and a 100-amp subpanel — runs $45,000-$65,000 in the
      Wenatchee market. Adding a DADU living unit above pushes the total to $110,000-$160,000
      depending on finish level, plumbing scope, and mechanical system. Rocky basalt substrate
      on the bench lots near Wenatchee Heights can add $3,000-$8,000 in excavation before the
      framing crew even shows up. EV charger conduit pre-wire at rough-in adds $400-$700.
      TopVolk provides a written line-item quote after the on-site visit — not a range with
      conditions — reflecting your actual lot, soil, and scope. Call (206) 591-1096 or
      request a free on-site consultation to get a real number.

  - q: "Do you need a permit to build a garage in Wenatchee, and how long does it take?"
    a: |
      Any new detached or attached garage within Wenatchee city limits requires a permit through
      the City of Wenatchee Community Development department. You'll need a site plan, floor plan,
      and elevation drawings at minimum; a DADU above the garage requires a concurrent ADU permit
      application filed at the same time. Plan review for a standard accessory structure runs 4-8
      weeks currently. For parcels outside city limits, Chelan County Community Development is the
      AHJ and runs a separate submission process with its own timelines. TopVolk Construction, a WA
      Licensed Contractor, prepares all permit documentation — site plan, structural drawings, energy
      code compliance forms — and manages the submission. Homeowners don't navigate the portal or
      counter appointments on their own; we handle the paperwork and update you when approvals come
      through.

  - q: "Can you pre-wire the garage for an EV charger during construction?"
    a: |
      During framing is exactly the right time. TopVolk runs a 50-amp or 60-amp circuit from the
      main panel to the garage in conduit, with a junction box or outlet stubbed out at the parking
      position before drywall closes everything in. That covers a Level 2 charger for any EV on
      the market — Tesla Model Y, Ford F-150 Lightning, Chevy Silverado EV, or whatever you're
      planning to drive. Cost at rough-in is $400-$700. Retrofitting through finished walls later
      runs $1,200-$2,000 and leaves patch work behind. A 240V circuit for a welder or air compressor
      can go in the same rough-in pull if you're setting up a workshop space. All electrical
      coordinates with a licensed electrician for rough-in and final inspection sign-off per the
      City of Wenatchee's permit requirements.

  - q: "What warranty does TopVolk provide on a new garage build?"
    a: |
      Every TopVolk project carries a 1-year workmanship warranty on the build — framing, slab,
      roofing, and finish work. If something fails due to how it was constructed in that first year,
      we come back and make it right. Manufacturer warranties run separately on components:
      CertainTeed architectural shingles carry a 30-year limited manufacturer warranty, insulated
      Clopay garage doors carry a limited lifetime warranty on steel panels, and slab durability
      ties directly to proper installation spec — which we document in the project file. Vladislav's
      name is on every project, so there's no confusion about who to contact if something comes up.
      For a $50,000-$160,000 structure, the warranty conversation should happen before the contract
      is signed — and we're straightforward about exactly what's covered and what's not.

  - q: "Do you serve East Wenatchee, Leavenworth, and other nearby areas?"
    a: |
      TopVolk serves projects across Chelan County including Wenatchee, Leavenworth, Cashmere,
      and Chelan. East Wenatchee is Douglas County — a separate permit jurisdiction through Douglas
      County Building Department — but we've handled projects there and know the submission process.
      Leavenworth has its own layer: structures near the downtown core must conform to Bavarian
      theme design guidelines in the overlay zone, so we verify those requirements before finalizing
      exterior details on any project close to the commercial district. Scheduling for Chelan County
      typically means batching site visits on the same trip east, so the window from first call to
      on-site estimate is usually 5-10 days. Call (206) 591-1096 to discuss your project location
      and get a realistic timeline for the estimate visit.