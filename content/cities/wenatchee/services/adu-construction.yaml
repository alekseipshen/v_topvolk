title: "Wenatchee ADU Construction — Add a Rental Unit to Your Chelan County Lot"

intro: |
  Apple-country lots in Sunnyslope and the older residential blocks near Wenatchee Confluence
  State Park have been single-family for decades — but WA HB 1337, signed into law in 2024,
  changed what's legally possible on those parcels statewide. Every single-family lot in
  Wenatchee now qualifies for up to two ADUs: a detached backyard cottage (DADU), an attached
  addition, or a basement conversion. For a homeowner sitting on a 7,000-square-foot lot in
  98801 with an aging detached garage or an underused side yard, that's a genuine rental income
  opportunity in a market running tight on workforce housing. A 600-square-foot DADU with a
  Mitsubishi cold-climate mini-split and Navien tankless water heater — sized for Wenatchee's
  hard winters — typically runs $130K-$185K depending on utility separation scope and site
  grading. TopVolk Construction, owner-operated by Vladislav Volkov (WA Licensed Contractor),
  has completed 100+ projects across the Seattle metro since 2017. We handle the full scope:
  City of Wenatchee permit drawings, foundation work, framing, MEP coordination, and finish
  work. Call (206) 591-1096 to get a site-specific assessment before you commit to a design
  direction.

localContext: |
  Older residential lots in 98801 — particularly the craftsman-era and mid-century blocks
  between Mission Street and Orchard Avenue — run 6,000-9,000 square feet, enough for a DADU
  under current City of Wenatchee setback rules. Typical requirements: 5-foot side and rear
  setbacks for detached structures, plus lot coverage limits that vary by zoning district.
  Lots in 98802, across the Columbia River in East Wenatchee, fall under the City of East
  Wenatchee or Douglas County jurisdiction — different permit authority, different fee schedule,
  different plan review timelines. Wenatchee's climate is nothing like Seattle's: winter
  temperatures drop to single digits on cold snaps, and freeze-thaw cycles through March
  affect foundation design and concrete pour scheduling in ways a west-side contractor won't
  anticipate. The older housing stock here — primarily 1930s through 1960s construction —
  also means existing panels, water meters, and sewer laterals may need capacity evaluation
  before a second unit can legally connect. That scoping happens in the design phase, not
  mid-build.

commonProblems:
  - title: "DADU Setbacks and Lot Coverage Rules on Wenatchee's Older Urban Lots"
    description: |
      City of Wenatchee allows DADUs up to 24 feet in height, but setback rules catch
      homeowners off guard on the older 50-foot-wide lots that dominate 98801. After 5-foot
      side setbacks on both sides, your buildable width shrinks to 40 feet — less once you
      factor existing structures. Going two-story to maximize usable square footage is often
      the right call, which means LVL beam work at the ridge, engineered floor joists, and a
      stair layout that fits the height envelope without eating into the living area. Lot
      coverage limits — total footprint of house plus all structures as a percentage of lot
      area — vary by zoning district and must be confirmed before plan submission. We pull
      the lot survey and zoning designation on the first site visit so there are no surprises
      at plan check. The City of Wenatchee Building Division typically runs 6-10 weeks on
      ADU plan review, so getting the design right before submission is what keeps the
      schedule on track.

  - title: "Utility Separation — Shared vs. Independent Connections for Your ADU"
    description: |
      Utility separation is one of the first decisions to lock in on any ADU project. A shared
      connection keeps the DADU on the same water and sewer lateral as the main house — lower
      upfront cost, but limited tenant billing clarity and less flexibility if you want to sell
      the unit separately later. A separate water meter means coordinating with the City of
      Wenatchee Public Works and Chelan County PUD — two entities, two application tracks, two
      timelines running in parallel. Older sewer laterals in 98801 neighborhoods can be
      undersized or cracked clay pipe; a camera inspection costs $300-$500 and is worth every
      dollar before you finalize utility design. Electrical separation — a new 200-amp panel
      to the DADU with its own Chelan County PUD meter — adds $8K-$14K to project cost but
      gives you clean billing separation and keeps owner and tenant usage fully independent.
      Every one of those line items shows up in your written quote.

  - title: "Cold-Climate Insulation and Foundation Requirements for Wenatchee DADUs"
    description: |
      West-side contractors sometimes underspec insulation for Wenatchee's climate, and that
      mistake shows up in January utility bills and rough-in inspection failures. Design
      temperatures here hit 0°F or lower; heating degree days are dramatically higher than
      Seattle's; and IRC cold-climate envelope requirements for wall and ceiling assemblies are
      more demanding than a typical King County permit jurisdiction would require. DADU ceiling
      insulation should hit R-49 minimum. Wall cavities need R-21 with continuous exterior
      insulation added where possible. Any slab-on-grade construction requires sub-slab XPS
      foam to prevent heat loss into frozen ground — a detail that gets skipped and then fails
      inspection or causes comfort complaints through the winter. A Mitsubishi Hyper Heat
      mini-split (MXZ cold-climate series) handles heating and cooling efficiently through
      Wenatchee's sub-zero nights. Navien or Rinnai tankless units handle domestic hot water
      for a 600-square-foot ADU without the standby loss of a tank.

  - title: "What Drives ADU Construction Costs in the Wenatchee Area"
    description: |
      A 600-square-foot DADU in Wenatchee — permitted, framed, insulated to cold-climate
      code, and finished — typically runs $130K-$185K. Site conditions move the number fast:
      a sloped lot requires grading and possibly a retaining wall or stepped foundation, which
      adds $15K-$30K before the first framing board goes up. Utility work — new electrical
      service, water tap, sewer stub — averages $12K-$20K. Finish level matters considerably:
      a functional ADU with LVL beam framing, standard drywall hang/tape/mud, laminate
      flooring, and mid-range Bosch or GE appliances lands at the lower end of the range.
      Upgrade to quartz countertops, large-format porcelain tile, and semi-custom cabinets
      and you move toward the top. TopVolk provides line-item pricing after an on-site visit —
      not vague ballparks over the phone. Deadline milestones are written into the contract,
      with penalties paid by us for missed dates. Call (206) 591-1096 to schedule.

  - title: "DADU vs. Attached ADU vs. Basement Conversion — Choosing the Right Path"
    description: |
      WA HB 1337 allows up to two ADUs per single-family lot, so combining an attached unit
      (AADU) with a detached backyard cottage (DADU) is possible if your lot and budget
      support both. The right choice depends on lot configuration, existing structure condition,
      and how much physical separation from tenants matters to you day-to-day. Basement
      conversions in Wenatchee's older 1940s-1960s housing stock often require DriCore
      subfloor panels over the concrete slab to manage cold-season moisture, plus egress
      windows cut into foundation walls to satisfy IRC minimum requirements — that scope runs
      $50K-$90K depending on bathroom additions and ceiling height. An attached addition
      triggers different design review steps than a standalone DADU. A detached cottage gives
      you the clearest separation, both physically and on the rental market. The certificate
      of occupancy sign-off from the City of Wenatchee Building Division is what makes any
      unit legally rentable — we coordinate that from start to finish.

faq:
  - q: "How fast can you get to Wenatchee for an ADU consultation?"
    a: |
      TopVolk is based in the Seattle area — Wenatchee is roughly a 2.5-hour drive via US-2
      over Stevens Pass. We schedule Chelan County site visits on set days to keep travel
      efficient and avoid making you wait three weeks for an opening. The on-site consultation
      runs 45-60 minutes: we walk the lot, check utility access points, confirm setbacks, and
      talk through your project goals. A written line-item estimate follows within a week of
      the visit. Call (206) 591-1096 to get on the schedule — properties in 98801 and 98802
      can typically be reached within 10-14 days of your call.

  - q: "What does ADU construction cost in Wenatchee?"
    a: |
      A 600-square-foot DADU — permitted, cold-climate insulated, and finished — typically
      runs $130K-$185K in the Wenatchee area. Basement conversions and attached ADU work
      start lower, around $55K-$90K, depending on how much existing structure can be reused.
      Lot slope, utility separation scope, finish level, and whether a new Chelan County PUD
      electrical meter is needed are the main cost variables. TopVolk provides a detailed
      line-item quote after an on-site visit — Vladislav Volkov handles the estimate
      personally, no commissioned closer involved. Schedule a free on-site consultation by
      calling (206) 591-1096.

  - q: "What permits does an ADU require in Wenatchee, and how long does the process take?"
    a: |
      Properties within City of Wenatchee limits — most of 98801 — go through the City of
      Wenatchee Building Division. Plan review for a new DADU typically takes 6-10 weeks from
      submission; attached ADU projects working within an existing footprint can move faster.
      Unincorporated Chelan County parcels go through the Chelan County Community Development
      Department, with its own fee schedule and timeline. TopVolk prepares permit drawings,
      structural calculations, and energy code compliance documentation as part of the project
      scope — as a WA Licensed Contractor, we coordinate rough-in inspections and final
      inspection sign-off directly with the jurisdiction. You get a blue tape walkthrough
      before we close any walls so nothing gets buried without your approval.

  - q: "Can my DADU have its own utility meters and a separate address?"
    a: |
      Yes — and for most rental situations, separate meters are the practical choice. A
      dedicated 200-amp panel with its own Chelan County PUD meter means your tenant pays
      their own electric bill directly, no landlord billing involved. A separate water service
      requires a new tap coordinated with the City of Wenatchee Public Works, typically adding
      $6K-$12K depending on main line proximity. Separate sewer lateral work depends on
      existing lateral capacity — sometimes required, sometimes optional. Separate address
      assignment for mail and 911 access is handled through the City addressing office; we
      include that coordination in the final inspection package so the unit is fully functional
      on the day it's approved.

  - q: "How long does an ADU take to build in Wenatchee, and how do you handle the schedule?"
    a: |
      A standard 600-square-foot DADU runs 4-7 months from permit submission to certificate
      of occupancy — roughly 6-10 weeks of active construction once permits clear. The City
      of Wenatchee Building Division's plan review period (typically 6-10 weeks) is usually
      the longest wait in the sequence. Basement conversions and attached ADU remodels run
      8-14 weeks of active construction depending on scope. Timeline milestones are written
      into the TopVolk contract with penalties paid by us for missed dates — that accountability
      is in the agreement, not just discussed verbally. Vladislav manages the schedule directly.
      Call (206) 591-1096 to get a realistic timeline scoped to your specific project.

  - q: "Do you build ADUs in East Wenatchee, Cashmere, or Leavenworth?"
    a: |
      Yes — TopVolk serves the full greater Wenatchee area: East Wenatchee (Douglas County),
      Cashmere, Leavenworth, and unincorporated Chelan County parcels. East Wenatchee has its
      own building jurisdiction through the City of East Wenatchee; unincorporated Douglas
      County parcels go through Douglas County Community Development. Cashmere and Leavenworth
      each have separate municipal building departments with their own permit timelines and fee
      structures. We handle permit coordination across all of these jurisdictions as part of
      the project scope. Wenatchee-area site visits are grouped on set days to keep scheduling
      efficient. Call (206) 591-1096 for a free on-site consultation anywhere in the area.