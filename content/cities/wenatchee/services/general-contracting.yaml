title: "Wenatchee General Contracting — Permits, Trades & Budget Control"

intro: |
  Apple-industry growth in the 1930s and 1940s shaped what Wenatchee's housing stock looks like today — and plenty of those original builds in the Orondo Avenue corridor and the Sunnyslope neighborhood are overdue for serious renovation work. Ninety-year-old framing, galvanized supply lines, and knob-and-tube wiring show up routinely once demo starts. Coordinating framing, plumbing, electrical, and mechanical trades through City of Wenatchee Building Division permits takes a general contractor who runs the whole sequence — not a homeowner juggling four separate subcontractors by text message. TopVolk Construction LLC, owner-operated by Vladislav Volkov, has completed 100+ projects across the Seattle metro since 2023 and brings the same permit management, trade sequencing, and line-item pricing to projects on the east slope of the Cascades. Every project gets a written schedule, direct communication with Vladislav, and deadline penalties in the contract — not verbal assurances.

localContext: |
  Most of the older housing in the 98801 zip code falls into two eras: 1930s-1950s orchard-era homes with post-and-pier foundations and original plaster walls, and 1960s-1970s ranch-style houses that got through several decades on builder-grade fixtures and minimal upkeep. Both share the same renovation problem — the bones are usually fine, but the systems need full replacement to meet current IRC standards. Wenatchee's climate compounds this. Unlike the rain-heavy west side, the 98801 area runs through real winter freeze-thaw cycles that crack concrete flatwork and shift slab-on-grade foundations over time. Summers are dry and hot; that thermal swing stresses older wood framing differently than the mild, damp conditions on the other side of Stevens Pass. City of Wenatchee Building Division handles permit applications within city limits; work in unincorporated Chelan County goes through Chelan County Community Development instead. Knowing which jurisdiction covers your parcel before submitting the application saves three to five weeks of back-and-forth.

commonProblems:
  - title: "Trade Scheduling Collapses Without One Person Owning the Sequence"
    description: |
      The mechanical sequence on any whole-house renovation is unforgiving: framing before rough-in electrical, plumbing rough-in before insulation, drywall hang only after rough-in inspection sign-off. Miss one inspection and the next trade can't start. City of Wenatchee Building Division schedules inspections on a fixed calendar — not same-day callbacks. Homeowners managing framing crews, a plumber, and an electrician independently routinely absorb 2-4 week delays from scheduling gaps alone. A general contractor sequences the work, holds subs to the calendar, and owns the inspection timeline start to finish. On a KitchenAid kitchen remodel with full MEP coordination — mechanical, electrical, plumbing — that accountability difference can mean finishing in 8 weeks versus dragging past 5 months. TopVolk's contracts include written deadline penalties. That's not a talking point; it's a line in the agreement Vladislav signs.

  - title: "Demo Reveals Structural Conditions That Blow Past Budget Without a Plan"
    description: |
      The wall you're planning to open in a 1940s Wenatchee Craftsman almost always has something unexpected inside — sometimes it's load-bearing where the original plans say partition, sometimes it's galvanized drain lines packed with 80 years of mineral scale, sometimes it's vermiculite insulation in the attic that flags for asbestos testing before work can continue. These aren't rare exceptions; they're typical in orchard-era housing across the 98801 zip. The difference between a project that absorbs those surprises at $8K-$15K and one that blows $40K past budget is whether there's a written contingency budget and a GC who knows what an LVL beam replacement or a sister joist repair actually costs before swinging the first demo bar. Vladislav walks every demo scope before work starts and flags likely risk areas in the written estimate.

  - title: "Incomplete Permit Packages Add Weeks Before Work Even Starts"
    description: |
      City of Wenatchee Building Division requires complete permit packages for any work beyond cosmetic changes — full-house remodels, kitchen relocations, ADU conversions, and structural changes all need engineered drawings, site plans, and energy compliance documentation. Chelan County Community Development adds their own checklist for unincorporated parcels outside city limits. Submitting an incomplete package adds 2-6 weeks to your plan review timeline before a single subcontractor can schedule. As a WA Licensed Contractor, TopVolk handles the complete application: site plan, structural drawings, energy code compliance forms, and AHJ coordination. We pull permits in our name and manage both the rough-in inspection and final inspection scheduling. On a major Wenatchee renovation permit, expect plan review to run 4-8 weeks — we factor that lead time into the project schedule from the first site visit, not as a surprise after you've already given notice to your contractor.

  - title: "ADU Conversions Under WA HB 1337 Are More Involved Than the Headlines Suggest"
    description: |
      WA HB 1337, effective 2024, allows up to two ADUs per single-family lot statewide — one attached AADU and one detached DADU. In Wenatchee, that's opened up a steady stream of garage conversions and backyard studio builds, particularly in established neighborhoods near the Columbia River where lot sizes support the addition. The permit pathway for a DADU in Chelan County involves setback verification, lot coverage calculations, FAR analysis, separate utility connection review, and structural design accounting for Wenatchee's snow load requirements. A garage conversion AADU typically runs $85K-$140K fully permitted and finished. A new DADU ground-up runs $140K-$200K+. We've guided clients through both paths. Vladislav does the site walk personally — you're not handed off to a sales coordinator who's never pulled a permit or read a setback table.

  - title: "Estimate Ranges Tell You Nothing — Line-Item Quotes Tell You Everything"
    description: |
      The standard GC problem: you're handed a "kitchen remodel runs $40K-$120K" range that's functionally useless for planning. Real pricing on a Wenatchee kitchen turns on specifics — moving the sink (new drain rough-in adds $2K-$4K), upgrading from a 200-amp panel ($3K-$6K), switching from a Whirlpool or GE gas range to induction (new dedicated circuit, $800-$1,200 in wiring), and whether you're building out with semi-custom cabinets or IKEA boxes with custom doors. Every decision shifts the number. TopVolk provides line-item quotes after an on-site walkthrough — not ranges. For a full kitchen gut-and-rebuild with semi-custom cabinets, Bosch dishwasher, induction range, and large-format porcelain tile, a realistic Wenatchee number is $65K-$95K permitted and complete. You get an itemized sheet, not a handshake number.

faq:
  - q: "Does TopVolk Construction travel to Wenatchee for general contracting projects?"
    a: |
      Wenatchee is about 2.5 hours from our Seattle base — US-2 over Stevens Pass in the warmer months, or I-90 to US-97 through Ellensburg year-round. For projects in the $80K+ range, we schedule a free on-site consultation and walk the full scope before putting together a quote. Smaller scopes under $50K are evaluated case by case depending on project type and timeline. Call (206) 591-1096 to discuss your project directly — Vladislav picks up, not a scheduling assistant. We'll tell you plainly whether the scope fits or not.

  - q: "What does a whole-house renovation in Wenatchee cost?"
    a: |
      Real ranges from completed work: full kitchen gut-and-rebuild with structural unchanged, $60K-$95K; primary bath with curbless shower, bench, and tile work, $28K-$55K; whole-house renovation on a 1,800 sq ft Craftsman including new MEP and two baths, $140K-$220K; DADU backyard studio fully permitted and finished, $140K-$200K+. What moves those numbers: load-bearing walls needing LVL beam work, electrical panel upgrades, galvanized plumbing replacement, and permit timeline. Call (206) 591-1096 for a free on-site walkthrough. You'll get a line-item quote after the visit — no guessing, no vague ranges, no surprises after you've signed.

  - q: "What permits does Wenatchee require for a major home remodel?"
    a: |
      Any structural change, kitchen or bath relocation, ADU conversion, or whole-house renovation requires a building permit. Properties inside city limits go through City of Wenatchee Building Division; parcels in unincorporated Chelan County go through Chelan County Community Development. Either way, the submission needs site plans, structural drawings for load-bearing changes, and an energy code compliance report for new conditioned space. Plan review currently runs 4-8 weeks for most major remodel submissions. As a WA Licensed Contractor, TopVolk prepares and submits the full permit package — you don't navigate the building portal yourself. Rough-in inspection scheduling and final inspection coordination are on us.

  - q: "Who manages the individual subcontractors on a multi-trade project?"
    a: |
      That's the core of what a general contractor does — and the work that unravels fastest when homeowners try to run it themselves. We hold subcontractor agreements with framing crews, licensed electricians, plumbers, HVAC subs, and finish carpenters. Vladislav sets the schedule, sequences rough-in work to clear inspections in the right order, and is present for the blue tape walkthrough and punch list before final payment. One person to call. No project manager layers or account coordinators in between. TopVolk has coordinated MEP sequencing on projects across King, Snohomish, and Chelan County since 2023 — the permit process and inspection cadence in each jurisdiction run differently, and knowing those differences prevents the delays that eat contingency budgets.

  - q: "How long does a major renovation in Wenatchee take from start to finish?"
    a: |
      Permit lead time is the longest single variable. Budget 4-8 weeks from submission to permit approval on a major remodel in Wenatchee. After permits are in hand: primary bath remodels typically run 4-6 weeks of construction; full kitchen gut-and-rebuilds run 7-10 weeks; whole-house renovations on 1,600-2,000 sq ft homes with new MEP run 4-6 months of construction after permit approval. DADU and AADU projects typically run 5-7 months end-to-end including the permit phase. All of those timelines go into the contract with written milestones. Deadline penalties for delays on our end are in the agreement — not a verbal commitment Vladislav makes at the initial walkthrough.

  - q: "Do you also serve East Wenatchee, Chelan, and Leavenworth?"
    a: |
      Yes — East Wenatchee (98802), Chelan, and Leavenworth are areas we reach for the right project scope. One detail worth knowing: East Wenatchee sits in Douglas County, so permit jurisdiction there falls under Douglas County Community Development — separate from City of Wenatchee Building Division and Chelan County Community Development. Leavenworth permit authority depends on whether the parcel is inside city limits or unincorporated Chelan County. Those distinctions matter for timeline planning. Call (206) 591-1096 to talk through your specific address and project scope. Vladislav handles the initial conversation directly and can tell you immediately which permit pathway applies.