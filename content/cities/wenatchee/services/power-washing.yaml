title: "Wenatchee Power Washing — Hard Water Scale & Orchard Dust Removal"

intro: |
  Orchard country leaves its mark on every exterior surface. Across the Sunnyslope
  neighborhood and the residential blocks east of Mission Street in 98801, apple pollen,
  dust from the valley floor, and waxy residue from dormant oil sprays coat concrete
  driveways and fiber-cement siding each spring — then cure in place through Wenatchee's
  90-degree July heat. Columbia River water here runs 180-220 ppm hardness, roughly three
  times what you'd measure in Seattle, so hosing a surface down only spreads white calcium
  scale rather than removing it. By the time homeowners schedule an exterior repaint or a
  deck refinish, that buildup has been accumulating for two or three seasons. Up near Pybus
  Public Market, newer mixed-use construction and older commercial-adjacent housing deal
  with the same valley dust and hard water combination. Vladislav Volkov at TopVolk
  Construction has handled exterior surface prep on 100+ projects since 2023 across Chelan,
  King, Snohomish, and Pierce counties — east-side jobs consistently need a different
  chemical approach than the moss-heavy work you'd do in Ballard or Wallingford. Call
  (206) 591-1096 to schedule a free on-site look before your repaint crew shows up.

localContext: |
  Wenatchee's housing stock splits along two eras and two zip codes. The older core —
  98801, covering downtown, the blocks around Wenatchee Valley College, and the hillside
  approaches to Sunnyslope — has 1920s-1940s craftsman bungalows and postwar ranchers
  sitting on poured concrete flatwork that's been through 70-plus annual freeze-thaw
  cycles. That concrete is porous enough to absorb irrigation mineral deposits and orchard
  spray residue into the slab surface rather than leaving it topical. In 98802, the
  subdivisions on the Wenatchee Heights bench have textured brushed-aggregate driveways
  and composite deck surfaces that respond very differently to pressure — the wrong PSI
  on brushed aggregate tears out the surface layer and creates new spalling entry points.
  Chelan County doesn't require a building permit for exterior washing, but HOA-governed
  subdivisions restrict chemical discharge to storm drains, which limits which cleaning
  agents can be used on-site. East-of-the-Cascades surface prep also runs on a tighter
  schedule than west-side work — low humidity here means washed siding needs primer within
  24-48 hours before UV oxidation restarts on the bare substrate.

commonProblems:
  - title: "Calcium and Hard Water Scale on Concrete Driveways and Walkways"
    description: |
      Columbia Basin water averages 180-220 ppm calcium carbonate hardness — irrigation
      systems and downspout runoff leave white mineral rings on concrete that deepen each
      season they're left untreated. Standard pressure washing at 3,000 PSI doesn't remove
      scale; it smears it into a thin haze. The correct approach is an acid-based dwell
      treatment: F9 BARC (Before & After Restoration Cleaner) applied at 1:10 dilution,
      allowed to dwell 5-7 minutes, then rinsed with a surface cleaner attachment running
      1,800-2,500 PSI at a controlled 6-inch standoff from the surface. On flatwork older
      than 20 years in 98801, efflorescence from the slab itself compounds the problem —
      calcium is migrating up from below, not just arriving from irrigation spray. Two-pass
      rinsing with a sodium bicarbonate neutralizer afterward prevents acid residue from
      continuing to etch. Budget $0.10-$0.20 per square foot added to the base wash cost
      for acid treatment on heavily scaled concrete; a standard two-car driveway runs
      $300-$550 total depending on scale severity and slab age.

  - title: "Wildfire Smoke and Ash Residue on Siding Before Exterior Repaint"
    description: |
      Eastern Washington smoke seasons have been severe — 2020, 2021, and 2023 each
      brought weeks of AQI 200+ days to the Wenatchee Valley. Smoke particles embed in
      porous siding surfaces, particularly raw wood trim, stucco, and fiber-cement panels.
      Repainting over smoke-contaminated substrate without washing first means ash acts as
      a release agent between the siding and primer — adhesion failure shows up within two
      seasons, typically starting at horizontal surfaces where particle concentration is
      highest. A two-step soft wash addresses it: downstream injection of a 1.5% sodium
      hypochlorite solution with a low-VOC surfactant at 200-400 PSI, dwell time of 10-12
      minutes, then rinse at 800-1,200 PSI using a 40-degree nozzle. On Hardie fiber-cement
      siding — common on 2000s construction throughout 98801 — James Hardie's own cleaning
      spec limits pressure to 1,500 PSI maximum with 18-inch standoff distance. Exceeding
      that chips the panel face and voids warranty coverage. Done correctly, primer bonds
      to clean substrate and the paint system runs its full expected 8-12 year lifespan.

  - title: "Cedar Deck Surface Prep Before Staining — Even in a Drier Climate"
    description: |
      North-facing decks in Wenatchee still develop mildew despite the semi-arid climate.
      Irrigation systems run through summer, and shaded decks on the Sunnyslope hillside
      stay damp from morning dew and yard watering even when afternoon temperatures hit
      95°F. Cedar's natural tannins repel moisture initially, but once surface graying
      begins — typically 18-24 months after the last penetrating stain — water enters the
      grain and mildew follows. Stripping weathered finish requires a sodium
      percarbonate-based wood cleaner like Armstrong Clark Deck Cleaner applied at 2,000
      PSI with a wide-fan nozzle tip to open the grain without raising fiber. The deck
      must read below 15% moisture on a pin-type meter before any penetrating oil or
      semi-transparent stain is applied — skipping that check is the main reason deck
      finishes fail at two years instead of five. In Wenatchee's low-humidity conditions,
      drying time between wash and stain runs 48-72 hours, considerably faster than the
      4-7 days you'd wait on the wet side of the Cascades. Deck wash-and-prep on a
      standard 300-400 sq ft deck runs $250-$450 depending on board condition.

  - title: "Freeze-Thaw Spalling on Older Concrete Flatwork in 98801"
    description: |
      Wenatchee's temperature range does real damage to concrete. January lows average
      around 23°F, July highs hit 95°F, and driveways in older 98801 neighborhoods have
      been through 70-plus annual expansion and contraction cycles. Flatwork that's had
      ice melt or road salt applied accelerates spalling — the surface layer pops off in
      flakes, exposing aggregate below and creating rough pockets that trap dust and hold
      standing water. Cleaning spalled concrete requires a gentler approach than intact
      flatwork: 1,500-2,000 PSI maximum, 25-degree nozzle tip, no rotary surface cleaner
      (which concentrates pressure in a tight footprint and can undercut loose aggregate
      further). After cleaning, applying a penetrating silane-siloxane sealer — Ghostshield
      Lithi-Tek 4500 is one well-tested product — reduces water absorption by 75-90%,
      slowing future freeze-thaw damage substantially. Wash plus single-coat sealer on a
      400 sq ft two-car driveway typically runs $450-$700 depending on surface condition.
      Skipping the sealer after cleaning is a short-term save that costs more at the next
      cycle.

  - title: "Stucco and Hardie Siding Cleaning Before Exterior Repaint"
    description: |
      A significant portion of 1980s-2000s construction in Wenatchee Heights used painted
      stucco exteriors — textured and porous enough to trap valley dust and UV-oxidized
      paint chalking deep in the surface profile. Cleaning stucco at too-high PSI blows
      surface aggregate out of the finish matrix and creates pinholes where water enters
      behind the coat. Correct technique is soft-washing: downstream injection at 200-400
      PSI with a 15-degree fan nozzle held 18-24 inches from the wall, sodium hypochlorite
      solution with a cling surfactant to hold on vertical surfaces, then a slow rinse pass
      at 600-800 PSI. For Hardie siding — standard on 2000s builds in both 98801 and 98802
      — James Hardie's spec calls for 1,500 PSI max, 25-degree nozzle, 18-inch standoff
      minimum. After washing, 24-48 hours must pass before primer application; on
      south-facing Wenatchee walls, surface temps can hit 130°F by early afternoon, and
      primer applied to a hot surface bubbles. TopVolk coordinates wash scheduling with the
      paint crew to keep that window tight and avoid re-cleaning.

faq:
  - q: "How fast can you get to Wenatchee for power washing work?"
    a: |
      Wenatchee is roughly 2.5 hours from the Seattle metro via US-2 over Stevens Pass —
      a route Vladislav drives regularly for exterior renovation projects in Chelan County.
      Initial consultations typically get scheduled within 3-5 business days of first
      contact. Actual wash days are coordinated with the broader project calendar, since
