title: "Milton ADU Construction — DADU & Basement Conversion Builds"

answer: "DADUs, attached ADUs, and basement conversions in Milton, WA — built by TopVolk, WA Licensed Contractor, 100+ projects since 2023."

intro: |
  Two ADUs per lot is now the baseline under WA HB 1337, and in Milton that's turned a lot of quarter-acre yards near Milton City Park into serious rental-income math. The direct answer: TopVolk designs and builds detached ADUs, attached additions, and basement conversions across Milton's King County and Pierce County parcels, with Vladislav Volkov handling the project from first site walk to final inspection — no sales rep, no subcontracted project manager passing you around. A homeowner near the Interurban Trail corridor called us last spring wanting a 640 sq ft DADU with a Mitsubishi mini-split instead of ducted HVAC, mainly to keep the mechanical footprint small on a lot with tight side-yard setbacks. That's a normal ask here — Milton lots run smaller than what you'll find in Edgewood or Sumner, so height limits and FAR calculations matter from the first sketch, not after permits are submitted. Every contract carries a written deadline penalty, which is rare in this trade.

localContext: |
  Milton's housing stock is a mix — 1960s-70s ranchers on the flatter blocks toward 98354, newer infill construction near the Pierce/King county line, and a handful of older post-and-pier homes closer to Hylebos Creek. That mix matters for ADU work because foundation type drives cost fast: a basement conversion under a 1968 rancher usually means dealing with a low ceiling height and a vapor barrier retrofit before it'll pass rough-in inspection, while a DADU built fresh on a 98424-adjacent lot near Fife starts clean with a standard slab or crawlspace. Milton straddles two permitting authorities depending on the parcel — King County DPER for unincorporated pockets and the city's own building department for platted lots inside city limits — so we confirm jurisdiction before drawing anything. Setbacks tend to run tight on Milton's older 50x100 and 60x120 plats, which limits DADU placement more than the 24-foot height cap usually does. Soil here holds water after the fall rains, so footing drainage gets designed in from day one, not added after a wet crawlspace shows up in year two.

commonProblems:
  - title: "Choosing between a DADU, an attached ADU, and a basement conversion"
    description: "Most Milton homeowners start this conversation assuming a basement conversion is cheapest, but a lot of Milton ranchers have 6'6\" basement ceiling heights, which won't clear code without excavating the slab — that adds $15K-$25K before you've touched finishes. A detached ADU (DADU) sidesteps that problem but needs its own foundation, ledger-free framing, and a Mitsubishi mini-split or small Rinnai tankless setup for standalone mechanical service. An attached ADU (AADU) is usually the middle option — it ties into the existing rim joist and roofline with an LVL beam and new joist hangers, which cuts framing cost versus a stand-alone structure. We walk the lot and run the numbers on all three before you commit to plans. Typical decision-to-permit timeline runs 3-4 weeks."
  - title: "Utility separation for rental-ready ADUs"
    description: "Lenders and King County DPER both want to know whether a new ADU has its own water meter and sewer lateral or shares the main house's connection, and that decision changes both cost and paperwork. A shared connection is cheaper up front — usually $3K-$6K in trenching and a backflow preventer — but it can complicate refinancing if you ever want to sell the ADU as a separate unit under future zoning changes. A fully separated utility run in Milton often means trenching under a driveway or through a side yard where PT lumber retaining structures already exist, which adds a week to the schedule. We spec this out with you before submittal, not after the county kicks the plans back. Either path gets inspected at rough-in and again at final."
  - title: "Permit review and design review timelines in Milton"
    description: "WA HB 1337 opened the door to two ADUs on most single-family lots, but Milton's plan review still runs its own timeline separate from Seattle's or Bellevue's design review board process — expect 4-8 weeks for a DADU package depending on whether the parcel falls under King County DPER or the city's own building office. We prepare the full submittal: site plan with setbacks marked, structural calcs for any LVL beam or PSL post, energy code compliance showing R-49 attic insulation and vapor barrier detail, and the utility plan. TopVolk is a WA Licensed Contractor, and we pull permits in our name so there's one point of accountability if the AHJ has questions mid-review. Rough-in inspection typically lands 6-8 weeks after permit issuance, final inspection 2-3 weeks after that. Call (206) 591-1096 before you buy pre-drawn plans online — a lot of them don't match Milton's setback rules."
  - title: "What a Milton ADU actually costs"
    description: "A detached ADU in Milton runs roughly $180K-$260K depending on square footage, foundation type, and finish level — semi-custom cabinets and quartz counters cost more than IKEA cabinets and laminate, and that's a real line-item choice we walk through with you. Basement conversions land lower, often $90K-$140K, but soil conditions and existing ceiling height can push that number if excavation is needed. Attached ADUs sit in between since they reuse existing roof and foundation structure. Every quote from TopVolk is line-item, not a rounded estimate, and the contract includes a penalty clause if we miss the agreed completion date — that's written in, not implied. Schedule a free on-site consultation and we'll price it against your actual lot, not a template."
  - title: "Long-term maintenance on a new ADU in Milton's climate"
    description: "Western Washington gets roughly 37 inches of rain a year, most of it October through May, and that's hard on anything installed cheap. We spec Hardie cement-board siding over cedar on most Milton ADUs because it holds up better against moss and mildew on north-facing walls without the recoating schedule cedar needs. Mitsubishi mini-splits handle both heat and AC with minimal service — expect a filter clean twice a year and a professional check every couple years, with a 12-year compressor warranty on most residential units. Composite decking like Trex outperforms untreated wood on any exterior stair or landing tied to the ADU, since it won't cup or splinter after a wet Pacific Northwest winter. PT lumber still goes anywhere there's ground contact, per code, regardless of what's above it."

faq:
  - q: "How fast can you get to Milton for ADU construction?"
    a: "Milton sits just off SR 167 and I-5, about 20-25 minutes from our other King County job sites, so an initial site walk usually happens within a week of your call. Most Milton lots have driveway access wide enough for material delivery without a permit for street use, which keeps early scheduling simple. Design and permit prep run in parallel once we've measured the lot, and full DADU builds typically take 4-7 months end-to-end including King County or city permit review. Call (206) 591-1096 to get on the schedule — Vladislav does the site walk himself."
  - q: "What does a DADU cost in Milton?"
    a: "A detached ADU in Milton generally runs $180K-$260K depending on size, foundation, and finish package — a 500 sq ft studio-style unit prices differently than a 900 sq ft two-bedroom with a full kitchen. Cost drivers include foundation type, whether utilities are separated or shared, and finish choices like quartz vs laminate counters or a Moen vs Kohler fixture package. Basement conversions run lower, roughly $90K-$140K. We provide a free on-site consultation with a line-item quote, not a phone estimate — call (206) 591-1096 to set that up."
  - q: "Do I need a permit for an ADU in Milton, and how long does that take?"
    a: "Yes — every ADU in Milton needs a full building permit, and depending on the parcel that goes through King County DPER or the city's own building office, so we confirm jurisdiction before drawing plans. Plan review generally takes 4-8 weeks for a DADU, faster for a basement conversion since there's no new foundation to review. We prepare the site plan, structural calcs, and energy code documentation as part of the package, and TopVolk pulls the permit under our WA Licensed Contractor status. Rough-in and final inspections follow after framing and mechanical rough-in are complete."
  - q: "Can I put two ADUs on my Milton lot?"
    a: "Under WA HB 1337, most single-family lots statewide — including in Milton — can now have up to two ADUs, such as a DADU plus a basement conversion or an attached unit. Lot size, setbacks, and existing structures still limit what actually fits, and Milton's older 50x100 plats are tighter than newer subdivisions. We run a site feasibility check first, looking at FAR, the 24-foot DADU height limit, and required parking, before you spend money on architectural drawings. That feasibility walk-through is part of the free consultation — call (206) 591-1096."
  - q: "What's the warranty on a new ADU build?"
    a: "TopVolk backs structural and workmanship items for one year after final inspection, and manufacturer warranties carry beyond that — Mitsubishi mini-splits typically run 12 years on the compressor, Hardie siding carries a 30-year limited warranty, and Milgard windows come with a lifetime warranty on the glass unit. Western Washington's wet winters are the real test for any exterior work, which is why we detail flashing and vapor barriers to code rather than to the minimum. Roofing and siding hold up best when gutters get cleaned before the fall rains start. Ask about specific product warranties during your consultation."
  - q: "Do you build ADUs outside Milton too?"
    a: "Yes — we cover Fife, Edgewood, Federal Way, Auburn, and the rest of King, Pierce, Snohomish, and Kitsap counties from the same crew and scheduling pool. Booking usually runs 2-3 weeks out for an initial consultation, longer during spring when permit submittals spike countywide. Vladislav handles every project directly, so there's no handoff between the person who quotes it and the person building it. Call (206) 591-1096 or schedule a free consultation to get your lot on the calendar."