  - q: "Do I need a permit for a bathroom remodel in Milton?"
    a: "Yes, if the job moves plumbing fixtures, changes the drain layout, or resizes a window — Milton is its own incorporated city, so permits go through the City of Milton building department directly rather than King County DPER or Pierce County PALS, even though Milton sits right on that county line. TopVolk prepares the permit application, fixture plan, and IRC-compliant blocking details, then schedules both the rough-in and final inspection. Plan review on a standard bathroom permit typically clears in one to two weeks. TopVolk is a WA Licensed Contractor and handles this paperwork directly."
  - q: "Walk-in shower or tub — which makes more sense in an older Milton bathroom?"
    a: "For most 1980s-90s Milton layouts, the existing tub location already has floor joists sized for a standard tub, so converting to a curbless walk-in shower usually means adding a linear drain and re-sloping the subfloor, not relocating the whole layout. We waterproof with Schluter Kerdi or RedGard under large-format porcelain, add a built-in niche and bench, and size the shower valve to the existing rough-in where possible to control cost. Homes planning to age in place do better with a curbless entry and blocking for future grab bars, even if bars aren't installed on day one."
  - q: "What's the warranty on a TopVolk bathroom remodel?"
    a: "Workmanship is covered for a period spelled out in the contract, and manufacturer warranties on fixtures — Kohler, Moen, Toto — run separately, typically 5-10 years depending on the part. In Milton's damp climate, waterproofing behind tile is the piece that matters most long-term, so we warranty the shower pan and membrane work specifically rather than lumping it into a vague blanket promise. Grout and caulk are maintenance items, not warranty items, and we tell every homeowner that upfront. Call (206) 591-1096 and Vladislav will walk through exactly what's covered before anything gets signed."
