title: "Milton Bathroom Remodel — Fixing 90s Tract-Home Baths"

answer: "TopVolk Construction remodels bathrooms in Milton, Washington in 3-6 weeks — WA Licensed Contractor, 100+ projects completed since 2023, owner-led by Vladislav Volkov."

intro: |
  Pull the access panel behind a 1990s fiberglass tub surround in a Milton rancher near Rendel Park and you'll usually find soft subfloor, not sound plywood — that's the starting point for most bathroom remodel calls we get here. TopVolk Construction turns a standard 5x8 hall bath into a finished, code-compliant space in three to five weeks, and a full gut of a master bath in six to eight. Milton sits right on the King-Pierce county line off Milton Way, close enough to the Hylebos wetlands that crawlspace moisture shows up in bathroom subfloor before it shows up anywhere else in the house. A homeowner near Emerald Downs called last spring after a Moen faucet dripped for two years and rotted the vanity base straight through the toe-kick and cabinet floor. Older ranch homes off 4th Ave and newer infill near the Milton Community Center both get the same tile, vanity, and shower pan issues — just at different ages. Call (206) 591-1096 for a free on-site walkthrough with Vladislav Volkov himself, not a sales rep.

localContext: |
  Most of Milton's housing stock is 1970s-90s single-level ranch and split-entry construction, built when 98354 was mostly farmland getting platted for tract development, plus a smaller cluster of newer infill near 98003 close to the Federal Way line. Bathrooms in the older stock still run galvanized supply lines feeding a single shared wet wall, and those pipes are choking down with mineral scale by now — we cut them out and repipe with PEX every time a wall gets opened. Homes closer to Hi-Crest and the lower ground backing up to Hylebos Creek deal with more crawlspace humidity than the higher ground near Rendel Park, so vapor barrier condition matters before anyone touches tile. Because Milton is its own incorporated city straddling King and Pierce counties, permits for plumbing relocation or window resizing in a bathroom remodel go through the City of Milton building department directly, not King County DPER or Pierce County PALS. Plan review on a standard bath remodel here typically clears in one to two weeks.

commonProblems:
  - title: "Cracked Cultured Marble Tops and Worn-Out Moen Cartridges"
    description: "Tract bathrooms built through the 80s and 90s in Milton almost always shipped with a one-piece cultured marble vanity top and a builder-grade single-handle faucet — usually a first-generation Moen or Delta with a cartridge long past its 10-15 year service life. The marble top hairlines crack where the sink bowl meets the deck, and by the time a homeowner calls us the particle-board vanity carcass underneath has already swollen from years of splashed water. We pull the whole vanity, box out a new cabinet, and set a quartz or solid-surface top with an integrated bowl so there's no seam left to fail. Swapping vanity, top, and a new Moen or Kohler faucet runs $3,200-$5,800 depending on cabinet width, usually a two-day job once materials are on site."
  - title: "Shower Pan Leaks Turning Into Rotted Subfloor"
    description: "Pacific Northwest humidity doesn't forgive a failed shower pan liner, and plenty of Milton homes still have the original mortar-bed pan or a cracked fiberglass base from the initial build. Water tracks down through hairline grout cracks, sits against OSB subfloor for months, and by the time anyone notices a soft spot near the toilet flange, sister joists are usually needed to fix the framing underneath. Our fix is tearing out to the studs, installing Schluter Kerdi membrane or RedGard liquid waterproofing under a properly sloped mortar bed, then setting large-format porcelain tile. On jobs where the subfloor is compromised, we pull and replace OSB or DriCore panels before any tile goes down. A full shower pan rebuild with subfloor repair typically adds $2,500-$4,000 and two extra days to the schedule."
  - title: "Tub-to-Walk-In-Shower Conversions and What the City of Milton Requires"
    description: "Converting a tub to a curbless or low-curb walk-in shower means moving the drain line and sometimes the waste stack, which triggers a plumbing permit through the City of Milton's own building department, since Milton runs its own AHJ rather than routing through King County DPER or Pierce County PALS. We handle the permit application, submit the fixture layout and IRC-compliant blocking plan for grab bars, and schedule the rough-in inspection before tile goes on. Grab bar blocking is worth adding during framing even when a homeowner isn't asking for full accessibility yet — cheaper than opening a finished wall later. Plan review and permit issuance on a standard tub-to-shower swap here usually takes one to two weeks, and TopVolk Construction is a WA Licensed Contractor that handles that paperwork directly, no third-party expediter involved."
  - title: "What Actually Drives Bathroom Remodel Cost in Milton"
    description: "A full bathroom remodel in Milton typically runs $18,000 to $35,000, and the swing between those numbers comes down to three things: whether plumbing moves, what tile and countertop tier gets picked, and whether the subfloor needs structural repair once it's opened up. A straight cosmetic refresh — new vanity, tub-to-shower conversion, tile reface — lands closer to the low end. Moving the toilet flange, adding a linear drain for a curbless shower, or finding rotted joists behind the wall pushes a job toward $30,000-plus. TopVolk gives a line-item quote after the free walkthrough, not a ballpark range, so a homeowner knows what a Kohler versus a Toto toilet, or a semi-custom cabinet versus stock, adds to the bottom line. Every contract also includes a written deadline with a penalty clause if we run past it."
  - title: "Grout, Ventilation, and Mold Regrowth in a Wet Climate"
    description: "Grout lines in a Milton bathroom show dark mold staining faster than in drier climates, mostly because the original builder-grade exhaust fan is undersized — a lot of 90s tract homes shipped with a 50 CFM fan in a room that needs closer to 80-110 CFM to clear humidity after a shower. We upsize to a Panasonic WhisperFan or Broan unit sized to the room, wire it to a humidity-sensing switch, and reseal tile with mildew-resistant epoxy grout that holds up far better than standard cement grout. Expect epoxy grout to last 12-15 years before it needs attention versus 5-7 for standard grout in this climate. A curbless pan with Schluter Kerdi membrane underneath should outlast the house — it's the tile surface that wears, not the waterproofing. Regrouting plus a fan upgrade together typically run $1,200-$2,200 and take a single day."

