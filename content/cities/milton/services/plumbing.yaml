  - q: "Does Milton require a permit for water heater or repipe work?"
    a: "Yes — Washington state code requires a permit and inspection for water heater replacements and most repipe work, and Milton's split location means paperwork routes through either King County DPER or Pierce County PALS depending on which side of the county line the house sits. Both jurisdictions require seismic strapping documentation on water heaters and a rough-in inspection before walls close up on a repipe. TopVolk pulls the permit under its WA Licensed Contractor status and handles inspection scheduling directly, so the homeowner isn't the one on hold with the county. Typical turnaround for a straightforward permit here runs 1-2 weeks."
  - q: "PEX vs copper for repiping — which one makes sense in Milton?"
    a: "PEX-A handles Milton's mix of tight crawlspaces and older stud bays better than rigid copper, since it snakes through existing framing without the extra cuts and sweat-soldered joints copper needs. Copper still gets specified in exposed mechanical rooms or where a fixture manufacturer like Kohler recommends a rigid supply line, and it holds up fine against the area's water chemistry. Cost runs a bit higher for copper, mostly in labor since sweating joints in tight spaces takes longer than crimping PEX. Most Milton repipes end up PEX-A with a short run of copper stubbed out at each fixture."
  - q: "How long does new plumbing last in Milton's climate?"
    a: "PEX-A carries a manufacturer warranty of 25 years in most cases, and copper typically runs 50 or more with normal water chemistry, both well past what Milton's original galvanized lines ever gave homeowners. The area's roughly 37 inches of annual rain doesn't touch indoor supply lines, but a damp, unvented crawlspace will speed up corrosion on any old galvanized fittings still in service, so TopVolk checks vapor barrier condition during any repipe estimate. Workmanship on TopVolk installs is backed for one year, and the penalty clause written into every contract covers missed deadlines, not just the work itself. Fixtures carry their own manufacturer warranty — Moen and Kohler both run limited lifetime on core parts."
