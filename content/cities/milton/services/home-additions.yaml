title: "Milton Home Additions — ADUs & Second Stories"

answer: "TopVolk Construction builds ADUs, second stories, and additions in Milton, WA — owner-led estimates from Vladislav Volkov, 100+ projects since 2023."

intro: |
  Three bedrooms and one bathroom worked fine for a young family near Milton Elementary — until grandma moved in and somebody needed a door that actually closes. That's the addition call TopVolk hears most out of Milton: not a leaky faucet, but a real space problem. Maybe it's a detached ADU behind the garage for an adult child, or a second story stacked over a 1968 rambler that's finally too small for the family that grew into it. Vladislav Volkov walks the lot near the Interurban Trail corridor himself before drawing anything, because a DADU foundation and a second-story LVL beam call for two completely different plans. Some clients want a Mitsubishi mini-split zoned just for the new suite instead of fighting with old 1970s ductwork. Either way, it's project-based work — $30K to $200K and up — with a contract that spells out the deadline and the penalty if TopVolk misses it.

localContext: |
  Milton splits across two counties, and that shapes the permit path before the design even gets finalized. Homes in the 98354 core tend to run 1960s-70s ranch and split-level construction, single-story with crawlspace foundations that were never built to carry a second floor. Streets closer to the Hylebos Creek flats deal with drainage and setback rules that don't come up on the higher ground near Meridian Ave. A smaller share of newer infill sits closer to the 98003 line toward Federal Way, built to current energy code but still short on bedrooms for a growing household. Because the city sits on the King-Pierce county line, TopVolk checks which side of that boundary a lot falls on before filing — it changes which building department and which legacy records apply, and it affects how fast plan review moves.

commonProblems:
  - title: "Second-Story Additions and a Foundation That Wasn't Built for the Load"
    description: "Most of Milton's older ranch homes sit on a shallow perimeter foundation poured for one story, not two. Stack a second floor on that without checking the numbers first, and the existing rim joist and footing will crack under the new dead load. TopVolk runs structural calculations before permitting, and it usually means sistering the existing floor joists, adding an LVL beam over a new PSL post, and sometimes pouring supplemental footings under the crawlspace. On a typical Milton rambler, that structural work alone runs $15,000 to $30,000 before framing even starts upstairs. Skip it, and the inspector will red-tag the framing at rough-in — costing weeks, not days."
  - title: "Mother-In-Law Suites Need Their Own Entrance, Kitchen, and Egress"
    description: "A mother-in-law suite isn't just a spare bedroom with a lock on the door — code treats it as a separate dwelling unit once it has its own kitchen. That means a dedicated entrance, a compliant egress window in any below-grade or converted space, and its own smoke and CO detection circuit tied back to the panel. TopVolk lays out these AADU conversions with a kitchenette using mid-range appliances — a Whirlpool range and a GE fridge fit the budget most Milton families are working with — plus a full bath instead of a half. Miss the egress requirement and the space can't legally be occupied as a bedroom, only storage."
  - title: "DADU Permits Under WA HB 1337 — and Which Building Department Signs Off"
    description: "WA HB 1337 opened the door to two ADUs on most single-family lots statewide, and Milton allows both a detached and an attached unit on qualifying parcels that meet lot coverage and FAR limits. The catch is the 24-foot height limit on a DADU, plus a separate utility connection for water and sewer that the city has to inspect before occupancy. Because Milton straddles King and Pierce counties, TopVolk confirms which set of legacy zoning maps applies to a given parcel before submitting the plan set. Plan review on a DADU here typically runs 6-10 weeks, then another 2-3 weeks for rough-in and final inspection once framing starts. A parking exemption may apply for lots near a transit stop, which changes the site plan too."
  - title: "What an Addition Actually Costs in Milton — and What Moves the Number"
    description: "Line-item bids for additions in Milton run $30,000 for a small AADU conversion up to $200,000-plus for a full second story with new plumbing and an electrical panel upgrade. Foundation type drives most of that spread — a slab addition prices differently than one needing new footings under a crawlspace. Moving a kitchen or bathroom stack adds real plumbing cost, and an older 100-amp panel usually needs upgrading to 200-amp before a mini-split or new kitchen circuit gets added. Vladislav prices these as fixed line items, not a vague range, and the contract includes a penalty clause if TopVolk misses the agreed deadline. Call (206) 591-1096 for a free on-site walkthrough and an actual number, not an estimate over the phone."
  - title: "Matching Old Siding and Tying New HVAC Into a House Built Decades Ago"
    description: "A new addition on a 1965 rambler rarely matches the existing cedar siding — it's weathered gray from decades of Puget Sound rain, and new cedar goes up bright and orange. TopVolk usually switches the whole elevation to Hardie fiber-cement siding instead of patching, since it holds paint better through wet Northwest winters and won't warp like the original boards. On the mechanical side, running new ductwork off an old furnace usually starves the existing rooms of airflow, so a Mitsubishi mini-split head dedicated to the addition is often the cleaner fix, and it skips the ductwork tie-in problem entirely. Either upgrade adds $4,000-$9,000 to the job, and it's worth budgeting for upfront rather than living with a mismatched wall or a cold back bedroom."

faq:
  - q: "How fast can you get to Milton for Home Additions?"
    a: "Milton sits just off I-5 near the Federal Way and Fife exits, roughly 25-35 minutes from TopVolk's usual service loop across King, Snohomish, Pierce, and Kitsap counties, so scheduling a first visit is straightforward. Vladislav Volkov handles that first site walk himself — no salesperson gets sent out ahead of him — and can typically get out to a Milton property within a few days of a call. Parking on most residential streets here is easy enough for a truck and trailer during the estimate visit. Once the contract's signed and permits are filed, most additions break ground within 3-4 weeks. Call (206) 591-1096 to get a walkthrough on the calendar."
  - q: "What does a home addition or ADU cost in Milton?"
    a: "Line-item pricing for additions in Milton runs from about $30,000 for a small attached suite conversion to $200,000 or more for a detached ADU or full second story with new plumbing and electrical. What moves the number most is foundation type, whether a kitchen or bath gets added, and any electrical panel upgrade needed to support the new square footage. TopVolk provides a written estimate with actual line items after the site walk, not a range pulled off a brochure. Schedule a free consultation to get exact numbers for your lot."
  - q: "Which building department handles permits for a Milton addition?"
    a: "Milton runs its own building department, but because the city sits on the King-Pierce county line, some older parcels still carry legacy zoning records from one county or the other, so TopVolk checks that before filing. Plan review for a second-story addition or DADU typically takes 6-10 weeks; smaller AADU conversions can move faster. TopVolk prepares the full plan set — structural calculations, a site plan with setbacks, and utility connection details — as part of the bid, and handles the submission directly as a WA Licensed Contractor. Rough-in and final inspections get scheduled once framing and mechanical are in."
  - q: "Do we need to extend the existing ductwork into the new addition?"
    a: "Not always — extending old ductwork off an undersized furnace often just starves the rest of the house of airflow instead of solving anything. For most Milton additions, TopVolk installs a dedicated Mitsubishi mini-split head sized to the new square footage, which skips the ductwork tie-in and gives the new room its own thermostat. A gas option, like a Rinnai tankless unit for an ADU kitchen and bath, is usually more efficient than extending the existing water heater's capacity. MEP coordination happens before drywall goes up, so there's no cutting into finished walls later."
  - q: "What's the warranty on a Milton addition, and how does it hold up to Northwest weather?"
    a: "TopVolk's addition work comes with a standard workmanship warranty, and materials carry their own manufacturer coverage — Hardie siding is rated for decades in wet climates, and PT lumber with proper vapor barrier detailing in the crawlspace keeps moisture out from underneath. Puget Sound gets close to 37 inches of rain a year, so flashing details around new rooflines and ledger boards matter more here than in drier climates. R-49 insulation in the new attic space keeps energy bills down through both the damp winters and the occasional hot summer week. Ask about specific warranty terms during the free consultation."
  - q: "Do you work outside Milton too?"
    a: "Milton falls inside TopVolk's regular coverage area alongside Federal Way, Edgewood, Fife, Sumner, and the rest of King, Snohomish, Pierce, and Kitsap counties. TopVolk has completed 100+ projects across that same service area since 2023, and Vladislav's regular subcontractors know the permit offices on both sides of the county line. Scheduling generally runs 2-4 weeks out for a first estimate visit, faster if the project's urgent. Call (206) 591-1096 or ask for a free consultation to get on the schedule."