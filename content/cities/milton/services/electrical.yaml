  - q: "What does a panel upgrade cost in Milton?"
    a: "A straightforward 100A to 200A panel upgrade runs $2,800-$4,500 in Milton, depending on meter base condition, grounding, and how far the service line runs to the house. Older homes needing a new service entrance cable or a meter relocation land toward the higher end. EV charger circuits alone (50A or 60A dedicated) typically run $600-$1,200 separate from a panel swap. TopVolk gives a line-item quote on-site — no per-unit guessing — after Vladislav sees the existing panel and service."
  - q: "Do I need a permit for a panel upgrade or EV charger circuit in Milton?"
    a: "Yes — panel swaps, service upgrades, and most new circuits require a permit, and which office issues it depends on which side of the King-Pierce county line the house sits on: King County DPER or Pierce County PALS. TopVolk pulls the permit under the correct jurisdiction, schedules the PSE service coordination, and books the rough-in and final inspections. As a WA Licensed Contractor, that paperwork is handled without the homeowner having to call the county directly. Typical turnaround from permit filing to final sign-off is 2-4 weeks."
  - q: "Can my current panel run a Tesla charger and an induction range at the same time?"
    a: "It depends on the panel's rated amperage and what else is already on it — a load calculation is the only real way to know, and TopVolk runs one during the free walkthrough. Many 100A panels in Milton's older ranch homes are already close to capacity with a furnace, water heater, and dryer accounted for, which is why a 200A upgrade or a dedicated subpanel in the garage often makes more sense than squeezing another 50A EV circuit onto an already-loaded panel. Brands like Tesla, ChargePoint, and JuiceBox all need a properly sized dedicated circuit, not a shared one."
  - q: "What's the warranty on a panel upgrade or rewire, and how long does the work last?"
    a: "TopVolk backs the workmanship on panel upgrades and rewiring, and the panels themselves (Square D and Eaton) carry manufacturer warranties in the 10-20 year range depending on the product line. A properly installed 200A panel should last 25-30 years with no issues in this climate — moisture and corrosion at the meter base are the main long-term wear points, not the panel internals. AFCI/GFCI breakers typically get swapped every 15-20 years as code and technology move forward, which is normal maintenance, not a failure."
