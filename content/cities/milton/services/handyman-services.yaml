  - q: "Can you match texture and paint so a drywall patch doesn't show?"
    a: "Yes — the process is mesh patch over joint compound, sanded flush, then a texture match (orange peel or knockdown, whichever the wall already has) before priming and painting. If the original paint can or code isn't available, a small sample gets color-matched at the store first. Skipping the texture step is the most common reason a patch looks obvious later. Most patches are done, textured, and painted in a single visit."
  - q: "How long will a deck repair or new weatherstripping last in Milton's climate?"
