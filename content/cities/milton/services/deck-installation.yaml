  - q: "Do I need a permit to build a deck in Milton, WA?"
    a: "Yes — any deck attached to the house or elevated above 30 inches needs a permit, and which office you file with depends on which side of the King-Pierce line your address falls on: King County DPER or Pierce County PALS. Both require a plan set showing footing depth, ledger flashing detail, and guardrail height before approval. As a WA Licensed Contractor, TopVolk handles the permit application, schedules the rough-in and final inspections, and keeps photo documentation of the ledger flashing for the inspector. Plan on 3 to 5 weeks from submittal to framing start on a standard project."
  - q: "Should I choose cedar or composite decking for a Milton backyard?"
    a: "Cedar costs less up front but grays and holds moss within a few years in this climate, especially on shaded lots near Hylebos Creek — expect restaining every 1 to 2 years to keep it looking good. Trex and TimberTech cost more per square foot but don't need staining and clean off with a hose; Fiberon is a mid-price option worth comparing on tighter budgets. We bring samples of each to the free consultation so you're picking based on what it looks like weathered, not just the showroom board."
  - q: "How long will my new deck last in Milton's climate?"
    a: "A properly flashed composite deck — Trex or TimberTech, on PT-lumber framing with a corrosion-resistant joist hanger and Simpson Strong-Tie hardware — typically lasts 25 to 30 years here. Cedar decks run closer to 12 to 15 years even with regular maintenance, mostly because of the ~37 inches of rain Milton gets annually. Framing and structural work are covered under workmanship terms in the contract, separate from the manufacturer's material warranty on the decking itself. Missed deadlines carry a written penalty in every TopVolk contract, so the schedule risk isn't yours to absorb."
