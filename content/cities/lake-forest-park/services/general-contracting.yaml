title: "Lake Forest Park General Contracting — Whole-House Remodels"

intro: |
  Sheridan Beach and the streets climbing back from Lake Washington are lined with split-level
  ranchers built between 1955 and 1972 — solid Douglas-fir framing, but decades behind current
  energy code and never designed for a Sub-Zero refrigerator or a Wolf range on a dedicated gas
  line. Opening up these layouts means hitting load-bearing walls. Drain stacks are undersized.
  A general contractor who sequences framing, plumbing, and electrical on a $120K remodel is a
  different trade than a handyman.

localContext: |
  The 98155 zip is almost entirely mid-century residential — ranchers, split-levels, and the
  occasional Craftsman cottage near the old town core off Bothell Way NE. Most haven't been
  opened up since original construction. Demo reveals galvanized supply lines, 100-amp panels
  wired before AFCI requirements, and framing predating IRC span table requirements for LVL
  beam headers. Lake Forest Park issues its own building permits through city hall — separate
  process from Seattle SDCI and King County DPER, with its own plan review queue.

commonProblems:
  - title: "Structural surprises mid-demo in 1960s split-levels"
    description: |
      Pulling drywall in a 1965 rancher near Brookside often exposes load-bearing walls not
      shown on any original plan, headers undersized for today's IRC span tables, and rough
      framing that predates engineered lumber requirements. Adding an open floor plan or
      a Thermador range alcove means engineering a proper LVL beam — not just patching.
      Budget and schedule take the hit simultaneously when this isn't planned for upfront.

  - title: "Multi-trade scheduling gaps that stall projects for weeks"
    description: |
      Framing, rough-in electrical, rough-in plumbing, and mechanical all run in sequence —
      and each triggers a separate inspection before the next trade can proceed. One
      scheduling gap between a plumber and the rough-in inspection buries a project for
      three to four weeks. Homeowners managing their own subs rarely account for inspection
      lead times. A general contractor owns that sequence and the consequences when it slips.

  - title: "Permit delays from Lake Forest Park city plan review"
    description: |
      Lake Forest Park's building department runs independently from King County DPER.
      Plan review for a full kitchen reconfiguration or a room addition can take 6–10
      weeks. Homeowners who start demo before permits are approved end up with stop-work
      orders. Projects adding a Mitsubishi mini-split or a radiant floor system require a
      separate mechanical permit — another review cycle on top of the structural permit.

faq:
  - q: "How fast can you get to Lake Forest Park for General Contracting?"
    a: |
      Lake Forest Park is roughly 20 minutes north via Lake City Way NE or I-5 to
      the 175th Street exit. Residential streets off Ballinger Way NE have easy parking
      for a site visit. Call (206) 591-1096 — Vladislav answers directly, no intake staff.

  - q: "Do you work on kitchens with Sub-Zero, Wolf, or Thermador appliances?"
    a: |
      Yes — and those installs have specific rough-in requirements that most 1960s kitchens
      weren't built for. Sub-Zero panels need precise cabinet depth and ventilation
      clearances. Wolf ranges require a dedicated gas line and range hood CFM matched to
      the BTU output. We coordinate rough-in before cabinets are ordered, not after.

  - q: "What does a general contracting project in Lake Forest Park actually cost and how long does it take?"
    a: |
      Whole-house remodels in the 98155 zip typically run $100K–$200K+ depending on scope.
      Permits take 6–10 weeks; construction runs 3–5 months after that. Vladislav provides
      a line-item quote after the on-site visit — no vague ranges. Deadline penalties are
      written into the contract. WA Licensed Contractor. 100+ projects since 2023 across
      the Seattle Metro. Call (206) 591-1096 to schedule a free on-site consultation.