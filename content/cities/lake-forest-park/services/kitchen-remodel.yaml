title: "Lake Forest Park Kitchen Remodel — Open Layouts for Mid-Century Ramblers"

intro: |
  Mid-century ramblers on the hillside streets above Lake Washington in 98155 were built
  around separate rooms, 30-inch galley layouts, and 100-amp panels from the early 1960s.
  Running Sub-Zero or Wolf means opening walls, upgrading electrical service, and pulling
  permits — none of which is cosmetic work. Vladislav Volkov, WA Licensed Contractor,
  100+ projects completed since 2023 across Seattle Metro, handles this kind of renovation
  directly. No middlemen. No salesperson quoting jobs he's never seen.

localContext: |
  Lake Forest Park's 98155 zip is mostly 1955–1975 construction — split-levels and ramblers
  on wooded lots draining toward McAleer Creek. The Town Center area near Ballinger Way
  mixes that era with some 1980s builds that still have original builder-grade cabinets.
  Crawlspaces here accumulate moisture from October through April. Any subfloor work during
  a kitchen remodel typically surfaces vapor barrier problems worth correcting while the
  walls are already open.

commonProblems:
  - title: "Load-Bearing Wall Between Kitchen and Dining Space"
    description: |
      The wall separating kitchen from dining or living area in these 1960s ramblers is
      load-bearing more often than not. Removing it means installing a properly sized LVL
      beam — typically 4×10 or 4×12 — with PSL posts carrying the load to the foundation.
      City of Lake Forest Park requires structural drawings, plan review, and a rough-in
      inspection before drywall closes back up. Skipping that step creates liability at
      resale.

  - title: "100-Amp Panels That Can't Support Modern Appliance Loads"
    description: |
      Built-in Sub-Zero refrigerators, Wolf dual-fuel ranges, and induction cooktops pull
      far more amperage than the original 100-amp panels in 1960s–70s Lake Forest Park homes
      were sized for. Upgrading to 200-amp service means coordinating with Puget Sound Energy
      for a new meter base, pulling an electrical permit through the city, and replanning
      kitchen circuits before rough-in. It adds two to three weeks but prevents nuisance
      tripping from day one.

  - title: "Gas Line Relocation and Exterior-Wall Hood Venting"
    description: |
      Older kitchens in 98155 have gas stub-outs in fixed locations that don't align with
      new island or peninsula layouts. Relocating the line requires a licensed plumber, a
      separate gas permit, and a pressure test before final inspection. Range hood venting
      through north-facing exterior walls also needs a proper backdraft damper — Seattle's
      sustained wet air from fall through spring will push back into cabinet framing without
      one, and Hardie siding on the exterior won't stop the moisture at the seam.

faq:
  - q: "How fast can you get to Lake Forest Park for a kitchen remodel consultation?"
    a: |
      Lake Forest Park sits about 15 minutes north of Seattle via I-5 or SR-522 — easy
      reach from our project base. Vladislav can usually schedule an on-site walkthrough
      within a week. Call (206) 591-1096 and you're talking directly to the contractor,
      not a scheduler.

  - q: "Do you install Sub-Zero, Wolf, and Thermador appliances as part of the remodel?"
    a: |
      Yes. Sub-Zero built-in columns, Wolf dual-fuel ranges, and Thermador steam ovens all
      require specific rough-in dimensions, dedicated circuits, and sometimes custom cabinet
      depth modifications. Appliance specs get locked in before cabinets are ordered so
      nothing needs field-cutting when the delivery truck shows up.

  - q: "What does a full kitchen remodel cost, and how long does permitting take in Lake Forest Park?"
    a: |
      Full kitchen remodels — layout change, new cabinets, appliances, electrical, plumbing
      — typically run $60K–$130K in this area depending on finish level and whether structural
      work is involved. City of Lake Forest Park plan review runs roughly 3–6 weeks for
      kitchen scope. Total project timeline from permit submission to blue-tape punch list
      walkthrough is usually 10–16 weeks. Missed-deadline penalties are written into the
      contract. Call (206) 591-1096 for a line-item estimate based on your actual floor plan.