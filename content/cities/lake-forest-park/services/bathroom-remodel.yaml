title: "Lake Forest Park Bathroom Remodel — Hillside Homes Rebuilt"

intro: |
  Third Place Commons is two miles from most of 98155, but inside a lot of these
  hillside homes the bathroom still looks like it shipped with the house in 1963.
  Mid-century split-levels and ranchers above Lake Washington hold original 4×4
  ceramic wall tile, galvanized drain stacks, and a single-handle Moen fixture
  that's been dripping for a decade. Vladislav Volkov — WA Licensed Contractor,
  100+ projects completed since 2023 across King County — has rebuilt these baths
  from the subfloor up: curbless showers, Schluter Kerdi membrane, Toto wall-hung
  toilets, the works.

localContext: |
  Lake Forest Park's housing stock is mostly 1955–1975 vintage, same mid-century
  window as Shoreline and Kenmore just north on SR-522. In zip code 98155 you get
  a dense band of split-level and single-story ranchers where original bathroom
  footprints run 45–55 square feet — tight enough that rough-in plumbing sequencing
  matters before any partition wall goes up. A handful of older lots closer to the
  lake still have Craftsman-era construction with cast-iron drain stacks that need
  full rerouting the moment a layout change enters the drawing.

commonProblems:
  - title: "Corroded Galvanized Drain Stacks at Fitting Joints"
    description: "Galvanized steel stacks in 1960s Lake Forest Park ranchers have 60 years
      of hard water deposits and PNW humidity eating the threading at every joint.
      Swapping the stack to ABS or PVC during the remodel costs far less than
      cutting into fresh tile six months later when a fitting blows. King County
      requires a rough-in inspection before wall closure — TopVolk pulls the permit,
      schedules the inspector, and tiles only after it passes."
  - title: "Failed Shower Pan — No Waterproofing Membrane Below the Tile"
    description: "Builder-era showers here were set on a mortar bed with no bonded
      waterproofing layer underneath. Grout absorbs steam, the mud bed wicks it to
      the OSB subfloor, and the rot starts long before you see tile cracking.
      Schluter Kerdi or RedGard applied to the substrate before large-format
      porcelain goes down eliminates that failure path entirely. By the time tile
      lifts, subfloor damage has usually been running for a year or two."
  - title: "Undersized Ventilation Feeding Mold on North-Facing Walls"
    description: "Lake Forest Park pulls about 37 inches of rain annually, and hillside
      lots leave many bathrooms with north-facing exterior walls that stay damp for
      months. Original 50-CFM fans — if they still spin — can't move the steam load
      from a master bath conversion. Upgrading to a Panasonic WhisperCeiling at
      110 CFM, combined with a Kohler timer switch, clears moisture before it
      becomes a mold remediation job rather than a ventilation upgrade."

faq:
  - q: "How fast can you get to Lake Forest Park for a Bathroom Remodel consultation?"
    a: "Lake Forest Park sits right off SR-522 and Lake City Way NE — both roads we
      run regularly for projects in Kenmore and Shoreline. On-site consultations
      usually fit within a week. Call (206) 591-1096 and Vladislav sets it up
      directly — no scheduling staff, no sales call first."
  - q: "Do you work with Toto and Kohler fixtures for high-end bathroom remodels in 98155?"
    a: "Both Toto and Kohler come up constantly on Lake Forest Park projects. Toto
      Neorest one-piece toilets, Kohler DTV thermostatic shower systems, Hansgrohe
      hand showers — all installed regularly. Delivery gets coordinated to the
      finish-work schedule so fixtures aren't sitting on a jobsite collecting dust
      for two weeks."
  - q: "What's the permit timeline for a full bathroom remodel in Lake Forest Park?"
    a: "Lake Forest Park is an incorporated city with its own building department —
      plan review on a structural or plumbing-heavy remodel typically runs 3–5
      weeks. Full gut-and-rebuild: 6–10 weeks from permit approval to blue tape
      walkthrough and punch list. TopVolk pulls all permits. Deadline penalties
      are written into the contract — not a vague promise."