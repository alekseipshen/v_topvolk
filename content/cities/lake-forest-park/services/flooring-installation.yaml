    a: "TopVolk covers the whole Seattle Metro area, including Kenmore, Shoreline, Bothell, and the rest of King, Snohomish, Pierce, and Kitsap counties. That's 100+ projects completed since 2023. Scheduling windows run about one to two weeks out for estimates, and install timing varies by project size. Every job is quoted and run by Vladislav directly. No sales staff, no subcontracted project manager. Call (206) 591-1096 to check current availability."