commonProblems:
  - title: "Cedar Fences Graying Fast Near the Golf Course Tree Line"
    description: "Cedar pickets installed under the fir cover along Newcastle Golf Club fairways gray out faster than open-yard cedar. They streak with mildew too. Shade keeps the wood damp for days after a normal King County rain. The picket faces closest to the fairway tend to cup first. That pulls nails and loosens the rail. TopVolk seals new cedar with a semi-transparent oil-based stain instead of paint. Paint traps moisture behind the picket and speeds rot at the post-to-rail connection. Homeowners who don't want the two-to-three-year resealing cycle can pick a CertainTeed or Trex-style vinyl panel with wood-grain texture instead. It holds up without the upkeep, running roughly $38-55 per linear foot installed versus $28-40 for cedar. Either way, PT (pressure-treated) posts set below the picket line last longest in Newcastle's clay soil."
  - title: "Posts Heaving After Freeze-Thaw on Sloped Lots"
    description: "Lots that step down toward May Creek or up toward Cougar Mountain see more freeze-thaw movement than flat, level blocks. A post set only 18 inches deep works loose within a couple winters. TopVolk sets 4x4 or 6x6 PT posts 24 to 36 inches down, depending on grade and wind exposure. A gravel base goes under the concrete footing so water drains instead of pooling against the post. That pooling rots a post from underground up. On steeper May Valley lots, we'll add a sistered post or extra footing near gate posts. Gate hardware puts repeated lateral stress on that one point. A leaning post two years in almost always traces back to a shallow footing, not bad wood. Resetting one post runs $250-450. Doing it right the first time costs less over ten years."
  - title: "Height Limits and Permits for Retaining-Wall Fences"
    description: "Newcastle's Development Services office allows 6-foot fences in side and rear yards. Front yards facing the street cap at 4 feet. That matches the rule Bellevue and King County DPER apply in unincorporated pockets nearby. A fence built on top of a retaining wall over 4 feet is different. That combined structure usually needs a separate structural permit, sometimes with an engineer's stamp. This comes up most on the steeper lots between Coal Creek Parkway and the golf course. Shared property-line fences also need a signed agreement between neighbors before TopVolk sets posts. A survey a few inches off can mean tearing out a freshly poured footing. Vladislav Volkov pulls the survey pins or orders a boundary check before quoting height and setback. That way plan review doesn't stall the project later. WA Licensed Contractor paperwork and permit drawings are handled as part of the quote, not billed separately."
  - title: "What Actually Drives Fence Pricing Here"
    description: "A standard 6-foot cedar picket fence in Newcastle runs $28-40 per linear foot installed. Vinyl runs $38-55. A horizontal cedar slat design with steel post cores runs closer to $50-70, because of the extra framing labor. Gate hardware is where quotes vary most. A basic latch gate is a few hundred dollars. A self-closing, soft-close hinge gate for a pool or side yard adds $200-400 per gate. Slope, tree root removal, and old post demo also change the number fast on a hillside lot near May Creek. TopVolk gives a line-item quote by linear foot and gate count on the first visit, not a rough range over the phone. Vladislav Volkov puts a completion date with a penalty clause in the contract. That way a two-week job doesn't quietly become six."
  - title: "Cedar Resealing and Vinyl Panel Lifespan"
    description: "Cedar fencing in Newcastle's climate needs a fresh coat of oil-based sealant every 2-3 years on sun-exposed sides. Shaded, fairway-facing sections need it closer to every 2 years. Skip it and the picket grain opens up and starts absorbing standing water. Vinyl and composite panels skip that cycle entirely. They typically run 20-25 years before a post cap or panel cracks. Extreme cold snaps up toward Cougar Mountain can make cheaper vinyl brittle at the bottom rail, though. TopVolk replaces individual pickets or rails instead of full sections when only a few boards fail. That keeps repair costs under $500 in most cases. A full 150-foot fence replacement, by comparison, typically runs $5,000-9,000 depending on material and gate count. Checking post rot at the base every couple years catches problems before a whole section leans."

