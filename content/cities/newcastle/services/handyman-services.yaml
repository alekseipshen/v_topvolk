localContext: |
  Newcastle splits mostly across two zip codes, 98056 and 98059. The housing stock reflects decades of growth since the city's 1994 incorporation. Split-level and daylight-ranch homes from the 1970s and 80s line the streets above Lake Boren Park and along May Valley Road. A good number still run original galvanized supply lines and single-pane windows that leak air at the frame — common handyman calls in this part of Newcastle.

  Newer custom builds near the Newcastle Golf Club and along Lakeridge Drive went up in the 1990s and 2000s. These homes carry panel-ready Sub-Zero and Thermador appliances, built-in cabinetry, and HOA design guidelines covering anything visible from the street. Deck stain color, railing style, even porch light fixtures — all of it needs sign-off first.

  Wet falls and winters push moisture into north-facing siding and deck framing across both zip codes. Tree cover off Cougar Mountain keeps yards shaded and damp longer into spring than most of King County. Any exterior swap inside an HOA-governed section of Newcastle needs approval from the architectural committee before the ladder comes out of the truck.

commonProblems:
  - title: "Punch List Cleanup After a Newcastle Remodel"
    description: "A kitchen remodel near the Newcastle Golf Club wraps up and the general contractor's crew is gone. But six things are still wrong: a Thermador panel front sitting a quarter-inch proud of the cabinet box, two cabinet hinges that need adjusting, a caulk line at the Schluter edge that never got tooled smooth, and a dimmer switch wired backward. None of that justifies a change order back to the GC. This is exactly the handyman work TopVolk handles as its own visit — usually a half day to a full day depending on the list, running $350-$900 total instead of a per-item invoice. Vladislav brings the same finish tools used on the original job. Hardware, caulking, and touch-up paint match what's already there instead of looking patched on."
  - title: "Drywall Patches That Actually Match the Texture"
    description: "Newcastle homes built in the 1970s and 80s off May Valley Road mostly carry hand-applied knockdown or orange-peel texture. A lot of quick patches show up as a smooth square on a rough wall instead of blending in. Fixing a hole from an old thermostat or a TV mounting bracket means cutting back to the nearest stud, screwing in a patch panel, taping the seams, and matching texture with a hopper gun before repainting. Newer builds near Lakeridge Drive often have smooth, level-5 finish walls instead — an easier match for a handyman repair. A single patch runs $175-$300 including primer and color-matching. A full room of texture blending can run $600-$1,200. Get it wrong and the patch shows up from across the room in raking light off a west-facing window."
  - title: "Deck Rail Height and Newcastle's Permit Rules"
    description: "Guardrails on a deck more than 30 inches above grade need to hit 36 inches minimum under the IRC. Older Newcastle decks off Lake Boren Park and the streets above May Creek were often built to a shorter code before that changed. Swapping a few rotted PT lumber deck boards is usually exempt from permit as a like-for-like repair. But replacing a full railing system, or resetting posts tied to a ledger board, crosses into work the City of Newcastle's permit counter wants reviewed. TopVolk pulls the permit when the scope calls for it, coordinates the inspection, and builds to current IRC spacing — no more than a 4-inch gap between balusters. Homes inside the golf course HOA also need architectural approval on railing style before permit submittal. That paperwork gets handled as part of Vladislav's WA Licensed Contractor process — same handyman-scale job whether it covers four boards or a full rail rebuild."
  - title: "What Weatherstripping Actually Saves You in Newcastle"
    description: "Newcastle sits high enough above Lake Washington that wind off Cougar Mountain finds every gap around an old door slab or a single-pane window frame. That gap accounts for most of the heat loss in ranch homes built before 1990. Replacing worn weatherstripping and adding a new door sweep runs $45-$85 per door. A full house of eight to ten openings usually lands between $500-$900 including materials. Windows with failed weatherstripping around the sash cost more, closer to $75-$120 each, because the stop molding often has to come off first to reset it. It's cheap compared to a full window replacement, and this handyman fix shows up on a winter heating bill instead of just looking nicer. Pair it with a crawlspace vapor barrier check and the payback is usually under two winters."
  - title: "PT Lumber vs. Composite: What Lasts Through a Newcastle Winter"
    description: "Original pressure-treated deck boards near Lake Boren Park and the wooded lots off Cougar Mountain start cupping and splitting after 12-15 years of PNW rain. North-facing decks that stay damp into June go first. Trex and TimberTech composite boards cost roughly double the material price of PT lumber upfront, but hold 25-30 years without staining, sanding, or swapping individual boards once rot sets in. Board-by-board PT replacement makes sense when only a joist bay or two of decking has failed. A full composite resurfacing makes more sense once a third of the deck is soft underfoot. Gutters clogged with fir needles from the tree cover common through Newcastle also rot fascia and trim faster, so a gutter cleaning and trim check before fall rains is worth scheduling alongside any handyman deck job."

