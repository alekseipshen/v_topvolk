title: "Newcastle ADU Construction — DADUs & Conversions Under HB 1337"

answer: "Owner-led DADU, attached ADU, and basement conversion builds in Newcastle, Washington, permitted under WA HB 1337 — WA Licensed Contractor, 100+ projects since 2023."

intro: |
  Two ADUs per lot is the law now, not a variance request — WA HB 1337 settled that statewide in 2024, and most single-family lots near the Golf Club at Newcastle and Lake Boren Park qualify for a detached unit, an attached addition, or both. TopVolk Construction handles the framing, MEP coordination, and permit paperwork for all three paths: a DADU over a garage, an AADU built into an existing footprint, or a basement conversion with a separate egress. Newcastle's larger lots — many carved out of the old coal-mining land near Coal Creek Natural Area — often have the setback room a tighter Seattle lot doesn't. Homeowners here tend to spec the unit like the main house: Bosch or KitchenAid appliance packages, Mitsubishi mini-splits for heating and cooling instead of ducted HVAC, Milgard or Marvin windows to match. Vladislav Volkov runs the job site directly — no sales rep hands you off to a project manager you've never met.

localContext: |
  Newcastle splits across ZIP codes 98056 and 98059, and most of the housing stock near the Golf Club neighborhood and the May Creek corridor was built in the 1990s and 2000s — newer than the Craftsman bungalow stock in Seattle proper, which changes the ADU math considerably. Post-and-beam foundations and updated electrical panels from that era mean fewer surprises during a basement conversion; you're not fighting knob-and-tube wiring or galvanized plumbing like a 1920s Beacon Hill remodel. Unlike unincorporated King County parcels handled through DPER, Newcastle is its own incorporated city (since 1994), so ADU permits route through the City of Newcastle Community Development Department, not King County directly. Lots backing onto Lake Boren Park or the Coal Creek Natural Area buffer sometimes carry critical-area setbacks on top of the standard 24-foot DADU height limit. Heavy rain October through May — the same 37 inches a year the rest of the Sound sees — means drainage and vapor barrier detailing at the crawlspace matter as much as the floor plan.

commonProblems:
  - title: "Choosing DADU vs. attached ADU vs. basement conversion for rental income"
    description: "Three paths, three cost structures, and homeowners in Newcastle usually pick based on lot size and whether they want separation from the main house. A DADU needs a new foundation, an LVL beam or PSL post system for the roof span, and a full utility run — water, sewer, electrical — either separated or shared with the primary meter. A basement conversion skips the foundation work but needs a sistered joist or added blocking to meet IRC egress window sizing, plus a vapor barrier upgrade if the crawlspace was never finished. Attached ADUs split the difference: shared exterior wall, new ledger board tie-in, separate entry required. Typical build cost runs $180K-$260K for a DADU, $90K-$150K for a basement conversion. We walk the lot with you before pricing anything."
  - title: "Utility separation and the shared-meter decision"
    description: "HB 1337 doesn't require a separate water and sewer connection for every ADU, but lenders and future buyers often want one, and that decision changes the budget by $15K-$30K depending on where the main line runs. A shared connection means a sub-meter and a simple manifold split; a separate connection means trenching to the city main, which near Lake Boren Park can mean crossing established landscaping or a shared driveway easement. We spec a Rinnai or Navien tankless unit for the ADU either way — no room in a 600 sq ft unit for a 50-gallon tank. Get this decision wrong and refinancing the ADU as a separate rental unit later gets complicated fast."
  - title: "Permitting through the City of Newcastle instead of King County DPER"
    description: "Newcastle runs its own Community Development Department, so ADU plan review doesn't go through King County DPER the way it does for unincorporated pockets near Fairwood or May Valley. Pre-approved plan sets can shave weeks off plan review, but a custom DADU still typically takes 6-10 weeks for plan review plus 4-6 months for construction, inspections, and final sign-off. Rough-in inspection, mechanical inspection, and final inspection are all scheduled separately, and missing one pushes the whole schedule. TopVolk prepares the full permit packet — site plan, floor plan, structural calcs for the LVL beam sizing — and submits it directly. WA Licensed Contractor status is required for anyone pulling the permit as GC, and we do that ourselves, not through a sub."
  - title: "Budgeting an ADU that matches a $1.5M+ Newcastle home"
    description: "Median household income here runs north of $155K, and the ADUs we build reflect that — quartz counters, large-format porcelain in the bath, a Bosch or Sub-Zero-adjacent appliance package scaled to the smaller footprint. Cost drivers are the same everywhere but hit harder on a premium build: foundation type, roofline complexity, finish level, and whether the kitchen gets a full range hood with proper CFM venting or a compact induction unit. A finished, rentable DADU with real finish work (not builder-grade) runs $200-$320 per square foot in this market. Every quote is line-item — labor, materials, permit fees broken out separately — and the contract includes a penalty clause if we miss the agreed completion date."
  - title: "Long-term durability: decking, siding, and mini-split maintenance on the new structure"
    description: "A DADU built in Newcastle's rain gets the same climate stress as the main house — moss on north-facing roof sections, moisture at grade if the drainage plan is wrong. We spec Hardie cement-board siding over cedar for anything within a few feet of grade, since it doesn't need the recoating cycle cedar shake does. Decking off a DADU entry goes composite — Trex or TimberTech — because ground-contact PT lumber still needs annual sealing that most owners skip. Mitsubishi mini-splits need a filter clean every 3-4 months and a professional service check annually; expect 12-15 years of service life before compressor replacement becomes the economical call over repair."

