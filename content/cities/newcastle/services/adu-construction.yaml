  - q: "What does a DADU cost in Newcastle?"
    a: "A permitted, finished DADU typically runs $180,000-$260,000 depending on square footage, foundation type, and finish level — attached ADUs and basement conversions run lower, usually $90,000-$180,000. Pricing swings on whether utilities are separated or shared, roofline complexity, and appliance package (a Bosch-level kitchen costs less than a Sub-Zero/Wolf setup). We provide a free consultation and a line-item quote — no lump-sum guessing, and no vague per-square-foot range without a site visit. Call (206) 591-1096 for scheduling."
  - q: "How does ADU permitting work through the City of Newcastle?"
    a: "Newcastle is incorporated, so ADU permits route through the City of Newcastle Community Development Department rather than King County DPER — different from unincorporated pockets nearby. Plan review generally takes 6-10 weeks for a custom DADU, faster if a pre-approved plan set fits the lot. We prepare the full submittal — site plan, structural calcs, utility plan — and handle rough-in and final inspections directly as the WA Licensed Contractor of record. Expect the full permit-to-final-inspection timeline to run 4-7 months for a DADU."
  - q: "Do we need a separate water and sewer connection for the ADU?"
    a: "Not always — HB 1337 allows a shared connection with a sub-meter, which is cheaper and faster to permit than trenching a new line to the city main. We typically pair a shared connection with a Rinnai or Navien tankless water heater sized for the ADU's fixture count, since there's rarely room for a standard tank in a 600-800 sq ft unit. Separate service costs more upfront but simplifies things if you plan to sell or refinance the ADU as its own unit later. We'll walk you through both options with real numbers before you decide."
  - q: "What's the expected lifespan on ADU finishes and mechanical systems here?"
    a: "Hardie siding and composite decking (Trex, TimberTech) are built for the Pacific Northwest's wet season and generally outlast cedar without the recoating cycle — expect 30+ years with minimal upkeep. Mitsubishi mini-split systems run 12-15 years with annual servicing before compressor replacement makes more sense than repair. Structural elements — LVL beams, PT lumber at ground contact, sistered joists — are covered under our workmanship warranty, separate from manufacturer warranties on appliances and mechanical units. We'll go over what's covered and for how long during the estimate."
