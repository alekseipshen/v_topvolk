title: "Newcastle General Contracting — Permits, Trades, No Middlemen"

intro: |
  Coal Creek Natural Area backs up against some of the nicest residential streets in 98059 — homes built in the 1990s and early 2000s that now need the kind of full renovation they were never designed to support piecemeal. Pulling a permit through King County DPER for a whole-house remodel here means plan review, MEP coordination, and a schedule that actually holds. Vladislav Volkov handles all of it directly — WA Licensed Contractor, 100+ projects completed since 2017, no project manager sitting between you and the person making decisions.

localContext: |
  Most of Newcastle's housing stock went up between 1992 and 2008 — builder-grade finishes, standard 2×6 framing, and mechanical systems that have hit or are past their service life. Zip code 98059 covers the Coal Creek corridor and the ridge neighborhoods climbing above Renton toward Lake Boren Park. Older tri-levels in that area often have undersized electrical panels and galvanized supply lines that become expensive surprises once demo starts.

commonProblems:
  - title: "Structural Surprises After Demo Blow Up the Budget"
    description: "Tear out a ceiling in a 1998 Newcastle build and you might find undersized LVL beam spans, missing joist hangers, or blocking that was never installed to code. These aren't rare — they're standard in builder-grade construction from that era. Each one means a change order, a revised structural calc, and a re-inspection slot through King County DPER before drywall hang can resume."
  - title: "Multi-Trade Scheduling Falls Apart Without One Coordinator"
    description: "Rough-in for electrical, plumbing, and HVAC has to happen in the right sequence — mechanical before insulation, inspections before drywall, finish work only after punch list sign-off. Homeowners managing their own subs on a $150K Newcastle remodel routinely hit delays because one trade books out or misses a window. A Wolf range and Thermador hood also require both gas rough-in and a dedicated 240V circuit coordinated before cabinetry goes in."
  - title: "King County DPER Plan Review Adds Weeks Nobody Budgets For"
    description: "Newcastle is unincorporated King County — permits go to DPER, not Seattle SDCI. Plan review for a major addition or DADU can run 6-10 weeks, longer if drawings come back with corrections. Submit incomplete structural calculations or miss a setback note on the site plan and you start that clock over. Projects near the Coal Creek greenbelt trigger additional FAR and lot coverage review."

faq:
  - q: "How fast can you get to Newcastle for General Contracting?"
    a: "Newcastle is roughly 20 minutes out depending on I-405 conditions. On-site consultations run Tuesday through Saturday. Call (206) 591-1096 to book directly with Vladislav — no scheduling coordinator, no sales call first."
  - q: "Do you manage the full permit process for Newcastle remodels, including DPER submissions?"
    a: "Yes. King County DPER applications, structural drawing coordination, rough-in inspections, final inspection scheduling — all included. We've pulled permits for kitchen reconfigurations, whole-house renovations, and DADUs in 98059. Permit timeline goes into the contract schedule upfront, not added on after."
  - q: "What does a whole-house renovation in Newcastle typically cost and how long does it take?"
    a: "A full gut renovation on a 2,400 sq ft Newcastle home runs $150K–$250K depending on finish level — Sub-Zero or Thermador appliance packages alone add $20K–$40K to kitchen budgets. Timeline runs 4–7 months from permit issuance to blue tape walkthrough. Missed deadlines carry a financial penalty written into the contract."