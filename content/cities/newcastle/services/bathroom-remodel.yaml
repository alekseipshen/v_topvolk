title: "Newcastle Bathroom Remodel — Coal Creek Homes Rebuilt Right"

intro: |
  Permit plan review through Newcastle's own city building office moves faster than Seattle
  SDCI — typically 3–5 weeks for projects with structural or plumbing changes, which matters
  when you're coordinating a master bath overhaul around a working household. The homes in
  Newcastle's 98059 zip are mostly 1995–2008 Pacific Northwest contemporaries and colonials
  built with original Moen pressure-balance valves and felt-and-thinset shower surrounds that
  are at or past their practical lifespan. Vladislav Volkov has completed 100+ remodels across
  King County since 2023 — WA Licensed Contractor, owner-operated, and he's the one who shows
  up to your house.

localContext: |
  Newcastle's hillside subdivisions along the Coal Creek corridor were built largely between
  1995 and 2010 — bigger lots, custom-adjacent layouts, but still contractor-grade plumbing
  rough-ins and exhaust fans sized for code minimum, not PNW humidity. Many homes near Lake
  Boren Park sit on sloped lots where bathroom additions or layout changes require LVL beams
  in the floor assembly before anything else moves. Zip 98059 also has older pockets — a
  handful of 1960s–70s ranchers with cast-iron drain stacks that need a full evaluation
  before any floor plan reconfiguration starts.

commonProblems:
  - title: "Waterproofing failures behind 1990s shower surrounds"
    description: "Felt-and-thinset waterproofing standard in 98059 homes built 1995–2005 has
      a 15–20 year useful life. By the time grout cracks appear, water has typically been
      migrating behind cement backer board for months. The correct fix is full demo to studs,
      Schluter Kerdi membrane or RedGard coating, and a 24-hour flood test before large-format
      porcelain tile goes back up. Patching grout on top buys 18 months, not 18 years."
  - title: "Cramped 36-inch shower-tub combos ready for conversion"
    description: "Newcastle's 1990s master baths were designed around 36\" × 36\" tub-shower
      combos that look dated and function poorly today. Converting to a curbless walk-in shower
      means relocating the drain rough-in, installing blocking in wall framing for future grab
      bars, and swapping in a Kohler or Moen pressure-balance valve rated for the new layout.
      Any drain relocation triggers a Newcastle building permit — plan for it upfront."
  - title: "Chronic mold on north-facing walls from undersized exhaust fans"
    description: "King County averages 37+ inches of rain October through May, and Newcastle's
      hillside homes trap moisture in north-facing bathrooms year-round. Most builder-installed
      fans run 50 CFM — adequate for a 2003 energy code, marginal for actual conditions.
      Upgrading to a 110-CFM Panasonic WhisperCeiling with a humidity sensor, combined with
      Schluter Kerdi-Board backer on all wet-zone walls, breaks the mold cycle at the source
      rather than the surface."

faq:
  - q: "How fast can you get to Newcastle for Bathroom Remodel?"
    a: "Newcastle is 20–25 minutes via Coal Creek Parkway or I-405 South from Bellevue.
      Vladislav can usually schedule an on-site walkthrough within 2–3 business days. Call
      (206) 591-1096 to set it up — most Newcastle cul-de-sacs have open driveway parking
      so there's no coordination needed on your end."
  - q: "What fixture brands do you work with for Newcastle bathroom remodels?"
    a: "Kohler and Moen handle most rough-in valve replacements and faucet installations.
      For higher-end Newcastle master baths, Kohler's Veil wall-hung toilet and DXV or Brizo
      fixtures are common choices. Rinnai and Navien tankless water heaters come up often when
      a gut remodel exposes an undersized or aging water heater that needs replacement."
  - q: "What does a full bathroom remodel cost and how long does it take in Newcastle?"
    a: "Full master bath gut-and-rebuild in Newcastle typically runs 6–10 weeks from permit
      approval to blue tape walkthrough. Newcastle's permit office usually takes 3–5 weeks
      for plan review on bathroom work with plumbing or structural changes. Project costs
      range $30K–$80K+ depending on scope. Vladislav provides a fixed-price contract with
      deadline penalties written in — not a verbal promise."