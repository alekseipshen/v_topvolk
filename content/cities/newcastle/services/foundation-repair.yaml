  - q: "Do I need a permit for foundation work in Newcastle?"
    a: "Most structural foundation repairs — post replacement, seismic retrofit, and stem wall work — require a permit through the City of Newcastle building department, which follows IRC and current WA seismic code for anchor bolt spacing and shear wall requirements. Plan review typically takes 2-4 weeks, and inspections happen at rough-in (before it's covered) and again at final. TopVolk prepares the permit drawings and schedules both inspections as part of the project, and as a WA Licensed Contractor we pull the permit under our own name so you're not the one navigating city review."
  - q: "How do you level a sagging floor without cracking the drywall upstairs?"
    a: "We jack slowly — typically no more than 1/8 inch per day per point — using screw jacks on temporary posts set on new concrete footings, which gives the framing time to move without stressing the drywall seams above. Once the floor system is back to level, we sister in the permanent PT post with a galvanized post base and add blocking between joists for lateral stability. Rushing this step is the main reason DIY jacking cracks tile or drywall; going slow is the whole trick."
  - q: "How long does a crawlspace repair actually hold up in this climate?"
    a: "Pressure-treated posts on new concrete piers with proper hardware are rated for ground contact and typically last 40+ years even with Newcastle's wet fall-to-spring season. Epoxy crack injections are permanent as long as the water source that caused the crack gets redirected — that's why we always pair injection with grading or drainage. The one wear item is a sump pump, which usually needs replacement every 7-10 years. TopVolk backs structural repairs with a workmanship warranty and explains exactly what's covered before the contract is signed."
