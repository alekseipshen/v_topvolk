title: "Newcastle Deck Installation — Hillside, King County"

intro: |
  Coal Creek Natural Area cuts through Newcastle, and 98059's ridge terrain means most back
  yards drop 8 to 15 feet off the back of the house — exactly where a multi-level deck adds
  real livable space. The 1990s custom builds along Newcastle Way and Coal Creek Parkway are
  hitting end of life on original pressure-treated lumber decks: soft boards, low guardrails,
  ledger boards attached without proper flashing. Trex and TimberTech composite hold up to
  PNW rain far better than cedar on north-facing exposures.

localContext: |
  Newcastle's housing stock runs mostly late-1980s through early-2000s custom and tract builds —
  hillside neighborhoods off Coal Creek Parkway, Ridge Drive, and 112th Avenue SE are typical.
  Zip code 98059 covers the core residential area; 98056 clips the western edge. These homes
  commonly have attached decks where the original ledger board was fastened directly to the
  rim joist with no flashing membrane — a deficiency under current IRC standards and a moisture
  path that silently rots dimensional framing. Replacing those decks requires King County DPER
  permits and a mandatory ledger flashing inspection before framing proceeds.

commonProblems:
  - title: "Rim Joist Rot Behind Old Ledger Boards"
    description: "Homes built in Newcastle before 2000 frequently have ledger boards lag-bolted
      straight through siding into the rim joist with no flashing or standoff. Twenty-plus rainy
      Seattle winters later, that connection is often the wettest spot in the whole framing
      package. TopVolk opens every old ledger connection on replacement projects, assesses the
      rim joist condition, and installs butyl-tape or Schluter flashing before reattaching —
      the step that passes King County DPER's rough-in ledger inspection."
  - title: "Post Footings That Never Reached Frost Line"
    description: "Sloped Newcastle lots mean posts carry real vertical load across significant
      height changes. Footings need to reach frost line — 12 to 18 inches minimum in King County —
      and posts must use ground-contact pressure-treated (PT) lumber rated for direct soil exposure.
      Undersized footings on fill soil shift over time and pull the deck frame with them. King County
      DPER requires a footing inspection before concrete is poured, so there's no skipping this."
  - title: "Guardrail Height and Stair Stringer Code Gaps"
    description: "Any deck surface 30 inches or more above grade requires guardrails at least
      36 inches high per IRC code — and a lot of early-1990s Newcastle decks fall short of that.
      Stair stringers need correct rise-to-run ratios and a graspable handrail on at least one
      side. These deficiencies show up on home inspections and block a King County DPER final
      inspection from closing. A Trex or TimberTech rebuild corrects all of it in one scope."

