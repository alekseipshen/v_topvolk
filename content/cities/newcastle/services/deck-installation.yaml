  - q: "Trex or TimberTech — which composite deck material holds up better in Newcastle's climate?"
    a: "Both handle PNW rain well on decks with full winter exposure. TimberTech Legacy runs
      slightly firmer underfoot; Trex Transcend has wider local stock availability and a 25-year
      warranty. North-facing surfaces in 98059 moss over fast — composite wins over cedar there
      every time. Samples come to the consultation so you can compare boards in person."
  - q: "What does a deck replacement cost, and how does the King County permit process work?"
    a: "A straightforward attached deck replacement in Newcastle typically runs $18K–$45K depending
      on size, materials, and whether post footings need full replacement. King County DPER plan
      review takes 3–6 weeks; required inspections cover footings, ledger flashing, rough framing,
      and final. Total timeline: 8–14 weeks from permit application to completion. TopVolk pulls
      and manages all permits as WA Licensed Contractor — 100+ projects completed since 2023,
      with deadline penalties written into every contract."