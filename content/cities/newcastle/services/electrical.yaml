localContext: |
  Newcastle sits across zip codes 98056 and 98006, and the housing stock splits pretty cleanly by decade — split-level and daylight ranch homes from the 1970s and 80s clustered around May Valley and Coal Creek Parkway, and larger custom builds from the 2000s onward near the Golf Club at Newcastle and Lakemont-adjacent hillsides. The older stock is where panel capacity becomes a real problem: a lot of those homes still run 100A service, sometimes with aluminum branch circuit wiring from the 1965-1973 window, feeding a kitchen that's since been remodeled with a Thermador range and a Bosch dishwasher. Electrical permits in Washington don't route through a city building department — they go through WA L&I (Labor & Industries) as the AHJ for electrical work statewide, separate from any city permit for the remodel itself. PSE (Puget Sound Energy) serves Newcastle's grid, and any service upgrade above 200A or a meter relocation needs coordination with their service planning department before L&I will sign off on the rough-in inspection.

commonProblems:
  - title: "100A panels can't carry an EV charger plus an induction range"
    description: "A lot of Newcastle homes built in the split-level boom still run a 100A meter-main panel — often a Federal Pacific or early Square D unit — sized for a gas range and a dryer, nothing else. Add a 50A circuit for a Tesla Wall Connector or ChargePoint unit and a 240V induction range, and the math doesn't clear a proper load calculation under NEC 220. The fix is a 200A service upgrade: new meter-main combo panel, upsized service entrance cable, and a permit through WA L&I. Budget $3,500-$6,500 depending on whether the service drop from PSE also needs upgrading. Turnaround is usually 5-10 business days including inspection scheduling."
  - title: "Aluminum branch wiring in 1965-1973 construction"
    description: "Homes built in that eight-year window sometimes used aluminum branch circuit wiring instead of copper, and it's a known fire risk at outlet and switch connections due to oxidation and thermal expansion — not something to leave alone during a kitchen or bath remodel near May Valley. TopVolk fixes this with AlumiConn connectors or copper pigtailing at every device box, not a full rewire, which keeps cost reasonable. A typical whole-house pigtail job runs $2,800-$4,500 depending on outlet count. It's the kind of thing an inspector will flag anyway if it surfaces during a panel swap, so addressing it upfront avoids a second trip."
  - title: "Panel swaps need L&I permits and PSE coordination, not a handshake"
    description: "Any service panel replacement in Newcastle requires an electrical permit through WA L&I — the city doesn't issue these, even though Newcastle has its own building department for structural work. If the upgrade bumps service size, PSE has to schedule the meter change and sometimes the transformer capacity gets checked too, which can add a week or two to the timeline if it's not flagged early. TopVolk pulls the L&I permit, schedules the PSE coordination call, and handles the rough-in and final inspection sign-off directly — WA Licensed Contractor, no separate electrician subbed in without the homeowner knowing. Call (206) 591-1096 and Vladislav will walk through the permit sequence on-site."
  - title: "EV charger circuits cost more than a Level 2 unit alone"
    description: "A JuiceBox or ChargePoint charger itself runs $500-$700, but the circuit is the real cost driver — a dedicated 50A or 60A breaker, 6-gauge copper wiring run from the panel to the garage, and sometimes a subpanel if the main panel is already full of breakers. In Newcastle that's typically $1,200-$2,800 for the circuit work alone, more if the garage is detached or the panel's on the opposite side of the house. Homes near the Golf Club at Newcastle with finished garages sometimes need drywall patching after the wire run, which TopVolk quotes as a line item, not folded into a vague estimate."
  - title: "AFCI/GFCI code gaps get caught at resale, not before"
    description: "Current NEC requires AFCI protection on most bedroom and living space circuits and GFCI protection in kitchens, baths, and garages — a lot of Newcastle homes built before 2008 have neither, and it surfaces during a home inspection when the house goes on the market. Swapping standard breakers for AFCI/GFCI combo breakers (Square D QO or Siemens, depending on panel brand) runs $150-$250 per circuit including labor. LED recessed retrofit work often triggers this too, since dimmer-compatible cans in a bedroom now need AFCI coverage under current code. It's a same-day fix if the panel has room; a subpanel add if it doesn't."

