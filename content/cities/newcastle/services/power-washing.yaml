title: "Newcastle Power Washing — Moss Off Roofs Near Lake Boren"

answer: "Power washing in Newcastle, WA costs $250-$600 per job, with crews on-site in 2-3 days and moss/algae removal guaranteed through the next dry season."

intro: |
  Ask five homeowners near The Golf Club at Newcastle what's growing on their roof edge every February and four will say the same black-green streaks — that's Gloeocapsa magma algae, not dirt, and a garden hose won't touch it. Power washing in Newcastle solves that directly: a soft-wash treatment (low pressure, a diluted sodium hypochlorite mix) strips the growth off asphalt shingles and Hardie siding without lifting granules or cracking fiber cement, and most single-family jobs here run $250 to $600 depending on square footage and how much of the roofline faces north. Homes tucked under tree cover near Lake Boren Park hold onto moisture longer than lots out toward May Valley, so growth shows up faster on that side of town. A Trex composite deck off the back of a house near Newcastle Beach Park still needs an annual rinse — algae grows on composite decking too, just slower than on cedar. Call (206) 591-1096 for a same-week estimate before the fall rains start stacking up again.

localContext: |
  Newcastle's housing stock splits pretty cleanly by era. Around 98059, along May Valley and up toward the lower slopes near Cougar Mountain, you'll find 1980s and '90s daylight-basement homes with cedar or T1-11 siding that's usually overdue for a wash-and-recoat cycle. Closer to 98056 and the golf course, homes built from the late 1990s through the 2000s lean toward Hardie plank siding and stucco accents, paver driveways, and stamped-concrete patios built around in-ground pools and outdoor kitchens with built-in Viking or Wolf grills. Newer developments near The Golf Club at Newcastle often sit inside a homeowners association with architectural guidelines that dictate cleaning frequency and pressure limits on stucco. Tree cover is heavy through May Valley and around Lake Boren Park, so roofs and north-facing siding stay damp two or three extra days after a storm — exactly the setup Gloeocapsa magma algae and moss need to take hold. Anything near Coal Creek or May Creek also picks up more silt and organic debris on driveways after heavy rain events.

commonProblems:
  - title: "Moss and Black Algae Streaks on North-Facing Roofs"
    description: "Roof edges facing north under the tree cover near Lake Boren Park stay wet the longest, and that's where Gloeocapsa magma algae and moss get a foothold in the asphalt shingle granules. Left through one more wet season, moss roots work under shingle tabs and lift them, turning a $400 cleaning job into a $12,000 re-roof. The fix is a soft-wash: a low-pressure rig running under 100 psi with a sodium hypochlorite and surfactant mix, not a gas pressure washer blasting the roof at 3,000 psi, which strips granules and voids most shingle warranties. We follow with a zinc sulfate treatment along the ridge to slow regrowth. Most single-story roofs run $350-$550 and take under three hours."
  - title: "Cedar Deck Graying and Tannin Bleed Before Staining"
    description: "Cedar decking off the back of homes near May Valley turns silver-gray within a year or two once the UV layer wears through, and any stain applied over that grayed layer peels within months. Before staining, the deck boards need an oxalic acid brightener wash to pull tannin bleed and mildew staining out of the grain, followed by a rinse at 500-800 psi with a 15-degree tip — enough to lift grime without fuzzing the wood fibers. Skip this step and a Sikkens or Cabot semi-transparent stain looks patchy within one summer. Deck prep runs $2-$4 per square foot, and we check the joist and ledger board underneath for rot while we're down there. A 300 square foot deck typically runs $450-$700 for wash and brightening alone."
  - title: "Hardie Siding and Stucco Cleaning Under HOA Rules"
    description: "The newer construction around The Golf Club at Newcastle carries HOA architectural guidelines that spell out how often siding gets washed and what pressure is allowed on stucco control joints. James Hardie's own warranty language calls for washing every 12-24 months but caps pressure at low-flow soft-wash settings — a straight blast from a surface cleaner attachment can drive water behind the fiber cement panels and rot the sheathing underneath. Stucco needs even more restraint; too much pressure opens hairline cracks around window trim that then need caulking before repaint. Our estimates note the HOA-required PSI ceiling in writing, and any job tied to a repaint or reside falls under our WA Licensed Contractor scope, so one license covers both the cleaning and the finish work. Turnaround for a typical 2,400 square foot exterior is one day."
  - title: "Driveway Oil Stains and Tire Marks — What Actually Removes Them"
    description: "Cold water and a rental pressure washer will move loose dirt off a concrete driveway but won't touch old oil stains or the black tire rubber left at turn radiuses near the garage. That needs a hot water unit — 200°F plus 3,000-4,000 psi — paired with a degreaser cutting the oil loose before a surface cleaner attachment lifts it out of the concrete's pores. Pricing runs $0.20-$0.35 per square foot for a driveway and walkway combined, so a typical 800 square foot drive lands around $200-$300. Older concrete near 98059 sometimes shows efflorescence, that white mineral haze, which adds time. We quote a flat number after walking the site — not a range — on jobs we've handled as part of 100+ projects completed since 2023."
  - title: "Fence and Paver Patio Buildup Before the Next Stain Cycle"
    description: "Cedar picket and PT lumber fences on the typical 3-5 year stain cycle around here get a skin of algae and dirt baked into the grain long before the stain actually fails — washing first means the new coat bonds instead of sitting on top of grime. Paver patios, especially ones built around outdoor kitchens with a Sub-Zero or Bosch built-in fridge, collect organic buildup in the joints that breaks down polymeric sand and lets weeds root between pavers. A proper wash flushes the joints clean, and we recommend re-sanding with fresh polymeric sand and resealing every 2-3 years to keep pavers locked tight. Fence washing runs $1.50-$2.50 per linear foot; paver restoration runs $0.75-$1.25 per square foot including new sand. Expect the wash to hold 12-18 months before regrowth shows again in our wet winters."

