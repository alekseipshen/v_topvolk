  - q: "Do I need HOA or permit approval for power washing in Newcastle?"
    a: "Most exterior cleaning doesn't need a City of Newcastle or King County permit, but homes inside The Golf Club at Newcastle or other HOA-governed developments often require advance notice or a pressure-limit sign-off before work starts, especially on stucco. If the job is tied to a repaint or siding replacement, that falls under our WA Licensed Contractor scope, and we pull any required permit through the applicable jurisdiction ourselves. Straightforward wash jobs typically clear HOA review within a few days once we submit our standard scope letter. We've handled this paperwork across 100+ projects since 2023, so it's rarely a holdup."
  - q: "Will pressure washing damage my Hardie siding or stucco?"
    a: "Not if it's done at the right pressure. We soft-wash Hardie plank and stucco under 500 psi with a wide fan tip and a mild sodium hypochlorite mix, which lifts algae and mildew without driving water behind the panels or opening hairline cracks at control joints. A straight blast from a surface cleaner attachment meant for concrete is the wrong tool for siding — that's how houses end up with hidden water intrusion behind the sheathing. We test a small hidden section first on any stucco job before touching the rest of the house."
  - q: "How long does a power wash last in Newcastle's climate?"
    a: "Expect 12-18 months on roofs and siding before moss or algae starts showing again — our wet winters, roughly 37 inches of rain a year, most of it October through May, push regrowth faster on shaded, north-facing surfaces than on sunny elevations. Decks and fences hold clean longer if sealed right after washing, sometimes a full 2 years. We guarantee the moss treatment through one full wet season; if it comes back early on a treated roof, we come back at no charge. Trex composite decking holds up longer between washes than bare cedar."
