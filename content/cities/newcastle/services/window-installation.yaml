localContext: |
  Newcastle splits across 98056 and 98059, and the housing stock reflects two very different building eras. Closer to Coal Creek Parkway and the older residential pockets, you'll find 1960s-80s ranch and split-level homes with original aluminum-frame single-pane windows — thermally terrible, prone to seal failure, and often out of square after 50 years of settling. Up toward the golf course and the newer plats near Newcastle Commons, houses built after 2000 already meet a decent energy code baseline but frequently have builder-grade vinyl units that fog out or fail their seals within 15-20 years. Either way, retrofit window work in unincorporated pockets near Newcastle can fall under King County DPER jurisdiction depending on the parcel, while incorporated Newcastle addresses go through the city's own building permit desk — we check the parcel before quoting so there's no surprise mid-project. Rain exposure matters too: north and west-facing elevations near May Creek and the Cougar Mountain foothills take the brunt of the wet season, so flashing detail isn't optional here. We've also seen sill rot on homes backing up to the greenbelt trails off Lake Boren Park, where tree cover keeps siding damp longer after a storm passes through.

commonProblems:
  - title: "Foggy double-pane glass near Newcastle Golf Club"
    description: "Insulated glass units (IGUs) lose their argon fill and desiccant seal over time, and the fog you see between the panes means moisture got into the airspace — the glass itself is fine, the seal isn't. Once the argon percentage drops below spec, you also get thermal bridging right at the sightline, which is why that band of glass feels colder than the center of the pane. This shows up constantly on south and west-facing units in the newer homes near the golf course, usually 12-18 years after original install. We replace the sash or full unit rather than trying to reseal it, since resealing an IGU isn't a real fix. A Milgard Tuscany vinyl replacement runs about $850-$1,100 per window depending on size and grid pattern, installed in a day for a standard opening."
  - title: "Egress window shortfalls in daylight basements"
    description: "A lot of the split-level and daylight-basement homes off Coal Creek Parkway have below-grade bedrooms that were finished after the original build, and the window openings don't meet current egress code — IRC requires a minimum 44-inch sill height and a clear opening of at least 5.7 square feet. We cut and reframe the rough opening, install a proper window well if it's below grade, and set an egress-rated vinyl or fiberglass unit that actually opens wide enough for a firefighter in gear to get through. This job runs $2,800-$5,500 depending on whether we're cutting concrete foundation wall or working with an existing wood-framed opening. Permit and inspection are required — we pull it, you don't have to."
  - title: "Permit routing between King County and Newcastle city limits"
    description: "Not every Newcastle address falls under the same authority having jurisdiction, and that trips people up. Parcels still in unincorporated pockets near May Valley run through King County DPER, while properties inside city limits go through Newcastle's own permit desk — the plan review timeline and inspection scheduling differ between the two. Full-frame window replacement on more than a handful of openings, or any egress work, typically needs a permit either way; simple insert replacements in the same rough opening sometimes don't. TopVolk Construction is a WA Licensed Contractor, and we confirm the correct AHJ before we ever write a quote, so the rough-in and final inspection get scheduled with the right office the first time."
  - title: "What drives the price on a whole-house window job"
    description: "A typical Newcastle whole-house replacement — 12 to 18 windows — runs $14,000-$32,000, and the spread comes down to frame material, glass package, and how much rot repair we find at the sill and rough opening once the old unit's out. Vinyl from Milgard is the value play; fiberglass from Marvin or Pella costs more upfront but holds paint and shape better through our freeze-thaw swings up toward Renton and the foothills. Triple-pane glass adds roughly 15-20% over standard double-pane but earns it back on the I-405-facing side of the house through both energy loss and highway noise. Every quote is line-item — frame, glass package, flashing, labor — not a vague range, and we write a deadline penalty into the contract."
  - title: "When to repair vs. replace a failing window"
    description: "If the frame and flashing are sound and only the glass has failed, we can swap just the IGU or sash — cheaper, faster, usually done in an afternoon. But once you've got soft wood at the sill, a cracked ledger where the frame meets the rough opening, or vinyl that's gone brittle and chalky from UV exposure, full-unit replacement is the only real fix. Vinyl windows in this climate run 20-25 years before seal failure becomes common; fiberglass frames from Marvin or Pella can push past 30 with proper maintenance. We check flashing and weather barrier condition on every service call near Newcastle, since a failed flashing detail rots the rough opening long before the glass itself gives out. Call (206) 591-1096 if you're seeing soft trim or bubbled paint at the sill — that's usually the first sign."

