title: "Newcastle Kitchen Remodel — Open-Concept Builds in 98059"

intro: |
  The hillside neighborhoods along Coal Creek Parkway in 98059 carry some of the highest
  household incomes in King County — with kitchens that often don't match. Homes from the
  late 1980s through the 1990s were built with closed layouts that weren't designed for a
  Wolf 36-inch range or a Sub-Zero refrigeration column. Getting there takes structural and
  electrical work, not just new cabinets. Vladislav Volkov has handled those conversions
  across Newcastle since 2023 — WA Licensed Contractor, 100+ projects completed, direct
  quote with no sales middlemen.

localContext: |
  Newcastle incorporated in 2003, but most of the housing stock dates from 1985–2005 —
  two-story colonials and split-levels climbing the slopes above Lake Boren and Newcastle
  Golf Club. Zip code 98059 includes many homes built before 200-amp electrical service was
  standard practice. The May Valley corridor and the neighborhoods east of Coal Creek Pkwy
  were developed in waves, so you'll find 1988 homes sitting next to 2002 builds with
  very different panel specs. Seattle's 37 inches of annual rainfall accelerates moisture
  damage behind older tile backsplashes and poorly flashed window rough-ins — problems that
  surface during a kitchen gut. A Bosch induction cooktop, Miele dishwasher, and wine
  column can easily push a 100-amp panel into NEC violations before you've bought a
  single cabinet. Permit applications for structural kitchen work go to the City of
  Newcastle building department — separate from King County DPER, which handles
  unincorporated parcels just outside the city limits.

commonProblems:
  - title: "Load-Bearing Wall Between Kitchen and Great Room"
    description: "Late-1980s and 1990s Newcastle homes often have a load-bearing wall
      closing the kitchen off from the living area. Removing it means engineering an LVL
      beam — typically a 3-ply 9.5-inch or deeper — backed by a stamped structural
      engineer's letter. City of Newcastle plan review for structural work runs 4–8 weeks;
      the rough-in inspection happens mid-project, and a final inspection closes the permit
      before occupancy. Skipping the engineer's letter means a failed inspection and a
      re-opening of walls."
  - title: "Undersized 100-Amp Service for Modern Appliance Loads"
    description: "A Wolf dual-fuel range, Sub-Zero refrigeration column, and Bosch
      dishwasher can collectively draw close to 60 amps at peak. Homes in 98059 built
      before 1995 commonly have 100-amp panels that can't handle that without breaker trips
      and NEC code violations. A 200-amp service upgrade is the fix — permitted and
      inspected through the City of Newcastle building department. The electrical rough-in
      gets inspected before drywall closes; the service upgrade gets its own final."
  - title: "Panel-Ready Appliance Fitment Requires Exact Cabinet Sizing"
    description: "Thermador, Sub-Zero, and Miele refrigerators in panel-ready
      configurations sit 24 inches deep with the overlay, versus a standard 30-inch unit.
      That 6-inch difference reshapes the entire cabinet run on the refrigerator wall.
      Semi-custom cabinet boxes have to be specified to exact dimensions before ordering —
      adjusting after the appliance arrives means reordering boxes and blowing the
      schedule. Blocking behind the overlay panel also needs to be framed in during rough
      carpentry, not retrofitted after drywall."

