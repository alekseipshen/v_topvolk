  - q: "What does a full kitchen remodel cost in Newcastle and how long does it take?"
    a: "Full kitchen remodels in 98059 — cabinets, countertops, appliances, LVL beam work,
      200-amp electrical upgrade — typically run $80K–$150K depending on scope. Construction
      runs 6–10 weeks after permits clear. City of Newcastle plan review for structural work
      adds 4–8 weeks up front. Call (206) 591-1096 for a line-item quote; deadline
      penalties are written into the contract."
  - q: "Do Newcastle kitchens need special permits compared to Seattle or Bellevue?"
    a: "Newcastle has its own building department — it's a separate jurisdiction from
      King County DPER and from Seattle SDCI. For a kitchen remodel involving structural
      work or a 200-amp service upgrade, you're pulling permits through Newcastle directly.
      Turnaround on plan review is generally faster than Seattle's 4–12 week window, but
      the inspection sequence is the same: rough-in before drywall, final before occupancy.
      Unincorporated parcels just east of the city limits fall under King County DPER
      instead — worth confirming your jurisdiction before the permit application goes in."