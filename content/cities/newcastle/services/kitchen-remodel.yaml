  - q: "Do you work with Wolf, Sub-Zero, and Thermador appliances in Newcastle kitchens?"
    a: "Yes. Wolf ranges, Sub-Zero columns, Thermador dishwashers, Miele steam ovens, Bosch
      panel-ready units — standard ask in 98059. Electrical rough-in sizing, cabinet
