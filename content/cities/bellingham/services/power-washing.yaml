title: "Bellingham Power Washing — Moss Removal & Exterior Surface Prep"

intro: |
  The north-facing roofs in Fairhaven collect visible moss by November most years. Bellingham
  averages close to 35 inches of rain annually, and the neighborhoods around Chuckanut Drive
  see additional moisture off Bellingham Bay — enough that cedar decks stay wet from October
  through April without drying out between storms. A surface that wet cannot accept Defy
  Extreme Wood Stain or any penetrating sealer until it's been properly cleaned and allowed
  to dry. Organic matter left on the substrate blocks product adhesion, and stain applied
  over moss rhizoid residue peels in a single season. TopVolk handles power washing as
  exterior prep on renovation projects — decks, driveways, Hardie siding, and fencing
  before painting, staining, or structural work begins. Vladislav handles the assessment
  directly, not a sub you've never met. He'll tell you what the surface needs before
  quoting the cleaning and what follows it.

localContext: |
  The residential housing stock in 98225 skews older — Fairhaven and the Sehome
  neighborhood have homes dating from the early 1900s through the 1920s, with original cedar
  siding or Hardie fiber cement applied during the 1990s and early 2000s retrofit wave. Those
  surfaces absorb moisture differently than the vinyl-sided new construction in the Cordata
  corridor (98226), and they require softer wash pressure to avoid damaging fiber or wood
  grain. Cedar that's been stained repeatedly over two decades develops a product-buildup
  layer that traps moisture and accelerates gray weathering. The 98229 zip code along the
  Lake Whatcom corridor holds a lot of mid-century ranchers on sloped lots — concrete
  driveways poured in the 1960s and 70s that are porous enough for motor oil to bond
  into the aggregate within days of a spill. Flat-surface cleaning here needs hot water
  extraction, not just pressure, to actually pull bound oil out of the aggregate before
  any driveway sealer goes on.

commonProblems:
  - title: "Moss-Covered Cedar Decks Failing Before Restain — Soft Wash Prep Required"
    description: |
      Cedar deck moss in Bellingham isn't cosmetic. Moss rhizoids — the root-like filaments
      that anchor the plant — penetrate wood cell walls and break down fiber over time. A deck
      that looks dark green from the street is often soft and gray underneath when you press a
      screwdriver into the surface. Before applying Armstrong Clark or Defy Extreme stain,
      that growth has to be dead and removed — not just blasted off with pressure. High
      pressure alone doesn't kill spores. The correct sequence: sodium hypochlorite solution
      at 1:10 dilution, 10-15 minute dwell time, then rinse at 400-600 PSI using a 40-degree
      tip. After rinsing, the deck needs 48-72 hours to dry in Bellingham's humid climate
      before any oil-based product goes on. Rushing that dry window is how stain jobs fail
      in a single PNW season.

  - title: "Hardie Siding Streaking Before Exterior Repaint — Algae at Caulk Joints"
    description: |
      James Hardie fiber cement holds exterior paint well under normal conditions. In
      Bellingham's wet climate, though, the caulk joints at window trim and corner boards
      collect algae, and the streaks run down panel faces in dark vertical lines. Painting
      directly over those streaks means the new coat won't bond at the substrate and will
      peel within two winters. The cleaning sequence matters: sodium percarbonate solution
      (not chlorine bleach, which can damage the Hardie factory prime coat), rinsed at
      500-800 PSI from a 40-degree tip to avoid chipping at panel edge reveals. Siding
      then needs 24-48 hours of dry time. Sherwin-Williams Duration Exterior primer requires
      substrate moisture below 15% — skipping the moisture check is how paint jobs fail in
      their first season. The prep cost is a fraction of having to repaint two years early.

  - title: "Oil-Saturated Concrete Driveways in Older Bellingham Neighborhoods"
    description: |
      The 1960s-70s concrete pours in the Lake Whatcom corridor (98229) and older Sehome
      blocks are porous enough that motor oil bonds into the aggregate within days of a spill.
      Cold water at high pressure shifts surface dirt but doesn't break the oil-substrate
      bond. Hot water extraction at 180-200°F with a degreaser — ZEP Heavy-Duty Degreaser
      or Simple Green Pro HD for older set stains — is required to pull oil out of the
      aggregate. Technique matters as much as temperature: use a surface cleaner attachment
      at 2,500-3,000 PSI rather than a single wand, which leaves tiger-stripe pressure marks
      on flat concrete. After extraction and rinsing, a penetrating siliconate sealer
      (Ghostshield Lithi-Tek 4500 or equivalent) closes the surface pores before the
      driveway goes back into daily use. A two-car driveway typically takes 2-3 hours of
      cleaning plus 4-6 hours dry time before vehicle access.

  - title: "Cedar Fence Cleaning Before Staining — PNW's 3-5 Year Maintenance Cycle"
    description: |
      Cedar board-on-board privacy fencing in Bellingham's 98225 neighborhoods — Fairhaven,
      Sehome, the Lettered Streets blocks — often dates from the late 1990s through mid-2000s.
      That wood is now 20-25 years old. Multiple rounds of Cabot Australian Timber Oil or
      Armstrong Clark stain have built up on the surface, trapping moisture and causing
      patchy gray weathering. Stripping the old product requires an oxalic acid-based
      cleaner (sodium percarbonate deck cleaner at 8 oz per gallon), applied and rinsed
      after a 15-minute dwell. Pressure on thin cedar pickets stays below 1,200 PSI —
      anything higher splits grain and raises splinters that catch a stain brush unevenly.
      The cleaning step reveals which boards need replacement before product application.
      Catching a few failed pickets during cleaning is far cheaper than discovering them
      after the stain is already on.

  - title: "Patio and Paver Organic Buildup — Joint Degradation and Lichen Etching"
    description: |
      Concrete pavers and natural stone patios in Bellingham backyards collect moss and
      lichen at the joints and surface texture across every wet season. Lichen is harder
      to address than moss — it secretes oxalic acid that etches stone at a molecular level
      and bonds to the substrate more aggressively than surface algae. Cleaning pavers
      requires a 15-degree spray tip at 1,500-2,000 PSI, working parallel to the joint
      lines — cross-spray technique washes joint sand out and causes settling and paver
      wobble over time. After cleaning, polymeric joint sand (Techniseal HP Polymeric Sand
      is a standard product for this application) gets swept into the joints, compacted, and
      activated with a light water mist before the first hard rain. The clean-and-resand
      sequence restores proper drainage and removes the slip hazard that wet organic growth
      creates on any flat paver surface through Bellingham's long wet season.

