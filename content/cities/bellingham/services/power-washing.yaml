  - q: "What does power washing cost for a typical Bellingham home?"
    a: |
      Flat concrete surfaces — driveways, walkways, patios — run $0.08-$0.15 per square foot.
      A two-car driveway (450-600 sq ft) comes to $75-$150. Cedar deck cleaning with soft-wash
      moss removal and pre-stain prep runs $0.20-$0.35 per square foot — a 400 sq ft deck
      lands at $180-$280 depending on moss severity and whether oxalic acid treatment is
      needed for old stain buildup. Hardie siding washing is priced by elevation and linear
      footage. Multi-surface packages covering siding, deck, fence, and driveway together
      get quoted as a single scope. Exact pricing comes after Vladislav walks the property.
      Call (206) 591-1096 for a free on-site estimate with line-item pricing.

  - q: "Do I need a permit for power washing or exterior cleaning work in Bellingham?"
    a: |
      Power washing itself doesn't require a building permit in Bellingham or Whatcom County.
      The work that typically follows it — exterior repainting, deck staining, fence
      replacement, structural deck repairs — may require permits depending on scope.
      Bellingham's permit process runs through the City of Bellingham Development Services
      Center; deck replacements above certain square footage and any structural changes
      require plan review. If TopVolk is managing the full renovation scope that includes
      surface prep, permit research is handled upfront. TopVolk is a WA Licensed Contractor
      — the general contractor license covers both the prep work and the structural or
      finish work that follows. Better to confirm requirements at the start than discover a
      missed inspection mid-project.

  - q: "What's the difference between soft wash and pressure wash — which does my surface need?"
    a: |
      Soft wash runs at 200-500 PSI combined with a surfactant-based cleaning solution — it
      kills organic growth at the root rather than just dislodging surface material. High-
      pressure wash (2,500-3,500 PSI) is for concrete and brick where mechanical abrasion
      is needed to break surface bonds. Cedar siding, wood fencing, and fiber cement board
      can't handle high pressure — Hardie's installation specs call for no more than 500 PSI
      at the surface. The nozzle tip matters as much as the PSI setting: a 0-degree tip
      concentrates enough force to cut wood grain; a 40-degree tip diffuses it safely.
      Roof washing on Bellingham's heavily moss-loaded north-facing slopes should always be
      soft wash — pressure washing asphalt shingles strips granules and voids the manufacturer
      warranty outright.

  - q: "How long does exterior cleaning prep last before I need to redo it?"
    a: |
      Service life depends on surface type and climate exposure. Cedar decks in Bellingham
      need cleaning every 3-5 years before restaining — north-facing surfaces at the shorter
      end, south-facing with more sun at the longer end. Concrete driveways sealed with
      Ghostshield Lithi-Tek after cleaning typically resist re-staining for 2-4 years.
      Hardie siding cleaned and repainted with Sherwin-Williams Duration Exterior holds
      5-7 years before the next cycle. The cleaning prep is what makes those lifespans
      achievable. Without it, stain and paint failures happen in 1-2 seasons regardless of
      product quality. TopVolk prices surface prep as part of the total renovation scope —
      cleaning, prep, and finish application are coordinated rather than handed off between
      separate contractors.

