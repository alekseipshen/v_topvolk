  - q: "What does a full repipe cost in Bellingham?"
    a: |
      Pricing depends on house size, bathroom count, foundation type, and crawlspace access. A
      1,200-1,600 sq ft two-bath home in 98225 with a standard crawlspace typically runs
      $9,000-$16,000 for full PEX-A replacement of galvanized supply lines, including permit fees
      and inspections. Polybutylene replacement on a comparable 1980s home in 98226 usually runs
      $7,500-$13,000 — slightly less because the existing system is more accessible. Homes with
      partially finished basements, concrete slab sections, or tight mechanical rooms cost more.
      TopVolk provides free on-site estimates with fixed line-item pricing — not a vague range
      that shifts after work starts. WA Licensed Contractor, 100+ projects completed since 2023.

  - q: "Do you handle plumbing permits in Bellingham and Whatcom County?"
    a: |
      Yes — permit handling is part of the project scope, not an add-on. City of Bellingham
      addresses go through the City's Planning & Community Development online portal. Unincorporated
      Whatcom County parcels — including many Lake Whatcom corridor and rural Whatcom properties —
      go through Whatcom County Planning & Development Services. Water heater replacements, supply
      line rerouting, new drain rough-ins, and gas line modifications all require permits and
      inspections in both jurisdictions. Plan review for straightforward residential plumbing in
      Bellingham typically takes 2-4 weeks. As a WA Licensed Contractor operating across King,
      Snohomish, Pierce, Kitsap, and Whatcom counties, TopVolk is set up to pull and manage
      permits in each jurisdiction.

  - q: "Do you replace polybutylene pipe in Bellingham homes?"
    a: |
      Yes. Poly-b replacement is a standard scope on pre-1995 homes throughout the 98226 corridor.
      The gray flexible pipe — identifiable by its color and the metal or acetal crimp rings at
      fittings — fails at connections, not along straight runs. Under-sink supply valves, toilet
      connections, and water heater inlets go first. Full replacement with Uponor PEX-A is the
      correct long-term answer; partial replacement just shifts where the next failure occurs.
      TopVolk documents existing conditions, handles the permit application with Whatcom County
      Planning & Development Services or the City of Bellingham depending on your address, passes
      the rough-in inspection, and closes walls after sign-off. Timeline from permit submission
      to final inspection typically runs 4-6 weeks.

  - q: "What warranty does TopVolk provide on plumbing work?"
    a: |
      Labor on all plumbing installation carries a one-year warranty — any fitting failure or
      installation defect on work TopVolk performed gets fixed at no charge. Equipment warranties
      follow the manufacturer: Rinnai tankless units carry a 5-year parts and 10-12 year heat
      exchanger warranty depending on model registration; Navien NPE series runs similar terms.
      Moen and Kohler fixtures carry limited lifetime warranties on finishes and internal components.
      Uponor PEX-A pipe system warranty runs 25 years when installed per spec. What the warranty
      does not cover: pressure damage from unregulated supply above 80 psi (reason TopVolk
      recommends PRV installation on high-pressure lines), freeze damage on unheated exterior
      runs, and failures in existing plumbing that wasn't part of the contracted scope.

