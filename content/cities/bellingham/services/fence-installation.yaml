title: "Bellingham Fence Installation — Cedar, Vinyl & Post Depth"

intro: |
  Post rot along the fence line is how most fence projects in Bellingham get started. Houses
  in the Lettered Streets neighborhood — primarily Craftsman bungalows built between 1905
  and 1935 — have cedar fences from the late 1990s and early 2000s showing every sign:
  leaning posts, soft wood at ground contact, rail brackets pulling loose from the picket
  faces. Bellingham gets close to 35 inches of rain per year, and it runs hard from October
  through May. Posts set at 18 to 20 inches in the clay-heavy soil near Whatcom Falls Park
  don't survive that moisture cycle — water pools around the post base, the pressure-treated
  lumber gives out first where it contacts standing water, and the whole panel racks. Down in
  Fairhaven, where some lot lines trace back to an 1880s plat, a leaning fence creates
  neighbor-agreement issues on top of the structural ones. The material decision — cedar,
  CertainTeed vinyl, or composite boards — shapes post sizing, setting depth, and long-term
  maintenance cost. Getting that decision right before the first post goes in the ground
  avoids a repeat project in ten years.

localContext: |
  The 98225 zip covers most of Bellingham's older residential core — Sehome, the Columbia
  neighborhood, and the hillside streets climbing toward Western Washington University —
  where housing runs from early-1900s Craftsman to mid-century ranchers built through the
  1960s. Original fence posts on those properties were often rough-sawn fir driven into the
  ground without concrete, and what remains after 40-plus years is usually just a stump. The
  98229 zip runs south through Fairhaven and down to the Lake Padden area, where lot sizes
  increase and 1990s-to-2000s construction means builder-grade cedar fences are hitting the
  25-year failure window right now. Bellingham's fence code allows 6 feet on side and rear
  yards without a permit, and 4 feet in the front yard setback. Any fence-and-retaining-wall
  combination where the retained height exceeds 4 feet requires a permit through the City of
  Bellingham Development Services Center. HOA rules in neighborhoods like Barkley Village
  and some Cordata subdivisions add another layer — material type, color, and fence style
  often need board approval before installation begins.

commonProblems:
  - title: "Cedar Weathering vs. Vinyl Durability in Bellingham's Wet Climate"
    description: |
      Western red cedar fits Bellingham's Craftsman-heavy neighborhoods visually, but it
      demands maintenance. North-facing fence surfaces collect moss by year two in this
      climate, and mildew follows — working into the wood grain at the rail-to-picket
      connection points and accelerating rot before the structure visibly fails. Without a
      penetrating oil sealer applied every three to four years — TWP 1500 Series or Defy
      Extreme Wood Stain both hold up well through western Washington wet seasons — cedar
      pickets on exposed panels start checking and splitting around year five. Vinyl fence
      systems like CertainTeed's Bufftech line eliminate the maintenance cycle entirely, but
      they're more brittle in hard freezes, and Bellingham does get cold snaps that drop into
      the low 20s in January. Plan on $200 to $350 per treatment cycle for a 100-linear-foot
      cedar fence. Vinyl runs 15 to 20 percent higher upfront but drops long-term maintenance
      cost to essentially zero outside of annual washing.

  - title: "Post Setting Depth in Bellingham's Saturated Clay Soil"
    description: |
      Clay-heavy soil in Bellingham retains water all winter — the flatter sections of the
      98226 zip around Birchwood and Cordata drain especially slowly. Posts set at 24 inches
      in those areas start heaving within three to five winters as the saturated soil shifts
      under freeze-thaw cycles. Standard depth for a 6-foot privacy fence in Bellingham soil
      is 30 to 36 inches, with a concrete collar that sits at least 2 inches below finished
      grade so water doesn't pool at the post base. 4x6 or 6x6 pressure-treated posts handle
      lateral load better than 4x4 in saturated conditions — the larger bearing surface in
      the concrete resists the wind load that comes off Bellingham Bay on January storms. The
      cost delta is roughly $4 to $6 per post between shallow and proper-depth installation.
      Over a 100-linear-foot fence line with 18 to 20 posts, that's $80 to $120 extra upfront
      that directly buys a decade of additional post life.

  - title: "Permit Requirements for Fence-and-Retaining-Wall Combinations"
    description: |
      A straight fence 6 feet or under in Bellingham typically doesn't need a permit. Add a
      retaining wall component and that changes fast. Hillside properties in the Sehome Hill
      area and the slopes above 98225 commonly see grade drops of 2 to 5 feet across a
      backyard — and when a fence sits on top of a retaining wall, the City of Bellingham
      Development Services Center treats the combination as a structure. Retained height plus
      fence height together exceeding 4 feet triggers the permit requirement. Plan review
      runs 3 to 6 weeks for residential projects. The application package needs a site plan
      showing wall dimensions, fence location, and setback distances from the property lines.
      A WA Licensed Contractor handles permit application, site plan preparation, and
      inspection scheduling on your behalf. Skipping the permit risks a stop-work order if a
      neighbor calls it in, plus retroactive engineer sign-off that often costs more than the
      original permit fee.

  - title: "What Fence Installation Actually Costs in Bellingham"
    description: |
      Cedar privacy fence installation in Bellingham runs $35 to $65 per linear foot
      installed — posts, rails, pickets, concrete footings, and one standard walk gate
      included. Vinyl fence in the same profile runs $45 to $80 per linear foot. The main
      price drivers are slope (stepped panels on a hillside yard add 15 to 25 percent over
      flat-ground installation), gate count, and wood grade. A driveway gate with
      self-closing hinges and a Lokk-Latch Pro latch set adds $800 to $1,400 over the base
      fence cost. Tight-grain vertical western red cedar costs more per board than flat-sawn
      #2 cedar but lasts 5 to 8 years longer in Bellingham's moisture. A typical
      150-linear-foot privacy fence with two walk gates in a Birchwood or Lettered Streets
      backyard runs $5,500 to $9,500 depending on those variables. Line-item quotes after
      free on-site measurement — no phone estimates. Call (660) 999-9960 to schedule.

  - title: "Horizontal Slat Fences — Installation Details and Long-Term Durability"
    description: |
      Horizontal fence designs have become common in Fairhaven and parts of the Columbia
      neighborhood — they read well against both modern Pacific Northwest architecture and
      older Craftsman homes. The installation difference matters: each horizontal board's top
      edge collects debris and standing water, driving rot at the rail bracket connection
      points faster than a standard vertical privacy fence does. A minimum 1/4-inch gap
      between slats is critical for drainage through Bellingham's rain season. For longevity
      without the maintenance overhead, composite fence boards — Trex Transcend or TimberTech
      AZEK fence profiles — run as horizontal slats and won't rot at rail connections.
      Composite runs 30 to 40 percent more than cedar upfront but carries a 25 to 30-year
      manufacturer warranty. Gate hardware sees more racking stress on horizontal designs
      too — plan on a 6x6 PT gate post set at 42 inches minimum and commercial-grade
      self-closing hinges rated for at least 200 lbs per leaf to prevent early sag.

faq:
  - q: "How fast can you get to Bellingham for fence installation?"
    a: |
      Bellingham is about 85 miles north of Seattle via I-5 — roughly 90 minutes depending
      on traffic through Marysville and the Mount Vernon corridor. For estimates, we schedule
      Bellingham visits on designated days to keep travel costs off your quote. Once the
      estimate is accepted and materials ordered, lead time to start is typically 2 to 3
      weeks — summer and early fall book faster than that. A standard 150 to 200 linear foot
      cedar or vinyl fence installation runs 2 to 4 days on site. Permit projects add 3 to 6
      weeks of plan review time upfront, but installation itself stays in the same range.
      Call (660) 999-9960 to check current availability and schedule a free on-site estimate
      in Bellingham.

  - q: "What does fence installation cost per linear foot in Bellingham?"
    a: |
      Cedar privacy fence runs $35 to $65 per linear foot installed in Bellingham; vinyl runs
      $45 to $80. Both ranges cover posts, rails, pickets, concrete footings, and one walk
      gate. Slope adds cost — a yard dropping 18 inches across the fence line means stepped
      or raked panels, which adds 15 to 20 percent over flat-ground work. Additional gates
      with self-closing hardware add $800 to $1,400 per opening. Composite materials — Trex
      Transcend or TimberTech AZEK — run 30 to 40 percent more than cedar but carry 25 to
      30-year warranties against structural failure and fade. Quotes are line-item and fixed
      after a free on-site measurement. Call (660) 999-9960 to schedule yours.

  - q: "Do I need a permit for a new fence in Bellingham?"
    a: |
      Most fence replacements in Bellingham don't require a permit. A fence 6 feet or under
      on side and rear yards, or 4 feet or under in the front yard setback, falls under the
      standard exemption in Bellingham Municipal Code. The permit requirement applies to
      fence-and-retaining-wall combinations where total retained height exceeds 4 feet, and
      to any fence over 6 feet. Applications go through the City of Bellingham Development
      Services Center; residential plan review typically runs 3 to 6 weeks. Properties in
      unincorporated Whatcom County just outside city limits route through Whatcom County
      Planning and Development Services instead. A WA Licensed Contractor handles the permit
      application, site plan, and inspection scheduling — call (660) 999-9960 with your
      address and we'll confirm permit requirements before you commit to anything.

  - q: "Can you build a horizontal cedar or composite fence in Bellingham?"
    a: |
      Yes to both. Horizontal fence installations use the same post-and-rail framing as a
      standard privacy fence — typically 2x4 or 2x6 horizontal rails at 6-foot post
      spacing — with fence boards running parallel to the ground instead of vertical. Cedar
      works well in this format if boards are gapped at least 1/4 inch for drainage and
      treated with a penetrating oil on a 3 to 4-year cycle. Composite fence boards — Trex
      Transcend and TimberTech AZEK both make fence-specific board profiles — handle
      Bellingham's wet winters without treatment and won't rot at the rail bracket connection
      points. Trex carries a 25-year fade and stain warranty; TimberTech AZEK runs a 30-year
      warranty. Gate posts on horizontal designs need to be 6x6 PT set at 42 inches minimum
      to handle the racking load from longer horizontal panel spans.

  - q: "How long will a new fence last in Bellingham's climate?"
    a: |
      Cedar privacy fences installed with properly set posts and adequate drainage typically
      last 20 to 25 years in Bellingham before structural replacement. Individual pickets on
      a north-facing panel can show significant weathering by year 10 without maintenance —
      spot replacement runs $15 to $30 per picket and extends the overall fence life without
      a full tearout. Vinyl fence systems carry 20 to 25-year manufacturer warranties against
      cracking, fading, and discoloration. Composite fence boards from Trex and TimberTech
      AZEK carry 25 to 30-year warranties against fade, stain, and structural failure.
      Installations use pressure-treated posts rated UC4B for ground contact, concrete
      footings at 30 to 36 inches depth, and post caps on all cedar post tops to block
      end-grain water absorption — the single most common source of early post failure in
      Bellingham's wet winters.

  - q: "Do you cover areas outside Bellingham, and how far out are you scheduling?"
    a: |
      Coverage extends through most of Whatcom County — Ferndale, Blaine, Lynden, and Birch
      Bay to the north, and Burlington and Mount Vernon in Skagit County to the south.
      Current scheduling runs 3 to 5 weeks out during peak season from April through
      September, and typically 1 to 2 weeks out in fall and winter — which is solid timing
      for fence replacement since material deliveries run faster and the ground is workable
      through most of Bellingham's mild winters. Permit projects add the Development Services
      Center plan review timeline on top of the installation schedule, so starting the permit
      process early matters on those jobs. Call (660) 999-9960 to check availability for
      your zip code or get on the schedule before the spring rush hits.