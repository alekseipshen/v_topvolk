title: "Bellingham Carpentry — Craftsman Trim, Built-Ins & Cedar Repair"

intro: |
  The Lettered Streets district, running through the heart of 98225, holds blocks of Craftsman
  bungalows built between 1910 and 1930. Original fir window seats, built-in bookcases with
  glass-panel doors, picture-rail molding, three-piece base profiles — these are still standing
  in houses around Whatcom Falls Park and along the hillside blocks near Sehome. The problem: a
  century of northwest humidity has worked on the joinery. Miters open. Casing corners split at
  the back-band detail. Built-in shelves rack out of plumb as post-and-pier foundations flex
  through the seasonal wet-dry cycles. Down in Fairhaven — those Victorian and early Craftsman
  blocks near Village Square — the carpentry inventory shifts to steep stair runs with worn fir
  treads, decorative newel posts, and beadboard wainscoting that needs careful miter work to
  restore properly. This is finish carpentry work that requires matching century-old profiles,
  not cutting stock trim and calling it done. TopVolk Construction has handled exactly this type
  of carpentry project since 2017, with 100+ projects completed across King, Snohomish, Pierce,
  and Kitsap counties. Vladislav Volkov does the site visit himself, measures existing profiles,
  and writes a line-item quote. No sales staff. No vague ranges. Call (206) 591-1096 to
  schedule a free on-site consultation.

localContext: |
  Two zip codes cover most of Bellingham's older residential stock. 98225 includes Lettered
  Streets, York, and Happy Valley — predominantly 1910s to 1930s Craftsman and foursquare
  construction sitting on post-and-pier foundations common to that building era. Floors flex
  seasonally in these houses, and that movement shows up in door frames: a door that latched
  fine last winter starts dragging on the jamb by July. 98229 takes in Fairhaven and the Lake
  Padden area, with housing ranging from 1890s Victorian to 1940s construction — steeper stair
  runs, decorative exterior cornice trim, built-up base moldings with multiple profiles stacked
  together. Bellingham's climate runs wetter than the south Puget Sound — roughly 35–38 inches
  of rain annually, with persistent marine fog rolling in off Bellingham Bay from October through
  April. North-facing cedar fascia and exterior trim stays damp for months at a stretch, which
  softens the wood behind the paint film long before the surface shows visible damage.
  Douglas-fir framing inside these houses is typically still solid. The finish carpentry — trim,
  base, window stools, stair treads — needs systematic restoration, not random spot repairs.
  Bellingham's older housing stock rewards careful carpentry more than cosmetic renovation.

commonProblems:
  - title: "Custom Craftsman Built-Ins: Bookcases and Window Seats"
    description: |
      The built-in bookcases and window seats in Lettered Streets and York bungalows are
      structurally sound but often need restoration or complementary new carpentry to finish
      a room. Glass-panel doors have warped out of square. Shelf pin holes are stripped. Owners
      want a matching pantry built-in for the kitchen or a mudroom bench with cubbies — pieces
      that need to match the existing flat-panel Craftsman door style and three-piece base
      profile. The right wood species matters: original built-ins in Bellingham bungalows used
      clear vertical-grain fir or alder. For budget-sensitive projects, we use IKEA carcasses
      with custom fir face frames — a hybrid that cuts cost without sacrificing the visible
      finish. Full custom shop-built boxes are available for higher-spec carpentry work. A
      typical living room bookcase or kitchen pantry built-in runs $3,500–$8,000 depending on
      linear footage, door count, and finish level. Timeline from deposit to install: 3–5 weeks.

  - title: "Trim and Molding Restoration in 1910s–1930s Bungalows"
    description: |
      Original trim profiles in Bellingham's older homes are almost never standard stock. The
      three-piece base — base shoe, baseboard, base cap with an ogee or ovolo profile — and the
      back-banded door casing common to Craftsman construction require either custom router work
      or a millwork shop willing to run a small batch. The bigger practical problem is previous
      patch repairs: water putty and latex caulk applied over oil-based paint bonds poorly and
      cracks each winter as the wood moves with humidity changes. Full carpentry restoration
      means stripping back to bare wood, priming all surfaces with Zinsser BIN shellac-based
      primer before topcoat, and matching the sheen to the original. We bring profile gauges to
      every site visit and document existing profiles before quoting. If a section of original
      trim survives intact, bring a clean sample — it helps spec the router setup. Single-room
      trim carpentry restoration runs $800–$2,500 depending on lineal footage and condition.

  - title: "Stair Stringer Rebuilds and Tread Replacement"
    description: |
      Fairhaven's hillside blocks — around 12th Street and Donovan, east of the Sehome
      Arboretum — have steep interior stair runs that take significant seasonal load. Original
      2×12 Douglas-fir stringers crack at the tread notches after decades of use, producing
      bounce and flex that worsens every year. Replacing or sistering a stringer requires pulling
      the treads and risers first — which is also the right moment to address the nosing profile.
      Standard replacement treads have a 1-1/16" nosing radius, but original fir treads were
      cut thicker with a different bullnose. Substituting stock treads creates an obvious mismatch
      in older homes; we mill replacements to profile or source from architectural salvage.
      Structural stair carpentry in Bellingham that affects load path may require a permit through
      the City of Bellingham Building Division — as WA Licensed Contractors, we handle
      applications and plan submittals, with Bellingham's online portal typically running 2–4
      weeks for plan review. A single stair run rebuild (12–14 treads) runs $2,500–$4,500.

  - title: "Interior Door Replacement: Matching Old Frames and Casing Profiles"
    description: |
      Original interior doors in 1920s–1950s Bellingham homes are typically 1-3/8" thick fir
      blanks hung with mortise locksets — not a size or style modern hollow-core prehung units
      match. A standard prehung door comes with a 4-9/16" jamb; old frames in these houses ran
      5-1/4" or wider. Fitting a new door in an old opening means building up the jamb or
      trimming the existing frame, and then the casing still needs to match what's elsewhere in
      the room. This carpentry detail — jamb extension plus casing match — is where most door
      swaps in Bellingham bungalows go wrong. Masonite makes a paint-grade stile-and-rail blank
      that works well for replacement where a solid-wood look is needed without custom millwork
      cost. We pair these with Schlage passage or mortise sets sized to the existing bore
      diameter. Per-door cost runs $650–$1,400 depending on door size, hardware spec, and
      whether casing requires custom milling. Whole-house interior door replacement in a
      bungalow — typically 8–12 doors — runs $6,000–$14,000.

  - title: "Cedar Fascia and Exterior Trim Repair"
    description: |
      Cedar fascia and exterior trim in Bellingham deteriorates from behind, not from the
      surface. Marine fog off Bellingham Bay keeps north-facing eaves wet from October through
      April, and water infiltrates any gap at the fascia-to-rafter-tail joint or at corner board
      edges. The cedar softens well before the paint surface shows failure — by the time a
      homeowner sees bubbling or peeling, there's often an inch or more of soft wood underneath.
      The fix: cut back to sound material, sister or replace with #2 clear cedar (not
      finger-jointed softwood), and back-prime all faces before reinstalling. Skipping back-
      priming is the main reason exterior carpentry repairs fail in three years instead of ten.
      We seal joints with Sherwin-Williams Loxon paintable polyurethane caulk, which stays
      flexible through Bellingham's temperature cycling. A single-elevation fascia carpentry
      repair runs $900–$2,500 depending on linear footage and condition.

faq:
  - q: "How fast can you get to Bellingham for carpentry work?"
    a: |
      Bellingham is roughly 85 miles north of Seattle on I-5 — about 90 minutes in normal
      traffic, closer to 2 hours on a Friday afternoon. We schedule Whatcom County carpentry
      consultations on days we can combine the drive with other north corridor work, typically
      Tuesday through Thursday. From site visit to signed contract, most clients are looking at
      1–2 weeks for scope confirmation and line-item pricing. Build timelines from there: trim
      restoration for one room runs 3–5 days on site, custom built-in casework takes 3–5 weeks
      from deposit to install, stair rebuilds 1–2 weeks depending on scope. Call (206) 591-1096
      to check current availability and get a carpentry consultation scheduled.

  - q: "What does carpentry work typically cost in Bellingham?"
    a: |
      Pricing varies with scope and material grade. Single-room trim carpentry restoration:
      $800–$2,500. Custom kitchen pantry or living room bookcase built-in: $3,500–$8,000.
      Interior door replacement per door, including casing match: $650–$1,400. Stair stringer
      rebuild with new treads and risers: $2,500–$4,500. Cedar fascia repair per elevation:
      $900–$2,500. These ranges shift based on wood species, finish level, and site access.
      After the site visit, we provide a written line-item quote — no vague allowances that
      balloon later. Deadline penalties are written into the contract on our end if we run long
      without cause.

  - q: "Do carpentry projects in Bellingham require permits?"
    a: |
      Most interior carpentry — trim restoration, built-in casework, door replacement — does not
      require a permit from the City of Bellingham Building Division. Structural stair carpentry
      that affects load path (stringer replacement, significant tread frame modification) can
      trigger a permit requirement; Bellingham's online portal runs roughly 2–4 weeks for
      residential plan review. For parcels in unincorporated Whatcom County, permitting goes
      through Whatcom County Planning and Development Services on a similar timeline. As WA
      Licensed Contractors, we handle applications and plan submittal packages as part of the
      project scope. We tell you at the site visit whether your carpentry project requires a
      permit — before you sign anything, not after work starts.

  - q: "Can you replicate original trim profiles in older Bellingham homes?"
    a: |
      Yes — and it's one of the most common carpentry requests in 98225 and 98229. Original
      Craftsman base profiles, back-banded door casings, and picture-rail moldings from
      1910s–1930s construction don't match anything at a big-box store. We bring profile gauges
      to every site visit and document all existing profiles before quoting. For uncommon shapes,
      we source from local millworks or run custom profiles using a router table setup. If you
      have an intact section of original trim elsewhere in the house, that's the most useful
      reference — it lets us match the exact cutter geometry and wood species before we start
      cutting. Matching profiles adds cost and time, but it's the difference between a
      restoration and a carpentry job that looks like one.

  - q: "What warranty do you provide on carpentry work?"
    a: |
      Labor is warranted for one year from project completion. Joinery on built-in casework we
      fabricate — face frame connections, drawer box assembly, door fit — is covered for one
      year. Door installations are warranted for fit and function for one year. Material defects
      follow supplier terms: cedar lumber is inspected within the first season for checking or
      excessive movement. What the warranty doesn't cover: finish work applied by others after
      we leave, seasonal movement in homes on post-and-pier foundations (that's physics, not
      workmanship), and water damage from building envelope failures outside our carpentry scope.
      If something fails within the warranty period, Vladislav comes back to look at it
      personally — not a crew you haven't met.

  - q: "Do you work in areas outside Bellingham in Whatcom County?"
    a: |
      We take on carpentry projects in Ferndale, Lynden, Blaine, and Mount Vernon for the right
      scope. Work in Whatcom County generally needs to be $15,000 or more for the drive time to
      make sense on both sides — roughly a full built-in project, a stair rebuild combined with
      trim restoration, or a similar multi-component carpentry scope. Skagit County jobs in
      Burlington, Anacortes, and Sedro-Woolley fit the same threshold. Our regular coverage runs
      through King, Snohomish, Pierce, and Kitsap counties continuously, so Bellingham-area
      clients aren't getting a contractor who rarely handles this type of work. Call
      (206) 591-1096 to talk through your project and confirm scheduling.