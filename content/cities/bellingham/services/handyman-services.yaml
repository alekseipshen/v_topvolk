title: "Bellingham Handyman Services — Fix What's Stacking Up"

intro: |
  Fairhaven's Victorian row houses and the 1920s Craftsman bungalows through the Lettered Streets neighborhood share a running list of small repairs — jobs that don't justify a full contractor but sit there doing real damage.

  A dripping Moen 1225 cartridge corroding the cabinet floor beneath the bathroom vanity. Weatherstripping that went flat two winters ago on a door frame that's been drafting cold air from October through April. One deck board that flexes wrong underfoot and should have been replaced last summer.

  Bellingham gets roughly 34 inches of rain a year, heavier in fall and early winter, and that sustained moisture finds every gap in caulk, every compressed foam seal, every piece of fascia trim that lost its paint on the north side.

  Vladislav Volkov handles these jobs directly — shows up for the site visit, writes the list with line-item pricing, and clears it himself. No dispatch queue. Call (206) 591-1096 to get an actual timeline.

localContext: |
  The 98225 zip covers downtown Bellingham, Fairhaven, and the Lettered Streets corridor — homes here range from 1890s Victorians to 1940s bungalows, with original knob-and-tube wiring occasionally still live in older units and galvanized supply lines partially retrofitted at various points over the decades.

  Texture matching drywall in these houses is not simple. The original plaster walls were skim-coated, then re-drywalled in different eras, leaving no consistent profile to match against.

  Down in 98229 — the Samish Hill area, Lake Whatcom frontage, and the subdivisions along Lakeway Drive — housing shifts to 1980s-90s builder-grade, where generic GE ceiling fans, builder toilets, and contractor-grade faucets are finally hitting end of service life together. Both zones deal with the same underlying climate reality: Pacific moisture off Bellingham Bay sits on horizontal surfaces longer than in drier Puget Sound cities, accelerating deck board rot and swelling exterior door frames before homeowners notice.

  Deferred small jobs compound fast here. One loose gutter spike leads to pooling water, which leads to rotted fascia board, which leads to a larger exterior repair than it had to be.

commonProblems:
  - title: "Remodel Punch Lists Left Open for Months After the GC Wrapped"
    description: |
      After a kitchen or bathroom remodel closes out, there's always a tail: cabinet hardware still in a bag on the counter, a Schluter edge strip on the shower niche left raw, a bathroom exhaust fan wired but not actually ducted to the exterior soffit.

      Getting the original GC back for twelve line items that each take twenty minutes is nearly impossible — there's no margin in it for them. These are exactly the jobs we take. A typical Bellingham punch list runs eight to fifteen items. The blue tape walkthrough usually catches everything, but clearing it requires someone who will actually show up for a half-day of finish work.

      Full punch list clearance runs one day on-site for most remodels, occasionally two for larger projects. Cost lands in the $400-$900 range for labor, materials separate. Call (206) 591-1096 and read Vladislav the list — he'll tell you the straight scope and cost: half-day or full-day, and what materials will run on top.

  - title: "Drywall Patches That Leave a Flat Ghost Visible in Raking Light"
    description: |
      The hard part of a drywall patch is not filling the hole — it's matching the texture.

      Bellingham homes in the 98225 corridor have everything from original orange peel to knockdown to skip-trowel applied across different decades of renovation. Getting a six-inch patch to disappear into a 1978 knockdown wall takes multiple coats of all-purpose joint compound, correct hopper or hawk technique for the specific texture profile, and a matched primer sheen before paint. Box-store patch kits skip the texture step entirely and leave a smooth flat circle visible any time the light rakes across the wall.

      We carry Durabond 90 for structural patches and a hopper gun for texture replication. On older Craftsman homes, patches near window headers sometimes reveal sister joist issues or missing blocking in the cavity — we flag those before closing the wall back up.

      A standard four-to-six-inch patch with texture and prime coat runs $150-$250. Larger sections are priced per square foot after assessment.

  - title: "Exterior Door Weatherstripping Compressed Down to a Paper-Thin Strip"
    description: |
      Standard foam weatherstripping compresses and fails in three to five years on a frequently-used exterior door. Bellingham's wind off the bay and the persistent wet cold from October through March makes a drafty entry door feel brutal fast. The durable replacement is a Q-Lon compression seal or a Pemko 315 door bottom sweep — both rated for heavy commercial use, both significantly more resilient than foam tape from a home center.

      For older homes in Fairhaven, the door frames are often out of square from decades of settling, which means weatherstripping cannot seat properly until the door itself is adjusted or shimmed at the hinges. We handle the door alignment and the weatherstripping install in the same visit, so you're not patching a symptom while the root problem remains.

      On double-hung wood windows common in 1920s-1940s homes, pile weatherstripping replaced into the sash channels dramatically cuts air infiltration without touching the window unit itself. Material and labor for one exterior door: $120-$200.

  - title: "Faucets, Toilets, and Ceiling Fans Past Their Service Life"
    description: |
      A Moen Chateau kitchen faucet that wobbles at the base and drips from the spout is a two-hour swap, not a plumbing emergency. Same with a toilet that runs continuously because the flapper and fill valve are both worn. In older Bellingham homes, the shutoff angle stops under sinks are often original 1970s or 1980s valves that seize — or fail outright — when turned for the first time in decades. We test those before removing the old fixture and replace them if needed, so there are no surprises after we leave.

      Ceiling fan installs in 98226 homes — Cordata and Birchwood subdivisions from the 1990s — frequently require upgrading the junction box from a standard pancake box to a fan-rated brace-and-box kit before the fan can be hung safely.

      A Kohler toilet flapper, fill valve, and supply line replacement runs $180-$280 in labor. A new Moen faucet installation — fixture provided by the homeowner or sourced by us — runs $175-$300 depending on the configuration.

  - title: "Rotted Deck Boards and Loose Railings on North-Facing Outdoor Decks"
    description: |
      Deck boards fail from the top down when the finish coat wears off, and from the bottom up when clearance is low and moisture collects during the wet season. Pressure-treated lumber decks built in the 1990s used CCA treatment, which is no longer available — replacement boards today are ACQ-treated and require hot-dipped galvanized or stainless fasteners to prevent accelerated corrosion. Using standard steel screws with ACQ lumber speeds up failure significantly.

      For composite replacements, Trex Enhance and TimberTech AZEK hold up in Bellingham's climate better than any wood product — no annual sealing, no cupping from standing water during the October-through-April wet stretch.

      Railing repair usually means replacing deteriorated post sleeves or re-setting posts that have lifted due to undersized post-base hardware. IRC Section R312 requires guardrails on decks thirty inches or higher to resist 200 pounds of lateral load — a post that wobbles by hand fails that test. Composite board replacement runs $18-$28 per linear foot installed. Railing post reset: $150-$300 per post depending on access and hardware condition.

faq:
  - q: "How fast can you get to Bellingham for handyman work?"
    a: |
      Bellingham sits about 85 miles north of Seattle via I-5 — roughly 1.5 to 2 hours depending on traffic through Lynnwood and the Mount Vernon stretch. We schedule Bellingham visits in full-day blocks to make the drive practical for both sides. For lists with five or more items, the trip makes clear sense. For a single fixture swap, we are honest upfront about whether a local trade would serve you better. Call (206) 591-1096 and describe the list to Vladislav directly — he will tell you the realistic scheduling window and whether the scope fits a Whatcom County trip. Typical lead time for a scheduled visit is one to two weeks out.

  - q: "What does handyman work actually cost in Bellingham?"
    a: |
      Straight labor runs $85-$120 per hour with a two-hour minimum on most visits. A punch list with eight to twelve items typically takes six to eight hours on-site — call it $500-$900 in labor plus materials. Individual fixture installs (toilet, kitchen faucet, ceiling fan) run $150-$300 per unit. Composite deck board replacement runs $18-$28 per linear foot installed. Drywall patches with texture matching run $150-$250 for a standard four-to-six-inch hole. We provide a written itemized estimate before anything starts — not a range, not a ballpark. Call (206) 591-1096 or schedule a free on-site consultation to get exact line-item pricing for your specific list. Vladislav writes the scope, you approve it, then work begins.

  - q: "Do handyman jobs in Bellingham require permits?"
    a: |
      Most standard handyman tasks — fixture replacement, drywall patching, weatherstripping, deck board replacement in-kind — fall below the permit threshold for City of Bellingham Building & Development Services. The line shifts when work involves new electrical circuits, new plumbing rough-in, or structural changes. Replacing a like-for-like Kohler toilet: no permit. Replacing deck boards without altering the frame or footprint: no permit. Adding a new dedicated circuit for a smart panel or EV charger: permit required. Vladislav is a WA Licensed Contractor and will tell you upfront during the estimate which items on your list require a permit pull and which do not. No gray-area surprises midway through the job.

  - q: "Can you install smart home devices — doorbells, thermostats, smart locks?"
    a: |
      Ring and Nest doorbell cameras, Ecobee and Honeywell Home thermostats, smart deadbolts, and Wi-Fi switches are all standard handyman installs when the existing wiring supports them. The snag in older Bellingham homes — particularly pre-1960s Fairhaven and Lettered Streets properties — is that doorbell transformers are often undersized (8V versus the 16-24V most video doorbells require) and thermostat wiring frequently lacks a common wire (C-wire). We assess the wiring first, replace the transformer if needed, and run a C-wire adapter or pull new wire if attic or crawlspace access allows. Nest and Ring both require a minimum 16V to charge the internal battery reliably. We do not install a device and leave you troubleshooting a dead battery every two weeks.

  - q: "What warranty do you provide on handyman work?"
    a: |
      Labor is warranted for twelve months. If a fixture we installed develops a leak, a door bottom sweep we set fails to seat, or a drywall patch cracks at the same location, we return and correct it at no charge. Materials carry their own manufacturer warranties separately: Moen's Lifetime Limited Warranty covers faucet cartridges and finish, Kohler covers mechanical parts for one year, and Trex carries a 25-year fade and stain warranty on composite decking boards. The twelve-month labor warranty covers work done per the written scope — it does not extend to homeowner modification or damage from other causes. Every job starts with a written scope of work, so what's covered is never ambiguous.

  - q: "Do you cover areas outside Bellingham in Whatcom County?"
    a: |
      Yes. Ferndale (98248), Lynden, and unincorporated Whatcom County areas north of Bellingham are all reachable on the same scheduled trip. Heading south along I-5 we also cover Anacortes, Burlington, and Mount Vernon in Skagit County. The primary service area anchors in Seattle Metro — King, Snohomish, Pierce, and Kitsap counties — but Bellingham and Whatcom County visits are scheduled as full-day blocks. Call (206) 591-1096 to check availability for your specific location. Vladislav typically books Whatcom County trips one to two weeks out and combines jobs in the same area when the schedule allows, which sometimes opens earlier slots.