title: "Bellingham Deck Installation — Built for 57 Inches of Rain"

intro: |
  A cedar deck that looks sharp in August can be gray, splitting, and covered in moss by
  its third spring in Bellingham — 57 inches of rain per year, most of it falling October
  through May, doesn't give untreated wood much of a break. Homeowners in the Lettered
  Streets neighborhood and across Fairhaven are making the switch to composite decking
  — Trex Transcend, TimberTech AZEK — not because wood is bad, but because the
  maintenance math stops working when you're pressure-washing and re-sealing every
  two years. Getting a deck built correctly here means accounting for ledger flashing,
  the Whatcom County frost line for post footings, and a permit set that clears the
  Bellingham Building Division's plan review before a single board goes down. TopVolk
  Construction LLC handles that full process — Vladislav Volkov pulls the permit, manages
  all three required inspections, and is on site personally for the build. Call
  (206) 591-1096 to schedule a free on-site consultation. WA Licensed Contractor,
  100+ projects completed since 2023 across the Seattle Metro and north Puget Sound.

localContext: |
  The Lettered Streets district — running through 98225, north of downtown — is dense
  with Craftsman bungalows from the 1910s and 1920s. Post-and-pier foundations and older
  rim joist framing are the norm, and both need careful inspection before a ledger board
  goes on. Attaching a deck ledger to a 100-year-old house without through-wall flashing
  is a reliable way to introduce rot behind the band board — and the Bellingham Building
  Division catches it at the ledger inspection anyway. Down in Fairhaven and South Hill
  (98229), the housing stock shifts to 1960s and 1970s construction: more predictable
  framing, but still plenty of north-facing and west-facing exposure that accelerates wood
  degradation faster than most homeowners expect. The Chuckanut foothills to the south
  add another variable — freeze-thaw cycles that stress post footings and require footings
  dug at least 18 inches below grade to clear the frost line. Over in Birchwood (98226),
  lots tend to be flatter, but the rainfall totals are identical and composite still
  outperforms cedar on a 10-year cost basis when you factor in maintenance.

commonProblems:
  - title: "Cedar Decking That Grays and Mosses Out Within Two Seasons"
    description: "Bellingham's rainfall — 57 inches annually — hits decking differently
      than drier parts of Washington. Cedar is attractive and locally familiar, but a
      north-facing deck in 98225 will show green moss and gray weathering by the end of
      its second winter without annual pressure washing, staining, and sealing. That
      maintenance cycle costs $400-$700 per visit and compounds over a decade. TimberTech
      AZEK composite runs $65-$95 per square foot installed (depending on board profile
      and joist spacing), versus $45-$65 for pressure-treated framing with cedar decking
      — but composite carries a 30-year stain-and-fade warranty and requires almost no
      upkeep. For decks shaded by Douglas-fir or facing northwest toward Bellingham Bay,
      composite is the straightforward call. Trex Transcend is a comparable option in
      the same range. TopVolk quotes both materials with line-item pricing so you can
      run the 10-year cost comparison before deciding."

  - title: "Ledger Attachment Without Proper Flashing — Rot Hidden Inside the Wall"
    description: "The ledger board is where the deck bolts structurally to the house.
      Done wrong, it is also where water infiltrates the rim joist and begins rotting
      the framing inside the wall cavity. In Bellingham's climate — nearly five months
      of sustained rain — improper ledger flashing is one of the most common sources
      of hidden structural damage on attached decks. The Bellingham Building Division
      requires a framing and ledger inspection before decking goes down; inspectors
      check for through-wall flashing, proper standoff between the ledger and the
      sheathing, and stainless or hot-dipped galvanized lag bolts (standard zinc-plated
      hardware corrodes in PNW conditions within a few years). On older Craftsman homes
      in the Lettered Streets area, this sometimes means reframing the existing rim joist
      before the ledger installs. Budget $500-$1,200 extra if the rim joist shows
      softness or staining during the site assessment. Getting the ledger detail right
      at rough-in saves a major structural repair later."

  - title: "Post Footings That Do Not Reach Frost Depth in Whatcom County"
    description: "Post footings need to go below the frost line — in Whatcom County,
      that is typically 18 inches minimum, and deeper on hillside lots near the
      Chuckanut foothills where freeze-thaw cycles are more pronounced. Undersized
      footings heave over winter, pulling the deck frame out of level and stressing
      the ledger connection. The fix is a Sonotube form poured to proper depth with
      a post base cast into the concrete, using pressure-treated 6x6 posts with a
      UC4A or UC4B ground-contact rating for any post within 6 inches of grade.
      The Bellingham Building Division requires a footing inspection before concrete
      is poured — you cannot backfill and cover footings without sign-off. TopVolk,
      as a WA Licensed Contractor, pulls the permit, schedules all inspections, and
      does not pour until the inspector signs off. On sloped lots in South Hill or
      Fairhaven, expect footing costs to run 20-30% higher than a flat lot in
      Birchwood, due to variable post heights and sometimes a larger footing diameter
      requirement."

  - title: "Guardrails Added as an Afterthought — and the Cost of Revising Them"
    description: "Any deck surface more than 30 inches above grade requires guardrails
      at least 36 inches high per IRC, and the Bellingham Building Division enforces
      this at final inspection. Baluster spacing cannot allow a 4-inch sphere to pass
      through. Homeowners who skip railing planning in the initial design phase
      sometimes discover it adds $1,500-$4,000 to the project depending on linear
      footage and material choice. Steel cable rail systems run higher — $200-$350
      per linear foot installed — but they are popular in Bellingham because they
      preserve sightlines toward Bellingham Bay and the San Juan Islands. Aluminum
      and composite rail systems from TimberTech RadianceRail or Trex Transcend Rail
      sit in the $80-$150 per linear foot range and hold up well in PNW moisture
      without the rust concerns of standard steel. Getting the railing spec into the
      original permit plan review avoids revision submittals and the associated delays
      that add 2-4 weeks to the overall schedule."

  - title: "Stair Stringers Cut Wrong — Rise, Run, and Graspable Handrail Compliance"
    description: "Deck stairs are the most code-intensive component of a deck build
      and the location inspectors find the most violations. IRC requires a maximum
      7-3/4-inch rise and minimum 10-inch run per step, and every stair with four or
      more risers needs a graspable handrail — a round or oval profile a hand can
      wrap around, not a flat 2x4. On Bellingham's sloped lots, common in Fairhaven
      and South Hill neighborhoods, getting consistent rise-and-run across a graded
      slope requires careful stringer layout before the first cut. A stringer that
      is off by a quarter inch per step creates a tripping hazard and fails inspection.
      For longer stair runs — eight or more risers — LVL stringer stock reduces crown
      and twist versus dimensional lumber. Stair systems on a standard 10x14 deck
      run $800-$1,800 depending on stringer count, material, and whether the landing
      is concrete or PT decking. Vladislav prices stair work as a separate line item
      so the scope is clear before work starts."

faq:
  - q: "How fast can you get to Bellingham for a deck consultation?"
    a: "Bellingham sits about 90 minutes north of Seattle on I-5, and TopVolk schedules
      site visits there regularly — typically within 5-7 business days of first contact.
      Vladislav Volkov does the site visit personally. The consultation is free and
      includes a look at the existing rim joist and framing condition before any
      numbers are discussed. Written line-item estimates go out within 2-3 days after
      the visit. Once permit documents are submitted to the Bellingham Building Division,
      plan review typically runs 3-6 weeks for a standard residential deck. Call
      (206) 591-1096 to get on the schedule."

  - q: "What does deck installation in Bellingham cost per square foot?"
    a: "A pressure-treated framing deck with cedar decking, basic rail, and stairs
      runs roughly $45-$65 per square foot installed. Composite decking — Trex
      Transcend or TimberTech AZEK — pushes that to $65-$95 per square foot depending
      on board profile, joist spacing, and railing spec. A 200-square-foot deck runs
      approximately $9,000-$19,000 all-in, before permit fees. Permit fees in
      Bellingham add $400-$900 for most residential decks. Sloped lots and taller
      post requirements in Fairhaven or South Hill add cost. TopVolk provides a
      fixed-scope written estimate — no open-ended pricing ranges. Schedule a free
      on-site estimate by calling (206) 591-1096."

  - q: "Does deck installation in Bellingham require a permit, and who handles it?"
    a: "Yes. Any deck attached to the house or above 30 inches from grade requires a
      building permit from the City of Bellingham Building Division. The permit set
      includes a site plan, deck framing plan, footing details, and guardrail spec.
      TopVolk prepares all permit documents and submits them as part of the project
      scope — homeowners do not need to navigate the portal themselves. Plan review
      currently runs 3-6 weeks for residential decks in Bellingham. Three inspections
      are required: footing before concrete pour, framing and ledger before decking
      installs, and final. TopVolk is a WA Licensed Contractor and manages all
      inspection scheduling so the project moves without hold-ups waiting on sign-offs."

  - q: "Can you build a deck on a sloped lot in Bellingham?"
    a: "Yes, and it comes up often in Fairhaven and South Hill where lots step down
      from the street. On sloped lots, post heights vary significantly — sometimes
      8-10 feet on the downhill side — which affects post sizing (minimum 6x6 for
      tall posts), footing diameter, and stair layout. LVL beams are common on these
      builds to span longer distances between intermediate posts. A sloped site also
      requires evaluation of any existing grade near proposed footings. Bellingham
      Building Division plan review will flag underspecified posts or insufficient
      footing size on sloped sites, so the structural details need to be right before
      submittal. Slope assessment is included in the free on-site consultation —
      call (206) 591-1096."

  - q: "How long does a composite deck last in Bellingham's wet climate?"
    a: "Trex Transcend and TimberTech AZEK carry 25-30-year stain-and-fade warranties
      and 25-year structural warranties on the decking boards. Cedar needs stripping
      and resealing every 2-3 years to hold its color in Bellingham, and it will check
      and gray regardless over time. Composite boards do not check, split, or absorb
      moisture the way wood does. The PT lumber framing underneath carries a 25-year
      treatment warranty for ground-contact applications. Using stainless or hot-dipped
      galvanized joist hangers and hardware throughout prevents the rust streaking
      standard fasteners develop in PNW conditions within a few years. A well-built
      composite deck with proper ledger flashing realistically lasts 25-35 years
      before any major structural work."

  - q: "Do you cover other cities near Bellingham for deck projects?"
    a: "TopVolk covers the broader north Puget Sound area including Ferndale, Lynden,
      Burlington, and Mount Vernon in Skagit County. For projects in unincorporated
      Whatcom County, permits go through Whatcom County Planning and Development
      Services rather than the City of Bellingham Building Division — same basic
      process, different submittal portal. Ferndale and Lynden typically have shorter
      plan review queues than Bellingham proper. Scheduling in the area runs 4-8 weeks
      out depending on season — late spring and summer book fastest. Call
      (206) 591-1096 to check current availability and get a site visit on the calendar."