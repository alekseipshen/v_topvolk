    a: |
      Bellingham sits about 85 miles north of Seattle via I-5 — roughly 90 minutes without
      traffic, longer on Friday afternoons heading into Whatcom County. TopVolk takes select
      flooring projects in the Bellingham area, particularly scopes in the $15K+ range in
