title: "Federal Way HVAC — Heat Pumps, Mini-Splits & IRA Rebates"

intro: |
  Split-levels in Twin Lakes and Adelaide — Federal Way's core residential
  neighborhoods along 98023 — were built in the mid-1970s around gas furnaces
  that made sense when gas cost almost nothing. Most of those systems are still
  running. A Mitsubishi Electric heat pump swap today qualifies for up to $2,000
  in Inflation Reduction Act rebates, plus potential utility incentives through
  Puget Sound Energy. The math has flipped — electric is now cheaper to operate
  in most of these homes. Call (206) 591-1096 to talk through what the numbers
  look like for your specific system before committing to anything.

localContext: |
  Federal Way's stock runs from 1970s split-levels in Twin Lakes (98023) to
  1980s ranchers near Steel Lake and Mirror Lake, plus 1990s tract construction
  out toward West Campus and Pacific Highway S. Ductwork in the 1975-1995 build
  era was installed for gas airflow temperatures — not what a modern heat pump
  delivers. Add the marine climate pushing damp air through crawlspaces from
  October through April, and duct liner deterioration in unconditioned spaces
  accelerates faster than homeowners expect. Crawlspace vapor barriers in homes
  near Steel Lake are frequently undersized or improperly lapped — unsealed
  seams let ground moisture into the duct system year-round, degrading flex
  duct liner from the inside. Federal Way's 98003 zip sees the same pattern in
  1990s construction: builder-grade flex duct stapled loosely, insulation that
  has settled away from the liner, and return air paths that were never
  designed for balanced pressure.

commonProblems:
  - title: "Heat Pump Installed — But Duct System Was Sized for a Gas Furnace"
    description: |
      Gas furnaces heat air to 120-140°F. Heat pumps deliver air at 90-100°F,
      which means higher volume is needed to move the same BTUs. Original duct
      systems in Federal Way's 1970s homes weren't built for that. Without
      recalculating static pressure and CFM at the supply trunk, a new Carrier
      or Trane heat pump runs constantly, short-cycles, and struggles to hit
      set point on cold January nights. Upsizing the return plenum often solves
      it before touching the supply side.
  - title: "Hot and Cold Rooms in 1980s Ranchers — Duct Imbalance, Not Bad Equipment"
    description: |
      Steel Lake and Mirror Lake ranchers generate more HVAC complaints than
      almost anywhere in Federal Way. The complaint is always the same: back
      bedrooms are 6-8 degrees colder than the living room thermostat shows.
      The blower motor and heat exchanger are typically fine. Nobody balanced
      the supply and return duct runs after the family room addition got built
      in 1988. Manual dampers at the main trunk lines fix this without replacing
      any equipment.
  - title: "Daikin Mini-Split for an ADU — Wrong BTU, Wrong Refrigerant Line Set Length"
    description: |
      Daikin and Mitsubishi mini-splits are the standard choice for Federal Way
      ADU and bonus room additions under WA HB 1337. The spec errors happen at
      rough-in: undersized refrigerant line sets, line runs that exceed the
      manufacturer's maximum, and Manual J calculations that ignore ceiling
      height. A 9,000 BTU head handles a 250 sq ft studio fine. In a 380 sq ft
      DADU with 9-foot ceilings, it falls short in January and the homeowner
      blames the brand.

faq:
  - q: "How fast can you get to Federal Way for Hvac?"
    a: |
      Federal Way is 25-30 minutes from our base via I-5 South, 35-40 minutes
      from Bellevue. Vladislav schedules free on-site consultations within the
      week — no sales staff, no middlemen. Call (206) 591-1096 and we'll set a
      time that works. You get a line-item quote on the visit, not a range.
  - q: "Do you install Mitsubishi and Daikin mini-splits in Federal Way?"
    a: |
      Yes — Mitsubishi Electric and Daikin are the two we specify most for
      ADUs and room additions. Fujitsu covers specific multi-zone configurations.
      Every install includes refrigerant line set, electrical rough-in, drain
      line, and commissioning. We pull the City of Federal Way mechanical permit
      — plan review typically runs 2-3 weeks for residential HVAC work.
  - q: "What does an HVAC replacement cost in Federal Way, and how does permitting work?"
    a: |
      A heat pump swap on an existing forced-air system typically runs
      $9,000-$16,000 installed before IRA rebates. A single-zone ductless
      mini-split for an ADU is usually $5,000-$8,000. Federal Way issues its own
      mechanical permits through the city's permit center — rough-in inspection
      can be scheduled within a few days of approval, and final inspection closes
      out the permit after commissioning is complete. Full project timeline: 3-5
      weeks from permit approval to final inspection. WA Licensed Contractor,
      100+ projects completed since 2023, deadline penalty written into every
      contract.