title: "Federal Way Tile Installation — 1990s Substrates & PNW Waterproofing"

intro: |
  Thirty-year-old ceramic tile in Federal Way's 98023 and 98003 zip codes is
  reaching end-of-life — grout lines darkening, shower niches leaking, kitchen
  backsplashes pulling away where mastic adhesive dried out decades ago. These
  homes along the SW 320th Street and Pacific Highway S corridors were built when
  4×4 ceramic was the builder-grade answer to every tiled surface. Replacing it
  right means correcting the substrate first — especially in kitchens where a
  Bosch or KitchenAid appliance upgrade is driving the full remodel anyway. The
  substrate work is unglamorous and adds to the budget, but skipping it just
  means doing the job twice.

localContext: |
  Federal Way sits on a plateau above Puget Sound, and its 98023 housing stock
  went up mostly between 1985 and 2000. Split-levels and two-story colonials
  dominate the Mirror Lake and Dash Point Road neighborhoods. Steel Lake and the
  Twin Lakes area have similar vintage homes — builder-grade finishes, original
  plumbing, and subfloors that have carried thirty years of load. Subfloors in
  these homes frequently show joist-span flex that exceeds the IRC L/360 standard —
  which means large-format porcelain cracks along grout lines within a year or
  two of install if nobody addressed the bounce first. That's the kind of thing
  Vladislav checks before pricing a job, not after. King County DPER handles
  permits for Federal Way's unincorporated parcels, and plan review on structural
  scope runs 2 to 4 weeks — factor that into the timeline from day one.

commonProblems:
  - title: "Greenboard shower walls with no real waterproofing"
    description: |
      Original 1990s showers in Federal Way were typically set with mastic over
      standard greenboard drywall — neither waterproof, both problems in 37 inches
      of annual PNW rainfall. The correct fix is cement board plus Schluter Kerdi
      membrane before tile. Without it, water migrates behind the tile, rots the
      Douglas-fir framing, and shows up as soft spots in the bathroom floor. By
      the time homeowners notice, the repair scope has doubled. Exterior-facing
      bathroom walls are especially vulnerable — the temperature differential
      drives moisture cycling year-round in Federal Way's damp climate.

  - title: "Large-format porcelain cracking on flexible subfloors"
    description: |
      24×48 and 32×32 porcelain tiles are unforgiving — any subfloor movement
      beyond 1/8 inch deflection per 10 feet will crack them. Federal Way's
      split-levels commonly have original joist spans that flex under load. The
      fix is sister joists or a DriCore subfloor panel layer before the tile
      goes down. A thick-set mortar bed alone won't hold large-format tile over
      a bouncy floor. Vladislav measures deflection at the site visit and
      specifies the structural fix in the line-item quote — not as a surprise
      change order mid-project.

  - title: "Heated floor systems installed without proper uncoupling membrane"
    description: |
      Schluter Ditra-Heat and Warmup mat systems both require an uncoupling
      membrane between the heating element and the subfloor — skip it and
      thermal movement cracks grout joints within one winter season. Federal
      Way's mild but damp winters still cycle enough temperature to matter,
      especially in bathrooms on exterior-facing walls. Vladislav specs the
      membrane as standard on every heated floor project, not an upsell.

