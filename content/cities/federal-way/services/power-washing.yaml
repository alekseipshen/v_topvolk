title: "Federal Way Power Washing — Moss & Grime Off PNW Surfaces"

intro: |
  Dash Point's tree canopy and Federal Way's position along Puget Sound keep exterior
  surfaces damp most of the year. Cedar fences, Hardie cement-board siding, and poured
  concrete driveways around Steel Lake go months without drying out — that's when moss
  and algae do real damage.

  The 1980s subdivisions east of Pacific Highway South, running through 98023, are at the
  age where skipping exterior maintenance compounds fast. Thirty-plus PNW winters layer
  biological growth into surfaces that a single dry summer afternoon won't fix on its own.

localContext: |
  Federal Way's housing stock is heavily 1980s and early 1990s — builder-grade cedar
  privacy fences, poured concrete flatwork, and asphalt shingle roofs that have been
  through 30-plus Pacific Northwest winters.

  The Twin Lakes and Lakota neighborhoods in 98023, and areas around Celebration Park in
  98003, concentrate north-facing decks and fence runs that hold moisture from October
  through April with almost no drying between events. Cedar exposed through multiple wet
  seasons needs more than pressure — it needs real surface prep before any stain or sealer
  will penetrate.

  That's not a small distinction. Skipping prep on aged cedar means the sealer sits on top
  of organic residue rather than bonding to the wood. Two seasons later, you're back at
  the start.

commonProblems:
  - title: "Moss colonies establish in cedar decks and fences after each PNW winter"
    description: "Cedar decks and privacy fences in Federal Way absorb moisture October through May
      with almost no drying time between rain events. Moss rhizoids penetrate the wood
      grain within one season and create a surface that repels stain and sealer.

      Power washing at the correct PSI — paired with a downstream soft-wash application and
      controlled dwell time — lifts organic matter without raising the grain. Trex
      composite boards clean easier, but untreated cedar needs specific nozzle selection:
      a 25-degree tip at 1,500 PSI is a reasonable starting point before stain prep.

      North-facing fence runs along properties near Five Mile Lake Road are some of the
      worst for sustained growth. They never fully dry between November and March."

  - title: "Hardie siding and stucco discoloration before exterior repaint"
    description: "Hardie cement-board panels hold moisture along seams and lower courses — especially
      on west- and north-facing elevations where afternoon sun doesn't reach until late.
      Algae staining develops into gray-green discoloration that primer won't lock down.

      Pressure washing Hardie requires tight PSI control (typically 1,200–1,500 with a
      fan-tip nozzle) to avoid forcing water behind the laps and into the weather-resistant
      barrier beneath. Getting that wrong creates moisture intrusion that doesn't show up
      as visible damage until framing is already compromised."

  - title: "Concrete driveway and walkway staining in 30-year-old subdivisions"
    description: "Poured concrete flatwork in Federal Way's 1980s subdivisions is well past its
      original sealer life. Oil from driveway parking, tire oxidation, and organic runoff
      from maples and firs layer into staining that surface scrubbing won't break up.

      A rotary surface cleaner attachment at 3,000 PSI cuts evenly across the slab without
      the stripe marks a wand-only pass leaves on aged concrete. That uniform cleaning
      pattern matters on flatwork this old — uneven pressure leaves visible banding that
      shows up the moment the surface dries.

      A penetrating sealer application after cleaning adds five to seven years before the
      next cycle."

