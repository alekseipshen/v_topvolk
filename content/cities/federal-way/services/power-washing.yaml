  - q: "Do you wash Hardie cement board siding and composite decking, or just wood surfaces?"
    a: |
      Both — but each gets a different method. Hardie and Trex or TimberTech composite decking stay under 800 PSI with downstream chemical application; high pressure on either one causes surface damage that doesn't buff out. Wood decks and cedar fences run at higher PSI, calibrated to the wood species and how far gone the weathering is. One pressure setting doesn't work for everything, and anyone telling you otherwise is guessing.

