title: "Federal Way Power Washing — Moss, Cedar & Concrete Cleared"

intro: |
  Twin Lakes and Lakota sit under a dense canopy that keeps cedar surfaces damp well past April.

  By the time most homeowners in 98023 think about deck staining season, the moss has already put down roots in the grain. Most of the housing stock here was built between 1975 and 1990 — wood decks, long poured-concrete driveways, and cedar fences that cycle through green-to-grey on the PNW's standard three-to-five-year clock. That 30-to-45-year-old wood absorbs moisture through every wet season and never fully dries out until late June. Surface prep here isn't optional — it's what separates a stain job that holds from one that peels by January.

  TopVolk does the surface prep work that makes Hardie siding repaints stick and deck stains actually last through winter.

localContext: |
  Split-levels and two-story colonials along Dash Point Road and in the 98003 zip are the most common jobs here: original cedar or TimberTech composite decks, long exposed driveways with layered oil and tire marking, and north-facing fiber-cement or stucco walls that hold moisture through the wet season. The ones built between 1978 and 1988 are particularly prone to organic buildup — the original cedar surfaces were never sealed at the factory and have been absorbing rain for four decades.

  Steel Lake Park keeps the adjacent streets shaded and humid into June.

  Homes closer to Pacific Highway South have older uncoated concrete walks and patios with significant organic buildup that standard hosing doesn't touch. The foot-traffic patterns near SR-99 commercial corridors also mean more rubber and oil contamination tracked onto residential surfaces than you'd see in Sammamish or Redmond.

commonProblems:
  - title: "Cedar Deck Moss Rooted Below the Surface"
    description: |
      North-facing decks in Twin Lakes and the Steel Lake area get under three hours of direct sun on a December afternoon.

      Moss anchors below surface level — a straight 2,500 PSI rinse removes the visible mat but leaves the root structure intact. Pre-treatment with a sodium hypochlorite soft wash solution, a 10-minute dwell, then a surface cleaner pass clears both layers. The dwell time is the part most people skip because it looks like nothing is happening, but that's when the chemistry is actually breaking down the rhizoid structure embedded in the wood grain. Wood species matters too — older Douglas-fir boards need a longer dwell than pressure-treated pine because the grain is tighter and holds contamination deeper.

      Skipping pre-treatment is the reason most DIY pressure washes leave grey-green staining by the following spring.

  - title: "Oil and Tire Contamination on 98003 Concrete Driveways"
    description: |
      Long concrete slabs on single-family lots near I-5 and along SW 356th accumulate years of motor oil from garage parking and rubber from tire marks that cold water can't lift — it just recirculates the contamination across the slab surface. A hot water unit at 3,000 PSI with a rotary surface cleaner attachment breaks down the oil-based buildup at the source. Cold water at the same PSI physically moves the contamination but doesn't emulsify it; when the slab dries, the oil redistributes into the same pattern. A 15-minute degreaser pre-soak is standard before the surface cleaner pass.

      Cutting that step leaves oil hazing across the slab after it dries.

  - title: "Hardie Siding Mildew Before Exterior Repaint"
    description: |
      James Hardie cement board siding is common on Federal Way homes re-sided in the late 1990s and 2000s. Mildew and organic film on the surface causes paint adhesion failure within a year.

      Soft wash at under 800 PSI with downstream injection of cleaning solution removes the contamination without forcing water behind the board laps or into window seal channels. The downstream injection method keeps the chemical concentration consistent across the wall surface — pressure-feed application concentrates too much solution at close range and can bleach out the existing paint where it's still intact. TimberTech composite decking adjacent to the house gets the same low-pressure treatment. High PSI permanently etches the composite surface in a way that shows up clearly in raking light and traps future contamination worse than the original buildup.

