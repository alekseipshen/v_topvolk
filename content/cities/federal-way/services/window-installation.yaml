title: "Federal Way Window Installation — Rot, Fog, and the 98023 Rain Problem"

intro: |
  Dash Point State Park is beautiful in November, but the north-facing walls of the subdivisions
  just east of it — Twin Lakes, Steel Lake, the rancher blocks in 98023 — collect moss every
  winter. Federal Way's tract homes from the 1980s and early 90s still run original builder-grade
  vinyl windows, thin double-pane units not rated for 37 inches of annual rain or current Seattle
  Energy Code. Milgard Tuscany retrofits are the most common replacement in this zip. Vladislav
  Volkov has pulled failed frames in Steel Lake-area colonials where the flashing had been leaking
  for a decade before anyone noticed the soft sill.

localContext: |
  Most Federal Way housing went up between 1975 and 1995 — tract homes across the 98003 and 98023
  zip codes with builder-grade aluminum or first-generation vinyl frames that have long since passed
  useful service life. Aluminum frames conduct cold straight through the profile, generating
  condensation on interior sill plates and sill trim every wet season. The Dash Point and Twin
  Lakes neighborhoods have a disproportionate number of two-story colonials where second-floor
  windows are particularly overdue — frames bowed, weep holes clogged, exterior trim rotted.
  A full retrofit on those means new frame, new flashing, new interior casing, and a paint touch.

commonProblems:
  - title: "Flashing Failure and Rotted Rough Openings Behind the Frame"
    description: "Original 1980s window installs in Federal Way rarely included proper pan flashing or
    a back-dam at the sill. Rain drives behind the frame, saturates the OSB sheathing, and rots the
    king stud and trimmer stud long before damage shows inside. By the time a homeowner notices a
    soft sill plate or bubbling drywall, the rough opening framing needs structural repair — not
    just a new window. That adds scope and cost that a proper install 30 years ago would have
    prevented."

  - title: "Fogged Double-Pane Units — IGU Seal Failure at Scale"
    description: "Late-1990s Milgard and comparable mid-grade double-pane windows are hitting end of
    IGU (insulated glass unit) lifespan across Federal Way right now. Argon bleeds out, the
    desiccant in the spacer bar saturates, and permanent condensation forms between the panes —
    worst on west-facing glass taking afternoon sun. Sometimes the IGU swaps out without pulling
    the frame. More often, frames from that era are bowed or out of square and the whole assembly
    needs to come out."

  - title: "Basement Egress Windows That Don't Meet IRC Minimums"
    description: "Many Federal Way ranchers from the 1980s have finished basements used as bedrooms,
    with original windows nowhere near IRC egress code — the requirement is a maximum 44-inch sill
    height from floor and 5.7 square feet of net clear opening. Selling the home or pulling any
    other permit triggers an inspection that flags non-compliant openings as a required correction.
    The fix involves cutting through the foundation wall, framing a new rough opening to size, and
    installing a window well with drainage gravel at the base."

faq:
  - q: "How fast can you get to Federal Way for Window Installation?"
    a: "Federal Way is 25-35 minutes south on I-5 from Seattle — straightforward drive with no ferry
    or bridge delays. Vladislav sets the appointment directly; you're not going through a dispatcher.
    Call (206) 591-1096 and you'll talk to the person doing the work. TopVolk has completed 100+
    projects across Seattle Metro since 2017, including multiple jobs in the 98003 and 98023 zips."

  - q: "Which window brands do you install in Federal Way homes?"
    a: "Milgard covers most retrofit applications here — the Tuscany series for standard openings,
    Trinsic for a slimmer profile. Pella and Marvin are options when rough opening size is
    non-standard or when performance specs require higher STC (sound transmission class) ratings
    for homes near I-5. Each brand has different frame depth requirements, which matters in older
    walls where the rough opening has limited depth."

  - q: "Do you handle permits for window installs in Federal Way, and what's the timeline?"
    a: "Federal Way runs its own permit center for city parcels — separate from King County DPER,
    which handles unincorporated areas nearby. Egress window installs and any work that modifies
    the rough opening structurally require a permit and inspection. TopVolk is a WA Licensed
    Contractor; we pull the permit and coordinate inspections. Standard timeline from permit
    approval to final inspection is 2-4 weeks. The project deadline goes into the contract — if
    we miss it, we pay a penalty. Call (206) 591-1096 or schedule a free on-site consultation
    to get a line-item quote before committing."