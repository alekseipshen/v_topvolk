title: "Federal Way Handyman Services — Small Repairs Done Right"

intro: |
  Twin Lakes and Steel Lake neighborhoods are loaded with 1970s-1980s split-levels
  that have quietly accumulated years of deferred small repairs. A Moen hall-bath
  faucet that's been dripping since last winter. Weatherstripping that gave out two
  rainy seasons ago. Deck boards soft at the post bases from sitting in standing water.
  Vladislav Volkov handles these jobs directly — WA Licensed Contractor, 100+ projects
  completed since 2023 across King and Pierce counties. Call (206) 591-1096 to get
  on the schedule.

localContext: |
  The 98003 zip — downtown Federal Way and the blocks around The Commons mall — has
  dense concentrations of 1970s-1980s ranchers and split-levels with original
  aluminum-frame windows and builder-grade doors that have never been properly resealed.
  Out in 98023, near Dash Point, cedar trim on north-facing soffits grows moss through
  the wet season and deteriorates before most homeowners notice. Both areas have
  accessible residential parking and straightforward job access.

  Federal Way's housing stock sits in a different position than newer Sammamish or
  Issaquah builds — these are 40- to 50-year-old homes where original galvanized
  supply lines are starting to show mineral buildup, original breaker panels are
  running at capacity, and builder-grade hollow-core doors have lost their weather
  seals entirely. The jobs aren't glamorous but they matter. A failed door sweep
  in a 98003 rancher costs maybe $80 in materials. Left another winter, the
  subfloor at the threshold starts absorbing moisture and the repair gets expensive.

commonProblems:
  - title: "Door and Window Weatherstripping Failure on 1970s-80s Homes"
    description: |
      Federal Way gets over 37 inches of rain annually, and that moisture finds every
      gap in original door sweeps and compressed foam weatherstripping. Slider doors —
      common on split-levels in Steel Lake — have vinyl pile seals that flatten over
      time and stop contacting the sill. Replacing door sweeps, threshold seals, and
      Q-lon window weatherstripping stops drafts cold without touching the window
      itself. On doors with aluminum frames original to the build, the threshold
      plate itself is often corroded at the fasteners and needs replacement before
      a new sweep will seat properly. Most jobs run under two hours once materials
      are on hand.
  - title: "Drywall Patches That Don't Match the Original Wall Texture"
    description: |
      Every trade rough-in leaves a hole. A plumber cutting in for a new Kohler
      toilet, an electrician adding a circuit, a GE dishwasher swap — each one opens
      drywall that needs to be closed and matched. Federal Way's 1980s tract homes
      typically run orange-peel or knockdown texture. Getting the skim coat feathered
      correctly so the patch disappears takes real practice, not just a can of
      spray texture. The sequence matters: hang, tape, two coats of mud with full
      dry time between, sand, prime, then apply texture to blend the sheen — skip
      any step and the patch reads differently under raking light.
  - title: "Soft Deck Boards and Railing Posts That Move Under Load"
    description: |
      Decks built in the 1980s with minimally treated lumber have been through 40
      Pacific Northwest wet seasons. Near the ledger board attachment and at post
      bases sitting in low drainage areas, boards flex and posts rock. Sistering
      compromised joists, swapping individual boards with pressure-treated (PT)
      lumber, and re-securing railing posts to IRC guardrail code keeps the deck
      usable without a full rebuild costing five figures. Joist hangers on decks
      from this era are often undersized or corroded through — replacing them with
      current Simpson hangers and stainless hardware adds years without touching
      the decking surface. Post bases in contact with concrete pads need PT lumber
      minimum; if the original posts are set directly into soil, that's a dig-out
      and repost job before anything else makes sense.

faq:
  - q: "How fast can you get to Federal Way for handyman work?"
    a: |
      Federal Way sits right off I-5 at exits 142-143 — straightforward from
      Seattle or Tacoma, usually 25-35 minutes depending on the time of day.
      Most Twin Lakes and Steel Lake streets have easy street parking. Call
      (206) 591-1096 to book — Vladislav runs most jobs himself and can
      typically schedule within a week for non-emergency punch lists.
  - q: "Do you handle fixture replacement for brands like Moen, Kohler, and Whirlpool?"
    a: |
      Yes. Faucet swaps, toilet replacements, and light fixture installs across
      Moen, Kohler, and Samsung smart home devices are standard scope. Same for
      Whirlpool and GE appliance final hookups after delivery. Bosch dishwasher
      installs on existing supply and drain lines, KitchenAid range swap-outs
      where the gas stub is already in place — those are typical Federal Way
      kitchen update jobs that don't require a full remodel. Work is priced per
      job — no ambiguous hourly rates that balloon on simple installs.
  - q: "What does a handyman punch list visit actually cost in Federal Way?"
    a: |
      Depends on count and complexity. Six to eight touchup items after a major
      remodel — hardware install, caulking, a drywall patch or two — typically
      runs a few hours of direct labor. Schedule a free on-site consultation with
      Vladislav. He quotes per project with line-item pricing, not vague ranges.
      Owner shows up, owner quotes, owner does the work. Deadline commitments
      go into the contract with penalty language — that's how the schedule stays real.