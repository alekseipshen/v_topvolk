title: "Federal Way Bathroom Remodel — Fix What the '90s Builders Left Behind"

intro: |
  Mirror Lake sits in the center of Federal Way's 98003 zip, surrounded by
  tract homes that went up fast in the early 1990s — builder-grade everything,
  bathrooms included. A Moen single-handle from 1992 that drips all night,
  vinyl flooring laid over bare plywood, no waterproofing membrane behind the
  tub tile. Vladislav walks through these bathrooms every week. What looks like
  a simple refresh usually turns into a full gut once the wall opens up.

localContext: |
  The 98003 and 98023 zip codes cover most of Federal Way's residential
  neighborhoods — Steel Lake, Dash Point, Redondo Heights — and the housing
  is overwhelmingly late 1980s to mid-1990s tract construction. Builders used
  greenboard drywall as the tile backer behind tub surrounds, not a
  waterproofing membrane. After 30 years of PNW humidity, that greenboard is
  usually saturated. A few older 1970s ranchers near Jovita have cast-iron
  drain stacks that need rerouting before any layout change is possible.

commonProblems:
  - title: "Saturated Greenboard Behind the Tile — Hidden Damage From 30 Years of Humidity"
    description: >
      Federal Way runs humid from October through May, and original builders
      used standard greenboard drywall as the tile substrate — not a
      waterproofing membrane. When Vladislav opens these walls, there's
      usually black mold starting behind the first tile row. The correct fix
      is full demo back to studs, then Schluter Kerdi membrane or RedGard
      coating applied before any new tile goes up. Patching over it doesn't
      hold.

  - title: "Worn Moen and American Standard Cartridges — Drips, Temperature Swings, Low Pressure"
    description: >
      Homes in the 98003 zip built between 1988 and 1997 commonly have
      original single-handle cartridges that are done — constant drips,
      scalding temperature spikes, weak pressure. Replacing the trim kit
      without addressing the corroded galvanized supply lines behind the
      wall just delays the next failure. New Kohler or Moen fixtures go in
      after the supply lines are cleared out.

  - title: "Converting the Unused 60-Inch Alcove Tub to a Walk-In Shower"
    description: >
      The standard Federal Way master bath has a 60-inch tub surround that
      hasn't been used in years. Converting to a curbless or curbed walk-in
      shower means rerouting the drain, resizing the rough-in opening, and
      waterproofing the full wet area with Schluter or RedGard. Large-format
      porcelain on the walls and floor finishes it off — not the 4×4 builder
      tile that's been there since 1992. ADA grab-bar blocking goes in at the
      same time for any homeowner planning ahead.

faq:
  - q: "How fast can you get to Federal Way for a bathroom remodel consultation?"
    a: >
      Federal Way is 25-30 minutes south via I-5, depending on traffic.
      Vladislav schedules free on-site walkthroughs within a few days of
      first contact. Call (206) 591-1096 directly — you'll talk to the owner,
      not a scheduling coordinator.

  - q: "What fixture and tile brands do you work with on Federal Way bathroom remodels?"
    a: >
      For mid-range budgets, Kohler and Moen hit the right price-to-quality
      mark. Large-format porcelain from MSI or Daltile is the standard choice
      for shower walls and floors. For waterproofing, Schluter Systems — not
      the greenboard approach the original builders used. Moen is fine for
      fixtures; the supply lines behind them are usually the problem, not the
      trim.

  - q: "How long does a Federal Way bathroom remodel take, and do I need a permit?"
    a: >
      A full 5×8 gut-remodel — demo, Schluter waterproofing, new tile, vanity,
      fixtures — runs 3-5 weeks of construction. Federal Way runs its own
      permit center through City of Federal Way Community Development. Plan
      review for drain relocations or structural changes takes 2-4 weeks.
      End-to-end with permits: 6-10 weeks. Timeline and deadline penalties
      are written into the contract — 100+ projects completed since 2017, WA
      Licensed Contractor.