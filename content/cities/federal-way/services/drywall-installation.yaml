title: "Federal Way Drywall Installation — Popcorn Removal, ADU Fire Walls, Level 5 Finish"

intro: |
  Split-levels along the Star Lake corridor (98003) were built fast in the late 1970s — 1/2-inch
  gypsum on every wall, popcorn ceilings in every room, no moisture protection in the basements.
  Forty-plus years of Federal Way's wet winters show. Homeowners pulling out dated Whirlpool ranges
  during kitchen remodels find the drywall behind the hood stained, soft, or crumbling where grease
  and steam soaked in for decades. That board has to come out before the new kitchen goes in.

localContext: |
  Twin Lakes (98023) and the neighborhoods south of Celebration Park developed mostly between 1975
  and 1995 — ranchers, split-levels, and two-stories with original builder-grade drywall that nobody
  ever upgraded. Garage separations in homes from this era typically have standard 1/2-inch board where
  IRC R302.6 now requires 5/8-inch type-X firecode board. WA HB 1337 (2024) has pushed more Federal
  Way homeowners toward garage-to-ADU conversions, and those projects trigger fire-separation
  requirements the original drywall was never built to meet. Federal Way permit pulls go through the
  city's own permit center — not King County DPER.

commonProblems:
  - title: "Moisture-Damaged Drywall in Below-Grade Bedrooms and Laundry Rooms"
    description: |
      Split-levels with below-grade bedrooms or laundry rooms are common throughout the 98003 zip —
      standard 1/2-inch drywall in those spaces has absorbed moisture for decades. Federal Way
      averages close to 38 inches of rain annually, and basements in older Twin Lakes homes feel every
      inch of it. Purple board (USG Sheetrock Mold Tough) paired with a continuous vapor barrier is
      the correct fix, not a skim coat over damaged board. Leaving standard gypsum against concrete
      block feeds mold behind the finish within two or three wet seasons.
  - title: "Popcorn Ceiling Removal and Level 5 Finish for Remodeled Kitchens and Baths"
    description: |
      Homes built before 1978 in Federal Way may have popcorn ceilings containing asbestos — state
      law requires testing before any scraping or disturbance. After abatement, the ceiling substrate
      needs skim-coating to Level 4 or full Level 5 finish before paint. Kitchens where homeowners
      have installed KitchenAid or Bosch range hoods with under-cabinet LED strips require Level 5
      specifically — raking sidewall light exposes every skip and trowel mark that Level 4 leaves
      behind.
  - title: "5/8-Inch Type-X Firecode Drywall for Garage Conversions and ADU Separation Walls"
    description: |
      Garage-to-ADU conversions in Federal Way require 5/8-inch type-X firecode board on all
      separation walls and ceilings under IRC R302.6 — standard 1/2-inch fails rough-in inspection
      every time. Adding Resilient channel before the type-X hang is the smart move when sound
      control between the ADU and the main house matters. That channel costs almost nothing at
      rough-in stage. Doing it after the board is up means tearing everything out and starting over.

faq:
  - q: "How fast can you get to Federal Way for Drywall Installation?"
    a: |
      Federal Way is 25-30 minutes south of Seattle via I-5 — we work in Twin Lakes, Steel Lake,
      and the West Campus corridor regularly. TopVolk is a WA Licensed Contractor with 100+ projects
      completed since 2017. Call (206) 591-1096 to set up a free on-site consultation directly with
      Vladislav — he does the estimate himself, not a sales rep.
  - q: "What drywall products do you spec for Federal Way bathrooms and basement remodels?"
    a: |
      Wet areas get purple board — USG Sheetrock Mold Tough or equivalent — with RedGard or Schluter
      Kerdi membrane at water contact points. Standard white board behind a tiled shower is a callback
      waiting to happen, and we see it regularly in 1980s Federal Way homes. Federal Way's wet climate
      makes moisture-resistant board non-negotiable for bathrooms and any below-grade application.
  - q: "What does a drywall project in Federal Way typically cost, and how long does it take?"
    a: |
      A bathroom drywall replacement runs 1-2 days on site. A full basement finish with Federal Way
      permit review — the city runs its own permit center — takes 4-6 weeks start to finish depending
      on review speed. Vladislav provides line-item quotes after walking the job, not ballpark ranges
      over the phone. Call (206) 591-1096 for a free site visit. Deadline penalties are written
      directly into the contract.