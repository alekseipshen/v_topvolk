title: "Federal Way Drywall Installation — 1970s Walls Done Right"

intro: |
  Steel Lake and Twin Lakes (98023) were built fast between 1965 and 1985 — split-levels and ranchers with 3/8-inch drywall on most walls, popcorn texture on every ceiling, and builder-grade kitchens that homeowners are now replacing with induction ranges and KitchenAid appliance suites.

  Rip a 1970s kitchen down to the studs and you find cracked panels, decade-old patches in three different textures, and original joints that were never properly taped the first time.

  Getting those walls prepped for a Level 5 finish means doing the work twice as carefully as anyone did it originally. That's not a complaint — it's just what the houses in this part of Federal Way require.

localContext: |
  Federal Way's housing — concentrated in 98003 and 98023 — went up during King County's growth period before the city incorporated in 1990. The bulk of the stock is standard 1/2-inch gypsum on interior walls, popcorn texture on ceilings, and garages that were never brought up to 5/8-inch type-X firecode board.

  Homes near Dash Point State Park and along the Steel Lake corridor are typical of this era: solid wood-frame bones, but drywall showing 40-plus years of settling cracks, DIY patches, and moisture damage in bathrooms and laundry rooms.

  King County DPER handles structural permit review for this jurisdiction. Most drywall scopes here don't need a separate permit — but any structural wall removal, garage conversion, or ADU separation wall triggers a plan review, and that changes the schedule.

commonProblems:
  - title: "Pre-1978 Popcorn Ceilings and Asbestos in Federal Way Split-Levels"
    description: |
      Homes in 98003 and 98023 built before 1978 may have asbestos in the popcorn texture — a common additive before the EPA phase-out. No scraping starts without a certified lab sample first.

      Once results clear, the ceiling gets scraped, primed, and skim-coated to Level 4 minimum. If the substrate is too damaged or water-stained, re-sheeting with new 5/8-inch panels is the cleaner path.

      Adding recessed dimmers after the finish will expose every high spot — so prep takes as long as the taping itself. Rush it and the shadows show everything under raking light.

  - title: "Wrong Drywall Substrate Behind Showers and Laundry Rooms"
    description: |
      Most Federal Way bathrooms and laundry rooms from the 1970s and 1980s were hung with standard gypsum — not mold-resistant board.

      Seattle Metro averages around 37 inches of rain annually, and interior humidity in poorly ventilated spaces accelerates deterioration fast. Behind any new Moen or Kohler shower surround, the correct substrate is purple board (National Gypsum Hi-Mold) or Schluter Kerdi membrane directly under tile. Standard gypsum behind a tiled shower in a crawlspace-foundation Federal Way home will fail well before the 10-year mark.

      The fix isn't complicated. It just has to be done before the tile goes in.

  - title: "Thin Single-Layer Walls Between Bedrooms in 1980s Builder-Grade Homes"
    description: |
      The 1/2-inch drywall between bedrooms in Federal Way's 1980s builder-grade homes provides almost no real sound attenuation — you hear everything through those walls.

      A resilient channel assembly decouples the new gypsum layer from the wood framing to break the structural sound path. Where space is tight, QuietRock panels handle it in a single layer without the full channel-and-hat retrofit assembly.

      Either approach means stripping one side of the wall, packing in insulation batts, and finishing to a meaningful STC rating. The room feels different afterward.

faq:
  - q: "How fast can you get to Federal Way for a drywall consultation?"
    a: |
      Federal Way is a regular stop. I-5 southbound puts the 98003 area about 25-30 minutes from Seattle off-peak — 35-40 from Kirkland or Bellevue.

      Most residential sites near Steel Lake and Twin Lakes have street or driveway parking. Call (206) 591-1096 to schedule a free on-site walkthrough. Vladislav does the estimate himself, not a commissioned closer, and brings a tape measure, not a price sheet.

  - q: "Does a Federal Way garage conversion or ADU separation wall require firecode drywall?"
    a: |
      Yes. Any garage-to-living-space conversion needs 5/8-inch type-X firecode drywall on the separation wall — that's an IRC requirement, and King County DPER confirms it at the rough-in inspection.

      All penetrations — electrical boxes, plumbing sleeves, recessed can lights — need listed fire-rated caulk or fire collars. Inspectors check this specifically before any finish coat goes on. It has to be right the first time or you're tearing back out.

  - q: "How long does drywall work take in a Federal Way kitchen or bathroom remodel?"
    a: |
      For a full kitchen gut — hang, tape, three coats to Level 5, sand, and prime — plan on 5-7 working days after the rough-in inspection passes. Bathroom installs with purple board and Kerdi membrane add a day.

      Patch work after plumbing or electrical rough-in is faster. Depends entirely on what the walls look like once the cabinets come out.

