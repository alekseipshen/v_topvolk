title: "Federal Way Insulation — R-49 Upgrades & Crawl Space Encapsulation"

intro: |
  Six months of rain, crawl spaces that stay damp through April, and attics still
  running R-19 from the original 1985 build — that's the starting point for most
  homes in Steel Lake and Twin Lakes (zips 98003 and 98023). PSE serves Federal Way
  and currently offers rebates on blown-in insulation and crawl space encapsulation
  that meaningfully reduce out-of-pocket costs. TopVolk uses CertainTeed blown-in
  cellulose, installs to R-49 per the Seattle Energy Code, and handles everything
  from attic air sealing to closed-cell spray foam on the rim joists. Deadline
  commitments are written into the contract — and penalties paid if we miss them.

localContext: |
  Federal Way incorporated in 1990, but most of the housing went in beforehand —
  tracts of ramblers, split-levels, and two-story colonials built between 1975 and
  1995 across what used to be logged-off timber land between I-5 and Puget Sound.
  Zip 98003 covers the older southwestern sections near Celebration Park and the
  Hylebos Wetlands; 98023 runs through Twin Lakes out toward Dash Point State Park.
  Both areas carry a high percentage of homes with crawl spaces, original fiberglass
  batt insulation, and no meaningful vapor barrier under the floor — exactly what the
  PNW climate punishes hardest over a wet winter.

commonProblems:
  - title: "Attic Insulation Below R-49 — Paying to Heat the Sky All Winter"
    description: >
      Most Federal Way ramblers and split-levels came out of the ground with R-19 in
      the attic — adequate for 1985 utility rates, not for what PSE charges now. Blown-in
      cellulose from Owens Corning brings an attic to R-49 in a single crew day without
      tearing anything apart. Air sealing the top plates before adding depth matters as
      much as the R-value — skipping that step leaves 30% of the heat loss in place.
      PSE rebates currently offset a meaningful portion of the project cost, especially
      when stacked with other weatherization work already on the list.

  - title: "Crawl Space Moisture — Ground Water, Open Vents, and a Disintegrated Vapor Barrier"
    description: >
      Homes in the 98003 zip near the Hylebos Wetlands sit in a drainage basin that
      stays saturated October through April. Original crawl space construction used
      6-mil poly — often torn, bunched against the pier blocks, or missing in full
      sections by now. Full encapsulation means a 20-mil reinforced vapor barrier
      across the dirt floor, sealed to the stem walls with tape and mastic, rigid foam
      on the foundation walls, and a dehumidifier tied into the system. Done right, it
      stops the subfloor from cupping and keeps the Douglas-fir framing dry year-round.

  - title: "Uninsulated Rim Joists — The Air Leak Nobody Budgets For"
    description: >
      On a 1980s Federal Way split-level, the rim joist band running around the
      perimeter of the floor system is often completely bare — no insulation, gaps
      at the sill plate, cold air pulling straight in all winter. Two to three inches
      of closed-cell spray foam on the rim joist creates an air barrier and R-13 to
      R-21 in a single afternoon. Rockwool mineral wool cut-and-cobble works in the
      same space if off-gassing is a concern during an occupied remodel. Either way,
      it's one of the highest-impact upgrades relative to cost on these builds.

faq:
  - q: "How fast can you get to Federal Way for Insulation?"
    a: >
      Federal Way sits right on I-5 — a straightforward run south from anywhere in
      the King County service area. Vladislav handles every site visit himself; no
      estimator, no sales staff. Call (206) 591-1096 to schedule. Most consultations
      happen within the week, and the initial visit is free with no commitment required.

  - q: "Do you use blown-in cellulose or fiberglass batt for attic upgrades in Federal Way?"
    a: >
      Depends on the attic geometry. CertainTeed and Owens Corning blown-in cellulose
      hits R-49 faster in irregular spaces with cross-framing — common in these 1980s
      and 90s builds. Rockwool mineral wool batts work better for floor assemblies during
      a remodel where soundproofing matters between levels — denser, fire-resistant, and
      easier to fit around MEP runs. We spec based on what we find on the walk-through,
      not a preset package.

  - q: "What permits are required for insulation work in Federal Way?"
    a: >
      Insulation-only work — attic top-up, crawl space liner replacement — usually
      doesn't require a City of Federal Way permit. If the project is part of a larger
      structural remodel or addition, the permit center reviews the full scope. TopVolk
      is a WA Licensed Contractor with 100+ projects completed since 2017. We identify
      what triggers permitting on the first site visit and build the review timeline into
      the project schedule from day one.