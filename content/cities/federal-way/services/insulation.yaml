title: "Federal Way Insulation — R-49 Upgrades, Crawlspace Sealing"

intro: |
  Heating bills in the 98003 zip tell the story before you open the attic hatch.

  Federal Way's residential builds from the 1975-1995 boom — Twin Lakes, Steel Lake, Lakeland — came standard with R-11 to R-19 attic insulation that was code-legal at the time and underperforms badly now. Owens Corning batts compressing under decades of attic foot traffic lose R-value fast. The gap between what that original insulation was rated and what it actually delivers today shows up directly in your utility bill every November through March.

  TopVolk upgrades attics to R-49 and seals crawlspaces so Puget Sound moisture stops doing structural damage below the subfloor. Vladislav Volkov has handled insulation scopes on 100+ projects since 2017 across King County — including a lot of Federal Way's 1980s split-level stock.

localContext: |
  Federal Way was still unincorporated King County when most of its housing stock went up. Zip codes 98003 and 98023 are dominated by 1970s split-levels and 1980s tract colonials — framed with standard Douglas-fir, minimal air sealing, and crawlspaces that drain poorly after heavy October-through-March rain.

  The area around Dash Point Road and the Steel Lake corridor sits on relatively flat ground with clay-heavy soil that doesn't drain quickly. That means post-rain ground moisture lingers long enough to drive up crawlspace humidity well into spring, even in years with a dry April.

  Building permits for renovation work run through City of Federal Way Community Development (for incorporated parcels) or King County DPER depending on lot status. Insulation-only scopes typically don't require a permit in Federal Way — but any work touching the vapor barrier as part of a larger crawlspace encapsulation tied to structural repairs may need one. Either way, the crawlspace under a 1982 build near Dash Point Road is probably holding moisture year-round regardless of what paperwork it does or doesn't generate.

commonProblems:
  - title: "Compressed Attic Batts Testing Below R-20"
    description: "Fiberglass batts — often CertainTeed or Johns Manville product from original
      construction — compress over time between joists and lose R-value. Federal Way attics
      routinely test well below spec. This is especially common in the Lakeland neighborhood
      where 1985-1992 builds used shallow 2x6 rafter bays that never had room for adequate
      depth to begin with. Blown-in cellulose layered over existing batts brings attic depth
      back to R-49 per current Seattle Energy Code without tearing out the ceiling below,
      which matters when budget is limited. Air-sealing the attic floor — top plates, light
      fixture boxes, any HVAC penetrations — happens before the blow-in so the insulation
      isn't just covering active leakage paths."

  - title: "Crawlspace Vapor Barrier Failure and Rim Joist Rot"
    description: "Grade-level crawlspaces in 98023 homes see standing water after heavy rain months.
      Plastic sheeting installed in the 1990s tears and bunches, allowing ground moisture to
      attack rim joists and subfloor sheathing. Rim joist rot is quiet damage — it doesn't
      announce itself until a punch list inspection or a home sale triggers a closer look.
      Proper encapsulation means 20-mil vapor barrier sealed to the foundation wall, rigid
      foam on the interior stem wall, and mechanical ventilation or a sealed-conditioned
      approach depending on the foundation type. If the rim joist framing itself is soft,
      that gets sistered or replaced before any foam goes on — covering compromised wood
      just delays the problem."

  - title: "Air Leakage at Knee Walls in Split-Level Builds"
    description: "Split-level homes in Twin Lakes and the Lakeland area — the dominant format
      in Federal Way's 1980s development — have knee walls in upper stories and exposed rim
      joists in the crawlspace. Both are major air-leakage points. No amount of HVAC capacity
      compensates for a knee wall cavity that's open to attic air on one side.

      Closed-cell spray foam on the rim joist seals the thermal boundary and solves the cold-floor
      complaint in one pass. Knee walls get rigid foam or batt plus a continuous air barrier
      on the attic-facing side. The combination drops infiltration rates measurably — you'll
      feel the difference the first cold week after the work is done."

