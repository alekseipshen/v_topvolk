title: "Federal Way ADU Construction — Build a Legal Rental on Your Lot"

intro: |
  Federal Way's commuter position — halfway between Seattle and Tacoma on I-5, with hospital
  workers at St. Francis, contractors cycling through Joint Base Lewis-McChord, and remote workers
  priced out of Bellevue — keeps rental demand running year-round. A backyard DADU near
  Celebration Park or Steel Lake isn't speculative. Under WA HB 1337, the 7,000 sq ft lot your
  1984 rancher sits on in 98003 can now legally support two additional dwelling units. Even a
  compact attached ADU with a Bosch induction range and stacked laundry pencils out at real
  monthly rental income on property you already own.

localContext: |
  Federal Way's single-family stock is dominated by 1975-1995 ranch-style and split-level homes —
  subdivisions that spread east of Pacific Highway toward the Auburn border and north into 98023
  near Twin Lakes and Dash Point. Lot sizes in those zip codes typically run 7,000-9,500 sq ft,
  which clears the rear setback and FAR math for a freestanding DADU in most configurations.
  Building permits here go through the City of Federal Way Community Development Department — not
  King County DPER, which handles unincorporated areas only. Plan review for a new DADU typically
  runs 6-10 weeks; pre-approved ADU plan sets available through the state program can shorten
  that window considerably.

commonProblems:
  - title: "One utility service point is the hidden cost driver in most Federal Way DADU projects"
    description: |
      Ranch-style homes built in Federal Way during the 1980s were designed for a single household:
      one water meter, one sewer lateral, one service drop. A detached ADU needs either its own
      separate service connection or a documented shared-service agreement that satisfies Lakehaven
      Utility District. Trenching new water and sewer lines from the street — plus sidewalk concrete
      restoration — runs $10,000-18,000 before a single framing member goes up. Miss that line item
      early and the project stalls mid-construction waiting for utility permits.

  - title: "The 24-foot DADU height limit hits faster than expected on sloped 98023 lots"
    description: |
      Statewide code caps detached ADU height at 24 feet, measured at the midpoint of the roof
      ridge. On the sloped terrain common near Dash Point State Park in 98023, a stepped stem-wall
      foundation can absorb three to four feet of that allowance before framing even begins. Any
      vaulted ceiling condition then requires LVL beam sizing that further reduces usable interior
      height. Surveying the actual building envelope before finalizing the floor plan design avoids
      expensive redesign fees after permit submittal.

  - title: "Crawlspace vapor barrier failures are routine on new ADU foundations in this climate"
    description: |
      Federal Way averages close to 37 inches of rain annually, and the bulk of it falls October
      through May. New detached ADU foundations on stem walls without a proper 6-mil poly vapor
      barrier and full rim joist air sealing consistently fail rough-in inspection for moisture
      control. All framing within 8 inches of grade requires pressure-treated (PT) lumber — not
      standard dimensional. Exterior cladding on north-facing walls should be Hardie cement-board;
      vinyl traps moisture behind the substrate in this climate and creates a mold remediation
      problem within three seasons.

faq:
  - q: "How fast can you get to Federal Way for ADU construction?"
    a: |
      Federal Way is a regular stop in our King County schedule — we're typically on-site within
      2-3 business days for a free consultation. From our Seattle base, Federal Way is 35-40
      minutes via I-5 South. Call (206) 591-1096 to reach Vladislav directly. No scheduler,
      no intake form, no sales call.

  - q: "What brands do you spec for Federal Way ADU kitchens and mechanical systems?"
    a: |
      For a rental-grade DADU, Bosch or GE compact appliances fit the price point and hold up
      under tenant use. Mitsubishi ductless mini-splits handle heating and cooling without
      ductwork — critical in a tight floor plan. Navien tankless water heaters free up
      mechanical room square footage. For windows, Milgard is solid value; Pella if the
      owner-occupant wants the step-up.

  - q: "What does a DADU in Federal Way actually cost, and how long does the process take?"
    a: |
      A 400-600 sq ft DADU in Federal Way typically runs $160,000-$230,000 fully finished —
      site conditions and utility separation work are the main variables. Timeline: City of
      Federal Way permit review 6-10 weeks, construction 4-5 months, roughly 7-9 months
      end-to-end. TopVolk is WA Licensed Contractor with 100+ projects completed since 2017.
      Vladislav provides a line-item quote after the on-site visit — no vague ranges.
      Missed deadlines carry a written financial penalty in every contract.