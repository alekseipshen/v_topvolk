title: "Federal Way Plumbing — Polybutylene & Pressure Line Upgrades"

intro: |
  Twin Lakes and the Mirror Lake neighborhoods sit in the middle of Federal Way's 1978-1992 construction era — thousands of homes built when polybutylene pipe was the plumbing industry standard. Bosch dishwashers and LG refrigerators get replaced, but the supply lines feeding them often haven't been touched since the original rough-in. In 98023, failing gray poly and corroded shutoff valves are the plumbing calls we get most. Vladislav Volkov has worked through enough Federal Way slab-on-grade homes to know exactly where these plumbing lines hide and how they fail.

localContext: |
  The 98023 corridor along Dash Point Road holds most of Federal Way's mid-1980s tract development — two-story colonials and split-levels with builder-grade plumbing that's never been updated. Military Road and the S 272nd Street pocket in 98001 has older stock — 1960s ranch homes where galvanized supply lines have corroded to roughly half their original interior diameter. Federal Way gets its water from Lakehaven Utility District, and static pressure at the meter frequently runs above 80 psi without a functioning pressure regulator downstream. That's a plumbing problem that silently damages fixtures for years before anything visibly fails.

  The Steel Lake and Celebration Park areas in 98003 sit on slightly higher ground — homes there were typically built in the late 1980s and early 1990s, squarely in the polybutylene era. Crawlspace access in these homes is tight, and the vapor barrier condition underneath often tells the plumbing story before you look at the pipe. Standing moisture accelerates corrosion at every threaded connection. Twin Lakes homes closest to Puget Sound have the added factor of Pacific Northwest humidity cycling — wet winters push moisture into uninsulated crawlspaces, and pressure swings at plumbing fittings do the rest.

commonProblems:
  - title: "Polybutylene Pipe Failure in 1980s Tract Homes"
    description: |
      Gray polybutylene supply lines — sold under the Quest brand — were installed in most Federal Way homes built between 1977 and 1995. They degrade from chlorine in municipal water, cracking at compression fittings first, then splitting mid-run. Full plumbing replacement with PEX-A or Type L copper is the only reliable fix. Partial repairs at individual fittings fail within a year or two and void most home warranties.

      In Federal Way's slab-on-grade homes along Pacific Highway South in 98003, poly runs embedded in the slab itself — those sections can't be accessed or rerouted without saw-cutting. The standard plumbing approach is to abandon in-slab runs and repipe through interior walls and the attic. It adds a day to the job but eliminates the failure point permanently. Vladislav prices this plumbing work with a detailed line-item quote — no vague estimate that doubles at rough-in.

  - title: "City Water Overpressure Damaging Fixtures and Valve Stems"
    description: |
      Lakehaven's supply pressure runs above 80 psi in lower-elevation neighborhoods toward Puget Sound. That overpressure stresses every plumbing fitting and valve stem in the house. Moen and Kohler fixtures are engineered for 60-80 psi — sustained overpressure shortens their lifespan and causes braided supply tube failures under the sink. A pressure reducing valve (PRV) installed at the main shutoff corrects it in a few hours.

      Older PRVs in Federal Way homes — often original to the 1980s build — lose their diaphragm flexibility over time and stop regulating accurately. A bad PRV can read 60 psi at the gauge while passing 90 psi downstream. Plumbing replacement runs about two hours and requires a main shutoff at the Lakehaven meter. Call (206) 591-1096 to schedule a pressure check before replacing fixtures that keep failing.

  - title: "Tankless Water Heater Conversion — Gas Line and Permit Requirements"
    description: |
      Converting from a standard 40-gallon tank to a Rinnai or Navien tankless unit requires more than swapping equipment. Most 1980s Federal Way homes have half-inch gas supply lines — tankless units demand three-quarter-inch minimum for adequate BTU input. The City of Federal Way requires a plumbing permit, rough-in inspection, and seismic strapping on the new unit before final sign-off.

      Permit review at Federal Way's Community Development department typically runs two to five business days for a water heater replacement with gas line upsizing. Vladislav handles the permit application, inspection scheduling, and final sign-off coordination — that's written into the project scope, not billed separately. TopVolk is WA Licensed Contractor with 100+ projects completed since 2017 across King County.

faq:
  - q: "How fast can you get to Federal Way for plumbing work?"
    a: |
      Federal Way is about 25 miles south of Seattle — typically on-site within 24-48 hours for scheduled plumbing work. I-5 and SR-99 both run straight through the city. Call (206) 591-1096 to check availability or schedule a free on-site consultation with Vladislav directly. You're talking to the owner who will actually be on the job — not a sales rep who hands it off.

  - q: "Do you handle Moen and Kohler fixture replacements during bathroom remodels?"
    a: |
      Moen, Kohler, and Delta are the standard for Federal Way remodels across most price points. Supply line connections, drain rough-in, shutoff valve replacement, and final plumbing trim-out are all handled directly by Vladislav — no subcontractor shuffle. Scope and timeline are written into the contract, deadline terms included. For larger bathroom plumbing remodels, rough-in inspection scheduling with the City of Federal Way gets coordinated during the project — not after the walls are already closed.

  - q: "Does a water heater replacement require a plumbing permit in Federal Way?"
    a: |
      Yes. The City of Federal Way requires a permit for water heater replacements — standard review runs one to two business days for like-for-like swaps, longer if the gas supply line needs upsizing to three-quarter-inch. Seismic strapping per current WA code is required on every new plumbing install. TopVolk (WA Licensed Contractor, 100+ projects since 2017) handles the permit application and inspection scheduling. Call (206) 591-1096.