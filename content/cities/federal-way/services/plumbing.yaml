  - q: "Do you work with Moen, Kohler, and Delta fixtures on remodels?"
    a: |
      Yes — those three cover most of what we spec on bathroom and kitchen remodels in this area. Moen for cartridge reliability, Kohler for tub and sink fixtures, Delta for shower valves. Fixtures get itemized in the written quote. No vague allowances — line-item pricing from the start. TopVolk is WA Licensed Contractor, 100+ projects completed since 2017.

  - q: "What does permit-required plumbing work cost and how long does it take?"
    a: |
      A full bathroom replumb with fixture upgrades typically runs 3-5 weeks once the King County permit issues — plan review alone takes 2-4 weeks for significant scope. Costs depend on pipe runs and fixture count. Vladislav quotes line-by-line after the on-site visit. Deadline penalties are written into the contract. Schedule a free consultation at (206) 591-1096.

      For tankless conversions with gas line work, budget a separate mechanical permit through the City of Federal Way Building Department — that review runs parallel to the plumbing permit but requires its own inspection sequence. Most homeowners don't factor that second permit into the timeline until they're already mid-project.