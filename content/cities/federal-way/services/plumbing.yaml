title: "Federal Way Plumbing — Pipe Replacement & Remodel Rough-In"

intro: |
  Twin Lakes and the neighborhoods ringing Steel Lake were mostly built between 1972 and 1991 — the exact window when polybutylene supply lines were standard issue in tract construction. Those gray poly pipes are failing throughout Federal Way's older housing stock, and a Rinnai tankless conversion typically means rerouting gas supply and relocating the water manifold before any other trade touches the wall. Plumbing here sets the schedule for everything else on a remodel. Get the pipe scope wrong and you're reopening walls after drywall is already hung.

localContext: |
  Zip codes 98003 and 98023 cover a dense band of split-levels and ranch-style homes built between 1968 and 1985. Many still run original galvanized supply lines or the era's polybutylene piping — neither handles the 80+ psi water pressure common on Federal Way's city supply without degrading over time. Dash Point-area homes near the bluff can read even higher static pressure at the meter. A pressure regulator valve is frequently the first line item on the plumbing scope before touching any fixtures or drain lines.

  The Camelot and Lake Grove neighborhoods add another layer of complexity — original drain lines in these 1970s homes are often 3-inch ABS or cast iron, undersized by current IRC standards for a full bath addition. King County DPER permits for drain upsizing require a rough-in inspection before the subfloor goes back down. Scheduling that inspection into the project timeline is something most homeowners don't factor in until they're already mid-demo.

commonProblems:
  - title: "Polybutylene Pipe Failure in 1980s Federal Way Tract Homes"
    description: |
      Poly-B supply lines — that dull gray piping installed through the early 1990s — degrade from chlorine in city water. The fittings fail before the pipe, but both need replacing. Full repipe to PEX-A or copper requires a King County DPER permit and a rough-in inspection before walls close. A Moen pressure-balancing valve at each shower is usually folded into the same scope.

      PEX-A with a manifold system is the cleaner solution in these tract layouts — individual shutoffs for each fixture zone without cutting into every wall cavity. The manifold lives in a utility area or garage, which makes future service faster. Most Federal Way repipes in this housing stock run through the attic or crawlspace to avoid opening finished walls in the living area.

  - title: "Tankless Water Heater Conversion Requiring Gas Line Upsize"
    description: |
      Switching a 40-gallon tank unit to a Navien or Rinnai condensing tankless means the existing half-inch gas supply line rarely meets minimum BTU demand — most units need three-quarter inch from the meter. That's permit work through the City of Federal Way, plus seismic strap inspection on the new unit per Washington State code. Condensate drain lines almost always need rerouting too.

      Federal Way's older split-levels often have the water heater in a tight mechanical closet not vented for a power-vent unit. Relocating to the garage adds linear footage to the gas run but solves the venting problem cleanly. The Navien NPE-240A2 is a common spec in this size home — enough output for two bathrooms running simultaneously without pressure drop at the shower.

  - title: "High City Water Pressure Killing Fixture Cartridges Early"
    description: |
      Federal Way's municipal supply regularly tests above 80 psi in lower-elevation zones — the threshold where Kohler and Delta fixture cartridges wear out fast and braided supply hoses start bulging at the fittings. Installing a pressure regulator valve at the main entry drops working pressure to 60-65 psi. Most homeowners discover the problem after replacing the same faucet cartridge twice in eighteen months.

      The PRV installs at the main shutoff, typically in the crawlspace access or at the meter wall. A thermal expansion tank on the water heater is usually added at the same time — closed systems with a PRV build pressure on the heater side without one. It's a $400-600 add to the plumbing scope that prevents fixture damage for years.

