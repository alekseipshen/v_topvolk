title: "Federal Way Painting — Pre-1978 Lead and Cedar Repaint"

intro: |
  Twin Lakes (98023) sits on a hillside above Steel Lake with block after block of
  split-levels and ranchers built between 1966 and 1982 — most on their third or
  fourth coat and well past due. Federal Way averages 37 inches of rain per year.
  North-facing cedar siding stays damp from October through May, and that moisture
  cycle is why Vladislav uses Sherwin-Williams Duration Exterior as the default
  finish coat — it stretches over existing crazing instead of peeling off the
  following spring.

  TopVolk Construction LLC, WA Licensed Contractor, has completed 100+ projects since
  2017 across King, Snohomish, Pierce, and Kitsap counties.

  Painting here is not a cosmetic job. The combination of older housing stock,
  documented lead layers, and a climate that punishes shortcuts makes prep work
  account for more than half the project. Vladislav shows up to consultations with a
  moisture meter and a lead test kit, not a brochure.

localContext: |
  Most of the housing stock between 320th and 348th Streets — zip 98003 — dates to
  the 1970s and includes original cedar shake and T1-11 plywood siding painted over
  multiple times.

  The neighborhoods west of Pacific Highway S near Mirror Lake run even older, with
  Craftsman-era builds where lead-based paint on trim, soffits, and window sashes is
  documented. That's not speculation — it's what turns up when you run a 3M LeadCheck
  swab on the third layer of paint on a 1962 door casing.

  City of Federal Way handles permits within city limits; King County DPER covers
  unincorporated pockets just outside the city boundary — two different plan-review
  offices depending on your parcel. Knowing which AHJ applies before you start
  matters for EPA RRP documentation routing.

commonProblems:
  - title: "Lead-Based Paint on Pre-1978 Trim and Window Sashes"
    description: "Homes built before 1978 in the 98003 and 98023 zips commonly have
      four to six layers of paint on door frames, porch trim, and double-hung window
      sashes — with lead somewhere in the stack. EPA RRP (Renovation, Repair, and
      Painting) rules require certified contractors to test, contain, and document
      disposal before scraping a single square foot. Vladislav carries EPA RRP
      certification. No workarounds on containment protocol.

      The containment setup alone — poly sheeting on the ground, negative-pressure
      staging, HEPA vacuum on all sanded surfaces — takes half a day before a brush
      touches anything. Homeowners who got a cheaper bid from someone who skipped
      this step are now dealing with liability exposure and a repaint that has to be
      done correctly the second time anyway."
  - title: "Cedar Siding Paint Cycle Compressing to 4 Years Instead of 7"
    description: "Raw cedar on north-facing walls absorbs moisture during PNW rain
      season and swells and shrinks with freeze-thaw cycles common in the foothills.
      Paint lifts in sheets rather than chalking off gradually.

      The fix is mechanical prep — scraping, sanding, spot-priming bare wood with an
      oil-based alkyd primer — before two coats of 100% acrylic latex. Skipping the
      alkyd prime coat is almost always why the previous repaint didn't last. On
      T1-11 panel siding, pay particular attention to the vertical grooves where water
      pools: those edges need back-priming before installation or caulking and spot
      prime on an existing repaint. Vladislav caulks with Sashco Lexel on cedar
      joints rather than standard paintable latex — it stays flexible when the wood
      moves."
  - title: "Bathroom and Laundry Room Paint Peeling at Tape Joints"
    description: "1970s Federal Way homes were built with 50-CFM exhaust fans that
      can't handle a full shower. Paint fails at drywall tape joints first, then
      bubbles on the ceiling.

      The solution is vapor-barrier primer, a moisture-resistant finish coat —
      Benjamin Moore Aura Bath and Spa holds up well in low-ventilation bathrooms —
      and fixing the actual exhaust fan before picking up a brush. Painting over the
      symptom without addressing airflow buys maybe two years. In bathrooms where
      there's no ceiling fixture at all, Vladislav will call out that the exhaust
      upgrade needs to happen before scheduling the paint, not after."

faq:
  - q: "How fast can you get to Federal Way for a painting project?"
    a: "Federal Way is 30-40 minutes from central Seattle via I-5 — straight shot
      to the 320th or 348th exits. Vladislav schedules Federal Way consultations
      most weekday mornings. Call (206) 591-1096 and he'll come out with a moisture
      meter and do a real walk-through, not a driveway estimate."
  - q: "What paint products do you use on Federal Way exteriors?"
    a: "Sherwin-Williams Duration or Emerald Exterior on most cedar and Hardie
      siding jobs. Benjamin Moore Aura for interior walls and bathrooms. The primer
      matters more than the finish on cedar — alkyd primer on bare spots before any
      top coat. Behr Marquee is fine on interior walls where UV and moisture aren't
      factors. Vladislav brings samples and discusses sheen levels on-site."
  - q: "Do you need a permit to repaint a house in Federal Way, and how long does it take?"
    a: "Standard exterior repaint — no permit required in Federal Way. For pre-1978
      homes, EPA RRP documentation is filed before work starts; that's federal, not
      a city permit. A single-family exterior including power wash, prime, and two
      finish coats runs 4-6 days. Deadline is written into the contract with a
      penalty clause — not a verbal promise. Call (206) 591-1096 for a line-item
      quote."