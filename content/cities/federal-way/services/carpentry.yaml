title: "Federal Way Carpentry — Trim & Built-ins for 70s–80s Split-Levels"

intro: |
  Split-levels and ranchers built along the Twin Lakes and Mirror Lake corridors in the 1970s and '80s came with finger-jointed pine trim now spending its third decade under coats of latex — and it shows. A KitchenAid range hood surrounded by warped cabinet rail-and-stile frames, or a stair landing with sagging baluster posts, isn't cosmetic anymore. Federal Way's builder-grade interiors in the 98023 zip are aging into full-replacement territory. Matching original profiles and fixing structural trim takes an actual finish carpenter with millwork knowledge — not a drywall crew with a nail gun.

localContext: |
  The 98003 zip — east of Pacific Highway S toward Steel Lake Park — holds one of the densest concentrations of 1970s–80s tract ranchers in King County. Most have had Milgard vinyl replacement windows installed over the past two decades, which means original casing profiles were often hacked off or buried under new jamb extensions, leaving mismatched trim heights throughout the house. Low-slope rooflines and minimal overhangs mean cedar fascia boards have been rain-soaked every October through April for forty-plus years. Interior sills around original window openings carry soft spots from seasonal condensation that never properly dries out.

commonProblems:
  - title: "Split-Level Stair Stringers Checking and Splitting at the Tread Nose"
    description: "Late 1960s and 1970s split-levels in Federal Way typically used Douglas-fir stringer boards with tread cuts that are now checking at the nose and pulling away from the wall stringer. That's structural, not cosmetic — a compromised stringer triggers corrections at rough-in inspection under IRC stair code Section R311. Stringer rebuilds paired with replacement treads and risers in 5/4 oak typically run $2,800–$5,500 depending on the stair run length."
  - title: "Rotted Cedar Fascia and Soffit Trim on Low-Overhang Ranchers"
    description: "Minimal roof overhangs on 1970s Federal Way ranchers leave cedar fascia fully exposed to winter rain. End-grain rot starts at the miter joints and works inward — by the time it's visible from the ground, the board is often soft a full foot back. Back-primed Hardie trim board at the original fascia profile is the practical replacement; filler and repaint buys maybe two seasons before you're doing it again."
  - title: "Racked Built-in Bookshelves From Humidity Cycling in PNW Winters"
    description: "Original builder-installed built-ins across the Twin Lakes and Dash Point neighborhoods are typically dadoed particleboard with veneer faces — not solid wood. Humidity cycling through PNW winters causes the carcasses to rack and doors to bind. Replacement with solid-wood face frames and plywood box construction eliminates the problem; shimming the old unit back to plumb doesn't, because the swelled particleboard won't hold square."

faq:
  - q: "How fast can you get to Federal Way for Carpentry work?"
    a: "Federal Way is a straight shot down I-5 — 25–35 minutes from Seattle without traffic, under an hour even with it. Site visits run Tuesday through Saturday, and we typically book initial walkthroughs within 3–5 business days. Call (206) 591-1096 to set a time with Vladislav directly."
  - q: "Can you match 1970s trim profiles that aren't sold at Home Depot?"
    a: "Most 1970s Federal Way homes used a 2¼\" Colonial casing with a simple ogee profile — still sourced through Puget Sound millwork suppliers. When a profile is truly discontinued, we run a router template match and mill to order. Milgard window installs from the 2000s added a second layer of casing mismatch in many of these houses, so sorting layered profiles is routine work here. Expect 1–2 weeks lead time for custom millwork runs."
  - q: "What does a built-in bookcase cost, and how long does the project take?"
    a: "A single-wall built-in with face frames, adjustable shelving, and painted MDF doors runs $3,800–$7,500 depending on height and linear footage. A window seat with storage base and upholstered pad adds $1,200–$2,500. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023 — Vladislav quotes line-item pricing with deadline penalties written into the contract. Schedule a free on-site consult at (206) 591-1096."