title: "Federal Way Deck Installation — Ledger, Footings, Permits Done Right"

intro: |
  Twin Lakes and Steel Lake (98023) are packed with 1980s ranch homes and split-levels where the
  original wood deck is already rotting off the back of the house. Ledger boards nailed straight to
  the rim joist with no flashing — 37 inches of annual rain finds every gap, every time. TimberTech
  and Trex composite hold up in this climate far better than cedar on open-air decks. Properly set
  PT lumber footings and correct ledger flashing are what separate a 30-year deck from a 10-year
  replacement. Vladislav Volkov, WA Licensed Contractor, has completed 100+ projects across south
  King County since 2017 — call (206) 591-1096 to schedule a free on-site consultation.

localContext: |
  Federal Way's housing stock leans heavily toward 1980s and early-1990s tract construction —
  ranches, split-levels, and two-stories built fast for south King County's growing population.
  The 98003 zip around Dash Point State Park mixes mid-century homes with newer builds, and some
  lots have original post-and-pier foundations that affect how ledger attachment gets engineered.
  Mature tree canopy throughout these neighborhoods means shade, and shade means moss on any wood
  surface within two to three wet seasons.

commonProblems:
  - title: "Cedar Decks in Federal Way's Shaded Lots Moss Over Before the Third Winter"
    description: >
      North-facing lots in Twin Lakes and Steel Lake accumulate enough moisture between October and
      May that untreated cedar surfaces turn gray and mossy faster than most homeowners expect.
      Composite decking from TimberTech or Trex doesn't absorb water — moss has nothing to anchor to.
      On covered structures or tight budgets cedar still works, but open-air decks in these
      neighborhoods need regular sealing, and missing two maintenance cycles accelerates deterioration
      significantly. Fiberon is another composite option that fits mid-range project budgets well.
      Call (206) 591-1096 — Vladislav assesses the existing deck framing and tells you upfront what
      needs replacing versus what can stay.

  - title: "Unflashed Ledger Boards Let Rot Start Inside the Wall Before You See Any Sign of It"
    description: >
      The ledger board connects the deck frame to the house rim joist. Incorrect or missing flashing
      channels water directly into the wall cavity — by the time the deck starts pulling from the
      house, the rim joist behind it is often already compromised and needs sistering or full
      replacement. King County DPER requires a dedicated ledger flashing inspection on all permitted
      decks. That inspection checks for proper step flashing or Z-flashing lapped correctly over the
      ledger, not just a general framing walkthrough. Every project gets a line-item quote and a
      deadline penalty clause written into the contract — no vague timelines handed off to a project
      manager you never meet again.

  - title: "Post Footings Above Frost Depth Will Heave — 12 to 18 Inches Below Grade, Minimum"
    description: >
      Federal Way's lower elevation doesn't exempt footings from frost-depth requirements.
      Ground-contact PT lumber and concrete piers need to reach 12 to 18 inches below grade, set to
      the AHJ's specification. Decks over 30 inches above grade require 36-inch guardrails minimum
      under IRC, with graspable handrails on any stair run with four or more risers. King County
      inspectors check footing depth, guardrail height, stair stringer rise/run compliance, and
      joist hanger installation at both rough-in and final inspection — missing any one of these
      triggers a re-inspection delay. Schedule a free consultation at (206) 591-1096 before breaking
      ground; catching a footing depth issue in the design phase costs nothing, catching it at
      rough-in inspection costs a re-dig.

faq:
  - q: "How fast can you get to Federal Way for a deck consultation?"
    a: >
      Federal Way is about 25 miles south of Seattle via I-5 — typically 30–40 minutes from our
      usual south King County work sites. Call (206) 591-1096 to set up an on-site visit. Vladislav
      Volkov, WA Licensed Contractor, comes out personally — no estimator, no sales rep. Deadline
      penalty terms are written into every contract, and 100+ projects completed since 2017 back
      that up.

  - q: "Trex or cedar — which do you actually recommend for Federal Way decks?"
    a: >
      TimberTech, Trex, and Fiberon are what we spec on most open decks in this area. Cedar still
      makes sense on covered structures or when budget is the constraint, but 98023 and 98003 lots
      with significant tree coverage will need real annual maintenance. Composite costs more upfront
      — typically 20–30% — but less over a decade once you price in sealing and replacement boards.
      Call (206) 591-1096 for a direct quote from Vladislav with material breakdowns, not a range.

  - q: "Does a deck replacement in Federal Way require a permit, and how long does the process take?"
    a: >
      Decks over 200 square feet or more than 30 inches above grade need a permit — through the
      City of Federal Way permit office for parcels inside city limits, or King County DPER for
      unincorporated areas near Dash Point. Plan review runs 4–8 weeks. End-to-end including permits
      and construction: 10–16 weeks for a standard deck. As a WA Licensed Contractor with 100+
      permitted projects since 2017, Vladislav handles the permit package — you don't chase
      inspectors. Call (206) 591-1096 to get a real project timeline in writing.