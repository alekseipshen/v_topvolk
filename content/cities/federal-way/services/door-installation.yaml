title: "Federal Way Door Installation — 1980s Frames, PNW Rain"

intro: |
  Dash Point State Park sits at the edge of Puget Sound in 98023, and the homes
  across Twin Lakes and Adelaide above it take northwest storms head-on from
  October through April. Most of Federal Way's single-family stock went up
  between 1978 and 1995 — builder-grade entry doors with Z-bar flashing that's
  now 30-plus years old, thresholds compressed flat, weatherstripping cracked
  at every corner. A Milgard or Pella replacement with proper sill pan flashing
  fixes that permanently.

  The City of Federal Way handles its own permit center — it's not routed
  through King County DPER. That matters when you're modifying a rough opening.

localContext: |
  Subdivisions across 98003 and 98023 are the core of Federal Way's housing
  stock — fast-built tract homes from the Reagan era with hollow-core steel
  entry doors and minimal rough-opening detailing. Near Steel Lake and Redondo
  Heights, late-1960s ranch homes show up with original solid-wood doors that
  have swelled, twisted, or rotted at the sill plate from contact with PNW soil
  moisture. Both eras have the same result: gaps you can feel when the wind
  comes off the Sound in November.

  Star Lake and Woodmont sit closer to the ridge line and get slightly harder
  freeze-thaw cycles than the waterfront zones. That temperature cycling cracks
  door frames at the corners — especially aluminum-clad wood units from the
  early 1990s. By the time the gap is visible, the king stud behind the casing
  is usually soft.

commonProblems:
  - title: "Separated Z-Bar Flashing Letting Water Into the Framing"
    description: "The Z-bar flashing on Federal Way's tract-era entry doors was never
      a tight installation — 35 years of thermal cycling has pulled it away from
      the rough opening. Water tracks behind the brick mold and into the king
      stud cavity before it shows up as a soft floor. By that point, the OSB
      sheathing behind the casing is already compromised. A new Pella or Milgard
      unit with a full sill pan and head flashing stops the cycle at the source.
      Replacing the rotted framing members — typically the sill jack and part of
      the trimmer — adds a day but skipping it just restarts the moisture problem
      under a brand-new door."

  - title: "Sliding Patio Doors with Dead Rollers and Failed IGUs"
    description: "Late-1980s sliding patio doors — common across the Adelaide and
      Twin Lakes subdivisions — run on nylon rollers that wear down and drop the
      door off its track. The insulated glass units in these frames also fail at
      the edge seal, fogging between the panes and destroying their R-value.
      Upgrading to a multi-slide or French door system requires a proper header —
      typically a doubled LVL beam — to span the wider rough opening, not just a
      pair of 2x10s."

  - title: "Interior Doors Misaligned After Subfloor or LVT Installation"
    description: "Remodels that add DriCore over a concrete slab or level a
      subfloor change the finished floor height by ¾ inch to 1½ inches. Every
      interior door swing has to account for that. Schlage and Kwikset hardware
      can't always transfer to the new unit when the latch bore and strike plate
      shift — the door won't latch cleanly. New pre-hung units with fresh casing
      and adjusted rough opening height solve this faster than shimming the
      existing frame repeatedly. This shows up constantly in Federal Way slab-on-grade
      ranchers in 98003 that got luxury vinyl tile layered over the original
      concrete without anyone measuring the door clearance first."

faq:
  - q: "How fast can you get to Federal Way for Door Installation?"
    a: "Federal Way runs 30-40 minutes south via I-5 from our typical work areas.
      We cover 98001, 98003, and 98023 regularly — call (206) 591-1096 and we'll
      confirm scheduling the same day. Free on-site consultation, no sales staff."

  - q: "Do you install Milgard, Pella, or Marvin doors in Federal Way?"
    a: "Yes. Milgard and Pella cover most installs at this price point — good
      availability, solid warranty coverage in Washington. Marvin works for custom
      sizing or if you're matching a specific historic profile. We'll quote the
      product and the labor as separate line items so you know exactly what you're
      paying for."

  - q: "Does replacing a door in Federal Way require a permit, and how long does it take?"
    a: "Straight door-for-door swaps — same rough opening size — typically don't
      require a permit from the City of Federal Way. Modify the rough opening for
      a French door or add a sidelight, and that triggers a permit plus a framing
      inspection. The City of Federal Way runs its own permit center separate from
      King County DPER — plan review adds 2-4 weeks on structural modifications.
      Vladislav handles the permit application directly — WA Licensed Contractor,
      100+ projects completed since 2023, deadline written into the contract.
      Call (206) 591-1096 to start with a free on-site estimate."