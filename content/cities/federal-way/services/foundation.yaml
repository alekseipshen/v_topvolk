title: "Federal Way Foundation Repair — Glacial Clay, Wet Winters, Real Fixes"

intro: |
  Dash Point's bluffs and the Star Lake basin sit within three miles of each other — and
  Federal Way's soils tell a different story at each elevation. Glacially-deposited clay in
  98023 swells noticeably through the October–May rain season, pushing post-and-pier supports
  out of level one wet winter at a time. One Twin Lakes homeowner called us after noticing
  their Bosch dishwasher door wouldn't latch properly — the kitchen floor had dropped nearly
  half an inch since the house was built in 1979.

localContext: |
  Most of Federal Way's residential housing went up between 1965 and 1995 — tract ranchers
  and split-levels on 98003 and 98023 lots graded quickly and planted with builder-standard
  landscaping. Crawlspaces here vary: some have concrete perimeter walls with wood post-and-pier
  centers, others are fully post-and-pier on surface-set pads. Steel Lake-area homes built before
  1975 often still carry original galvanized drainage that redirects surface water toward the
  foundation rather than away from it. The Lakota neighborhood near 320th Street sees
  particularly heavy clay concentrations — lots that look flat drain poorly, and crawlspaces
  there accumulate standing water by January even in lighter rain years. Vapor barrier condition
  is a consistent issue in that pocket: original 6-mil poly from the 1970s degrades and gaps,
  allowing ground moisture to saturate rim joists and sill plates well before visible rot appears.

commonProblems:
  - title: "Post-and-Pier Footing Settlement in 1970s–80s Tract Construction"
    description: "Federal Way's builder-grade homes from the 1970s used minimal concrete pads under
      wood posts — sometimes just pressure-set blocks on disturbed soil. After decades of wet
      winters, those pads shift and tilt. Shimming and sistering new posts to Simpson Strong-Tie
      post bases gets the floor back to level, but the drainage around those footings usually
      needs addressing at the same time or the problem repeats inside three years."

  - title: "Concrete Foundation Wall Cracking from Lateral Clay Soil Pressure"
    description: "Horizontal cracks in poured concrete or CMU foundation walls are a lateral pressure
      problem, not simple settling. Federal Way's clay-heavy soils hold moisture and push inward
      during wet season. Hairline cracks take epoxy injection; anything wider than 1/4 inch
      typically needs carbon fiber strapping or a wall anchor system installed before the
      epoxy stage — skipping that step just fills a crack that reopens."

  - title: "High Water Table and Crawlspace Flooding West of Pacific Highway"
    description: "Properties in 98003 west of Pacific Highway — closer to Puget Sound lowlands —
      deal with seasonal groundwater intrusion every February and March. A properly sized sump
      pump, Wayne or Zoeller units rated for continuous duty, combined with interior perimeter
      drain tile keeps moisture below the damage threshold. Without it, rim joists and sill plates
      in original Douglas-fir framing absorb enough moisture to soften within a few seasons.
      Replacing a compromised sill plate mid-project adds cost and time — catching it during
      the crawlspace inspection avoids that entirely."

faq:
  - q: "How fast can you get to Federal Way for Foundation Repair?"
    a: "Federal Way is a straight shot down I-5 — typically 25–40 minutes from our central service
      area. We work 98003 and 98023 regularly. Call (206) 591-1096 to schedule a free on-site
      consultation directly with Vladislav — no salesperson, no dispatcher."

  - q: "What repair products and structural hardware do you use on Federal Way foundations?"
    a: "Simpson Strong-Tie post bases and hold-downs on all post-and-pier work. Sika epoxy injection
      systems for concrete crack repair, sized to whether the crack is active or dormant. For
      seismic retrofit hardware — mudsill bolts and shear wall plywood connections — we spec to
      current IRC seismic requirements and pull permits through the City of Federal Way or King
      County DPER depending on the parcel."

  - q: "How much does foundation repair cost in Federal Way, and do I need a permit?"
    a: "Scope drives cost significantly. Post-and-pier shimming typically runs $8–15K; a seismic
      retrofit with mudsill bolting and shear wall plywood runs $20–40K. Vapor barrier replacement
      across a full crawlspace adds $3–6K depending on square footage and access conditions —
      often worth doing alongside structural work since the crawlspace is already open.
      Structural work requires permits — King County DPER for unincorporated parcels, City of
      Federal Way permit center for incorporated addresses. Plan 3–6 weeks for plan review.
      Vladislav provides a line-item quote after the site visit. Deadline is written into the
      contract with penalties if we miss it. WA Licensed Contractor, 100+ projects completed
      since 2017. Call (206) 591-1096 to get started."