title: "Federal Way Electrical — Panel Upgrades for 1970s–90s Homes"

intro: |
  Steel Lake and Twin Lakes — dense residential neighborhoods in zip 98003 — are built mostly on 1970s ranchers and split-levels. Most still run original 100-amp service panels. Those panels weren't sized for a Mitsubishi heat pump, a 50-amp EV charger circuit, and a modern kitchen all drawing current at once. That's where Federal Way electrical work gets complicated fast.

  PSE handles utility disconnect and reconnect here, not Seattle City Light. That adds a separate scheduling step to any electrical service upgrade. Homeowners moving from north Seattle don't always expect it — and it adds 2-4 weeks to the timeline before work can finish.

localContext: |
  Most residential construction in 98003 and 98023 happened between 1968 and 1988. Split-levels and ranchers in the Mirror Lake and Twin Lakes corridors often have aluminum branch circuit wiring. It was standard practice during the copper price spike from 1965 to 1973.

  That aluminum wiring needs remediation at every connection point — outlets, switches, fixture boxes. Without it, aluminum oxidizes against steel terminals and creates resistive heat over time. AlumiConn connectors or full copper pigtailing at each device is the fix that holds up through inspection. Federal Way runs electrical permits through its own Community Development department, separate from King County DPER. Plan review on a full panel upgrade typically runs 3-6 weeks.

commonProblems:
  - title: "Aluminum Branch Wiring in Federal Way's 1970s Tract Homes"
    description: |
      Homes in the Twin Lakes area and along the SW 320th Street corridor built between 1965 and 1973 routinely used aluminum branch circuit wiring. It's one of the most common electrical issues we find in Federal Way homes. Without remediation at every connection point — outlets, switches, fixture boxes — aluminum oxidizes against steel terminals and creates resistive heat over time.

      Leviton and Hubbell make CO/ALR-rated devices for aluminum-compatible terminations. But AlumiConn connectors or copper pigtailing behind each device is the approach that holds up through inspection and beyond. It needs to be scoped before the electrical permit application goes in.

  - title: "100-Amp Panels Maxed Out by Heat Pumps and EV Chargers"
    description: |
      A Square D QO or Siemens 100-amp panel from 1978 wasn't built for today's load mix. Add a ChargePoint Home Flex on a dedicated 50A circuit, a Mitsubishi heat pump compressor, and a kitchen running a dishwasher and microwave at the same time — the load calculation often lands well past 150 amps. A 200A electrical service upgrade is the standard path forward.

      PSE disconnect/reconnect slots in South King County run 2-4 weeks out. Utility coordination has to start before the electrical permit is even submitted. That sequencing is part of how we scope electrical projects in Federal Way from day one.

  - title: "Missing AFCI and GFCI Protection Per Current NEC"
    description: |
      Current NEC requires AFCI breakers in bedrooms and GFCI protection in bathrooms, kitchens, garages, and exterior circuits. Most pre-2000 Federal Way homes have neither. A permit-required panel swap or room addition triggers full code compliance on all affected circuits.

      That means AFCI breaker replacement across bedroom circuits — Square D QO-CAFI, Eaton BR series, or Siemens equivalents — needs to be in scope before the electrical permit application goes in. Pricing it as an afterthought causes budget surprises mid-project.

