  - q: "Do you handle EV charger installations — Tesla Wall Connector, ChargePoint, JuiceBox?"
    a: |
      Yes. Level 2 chargers — Tesla Wall Connector, ChargePoint Home Flex, JuiceBox 48 — all need a dedicated 240V circuit, typically 50A or 60A. The first step is always a panel load calculation. If the existing Square D or Siemens panel is near capacity, a sub-panel or full 200A electrical service upgrade is usually the cleaner path before running charger wire.

  - q: "What's the permit process for a panel upgrade in Federal Way?"
    a: |
      Federal Way electrical permits go through the city's Community Development department — not King County DPER. A 200A service upgrade needs a permit, a rough-in inspection, and a PSE disconnect/reconnect appointment scheduled in advance. Plan review runs 3-6 weeks.

      Vladislav, WA Licensed Contractor, handles the permit application directly — 100+ projects completed since 2017 across King, Snohomish, and Pierce counties. You just need to be home on inspection day. Call (206) 591-1096 to get the process started.