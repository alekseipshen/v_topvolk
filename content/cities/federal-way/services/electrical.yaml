title: "Federal Way Electrical — Panel Upgrades, EV Circuits & Rewiring"

intro: |
  Twin Lakes and Steel Lake have a familiar electrical problem. The ranchers built between 1970
  and 1985 came with 100-amp panels. That was enough back then. It's not enough now — not
  with a Bosch induction range pulling 50 amps and a heat pump install on the list. Federal
  Way runs on PSE (Puget Sound Energy). A 200A electrical service upgrade means a City of
  Federal Way permit plus separate utility coordination with PSE for the meter and service
  entrance. TopVolk handles both tracks as one job. No handing you off to a separate
  electrician mid-project.

localContext: |
  Zip 98023 covers Twin Lakes and the Dash Point corridor. Dense belt of ranchers and
  split-levels, framed between 1968 and 1985. A chunk of those were built during the aluminum
  wiring era — 1965 to 1973. That affects every outlet, junction box, and electrical panel
  connection in the house. Zip 98003, closer to Pacific Highway S and The Commons, is
  1980s-to-1990s builder-grade construction. Panels with undersized main breakers. No AFCI
  protection in bedrooms. Branch circuits never sized for a modern home office running two
  monitors, a standing desk, and a laser printer. These are common electrical issues in
  Federal Way homes, and they tend to surface during remodels or when a new appliance shows
  up on the doorstep.

commonProblems:
  - title: "100A panel at capacity before the heat pump or EV charger gets added"
    description: |
      A Mitsubishi mini-split heat pump draws 25–40 amps of dedicated electrical capacity.
      A Level 2 EV charger — Tesla Wall Connector or JuiceBox 48 — needs a 50A or 60A
      double-pole slot. In a 1970s Federal Way rancher, that 100A main breaker is already
      feeding a range, dryer, water heater, and base lighting load. There's no room. A 200A
      electrical service upgrade with a new panel clears the path for all of it.

      We calculate your actual load before quoting. Some Federal Way homes can add a 40A EV
      circuit with a load-management device and skip the full panel replacement. Others can't.
      Either way, you get the real answer upfront — not a guess that changes after demo day.

  - title: "Aluminum branch-circuit wiring in 1965–1973 builds"
    description: |
      Thousands of Twin Lakes and Adelaide homes were wired with aluminum branch circuits.
      Standard electrical practice from the mid-1960s through the early 1970s. At outlet and
      switch connections, aluminum oxidizes, expands and contracts with heat cycles, and works
      loose. That's a fire risk.

      Electrical remediation means AlumiConn connectors at every device location, or copper
      pigtailing throughout. During kitchen or bathroom remodels we open the walls anyway.
      That's the right time to address the most critical circuits — rather than scheduling a
      standalone electrical rewire as a separate project six months later.

  - title: "Outdated panels and missing AFCI/GFCI breakers in pre-2000 homes"
    description: |
      Current NEC requires AFCI breakers in every bedroom. GFCI protection in kitchens,
      bathrooms, garages, and exterior circuits. Most Federal Way homes built before 2000 have
      neither. Some still run original Federal Pacific Stab-Lok panels — a known fire-risk
      concern separate from the code gaps.

      Replacing the electrical panel brings you to current code, installs proper AFCI and GFCI
      breakers where required, and usually surfaces deferred work: junction boxes without
      covers, abandoned circuits still energized, undersized wire on kitchen circuits. Better
      to find it now than during a future inspection or insurance claim. Call (206) 591-1096
      if you're not sure what panel you have — Vladislav can walk you through it in 10 minutes.

faq:
  - q: "How fast can you get to Federal Way for electrical project work?"
    a: |
      Federal Way is 30–35 minutes south via I-5 from our Seattle base — quicker if we route
      via 99 and avoid the downtown merge. We schedule site visits most weekdays. Call
      (206) 591-1096 and Vladislav comes out personally. He looks at the panel and any
      specific electrical circuits, then puts a written scope together on the spot. You're
      talking to the contractor doing the work, not a sales rep.

  - q: "Do you coordinate the PSE utility work for a panel upgrade in Federal Way?"
    a: |
      Yes. A 200A electrical service upgrade in Federal Way requires a City permit plus PSE
      notification for the meter base and service entrance work. We pull the City permit,
      schedule rough-in and final inspections, and handle the PSE paperwork — so both
      processes run in parallel rather than sequentially. That matters for timeline. TopVolk
      is a WA Licensed Contractor with 100+ projects completed since 2017 across King and
      Pierce counties.

  - q: "What does an electrical panel upgrade or EV charger circuit cost in Federal Way?"
    a: |
      A 100A-to-200A electrical panel replacement with City permit runs $5,000–$8,000.
      The range depends on service entrance length, whether the meter base needs replacing,
      and drywall repair scope. Adding a dedicated 60A EV circuit is typically $900–$1,600
      on top of that.

      Fixed-price written quotes — no ranges that balloon after demo. Missed-deadline
      penalties are written into the contract, not just mentioned in conversation. Schedule
      a free site consultation to get a real number for your specific Federal Way home.