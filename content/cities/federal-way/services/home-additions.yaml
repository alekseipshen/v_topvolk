title: "Federal Way Home Additions — ADUs & Second Stories in 98003"

intro: |
  Steel Lake-area ramblers in 98003 were built for 1970s households — typically 1,100-1,400
  square feet, one story, not much room when parents move in or rental income starts mattering.
  WA HB 1337 (2024) now allows two ADUs per single-family lot, which changes the math for a
  lot of Federal Way homeowners.

  A well-planned mother-in-law suite with a GE compact range and a Mitsubishi mini-split runs
  independently without touching the main house systems. Vladislav Volkov has completed 100+
  addition projects across King County since 2017. Call (206) 591-1096 to schedule a free
  on-site consultation — with the contractor, not a sales rep.

localContext: |
  Federal Way's residential stock skews 1970s-90s — Twin Lakes in 98023 and the blocks around
  Celebration Park in 98003 are mostly single-story ramblers and two-car-garage colonials. The
  neighborhoods along 21st Avenue SW near Dash Point Road follow the same pattern: 1,200 sq ft
  original footprint, attached garage, crawlspace foundation. Mirror Lake and Lakota Creek
  Road areas in 98003 added a wave of slightly larger split-levels in the mid-80s — still on
  crawlspaces, still not engineered for a second floor.

  Second-story additions require a structural engineer to verify existing foundation capacity,
  often adding LVL beams before framing begins. The parcels south of The Commons near S 320th
  Street run 7,000-8,500 square feet — tighter FAR math than many homeowners expect. Hardie
  cement-board siding handles the sustained October-May rainfall without warping — it's the
  standard choice when matching original lap siding on an addition.

  Federal Way has its own Building Division (not Seattle SDCI), permit applications go through
  the City's online portal at 33325 8th Ave S. Plan review for major additions typically runs
  6-10 weeks. Getting the application right the first time — site survey, lot coverage
  calculations, FAR compliance, setback verification — avoids a second review cycle that adds
  weeks before a shovel goes in the ground. Vladislav handles permitting coordination directly;
  homeowners don't deal with the Building Division back-and-forth on their own.

commonProblems:
  - title: "Lot Coverage and FAR Limits on Smaller Federal Way Parcels"
    description: "Many Twin Lakes parcels in 98023 run 6,000-7,500 square feet. Once you calculate
      existing lot coverage — house footprint, garage, hardscape — the buildable area for a DADU
      shrinks fast. The Federal Way Building Division enforces its own setback and FAR rules, separate
      from Seattle SDCI. A permit application missing those calculations gets kicked back in plan
      review. Site survey data comes first, before any design work starts."
  - title: "Foundation Capacity When Adding a Second Story"
    description: "The original crawlspace foundations on 1970s Federal Way homes weren't engineered
      for a second floor. Adding 600-800 square feet upstairs means verifying existing footing
      dimensions and soil bearing capacity. Some jobs require a new LVL beam across the center
      span or a PSL post replacing a load-bearing wall. Rough-in inspection on a second story
      also requires HVAC coordination — Mitsubishi mini-splits handle the new zone without
      forcing oversized ductwork through finished ceilings below."
  - title: "Matching Discontinued 1980s-90s Exterior Siding on the Addition"
    description: "The original T1-11 plywood or vinyl cladding on 80s and 90s Federal Way homes
      is often discontinued. Rather than hunt for a match, most addition projects use Hardie lap
      board and repaint the full exterior so old and new sections read consistently.

      The transition between old and new framing needs a proper vapor barrier and step flashing —
      the heavy October-May rainfall finds every gap in the building envelope if that detail is
      rushed. Kick-out flashing at the roof-to-wall connection on a bump-out is one of the most
      common water intrusion points on Federal Way additions. Miss it during rough-in and it
      shows up as a stained ceiling three winters later."

