title: "Federal Way Home Additions — Room to Grow in 98003 & 98023"

intro: |
  The ranchers and bi-levels filling 98003 and 98023 were built in the 1970s and 80s for
  smaller households — three bedrooms, one bath, no space for aging parents or a proper
  home office. Steel Lake-area homeowners deal with this constantly.

  A new in-law suite with a Mitsubishi mini-split handles climate independently without
  touching the existing ductwork. That matters more here than in newer construction — many
  of these homes have original forced-air systems that weren't sized for additional square
  footage. TopVolk has completed 100+ additions across King County since 2023.

localContext: |
  Federal Way leans heavily on 1975-1995 construction — ranch-style homes, bi-levels, and
  early-90s tract builds around Twin Lakes, Dash Point, and the Lakota neighborhood near
  SW 312th. Many sit on slab or crawlspace foundations, and second-story additions require
  a structural engineer to confirm the existing foundation carries new point loads.

  King County DPER handles permits for most unincorporated parcels here; plan review for
  major structural work runs 6-10 weeks. The City of Federal Way Community Development
  handles incorporated addresses — the AHJ determines the portal, the fee schedule, and
  the inspection sequence, so confirming jurisdiction before drawings start isn't optional.

  Homes along the west side near Puget Sound — Adelaide, Dash Point State Park corridor —
  see heavier moisture exposure from November through March. North-facing crawlspaces in
  98023 regularly show vapor barrier degradation on 30-year-old houses. That gets addressed
  before framing starts on any addition that ties into that structure.

commonProblems:
  - title: "FAR Limits and Setback Rules Catch Homeowners Off Guard"
    description: "Federal Way parcels under King County zoning cap total lot coverage and enforce
      rear setbacks that shrink your buildable footprint fast. A 500 sq ft DADU at the back
      of the lot can hit your FAR ceiling before the covered patio is even penciled in.
      We run those calculations against the parcel data before any drawings go to King County
      DPER — not after the permit comes back rejected. Some lots in the Twin Lakes area around
      SW 356th are narrow enough that side setbacks eliminate bump-out additions entirely on
      one side of the house. Worth knowing before you spend money on architectural drawings."

  - title: "Slab Foundations on 1980s Ranchers Aren't Built for Two Stories"
    description: "Plenty of Federal Way ranchers sit on 4-inch unreinforced slabs designed for
      single-story loads. Adding a second floor means a structural engineer's report verifying
      the slab can handle LVL beam spans and new concentrated loads at bearing walls.

      Skipping that step means surprises mid-construction. We coordinate the engineering before
      King County DPER submittal — it's in the plan review checklist anyway. The report also
      flags whether existing rim joists and blocking are adequate or need sistering before
      the new load path gets established."

  - title: "Matching Sun-Faded Hardie Siding on the Existing Structure"
    description: "Hardie cement-board siding from the 90s oxidizes and fades at a different rate
      than new material. Additions on homes in the Adelaide and Lakota neighborhoods frequently
      need paint-matched lap siding with careful reveal alignment to avoid a two-tone patchwork
      look.

      The roofline tie-in matters just as much — mismatched pitch or improperly lapped flashing
      leaves a gap in the weather seal that Seattle rain finds every October. Federal Way gets
      roughly 37 inches of annual rainfall, and the stretch from Steel Lake down to Enchanted
      Parkway sees heavy northwest winds that drive water up under poorly seated flashing faster
      than drier climates would."

faq:
  - q: "How does the permit process work for home additions in Federal Way?"
    a: "Depends on your parcel — Federal Way Community Development handles incorporated addresses;
      King County DPER covers unincorporated areas. The AHJ determines the submittal portal and
      fee schedule. For a room addition or ADU, plan review typically runs 6-10 weeks, and
      structural work requires engineer-stamped drawings before the county accepts the package.

      Call (206) 591-1096 and we confirm your jurisdiction before drawings start. That one
      conversation saves homeowners weeks of back-and-forth with the wrong permit office."

  - q: "Can you build an in-law suite with a separate entrance and kitchen?"
    a: "Yes, and WA HB 1337 (2024) now allows two ADUs per single-family lot statewide — so
      an AADU plus a future DADU is on the table. A standard layout includes a separate
      entrance, a compact kitchen with a GE or Bosch range, and a Mitsubishi mini-split for
      independent heating and cooling.

      Vladislav walks the site first before anything goes to permit. The 98003 and 98023 zip
      codes have enough lot variety that what works on a 7,200 sq ft lot near Steel Lake may
      not pencil out on a 5,500 sq ft lot closer to Pacific Highway. Site visit first — drawings
      second."

  - q: "What does a home addition cost, and how long does the whole project take?"
    a: "Room additions run $30K–$100K+ depending on structural scope; ADUs and second-story
      builds run $100K–$200K. End-to-end timeline: 6-10 weeks for permits plus 8-20 weeks
      of construction.

      Vladislav Volkov runs every project — WA Licensed Contractor, 100+ completed since 2023.
      The deadline is written into the contract with a penalty clause, not just noted on a
      whiteboard. You get a direct quote with line-item pricing, not a range that shifts after
      demo day."