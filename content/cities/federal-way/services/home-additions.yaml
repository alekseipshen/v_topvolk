title: "Federal Way Home Additions — Expand on the Lot You Already Own"

intro: |
  Twin Lakes and the Steel Lake neighborhoods in 98023 were built mostly through the 1980s — larger lots than you'd find in Seattle proper, but homes sized for smaller households. Now those same houses hold multigenerational families or need a proper work-from-home room that isn't a converted closet. Adding space here makes financial sense when the lot has clearance. A mother-in-law suite with a compact GE or LG kitchenette adds real independent living without tearing the main house apart. Federal Way's position between I-5 and SR-99 also means materials and crew logistics are straightforward — no ferry waits, no permit jurisdiction gaps between cities.

localContext: |
  Federal Way runs its own Community Development permit center — separate from Seattle SDCI and King County DPER. Plan review for structural additions takes 6–10 weeks. Most homes in 98023 and 98003 sit on 7,000–10,000 sq ft lots, which often leaves enough room after setbacks for a 400–800 sq ft DADU. The platform-frame construction typical of 1980s and 90s tract homes ties in reasonably well to second-story additions, provided foundation capacity gets confirmed by a structural engineer first. Homes along 320th and near Celebration Park often have crawlspace foundations with original vapor barriers that need evaluation before any addition footprint touches the ground. That's part of the pre-design site walk — not something discovered mid-permit.

commonProblems:
  - title: "Foundation Capacity for Second-Story Additions on 1980s Tract Homes"
    description: |
      Platform-framed 1980s homes in Twin Lakes can handle a second story — but only after a structural engineer confirms the existing concrete perimeter foundation can carry the added load. LVL beams and PSL posts are typically required at new bearing wall locations. Submit to the City without those calculations and plan review kicks it back. Engineering coordination happens before anything goes to permit, not after. Rim joist and blocking details at the existing ceiling line also need to be drawn correctly — the City's reviewers in Federal Way flag those if they're missing from the structural sheets.

  - title: "FAR Limits and Setback Compliance for DADUs Under WA HB 1337"
    description: |
      WA HB 1337 (2024) opens statewide ADU rights — two ADUs per single-family lot — but Federal Way's zoning code still controls FAR and setbacks. A DADU on a standard RS 7.2 lot needs 5-foot side and rear setbacks with lot coverage inside the zoning cap. Getting the dimensions wrong in schematic design means revisions, re-submittal, and another 4–6 weeks sitting in the City's plan review queue. Lot survey and zoning data get pulled before design starts. A separate utility connection for the DADU also requires coordination with Lakehaven Utility District — that lead time runs parallel to permit review, not after.

  - title: "Matching Exterior Finishes on 1990s Builder-Grade Construction"
    description: |
      Vinyl siding profiles from original 1990s construction in 98003 are mostly discontinued — patching a new addition into old stock leaves a visible seam. Re-siding the affected elevation in Hardie cement-board handles the PNW rain load and north-facing moss growth far better than vinyl anyway. Federal Way averages the same 37 inches of annual rain as Seattle proper, and west-facing walls on unprotected lots near Steel Lake accumulate moisture damage faster than homeowners expect. The roofline tie-in at the addition valley needs ice-and-water shield — non-negotiable on west-facing exposures. R-49 insulation in the new ceiling assembly is also required to hit current IRC energy compliance at plan review.

faq:
  - q: "How fast can you get to Federal Way for Home Additions?"
    a: "Federal Way sits about 30 minutes south of Kent and Auburn on I-5 or SR-99. Most residential streets near Twin Lakes and Celebration Park have standard street parking, so site access isn't an issue. Free on-site consultations can usually be scheduled within a week — call (206) 591-1096 and you'll set a time directly with Vladislav. No sales staff, no intake coordinator — the person walking your lot is the same person managing the project."

  - q: "What appliances do you typically spec for Federal Way ADU kitchenettes?"
    a: "For ADU builds at this price point, GE and LG compact ranges fit the budget and are easy to service locally. Bosch handles the 18-inch dishwasher slot well. KitchenAid steps up the finish level when the homeowner wants the suite to function as a full kitchen. Appliance rough-in dimensions — gas stub location, 240V outlet placement, range hood CFM rating — get locked in before cabinets get drawn. Changing that sequence after framing inspection costs real time and sometimes requires amended permit drawings."

  - q: "What does a home addition in Federal Way typically cost, and how long does it take?"
    a: "Ground-floor room additions run $80K–$150K depending on size and finishes. A full DADU comes in at $120K–$200K end-to-end. Timeline: 4–6 months including City plan review, rough-in inspection, and final inspection sign-off. TopVolk has completed 100+ projects since 2017 across King, Snohomish, Pierce, and Kitsap counties — Federal Way is well within the regular service footprint. Every contract includes a written deadline penalty clause — not vague language, actual penalties if the schedule slips. Call (206) 591-1096 for a line-item quote from Vladislav directly."