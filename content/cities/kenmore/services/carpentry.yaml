title: "Kenmore Carpentry — Trim, Built-ins, and Stair Rebuilds"

answer: "TopVolk Construction does custom carpentry in Kenmore, WA — built-ins, trim restoration, and stair rebuilds — WA Licensed Contractor, 100+ completed projects."

intro: |
  Custom carpentry in Kenmore runs the full spectrum — Craftsman-style window seats and floor-to-ceiling built-ins in the mid-century homes near Log Boom Park, stair stringer rebuilds in 1960s split-levels off SR-522, and exterior cedar fascia replacement on the hillside properties above Lake Washington — and TopVolk Construction LLC handles all of it, with Vladislav Volkov running every project directly. No sales staff, no handoffs. Kenmore's housing stock is more varied than people expect. Genuine 1920s and 1930s bungalows sit in the neighborhoods closer to the Bothell border, their original Douglas-fir trim buried under eight or nine coats of paint. The ranchers and split-levels that fill the Moorlands area are now 50–60 years old — old enough for stair treads to be worn through and interior casings to be splitting at the miter joints. Newer infill construction near Bastyr University Road adds a third layer, where the ask is usually custom built-ins or wainscoting the builder never included. Almost every carpentry job in Kenmore involves matching an existing style, not starting from scratch — and that takes a router table loaded with Freud cutter profiles, not just a trip to the lumber yard.

localContext: |
  Kenmore falls primarily under zip code 98028, with properties near the Bothell border occasionally carrying a 98011 address. The bulk of the housing stock in both zones runs mid-century: single-story ranchers and 1960s–1970s split-levels with flat-panel hollow-core doors, colonial base molding, and builder-grade oak stair treads now showing serious wear. Closer to Lake Washington — particularly in the lakefront corridors near Log Boom Park — you find a layer of 1980s and 1990s construction with updated finishes but still-aging interior trim that doesn't match modern stock profiles. Kenmore is in unincorporated King County, so interior finish carpentry generally doesn't require a permit through King County DPER unless structural work is involved. Stair stringer replacement that affects load paths, wall framing changes to fit a large built-in, or any load-bearing modification will trigger a building permit review through DPER. PNW rain exposure — roughly 37 inches annually — accelerates moisture damage on exterior cedar trim and window casings, especially on north-facing elevations that go without direct sun for months at a stretch.

commonProblems:
  - title: "Built-in Bookcases and Window Seats in Mid-Century Kenmore Homes"
    description: "The 1960s ranchers and split-levels throughout the Moorlands area shipped with zero built-in storage — just open walls and basic closets. Homeowners who want Craftsman-style window seats with storage boxes below, or floor-to-ceiling bookcases flanking a fireplace, are starting from scratch on walls that were never designed for cabinetry. The build involves constructing a face-frame cabinet structure from select pine or clear Douglas-fir, anchoring it to studs with a ledger board behind the unit, and scribing the top rail tight to the ceiling with scribe molding to handle any crown irregularities. Miter detailing at exposed corners and coped joints at any crown integration are what separate a true built-in from furniture pushed against a wall. Budget roughly $3,500–$7,000 for a full wall of built-ins — painted MDF with open shelving sits at the lower end, clear Douglas-fir with inset doors and a water-based polyurethane finish runs higher."

  - title: "Trim Restoration and Beadboard Wainscoting in Older Kenmore Bungalows"
    description: "Craftsman-style homes near the Bothell border in the 98028 zip have original door casings, window aprons, and base molding that's been painted over repeatedly — profiles now half-buried under latex. Stripping and matching those profiles requires a router table and the right cutter profile; exact Craftsman stock isn't available at any home center. Replacement pieces are milled from clear vertical-grain Douglas-fir for paint-grade work or poplar for stain. Many of these homes are also candidates for beadboard wainscoting in kitchens and bathrooms — 3/4\" MDF beadboard panels with a Craftsman rail-and-stile cap at 36\" height, primed and painted. A full room of base and casing restoration — scrape, repair, splice, repaint — typically runs $1,200–$2,800 depending on linear footage and condition. Adding wainscoting to one room adds $800–$1,600 depending on panel count and ceiling height."

  - title: "Stair Stringer Rebuilds in 1960s Kenmore Split-Levels"
    description: "Staircases in Kenmore's 1960s and 1970s split-levels have absorbed 50-plus years of foot traffic, seasonal wood movement, and the occasional moisture intrusion from a leaking threshold. The stringer — the diagonal structural member carrying the treads and risers — is often undersized by current IRC standards, and over time they crack, delaminate, or pull away from the wall. Bounce and squeak in a staircase almost always traces back to the stringer, not the treads themselves. New 1-1/8\" solid red oak treads won't fix a moving stringer. The real repair means sistering a new stringer alongside the existing one, or replacing it entirely with a built-up LVL stringer for dimensional stability. Riser replacement is typically 3/4\" MDF — primed and painted to match the baseboard. A standard 12–14 tread stair rebuild in Kenmore runs $2,800–$5,500 depending on access and whether the wall drywall needs to be opened to anchor the new stringer to framing."

  - title: "Exterior Cedar Fascia Replacement on North-Facing Elevations"
    description: "North-facing cedar fascia in Kenmore rarely dries out between October and April — 37 inches of annual rain and almost no direct sun means moisture stays trapped behind the gutter bracket, paint adhesion fails, and the wood goes soft from the top edge down. The typical failure pattern starts hidden: rot works inward from the top before the face looks visibly punky. By the time it's soft to a probe, it's usually already into the rake board and the first rafter tail. Repair means cutting back to solid wood, sistering the rafter tail if it's compromised, and installing new 5/4x6 clear Western Red Cedar — all six faces primed before the boards go up. KILZ Premium on the end grain is standard practice here. Material and labor for one elevation of fascia and rake board replacement typically runs $900–$2,200 depending on linear footage, ladder access, and how far the rot has traveled into the rafter tails."

  - title: "Interior Door Replacement When Casing Profiles Don't Match Standard Stock"
    description: "Swapping an interior door in a Kenmore rancher sounds simple until you realize the opening is a non-standard width, the existing casing is a custom Craftsman profile, and the wall hasn't been plumb since the Nixon administration. Modern pre-hung doors from Masonite or TruStile come in standard widths; getting one to fit a settled 1965 opening takes careful shim work and scribing. The bigger issue is the casing. Original Craftsman door casings often run 3-1/2\" wide with a back-bevel and a plinth block at the floor — not a profile stocked at any lumber yard in the region. Matching it means routing a custom profile from clear Douglas-fir or poplar, or sourcing from a millwork supplier that runs historical Craftsman patterns. Budget $650–$1,400 per door for supply and install when custom casing matching is involved. Replace all the interior doors in a Kenmore split-level at once and the per-unit cost drops."

