title: "Kenmore Deck Installation — Built for the North Shore Rain"

intro: |
  The waterfront lots near Kenmore Waterfront Park and the hillside properties
  backing up to Saint Edward State Park sit in sustained north-facing shade from
  October through May — exactly the conditions where an untreated cedar deck starts
  showing soft spots and gray moss in under seven years. TimberTech AZEK and Trex
  Transcend hold up to that cycle far better than raw cedar. Call (206) 591-1096 to
  talk through materials with Vladislav directly — no sales staff, just the contractor
  who'll be on site.

localContext: |
  Most of the 98028 residential stock dates from the 1970s and 1980s — split-levels
  and ranchers along the Holmes Point corridor and the NE 175th Street neighborhoods.
  These homes frequently have original wood decks now in structural decline: failed
  rim joist connections where moisture wicked in for decades, post footings that
  never reached frost line, and guardrails well below today's 36-inch code minimum.
  Kenmore has its own building department — deck permits run through the city, not
  King County DPER.

commonProblems:
  - title: "Ledger Rot From Missing Flashing — the Silent Structural Problem"
    description: "On 1970s Kenmore split-levels, original ledger board attachment routinely
      skipped flashing entirely. Moisture wicks behind the band board and into the rim joist
      for years before rot surfaces. Proper repair means removing the deck, installing metal
      pan flashing or Vycor tape over the full ledger, then re-attaching with structural lag
      bolts — not just sistering new lumber against what's already rotted out."

  - title: "Post Footings Poured Above Frost Line"
    description: "King County requires post footings at 12 to 18 inches below grade, using
      ground-contact rated pressure-treated (PT) lumber. Older Kenmore decks commonly used
      standard PT grade or untreated posts set in surface-mounted hardware that's now heavily
      corroded. A footing that doesn't hit frost line cracks or heaves over winter — and it
      will fail rough-in inspection when you pull a permit for the replacement deck."

  - title: "Composite Decking Installed Without Proper Gap Spacing"
    description: "Trex Transcend and TimberTech AZEK both require a 3/16-inch gap between
      boards for drainage and thermal expansion. Each system also uses brand-specific hidden
      fasteners — they're not interchangeable. Skipping that gap or mixing fastener systems
      in Kenmore's sustained October–May rain traps moisture under the deck surface, causes
      buckling within a few seasons, and can void the manufacturer warranty on the boards."

faq:
  - q: "How fast can you get to Kenmore for Deck Installation?"
    a: "Kenmore is a direct run up Lake City Way or I-405 North from Seattle — typically
      under 30 minutes from most of King County. Most consultations can be scheduled within
      a few business days. Call (206) 591-1096 or use the scheduling form to lock in a time
      with Vladislav."

  - q: "What's the permit process for a deck in Kenmore, and how long does it take?"
    a: "Kenmore runs its own building department — not King County DPER. An attached deck
      permit requires a site plan, footing specs, and structural drawings for decks over 200
      sq ft or 30 inches above grade. Plan review typically takes 2–5 weeks. We handle the
      permit filing as part of the project scope, including scheduling the ledger flashing
      inspection and final inspection with the city."

  - q: "What does a deck project in Kenmore typically cost and how long does it run?"
    a: "A 400–500 sq ft composite deck with stairs, guardrails, and proper ledger attachment
      runs $35K–$65K depending on site conditions and material grade. Timeline from permit
      submission to final inspection: 6–12 weeks. TopVolk quotes with line-item pricing —
      not vague ranges. Deadline penalties are written into the contract. 100+ projects
      completed since 2023. Call (206) 591-1096 for a free on-site estimate — WA Licensed
      Contractor."