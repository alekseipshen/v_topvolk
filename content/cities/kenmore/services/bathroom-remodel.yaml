title: "Kenmore Bathroom Remodel — 1970s Ranchers to Walk-In Showers"

intro: |
  The hillside neighborhoods north of the Burke-Gilman Trail in Kenmore hold a lot of bathrooms untouched since the early 1980s. Original builder-grade vanities, 4-inch tile, single-pane mirrors — still there in a large share of 98028 homes. After helping a homeowner near St. Edward State Park pull out a failing Kohler one-piece tub/shower combo and put in a curbless walk-in, we got a clear picture of what most Kenmore remodels actually need.

localContext: |
  Most of the residential streets between NE 68th Street and the Kenmore waterfront date to the 1960s and 70s — split-levels and single-story ranchers with original cast-iron drain stacks and galvanized supply lines. Zip 98028 has some newer construction near Kenmore Village, but the bulk of remodel calls come from that earlier tract. Crawlspace homes are common here, so vapor barrier work comes up in almost every project that opens up the subfloor.

commonProblems:
  - title: "Waterproofing Failure Under Original 1970s Tile"
    description: "Many 98028 bathrooms were tiled directly over greenboard drywall — standard in the 70s, but it fails in the Pacific Northwest's wet climate. Moisture gets behind the tile, saturates the wall cavity, and reaches the framing. Replacing tile means pulling the substrate and installing Schluter Kerdi or RedGard over cement board before any new tile goes in."
  - title: "Cast-Iron Drain Stack Conflicts in Pre-1980 Homes"
    description: "Kenmore's older ranchers typically have 3-inch cast-iron drain stacks running vertically through interior walls. Moving the toilet, adding a double vanity, or converting a tub to a walk-in shower usually requires rerouting that drain. Cast-iron also cracks and corrodes after 50-plus years, so we scope the line with a camera before rough-in work starts."
  - title: "Undersized Exhaust Fans and PNW Humidity Mold"
    description: "Original exhaust fans in 1970s-80s Kenmore homes typically move 50 CFM — not enough for a master bath with a walk-in shower and bench seat. Low airflow plus year-round Pacific Northwest humidity drives mold along north-facing walls and inside the shower niche. Upgrading to a 110-plus CFM fan with a humidity sensor, combined with a Schluter Kerdi waterproofing membrane in the wet zone, stops the cycle."

faq:
  - q: "How fast can you get to Kenmore for a bathroom remodel consultation?"
    a: "Kenmore is about 20 minutes from our base via SR-522. Parking on most 98028 residential streets is easy. Call (206) 591-1096 to set up a free on-site visit — Vladislav comes out personally, not a salesperson. Missed deadlines trigger a penalty clause written into every contract."
  - q: "Do you work with Kohler, Moen, and Delta fixtures in Kenmore bathrooms?"
    a: "Yes — Kohler, Moen, and Delta are the most common fixtures we see in Kenmore homes. We handle rough-in adjustments when supply line locations need to shift and coordinate permit-required plumbing changes. Higher-end master bath projects sometimes spec Brizo or TOTO, and we work with those too."
  - q: "What does a bathroom remodel cost in Kenmore, and how long does it take?"
    a: "A full master bath gut-and-replace in 98028 runs $28K-$65K depending on tile selection, layout changes, and fixture brands. Permitting goes through King County DPER — plan review adds 4-8 weeks to the schedule. Full timeline from permit submittal to final inspection: 10-16 weeks. TopVolk is a WA Licensed Contractor with 100-plus projects since 2017. Call (206) 591-1096 for a line-item quote."