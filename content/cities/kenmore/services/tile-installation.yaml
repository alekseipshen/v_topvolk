  - q: "Do I need a permit for tile work in Kenmore, WA?"
    a: |
      Tile-only replacement — same layout, no drain moves, no electrical changes — typically doesn't require a permit in Kenmore. Add a heated floor system (Schluter Ditra-Heat and Warmup both require an electrical permit), relocate a drain for a curbless shower conversion, or open walls for structural changes, and you're in permitted work territory. Permits in Kenmore run through the city's own permit center, separate from King County DPER. Plan review for a full bathroom remodel typically takes 3-5 weeks. TopVolk is a WA Licensed Contractor and handles all permit documentation and AHJ coordination as part of the project scope.

  - q: "Should I use Schluter Kerdi or a liquid membrane like RedGard in my shower?"
    a: |
      Schluter Kerdi is a sheet-applied membrane that bonds directly into the thinset layer, creating a fully bonded waterproofing system with no pinholes if installed per spec. RedGard and similar liquid-applied membranes work well on floors, transitions, and corner reinforcement seams. For shower walls in Kenmore's humid climate, Kerdi is the more reliable choice: you can physically see the membrane is continuous — no guesswork about whether a liquid coat dried to the correct mil thickness across the whole surface. TopVolk uses Kerdi for wall systems and Schluter Ditra uncoupling membrane on bathroom floors beneath large-format tile. Both are installed per Schluter's published specifications, which matter for warranty coverage.

  - q: "How long will a tile installation last in Kenmore's climate?"
    a: |
      Properly installed tile with a bonded waterproofing membrane and solid substrate prep should last 20-30 years or longer — porcelain and ceramic essentially don't wear out on their own. Grout is the maintenance item: resealing every 2-3 years in an active shower extends grout life significantly and prevents moisture intrusion at the joint. Natural stone (marble, travertine) needs sealer reapplication every 2-3 years in wet conditions. The Schluter Kerdi membrane carries Schluter's limited warranty when installed per specification. TopVolk's workmanship warranty covers installation defects for 2 years from project completion. What typically ends a tile installation's lifespan isn't the tile — it's subfloor movement or waterproofing failure that was never addressed in the original work.

