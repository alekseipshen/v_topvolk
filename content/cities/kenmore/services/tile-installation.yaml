title: "Kenmore Tile Installation — Waterproofing That Holds"

answer: "TopVolk Construction LLC installs tile in Kenmore, WA — showers, floors, and backsplashes — WA Licensed, owner-led, 100+ projects completed since 2017."

intro: |
  Substrate prep and waterproofing determine whether a tiled shower lasts two decades or develops rot behind the walls in eight years — and that's the sequence TopVolk Construction LLC locks down on every tile job in Kenmore. Vladislav Volkov handles tile installation here as part of full bathroom and kitchen remodels across 98028, from the 1960s ranchers near Log Boom Park to the 1980s two-stories closer to Saint Edward State Park. Most tile failures in this area trace back to the same place: cement board installed without a bonded Schluter Kerdi membrane, or Kerdi lapped short of the curb so water tracks down behind the liner over time. Kenmore gets over 37 inches of rain annually, and exterior bathroom walls on north-facing exposures stay damp longer than homeowners realize. Large-format 24x48 porcelain — common in kitchen remodels along the Kenmore waterfront corridor — demands a laser-leveled substrate before a single tile goes down. Call (206) 591-1096 to set up a free on-site consultation with an actual contractor, not a sales rep.

localContext: |
  Kenmore sits at the north end of Lake Washington along SR-522, and the housing stock in 98028 runs from 1960s split-levels and ranchers on the inland streets to 1970s and 1980s two-stories on the hillside lots above the lake. Many of those homes have never had their original bathroom tile touched. Tub surrounds from that era were installed over greenboard drywall — water-resistant, not waterproof — which is now 40-50 years old and frequently soft behind intact-looking grout. Homes closer to the Finn Hill boundary (zip 98034) share similar issues: subfloor deflection from original floor joists that now exceeds the L/360 threshold large-format tile requires. For any remodel involving drain relocation, heated floor circuits, or structural changes, permits run through Kenmore's own city permit center — not King County DPER, since Kenmore incorporated in 1998. Plan review for a full bathroom remodel typically takes 3-5 weeks. Tile-only swap work — same footprint, no MEP changes — usually doesn't require a permit, but once you add a Schluter Ditra-Heat mat or relocate a drain for a curbless shower conversion, you're pulling permits.

commonProblems:
  - title: "Tub Surrounds Tiled Over Greenboard in Kenmore's 1960s and 1970s Ranchers"
    description: |
      Behind most original tub surrounds in Kenmore's older ranchers, you'll find greenboard — water-resistant drywall facing, not a waterproofed substrate. After 40-plus years of steam and splash, the framing behind it absorbs moisture even when surface grout looks intact. Demo reveals soft studs, compromised blocking, sometimes visible mold on the back face of the drywall. The fix starts with full demo to bare studs, new blocking between joists to support a niche or bench, and Schluter Kerdi membrane lapped continuously from walls onto the shower pan liner — no gaps at the curb or corners. Kenmore ranchers with post-and-pier foundations are worth checking in the crawlspace while the bathroom is open, since vapor barrier condition directly affects how moisture migrates through the floor assembly. Budget $9,000–$16,000 for a full tub-to-shower conversion including demolition, framing repair, waterproofing, tile, and a Kohler or Moen valve replacement. The tile material itself typically runs 15–20% of that total.

  - title: "Large-Format Porcelain Tile Requires Deflection Checks Before Any Work Starts"
    description: |
      24x48 and 32x32 porcelain tile is common in Kenmore bathroom remodels — clean look, minimal grout lines, holds resale value. But tile larger than 15 inches across has almost no tolerance for floor deflection beyond L/360. Kenmore's 1970s split-levels typically have 2x10 floor joists at 16 inches on center that have been carrying load for 50 years. They flex. That movement cracks tile and grout within a year of installation, regardless of how cleanly the tile was set. TopVolk checks deflection before quoting any large-format tile work, and where needed, sisters the existing joists and installs Schluter Ditra uncoupling membrane over the subfloor to absorb differential movement. Substrate flatness also matters: large-format tile needs a surface flat within 1/8 inch over 10 feet — any deviation shows as lippage every time morning light rakes across the floor at a low angle. Add 1-2 days of substrate prep to the timeline before tile work begins.

  - title: "Shower Niche Framing and Continuous Waterproofing Detailing"
    description: |
      A shower niche cuts through the moisture plane of the wall, and if the waterproofing membrane isn't carried continuously through the niche back wall and all four sides, the niche becomes a slow water trap. Most failed niches found in Kenmore homes were framed between studs, cement-boarded, tiled, and assumed watertight — no membrane behind the back wall, no coverage on the sides. TopVolk frames niches with Schluter Kerdi-Board, a pre-waterproofed foam substrate that bonds directly into thinset and eliminates the gap between framing and membrane that standard cement board creates. For full bathroom remodels in Kenmore involving drain relocation or a heated floor circuit, a building permit is required through the city permit center. Warmup and Schluter Ditra-Heat installations both require a separate electrical permit and a final inspection before the floor can be covered. Plan review typically runs 3-5 weeks, followed by 2-3 weeks of active construction for a mid-size bathroom remodel.

  - title: "What Tile Installation Actually Costs in Kenmore — and What Drives the Number"
    description: |
      Tile labor in Kenmore runs $18–$28 per square foot installed for standard ceramic or mid-grade porcelain — that's labor and materials combined, not demo or substrate work. Large-format porcelain (24x48 and up) or natural stone bumps the range to $28–$45 per square foot, because back-buttering time and substrate prep roughly double. A full walk-in shower tile job — walls, floor, niche, bench, Kerdi waterproofing — typically runs $6,500–$13,000 depending on shower size and tile selection. Kitchen backsplash installation during a full remodel, including outlet relocation behind the tile field, adds $2,000–$4,500. The biggest variable is always substrate condition found during demo. Subfloor sistering and leveling in older Kenmore homes can add $1,500–$3,500 before a single tile goes down. TopVolk provides a fixed line-item quote after an on-site look — no vague estimates, no surprises after work starts. Deadline penalties are written into the contract.

  - title: "Natural Stone Sealing and Long-Term Maintenance in Kenmore's Wet Climate"
    description: |
      Marble and travertine tile appear frequently in Kenmore's upper-income neighborhoods — they hold resale value and suit the Pacific Northwest aesthetic common in newer custom builds near the lake. Natural stone in a PNW bathroom absorbs moisture aggressively if not sealed correctly, and Kenmore's rainy season runs October through May with humidity elevated well into spring. Unsealed travertine in a shower develops dark staining within one wet season. The right sealer depends on the stone type: a penetrating impregnator like Miracle Sealants 511 handles most marble and granite. Travertine in a wet application also needs filled voids before sealing — unfilled pores let water pocket behind grout and damage the surface from inside. Reapplication in active shower conditions should happen every 2-3 years. Natural stone installations also require proper expansion gaps at tile-to-hardwood transitions, since Kenmore's seasonal humidity swings cause both materials to move at different rates.

