  - q: "How deep do fence posts need to be set in Kenmore's soil?"
    a: "Post depth for a 6-foot fence should be at least 24 inches in standard soil. In Kenmore's clay-heavy ground — saturated from October through April — 30 to 36 inches is the practical standard for line posts. Gate posts go deeper: 36–42 inches, set in a concrete tube form with gravel drainage at the base. Shallow posts in wet clay heave during freeze-thaw cycles and shift under sustained wind. Pressure-treated 4x4 or 4x6 posts set in Quikrete Fast-Setting Concrete tube forms give a stable base that isn't pulling out of plumb by year three."

  - q: "How long does a cedar fence last in Kenmore's climate, and what's the warranty?"
