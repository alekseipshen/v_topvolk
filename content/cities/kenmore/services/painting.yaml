  - q: "What does exterior painting cost in Kenmore?"
    a: |
      Exterior painting on a typical Kenmore home — 1,500-2,500 sq ft with cedar shake or Hardie lap siding — runs $4,500-$9,000 for a full repaint. That includes power wash, scraping, spot-prime, and two finish coats. Heavy mildew on north elevations adds cost. So does stripping multiple failed paint layers down to bare wood, or treating significant wood rot with consolidant before painting. Interior projects range from $1,200-$2,800 for kitchen trim and wall repaint to $2,500-$4,500 for cabinet refinishing. These are not ballpark ranges. TopVolk provides a written line-item quote after the site visit so the number is fixed before any work starts. Free on-site estimates: call (206) 591-1096.

  - q: "Does exterior painting in Kenmore require a permit?"
    a: |
      Straight painting — interior or exterior — does not require a building permit from the City of Kenmore or King County DPER in most cases. The exception is when painting is part of a broader project that does require permits: siding replacement, window replacement, or structural work. In that situation, the permit covers the construction scope and painting is folded into the same project. One federal compliance layer applies regardless of permits. EPA RRP rules apply when paint removal exceeds 6 sq ft interior or 20 sq ft exterior on a pre-1978 home. Certification and containment protocol are required. TopVolk Construction is WA Licensed and follows all applicable EPA requirements on pre-1978 homes across the 98028 zip.

  - q: "What type of paint holds up best on cedar shake siding in the PNW?"
    a: |
      A 100% acrylic latex topcoat over an oil-based primer is the standard approach for cedar shake in Kenmore's climate. Sherwin-Williams Emerald Exterior and Benjamin Moore Aura Exterior are both reliable topcoat choices. The oil-based primer — KILZ Premium or equivalent — penetrates cedar grain and seals in tannins. Those tannins bleed through water-based primers and stain the topcoat. Full acrylic topcoats in satin sheen flex slightly with the cedar as it expands and contracts through the wet-dry cycle. That flex reduces cracking at the butt joints. Flat sheen holds moisture. Gloss shows every surface imperfection. Satin is the right call on shake. Two topcoats over a full prime — not one heavy coat — is the application schedule that delivers a 6-7 year life expectancy.

  - q: "How long does exterior paint last in Kenmore, and what's the warranty?"
    a: |
      On properly prepped cedar shake or Hardie siding in Kenmore, a two-coat acrylic application with oil-based spot-prime typically holds 5-7 years. That is before any attention is needed. South-facing elevations that dry faster can reach 8-9 years. North-facing walls near Lake Washington's shoreline see the short end of that range. They stay damp from October through April with minimal direct sun. Hardie cement-board generally holds paint longer than raw cedar because the substrate does not cup and split. TopVolk warranties workmanship on exterior painting jobs — what is covered and for how long is written into the contract before work starts. Deadline penalties are also in the contract. If the project runs over the agreed completion date, there is a financial consequence on the contractor side, not just an apology.

