  - q: "Fiberglass vs. solid wood entry door — which holds up better in Kenmore?"
    a: "Fiberglass is the practical choice for most Kenmore homes. Solid wood doors — even high-quality Douglas-fir or mahogany — need repainting every 3-5 years on north- or west-facing exposures that catch steady rain October through May. Fiberglass doors (Therma-Tru, Pella) won't rot, hold paint longer, and insulate better than solid wood — typically R-5 to R-7 vs. R-2 to R-3 for a wood slab. The tradeoff is that fiberglass doesn't replicate real wood grain perfectly up close, though upper-tier units like Therma-Tru Benchmark and Pella Architect Series get close. For lake-facing or west-facing entries in Kenmore, fiberglass is the durable, lower-maintenance call."

  - q: "What warranty covers a new door installation from TopVolk?"
    a: "Door unit manufacturer warranties vary by brand: Therma-Tru covers the fiberglass slab under a limited lifetime warranty; Pella offers lifetime coverage on glass and sash. Hardware warranties — Schlage, Emtek — run 1-3 years on finish and lifetime on mechanical function. TopVolk's installation workmanship on rough-in framing, flashing, threshold seal, and casing carries a 2-year labor warranty. In Kenmore's climate, the most common post-installation issue is the threshold seal compressing in the first winter; that's covered under labor warranty. Seasonal wood movement in the surrounding framing is normal in any PNW home and isn't a defect covered under the labor warranty."

