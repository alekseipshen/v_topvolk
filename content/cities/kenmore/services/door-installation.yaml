intro: |
  Entry door replacement in Kenmore typically starts with a failed threshold seal or a fiberglass door that's delaminated after years of rain coming off Lake Washington. TopVolk Construction does this work across Kenmore (98028) — prehung entry door replacement, patio sliding-to-French-door conversions, interior door swing reconfiguration, and garage door upgrades — with 100+ projects completed since 2017 as a WA Licensed Contractor in King County. The Holmes Point corridor near Saint Edward State Park has a lot of 1960s-era homes where original hollow-core interior doors and aluminum-framed sliding glass doors are still in place; both are long overdue. Down near the Burke-Gilman Trail waterfront, newer construction came with Pella or Marvin door systems from the build, but those units still hit the 15-20 year mark where weatherstripping compresses, thresholds crack, and the door starts leaking conditioned air. Vladislav Volkov handles the consultation and the work — no sales staff, no middlemen, just a direct line to the contractor: (206) 591-1096.

localContext: |
  Kenmore's housing stock in 98028 skews heavily toward the 1955-1975 ranch and split-level era, with pockets of newer construction near the SR-522 corridor and the city center redevelopment zone. Homes in the Holmes Point area and further north toward the Bothell border tend to have original-era framing — post-and-beam construction, rough openings sized outside current IRC standards, and sliding glass doors fitted to non-standard dimensions that complicate direct replacement without framing adjustments. King County DPER handles permit review for unincorporated pockets at the Kenmore-Bothell border (98011), while Kenmore's own building department covers the incorporated city; most door replacements in the same rough opening don't require a permit, but expanding an opening for a wider French door or a multi-slide system triggers plan review. The heavy rain season — October through May, roughly 37 inches annually — accelerates weatherstripping wear on north-facing doors and causes threshold rot wherever drip-cap flashing was skipped during original installation. Moisture infiltration around the door jamb is the most common hidden problem in these homes, and it usually doesn't surface until the door unit is already being pulled.

commonProblems:
  - title: "Failed Threshold and Weatherstripping on Lake-Facing Entry Doors"
    description: "North- and west-facing entry doors in Kenmore's lakefront neighborhoods take sustained weather load from October through May. The door threshold — specifically the aluminum threshold saddle and its attached vinyl insert — compresses and cracks after repeated freeze-thaw cycling, and the door sweep stops making full contact with the saddle. On fiberglass entry doors (Therma-Tru and Pella are common in this income bracket), the door slab itself often has 20+ years of service left; the threshold assembly and weatherstripping are the actual failure points, not the door unit. A threshold and weatherstripping replacement runs $400-$700 in materials and labor. Full prehung entry door replacement with proper z-flashing and drip-cap installation lands between $2,500 and $5,500, depending on door unit, sidelites, and finish hardware."

  - title: "Non-Standard Rough Openings in Kenmore's 1960s Ranch Homes"
    description: "Homes built between 1955 and 1975 in Kenmore — particularly in the Holmes Point area and near Saint Edward State Park — were framed with rough openings that don't align with today's prehung door dimensions. A 1968 sliding glass door might sit in a 94-inch rough opening when current 8-foot patio door systems spec to 96 inches, or the opening width doesn't match standard multi-slide units. Converting these openings to a French door or multi-slide system requires modifying the king studs and jack studs (trimmer studs) and resizing the structural header — often with an LVL beam where the wall is load-bearing. This is not a drop-in replacement; plan for framing work and a permit if the header changes. Budget $8,000-$18,000 for a patio-to-French-door conversion that includes structural header work, permit, and finish carpentry."

  - title: "Expanding a Door Opening Triggers Permit Review in Kenmore"
    description: "Replacing a door in the same rough opening — same size, same location — typically doesn't require a building permit in Kenmore under standard IRC residential exemptions. Converting a 36-inch entry to a double-door configuration, or widening a patio opening for a multi-slide system, means modifying the structural header, which triggers a permit through Kenmore's building department. Homes in unincorporated areas near the 98011 Bothell border route the same work through King County DPER instead. Plan review for a structural door opening modification currently runs 4-8 weeks in Kenmore's queue. TopVolk is a WA Licensed Contractor and handles permit drawings and application as part of the project scope — homeowners don't navigate the portal separately. Total timeline for a permitted door expansion, including structural work and finish carpentry, runs 10-14 weeks from consultation to final inspection."

  - title: "What Entry Door Replacement Actually Costs in Kenmore"
    description: "Entry door replacement in Kenmore (98028) typically runs $2,500-$8,500 installed, depending on door material, size, and whether sidelites or transoms are included. A fiberglass door unit — Therma-Tru Pulse or Pella Architect Series — sits in the $1,800-$3,500 range and holds up better in PNW weather than painted wood. Solid wood mahogany or Douglas-fir doors run $3,000-$6,000 for the unit alone and require repainting every 3-5 years on exposed elevations. Smart lock integration — Schlage Encode is the most reliable deadbolt-replacement option for existing prep holes — adds $350-$600. Every TopVolk quote is itemized line by line, delivered after an on-site measurement, with a missed-deadline penalty clause written into the contract. No vague ranges, no surprises at rough-in."

  - title: "Garage Door Insulation Upgrade for Kenmore's Climate"
    description: "Single-layer steel garage doors — builder-grade standard on most 1980s-90s Kenmore homes — have an effective R-value near zero. In practice, that means a garage running 15-20 degrees colder than the house in January, with condensation building on the shared wall between garage and living space. Upgrading to an insulated steel panel door with an R-12 or higher polyurethane foam core (Clopay Canyon Ridge or Wayne Dalton Model 9000 series) makes a measurable difference in that wall's thermal performance across Kenmore's wet winters. A standard 16x7 insulated two-car door with a new LiftMaster belt-drive opener runs $2,200-$3,800 installed. If the existing torsion spring system is more than 10 years old, replacing the springs at the same time adds $200-$350 and avoids a separate service call — torsion springs on a 16-foot door carry roughly 10,000 cycle lifespans. A like-for-like garage door swap doesn't require a permit in Kenmore."

