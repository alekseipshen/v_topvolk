  - q: "What permits are required for basement finishing in Kenmore, and who pulls them?"
    a: |
      Basement finishing in Kenmore requires permits through the City of Kenmore's Building Division — not King County DPER, which only covers unincorporated county areas. A full finish scope (framing, electrical, mechanical, egress window) requires building, electrical, and mechanical permit pulls plus plan review. Kenmore's review queue for this scope typically runs 4–6 weeks. Inspections are sequenced: rough-in inspection (framing, electrical rough, mechanical rough) must pass before drywall goes up, then a final inspection after all finish work is complete and fixtures are set. TopVolk manages the permit application, plan submissions, and inspection scheduling as part of the contract scope. Permits are pulled under TopVolk Construction LLC's WA Licensed Contractor credentials — not as an owner-pull that would leave liability gaps.

  - q: "Does my Kenmore basement need moisture treatment before we start framing?"
    a: |
      Almost certainly yes, especially in homes built before 1985. Kenmore's rainfall — roughly 37 inches annually, concentrated October through April — keeps soil saturation levels elevated for months, and groundwater pressure against unprotected slabs and foundation walls is the norm, not the exception. Any slab showing efflorescence, staining at the base of the walls, or relative humidity above 60% in dry summer months needs treatment before framing. Minimum treatment includes vapor barrier over the slab, RedGard waterproofing membrane on the lower wall surfaces, and DriCore subfloor panels to break capillary contact between the slab and finished floor. If active seepage is present at the wall-floor joint, a perimeter interior drain and sump pump installation comes before anything else — that sequence cannot be skipped.

  - q: "How long does a basement finish take in Kenmore, and what warranty comes with the work?"
    a: |
      A full basement finish — 800–1,100 square feet with a bedroom, bathroom, and living area — takes 8–14 weeks from permit issuance to final inspection, including rough-in work, the required rough-in inspection, drywall hang/tape/mud, flooring, and the blue tape walkthrough punch list at closeout. TopVolk builds deadline penalties into the contract — missed milestones have financial consequences on our end, not yours, and that's in writing before demo starts. Workmanship warranty is 2 years on all labor. DriCore panels carry a 10-year product warranty; Milgard egress windows carry a lifetime limited warranty. At project closeout we walk through annual sump pump testing and perimeter drain cleanout maintenance so the waterproofing system holds up through Kenmore's wet seasons long-term.

