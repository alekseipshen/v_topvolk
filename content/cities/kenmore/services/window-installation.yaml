commonProblems:
  - title: "Aluminum Frame Condensation and Sill Rot in Kenmore's Mid-Century Ranchers"
    description: |
      Original aluminum frames in homes built between 1965 and 1982 have essentially no thermal break — the aluminum conducts cold directly from outside to inside, and interior condensation runs down the glass face every morning from October through April. Over time that moisture saturates the wood sill plate and eventually the king studs and trimmer studs flanking the rough opening. By the time paint starts bubbling or a sill feels soft underfoot, the framing behind it is already compromised. Full-frame replacement — removing the old window entirely, inspecting the rough opening, and installing new with proper pan flashing and sill tape — is the correct fix here, not an insert drop-in that conceals the damage. Milgard's Ultra Series fiberglass eliminates the conduction path with a true thermal break; Marvin Elevate is another solid option at a similar price tier. Expect $700–$1,100 per window for full-frame fiberglass installed, versus $450–$750 for insert replacement where the old frame stays. Insert is faster — it just won't fix existing rot.

  - title: "Basement Egress Windows — IRC Minimums and King County DPER Permits"
    description: |
      Older Kenmore ranchers frequently have finished basement bedrooms with hopper or narrow slider windows that don't meet IRC egress requirements. The code is specific: 44-square-inch minimum net clear opening, at least 20 inches wide, at least 24 inches tall, sill no higher than 44 inches from the finished floor. If someone is sleeping in that room, code doesn't grandfather older construction — the window needs to meet egress. Enlarging the opening requires a King County DPER permit, which typically takes 3–5 weeks for straightforward residential work. Vladislav handles the permit application, coordinates window well excavation, and frames the rough opening to the correct dimensions before the window gets set. Milgard's Style Line casement configurations hit the egress minimums without requiring an oversized opening cut, which matters when you're cutting into poured concrete or block foundation walls. Budget $2,500–$5,000 per opening all-in — permits, concrete well liner, framing enlargement, window, and labor.

  - title: "SR-522 Traffic Noise and Acoustic Glass Upgrades Along Bothell Way NE"
    description: |
      SR-522 runs straight through Kenmore's residential core along Bothell Way NE, and homes within a half-mile deal with road noise that standard double-pane windows barely reduce. The noise reduction comes from the glass makeup, not the frame material. Standard 1/8-inch double-pane IGU (insulated glass unit) achieves roughly STC 28. Laminated acoustic glass — two glass lites bonded with a PVB (polyvinyl butyral) interlayer — pushes that to STC 34–38 depending on glass thickness and airspace depth. Milgard offers laminated glass as a factory upgrade on most Tuscany and Style Line series windows without changing the frame profile; Pella's 250 Series has a comparable acoustic package. For bedrooms directly facing SR-522, specify at least 3/16-inch laminated inner pane with a 1/2-inch airspace — that combination is measurably quieter than anything else in the same price tier. The glass upgrade runs $80–$150 per window over standard IGU pricing. Vladislav will identify which rooms actually need it and which don't justify the cost.

  - title: "Double-Pane vs. Triple-Pane: Real Cost and Real Payback in Kenmore's Climate"
    description: |
      Triple-pane windows cost 15–30% more than comparable double-pane units, and in western Washington's moderate maritime climate, the payback period stretches significantly. Kenmore rarely sees extended hard freezes — the Sammamish Plateau and North Bend foothills cycle harder than lakeside Kenmore does. For most homes here, a high-performance double-pane with low-e coating and argon fill hitting U-factor 0.28 or lower will satisfy Seattle Energy Code requirements and cut heating bills without the triple-pane premium. Triple-pane genuinely earns its keep on north-facing exposures with no solar gain, and on rooms directly facing SR-522 where added glass mass improves STC ratings. Whole-house window replacement in a typical 1970s Kenmore rancher — 15–20 windows — runs $18,000–$35,000 depending on frame material, glass package, and how many openings require full-frame versus insert work. For Andersen 400 Series wood-clad options, that range climbs to $22,000–$42,000 on comparable window counts. Vladislav provides a written, line-item quote per opening after the site visit — no ballpark ranges that shift when the job starts.

  - title: "IGU Seal Failure and When to Repair vs. Replace the Whole Window"
    description: |
      Fogged glass between the panes means the IGU seal has failed — argon has leaked out, moisture has entered the sealed airspace, and the condensation visible between the lites is trapped inside the unit. It won't clean from the surface because it's not on the surface. If the frame and sash are structurally intact, swapping just the IGU cassette is a legitimate repair: $150–$280 per unit versus $400–$700 for a full sash replacement. On aluminum-framed windows from the 1970s, though, IGU failure almost always signals the whole frame is at end of life. Aluminum corrodes, the weatherstripping compresses permanently, and more seals will follow within two to three years. Milgard backs its Tuscany and Ultra Series with a lifetime limited warranty on the IGU seal for the original owner — a meaningful difference from budget vinyl lines carrying only 10-year seal coverage. Vladislav can assess in person whether individual IGU swaps make financial sense or whether the frame condition makes full replacement the better call for the next 20 years.

