  - q: "Is soft washing or high-pressure washing better for cedar siding?"
    a: |
      Cedar siding — common on Kenmore's 1960s-1970s ranchers and on newer custom builds throughout 98028 — should not take high pressure. Above 1,200-1,500 PSI, cedar grain raises, board joints get water forced into them, and older wood shows fiber blowout that won't sand out cleanly. Soft washing applies a sodium hypochlorite and surfactant solution at under 500 PSI, killing mold, algae, and lichen chemically during the dwell period rather than blasting them off mechanically. The biological layer dies and releases during rinse. Hardie cement-board siding also gets low-pressure treatment — high pressure on Hardie panel seams wicks water behind the installation. PSI and nozzle selection are matched to the surface on every job; there's no single default setting used across different materials.

  - q: "How long do power washing results last in Kenmore's climate?"
    a: |
      On sun-exposed siding, a house wash holds 2-3 years before biological regrowth returns. North-facing walls and surfaces under heavy tree cover start showing algae in 12-18 months — Kenmore's shade patterns accelerate that cycle considerably compared to drier climates. Concrete driveways stay clean 2-3 years before oil and organic buildup accumulates again. Cedar decks cleaned and brightened before staining hold the finish coat 2-3 years with products like Penofin or Armstrong Clark; budget water-based stains fail faster in this climate and aren't recommended. Roof soft washing on asphalt shingles lasts 2-4 years, with shaded sections seeing moss return first. TopVolk stands behind the cleaning quality — biological regrowth is driven by the environment, not by how the job was done.

