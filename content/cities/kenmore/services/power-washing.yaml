intro: |
  TopVolk Construction power washes homes across Kenmore's 98028 zip code — moss removal from north-facing roofs and cedar decks, Hardie cement-board siding cleaning before exterior repaint, and concrete driveway work on the mid-century ranchers that line most of this neighborhood's residential streets. Moss on a shaded deck near the Inglewood Golf Club corridor doesn't wait for spring — after months of rain off Lake Washington, it's rhizoid-anchored into the cedar grain by February, holding moisture against the surface and accelerating checking on wood that won't take Penofin or Armstrong Clark stain properly until the contamination is gone. Kenmore's tree canopy and north-facing exposures, particularly on lots near Saint Edward State Park's ravines, create ideal conditions for Gloeocapsa magma algae and moss — they establish fast and won't release with a garden hose. Cedar and Hardie siding get soft washed using a downstream injection of sodium hypochlorite and surfactant at low pressure, then a surface cleaner attachment handles concrete driveways and walkways. Vladislav Volkov inspects every job before closeout — you're talking to the owner, not a call center.

localContext: |
  Kenmore's residential stock is concentrated in the 98028 zip code, heavily weighted toward 1960s-1980s split-levels and ranchers in neighborhoods like Moorlands and along NE 145th Street. Those homes typically have concrete driveways carrying 40-50 years of oil and tire deposit, plus original cedar decking that's been cleaned — or not — on whatever schedule the previous owner maintained. Along the Bothell Way NE corridor where 98028 transitions toward 98011, the housing shifts to 1990s and early 2000s construction with composite decking and Hardie lap siding that responds very differently to pressure than bare cedar boards. Kenmore gets the same 37 inches of annual rainfall concentrated October through May that the rest of the Seattle Metro sees — north-facing fence runs, roof planes, and deck surfaces here stay biologically active year-round and never fully dry out between rain events. That continuous moisture cycle shortens the effective maintenance window considerably: cedar fences in this zip code go green in 2-3 years, not the 5-year cycle homeowners in drier climates plan around.

commonProblems:
  - title: "Moss Rooted Into Cedar Deck Grain After a Full Wet Season"
    description: |
      Cedar deck boards in shaded Kenmore yards — especially those facing north toward tree lines or the ravines near Saint Edward State Park — can carry a full moss layer by late winter that's actually rhizoid-anchored into the surface grain, not just resting on top. High pressure at 2,800-3,000 PSI will blast it off but raises the grain and causes fiber blowout on older wood, leaving a surface that won't hold stain evenly. The right sequence is soft washing first: sodium hypochlorite and surfactant applied at low pressure, a 10-15 minute dwell time to kill the biological layer chemically, then a controlled 1,200-1,500 PSI rinse with a fan-tip nozzle to flush residue without tearing fiber. After cleaning, a deck brightener like Defy Wood Brightener restores the wood's pH and opens the grain so Penofin or Cabot Australian Timber Oil absorbs evenly. Skipping the brightener step causes blotchy stain absorption. Cleaning and brightening a 400 sq ft deck runs $350-$600 depending on buildup depth and access.

  - title: "Efflorescence and Oil Staining on 1970s Concrete Driveways"
    description: |
      The ranchers along Kenmore's residential grid in 98028 — particularly near Juanita Drive NE — show two compounding problems on their concrete driveways: efflorescence, the white mineral salt crust that migrates to the surface when concrete stays persistently damp, and embedded oil and tire staining from decades of vehicle use. Efflorescence doesn't respond to surface pressure alone — it needs a diluted muriatic acid pre-treat or a dedicated cleaner like PROSOCO Sure Klean 600 Detergent, followed by a surface cleaner attachment running at 3,000-3,500 PSI with 3.5+ GPM to thoroughly flush the residue. Oil staining requires a degreaser with a 10-minute dwell before the surface cleaner pass. Timing the work in May or June before summer sealing locks results in for a full season. A standard two-car driveway with both issues runs $250-$400 for cleaning; adding a penetrating concrete sealer application brings it to $500-$650.

  - title: "Siding Wash Before Exterior Repaint — Timing It Around the Permit Sequence"
    description: |
      Pressure washing as prep for exterior repainting doesn't need a permit in Kenmore, but when the repaint is part of a larger project scope — new Hardie siding installation, window replacement, or a permitted addition — King County DPER requires a building permit, and the painting crew can't prime until the rough-in inspection is signed off. The wash has to fit into that sequence precisely: too early and biological growth returns before paint goes on; too late and the surface doesn't dry adequately in Kenmore's fall or spring rain window. For Hardie panels and lap siding, soft washing at 500-800 PSI prevents forcing water behind board joints — high pressure on Hardie panel seams wicks moisture into the installation and causes substrate damage that shows up later as paint failure. Stucco gets the same low-pressure treatment with a mildewcide added to the cleaning solution. Plan for 48-72 hours of dry time between the wash and the paint crew's primer coat.

  - title: "What Power Washing Actually Costs in Kenmore"
