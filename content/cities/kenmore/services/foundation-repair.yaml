  - q: "Does foundation repair in Kenmore require a building permit?"
    a: |
      Structural foundation work in Kenmore requires a City of Kenmore building permit. That includes seismic retrofits, post replacement, mudsill bolting, and shear wall installation. Sealing a small hairline crack or shimming one isolated post typically doesn't trigger a permit, but anything that modifies a structural load path does. The City of Kenmore permit center handles the application directly — this is not a King County DPER jurisdiction. Plan review for standard seismic retrofit scope runs 3–6 weeks. TopVolk prepares the permit application, coordinates any required structural drawings, and manages rough-in and final inspections with the city AHJ. As a WA Licensed Contractor, TopVolk pulls the permit under the contractor license, which matters at resale.

  - q: "What's the difference between shimming a post and replacing it?"
    a: |
      Shimming works when the post itself is structurally sound but has settled — the concrete pad shifted slightly, or the original bearing was undersized. Steel shims or composite shim packs are driven under the post bearing plate to bring the floor back to level. Post replacement is needed when the Douglas-fir is soft, crushed, or rotted at the base — a screwdriver pushed into the wood tells you in about two seconds. New posts go in as pressure-treated 6×6 or engineered TimberStrand LSL on Simpson ABA post bases, anchored into the existing concrete pad with epoxy anchors. Most Kenmore crawlspaces need a combination: some posts shim cleanly, others have to come out entirely. Vladislav documents each post condition during the initial crawlspace walkthrough before writing the scope, so you're not paying for full replacement on posts that only need shimming.

  - q: "How long does foundation repair last in Kenmore's wet climate?"
    a: |
      Post-and-pier repairs using PT lumber on Simpson post bases carry a functional lifespan of 30–50 years in Kenmore's environment, provided moisture is controlled through a proper vapor barrier and working sump pump. Epoxy-injected concrete cracks are essentially permanent — cured Sika epoxy bonds stronger than the surrounding concrete. Seismic retrofit hardware doesn't degrade over time and needs no replacement. The weak point in any Kenmore foundation repair is moisture management: a failed sump pump or torn vapor barrier reintroduces the conditions that caused the original problem. TopVolk warranties structural workmanship for three years. Simpson hardware and Stego vapor barrier carry manufacturer warranties that transfer with the house. What's not covered: seismic events, grade changes made by others after project completion, or utility excavation that disturbs the repaired area.

