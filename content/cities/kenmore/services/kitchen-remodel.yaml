title: "Kenmore Kitchen Remodel — Open-Concept Upgrades in 98028"

intro: |
  The ranchers along Holmes Point Drive and the split-levels near St. Edward State Park were
  built for a different way of cooking. Most 98028 homes from the 1960s and early '70s have
  load-bearing walls separating the kitchen from the living area — walls that need LVL beam
  work before they can come down.

  Bosch induction cooktops and Thermador double ovens deserve a layout that actually fits them.

  Vladislav Volkov is a WA Licensed Contractor who has handled that exact scope on 100+
  projects across King County since 2023. Owner-operated means you talk directly to the person
  managing the job, not a coordinator relaying messages through a chain. Call (206) 591-1096
  to schedule a free on-site consultation before anything goes on paper.

localContext: |
  Kenmore's 98028 zip code is predominantly split-levels and ranchers built between 1958 and
  1978, concentrated on hillside streets between NE 181st St and the Burke-Gilman Trail
  corridor. Original galley kitchens in these homes average 8x10 feet, with soffits hiding
  outdated wiring and 100-amp panels that were adequate for 1968 but not for today's
  appliance loads.

  PNW rainfall — 37-plus inches per year — makes vapor barriers in these crawlspaces non-negotiable.

  Demo often exposes failing subfloor framing that nobody budgeted for. Kenmore's hillside
  lots near Lake Washington, especially streets off Juanita Drive NE, collect moisture under
  vapor barriers that were never properly lapped or sealed at the perimeter. That subfloor
  remediation gets scoped before drywall starts — not after the cabinets are already in.

commonProblems:
  - title: "Structural Walls Blocking Open-Concept Kitchen Layouts"
    description: |
      Kenmore's 1960s tri-level and split-level floor plans routinely use the kitchen
      wall as structural support for the floor above.

      Removing it without engineering behind it causes deflection, sticking doors, and
      cracked finishes within a year. The fix: structural analysis, a properly sized LVL
      beam or PSL post, blocking at bearing points, and joist hangers reset before demo
      starts. Permit review through the City of Kenmore building division typically runs
      3–5 weeks for structural work.

      Deadline penalties are written into every TopVolk contract — not as a talking point,
      but as a line item. Call (206) 591-1096 if you want a quote that accounts for the
      structural scope before cabinet orders go in.

  - title: "100-Amp Panels Undersized for Induction Cooking and Double Ovens"
    description: |
      Most pre-1980 homes in 98028 are running 100-amp service — fine for a 1972
      electric range, not for a Thermador double wall oven and a Bosch induction cooktop
      running simultaneously. A panel upgrade to 200-amp service is required before
      rough-in begins.

      That's not optional — it's code.

      The electrical permit needs to be coordinated with the kitchen rough-in inspection
      or the project stalls waiting on sign-off. As a WA Licensed Contractor, TopVolk
      pulls and coordinates those permits upfront, not after a problem surfaces mid-project.
      Skipping that sequencing is how kitchen remodels end up sitting half-finished for
      three weeks while someone waits on the AHJ.

  - title: "Soffits, Outdated Cabinet Layout, and the IKEA vs. Semi-Custom Decision"
    description: |
      Original upper cabinets in Kenmore's mid-century kitchens sit below soffits that
      eat 14 or more inches of ceiling height and conceal wiring runs that predate current
      code. Full cabinet replacement usually triggers soffit demo, recessed lighting
      rough-in, and a real decision between IKEA and semi-custom.

      IKEA: functional, budget-controlled, standard 30mm cabinet boxes. Semi-custom: better
      interior finish quality and resale outcome at 98028's price tier.

      Both are legitimate choices depending on what the actual budget supports. The
      difference shows up in the quote. 100+ projects completed since 2023 means Vladislav
      has built both — and can show the finish comparison on jobs in the area before you
      decide.

