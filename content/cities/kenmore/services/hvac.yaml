localContext: |
  Kenmore's 98028 zip code splits between two main housing eras. The western and central neighborhoods — Kenmore Heights and the blocks near Log Boom Park along Lake Washington — run heavily to mid-century ranchers and split-levels from the 1955–1975 period. Those homes have oversized supply trunks and minimal return air capacity. That worked fine for a gas furnace. It strains under a heat pump's higher airflow requirements.

  Farther north, near the Kenmore-Bothell border approaching 98011, the stock shifts to 1990s and early 2000s construction with builder-grade HVAC now reaching end of service life. Both eras share the same regional reality: Kenmore averages over 37 inches of rain annually. Outdoor condenser units on north-facing wall mounts collect moss and Douglas-fir needle debris that clogs condenser fins faster than most homeowners expect. The City of Kenmore is the AHJ for residential mechanical permits, with review running 2–4 weeks for standard equipment swaps and longer for projects that include new ductwork or electrical service changes.

commonProblems:
  - title: "Gas-to-Heat-Pump Conversions in Kenmore's Mid-Century Ranchers"
    description: |
      Many 1960s Kenmore ranchers still run 80% AFUE gas furnaces with sheet-metal supply trunks sized for heating only. Converting to a cold-climate heat pump — a Bosch IDS 2.0 or Mitsubishi Hyper Heat are common choices at this price point — requires a Manual J load calculation and a static pressure test. The test confirms the existing duct system will not restrict airflow enough to cause short-cycling.

      Heat pumps move more air than gas furnaces. They deliver heat at 90–100°F supply temperatures rather than 120–140°F, so return air capacity has to match. Undersized return grilles are the most common bottleneck. Adding a return plenum or enlarging existing grille openings is typically part of the scope.

      Inflation Reduction Act rebates through Puget Sound Energy can offset $2,000–$8,000 depending on household income and equipment tier. A complete gas-to-heat-pump conversion in Kenmore runs $12,000–$22,000 installed, including new electrical service and the City of Kenmore mechanical permit. Permit review takes 2–4 weeks. Installation runs 2–3 days after approval. Call (206) 591-1096 to schedule a free on-site consultation — Vladislav does the estimate himself, with line-item pricing and no vague ranges.

  - title: "Ductless Mini-Split Installs for Kenmore ADUs and Room Additions"
    description: |
      WA HB 1337 (2024) allows up to two ADUs per single-family lot in Kenmore. Nearly every DADU or garage conversion needs its own conditioning system. Running new ductwork to a 400 sq ft backyard cottage is not practical without a full duct redesign.

      Mitsubishi and Daikin ductless mini-splits are the standard solution here. A single-zone 12,000 BTU Mitsubishi MZ-GL12NA handles most 400–600 sq ft ADU spaces. Multi-zone setups with two or three indoor heads serve larger additions or open-plan conversions. Refrigerant line sets penetrate the exterior wall and connect to an outdoor condenser mounted on a pad or wall bracket.

      The City of Kenmore requires a mechanical permit for any mini-split install. That permit also triggers a separate electrical permit for the dedicated 240V circuit. Single-zone installed cost runs $3,500–$6,500 depending on line set length and wall penetration complexity. Most single-zone installs complete in one day once the permit is in hand. TopVolk is a WA Licensed Contractor and submits all permit applications as part of the project scope — you do not deal with the permit center directly.

  - title: "Duct Sealing and Airflow Rebalancing in Kenmore's Older Split-Levels"
    description: |
      Split-level homes in Kenmore Heights and along 68th Avenue NE often have one room running 5–8°F off the thermostat. Usually it is a room at the end of a long supply branch or sitting above an unconditioned garage. The cause is rarely an undersized system.

      More often it is duct leakage at plenum connections combined with zone dampers that were never adjusted after original installation. A blower door test paired with duct pressurization testing can quantify total duct leakage. Homes from this era commonly show 25–30% leakage — nearly a third of conditioned air escaping before it reaches the living space.

      Aeroseal duct sealing or manual mastic application at joint connections can bring that figure below 5%. The difference shows up in comfort and on utility bills. Diagnostic testing runs $400–$700. Duct sealing and damper rebalancing runs $1,500–$4,500 depending on attic access and how many supply branches need adjustment. The City of Kenmore does not require a permit for duct sealing work that does not involve equipment replacement.

  - title: "High-Efficiency Furnace Replacement and Venting in Kenmore's Wet Climate"
    description: |
      Replacing a 1990s 80% AFUE gas furnace with a 96% AFUE condensing unit sounds like a straightforward swap. The venting change is where most homeowners get surprised. Condensing furnaces exhaust through PVC pipe rather than the existing B-vent metal flue — that means new penetrations through an exterior wall or rim joist.

      In Kenmore's climate, combustion air intake placement also matters. Position it on a north-facing wall and moss debris blocks the intake screen within a season. Carrier, Lennox, and Trane all offer 96%+ AFUE units in the $900–$1,500 equipment range. Installed cost with new PVC venting runs $4,500–$8,500 depending on furnace BTU/hr output and how complex the venting run is.

      The City of Kenmore requires a mechanical permit. Puget Sound Energy may offer a $200–$400 rebate for qualifying high-efficiency equipment. Budget 1–2 days for the swap after the permit clears. Deadline penalties are written into TopVolk's contracts — if the schedule slips, there are real consequences built in, not apologies after the fact.

  - title: "Smart Thermostat Zoning and Multi-Level Temperature Control"
    description: |
      Nest Learning Thermostats and ecobee SmartThermostat Premium units work well as direct replacements on most forced-air systems. Controlling a Kenmore split-level with a single thermostat is a different problem — the upstairs fights the downstairs all winter long.

      A proper two-zone system requires a zone control board, motorized dampers in the supply branches, and a bypass damper to handle excess static pressure when one zone closes off. Adding a Honeywell HZ322 zone controller with two zones and motorized dampers runs $2,500–$4,500 installed. The ecobee SmartThermostat with SmartSensor accessories handles moderate temperature differentials without a full zone board — a simpler middle-ground option where the delta is 3–4°F rather than 8°F.

      Systems involving new ductwork modifications require a City of Kenmore mechanical permit. Thermostat-only swaps typically do not. Annual damper motor checks and 90-day filter replacements keep the system accurate and avoid slow performance drift that goes unnoticed until the utility bill arrives.

