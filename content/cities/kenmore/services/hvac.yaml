  - q: "How do I know if my existing ductwork can handle a heat pump?"
    a: |
      A heat pump operates at lower supply air temperatures than a gas furnace — around 90–100°F versus 120–140°F — so it moves more air volume to deliver the same amount of heat. If total external static pressure in the duct system exceeds 0.5 inches water column, the heat pump will short-cycle and underperform.

      The diagnostic involves a static pressure test at the supply plenum and return side, plus a check of trunk sizing and filter cabinet restriction. In Kenmore's mid-century ranchers, undersized return grilles are the usual culprit. A pre-install duct diagnostic adds $400–$600 to the project but prevents the far more expensive situation of a new heat pump that never performs correctly. Call (206) 591-1096 — Vladislav does the diagnostic assessment directly, with findings explained in plain language.

  - q: "What warranty covers HVAC equipment and installation in Kenmore?"
    a: |
      Mitsubishi and Daikin mini-split equipment carries a 12-year parts warranty when registered within 60 days of installation. Unregistered units typically fall back to 5 years — keep the registration confirmation. Carrier and Lennox furnaces include 10–20 year heat exchanger warranties and 5–10 year parts warranties depending on the product line and registration status.

      In Kenmore's climate, outdoor condenser coils need an annual cleaning. Debris from Douglas-fir trees clogs fins regularly, and skipping maintenance can create grounds for a warranty dispute. TopVolk's installation labor is warranted for 1 year against defects in workmanship. Equipment warranties cover parts only — labor for warranty repairs is a separate cost to factor into the long-term picture.

