title: "Kenmore General Contracting — Full Remodels, Owner on Site"

intro: |
  The seaplane traffic over Lake Washington at Kenmore Air Harbor is a postcard backdrop for a city where most of the housing stock is quietly aging out. Split-levels and ranchers built between 1960 and 1980 fill the neighborhoods off 68th Avenue NE — and those homes are due for full gut-renovations, not patch jobs. A project in 98028 last year included a Bosch appliance package, and the structural surprises behind the original drywall added two weeks and $14K to the scope. That kind of thing happens here regularly.

localContext: |
  Most of Kenmore's residential stock sits in the 98028 zip code — 1960s and 1970s split-levels with post-and-pier or slab foundations, original galvanized plumbing, and framing that predates current IRC load requirements. The neighborhoods along Holmes Point Drive near the Lake Washington shoreline and up toward Inglewood Hill run a mix of mid-century ranchers and 1990s infill. King County DPER handles permits for unincorporated parcels near the city edge; the City of Kenmore issues its own permits for in-city lots — different portals, different plan review timelines.

commonProblems:
  - title: "King County DPER vs. City of Kenmore Permits — Two Separate Queues"
    description: "Kenmore sits in a jurisdictional split. Lots inside city limits go through the City of Kenmore permit center; parcels near the unincorporated King County edge go through DPER. Getting this wrong at intake means resubmitting applications, paying duplicate fees, and watching the plan review clock reset — four to eight weeks lost before a framer sets foot on site. Vladislav confirms jurisdiction before any application goes in."
  - title: "Hidden Structural Defects in 1960s and 1970s Split-Levels"
    description: "Demo day on a Kenmore split-level built in 1968 routinely turns up undersized headers, missing blocking at beam-to-post connections, and load-bearing walls absent from any original drawing. A rotted rim joist paired with a failed crawlspace vapor barrier can add $8K–$15K to a kitchen remodel scope. Scoping for it upfront avoids mid-project budget renegotiation."
  - title: "MEP Coordination Breakdowns on Multi-Trade Projects"
    description: "Framing, electrical, plumbing, and HVAC rough-ins all require sequential inspections before drywall hang starts. If the Mitsubishi mini-split sub is booked two weeks out and the rough-in inspection window closes, the whole schedule slips. On any renovation over $80K, MEP coordination isn't a nice-to-have — it's what determines whether the project finishes on time or runs three months over."

faq:
  - q: "How fast can you get to Kenmore for General Contracting?"
    a: "Kenmore is 25–30 minutes from most of our active King County job sites — straight up SR-522 to 68th Avenue NE. Vladislav comes out for the consultation, not a salesperson. Call (206) 591-1096 to set a time. TopVolk is a WA Licensed Contractor."
  - q: "Do you coordinate high-end appliance packages — Bosch, Thermador, KitchenAid?"
    a: "Yes. Kenmore kitchen remodels regularly spec Bosch dishwashers, Thermador or KitchenAid ranges, and occasionally Sub-Zero refrigeration. Rough-in dimensions, gas line sizing, and range hood CFM requirements all get confirmed against the appliance package before framing locks in — not after."
  - q: "What does a full renovation in Kenmore cost and how long does it take?"
    a: "A gut-kitchen runs $60K–$120K depending on layout changes and appliance spec. A full bath remodel with curbless shower, Schluter Kerdi waterproofing, and large-format porcelain tile: $25K–$45K. Timelines run 6–10 weeks for kitchen, 4–6 weeks for bath, 4–7 months for an ADU including City of Kenmore plan review. Deadline penalties are written into every contract — 100+ projects completed since 2023."