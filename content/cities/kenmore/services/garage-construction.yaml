title: "Kenmore Garage Construction — Detached Builds & DADUs, 98028"

answer: "TopVolk Construction LLC builds detached garages and DADU-above-garage structures in Kenmore, WA — WA Licensed Contractor, 100+ projects completed."

intro: |
  New garage construction in Kenmore runs $45,000–$65,000 for a standard two-car detached shell and climbs to $140,000–$180,000 when you add a finished DADU above it under WA HB 1337 — and all of it goes through Kenmore's own city building department, not King County DPER. TopVolk Construction LLC handles both scopes: Vladislav Volkov, who has completed 100+ projects across King County since 2017, pulls the permits, manages the concrete pour and framing, and stays as your direct contact from plan submittal through the final inspection. No sales staff, no call center.

  Kenmore sits along SR-522 between Bothell and Kenmore Air Harbor on the north shore of Lake Washington. The 1960s–1970s ranchers in the Wayne neighborhood and Finn Hill area — a large share of the 98028 housing stock — were platted for a single-car garage or none at all. Many of those lots have enough rear yard clearance for a full detached build once you run the FAR numbers. Every garage TopVolk builds gets a 50A or 60A EV charger circuit roughed into the sub-panel during framing — a Square D QO breaker spec is standard — because retrofitting after drywall typically costs three times as much as doing it during rough-in.

localContext: |
  Kenmore falls primarily in zip code 98028, with a narrow band near the Bothell city line that shares the 98011 zip. The bulk of the 98028 housing stock is mid-century to 1980s construction — two-story colonials and split-levels near Kenmore City Hall on 68th Avenue NE, plus 1960s ranchers in the Finn Hill area that were built without attached garages. That era of construction means post-and-pier foundations on some lots, which affects how a new attached garage ties into the existing structure.

  Garage setbacks in Kenmore are managed by the city's own permit office. Standard rear setback for a detached accessory structure is 5 feet from the property line, though corner lots near the SR-522 frontage roads require a 20-foot street setback — which meaningfully shrinks usable build area. Climate matters here too: Kenmore averages close to 37 inches of rain per year, concentrated October through May. North-facing garage walls accumulate moss fast in this area, which is why Hardie cement-board siding is the default exterior spec on TopVolk garage builds. It handles the PNW moisture cycle without the maintenance that cedar shake demands, and it won't rot at the trim joints.

commonProblems:
  - title: "DADU-Above-Garage Builds: Structural Loads and Permit Stack in Kenmore"
    description: |
      Building a finished living unit above a detached garage is legal in Kenmore under WA HB 1337, the 2024 statewide ADU law that allows up to two ADUs per single-family lot. The structural change from a standard garage is substantial: wall framing must carry floor loads, which means LVL beams at all header openings, doubled top plates, and an engineered floor system — typically TJI floor joists on 16-inch centers with plywood sheathing above. Kenmore's building department requires stamped engineered drawings for any structure with habitable space above, adding $2,500–$5,000 to pre-construction costs. Plan review runs four to eight weeks for a basic garage build, eight to twelve weeks when full MEP coordination — mechanical, electrical, plumbing — is involved. If you want a separate utility meter for the DADU, budget an additional $3,000–$6,000 for Puget Sound Energy trenching and connection fees on top of the construction cost.

  - title: "Concrete Slab Drainage and Surface Cracking in Kenmore's Rain Climate"
    description: |
      A garage slab that doesn't drain correctly will pool water at the back wall every winter and crack at the perimeter within five to seven years. The IRC minimum is a 4-inch slab, but the right spec for Kenmore is fiber-reinforced concrete — polypropylene fibers at 1.5 lbs per cubic yard added at the batch plant — which handles freeze-thaw movement and surface stress better than plain mix. The slab needs a 1/8-inch-per-foot slope toward the overhead door apron, and lots with flat grades near the Lake Washington shoreline often need a trench drain or daylight outlet to handle winter runoff. A 6-mil polyethylene vapor barrier under the slab is non-negotiable given the soil moisture levels throughout 98028 — skip it and you get concrete spalling and a musty interior within two wet seasons. A properly poured 24x24-foot slab in Kenmore runs $8,000–$14,000 depending on reinforcement spec and site access.

  - title: "Matching New Garage Siding and Roofline to 1970s Kenmore Housing Stock"
    description: |
      A detached garage that looks like it arrived from a different decade hurts resale value in Kenmore's competitive residential market. The challenge with 1970s houses is the original siding — T1-11 plywood or cedar shake — which doesn't have a clean modern match. The practical solution is Hardie lap siding or board-and-batten in a color pulled from the main house trim: it holds up in PNW rain without the repainting cycle cedar requires, and it reads as intentional rather than mismatched. Roofline is more straightforward — most Kenmore ranchers carry a 4:12 or 5:12 pitch, so matching the garage roof spec is a direct lift from the existing drawings. If a DADU above the garage is in scope, Kenmore's building code caps the total structure height at 24 feet, so a low-pitch roof keeps you comfortably under that limit. Budget $4,000–$7,000 above a builder-standard garage price for correct exterior matching on a 1970s property.

  - title: "What a New Garage Actually Costs in Kenmore: The Real Cost Drivers"
    description: |
      A basic unfinished two-car detached garage — 24x24 feet, slab, framing, roof, one Clopay or Amarr overhead door — runs $45,000–$65,000 in Kenmore with standard materials. Add insulation, drywall, a Mitsubishi MXZ mini-split for climate control, and a dedicated 100A sub-panel, and you're at $70,000–$90,000. A full DADU-above-garage with a finished one-bedroom unit, Navien tankless hot water, and a separate utility connection lands at $140,000–$180,000 depending on finish level. The real cost drivers: engineered drawings (required for DADU structures), utility trenching, and exterior finish matching to the existing house. Kenmore building permits run $2,500–$5,000 for a standard detached garage and $6,000–$10,000 for a DADU structure. TopVolk provides line-item quotes after a site visit — not ranges over the phone. Call (206) 591-1096 to schedule a free on-site estimate.

  - title: "EV Charger Pre-Wire and Workshop Electrical: Rough It In During Framing"
    description: |
      The right time to run a 50A or 60A EV charger circuit is during rough-in, before insulation and drywall go up. At that stage it's a straightforward conduit run from the main panel to a sub-panel in the garage — a Square D QO 60A two-space panel handles EV charging and workshop tools on the same circuit without issue. After drywall, fishing that conduit through a finished wall adds $1,500–$2,500 in labor to what was a two-hour rough-in task. Kenmore homeowners in the higher-income brackets near the Lake Washington waterfront are running Rivians, F-150 Lightnings, and Tesla Model X vehicles at a higher rate than the county average — Level 2 home charging requires that 240V circuit. A NEMA 14-50 outlet or hardwired EVSE rough-in during construction adds $800–$1,400 to the electrical scope. Waiting until the garage is finished adds $2,000 or more, plus the disruption of cutting into completed work.

