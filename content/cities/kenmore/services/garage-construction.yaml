  - q: "What permits are required for a new garage in Kenmore, WA?"
    a: |
      Kenmore runs its own building department — permits go through the city, not King County DPER. A standard detached garage requires a building permit with a site plan, foundation drawing, and framing plan. A DADU-above-garage structure adds stamped engineered drawings and a separate mechanical permit for the HVAC system. Plan review in Kenmore runs four to eight weeks for a basic garage, eight to twelve weeks for a DADU. Permit fees run approximately $2,500–$5,000 for a detached garage and $6,000–$10,000 for a DADU structure. TopVolk, a WA Licensed Contractor, prepares and submits the full permit package — you don't need to navigate city hall yourself.

  - q: "Should I pre-wire my Kenmore garage for EV charging during construction?"
    a: |
      Rough it in during framing — that's the only time it's cost-effective. Running a 60A circuit for a Level 2 charger before drywall takes a few hours and costs $800–$1,400 in materials and labor combined. Retrofitting that same circuit after the garage is finished means cutting into completed drywall to fish conduit, and typically runs $2,000–$2,500 or more. Standard spec is a Square D QO sub-panel in the garage with a NEMA 14-50 outlet at the parking stall. If the garage doubles as a workshop, add a second 240V circuit for heavy tools at the same rough-in visit — marginal cost during framing, significant cost if you return for it later.

