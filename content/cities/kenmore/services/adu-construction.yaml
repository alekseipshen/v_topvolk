  - q: "Should I build a detached ADU or convert my basement in Kenmore?"
    a: |
      Basement conversions cost less — $65,000–$110,000 versus $108,000–$168,000 for a ground-up DADU — but the 1960s and 1970s homes common in the 98028 zip often have shallow crawlspaces rather than full basements, which limits that path. A detached ADU gives tenants more privacy and eliminates shared-wall noise issues, which matters for longer-term rentals near the Burke-Gilman Trail corridor. Under WA HB 1337, you can combine one attached and one detached ADU on the same lot, so a phased approach over several years is also viable. The right call depends on your lot, foundation conditions, and rental strategy. Vladislav walks through the tradeoffs on the first site visit — call (206) 591-1096 to set that up.

  - q: "What warranty do you provide on ADU construction in Kenmore?"
