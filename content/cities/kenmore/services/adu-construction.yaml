title: "Kenmore ADU Construction — Add a Rental Unit to Your Lot"

answer: "TopVolk Construction builds DADUs and attached ADUs in Kenmore, WA — owner-led by Vladislav Volkov, WA Licensed Contractor, 100+ projects completed since 2017."

intro: |
  Statewide ADU reform under WA HB 1337 (2024) now lets most Kenmore single-family lots support up to two ADUs — detached, attached, or basement conversions — and TopVolk Construction has been building them across King County since 2017. Kenmore's stock of 1960s and 1970s ranch homes on 7,000–10,000 sq ft lots near the Burke-Gilman Trail corridor is well-suited for a rear-yard DADU: the lot depth is usually there, side and rear setbacks are workable, and City of Kenmore permit review typically moves faster than Seattle SDCI. Units near Log Boom Park and along Juanita Drive NE are renting for $1,600–$2,200 per month, given proximity to Bothell and Kirkland tech employment. Rental yield math here is hard to ignore. For mechanical, a Mitsubishi mini-split handles heating and cooling in a 600–800 sq ft unit without running new ductwork through an existing house. Vladislav Volkov handles every project directly — no sales staff, no project manager middleman. Call (206) 591-1096 to schedule a free on-site consultation.

localContext: |
  Most of Kenmore falls in zip code 98028, with the eastern edge bordering Bothell's 98011 corridor along the Sammamish River Trail. The housing stock divides clearly by era: post-war ramblers and split-levels built from 1955 to 1975 dominate the hillside neighborhoods above Lake Washington, while the flatter parcels near NE 181st Street and 68th Avenue NE have seen more 1980s and 1990s infill construction. Older homes in the 98028 core often have post-and-pier or shallow perimeter foundations, which limits what's feasible for a basement conversion ADU — you may need to upgrade the crawlspace with a vapor barrier and DriCore subfloor before any finished living space is viable. Kenmore's ~37 inches of annual rainfall, concentrated from October through May, puts real demands on exterior envelope details: Hardie cement-board siding and proper flashing at rim joists matter here more than in a drier climate. City of Kenmore handles its own building permits through its Community Development department — separate from King County DPER — with plan review typically running 4–8 weeks for a standard DADU application.

commonProblems:
  - title: "Setback and Lot Coverage Limits Catching Homeowners Off Guard"
    description: |
      WA HB 1337 changed a lot statewide, but it didn't eliminate setbacks or lot coverage limits. City of Kenmore requires a minimum 5-foot side and 5-foot rear setback for a DADU, and lot coverage caps — typically 40–45% of the parcel — can restrict what's buildable when the existing house already occupies a large footprint. FAR (Floor Area Ratio) calculations also apply: the ADU's square footage counts toward the total allowable. On the 1960s rambler lots near NE 145th Street, a detached garage conversion sometimes sidesteps these constraints because it works within an existing footprint rather than adding new lot coverage. Vladislav measures the lot and all existing structures on the first site visit and flags any constraint before plan work begins. That catches problems before they become expensive permit denials. Typical buildable DADU footprint in Kenmore runs 500–800 sq ft given these limits.

  - title: "Water and Sewer Connection Decisions for a Kenmore DADU"
    description: |
      Most Kenmore parcels are served by Northshore Utility District for water and King County Metro for sewer. Adding a DADU triggers a decision: shared utility connection off the main house lateral, or a separate meter and service tap. Shared connections cost less upfront — typically $3,000–$6,000 for rough-in plumbing inside the ADU using Uponor PEX-A supply lines — while a separate utility tap runs $8,000–$15,000 or more depending on distance to the main and any road-cut permit requirements from the city. Owner-occupied rental scenarios often favor shared connections for simplicity. Separate connections make more sense if you're planning to eventually sell the ADU unit independently, which WA HB 1337 now permits. We schedule the King County Metro sewer inspection as part of the permit package — timeline from rough-in inspection to utility sign-off typically runs 3–5 weeks.

  - title: "City of Kenmore Permit Process: What the Timeline Actually Looks Like"
    description: |
      Kenmore runs its own permit center — not King County DPER, not Seattle SDCI. The city's Community Development department reviews all ADU applications, and a new DADU requires a full building permit package: site plan, floor plans, structural drawings, and a Washington State Energy Code (2021 edition) compliance worksheet. Plan review for a straightforward DADU runs 4–8 weeks. Projects on slopes, near critical areas, or with structural complexity can push to 10–12 weeks. Kenmore doesn't have a formal pre-approved ADU plan program. TopVolk prepares the full permit package — site plan, framing details, energy compliance documentation — as part of every project. Vladislav coordinates directly with the city's plan reviewer when correction comments come back, which cuts revision cycles by weeks. Budget 4–6 months total from permit submittal to final inspection on a ground-up DADU. We are a WA Licensed Contractor active in all King County permit jurisdictions.

  - title: "ADU Construction Costs in Kenmore: What Actually Moves the Number"
    description: |
      Ground-up DADU construction in Kenmore typically runs $180–$280 per sq ft, so a 600 sq ft unit lands between $108,000 and $168,000 before permit fees, utility connections, and site work. Basement or crawlspace conversions come in lower — $65,000–$110,000 for a complete, code-compliant unit — but foundation conditions on those 1960s homes often add scope: vapor barrier, DriCore subfloor, and structural reinforcement can push the number by $10,000–$20,000. Finish level matters more than most homeowners expect. Bosch appliances, quartz countertops, and large-format porcelain tile add $15,000–$30,000 over builder-grade spec. TopVolk quotes are line-item, not ballpark ranges — you see exactly what the MEP rough-in, R-49 ceiling insulation, drywall, and finish work each cost. Deadline penalties are written into the contract. At $1,800/month in rent, a $130,000 DADU pencils out to a 16.6% gross annual return on construction cost.

  - title: "Moisture Control and Envelope Details That Determine Long-Term Durability"
    description: |
      North-facing DADU walls in Kenmore develop moss and surface mildew within 2–3 years without proper exterior detailing. Hardie cement-board siding handles the region's ~37 annual inches of rainfall far better than untreated cedar or standard LP SmartSide on exposed elevations. Ground-contact sill plates need pressure-treated (PT) lumber. Flashing at any ledger board connection is non-negotiable. A continuous air barrier at the sheathing layer matters for both moisture control and energy code compliance. Inside wet areas, Schluter Kerdi membrane in the shower and RedGard on wet-wall tile backers prevent the moisture intrusion that's almost guaranteed to cause structural damage within 5–7 years in PNW conditions if skipped. For mechanical, Mitsubishi mini-split heat pumps handle dehumidification in Kenmore's long shoulder seasons better than gas furnaces paired with a separate dehumidifier. Proper detailing at the time of rough-in costs a fraction of what remediation costs five years later.

