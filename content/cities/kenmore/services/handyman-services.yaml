localContext: |
  Kenmore's residential footprint in 98028 divides fairly cleanly between mid-century construction and the development that pushed in during the late 1980s through early 2000s. Older ranchers and split-levels — built roughly 1958 to 1975 — cluster around the lakefront neighborhoods near Holmes Point and along Bothell Way NE. These houses have absorbed decades of King County's wet winters: about 37 inches of rain annually, heavy moss growth on north-facing surfaces, and seasonal humidity that causes wood window frames to swell and stick from October through April. Weatherstripping on the original 1960s exterior doors is almost always overdue for replacement. Homes closer to the Burke-Gilman Trail corridor and the redeveloped Kenmore Village area present different problems: builder-grade fixtures from the 1990s now past their service life, smart-home retrofit wiring that doesn't always cooperate, and post-remodel punch lists left open after recent kitchen and bath upgrades. For work that actually requires a permit, Kenmore's city building department handles it in-house — separate from King County DPER, which governs only unincorporated county parcels. Most standard handyman repairs fall below the permit threshold, but anything touching gas lines, the main electrical panel, or structural elements does not.

commonProblems:
  - title: "Post-Remodel Punch Lists That Never Got Closed Out"
    description: |
      Kitchen and bath remodels in Kenmore's upper-income households frequently end with a list of open items nobody circled back to: cabinet door hinges needing adjustment, a final caulk line at the tile-to-tub transition, towel bar hardware still sitting on the vanity counter. Contractors finish the big scope and move to the next job — fine-grained finish work gets deferred indefinitely. A punch-list visit from TopVolk covers the blue tape walkthrough items: Schluter Kerdi-compatible sealant at tile and fixture joints, hardware installation on cabinet faces, drywall touch-ups where baseboard trim was reset, and fixture final connections. Most post-remodel punch-list calls in a full kitchen or bath run 4–8 hours of labor. Figure $400–$700 for a focused half-day to full-day visit. Vladislav writes a line-item scope before starting so the invoice matches the quote exactly.

  - title: "Weatherstripping and Door Gaps in Mid-Century Kenmore Homes"
    description: |
      Original neoprene compression seals on 1960s and 70s exterior doors have cracked and flattened after 40-plus wet PNW winters — Kenmore's lake-adjacent humidity is hard on door seals. Doors that drag on the threshold in October aren't just swelling from moisture; often the door sill sweep is completely gone and the jamb has settled slightly. The fix involves replacing the door sweep with a heavy-duty aluminum-bottom unit like a Pemko 270A, installing fresh V-strip weatherstripping on the side jambs, and checking the threshold plate for level. On a standard 3/0 exterior door, labor and materials run $150–$300 depending on jamb condition and whether minor blocking is needed. Windows get the same treatment — original aluminum-frame windows in these houses typically have no functional perimeter foam seal remaining, and replacing it makes a noticeable difference before the rains arrive in earnest each fall.

  - title: "Smart Thermostat and Doorbell Camera Installs — Wiring Doesn't Always Cooperate"
    description: |
      Upper-income Kenmore households near the Burke-Gilman Trail and newer construction zones are adding Nest Learning Thermostats, Ecobee SmartThermostat Premium units, and Ring Video Doorbell Pro 2 cameras to homes that weren't wired for them. The common (C) wire that both Nest and Ecobee require often doesn't exist at the thermostat junction in 1980s and 90s HVAC systems — the fix is running a new C wire through the existing conduit or installing a four-wire add-a-wire adapter at the air handler. Doorbell cameras hit similar snags: the Ring Pro 2 needs 16–24VAC at sufficient amperage, and older low-voltage doorbell wiring sometimes can't deliver it without a transformer upgrade. No building permit is required for low-voltage device swaps in Kenmore under normal circumstances. TopVolk handles the wiring assessment, device mounting, and basic app pairing — these installs typically run $100–$250 per device depending on wiring condition.

  - title: "Drywall Patches: Texture Matching Is Where Most Handymen Fall Short"
    description: |
      A 4-inch drywall patch sounds routine until you're standing in front of an orange-peel or knockdown ceiling in a 1990s Kenmore home that's been repainted three times. The structural repair — cutting out the damaged section, installing a backer clip or solid blocking, hanging new drywall, taping with three coats of USG all-purpose joint compound — is the straightforward part. Texture matching requires the right equipment: a hopper gun with calibrated air pressure and tip size, not aerosol cans from the hardware store. Getting a real blend takes two visits minimum — patch and prime first, then texture and finish paint after full cure time. CertainTeed drywall stock and USG compound are standard throughout the process. A small patch under 12 inches runs $150–$300 with texture matching included; larger repairs covering multiple panels are quoted separately with a fixed price written before work starts.

  - title: "Deck Board Replacement and Railing Repairs Before Another Wet Season"
    description: |
      Lake-adjacent Kenmore neighborhoods see accelerated deck wear: persistent moss on north-facing boards, soft spots in pressure-treated (PT) lumber that has been sitting wet since the 1990s, and railings that have loosened at the ledger board connection after years of seasonal movement. Replacing individual deck boards rather than the full structure makes sense when the underlying joists are still solid — pull the compromised boards, check joist tops for rot, sister joist or replace sections where needed, and reinstall with new PT lumber or composite decking like Trex Transcend or TimberTech AZEK for homeowners who want low-maintenance going forward. Railing post bases rotted at the footing can often be repaired with a Simpson post base and fresh concrete without a full rebuild. Board-level deck repairs in 98028 typically run $800–$2,500 depending on scope and material choice. Composite adds cost upfront but eliminates annual sealing and repainting entirely.

