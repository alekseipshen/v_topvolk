  - q: "Do handyman repairs in Kenmore require a building permit?"
    a: |
      Most standard handyman repairs fall below Kenmore's permit threshold. Faucet and fixture swaps, weatherstripping, drywall patches, deck board replacement, and low-voltage smart device installs typically don't require a city permit under normal scope. Work that does trigger a permit includes structural changes, main electrical panel modifications, gas line work, and larger additions or alterations affecting the building envelope. Kenmore's building department operates independently from King County DPER, which covers only unincorporated county parcels — not city of Kenmore addresses. If a job's scope expands into permit territory, TopVolk is a WA Licensed Contractor and handles plan review submission, rough-in inspection coordination, and final sign-off correctly from the start.

  - q: "Can you match existing wall or ceiling texture in older Kenmore homes?"
    a: |
      Texture matching is the hardest visible part of a drywall patch — and where the result either disappears or announces itself permanently under raking light. The 1980s and 90s homes common in parts of 98028 often have knockdown or orange-peel ceilings applied with a hopper gun, not aerosol cans. Getting a real match means using similar spray equipment, adjusting air pressure and tip size to approximate the original texture density, and reviewing the patch under side lighting before calling it done. Vladislav uses USG joint compound and CertainTeed board stock on every drywall repair. If the texture doesn't blend under normal lighting after the finish visit, it gets reworked — that expectation goes into the written quote upfront.

