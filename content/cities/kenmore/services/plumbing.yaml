title: "Kenmore Plumbing — Pipe Replacement & Water Heater Upgrades"

answer: "TopVolk Construction handles plumbing remodels and pipe replacement in Kenmore, WA — WA Licensed Contractor, owner-operated, 100+ projects since 2017."

intro: |
  Galvanized supply lines corroding inside Kenmore's mid-century ranchers are the most common call TopVolk Construction gets from this part of King County. Vladislav Volkov, owner of TopVolk — WA Licensed Contractor — has been handling full repiping, tankless water heater conversions, and fixture upgrades in Kenmore since 2017, with 100+ projects completed across the Seattle Metro. The housing along Bothell Way NE and around the Log Boom Park waterfront runs heavily 1950s through 1970s — exactly the era when galvanized steel supply pipe was standard, and those pipes are now corroding from the inside out, building up iron oxide scale that chokes flow and fails at threaded joints. A Rinnai tankless conversion, for instance, almost always requires a gas line upsize from 1/2" to 3/4" before the City of Kenmore Building Division signs off on the mechanical permit. TopVolk handles the permit paperwork, gas line work, fixture coordination, and rough-in inspection scheduling in a single project scope — no subcontractor handoffs, no middlemen. Call (206) 591-1096 to set up an on-site walkthrough with Vladislav directly.

localContext: |
  Kenmore's primary zip code is 98028, covering the residential grid between SR-522 and the Lake Washington shoreline. Homes in this corridor — particularly on the slopes toward Inglewood Hill and the quieter streets east of 68th Ave NE near Saint Edward State Park — date from the late 1950s through the 1970s, and many still have original galvanized water supply lines or polybutylene pipe left over from an 80s renovation. The neighboring 98011 zip (Bothell's southern edge, which shares a border with Kenmore along Juanita Drive NE) carries the same housing age and the same failure pattern. Permit jurisdiction here is the City of Kenmore Building Division — not King County DPER — since Kenmore incorporated as its own city in 1998. Water heater replacements require a mechanical permit and a seismic strapping inspection per WA state code. Heavy rainfall from October through May puts crawlspace vapor barriers and drain-line pitch under constant stress, and under-ventilated utility spaces in these older homes tend to accumulate moisture damage that complicates pipe access and subfloor work.

commonProblems:
  - title: "Galvanized Pipe Corrosion — Full Repipe to PEX-A"
    description: |
      Galvanized steel supply pipe — standard in Kenmore homes built between 1940 and 1968 — corrodes from the inside out. Iron oxide scale builds up on the interior wall, narrowing the effective diameter from 3/4" down to barely pencil-width in severe cases. You'll notice it as low pressure at fixtures, rust-orange water on startup, or pinhole leaks at threaded joints where the zinc coating is fully gone. The fix is a full repipe with 1/2" and 3/4" PEX-A (cross-linked polyethylene), which handles Kenmore's crawlspace humidity and mild freeze-thaw cycles better than rigid copper in exposed runs. Uponor AquaPEX or Viega FlexPEX are the standard material choices. Labor and material for a typical 1,400 sq ft Kenmore rancher runs $8,000–$14,000 depending on crawlspace headroom and whether any drain lines need rerouting at the same time. Plan for 3–5 days of work with one full-day water shutoff at the start.

  - title: "Polybutylene Pipe Failure at Acetal Fittings"
    description: |
      Gray polybutylene pipe — marked "PB2110" on the side — was installed in King County homes from roughly 1978 through 1995, which covers a significant portion of Kenmore's 98028 housing stock, particularly on residential streets north of SR-522 near the Inglewood area. The pipe itself doesn't fail from corrosion; it micro-fractures at the acetal plastic fittings when exposed to chlorinated city water over decades. Failures tend to be sudden — a wet ceiling or flooded utility room rather than a slow drip. Some insurance carriers are now refusing to renew policies on homes with polybutylene still in place. Whole-house replacement is the only real fix, typically using Uponor PEX-A or Type-L copper for short exposed runs. A full replacement in a 1,600 sq ft home takes 4–6 days and costs $10,000–$16,000. The City of Kenmore requires a plumbing permit for this scope — we pull it before starting and schedule the rough-in inspection before any drywall goes back up.

  - title: "Tankless Water Heater Conversion — Permit and Gas Line Upsize"
    description: |
      Switching from a 50-gallon tank unit to a Rinnai RU199iN or Navien NPE-240A2 in a Kenmore home isn't just a fixture swap. Most mid-century homes here have 1/2" gas supply lines that can't deliver the 199,000 BTU these units demand at full draw — so a 3/4" or 1" gas line run from the meter is almost always part of the job. Venting changes too: tankless units typically require a direct-vent or Category III stainless steel flue, which is different from the B-vent on most tank heaters. The City of Kenmore Building Division requires a mechanical permit for all water heater replacements, and seismic strapping is required per WA IRC even for wall-mounted tankless units. TopVolk handles the permit application, gas line upsize, venting rough-in, and final inspection scheduling as part of one project. Installed cost for a Rinnai RU199iN in a typical Kenmore home runs $3,500–$5,500 depending on gas line run length and venting configuration.

  - title: "Fixture Upgrades and Replumbing Cost — What Actually Drives the Price"
    description: |
      Full replumbing in Kenmore — supply line replacement, shut-off valve upgrades, and fixture connections — typically runs $8,000–$18,000 for a 3-bedroom home. The biggest cost driver isn't pipe material; it's access. An open crawlspace with decent headroom cuts labor hours significantly compared to a slab-on-grade floor or a finished basement with concrete block walls. Fixture selections add on top: Moen Magnetix showerheads, Kohler Cimarron toilets, and Delta Trinsic faucets together run $800–$3,000 per bathroom depending on model. TopVolk quotes line-item — pipe material, labor hours, permit fee, and fixture cost are broken out separately, so there are no vague ranges or surprise add-ons at the end. A free on-site estimate from Vladislav (the person actually doing the work, not a sales rep) takes about 45 minutes and produces a written quote within 48 hours. Deadline commitments are written into every contract, with financial penalties for missed dates.

  - title: "Pressure Regulator Installation — High PSI Damaging Fixtures"
    description: |
      City water pressure in parts of Kenmore — particularly at lower elevations near the Lake Washington shoreline — regularly runs above 80 psi. The IRC sets 80 psi as the residential maximum; anything above that stresses fixture valves, washing machine hoses, dishwasher solenoids, and refrigerator ice maker lines. A failing Bosch dishwasher inlet valve or a burst LG washing machine supply hose is often a water pressure problem, not a hardware defect. The fix is a brass pressure-reducing valve (PRV) installed on the main supply line at the point of entry, typically near the meter shutoff in the crawlspace or utility room. Watts and Zurn manufacture the most reliable residential PRVs for this application. Installation runs $350–$650 and takes 2–3 hours. A PRV should be checked every 3–5 years since the internal spring wears and calibration drifts — especially in homes with a Navien or Rinnai tankless unit, which is sensitive to supply pressure fluctuations.

