  - q: "What does a plumbing repipe or water heater replacement cost in Kenmore?"
    a: |
      Scope drives price more than anything else here. Whole-house repipe from galvanized to PEX-A in a 1,200–1,600 sq ft rancher runs $8,000–$14,000. Tankless water heater installation — Rinnai or Navien, including gas line upsize and new venting — runs $3,500–$5,500. A single bathroom fixture swap with a Moen or Kohler faucet, toilet, and supply lines runs $400–$900 in labor plus fixture cost. Polybutylene whole-house replacement tends to land between $10,000 and $16,000 depending on ceiling access and slab conditions. Every quote is line-item — no vague ranges. Call (206) 591-1096 or request a free on-site estimate; Vladislav walks the space, reviews the full scope, and delivers a detailed written quote within 48 hours of the visit.

  - q: "Do plumbing projects in Kenmore require a city permit?"
    a: |
      Most major plumbing work does. The City of Kenmore Building Division handles all permit review — not King County DPER — since Kenmore incorporated in 1998 as its own municipality. Water heater replacements require a mechanical permit and a seismic strapping inspection. Full repiping and drain line reroutes need a plumbing permit with rough-in and final inspections. Simple fixture swaps — faucet or toilet replacement with no supply or drain relocation — typically don't require a permit. Straightforward residential plumbing permits usually process in 5–10 business days; larger plan sets can take 2–4 weeks. TopVolk is a WA Licensed Contractor — we pull permits in our name, coordinate all inspection scheduling, and make sure the completed work shows correctly on the home's permit record.

  - q: "Can you reroute drain lines for a kitchen island or basement bathroom in Kenmore?"
    a: |
      Yes — drain line rerouting comes up regularly in Kenmore kitchen remodels and basement bathroom additions. Kitchen island drains require either an air admittance valve (AAV) or a wet-vent configuration tied to the main stack, depending on distance and floor joist direction. Basement rough-ins almost always mean cutting the concrete slab to connect below the existing drain line, which adds concrete saw rental and debris disposal to the project cost. All crawlspace drain lines need to maintain a minimum 1/4" per foot pitch back to the stack per IRC requirements. Venting is critical — an improperly vented P-trap drains slowly and eventually siphons the trap seal dry, letting sewer gas into the living space. We map the existing drain layout before any cuts are made.

  - q: "What warranty comes with TopVolk plumbing work in Kenmore?"
    a: |
      Workmanship warranty is written into every contract — typically one year on labor for all rough-in and finish work. PEX-A pipe (Uponor AquaPEX) carries a 25-year manufacturer warranty. Rinnai water heaters carry a 12-year heat exchanger and 5-year parts warranty when registered at installation. Kohler and Moen fixtures include lifetime limited warranties on finish and function for the original purchaser. Kenmore's wet season — heavy rain October through May, with crawlspace humidity cycling year-round — means exposed pipe transitions and drain connections should get a visual inspection every 5–7 years regardless of pipe age. Any workmanship issue that surfaces within the warranty window gets fixed. That commitment is in the contract, along with the deadline penalty clause.

