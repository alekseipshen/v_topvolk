  - q: "Does flooring installation require a permit from the City of Kenmore?"
    a: |
      Standard residential flooring — hardwood, LVP, tile — does not require a building permit in Kenmore for finish floor work. It's classified as a non-permitted cosmetic trade under the IRC and the City of Kenmore's local building regulations. The exception is structural work: sistering or replacing joists, or cutting into the subfloor for in-floor heating elements, may trigger a permit through the City of Kenmore Building Division. Parcels on the unincorporated edge near the city line fall under King County DPER jurisdiction instead. TopVolk is a WA Licensed Contractor — any required permits are pulled and managed as part of the project scope, not handed off to the homeowner to figure out.

  - q: "Is LVP or engineered hardwood the better choice for a Kenmore home?"
    a: |
      LVP — specifically 100% waterproof products like COREtec Plus — is the right call for kitchens, bathrooms, mudrooms, and any space on or below grade. It doesn't react to moisture, holds up through Kenmore's wet season without gapping, and costs less per square foot installed. Engineered hardwood fits main living areas and bedrooms where the look and feel of real wood matters and where refinishing life adds resale value in this market. Mirage Engineered and Shaw Floorté are both worth comparing at Kenmore's price point. Vladislav brings samples on-site and walks through both options during the free consultation so the decision is based on the actual space, not a showroom display.

  - q: "What warranty covers flooring installation work in Kenmore?"
    a: |
      TopVolk provides a written workmanship warranty on installation — one year covering delamination, gapping, squeaking, and installation defects not caused by moisture intrusion or subfloor movement that wasn't documented at the time of install. Product warranties are manufacturer-specific: COREtec LVP carries a lifetime residential warranty on the core; Mirage Engineered hardwood warrants the finish for 35 years residential use. In Kenmore's PNW climate, the main durability risk after install isn't normal wear — it's moisture events like failed supply lines or crawlspace flooding, which fall under homeowner's insurance rather than flooring warranty. Full project documentation, product install guides, and maintenance schedules are handed over at project close.

