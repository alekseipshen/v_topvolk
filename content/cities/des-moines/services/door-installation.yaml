title: "Des Moines Door Installation — Salt Air Demands Better Seals"

intro: |
  Woodmont and Marine Hills sit within half a mile of the Puget Sound shoreline,
  and the salt-laden air that rolls through the 98198 zip from October through May
  doesn't forgive a poorly flashed door or a compressed weatherstrip. The
  1960s and 1970s ranchers that make up the bulk of Des Moines's housing stock
  are now 50-plus years into their service life—and the original steel entry doors
  on those homes, if they haven't been replaced already, are showing it. Blown
  door sweeps, rotted sill plates hidden under threshold covers, and brick mold
  caulk that cracked a decade ago are letting conditioned air out and damp Pacific
  air in. Vladislav has replaced entry doors on homes near the Des Moines Marina
  where water had been sheeting behind the original exterior casing for years,
  rotting the king stud on both sides of the rough opening with no visible sign
  from inside. Installing a Therma-Tru Smooth-Star fiberglass door with a proper
  sill pan membrane, head flashing, and Vycor tape at all four corners stops that
  cycle—a bead of caulk never did.

localContext: |
  Most of Des Moines sits within the 98198 zip code, with a narrow band of
  residential addresses near the southern boundary crossing into 98003 toward
  Federal Way. The dominant housing era is 1963 to 1985—single-story ranchers
  on slabbed lots in Woodmont, split-levels on the steeper hillside parcels above
  Marine View Drive. Both types were built with 2x4 framing and standard 3/0 x
  6/8 door openings, which means most entry and interior door swaps are
  straightforward dimensionally—but the framing around them often isn't. Galvanized
  nails, decades of moisture cycling, and inadequate original vapor barriers mean
  the rough openings on 1970s homes frequently have some degree of rot at the sill
  or the bottom of the jack stud. Original aluminum-frame patio sliders from this
  era have single-pane glazing and worn roller assemblies—upgrading to a Milgard
  Tuscany or Pella 150 Series sliding door cuts both air infiltration and noise
  from the SR-509 corridor significantly. The City of Des Moines Building Division
  handles permits for structural door work; like-for-like replacements in the same
  opening typically don't require a permit, but header modifications and new
  openings do.

commonProblems:
  - title: "Rotted Sill and King Stud Behind Original Entry Doors in Woodmont"
    description: |
      Entry doors on Woodmont ranchers from the 1970s were installed without sill
      pan flashing—sometimes without even a proper threshold. Rain hits the brick
      mold, wicks under the exterior casing, and drains straight onto the rough sill
      and the bottom of the king stud. By the time a homeowner notices soft flooring
      near the entry or a door that's started sticking at the bottom, the OSB
      subfloor and the bottom plate under the threshold are already compromised.
      Fixing it right means pulling the old door completely, sistering the damaged
      king stud if needed, replacing rotted sill material, and installing a VycorPlus
      sill pan membrane across the full width of the rough opening before the new
      door unit goes in. A Therma-Tru Smooth-Star fiberglass door in a 3/0 x 6/8
      opening with new exterior casing, threshold, and paint prep runs $1,800–$3,200
      installed. Hidden framing damage adds $300–$800 depending on scope. The install
      itself is a one-day job once materials are on site.

  - title: "Patio Sliding Door Upgrade from 1970s Aluminum to Modern Low-E Units"
    description: |
      The aluminum-frame single-pane sliders on split-levels above Marine View Drive
      are past their useful life. Roller assemblies on 40-year-old units are worn
      beyond adjustment, the glazing has no low-E coating, and the aluminum frames
      conduct cold directly into the interior—a real issue in a home that also has
      original single-pane windows throughout. Replacing a 6/0 x 6/8 slider with a
      Milgard Tuscany vinyl-frame unit with dual-pane low-E glass is the most common
      upgrade Vladislav installs in this part of Des Moines. If the homeowner wants
      to convert to French doors instead, the existing rough opening usually needs
      a new LVL beam to carry the load properly—that's a structural change that
      triggers a permit with the City of Des Moines Building Division. A straight
      slider swap without structural work runs $2,200–$4,500 installed. A French
      door conversion with header modification runs $4,500–$8,000.

  - title: "Permits for New Openings and Header Work in Des Moines"
    description: |
      Cutting a new exterior opening—say, adding a rear French door to a 1970s
      rancher that originally had only a window there—requires a building permit
      from the City of Des Moines Building Division. The application needs a site
      plan, a floor plan showing the new opening, and a header calculation based
      on span and load. For a straightforward single-story rancher with no
      second-floor load above the new opening, plan review typically runs 2–4 weeks.
      Vladislav is a WA Licensed Contractor and handles the full permit package—
      drawings, structural notes, and inspection scheduling—for door projects
      requiring city sign-off. He's submitted permit packages to Des Moines,
      Burien, SeaTac, and Renton building departments across the 100+ projects
      TopVolk has completed since 2023. Skipping a permit on a new opening creates
      a disclosure problem at resale—King County title searches and home inspectors
      now routinely flag unpermitted structural work.

  - title: "Garage Door Replacement: R-12 Insulated Panels on PNW Ranchers"
    description: |
      Single-layer steel garage doors from the 1980s have no meaningful insulation—
      R-2 at best—and in a Des Moines home where the garage shares a wall with a
      finished room or has an air handler sitting in it, that matters year-round.
      January nights in this part of King County stay in the mid-30s, and a
      single-layer door makes the garage a cold box. Replacing with a Clopay
      Coachman or Wayne Dalton 8000 Series door—two-layer steel with injected
      polyurethane foam at R-12—cuts both heat loss and road noise from nearby
      SR-509. For a standard 16x7 double door, installed cost runs $1,800–$3,000
      depending on panel profile and insulation tier. Torsion springs on an
      original 1980s door are 40-plus years old and should be replaced at the same
      time. Adding a new Chamberlain B2405 or LiftMaster 84501 opener with myQ
      connectivity runs an additional $350–$600. Budget the full day for a double
      door replacement including spring hardware.

  - title: "Weatherstripping, Threshold Seals, and Schlage Smart Lock Retrofits"
    description: |
      Weatherstripping on doors older than 15 years is almost always flattened or
      cracked. In the 98198 zip, where marine humidity stays elevated even through
      August, door sweeps and compression seals degrade faster than they would in
      a drier climate inland. A full weatherstrip refresh on an entry door—new
      compression bulb seal on all three sides of the stop, a Pemko 315CN automatic
      door bottom replacing the original sweep, and a new aluminum threshold with
      a fresh vinyl insert—is a half-day job that runs $250–$450 in parts and
      labor. It buys another 8–12 years on an otherwise solid door. Smart lock
      integration is a natural add-on at that point: a Schlage Encode Plus deadbolt
      drops into a standard 2-1/8 inch bore without door modifications and works
      with both Apple HomeKey and Google Home. That's a 45-minute retrofit, not
      a separate service call, and it eliminates the need to rekey when tenants
      or contractors cycle through.

faq:
