      requiring permits add the city's plan review timeline on top of that. Call
      (206) 591-1096 to get on the schedule—you'll reach Vladislav directly, not
      a dispatcher or sales coordinator. TopVolk has completed 100+ projects since
      2023 across King, Snohomish, Pierce, and Kitsap counties.

  - q: "What does entry door replacement cost in Des Moines, WA?"
    a: |
      A like-for-like entry door swap in Des Moines—same rough opening, no
      structural changes—runs $1,500–$3,500 installed. A Therma-Tru Smooth-Star
      fiberglass door in a 3/0 x 6/8 opening with new threshold, weatherstripping,
      and exterior casing lands in the middle of that range. Solid wood Douglas-fir
      or mahogany doors cost more in both material and finishing time. What pushes
      the price up is discovering rot in the king stud, jack stud, or sill plate
      once the old door is pulled—common in Marine Hills and Woodmont homes from
      the 1970s. TopVolk provides a written line-item quote after the on-site visit,
      not a ballpark range over the phone. Call (206) 591-1096 to schedule a free
      on-site estimate.

  - q: "Do I need a permit for door installation in Des Moines, WA?"
    a: |
      Straight replacements—same door size, same opening, no structural changes—
      don't require a permit from the City of Des Moines Building Division under
      most circumstances. Adding a new opening, enlarging an existing one, or
      modifying the structural header does trigger a permit. The city processes
      residential permits through their online portal; structural header reviews
      for a single-story rancher typically take 2–4 weeks. Vladislav is a WA
      Licensed Contractor and handles the full permit application, drawings, and
      inspection coordination for projects that need city sign-off. Rough-in and
      final inspections are scheduled around the install sequence—homeowners
      don't need to manage that separately. Deadlines are written into the contract
      with financial penalties if TopVolk misses them.

  - q: "Can you convert a patio sliding door to French doors in a Des Moines home?"
    a: |
      Yes—it's one of the more common requests on the split-levels above Marine
      View Drive, where homeowners want to open up the rear of the house to a
      deck or backyard. The existing 6/0 x 6/8 slider rough opening almost always
      needs a new LVL beam when converting to a swinging French door, because
      the load path and lateral forces change. Vladislav evaluates the existing
      header during the on-site visit—if it's already a proper Douglas-fir or
      LVL beam at adequate depth, it often stays. Pella 150 Series and Milgard
      Tuscany are the two lines most commonly installed in this price range for
      Des Moines homes. Full conversion including structural header work, new
      door, exterior flashing, and interior and exterior trim runs $4,500–$8,000.
      A city permit is required whenever the header changes.

  - q: "What warranty applies to a newly installed door?"
    a: |
      The door unit itself carries the manufacturer's warranty—Therma-Tru offers
      a limited lifetime warranty on their fiberglass slabs against warping,
      rotting, cracking, and delaminating. Pella and Milgard carry similar
      coverage on their sliding and French door lines. Schlage Encode Plus
      deadbolts come with a lifetime mechanical and finish warranty. Hardware
      like hinges and standard handlesets is typically 1-year from the manufacturer.
      TopVolk warranties the installation workmanship separately—if the flashing
      fails, the threshold seal blows, or the door binds because of how it was
      set, that's covered. In the PNW climate, installation quality matters as
      much as the door itself: even a premium fiberglass unit installed without
      a proper sill pan will fail inside of five years.

