title: "Des Moines Drywall Installation — Mid-Century Homes, Wet Walls, ADU Firewalls"

intro: |
  Ranchers and split-levels built between 1963 and 1978 make up the majority of the housing
  stock in Marine Hills and the residential blocks just east of the Des Moines Marina — and
  nearly all of them are still wearing the same stippled ceilings and original paper-faced
  drywall they left the mill with. Five decades of Puget Sound moisture cycles have done
  predictable damage: seam lines telegraphing through paint, joint compound bubbling around
  tub surrounds, and popcorn ceilings in pre-1979 homes that require asbestos testing before
  anyone touches them. The Redondo waterfront area compounds the problem — salt-air
  condensation accelerates delamination on garage walls and utility room ceilings that were
  never designed for that kind of sustained humidity. TopVolk Construction has handled drywall
  scopes on 100+ projects since 2023 across King County, from full gut-remodels in zip code
  98198 to ADU firewall upgrades and Level 5 finish work in remodeled kitchens. Vladislav
  Volkov runs every job directly — no sales staff, no middlemen. Call (206) 591-1096 to set
  up a free on-site walkthrough.

localContext: |
  Most of Des Moines proper falls under zip code 98198, which covers the hillside
  neighborhoods above the marina down through the Redondo shoreline. The 98148 zip clips the
  northern edge near the Burien and SeaTac boundary along the Midway Strip — that corridor
  has more 1980s and 1990s construction, better structural bones but finish materials that
  have not aged well. Homes in both areas were built with 2x4 framing at 16 inches on center,
  and original drywall is typically half-inch gypsum board — sometimes only three-eighths inch
  on ceilings. That falls short of current IRC requirements in several situations: garage-to-
  living separations require 5/8-inch type-X firecode board, and wet areas require mold-
  resistant substrate, not standard paper-faced drywall. Des Moines is an incorporated city
  with its own Building Division, so permit applications go there — not to King County DPER,
  which handles only unincorporated parcels. WA HB 1337 made ADU conversions legal on most
  single-family lots statewide in 2024, and that law is driving a real volume of garage
  conversion and basement finishing work across Des Moines right now.

commonProblems:
  - title: "Popcorn Ceiling Removal and Asbestos Testing in Pre-1979 Des Moines Homes"
    description: |
      Stippled acoustic ceilings installed before 1979 frequently contain chrysotile asbestos —
      not universally, but common enough in Des Moines ranchers that bulk sampling before any
      removal is non-negotiable. A certified industrial hygienist pulls samples; lab results
      return in 2–5 business days. Material testing above 1% asbestos requires licensed
      abatement before a contractor can proceed. Below that threshold, wet-method removal with
      proper containment is handled as part of the drywall scope. After the texture is off, the
      ceiling substrate is almost never flat — original divots need filling with setting-type
      compound like Durabond 45 before any skim coat goes on. On a typical 1,200 sq ft main
      level in Marine Hills, budget $2,500–$5,500 for testing, removal, and skim coat
      depending on asbestos content and ceiling condition. TopVolk provides a line-item quote
      after a site visit — not a ballpark pulled from square footage alone.

  - title: '5/8" Type-X Firecode Drywall for Garage-to-ADU Conversions'
    description: |
      Under current IRC requirements and WA HB 1337, any wall or ceiling separating a
      converted garage from an attached living unit requires 5/8-inch type-X firecode drywall.
      Most Des Moines garages currently have half-inch standard board — which fails the fire-
      separation requirement. The City of Des Moines Building Division enforces this during ADU
      permit review, and the AHJ inspector checks compliance at both rough-in and final
      inspection. Sequence matters: frame new partitions, run MEP rough-in (mechanical,
      electrical, plumbing), then hang type-X before insulating. A standard two-car garage
      conversion in 98198 — roughly 400–500 sq ft — takes 3–5 days for the drywall phase
      alone. End-to-end, a garage-to-ADU project typically runs 4–7 months from permit
      application to final sign-off. TopVolk coordinates the full build sequence — drywall on
      a conversion is not a standalone trade call, it's tied to the permit milestone schedule.

  - title: "Mold-Resistant Drywall in Bathrooms, Basements, and Laundry Rooms"
    description: |
      Small west-facing bathrooms in Des Moines split-levels keep showing up with the same
      problem: undersized exhaust fans, minimal natural ventilation, and decades of steam have
      worked through original paper-faced drywall and into the framing behind tub surrounds.
      Standard half-inch paper-faced board has no place in a wet area — the correct substrate
      is Georgia-Pacific DensArmor Plus (purple board) or USG Sheetrock Mold Tough. In
      curbless shower builds, purple board pairs with Schluter Kerdi waterproofing membrane
      before large-format porcelain tile sets — a two-layer system with actual long-term
      performance. Basement finishing in 98198 homes often adds DriCore subfloor panels under
      the slab-adjacent framing to manage ground moisture before drywall ever goes up. A
      standard 5x8 bathroom substrate replacement — demo, purple board, Kerdi membrane — runs
      $900–$2,000 depending on shower configuration and linear feet of wet-wall exposure.

  - title: "Level 5 Finish for Kitchens and Baths With Raking or Sidewall Lighting"
    description: |
      Standard Level 4 finish — three coats of joint compound over tape, sanded flat — looks
      fine under diffuse ceiling fixtures. Add recessed cans near a wall, pendant lights over
      an island, or sconce lighting in a bath, and every trowel ridge, tape seam, and skim
      mark becomes visible. Level 5 means a full skim coat of joint compound applied over the
      entire wall surface after taping and topping — not spot-finishing high spots, not a
      heavy primer coat acting as a skim substitute. It adds roughly $0.50–$1.00 per square
      foot over Level 4 on drywall labor. A remodeled Marine Hills kitchen with 300–400 sq ft
      of wall area runs $150–$400 extra for Level 5 versus Level 4. Repainting two years
      later because the walls look terrible under new pendant lights costs more than getting
      the finish right the first time. Vladislav flags during the walkthrough which surfaces
      in your project need Level 5 and prices it as a line item.

  - title: "Soundproofing Shared Walls With Resilient Channel and QuietRock"
    description: |
      Townhomes and side-by-side duplexes along SR-99 and the Midway corridor in Des Moines
      were built with shared wall assemblies that have no acoustic treatment beyond standard
      drywall on each side of the framing. Resilient channel — a thin steel furring strip
      screwed to the studs — decouples the drywall layer from the structure, breaking the
      direct transmission path for both airborne and impact sound. Paired with QuietRock ES
      (an STC-rated gypsum panel) and mineral wool batt insulation between studs, a retrofit
      wall assembly can achieve STC 50+ — roughly the difference between hearing a clear
      conversation through the wall and hearing only a faint murmur. Labor for a resilient
      channel plus QuietRock assembly on a standard 10-foot shared wall runs $1,200–$2,500
      depending on wall height, access, and whether electrical boxes need relocating to
      accommodate the decoupled layer. Rental ADUs and home offices above garages are the
      most common use case in Des Moines right now.

faq:
  - q: "How fast can TopVolk get to Des Moines for drywall work?"
    a: |
      Des Moines sits right off SR-509 and connects to I-5 in minutes — from most King County
      job sites TopVolk regularly works, the drive runs 20–35 minutes. Parking on Marine Hills
      residential streets and the Redondo neighborhood is straightforward, no city permits
      needed. Call (206) 591-1096 and Vladislav will typically schedule a free on-site
      walkthrough within 3–5 business days. From there: line-item quote, contract, and a start
      date. Small bathroom drywall replacements can begin within a week of signing. Full
      kitchen or multi-room scopes are usually scheduled 2–4 weeks out depending on current
      project load.

  - q: "What does drywall installation cost in Des Moines, WA?"
    a: |
      Scope drives price more than raw square footage. Patching after electrical and plumbing
      rough-in — standard on whole-house remodels — runs $500–$2,000 depending on hole count
      and required finish level. A full bathroom demo and replacement with purple board plus
      Schluter Kerdi waterproofing lands $900–$2,000. Level 5 finish on a remodeled kitchen
      adds $150–$400 over Level 4. Firecode 5/8-inch type-X drywall for a garage ADU
      conversion runs $2,500–$5,000 for the drywall scope alone. TopVolk quotes line-item —
      no vague "starting at" ranges, no surprises at the final invoice. Call (206) 591-1096
      or schedule a free on-site estimate to get an actual number for your specific project.

  - q: "Does drywall work in Des Moines require a city permit?"
    a: |
      Like-for-like drywall replacement in a single room — swapping damaged board for new —
      typically does not require a permit from the City of Des Moines Building Division.
      Permits apply when drywall is part of a structural change, ADU conversion, garage fire-
      separation upgrade, or new basement finish. Des Moines runs its own permit center as an
      incorporated city; King County DPER only handles unincorporated parcels outside city
      limits. ADU plan review in Des Moines currently runs 6–10 weeks. TopVolk pulls all
      required permits as a WA Licensed Contractor and folds permit fees into the project
      quote — no surprise invoices dropped after work starts.

  - q: "What is the difference between Level 4 and Level 5 drywall finish — and do I actually need Level 5?"
    a: |
      Level 4 is three coats of joint compound over tape, feathered and sanded flat — the
      standard for most residential walls. Level 5 adds a thin skim coat over the entire
      surface after taping and topping, filling micro-texture and trowel marks that Level 4
      leaves behind. The visual difference is minor under diffuse or ceiling-mounted light, and
      significant under raking, sidewall, or low-angle natural light. Pendant lights, wall
      sconces, recessed cans near walls, and large windows will expose Level 4 imperfections
      that looked invisible before the fixtures went in. Anywhere in your project where that
      lighting is planned, Level 5 is the right call. Vladislav identifies those surfaces
      during the walkthrough and includes it as a separate line item — not buried in a lump sum.

  - q: "How long does drywall work last, and what is TopVolk's workmanship warranty?"
    a: |
      Properly installed drywall in a climate-controlled interior lasts the life of the
      structure. What fails is almost always workmanship: tape joints not feathered wide
      enough, mud applied too thick and dried too fast, or wrong board type in a wet area.
      TopVolk warrants workmanship for three years on all tape joints, finish coats, and substrate
      installation. If a seam telegraphs through paint within 12 months of completion, the fix
      is on TopVolk — no charge. Material warranties on products like USG Sheetrock Mold Tough
      and QuietRock ES are backed separately by the manufacturer. Deadline commitments are
      also written into the contract: if TopVolk misses a project milestone, financial
      penalties apply — not just an apology email.

