  - q: "What does fence installation cost per linear foot in Des Moines?"
    a: |
      Cedar privacy fence in Des Moines runs $28-45 per linear foot installed — that
      includes 4x4 PT posts, concrete footings, top and bottom rails, cedar pickets, and
      one standard walk gate. Bufftech vinyl fence (CertainTeed) runs $32-55 per linear
      foot. What pushes the number higher: sloped lot lines requiring stepped panels,
      double drive gates with heavier D&D Technologies hardware, demo and haul-off of
      existing fence material, and post depth requirements in the clay-heavy soil common
      in 98198 (30-36 inch footings vs. standard 24-inch). TopVolk estimates are
      line-item — you see exactly what drives each dollar. Free on-site estimate at
      (206) 591-1096.

  - q: "Does fence installation in Des Moines require a permit from the city?"
    a: |
      Standard 6-foot wood or vinyl privacy fence on side and rear yard lot lines in the
      City of Des Moines typically doesn't require a permit. Exceptions: corner lots with
      front yard fences over 4 feet, fences combined with retaining walls over 4 feet of
      retained height, and pool barrier fences (which require code-compliant gate hardware
      documentation). The City of Des Moines Building Department handles all residential
      permits locally — King County DPER doesn't apply here since Des Moines is
      incorporated. For retaining wall-fence combinations, plan review runs 3-6 weeks.
      TopVolk Construction is a WA Licensed Contractor and prepares permit documentation
      as part of the project scope on any job that requires it.

  - q: "Can you install a self-closing gate for a pool barrier in Des Moines?"
    a: |
      Pool barrier gates in Des Moines follow IRC pool barrier code: self-closing,
      self-latching, latch positioned out of child reach (or on the pool-side face at
      minimum 54 inches above grade). D&D Technologies TruClose hinges handle the
      self-closing requirement — they're adjustable for closing speed and tension, and
      they hold up in PNW moisture without the corrosion issues that mild-steel gravity
      hinges develop within a couple of seasons. MagnaLatch by the same manufacturer
      covers the self-latching side. Both components are listed specifically for pool
      barrier compliance. A complete hardware upgrade on an existing pool fence gate runs
      $200-350 installed. New pool barrier fence installations include code-compliant
      gate hardware as a standard line item — no upsell required.

  - q: "How long will a cedar fence last in Des Moines's wet climate?"
    a: |
      A properly installed cedar fence — 4x4 PT posts set 30 inches or deeper in
      concrete, Simpson Strong-Tie post bases to keep end grain off the footing surface,
      top and bottom rails with joist hanger-style rail brackets — will run 15-20 years
      in Des Moines's climate with periodic maintenance. The maintenance cycle: clean and
      re-stain with an oil-penetrating product like TWP 100 Series every 2-3 years.
      Skip that cycle and expect graying, checking, and splitting on the south and west
      faces by year 8. Bufftech vinyl fence has no staining requirement and won't rot,
      but it can't be refinished if the surface sustains impact damage. The material
      choice depends on budget, aesthetic, and how much ongoing maintenance the homeowner
      wants to manage over a 20-year horizon.

