title: "Des Moines Fence Installation — Posts That Hold Through Puget Sound Winters"

intro: |
  Saltwater air off Puget Sound hits Des Moines neighborhoods harder than most people
  factor into a fence budget. Marine Hills and Woodmont sit close enough to the waterfront
  that moisture cycling is relentless — cedar that holds up well in Issaquah or Sammamish
  starts gray-checking and splitting here within five or six years without annual oil-based
  stain treatment. The 98198 zip code is also directly on the SeaTac flight path, which
  means low-frequency vibration is a real variable for gate latch hardware over years of
  daily cycles. Vladislav Volkov at TopVolk Construction has run fence installations from
  the Des Moines Marina district north toward Burien, setting posts through the glacial
  clay-till soils that define this part of King County — soils that stay saturated for
  weeks after a heavy rain event and put serious side-load pressure on any post that wasn't
  set 30 inches deep or more in concrete. 100+ projects completed since 2023 across Seattle
  Metro, and fence work in this coastal zone has delivered specific lessons about what
  lasts and what doesn't.

localContext: |
  Housing in Des Moines skews toward mid-century single-family stock — much of the 98198
  zip code was developed between 1955 and 1975, with lot lines that weren't always surveyed
  to modern precision. Before a single post goes in on a shared property line, a survey pin
  locator or plat verification is worth the cost, especially on east-facing lots in North
  Des Moines where rear yard fence lines often run on a slight grade. The 98148 area near
  the northern city boundary (where Des Moines blends toward SeaTac) has similar lot
  patterns with tighter side yards — a constraint that affects gate swing clearance and
  panel stepping on narrow runs. The City of Des Moines Building Department handles fence
  permits locally; this is an incorporated city, so King County DPER doesn't apply here.
  Standard 6-foot cedar or vinyl fences on side and rear yards typically don't trigger a
  permit, but retaining wall-fence combinations — common on sloped lots off Marine View
  Drive — require engineering review and permit submittal if the retained height exceeds
  4 feet. Corner lots in Woodmont carry the additional constraint of a 4-foot front yard
  fence height limit under city code, plus sight-triangle setback requirements at
  intersections. Knowing where you stand before the post auger hits ground prevents
  expensive rework.

commonProblems:
  - title: "Cedar Posts Rotting at Grade — Marine Air and Clay Soil Accelerate the Clock"
    description: |
      Western red cedar looks clean at install, but posts set directly in concrete in
      Des Moines's wet soil develop rot at the base faster than most homeowners expect.
      Concrete wicks moisture and holds it against the end grain at the post base — and
      in a climate that sees 37-plus inches of annual rain concentrated October through
      May, that contact zone stays wet for months at a stretch. Even pressure-treated (PT)
      cedar posts show rot at the 2-3 inch below-grade mark within 10-12 years in these
      conditions. The fix is a Simpson Strong-Tie ABA post base set in a concrete footing:
      the post sits on the hardware, not in the concrete, and the base elevation keeps the
      end grain clear of standing water. On full replacement jobs using this method, with
      30-inch concrete footings and 4x4 PT posts, pricing in this area runs $25-38 per
      linear foot for a standard cedar privacy fence installed.

  - title: "Horizontal Slat Fences Racking on Sloped Lots Above Marine View Drive"
    description: |
      Horizontal slat fences are common in Des Moines — they fit the modern Pacific
      Northwest aesthetic and work well on the mid-century lots that dominate Marine Hills.
      The structural problem shows up on sloped lot lines. Horizontal rails depend entirely
      on the posts for lateral rigidity, and on west-facing yards above Marine View Drive,
      wind load off the Sound puts stress on the post-to-rail connection that standard
      1-5/8 inch rail brackets can't always carry long-term. The right approach on sloped
      runs is upsizing to 6x6 posts instead of 4x4, set 36 inches deep in concrete, and
      blocking the fence into 6-foot-wide stepped sections rather than raking the panels
      at an angle. Horizontal cedar slats also need a minimum 1/4-inch gap between boards
      for airflow — tight-packed installations trap moisture against the interior face, and
      in the humidity levels this close to Puget Sound, mildew colonizes that surface by
      year three or four.

  - title: "Permit Requirements for Retaining Wall-Fence Combos in the City of Des Moines"
    description: |
      A lot of Des Moines lots — particularly in North Des Moines and along the bluff-top
      streets in 98198 — have grade changes of 3 to 5 feet between the rear yard and the
      neighbor's grade. Combining a fence with a retaining wall to resolve that grade change
      in a single structure is a common ask, but the City of Des Moines requires a building
      permit for any retaining wall exceeding 4 feet in retained height. Add a 6-foot fence
      on top of that wall, and the effective height calculation pushes the entire structure
      into permitted territory. Plan review at the City of Des Moines Building Department
      for a residential fence-and-wall combination typically runs 3-6 weeks. TopVolk
      Construction is a WA Licensed Contractor and prepares the site plan, cross-section
      drawing, and material specs required for submittal as part of the project scope.
      Skipping the permit isn't just a code risk — it creates a title disclosure issue when
      the property sells.

  - title: "Cost Variables on Des Moines Fence Projects — What Actually Moves the Number"
    description: |
      Cedar privacy fence in the 98198 area runs roughly $28-45 per linear foot installed,
      including posts, concrete, rails, pickets, and one standard walk gate. Vinyl fence
      using Bufftech product (CertainTeed's fence line) runs $32-55 per linear foot. Slope,
      gate count, and demo of existing fence drive that spread. A flat lot with one gate
      lands at the low end. A sloped lot requiring stepped panel installation, two double
      drive gates with D&D Technologies TruClose self-closing hinges, and haul-off of old
      chain-link easily pushes to the top of the range or beyond — stepped installation
      requires a post at each step break, not just every 8 feet, which increases post count
      and concrete volume significantly. Estimates from TopVolk are line-item: post count,
      concrete yardage, gate hardware, and linear footage broken out separately. No lumped
      totals, no vague ranges. Call (206) 591-1096 to schedule the on-site walk.

  - title: "Gate Hardware Wearing Out by Year Two — The Most Common Callback in This Climate"
    description: |
      The gate is the highest-wear component on any fence system. In Des Moines's wet
      winters, mild-steel gate hinges rust and bind within 18-24 months if they weren't
      specified as galvanized or stainless at install. Gravity hinges that self-close lose
      their tension adjustment as the hinge pin corrodes and the pivot loosens. D&D
      Technologies TruClose hinges and MagnaLatch pool-gate latches are the hardware to
      spec on any gate that needs to self-close and self-latch — both are UV-stabilized
      polymer, fully adjustable, and rated for pool barrier compliance under IRC pool
      barrier code (self-closing, self-latching, latch out of child reach or minimum 54
      inches above grade on the pool side). For drive gates over 10 feet wide, a drop rod
      set into a concrete sleeve in the ground prevents the passive panel from swinging
      under lateral load. Replacing builder-grade hinges with TruClose hardware on an
      existing gate runs $150-300 per gate depending on gate size and frame condition —
      typically same-week work.

