title: "Des Moines Kitchen Remodel — Open Up a Closed-Off Ranch Kitchen"

intro: |
  Saltwater State Park borders the south end of town, and the ranch homes along Marine
  View Drive and S 216th Street were mostly built between 1965 and 1978. Those kitchens
  were sized for one cook — Whirlpool range, maybe 8 feet of laminate counter, one
  overhead fluorescent. Most of these layouts have at least one load-bearing wall
  separating the kitchen from the dining room, and removing it takes real structural work,
  not just a sledgehammer and drywall patch.

localContext: |
  The majority of homes in Des Moines zip 98198 are mid-century ranchers and split-levels,
  with some newer builds scattered closer to the waterfront. Original 100-amp panels are
  still common — not enough headroom for a modern kitchen without an electrical service
  upgrade. Crawlspace foundations here also need vapor barriers maintained year-round; the
  stretch of wet weather from October through May pushes moisture into subfloors and base
  cabinets when the crawl gets neglected.

commonProblems:
  - title: "Load-Bearing Walls Blocking Open-Concept Layouts"
    description: "In 98198 ranchers built through the late 1960s and '70s, the wall between
      kitchen and dining room is structural more often than not. Opening it up means
      installing a flush LVL beam or a PSL post to carry the transferred load — permitted
      structural work pulled through the City of Des Moines building department. Plan review
      typically runs 3-5 weeks for structural kitchen scope."
  - title: "Electrical Service Too Light for a Modern Kitchen"
    description: "A Bosch 800 Series dishwasher plus a KitchenAid double wall oven on a
      1970s 100-amp panel won't run reliably — tripped breakers, failed rough-in inspection.
      Full kitchen remodels in this housing stock usually need a 200-amp service upgrade
      before new circuits get roughed in. That's a separate permit and a utility
      coordination step. Plan it up front, not as a change order."
  - title: "Deteriorating Cabinet Boxes and Subfloor Under the Sink"
    description: "Particleboard cabinet boxes from the 1970s absorb water from decades of
      minor under-sink leaks. By the time laminate starts peeling, the box is often
      structurally shot. Replacing cabinets — IKEA, semi-custom, or full custom — requires
      checking floor joist condition first and sistering any soft spots before setting the
      new base. Skip that step and the finished cabinet install won't stay plumb."

faq:
  - q: "How fast can you get to Des Moines for a kitchen remodel consultation?"
    a: "Des Moines is about 25 minutes south of Seattle on I-5 or Pacific Highway S.
      On-site walkthroughs can usually be scheduled within a week. Call (206) 591-1096 —
      you're talking to Vladislav directly, not a scheduler or sales rep."
  - q: "What appliance brands do you typically spec for Des Moines kitchen remodels?"
    a: "Most projects at this price point land on KitchenAid or Bosch ranges and
      dishwashers, GE or Samsung refrigerators. Electrical and plumbing rough-in get sized
      to the appliance specs before cabinet install — so nothing gets shimmed in at the
      last minute or spec'd wrong for the rough-in opening."
  - q: "How long does a kitchen remodel take, and do you pull permits in Des Moines?"
    a: "A full kitchen gut-and-rebuild runs 6-10 weeks from permit issuance. City of Des
      Moines building department handles intake; plan review on structural kitchen work
      typically takes 3-5 weeks. Rough-in and final inspections get scheduled by us.
      WA Licensed Contractor. 100+ projects completed since 2017. Missed deadlines are
      penalized — written into the contract."