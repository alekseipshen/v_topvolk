title: "Des Moines Kitchen Remodel — Opening Up Ranch Homes"

intro: |
  Marine View Drive and the hillside streets east of the Des Moines Marina hold
  a lot of 1960s and 70s ramblers — the kind with 8-foot ceilings, closed galley
  kitchens, and Whirlpool appliances that have been running since the Carter
  administration.

  Pulling the wall between kitchen and dining room almost always means load-bearing
  work. That's an LVL beam, a permit through King County DPER or the City of
  Des Moines depending on your parcel, and a rough-in inspection before any drywall
  goes back up. Vladislav handles every consultation personally — call
  (206) 591-1096 to schedule a free on-site walkthrough before demo day.

localContext: |
  The 98198 zip runs from the waterfront bluff neighborhoods near Saltwater State
  Park up through the residential blocks between 216th and 240th — most of it
  built between 1960 and 1985. Original kitchens in these homes sit on 100-amp
  electrical service, which is marginal once you're running a Bosch dishwasher,
  induction range, and microwave at the same time.

  Panel upgrade to 200A is common before cabinet layout starts.

  PNW humidity also hits these older crawlspace homes hard — vapor barrier
  condition matters before you set new flooring. TopVolk is a WA Licensed
  Contractor with 100+ projects completed since 2023, and every remodel contract
  includes a deadline penalty clause so the schedule stays locked.

commonProblems:
  - title: "Load-Bearing Walls Blocking Open-Concept Layouts"
    description: |
      Ranch homes and split-levels throughout 98198 were built with interior
      load-bearing walls running perpendicular to the ridge line. Opening the
      kitchen into the dining room requires a structural assessment, an LVL beam
      sized to the actual span, and PSL post support at both ends.

      King County DPER plan review for structural kitchen work runs 4-8 weeks.

      Beam sizing isn't estimated — an engineer stamps the drawings before demo
      gets pulled. Call (206) 591-1096 for a free consultation; Vladislav walks
      the site and coordinates the engineer directly so nothing stalls at permit.
  - title: "100-Amp Panels Too Small for Modern Kitchen Appliances"
    description: |
      A KitchenAid induction range pulls 40-50 amps at load. Add a GE Profile
      refrigerator, dishwasher, and over-range microwave, and the 100A panels
      standard in homes built through the mid-1970s are already at their limit.

      Upgrading to 200A service needs a permit, a licensed electrician, and a
      PSE meter pull coordination.

      TopVolk manages the GC scope — electrical goes to a licensed sub. WA Licensed
      Contractor, 100+ projects completed since 2023. Deadline penalty clause is
      written into the contract, so the panel upgrade doesn't stall your cabinet
      install date.
  - title: "Cabinet Layout Problems in Narrow Galley Configurations"
    description: |
      Original galley kitchens in Des Moines ramblers run 7-8 feet wide — no
      island, limited counter run, and upper cabinets set too low for modern
      hood CFM clearance requirements.

      Semi-custom cabinet lines like KraftMaid offer more depth options and better
      box construction than IKEA SEKTION for this climate. Quartz countertops hold
      up better than granite here because they don't need annual sealing against
      the moisture these older crawlspaces push up.

      Schedule a free consultation at (206) 591-1096 — Vladislav measures the
      existing layout and specs the cabinet order before anything gets demoed.

