  - q: "What does power washing a home exterior cost in Des Moines?"
    a: |
      Pricing depends on what you are washing and the condition of the surfaces. A single-story 1,500–1,800 sq ft rambler soft wash of the siding runs $250–$400. Add gutters, fascia, a concrete driveway, and a cedar deck, and the full exterior package is typically $550–$850. The biggest variable is biological buildup — heavily mossy surfaces need more pre-treatment chemical and additional rinse time. Second-story access with ladder work adds to the labor side, and stucco surfaces take longer per square foot than Hardie board. TopVolk provides a free on-site estimate with exact pricing per surface — no vague ballpark ranges. Call (206) 591-1096 or schedule a free on-site consultation to get a written line-item price before anything starts.

  - q: "Do you need a permit to power wash a home in Des Moines?"
    a: |
      Power washing itself requires no permit in Des Moines or anywhere else in King County — it is a maintenance service, not a construction activity. Where permits matter is what comes next. Exterior repaints are typically permit-exempt, but if the wash is prep for siding replacement, a deck rebuild, or structural repair work, those projects require permits through the City of Des Moines permit center or King County DPER depending on exact jurisdiction. TopVolk is a WA Licensed Contractor and handles full permit coordination for any construction project that follows the wash — siding work, deck reconstruction, exterior structural repairs. Deadline commitments on those projects are written into the contract with penalty clauses, not left as verbal assurances. The wash itself? Schedule it, get it done, and move forward.

  - q: "Can you soft wash a roof without damaging shingles or cedar shakes?"
    a: |
      Roof washing is one of the most misunderstood parts of exterior cleaning in the PNW. High-pressure washing on asphalt composition roofing blasts the granules off the shingles — those granules provide UV protection and are what make the shingle shed water properly. Lose them prematurely and you have shortened the roof lifespan by years. The correct approach for asphalt roofs is downstream injection soft wash: sodium hypochlorite solution at low concentration, applied at under 100 PSI, with sufficient dwell time to kill the moss and algae at the root before rinsing. Cedar shake roofs need even lower pressure plus an oxalic acid brightener rinse to prevent darkening of the wood. Done this way, a roof wash in Des Moines holds for 3–5 years before significant regrowth. High-pressure roof blasting is not a method used here.

  - q: "How long does a power wash last in the Pacific Northwest climate?"
    a: |
      Realistically, exterior surfaces in Des Moines need attention every 2–4 years. North-facing surfaces with tree canopy overhead are closer to the 2-year mark before moss and algae are visibly back. South-facing concrete and siding can go 4–5 years between cleanings. Sealing pavers with Techniseal and staining cedar decks and fences with a penetrating oil finish like Armstrong Clark after each wash significantly extends the interval — a properly sealed surface is easier to clean next cycle because the finish prevents organic material from bonding deeply into the substrate. The PNW climate runs on its own schedule regardless of what you would prefer. Fall is the best window to wash and stain in the same season, before sustained rainfall sets in and adds months to dry time.

