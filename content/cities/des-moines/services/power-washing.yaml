title: "Des Moines Power Washing — Marina Air, Moss, and 30 Years of Grime"

intro: |
  Salt air off the Des Moines Marina drifts inland past Marine View Drive and into the Redondo Beach neighborhood, settling onto every north-facing surface in the 98198 zip — cedar deck boards, Hardie siding panels, concrete driveways, and paver walkways collect it all. By mid-winter, the green-black biofilm on a north-facing deck has been holding moisture against the wood for three solid months. That is not a cosmetic issue. Continuous moisture contact breaks down cedar fiber, and once the wood goes punky, pressure washing will not save it — you are into board replacement territory. A proper soft wash using downstream injection of sodium hypochlorite pre-treatment at the right dilution, followed by a low-pressure rinse, is the only method that kills algae at the root rather than just relocating it. Des Moines gets roughly 37 inches of rain annually, most of it between October and May, and the nearshore marine air from the Sound adds humidity even on dry days. For exterior surfaces here, cleaning is not optional maintenance — it is the prep work that keeps larger repairs from becoming necessary.

localContext: |
  The housing stock in Des Moines runs heavily toward 1960s and 1970s ramblers and split-levels, concentrated through the 98198 zip code that covers most of the city. Lots along the 98148 corridor near the Burien border skew slightly older — some homes date to the late 1940s and early 1950s — with aggregate concrete driveways that have absorbed decades of motor oil, tire rubber, and iron tannins from Douglas-fir needle drop. Those surfaces need alkaline degreaser and real dwell time before a surface cleaner attachment can pull the deep staining out. Pressure alone does not do it.

  The Redondo Beach area adds another layer of complexity. Homes on the bluff above Redondo Beach Park face Puget Sound directly, and the windward west and north exposures build up salt film and algae differently than inland blocks across the rest of the city. Cedar fencing in this area — already on a 3-to-5 year cleaning cycle under typical Des Moines conditions — often needs attention closer to the 2-year mark because of constant marine air exposure. Stucco and Hardie board on west-facing walls tend to show green streaking along horizontal seams where rainwater runs and sits through the long wet season.

commonProblems:
  - title: "Moss-Covered Cedar Decks on North-Facing Lots Near Des Moines Beach Park"
    description: |
      Cedar decking in Des Moines builds up a moss and algae layer by late November without exception. On north-facing decks under any tree canopy — common throughout the Redondo neighborhood and the hillside lots near Des Moines Beach Park — the biofilm gets thick enough by spring to feel spongy underfoot and hold moisture against the wood surface continuously. That continuous moisture contact is what drives fiber breakdown in cedar.

      Before staining or sealing, the surface needs soft washing with downstream injection of sodium hypochlorite solution at 0.5–1% dilution, followed by a low-PSI rinse that clears dead organic material without raising the wood grain. Skip pre-treatment and pressure wash alone, and you are driving algae spores into the wood rather than neutralizing them. Allow 48–72 hours of dry time before stain application — longer if temperatures stay below 50°F. A 400–600 sq ft cedar deck wash in 98198 typically runs $180–$280 depending on slope, second-story access, and degree of biological buildup.

  - title: "Oil Staining and Efflorescence on Older Concrete Driveways Throughout 98198"
    description: |
      The aggregate concrete driveways on 1960s ramblers throughout Des Moines have absorbed motor oil and brake fluid for decades. Surface-level pressure washing at 3,000 PSI moves visible dirt but does not reach oxidized oil that has penetrated a quarter inch into the concrete matrix. The right approach is Purple Power or a comparable alkaline degreaser applied with a stiff-bristle brush, left to dwell 10–15 minutes, then rinsed with a pressure unit running 2,500–3,000 PSI through a surface cleaner attachment to prevent streaking.

      Garage aprons on split-level homes also frequently show efflorescence — white mineral salt deposits that migrate up through the slab as water moves through the concrete. Those need an acid wash, not just high pressure, or they return within a season. Concrete driveway cleaning in Des Moines runs $0.15–$0.25 per square foot for a single-car-width driveway with moderate staining, or roughly $150–$300 for a typical 98198 driveway configuration.

  - title: "Hardie Siding and Stucco Cleaning Before Exterior Repaint"
    description: |
      Mid-range exterior repaints in Des Moines fail early when the substrate was not properly cleaned before primer went on. Mildew, chalky paint oxidation, and airborne dirt film create a bond-breaking layer on Hardie cement-board panels and stucco that quality primer cannot fully overcome. Hardie siding needs a soft wash — 500–800 PSI with a fan tip, working panel seam to panel seam — to avoid forcing water behind the lap joints. Stucco requires lower pressure still, with careful attention to existing hairline cracks that can channel pressurized water into the wall assembly.

      Pre-treatment with a mild sodium hypochlorite solution kills the mildew at the root, not just the visible surface staining. Done correctly, this prep step adds 5–7 years to a paint job. A siding wash plus light trim and fascia detail on a typical 1,800 sq ft Des Moines rambler runs $350–$500. TopVolk is a WA Licensed Contractor and has completed 100+ exterior prep and remodel projects across King County since 2023 — the wash is coordinated with the trade schedule, not treated as a separate afterthought.

  - title: "Paver Patio Restoration — Organic Crust and Lost Polymeric Joint Sand"
    description: |
      Concrete paver patios installed in Des Moines in the late 1990s and early 2000s are at the age where joint sand has partially washed out and the paver surface carries a visible green and black organic crust — algae, lichen patches, and moss that has fully colonized the open joints. High-pressure washing at the wrong angle makes it worse: it blasts out whatever joint sand remains and leaves the structure fully exposed to water infiltration.

      The correct method is a surface cleaner attachment at 1,800–2,200 PSI to lift organic material without disturbing joint structure, followed by re-sanding with Techniseal HP polymeric sand and proper compaction before a wet-look acrylic sealer goes down. Skip the re-sanding step and the organic material is back faster next season. Full paver restoration — wash, re-sand, seal — on a 300–500 sq ft patio in 98198 typically runs $600–$1,100 depending on paver type and the condition of the remaining joint structure.

  - title: "Cedar Fence Cleaning Before Staining — The 3-to-5 Year Des Moines Cycle"
    description: |
      Cedar fencing in Des Moines hits the gray-and-green stage between year 3 and year 5, depending on sun exposure. Fences backing a north-facing slope or sitting under Douglas-fir canopy gray faster and develop moss along the bottom rails and lower pickets first. Before applying Armstrong Clark semi-transparent oil-based stain or Defy Extreme, the surface needs to be clean and bright — gray oxidation prevents proper penetration of any oil-based finish, and you end up with peeling stain inside a year.

      A low-pressure fan wash at 800–1,200 PSI with Defy Wood Cleaner or Restore-A-Deck strips the oxidation and kills surface mildew without raising the wood grain the way a direct high-pressure stream does. Cedar fence cleaning in 98198 runs roughly $0.80–$1.50 per linear foot depending on board height, fence condition, and whether both sides require washing. For a typical 150 linear foot fence, that is $120–$225 before stain application — a reasonable investment given that proper prep is what makes the stain last the full cycle.

