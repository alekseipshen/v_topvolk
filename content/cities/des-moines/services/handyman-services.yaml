title: "Des Moines Handyman Services — Punch Lists Done Properly"

intro: |
  A dripping Moen faucet in the kitchen, two deck boards that flex underfoot
  near the railing, a bathroom niche with a grout gap that's been there since
  the last contractor left — that's a pretty typical punch list for a homeowner
  in Des Moines (98198). None of those items individually justify calling a GC
  with a $5,000 project minimum. But they don't go away on their own, and the
  list grows every October when the rains start again. The residential blocks
  around Des Moines Beach Park and along Marine View Drive are packed with solid
  1960s and 1970s split-levels that just need someone willing to work through
  the list without inventing reasons to expand the scope. Vladislav Volkov at
  TopVolk Construction — WA Licensed Contractor, 100+ projects completed since
  2023 across King County — handles exactly this kind of work directly. You call
  (206) 591-1096 and talk to the person doing the work. No sales call, no
  dispatch queue, just a straight conversation about what needs to get done.

localContext: |
  The housing stock in 98198 runs mostly from the early 1960s through the late
  1980s, with a cluster of original 1950s bungalows on the blocks nearest Des
  Moines Beach Park. Those older homes often have post-and-pier foundations,
  single-pane aluminum windows, and galvanized supply lines that were patched
  rather than replaced over the decades. The result is a mix of fixture ages
  under one roof: an original toilet from 1982 in the main bath, a Kohler
  replacement in the master, and whatever the previous owner installed in the
  guest bath. Up in the Woodmont neighborhood — which straddles the 98198 and
  98148 zip codes near the Federal Way border — the housing shifts toward 1970s
  ranchers with original builder-grade finishes. Aluminum wiring was common in
  homes permitted between 1965 and 1973 throughout that corridor, which
  complicates simple light fixture swaps. Exterior maintenance is also constant:
  the SeaTac flight path runs directly over the western side of Des Moines, so
  window and door sealing is a real priority, and north-facing surfaces collect
  moss and mildew every winter from October through April.

commonProblems:
  - title: "Punch List Backlog After a Major Remodel"
    description: |
      The blue tape walkthrough is supposed to happen before the GC walks off
      the job — but it often doesn't, or the list gets half-finished and the
      contractor moves on. What's left: a door handle not quite plumb, a gap at
      the Schluter Kerdi transition where the shower threshold meets the floor
      tile, switch plates sitting off-flush because the drywall hang ran 3mm
      thick. A single punch list day from TopVolk typically covers 10-15 items
      in 6-8 hours — installing Moen towel bars still in their packaging,
      caulking window reveals in the new bathroom, touching up paint along door
      jambs where tape pulled the finish. None of those items individually
      justify a separate contractor mobilization, but grouped into one visit
      they're efficient to knock out. Scheduling runs 5-7 business days out for
      punch list work in Des Moines. Vladislav reviews the full list with you
      before the day starts so nothing gets missed at the end.

  - title: "Drywall Patches That Don't Match the Existing Texture"
    description: |
      Texture matching in 1960s and 1970s Des Moines homes is genuinely tricky.
      Original walls were finished with hand-applied orange peel or skip trowel,
      and replicating that with a modern hopper gun takes a few test passes on
      scrap drywall before touching the actual wall. The typical scenario: a TV
      mount comes down, pulls the anchors, and leaves four bolt holes and a
      2-inch divot. The fix starts with cutting back to clean drywall, installing
      a California patch or backing block, then feathering joint compound 12
      inches out before any texture attempt. Some homes in 98198 near the beach
      have plaster over gypsum lath rather than standard 5/8-inch drywall, which
      requires a different patching compound and longer drying time between coats.
      Budget $175-$375 for a patch-and-paint area up to 2 square feet, depending
      on texture complexity. Moisture damage or repairs that require sistering a
      joist behind the wall get assessed separately at the site visit.

  - title: "Fixture Replacements That Expose Older Plumbing or Wiring"
    description: |
      Swapping a toilet or faucet in a 1970s Des Moines split-level sounds like
      a 90-minute job until corroded compression fittings on a 1.5-inch galvanized
      supply line appear behind the shutoff valve. Straight fixture-for-fixture
      swaps — a Kohler Cimarron dropping in where the original toilet sat, or a
      Moen Arbor kitchen faucet fitting the existing deck hole — typically fall
      below the permit threshold under the City of Des Moines Building Division's
      guidelines. But if the shutoff is frozen or the supply lines are original
      galvanized, those get replaced with braided stainless at the same visit.
      Light fixture swaps in homes with ungrounded two-wire circuits also need an
      assessment first — some junction boxes in Woodmont-area homes don't have a
      neutral wire present, which limits smart switch compatibility. TopVolk is a
      WA Licensed Contractor; work that crosses into permitted territory gets
      pulled and inspected properly, not skipped to keep the invoice lower.

  - title: "Deck Board Replacement and Railing Repairs on Split-Level Decks"
    description: |
      Decks on the split-levels along the ridge above Marine View Drive take
      sustained punishment from November through March — five months of near-
      continuous moisture is hard on flat-sawn pressure-treated lumber, which
      checks and cups within three to four years in this climate. Replacing
      individual boards is the right call when the rim joist and ledger board
      are still solid. The process: pull the damaged boards, check for rot at
      the joist hangers, sister any joists showing significant fiber separation,
      then install Trex Enhance or TimberTech AZEK boards with hidden clip
      fasteners. Both composite products handle the PNW freeze-thaw cycle
      without annual sealing and don't grow moss the way PT lumber does. Railing
      repairs in Des Moines often mean replacing corroded post base hardware —
      cast aluminum bases rust from the inside when water pools at the deck
      surface. Materials plus labor for a typical 8-12 board replacement runs
      $600-$1,100 depending on joist condition. Larger deck scopes get a
      separate line-item quote after the site walkthrough.

  - title: "Weatherstripping Doors and Windows for the Rain Season"
    description: |
      Foam tape weatherstripping compresses within one heating season — it's a
      short-term fix at best. The right product for an exterior door in 98198 is
      a kerf-mounted compression bulb seal in the door stop combined with an
      adjustable door sweep at the threshold. That combination handles the 37+
      inches of annual rainfall and sustained damp from October through May
      without failing in year two. Milgard windows from the 1990s and early
      2000s have replacement sash seals available through Milgard's parts
      program directly, which is often significantly cheaper than a full frame
      replacement. For older aluminum sliding windows throughout the Woodmont
      area, the original pile weatherstrip wears out and lets in both drafts and
      SeaTac flight noise — a real quality-of-life issue for homes under the
      approach path. Replacing weatherstripping on a standard exterior door takes
      about 45 minutes; a full set of 8-10 windows runs a half day. Labor plus
      materials typically falls in the $350-$550 range, and energy savings in
      this climate usually pay that back within two heating seasons.

