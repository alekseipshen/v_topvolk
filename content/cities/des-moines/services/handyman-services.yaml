  - q: "What does handyman work typically cost in Des Moines?"
    a: |
      Quoting a flat hourly rate without seeing the job is guesswork. A punch
      list day — 6-8 hours covering 10-15 items — typically runs $650-$950
      including materials for minor items like caulk, screws, and anchors.
      Individual fixture replacements (toilet, faucet, light fixture) run
      $150-$350 per fixture, including supply lines and shutoff valve replacement
      where needed. Drywall patches range $175-$450 depending on size and texture
      complexity. These ranges come from actual jobs in Des Moines, Federal Way,
      and Kent — not national cost averages. After the on-site walkthrough,
      Vladislav provides a written line-item quote so you know exactly what each
      item costs before work starts. Call (206) 591-1096 to schedule the
      walkthrough.

  - q: "Do you need permits for handyman work in Des Moines?"
    a: |
      Most handyman-scale work falls below the permit threshold under the IRC —
      fixture-for-fixture replacements, drywall repairs, weatherstripping, deck
      board swaps, and hardware installs generally don't require a permit from
      the City of Des Moines Building Division. Where it gets complicated: if we
      open a wall and find deteriorated wiring or corroded supply lines requiring
      full replacement, that crosses into permitted work territory. King County
      DPER handles review for unincorporated parcels just outside the Des Moines
      city limits, but within city boundaries, the City of Des Moines Building
      Division is the AHJ. TopVolk is a WA Licensed Contractor — when the scope
      warrants a permit, we pull it and schedule rough-in and final inspections
      properly. Project timelines are written into the contract, and penalties
      apply for missed deadlines on our end.

  - q: "Do you install smart home devices like thermostats and doorbell cameras?"
    a: |
      Smart home installs — Ecobee or Nest thermostats, Ring doorbell cameras,
      Lutron Caseta smart dimmers — are straightforward in most Des Moines homes
      built after 1985 with standard grounded circuits. The complications show up
      in older homes: 1960s and early 1970s splits often have two-wire ungrounded
      circuits without a neutral at the switch box, which limits compatible smart
      switch options. Lutron makes a no-neutral version of the Caseta dimmer
      specifically for that situation. For doorbell cameras on homes without
      existing low-voltage wiring at the front door, we run new 18/2 wire from
      the transformer — a 2-3 hour add. Smart thermostat installs average 1-1.5
      hours including C-wire assessment. These items can often be bundled into a
      punch list day to keep the trip cost efficient.

  - q: "What warranty covers your handyman work in Des Moines?"
    a: |
      Labor is warranted for 12 months on all handyman work — if a repair fails
      due to workmanship, we come back and fix it at no charge. Material
      warranties depend on the product: Trex and TimberTech composite decking
      carries a 25-year limited manufacturer warranty. Moen faucets have a
      lifetime warranty on finish and function. Kohler fixtures are typically
      1-year on parts. The PNW climate is genuinely demanding on exterior work —
      37 inches of rain annually, sustained damp October through May, moss
      regrowth on north-facing surfaces every winter. Door caulking and
      weatherstripping are maintenance items that need attention every 3-5 years
      regardless of install quality. Vladislav will tell you upfront which repairs
      are one-time fixes and which are ongoing maintenance, so there are no
      surprises two winters from now.

  - q: "Do you cover Federal Way, Burien, and other cities near Des Moines?"
    a: |
