      delivers a line-item quote — actual numbers, not a range. Call (206) 591-1096 to
      get on the schedule.

  - q: "What does attic insulation to R-49 cost in Des Moines?"
    a: |
      For a typical 98198-area rancher with 1,400–1,800 sq ft of attic floor, blown-in
      cellulose to R-49 runs $2,800–$4,500 fully installed. Larger homes or attics with
      HVAC equipment, lots of cross-blocking, or low eave clearance cost more. Homes that
      need air sealing at the top plates before the blow — which most 1960s houses require
      — add $400–$800 to that number. PSE offers insulation upgrade rebates that can
      reduce out-of-pocket cost by several hundred dollars; TopVolk handles the rebate
      documentation as part of the project scope. The on-site estimate gives you exact
      pricing. Call (206) 591-1096.

  - q: "Does insulation work in Des Moines require a building permit?"
    a: |
      Standalone insulation work — blown-in cellulose, crawl space encapsulation,
      closed-cell spray foam on rim joists — typically does not require a permit through
      the City of Des Moines permit center. It's not structural work and doesn't involve
      MEP rough-ins that trigger inspection. If the insulation scope is part of a larger
      remodel already under permit, the insulation gets rolled into that project and
      reviewed at rough-in inspection. TopVolk is a WA Licensed Contractor and handles
      all permit coordination when a permit is required. Vladislav will tell you upfront
      during the estimate whether your specific scope triggers one — and manage the
      application if it does.

  - q: "Should I use blown-in cellulose or fiberglass batt for my Des Moines attic?"
    a: |
      For retrofitting older ranchers and split-levels in Des Moines, blown-in cellulose
      is the better call in most situations. It fills irregular joist bays completely,
      reaches areas blocked by existing wiring or bridging that cut batt can't access
      cleanly, and handles moisture cycling better in a coastal climate — relevant given
      how close the Sound sits. Standard fiberglass batt from CertainTeed or Knauf works
      well in new construction with clean open bays but is harder to install properly as
      a retrofit layer over compressed original material. Rockwool mineral wool batt is a
      third option with superior fire resistance and sound attenuation — useful during
      remodels where the wall cavity is open. Vladislav explains the tradeoffs for your
      specific house during the estimate visit, not as a general pitch.

  - q: "What warranty covers the insulation work?"
    a: |
      Closed-cell spray foam systems like Lapolla or similar two-component products carry
      25-year material warranties against adhesion failure and R-value degradation. Blown-in
      cellulose products carry lifetime coverage on settling within specified tolerances.
      Vapor barrier materials — 20-mil Stego Wrap or comparable liners — come with 25-year
      product warranties from the manufacturer. On the workmanship side, TopVolk's
      installation warranty covers defects in application: if a spray-foamed rim joist
      cavity shows gaps or delamination within the warranty period, it gets corrected at
      no charge. All warranty terms go into the written contract in plain language —
      not buried in footnotes. The deadline penalty clause for missed project milestones
      is in the same document.

