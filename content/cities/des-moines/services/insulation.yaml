title: "Des Moines Insulation — Attic, Crawl Space & Rim Joist Upgrades"

intro: |
  Marine air off Puget Sound rolls into Des Moines from the west every fall, and the
  ranchers and split-levels near Marine View Drive weren't designed to handle it by
  today's energy standards. Most of the housing stock in the 98198 zip was framed
  between 1955 and 1975, when R-11 fiberglass batt in the attic floor was considered
  adequate and crawl spaces were left open to whatever ground moisture decided to do.
  Seattle Energy Code now sets the attic minimum at R-49 for remodels and additions —
  a gap that shows up immediately on utility bills. Vladislav Volkov at TopVolk
  Construction has been closing that gap on homes across Des Moines Creek and the
  Highline corridor since 2017. That means blown-in CertainTeed InsulSafe cellulose
  over compressed original batt, crawl space encapsulation with 20-mil vapor barrier,
  and closed-cell spray foam on rim joists where cold air bleeds in through the band
  board. Over 100 projects completed across King County. WA Licensed Contractor. Call
  (206) 591-1096 and you reach Vladislav directly — no sales staff involved.

localContext: |
  The 98198 zip covers the core of Des Moines from the marina bluff west to the valley
  near Des Moines Creek, and the housing patterns there predict the insulation problems
  almost exactly. Split-levels and low-slope ranchers built during the Boeing boom
  years — early 1960s through mid-70s — typically have shallow attic cavities, minimal
  floor insulation, and unconditioned crawl spaces that were never properly sealed.
  The Marine Hills neighborhood south of Kent-Des Moines Road runs dense with those
  1,400–1,800 sq ft homes, and they show up on the energy audit circuit regularly
  because of heating bills that don't match thermostat settings. The Zenith area near
  the northern border with Burien — overlapping into the 98148 zip — has similar
  stock, including some Craftsman-adjacent designs with knee wall cavities that were
  never air-sealed at the rafters. Both areas face the same crawl space moisture
  problem: the soil under these houses stays damp from October through May, heavy rain
  season runs close to 37 inches a year, and original poly sheeting from 1978 stopped
  doing its job a long time ago.

commonProblems:
  - title: "Attic Insulation Sitting at R-11 or R-19 in Older Ranchers"
    description: |
      A 1963 rancher near Zenith Road might have 3.5 inches of original fiberglass batt
      — R-11, compressed, dust-caked, partly missing where an HVAC tech crawled through
      in the 90s. Seattle Energy Code targets R-49 for attics when a permit is pulled on
      existing homes. The fix is blown-in cellulose installed over the existing layer,
      bringing total depth to 16–17 inches. CertainTeed InsulSafe SP blown cellulose is
      a common product for this — it settles to a stable R-value and fills irregular joist
      bays that cut batt can't reach cleanly. Before blowing, top plates and any bypasses
      at interior wall tops get sealed with canned foam or two-component spray foam to
      stop stack-effect air movement. A typical Des Moines rancher attic upgrade runs
      $2,800–$4,500 depending on square footage and access. PSE rebates can cut
      $300–$600 off that number — TopVolk handles the rebate paperwork as part of the job.

  - title: "Crawl Space Moisture and Failed Vapor Barriers"
    description: |
      Thin 6-mil poly sheeting stapled to the floor joists in 1972 wasn't built to last
      fifty years, and it didn't. Most crawl spaces in the Marine Hills area are showing
      visible ground moisture, rotted wood at sill plates, and mold growth on the rim joist
      blocking by the time someone picks up the phone. Proper encapsulation means pulling
      the old sheeting entirely, re-grading the crawl floor if drainage runs toward the
      foundation, and installing a 20-mil reinforced vapor barrier — something like Stego
      Wrap 20 — across the full ground plane and up the stem walls, taped and sealed at all
      seams. Two-inch polyiso rigid foam board goes on the stem walls for thermal continuity.
      Actively damp crawl spaces sometimes need a condensate-rated dehumidifier added to the
      scope. Budget for a typical Des Moines crawl encapsulation: $6,000–$11,000 depending
      on access height, square footage, and whether any sill plate or joist sistering needs
      to happen before the liner goes in.

  - title: "Rim Joist Air Leakage in 1960s Platform-Framed Homes"
    description: |
      The rim joist is the single biggest air leakage point in most mid-century
      platform-framed houses in Des Moines. It sits at the top of the foundation wall,
      exposed to outside air through the band board, and on cold November mornings you can
      sometimes feel the draft coming right up through the floor near exterior walls. Batt
      insulation stuffed into the rim joist cavity doesn't solve it — air moves through
      the batt fibers freely. Two-pound closed-cell spray foam applied directly to the
      rim joist cavity is the correct fix. Minimum 2 inches thick, ideally 3, which
      delivers roughly R-19 and functions as a combined air barrier and vapor retarder.
      On a typical 1,600 sq ft rancher foundation, rim joist spray foam runs $900–$1,800.
      TopVolk handles this as a standalone scope or folded into a larger remodel — it's
      one of the first items Vladislav flags on older Des Moines homes where the heating
      bill is climbing every year. WA Licensed Contractor, permit handled if required.

  - title: "Knee Wall Insulation in Split-Levels and 1.5-Story Homes"
    description: |
      Split-levels in the Zenith area often have angled rooflines that create knee wall
      cavities — the triangular space between the sloped roof deck and the short vertical
      wall inside the upper level. Most were never properly insulated or air-sealed at the
      rafter bays. Standard fiberglass batt gets cut and stuffed in, then falls out or
      compresses over years of temperature cycling, leaving those cavities open to
      attic-temperature air all winter. Rockwool Comfortbatt R-23 cut to fit tight between
      rafters handles the sloped section well — it doesn't sag, and it manages the moisture
      cycling that happens in coastal climates better than standard fiberglass. The knee
      wall face itself gets continuous rigid foam board plus spray foam at all edges before
      drywall goes back. Knee wall scopes on Des Moines split-levels run $1,500–$3,500
      depending on how many cavities need attention and whether existing drywall comes off
      or stays.

  - title: "Sequencing Insulation Correctly During a Full Remodel"
    description: |
      The most cost-effective time to address wall and floor insulation is when the walls
      are already open for a kitchen or bathroom remodel. Once drywall hangs, adding cavity
      insulation means either drilling small holes and blowing through them or tearing the
      board down and rehanging — both approaches add real cost. During rough-in on a remodel,
      Vladislav sequences the insulation work before drywall hang so wall cavities get
      properly filled, inspected, and closed in the right order. Rockwool mineral wool batt
      between floors handles soundproofing during remodels where the floor assembly is open;
      exterior walls get R-21 depending on framing depth. Adding insulation scope during an
      active remodel on a 1,700 sq ft Des Moines rancher costs roughly $4,000–$7,000 but
      avoids $10,000–$15,000 in remediation work if you try to retrofit it later. Project
      deadlines for each phase are written into the contract with a penalty clause if
      TopVolk misses them.

faq:
  - q: "How quickly can TopVolk get out to Des Moines for an insulation estimate?"
    a: |
      Des Moines is about 20 minutes south of downtown Seattle on I-5 — straightforward
