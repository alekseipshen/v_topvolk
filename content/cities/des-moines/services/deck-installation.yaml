title: "Des Moines Deck Installation — Puget Sound Views, Built Right"

intro: |
  Down along the waterfront near the Des Moines Marina, the yards facing Puget Sound get more wind and sustained moisture than most of King County. Composite decking — Trex and TimberTech both perform well here — outlasts cedar by years in that kind of exposure. Most homes in the 98198 zip code have the yard space for a proper deck, and a lot of them are sitting on footings poured before King County required frost-depth calculations. Vladislav Volkov is a WA Licensed Contractor with 100+ projects completed since 2017 across the south King County corridor — including multiple deck builds in Des Moines and SeaTac. Schedule a free on-site consultation at (206) 591-1096 — you'll talk directly to Vladislav, the person who will actually run your project.

localContext: |
  Des Moines residential blocks were largely built between the 1960s and early 1980s — split-levels and ranch homes run from the Pacific Highway corridor west toward the shoreline. Homes in the 98198 zip code often have existing decks where the ledger board was lag-bolted straight through the sheathing with no flashing. That's a rotting rim joist waiting to be found. The City of Des Moines Building Division handles permits here, separate from King County DPER, and ledger attachment details get scrutinized at inspection. Owner-led work means Vladislav coordinates the permit application, structural drawings, and inspection scheduling — no project manager relay, no miscommunication between a salesperson and a crew.

commonProblems:
  - title: "Composite vs. Cedar on Shoreline-Facing and Shaded Yards"
    description: "Cedar is a natural choice in the Pacific Northwest, but moss colonizes it fast on north-facing decks — Des Moines gets heavy rain from October through May. Trex and TimberTech composite boards don't absorb moisture and hold their surface color significantly longer. The structural framing underneath still needs pressure-treated Douglas-fir; composite is surface only, not structural. Call (206) 591-1096 to talk through material choices with Vladislav directly — no sales staff, just the contractor. WA Licensed Contractor, 100+ projects completed since 2017."

  - title: "Ledger-to-Rim-Joist Attachment and Rot in 1970s Split-Levels"
    description: "On homes from this era, the typical failure is water intrusion behind the ledger board. Without proper through-flashing, moisture tracks into the rim joist and rots it from inside before anything shows on the deck surface. The City of Des Moines requires a ledger flashing inspection as part of deck permitting — we use Simpson Strong-Tie LUS joist hangers and code-compliant through-flashing at every ledger connection. Deadline dates go into the contract with a written penalty clause if we miss them — that commitment is in writing, not a verbal promise."

  - title: "Post Footing Depth and Ground-Contact PT Lumber Selection"
    description: "King County's frost line sits around 12 inches, but footings need to bear on undisturbed soil — not fill, not topsoil. Ground-contact posts require minimum UC4B pressure-treated lumber, selected based on each post's direct soil exposure. Getting footing depth wrong means seasonal movement, which eventually shows up as guardrail posts that fail the 200-lb lateral load test required under IRC. Schedule a free site visit at (206) 591-1096 before the project gets to that stage — catching footing issues in design is far cheaper than after the pour."

faq:
