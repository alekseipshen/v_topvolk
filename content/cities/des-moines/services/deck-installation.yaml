title: "Des Moines Deck Installation — Built for Puget Sound Weather"

intro: |
  Westward-facing lots in Marine Hills and along Woodmont get weather straight off Puget Sound from October through April — that's the relevant fact when you're choosing deck materials. Most homeowners near the Des Moines Marina ask about cedar vs. composite before anything else. Trex and TimberTech both perform well here; cedar doesn't — it grays in six months, grows moss on north-facing boards by year two, and needs sealing every spring. Vladislav does the estimate himself, no sales staff, no estimates via email.

localContext: |
  Most residential stock in the 98198 zip dates from the late 1960s and 1970s — single-story ranchers with rim joists that weren't engineered for deck attachment. That's important because lagging a ledger board into 50-year-old Douglas-fir framing without proper through-flashing means water enters the band joist cavity and rots from the inside. Houses near Des Moines Beach Park also tend to run concrete slab entries rather than raised foundations, which changes the structural design entirely — some projects work better as freestanding decks than ledger-attached ones.

commonProblems:
  - title: "Ledger Attachment and Flashing Failures on 1970s Ranchers"
    description: |
      Older 98198 homes weren't built with future deck loads in mind. The rim joist might be 2x6 Douglas-fir — adequate for floor loads, borderline for a cantilevered ledger carrying live weight. Without Vycor flashing or metal Z-flashing installed before the ledger board goes up, water wicks behind the connection, rots the rim joist, and eventually works into the subfloor system. King County building inspectors specifically verify ledger flashing at rough-in inspection — and rightfully so.
  - title: "Post Footings Not Reaching Frost Depth"
    description: |
      Des Moines doesn't freeze as hard as North Bend or Enumclaw, but IRC still requires footings at 12–18 inches below grade to reach stable soil. DIY decks from the 1990s — and some contractor-built ones — used undersized tube footings that heave over time. A TimberTech Azek composite surface on top of an unlevel post-and-beam system means gapped boards, standing water pooling between planks, and accelerated fastener failure at the post caps.
  - title: "Guardrail Height and Stair Code Compliance on Raised Decks"
    description: |
      Any deck more than 30 inches above grade requires 36-inch guardrails minimum per IRC — the City of Des Moines building department enforces this consistently. Stair stringers also need to meet rise/run requirements: max 7-3/4 inch rise, 10-inch minimum run, with a graspable handrail on at least one side. Getting these details wrong means a failed final inspection, reconstruction cost, and delay. Permits are required for decks over 200 sq ft or elevated above 30 inches — plan review runs 3–6 weeks through the city's own building department (not King County DPER, since Des Moines is incorporated).

