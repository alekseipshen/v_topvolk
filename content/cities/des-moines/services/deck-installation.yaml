    a: "Des Moines is about 20 minutes south of Seattle via I-5. The 98198 zip code is a regular service area for us. Call (206) 591-1096 — you'll reach Vladislav directly, not a scheduling service — and we'll get a site visit on the calendar. Direct communication with the owner from first call through punch list."

  - q: "What deck materials hold up best near the Des Moines waterfront?"
    a: "For shoreline-adjacent lots with north-facing exposure or heavy tree cover, Trex or TimberTech composite is the practical call. Cedar weathers faster in sustained moisture and needs annual maintenance. All structural members — ledger, posts, beams — get PT lumber rated for their specific ground-contact exposure. The deadline penalty clause in the contract applies to material delivery coordination too — we don't pad timelines to protect ourselves."

  - q: "What does the permit process look like for a deck in Des Moines, and how long does a project take?"
    a: "The City of Des Moines handles its own building permits — plan review on a standard attached deck typically runs 3-6 weeks. Construction on a 300-400 sq ft deck takes 2-3 weeks once permits are in hand. Vladislav manages the application, structural drawings, and inspection coordination. WA Licensed Contractor, 100+ projects completed since 2017. Deadline dates go into the contract with a written penalty clause if we miss them. Schedule a free on-site consultation at (206) 591-1096 — Vladislav will walk your yard, review your existing footings, and give you a line-item quote, not a vague range."