  - q: "Cedar or composite — what do Des Moines homeowners usually go with?"
    a: |
      Composite wins about 70% of the time here. Trex Transcend and TimberTech Azek both carry 25-year fade/stain warranties and don't need annual sealing. Cedar looks good at install and grays fast — moss colonizes north-facing boards by year two in Puget Sound humidity. Mid-range composite costs more upfront but eliminates the maintenance cycle entirely.
