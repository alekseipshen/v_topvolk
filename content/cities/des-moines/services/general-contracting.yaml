title: "Des Moines General Contracting — King County Permit Work"

intro: |
  Marine View Drive runs along the Puget Sound bluff through zip 98198, and the homes on both sides were mostly built between 1960 and 1978. Solid construction then — less so now, when a full kitchen gut reveals galvanized plumbing under every sink and aluminum wiring running to half the receptacles. That kind of project doesn't get coordinated through a single call to a plumber. It takes a licensed general contractor managing MEP rough-in, permit timelines, and subcontractor sequencing from start to final inspection. Vladislav Volkov has completed 100+ projects across King County since 2023.

localContext: |
  Most of the residential stock in 98198 sits between Pacific Highway S and the waterfront, with homes concentrated in the 1960–1975 range. Crawlspace vapor barriers in this zip fail regularly — soil moisture near Puget Sound, combined with houses that weren't built with modern drainage membranes, means floor joists that look fine from above are showing rot once you open the subfloor. Homes near Des Moines Beach Park on the south end of the city also tend to have settled foundations — gradual soil movement shows up as out-of-square door frames and cracked drywall along load-bearing walls.

commonProblems:
  - title: "Structural Surprises After Demo Starts"
    description: "Pull the drywall in a 1960s Des Moines rancher and you'll often find a notched LVL beam that someone ran a plumbing chase through — or sister joists toenailed in during a previous repair and never properly blocked. These discoveries require a permit amendment with the City of Des Moines building department and a re-scheduled framing inspection, which can push your timeline 2–3 weeks on first hit."
  - title: "Multi-Trade Scheduling Without a GC on Point"
    description: "MEP rough-in coordination is where owner-managed remodels fall apart. Electricians can't pull wire until framing passes inspection. HVAC duct can't be set until electrical rough-in is cleared. Plumbing and mechanical run their own inspection windows. Without a general contractor managing the sequence, trades show up out of order — and in King County, rescheduling a missed inspection can burn a week or more each time it happens."
  - title: "Appliance-Driven Water Damage Found Mid-Project"
    description: "In older Des Moines homes, a leaking Bosch dishwasher or LG refrigerator supply line can soak a subfloor for years before anyone notices. Once the kitchen comes out, the scope is obvious: rotted rim joist, soft DriCore subfloor, sometimes framing that needs full sistering. None of that gets caught during a walkthrough done by a salesperson instead of the contractor who'll actually run the job."

faq:
  - q: "How fast can you get to Des Moines for a consultation?"
    a: "Des Moines is about 20 minutes south of Seattle on I-5 — straightforward drive past SeaTac. Call (206) 591-1096 and Vladislav will set the on-site visit directly. No sales rep involved, no pre-screening call."
  - q: "What appliance brands do you typically spec in Des Moines kitchen remodels?"
    a: "For mid-range kitchens in the 98198 zip, Bosch dishwashers, KitchenAid ranges, and LG refrigerators come up most often. We coordinate appliance delivery timing so rough-in isn't waiting on a back-ordered unit before cabinet panels can go in."
  - q: "How long does a full remodel take in Des Moines, and what permits are required?"
    a: "A full kitchen and bath remodel runs 6–10 weeks of active construction after the City of Des Moines issues permits — plan review alone takes 3–6 weeks for major structural work. WA Licensed Contractor on file. Deadline penalties written into the contract. Call (206) 591-1096 for a real project timeline, not a ballpark range."