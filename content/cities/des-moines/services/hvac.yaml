title: "Des Moines HVAC — Heat Pumps, Mini-Splits & Duct Sealing"

intro: |
  Marine air pushes inland from the Des Moines Marina almost every evening, keeping
  humidity elevated through October and into May. That sustained moisture is hard on
  older HVAC equipment — especially the gas furnaces still running in the mid-century
  split-levels around North Hill and the ranchers off 216th Street SW. A lot of those
  systems are 20-plus years old, with heat exchangers cracked from years of thermal
  cycling and heat strips drawing far more electricity than a modern Mitsubishi
  Hyper-Heat would. The Inflation Reduction Act changed the math on upgrading:
  households at the median Des Moines income level qualify for up to $2,000 in federal
  25C tax credits on qualifying heat pump installations, which makes the conversation
  very different than it was three years ago. If you're near Redondo Beach and haven't
  had your ductwork inspected in a decade, that's where to start. Call (206) 591-1096
  — TopVolk has completed 100+ projects across King County since 2017.

localContext: |
  Des Moines splits into two distinct housing eras. Zip code 98198 covers the bulk of
  the city — hillside neighborhoods east of Pacific Highway S hold a lot of 1960s and
  early-1970s construction: one-story ranchers and bi-levels with original gravity-fed
  ductwork or register layouts that were never balanced. The Redondo neighborhood down
  near the waterfront has some of the oldest stock, including homes on post-and-pier
  foundations where crawlspace moisture has been degrading insulation off supply ducts
  for years. The northern edge near 98148 transitions into 1980s and 1990s builder-grade
  systems — functional but inefficient, often with oversized furnaces that short-cycle and
  leave rooms uncomfortable. Des Moines sits within its own permit jurisdiction, not King
  County DPER, so HVAC work involving refrigerant line sets, new combustion appliances,
  or ductwork modifications above minor access requires a mechanical permit from the Des
  Moines Building Division. Plan review on mechanical permits here typically takes two to
  three weeks.

commonProblems:
  - title: "Gas Furnace to Heat Pump Conversion with IRA Tax Credits"
    description: |
      Many of the 1960s-era homes in Des Moines still run natural gas furnaces — some
      original equipment, some first-generation replacements from the late 1980s.
      Converting to a cold-climate heat pump, like the Mitsubishi Hyper-Heat MXZ series
      or Bosch IDS Premium, qualifies for the federal 25C tax credit of up to $2,000 per
      year, stacked on top of Puget Sound Energy rebates of $800–$1,200 depending on
      equipment tier. Proper sizing is critical: an undersized unit struggles below 25°F,
      and while Des Moines rarely sees hard freezes, weeks of marine air holding in the
      mid-30s will expose that gap fast. Refrigerant line set routing, a new 240V circuit,
      and decommissioning the old gas line all add scope. Budget $8,000–$14,000 installed
      for a ducted heat pump conversion on existing forced-air — more if the electrical
      panel needs a service upgrade to handle the new load.

  - title: "Ductless Mini-Split Installation for ADUs and Converted Spaces"
    description: |
      WA HB 1337, effective 2024, lets most Des Moines homeowners add up to two ADUs on a
      single-family lot. A detached ADU in the backyard almost never ties into the main
      home's duct system, so a ductless mini-split is the standard solution. Mitsubishi
      MXZ multi-zone systems and Daikin Aurora series both handle the PNW's damp, mild
      climate well. A single-zone wall-mounted unit for a 600-square-foot DADU typically
      runs $3,500–$5,500 installed, depending on refrigerant line set length and whether
      a new 240V circuit is needed at the panel. The City of Des Moines requires a
      mechanical permit for mini-split installation — plan review takes about two weeks.
      Outdoor compressor placement also matters: set it too close to the property line and
      it can violate setback requirements, and a low-drainage spot will produce a frozen
      condensate line every December.

  - title: "Ductwork Leaks and Chronically Imbalanced Airflow in 1960s–70s Homes"
    description: |
      Original ductwork in most Des Moines ranchers and split-levels wasn't sealed at the
      joints — just snapped together with sheet metal screws and fiberglass duct tape that
      has since turned to powder. Homes like these typically lose 25–40% of conditioned
      air into the crawlspace before it ever reaches a register. The fix involves sealing
      joints with mastic compound (not tape), insulating runs through unconditioned spaces,
      and balancing the system by adjusting dampers or resizing return-air grilles. In
      Des Moines crawlspaces, vapor barrier condition matters too — a failing poly sheet
      drives humidity up and accelerates duct liner deterioration. Static pressure testing
      identifies restrictions before we cut into anything. A full duct sealing and
      rebalance on a typical 1,800-square-foot home takes four to eight labor hours plus
      materials. TopVolk pulls the required City of Des Moines mechanical permit for any
      work above minor access panels.

  - title: "High-Efficiency Furnace Replacement: 95%+ AFUE and Sidewall Venting"
    description: |
      Replacing a furnace in Des Moines isn't just swapping one box for another. A 95%+
      AFUE condensing furnace vents through PVC pipe to an exterior sidewall rather than
      up through a masonry flue — which makes every old B-vent and chimney tile the
      original furnace used obsolete. In older Redondo-area homes with brick chimneys,
      the flue decommissions cleanly, but the new PVC penetration requires planning and
      sometimes HOA notification. Budget $4,500–$7,500 for a high-efficiency furnace
      replacement including new sidewall venting and a Nest or ecobee thermostat with
      compatible wiring. Bosch, Carrier, and Lennox all make 96–98% AFUE units that
      qualify for Puget Sound Energy rebates. The City of Des Moines mechanical permit is
      required for any combustion appliance replacement — TopVolk handles the permit pull
      and all inspection scheduling as a WA Licensed Contractor, so that task drops
      entirely off your plate.

  - title: "Smart Thermostat Compatibility and Zone Damper Upgrades in Older Systems"
    description: |
      A Nest Thermostat or ecobee SmartThermostat can cut heating bills noticeably in
      Des Moines homes, but compatibility depends on existing wiring. Older two-wire
      heating systems — common in 1960s and early 1970s homes — don't carry the C-wire
      that modern smart thermostats require for continuous power. Options include running
      new thermostat wire, adding a C-wire adapter at the air handler, or using the
      ecobee's built-in power extender kit. Homes with both a heat pump and a gas furnace
      need a dual-fuel thermostat that switches between equipment based on outdoor
      temperature — typically configured at 35–38°F for this climate. Adding zone dampers
      to an existing forced-air system runs $1,500–$3,500 depending on zone count and
      ductwork accessibility. Doing it during the same visit as a duct sealing job saves
      opening the system twice and cuts overall labor cost.

faq:
  - q: "How fast can you get to Des Moines for HVAC work?"
    a: |
      Des Moines is a short drive — I-5 south to Pacific Highway S puts us in 98198 in
      under 30 minutes from most King County project sites. Residential streets here are
      easy parking; no commercial vehicle permit needed for a service truck. A first
      on-site consultation usually happens within a week of the initial call. Once scope
      is agreed on and the City of Des Moines Building Division has issued the mechanical
      permit, installation runs one to three days for a mini-split or three to five days
      for a full furnace or heat pump replacement with ductwork modifications. Call
      (206) 591-1096 to reach Vladislav directly — 100+ projects completed across King
      County since 2017, and you're talking to the person who will actually be on site.

  - q: "What does HVAC replacement or installation cost in Des Moines?"
    a: |
      Cost by job type: a single-zone ductless mini-split runs $3,500–$5,500 installed.
      A high-efficiency gas furnace replacement at 95%+ AFUE is typically $4,500–$7,500.
      A full ducted heat pump conversion from an existing gas system runs $8,000–$14,000
      — more if the electrical panel needs upgrading to support the new load. Those numbers
      shift based on refrigerant line set length, whether existing ductwork can handle
      the new static pressure load, and how much PSE rebate coordination is involved.
      Quotes are written and line-itemized after the on-site visit — no vague ranges,
      no surprise add-ons at install. Deadline commitments are written into the contract
      with penalties for misses. Schedule the free estimate by calling (206) 591-1096.

  - q: "Does HVAC work in Des Moines require a city permit?"
    a: |
      Yes. Des Moines runs its own Building Division, separate from King County DPER, so
      mechanical permits come from the city directly. Any work involving refrigerant line
      sets, new combustion appliances, or ductwork penetrations triggers a permit
      requirement under the Seattle Energy Code and IRC mechanical chapters. A rough-in
      inspection occurs during installation; the final inspection closes the permit after
      the system is commissioned and tested. Plan review typically takes two to three weeks.
      TopVolk pulls every required permit as a WA Licensed Contractor and schedules all
      inspections — you won't be chasing the permit office yourself. Unpermitted HVAC work
      complicates resale disclosure and can void manufacturer warranties on equipment like
      Mitsubishi and Bosch units.

  - q: "Can you help with Puget Sound Energy rebates on heat pump installations?"
    a: |
      PSE currently offers rebates of $800–$1,200 on qualifying ducted heat pumps and up
      to $600 on ductless mini-splits, with amounts tied to equipment AHRI efficiency
      ratings and program availability at installation time. The federal 25C tax credit
      stacks on top — up to $2,000 per tax year for qualifying heat pump equipment. We
      document the AHRI certification numbers and provide the equipment spec sheets PSE
      requires for rebate submission. Mitsubishi Hyper-Heat and Bosch IDS Premium units
      we commonly install both qualify under current PSE efficiency tiers. Call
      (206) 591-1096 if you want a quote that already accounts for expected rebates and
      tax credit eligibility — the net cost after incentives changes the payback period
      considerably on a full heat pump conversion.

  - q: "How long will a new heat pump or furnace last in the Des Moines climate?"
    a: |
      A properly installed heat pump in Des Moines's marine climate — mild winters,
      year-round humidity, and heavy rainfall from October through April — typically runs
      15–20 years with annual maintenance. The outdoor condenser unit takes the most wear:
      algae on coil fins, debris from overhanging moss-covered trees, and defrost cycle
      stress during extended cold stretches all compound when maintenance is skipped.
      Mitsubishi and Bosch both offer 12-year compressor warranties on qualifying
      installations, requiring registration within 60–90 days. High-efficiency condensing
      furnaces generally last 20–25 years. Annual service should include coil cleaning,
      refrigerant pressure check, and heat exchanger inspection — usually $150–$250 for
      a service call. Skip that a few times and a cracked heat exchanger will remind you
      what deferred maintenance actually costs.

  - q: "What other South King County cities do you serve near Des Moines?"
    a: |
      South King County is regular work territory — Burien, SeaTac, Tukwila, Renton, and
      Kent are all close to Des Moines and scheduled on the same window. Federal Way and
      Auburn sit just to the south. For larger HVAC and remodel projects, TopVolk also
      works regularly in Bellevue, Kirkland, and across Snohomish County. Scheduling
      typically runs one to two weeks out for on-site estimates and two to four weeks for
      installation, though November through February is the busiest window for furnace
      replacements and heat pump conversions — plan ahead if you want the work done before
      the next heating season locks in. Reach Vladislav directly at (206) 591-1096 to
      set up the free on-site visit.