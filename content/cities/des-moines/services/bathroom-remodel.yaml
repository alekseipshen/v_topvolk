title: "Des Moines Bathroom Remodel — Strip the 70s Out of Your Puget Sound Rancher"

intro: |
  Marine View Drive cuts along the Puget Sound bluffs through the heart of 98198 — and most of the houses set back from that road went up between 1960 and 1980. Builder-grade bathrooms, 4x4 ceramic wall tile, original Moen single-handle valves. Forty years of Pacific Northwest shower steam with no proper vapor barrier has done what you'd expect. Grout lines gone black. Subfloor soft under the tub. Most of what Vladislav finds on first walkthroughs isn't cosmetic.

localContext: |
  Des Moines sits between Burien and Federal Way along Puget Sound — zip 98198. The Redondo neighborhood and the residential blocks around Kent-Des Moines Road are packed with 1960s-70s ranchers and split-levels: cast-iron drain stacks, galvanized supply lines in the older ones, and post-and-pier foundations that flex with seasonal moisture. Permits for bathroom remodels run through the City of Des Moines Building Division — not Seattle SDCI or King County DPER — with plan review typically taking 3-6 weeks for permitted scope.

commonProblems:
  - title: "Waterproofing Failure Behind Original Tub Surrounds"
    description: "Forty years of shower steam with no proper vapor barrier works its way behind fiberglass surrounds and original 4x4 ceramic tile. What looks like a grout problem is often wet framing and rotted subfloor underneath. Schluter Kerdi membrane or RedGard liquid waterproofing applied during a full tear-out is the correct fix — not recaulking over the damage."
  - title: "Cast-Iron Drain Stack Limitations in 1960s-70s Ranchers"
    description: "Moving a toilet or shifting the shower drain in these houses means cutting into a cast-iron drain stack running through the floor framing. Requires rough-in replumbing, new blocking, and a permit. City of Des Moines Building Division requires rough-in inspection before walls close — skip the permit and you're forced to demo walls again at resale."
  - title: "Walk-In Shower Conversions in 50-Square-Foot Original Bathrooms"
    description: "Curbless shower conversions in older ranchers require dropping the shower pan below the existing subfloor — cutting joists and pitching a Schluter Kerdi-Drain or linear drain properly to code. In houses with solid lumber floor framing, sister joists or an LVL beam carrier may be needed to maintain structural integrity after the cuts."

faq:
  - q: "How fast can you get to Des Moines for Bathroom Remodel?"
    a: "Des Moines is about 25 minutes from Seattle via I-5 — easy access from most of the South King County service area. Vladislav does free on-site walkthroughs, not sales calls. Parking is easy in most residential blocks here. Call (206) 591-1096 to schedule."
  - q: "What bathroom fixture brands do you work with in Des Moines homes?"
    a: "Moen and Kohler are in most of these houses — faucets, shower valves, tub spouts. Toto toilets show up in recent installs. For vanity hardware, Delta is another common find. We source and install what fits the scope and the budget through local supply houses."
  - q: "What does a bathroom remodel cost in Des Moines, and how long does it take?"
    a: "Full gut-and-redo in a 98198 rancher typically runs $18,000–$35,000 — tile, fixtures, vanity, shower conversion, permits. Timeline: 4-6 weeks once permits clear. City of Des Moines plan review adds 3-6 weeks upfront. WA Licensed Contractor, 100+ projects completed since 2023. Deadline penalties are written into every TopVolk contract."