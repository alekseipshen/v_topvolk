title: "Des Moines Garage Construction — Permits, Slabs, ADU Options"

intro: |
  Saltwater air off Des Moines Marina accelerates rust on exposed fasteners
  and pushes moisture into every unsealed wood joint — which is exactly why
  carport-era homes spread through Zenith and Marine Hills are finally getting
  enclosed, properly framed garages built. A lot of the ranchers in this
  corridor went up between 1958 and 1972 without any enclosed garage at all:
  just a single-car carport open to the prevailing southwest wind off Puget
  Sound. That worked for a Buick in 1968. It doesn't work for a pickup, a
  pressure washer, and a workbench in 2025. TopVolk Construction LLC has built
  detached garages throughout the 98198 zip code — concrete slab, engineered
  framing, insulated overhead door, permit pulled through the City of Des Moines
  Development Services. Vladislav Volkov handles every estimate personally.
  You're talking to the contractor who will actually pull the permit and
  coordinate inspections, not a sales rep handing off to a crew. Call
  (206) 591-1096 to schedule a free on-site visit.

localContext: |
  The housing stock in Des Moines runs heavily toward mid-century single-family —
  1,100 to 1,600 square-foot ranchers and split-levels built between 1955 and
  1975, concentrated in the 98198 zip code. Properties near the SR-99 corridor
  at the city's northern edge, approaching the Burien boundary, occasionally
  appear in the 98148 coverage zone, though the bulk of Des Moines residential
  sits squarely in 98198. Woodmont on the south end skews slightly newer —
  1970s and 1980s construction — while North Hill carries older stock where
  original carports and cramped single-car garages remain. Lot sizes here are
  modest, typically 6,000 to 8,000 square feet, which means FAR (Floor Area
  Ratio) and setback compliance under the City of Des Moines Development
  Services needs to be confirmed before any design work starts. Under WA HB 1337
  (2024), up to two ADUs are now allowed per single-family lot statewide —
  making a two-car detached garage with a living unit above a practical option
  for homeowners who want rental income without a full addition.

commonProblems:
  - title: "Building a DADU Above a New Detached Garage Under WA HB 1337"
    description: |
      WA HB 1337 (2024) removed most of the land-use barriers to Detached ADUs
      in Washington, including in Des Moines. A new two-car garage with a
      400–600 square-foot living unit above is now approvable without a
      discretionary hearing in most RS zones — but the structure still has to
      meet setback minimums (typically 5 feet from side property lines), height
      limits (24 feet max for a DADU), and lot coverage caps. The framing load
      changes substantially for a two-story structure: LVL beams replace
      standard dimensional lumber at the ridge and over the garage door opening,
      and engineered joist hangers carry the floor load of the unit above. City
      of Des Moines plan review for a garage-plus-ADU package runs 6–10 weeks.
      Budget $90,000–$165,000 for a complete garage shell plus finished DADU,
      including a Mitsubishi mini-split for the upper unit, depending on finish
      level and site conditions.

  - title: "Concrete Slab Specs That Actually Hold Up in PNW Conditions"
    description: |
      A garage slab in Des Moines has to handle seasonal moisture wicking up
      from below and occasional freeze events during shoulder-season cold snaps.
      Standard spec is a 4-inch minimum fiber-reinforced concrete slab over a
      4-inch compacted gravel base, with a 6-mil poly vapor barrier sandwiched
      between the gravel and concrete. Skipping the vapor barrier is the most
      common shortcut on budget builds. Within two years the slab sweats
      seasonally, and anything stored directly on it grows mold underneath. For
      a dedicated workshop, a 5-inch slab with #4 rebar grid is worth the cost
      premium. Control joints cut every 8–10 feet prevent random cracking as
      the slab cures and settles. A standard two-car slab (20x22 feet) runs
      $4,500–$7,500 depending on site prep, existing grade, and fill required.
      Sloped lots add excavation cost.

  - title: "Setback and Permit Requirements Through City of Des Moines Development Services"
    description: |
      Des Moines is an incorporated city with its own building department —
      permits go through City of Des Moines Development Services, not King
      County DPER (which handles unincorporated county parcels). New detached
      garages need a building permit, and setback compliance is enforced:
      typically 5 feet from a side property line, 20 feet from the front
      setback, and 5–10 feet from the rear depending on alley access. On a
      7,000-square-foot lot in North Hill or Woodmont, those numbers can
      meaningfully constrain the footprint. Lot coverage limits in RS zones
      typically cap total structure coverage at 40–45% of lot area. Vladislav
      submits as WA Licensed Contractor, prepares the site plan, handles the
      plan review cycle, and coordinates the required rough-in inspection and
      final inspection. Total permit-to-completion timeline for a single-story
      detached garage runs 10–16 weeks from application to final sign-off.
      Deadline commitments are written into the contract — if TopVolk misses
      the agreed schedule, there are financial penalties.

  - title: "Matching New Garage Siding and Roofline to the Existing House"
    description: |
      A new garage that doesn't match the house reads like a storage shed
      dropped in the yard. Most 1960s ranchers in Des Moines are clad in
      original wood lap siding — cedar or Douglas-fir — painted over multiple
      times. New construction uses Hardie cement-board lap siding, which holds
      up against the October-through-May wet season without rotting or checking
      at the paint seam. Hardie comes pre-primed and can be painted to closely
      match existing wood lap profiles. The roofline pitch should mirror the
      house: if the main structure is 4:12 with composition shingles, the
      garage follows suit. Adding a small front gable or accent dormer over the
      main entry door adds a few hundred dollars in framing but reads
      significantly better from the street. This finish work happens after the
      rough-in inspection clears and before the final inspection.

  - title: "Pre-Wiring for EV Charging During New Garage Construction"
    description: |
      Adding a Level 2 EV charger circuit is straightforward during a new
      garage build and expensive to retrofit later. Running a dedicated 50A or
      60A circuit from the main panel to the garage — typically 40 to 80 feet
      of conduit depending on panel location — adds $800–$1,400 to the
      electrical scope when done during construction. Doing it after the garage
      is finished means cutting drywall, possibly trenching under a driveway,
      and pulling a separate electrical permit. For households with two
      vehicles, rough-in two conduits from the start: the second run costs
      almost nothing in conduit during the build but $2,000+ to add later.
      Bosch Level 2 wall connectors and ChargePoint Home Flex units both mount
      cleanly on a stud wall and handle 48A continuous draw. The EV circuit is
      inspected as part of the main building permit's electrical rough-in —
      no separate permit needed when it's scoped into the same job.

