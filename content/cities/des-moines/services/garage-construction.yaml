  - q: "What does a new detached garage cost in Des Moines?"
    a: |
      A single-car detached garage (12x20 feet, basic finish, standard slab)
      in Des Moines runs $28,000–$45,000 depending on site conditions and
      finishes. A two-car garage (22x24 feet) with an insulated overhead door,
      basic electrical, and Hardie siding typically lands $55,000–$85,000.
      Add a DADU above and the total range jumps to $130,000–$180,000 for a
      complete shell-plus-finished-unit package. Lot slope, soil conditions,
      and distance from the main electrical panel all move the number.
      TopVolk provides line-item quotes with actual material and labor costs
      — no vague allowances that inflate later. The free on-site estimate
      with Vladislav includes a preliminary cost breakdown before any
      commitment is made. Call (206) 591-1096 to schedule.

  - q: "Do I need a permit for a new garage in Des Moines, and how does the process work?"
    a: |
      Yes — any new garage structure in Des Moines requires a building permit
      through City of Des Moines Development Services. Vladislav submits as
      WA Licensed Contractor with a full package: site plan showing setbacks
      and lot coverage, structural drawings, and electrical scope. Plan review
      runs 4–8 weeks for a single-story garage, 6–10 weeks if a DADU is
      included. Two inspections are required during construction: a rough-in
      inspection covering framing, electrical rough-in, and slab prep, and a
      final inspection after all work is complete. For parcels near the
      unincorporated King County DPER boundary, Vladislav confirms which AHJ
      (Authority Having Jurisdiction) controls your specific parcel before
      submitting — that detail gets overlooked by contractors unfamiliar
      with the area.

  - q: "Can you insulate and set up a garage for year-round workshop use?"
    a: |
      Yes — and the time to spec it properly is during initial construction,
      not after the drywall is up. Standard workshop build includes R-21 batts
      in 2x6 exterior walls, R-38 in the ceiling assembly, and a vapor barrier
      on the interior face of the framing before drywall hang. For heating
      and cooling, a Mitsubishi 18,000 BTU mini-split mounts high on the wall,
      keeps the floor plan clear, and runs efficiently through Des Moines
      winters when temperatures drop into the mid-30s from November through
      February. Insulated garage doors — 2-inch polyurethane core — make a
      real difference in heat retention. A properly insulated two-car workshop
      garage stays workable year-round without running the heat constantly,
      even through the sustained rain-and-cold stretches that hit King County
      every winter.

  - q: "What warranty does TopVolk provide on garage construction work?"
    a: |
      Workmanship is covered for one year from the final inspection sign-off —
      if something leaks, shifts, or fails due to installation error, it gets
      corrected at no charge. Materials carry manufacturer warranties: Hardie
      cement-board siding has a 30-year limited warranty against rot and
      fiber-cement failure; engineered LVL lumber carries a manufacturer
      structural warranty; insulated overhead door panels typically warranty
      3–10 years depending on brand and grade, with lifetime coverage on the
      spring system. Before final payment, Vladislav walks the project with
      the homeowner — blue tape walkthrough — and any punch list items are
      completed before the job closes. Deadline commitments are in the
      contract: if the agreed finish date is missed without a documented
      reason, TopVolk pays a financial penalty.

