title: "Des Moines Home Additions — Built for Ranch & Split-Level Homes"

intro: |
  Ranch houses and split-levels line the streets off Marine View Drive in the 98198
  zip — most built between 1955 and 1975, most never touched structurally since
  original construction. Homeowners near Des Moines Beach Park are adding square
  footage now: master suites, DADUs in the backyard, second stories over crawlspace
  foundations that were never engineered for the load. TopVolk Construction LLC has
  completed 100+ projects since 2017 across King County, and Vladislav Volkov runs
  every job himself — you talk to him directly, not a sales rep. On additions where
  exterior siding needs to match original cedar profile, we spec HardiePlank
  cement-board that holds paint through 37 inches of annual PNW rainfall without
  the rot and checking you get on raw cedar after five wet winters. Call
  (206) 591-1096 to schedule a walkthrough of your property. We serve all of Des
  Moines, from the waterfront near Des Moines Marina out to the SR 99 corridor
  and beyond.

localContext: |
  The 98198 zip covers most of Des Moines — the hillside neighborhoods above the
  marina, the flatter blocks near Kent-Des Moines Road, and the older stock along
  Pacific Highway South. Up at the northern edge, 98148 bleeds into the Burien
  overlap, where post-war cottages from the 1940s and early 1950s sit on narrow
  lots with perimeter concrete foundations and no interior footings worth
  mentioning. Both zoning areas fall under City of Des Moines permitting — not
  King County DPER, not Seattle SDCI. The City of Des Moines building department
  handles plan review locally, and additions or ADUs typically run 6–10 weeks
  through plan review before a permit issues. RS zoning is standard throughout most
  of the city, with 5-foot side and rear setbacks common, FAR limits that cap total
  floor area relative to lot size, and lot coverage maximums that determine how much
  ground a new DADU or addition footprint can occupy. Vapor barrier installation
  under crawlspace additions is non-negotiable here — groundwater intrusion and soil
  moisture in the Puget Sound lowlands will rot rim joists and subfloor sheathing
  within a decade if you skip it. R-49 ceiling insulation is required under the WA
  Energy Code for new conditioned space.

commonProblems:
  - title: "Building a DADU in Des Moines Under WA HB 1337"
    description: |
      Washington HB 1337, effective 2024, allows up to two accessory dwelling units
      on any single-family lot statewide — which means Des Moines homeowners in
      98198 and 98148 can now add a detached DADU in the backyard without the old
      one-ADU-per-lot restriction. That does not make the process simple. The City
      of Des Moines still requires a full permit package: engineered site plan
      showing setbacks from all property lines, lot coverage calculation proving you
      stay under the zoning maximum, and structural drawings for the DADU itself.
      Plan review runs 6–10 weeks. DADUs in Des Moines are capped at 24 feet in
      height, and a separate utility connection — water, sewer, electrical —
      typically adds $18K–$30K to the budget depending on distance from the main
      line. Total DADU construction cost in this market runs $180K–$280K for a
      finished, permitted unit. TopVolk handles the full permit package from first
      submittal through final inspection.

  - title: "Adding a Second Story to a 1960s Rancher on a Crawlspace Foundation"
    description: |
      Most ranch homes in the 98198 zip have perimeter concrete foundations with
      interior posts carrying a center beam — enough for a single story, not
      engineered for two. Before any second-story addition moves forward, a
      structural engineer evaluates the existing foundation, floor framing, and
      bearing wall layout. What usually comes out of that evaluation: continuous
      footings need to be extended or poured new under load points, floor joists
      need sistering to handle the added dead and live load, blocking needs to be
      installed between joists at bearing walls, and LVL beams or PSL posts need
      to replace older dimensional lumber carrying critical loads. That structural
      scope runs $15K–$35K before a single piece of second-floor framing goes up.
      It also adds 3–6 weeks to the schedule. Rough-in inspection for MEP in the
      new floor system has to happen before subfloor goes down. Vladislav walks
      every crawlspace himself before quoting — no structural surprises after you
      sign.

  - title: "Converting a Split-Level Lower Floor Into a Mother-in-Law Suite"
    description: |
      Split-levels in Des Moines are well-suited to AADU conversion — the lower
      floor is already partially below grade, often has a separate exterior entrance
      on the downhill side, and sits 4–5 feet below the main living level, giving
      enough headroom once you account for mechanical clearance. The IRC requires a
      full kitchen to qualify as a separate dwelling unit: minimum sink, cooking
      appliance, and refrigerator space, plus dedicated circuits. Plumbing rough-in
      for a new kitchen and bathroom in a lower level that was never plumbed runs
      $4K–$7K depending on distance to the main stack. Moen or Kohler fixtures
      are standard on TopVolk builds — not builder-grade imports. A Mitsubishi
      mini-split handles heating and cooling for the suite independently so the
      occupant controls their own comfort without sharing the main system. Full
      AADU conversion including MEP coordination, egress windows, and finish work
      runs $80K–$140K. TopVolk is a WA Licensed Contractor and pulls every permit
      for this scope.

  - title: "Matching 1960s Siding When You Add Square Footage to an Older Des Moines Home"
    description: |
      Original cedar siding on 1960s Des Moines homes is often a 5/8-inch bevel
      profile that has not been a standard mill offering for decades. Sourcing
      matching cedar to blend an addition into the existing house means either
      custom milling — which runs $4–$7 per linear foot before installation — or
      accepting a visible transition line where old and new siding meet. Most
      homeowners choose to re-side the entire structure in HardiePlank cement-board
      instead. Hardie carries a 30-year finish warranty and does not absorb moisture
      the way wood does on north-facing walls where moss starts within 3–4 years
      in the PNW. Installed cost for HardiePlank in this market runs $12–$18 per
      square foot depending on profile and paint specification. Pre-priming all cut
      ends of millwork trim before installation adds maybe $200 to labor and saves
      the rot call in year seven. With 37 inches of annual rainfall in the Des
      Moines area, the math on cedar versus fiber-cement is not close.

  - title: "Running HVAC to a New Addition When the 1960s Ductwork Is Already Undersized"
    description: |
      The original forced-air systems in 1960s Des Moines homes typically run
      6-inch trunk lines off a single air handler — sized for the original
      footprint, already borderline for current load. Extending that ductwork to
      a new addition or second story usually means either upsizing the main trunk,
      adding a second air handler, or abandoning the duct extension entirely and
      going with a Mitsubishi mini-split for the new zone. A Mitsubishi outdoor
      condenser with one or two indoor heads for a 400–600 sq ft addition costs
      $5K–$9K installed, qualifies for Puget Sound Energy rebates of $500–$2K
      depending on unit size and current program terms, and does not require tearing
      into finished ceilings to run new ductwork. MEP rough-in — including
      refrigerant line routing and the electrical circuit for the outdoor unit —
      happens before drywall hang. Getting that sequencing right matters: drywall
      hang and tape cannot start until rough-in inspection is signed off.

faq:
  - q: "How fast can TopVolk get to Des Moines for a home addition consultation?"
    a: |
      From TopVolk's base in King County, Des Moines is 20–35 minutes depending
      on whether we come down I-5 or cut over to SR 99 and Marine View Drive —
      both routes are in regular rotation for job sites. Consultations are with
      Vladislav directly, no scheduling layer in between. He walks the property,
      looks at the existing structure, and talks through what the permit process
      actually looks like for your specific lot and zoning. City of Des Moines
      plan review runs 6–10 weeks for additions and ADUs, so construction typically
      starts 2–3 months after permit submittal depending on drawing completion.
      Call (206) 591-1096 to set up a time.

  - q: "What does a home addition cost in Des Moines, WA?"
    a: |
      Attached additions in Des Moines run $200–$320 per square foot for permitted,
      finished construction. A 400 sq ft master suite addition lands in the
      $80K–$130K range depending on foundation conditions, bathroom fixtures, and
      whether structural upgrades are needed. A full detached DADU runs
      $180K–$280K. What moves the number: how much foundation work the existing
      structure needs, whether the electrical service can handle the added load,
      fixture selections like KitchenAid appliances versus builder-grade, and
      structural scope discovered after the crawlspace evaluation. TopVolk provides
      a line-item quote — not a vague per-square-foot range with no specifics.
      Call (206) 591-1096 for a property walkthrough before any numbers are
      discussed.

  - q: "Does Des Moines require permits for home additions, and how long does review take?"
    a: |
      Yes — all additions and ADUs in Des Moines go through the City of Des Moines
      building department. Not King County DPER. Not Seattle SDCI. The City handles
      plan review locally, and the timeline for additions and ADU projects runs
      6–10 weeks from complete submittal to permit issuance. A complete submittal
      means engineered architectural drawings, a site plan showing setbacks and lot
      coverage, and compliance documentation for the WA Energy Code including R-49
      ceiling insulation in new conditioned space. TopVolk is a WA Licensed
      Contractor and manages the full permit package — first submittal, responses
      to correction notices, and scheduling both rough-in inspection and final
      inspection with the City.

  - q: "Can you add a second story to my 1960s rancher in Des Moines?"
    a: |
      Yes, but it requires a structural evaluation first. Ranchers in the 98198 zip
      were built on perimeter foundations with interior posts — not continuous
      footings under all bearing lines. A structural engineer determines whether
      existing footings can carry two-story loads, and the answer usually involves
      pouring new continuous footings at bearing walls, sistering floor joists, and
      installing LVL beams at critical spans. That foundation and structural upgrade
      scope runs $15K–$40K depending on what the crawlspace shows. Full
      second-story additions in Des Moines — framing, MEP, insulation, siding,
      finish — run $250K–$400K and up. Vladislav goes into the crawlspace before
      any quote is issued.

  - q: "How does TopVolk handle project deadlines on additions?"
    a: |
      A deadline penalty is written into every TopVolk contract. If a milestone is
      missed without documented cause — weather delay, owner-requested change,
      permit delay outside our control — TopVolk pays a financial penalty to the
      homeowner. That is not a verbal promise; it is a contract term. The bid is
      also line-item from the start, not a low number designed to get you signed
      and then built back up through change orders. Vladislav runs the job directly
      — he is the one accountable to the penalty clause, which is why he is also
      the one managing the schedule day to day. Call (206) 591-1096 to go through
      the contract structure before you commit to anything.

  - q: "Do you serve Burien, Federal Way, Normandy Park, and SeaTac near Des Moines?"
    a: |
      All of those are in regular rotation. TopVolk serves King, Snohomish, Pierce,
      and Kitsap counties — the 98148 zip covering the Burien and northern Des
      Moines overlap is a frequent work area for ADU and addition projects on the
      older post-war housing stock there. Federal Way in the 98003 zip and Renton
      in 98055 are both active service areas. Normandy Park and SeaTac are a short
      drive from Des Moines and fall well within the service footprint. Scheduling
      for an initial consultation typically runs 1–2 weeks out. Call (206) 591-1096
      — Vladislav responds directly, no office staff between you and the contractor.