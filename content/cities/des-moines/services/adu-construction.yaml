title: "Des Moines ADU Construction — Marina District Lots Built Right"

intro: |
  The boats at Des Moines Marina have looked the same for decades. The neighborhood behind them — climbing up the hillside on Marine View Drive and fanning out toward Kent-Des Moines Road — is changing fast. Homeowners on those 1960s lots are discovering that Washington's updated ADU rules make a second unit financially realistic, and the math gets even better when rental demand is strong and you own land that's already paid off. A Mitsubishi mini-split, a proper vapor barrier, and framing that accounts for PNW rain loads are not optional details on a west-slope build — they're the difference between a 30-year asset and a repair bill. TopVolk Construction LLC has been building additions, ADUs, and remodels across King County since 2017, more than 100 projects in, and owner Vladislav Volkov still answers the phone directly. No sales staff. No middleman.

localContext: |
  The bulk of Des Moines' housing stock went up between 1955 and 1975 — ranchers, split-levels, and a scattering of post-and-pier homes near Des Moines Beach Park that sit on older foundations not designed with a second structure in mind. Most parcels fall under zip code 98198, which covers the entire city footprint, but properties along the eastern edge near the Kent border sometimes reference 98032 for utility infrastructure and corridor planning purposes. The sloped lots between Saltwater State Park and Marine View Drive present real structural challenges: slab-on-grade mid-century construction, limited rear yard depth, and setbacks that shrink your buildable area fast. Permits for any ADU in Des Moines go through the city's own Community Development department — not King County DPER, not Seattle SDCI. That distinction matters, because Des Moines has its own review timelines, fee schedules, and inspector relationships that a contractor who only works Seattle permits will be learning on your dime.

commonProblems:
  - title: "Choosing Between a DADU, AADU, or Basement Conversion on a Des Moines Lot"
    description: "Lot coverage limits in Des Moines run 40–50% depending on your zone, and a detached ADU (DADU) adds footprint that eats into that number fast. FAR calculations stack on top of that, so a seemingly spacious backyard can close out quickly once you account for setbacks — typically 5 feet on the sides and rear for a DADU — and the 24-foot height limit for detached structures. An attached ADU (AADU) or basement conversion sidesteps the footprint problem but introduces its own structural work, especially in split-levels where floor elevations complicate ceiling height compliance. Vladislav reviews the parcel data and survey before the first site visit, so the conversation starts with actual numbers rather than ballpark guesses. Finished DADUs in Des Moines typically run $220K–$300K; basement and attached conversions come in at $80K–$140K depending on existing conditions. Getting that decision right early keeps the project on budget."
  - title: "Utility Separation on Older Des Moines Properties"
    description: "A 1965 rancher in Des Moines was plumbed and wired for one household. Adding a DADU with its own kitchen and bath means the city's AHJ will require a review of whether the existing water and sewer service can carry the added load — and in many cases, a separate lateral from the street is the only path to a clean certificate of occupancy. Sub-panel installation for the ADU is standard; the question is whether the main panel has capacity or needs an upgrade first, which affects cost and permitting scope. City right-of-way permits for trench work add another layer. Utility separation on these older lots typically runs $15K–$35K depending on distance from the main, soil conditions, and whether the sewer line needs lining before the city will approve a new connection. Rough-in inspection happens before walls close, so coordination with the inspector happens early. Vladislav handles that scheduling directly."
  - title: "Navigating the Des Moines Community Development Permit Process"
    description: "Plan review at Des Moines Community Development runs 6–10 weeks for a DADU submittal. WA HB 1337, which took effect in 2024, limits how much discretion cities can exercise in blocking ADU applications — no arbitrary design standards, no owner-occupancy requirements as a condition of approval. That matters because it removes several delay tactics that slowed projects under older local codes. The permit package TopVolk prepares includes engineered drawings with LVL beam specifications at header locations and PSL post sizing for load-bearing points — details the plan reviewer needs to sign off without a correction cycle. As a WA Licensed Contractor, Vladislav coordinates all inspections directly with the city, including framing, MEP coordination sign-offs, and final. Homeowners don't need to manage that process themselves. Getting the package right the first time is the only thing that keeps the 6–10 week clock from restarting."
  - title: "Real Cost Breakdown for an ADU in Des Moines"
    description: "Numbers matter more than ranges, so here's how it actually breaks down. A finished detached ADU in Des Moines — foundation through final inspection — runs $220K–$300K depending on square footage, slope conditions, and finish level. Basement conversions and attached ADUs come in at $80K–$140K because the foundation and envelope are already there. Mechanicals are a real cost center: a Navien tankless water heater runs roughly $3K–$4K installed, and appliances — Bosch or GE depending on space and budget — add another $3K–$6K for a functional kitchen setup. Every TopVolk project is quoted with line-item pricing so you can see exactly where the money goes. On the return side, one-bedroom ADUs in Des Moines are renting at $1,400–$1,800 per month right now. At that rate, a $140K attached conversion can reach payback inside 8–10 years before any appreciation."
  - title: "PNW Moisture and Building Envelope Details That Matter in Des Moines"
    description: "Des Moines gets roughly 37 inches of rain per year, mostly October through May, and north-facing roof planes and walls near the beach park accumulate moss and mildew faster than homeowners expect. Hardie fiber-cement siding handles that environment better than wood or vinyl — James Hardie's 30-year warranty on the product is real, but it requires correct installation with proper flashing and a ventilated rainscreen gap. Vapor barrier detailing at the slab edge and rim joist is non-negotiable on west-slope lots where ground moisture wicks upward through mid-century slab-on-grade construction. PT lumber at all ground-contact points, Douglas-fir framing throughout, and Schluter Kerdi membrane in the shower assembly round out an envelope built for this climate. A Mitsubishi mini-split handles heating and cooling efficiently without ductwork in a compact ADU footprint. Blue tape walkthrough and punch list happen before any final payment, so every detail gets addressed on record."

faq:
  - q: "How fast can TopVolk get to Des Moines for an ADU consultation?"
    a: "Des Moines is roughly 20 miles south of Seattle via I-5, and Vladislav schedules initial site visits within 1–2 weeks of first contact for most Des Moines addresses. The person who shows up is the contractor who will run the project — not a salesperson handing off to a crew you've never met. Deadline commitments are written into the contract with penalty provisions, so the schedule you agree to is one TopVolk is financially accountable to keep. Call (206) 591-1096 to set up a visit."
  - q: "What does ADU construction cost in Des Moines, WA?"
    a: "A detached ADU (DADU) in Des Moines runs $220K–$300K finished, depending on square footage, foundation conditions, and slope. Attached ADUs and basement conversions come in lower — typically $80K–$140K — because the existing structure handles foundation and envelope costs. What drives the variance is usually the utility work (water, sewer, electrical service) and whether the existing lot and foundation require significant prep. TopVolk provides a free on-site estimate with line-item pricing after reviewing the parcel and walking the property. Call (206) 591-1096 to schedule."
  - q: "What permits are required for an ADU in Des Moines, and how long does it take?"
    a: "All ADU permits in Des Moines go through the city's Community Development department — not King County DPER and not Seattle SDCI. Plan review typically runs 6–10 weeks for a DADU submittal. WA HB 1337 limits the city's ability to impose discretionary barriers, which streamlines the process compared to what was possible under older local codes. TopVolk is a WA Licensed Contractor and prepares the full permit package including engineered structural drawings, MEP coordination documents, and site plans. Total timeline from permit submission to final inspection typically runs 5–7 months. Vladislav coordinates all inspection scheduling directly with the city."
  - q: "Can I rent out my Des Moines ADU immediately after construction?"
    a: "Yes. Under WA HB 1337, cities cannot require owner-occupancy as a condition of building or renting an ADU. Once the city issues a certificate of occupancy and address assignment, the unit is legal to rent. A separate utility meter for the ADU simplifies tenant billing and avoids disputes over shared utility costs — Des Moines allows this with a standard utility separation permit. One-bedroom ADUs in the area are currently renting at $1,400–$1,800 per month, which makes the return on a basement conversion particularly strong."
  - q: "What warranty does a TopVolk-built ADU carry?"
    a: "Washington state requires a one-year workmanship warranty from licensed contractors on residential construction, and TopVolk meets that baseline on every project. Beyond that, the materials carry their own manufacturer warranties: James Hardie siding comes with a 30-year transferable warranty, Navien tankless water heaters carry a 15-year heat exchanger warranty, and Mitsubishi mini-split systems include a 12-year compressor warranty when registered. Those long-tail warranties only hold up if the installation and building envelope details are correct — which is exactly why vapor barrier, flashing, and blocking details matter on every Des Moines build."
  - q: "Does TopVolk cover cities near Des Moines for ADU construction?"
    a: "TopVolk serves the full South King County corridor and beyond — Burien, SeaTac, Renton, Kent (98032), Federal Way, and Tukwila are all regular service areas, along with Snohomish, Pierce, and Kitsap counties. Each city has its own permit department and review process, and that local knowledge matters when you're preparing a DADU submittal. Scheduling for new projects currently runs 2–3 weeks out from first contact. TopVolk has completed more than 100 projects since 2017 across this region. Call (206) 591-1096 to talk through your address and timeline."