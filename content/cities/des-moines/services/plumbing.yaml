title: "Des Moines Plumbing — Pipe Replacement & Water Heater Upgrades"

intro: |
  City water pressure in Des Moines runs high in parts of the lower waterfront blocks —
  particularly along Marine View Drive and the streets dropping toward the marina. Above
  80 psi, supply lines take a beating, fixture stems wear faster, and water heaters work
  harder than they need to. A pressure regulator valve solves that before it turns into
  a repair bill. Most of the mid-century ranch homes in Marine Hills, built between the
  late 1950s and early 1970s, are still running original galvanized supply lines — and
  those lines don't move water the way they once did. Corrosion builds from the inside
  out, restricts flow, and eventually starts weeping at the fittings. Repiping with
  PEX-A or Type L copper is the permanent fix. TopVolk Construction LLC has handled that
  scope across Des Moines and the broader King County area since 2017 — 100+ projects
  completed, WA Licensed Contractor, and Vladislav does every estimate in person.

localContext: |
  The bulk of Des Moines's older housing sits in zip code 98198, concentrated in the
  Marine Hills and Redondo Beach areas west of Pacific Highway South. Homes there
  typically date from the 1955-1975 build period — crawlspace construction in most
  cases, concrete slab in a smaller share. Crawlspace homes are where vapor barrier
  failures show up first; moisture under the house accelerates corrosion on older
  galvanized drain lines faster than most owners expect. The 98148 zip on Des Moines's
  northern edge — closer to the Burien boundary — has a similar housing profile, plus
  a pocket of 1980s construction that brought polybutylene supply lines. That's the
  gray plastic pipe installed in builder-grade homes from roughly 1978 to 1995 and
  since linked to fitting failures with no warning signs. Des Moines gets about 37
  inches of rain annually. From October through May that moisture finds every unsealed
  penetration and every compromised fitting. Crawlspace humidity in winter pushes
  condensation onto uninsulated supply lines, accelerating corrosion at solder joints
  on copper work done before the mid-1980s.

commonProblems:
  - title: "Galvanized Supply Lines Cutting Flow in Pre-1975 Marine Hills Homes"
    description: "Steel galvanized pipe oxidizes from the inside — mineral deposits and rust
      slowly narrow the bore until a half-inch line flows like a three-eighths-inch line.
      In Marine Hills homes from the 1960s, the symptom shows up first at the shower:
      pressure drops when someone runs the dishwasher. The fix is a full repipe — PEX-A
      (Uponor or Viega brand) or Type L copper throughout, with new shutoff valves at
      every fixture location. PEX-A is the practical choice for most Des Moines crawlspace
      homes because it handles freeze-thaw movement and bends without fittings in tight
      spaces under the floor. A full repipe on a 1,400-square-foot ranch typically runs
      $6,000-$11,000 depending on crawlspace accessibility and fixture count. The City
      of Des Moines requires a plumbing permit for repipe work, with a rough-in
      inspection before insulation and a final inspection before walls close."

  - title: "Polybutylene Pipe Failures in 1980s Pacific Highway South Corridor Homes"
    description: "Gray polybutylene supply lines — installed in builder-grade homes across
      the Pacific Highway South corridor in the 1980s and early 1990s — fail at the
      acetal plastic fittings, not the pipe body itself. Chlorine in municipal water
      degrades the plastic over time, causing micro-fractures that eventually let go
      without warning. In Des Moines's 98198 zip, we've rerouted entire supply systems
      in homes where an insurance adjuster had already been through once. Replacement
      material is PEX-B or copper; PEX runs faster in confined crawlspaces and doesn't
      require soldering. Full polybutylene replacement on a three-bedroom Des Moines
      home typically lands between $4,500 and $9,000. Some homeowners insurance policies
      still cover poly failures under specific conditions — worth a call to your carrier
      before scheduling the work."

  - title: "Tankless Water Heater Conversion Requiring Gas Line Upsize"
    description: "Switching from a 40-gallon tank to a Rinnai RU199iN or Navien NPE-240A2
      isn't a straight swap — those units pull up to 199,000 BTU/h at full demand. Most
      existing three-quarter-inch gas lines in 1960s-1970s Des Moines homes are sized
      for 60,000-80,000 BTU/h. The gas line needs to be upsized, typically from
      three-quarter-inch to one-inch black iron from the meter to the unit location.
      Budget accordingly: the tankless unit itself ($900-$1,500 for a mid-tier Rinnai
      or Navien), gas line extension ($400-$900), plus flue and venting changes if
      moving from an atmospheric-vent tank to a direct-vent condensing unit. The City of
      Des Moines requires a mechanical permit for this scope, and WA residential code
      mandates seismic strapping on all new water heater installations — tank or
      tankless. Call (206) 591-1096 to get an on-site look at your existing gas service
      before committing to a unit size."

  - title: "Drain Line Rerouting for Kitchen Islands and Basement Bathrooms"
    description: "Adding a sink to a kitchen island or finishing a basement bathroom in a
      Des Moines home means tapping into the existing drain-waste-vent system — and in
      a slab-foundation home, that means concrete cutting. Island drains need to connect
      to a branch below the slab or use a pump-assisted ejector system; Zoeller and
      Liberty Pumps both make the standard residential units used for this application.
      Basement bathrooms below the municipal sewer exit point require an ejector pit.
      Venting is the other variable — an improperly vented drain runs slow and gurgles
      at the trap. Depending on the configuration, either wet-wall venting or a properly
      sized air admittance valve satisfies code. Drain rerouting for a basement bath
      addition typically adds $1,800-$4,500 to the rough plumbing budget, depending on
      whether slab cutting is required and how far the new run is from the main stack."

  - title: "Pressure Regulator Valve Installation on High-PSI City Water Service"
    description: "In lower-elevation Des Moines — the streets stepping down toward the
      waterfront from the Marine Hills plateau — static water pressure can exceed 90 psi.
      Above 80 psi, WA residential plumbing code following IRC section P2903.3.1 requires
      a pressure-reducing valve (PRV) at the service entry. Without it, washing machine
      hoses blow, toilet fill valves fail early, and Moen or Kohler cartridges wear out
      in two to three years instead of ten. A Watts 25AUB or Zurn Wilkins 70XL PRV
      installed at the service entry runs $350-$550 complete, and it pays for itself in
      avoided fixture replacements within a few years. Homes built in the 1990s that
      already have a PRV should have it tested — they're rated for roughly 150,000
      cycles, but chlorinated water degrades the seat over time. Swapping an aging PRV
      runs $280-$420 depending on pipe size and access."

faq:
  - q: "How fast can TopVolk get to Des Moines for a plumbing estimate?"
    a: "Des Moines is easy to reach from our King County base — I-5 south to the
      Kent-Des Moines Road exit, or SR-99 straight down through Burien. Most scheduling
      lands within three to five business days for an on-site estimate. Parking is
      straightforward in Marine Hills and the Redondo Beach residential streets. Vladislav
      brings a crawlspace light for homes where the supply lines aren't visible from the
      utility room — which is most of the 1960s-era homes in this area. The estimate is
      free, done in person, and you get a line-item quote before any commitment. Call
      (206) 591-1096 to set something up."

  - q: "What does repiping a Des Moines home cost?"
    a: "A full repipe on a 1,200-1,600 square foot Des Moines home — swapping galvanized
      or polybutylene supply lines for PEX-A — typically runs $5,500-$10,500. Crawlspace
      clearance, number of bathrooms, and whether the water heater location changes all
      move the number. Slab-foundation homes cost more because access requires more wall
      and floor work. The quote includes City of Des Moines plumbing permit fees,
      rough-in inspection coordination, and final sign-off scheduling. No surprise line
      items after the contract is signed — that's a written commitment, not a talking
      point. Call (206) 591-1096 to schedule a free on-site estimate."

  - q: "Do I need a permit for a water heater replacement in Des Moines?"
    a: "Yes. The City of Des Moines requires a mechanical or plumbing permit for water
      heater replacement, and WA residential code mandates seismic strapping on every
      new installation — tank or tankless. Permits here go through the City of Des Moines
      Community Development department, not King County DPER (Des Moines is an
      incorporated city with its own building department). A straightforward tank swap
      typically clears permit review in five to ten business days. Tankless conversions
      with gas line work take longer because of the broader mechanical scope. TopVolk is
      a WA Licensed Contractor and handles the permit application, inspection scheduling,
      and final sign-off as part of the project — you don't need to manage that process."

  - q: "Can you reroute drain lines for a kitchen island or new bathroom addition?"
    a: "Yes, and it's something we scope carefully before quoting. Island sink drains and
      basement bath additions often require either tapping into an existing drain stack
      or installing an ejector system — a Zoeller M53 or Liberty Pumps unit for
      bathrooms that sit below the sewer exit elevation. During the estimate we map the
      existing drain-waste-vent layout, confirm whether air admittance valves are
      code-compliant in the specific application, and build the complete scope into the
      contract before any demo starts. Drain rerouting adds $1,800-$4,500 to a kitchen
      or basement project depending on slab conditions, run length, and venting
      configuration."

  - q: "How long does a PEX repipe last compared to the galvanized lines being replaced?"
    a: "Galvanized steel pipe has a practical service life of 40-70 years before internal
      corrosion significantly restricts flow — most 1960s homes in Des Moines have
      already passed that threshold. PEX-A from Uponor or Viega carries a 25-year
      manufacturer warranty and is generally rated for 50-plus years in residential
      service. It handles chlorinated water better than copper in high-chlorine supply
      systems and doesn't pit in the acidic water conditions that affect some older
      Seattle-area wells. The brass fittings and shutoff valves are the parts to watch
      long-term — Watts and Apollo brass are the standard spec. TopVolk warrants labor
      for two years and coordinates manufacturer warranty registration on pipe and
      fittings at project close."

  - q: "Do you cover Federal Way and Burien alongside Des Moines?"
    a: "Both are part of the regular King County service zone. Federal Way (98003, 98023),
      Burien (98146, 98166), SeaTac (98188), and Kent all fall within normal scheduling
      range from Des Moines. Smaller scope work — water heater replacement, PRV
      installation, fixture rough-in — typically gets scheduled within one to two weeks
      of contract signing. Larger repipe or drain rerouting projects get a detailed
      schedule tied to the permit timeline from the relevant jurisdiction. Call
      (206) 591-1096 or request a consultation online — Vladislav handles the estimate
      directly, no sales staff involved."