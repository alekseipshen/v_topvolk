title: "Des Moines Window Installation — SeaTac Noise & PNW Rain"

intro: |
  SeaTac Airport's flight path runs directly over the western neighborhoods of Des Moines — and if
  you live anywhere between the marina district and Saltwater State Park, you already know what that
  means for single-pane or aging double-pane windows. The sound bleeds through. Milgard's Quiet Line
  series can push STC ratings into the 35-38 range, which cuts aircraft noise meaningfully — but
  getting those windows installed correctly, with proper flashing and air sealing at the rough
  opening, matters just as much as the glass itself. Des Moines sits on Puget Sound's eastern shore,
  which adds a second layer of stress: marine air, 37 inches of annual rain concentrated October
  through May, and northwest-facing elevations that see almost no direct sun in winter. Frames that
  look fine in July can be rotting behind the casing by February. TopVolk Construction LLC has
  completed window installs throughout King County since 2017 — Vladislav Volkov handles estimates
  and the work directly, no sales staff between you and the contractor on site. Call (206) 591-1096
  to schedule an on-site visit.

localContext: |
  Des Moines's housing stock is concentrated in the 98198 zip code, spread across two distinct
  topographies. The hillside neighborhoods east of Marine View Drive — post-WWII ranchers and 1960s
  split-levels — deal with northwest-facing overhangs that shade original wood window frames for
  months and trap moisture against the sill. Down the slope toward the marina, homes sit closer to
  salt air off Puget Sound, and aluminum-frame windows from the 1970s and 1980s corrode faster there
  than in inland cities like Kent or Auburn. The SeaTac flight path noise corridor extends from
  98188 into 98198, and older single-pane or early double-pane windows along the western waterfront
  do nothing to attenuate that load. Mid-century homes near Saltwater State Park often have original
  steel casement windows — single-pane, no thermal break, condensation running down the frames every
  winter morning. Des Moines processes building permits through its own city department, not Seattle
  SDCI or King County DPER, so window projects involving rough opening changes or structural header
  work go through the city's own plan review queue, which typically runs 3-5 weeks.

commonProblems:
  - title: "Homes Under the SeaTac Flight Path: Getting Glass That Actually Blocks Jet Noise"
    description: |
      FAA noise contour maps put significant portions of 98198 inside the 65-70 DNL exposure zone —
      and standard double-pane windows with a 1-inch IGU (insulated glazing unit) do almost nothing
      useful at those noise levels. A budget vinyl window typically rates STC 26-28; aircraft noise
      starts becoming manageable around STC 35+. Milgard's Quiet Line series and Pella's 350 Series
      with laminated glass both reach STC 37-40 when installed with acoustic sealant at the jamb
      perimeter and zero air gaps at the rough opening. The laminated interlayer in sound-rated glass
      does the actual work — it damps the sound wave rather than simply blocking it. Budget
      $650-$950 per window installed for a quality sound-rated unit, depending on rough opening
      dimensions and whether existing jamb extensions need replacement.

  - title: "Fogged Glass Between the Panes: What a Failed IGU Seal Actually Means"
    description: |
      Condensation trapped inside a sealed double-pane unit — not on the glass surface, but between
      the panes — means the IGU desiccant has saturated and the argon fill has been displaced by
      humid air. The spacer bar that bonds the two lites carries a small desiccant strip; once
      that's spent, the seal is gone for good. In Des Moines, where persistent fog and 37 inches of
      annual rainfall stress window seals from October through May, this happens faster than
      homeowners in drier climates expect. Sometimes a sash replacement fixes the problem without
      pulling the whole frame — Milgard's Tuscany and Style Line series both offer replaceable sash
      units if the frame is structurally intact. Sash swaps typically run $180-$320 per unit. Full
      replacement with a new Milgard Tuscany double-hung starts around $450-$650 per opening,
      installed, for standard sizes.

  - title: "Egress Windows in Basement Bedrooms: A Code Requirement That Can't Be Skipped"
    description: |
      IRC Section R310 requires basement sleeping rooms to have an egress window with a minimum net
      clear opening of 5.7 square feet, 44 inches of clear height, and a sill no more than 44
      inches off the floor. Many 1960s and 70s ranchers in Des Moines have finished basement
      bedrooms with original hopper windows — 8 to 10 inches tall, nowhere close to egress. Converting
      those openings means cutting the foundation wall, installing a window well, and pulling a
      building permit through the City of Des Moines. Structural header work over a new or enlarged
      rough opening in a concrete or masonry foundation is the labor-intensive part of that scope.
      Budget $2,800-$4,500 per egress conversion depending on foundation type and window well depth.
      TopVolk Construction LLC is a WA Licensed Contractor — Vladislav pulls the required permit,
      handles rough-in and final inspections, and deadline penalties for missed project milestones
      are written into the contract.

  - title: "Window Frame Rot: What Poor Flashing Detail Costs You Years Down the Road"
    description: |
      Water infiltration at the window-to-wall interface in the PNW is almost always a flashing
      detail failure, not a window product failure. The critical point is the sill pan flashing —
      if it's missing, undersized, or not sloped to drain, water pools behind the exterior casing
      and wicks into the rough opening framing. Near Des Moines Marina, northwest winds drive rain
      at a near-horizontal angle from October through March, and that lateral water load exposes
      every gap in the flashing sequence. When rough opening framing rots, a straightforward
      replacement job becomes a partial wall repair: new king and jack studs, sister joists, and
      vapor barrier work — before the window even goes in. Hardie cement-board exterior trim and
      properly lapped housewrap at the head flashing extend window longevity significantly in this
      climate. A replacement window with correct sill pan flashing runs $600-$950 installed.
      Skipping those details to save $150 typically costs $2,000-$4,500 in rot remediation within
      five to eight years.

  - title: "Vinyl vs. Fiberglass for Puget Sound Exposure: Which Frame Material Holds Up"
    description: |
      Vinyl expands and contracts with temperature swings. Des Moines's mild, damp climate keeps
      that movement relatively low compared to eastern Washington — but marine UV exposure and salt
      air off the Sound still degrade standard vinyl over time, particularly on west-facing
      elevations where the finish weathers fastest. Fiberglass window frames, like Pella Impervia
      and Marvin Integrity, have roughly one-eighth the thermal expansion rate of vinyl, won't
      corrode, and resist UV degradation better over a 25-30 year lifespan. The cost gap is real:
      a fiberglass Pella Impervia double-hung runs $850-$1,300 per window installed, versus
      $450-$700 for a mid-grade vinyl unit like Milgard Style Line. For homes directly on the
      Sound-facing slope west of Marine View Drive, the long-term math typically favors fiberglass.
      For hillside homes with less direct marine exposure, quality vinyl installed with proper
      flashing and a correctly detailed sill pan holds up fine for 20+ years.

