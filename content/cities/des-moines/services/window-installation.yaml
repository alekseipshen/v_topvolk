  - q: "Do I need a permit for window replacement in Des Moines, WA?"
    a: |
      Like-for-like replacements — same rough opening size, no structural changes — typically don't
      require a permit from the City of Des Moines building department. Enlarging an existing
      opening, adding a new egress window, or doing structural header work does require one. Des
      Moines runs its own building department, separate from Seattle SDCI and King County DPER, so
      permit applications go through the city's own portal and plan review queue — generally 3-5
      weeks for structural work. TopVolk Construction LLC is a WA Licensed Contractor — Vladislav
      handles permit applications, prepares drawings when required, coordinates rough-in and final
      inspections, and closes the permit at project completion. You don't navigate the city's permit
      process yourself.

  - q: "What STC rating do I need for windows near the SeaTac flight path in Des Moines?"
    a: |
      STC (Sound Transmission Class) measures how much a window assembly reduces airborne noise.
      Standard double-pane windows rate STC 26-28 — adequate for road noise, not for jet aircraft.
      FAA guidance recommends STC 30+ for homes in the 65 DNL noise zone and STC 35+ for the 70
      DNL zone, which covers parts of 98198 closest to the flight corridor. Milgard's Quiet Line
      series and Pella 350 Series with laminated glass both reach STC 37-40 when installed with
      acoustic sealant fully sealing the jamb perimeter. The laminated interlayer — not just extra
      glass thickness — does the acoustic dampening work. Installing a sound-rated window without
      sealing the rough opening perimeter throws away 3-5 STC points regardless of which brand you
      choose.

  - q: "How long do replacement windows last in Des Moines's climate?"
    a: |
      Quality vinyl windows — Milgard Tuscany, Style Line — last 20-30 years in the PNW with
      correct installation and flashing detail. Fiberglass units from Pella or Marvin typically
      reach 30-40 years. The failure point is almost never the window product itself; it's the
      installation — missing sill pan flashing, no head flashing, or casing caulked instead of
      properly integrated with the housewrap. Milgard offers a Full Lifetime Warranty on their
      residential windows covering seal failure, hardware defects, and frame issues, but that
      warranty requires installation by a licensed contractor. TopVolk Construction LLC is a WA
      Licensed Contractor and documents every installation with photos for warranty records.
      Properly installed windows in 98198 with correct flashing detail should not need replacement
      before 25 years.

