  - q: "Do I need a permit for a kitchen remodel in Chehalis?"
    a: "Yes, if the project touches electrical, plumbing, gas lines, or structural walls — cosmetic-only work like cabinet swaps usually doesn't need one. Projects inside city limits go through the City of Chehalis Community Development Department. Parcels in unincorporated Lewis County, including parts of Fords Prairie, go through Lewis County Community Development instead. Plan review typically takes 2-4 weeks for a kitchen remodel, longer if a load-bearing wall is coming out. TopVolk is a WA Licensed Contractor and handles the permit application and inspection scheduling directly."
  - q: "Can you remove the wall between my kitchen and dining room?"
    a: "In most cases, yes. It depends on whether that wall is load-bearing — common in the ranch-style homes built through Fords Prairie in the 1960s and 70s. TopVolk evaluates the framing, sizes an LVL beam and post support if needed, and pulls the structural permit before any demo starts. A rough-in inspection happens before drywall goes back up, and a final inspection closes out the permit. This step typically adds $4,000-$9,000 to the project, depending on beam size and span."
  - q: "How long do the cabinets and countertops last?"
    a: "Semi-custom cabinet boxes with moisture-resistant backing typically last 20+ years if the crawlspace underneath stays dry — that matters in a town with Chehalis's flood and rainfall history. Laminate counters run 10-15 years before edges start to lift; quartz holds up longer and resists staining better for daily cooking. GE, Whirlpool, and Frigidaire appliances are the most common replacement parts stocked locally, which keeps warranty repairs simple. Checking the crawlspace vapor barrier every 8-10 years protects the investment underneath the new kitchen."
