title: "Chehalis Bathroom Remodel — Full Guts From $9K to $42K"

answer: "Vladislav Volkov's TopVolk Construction remodels bathrooms in Chehalis, WA for $9K-$42K — WA Licensed Contractor, 100+ jobs since 2023."

intro: |
  Recreation Park's ballfields flood almost every winter when the Chehalis River backs up the storm drains, and the same water table sits under half the older ranch homes between there and the Lewis County Historical Museum downtown — which is exactly why so many Chehalis bathroom remodels start with a soft subfloor instead of a tile pattern. A full gut-and-reconfigure here typically runs $16,000 to $42,000, less than King County suburbs pay for the same walk-in shower conversion, because material costs track closer to the area's $45,195 median household income and most jobs skip the high-end tile upgrades. Vladislav Volkov, the owner-operator behind TopVolk Construction, has run more than 100 remodels since 2023 across King, Snohomish, Pierce, and Kitsap counties, and Lewis County jobs get the same direct-line communication — no sales rep, no project manager layer in between. A Moen shower valve swap or a Kohler comfort-height toilet install is the easy part; the real work in a lot of these houses is a cast-iron drain stack rusted through behind the tub. Call (206) 591-1096 and get an actual on-site look before anything gets quoted.

localContext: |
  Zip code 98532 covers most of Chehalis proper, including the older homes lining W Main Street and the blocks near the Lewis County Historical Museum's old train depot — a lot of those were built between 1900 and 1935, with galvanized supply lines long overdue for a swap to PEX. Head south toward 98531 near the Centralia line and the housing skews newer, 1970s-80s ranch and split-level construction with fiberglass tub-shower combos that were builder-grade when installed and are now cracked, chalky, or leaking at the seams. Bathroom remodels inside Chehalis city limits go through the City of Chehalis Community Development Department for plumbing and electrical permits; anything in unincorporated Lewis County — out toward Bunker Creek Road or the Newaukum Valley — routes through Lewis County Community Development instead. The Chehalis River floodplain designation matters here too: homes near the river bottom need vapor barrier work and sometimes sump pump coordination before we touch the bathroom subfloor, because a wet crawlspace will rot new plywood just as fast as it rotted the old stuff.

commonProblems:
  - title: "Original 1980s Vanities and Fiberglass Tub Surrounds"
    description: "Plenty of Chehalis ranch homes off Parkland Drive and out toward the fairgrounds still have the fixtures they were built with in 1978 or 1985 — a cultured marble vanity top with a corroded pop-up drain, a single-handle faucet that hasn't sealed right in a decade, and a one-piece fiberglass tub surround gone dull and spider-cracked at the corners. None of that is dangerous, exactly, but it drags down resale and usually hides a leaking P-trap or a shutoff valve that won't fully close anymore. A straight fixture swap — new Kohler comfort-height toilet, Moen single-handle valve, semi-custom vanity — runs $4,500 to $9,000 and takes about a week once materials arrive. Go further and replace the whole surround with large-format porcelain over Schluter Kerdi membrane, and it's 3 to 4 weeks and a different budget entirely."
  - title: "Moisture Damage From a High Water Table"
    description: "Chehalis sits low in the valley, and homes near the river bottom or south of downtown often have a crawlspace that stays damp nine months a year. Pull up the vinyl flooring in a bathroom that's been leaking slowly around the tub drain and it's common to find soft, delaminating subfloor — sometimes down to the joists — because there was never a real waterproofing membrane behind the original tile. The fix is RedGard or Schluter Kerdi applied under new tile, a vapor barrier in the crawlspace below, and DriCore subfloor panels where the old plywood has to come out entirely. Skipping the membrane step to save money is the single most common reason we get called back to a house within two years. Budget an extra $1,200 to $2,500 for proper waterproofing, and it's worth every dollar in a floodplain zip code like 98532."
  - title: "Cast-Iron Drain Stacks in Chehalis's Older Homes"
    description: "Homes built before 1935 near downtown Chehalis and the old rail corridor were plumbed with cast-iron drain stacks, and plenty of them are rusted through at the base or cracked where the toilet flange connects. Rerouting that stack to PVC means opening the wall or floor, cutting out the bad section, and tying in with proper joist blocking so the new drain line is supported correctly — not just hanging off a joist hanger and hoping. Any work touching the drain, waste, and vent system inside Chehalis city limits needs a permit through the City of Chehalis Community Development Department, and plan review typically takes 1 to 3 weeks for a straightforward bathroom scope. TopVolk Construction LLC is a WA Licensed Contractor and pulls those permits directly. Expect the plumbing rerouting piece alone to add 3 to 5 days to the schedule."
  - title: "What Actually Drives the Price Up or Down"
    description: "Most Chehalis bathroom remodels land between $9,000 for a fixture-and-tile refresh and $42,000 for a full gut with a layout change — moving a toilet drain or converting to a curbless shower costs more than swapping a vanity, because it means relocating plumbing under the slab or subfloor. Framing changes, like removing a wall to combine a small bath with an adjacent closet, add both material and permit cost. Finish level matters too: a builder-grade vanity from a big box store runs a fraction of a semi-custom cabinet, and large-format porcelain costs more to install than standard 12x12 tile because it needs a flatter substrate. Every TopVolk quote is line-item, not a vague range, and the contract includes a penalty paid to the homeowner if the deadline gets missed — that's written in, not a verbal promise. Call (206) 591-1096 for a free on-site estimate with actual numbers."
  - title: "Ventilation, Mold, and How Long Materials Actually Last"
    description: "Lewis County gets roughly the same wet stretch as the rest of the Puget Sound lowlands — heavy rain October through May — and a bathroom exhaust fan that's undersized or vented into the attic instead of outside is a slow mold problem waiting to happen. Code calls for enough CFM to handle the room's square footage, and a lot of older Chehalis bathrooms are still running a fan from the original build that's rated too low and clogged with dust besides. Swapping in a properly sized fan, often paired with a humidity-sensing switch, runs $350 to $650 installed and should last 12 to 15 years with the filter cleaned occasionally. Recaulk around the tub and any niche or bench in a walk-in shower every 2 to 3 years before water gets behind the tile. A Schluter Kerdi shower system, properly installed, is good for the life of the house; a builder-grade fiberglass surround usually needs replacing inside 20 years."

