      Bothell is well inside our regular service area — a straightforward run up SR-522 or I-405, and we're in Bothell multiple times a week on active projects. Scheduling an on-site estimate typically takes 3-7 business days depending on current load. The estimate is free, done in person by Vladislav (not a sales rep), and includes a written line-item quote with deadline penalties built into the contract — if we miss the agreed completion date, we pay a penalty, not just offer an explanation. Call (206) 591-1096 to get on the schedule. From signed contract to install start, straightforward fence projects typically move in 2-4 weeks.

  - q: "What does fence installation cost per linear foot in Bothell?"
    a: |
      Cedar dog-ear privacy fence runs $35-55 per linear foot installed, including PT posts. Horizontal cedar slat fences — popular in Canyon Park and along newer streets in the 98021 zip — run $50-70 per linear foot due to the additional framing labor and closer post spacing. CertainTeed or Bufftech vinyl panel systems are $45-70 per linear foot installed and require no periodic staining. Gates are priced separately: a standard 4-foot walk gate with D&D Technologies hardware is $300-500 installed; a 10-foot double drive gate runs $800-1,400 depending on material and hardware grade. Slope and difficult access get quoted specifically after the site visit. Free on-site estimates with exact line-item pricing — call (206) 591-1096.

  - q: "Does Bothell require a permit for residential fence installation?"
    a: |
      Most standard residential fences in Bothell — 6 feet or under on side and rear yards — do not require a permit from the City of Bothell Building Division. Fences exceeding 6 feet, retaining wall fences over 4 feet, or any fence tied to a pool barrier do require a permit and plan review. Bothell's permit process runs through the city's own Building Division, not King County DPER, and a straightforward fence permit typically clears review in 2-4 weeks. As a WA Licensed Contractor, TopVolk handles the permit application, site plan, and inspection coordination when a permit is required — that's part of the project scope, not a separate charge added later.

  - q: "Do you install horizontal slat cedar fences? That style seems common in our neighborhood."
    a: |
      Horizontal slat fences are one of the more frequent requests in Bothell, particularly in Canyon Park and Queensborough where 1990s and 2000s homes suit the modern Pacific NW aesthetic. The framing is more involved than vertical picket: horizontal rails require blocking between posts to prevent bow as the wood dries, posts need to land on 6-foot centers, and the frame has to be dead-plumb or gaps open up over the first season. TopVolk builds horizontal slat fences in both cedar (sealed or left to weather gray) and Trex Seclusions composite if low maintenance is the priority. Both are solid options in Bothell's climate — the choice usually comes down to budget and whether you want to re-apply a penetrating oil finish like Armstrong Clark every few years or just wash down composite once a season.

  - q: "How long does a cedar fence last in Bothell, and when does it make sense to replace instead of repair?"
    a: |
      A cedar fence with PT posts, properly set and sealed, should last 15-20 years in Bothell before needing significant work. Posts are the lifespan limiter — individual pickets can be replaced at $8-15 each installed, but once posts start rotting or leaning, the fence section typically needs rebuilding rather than patching around failing structure. Annual maintenance matters: clear moss and mildew off north-facing runs (common in Bothell's shaded yards), and re-apply a penetrating finish like TWP 100 Series every 2-3 years. Skipping that maintenance cycle cuts effective lifespan by 30-40%. The repair-versus-replace decision usually comes down to post condition — if more than 20% of posts are compromised, a full rebuild is more cost-effective than chasing individual failures.

  - q: "Do you serve other cities near Bothell, and what's the typical scheduling window?"
    a: |
      TopVolk's service area covers the full Seattle Metro — King County, Snohomish County, Pierce County, and Kitsap County. Cities adjacent to Bothell that we work in regularly include Kenmore, Woodinville, Kirkland, Redmond, Lynnwood, and Mill Creek. Snohomish County work — including the 98021 portion of Bothell that straddles the county line — involves Snohomish County PDS for permitted projects, which we handle directly. Across the region, scheduling typically runs 2-4 weeks from estimate to project start for fence work. If you're in Bothell or nearby and want an on-site estimate with actual line-item numbers rather than a phone range, call (206) 591-1096 or reach out through the website to get on the calendar.