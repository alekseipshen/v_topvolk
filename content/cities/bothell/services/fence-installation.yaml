title: "Bothell Fence Installation — PNW Soil, Cedar & Post Setting"

intro: |
  North Creek runs through the middle of Bothell, and the residential lots flanking that corridor — mostly 1980s two-stories on the King County side (98011) — get the kind of steady moisture from October through May that chews through untreated cedar fence posts in seven to ten years. That's the real starting point for any fence project here: not style, not budget, but soil and climate first. The Canyon Park neighborhood to the northeast sits on compacted glacial till that holds post anchors well, but lower yards near the Sammamish River Trail can stay saturated enough that setting posts without 36-inch depth and concrete backfill is asking for lean within two seasons. Vladislav Volkov at TopVolk Construction has been setting fence posts across Bothell since 2017 — 100+ projects completed across King, Snohomish, Pierce, and Kitsap counties — and the first conversation is always about what's going on under the ground before talking about what goes above it. Call (206) 591-1096 to schedule a free on-site estimate.

localContext: |
  Bothell's housing stock ranges considerably depending on which side of the city you're on. The older Riverside neighborhood near downtown (98011) has homes from the late 1960s and 1970s — properties that have seen two or three generations of cedar fencing, and where original survey pins are sometimes off by a foot or more, making property-line verification a real issue before any new fence goes in. The Canyon Park and Queensborough areas (98021) are mostly 1990s and 2000s subdivisions with active HOAs, which often specify fence height, material, and even stain color in their CC&Rs. Bothell's own Building Division handles permits separately from King County DPER — fence permits are required for structures over 6 feet, and any retaining wall component over 4 feet needs a full permit with engineering review. The city's wet-season soil conditions also mean post depth matters: 24 inches is the IRC code minimum, but 30-36 inches is standard practice in low-lying areas near North Creek to handle frost heave and saturated ground.

commonProblems:
  - title: "Cedar Post Rot at Ground Contact — Yards Near North Creek"
    description: |
      Cedar looks good at install and holds up fine above grade, but the ground-contact zone is where Bothell's climate does the damage. Consistent soil moisture from October through April keeps the post base wet for months, and untreated cedar at that depth can show significant rot in as little as six to eight years. The fix requires intentional material selection at the outset: pressure-treated (PT) Douglas-fir or PT pine posts rated for ground contact at a minimum UC4B rating, set in concrete at 30-36 inches depending on fence height and wind load. Some homeowners opt for a steel post sleeve at the base to protect cedar posts they've already purchased. On properties near North Creek in the 98011 zip, full PT posts are the standard recommendation — the added cost over a standard cedar 4x4 is $15-25 per post, and it adds a decade to fence lifespan without changing the visible aesthetic above grade.

  - title: "Fence Height Code Violations on Sloped Lots"
    description: |
      Bothell follows standard Washington fence height limits: 6 feet maximum for side and rear yards, 4 feet maximum in front yards measured from finished grade. It sounds straightforward until you're building on a slope — which describes a good portion of the terrain in the Riverfront and Queensborough areas. On a grade, the measurement point changes depending on which side of the fence you're measuring from, and stepped versus racked panel approaches handle this differently under the code. A fence installed without accounting for slope can trigger a complaint and a city enforcement notice, requiring either an after-the-fact permit or removal and rebuild. Pool barrier fences carry additional requirements — 48-inch minimum height, self-closing and self-latching gates with hardware mounted on the pool side — which Bothell's Building Division enforces separately from general residential fence height rules.

  - title: "Shared Property Line Disputes and Survey Issues"
    description: |
      In Bothell's older neighborhoods near downtown (98011), lot surveys from the 1960s and 1970s sometimes show pins displaced by prior fence installs, landscaping work, or just decades of ground movement. Installing a new fence on what you believe is the property line and discovering post-installation that you're 8-12 inches onto the neighbor's lot is more common than people expect — and relocating an installed fence runs $800-$2,500 depending on linear footage and material. Before any fence install, TopVolk recommends pulling existing survey records through King County or hiring a licensed surveyor to re-stake the corners. For shared-line fences where both neighbors split the cost, a written agreement is worth documenting — it affects maintenance responsibility and what happens if one party later wants to modify or remove their section. As a WA Licensed Contractor, TopVolk coordinates the paperwork side when needed, including permit applications through the City of Bothell Building Division.

  - title: "Material Cost and Slope Pricing — What Bothell Fence Projects Actually Run"
    description: |
      Flat-lot cedar dog-ear privacy fence in Bothell runs $35-55 per linear foot installed, including PT posts set in concrete. Horizontal slat cedar — increasingly common in Canyon Park and the newer Queensborough area — adds 15-20% due to more labor-intensive framing and tighter required post spacing (6 feet on center maximum for horizontal applications, versus 8 feet for vertical picket). Vinyl fencing using Bufftech or CertainTeed panel systems runs $45-70 per linear foot installed for a 6-foot privacy fence and carries manufacturer warranties of 20-25 years with no staining required. Slope adds cost: a fence on a 10% grade requires racked or stepped panels, each adding $4-8 per linear foot depending on the approach. Gate hardware is a separate line item — a quality self-closing walk gate with a D&D Technologies Lokk-Latch mechanism runs $300-500 installed; heavy driveway gates run higher.

  - title: "Gate Hardware Failure — Hinges and Latches on Daily-Use Gates"
    description: |
      Gate hardware is the component of a fence system that fails first, and it usually fails because the original install used lightweight butt hinges rated for interior doors, not outdoor gates carrying wind load and daily use. A standard 4-foot cedar gate weighs 30-50 lbs; a 6-foot horizontal slat gate can hit 60-70 lbs. Those loads cause standard door hinges to deflect within a year, leading the gate to drag, bind, or stop latching. The correct hardware for wood fence gates in Bothell's conditions — moisture exposure plus wind — is heavy-duty strap hinges or ring-and-pintle hardware on steel post mounts, with a self-closing mechanism using an adjustable spring hinge like the Bommer 7700 series or a D&D Technologies TCA self-closer for larger openings. Gate posts should also be 4x6 or 6x6 PT lumber rather than 4x4 to resist the lateral torque from gate swing over time. Budget $80-180 in hardware per gate for components that actually hold up through a PNW winter.

