  - q: "What does hardwood or LVP flooring installation cost in Bothell?"
    a: |
      Solid 3/4-inch nail-down oak strip runs $8–13 per square foot installed, covering
      materials, subfloor prep, and finish coat. Engineered hardwood glue-down over
      concrete typically lands at $9–15 per square foot depending on board width and
      species. LVP floating install generally comes in at $5–9 per square foot. What
      moves the number: slab moisture remediation, VAT abatement, significant subfloor
      leveling, or blended refinishing to match existing floors. Vladislav provides a
      written line-item quote after the on-site visit — no vague ranges, no surprises
      at invoice. Call (206) 591-1096 or schedule a free on-site estimate to get exact
      numbers for your specific layout and subfloor condition.

  - q: "Does flooring installation in Bothell require a permit from the city?"
    a: |
      Standard flooring replacement — removing carpet, installing hardwood or LVP,
      refinishing existing floors — doesn't require a permit from the City of Bothell
      Building Division. Structural work does: joist sistering, adding radiant heat that
      modifies the floor assembly, or anything touching load-bearing elements triggers
      a permit. The City of Bothell has its own permit center, separate from King County
      DPER, which handles unincorporated parcels on the edges of town. TopVolk handles
      permit research, application prep, and inspection coordination as part of the
      project scope. TopVolk Construction LLC is a WA Licensed Contractor. If you're
      unsure whether your project crosses the permit threshold, ask during the
      consultation — it's a straightforward question with a real answer.

  - q: "What's the difference between engineered hardwood and LVP for a slab-on-grade home in Bothell?"
    a: |
      Engineered hardwood is real wood — a hardwood veneer layer bonded over a plywood
      core — and it performs significantly better over concrete than solid hardwood
      because the plywood core is dimensionally stable through Bothell's seasonal humidity
      swings. LVP is 100% waterproof and fully synthetic, making it the right call for
      below-grade spaces, laundry rooms, or anywhere standing water is possible. Over a
      slab in a main living area of a Canyon Park home, engineered hardwood delivers more
      authentic character, adds more resale value, and can be refinished once or twice
      over its lifespan. LVP wins on upfront cost and total moisture tolerance. Either
      way, if slab moisture vapor emission reads above threshold on a calcium chloride
      test, both products require a vapor-barrier underlayment — skipping it voids most
      manufacturer warranties regardless of which product you choose.

  - q: "How long does a flooring installation project take in Bothell?"
    a: |
      A standard 500-800 sq ft LVP floating install takes roughly 2 days: one day for
      subfloor prep and layout, one day for install and transition strips. Nail-down
      hardwood over a wood subfloor in the same square footage runs 3-4 days, plus the
      4-7 day acclimation period that has to happen before work starts. Larger projects
      — multiple rooms at 1,200+ sq ft — add proportionally. Projects requiring VAT
      abatement add 1-3 days for the abatement itself, plus a clearance testing window
      before flooring begins. Slab moisture barrier installation adds roughly half a day.
      TopVolk builds a realistic schedule into the written contract, and missed deadlines
      come with a financial penalty — written in, not just a verbal promise.

