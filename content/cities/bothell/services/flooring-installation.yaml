title: "Bothell Flooring Installation: Tear-Out, LVP, Laminate and Hardwood"

intro: |
  The price of a new floor in Bothell depends on three things: the
  material, what has to come out first, and the condition of the subfloor
  underneath. National 2025 cost guides put luxury vinyl plank at about $4
  to $16 per square foot installed and hardwood at about $6 to $25, with
  refinishing existing hardwood at about $3 to $8. Removing old flooring,
  leveling and subfloor repair come on top of those figures. They are
  market ranges, not a quote, so call for a written quote after a free
  on-site estimate.

  A typical floor in one level of a house takes about two to five days of
  work. Hardwood and some vinyl products also need time to acclimate in the
  house before installation, following the manufacturer's instructions.

localContext: |
  Bothell sits on the King and Snohomish county line; about 60% of
  residents live on the King County side and 40% on the Snohomish side.
  Inside city limits on either side, the City of Bothell Permit Center
  handles permits, and all applications go in online through
  MyBuildingPermit. Electrical permits are obtained through the Washington
  State Department of Labor & Industries.

  The housing mix shapes flooring work here. According to the city, just
  over half of Bothell's housing units are single-family homes, about a
  third are apartments and other buildings with five or more units, and 9%
  are manufactured homes. Each of those has its own subfloor and its own
  rules: a condominium may have association rules about sound under hard
  floors, and a manufactured home has a different floor structure from a
  site-built house.

commonProblems:
  - title: "Flooring demolition: what is under the old floor"
    description: |
      Tear-out is often the part people underestimate. Carpet and pad come
      up quickly, but glued-down vinyl, old tile and layers of earlier
      flooring take longer and leave adhesive that has to be removed or
      covered before a new floor goes down. Puget Sound Clean Air Agency
      rules require checking the work area for asbestos before renovation,
      and older sheet vinyl, floor tile and mastic can contain it, so a
      sample is tested before demolition rather than after. In homes built
      before 1978, removing painted baseboards and trim falls under
      Washington's lead-safe Renovation, Repair and Painting rules.
  - title: "Subfloor and slab condition"
    description: |
      A click-together vinyl plank or laminate floor is only as flat as the
      surface under it, and manufacturers set flatness limits in their
      installation instructions. Over plywood or OSB that means fixing soft
      or squeaky spots and screwing down loose panels. Over a concrete slab
      it means checking moisture before installing, as most hardwood and
      vinyl manufacturers require, and using the vapor barrier they specify.
      Skipping those steps can void the product warranty.
  - title: "Luxury vinyl plank, laminate or hardwood"
    description: |
      Luxury vinyl plank handles water best and suits kitchens, laundry
      rooms and below-grade spaces. Laminate costs less and looks like wood
      but is more sensitive to standing water at the seams. Engineered
      hardwood is real wood on a stable core and works over concrete where
      solid hardwood does not; solid hardwood can be sanded and refinished
      several times over its life. The right choice depends on the room,
      what is underneath and how long you plan to stay.
  - title: "First floor remodels that go beyond flooring"
    description: |
      A new floor on the main level often comes with other work: removing a
      wall to open the kitchen, moving a bathroom fixture, or adding heated
      floors. Bothell lists painting, tiling, carpeting, cabinets,
      countertops and similar finish work as exempt from a building permit.
      Structural changes, moved plumbing and new circuits are not on that
      list. Electrical and plumbing work is done by licensed
      subcontractors under the required permits.

faq:
  - q: "How much does flooring installation cost in Bothell?"
    a: |
      2025 national cost guides put luxury vinyl plank at about $4 to $16
      per square foot installed, hardwood at about $6 to $25, and
      refinishing existing hardwood at about $3 to $8. Tear-out, leveling,
      stairs and subfloor repair add to that. Call for a written quote after
      a free on-site estimate; 0% financing for 24 months is available,
      subject to credit approval.
  - q: "Do I need a permit to replace flooring in Bothell?"
    a: |
      Usually not. Bothell's list of work exempt from permit includes
      tiling, carpeting and similar finish work, as long as required
      accessible features are not altered. Replacing joists or subfloor
      framing, moving plumbing or adding electric floor heat is a different
      matter, so check with the city permit center for anything beyond the
      floor surface.
  - q: "How long does a flooring installation take?"
    a: |
      A typical floor on one level takes about two to five days, depending
      on the square footage, the tear-out and how much subfloor work is
      needed. Acclimation time comes first when the product requires it.
      The completion date is written into the contract, and TopVolk pays
      $100 for every day past the agreed deadline.
  - q: "Is TopVolk a licensed flooring contractor in Bothell?"
    a: |
      TopVolk is a licensed and insured Washington general contractor, and
      the contract includes a written warranty. Call (206) 591-1096 and you
      reach Vladislav Volkov, the owner, who does the estimate himself.
