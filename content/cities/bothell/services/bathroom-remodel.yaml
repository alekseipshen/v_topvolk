title: "Bothell Bathroom Remodel — North Creek Homes, Done Right"

intro: |
  North Creek Trail cuts through the back of Bothell's Canyon Park corridor —
  and so does the moisture. Houses in 98011 that went up between 1986 and 1995
  were built to a contractor's margin: original Kohler vanity faucets, no
  waterproofing membrane behind the tub surround, exhaust fans that barely
  cleared the humidity. Vladislav has rebuilt more than a dozen of these
  master baths since 2017, replacing tub alcoves with curbless walk-in showers
  and Schluter Kerdi membrane under every tile surface.

localContext: |
  The King County portion of Bothell — zip codes 98011 and 98021 — covers the
  original downtown area near Bothell Landing Park and the North Creek and Canyon
  Park corridors. Homes range from post-war Craftsman-influenced houses in the
  older blocks to 1990s builder-grade colonials further east. Cast-iron drain
  stacks are common in anything built before 1985. Moving a toilet or adding a
  second shower in these homes almost always means opening the subfloor and
  rerouting drain lines before any finish work starts.

commonProblems:
  - title: "Builder-Grade Tub Surrounds With No Waterproofing Behind Them"
    description: |
      Most 1988-1996 homes in Canyon Park came with one-piece fiberglass tub
      surrounds — quick to install, quick to fail. The gelcoat surface scratches,
      the factory perimeter caulk dries out within a decade, and water migrates
      behind the unit into the framing. Fixing it means demo to the studs,
      installing Schluter KERDI-BOARD over cement board, then setting tile over
      a proper waterproofing membrane. Skip that step and mold returns in six
      months.
  - title: "50 CFM Exhaust Fans in Baths That Need Triple the Airflow"
    description: |
      Bothell gets 37-plus inches of rain annually, and the humidity follows
      you inside. Original 50 CFM exhaust fans can't clear steam from an enclosed
      walk-in shower before mold establishes along grout lines — a persistent
      problem in 98011 master baths. Upgrading to a 110+ CFM unit with a humidity
      sensor and a properly sloped duct run to an exterior soffit is part of every
      master bath rebuild. Grohe or Moen thermostatic valves go in at the same
      time to control steam volume at the source.
  - title: "Cast-Iron Drain Stacks That Complicate Any Layout Change"
    description: |
      Homes in the older Bothell blocks near Bothell Landing — anything built
      before 1985 — commonly have cast-iron drain stacks. Durable, but rigid:
      relocating a toilet or repositioning a shower means cutting the subfloor
      and adding a new 3-inch ABS branch line to reach the existing stack. That
      triggers a rough-in inspection and a permit from the City of Bothell's
      permit center. Plan 5 to 8 weeks for review on any scope with plumbing
      layout changes.

faq:
  - q: "How fast can you get to Bothell for a bathroom remodel consultation?"
    a: |
      Bothell is 25-35 minutes from Vladislav's base via I-405 or SR-522,
      depending on time of day. He schedules on-site walkthroughs throughout
      the week. Call (206) 591-1096 directly — no sales staff, no middleman.
      You talk to the contractor doing the work.
  - q: "Do you work with Kohler, Grohe, and Hansgrohe fixtures at this price point?"
    a: |
      Yes. Most Canyon Park homes have Kohler or Moen hardware that's being swapped
      or upgraded. For master baths with more budget, Hansgrohe and Grohe thermostatic
      valves are common. Moen Genta handles secondary baths well at a lower price
      point. Vladislav specifies based on the scope — not on margin.
  - q: "What's the permit process and timeline for a Bothell bathroom remodel?"
    a: |
      The City of Bothell runs its own permit center — plan review for a remodel
      with plumbing or layout changes runs 4 to 8 weeks. After permit approval:
      tile-and-fixture replacement takes 3-5 weeks, a full gut with layout
      reconfiguration is 7-12 weeks. TopVolk is a WA Licensed Contractor, 100+
      projects completed since 2017. Missed deadline means we pay a penalty —
      written into the contract. Schedule a free site visit at (206) 591-1096.