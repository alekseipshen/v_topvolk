  - q: "Do you work with Kohler and Moen fixtures for Bothell bathroom remodels?"
    a: "Both are standard in this area. Kohler pressure-balance valves, Moen cartridge swaps, Rinnai tankless upgrades when a remodel exposes the supply side — all handled. Valve type and compatibility are confirmed at the consultation before rough-in is specced, so there are no surprises mid-project."
  - q: "What does a full bathroom remodel cost in Bothell, and how long does it take?"
    a: "A full master bath — demo, tile, walk-in shower, vanity, fixtures — typically runs $25,000–$60,000 depending on finishes. Timeline is 6–10 weeks including permit, rough-in, and final inspections. Bothell has its own permit center, not Seattle SDCI. Missed deadlines are penalized — that commitment is written into every contract."