title: "Bothell Bathroom Remodel — Fix the 90s Tile for Good"

intro: |
  Canyon Park's two-story colonials in 98011 were built fast in the late 1980s and early 90s — beige tile, one-piece fiberglass surrounds, and a Moen single-handle faucet that drips every time the heat kicks on. Bothell's rainfall from October through April turns those old fiberglass walls into slow mold traps.

  TopVolk Construction LLC has handled bathroom remodels across King and Snohomish counties since 2023 — 100+ projects completed, all permitted, WA Licensed Contractor, owner-led by Vladislav Volkov.

  That means Vladislav walks your bathroom, writes the estimate, and runs the job — no handoffs to a project manager you've never met.

localContext: |
  The 98011 zip code runs through neighborhoods north of downtown Bothell toward the North Creek corridor — two-stories built between 1982 and 1998, master baths over the garage, cast-iron drain stacks tucked into tight wall chases. Some of the older houses still have galvanized supply lines at the vanity connections. Canyon Park's 1990s builds tend to have builder-grade ceramic tile and a Kohler tub-shower combo held together by 30-year-old caulk.

  East Bothell, along SR-527 near the Kenmore border, follows the same pattern — same era, same builder shortcuts. The stretch of houses between Bothell-Everett Highway and the North Creek Trail runs almost entirely late-80s to mid-90s construction, which means the same fiberglass surrounds and undersized exhaust fans that canyon Park has.

  Closer to Bothell Landing and the Sammamish River waterfront — the historic core near Main Street and 98011's lower elevations — you find a handful of older ranchers from the 1970s mixed in with the later colonials. Different era, different problems: those 1970s ranchers often have 3/4 baths that were roughed in without any waterproofing membrane behind the tile, just mortar bed straight to greenboard.

  Over in 98012, neighborhoods around Queensborough and the North Creek greenway south of the UW Bothell campus run slightly newer construction (late 90s to 2005). Still fiberglass surrounds. Still 50 CFM fans venting into attic space instead of to the exterior. The Country Village area on the 98011/98012 border sits in a similar band — 1990s builder-grade throughout, same shortcuts regardless of which side of the zip line a house falls on. The newer build date doesn't change what's underneath — HardieBacker and Schluter Kerdi waterproofing weren't on the original spec sheet in either zip code.

  Bothell permit work goes through the City of Bothell's own permit center — separate from Seattle SDCI and King County DPER. Plan review for a full bath remodel typically runs 3–5 weeks before rough-in can start.

commonProblems:
  - title: "Fiberglass Surrounds Cracking at the Seam — Moisture Already in the Framing"
    description: "One-piece fiberglass surrounds in 1985–98 Bothell builds flex with the subfloor and crack at the seam where the unit meets the tub deck. Water follows that crack into the blocking and rim joist before you smell anything. Fix means demoing the surround, installing a Schluter Kerdi waterproofing membrane over HardieBacker, and tiling with large-format porcelain. A rough-in inspection is required once the framing is exposed. If the rim joist has rot — common in 98011 colonials where the master bath sits over the garage — sister joists get sistered in before the waterproofing layer goes down. Plumber coordinates on the drain side while staging is underway; that sequencing is handled on our end."
  - title: "50 CFM Exhaust Fans Venting Into the Attic — Mold Returns Every Spring"
    description: "Most Canyon Park bathrooms from the 90s have undersized fans dumping moisture into the attic. At 37 inches of annual rainfall, that grows mold on north-facing surfaces by March. A remodel is the right time to run a properly sized 110+ CFM fan through exterior venting, terminated through the roof deck."
  - title: "Cast-Iron Drain Stack Blocking Walk-In Shower Conversion"
    description: "Converting a tub-shower combo into a curbless walk-in shower with a bench and tile niche means relocating the drain. In 98011 colonials, that stack is often cast iron running through a confined chase in the floor. Moving it 18 inches requires cutting in, connecting to ABS with proper slope, and passing a rough-in inspection before the subfloor goes back. Plumber coordination is handled on our end."

