title: "Bothell Kitchen Remodel — Open Layouts for Split-Level Homes"

intro: |
  Split-levels along Canyon Park Road and the older residential blocks near 98011 were built with closed kitchens — a separate room off a short hallway, designed when cooking was hidden work. Fitting a Bosch induction range or a KitchenAid column refrigerator into that original layout usually exposes how cramped it really is. That's where most Bothell renovation conversations start. TopVolk Construction has handled this gut-and-rethink across King County since 2023.

localContext: |
  The King County portion of Bothell (ZIP 98011) runs from Bothell Landing along the Sammamish River into the Canyon Park corridor. Most housing here dates from 1968 to 1990 — split-levels and bi-levels with original 100-amp panels, galvanized supply lines, and galley-style cooking areas that feel claustrophobic by today's open-plan standards. Crawlspace vapor barriers in this stock are often deteriorated. Puget Sound humidity from October through May accelerates subfloor rot under spaces built close to grade, and that gets discovered mid-demo.

commonProblems:
  - title: "Load-Bearing Wall Between Kitchen and Dining in 1970s Split-Levels"
    description: "In most Bothell split-levels from 1968-1985, that cooking-to-dining wall is structural. Removing it means temporary shoring, a correctly-sized LVL beam, and PSL posts carrying the load to the foundation. City of Bothell plan review for structural work typically runs 3-5 weeks. Rough-in inspection happens before drywall. Skip the engineering step and the city inspector flags it regardless."
  - title: "100-Amp Service Can't Support a Modern Appliance Load"
    description: "A Thermador induction range draws 40-50 amps. Add a dishwasher circuit, microwave drawer, and recessed lighting on dimmers, and a 1975 Bothell home's original 100-amp panel maxes out. Upgrading to 200A service is permit-required, involves a PSE meter pull, and adds 2-3 weeks to the schedule. Scope the electrical before demo starts — not as a surprise change order mid-project."
  - title: "Gas Line Permits and Range Hood CFM When Switching to Gas Cooking"
    description: "Switching from electric to a Wolf or KitchenAid gas range means a licensed plumber permits and runs a new gas line — a separate permit from the main renovation permit. Range hoods also change: a 1,200 CFM hood needs a dedicated duct chase from the cabinet soffit through the exterior wall. Both are mechanical rough-in items requiring inspection before drywall closes."

