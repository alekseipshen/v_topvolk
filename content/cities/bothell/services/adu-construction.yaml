title: "Bothell ADU Construction — Build Rental Income on Your Existing Lot"

intro: |
  Rental demand around the University of Washington Bothell campus holds steady year-round — graduate students, research staff, and tech workers filling desks in the Canyon Park business district all need housing that isn't a 300-unit apartment complex. That sustained demand is exactly why more homeowners in 98011 are acting on WA HB 1337 (2024), which now allows up to two ADUs on most single-family lots statewide — a detached backyard unit plus a basement conversion, or two DADUs depending on your specific lot configuration. Bothell processes ADU permits through the city's own Planning & Development Services department, not Seattle SDCI, so the application package and plan review timeline operate on their own schedule. TopVolk Construction has built and permitted ADU projects across north King County since 2017, with Vladislav Volkov on-site at every milestone — no project managers filtering communication, no sales staff handling estimates. A Mitsubishi Electric mini-split handles heating and cooling efficiently in a 500–700 sq ft unit; pairing it with a Navien tankless water heater keeps the mechanical package code-compliant while controlling the tenant's monthly utility costs. Call (206) 591-1096 to walk your lot with someone who has pulled these permits before.

localContext: |
  Bothell's residential fabric spans two primary zip codes — 98011 covers the older downtown core, North Creek, and the neighborhoods closest to the Sammamish River corridor, while 98021 picks up newer development east toward Woodinville and south toward Kenmore. Most of the buildable lots for DADUs sit in 98011, where 1970s and 1980s ranch-style and split-level homes on 7,000–10,000 sq ft lots often have enough rear yard depth to clear the city's 5-foot setback requirement without much difficulty. Canyon Park, closer to SR-522, carries a layer of 1990s–2000s construction where attached garage conversions to AADUs are more common — those projects skip much of the foundation work and utility trenching that a freestanding structure requires, though they still need full MEP rough-in and an energy code compliance analysis. King County's FAR and lot coverage rules apply to unincorporated parcels, but most Bothell addresses fall under city zoning, which sets a 24-foot height limit for DADUs. Seattle's climate reality — 37-plus inches of rain per year, concentrated October through May — makes proper vapor barriers and subfloor drainage essential in any below-grade ADU conversion, especially basement projects in North Creek homes where soils drain inconsistently.

commonProblems:
  - title: "DADU vs. Attached ADU vs. Basement Conversion: Which One Pencils Out?"
    description: |
      Choosing between a detached ADU, attached ADU, or basement conversion shapes every other decision — budget, timeline, rental income ceiling, and construction complexity. A new 600 sq ft DADU in a Bothell backyard typically runs $180,000–$240,000 all-in, covering permit fees, foundation, framing, MEP rough-in, R-49 ceiling insulation, and finish work. An attached garage conversion on a Canyon Park home from the 1990s can come in at $90,000–$140,000 because the slab, walls, and roof already exist — you trade square footage and ceiling height for a lower entry cost. Basement conversions in older 98011 homes require egress windows meeting IRC net clear opening minimums, careful vapor barrier installation, and often a DriCore subfloor panel system to manage moisture intrusion that's a genuine problem in PNW crawlspace-adjacent basements. Near UW Bothell campus, a finished 600 sq ft DADU typically rents for $1,700–$2,100 per month — that income stream changes the payback math considerably.

  - title: "Utility Separation: Shared vs. Separate Connections Under Bothell's Rules"
    description: |
      Northshore Utility District serves most of 98011, and their capacity verification process kicks in whenever an ADU is added to an existing service connection. Shared utility connections are permitted under Bothell's current ADU code, but the district requires documentation that the existing water and sewer lateral can handle the added load. Sewer laterals in 1970s–80s North Creek homes are often original clay pipe — they fail video inspection when the ADU permit is pulled, which turns a routine permit step into a $6,000–$12,000 lateral replacement before a single footing is poured. A separate utility lateral from the street runs $8,000–$15,000 depending on trench distance and soil conditions, but it gives the tenant a metered connection and eliminates future billing disputes between units. Electrical sub-panel work runs through Puget Sound Energy for the utility hook-up and through Bothell's permit center for inspection; homes built before 1990 in this area frequently need a 200-amp service upgrade before the ADU sub-panel load is added.

  - title: "Bothell Permit Timeline: What the Plan Review Process Actually Looks Like"
    description: |
      Bothell's Planning & Development Services handles ADU permits independently from Seattle SDCI and King County DPER — the application goes to the city, not to a county agency. For a new DADU requiring structural drawings and engineered plans, budget 8–14 weeks for plan review on the first clean submission; a resubmittal cycle after corrections adds another 4–6 weeks to that clock. Pre-approved ADU plan sets aren't currently offered through Bothell, so a full construction drawing package stamped by a licensed Washington State engineer or architect is required before permit issuance. WA HB 1337 removed the owner-occupancy requirement for ADUs statewide in 2024, meaning both the main house and the ADU can be rented simultaneously — but the permit still requires full structural, mechanical, and energy code compliance. TopVolk Construction is a WA Licensed Contractor with 100-plus projects completed since 2017; Vladislav Volkov coordinates the permit submittal directly and manages the inspection schedule from rough-in through final, so you're not running a parallel paperwork track on your own.

  - title: "ADU Construction Costs in Bothell: What Moves the Number Up or Down"
    description: |
      A fully permitted DADU in Bothell — slab or pier foundation, standard framing, LVL beam at the main header opening, Hardie cement-board siding, and a basic kitchen package — typically runs $175,000–$235,000 in current pricing. Finish level shifts that range: Bosch appliances and quartz countertops add $8,000–$15,000 over builder-grade; a Mitsubishi Electric mini-split adds $3,500–$5,000 upfront but reduces the tenant's heating costs and satisfies tightening energy code requirements. Sloped lots in North Creek add cost — you're either stepping the foundation or importing fill, and neither option is inexpensive once grading and drainage are factored in. The ROI calculation in Bothell holds up well: median 1BR rents near downtown run $1,700–$2,100 per month, meaning a $200,000 DADU can generate a gross annual yield of 10–12% before operating expenses. TopVolk provides line-item quotes with no vague ranges — what appears in the estimate is what gets built.

  - title: "Structural Considerations in Bothell's 1965–1985 Ranch and Split-Level Homes"
    description: |
      Ranch homes and split-levels built throughout 98011 between 1965 and 1985 weren't engineered with additions or attached ADUs in mind. An attached ADU over a garage or beside the main structure frequently exposes undersized rim joists, inadequate blocking between floor bays, or posts that were sized only for single-story loads. A site-specific structural assessment before drawing plans identifies whether the existing framing can support an addition or whether an LVL beam and PSL post package needs to be engineered in. Sister joists, new blocking, and a proper ledger board connection to the existing structure aren't optional details — they appear on the stamped drawings and get inspected at rough-in. PT lumber is required for all framing within 6 inches of grade or in direct contact with concrete, a standard that surfaces at every final inspection in this area. Bothell doesn't see the same freeze-thaw cycle as North Bend or Enumclaw, but footings still need to be set below frost depth — that's how a project avoids failing its foundation inspection.

faq:
  - q: "How quickly can you get to Bothell for an ADU consultation?"
    a: |
      Bothell sits about 18–20 miles northeast of Seattle via I-405 or SR-522 — typically a 25–40 minute drive depending on time of day, which is manageable for site visits, permit coordination, and inspection attendance. For an initial on-site consultation, scheduling usually opens within 3–5 business days of your call. The full ADU timeline — site visit, drawings, Bothell plan review, construction, and final inspection — runs roughly 5–7 months for a new DADU from start to finish. Call (206) 591-1096 to set up a free on-site walkthrough; Vladislav will assess your lot, discuss your options between DADU, AADU, and basement conversion, and give you a realistic project scope before anything is committed.

  - q: "What does ADU construction cost in Bothell, WA?"
    a: |
      A detached ADU in Bothell — 500–700 sq ft, slab foundation, Hardie cement-board siding, standard finishes — typically runs $170,000–$240,000 all-in, including permit fees, engineering drawings, MEP rough-in, and site restoration after utility trenching. Attached garage conversions start lower, around $85,000–$135,000, because the structural shell already exists. What pushes the number up: a sloped lot requiring a stepped foundation, premium finishes like Bosch appliances or semi-custom cabinetry, a separate utility lateral from the street, or a main panel upgrade. TopVolk provides detailed line-item quotes with no broad ranges — call (206) 591-1096 or schedule a free on-site estimate to get actual numbers tied to your specific property and lot conditions.

  - q: "Do I need a permit for ADU construction in Bothell, and who processes it?"
    a: |
      All ADU construction in Bothell requires a building permit through the city's Planning & Development Services department — this is separate from Seattle SDCI and King County DPER. Structural drawings stamped by a licensed Washington State engineer or architect are required for any new DADU; plan review runs 8–14 weeks on a clean first submission. Inspections occur at foundation, rough-in (framing, mechanical, electrical, plumbing), and final — a certificate of occupancy is issued after the final inspection passes. TopVolk Construction is a WA Licensed Contractor that prepares the permit package, manages the submittal, and coordinates the inspection schedule from start to finish. Vladislav Volkov handles that process directly — there's no third-party permit expediter added to your invoice.

  - q: "Can an ADU share utilities with the main house, or does it need separate connections?"
    a: |
      Shared utility connections are allowed under Bothell's current ADU rules — a separate water or sewer lateral to the street is not automatically required. Northshore Utility District does require a capacity verification before approving a shared connection, and original 1970s–80s clay sewer laterals throughout 98011 often fail video inspection when an ADU permit is pulled, forcing a lateral replacement that runs $6,000–$12,000 before construction begins. If the existing lateral passes inspection, you save meaningful trenching cost. Electrical separation is typically handled through a sub-panel with its own meter base, coordinated with Puget Sound Energy. Getting clarity on the utility scenario early — before drawings are finalized — is one of the most effective cost-control moves in any Bothell ADU project.

  - q: "What warranty does TopVolk provide on ADU construction in Bothell?"
    a: |
      TopVolk Construction backs all ADU work with a one-year workmanship warranty covering framing defects, finish work, and installation quality. Material warranties pass through from manufacturers — Hardie cement-board siding carries a 30-year limited warranty, Mitsubishi Electric mini-split systems carry a 12-year parts warranty when registered, and engineered lumber components like LVL beams carry standard manufacturer coverage. Washington State RCW 64.50 also provides an implied warranty of habitability on new construction, with structural defects covered for up to six years under state law. Beyond warranty language: if Vladislav commits to a completion date and the project runs past it, there is a penalty clause written into the contract. That is a financial commitment with actual teeth — not a talking point on a website.

  - q: "Does TopVolk serve areas near Bothell for ADU construction?"
    a: |
      From Bothell, TopVolk regularly works on ADU projects in Kenmore, Kirkland, Woodinville, Redmond, Lynnwood, Mountlake Terrace, and Shoreline. Each jurisdiction runs its own permit process — Kirkland and Redmond have independent permit centers, some Lynnwood addresses fall under Snohomish County PDS, and unincorporated King County parcels go through King County DPER. New project consultations typically open within 2–3 weeks. Call (206) 591-1096 — Vladislav will confirm your address is in the current service area and walk you through what the permit jurisdiction and plan review timeline look like for your specific lot.