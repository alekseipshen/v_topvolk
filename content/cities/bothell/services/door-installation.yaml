title: "Bothell Door Installation — Weathertight Upgrades for PNW Homes"

intro: |
  Canyon Park subdivisions along 35th Ave SE pack a lot of late-1980s and
  1990s tract builds — the type where the original entry door was a pre-hung
  steel 6-panel unit with builder-grade foam weatherstripping that's been
  slowly compressing for two or three decades. Once that seal loses contact,
  the door feels fine to open and close, but the air barrier is gone and
  Pacific Northwest rain — roughly 37 inches a year, October through May —
  starts working behind the brick mold. Bothell Landing, about two miles west
  near Main Street, has older Craftsman and mid-century homes where a door
  swap gets more involved: non-standard rough openings, original casing
  profiles worth matching, and sometimes a threshold that's dropped with the
  floor over time. TopVolk Construction handles door installations across
  Bothell's 98011 and 98021 zip codes, from Pella fiberglass entry door
  replacements in North Creek to patio door conversions in the neighborhoods
  off Beardslee Boulevard. Call (206) 591-1096 to set up a free on-site
  estimate with Vladislav directly.

localContext: |
  Bothell's housing stock runs in two distinct bands. The older grid near
  downtown — zip code 98011 — has homes from the 1950s through 1970s:
  split-levels, ranchers, and some early Craftsman conversions where door
  frames have settled with the foundation and rough openings are rarely a
  clean 36 by 80 anymore. The North Creek and Canyon Park areas (98021) are
  mostly 1985-2002 tract construction, where exterior doors are still the
  original pre-hung units with vinyl brick mold that's UV-degraded and
  cracking at the corners. Bothell's proximity to the Cascades foothills
  means occasional frost events that expand door frames in winter and make a
  previously flush door drag — a problem less common in lower-elevation
  Seattle neighborhoods. HOA presence is moderate across Canyon Park
  communities, with covenants limiting entry door colors to pre-approved
  palettes; matching a new Therma-Tru or Masonite unit to the existing
  exterior color scheme is a real spec decision, not an afterthought. Permit
  jurisdiction here falls under the City of Bothell's own permit center —
  not King County DPER — since Bothell is fully incorporated.

commonProblems:
  - title: "Entry Door Air Seal Failure on 1990s Canyon Park Tract Homes"
    description: |
      The original weatherstripping on late-1980s and 1990s pre-hung steel
      doors is typically a compression foam bulb that hardens and gaps within
      15-20 years. On Canyon Park homes in the 98021 zip code, this shows up
      as a visible light gap at the threshold and cold drafts along the hinge
      jamb side in January. The threshold itself — usually an aluminum saddle
      with a vinyl sweep — gets worn flat from foot traffic and stops making
      contact with the door bottom. Replacing the weatherstripping alone is a
      short-term fix if the door has also sagged; a full entry door
      replacement with a Pella 150 Series fiberglass unit, proper pan
      flashing under the sill, and a new adjustable aluminum threshold
      addresses the root cause. Budget $1,200-$2,400 installed for a
      standard 36-inch single entry door, depending on glass options and
      casing profile.

  - title: "Sliding Patio Door Track Failure and Upgrade to French or Multi-Slide Systems"
    description: |
      Bothell's older split-level homes — particularly the 1960s-1970s
      builds near downtown off SR-527 — frequently still have
      aluminum-frame sliding patio doors with worn nylon rollers that skip
      off the bottom track. The track itself corrodes from condensation and
      debris, and replacement rollers for 40-year-old frames are
      increasingly hard to source. Rather than a like-for-like slider
      replacement, many homeowners in the Moorlands and Country Village
      neighborhoods convert to a Milgard Tuscany Series French door or a
      multi-slide unit, which eliminates the problematic bottom track wheel
      assembly entirely. The rough opening typically needs minor header
      work — sometimes an LVL beam if removing a cripple stud — plus new
      drywall returns on the interior. Full replacement with a Milgard French
      door runs $3,500-$6,500 installed, including rough-in adjustments and
      interior casing.

  - title: "Exterior Door Flashing Failures Leading to Rot in the Rough Opening"
    description: |
      This is the most common structural problem TopVolk finds during door
      replacements in Bothell. Original installations on 1980s and 1990s
      pre-hung units often used face-stapled housewrap with no pan flashing
      under the sill — adequate in a dry climate, but Bothell's prolonged
      rainy season consistently finds the gap between brick mold and siding.
      Once moisture gets into the rough opening, the king studs and jack
      studs rot from the base up, and the door has been holding itself in
      a compromised frame for years. Proper reinstallation means stripping
      back Hardie or vinyl siding at the corners, installing a sloped sill
      pan with end dams, integrating self-adhered flashing tape into the
      weather-resistive barrier, and using pressure-treated (PT) lumber for
      any replaced framing members. TopVolk is a WA Licensed Contractor
      and coordinates the City of Bothell rough-in inspection before
      drywall close-up on any structurally adjacent work.

  - title: "Smart Lock Integration — Backset Compatibility and Lock Block Prep"
    description: |
      August Wi-Fi Smart Lock Pro and Schlage Encode are the two most
      common requests on Bothell door installations, particularly from North
      Creek homeowners who want keyless entry tied to a home automation
      system. Both locks require a specific backset — 2-3/8 inch or 2-3/4
      inch — and a properly reinforced strike plate location. Older doors
      sometimes have the deadbolt and knob bored too close together, which
      won't clear the smart lock chassis. Specifying the correct factory
      prep when ordering a new fiberglass or steel door handles this cleanly;
      Therma-Tru pre-hung units ship with a reinforced lock block in the
      stile. Retrofitting onto an existing door sometimes requires
      reboring — a jig-controlled operation that adds $150-$300 to the
      installation cost. If you're running a Lutron or Control4 system,
      Vladislav coordinates the lock spec with your integrator before
      ordering to confirm protocol compatibility.

  - title: "Interior Door Swing Changes and Casing Match During Remodels"
    description: |
      Kitchen and bathroom remodels in Bothell's 1990s and 2000s tract
      homes regularly expose interior door swing conflicts — a door that now
      hits the toilet after a vanity moves, or a bedroom door that clips a
      new closet system. Reversing a swing is a rough-in change: hinge
      mortises shift to the opposite jamb, the strike plate relocates, and
      the casing on both sides gets re-set to the new reveal. For
      whole-house remodels in the North Creek area, matching existing casing
      profiles matters — Bothell's 1990s builds typically have a 2-1/4 inch
      colonial casing that's been discontinued at most lumber yards, so
      sourcing a close match or milling a custom profile becomes part of the
      scope discussion upfront. A standard interior pre-hung door with
      hardware and casing runs $400-$800; larger quantities on a full-house
      remodel reduce the per-door cost meaningfully.

faq:
  - q: "How fast can you get to Bothell for a door installation estimate?"
    a: |
      Bothell is a straightforward drive — I-405 north or SR-522 east
      depending on traffic, typically 20-35 minutes from Seattle's north
      end. Vladislav does all estimates personally, so you're talking to the
      contractor on-site, not a commissioned closer. Scheduling a free
      on-site estimate usually happens within 3-5 business days; peak season
      from April through September can push that to a week out. Once a
      project is scoped and permitted, installation on a standard entry door
      takes 1-2 days; a full patio door conversion with rough-in work runs
      3-4 days. Call (206) 591-1096 and Vladislav picks up directly — no
      call center routing.

  - q: "What does entry door installation typically cost in Bothell?"
    a: |
      A standard 36-inch fiberglass or steel entry door, installed with new
      weatherstripping, adjustable threshold, and exterior casing, runs
      $1,200-$2,500 in Bothell depending on the door line and glass options.
      Pella and Therma-Tru mid-range fiberglass units land in the middle of
      that range. A full patio door conversion — removing a sliding unit and
      installing a Milgard French door — runs $3,500-$7,500 installed,
      including any LVL header modification if the rough opening needs
      widening. Interior doors are $400-$800 each with hardware and casing.
      Vladislav provides line-item quotes with specific material callouts
      after the on-site visit — no vague ranges, no surprises at rough-in.
      Call (206) 591-1096 for a free estimate.

  - q: "Does door installation in Bothell require a city permit?"
    a: |
      Straightforward replacements — same size, same location, no structural
      changes — generally don't require a permit from the City of Bothell's
      permit center. If the project involves enlarging the rough opening,
      cutting a new door opening, or modifying a header, a building permit
      is required. Bothell processes residential permits through its online
      portal; plan review for a simple structural modification typically
      takes 2-4 weeks. TopVolk, as a WA Licensed Contractor, handles permit
      applications as part of the project scope. If the estimate reveals
      structural work, that gets flagged immediately and the permit fee is
      included in the line-item quote — no separate paperwork hassle for
      the homeowner.

  - q: "Do you install smart locks and keypad entry systems alongside a new door?"
    a: |
      Yes — TopVolk regularly integrates August Wi-Fi Smart Lock Pro and
      Schlage Encode hardware on new entry door installations across Bothell.
      The key is specifying the correct backset and lock block in the stile
      when the door is factory-ordered, which gets handled at the spec stage
      before anything ships. On existing doors, retrofitting a smart lock
      sometimes requires reboring if the existing prep doesn't fit the new
      chassis — a 30-45 minute add-on. Both August and Schlage Encode
      support Wi-Fi and Z-Wave home automation integration. If you're
      running a Lutron or Control4 system, the lock spec gets coordinated
      with your integrator before the order is placed to confirm protocol
      compatibility.

  - q: "How long do new entry doors last in Bothell's climate, and what's the warranty?"
    a: |
      Fiberglass doors from Pella, Therma-Tru, and Masonite carry a limited
      lifetime warranty on the door slab against warping, cracking, and
      delamination. Hardware warranties vary: Schlage and Kwikset typically
      cover finish for 5-10 years and mechanical function for life. In
      Bothell's climate, the biggest lifespan factor isn't the door slab
      itself — it's flashing and casing integration quality. A properly
      flashed door on a north-facing elevation will outlast one installed
      without a sill pan by 20+ years in this kind of sustained moisture
      exposure. TopVolk's workmanship carries a three-year labor warranty; any
      installation issue that surfaces within that window gets addressed
      without a service call fee.

  - q: "Do you cover neighborhoods near Bothell, and how far out is scheduling?"
    a: |
      TopVolk covers the full Seattle metro — Kenmore and Woodinville are
      effectively adjacent to Bothell, and we work regularly in Kirkland
      (Juanita, Bridle Trails), Redmond (Education Hill), and Sammamish
      Plateau. Some unincorporated pockets east of Bothell toward the
      Snoqualmie Valley fall under King County DPER jurisdiction rather than
      a city permit center — that distinction matters for permit routing and
      we handle it either way. New project scheduling typically opens 2-4
      weeks out; permit-required work adds 2-6 weeks depending on plan
      review time. Emergency situations — a door that won't latch after
      storm damage — get prioritized. Call (206) 591-1096 to talk through
      your timeline with Vladislav.