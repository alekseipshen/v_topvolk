  - q: "What does foundation repair typically cost in Bothell?"
    a: |
      It varies significantly based on what's actually failing. Post-and-pier leveling
      on a 1,200–1,600 sq ft home runs $4,500–$9,000. Epoxy or polyurethane crack
      injection for concrete perimeter cracks is typically $1,800–$4,200. A full
      seismic retrofit with mudsill anchor bolts and cripple wall shear panels lands
      in the $6,000–$14,000 range depending on perimeter footage and crawlspace access.
      Crawlspace encapsulation with a 20-mil vapor barrier and dehumidifier runs
      $3,500–$7,500. These ranges come from actual projects TopVolk has completed in
      Bothell and across King County since 2023 — not inflated allowances. Call
      (206) 591-1096 to schedule a free on-site estimate; you get a written, line-item
      quote with no vague scope language.

  - q: "Do I need a permit for foundation repair work in Bothell?"
    a: |
      Depends on the scope. Crack injection, shimming existing posts, and replacing a
      failed vapor barrier are typically unpermitted maintenance work. Anything
      structural — replacing piers, adding mudsill anchor bolts, installing shear wall
      plywood, or modifying load-bearing elements — requires a structural permit from
      City of Bothell Building Division. Work in adjacent unincorporated King County
      areas falls under King County DPER instead. Structural permits require
      engineer-stamped drawings, and plan review runs approximately 3–6 weeks for
      residential projects. TopVolk is a WA Licensed Contractor and manages the full
      permit workflow: drawing coordination with the structural engineer, submittal,
      and scheduling both rough-in and final inspections. You don't have to chase
      the building department yourself.

  - q: "Can you install helical piers for severe foundation settling in Bothell?"
    a: |
      Yes. For homes where shimming existing posts isn't sufficient — typically when
      differential settlement exceeds two to three inches or original piers have
      completely failed — helical pier underpinning is the right path. Helical piers
      (also called screw piles) are steel shafts with helical bearing plates that are
      torque-driven past problem soils to stable bearing depth below the frost line.
      Chance (Hubbell) makes the residential pier systems we typically spec in King
      County — they are engineered for underpinning loads and rated for the soil
      profiles we see near North Creek. Each pier gets a steel bracket that transfers
      the foundation load to the shaft; the system can be loaded immediately after
      installation. Permit-required work in Bothell — structural drawings needed.
      Per-pier installed cost typically runs $1,200–$2,000; most homes need 8–16 piers
      for full underpinning. Call (206) 591-1096 to discuss whether your situation
      calls for a helical pier assessment.

  - q: "What warranty does TopVolk offer on foundation repair work?"
    a: |
      TopVolk provides a written three-year workmanship warranty on all foundation repair
      work. If a leveled pier drops or an injected crack re-opens within that window,
      we come back and fix it at no cost — and that commitment is in the contract, not
      just a verbal assurance. Deadline penalties for missed schedule milestones are
      also written into the contract. Material warranties follow the manufacturer:
      Simpson Strong-Tie hardware carries its own manufacturer warranty, and
      CleanSpace vapor barrier products carry a 25-year transferable warranty. The
      most important long-term factor is drainage management — keep water directed
      away from the foundation perimeter, and properly executed structural repairs
      hold for decades. Seismic retrofit work is performed to current IRC code, and
      that code compliance has no expiration date.

  - q: "Does TopVolk cover Woodinville, Kenmore, and other cities near Bothell?"
    a: |
      Yes — Kenmore, Woodinville, Kirkland, and the unincorporated King County areas
