title: "Bothell Foundation Repair — Pier Leveling & Seismic Retrofit"

intro: |
  The Sammamish River bends through Bothell Landing Park at the edge of 98011, and the
  same low-lying ground that makes that corridor worth a Saturday walk makes it a problem
  for foundations nearby. Post-and-pier construction from the 1960s and 1970s — common
  in the residential blocks east of downtown Bothell and up into the Westhill neighborhood
  — was built on assumptions about soil bearing capacity that Bothell's wet seasons test
  every year. Forty-plus inches of annual rainfall between October and May keeps crawlspaces
  saturated, organic fill under concrete piers compresses over time, and a level floor
  slowly becomes a slope you feel every time you walk toward the back of the house. The
  Canyon Park corridor in 98012 has a different problem: poured concrete perimeter walls
  from the 1984–1995 building boom, now old enough that shrinkage cracks have been
  admitting water for three decades. TopVolk Construction LLC — owner-operated by Vladislav
  Volkov, WA Licensed Contractor — has handled post-and-pier leveling, seismic retrofit,
  sump pump installation, and epoxy crack injection across Bothell and King County since
  2023, 100+ projects completed. Vladislav shows up on-site. No sales staff, no
  middlemen.

localContext: |
  Bothell's King County residential core — zip codes 98011 and 98012 — covers most of
  the established housing that generates foundation calls. Homes in 98011 along the
  Sammamish River floodplain edge sit on soils with high organic content and variable
  bearing capacity; wet winters followed by dry summers create heave-then-settle cycles
  that crack perimeter foundations and push post-and-pier supports out of plumb. The
  98012 zip covers Canyon Park and the North Creek neighborhood — concrete perimeter
  walls with crawlspace framing, builder-grade vapor barriers that have long since
  deteriorated, and no sump pump provisions in a drainage basin that sees consistent
  groundwater infiltration from October through March. City of Bothell Building Division
  handles structural permits within city limits; anything involving mudsill replacement,
  shear wall installation, or pier replacement requires engineer-stamped drawings before
  work begins, and plan review typically runs 3–6 weeks. The North Creek valley's
  clay-heavy glacial soils retain water longer than sandy till, which means drainage
  redirection is often part of the solution — not just the structural repair itself.
  Addressing one without the other means the problem comes back in five years.

commonProblems:
  - title: "Post-and-Pier Settling Under 1960s–70s Westhill and Downtown Bothell Homes"
    description: |
      Homes built in the Westhill area and the older blocks near downtown Bothell between
      roughly 1962 and 1978 rely on wood post-and-pier foundations: 4×6 or 6×6
      Douglas-fir posts resting on individual concrete piers set in crawlspace soil.
      When groundwater erodes the soil under those piers — or organic fill slowly
      compresses — piers drop unevenly and the floor system sags. You feel it as a
      soft bounce mid-span, or a noticeable slope toward one exterior wall. The repair
      involves leveling and shimming existing posts using pressure-treated (PT) lumber
      shims and Simpson Strong-Tie adjustable post bases, or replacing failed piers
      entirely with new poured-concrete footings dug to stable bearing depth. Material
      and labor for a full crawlspace leveling on a 1,400 sq ft Bothell home typically
      runs $4,500–$9,000 depending on the number of piers affected and how much
      crawlspace access you have. Work is generally done in 2–4 days once materials
      are staged and any permit clearance is confirmed.

  - title: "Concrete Perimeter Cracks in 1980s–90s Canyon Park Foundations"
    description: |
      Canyon Park and the North Creek corridor (98012) filled in fast between 1984 and
      1995, and poured-concrete perimeter foundations from that era are now 30–40 years
      old. Shrinkage cracks that started hairline have widened to 1/8 inch or more after
      decades of freeze-thaw cycling and hydrostatic pressure from Bothell's clay soils.
      Water pushing through those cracks wets the rim joist, softens the mudsill, and
      creates conditions carpenter ants find hard to resist — which complicates the
      structural picture fast. Epoxy injection — pumped under pressure into cracks through
      a port-and-cap system — stops infiltration and restores compressive strength to
      the concrete wall. For cracks showing active differential movement, polyurethane
      foam injection is the better call since it stays flexible. Crack injection on a
      typical Bothell perimeter foundation with 6–12 active cracks runs $1,800–$4,200
      and takes one day. A structural engineer review is warranted if any crack is
      stepping (diagonal stair-step pattern) or wider than 3/8 inch.

  - title: "Seismic Retrofit — Mudsill Anchor Bolts and Cripple Wall Shear Panels"
    description: |
      Bothell sits roughly 25 miles from the Seattle fault zone and directly within the
      Cascadia Subduction Zone's regional influence. Homes built before 1994 generally
      lack the anchor bolts and cripple wall blocking required under current IRC seismic
      provisions, and City of Bothell Building Division requires a structural permit for
      any retrofit involving shear wall plywood installation or mudsill anchor bolt
      addition. The work means drilling into the existing mudsill and concrete foundation,
      installing Simpson Strong-Tie anchor bolts — typically 1/2" or 5/8" diameter spaced
      per engineer specification — and nailing 15/32" structural plywood to cripple walls
      with the required nailing schedule. Engineer-stamped drawings are required for
      permit submission; plan review at City of Bothell runs 3–6 weeks for residential
      structural work. TopVolk is a WA Licensed Contractor and coordinates directly with
      the structural engineer, submits the drawings, and schedules both rough-in and final
      inspections. Full seismic retrofit on a 1,600 sq ft Bothell home runs approximately
      $6,000–$14,000 depending on foundation perimeter and crawlspace height.

  - title: "Sump Pump Installation for High Water Table Near North Creek and the Sammamish River"
    description: |
      Homes within a quarter mile of North Creek or the Sammamish River floodplain — most
      of them in the 98011 zip — see standing water in their crawlspaces most winters.
      That's not a gutter problem. An interior French drain that channels groundwater
      to a sump pit, paired with a Zoeller or Wayne submersible sump pump with battery
      backup, is the correct long-term fix. The pit is cut into the crawlspace floor,
      gravel-bedded, and lined; the pump discharges to a daylight outlet well clear of
      the foundation perimeter. A battery backup unit — we typically install the Wayne
      WSS30VN combination primary-and-backup system — protects against power failure
      during the exact storms that cause flooding in the first place. Single-pump
      crawlspace installation in Bothell runs $2,800–$5,500 in materials and labor.
      Homes with persistent high-volume infiltration sometimes need two sumps or a full
      perimeter drain tile loop, which adds $1,500–$3,000. City of Bothell Building
      Division determines permit requirements based on whether you're breaking a concrete
      vapor barrier slab.

  - title: "Vapor Barrier Failure and Crawlspace Encapsulation in Bothell's Wet Seasons"
    description: |
      Most pre-2000 Bothell crawlspaces have the original 6-mil poly sheeting as a vapor
      barrier — some of it installed 40 years ago, torn up by pest control visits and
      plumbing repairs, and no longer doing anything useful. A failed vapor barrier lets
      ground moisture evaporate directly into the crawlspace, raising humidity high enough
      for condensation to form on cold floor joists in winter. Over time that moisture
      rots the rim joist and floor joists, causes mold on subfloor sheathing, and drops
      the insulation out of the joist bays entirely. The correct fix is full encapsulation:
      remove the old material, treat existing mold, install a 20-mil reinforced vapor
      barrier — we use CleanSpace or equivalent — sealed to the foundation walls with
      approved tape and mechanical fasteners, and add a Santa Fe Compact70 crawlspace
      dehumidifier if humidity readings stay elevated after sealing. Encapsulation on
      a 1,000 sq ft Bothell crawlspace runs $3,500–$7,500 depending on condition and
      access difficulty. Done once, done right, it stops the rot cycle for the life
      of the home.

faq:
  - q: "How fast can TopVolk get to Bothell for a foundation assessment?"
    a: |
      Bothell is a straightforward run from our operating area — SR-522 or I-405 gets
