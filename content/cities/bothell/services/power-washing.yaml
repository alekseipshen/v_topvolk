  - q: "Do I need a permit for power washing in Bothell?"
    a: |
      Power washing by itself doesn't require a permit from the City of Bothell or King
      County DPER. If the cleaning is part of a larger exterior scope — new Hardie siding
      installation, a deck rebuild, or an addition — those structural and cladding permits
      go through Bothell's permit center or through King County DPER for unincorporated
      parcels in the area. TopVolk Construction is a WA Licensed Contractor and handles
      permit applications for any structural work that follows the wash. For standalone
      cleaning, no paperwork is needed — just a 48-hour dry window after the clean before
      any stain or paint goes on.

  - q: "What PSI do you use on cedar decking versus concrete?"
    a: |
      Cedar decking gets cleaned at 500-800 PSI max with a 40-degree fan tip, and the
      real work happens during the pre-treatment dwell step — the sodium hypochlorite
      solution does the biological kill before the rinse water ever contacts the wood.
      Going above 800 PSI on cedar raises the grain and creates fuzzing that traps
      additional moisture over time. Concrete driveways and pavers handle 2,500-3,500
      PSI comfortably when run through a rotary surface cleaner attachment, which
      distributes pressure evenly and eliminates stripe marks. Hardie siding sits in the
      middle: 300-600 PSI, wide fan tip, never a turbo nozzle near the joint seams. Hot
      water units are used specifically for petroleum staining on concrete; cold water
      handles biological cleaning on wood and painted surfaces.

  - q: "How long does power washing stay clean in Bothell's climate?"
    a: |
      A soft-washed house in 98011 or 98021 realistically stays clean 12-24 months before
      bio-staining returns visibly, depending on canopy coverage and sun exposure.
      North-facing surfaces re-colonize faster — sometimes showing early algae within 8-10
      months under heavy Douglas-fir overhang. Post-treating with a diluted sodium
      percarbonate solution after the main wash extends the clean window by disrupting
      spore regrowth. Decks that receive stain within a week of cleaning hold up longer
      because the stain film resists moisture uptake. Most Bothell homeowners on a
      maintenance schedule bring us back every 18-24 months for the house exterior and
      every 2-3 years for cedar decks ahead of restaining.

