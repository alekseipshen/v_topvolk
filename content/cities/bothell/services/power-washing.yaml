title: "Bothell Power Washing — Moss, Cedar Decks & Concrete Done Right"

intro: |
  Fourteen inches of rain hit the 98011 zip code between October and February most years,
  and the Douglas-fir canopy along the North Creek corridor holds moisture long after the
  rain stops. Cedar decks in Canyon Park neighborhoods — especially those with north or
  northeast exposure — can sit wet for weeks at a stretch. By April, you're dealing with
  established moss colonies on the deck boards, black algae streaking down Hardie
  cement-board siding, and concrete driveways that have gone from gray to green-gray.
  Soft-washing with a sodium hypochlorite solution handles the biology; the follow-up
  rinse with a rotary surface cleaner attachment clears the visual buildup without raising
  the wood grain or striping the concrete. Most Bothell homeowners we work with want
  surfaces clean enough to hold a fresh coat of Armstrong Clark stain on the deck or a
  new exterior paint job on the siding — not just cosmetically rinsed and left to
  re-colonize by fall.

localContext: |
  Canyon Park (98021) and the older residential pockets near Bothell Landing and Blyth
  Park (98011) present two different cleaning situations. The Canyon Park corridor was
  built out mostly in the late 1980s through the mid-1990s — large cedar or composite
  decks, attached three-car garages with broad concrete aprons, and painted Hardie or
  T1-11 siding that in many cases has never had a professional wash. Organic staining from
  overhanging firs and big-leaf maples is year-round; oil and tire marks on the concrete
  aprons are standard. The older Bothell Landing-area streets have more mature landscaping,
  tighter setbacks, and surfaces that have cycled through multiple weathering seasons.
  Concrete walkways in that zone often show efflorescence — white calcium deposits that
  form when water pulls minerals through the slab — layered on top of the usual moss and
  algae. Both areas sit in PNW climate conditions where north and northeast-facing surfaces
  get almost no direct sun from October through March, which means biological growth is
  essentially continuous unless surfaces are treated and post-treated properly.

commonProblems:
  - title: "Moss and Algae Colonies on North-Facing Cedar Deck Boards"
    description: |
      Cedar deck boards on the north side of a Bothell house can show visible green
      colonization by November and develop softened surface fiber by late February. Moss
      rootlets penetrate the wood cells and hold moisture, which accelerates checking and
      gray oxidation faster than weathering alone would. Pressure washing without a
      pre-treatment step just relocates the biology — it doesn't kill it. The correct
      sequence is a 2-3% sodium hypochlorite solution applied with a downstream injector,
      dwell time of 10-15 minutes, then a low-PSI rinse using a 40-degree fan tip to avoid
      raising the grain. After the surface dries — 48-72 hours in Bothell spring weather —
      an oxalic acid-based wood brightener opens the grain for stain penetration before
      any Armstrong Clark or Defy coating goes down. Full deck cleaning and stain prep on
      a 400 sq ft deck runs $250-$400 depending on access and moss density.

  - title: "Hardie Siding Bio-Staining and Chalking Before Exterior Repaint"
    description: |
      Hardie cement-board holds paint well — but it also holds moisture in the surface
      texture, especially on north-facing elevations or under tree drip lines. Canyon Park
      homes with original late-1980s Hardie installations are showing heavy chalking,
      oxidation, and green bio-stain from moss spores lodged in the texture profile.
      Painting over that surface fails fast: adhesion drops, peeling shows up within 12-18
      months, and any moisture trapped under the new coat causes blistering at the joint
      seams. Soft-washing at 300-500 PSI with a downstream-injected Simple Green Pro HD
      solution removes the bio-load and chalk without forcing water into the joints or
      damaging the face. Allow 3-5 dry days before primer application — longer in shoulder
      season when Bothell's humidity stays above 80% overnight. Siding wash for a standard
      two-story home runs $300-$500 depending on linear footage and whether gutters are
      included in the scope.

  - title: "Concrete Driveway and Garage Apron Cleaning — Oil, Tire Marks, Efflorescence"
    description: |
      Three-car garage aprons in Canyon Park see heavy use, and concrete is porous enough
      that motor oil and brake fluid soak in within minutes. Cold-water pressure washing
      pushes surface grime but won't emulsify petroleum staining — you need hot water at
      180°F or above combined with a sodium hydroxide-based degreaser pre-treatment and
      adequate dwell time. After that step, a rotary surface cleaner running at 3,000-3,500
      PSI delivers even cleaning without the stripe marks a standard wand leaves behind.
      Efflorescence on older slabs near the Bothell Landing area responds to a carefully
      applied dilute hydrochloric acid wash post-clean — it dissolves the calcium carbonate
      without etching the aggregate surface. Sealing afterward with a penetrating siloxane
      product extends the clean period considerably in a climate that delivers 37+ inches of
      annual rainfall. A standard two-car apron plus front walkway runs $150-$280; add
      $50-$100 for hot-water equipment and degreaser on oil-stained surfaces.

  - title: "Cedar and Composite Fence Cleaning Before the 3-5 Year Stain Cycle"
    description: |
      Board-on-board cedar fencing in Bothell typically needs cleaning and restaining every
      3-5 years, and by year three the surface is gray, moss-patchy on the shaded side, and
      showing surface checking in the exposed boards. Applying stain over gray oxidized wood
      doesn't work — the stain sits on top of the oxidation layer rather than penetrating the
      fiber, and it peels within a season. The cleaning process for cedar fence boards:
      pre-wet, apply Krud Kutter Deck and Fence Cleaner at 1:4 dilution, dwell 10 minutes,
      pressure wash at 800-1,000 PSI with a 25-degree tip held 12-18 inches from the surface.
      Follow with an oxalic acid brightener to open the grain before staining. For Trex or
      TimberTech composite fencing, drop to 1,000-1,500 PSI and skip the brightener —
      composite doesn't absorb it and you risk surface abrasion at higher pressure. A 150
      linear foot cedar fence cleaning runs $200-$350; stain-ready dry time is 48-72 hours
      in summer, longer in October through April shoulder season.

  - title: "Patio and Concrete Paver Restoration — Organic Buildup and Joint Sand Loss"
    description: |
      Concrete pavers around Bothell patios accumulate black algae and lichen in the joint
      lines within two to three wet seasons, and moss gets established on the flat face
      surface fast under any canopy shade. The cleaning approach matters here: too much PSI
      and you blow out the polymeric joint sand, which then needs to be swept back in and
      re-compacted before you can seal the surface. Soft-washing the paver field first with
      a 1.5% sodium hypochlorite solution kills the biology cleanly; a rotary surface
      cleaner running at 2,000-2,500 PSI then rinses the dead organic material without
      disturbing the joints. After cleaning and drying, fresh joint sand gets swept into any
      voided lines, and the surface is sealed with a Techniseal penetrating sealer — wet-look
      or matte depending on the homeowner's preference. Full patio restoration on a 300-400
      sq ft paver patio runs $350-$600 depending on access, lichen density, and whether joint
      sand replacement is in scope. Sealer application adds $100-$200.

