title: "Bothell General Contracting — Permits Across King & Snohomish"

intro: |
  Canyon Park in zip 98021 sits on a county line most homeowners miss until they're 
  filing a permit — one side routes through City of Bothell Building Division, the 
  other through Snohomish County PDS. TopVolk Construction has navigated 100+ 
  projects across both jurisdictions since 2023, including full kitchen remodels 
  with Bosch and Thermador packages where the original 1980s panel needed a full 
  upgrade before the new induction range could land. Vladislav Volkov handles the 
  jurisdiction question on day one, not after the permit rejection.

localContext: |
  Canyon Park and North Creek — zip codes 98011 and 98021 — are dense with 
  1985-2000 colonial two-stories and split-levels. Builder-grade framing from that 
  era holds up, but was never engineered for open-concept layouts. Pulling a 
  load-bearing wall between the kitchen and great room usually means an LVL beam 
  sized by a structural engineer, new joist hangers, and blocking throughout. 
  Crawlspaces in older 98011 homes frequently lack adequate vapor barriers — 
  subfloor moisture shows up during demo, not before.

commonProblems:
  - title: "Permit Jurisdiction Split — King County vs. Snohomish County PDS"
    description: "Bothell is one of the few cities in the metro where a renovation 
      can fall under two separate permit systems depending on which block you're on. 
      City of Bothell Building Division handles incorporated areas; Snohomish County 
      PDS covers unincorporated pockets. Filing with the wrong AHJ resets your 
      plan review clock entirely — four to eight weeks lost. TopVolk confirms 
      jurisdiction before the first drawing goes out."

  - title: "Structural Surprises During Demo in 1980s-90s Construction"
    description: "Canyon Park colonials from 1988-1998 often have shear wall panels 
      hidden behind drywall that don't appear on any original plan — because original 
      plans were never submitted to the county. Demo day exposes a PSL post or rim 
      joist that the layout depended on. Reframing with a properly sized LVL beam 
      and sister joists adds cost and time; catching it in the scope phase costs 
      nothing. Deadline penalties written into our contracts cover delays we cause, 
      not structural surprises — but we budget a contingency line for exactly this."

  - title: "Multi-Trade Scheduling Breakdown on $100K+ Projects"
    description: "Rough-in inspection for MEP (mechanical, electrical, plumbing) has 
      to happen before drywall hang — that sequence is non-negotiable per IRC. In a 
      Bothell full-house remodel, HVAC for a Mitsubishi mini-split system, a Navien 
      tankless water heater rough-in, and electrical panel upgrade often need to 
      land within the same two-week window to avoid a three-month domino delay. 
      Vladislav coordinates the sub schedule directly — no project manager in the 
      middle relaying messages."

faq:
  - q: "How fast can you get to Bothell for a General Contracting consultation?"
    a: "Bothell is 25 minutes from our base without traffic — SR-522 or I-405 
      depending on the day. We can typically schedule an on-site walkthrough within 
      3-5 business days. Call (206) 591-1096 to set it up. Vladislav comes out 
      personally, not a sales rep."

  - q: "Do you work in both the King County and Snohomish County parts of Bothell?"
    a: "Yes — we pull permits through City of Bothell Building Division, King County 
      DPER, and Snohomish County PDS depending on the parcel. We confirm jurisdiction 
      before the design phase so you're not re-filing after plan review. Same applies 
      to neighboring Kenmore (King County) and unincorporated Mill Creek areas."

  - q: "What does a whole-house remodel in Bothell typically cost and how long does it take?"
    a: "A full kitchen-plus-two-bath remodel with Bosch appliances and semi-custom 
      cabinets in a 98021 colonial typically runs $120K-$190K depending on scope. 
      Timeline from permit submittal to final inspection: 4-6 months. That includes 
      4-8 weeks for plan review, 6-8 weeks of rough-in and finish work, plus the 
      blue tape walkthrough and punch list. We quote line-item — no vague ranges. 
      Call (206) 591-1096 or schedule a free on-site consultation to get a real number."