title: "Bothell Deck Installation — Composite and Cedar in 98011 Rain"

intro: |
  The Sammamish River Trail runs through the middle of Bothell, and the homes
  backing up to North Creek corridors in 98011 see north-facing decks stay wet
  from October through April. Cedar grays and moss colonizes balusters within
  two or three seasons out here. Trex and TimberTech capped composite have
  become the default for homeowners in this part of King County — not because
  cedar can't work, but because the maintenance math stops penciling out after
  five or six Pacific Northwest winters.

localContext: |
  Bothell's residential neighborhoods span 1970s split-levels near Wayne Golf
  Course to newer construction along the Canyon Park corridor in 98011. The
  older blocks are where most ledger problems show up — decks attached directly
  to the rim joist with no Z-flashing, letting water infiltrate the band board
  for 30-plus years. King County DPER handles permits for unincorporated parcels;
  homes inside Bothell city limits go through Bothell Community Development, which
  runs plan review on ledger details, footing depth, and guardrail design.

commonProblems:
  - title: "Ledger Rot Behind Band Board on 1970s–80s Attached Decks"
    description: >
      Older homes in the 98011 zip frequently have ledger boards nailed to the
      rim joist without flashing or an air gap. Water tracks behind the ledger,
      saturates the band board, and the structural connection softens over time —
      often with no visible sign from outside. Correct repair means stripping the
      deck, sistering or replacing the rim joist, then re-attaching with proper
      Z-flashing, sill plate tape, and Simpson Strong-Tie LUS joist hangers
      sized to the new ledger.
  - title: "Footing Depth and Frost Line in Canyon Park and North Creek Areas"
    description: >
      King County requires deck post footings to bear below the frost line,
      typically 12–18 inches in the Bothell area. Concrete poured footings with
      ground-contact PT lumber posts are inspected before backfill — patio blocks
      set on grade will shift and void the permit. Footings for 4×4 and 6×6 posts
      are sized to the tributary load; King County DPER or Bothell's permit center
      will flag undersized footings at the rough-in inspection.
  - title: "Guardrail Height and Stair Stringer Compliance on Elevated Decks"
    description: >
      Any deck surface more than 30 inches above grade in Bothell requires a
      guardrail at least 36 inches high with baluster spacing no wider than
      4 inches. Stair stringers need a consistent rise/run with a graspable
      handrail on any stair with four or more risers. These are inspected line
      items — IRC Section R507 governs deck construction, and the final
      inspection won't close without compliant railing geometry. TimberTech
      aluminum rail systems make it easier to hit those tolerances cleanly.

faq:
  - q: "How fast can you get to Bothell for a deck consultation?"
    a: >
      Bothell is a direct run up I-405 from Bellevue, or north on SR-522 from
      Seattle — typically 20–35 minutes without traffic. Most on-site
      consultation slots open within a week. Call (206) 591-1096 and Vladislav
      will come to the site himself, not a salesperson.
  - q: "Trex or TimberTech — which holds up better in Bothell's rain?"
    a: >
      Both are capped composite products that resist moisture, moss, and freeze-
      thaw cycles without annual sealing. TimberTech Reserve and Trex Transcend
      sit at similar price points — roughly $35–$55 per square foot installed,
      depending on framing scope. Material preference usually comes down to
      color and texture, not durability. The on-site quote covers both options
      with line-item pricing.
  - q: "What does the permit process look like for a new deck in Bothell?"
    a: >
      Homes inside Bothell city limits submit to Bothell Community Development
      — plan review for an attached deck runs 2–4 weeks. Unincorporated King
      County parcels go through King County DPER on a similar timeline. The
      permit covers footing inspection, framing, ledger attachment, and final.
      TopVolk handles submittal as part of the project. WA Licensed Contractor,
      100+ projects completed since 2017, and deadline penalties written into
      every contract. Call (206) 591-1096 to start.