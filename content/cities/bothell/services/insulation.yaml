title: "Bothell Insulation — Attic R-49, Crawl Space & Rim Joist Sealing"

intro: |
  Canyon Park's split-levels and the ranchers lining North Creek's older cul-de-sacs were mostly
  framed between 1968 and 1988 — built to energy standards that hadn't yet imagined R-49 attic
  requirements. Bothell pulls 37+ inches of rain annually from October through May, and the crawl
  spaces under those 98011 homes show what four decades of PNW humidity does to kraft-faced
  fiberglass batts: sagging insulation, shifted vapor barriers, floor joists with visible moisture
  staining. Upgrading to current Seattle Energy Code compliance means dense-pack blown-in cellulose
  or premium fiberglass to hit the R-49 target, closed-cell spray foam on rim joists for real air
  sealing, and a properly encapsulated crawl space before any finish work upstairs makes sense.
  TopVolk Construction has handled insulation scopes on 100+ projects since 2023, working through
  the Bothell Landing Park neighborhood, the Canyon Park corridor, and north into Snohomish County.
  Vladislav Volkov does every on-site estimate personally — call (206) 591-1096.

localContext: |
  The 98011 zip covers the historic core of Bothell — blocks near Bothell Landing Park, older
  split-level neighborhoods along 102nd Ave NE, homes from the late 1960s through 1980s with
  post-and-beam framing and original R-19 attic insulation that has compressed to R-12 or less
  after decades of foot traffic and settling. The 98012 zip takes in Canyon Park and the south end,
  where 1980s and 1990s tract builds are more common: tighter lots, truss-framed roofs, and knee
  walls in the 1.5-story homes that need their own insulation strategy separate from the main
  attic floor. Both zip codes have homes with unconditioned crawl spaces — standard in King County
  residential construction through the 1990s — that benefit from vapor barrier upgrades, rigid
  foam on foundation stem walls, and perimeter drainage coordination. Homes near the North Creek
  Trail corridor often have northwest-facing roof sections covered in moss, a reliable indicator
  of air leakage and thermal bridging above the attic floor. PSE and Seattle City Light both offer
  rebates for qualifying insulation upgrades, and TopVolk handles the pre-approval paperwork on
  your behalf.

commonProblems:
  - title: "Attic Insulation Below R-49 — The Energy Code Gap in Canyon Park Ranchers"
    description: |
      Many attics in Canyon Park and the North Creek Ranch neighborhoods still have the original
      3.5 to 5 inches of fiberglass batt, which tests out around R-13 to R-19 — well below the
      R-49 minimum in Washington's current energy code. Two approaches work for retrofits:
      dense-pack blown-in cellulose at roughly 3.7 per inch of R-value, or blown fiberglass at
      around 2.9. Cellulose from Greenfiber reaches R-49 in about 13 inches — tight but
      achievable in most standard truss attics without blocking the soffit baffles. In Craftsman-
      era homes near Bothell Landing Park that have shallow attic access and irregular rafter bays,
      batts simply aren't practical; blown-in is the only realistic path. Expect $1.50–$2.50 per
      square foot for blown-in attic insulation. PSE rebates currently run $0.30 per square foot
      for qualifying installs, and pre-approval must be in place before work begins — we handle
      that paperwork step.

  - title: "Crawl Space Vapor Barrier Failure in 98011 Homes"
    description: |
      Most Bothell homes built before 2000 have vented crawl spaces — code-compliant at the time,
      but in practice they pull humid PNW air under the floor from October through spring. Original
      6-mil poly vapor barriers shift, tear at seams, and allow ground moisture to rise into the
      joist cavity, creating conditions for wood rot and mold on Douglas-fir floor framing. Full
      encapsulation means removing the old poly, treating any mold growth, installing a 20-mil
      reinforced vapor barrier sealed to foundation walls, and adding rigid foam board (typically
      R-10 to R-15) against the perimeter stem walls. In crawl spaces that also serve as mechanical
      chases for ducts, closing the vents and conditioning the space eliminates duct condensation
      during summer — a recurring problem in split-levels off North Creek Parkway. Timeline for a
      standard 1,200-square-foot crawl space footprint: 2–4 days of hands-on work.

  - title: "Rim Joist Air Leakage — The Gap Most Insulation Contractors Skip"
    description: |
      The rim joist — the band of framing lumber sitting directly on top of the foundation wall —
      is one of the largest air leakage points in a PNW crawl space. In 1970s and 1980s Bothell
      homes, the rim joist area is typically insulated (at best) with a cut piece of fiberglass
      batt, which provides zero air sealing. Closed-cell spray foam applied at 2 inches thick
      achieves roughly R-13 while simultaneously sealing the gap between framing and concrete —
      something no batt product can accomplish. Homes in 98011 and 98012 going through a larger
      remodel permit at the City of Bothell Building Department can include rim joist spray foam
      as part of the energy compliance path. TopVolk is a WA Licensed Contractor and writes rim
      joist scope into the permit application, then coordinates the rough-in inspection directly.
      Cost typically runs $800–$1,800 for a standard single-story perimeter. Call (206) 591-1096
      to schedule an assessment.

  - title: "PSE and Seattle City Light Rebates — Real Money Being Left Unclaimed"
    description: |
      Insulation upgrades in King County qualify for rebates through PSE and, depending on utility
      territory, Seattle City Light's own program. PSE currently offers $0.30 per square foot for
      attic insulation upgrades — on a 1,500-square-foot attic, that returns $450 after a qualifying
      install. Crawl space insulation and air sealing carry separate rebate tiers. The requirement
      that trips most homeowners: all rebates need pre-approval before work starts, a contractor
      enrolled in the rebate program, and post-install documentation confirming the R-value achieved.
      Total project costs for a whole-envelope upgrade — attic blown-in to R-49, crawl space
      encapsulation, rim joist spray foam — run $4,000–$11,000 in Bothell depending on square
      footage, access difficulty, and existing conditions. After rebates, the net cost drops
      meaningfully. On a 1988 Canyon Park rancher with a 1,200-square-foot footprint, combined
      rebates have reduced total project cost by 10–15% on jobs we've completed since 2023.

  - title: "Knee Wall Insulation in Bothell's 1.5-Story Split-Levels"
    description: |
      Split-levels and 1.5-story homes — common in the North Creek corridor and on the hillside
      streets east of UW Bothell — have knee walls where the sloped ceiling meets the floor level.
      Without insulation on both the knee wall face and the attic floor behind it, the conditioned
      space loses heat from three directions simultaneously. Standard fix: R-21 mineral wool or
      fiberglass batt in the stud cavities, rigid foam on the attic-side face, and a continuous
      air barrier — house wrap or rigid foam taped at seams — to stop air movement through the
      assembly. Rockwool Comfortbatt holds its R-value even when slightly damp, which matters in
      PNW attic spaces, and doesn't compress the way fiberglass batts can over time. On a typical
      1,800-square-foot Bothell split-level, knee wall work adds 1–2 days to the scope and
      $1,200–$2,500 depending on access and linear footage. This work generally doesn't require a
      standalone permit in Bothell if it's part of a larger remodel already in the system.

faq:
  - q: "How fast can you get to Bothell for an insulation estimate?"
    a: |
      Bothell is a straightforward drive from our base — SR-522 or I-405 gets us there without
      Seattle's surface-street delays. Most homeowners in the 98011 and 98012 zip codes can
      schedule an on-site estimate within 3–5 business days. Vladislav Volkov handles every
