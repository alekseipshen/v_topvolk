      proposed start date. Call (206) 591-1096 to get on the schedule.

  - q: "What does attic insulation to R-49 cost in Bothell?"
    a: |
      Blown-in attic insulation to reach R-49 typically runs $1.50–$2.50 per square foot for
      material and labor in the Bothell area. On a 1,400-square-foot attic footprint, that's
      roughly $2,100–$3,500 before rebates. What moves the number: existing insulation depth
      (more to work around or remove), access quality (full pull-down stair versus a tight scuttle
      hole), and whether attic HVAC equipment requires routing around blocking. PSE rebates
      currently offset $0.30 per square foot for qualifying installs — pre-approval paperwork is
      handled by TopVolk before work begins. Every estimate includes exact line-item pricing, not
      ballpark ranges. Call (206) 591-1096 to schedule the on-site visit, or reach out online to
      get on Vladislav's calendar.

  - q: "Does insulation work in Bothell require a permit?"
    a: |
      Standalone insulation installs — adding blown-in cellulose to an attic, encapsulating a
      crawl space — generally don't require a separate permit through the City of Bothell Building
      Department. The exception: insulation tied to a larger remodel already under permit, such as
      a finished basement, kitchen addition, or ADU. In those cases, the energy compliance section
      of the permit documents R-values achieved, and the inspector verifies at rough-in. TopVolk
      is a WA Licensed Contractor and handles permit applications, plan check submissions, and
      inspection coordination when the scope requires it. If you're unsure whether your specific
      project triggers a permit requirement, Vladislav walks through that directly during the
      estimate — no separate call needed.

  - q: "What's the difference between blown-in cellulose and closed-cell spray foam?"
    a: |
      They serve different purposes in the same house. Blown-in cellulose — brands like Greenfiber
      or Nu-Wool — is the right call for open attic floors: cost-effective, high recycled content,
      and settles to a stable R-value over time. Closed-cell spray foam is the right call for rim
      joists, crawl space stem walls in an encapsulated system, and any application where you need
      structural rigidity alongside the R-value. Closed-cell runs $3–$6 per square foot at 2-inch
      thickness; blown-in cellulose runs $1.50–$2.50 per square foot. Most whole-envelope projects
      use both: blown-in in the attic, spray foam at the rim joist. Spraying an entire attic floor
      with closed-cell foam is expensive and unnecessary for the vast majority of Bothell homes.

  - q: "What warranty covers the insulation materials and labor?"
    a: |
      Blown-in cellulose and fiberglass products from manufacturers like Greenfiber and CertainTeed
      carry lifetime material warranties against settling below the installed R-value, provided
      installation met density specifications. Closed-cell spray foam from Icynene and comparable
      brands carries manufacturer warranties of 20+ years for dimensional stability. TopVolk backs
      workmanship for 2 years — if air-sealing gaps appear at inspected areas or material shifts
      due to installation defect, we return and correct it at no charge. The component that matters
      most in PNW conditions is the crawl space vapor barrier: 20-mil reinforced poly rated for
      25+ years of ground contact. The biggest risk to any insulation install isn't the material
      itself — it's moisture intrusion from an undiagnosed source, which is why the estimate
      includes a full moisture and air-leakage assessment before any scope is written.

