  - q: "What does drywall installation cost in Bothell?"
    a: |
      Straight board-and-finish work on a standard room runs $2.50–$4.50 per
      square foot for hang, tape, and Level 4 finish. Level 5 adds $1–$2 per
      square foot on top of that. Mold-resistant purple board or 5/8-inch Type-X
      Firecode C board costs more per sheet than standard 1/2-inch drywall, and
      that material premium shows up as a clear line item in the quote. A single
      bathroom re-board with purple board and Level 4 finish typically lands
      between $1,800 and $3,500. Full kitchen and living area skim-coat over
      existing texture runs $2,000–$4,500 depending on ceiling height and total
      square footage. Every TopVolk quote is line-item — materials, labor, and
      any subcontracted trades listed separately with no bundled estimates. Call
      (206) 591-1096 to schedule a free on-site estimate with exact pricing.

  - q: "Do you need permits for drywall work in Bothell, WA?"
    a: |
      Cosmetic drywall work — patching, skim-coating, replacing damaged board in
      kind — doesn't require a permit. Structural changes do: opening a wall
      between rooms, adding a bathroom, converting a garage to living space, or
      building an ADU. Those projects require plan review through the City of
      Bothell permit center before any framing or rough-in starts. ADU
      conversions under WA HB 1337 also trigger a rough-in inspection and a
      final inspection before wall board can be closed. TopVolk, WA Licensed
      Contractor, handles permit applications and manages the back-and-forth with
      the City of Bothell directly — homeowners don't need to track down the
      permit office themselves. Typical plan review for a garage ADU conversion
      in Bothell runs 4–8 weeks depending on current permit volume at the city.

  - q: "What's the actual difference between Level 4 and Level 5 drywall finish?"
    a: |
      The Gypsum Association GA-214 standard defines five finish levels. Level 4
      is the standard residential finish — tape embedded, three coats of joint
      compound, sanded smooth — appropriate for most walls with flat or eggshell
      paint under ambient lighting. Level 5 adds a full skim coat of joint
      compound over the entire surface after the Level 4 work, creating a uniform
      dense face that eliminates the texture difference between compound and
      gypsum face paper. That difference matters under raking light: recessed
      cans, under-cabinet LED strips, pendants at a kitchen island, picture
      lights above a fireplace. Any wall or ceiling with directional lighting
      should be specified at Level 5. The cost premium is real — roughly $1–$2
      per square foot — but far cheaper than repainting twice after noticing
      flashing once the fixtures are on.

  - q: "How long does a drywall project take in a typical Bothell home remodel?"
    a: |
      Timeline depends almost entirely on scope. A single bathroom re-board —
      tear out old drywall, hang purple board, tape, mud, Level 4 finish — runs
      3–5 days for the drywall phase, not counting tile or paint scheduling. A
      full kitchen remodel involving skim-coat over existing ceilings, new board
      on walls after electrical rough-in, and Level 5 finish runs 5–8 days of
      drywall time. Garage-to-ADU conversions with firecode Type-X walls and
      ceilings, plus rough-in inspection sign-off before boarding, typically run
      2–3 weeks for the drywall phase alone. The deadline gets written into the
      TopVolk contract — if the drywall phase runs past the agreed date, there's
      a penalty paid to the homeowner, not just a verbal apology. Vladislav walks
      the site and gives a realistic day-count at the free on-site consultation.

