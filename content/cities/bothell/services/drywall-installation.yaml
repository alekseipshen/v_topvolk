title: "Bothell Drywall Installation — Level 5, Type-X & ADU Work"

intro: |
  Popcorn ceilings and orange-peel texture were standard spec in virtually every
  Bothell subdivision built during the 1980s and 1990s — Canyon Park, the North
  Creek corridor, the tracts winding off Kaysner Way in 98012. Most of those
  ceilings are still there. Pacific Northwest humidity compounds the issue:
  crawlspace moisture works up through floor systems that were never properly
  vapor-barriered, bathroom exhaust fans terminate into attic space instead of
  outside, and laundry rooms got standard drywall in 1988 when purple board would
  have been the right call from the start. TopVolk Construction LLC, WA Licensed
  Contractor, has completed drywall installation and finishing work on 100+
  projects across the Seattle Metro since 2017 — skim-coating over textured
  surfaces, hanging CertainTeed mold-resistant board in wet areas, and running
  5/8-inch Type-X firecode drywall for garage separations and ADU partition walls
  near Bothell Landing Park. Call Vladislav directly at (206) 591-1096 to
  schedule a free on-site walkthrough.

localContext: |
  The 98011 zip code covers Bothell proper — downtown Bothell, the blocks off
  Main Street, older homes from the 1970s alongside a wave of 1980s additions.
  Most of those houses have original spray texture on every ceiling, and garage
  walls were often just insulated stud bays with no drywall hung at all. The
  98012 corridor reaching toward Canyon Park and the North Creek neighborhoods
  runs heavier with 1990s builder-grade construction: 1/2-inch drywall hung
  fast, minimal mud work, and no Level 5 finish anywhere in the house.
  Remodeling either zone means dealing with mismatched textures when you open
  walls for electrical or plumbing rough-in — you're never just patching a
  small hole, you're feathering into a surface that may have been painted over
  a dozen times. Projects inside Bothell city limits permit through the City of
  Bothell permit center; work in nearby unincorporated pockets routes through
  King County DPER. Full drywall scopes on a kitchen or bath remodel require
  plan review and a rough-in inspection before boarding closes the walls.

commonProblems:
  - title: "Skim-Coating Over Popcorn and Orange-Peel Texture in 1980s–90s Homes"
    description: |
      A large share of homes in the 98012 zip — the Canyon Park subdivisions,
      the North Creek neighborhoods — still have the original spray-on texture
      from their build date. Scrapers and landlord-grade spackling won't fix
      this. Proper skim-coating means knocking back peaks with a wide finishing
      blade, applying two passes of all-purpose joint compound thinned to a
      workable consistency, and sanding flat to a Level 5 surface before primer
      goes on. Popcorn ceilings in pre-1980 Bothell construction may also
      contain asbestos — testing is required before any mechanical removal, and
      disposal follows Washington Department of Ecology protocols. Labor on a
      full ceiling skim-coat in a 400-square-foot kitchen and dining area runs
      2–3 days. Finished correctly, it reads clean under recessed lighting
      without the shadow texture a Level 3 or 4 surface shows under directional
      light.

  - title: "Mold-Resistant Drywall in Bathrooms, Laundry Rooms, and Below-Grade Spaces"
    description: |
      Bothell averages close to 37 inches of rain per year, and homes along the
      North Creek greenbelt in 98011 see significant ground moisture during the
      October-through-May wet season. Standard paper-faced drywall in a laundry
      room or below-grade bathroom isn't a question of if it grows mold — it's
      when. The fix is National Gypsum XP or USG Sheetrock Mold Tough purple
      board: 1/2-inch in standard wall applications, 5/8-inch where fire
      separation is also required. Both carry a mold and moisture resistance
      rating that paper-faced standard product can't match. A full laundry room
      re-board using purple board, new vapor barrier on exterior walls behind
      the board, and a Schluter Kerdi waterproofing membrane at the
      floor-to-wall transition runs $2,500–$5,500 for the drywall scope alone,
      depending on room size and whether ceiling replacement is part of the job.

  - title: "Level 5 Finish for Remodeled Kitchens and Baths with Sidewall Lighting"
    description: |
      Level 5 is the highest finish classification under the Gypsum Association's
      GA-214 standard, and it's the only finish worth specifying for any wall or
      ceiling that will see raking or sidewall light. Every remodeled kitchen in
      Bothell with under-cabinet LED strips or pendants above an island will
      expose a Level 3 or 4 mud job within weeks of move-in. The process involves
      a full skim coat of joint compound over the taped and blocked surface,
      sanded flat, then primed with a high-build drywall primer before paint.
      Skipping the primer coat is the most common error — unprimed compound
      absorbs paint differently than the gypsum face paper, and the flashing
      shows up fast. On a typical 200-square-foot kitchen wall scope, Level 5
      finish adds $600–$1,200 to the drywall budget versus standard Level 4
      work. Worth every dollar if there's directional lighting anywhere in the
      room.

  - title: "5/8-Inch Type-X Firecode Drywall for Garages and ADU Separation Walls"
    description: |
      IRC R302.6 requires a minimum 1/2-inch gypsum board on the garage side of
      any wall or ceiling separating a garage from living space — but 5/8-inch
      Type-X is what most AHJs in this region, including the City of Bothell,
      require for a permitted ADU conversion or garage-to-living-space remodel.
      Under WA HB 1337 (2024), single-family lots in Bothell can now have up to
      two ADUs, and the firecode separation between an attached ADU and the main
      house is a hard code requirement that doesn't get waived at inspection.
      TopVolk, WA Licensed Contractor, handles the full scope: pulling the permit
      through the City of Bothell permit center, specifying USG Firecode C board,
      coordinating the rough-in inspection, and completing the final inspection
      sign-off. Garage conversion drywall scopes typically run $4,500–$9,000
      depending on square footage and ceiling height.

  - title: "Soundproofing Between Bedrooms and Shared Walls Using Resilient Channel"
    description: |
      The 1990s builder-grade homes in Canyon Park and the North Creek
      neighborhoods were framed fast and insulated to code minimum — which means
      sound transmission between bedrooms, between a home office and a living
      room, or between an ADU unit and the main house can be significant.
      Resilient channel decouples the drywall from the stud face, breaking the
      direct vibration path. Combined with Rockwool Safe 'n' Sound in the stud
      bays and a layer of QuietRock 510 or 530 on the room side, you can
      realistically drop 10–15 STC points compared to standard construction. The
      tradeoff: resilient channel assemblies add $3–$5 per square foot to the
      drywall scope, and the assembly steals roughly 1.5 inches per wall face —
      relevant in smaller bedrooms. For ADU separation walls, the soundproofing
      assembly often overlaps with the firecode Type-X requirement, letting both
      performance goals run in the same board specification.

faq:
  - q: "How fast can you get to Bothell for a drywall installation project?"
    a: |
      Bothell sits on I-405 between Kirkland and Kenmore, about 20–25 minutes
