title: "Bothell Handyman Services — Fixing What Remodels Miss"

intro: |
  Canyon Park developments along 98011 went up fast between 1985 and 1998 — production
  homes, builder-grade everything, sold to the first wave of tech workers commuting to
  Redmond and Kirkland before the 405 interchange was even fully widened. Those homes are
  now 30-to-40 years old, and the items that are failing aren't the big systems — they're
  the details. Weatherstripping compressed flat on a 1992 sliding door. A drywall patch
  behind a bathroom door that's slightly wrong in texture and sheen. A Ring Video Doorbell
  Pro 2 that the previous installer wired to an 8VA transformer instead of the 16VA the
  device requires. These are the jobs that fall through the cracks after a major remodel
  wraps up or accumulate quietly over the years. TopVolk Construction — owner-operated by
  Vladislav Volkov out of Seattle — handles exactly this kind of work across Bothell, from
  the North Creek corridor near Bothell Landing Park to the older neighborhoods tucked
  behind SR-522. WA Licensed Contractor, 100+ projects completed since 2023, and Vladislav
  is the one who actually shows up — not a subcontractor you've never met.

localContext: |
  The housing split across Bothell's two zip codes matters for handyman work. In 98011 —
  Canyon Park, the Country Village Road neighborhoods, the older cul-de-sacs east of I-405
  — you're dealing with 1985-to-2000 construction. Builder-grade hollow-core doors with
  original swept weatherstripping. Composite deck boards with 30 years of PNW rain cycles
  behind them — surface checking, mildew working into the grain on north-facing boards.
  Drywall with orange-peel texture that no rattle-can spray will ever quite replicate. Over
  in 98012, which runs into the Snohomish County line along the North Creek corridor, the
  homes skew newer — 2000s and 2010s builds — but the problems are different: smart panel
  boxes without neutral wires in switch locations, and finishes that show every patch
  because the original drywall taping wasn't Level 5. Bothell's climate adds pressure on
  all of it. Heavy rain from October through May — roughly 37 inches annually — accelerates
  wood rot on north-facing trim, swells door frames, and shortens the life of any
  weatherstripping that wasn't spec'd for Pacific Northwest humidity.

commonProblems:
  - title: "Punch List Completion After Kitchen and Bath Remodels"
    description: |
      General contractors move to the next job when the project is 95% done. The remaining
      5% sits on a punch list that nobody ever reschedules: an outlet cover that doesn't sit
      flush against the new tile, a cabinet door hinge that's 2mm out of alignment, caulking
      where the Kohler undermount sink meets the quartz counter that got skipped in the rush
      to close out. In Canyon Park homes after kitchen remodels, punch lists commonly include
      adjusting Blum soft-close hardware on cabinet doors, caulking around Moen pull-down
      faucets, and touch-up painting on walls where the tile backsplash met existing drywall.
      A typical 10-to-15 item punch list runs 4-8 hours of focused work. Vladislav handles
      these directly — no subcontractor handoff, no second round of scheduling delays. The
      contract includes a penalty for missed completion deadlines, written in before work
      starts. Call (206) 591-1096 to schedule a walk-through.

  - title: "Drywall Patches That Actually Match Orange-Peel Texture"
    description: |
      Nearly every production home built in King County between 1985 and 2000 has
      orange-peel texture on interior walls. Patching it looks straightforward and almost
      never is. A cold patch with pre-mixed joint compound sanded flat, then hit with a
      rattle-can orange-peel spray from the hardware store, stands out against the existing
      wall within 12 inches under any directional light. The correct approach: feather the
      joint compound out 8-to-10 inches past the patch perimeter, skim the full section,
      let it dry fully, then re-texture with a hopper gun dialed to match the existing
      aggregate size. Two-coat primer over fresh drywall before painting is non-negotiable —
      skip it and the sheen will read flat against the surrounding wall even after two coats
      of finish paint. A standard 6-inch patch in a Bothell home requires two site visits:
      one for tape and mud, one for texture and paint after the compound cures. Materials
      and labor typically run $175-$325 depending on patch count and accessibility.

  - title: "Fixture Replacement When the Old Plumbing Complicates the Swap"
    description: |
      Swapping a kitchen faucet in a 1993 Bothell home sounds like a two-hour job. Then the
      angle stop valve under the sink — original compression fitting hardware — won't close
      fully, and the 3/8-inch supply lines are corroded at the ferrule. Or the bathroom
      exhaust fan you pulled had a 4-inch duct collar but the existing duct run is 3-inch,
      meaning an adapter and rebalancing the CFM. Vladislav handles fixture replacements
      across Bothell — Moen Arbor kitchen faucets, Kohler Cimarron toilets, Halo LED
      recessed trim retrofit kits, Lutron Caseta dimmer switches — and flags these upstream
      complications before the job starts, not mid-installation. No permits are required in
      Washington State for like-for-like fixture replacement. Single fixture swaps run
      1-3 hours in labor. If a corroded angle stop or wrong-gauge wiring shows up, that's
      communicated immediately, with a revised scope and price before any additional work
      proceeds.

  - title: "Deck Board Replacement on Aging Pressure-Treated Decks"
    description: |
      A mid-1990s pressure-treated deck in Bothell has been through 30-plus wet seasons.
      Surface boards check and splinter, mildew works into the grain on north-facing boards
      that never fully dry out between October and April, and ACQ fastener corrosion loosens
      the board-to-joist connection. Replacing surface boards with new 5/4x6 PT lumber
      works for another decade if the framing underneath is still sound. Trex Enhance Basics
      or TimberTech AZEK is the better long-term investment in the PNW — composite handles
      the moss and moisture load that wood doesn't in shaded Bothell yards. Railing repair
      is more involved: metal balusters corrode at the base plate where water pools on the
      decking, and wood railing posts check and rot where the Simpson post base hardware
      meets the rim joist. A typical deck board replacement on a 12x16 deck runs
      $900-$2,400 depending on board count, fastener condition, and whether sister joists
      need adding under compromised sections before new decking goes down.

  - title: "Smart Home Device Installs When the Existing Wiring Isn't Ready"
    description: |
      Bothell's tech-heavy homeowner population — Boeing's Renton campus sits 20 minutes
      south via I-405, Microsoft's Redmond campus is 15 minutes southwest on SR-522 —
      adopts smart home hardware early. Ring Video Doorbell Pro 2, Nest Learning Thermostat,
      Lutron Caseta switches, Arlo Pro 4 cameras. The hardware is good. The installs get
      complicated when the existing wiring doesn't match what the device needs. Most
      1985-2000 Bothell homes have 2-wire switch loops with no neutral conductor — which
      rules out standard smart switches unless you pull a neutral from the panel or switch
      to Lutron Caseta, which runs on its own mesh protocol without a neutral. Ring Pro
      requires a 16VA-minimum doorbell transformer; original 1990s transformers are usually
      8VA. Vladislav checks existing conditions before recommending a device — not after
      you've already bought it. Smart device installs run $85-$225 per device depending on
      wiring complexity. Weatherstripping upgrades — Pemko door bottom sweeps, Ultraflex
      bulb seal on casement windows — run $225-$600 in labor and materials for a full
      Bothell home.

faq:
  - q: "How fast can you get to Bothell for handyman work?"
    a: |
      Bothell sits squarely within the regular TopVolk service area. SR-522 from Seattle
      puts most of 98011 within 30-40 minutes; I-405 from Bellevue is comparable depending
      on traffic. Vladislav typically schedules on-site assessments within 3-5 business days
      of your call. Smaller punch list jobs can often be scheduled within a week of the
      estimate. Larger scopes — deck board replacement, full post-remodel punch list, or
      multiple fixture swaps across the house — get a written line-item quote before
      anything goes on the calendar. Call (206) 591-1096 to set up a free on-site visit
      directly with Vladislav. No sales staff, no scheduler in the middle.

  - q: "What does handyman work typically cost in Bothell?"
    a: |
      Scope drives cost more than anything else. A single fixture replacement — faucet,
      toilet, light fixture — runs $150-$350 in labor. Drywall patch with texture match and
      paint runs $175-$325 for a standard repair. A full post-remodel punch list of 10-20
      items typically takes 6-10 hours, quoted as a flat project fee after the walk-through.
      Deck board replacement on a 12x16 deck runs $900-$2,400 depending on board count and
      framing condition. Smart home device installs run $85-$225 per device. All pricing
      comes from a direct written quote after the site visit — no vague estimates, no
      add-ons after the fact.

  - q: "Do I need permits for handyman work in Bothell?"
    a: |
      Most of what falls under handyman scope — fixture replacements, drywall patches,
      weatherstripping, smart device installs — sits below the permit threshold in
      Washington State. Like-for-like faucet, toilet, and light fixture swaps are
      permit-exempt. Deck work gets more nuanced: replacing surface boards without
      structural changes is typically exempt, but adding sister joists or replacing posts
      may trigger a permit requirement. For incorporated Bothell parcels, that goes through
      the City of Bothell's permit portal. Properties in unincorporated areas near the
      King-Snohomish County line route through King County DPER or Snohomish County PDS
      depending on the parcel. Vladislav identifies which jurisdiction applies and flags
      any permit requirements before work starts. TopVolk Construction is a WA Licensed
      Contractor — permit applications are handled directly when the scope requires it.

  - q: "Can you install smart home devices if my Bothell house has older wiring?"
    a: |
      Yes — but knowing what's in the wall before you buy the hardware saves money. Homes
      in Canyon Park and other 1985-2000 Bothell subdivisions commonly have 2-wire switch
      loops without a neutral, which blocks most standard Z-Wave and Zigbee smart switches.
      Lutron Caseta is the practical workaround — it runs its own mesh protocol and doesn't
      need a neutral wire. For Nest thermostats, a C-wire is required; whether one exists
      at the thermostat location depends on the vintage of the furnace and the original
      wiring run. Ring Video Doorbell Pro 2 needs a 16VA transformer minimum — original
      1990s door chime transformers are typically 8VA and need replacement as part of the
      install. Vladislav assesses all of this on-site first and walks you through a realistic
      install path specific to your home's wiring, not a generic checklist.

  - q: "Do you handle one-time jobs or only ongoing work?"
    a: |
      Both are fine. Some Bothell homeowners call once after a remodel closes out and need
      a punch list cleared — that's a single visit, no retainer, no minimum spend. Others
      build up a list over the year: a deck board to replace before summer, weatherstripping
      before the October rains arrive, a Lutron Caseta switch install once the old dimmer
      finally fails. Each job gets priced separately in writing before work starts. If a
      scope is genuinely too small to justify a site visit, that's communicated upfront —
      not after you've rearranged your morning. TopVolk Construction is a WA Licensed
      Contractor with 100+ projects completed since 2023 across King, Snohomish, Pierce,
      and Kitsap counties.

  - q: "Do you cover Kenmore, Woodinville, and other cities near Bothell?"
    a: |
      The full service area covers King County, Snohomish County, Pierce County, and Kitsap
      County — so Kenmore, Woodinville, Kirkland, Mill Creek, and Mountlake Terrace are all
      regular service stops. For jobs in the 98012 zip code that crosses into unincorporated
      Snohomish County near the North Creek area, permit jurisdiction shifts to Snohomish
      County PDS rather than the City of Bothell — which affects the workflow if permitted
      work is involved. Spring scheduling from March through June fills quickly as remodel
      season ramps up across the metro. Calling earlier in the season is worth it. Reach
      Vladislav directly at (206) 591-1096 — the contractor who will actually do the work,
      not a dispatcher or sales rep.