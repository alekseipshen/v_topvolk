  - q: "What does a home addition cost on Bainbridge Island?"
    a: |
      A detached ADU (DADU) on Bainbridge Island typically runs $120,000 to $160,000 for a 500 to 600 square foot structure — permits, foundation, framing, mechanical, and finish work included. A full second-story addition starts around $180,000 and can reach $280,000 or more depending on what the existing foundation requires. A mother-in-law suite or attached addition with a separate entrance runs $95,000 to $150,000.

      Island delivery logistics and Critical Areas review can affect both cost and timeline. TopVolk provides a line-item quote after the on-site visit — no vague ranges, no allowances that balloon later.

  - q: "What permits are required for a home addition on Bainbridge Island, and who handles them?"
    a: |
      Permits go through the City of Bainbridge Island's Community Development Department — not Kitsap County DPER, because Bainbridge Island is an incorporated city with its own permit center. A second-story addition or DADU requires a building permit, stamped structural drawings, and a critical areas review if the site is near a wetland or steep slope. Plan review for major structural work runs 8 to 14 weeks.

      TopVolk prepares the full permit package — site plan, architectural drawings, structural calculations — as part of the project scope. As a WA Licensed Contractor, we manage the AHJ coordination through final inspection so you are not chasing the building department yourself.

  - q: "Can I build an ADU on my Bainbridge Island property under WA HB 1337?"
    a: |
      WA HB 1337 (2024) allows up to two ADUs per single-family lot statewide, and the City of Bainbridge Island must comply with that law. You can combine an attached ADU (AADU) and a detached ADU (DADU) on the same parcel. The real constraint is the Critical Areas Ordinance — wetlands and steep-slope buffers can limit DADU siting even on a large wooded lot, and lot coverage limits still apply.

      A lot coverage and FAR check is the first step, followed by a critical areas determination from the city. For most properties in Rolling Bay and the Battle Point area with standard wooded lots, there is workable space. Vladislav can walk the site and give you a realistic read before you spend money on drawings.

  - q: "What warranty do you provide on a Bainbridge Island home addition?"
    a: |
      TopVolk provides a one-year workmanship warranty on all completed additions — covering labor and installation defects, not manufacturer material failures. On Bainbridge Island, the highest post-construction risk is water intrusion at roofline tie-ins and around window installations. Those details get extra scrutiny during the blue tape walkthrough and punch list before the project is signed off.

      Material warranties pass through from manufacturers. Milgard windows carry a lifetime limited warranty. Hardie siding is backed by a 30-year limited warranty against defects. The deadline penalty clause in every TopVolk contract also signals how the work gets done — contractors who put financial consequences on missed deadlines tend to stay organized through the finish.

