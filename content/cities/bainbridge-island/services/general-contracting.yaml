title: "Bainbridge Island General Contracting — Permits, Ferry, Full-Scope Builds"

intro: |
  Every ferry crossing adds a scheduling variable. Most mainland GCs ignore it until demo day.
  Materials stage at the Winslow terminal. Inspector windows don't flex for boat schedules.
  City of Bainbridge Island plan review runs 6-10 weeks on major remodels — and that clock
  starts only after a clean permit package lands on the desk. Vladislav Volkov has run island
  jobs since 2017. That includes a Rolling Bay kitchen where a panel-ready Sub-Zero required
  a dedicated ferry run timed around rough-in inspection availability. 100+ projects completed
  across Seattle Metro.

localContext: |
  Zip 98110 covers most of the older housing stock between Winslow and Eagle Harbor. Post-WWII
  ranchers, 1960s split-levels, vacation cottages that became year-round homes in the 1980s.
  Crawlspaces in these houses rarely have vapor barriers. Decades of island humidity show up as
  rot. Douglas-fir framing is standard throughout. But rotted rim joists and failing ledger
  boards turn up regularly during demo. Newer homes near Blakely Harbor follow current energy
  code. They still call for custom structural and finish work to justify the land value.

commonProblems:
  - title: "Ferry Scheduling Blowing Up Material Delivery Windows"
    description: |
      LVL beam deliveries, Milgard or Pella window orders, panel-ready Sub-Zero and Wolf
      appliance drops — all of it runs through the Bainbridge ferry terminal. One delayed boat
      pushes a rough-in inspection by a week. That cascades through electrical, plumbing, and
      HVAC sign-offs. Ferry windows go into the project schedule on day one. Not sorted out
      mid-job when a crew is standing around waiting.

  - title: "COBI Plan Review Adding 8-12 Weeks Before a Shovel Hits the Ground"
    description: |
      City of Bainbridge Island Development Services runs its own plan review queue. It's
      separate from King County DPER and Seattle SDCI. Major additions and DADU projects under
      WA HB 1337 can wait 8-12 weeks before permit issuance. Many contractors find this out
      after engineering drawings are already paid for. A complete, clean permit package on
      first submittal is the only way to avoid re-review cycles. Resubmittals cost time, not
      just money.

  - title: "Rotted Rim Joists and Moisture Damage in Pre-1975 Island Homes"
    description: |
      Bainbridge Island gets 37+ inches of rain annually. Crawlspaces built before vapor
      barrier requirements create predictable rot. Rim joists, PT lumber near foundation sills,
      sister joist failures — these show up regularly in gut renovations near Winslow and Eagle
      Harbor. Skipping a moisture assessment before locking a remodel budget is how projects
      end up $25K-$40K over scope. Demo reveals what the walls have been hiding. It happens
      on almost every pre-1975 island job.

faq:
  - q: "How fast can you get to Bainbridge Island for General Contracting?"
    a: |
      Vladislav takes the ferry from Coleman Dock for on-site consultations. Visits get
      clustered to keep travel efficient. Call (206) 591-1096 to set up a free walkthrough —
      you'll talk directly to the contractor, not a sales rep. Material drops and crew
      logistics run through the Winslow terminal with buffer days built into every project
      schedule from the start.

  - q: "Do you work with high-end appliance brands like Sub-Zero or Wolf on island renovations?"
    a: |
      Yes. Panel-ready Sub-Zero refrigeration, Wolf ranges, and Miele dishwashers have all
      landed on island jobs. Built-in units need framing and 240V electrical rough-in spec'd
      to the exact model before anything ships. Appliance specs get locked early in design.
      That way cabinet dimensions and circuit loads are correct before the ferry delivery
      window is booked.

  - q: "What does a full renovation cost on Bainbridge Island and how long does it take?"
    a: |
      Kitchen gut-renovations typically run $80K-$150K. Finishes and what demo turns up
      structurally both move that number. Full bathrooms start around $35K-$55K. Permit
      submittal to final inspection: kitchens 10-16 weeks, additions 5-8 months with COBI
      plan review included. TopVolk is a WA Licensed Contractor. Deadline penalties are
      written into every contract. Call (206) 591-1096 for a line-item quote, not a vague
      range.