title: "Bainbridge Island Deck Installation — Wooded Lots, Island Permits"

intro: |
  The ferry ride from Seattle deposits commuters onto an island where Douglas-fir canopies
  shade residential lots in Rolling Bay and Ferncliff for most of the year. That continuous
  overhead canopy keeps deck surfaces wet from October through May — the exact conditions
  that break down untreated cedar boards within a decade. TimberTech capped composite
  handles the moss and moisture cycle without annual sealing. Bainbridge Island runs its
  own permit process through the City's permit center, not Kitsap County DCD, and that
  distinction changes your project timeline.

localContext: |
  Zip code 98110 covers the entire island, and the housing stock ranges from 1960s and
  70s cedar-sided ranchers near Winslow to newer custom builds out toward Day Road and
  Fort Ward. Older homes in that vintage frequently have rim joists with decades of moisture
  exposure behind original cedar siding. Securing a ledger board to soft or punky framing
  requires sister joists added before any ledger bolts — skipping that step leads to the
  exact rot deck contractors get called to repair five years later.

commonProblems:
  - title: "Cedar vs. Composite Under Bainbridge's Heavy Tree Canopy"
    description: |
      Shaded lots in Ferncliff and Rolling Bay stay damp into June. Untreated cedar decking
      needs stripping and re-sealing every two seasons to prevent soft spots and embedded
      moss — most homeowners skip a cycle, then two. Trex Transcend and TimberTech Azek
      capped composite eliminate that maintenance entirely. The upfront cost is higher.
      Ten-year cedar replacement cost on a shaded island lot is higher still.

  - title: "Ledger Flashing Against Layered Cedar Siding on 1970s Homes"
    description: |
      Winslow-area homes with original cedar board siding often have four or five paint
      layers accumulated since the 1970s. Flashing a ledger board against soft, painted
      cedar is not straightforward — improper ledger flashing is the single most common
      source of deck rot in the Pacific Northwest. The IRC requires continuous flashing with
      positive drainage away from the rim joist connection. City of Bainbridge Island
      inspectors check it at the framing inspection.

  - title: "Post Footing Depth on Sloped Sound-Side Lots"
    description: |
      Elevated decks on waterfront parcels near Manitou Beach and Fort Ward need post
      footings dug to frost depth — 12 inches minimum, 18 inches on sites with poor
      drainage. Ground-contact pressure-treated lumber rated UC4B is required for any post
      in soil contact. Footings poured short of depth fail the rough-in inspection and
      have to be excavated and repoured. It is not a shortcut worth taking.

faq:
  - q: "How fast can you get to Bainbridge Island for Deck Installation?"
    a: |
      Vladislav takes the Bainbridge Ferry from the Seattle waterfront terminal, or comes
      through the Kitsap corridor when ferry timing doesn't line up. Site visits typically
      schedule within 5-7 days. Call (206) 591-1096 to check current availability — no
      sales staff, direct line to the owner.

  - q: "What deck materials do you use on Bainbridge Island projects?"
    a: |
      Trex Transcend and TimberTech Azek for shaded, high-moisture lots — both are capped
      composite and resist the mold cycle that hits wood decking here. Cedar is available
      for clients who want natural wood, but it needs a documented finish schedule and
      realistic re-seal expectations, especially on north-facing surfaces.

  - q: "What does deck permitting look like on Bainbridge Island?"
    a: |
      Decks over 30 inches above grade require a City of Bainbridge Island building permit —
      separate from Kitsap County DCD. Plan review runs 4-8 weeks for a standard deck.
      TopVolk handles the permit application and attends all three inspections: footing,
      rough framing, and final. End-to-end from contract to final sign-off is typically
      10-14 weeks. Deadline penalties are written into our contracts.