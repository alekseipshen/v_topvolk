title: "Bainbridge Island Bathroom Remodel — Waterproofing That Handles Island Moisture"

intro: |
  The ferry crossing from Colman Dock takes 35 minutes. The homes waiting on the Bainbridge side — 1950s-70s ranchers near Rolling Bay, older craftsman-era properties in Winslow (98110) — have bathrooms that have been sitting on the renovation list for years. High household incomes here mean owners want Kohler or Toto fixtures, curbless showers, large-format porcelain. The problem is what's hiding behind the original 4×4 ceramic tile: no waterproofing membrane, galvanized supply lines, and exhaust fans venting directly into the attic cavity.

localContext: |
  Zip code 98110 covers the whole island, and the housing range is wide. Eagle Harbor Drive holds homes from the 1940s — post-and-pier foundations, cast-iron drain stacks, knob-and-tube remnants in some wall cavities. Inland toward Country Club Road, the 1990s subdivisions are builder-grade: fiberglass surrounds, 4×4 ceramic on drywall, no vapor barrier behind the shower wall. Both housing types need serious waterproofing work before any finish material goes in. The approach for each is different.

commonProblems:
  - title: "No Waterproofing Membrane Behind Tile — Standard Finding in Pre-2000 Bainbridge Homes"
    description: |
      Tiled showers installed through the 1980s and 90s went over greenboard drywall — no cement board, no Schluter Kerdi, no RedGard. Marine humidity from Puget Sound accelerates moisture intrusion faster than in inland neighborhoods. By the time grout cracks at the curb, the substrate has been wet for years. Proper repair means full demo, waterproofing membrane installation, and new large-format porcelain — not a regrout.
  - title: "Cast-Iron Drain Stacks and Galvanized Lines in Older Winslow-Area Homes"
    description: |
      Properties from the 1940s and 50s on the north end of Bainbridge still have cast-iron drain stacks with decades of buildup, plus galvanized supply lines to the bathroom. Any layout reconfiguration — relocating the shower, moving a wall — opens those walls and typically exposes pipe needing full replacement. Moen or Kohler fixtures perform fine on new PEX. On original galvanized, water pressure at the showerhead will consistently disappoint.
  - title: "Exhaust Ventilation Undersized for Island Humidity Levels"
    description: |
      Bainbridge Island sits in Puget Sound — marine humidity layered on top of 37+ inches of annual rainfall makes bathroom ventilation a structural issue, not just a comfort upgrade. Original 50 CFM fans from 1970s builds typically vent into attic cavities rather than to the exterior. Mold grows behind drywall before it surfaces visibly. Every rough-in inspection on this island includes verifying exterior exhaust duct routing, sealed penetrations, and fan sizing for actual square footage.

faq:
  - q: "How fast can you get to Bainbridge Island for a bathroom remodel consultation?"
    a: |
      Vladislav takes the Washington State Ferry from Colman Dock — 35 minutes each way, with scheduling built around the timetable. Consultations run weekdays and most Saturdays. TopVolk has completed 100+ projects since 2023 across King and Kitsap counties. Call (206) 591-1096 to book a free on-site visit with the owner, not a salesperson.
  - q: "Do you work with Kohler, Toto, or European fixture brands in Bainbridge Island bathrooms?"
    a: |
      Kohler and Moen cover most mid-to-high spec installs here. Toto toilets show up in higher-end remodels — washlet rough-in requires precise stub-out placement. Duravit and other European brands need metric-tolerant plumbing positioning at the wall. Line-item quotes spell out fixture allowances clearly so there are no surprises at selection. WA Licensed Contractor, general contracting.
  - q: "What does a full bathroom remodel cost and how long does it take on Bainbridge Island?"
    a: |
      A master bath with curbless shower conversion, new vanity, and full tile work runs $35,000–$75,000 depending on plumbing relocation and layout changes. Kitsap County permit review typically takes 4–8 weeks for bathroom scope. Total project: 10–14 weeks from permit approval to blue tape walkthrough. Milestone dates go into the contract — missed deadlines cost TopVolk money, not yours.