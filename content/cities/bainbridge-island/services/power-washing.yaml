  - q: "What does exterior soft washing cost on Bainbridge Island?"
    a: "A full exterior soft wash on a typical Bainbridge Island home in the 1,800-2,400 sq ft range runs $450-$850. The lower end applies to single-story homes with moderate algae and no fascia or gutter cleaning in scope. Two-story homes, heavy north-side moss growth requiring a stronger SH treatment and longer dwell time, or added line items like soffit cleaning push toward the higher end. No estimate gets issued over the phone — Vladislav walks the property first and delivers a written quote with line items. The price can swing $200 either direction based on actual site conditions, and a phone guess won't catch that."

  - q: "Do I need a permit or HOA approval to power wash my Bainbridge Island home?"
    a: "No permit is required from the City of Bainbridge Island for residential power washing or soft washing — no plan review, no inspection, no approval process. HOA rules vary by subdivision; Lynwood Center and Port Madison communities sometimes have guidelines around scheduling hours or detergent use, so checking your HOA documents before booking is worthwhile. The more practical concern is environmental: sodium hypochlorite and cleaning detergents cannot discharge directly into storm drains or toward Puget Sound shoreline. TopVolk manages runoff on every Bainbridge job — wash water gets directed to vegetated areas per Kitsap County guidelines. TopVolk Construction LLC is a WA Licensed Contractor."

  - q: "Will pressure washing damage my cedar siding or cedar shake?"
    a: "Yes, if done at the wrong pressure. High-pressure washing at 2,500-3,000 PSI on cedar raises wood fibers, cracks individual shakes, and leaves behind a fuzzy surface that absorbs stain unevenly. Cedar grain fiber damage from aggressive nozzle work is one of the most common contractor mistakes on older island homes. The correct method is soft washing: sodium hypochlorite at 1-3% applied at under 500 PSI, 10-15 minute dwell time, then a gentle rinse with a 65° nozzle or soft wash gun. No turbo nozzle on cedar. No surface cleaner attachment on shake. TopVolk uses soft wash as the default on all cedar surfaces — shake, board-and-batten, or channel siding — not as an upsell."

  - q: "How long does a power wash last before moss returns on Bainbridge Island?"
    a: "On north-facing surfaces in the 98110 zip, expect visible moss regrowth in 18-36 months without any post-treatment. The island's annual rainfall and dense tree canopy in areas like Rolling Bay accelerate that compared to drier mainland Kitsap. With Wet & Forget or a zinc sulfate post-treatment applied after the wash, the clean window extends to 3-5 years in most conditions. South and west-facing surfaces with better sun exposure can go 4-6 years between cleanings. Post-treatment scope is part of the conversation during every free on-site estimate — it changes the maintenance schedule and total long-term cost significantly."

