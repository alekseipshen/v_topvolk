  - q: "What does a full exterior house repaint cost in Bainbridge Island?"
    a: |
      A single-story exterior repaint in solid condition — existing paint mostly intact, no significant lead testing required, standard cedar or Hardie cement-board substrate — typically runs $3,500-$6,000. Two-story cedar shake homes with complex prep, confirmed lead paint, or extensive fascia and trim detail range from $7,000-$12,000+. The main cost drivers are story count, existing paint condition, lead testing results, substrate repair scope, and product grade. Vladislav provides a written line-item quote after the free on-site visit — you see exactly what each item costs before signing anything. Call (206) 591-1096 to schedule.

  - q: "Does painting on Bainbridge Island require a permit or HOA approval?"
    a: |
      Standard repainting — prep, prime, and finish coats on existing siding and trim — doesn't require a building permit from the City of Bainbridge Island. If the project includes replacing damaged siding boards, repairing structural substrate, or modifying trim profiles, those elements may trigger a review through the city's Community Development department. HOA color approval applies in some newer subdivisions along the Day Road corridor — if you're in one of those neighborhoods, get color sign-off in writing before purchasing paint. TopVolk is a WA Licensed Contractor; any permit-related questions that come up during a project are addressed directly, not passed off to the homeowner to sort out.

  - q: "What exterior paint product actually holds up on cedar shake in a marine climate?"
    a: |
      For cedar shake in a salt-air, high-humidity environment like Bainbridge Island, 100% acrylic exterior paint is the right product category — alkyd-based paints become brittle in wet-climate moisture cycling over time. Sherwin-Williams Duration and Benjamin Moore Aura Exterior both perform well here: both carry mildew-resistant additives, hold adhesion on weathered wood, and come with manufacturer coverage. Application sequence matters as much as product selection: clean and dry the surface, spot-prime bare or heavily weathered cedar with Zinsser BIN shellac-based primer, then apply two full coats of topcoat. One coat on weathered cedar is almost never sufficient — the first coat absorbs into the substrate, and the second is the actual protective film doing the work.

  - q: "How long does exterior paint last on Bainbridge Island, and what's the warranty?"
    a: |
      In a marine climate with persistent rain and high ambient humidity, expect 5-7 years on cedar shake with a quality two-coat acrylic system maintained properly. Hardie cement-board siding holds paint longer — closer to 8-12 years under good conditions. TopVolk warranties labor for 2 years on exterior painting work. Manufacturer product warranties on Sherwin-Williams Duration and Benjamin Moore Aura Exterior typically run 15 years, covering paint film failure — they don't cover adhesion issues caused by substrate problems or failed surface prep by prior contractors. Annual inspection of caulk lines and touch-up of any cracked film before water infiltrates underneath meaningfully extends the cycle, especially on north- and west-facing walls.

