title: "Woodinville Home Additions — ADUs & Second-Story Builds"

answer: "TopVolk Construction builds ADUs, second stories, and in-law suites in Woodinville, Washington — 100+ projects since 2023, owner-led by Vladislav Volkov."

intro: |
  TopVolk Construction plans, permits, and builds detached ADUs, second-story additions, and in-law suites for Woodinville homeowners, with most projects running $150 to $300 per square foot and four to seven months from first design meeting to final inspection. Lot sizes out here run bigger than in Seattle proper — a lot of properties near Hollywood Hill and Cottage Lake still sit on an acre or more with room to build out instead of just up, which changes the math on septic capacity and setbacks more than it changes the math on square footage. Closer to downtown, near DeYoung Park and the Sammamish River Trail, lots shrink and a second story or a compact DADU tends to make more sense than a sprawling addition. A Thermador range and hood pull enough draw that the ADU kitchen needs its own dedicated circuit and make-up air plan, not an afterthought bolted onto the main panel. Vladislav Volkov runs every one of these jobs directly — no project manager handing you off to a subcontractor you've never met.

localContext: |
  Woodinville spans zip codes 98072 and 98077, and the building stock splits pretty cleanly by decade. Closer to Wellington and downtown you'll find 1970s and '80s ranch and split-level homes on modest city lots, most tied to municipal sewer and permitted through the City of Woodinville building division. Head out toward Hollywood Hill or Cottage Lake and you're in unincorporated King County — permits run through King County DPER instead, and a lot of those properties are still on septic, which means any addition with a new bathroom or kitchen triggers a King County Public Health review of the drainfield capacity before a permit gets issued. Wine country estates near Chateau Ste. Michelle add another wrinkle: some parcels carry critical-area or steep-slope overlays that affect where a DADU can sit relative to a stream buffer. Rain averages close to 37 inches a year here, and homes near the tree line get moss buildup on north-facing roof and siding fast — worth factoring into any addition that ties new roofline into old.

commonProblems:
  - title: "Building a DADU under WA HB 1337 without blowing the septic budget"
    description: "The 2024 statewide ADU law lets most Woodinville lots carry two ADUs, but the law doesn't touch King County Public Health rules on septic capacity — and a lot of Hollywood Hill and Cottage Lake properties are still on a drainfield sized for a three-bedroom house from 1975. Adding a detached ADU with its own kitchen usually means a new septic evaluation, sometimes a second tank or a repair area set-aside, before the building permit even gets submitted. We spec a separate utility connection for water and power on most DADUs so the main house panel isn't stretched thin. Budget an extra $8,000-$20,000 if the drainfield needs expansion, on top of the $180,000-$230,000 typical build cost for a two-bedroom DADU with a Bosch or LG kitchen package."
  - title: "Second-story additions on foundations built for one floor"
    description: "Plenty of Wellington-area ranchers from the 1970s and '80s were framed with Douglas-fir joists sized for a single story and a light composition roof — stack a full second floor on top and the original footings often can't carry the new load without reinforcement. Our engineer runs the numbers on existing footing width and soil bearing before we touch a wall, and it's common to pour supplemental footings and run an LVL beam with PSL posts down to the new foundation to carry the point loads from above. Skip this step and you're looking at sagging headers or cracked drywall within a few years. Structural work typically adds $15,000-$35,000 to a second-story addition, and it's non-negotiable if the original plans don't spec the loads."
  - title: "In-law suite layouts that need a separate entrance and their own kitchen"
    description: "A mother-in-law suite only works if it feels like its own unit — separate entrance, its own kitchen, and a bedroom that meets IRC egress window requirements, not a converted den with a window too small to legally call a bedroom. In Woodinville proper that layout gets permitted through the City of Woodinville building division; out past city limits it's a King County DPER review, and both want a clear floor plan showing the second kitchen and confirming it doesn't turn the addition into an illegal duplex. We run plumbing rough-in for a second kitchen off the existing main line where the run allows it, cabinets are usually semi-custom or IKEA depending on budget, and plan review alone typically runs three to six weeks before framing can start."
  - title: "What actually drives the price on a Woodinville addition"
    description: "Square footage is the smallest variable in the estimate — site work is usually the bigger one. A DADU on a flat Wellington lot with sewer already at the street costs a lot less to build than the same DADU on a sloped Hollywood Hill parcel needing a new septic line and retaining work. Structural engineering, foundation type, and finish level (Thermador and Sub-Zero appliance packages versus Bosch and LG) swing the number by tens of thousands. Expect $150-$300 per square foot all-in, with a line-item quote before you sign — not a ballpark. Every contract includes a written deadline with a penalty if we miss it, which isn't standard in this business."
  - title: "Matching new roofline and siding to a house built decades ago"
    description: "Tie a new addition's roof into a 1980s composition shingle roof and the color almost never matches after a few Woodinville winters — moss and UV fading do their work fast under the tree canopy near Cottage Lake. Same problem with cedar siding on older Craftsman-influenced homes; we usually spec Hardie fiber-cement on the addition since it won't weather at a different rate than 40-year-old cedar eventually will, and paint-match at the trim line instead of chasing an exact cedar tone. For HVAC, tying a new zone into old ductwork rarely balances the airflow right — a Mitsubishi mini-split serving just the addition or ADU is usually the cleaner, cheaper fix, running $4,000-$8,000 installed versus reworking the whole duct system."

faq:
  - q: "How fast can you get to Woodinville for a home addition consultation?"
    a: "We're out of the Seattle Metro area and cover Woodinville regularly along with Bothell, Redmond, and Kirkland, so getting a contractor to your property for a site walk usually takes a few days, not weeks. Vladislav does the site visit himself — no sales rep, no commission structure pushing you toward a bigger scope than you need. Most additions start construction 6-10 weeks after signing, once structural drawings and permits are moving. Call (206) 591-1096 to get a walkthrough on the calendar."
  - q: "What does a home addition cost in Woodinville?"
    a: "Most projects run $150-$300 per square foot depending on foundation type, septic versus sewer, and finish level — a bare-bones second story lands toward the low end, a DADU with a full Thermador or Sub-Zero kitchen lands toward the high end. A detached ADU with two bedrooms typically totals $180,000-$230,000 including permits and site work. We give a line-item quote after the site visit, not a phone estimate, so the number reflects your actual lot and soil conditions. Schedule a free consultation to get exact pricing."
  - q: "Do I need a permit through King County or the City of Woodinville?"
    a: "It depends on the parcel — if you're inside Woodinville city limits, permits route through the City of Woodinville building division; if you're in unincorporated areas like Hollywood Hill or Cottage Lake, it's King County DPER, and septic-served lots also need a King County Public Health sign-off. We pull the parcel record before quoting so we know which jurisdiction and review timeline applies. Plan review for an addition typically runs 6-12 weeks depending on the jurisdiction's current backlog. TopVolk Construction is a WA Licensed Contractor and handles the permit submittal directly."
  - q: "Can I build two ADUs on my Woodinville lot under the new state law?"
    a: "WA HB 1337, effective statewide since 2024, allows up to two ADUs on most single-family lots — a detached DADU up to 24 feet in height plus an attached AADU, or two DADUs on larger parcels, subject to lot coverage and setback rules. Septic capacity is the real limiting factor on a lot of Woodinville properties, more than the state law itself. We check drainfield sizing and any critical-area overlays near streams before confirming what's actually buildable on your lot. That review happens during the free consultation, before any design work starts."
  - q: "How long does a second-story or ADU addition actually take, start to finish?"
    a: "A second-story addition on an existing foundation typically runs four to six months once permits are in hand, including framing, rough-in, drywall, and finish work. A detached ADU runs closer to four to seven months end-to-end when you count permit review time on the front side. In-law suite conversions inside the existing footprint move faster, often three to five months depending on how much plumbing and electrical rough-in is involved. Every contract has a written completion date with a penalty attached if we run past it."
  - q: "Do you cover areas near Woodinville too, like Bothell or Redmond Ridge?"
    a: "Yes — we work across King, Snohomish, Pierce, and Kitsap counties, and Bothell, Redmond, Kirkland, and Duvall are all regular service areas alongside Woodinville. Scheduling windows run a few weeks out during summer construction season and open up faster in fall and winter. Vladislav handles every project directly, so there's no dispatcher juggling crews across cities. Call (206) 591-1096 to check current availability for your address."