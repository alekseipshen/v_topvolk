title: "Woodinville Bathroom Remodel — Beyond the Builder-Grade Bath"

intro: |
  Hollywood Hill Road cuts through 98072 past Woodinville wine country — and behind those
  well-kept facades sit bathrooms frozen in 1997. Fiberglass surrounds, single-handle Moen
  faucets scaled with mineral deposits, exhaust fans that barely move air. TopVolk Construction
  has remodeled bathrooms across King County since 2023 — 100+ projects — with Vladislav
  Volkov directly managing each one. No sales staff, no middlemen.

localContext: |
  Most of Woodinville's residential stock, especially north of downtown near Hollywood Hill and
  through the Bear Creek corridor, was built between 1990 and 2007. Zip code 98072 shows up on
  King County DPER permit applications constantly — though homes within city limits go through
  Woodinville's own building department. Those builds used standard 2×6 framing and fiberglass
  insulation, but shower surrounds got minimal waterproofing — caulk over a backer board and
  not much else.

commonProblems:
  - title: "Fiberglass Surround Failure and Subfloor Water Damage"
    description: "Builder-grade fiberglass surrounds from the 1990s crack at stress points,
      especially at the tub lip. Water migrates behind the unit, saturates OSB subfloor, and
      eventually the floor goes spongy and framing rots. Converting to large-format porcelain
      tile over Schluter Kerdi waterproofing membrane stops that cycle permanently."
  - title: "Chronic Mold from Undersized Ventilation in PNW Humidity"
    description: "Woodinville pulls 37+ inches of rain annually, and standard 50 CFM builder
      fans cannot handle the condensation load on north-facing bathroom walls. Mold gets behind
      drywall within a few years of construction. Proper remediation means removing affected
      drywall, coating wet zones with RedGard membrane, and replacing the fan with a minimum
      110 CFM unit ducted to the exterior — not into the attic."
  - title: "Master Bath Layout Reconfiguration and Curbless Shower Conversion"
    description: "Many 2000s-era master baths in 98072 have a tub-plus-separate-shower combo
      that sees the shower used daily and the tub almost never. Converting that tub alcove into
      a curbless walk-in shower means moving the drain rough-in, which requires opening the
      subfloor. We install Schluter linear drains, frame a bench with solid blocking, add a
      recessed niche, and tile in large-format porcelain throughout."

faq:
  - q: "How fast can you get to Woodinville for a bathroom remodel consultation?"
    a: "About 20–25 minutes up 522 from Kenmore. Call (206) 591-1096 to schedule a free
      on-site consultation — Vladislav comes out himself, looks at the bathroom, and delivers
      a line-item quote, not a ballpark range pulled from thin air."
  - q: "What fixture brands do you work with in Woodinville bathroom remodels?"
    a: "Moen and Kohler are in nearly every 1990s–2000s home we walk into. For replacements
      we source Kohler, Grohe, or Delta depending on scope — shower valve, rough-in trim kit,
      and drain body all need to match. We verify compatibility before anything gets ordered."
  - q: "What does a full master bathroom remodel cost in Woodinville, and how long does it take?"
    a: "Full master bath remodels here run $35K–$75K+ depending on layout changes, tile
      selections, and whether plumbing moves. Woodinville's building department permit plan
      review typically takes 3–5 weeks for projects involving plumbing or structural work.
      Build time once permits clear: 5–8 weeks. TopVolk is a WA Licensed Contractor, and
      deadline penalties are written into every contract. Call (206) 591-1096 to talk through
      your project."