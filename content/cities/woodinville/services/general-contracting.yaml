title: "Woodinville General Contracting — Permits, Trades, Real Timelines"

intro: |
  Hollywood Schoolhouse anchors the wine country corridor in 98072 — and the residential
  streets behind it are where we spend a lot of our time. A whole-house renovation here
  typically means a City of Woodinville permit application, a 4-8 week plan review, and
  four or five trades that need to sequence without stepping on each other. Vladislav
  Volkov runs the work directly — no project manager relaying messages, no commissioned
  closer involved after you sign.

localContext: |
  The residential mix in 98072 and 98077 runs from 1970s-80s ramblers on wooded
  half-acre lots near the Sammamish River Trail to mid-90s tract builds in the Woodin
  Creek Village area to newer executive homes on larger parcels toward Cottage Lake.
  Older ramblers regularly turn up undersized electrical panels and galvanized supply
  lines the moment demo starts. Knowing that before writing an estimate is what keeps
  a project at the original number instead of blowing past it mid-construction.

commonProblems:
  - title: "Multi-Trade Sequencing Collapses Without One Person Owning the Schedule"
    description: |
      Frame, rough-in electrical, rough-in plumbing, HVAC ductwork, insulation,
      drywall — each trade has a lead time and a hard dependency on the one before it.
      One plumber running two weeks late cascades into four weeks of idle time across
      every other sub. A single GC holding the schedule is what keeps a Woodinville
      kitchen at 9 weeks instead of 18.
  - title: "1980s Ramblers Hide Structural Problems Until the Wall Comes Down"
    description: |
      Pull a load-bearing wall in a 1985 Woodinville rambler and you may find
      notched rim joists from a previous plumber, an LVL beam sized for a load it's
      no longer carrying, or a wet crawlspace requiring a vapor barrier and sump
      before drywall can go back up. These aren't surprises — they're patterns. An
      honest estimate accounts for them before demolition starts.
  - title: "City of Woodinville Plan Review Runs 6-10 Weeks on Major Work"
    description: |
      Woodinville's permit center handles both residential and commercial applications
      — during peak season, plan review for an addition or DADU can take 10 weeks.
      Submit drawings with missing FAR calculations or incorrect setback documentation
      and the clock resets entirely. Getting the permit package right on the first
      submission keeps the project on schedule instead of waiting another two months.

faq:
  - q: "How fast can you get to Woodinville for General Contracting?"
    a: |
      Woodinville is a regular area for us — we have active projects in 98072 and
      98077 through most of the year. For an initial site walkthrough, call
      (206) 591-1096 and we can usually get there within a few days. Consultations
      are on-site, with Vladislav, not a salesperson.
  - q: "Do you work with Sub-Zero, Thermador, and Bosch appliances during kitchen remodels?"
    a: |
      Yes — most Woodinville kitchen remodels we handle include at least one of those
      brands. Sub-Zero column refrigerators require specific cabinet depth and
      ventilation clearances. Thermador ranges affect where the gas rough-in and
      range hood CFM ratings land. We coordinate blocking and utility rough-ins
      against the actual appliance specs before framing is closed.
  - q: "What does a full remodel cost in Woodinville, and how long does it take?"
    a: |
      A kitchen plus master bath in a 98072 home typically runs $130K-$200K+
      depending on structural finds during demo and finish selections. Timeline
      from signed contract to blue-tape walkthrough: 10-16 weeks, plus the
      City of Woodinville permit review window up front. TopVolk is a WA Licensed
      Contractor — 100+ projects completed since 2023 — and deadline milestones
      go in writing. We pay penalties if we miss them.