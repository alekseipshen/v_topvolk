title: "Woodinville Deck Installation — Outdoor Living Built for the Rain"

intro: |
  Wine tasting rooms along SR-522 draw visitors from across King County, but homeowners living in Woodinville want usable outdoor space — somewhere to put the Weber and actually use it from May through October. Most homes in the Hollywood Hills area were built in the 1990s with sliding doors opening to a 4-inch concrete pad. That's not a deck. Building one here, properly flashed to the rim joist with composite matched to your lot's sun exposure, is a real construction project.

  TopVolk Construction LLC is owner-operated by Vladislav Volkov — WA Licensed Contractor, 100+ projects completed since 2017 across King, Snohomish, Pierce, and Kitsap counties. Call (206) 591-1096 to schedule a free on-site consultation. Deadline penalties are written into every contract — not a verbal promise.

localContext: |
  Residential development across the 98072 and 98077 zip codes spans late-1980s spec builds through 2010s custom homes. Hollywood Hills and the Bear Creek corridor have a lot of multi-level lots — which almost automatically puts deck height above 30 inches and triggers the code-required 36-inch guardrail requirement. Woodinville's permit center handles deck reviews in-house; plan review for an attached deck runs roughly 3-6 weeks. Anything over 200 square feet above grade requires a full building permit.

commonProblems:
  - title: "Cedar vs. Composite — What Actually Survives Woodinville's North-Facing Lots"
    description: "Cedar looks good for a few years, then north-facing boards in the 98072 zip code start growing moss and checking by year four or five. Trex Transcend or TimberTech Legacy hold up better on lots shaded by Douglas-fir canopy — lower maintenance cost over 15 years, no annual sealing, and the PNW moisture doesn't degrade composite the same way it does wood. Call (206) 591-1096 for a free site walk — Vladislav will show you the actual board samples and give a straight 15-year cost comparison."
  - title: "Ledger Attachment and Rim Joist Rot on 1990s Frames"
    description: "Improperly flashed ledger boards are the most common structural failure on Woodinville decks built in the 90s. Water wicks behind the ledger into the rim joist, rot advances silently for years, and the deck feels spongy before anyone investigates. Correct installation requires through-bolted lag screws into solid framing, a continuous flashing membrane, and a drainage gap so water cannot pool behind the ledger."
  - title: "Post Footing Depth and Ground-Contact PT Lumber Grade"
    description: "King County requires footings to frost line depth — typically 12 to 18 inches in this part of the county. Ground-contact posts need pressure-treated lumber rated UC4B or higher. Standard UC3B stock is not rated for direct ground contact in western Washington's soil moisture conditions, a common shortcut that causes accelerated post decay within five to seven years. TopVolk is a WA Licensed Contractor — 100+ projects completed since 2017, and missed-deadline penalties go into the contract before work starts."

