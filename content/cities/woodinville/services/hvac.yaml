intro: |
  A gas furnace paired with a mismatched AC coil is probably why the bonus room over the garage in Wellington Hills runs 8 degrees warmer than the rest of the house every August. That's a duct sizing problem, not a thermostat problem, and it's one of the most common calls TopVolk gets from Woodinville homeowners near Wilmot Gateway Park and out toward the Sammamish Valley wine estates. Some of these houses were built in the late 1980s with single-zone forced air that never accounted for later additions or finished bonus rooms. Others are newer builds near Cottage Lake with tight envelopes that make a straight furnace-and-AC combo oversized and short-cycling. Vladislav Volkov handles the load calculations, the ductwork rework, and the heat pump swaps himself — Daikin and Mitsubishi ductless systems come up constantly here, especially for detached shops and ADUs that don't connect to existing trunk lines.

localContext: |
  Woodinville splits mostly between zip codes 98072 and 98077, and the housing mix runs from 1970s-80s split-levels near downtown to larger custom homes on acreage toward Cottage Lake and the Sammamish River Valley. Older homes in the 98072 corridor near Woodinville-Duvall Road often still have the original single-stage furnace and a builder-grade duct system that was never rebalanced after a remodel. Larger lots out toward Hollow Hill Farm and the Wellington area tend to have detached garages, shops, or barns that need a standalone ductless system rather than an extension off the main air handler. The City of Woodinville runs its own Development Services permit desk for mechanical work inside city limits, while properties just outside the boundary near Maltby fall under King County DPER. Wet winters and shaded lots near the river mean condensate lines and outdoor heat pump pads need real drainage planning, not an afterthought.

commonProblems:
  - title: "Gas furnace still running when a heat pump conversion pencils out"
    description: "A lot of Woodinville homes near 98072 still have a 15-20 year old 80% AFUE gas furnace paired with a basic AC condenser, and swapping both for a single Bosch or Daikin heat pump with a variable-speed compressor usually cuts summer and winter bills at once. The catch is the existing electrical panel — many of these houses have a 100A service that needs a load calculation before adding a heat pump's compressor draw, sometimes forcing a panel upgrade. IRA and PSE rebates can offset $2,000-$4,000 of the swap depending on SEER2 and HSPF2 ratings. TopVolk runs the Manual J and electrical check before quoting, not after. Timeline for a straightforward swap runs 2-3 days once permits clear."
  - title: "Bonus rooms and additions with no real ductwork"
    description: "Second-story bonus rooms and garage conversions in Wellington Hills and near Cottage Lake frequently get a single flex duct tapped off the nearest trunk line, which never delivers enough CFM to hold temperature. Static pressure in the main trunk climbs, the blower works harder, and the rest of the house suffers for it. The real fix is either a dedicated supply run with proper duct sizing and a boot register, or pulling that space off the ducted system entirely with a Mitsubishi or LG ductless head. A single-zone mini-split for a 300 sq ft bonus room runs roughly $4,500-$6,500 installed, including the refrigerant line set and condensate routing."
  - title: "Permit and inspection steps that get skipped on DIY heat pump swaps"
    description: "Mechanical permits for furnace and heat pump replacement inside Woodinville city limits go through the city's Development Services desk, and that includes a rough-in check on refrigerant line sets plus a final inspection on venting and electrical disconnect. Properties just outside city limits near Maltby route through King County DPER instead, and the paperwork differs slightly on setback and equipment pad placement. Skipping the permit is common with handyman-installed ductless units, and it becomes a real problem at resale when a home inspector flags unpermitted mechanical work. TopVolk pulls the permit, schedules the rough-in and final inspection, and hands over the paperwork — WA Licensed Contractor, no shortcuts on the AHJ side. Call (206) 591-1096 before signing off on any quote that skips this step."
  - title: "What a full HVAC replacement actually costs in Woodinville"
    description: "A high-efficiency 95%+ AFUE furnace with proper Category IV venting runs $6,500-$9,500 installed depending on tonnage and duct modifications, while a full ducted heat pump conversion with a new air handler typically lands between $11,000 and $18,000. Ductless multi-zone systems for additions or ADUs price per head — figure $3,800-$5,500 per zone including the Mitsubishi or Daikin outdoor unit sizing. What moves the number most is duct condition: sealing and rebalancing an older system adds labor but usually costs less long-term than living with hot and cold rooms. Every quote from TopVolk is line-item, not a ballpark range, and the estimate is free."
  - title: "When to repair the old system versus replace it"
    description: "A furnace or heat pump past 12-15 years with a cracked heat exchanger or a failing compressor isn't worth patching, especially once R-410A refrigerant repairs start running past $1,200 a visit. Newer systems with a Nest or ecobee thermostat and proper zoning dampers tend to last closer to 15-18 years in this climate, with heat pumps handling humidity better than a straight AC condenser exposed to Woodinville's damp winters. TopVolk checks static pressure, blower amp draw, and refrigerant charge before recommending a repair versus a full swap. Most manufacturer warranties on Bosch and LG equipment run 10-12 years on parts when installed and registered by a licensed contractor, which matters if a claim ever comes up."

