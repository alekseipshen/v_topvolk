  - q: "What does a repipe or plumbing rerouting job cost in Woodinville?"
    a: "A single-bathroom repipe generally runs $4,500-$7,500, a full-house galvanized or polybutylene replacement runs $8,000-$14,000, and drain rerouting for a kitchen island or basement bath adds $2,500-$6,000 depending on whether an ejector pump is needed. Pricing depends on wall and crawlspace access, how many fixtures move, and permit scope. TopVolk gives a free on-site estimate with exact line-item pricing, not a ballpark range, since Vladislav walks the space himself before quoting."
  - q: "Do I need a permit for plumbing work in Woodinville?"
    a: "Water heater replacements, gas line upsizes, and any relocated fixture or drain line need a permit, either through the City of Woodinville building department for incorporated addresses or King County DPER for unincorporated pockets like Cottage Lake and Hollywood Hill. TopVolk pulls the permit, prepares the plan review paperwork, and schedules the rough-in and final inspections as part of the project. WA code also requires seismic strapping on new water heaters, which gets checked at final. As a WA Licensed Contractor, TopVolk handles this paperwork directly rather than leaving it to the homeowner."
  - q: "Can you convert my tank water heater to a tankless system like Navien or Rinnai?"
    a: "Yes — this is one of the more common requests during kitchen and bath remodels in Woodinville, especially in homes with a Bosch or Thermador range already pulling gas on the same line. The conversion usually requires upsizing the gas line to 3/4-inch, adding a condensate drain, and confirming venting clearance per manufacturer spec. TopVolk sizes the unit to the house's fixture count and simultaneous-use pattern, not just the square footage, so the homeowner isn't stuck with lukewarm water during a two-shower morning."
  - q: "What's the warranty on plumbing work done during a remodel?"
    a: "Workmanship on repiping, fixture installs, and drain rerouting is covered for one year, and manufacturer warranties on fixtures and water heaters — typically 6-12 years on a Rinnai or Navien unit, lifetime on many Moen and Kohler fixtures — pass through to the homeowner with registration handled at install. PEX and copper hold up well through Woodinville's wet winters as long as expansion tanks and pressure regulators are checked periodically. Freeze damage isn't common here but uninsulated crawlspace lines near Cottage Lake's colder microclimate are worth a look each fall."
