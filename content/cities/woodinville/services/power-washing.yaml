  - q: "What does power washing a house or driveway in Woodinville cost?"
    a: "Most single jobs price out between $300 and $700 depending on square footage, surface type, and how much organic buildup has set in — a moss-covered north roof costs more than a routine driveway rinse. Siding, decking, and stucco each take different pressure settings and cleaning agents, which factors into labor time more than square footage alone. TopVolk gives a line-item quote on-site, not a phone guess, so the number reflects the actual surface condition. Call (206) 591-1096 for a free walkthrough and exact price before any work starts."
  - q: "Does power washing require a permit or HOA approval in Woodinville?"
    a: "Power washing itself doesn't need a City of Woodinville permit — it's routine exterior maintenance, not construction — but several Wellington and Timber Ridge HOAs require exterior cleaning documentation before approving a repaint or resale walkthrough. TopVolk provides a dated before/after photo set homeowners can submit straight to their HOA architectural committee. If the same visit turns up rot or trim that needs replacing, that follow-up work would fall under a City of Woodinville or King County DPER building permit depending on scope. TopVolk is a WA Licensed Contractor and can scope that repair in the same conversation."
  - q: "What PSI do you use on siding versus concrete or a roof?"
    a: "Concrete and pavers can handle 3,000+ PSI with a surface cleaner attachment, but siding and cedar decking get soft-washed under 1,500 PSI to avoid stripping paint, cracking Hardie board control joints, or feathering wood grain. TopVolk mixes a biodegradable, plant-safe detergent for siding and stucco and switches to an oxalic-acid brightener for cedar tannin stains. Roofs never get a straight-stream wash — moss and algae come off with a low-pressure sodium hypochlorite soft wash applied from the ground or a ladder, never a blast that lifts shingle granules. Every surface gets tested on a small section first."
  - q: "How long does a power wash last before moss or algae comes back?"
    a: "A soft-washed roof or deck in Woodinville's climate typically stays clean 12-18 months, while a driveway or patio can go 2-3 years before oil stains or moss return, depending on tree cover and shade. North-facing surfaces under fir or maple canopy near the river trail need attention sooner than open, sun-exposed sections. TopVolk doesn't sell a written warranty against nature regrowing moss, but the sodium hypochlorite soft-wash treatment includes an algaecide residual that slows regrowth compared to a plain water rinse. Deck and fence washes tied to a staining job hold up as long as the stain itself, usually 3-5 years."
