title: "Woodinville ADU Construction — DADU & Septic Lot Experts"

answer: "TopVolk Construction builds ADUs in Woodinville, WA under HB 1337 — $150K-$220K, 4-7 months, owner-led with contract deadline penalties."

intro: |
  Ask about a detached accessory dwelling unit on a Hollywood Hill wine country property and the conversation starts with septic, not square footage. TopVolk Construction builds DADUs, attached ADUs, and basement conversions across Woodinville under WA HB 1337, which allows up to two accessory units on most single-family lots statewide — projects run $150,000 to $220,000 depending on scope and finish level, with a 4 to 7 month timeline from design through final inspection. Vladislav Volkov walks every Woodinville site personally, because a lot near DeYoung Park with municipal sewer plays by different rules than a horse property off Cottage Lake with an onsite septic system. A rental unit above a garage near the Sammamish River Trail needs flood zone verification before anyone pulls a permit. Kitchenettes in these units often land a KitchenAid range and a Bosch dishwasher — small footprint, full-size expectations from Woodinville homeowners.

localContext: |
  Woodinville splits into two very different permitting worlds. Inside city limits near 98072, lots close to the Woodinville Schoolhouse and the downtown wine district run through the City of Woodinville's own permit center, with plan review typically taking 6 to 10 weeks for a detached ADU. Head out toward Cottage Lake or Hollywood Hill — much of it unincorporated and stamped 98077 — and the jurisdiction switches to King County DPER, where onsite sewage system approval gets folded into the ADU application if the lot isn't on a public sewer line. Housing stock here runs from 1970s and 80s ranch homes on acre-plus lots to newer custom builds with three-car garages, and a lot of those older homes still have galvanized supply lines that need addressing before a shared water connection to a new DADU makes sense. Heavy fall and winter rain, close to 40 inches a year, means any DADU going up on a sloped Hollywood Hill lot needs real drainage planning, not just a French drain as an afterthought.

commonProblems:
  - title: "DADU, Attached ADU, or Basement Conversion — Picking the Right Structure"
    description: "WA HB 1337 opened the door to two ADUs per lot, but which type pencils out depends on the property. A detached unit over a rebuilt garage clears zoning fastest on flat Woodinville lots, while a basement conversion in a 1980s daylight rancher near Wellington Hills can save $40,000-$60,000 if the ceiling height already clears 7 feet and the egress window well is straightforward to cut. Attached ADUs work well when a lot's setbacks are tight, sharing a wall instead of eating side yard. TopVolk runs the numbers on all three during the free consultation — rental comps, construction cost per square foot, and which option gets through King County DPER or City of Woodinville review fastest. Most homeowners land on detached once they see the rental income delta."
  - title: "Septic Capacity Limits ADU Bedroom Count on Unincorporated Lots"
    description: "A lot of Woodinville's larger acreage near Cottage Lake and Hollywood Hill sits outside the sewer district, running on an onsite septic system instead. King County DPER caps bedroom count in a new DADU based on what the existing drain field can handle, and a system sized for a 3-bedroom main house 25 years ago might not support a 2-bedroom accessory unit without an expansion. TopVolk orders a septic evaluation early — usually $2,500 to $5,000 — before finalizing the DADU floor plan, because redesigning after plan review costs more than redesigning on paper. Where capacity allows, we tie in a separate side sewer stub; where it doesn't, a shared connection with a new distribution box keeps the project moving without a full drain field replacement."
  - title: "Permit Jurisdiction Splits the Project Timeline in Half"
    description: "City of Woodinville and King County DPER don't run the same clock. Inside the incorporated core near the Woodinville Schoolhouse, a DADU application with pre-approved plans can clear plan review in 6 to 8 weeks. Out in unincorporated Hollywood Hill or the Cottage Lake area, DPER handles zoning, septic, and building permit review together, and that combined process regularly stretches past 12 weeks, especially if a critical areas report gets triggered near a stream buffer. Height limit sits at 24 feet for a detached unit in most zones, and setback requirements shift depending on lot size and whether the property backs onto a King County-designated wetland. TopVolk pulls preliminary zoning research before drawing anything, so the design matches what the AHJ will actually approve — not a redesign after rejection."
  - title: "What Actually Drives ADU Cost — Line-Item Pricing, Not a Ballpark"
    description: "A studio DADU with a simple shed roof and vinyl-clad windows lands near $150,000. Push it to a two-bedroom unit with a walk-in shower, quartz counters, a Bosch or KitchenAid appliance package, and Milgard or Marvin windows, and the number climbs toward $220,000. Foundation type matters too — a pier-and-beam build on a sloped Hollywood Hill lot costs more than a slab-on-grade DADU on flat ground near downtown Woodinville. TopVolk quotes every project with line-item pricing, not a range, so a homeowner sees exactly what the LVL beam, the Hardie siding package, and the electrical sub-panel upgrade cost before signing. Missed completion dates carry a penalty written into the contract itself, which keeps the schedule honest on a project this size."
  - title: "PNW Weather Wears On ADU Exteriors Faster Than People Expect"
    description: "Cedar siding on a north-facing DADU wall in a shaded Hollywood Hill lot picks up moss within two or three wet seasons if it's not detailed with proper rainscreen venting. Most Woodinville ADU builds now go with Hardie cement-board siding instead — it shrugs off the roughly 40 inches of rain we get October through May and doesn't need refinishing every few years. Composite decking from Trex or TimberTech holds up better than pressure-treated lumber on an ADU's covered porch, especially with the freeze-thaw swings that hit the higher ground toward Hollywood Hill and Cottage Lake. Crawlspace ADUs need a proper vapor barrier and R-49 attic insulation to meet current energy code, not just what passed inspection a decade ago. Expect a 25-30 year lifespan on Hardie siding and roughly 15 years before a mini-split needs major service."

