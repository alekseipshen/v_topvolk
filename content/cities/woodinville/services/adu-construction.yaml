  - q: "What does a DADU cost in Woodinville?"
    a: "A detached ADU in Woodinville typically runs $150,000 to $220,000 depending on square footage, foundation type, and finish level — a simple studio lands at the low end, a two-bedroom unit with premium appliances and large-format porcelain tile pushes toward the top. Site conditions matter too: a sloped Hollywood Hill lot needing a pier foundation costs more than a flat lot near downtown. TopVolk provides a free estimate with line-item pricing after the site walk, not a phone-quote range. Call (206) 591-1096 for a free consultation and a written quote within a few days."
  - q: "Do I need a separate permit if my Woodinville property is on King County DPER instead of city jurisdiction?"
    a: "Yes — if the lot sits in unincorporated Woodinville near Cottage Lake or Hollywood Hill, King County DPER handles zoning, septic, and building permit review as one combined application, typically 10-14 weeks for a DADU. Inside city limits near the Woodinville Schoolhouse, the City of Woodinville runs its own permit center and often clears pre-approved plans faster, closer to 6-8 weeks. TopVolk is a WA Licensed Contractor and prepares the full permit package — site plan, structural drawings, septic evaluation if needed — before submission so there's no back-and-forth on missing documents. Every application gets tracked through plan review, rough-in inspection, and final sign-off."
  - q: "Can a DADU run on a mini-split instead of extending gas service from the main house?"
    a: "Most Woodinville DADUs go this route — a Mitsubishi ductless mini-split handles heating and cooling in under 800 square feet without a gas line extension, and pairing it with a Rinnai or Navien tankless water heater covers hot water without a dedicated gas meter. That keeps utility separation simpler when King County DPER or the city asks whether the ADU has independent service or a shared connection. Electric service typically means adding a sub-panel off the main panel rather than a full second meter, which is cheaper and faster to permit. TopVolk coordinates the MEP scope directly with the AHJ during plan review."
  - q: "How long does an ADU built by TopVolk last in Woodinville's climate, and what's covered?"
    a: "Structural framing, Douglas-fir standard on these builds, is designed to the IRC and should outlast the mortgage. Hardie siding carries a 30-year manufacturer warranty and holds up well against the moss and mildew that Woodinville's shaded, north-facing lots see every wet season. TopVolk backs workmanship for one year after final inspection, and the contract includes a deadline penalty if the project runs past the agreed completion date — that's a commitment on paper, not just a promise. Appliances like Bosch or KitchenAid carry their own manufacturer coverage separate from the construction warranty."
  - q: "Do you build ADUs outside Woodinville too?"
    a: "TopVolk covers Bothell, Kirkland, Redmond, Duvall, and Snohomish alongside Woodinville, plus the rest of King, Snohomish, Pierce, and Kitsap counties — 100+ projects completed since 2023. Scheduling windows run 4-7 months for a full ADU from design through final inspection, and that timeline holds whether the lot is on city sewer or a King County DPER septic system. Vladislav handles every project personally, so there's no separate sales team to loop in when scheduling changes. Call (206) 591-1096 to get on the calendar."