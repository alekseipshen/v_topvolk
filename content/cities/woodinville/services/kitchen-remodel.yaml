title: "Woodinville Kitchen Remodel — Open Plans for Wine Country Homes"

intro: |
  Hollywood Hill in 98077 is full of 1988-to-1998 custom builds that look impressive from the
  street but have kitchens sized for a different era — 30-inch ranges, 100-amp panels, and walls
  that cut off the view. Upgrading to a Thermador 36-inch range isn't a countertop swap; it
  means a gas line reroute, a panel upgrade, and ventilation that actually exhausts to the
  outside. Vladislav Volkov handles all of that under one contract, with deadlines written in
  and penalties paid if missed.

localContext: |
  Woodinville splits between two permit jurisdictions based on where your parcel sits. Homes
  in the incorporated city limits — most of 98072 off SR-522 — pull permits through the City
  of Woodinville. Properties on Hollywood Hill and the rural east side in 98077 fall under
  King County DPER. Either way, plan review for a full kitchen with structural work runs 4 to
  8 weeks. The 1980s builder stock near Bear Creek Road typically has 100-amp panels, galvanized
  supply lines, and kitchens that were never designed to hold a Sub-Zero column or a 48-inch
  island. Hollywood Hill custom homes have the square footage — just not always the layout to
  match it.

commonProblems:
  - title: "Structural Walls Blocking Open-Concept Layouts in 1990s Builds"
    description: "Woodinville homes from the late 1980s and early 90s were designed around separate
      rooms. The wall between kitchen and living or dining space is load-bearing more often than
      not. Removing it requires a load calculation, an LVL beam engineered to span the opening,
      and temporary shoring during installation. King County DPER requires stamped structural
      drawings before issuing the permit."

  - title: "100-Amp Panels That Can't Handle Modern Appliance Loads"
    description: "A Bosch induction cooktop draws 40-50 amps on its own. Add a wall oven, a
      dishwasher, and a refrigerator compressor cycling on, and a 100-amp panel hits its limit
      fast. Panel upgrades to 200 amps in Woodinville require a permit through the city or
      county plus Puget Sound Energy scheduling a meter upgrade — that coordination alone adds
      2-3 weeks to the project timeline. Plan for it upfront."

  - title: "Gas Line Undersizing for Upgraded Ranges"
    description: "A 36-inch Wolf or Thermador Pro Grand runs 15,000 to 20,000 BTUs per burner.
      The standard 1/2-inch black iron gas line feeding most 1990s kitchens can't deliver that
      volume at proper pressure. Re-piping to 3/4-inch requires a licensed plumber, a gas permit,
      and a rough-in inspection before the range gets set in place. Skipping this step causes
      burner performance issues that show up immediately."

faq:
  - q: "How fast can you get to Woodinville for a kitchen consultation?"
    a: "Woodinville is on our regular route — we run jobs in Redmond, Bothell, and Kirkland weekly,
      so travel isn't a factor. Call (206) 591-1096 to set up a free on-site consultation.
      Usually available within the week, sometimes sooner."

  - q: "Do you work with Thermador, Bosch, and Sub-Zero in kitchen remodels?"
    a: "Yes — Bosch and Thermador are the most common specs we see in Woodinville kitchens, with
      Sub-Zero column refrigerators on Hollywood Hill properties. We coordinate rough-in
      dimensions, electrical circuits, and ventilation CFM requirements around the specific
      model before ordering cabinets or setting countertops. KitchenAid and Wolf come up
      frequently too."

  - q: "What does a kitchen remodel in Woodinville typically cost and how long does it take?"
    a: "Scope drives cost more than square footage. A layout-only remodel with semi-custom cabinets,
      quartz countertops, and a new appliance package runs $45,000 to $80,000. Add a wall
      removal, panel upgrade, and full custom cabinetry and it climbs to $100,000 or beyond.
      From permit approval through blue tape walkthrough, expect 8 to 12 weeks for a full
      kitchen. Vladislav is a WA Licensed Contractor with 100+ projects completed since 2023 —
      and the timeline in your contract has real consequences if it slips. Schedule a free
      on-site estimate at (206) 591-1096."