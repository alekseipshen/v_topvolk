  - q: "Do you work with Moen and Kohler fixtures in Renton bathrooms?"
    a: |
      Yes — Moen, Kohler, and Delta are what's in most existing Renton
      bathrooms. For replacements we spec Moen or Kohler fixtures depending
      on the rough-in configuration. Full valve body swaps, cartridge
      upgrades, and replumbing for drain relocation are all standard scope
      on a bathroom remodel.
  - q: "What does a full bathroom remodel in Renton cost, and how long does it take?"
    a: |
      A full master bath gut-and-rebuild runs $30,000-$75,000+ depending
      on tile choice, whether drain relocation is needed, and curbless
      shower conversion complexity. City of Renton building permits add
      4-8 weeks for plan review on plumbing or structural changes. On-site
      work typically runs 4-7 weeks once permits are in hand. Deadline
      penalties are written into the contract — TopVolk pays if we miss
      the agreed completion date. Call (206) 591-1096 to get a real
      number for your specific project. WA Licensed Contractor, 100+
      projects completed since 2023.