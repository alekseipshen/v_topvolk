title: "Renton Bathroom Remodel — What's Behind That 1990s Tile"

intro: |
  Kennydale homes along Lake Washington Blvd (98056) and the Renton
  Highlands off NE 4th Street (98059) look solid from the outside — the
  bathrooms tell a different story. The construction wave that built out
  south Renton through the late '80s and '90s skipped waterproofing
  membranes entirely. Behind most tub surrounds it's greenboard drywall,
  sometimes just painted. Kohler fixtures from 1994 still function until
  they don't — and by then the valve seat is shot and the subfloor has
  been wet for six months.

localContext: |
  South Renton's grid streets between Rainier Ave S and SR-167 (98055,
  98057) were built fast as affordable suburban housing — two-bath layouts,
  drop-in tubs, 4×4 ceramic tile on drywall backer. North-facing bathrooms
  in the Cascade and Talbot Hill neighborhoods trap moisture for six months
  straight. Older mid-century ranchers near the Cedar River (98055) come
  with original galvanized drain lines that corrode from the inside out and
  need rerouting before new tile goes anywhere near them.

commonProblems:
  - title: "No Waterproofing Membrane Behind the Tile"
    description: |
      Renton's 1985-2000 builds used greenboard drywall as tub surround
      backer — not Schluter Kerdi, not RedGard, not anything rated for wet
      areas. Cracked grout lets water in. By the time you feel soft spots
      on the floor or see staining on the ceiling below, the rim joist and
      subfloor framing are already compromised. Every shower we rebuild in
      98058 and 98059 gets a full waterproofing membrane system before a
      single tile goes up.
  - title: "Galvanized Drain Lines in Pre-1980 Renton Ranchers"
    description: |
      Mid-century homes near Talbot Hill and Cedar River (98055) were
      plumbed with galvanized steel drain lines that corrode from the
      inside out — quietly, for decades. Connecting new PVC to old cast-iron
      requires proper no-hub couplings to pass rough-in inspection with the
      City of Renton. Skipping that step fails the AHJ sign-off and adds
      weeks to the project. We scope the existing drain stack before demo
      starts.
  - title: "Undersized Exhaust Fans Feeding Mold Growth"
    description: |
      Builder-spec exhaust fans from 1990s Renton construction typically
      move 30-40 CFM — well under IRC minimums for a standard 50 sq ft
      bathroom. Renton averages roughly 37 inches of rain a year, and
      north-facing master baths with no direct sun stay humid into June.
      Upgrading to a 110 CFM unit during remodel is standard. Skip the
      ventilation work and the new Schluter-set tile will show mold in the
      grout within two years.

