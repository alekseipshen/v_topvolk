title: "Renton HVAC — Heat Pumps, Mini-Splits & Duct Work"

intro: |
  The Renton Highlands — zip 98056 — still has whole streets of 1950s and 60s
  ramblers running on gas furnaces nobody's touched since the Carter administration.
  Cold bedrooms at the back of the house. January bills that don't match the square
  footage. Mitsubishi mini-splits are solving the zoning problem in ADUs and finished
  basements without a complete duct overhaul. This is HVAC as part of real remodels —
  additions, ADUs, full gut renovations — handled by Vladislav Volkov, WA Licensed
  Contractor, 100+ projects completed since 2023 across King County. Schedule a free
  on-site consultation — Vladislav does it himself, not a sales rep. Call (206) 591-1096.

localContext: |
  Zip 98058 covers Benson Hill, annexed into Renton in 2008. Those 1970s-80s tract
  homes came with builder-grade forced-air systems — duct runs laid into unconditioned
  attic space, flex duct with leaking joints, no return air in secondary bedrooms.
  Kennydale's hillside homes near Lake Washington tend to be newer, but finished
  basement additions routinely outgrow the original mechanical system. That capacity
  mismatch drives the hot/cold room complaints we see consistently across King County
  remodels. The mild but relentlessly humid climate — Renton averages close to 37 inches
  of rain annually — means vapor barriers in crawlspaces and proper duct insulation
  aren't optional. Unconditioned attic duct runs sweat in summer. Flex duct joints
  that were taped and never mastic-sealed separate over time. These aren't abstract
  concerns — they're exactly what a rough-in inspection in Renton's permit center
  will flag before a system can pass final.

commonProblems:
  - title: "Gas Furnace Replacement and Heat Pump Conversion in Renton Highlands"
    description: |
      Original gas furnaces in 98056 are hitting 25-30 years old — past the heat
      exchanger's typical service life. A cracked heat exchanger means carbon monoxide
      risk and a forced replacement call. Modern 95%+ AFUE units and cold-climate heat
      pumps qualify for Inflation Reduction Act rebates up to $2,000. Lennox and Carrier
      both have strong cold-climate ratings for Renton winters. Seattle Energy Code
      requires a Manual J load calculation before any new equipment gets permitted through
      Renton's permit center. That load calc isn't bureaucratic overhead — it's how you
      avoid installing a unit that's 30% oversized and short-cycles all winter. Renton
      pulls mechanical permits through its own building department; plan review for
      a standard heat pump conversion typically runs two to three weeks.
  - title: "Ductless Mini-Split Installation for ADUs Under WA HB 1337"
    description: |
      Under WA HB 1337 (2024), up to two ADUs are allowed on most single-family lots
      in Renton. A detached ADU — DADU — typically can't tap into the main home's duct
      system. Either it's undersized, or the AHJ won't permit the extension. Mitsubishi
      and Daikin ductless units handle 400-800 sq ft off a single head unit with no new
      ductwork. Refrigerant line sets run through exterior walls; the indoor evaporator
      mounts high on the wall. Separate thermostat control from day one. For a new DADU
      on a Renton lot, mechanical permitting is bundled with the ADU building permit —
      one plan review covers the whole scope. Daikin's cold-climate compressor maintains
      rated output down to 5°F, which covers Renton's occasional freeze-thaw events
      in January without supplemental heat strip.
  - title: "Ductwork Leakage and Rebalancing in Benson Hill Tract Housing"
    description: |
      Flex duct in unconditioned attics loses 20-30% of conditioned air through leaking
      joints — standard in Renton's 98058 housing stock. Mastic sealant at every
      connection, R-8 duct wrap on attic runs, and a balancing pass fix the hot/cold
      room problem without replacing the equipment. Pairing that work with an ecobee
      thermostat and remote sensors gives room-by-room temperature data. One two-day
      project often eliminates what homeowners assumed was a full system failure.
      The fix is straightforward — but it does require a mechanical permit in Renton
      if new duct sections are being added, not just sealed. Vladislav pulls the permit,
      schedules the rough-in inspection, and handles the final walkthrough. No
      subcontracting the permit paperwork to a separate filing service.

faq:
  - q: "How fast can you get to Renton for HVAC work?"
    a: |
      Renton is a straightforward drive — I-405 or Rainier Ave S from South King County,
      typically 20-30 minutes. Vladislav does the site consultation himself, not a sales
      rep. Call (206) 591-1096 to set up a free on-site visit. Same-week scheduling is
      generally available for initial assessments.
  - q: "Do you install Mitsubishi and Daikin mini-split systems in Renton?"
    a: |
      Yes. Most of the addition and ADU mechanical work we do uses Mitsubishi Electric or
      Daikin units — both perform well below freezing, which matters when freeze-thaw
      cycles hit Renton's hillside neighborhoods in January. Nest and ecobee smart
      thermostats pair cleanly with either brand for multi-zone control. As a WA Licensed
      Contractor handling full remodel scopes, we coordinate mechanical with framing and
      electrical — one permit package, one point of contact.
  - q: "What does HVAC work on a remodel actually cost in Renton?"
    a: |
      Mini-split installation for a new ADU typically runs $3,500-$6,500 depending on
      line set length and panel work. Full duct sealing and rebalancing runs $1,200-$2,500.
      Heat pump conversion on existing forced-air runs $7,000-$14,000 before IRA rebates.
      Every contract includes a written deadline penalty clause — if we miss the agreed
      completion date, we pay a penalty. That commitment is in the paperwork, not a
      verbal promise. 100+ projects completed since 2023 means the schedule estimates
      are based on real Renton permit timelines, not optimistic guesses. Call
      (206) 591-1096 for a line-item quote on your specific scope.