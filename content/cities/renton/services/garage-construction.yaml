title: "Renton Garage Construction — Detached Builds & ADU Above"

intro: |
  Kennydale and Renton Highlands — zip codes 98056 and 98059 — are full of
  mid-century ranchers sitting on 8,000-to-10,000-square-foot lots that were
  finished with a single one-car carport. That was enough in 1965. Today's
  homeowner wants a proper two-car detached garage, often with a finished loft
  above for a rental unit or home office under WA HB 1337. Getting the 50A EV
  charger circuit and a dedicated 20A outlet for a GE chest freezer or shop
  tools spec'd into the framing plan saves a messy and expensive retrofit later.

localContext: |
  Older neighborhoods around Renton's downtown core — zip 98055 — have housing
  from the 1940s and 1950s, some on post-and-pier foundations with no garage at
  all. Talbot Hill runs a similar mix. Farther east in zip 98059, 1980s tract
  development brought attached two-car garages standard, but those structures
  are aging fast and plenty of owners want something bigger or separate. Either
  tearing down and rebuilding or adding a fully detached structure requires
  permit review — City of Renton for incorporated parcels, King County DPER for
  anything in unincorporated county territory.

commonProblems:
  - title: "Jurisdiction Lines That Quietly Change the Setback Rules"
    description: |
      Renton's incorporated boundaries and unincorporated King County overlap
      in ways that aren't obvious on a standard parcel map — and the AHJ is
      different for each. A garage footprint that satisfies Renton's 5-foot
      rear setback may fail under DPER's rules if the lot sits outside city
      limits. Confirming jurisdiction, pulling a site survey, and checking FAR
      and lot coverage before design work starts prevents costly plan-review
      redesigns and the four-to-eight weeks of delay that come with them.

  - title: "New Garage Exterior That Reads Wrong Against the Main House"
    description: |
      Renton's 1970s and 1980s tract homes mostly used T-111 plywood siding or
      early vinyl — neither survives another decade of PNW rain without
      problems. A new detached garage needs to match the existing roofline
      pitch (typically 4:12 or 5:12), fascia trim, and siding profile of the
      main house. Hardie cement-board lap siding is the right call for new
      construction here. It doesn't absorb moisture, holds paint through wet
      winters, and passes Renton final inspections without a flag.

  - title: "Undersized Slab and No EV Conduit — Expensive Fixes After the Pour"
    description: |
      A 4-inch fiber-reinforced concrete slab meets minimum code, but Renton's
      clay-heavy subgrade holds moisture — base prep is not optional. Four
      inches of compacted gravel and a vapor barrier before the pour is
      standard practice here. Pre-sleeve a 50A or 60A conduit for EV charging
      or a Bosch shop circuit while the forms are still up. Once that slab
      cures, cutting it open for a missed conduit runs $1,500 to $3,000 in
      extra labor — more if there's rebar in the way.

faq:
  - q: "How fast can you get to Renton for a garage build consultation?"
    a: |
      Renton is about 20-25 minutes south of Seattle via I-405 or SR-167.
      Vladislav does free on-site consultations most weekdays — he's the one
      who actually runs the project, not a commissioned closer. Call
      (206) 591-1096 to schedule. TopVolk is a WA Licensed Contractor with
      100+ projects completed since 2017 across King, Snohomish, and Pierce
      counties.

  - q: "Do you recommend specific garage door brands for Renton's wet winters?"
    a: |
      Clopay and CHI make solid insulated steel doors rated R-12 to R-18 —
      appropriate spec for a heated workshop garage. Weatherstripping quality
      and a tight bottom seal matter more than brand in Renton's Oct-to-May
      rain season. We frame the rough opening to your door spec and coordinate
      delivery with your supplier, or source it ourselves if that's easier.

  - q: "Can you build a DADU apartment above a new detached garage in Renton?"
    a: |
      Yes. WA HB 1337 (2024) allows up to two ADUs per single-family lot — a
      finished space above a detached garage qualifies as a DADU. City of
      Renton plan review on a garage-plus-DADU project typically runs 6-10
      weeks. End-to-end including permits, figure 4-7 months. Deadline
      penalties are written into every TopVolk contract. Call (206) 591-1096
      or schedule a free on-site visit — Vladislav will walk the lot with you
      and review setbacks and FAR before design dollars get spent.