title: "Renton Drywall Installation — Level 5 Finishes, Real Permits"

intro: |
  The Highlands and Talbot Hill went up fast between 1960 and 1975 — tract homes
  with 3/8-inch drywall still hiding behind cabinetry, popcorn ceilings in every
  room, and walls that telegraph every seam under decent lighting. Renton has
  thousands of these houses in 98055 and 98056. Kitchen remodels swapping out old
  GE ranges keep exposing what's underneath. Getting a clean finish this time means
  starting with the right board and the right finish level.

  Level 4 is standard for walls under flat paint. Level 5 — a full skim coat over
  the entire panel face — is required any time you're using semi-gloss, eggshell,
  or any lighting that rakes across the wall at an angle. Renton split-levels with
  large east- or west-facing windows make every imperfection visible by mid-afternoon.
  One coat of mud over taped joints isn't enough. Three coats, sanded between each,
  is the baseline for a wall that holds up under real conditions.

localContext: |
  Renton's permit work runs through the City of Renton Development Services
  Division — separate from King County DPER, which handles the unincorporated East
  Renton Highlands fringe past 98059. In the core city (98055, 98056, 98057), the
  housing breaks into clear eras: post-war ranchers and 1960s split-levels around
  Benson Hill and Renton Hill, and newer tract construction in Cascade and Kennydale.
  The older stock is where drywall problems concentrate — original thin panels,
  multi-layer texture, and basement walls that absorbed moisture from the Cedar River
  lowlands for decades.

  Ground moisture in the Cedar River valley stays elevated well into May. Crawlspace
  humidity works its way into basement framing year-round, and it shows up on job
  sites as delaminating original drywall, soft spots behind baseboards, and black
  staining at the bottom plate. Fixing the finish without addressing the moisture
  source means doing the same job twice in five years.

commonProblems:
  - title: "Popcorn Texture on Pre-1980 Renton Ceilings"
    description: "Homes in The Highlands and Talbot Hill (98056) got spray texture on
      every ceiling through the 1970s. Skim-coating to a Level 4 or Level 5 finish
      requires proper removal first — not just painting over. Pre-1978 texture in
      these zip codes frequently tests positive for asbestos, which means certified
      abatement before any drywall work can start. After abatement, the ceiling deck
      typically needs a thin skim of all-purpose compound to fill pores left behind
      before you can achieve a consistent surface under new paint. Skipping that step
      shows up immediately once the first coat of eggshell goes on."

  - title: "Mold-Resistant Board in Renton Basement Remodels"
    description: "Ground moisture along the Cedar River corridor and the Renton
      lowlands (98055, 98057) degrades standard drywall in below-grade rooms within
      a few years. USG Sheetrock Mold Tough or National Gypsum purple board on
      basement walls, combined with a proper vapor barrier, is the correct spec.
      Skip the vapor barrier and the board choice stops mattering. DriCore subfloor
      panels under any floating floor add another layer between the slab and the
      living space — worth speccing on any basement conversion in the lowland
      corridors east of SR-167."

  - title: "Type-X Firecode Drywall for Garage and ADU Separation Walls"
    description: "ADU conversions are picking up across Renton under WA HB 1337. The
      IRC mandates 5/8-inch Type-X drywall on every wall and ceiling separating a
      garage from living space. City of Renton permit reviewers flag this at plan
      review — it's a common rejection point. Patch it with standard half-inch board
      and it fails rough-in inspection. The same requirement applies to the ceiling
      above an attached garage when there's habitable space overhead — a detail that
      catches a lot of Renton split-level conversions by surprise at final inspection."

faq:
  - q: "How fast can you get to Renton for a drywall project?"
    a: "Renton is roughly 20 minutes from Seattle via I-405 or Rainier Ave S.
      Vladislav can typically schedule an on-site walkthrough within a few days of
      your call. Reach him directly at (206) 591-1096 — no dispatcher, no sales
      staff, no callback queue."

  - q: "What drywall products do you spec for Renton remodels?"
    a: "Standard walls get 1/2-inch USG Sheetrock or CertainTeed. Basements and
      baths get purple board. ADU separation walls get 5/8-inch Type-X. QuietRock
      530 goes in where bedroom-to-bedroom sound transmission is the issue — common
      in 1970s Renton split-levels where original single-layer assemblies have zero
      blocking between units."

  - q: "Does drywall work in Renton require a permit?"
    a: "Standalone drywall replacement usually doesn't. Add it to an ADU conversion,
      structural remodel, or egress change and the City of Renton Development
      Services requires a permit — plan review runs 3-6 weeks for larger scopes.
      TopVolk is a WA Licensed Contractor; Vladislav handles permit coordination
      directly. 100+ projects completed since 2017. Call (206) 591-1096."

  - q: "What's the difference between Level 4 and Level 5 finish, and which one do I actually need?"
    a: "Level 4 is what most contractors deliver — joint compound over tape, two
      finish coats, sanded smooth. It holds up fine under flat or matte paint in
      low-light rooms. Level 5 adds a full skim coat over the entire panel face,
      filling the factory texture of the board itself. Semi-gloss, satin, and
      eggshell paints will read every surface variation under side-lighting —
      Renton homes in the Highlands and Kennydale with large west-facing windows
      expose Level 4 work clearly by afternoon. Vladislav will tell you which
      level your project actually needs based on the paint spec and the room's
      lighting conditions. Not every wall needs Level 5, but that decision should
      happen before the mud goes on, not after the paint goes up."