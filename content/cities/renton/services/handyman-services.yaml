  - q: "Do you handle Samsung, GE, and Whirlpool fixture replacements as part of handyman work?"
    a: |
      Fixture swaps are exactly what this service covers: faucets, toilets, light fixtures, ceiling fans, shower heads — Samsung, GE, Bosch, Whirlpool, Moen, Kohler. We disconnect the old unit, install the new one, test for leaks or function, and clean up before leaving. Full appliance repair — control boards, compressors, motors — is a different trade entirely. Remove-and-install, plus any rough-in adjustments to make a new fixture fit an older supply line, is squarely in our scope.

  - q: "Do handyman repairs in Renton require permits?"
    a: |
      Most punch-list items — caulking, fixture replacement, weatherstripping, smart doorbell and thermostat installs, deck board swaps — don't trigger a City of Renton permit. Structural repairs and anything touching the electrical panel do. Vladislav will walk through exactly what applies on the first call, so there are no surprises when work starts. Schedule a free on-site consultation at (206) 591-1096. WA Licensed Contractor.