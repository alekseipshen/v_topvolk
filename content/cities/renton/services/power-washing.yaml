  - q: "Do you wash composite decks differently than cedar or Hardie?"
    a: "Yes. Trex and TimberTech composites need soft-wash at 500-1,200 PSI max — higher pressure raises the surface texture and traps more grime long-term. Cedar handles more pressure to open the grain for stain penetration. Both surfaces get a sodium percarbonate detergent solution; nozzle distance and PSI get adjusted per material on site. Manufacturer warranty terms for composites specify maximum PSI — going over that voids the coverage, so it's worth knowing what's on your deck before anyone starts spraying."

