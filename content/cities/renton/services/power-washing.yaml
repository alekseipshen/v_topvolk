title: "Renton Power Washing — Moss Removal & Hardie Surface Prep"

intro: |
  Shade from mature Douglas-fir in the Highlands keeps cedar decks damp well into April — that's when moss colonies dig into the grain and stay. By mid-spring in 98058, north-facing surfaces have a full wet season of biological growth embedded in the wood fiber, not just sitting on top.

  TopVolk does power washing in Renton as prep work ahead of staining, sealing, or exterior repaints. Surface contamination is the main reason finish coats fail early in this climate. A coat of solid stain rolled over live algae will peel by February. That's not a paint failure — it's a surface prep failure.

localContext: |
  Renton's housing splits between postwar ramblers from the 1940s-60s in Talbot Hill and North Renton (98055 and 98057) and 1980s-90s builder-grade construction in the Benson Hill corridor. The older homes typically have cedar lap siding that's been repainted several times; newer builds run James Hardie cement-board or vinyl. Homes along Lake Washington Boulevard near Gene Coulon Park see heavier algae from the lakeside humidity. Both eras need thorough surface prep before any exterior paint job adheres correctly.

  The 98058 zip in Renton's Highlands plateau sits at higher elevation with more tree canopy. That canopy means longer shade windows and slower surface drying after rain — which runs roughly October through May at 37+ inches annually. Moss establishment is faster there than in open-lot subdivisions closer to I-405. The difference shows up clearly on roof overhangs and north-facing fence boards.

commonProblems:
  - title: "Moss and algae embedded in cedar decking before staining"
    description: "Cedar deck boards in Renton's shaded lots trap green and black algae in the grain — even after the surface looks dry. A pressure wash at 1,200-1,800 PSI with a sodium hypochlorite solution kills the biologics and opens the wood fiber so stain or sealant penetrates correctly. Skip this step and the finish coat peels in one winter.

    Composite decking from Trex or TimberTech needs a different approach entirely. Soft-wash at 500-800 PSI avoids raising the surface texture — high pressure on composites creates micro-abrasions that collect more grime over time and void some manufacturer warranties. Nozzle angle matters too: a zero-degree tip at close range will streak TimberTech's cap stock regardless of PSI."

  - title: "Efflorescence and oil staining on 1960s concrete driveways"
    description: "Concrete driveways on older Renton homes in the 98055 zip hold decades of motor oil, tire rubber, and calcium efflorescence from freeze-thaw cycles in the foothills. Hot-water washing at 3,000-3,500 PSI with a degreaser cuts through petroleum staining that cold water won't break down.

    Efflorescence — the white calcium blush bleeding out of poured concrete — needs a diluted muriatic acid pre-treatment before the pressure wash to clear completely. Cold-water rinsing alone redeposits the mineral salts. Without that acid step the white staining comes back within a few weeks of the next rain."

  - title: "Hardie and CertainTeed siding contamination before repainting"
    description: "James Hardie and CertainTeed panels on 1990s Renton homes collect mildew, oxidized paint chalk, and atmospheric grime over the years. Painting over contaminated fiber-cement without prep causes adhesion failure in one to two seasons — the new coat bonds to the contamination layer, not the panel face.

    A soft wash at 500-800 PSI with detergent clears it without etching the surface texture. High-pressure washing at 2,000+ PSI will damage the panel face permanently. This matters especially on older Hardie lap profiles where the factory finish has already thinned from previous paint cycles — the substrate is more exposed than it looks."

