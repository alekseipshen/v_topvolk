title: "Renton Plumbing — PEX Repiping & Water Heater Work"

intro: |
  The Highlands neighborhood off NE 10th Street filled in fast during Boeing's postwar hiring surge — row after row of houses built between 1945 and 1962, most still running the original galvanized supply lines. Kennydale (98056) tells a different story: 1980s construction with gray polybutylene pipe that holds pressure for years, then cracks at the acetal fittings behind your drywall. Last spring we wrapped a Rinnai tankless conversion on a Kennydale Beach Road house where the gas supply line off the meter was still 1/2-inch — nowhere near enough BTU capacity for the new unit.

localContext: |
  Renton's plumbing problems track closely with housing era. North Renton and the Highlands (98055) have dense 1940s-1960s construction — galvanized supply mains still in service after six decades of Puget Sound municipal water. Seattle's roughly 37 inches of annual rain keeps crawlspace moisture elevated in these older homes, which accelerates corrosion at pipe sections near exterior walls and foundation penetrations.

  Benson Hill and Cascade (98058) shifted to polybutylene during the 1983-1995 build window. That era also brought undersized gas supply runs — a problem that surfaces when homeowners upgrade to high-demand appliances like tankless units. Both areas fall under King County DPER for plumbing permits.

commonProblems:
  - title: "Galvanized Supply Lines Scaling Shut in Pre-1960 Highlands Homes"
    description: "Galvanized steel corrodes from the inside outward. The bore narrows quietly over decades until homeowners in 98055 notice the Moen kitchen faucet at a trickle while the dishwasher runs. Full repipe to PEX-A is the fix — rough-in work through floor cavities and crawlspaces, drywall opened at fixture locations, and a King County DPER rough-in inspection scheduled before walls close."
  - title: "Polybutylene Pipe Cracking at Fittings in Benson Hill and Cascade"
    description: "Cascade and Benson Hill (98058) saw heavy development right in the polybutylene installation era. The gray flexible pipe holds up longer than expected — the acetal plastic fittings fail under prolonged chlorine exposure from city water supply. Failures show as pinhole leaks at supply stops, inside wall cavities near washing machine boxes, or at shutoff valves. Full PEX replacement requires a King County DPER permit; open walls often reveal drain issues in the same cavities."
  - title: "Tankless Water Heater Conversion Stalling Due to Gas Line Undersizing"
    description: "A standard 40-gallon tank runs on 1/2-inch gas supply. A Navien NPE-240A or Rinnai RUR199iN peaks at 150,000-199,000 BTU — that needs 3/4-inch or 1-inch gas supply from the meter, sometimes a regulator upgrade too. Miss the upsize and the unit short-cycles on demand, never reaches set temperature. WA code also requires seismic strapping and a King County building permit on every installation — even a direct unit swap at the same location and fuel type. Getting the gas sizing calculation wrong is expensive: a failed rough-in inspection means tearing into finished walls a second time. Kennydale and Cascade homes from the 1983-1995 era regularly have undersized meter runs that nobody touched since original construction."

faq:
  - q: "How fast can you get to Renton for plumbing work?"
    a: "Renton runs straight down I-405. Vladislav does the site visit himself — typically at Highlands or Kennydale addresses within 24-48 hours. No estimator handoff, no sales call. Call (206) 591-1096."
  - q: "Do you work with Moen, Kohler, and Delta fixtures during bathroom remodels?"
    a: "Those are the three we specify most often in Renton remodels. Kohler in master bath applications, Moen for kitchens and secondary baths, Delta pressure-balance valves for shower rough-ins where clients want mid-range durability. We rough-in the valve body before drywall goes up and trim out at finish — getting that sequence right prevents leaks at the cartridge seat. Bosch dishwashers and GE ranges common in Renton kitchens connect through the same cabinet rough-in, so we coordinate appliance clearances before framing closes."
  - q: "What's involved in a full repipe in Renton, and does it need a permit?"
    a: "Yes — King County DPER requires a plumbing permit for a full galvanized-to-PEX repipe. Rough-in on a 1,200-1,500 sq ft Renton house runs 3-5 days, with a required inspection before drywall closes. Pricing depends on crawlspace access. Vladislav does the site visit and writes a direct line-item quote — deadline milestones written into the contract. TopVolk is a WA Licensed Contractor, 100+ projects completed since 2023. Call (206) 591-1096."