title: "Renton Insulation — Attic & Crawl Space Upgrades, 98056-98058"

intro: |
  The ranchers and split-levels through Kennydale and Benson Hill — neighborhoods that built up around Boeing's Renton plant during the 1960s and 70s — were designed for cheap energy. Most got R-11 in the attic, a vented crawl space with whatever poly sheeting the builder had on hand, and nothing on the rim joists. A Mitsubishi mini-split in one of those houses runs 40% longer than it should to hit 68 degrees on a wet February night. The building envelope is the problem, not the heating system. Vladislav has seen this pattern in dozens of Renton homes — same era, same deficiencies, same solution. Fix the envelope first.

localContext: |
  Renton's 98058 zip — Benson Hill, Cascade, and the residential pockets east of Rainier Ave toward Fairwood Greens — is packed with 1970s and 1980s ranch-style and split-level construction. Original attic insulation in these homes has typically settled to R-8 or R-10 over 40-plus years. The crawl spaces are often worse: crumbling poly sheeting, unprotected soil, and rim joist framing with zero treatment. Heating costs in these homes run noticeably higher than anything built to code after 2000. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017, operating across King County including Renton, Kennydale, and the Highlands.

commonProblems:
  - title: "Settled Attic Insulation Below R-49 in Kennydale and Highlands Homes"
    description: |
      Blown-in fiberglass from the late 1970s loses 30-40% of its loft over decades. Homes in Kennydale and the Highlands (98056) routinely test at R-8 to R-12 — nowhere near the R-49 required by Washington State Energy Code. Topping off with CertainTeed blown-in cellulose is the standard fix: it adds depth over existing material without full removal. PSE rebates for qualifying upgrades often run $0.20-0.25 per square foot of treated area. Work is completed on the agreed date. If the schedule slips on our end, a deadline penalty is written into the contract — no exceptions, no vague timelines.
  - title: "Failed Vapor Barriers and Wet Crawl Spaces Under Benson Hill Ranchers"
    description: |
      Renton gets 37-plus inches of rain annually, and most of it falls between October and May. Under 1960s and 70s construction in 98058, crawl space poly sheeting cracks and shifts over time, leaving bare soil exposed. Moisture climbs into the rim joist band and eventually the subfloor. A real fix means full encapsulation — a continuous 20-mil vapor barrier across the floor, rigid foam on foundation walls, and sealed vents. Left untreated, the moisture problem compounds: subfloor joists soften, HVAC efficiency drops, and mold becomes a realistic risk within a few years. Call (206) 591-1096 to schedule a free consultation before the next rainy season starts.
  - title: "Uninsulated Rim Joists Bleeding Heat on Split-Levels Through the Highlands"
    description: |
      The rim joist band at the top of the foundation wall is a major air-leakage point on 1970s split-levels — conditioned air escapes through every gap in the framing. Closed-cell spray foam addresses both problems at once: it air-seals and insulates in a single application, unlike fiberglass batt that stops conduction but not airflow. Talbot Hill and Highlands homes consistently show lower heating loads after rim joist treatment is done. The job typically takes one day. Two-component foam is applied at 2-3 inch depth, cures within hours, and requires no follow-up re-sealing. Straightforward work with measurable results.

faq:
  - q: "How fast can you get to Renton for an insulation assessment?"
    a: |
      Renton is a straight shot down I-405 or Rainier Ave S from the Seattle area. Typically available within a few days for a free on-site walk-through. Call (206) 591-1096 — Vladislav does the assessment himself, not a sales rep. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017. Free quote, line-item pricing, no pressure to commit on the spot.
  - q: "What insulation products do you use for attic and crawl space work?"
    a: |
      Attic top-offs use Owens Corning or CertainTeed blown-in products — both maintain R-value better than loose-fill fiberglass over decades. Rim joists get two-component closed-cell spray foam applied at 2-3 inch depth. Crawl space foundation walls get rigid foam board with taped seams. Materials are spec'd after an on-site look, not estimated over the phone. Every product is documented in the quote so you know exactly what's going in.
  - q: "Does PSE offer rebates for insulation work in Renton, and what does it cost?"
    a: |
      PSE rebates apply to attic insulation upgrades in Renton's service area — roughly $0.25 per square foot for blown-in. Attic-only jobs typically run $2,000-$5,000 depending on current R-value and square footage. Crawl encapsulation is quoted separately. We handle the rebate paperwork. A deadline penalty is written into every TopVolk contract — if we miss the agreed completion date, there are financial consequences on our end. Call (206) 591-1096 to schedule a free consultation and get a line-item quote.
  - q: "Do insulation projects in Renton require a King County building permit?"
    a: |
      In most cases, no. King County and the City of Renton do not require building permits for attic insulation top-offs or crawl space vapor barrier installation — these are treated as maintenance work on existing systems, not structural alterations. Closed-cell spray foam on rim joists also typically falls outside permit requirements when applied to an existing framing cavity. The exception is if insulation work is combined with mechanical changes — adding an ERV or modifying ductwork can trigger a mechanical permit. Vladislav reviews the full scope at the on-site assessment and flags anything that needs a permit before work begins. No surprises mid-project.