title: "Renton Home Additions — Adding Space Without Leaving 98056"

intro: |
  Kennydale's hillside ranchers and the Highlands blocks east of downtown Renton were built
  in the 1950s and 60s for smaller households — 900 square feet, two bedrooms, one bath.
  That footprint stops working the moment you add an aging parent, a remote job, or a rental
  unit. Buying up in Renton's market makes a $60K–$130K addition look rational by comparison.
  A Mitsubishi mini-split handles the new zone cleanly without touching original ductwork —
  and Vladislav pulls permits through Renton's own permit center, not a generic contractor.
  Renton's 37-inch annual rainfall means any addition needs a properly tied-in roof line and
  a 6-mil vapor barrier in the crawlspace — shortcuts there show up within one wet season.

localContext: |
  The 98058 zip stretches through Cascade and Maplewood, where 1960s split-levels and early-70s
  ranchers sit on lots large enough for a DADU under WA HB 1337. Foundation capacities vary
  across these neighborhoods — some post-and-pier footings in 98055 can't carry a second story
  without a concrete perimeter upgrade. Renton processes additions through its own Community and
  Economic Development permit center, separate from King County DPER, with plan review typically
  running 6–10 weeks on larger scopes. Valley-floor lots near the Cedar River corridor sometimes
  require a geotechnical report before Renton approves foundation plans — worth knowing before
  you're deep into design drawings. Highlands and Kennydale sit on more stable glacial soils,
  which generally speeds the structural review and keeps engineering costs predictable.

commonProblems:
  - title: "Existing Foundation Can't Support a Second Story"
    description: >
      Many Highlands-area homes in 98056 were poured with a single-story continuous concrete
      perimeter — no engineering margin for a bedroom addition above. Before framing starts,
      a structural engineer specifies LVL beam sizing and confirms whether footings need to be
      widened and deepened. Skipping that step fails rough-in inspection every time. Crawlspace
      additions in this climate also require a 6-mil vapor barrier upgrade — Renton inspectors
      flag this on every permit that touches the floor system. TopVolk is a WA Licensed
      Contractor — 100+ projects completed since 2017. Call (206) 591-1096 if you want
      Vladislav to walk the foundation before you commit to a design.
  - title: "ADU Setbacks and FAR Limits on Smaller City Lots"
    description: >
      WA HB 1337 (2024) allows two ADUs per single-family lot statewide, but Renton's zoning
      still enforces setback and lot coverage rules. A DADU on a 6,000 sq ft lot in 98055 often
      hits the rear setback or FAR limit before the footprint gets functional. Vladislav checks
      lot dimensions against current Renton municipal code before drawing plans — not after
      you've paid for architectural drawings. Properties within a half-mile of Renton Transit
      Center also qualify for the parking exemption under HB 1337, which can free up enough
      lot coverage to make the footprint actually livable.
  - title: "Tying New HVAC Into 40-Year-Old Ductwork"
    description: >
      A 400 sq ft mother-in-law suite can't borrow capacity from a mid-90s gas furnace already
      undersized for the main house. Most Renton ranchers have restricted attic space that makes
      new duct runs difficult through the rim joist. A Mitsubishi mini-split keeps the new zone
      independent — and swapping in a Navien tankless water heater handles the added hot water
      demand without pressure drops in the existing bathrooms. R-49 insulation in the new
      ceiling cavity is required under current WA energy code and makes a real difference
      during Renton's damp winters.

faq:
  - q: "How fast can you get to Renton for Home Additions?"
    a: >
      Renton is a standard service area — 98055, 98056, 98058, 98059 all covered with no travel
      surcharge. Call (206) 591-1096 to schedule a free on-site consultation. Vladislav comes
      out himself, not a salesperson — typically available within 3–5 business days for an
      initial walkthrough and lot measurement.
  - q: "Do you match existing Hardie siding and roofing when adding onto a Renton home?"
    a: >
      Yes — matching Hardie cement-board profiles is standard on additions to Renton's 1980s–90s
      tract homes in 98058 and 98059. For older cedar-sided houses in the Highlands, a belt-line
      detail often works better than trying to match weathered cedar. Roofing is matched by
      manufacturer series, not just shingle color. Exterior continuity is part of the scope,
      not an afterthought. Hardie holds up better than wood lap siding in Renton's wet season —
      another reason most homeowners in this zip switched to it during past renovations anyway.
  - q: "What's the realistic timeline for a home addition in Renton — start to finish?"
    a: >
      A straightforward attached addition (400–600 sq ft) runs 4–6 months end-to-end: 6–10 weeks
      for Renton permit review, then 8–12 weeks of construction including the blue tape walkthrough
      and punch list. A DADU under WA HB 1337 with separate utility connection adds time for
      utility coordination with Puget Sound Energy and the city. Vladislav writes a fixed schedule
      into the contract — with a deadline penalty clause if we miss it. Rough-in inspection and
      final inspection slots through Renton's permit center typically run 5–10 business days out;
      that wait is already factored into the estimate you'll get at the consultation.