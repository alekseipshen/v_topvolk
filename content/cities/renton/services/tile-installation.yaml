title: "Renton Tile Installation — Waterproofing & Heated Floors in 98055"

intro: |
  Kennydale and the Renton Highlands run along Lake Washington's eastern shore — neighborhoods where 1980s and 1990s tile work has spent decades absorbing shower humidity and PNW rain. Shower walls set in organic mastic over standard drywall fail quietly; grout cracks appear first, but the backer board is often already soft by then. A kitchen remodel swapping in a Bosch dishwasher or KitchenAid range typically uncovers 30-year-old backsplash tile that's overdue for replacement. TopVolk Construction has completed 100+ projects across King County since 2023.

localContext: |
  South Renton near The Landing (98055, 98057) is mostly 1960s and 1970s slab-on-grade construction — the foundation type that causes the most tile problems, because decades of settlement leave floors measurably out of level. East Renton Highlands (98059) runs newer: 1990s to early 2000s tract homes with original builder-grade ceramic tile in bathrooms. Most of that tile was adhesive-set over cement board without any waterproofing membrane behind shower walls. Looks fine on the surface until it isn't.

commonProblems:
  - title: "Shower Waterproofing Failures Behind Renton's Older Bathroom Tile"
    description: "Renton's 1970s and 1980s bathrooms were tiled over standard drywall using organic mastic adhesive — no cement board, no waterproofing membrane behind them. Seattle's 37 inches of annual rain keeps indoor humidity elevated from October through May, and shower steam pushes through grout joints over years. The fix is full demo to bare studs, Schluter Kerdi membrane installed over cement board backer, then a rough-in inspection before any new tile goes up. Surface regrouting doesn't address moisture that has already penetrated the wall. By the time the grout cracks are visible, the substrate is already compromised."

  - title: "Large-Format Porcelain Cracking Over Settled Slab-on-Grade Floors"
    description: "32x32 and 24x48 porcelain tiles have almost zero flex tolerance. Slab-on-grade foundations in South Renton's 98055 zip code have often shifted a quarter-inch or more over five decades. Without laser-leveling the substrate first and applying self-leveling compound to low spots, large-format tile develops lippage and cracks within the first year. Substrate prep takes a full day on its own. That's the part homeowners don't see, and it's what determines whether the tile holds up over the next decade."

  - title: "Electrical Rough-In Required Before Backsplash Tile in Kitchen Remodels"
    description: "In 1960s and 1970s Renton kitchens, wall outlets sit low — built for original 4-inch backsplash tile, not the full-height runs that go with today's range hood upgrades. A Samsung or Bosch hood pulling 600+ CFM needs proper electrical clearance, and tile can't run over outlets. Electrical rough-in comes first. MEP coordination at the planning stage is the only way to avoid cutting into finished tile later. This step gets skipped more often than it should."

