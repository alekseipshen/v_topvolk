title: "Renton Deck Installation — Composite Decking & Permit Pulls"

intro: |
  Shaded lots in Kennydale and along the Cedar River corridor (98055, 98056)
  moss over untreated cedar decking inside a single wet season. That's the
  first material conversation on every Renton deck job — cedar versus Trex
  or TimberTech composite. Mid-century ranchers in the Highlands and 1980s
  split-levels off Benson Road both require the same thing regardless of what
  boards you pick: a King County DPER permit pull and a ledger flashing
  inspection before a single board goes down.

localContext: |
  Renton's 98058 zip — Fairwood, Cascade, the streets south of Petrovitsky
  Road — runs mostly 1980s and early 1990s tract construction. Those homes
  often have original pressure-treated deck frames pushing 30 years, with rim
  joists that have absorbed moisture for decades. The 98056 zip (Kennydale)
  skews older: mid-century ranchers from Renton's Boeing expansion era, some
  with original post-and-pier deck foundations that never had permit
  documentation and need full replacement to meet current IRC code.

commonProblems:
  - title: "North-facing cedar decks moss over in under two seasons"
    description: >-
      North-facing decks in Kennydale and East Renton get under four hours of
      direct sun in winter — untreated cedar shows visible moss growth within
      18 months on those lots. Trex Transcend or TimberTech Azek composite
      boards eliminate the annual sealing cycle. Ground-contact PT lumber
      remains code-required at all post bases and members within 6 inches of
      grade, regardless of which field boards you choose.
  - title: "Ledger-to-rim-joist attachment is where Renton decks rot first"
    description: >-
      Attaching a ledger board to an existing rim joist without through-flashing
      is how 1980s Renton decks end up with rot behind the siding within a
      decade. King County DPER requires a ledger flashing inspection before
      decking installs. Simpson Strong-Tie joist hangers on every rafter tail,
      aluminum flashing lapped over the WRB — adds a day to the schedule but
      prevents a four-figure rot repair five years out.
  - title: "Post footings poured too shallow start racking within five years"
    description: >-
      Renton's frost depth runs 12 to 18 inches depending on lot elevation and
      soil type — flat Cedar River valley lots behave differently than hillside
      Kennydale yards. Footings need poured concrete below that line, sized for
      the tributary load above. Ground-contact PT lumber is required at any post
      base within 6 inches of grade. Undersized footings in Renton's clay-heavy
      soils are the most common structural failure on decks built by others.

faq:
  - q: "How fast can you get to Renton for a deck consultation?"
    a: >-
      Renton sits 20-30 minutes from our usual King County work zones via
      I-405 or SR-167. Call (206) 591-1096 to schedule a free on-site visit
      with Vladislav — TopVolk is WA Licensed and has completed 100+ projects
      since 2023 across the Seattle Metro. Most initial visits happen within
      the week.
  - q: "Do you build with Trex and TimberTech, or only natural wood?"
    a: >-
      Both. Trex Transcend and TimberTech Azek are the two composite lines we
      spec most often in Renton — they hold up in King County rain without
      annual sealing or re-staining. Pressure-treated and natural cedar builds
      are available where budget is the priority. Material recommendation
      depends on the lot's sun exposure and your actual maintenance tolerance.
  - q: "What's the permit process for a deck in Renton — city or King County DPER?"
    a: >-
      Renton has its own permit center, separate from King County DPER, for
      residential projects inside city limits. Deck permits typically move
      through plan review in 3-6 weeks. Full build including permits usually
      runs 8-12 weeks end-to-end. Deadline penalties are written into our
      contracts — call (206) 591-1096 to discuss scope and get a line-item
      quote from Vladislav directly.