title: "Bellevue Power Washing — Cedar Decks, Hardie Siding & Moss Removal"

intro: |
  Prepping a cedar deck or Hardie cement-board exterior for repaint in Bellevue starts
  with surface condition. Shaded lots in neighborhoods like Bridle Trails and Somerset
  accumulate decades of oxidized gray grain, moss root systems, and airborne mildew that
  block stain penetration — you can't seal over that layer and expect results lasting more
  than one PNW winter. TopVolk Construction handles power washing as part of larger exterior
  scopes: deck reseals, exterior repaints, fence prep. WA Licensed Contractor. 100+ projects
  completed since 2023.

localContext: |
  Much of Bellevue's older housing stock — especially in zip codes 98006 and 98008, from
  Eastgate out toward Crossroads and Factoria — was built in the 1960s and 1970s.
  Split-levels and ranchers with original cedar fencing, wood decks, and concrete driveways
  that have logged 50-plus wet Pacific Northwest seasons. The Bellevue Botanical Garden sits
  inside a dense tree canopy that keeps nearby lots shaded well into spring — exactly the
  condition that lets moss root colonies establish on north-facing surfaces by October.
  Newer Bridle Trails and Somerset homes often have Hardie siding or painted stucco, which
  need different PSI and different cleaning chemistry than bare cedar.

commonProblems:
  - title: "Moss root systems penetrating cedar deck boards"
    description: "Cedar decks on north-facing or heavily shaded lots don't just grow surface algae —
      moss physically roots into the wood grain and holds moisture for months. That sustained
      moisture accelerates rot in the decking boards and the rim joists underneath. Surface
      washing at 1,500–2,000 PSI with a fan tip nozzle and biodegradable surfactant lifts
      moss without splitting the grain. High-pressure direct-wand passes on older cedar do
      split grain and open more surface area to future moisture intrusion — making the
      problem worse by next fall."
  - title: "Hardie siding contamination before exterior repaint"
    description: "James Hardie cement-board siding holds paint well in PNW conditions, but the surface
      picks up airborne mildew and pollen film year after year. Before any repaint, that
      biological layer has to come off cleanly. A soft wash in the 600–1,200 PSI range with
      the right detergent chemistry pulls contamination without cracking the existing paint
      film. Skip the wash step and new primer bonds to that film instead of the substrate —
      premature peeling follows within two seasons, usually starting at the butt joints."
  - title: "Concrete driveway petroleum staining and tire marks"
    description: "Oil and tire marks on concrete driveways in 98006 and 98008 don't lift with a garden
      hose. A rotary surface cleaner attachment running at 2,500–3,000 PSI with a downstream
      injector applying commercial-grade degreaser breaks down petroleum residue evenly across
      the slab. Running a wand directly at those pressures leaves stripe patterns from uneven
      dwell time. Older 1970s concrete with surface scaling needs a slower pass at reduced
      pressure — pushing too hard on compromised flatwork accelerates spalling."

