  - q: "Do you spec ADU kitchens with premium appliances — Wolf, Sub-Zero, or Bosch?"
    a: |
      Yes. Bellevue clients building DADUs for long-term rental or multigenerational use often want a full kitchen — Wolf range, Bosch dishwasher, panel-ready Sub-Zero refrigerator. Those choices affect cabinet depth, range hood CFM requirements, and rough-in locations for gas and drain lines.

      The appliance list gets locked in before framing to avoid changes mid-build. A Wolf 36" range with a high-CFM hood requires a larger exhaust chase and makeup air consideration under current IRC requirements — that's a structural decision, not a finish-stage adjustment.

  - q: "What does a Bellevue ADU cost to build, and what's included?"
    a: |
      TopVolk builds detached ADUs from $120K–$200K+ in Bellevue, depending on size, finishes, and utility separation scope. WA Licensed Contractor — you get a detailed line-item quote, not a ballpark range. Deadline penalties are written into the contract.

