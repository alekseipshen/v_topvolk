title: "Bellevue ADU Construction — Permits, Lot Coverage & Build"

intro: |
  Somerset lots run 9,000–12,000 sq ft. That's real room for a detached ADU under WA HB 1337 — the 2024 state law letting most Bellevue single-family parcels add two units by right, no variance required. Vladislav Volkov has pulled ADU permits through Bellevue's own permit center on 116th Ave NE. Since 2017, 100+ projects completed across Seattle Metro.

  Clients in 98006 and 98004 regularly spec the ADU kitchen around a Wolf range or Bosch appliance package — those finish choices affect structural layout, so they're on the table from the first design conversation. Panel-ready Sub-Zero refrigerators require deeper cabinet bays and specific rough-in locations that can't be repositioned after framing. Better to resolve that in the design phase than during the punch list.

localContext: |
  Bellevue's mid-century ranchers and split-levels — built primarily between 1960 and 1975 in Newport Hills, Factoria, and the Crossroads corridor around zip code 98007 — sit on lots platted long before ADUs existed in the code. Detached garages here are common and often convert cleanly into DADUs without touching the main structure.

  That older construction brings real surprises during rough-in inspection. Galvanized water lines and aluminum wiring from the 1965–1973 era appear more often than homeowners expect, especially near Mercer Slough where crawlspaces stay damp through April. A vapor barrier upgrade frequently gets added to scope once the crawlspace opens up — it's not optional when there's standing moisture evidence on the pier blocks. Plan the budget accordingly.

  Somerset and Bridle Trails are a different story. Bigger lots, cleaner utility runs, newer structures with fewer hidden conditions. Setback math and lot coverage calculations still happen on-site, not from a satellite image.

commonProblems:
  - title: "DADU vs. Basement Conversion: Running Bellevue's Lot Coverage Math"
    description: |
      Bellevue's RS-6 zones cap lot coverage at 40%. A 10,000 sq ft lot in Somerset gives roughly 4,000 sq ft of combined footprint across the main house and any ADU.

      If the existing structure already occupies most of that, a basement conversion typically wins — no new foundation slab, no Milgard window wells to cut through the exterior, no separate utility trench to dig. Converting an existing basement also sidesteps the height limit (typically 24 ft for a DADU) that constrains two-story detached builds on tighter lots in Newport Hills. FAR and setback numbers get sketched out at the site visit. That consultation is free.

  - title: "Separate Electrical Meter and HVAC — What Bellevue's AHJ Actually Requires"
    description: |
      Any rented ADU in Bellevue needs its own electrical meter — Puget Sound Energy and Seattle City Light both require an independent service lateral for separately metered dwelling units. That triggers a new sub-panel, conduit run to the structure, and a rough-in inspection before drywall goes up.

      Most detached ADUs in this area use a Mitsubishi mini-split rather than extending the main house HVAC. Simpler to tenant-bill, and no ductwork to route through an already-framed structure. Domestic hot water typically gets handled by a Rinnai or Navien tankless unit — no 50-gallon tank eating floor space in a compact ADU utility closet.

  - title: "Bellevue Permit Center Is Not King County DPER — Know the Timeline"
    description: |
      Bellevue operates its own permit center, separate from King County DPER. First-submittal DADU plan review takes 6–10 weeks; corrections tack on 2–4 more.

      Seattle SDCI's MAP pre-approved ADU plans don't carry over to Bellevue — the city wants engineered drawings, structural calculations showing LVL beam sizing, and a site plan with setbacks dimensioned explicitly. The structural package typically includes PSL post specifications and joist hanger schedules for the floor system. Some applicants in the 98008 zip code have been surprised by Bellevue's stormwater detention requirements when adding impervious surface. Budget 5–7 months end-to-end from permit application to final inspection for a standard detached ADU in this jurisdiction.

