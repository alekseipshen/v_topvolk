title: "Bellevue Carpentry — Trim, Built-ins & Stair Rebuilds"

intro: |
  Somerset and Newport Hills hold rows of 1960s split-levels where original fir trim either
  survives under forty years of latex paint or got swapped out piecemeal — window casing in
  one profile, door casing in another. Kitchen remodels in these neighborhoods now frequently
  spec Sub-Zero or Thermador panel-ready refrigerators, which means the surrounding cabinet
  surround has to be built to 1/8" reveal tolerances, not improvised from stock material.
  Vladislav handles finish carpentry himself. That consistency across 100+ projects since 2023
  is what keeps neighbors referring neighbors in a city where word travels fast.

localContext: |
  The 98006 zip — Somerset, Lakemont, Newport Hills — is where most of this carpentry work
  concentrates. Homes here went up between 1965 and 1985, typically split-level or two-story,
  with Douglas-fir structural framing and builder-grade interior trim that's well past its
  prime. Some have been flipped — original millwork stripped, mismatched MDF profiles slapped
  in. Bellevue runs its own building department, separate from Seattle SDCI, and structural
  carpentry like stair rebuilds requires a permit — plan review typically takes 3-5 weeks.
  Non-structural finish work generally skips the permit, but we confirm scope with the city
  before touching anything load-bearing.

commonProblems:
  - title: "Panel-Ready Cabinet Surrounds for Sub-Zero and Thermador Built-ins"
    description: |
      High-end kitchen remodels in Somerset and Bridle Trails are increasingly specced around
      panel-ready Sub-Zero or Thermador refrigerators. The surround cabinet has to hit dead-on
      reveal tolerances — 1/8" gap all around — or the appliance doors bind against the frame.
      Building that box requires tight dado joints, a plumb rough opening, and hardware
      clearance planned before anything gets fastened. We cut and install these as part of the
      full kitchen scope, not as an afterthought subbed to a finish carpenter.
  - title: "Stair Stringers Worn Through to the Notch in 1960s Split-Levels"
    description: |
      Bellevue's mid-century split-levels used notched 2x10 stair stringers — and after 60
      years, those tread-bearing notches compress and split. A proper rebuild means sistering
      with 3x12 stock or full stringer replacement, new hardwood treads with a solid nosing
      profile, and balusters matched to what's surviving elsewhere in the house. Bellevue's
      building department requires permits for structural stair work. Factor 3-5 weeks of
      permit review before demo begins.
  - title: "Cedar Fascia Rot on North-Facing and West-Facing Soffits"
    description: |
      Bellevue averages around 37 inches of rain annually, concentrated October through May.
      Cedar fascia on 1970s and 1980s homes rots fastest at the end grain where gutter
      brackets penetrate the board — moisture wicks in and never fully dries between storms.
      The fix: cut back to sound wood, add pressure-treated (PT) backing where structural
      support is compromised, and re-prime before new cedar or Hardie cement-board goes on.
      Done correctly, the repair holds for decades.

faq:
  - q: "How fast can you get to Bellevue for Carpentry?"
    a: |
      Bellevue is 20-25 minutes from our base — SR-520 bridge or I-90 depending on where
      traffic is stacking. Neighborhoods like Somerset have easy street access; projects near
      downtown Bellevue (98004) sometimes need lot parking coordinated in advance. Call
      (206) 591-1096 to set up a free on-site walk-through with Vladislav directly — no
      salesperson, no call center. Written line-item quote follows within two business days.
  - q: "Can you match original millwork profiles in older Bellevue homes?"
    a: |
      Yes. Matching surviving casing profiles in Bellevue's mid-century homes means either
      running custom moulding stock on a shaper or sourcing period-appropriate profiles — not
      pulling whatever trim is in the big-box aisle. We've matched original window seat
      framing, beadboard wainscoting, and door casing in the Enatai and Lakemont
      neighborhoods. Bring photos to the consultation. If the profile survives anywhere in
      the house — even behind a door — we can match it and fabricate new runs.
  - q: "What does a stair rebuild cost and how long does it take in Bellevue?"
    a: |
      Stringer replacement in a Bellevue split-level typically runs $4,500-$9,000 depending
      on run length, tread species, and baluster style. Bellevue's building department permit
      review adds 3-5 weeks before demo can start — plan that into your timeline. Actual
      build time on-site runs 1-2 weeks. TopVolk is a WA Licensed Contractor. Call
      (206) 591-1096 for a written line-item quote — no vague ranges. Deadline penalties
      are written into every contract.