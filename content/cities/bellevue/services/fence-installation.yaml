title: "Bellevue Fence Installation — Cedar, Vinyl & Permits, Handled"

intro: |
  Somerset's hillside lots and Bridle Trails' equestrian-zoned parcels make Bellevue fence
  installations more involved than they look on paper. Property lines shift with grade changes,
  shared fences often predate modern surveys, and Bellevue's permit center enforces setbacks
  distinct from what King County DPER requires in unincorporated areas. Vladislav Volkov —
  WA Licensed Contractor, 100+ projects since 2023 — has installed cedar, Trex composite,
  and CertainTeed vinyl fencing across the 98004–98008 zip codes. Call (206) 591-1096 for
  a free on-site consultation.

localContext: |
  Crossroads and Eastgate neighborhoods around 98008 hold a lot of 1960s and 1970s ranch-era
  homes — many with original cedar fencing where posts are rotted at grade from decades in
  saturated clay soil. Somerset and Lakemont in 98006 lean toward newer custom builds where
  horizontal slat designs and powder-coated aluminum gates are the aesthetic standard. Lot
  sizes vary enough that a 6-foot fence on one side of a Somerset property can trigger a
  setback question depending on how the slope is measured.

  Newport Hills and the older Bellevue portions near downtown 98004 sometimes have post-and-rail
  remnants from the 1950s — cedar rails twisted from years of wet-dry cycling, set without
  concrete footings. In Bridle Trails, where larger lots back up to horse easements, fence
  height and material restrictions can be layered: city code, HOA rules, and the easement
  language in the recorded plat can all conflict. Reading all three before quoting saves
  expensive surprises mid-project.

commonProblems:
  - title: "Cedar Posts Rotted Below Grade in Ranch-Era Homes"
    description: |
      Ranch-era homes in Crossroads and Eastgate often have cedar fencing from the 1970s or
      1980s — posts set in direct soil contact without pressure-treated (PT) lumber or proper
      concrete footings. Bellevue's heavy clay soil holds moisture year-round, accelerating rot
      where the post meets grade. Replacement means digging out the old concrete plug, resetting
      new PT posts to 30–36 inches depth, and verifying the fence line against the recorded plat
      before boards go up. Joist hangers and blocking at the base rail keep the new panels rigid
      even when the grade isn't level — common on Somerset's terraced lots.

  - title: "Bellevue Permits: 6-Foot Limit, Retaining Wall Combos Need Engineering"
    description: |
      Bellevue allows 6-foot fences on side and rear lines without a permit — 4-foot maximum
      at the front setback. Combine a fence with a retaining wall over 4 feet and you need a
      building permit from Bellevue's permit center, not King County DPER. That means a site
      plan, setback documentation from the property line, and sometimes a structural engineer's
      stamp on the wall. Plan review for these projects typically runs 3–6 weeks. Steep-slope
      hazard overlays in parts of 98006 can add a geotechnical review requirement — worth
      checking the parcel data before any digging starts.

  - title: "Property Line Disputes Before the First Post Goes In"
    description: |
      Fences in Somerset and Newport Hills are sometimes set inches off the actual survey pin,
      especially on sloped lots where tape measurements are easy to misread. Before any post
      goes in, pull the King County recorded plat and physically locate the survey pins. A post
      installed 6 inches into the neighbor's property can require full removal — and a dispute
      that outlasts the fence itself. On shared fence lines, getting written agreement from the
      adjacent owner before breaking ground is the only way to avoid a civil headache later.

faq:
  - q: "How fast can you get to Bellevue for Fence Installation?"
    a: |
      Bellevue is 20–30 minutes from Seattle via I-90 or SR-520 outside peak hours. Vladislav
      handles Bellevue consultations most weekdays. Call (206) 591-1096 to schedule. Residential
      neighborhoods in Crossroads and Somerset typically have street parking; delivery access for
      post material and panels is usually straightforward from Eastgate Road or 156th Ave SE.

  - q: "Cedar or composite — which holds up better in Bellevue's climate?"
    a: |
      Cedar looks sharper at install but needs staining every 2–3 years to prevent checking and
      mildew on north-facing panels — Bellevue's wet season runs October through May. CertainTeed
      vinyl and Trex composite need no maintenance and hold color through 37+ inches of annual
      PNW rain. For daily-use gates, D&D Technologies self-closing hinges outlast builder-grade
      hardware by years — worth the upfront cost in a busy household. Homes in 98006 and 98008
      with tree canopy overhead tend to see moss buildup on cedar within 3–5 years; composite
      eliminates that maintenance cycle entirely. Either way, ground-contact sections always
      get PT lumber footings — cedar above grade, PT below.

  - q: "Do I need a permit for a fence in Bellevue, and how long does it take?"
    a: |
      Standard 6-foot fences on side and rear lines are permit-exempt in Bellevue. Retaining
      wall combinations over 4 feet and parcels flagged in the city's steep-slope hazard maps
      do require a permit — budget 3–6 weeks for plan review at Bellevue's permit center.
      We check your parcel before quoting. Typical installation runs 1–2 weeks from contract
      signing once materials are staged. Deadline is written in, with a penalty clause if
      we miss it — that commitment is in the contract, not just a verbal assurance.