title: "Bellevue Bathroom Remodel — Built Right, Not Retiled Over"

intro: |
  Mid-century split-levels in Somerset and Newport Hills were built for
  families, not spa bathrooms. Most master baths in Bellevue's 98006 zip
  code were last touched in the early '90s — builder-grade Kohler fixtures,
  4x4 ceramic tile, and no waterproofing membrane behind the tub surround.
  That holds fine until grout cracks. After 30 Pacific Northwest winters and
  37 inches of annual rainfall soaking into wall cavities, most of them have.

localContext: |
  Factoria and Crossroads ranchers from the late 1960s (98008) are the ones
  that catch homeowners off guard — original galvanized supply lines, cast-
  iron drain stacks, and bathroom layouts that predate modern P-trap
  configurations. Moving a shower or repositioning a toilet in these homes
  almost always means rerouting drain lines and pulling a permit through the
  City of Bellevue's own permit center (separate from Seattle SDCI). Bridle
  Trails homes built between 1970-1985 have the same substrate problem: green
  drywall behind tile, no vapor barrier, no cement board.

commonProblems:
  - title: "Green Drywall Substrate — No Real Waterproofing Behind the Tile"
    description: |
      Bellevue bathrooms built before 1995 commonly used moisture-resistant
      green drywall as the tile backer — not cement board, not a waterproofing
      membrane. Once grout cracks, water wicks straight through. Retiling over
      it is a short-term fix. The correct repair is Schluter Kerdi membrane or
      RedGard applied over new cement board before any tile goes down. Skip
      that step and the same problem returns in five years.
  - title: "Master Bath Layouts That Work Against You"
    description: |
      Homes in Somerset and Newport Hills (98006) often have master baths where
      the double vanity is crammed against a tub-shower combo, and the door
      swings into the toilet. Fixing the layout means moving drain lines —
      which means opening the subfloor, coordinating rough-in inspection with
      Bellevue's permit center, and sometimes rerouting the cast-iron stack
      below. That's real structural work, not a cosmetic refresh.
  - title: "Exhaust Fans Too Weak for Enclosed Walk-In Showers"
    description: |
      Most Bellevue homes from the 1970s and '80s have bathroom exhaust fans
      rated at 50 CFM or under. For a fully enclosed curbless shower with
      large-format porcelain walls, that's not close to enough. Mold along
      grout lines is almost always a ventilation failure, not a cleaning
      problem. Upgrading to a 110+ CFM fan with a humidity sensor and a
      properly sloped duct run to the exterior soffit is standard on every
      bath remodel we do in this area.

faq:
  - q: "How fast can you get to Bellevue for a bathroom remodel consultation?"
    a: |
      Bellevue is 20-30 minutes from our base depending on I-405 conditions.
      Free on-site walkthroughs with Vladislav can usually be scheduled within
      a week. Call (206) 591-1096 directly — no sales staff, no scheduler
      middleman. You talk to the contractor doing the work.
  - q: "What brands and materials do you typically use for Bellevue bathroom remodels?"
    a: |
      Kohler and Moen fixtures are the baseline for most projects in this area.
      For waterproofing, Schluter Kerdi or RedGard over cement board — not
      green drywall. Walk-in shower niches get Schluter JOLLY edge profiles.
      When clients are upgrading the plumbing side at the same time, we
      coordinate with a Rinnai or Navien tankless water heater install.
      Tile is client's choice — we work with whatever the tile supplier
      specifies, large-format porcelain included.
  - q: "What does the permit process look like and how long does a Bellevue bathroom remodel take?"
    a: |
      Bellevue has its own permit center — plan review for a bathroom remodel
      with plumbing or structural changes runs 3-6 weeks. Construction after
      permit: a tile-and-fixture swap is 3-5 weeks, full gut with layout
      changes is 8-12 weeks. TopVolk is a WA Licensed Contractor, and we have
      completed 100+ projects since 2023 across King County. Deadline is
      written into the contract with a penalty clause — if we miss it, we pay.
      Schedule a free consultation at (206) 591-1096.