title: "Bellevue Basement Finishing — Split-Level Square Footage, Done Right"

intro: |
  Split-levels from the 1960s throughout Somerset, Newport Hills, and the neighborhoods east of Bellevue Downtown (98006) were built with full-height unfinished basements — often 800 to 1,000 square feet sitting unused below main living areas. Finishing that space in Bellevue's rainy climate means handling vapor control before the first stud goes up; PNW moisture pushes through concrete all winter and doesn't forgive shortcuts. Most projects in this market become a guest suite, home theater, or a home office with a proper wet bar — sometimes with a Bosch undercounter wine fridge and a Mitsubishi mini-split providing year-round comfort downstairs.

localContext: |
  Much of Bellevue's mid-century housing stock — concentrated in Eastgate (98005), Woodridge, and Factoria — dates from 1958 to 1975. Basements in these homes typically have ceiling heights between 7 feet 4 inches and 7 feet 10 inches, right at or slightly above the IRC minimum for a habitable room. Concrete slabs from that era predate modern waterproofing standards and wick moisture steadily from October through April. Homes in Woodridge near Bellevue Botanical Garden sit above seasonal water table rises that show up in basement slabs every wet season. Bellevue has its own building department, separate from Seattle SDCI — plan review for a full basement finish typically takes 3-5 weeks, with rough-in and final inspections both adding time to the schedule.

commonProblems:
  - title: "Vapor Intrusion Through Concrete Slabs During King County Rain Season"
    description: "Bellevue sees roughly 37 inches of rain per year, and slabs in the 98006 and 98007 zip codes regularly push vapor upward — slow enough to miss, fast enough to grow mold under carpet within one wet season. A perimeter drain channel, sump pump, and continuous vapor barrier go in before any framing starts — non-negotiable, not an upgrade option. DriCore subfloor panels then add a thermal break and airspace above the concrete before LVT or engineered hardwood goes down."
  - title: "Egress Windows Required Before Any Basement Bedroom Is Legal"
    description: "A legal bedroom in a Bellevue basement requires an egress window meeting IRC minimums — 5.7 square feet of net clear opening, minimum 20 inches wide, sill height no more than 44 inches from the finished floor. Concrete cutting and window well excavation adds 2-3 days to the project and triggers a separate inspection through Bellevue's permit center. Milgard vinyl egress windows handle PNW moisture cycles without rot or paint failure, and they come code-sized from the factory so inspections move faster."
  - title: "Exposed HVAC Ductwork Killing Ceiling Height in 1960s and '70s Homes"
    description: "Mid-century Bellevue homes routed HVAC trunk lines and drain stacks across basement ceilings with no plan for future finishing. Getting below that ductwork without losing habitable headroom means rerouting a main supply duct — or in some cases replacing the branch runs with a Mitsubishi mini-split instead of extending an already-taxed forced-air system. MEP coordination — sequencing mechanical, electrical, and plumbing in the right order — determines the full ceiling plan before drywall hang can even begin."

faq:
  - q: "How fast can you get to Bellevue for Basement Finishing?"
    a: "Bellevue is a 15-20 minute drive via I-90 or I-405 depending on traffic. Most residential driveways in Somerset and Newport Hills accommodate work vehicles without issue. Call (206) 591-1096 to schedule an on-site visit directly with Vladislav — not a sales rep, not a scheduler. Typically available within 3-4 business days for an initial walkthrough and rough budget discussion."
  - q: "What moisture-resistant materials do you specify for Bellevue basement finishes?"
    a: "DriCore subfloor panels go down first on any concrete slab — they lift finish flooring above the surface and handle the minor vapor intrusion that's normal in PNW basements year-round. All below-grade framed walls get CertainTeed mold-resistant drywall, not standard paper-faced gypsum. For a half-bath addition, Kohler or Moen fixtures fit the finish level most Bellevue clients are working at without pushing the ceiling height budget."
  - q: "What does a basement finish cost in Bellevue, and how long does the permit take?"
    a: "Bellevue's building department handles its own plan review — expect 3-5 weeks for a basement permit, longer if structural changes are involved. Full project timeline runs 10-16 weeks from permit submission through final inspection. A basic finish with no bathroom starts around $45K; a full buildout with bathroom, egress window, and wet bar runs $90K-$150K+ at Bellevue finish standards. TopVolk pulls all permits as WA Licensed Contractor of record — deadline penalties are written into the contract, 100+ projects completed since 2017. Call (206) 591-1096 for a line-item quote."