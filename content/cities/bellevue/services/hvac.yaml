title: "Bellevue HVAC — Heat Pumps, Mini-Splits & ADU Installs"

intro: |
  Somerset and Newport Hills — zip 98006 — are dense with 1960s and 70s split-levels built around oversized gas furnaces. Those systems are hitting end-of-life right as Inflation Reduction Act heat pump rebates opened up. Mitsubishi and Daikin mini-splits are the most common HVAC scope on our Bellevue remodel and ADU projects.

  Permits run through Bellevue's own permit center, separate from Seattle SDCI and King County DPER.

  Vladislav Volkov runs every project directly — call (206) 591-1096 to schedule a free on-site consultation.

localContext: |
  Central Bellevue — zip codes 98005 and 98008 — runs heavily mid-century ranch-style and split-level. Crossroads and Eastgate homes from the 1960s have original sheet-metal ductwork sized for high-volume gas forced-air, not variable-speed heat pump equipment. Lake Hills, just east of I-405 in 98007, has the same pattern: homes built 1962–1975, original forced-air infrastructure, crawlspaces that have absorbed 60 years of Pacific Northwest moisture.

  Bridle Trails and the newer parts of 98004 near Bellevue Downtown are mostly forced-air systems that need a proper Manual J load calculation before any AC addition or heat pump conversion. Duct capacity rarely matches what the box says on a heat pump spec sheet. Factoria, in the southwest corner near I-90, skews slightly newer — late 70s and early 80s builds — but the ductwork problems are nearly identical.

  Bellevue averages 37 inches of rain a year, nearly all of it October through May. That sustained moisture infiltrates duct joints and crawlspace vapor barriers over decades, compounding the mechanical problems well before any equipment reaches end-of-life. North-facing crawlspaces under Eastgate split-levels run perpetually damp — mold on rim joists is a common find once we pull access panels.

  The Overlake corridor near zip 98007, close to Crossroads Mall and the old Microsoft campus edge, shifted toward Mitsubishi multi-zone setups in the 2010s. Wilburton and the Somerset plateau (98006) have similar demand. Same fundamentals apply everywhere: Manual J first, MEP coordination before rough-in, permit pulled before anything gets installed.

  Lakemont and the hillside neighborhoods climbing toward 98006 near Cougar Mountain Regional Wildland Park see freeze-thaw exposure during cold snaps — different from lowland Bellevue, closer to the foothills pattern. Heat pump efficiency curves drop below 25°F, which matters for equipment selection in those elevations.

commonProblems:
  - title: "Gas-to-heat-pump conversions undersized for existing duct systems"
    description: "Split-levels in Somerset and Newport Hills have duct systems designed for 80% AFUE gas furnaces pushing high-temperature air. Drop in a heat pump without recalculating static pressure and airflow, and you get compressor short-cycling and uneven heat floor-to-floor. Carrier and Trane both void equipment warranties when duct sizing isn't verified. Manual J is required, not a suggestion. Pulling the mechanical permit before any equipment goes in — WA Licensed Contractor on record — protects the warranty, passes rough-in inspection, and prevents six-month callbacks."
  - title: "Mini-split electrical capacity for ADUs under WA HB 1337"
    description: "The 2024 statewide ADU law lets Bellevue homeowners add up to two ADUs per lot — DADU, AADU, or both. Ductless Mitsubishi mini-splits are the standard mechanical solution for those units. Problem is most 1970s homes in zip 98007 and 98006 run 100 or 150-amp panels with no spare capacity for a 240V mini-split circuit. MEP coordination and a panel upgrade are usually part of the scope before HVAC rough-in even starts. TopVolk has handled this exact sequence on 100+ projects since 2017 across Bellevue and the broader Eastside — the sequencing matters as much as the equipment spec. Call (206) 591-1096 if you're planning an ADU and want a realistic scope conversation before committing to anything."
  - title: "Ductwork leakage and mildew in Eastgate and Crossroads crawlspaces"
    description: "Original 1960s sheet-metal ductwork in unconditioned crawlspaces loses 20-30% of conditioned air before it reaches living spaces. Bellevue's October-through-May rain cycle infiltrates duct joints and breeds mildew on interior duct lining — the kind of problem that shows up as mysterious allergy flares before anyone finds the source. Mastic sealant at all duct connections, plus vapor barrier improvements at the rim joist, stops the problem at the source rather than patching symptoms. Deadline penalties are written into every TopVolk contract — if we commit to a scope and schedule, we're financially on the hook for it. WA Licensed Contractor, 100+ projects completed across the Eastside since 2017."

faq:
  - q: "How fast can you get to Bellevue for an HVAC consultation?"
    a: "Bellevue is a straightforward drive — zip codes 98004, 98006, and 98008 are under 30 minutes from our base on a normal day. Call (206) 591-1096 to set up a free on-site walk-through. Vladislav comes out directly. No sales staff, no call center."
  - q: "Which HVAC brands do you work with on Bellevue projects?"
    a: "Mitsubishi and Daikin for ductless mini-splits. Carrier and Trane for whole-home heat pump systems. Navien and Rinnai for hydronic heating in higher-end builds. Equipment gets spec'd based on load calculation results and the client's efficiency goals — not whatever has the best installer margin."
  - q: "What does the HVAC permit process look like in Bellevue, and how long does it take?"
    a: "Bellevue runs its own permit center — distinct from King County DPER and Seattle SDCI. Mechanical permits for heat pump conversions or new mini-split installs typically take 2-4 weeks for plan review. Adding HVAC to a larger remodel stretches that by 4-6 additional weeks depending on plan complexity. WA Licensed Contractor, 100+ projects completed since 2017 — we pull the permit, handle rough-in inspection scheduling, and coordinate the final inspection. Deadline penalties are written into the contract."