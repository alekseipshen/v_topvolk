title: "Bellevue HVAC — Heat Pump Upgrades for Eastside Homes"

intro: |
  Somerset and Newport Hills homes built in the 1960s and early 70s were designed around
  gas furnaces that made economic sense when gas was cheap and nobody was chasing
  efficiency ratings. That math has changed.

  Mitsubishi heat pumps now handle both heating and cooling from a single system, and the
  Inflation Reduction Act offers up to 30% back on qualifying installs. Bellevue runs its
  own permit center — plan review timelines and submittal requirements differ from King
  County DPER, so the process matters before any equipment gets ordered.

  Premium properties in Bridle Trails and Somerset are increasingly pairing high-efficiency
  mechanical systems with the Thermador and Wolf appliances already in the house. Makes sense
  to spec the HVAC at the same level.

localContext: |
  The 98006 zip covers Lakemont, Eastgate, Coal Creek, and Factoria — 1980s and 90s tract
  construction with builder-grade forced-air systems that were rough-in sized for original
  floor plans and never rebalanced. Most of those systems are still running original duct
  layouts from when the subdivision was platted off I-90.

  Homes in 98004 near downtown Bellevue and along the Lake Washington shoreline tell a
  different story: 1950s post-war ramblers sitting next to newer infill, often with ductwork
  that was never designed to handle modern airflow demands. Some of those homes — particularly
  in the Old Bellevue and Meydenbauer Bay corridor — have had two or three rounds of cosmetic
  updates without anyone ever touching the mechanical. The supply-return imbalance shows up
  immediately on a blower door test — rooms that stay 6 degrees off target in August aren't
  a thermostat problem.

  The 98007 and 98008 corridors through Lake Hills, Crossroads, and Woodridge are mostly
  1970s split-levels and ramblers — same era that installed undersized ductwork and builder-grade
  equipment. The Bel-Red corridor near the Spring District light rail station in 98007 has seen
  significant infill and new construction, where mechanical code compliance is enforced from
  day one, not retrofitted decades later.

  The 98005 pocket between downtown and Crossroads — Wilburton, parts of Eastgate —
  sits in mixed-era housing stock. Some blocks are 1960s originals; others have been
  scraped and replaced. Each job needs its own assessment.

  Any HVAC work in Bellevue — including ductless mini-split installation for a new ADU
  near Mercer Slough Nature Park or a heat pump conversion in Somerset — goes through
  the city's own AHJ, not King County DPER.

commonProblems:
  - title: "Gas Furnace Replacement and Heat Pump Conversion"
    description: |
      Newport Hills and Somerset ranchers built in the 1960s and 70s still run on
      original gas furnaces well past their 20-year service life. Converting to a Lennox
      or Mitsubishi heat pump means properly sized refrigerant line sets, a compatible
      air handler, and typically a heat strip backup for sub-30°F days in the Cascade
      foothills east of 98006.

      HSPF2 ratings matter here. Bellevue winters are mild compared to eastern Washington,
      but the temperature swings in November and February still push a low-efficiency unit
      into backup heat territory. Spec the outdoor unit at HSPF2 10 or higher and size
      the refrigerant line set correctly from the start, or you're leaving efficiency on
      the table every billing cycle. Permits run through Bellevue's own center, not King
      County DPER.
  - title: "Ductwork Imbalance — Hot Rooms Upstairs, Cold Rooms Down"
    description: |
      Lake Hills and Crossroads homes in 98008 were built with duct layouts that matched
      1970s floor plans, not today's open-concept remodels. Supply and return imbalance
      creates static pressure problems — rooms that stay 5-8 degrees off target no matter
      how the thermostat reads.

      An ecobee with zone dampers helps at the control side. The real fix is duct
      rebalancing validated with a blower door test — duct leakage above 15% of system
      airflow is common in Lake Hills tract construction, which means conditioned air
      dumping into attic space every time the system runs. That's not a thermostat fix.
  - title: "Ductless Mini-Split for ADUs and Finished Additions"
    description: |
      WA HB 1337 allows two ADUs per single-family lot, and Bellevue DADU projects are
      moving fast. Extending existing ductwork into a new structure rarely pencils out —
      instead, a Daikin or Mitsubishi ductless unit gets its own condensate drain, a
      dedicated circuit, and a lineset penetrating the exterior wall.

      Undersized equipment short-cycles and wears out the compressor inside three years.
      Over-sized equipment runs in short bursts and leaves humidity high all summer —
      Bellevue's mild but damp June and July make that noticeable fast. Size the unit
      to the actual square footage of the finished space, not the largest unit that fits.

faq:
  - q: "How fast can you get to Bellevue for HVAC work?"
    a: |
      Bellevue is a core service area — zip codes 98004 through 98008, plus Medina at
      98039. Most consultations book within a week. Call (206) 591-1096 directly to
      reach Vladislav — no dispatch layer, no callbacks from a scheduler who hasn't
      seen the job.
  - q: "Do you install Mitsubishi and Daikin systems in Bellevue?"
    a: |
      Yes. Mitsubishi and Daikin are the primary ductless brands on Eastside projects —
      multi-zone setups for Craftsman additions, single-zone units for garage conversions,
      and full ADU mechanical systems. Also install Navien and Rinnai for hydronic backup
      on larger heat pump projects where radiant floor heat is already in place.
  - q: "What does HVAC permitting cost and how long does it take in Bellevue?"
    a: |
      Bellevue permits through the city center — not King County DPER. Heat pump
      replacement plan review typically runs 3-6 weeks. Simple equipment swaps without
      system modifications can sometimes qualify for a shorter path.

      TopVolk — WA Licensed Contractor, 100+ projects completed since 2023 — handles
      permit submittal as part of the project scope. Deadline penalties are written into
      the contract, not promised verbally. Schedule a free on-site consultation at
      (206) 591-1096 — Vladislav does the walkthrough, not a commissioned closer.
  - q: "Do older Bellevue homes need a vapor barrier inspection before HVAC work?"
    a: |
      Often yes.

      Post-war homes in 98004 and 1970s construction in 98007 were built before current
      IRC vapor barrier requirements. Crawlspaces tend to have either no barrier or a
      degraded poly sheet that's been there since the Ford administration. Running a new
      forced-air system or heat pump into a high-humidity crawlspace shortens equipment
      life and pushes mold spores into the duct system on every cycle. Vapor barrier
      installation or full encapsulation is a separate scope item — walked through during
      the consultation so it doesn't appear as a change order later.