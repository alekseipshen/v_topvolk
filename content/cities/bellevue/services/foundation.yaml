title: "Bellevue Foundation Repair — Seismic Retrofit & Clay Soil Work"

intro: |
  Clay-heavy soils under Bellevue's 98006 and 98004 zip codes expand when saturated and contract
  through dry summers — that movement cracks concrete pads, tips post-and-pier supports, and
  eventually shows up as sloping floors inside. Bellevue sits in the Lake Washington basin, where
  the water table runs closer to the surface than most homeowners expect. Residents in Somerset
  and Lakemont often notice foundation trouble first when cabinet doors stop aligning flush, or
  when a Wolf range sits visibly tilted in a kitchen that used to be level. Foundation problems
  here don't improve on their own.

localContext: |
  Much of Bellevue's residential inventory from the 1960s and early 1970s uses post-and-pier
  crawlspace construction — split-levels and ranchers concentrated in Crossroads (98008) and
  Newport Hills (98006), now 50-plus years old. Original pressure-treated mudsills in 98005
  homes near Bridle Trails frequently show rot after decades of crawlspace condensation, and most
  were never bolted down per current WA seismic code. Clay subsoil near the Mercer Slough
  watershed amplifies drainage failure — foundation undermining and poor site drainage track
  closely together in this part of King County.

commonProblems:
  - title: "Post-and-Pier Settlement Under 1960s–70s Bellevue Ranchers"
    description: |
      Decades of wet-dry soil cycling in Crossroads and Factoria cause concrete piers to sink or
      tip unevenly, leaving wood posts short or out of plumb. Sagging floor sections in Newport
      Hills ranchers are often the first visible sign — piers have shifted enough to leave posts
      carrying load at an angle. Shimming buys time. The real fix is new poured-concrete footings
      or adjustable steel post bases, followed by sistering the floor joists above to restore a
      level plane. City of Bellevue permit required. DriCore subfloor panels above the vapor
      barrier address ongoing crawlspace moisture once the structural work is done.

  - title: "Concrete Cracks and Epoxy Injection on Perimeter Foundation Walls"
    description: |
      Hairline cracks in poured concrete or CMU block foundation walls appear regularly in 98004
      and 98006 homes where the grade slopes toward the structure. Left unsealed through an
      October-to-May rain season, those cracks let groundwater wick in steadily — every fall
      freeze-thaw event in the foothills widens them slightly further. Polyurethane injection
      handles active leaks; epoxy injection is the structural option on static cracks. Both
      approaches work from inside the crawlspace without yard excavation.

  - title: "Mudsill Rot and Seismic Retrofit in Pre-1994 Bellevue Homes"
    description: |
      Homes built before the 1994 code updates rarely have mudsill bolting or shear wall plywood
      in place. Rotted pressure-treated mudsills — common under 98007 and 98008 crawlspaces —
      have to be sistered or replaced before Simpson Strong-Tie anchor hardware can seat correctly
      against the foundation. City lots go through Bellevue's own permit center for plan review,
      typically 4 to 8 weeks. Unincorporated King County parcels route through King County DPER
      instead. Either path ends with required rough-in and final inspections — this is not a
      permit-optional repair.

