title: "Bellevue Deck Installation — Elevated Lots, PNW Rain, Built to Code"

intro: |
  Somerset's hillside lots in 98006 — stacked sightlines over the Cascades,
  backyard drops of 8 to 10 feet — are exactly the kind of site where a deck
  isn't optional, it's the whole backyard plan. Affluent builds here often
  incorporate Wolf outdoor grill stations into the deck layout, which changes
  structural load calculations and utility rough-in scope from day one. TopVolk
  Construction handles Bellevue deck permits through the city's own Development
  Services department: plan review, ledger inspection, final sign-off, no gaps.

localContext: |
  Bellevue's housing runs from 1960s ramblers to 2010s custom builds — every
  decade presents different structural conditions. The older stock in 98007
  around Crossroads and Eastgate often lacks a continuous rim joist — ledger
  attachment isn't straightforward, and some projects end up freestanding by
  design. Newer custom builds in Newport Hills and Lakemont (98006) support
  direct ledger connection but still require permit-level flashing inspection.
  Zip code 98008 mixes mid-century stock with 1990s tract homes; deck
  conditions vary block by block.

commonProblems:
  - title: "Cedar vs Composite When Moss Wins Every Winter"
    description: "North-facing decks in Bridle Trails and Lakemont get maybe four
      hours of direct sun. Cedar boards on those exposures go gray and mossy
      within two seasons — constant pressure washing just accelerates the grain
      checking. Trex Transcend and TimberTech AZEK composite boards hold up
      without sealing, handle 37 inches of annual rainfall, and don't give moss
      the organic surface it needs to root. Materials cost more upfront: expect
      $14-22 per sq ft vs $5-9 for cedar. Over a ten-year horizon, composite
      wins."

  - title: "Ledger Flashing Failure and Rim Joist Rot at the House"
    description: "The ledger connection is where most Western WA decks eventually
      fail. Water tracks behind improperly installed Z-flashing, pools against
      the rim joist, and works into the floor framing — sometimes for years
      before anyone notices. Bellevue Development Services requires a ledger
      flashing inspection before framing proceeds. Proper installation uses
      either stepped Z-flashing over each lag bolt or a waterproof membrane
      like Schluter Kerdi strip at the full ledger run. Skipping this step
      produces a structural rot problem within five to seven years."

  - title: "Post Footings, Frost Line, and UC4B Lumber in the Eastside Foothills"
    description: "Bellevue's eastern edges — Lakemont, the Cougar Mountain
      corridor — see more freeze-thaw cycles than the city core, particularly
      between November and March. IRC requires footings to frost line depth,
      typically 12 to 18 inches in King County, poured concrete with adjustable
      post bases. Any post in ground contact must be pressure-treated lumber
      rated UC4B or UC4C minimum. An undersized or shallow footing shifts
      seasonally, and the whole deck structure moves with it. This is a
      rough-in inspection item — the inspector verifies footing depth before
      concrete is poured."

faq:
  - q: "How fast can you get to Bellevue for Deck Installation?"
    a: "Bellevue — 98004, 98005, 98006, 98007, 98008 — is a core service area.
      On-site consultations typically available within three to five business
      days. Call (206) 591-1096 to schedule directly with Vladislav. TopVolk
      is a WA Licensed Contractor with 100+ projects completed since 2017."

  - q: "Do you install Trex and TimberTech composite decking, or only wood?"
    a: "Both. Trex Transcend and TimberTech AZEK are the two most common
      requests in Bellevue. Each requires its own hidden fastener system —
      Trex Hideaway clips, TimberTech Cortex screws — with board spacing
      calculated per manufacturer spec to allow for thermal expansion. We
      supply and install both product lines."

  - q: "What does a Bellevue deck permit cost and how long does plan review take?"
    a: "Bellevue Development Services handles permits for incorporated Bellevue —
      not King County DPER. Plan review for a standard attached deck typically
      runs four to eight weeks. Permit fees fall between $900 and $2,800
      depending on project valuation. TopVolk submits the permit application
      and manages every inspection: footing pour, ledger framing, guardrail
      height (36 inches minimum for decks above 30 inches), and final. Deadline
      penalties are written into every contract — if we miss the agreed
      completion date, we pay."