  - q: "Do you handle EPA RRP lead paint compliance for older Bellevue homes?"
    a: |
      Yes. Any Bellevue home built before 1978 legally requires EPA RRP-certified protocol
      before interior painting — XRF or swab testing first, then containment setup and
      documented disposal of lead-containing debris. Lake Hills and Crossroads have a high
      concentration of pre-1978 ranchers where this applies. Testing adds roughly one day
      to the project schedule.

  - q: "What does exterior painting cost for a Bellevue home, and how long does it take?"
    a: |
      A typical two-story Bellevue home in the 98006–98008 range runs $5,000–$9,500 for
      full exterior: power wash, caulk all penetrations, prime, and two-coat acrylic finish.
      Cedar shake prep costs more than Hardie board. Vladislav prices every job with a
      fixed line-item quote — not a vague range — and the deadline is written into the
      contract with a penalty clause. Call (206) 591-1096 for a free on-site consultation.