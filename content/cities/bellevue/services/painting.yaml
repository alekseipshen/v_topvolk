title: "Bellevue Painting — Cedar Siding, Trim & EPA-Compliant Lead Prep"

intro: |
  Somerset's split-levels and the Bridle Trails custom homes near Kelsey Creek Park
  sit on opposite ends of Bellevue's housing spectrum — yet both cycle through exterior
  repaints every 5-7 years. The PNW's 37 inches of annual rain accelerates that timeline
  on north-facing surfaces. A kitchen upgrade to Sub-Zero or Wolf appliances looks
  half-finished when the surrounding cabinet paint still carries its original builder coat.
  Bellevue's 98006 zip holds a solid concentration of pre-1978 ranchers where EPA RRP
  lead testing is required before any interior brush work begins. Downtown Bellevue condos
  are a different story — high-gloss trim on common-area millwork, strict HOA color approval,
  and scheduling around other trades. Each submarket has its own prep logic.

localContext: |
  Lake Hills and Crossroads (98007, 98008) carry Bellevue's largest stock of mid-century
  tract housing — ranchers and split-levels built between the late 1950s and early 1970s,
  many still wearing multiple repaint layers over original cedar or hardboard siding.
  Newer Lakemont and Eastgate construction uses Hardie fiber cement siding, which needs
  a specific masonry-compatible primer system — not the same approach you'd use on cedar
  — before a two-coat acrylic finish holds reliably through a Bellevue winter. Sammamish
  Plateau homes just east of Bellevue share the same Hardie-heavy construction profile and
  the same primer requirement. West-facing elevations in both areas take direct rain exposure
  from October through May, which is why caulking every penetration — window flanges, hose
  bibs, electrical boxes — matters as much as the paint itself.

commonProblems:
  - title: "Lead Paint in Pre-1978 Lake Hills and Crossroads Ranchers"
    description: |
      Homes built before 1978 in Bellevue's 98007 and 98008 zip codes fall under EPA RRP
      rules. Any contractor disturbing more than 6 square feet of painted interior surface
      must be certified, use proper containment, and document debris disposal. XRF or
      chemical swab testing on window trim, door casings, and baseboard comes first.
      Skipping that step creates a health risk and exposes both the contractor and the
      homeowner to serious liability. Many of these ranchers also have original aluminum
      window frames — the paint-to-metal interface there needs an adhesion primer, not
      just the same latex you'd roll on drywall.

  - title: "Mildew and Algae Buildup on Cedar Shake in Somerset and Woodridge"
    description: |
      North-facing cedar shake in Somerset and Woodridge accumulates algae and mildew
      fast — visible within 2-3 years of a fresh coat given Bellevue's Oct-May rainy
      season. Proper prep means a full power wash with a mildewcide solution, letting
      the surface dry completely, then a stain-blocking oil primer before any two-coat
      acrylic topcoat. Cut that prep short and the next repaint comes in three years,
      not six. On original cedar that's never been stripped, checking for soft spots and
      failed caulk joints at corner boards is part of the walkthrough — paint won't
      seal over rot, it just hides it temporarily.

  - title: "Cabinet Finish Failure After Bellevue Kitchen Remodels"
    description: |
      Once new countertops or a panel-ready Sub-Zero goes in, original cabinet paint shows
      its age immediately against the updated finishes. Spraying with Benjamin Moore Advance
      or Sherwin-Williams Emerald Urethane trim enamel delivers a factory-level result
      without full replacement cost. The prep determines everything: degloss with a liquid
      sander, hand-sand, tack cloth, then bonding primer. Rush those steps and the finish
      chips at corner edges within 18 months. Box interiors and the backs of doors get
      the same treatment — a half-finished cabinet job shows the moment you open a door
      under recessed lighting.

