title: "Bellevue General Contracting — Permits, Trades & Full Remodels"

intro: |
  Somerset and Bridle Trails sit on some of the most valuable residential
  land in King County. The homes are split-levels and ranchers from the
  1970s-80s — solid square footage, wrong kitchens and primary suites for
  what buyers expect in 2025. General contracting in 98006 means navigating
  City of Bellevue Development Services plan review. It means sequencing
  MEP trades in the right order. And it means making early calls on Wolf
  ranges and Milgard windows — decisions that lock in both the budget and
  the framing rough-in before demo even starts. Vladislav Volkov has
  completed 100+ projects across Bellevue and the broader Seattle Metro
  since 2023. Call (206) 591-1096 to talk through your project directly
  with him.

localContext: |
  Bellevue's 98004 and 98005 zip codes hold a lot of mid-century ranchers
  and early split-levels. Many have original galvanized plumbing and
  load-bearing walls that don't appear on any existing plan. Newport Hills
  (98006) and Crossroads (98008) lean toward 1980s-90s builder-grade
  construction. Nominal lumber framing, builder windows that underperform
  against 37 inches of annual rain, HVAC systems past their service life.
  Factoria's newer townhomes and condo conversions are a different problem
  altogether: shared-wall easements and HOA coordination that have to be
  sorted before a general contractor can even submit a permit application.
  Each of these housing types needs a different approach on demo day.

commonProblems:
  - title: "City of Bellevue Plan Review — Longer Than Homeowners Expect"
    description: |
      Bellevue Development Services runs its own permit center — separate
      from Seattle SDCI or King County DPER. For a full kitchen remodel or
      a primary suite addition with structural changes, plan review typically
      runs 6–10 weeks. Incomplete MEP drawings kick the application back to
      the start of the queue. A missing load calculation or an unsigned
      structural sheet isn't a correction — it's a 6–10 week reset. That's
      one of the more expensive mistakes on any self-managed general
      contracting project in 98006. Having a general contractor who knows
      Bellevue's submittal checklist keeps the application clean the first
      time.

  - title: "Hidden Structure During Demo in 1970s–80s Homes"
    description: |
      Split-levels in Somerset and Newport Hills often used non-standard
      framing. Walls that read as partition walls sometimes carry point loads
      from the floor above. Demo opens the ceiling and you find out an LVL
      beam replacement wasn't in the original scope. That's a $4,000–$8,000
      line item landing mid-project, after the budget was set. Structural
      surprises are common enough in 98006 that every estimate Vladislav
      writes includes a demo-phase structural review before walls close.
      No guessing after the fact.

  - title: "Multi-Trade Scheduling Collisions on $100K+ Projects"
    description: |
      Rough-in inspections for electrical and plumbing run in sequence.
      Plumbing rough-in has to pass before the walls can close. Electrical
      rough-in runs separately after that. Trades that don't coordinate push
      the drywall hang a week, the painter loses their slot, and every delay
      compounds on a Bellevue mortgage. Sub-Zero and Thermador panel-ready
      units add another layer: cabinet rough openings need to be confirmed
      before framing fixes the dimensions. Managing that from multiple points
      of contact is where most self-managed remodels fall apart. General
      contracting with a single owner on-site — Vladislav, not a project
      manager hired last month — keeps those collisions from happening.

faq:
  - q: "How does the Bellevue permit process work for a major remodel?"
    a: |
      TopVolk handles the full permit cycle with Bellevue Development
      Services — application prep, plan review corrections, rough-in
      scheduling, and final inspection coordination. For major general
      contracting work in 98006–98008, plan review typically runs 6–10
      weeks. The application details matter a lot, so call (206) 591-1096
      to walk through your project scope before anything gets submitted.

  - q: "Do you work with the high-end appliances common in Bellevue kitchens — Sub-Zero, Wolf, Thermador?"
    a: |
      Yes. Kitchen remodels in Somerset, Bridle Trails, and Medina
      regularly involve Sub-Zero refrigerator columns, Wolf gas ranges, and
      Thermador dishwashers. Panel-ready unit rough openings and gas line
      sizing get planned before a wall opens — not after the cabinets
      are ordered.

  - q: "What does a realistic timeline look like for a full Bellevue remodel?"
    a: |
      For a $150K–$200K scope — kitchen, primary bath, flooring — budget
      4–6 months total: 6–10 weeks for Bellevue plan review, 8–10 weeks
      construction, plus blue tape walkthrough and punch list. Deadline
      penalties are written into the contract. TopVolk is WA Licensed
      Contractor, owner-led by Vladislav Volkov, 100+ projects in general
      contracting completed since 2023. Schedule a free on-site consultation
      at (206) 591-1096.