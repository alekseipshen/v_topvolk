title: "Bellevue Kitchen Remodel — Open-Concept Upgrades for Mid-Century Homes"

intro: |
  Somerset and Bridle Trails are packed with split-levels and ramblers built
  between 1960 and 1975 — and most of those kitchens are still walled off
  from the living room. Sub-Zero 48-inch panel-ready columns and Wolf
  dual-fuel ranges don't fit into a galley designed for a Harvest Gold range
  and a single 20-amp circuit. Getting to a real open-concept kitchen in
  these homes means load-bearing wall analysis, electrical service upgrades,
  and a permit pulled through Bellevue's own building department — not SDCI,
  not King County DPER.

localContext: |
  Bellevue's 98006 zip — Eastgate, Newport Hills, Factoria — has the densest
  concentration of mid-century ramblers that still run 100-amp electrical
  panels. Many were built before 1973, so the framing is Douglas-fir
  throughout, and the original kitchen walls frequently land on a bearing
  line. Over in 98004 near Bellevue Downtown, homes have often been partially
  opened up already, but the finishes are dated and the rough-in work was
  done to 1990s code — vapor barriers missing, gas lines undersized for a
  modern commercial-style range.

commonProblems:
  - title: "Load-Bearing Walls Between the Kitchen and Living Room"
    description: >
      In 1960s Bellevue ramblers, the kitchen-living partition almost always
      runs perpendicular to the ridge — that usually means it's load-bearing.
      Removing it requires an engineered LVL beam sized for the full span,
      PSL posts at each end, and a structural engineer's stamp before Bellevue
      Building Division will issue permits. We coordinate the engineering
      package in-house. No surprises after demo starts.

  - title: "100-Amp Panels That Can't Handle Modern Appliances"
    description: >
      A Thermador 36-inch induction range needs a dedicated 50-amp circuit.
      Add a Sub-Zero refrigerator column, Bosch dishwasher, and microwave
      drawer and you're past 100-amp capacity before the undercabinet lights
      are even wired. Upgrading to 200A service means coordinating a meter
      base swap with Puget Sound Energy — that's a separate inspection from
      the kitchen permit. Plan review for the electrical upgrade alone can add
      2-3 weeks to the schedule.

  - title: "Gas Line Modifications for Commercial-Style Ranges"
    description: >
      Switching to a Wolf 36-inch gas range means rough-in for a new gas
      line, plus exterior-ducted ventilation with enough CFM to meet IRC
      requirements — typically 400 CFM minimum for that burner BTU load.
      Recirculating hoods don't meet code here. Bellevue requires a separate
      gas permit from the building permit, and the rough-in inspection has to
      clear before drywall goes back up. Miss that sequence and the inspector
      flags a stop-work.

