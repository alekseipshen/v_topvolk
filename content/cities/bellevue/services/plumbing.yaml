title: "Bellevue Plumbing — Pipe Replacement & Remodel Work"

intro: |
  Split-levels off SE 60th Street in Somerset were built in the late 1960s — right
  when galvanized supply lines were standard and nobody thought twice about it. Fifty
  years of Bellevue city water has narrowed those pipes from the inside out, and a
  Moen pressure-balancing valve can't compensate for 60% flow restriction at the
  branch.

  That's a plumbing problem, not a fixture problem.

  The 1980s Crossroads and Newport Hills tract homes have a different situation
  entirely: polybutylene supply lines that fail silently at acetal fittings before
  anyone notices water damage behind the drywall. Replacing them is straightforward.
  Waiting until you see a stain on the ceiling is not. Two different eras, two
  different plumbing failure modes — both common across Bellevue's 98006 and 98008
  zip codes.

localContext: |
  Homes in the 98006 zip — Newport Hills, Somerset, Lakemont — span from early 1960s
  ranchers to 1990s colonials, and nearly every era carries a distinct plumbing
  liability. Builds from 1965-1975 often still run galvanized supply and cast-iron
  drain lines. Builds from 1985-1995 got polybutylene.

  Bellevue's municipal water pressure runs high.

  Over in Bridle Trails and near Bellevue Downtown, city pressure regularly clocks
  above 85 PSI at the meter — well past the 80 PSI threshold in IRC section
  P2903.3.1 — which accelerates wear on fixture supply connections and shower
  cartridges alike. A pressure-reducing valve (PRV) is standard plumbing practice
  here, and most 1970s builds in the 98004 and 98005 zips never had one installed.
  That's a quick fix that protects every downstream Moen or Kohler fixture in the
  house.

commonProblems:
  - title: "Corroded Galvanized Supply Lines in Somerset and Newport Hills"
    description: |
      Galvanized steel corrodes inward, building oxide scale that restricts flow
      over decades. By the time a Kohler pressure-balance valve can barely fill a tub
      in under 20 minutes, the interior diameter of a ¾-inch supply branch may have
      choked down below ⅜-inch.

      Spot repairs just relocate the restriction.

      Full repiping to PEX-A or Type L copper is the permanent plumbing fix. Access
      through finished ceilings in these split-level floor plans takes planning —
      Somerset homes on the hill especially, where mechanical chases are tight and
      routing new supply runs means opening drywall across more than one room. Vladislav
      scopes the access points first before any pipe gets touched.

  - title: "Polybutylene Pipe Failures in 1980s-Era Bellevue Builds"
    description: |
      Gray or blue polybutylene (PB) pipe — typically ½-inch or ¾-inch diameter —
      shows up in thousands of Bellevue homes built between 1978 and 1995. Chlorine in
      municipal water degrades the material at acetal fittings and coupling inserts; the
      failures start as slow weeping behind walls, not dramatic bursts. A full PEX
      repipe using Uponor AquaPEX with a home-run manifold layout is now standard
      plumbing practice for these homes. Vladislav has run this scope in Newport Hills,
      Crossroads, and Eastgate — the floor plans are familiar territory.

  - title: "Tankless Water Heater Conversions Requiring Gas Line Upsize"
    description: |
      A Navien NPE-240A or Rinnai RUR199iN demands up to 199,000 BTU on demand —
      most 1970s Bellevue homes have ½-inch black iron gas supply lines rated for
      roughly 60,000 BTU. The heater itself is half the job.

      Running new ¾-inch or 1-inch gas supply from the meter, installing a Category III
      stainless concentric flue, and adding seismic strapping per WA code all require a
      City of Bellevue permit and rough-in inspection before the wall closes. This is
      plumbing and mechanical work — both scopes pulled under one WA Licensed Contractor.
      Vladislav coordinates the permit, the gas upsize, and the finish plumbing
      connections so nothing falls between trades.

faq:
  - q: "How fast can you get to Bellevue for plumbing work?"
    a: "Bellevue — 98004, 98006, 98008 — is a core part of the service area, typically
      20-30 minutes via I-405 or I-90. Street parking is easy in the residential
      neighborhoods. Call (206) 591-1096 to set up a free on-site walkthrough with
      Vladislav directly — not a sales rep, the person doing the work."

  - q: "Do you install Rinnai and Navien tankless units?"
    a: "Both regularly. Rinnai RU and RUR series, Navien NPE condensing units. Common
      issues include scale buildup in the heat exchanger from Bellevue's moderate water
      hardness, igniter failures, and error codes caused by undersized gas supply
      pressure. Moen and Kohler fixture rough-ins are part of most bathroom remodel
      scopes we run alongside the mechanical plumbing work."

  - q: "What does a full repipe cost in Bellevue, and do you pull permits?"
    a: "A 2,000-2,500 sq ft single-family home typically runs $12,000-$22,000 for a full
      PEX repipe, depending on access, finished ceiling conditions, and fixture count.
      Plumbing permits go through City of Bellevue's permit center — plan 2-4 weeks for
      plan review on a standard single-family scope. TopVolk is a WA Licensed Contractor;
      100+ projects completed since 2023. Deadline commitments are written into the
      contract with penalties. Call (206) 591-1096 for a line-item quote on-site."