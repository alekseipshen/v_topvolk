title: "Bellevue Home Additions — ADUs, Second Stories & Suites"

intro: |
  Somerset split-levels and the 1960s ranchers scattered through 98006 weren't designed with in-law suites or home office wings in mind. Bellevue's land costs make additions the smarter move over buying up — you stay in the neighborhood, keep the school district, and get the square footage you actually need. A new kitchen wing with Wolf range and Sub-Zero refrigerator rough-ins, or a detached ADU under WA HB 1337, can fundamentally reshape how your property works. Vladislav Volkov has led 100+ projects across the Eastside since 2017.

localContext: |
  Most addition requests in Bellevue come from 98006 and 98008 — Somerset, Woodridge, and Lake Hills, neighborhoods built in the 1960s and 70s on lots that often back up to the Mercer Slough greenbelt. Footprints run 1,400–1,900 sq ft on slab or crawlspace foundations, with original framing designed for a single story. Crawlspace homes need vapor barrier inspection before any addition work touches the existing structure — heavy rainfall from October through April accelerates moisture issues if the envelope isn't sealed right. Bellevue's permit center operates separately from King County DPER, and plan review for additions typically runs 4–8 weeks.

commonProblems:
  - title: "Foundation and Structural Capacity for Second-Story Additions"
    description: |
      A second story over a 1965 rancher in Somerset requires a structural engineer to evaluate the existing foundation, wall framing, and load path before a single permit drawing gets submitted. The fix usually starts by sistering the rim joist, installing LVL beams at the new floor level, and adding PSL posts where point loads concentrate. Get this wrong and the rough-in inspection fails — or worse, the framing moves after load.
  - title: "FAR Limits, Setbacks, and Lot Coverage in Bellevue Zones"
    description: |
      Bellevue's R-1 through R-5 zones each carry their own FAR (Floor Area Ratio) limits and setback requirements. A 7,500 sq ft lot in Woodridge may have less buildable area than it looks — especially once the garage footprint enters the lot coverage calculation. Under WA HB 1337, ADU footprint counts separately in some scenarios. Pulling zoning data and Bellevue permit center records before drawing anything is the only way to know what's actually buildable.
  - title: "HVAC Zoning and Tying Into Existing Ductwork"
    description: |
      Older Bellevue homes rarely have ductwork sized for an addition. Rather than forcing extra load onto an undersized furnace, a Mitsubishi mini-split for the new zone keeps HVAC work off the critical path and avoids a full duct replacement. Bellevue's wet winters make envelope sealing critical too — vapor barrier and R-49 insulation details in the new zone get spec'd at rough-in, not figured out after the drywall is hung.

faq:
  - q: "How do I get started with a home addition project in Bellevue?"
    a: |
      Call (206) 591-1096 to schedule an on-site consultation with Vladislav directly — no sales staff, no commissioned closer. TopVolk is a WA Licensed Contractor with 100+ projects completed across the Eastside since 2017, including additions in Somerset and Woodridge. An on-site walk can usually happen within a week. You'll get a line-item quote from the person actually running the project.
  - q: "Does WA HB 1337 apply in Bellevue — can I build a DADU on my lot?"
    a: |
      Yes — WA HB 1337 (2024) applies statewide, Bellevue included. Most single-family lots can now accommodate two ADUs: one attached (AADU) and one detached (DADU). Lot coverage limits, the 24 ft DADU height cap, and setbacks still apply under Bellevue's specific zoning code. Permit submittal goes through Bellevue's permit center — that's included in our project scope from day one.
  - q: "What's a realistic timeline for a home addition in Bellevue, start to finish?"
    a: |
      A ground-floor in-law suite addition typically runs 4–7 months end-to-end — about 4–8 weeks for Bellevue plan review, then 3–5 months of construction depending on scope. Second-story additions take longer because structural complexity adds time before framing even starts. A full second-floor addition can run 6–9 months. Missed deadlines cost us money — that penalty is written into every contract.