  - q: "Can you build a DADU above a new detached garage in Bellevue?"
    a: |
      Yes. WA HB 1337 (2024) allows up to two ADUs per single-family lot statewide, and a DADU above a detached garage qualifies. TopVolk handles Bellevue permit filing, structural LVL beam floor system, Milgard window installation, R-49 ceiling insulation, Mitsubishi mini-split rough-in, and separate utility connections. Vladislav is a WA Licensed Contractor — 100+ projects completed since 2017. You speak directly with the owner from first call through final inspection, not a project coordinator.
