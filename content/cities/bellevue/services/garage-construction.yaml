title: "Bellevue Garage Construction — Detached Builds & ADU Permits"

intro: |
  Mid-century ranchers across Somerset and Bridle Trails were built for a single carport. That was enough in 1965. Today's homeowner in zip code 98006 typically wants a proper two-car detached garage — and a growing number are adding a DADU above under WA HB 1337 to house parents or generate rental income. A project like that means permits through Bellevue's own permit center, setback calculations against actual lot lines, LVL beam sizing for the upper floor assembly, and Hardie lap siding matched to the existing house so the new structure looks intentional. Call (206) 591-1096 — Vladislav visits the site himself, not a closer.

localContext: |
  Bellevue's residential zones span 1960s split-levels in zip code 98005 around Crossroads to 1990s builder-grade homes near Factoria and the Eastgate I-90 interchange. Older RS-7500 lots come with side setbacks as tight as 5 feet, which directly caps how wide a new detached structure can be. Bellevue operates its own permit center, separate from King County DPER, and plan review on a garage-plus-DADU project typically runs 6-10 weeks. Pacific Northwest rainfall — roughly 37 inches a year — is also why most homeowners want a weathertight, insulated garage from day one rather than an open shell patched together in year three.

commonProblems:
  - title: "Lot Coverage and FAR Limits in Bellevue RS Zones"
    description: |
      Bellevue's RS zoning counts every square foot of covered structure toward the lot coverage total — garage footprint, covered patio, and the DADU above. On a typical 7,500 sq ft lot in zip 98006, a two-car footprint plus DADU can push right up against the FAR ceiling. Miss that math at the design stage and the whole permit application gets kicked back after drawings are stamped and engineering fees are spent. TopVolk pulls the actual lot dimensions from King County assessor records at the first site visit, runs the setback and coverage numbers, and flags conflicts before any drafting begins.
  - title: "EV Charger Circuit Pre-Wire and Main Panel Capacity"
    description: |
      Most new garages in Bellevue need a 50A or 60A circuit stubbed in during rough-in framing — before walls are closed and conduit runs are buried. In Somerset and Bridle Trails, two-EV households are common enough that panel capacity is a real planning question. Skipping the pre-wire and adding it post-construction means cutting finished drywall and potentially trenching through cured concrete. The electrical sub confirms panel ampacity as part of MEP coordination, before the slab pour locks in the structural layout.
  - title: "Matching Siding and Roofline on 1970s and 80s Homes"
    description: |
      Cedar shake and board-and-batten define Bellevue's mid-century residential exterior. Replicating that profile on a new detached garage takes more than selecting the nearest Hardie lap panel color — roofline pitch, fascia depth, and soffit details have to align with the main house. North-facing surfaces in King County grow moss on raw wood within a few seasons. Hardie cement-board handles that exposure without rot. The concrete slab goes in at 4-inch minimum thickness with fiber reinforcement, placed before framing starts, not poured as a quick afterthought once walls are vertical.

