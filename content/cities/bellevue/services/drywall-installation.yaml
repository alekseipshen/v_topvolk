title: "Bellevue Drywall Installation — Level 5 Finish for Mid-Century Remodels"

intro: |
  Split-levels and ranchers in Somerset and Factoria went up through the 1960s and 70s. Most have textured ceilings. Many still have original 3/8-inch drywall — undersized by today's standards and painted over so many times the surface won't hold a clean finish. Opening walls for a Wolf range hood rough-in or a master bath rebuild exposes panels that need full replacement, not just patching. Remodel budgets in Bellevue typically run $80K–$200K+. The drywall finish has to match everything around it — especially under sidewall or raking light, where every imperfection shows.

localContext: |
  Most homes in the 98006 and 98008 zip codes are 1960s–1970s split-levels and ranchers. Original drywall painted over multiple times, never touched since. Bridle Trails and Eastgate homes commonly turn up 3/8-inch panels on interior walls — undersized by current IRC standards. That discovery usually happens during electrical rough-in for whole-house remodels. Building an ADU or converting a garage triggers Bellevue's own permit center — not SDCI, Bellevue runs independent plan review. ADU plan review typically takes 8–12 weeks. Any shared wall between a garage and habitable space requires 5/8-inch Type-X firecode drywall, continuous from floor to ceiling with no gaps at penetrations.

commonProblems:
  - title: "Popcorn and Orange-Peel Ceilings Hiding Damaged Drywall Below"
    description: "Most 1970s and 80s Bellevue homes have texture applied directly over drywall taped in skip-trowel or orange-peel. Scraping it exposes seams, nail pops, and butt joints. Those need full skim-coat work before paint — priming over them doesn't work. Level 5 finish puts a continuous skim coat over the entire surface. It's the only reliable prep for a satin or semi-gloss ceiling under recessed lighting. That's what the room needs to look right, especially when the rest of the finishes are sharp and the lighting is unforgiving."

  - title: "5/8-Inch Type-X Requirements for Garage Conversions and ADU Separation Walls"
    description: "Bellevue's building department enforces IRC firecode requirements for any living space sharing a wall or ceiling with a garage. That means 5/8-inch Type-X firecode drywall — continuous, no gaps at penetrations. Many homeowners doing WA HB 1337 ADU additions find out mid-project when framing inspection flags the separation wall assembly. It's not optional. Retrofitting it after insulation is already in costs more and adds time to the schedule. Getting the panel spec right before rough-in inspection saves the project."

  - title: "Mold-Resistant Purple Board in Below-Grade Spaces and Laundry Rooms"
    description: "Bellevue gets roughly 37 inches of rain annually. Below-grade spaces in 98004 and 98006 — especially walk-out basements on north-facing grades — show chronic moisture damage on original standard gypsum. Standard drywall fails within a few years in those conditions. The fix is mold-resistant purple board (moisture-rated Type M), paired with a Schluter vapor barrier membrane behind the panel, installed before any finish work starts. Using Type M without the vapor barrier still leaves moisture a path in. Both layers matter."

