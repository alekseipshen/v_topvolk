title: "Bellevue Insulation — R-49 Attic & Crawl Space Upgrades"

intro: |
  Split-levels in Somerset and the ranchers scattered through 98006 — most built
  between 1960 and 1975 — were never designed to hit today's energy code. A
  Mitsubishi heat pump running two hours longer than it should in January is a
  symptom, not the root problem. Inadequate attic insulation and open rim joists
  are what's actually burning the extra kilowatts. Add 37-plus inches of annual
  rain pressing moisture up through an unencapsulated crawl space under a Lake
  Hills home, and the energy problem becomes a structural one by spring.

localContext: |
  The Lake Hills and Crossroads neighborhoods in 98008 are packed with 1960s
  split-levels — vented crawl spaces that were never encapsulated, attic batts
  settled to effective R-11 over fifty years of foot traffic and HVAC installs.
  Newer construction along the 98004 corridor near Bellevue Downtown often clears
  original energy code on paper but still shows thermal bridging at rim joists
  and knee walls once you pull a blower door test. Both are fixable with the
  right scope and sequence.

commonProblems:
  - title: "Attic Insulation Below R-49 in Bellevue's Mid-Century Stock"
    description: "The ranchers and split-levels in Somerset and Lake Hills typically
      have 3 to 4 inches of original fiberglass batt — R-11 to R-13, compressed
      further by decades of settling. Getting to the R-49 required under the
      Washington State Energy Code starts with air-sealing all attic penetrations,
      then blown-in cellulose over the existing layer. CertainTeed InsulSafe SP
      handles Bellevue's humidity better than low-density fiberglass and the job
      doesn't require a full tear-out to be done correctly."
  - title: "Vented Crawl Spaces Pulling Moisture Through Floors in 98008"
    description: "Bellevue pulls 37-plus inches of rain annually, nearly all of
      it between October and April — exactly when a vented crawl space under a
      Crossroads or Lake Hills split-level is absorbing ground moisture. Proper
      encapsulation means 20-mil vapor barrier mechanically fastened across the
      floor, closed-cell spray foam on the stem walls and rim joists, and a
      conditioned air strategy replacing passive venting. The original plastic
      sheeting stapled loosely to joists in the 1970s has long since failed."
  - title: "Rim Joist and Knee Wall Air Gaps Losing Heat in 1.5-Story Homes"
    description: "Rim joists — the framing band sitting on top of the foundation
      wall — are the single most common unaddressed air leak in Bellevue's
      split-levels. Two inches of closed-cell spray foam on the interior face
      delivers R-12 plus continuous air sealing in a single pass. Knee walls in
      1.5-story homes in the 98006 and 98007 zip codes need the same treatment.
      Getting these details right is what lets a Navien or Rinnai tankless water
      heater actually run at rated efficiency instead of working against constant
      infiltration all winter."

faq:
  - q: "How fast can you get to Bellevue for an insulation consultation?"
    a: "Bellevue is 20 to 30 minutes from Seattle via I-90 or SR-520 depending
      on traffic. Call (206) 591-1096 to schedule a free on-site walkthrough —
      Vladislav assesses the attic and crawl space himself, not a commissioned
      estimator. Most consultations are booked within a week."
  - q: "What insulation materials do you use — blown cellulose, spray foam, or
      mineral wool?"
    a: "Blown-in cellulose (CertainTeed or comparable) for attic depth upgrades
      to R-49. Closed-cell spray foam — Icynene or equivalent — for rim joists,
      crawl space stem walls, and any air-critical zone. Rockwool mineral wool
      batts for sound separation between floors during full remodels. Material
      choice depends on what you're solving — energy loss, moisture, or sound.
      TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017."
  - q: "Does insulation work in Bellevue require a permit, and are PSE rebates
      available?"
    a: "Bellevue runs its own permit center, separate from King County DPER. Most
      attic top-off work is exempt or over-the-counter. PSE (Puget Sound Energy)
      rebates can offset $500 to $1,500-plus on qualifying upgrades depending on
      scope and existing R-value. Vladislav walks you through what qualifies
      before any work starts — no surprises. Missed project deadlines are written
      into the contract as a penalty we pay. Call (206) 591-1096."