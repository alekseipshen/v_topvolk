title: "Bellevue Tile Installation — Substrate and Waterproofing Done Right"

intro: |
  Mid-century ranchers in Crossroads and the 1970s split-levels around Somerset weren't built with today's tile standards in mind. Original bathrooms in Bellevue's 98006 and 98008 zip codes typically have fiberglass tub surrounds or thin-set applied directly over drywall — no Schluter Kerdi membrane, no slope, no drainage plane. Bellevue gets 37+ inches of rain a year. That moisture doesn't stay outside. Substrate prep and continuous waterproofing come before any tile goes up — the finish is the easy part.

  Vladislav Volkov has been doing this work across the Eastside since 2017 — 100+ projects completed in King County alone. Owner-operated means Vladislav is on site, not delegating substrate decisions to whoever showed up that morning. Missed deadlines carry a financial penalty written into every contract. Call (206) 591-1096 to schedule an on-site consultation.

localContext: |
  Bellevue's residential stock spans three distinct eras: mid-century slab-on-grade homes near Factoria and Eastgate, 1980s two-story colonials in Newport Hills, and newer custom builds closer to the Bellevue Downtown core. Slab floors in the older stock change how we approach large-format porcelain and Schluter Ditra-Heat heated floor installs — thermal mass planning matters when you're heating concrete, not a wood subfloor. Joist-framed upper floors in the 98005 corridor need an L/360 deflection check before 24x48 tile goes down, or the grout cracks inside a year.

  Somerset homes on the hillside above I-90 see more freeze-thaw stress on exterior tile than people expect from a city that rarely dips below 28°F. Grout joints on covered patios and entry thresholds fail from thermal cycling, not foot traffic. That's an exterior-grade thinset and sanded grout conversation before any layout decisions get made.

commonProblems:
  - title: "Shower Tile Failing from Missing Waterproofing Membrane"
    description: "Pre-2000 homes in Eastgate and Newport Hills were typically tiled directly over cement board with no continuous waterproofing layer behind it. Bellevue's humidity accelerates water migration through the tile plane — framing rots before the surface shows any sign of damage. The fix means pulling the entire enclosure, inspecting for rot, applying Schluter Kerdi fabric or liquid RedGard to all surfaces, then rebuilding correctly. Skipping that step is why the tile fails again in five years."

  - title: "Large-Format Porcelain Cracking on Under-Spec Subfloor"
    description: "32x32 and 24x48 porcelain is common in Bellevue primary bathroom renovations — clean lines, minimal grout, easy to maintain. The problem is substrate deflection. Joist-framed floors in Factoria's 1970s-80s ranchers often don't meet L/360 stiffness, and large-format tile cracks when the floor flexes. Laser-leveling the subfloor, sistering undersized joists where needed, and installing Schluter Ditra uncoupling membrane prevents the problem from appearing two remodels from now."

  - title: "Shower Niche Framing Without Slope or Continuous Membrane"
    description: "A recessed niche breaks the waterproofing plane. Framing cut between studs without PT lumber blocking and Schluter Kerdi fabric wrapping lets water wick straight into the wall cavity — invisible damage until the drywall on the other side bubbles. The niche shelf also needs a minimum 1/8-inch-per-foot slope toward the shower floor. Flat shelves pool water and stain the tile. Neither detail is complicated. Both get skipped constantly."

