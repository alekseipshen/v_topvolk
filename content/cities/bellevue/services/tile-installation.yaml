  - q: "What tile materials do you work with for high-end Bellevue bathrooms and kitchens?"
    a: "Large-format porcelain, Calacatta marble, travertine, and handmade Zellige tile all come through on Bellevue projects. Kitchen backsplash work behind a Wolf range or alongside a Miele dishwasher install gets coordinated with electrical relocation before the tile layout starts. Natural stone gets penetrating sealer matched to PNW moisture conditions — travertine especially needs an impregnator, not just a surface coat."

  - q: "How long does a tile renovation take in Bellevue, and do you pull permits?"
    a: "A full primary bathroom remodel — demo, Schluter Kerdi waterproofing, heated floor, walls, niche, finish tile — runs 3-5 weeks in the field. Bellevue has its own permit center, separate from King County DPER. Cosmetic tile replacement usually skips permitting. Adding a Schluter Ditra-Heat system with new 240V electrical triggers a permit and rough-in inspection. TopVolk is a WA Licensed Contractor; Vladislav Volkov pulls permits directly — 100+ projects handled since 2017. Missed deadline penalties are written into every contract. Call (206) 591-1096 to scope your project."