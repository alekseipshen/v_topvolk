  - q: "Does power washing require a permit in Maple Valley?"
    a: "Standard residential exterior power washing in Maple Valley — siding, decks, fences, driveways, and pavers — does not require a building permit from the City of Maple Valley permit office or King County DPER. The main coordination requirement is timing: if washing precedes a repaint or re-stain, the coating contractor's schedule drives the window, since surfaces need 48–72 hours minimum dry time in the Pacific Northwest's humid climate before any product goes on. If washing is part of a larger renovation project — deck rebuild, fence replacement, or full exterior repaint — TopVolk handles permit coordination as a WA Licensed Contractor for the construction scope. The washing itself stays permit-free regardless."

  - q: "What's the difference between soft-washing and pressure washing — and which does my cedar siding need?"
    a: "Soft-washing uses a 12-volt pump system to apply a low-pressure chemical solution — sodium hypochlorite at 1–2% for biological growth — and relies on dwell time to kill moss, algae, and mildew rather than mechanical force. Pressure washing uses a pump at 2,000–4,000 PSI to mechanically remove dirt and debris. Cedar siding, wood fences, Hardie lap, and any painted surfaces need soft-wash or low-pressure rinse (under 500 PSI) to avoid surface damage or moisture intrusion behind J-channel flashing. Concrete driveways, walkways, and pavers handle full pressure with a rotary surface cleaner safely. Most Maple Valley jobs use both methods in the same visit — soft-wash for the house and fence, surface cleaner and turbo nozzle for the concrete."

  - q: "How long does the cleaning last on cedar and concrete in Maple Valley's climate?"
    a: "A properly soft-washed cedar deck or north-facing siding in Maple Valley stays visibly clean for 12–18 months before moss regrowth becomes noticeable, assuming no stain or sealer was applied after washing. Cedar fences and decks that are cleaned AND sealed or stained right after hold for 3–5 years before the next wash cycle — the coating blocks moisture and organic material from taking hold in the wood grain. Concrete driveways cleaned of oil and tire marks don't reaccumulate old staining on their own; only new drips create new spots. TopVolk warranties cleaning work for 30 days against streaking or missed areas — if moss regrows in that window due to application error, it gets retreated at no charge."

