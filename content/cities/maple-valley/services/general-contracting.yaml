title: "Maple Valley General Contracting — Permits, No Middlemen"

intro: |
  The subdivisions around Lake Wilderness and along the Cedar River corridor filled in fast through the 1990s and early 2000s — those homes are now 25-30 years old, and builder-grade kitchens, dated bathrooms, and undersized panels are showing up in clusters. Vladislav Volkov at TopVolk Construction handles full remodels, additions, and ADUs in zip 98038 as a WA Licensed Contractor — owner on-site, no sales staff, and a Bosch-ready kitchen rough-in planned before the first wall opens. 100+ projects completed since 2017.

localContext: |
  Most of zip 98038 was platted during King County's growth boom in the early 1990s through mid-2000s — 2x6 framing, OSB sheathing, builder-grade fixtures throughout. Some older parcels along the Maple Valley-Black Diamond Road corridor date to the 1970s and early 1980s, when load calculations were loose and additions got built without pulling permits. Either way, 25-40 years of Pacific Northwest rain means moisture intrusion, rot at the rim joist, and a few surprises once demo starts.

commonProblems:
  - title: "Multi-Trade Scheduling Falls Apart Without Someone Holding the Timeline"
    description: |
      Framing finishes and the electrician is two weeks out — drywall can't start, the Bosch dishwasher rough-in can't happen, and the project bleeds money sitting idle. MEP coordination on an $80K-$150K remodel in zip 98038 involves four or five subs. Without someone managing the sequence, rough-in inspection fails and nobody agrees on who missed what.
  - title: "Demo Reveals What the Original Builder Left Behind"
    description: |
      Pull a wall in a 1995 tract home and you'll often find undersized rim joists, missing blocking, or sister joists someone added without a permit. Structural repairs mid-project — adding an LVL beam to carry a load the original framing wasn't handling — can add $8,000-$15,000 to a kitchen remodel that opened at $65,000 and was supposed to fit a Thermador range. Budget should account for it.
  - title: "Maple Valley Permit Applications Have to Be Right the First Time"
    description: |
      Maple Valley runs its own permit center as an incorporated city, and plan review for major work — full kitchen gut, Sub-Zero refrigerator alcove, structural changes — typically takes 6-10 weeks. Submit with errors or missing engineering drawings and add another 3-4 weeks. TopVolk handles the application, responds to plan review comments, and schedules the inspection sequence: rough-in, framing, final.

faq:
  - q: "How fast can you get to Maple Valley for General Contracting?"
    a: |
      Maple Valley sits about 30 minutes from Seattle via SR-18. For projects in 98038, we do on-site consultations — no phone estimates for remodel work. Call (206) 591-1096 to schedule. Vladislav typically visits within a few days of first contact.
  - q: "Do you work with Sub-Zero, Bosch, or Thermador during kitchen remodels in Maple Valley?"
    a: |
      Yes — in Maple Valley kitchens we regularly coordinate around Bosch dishwashers and ranges, KitchenAid refrigerators, and Thermador or Sub-Zero in higher-end builds. Appliance specs go into the plan before cabinet rough-in: cutout dimensions, ventilation clearances, gas vs. induction. That prevents costly re-work after cabinets are set.
  - q: "How long does a remodel take in Maple Valley, and what does the contract look like?"
    a: |
      Plan review adds 6-10 weeks before construction starts — that's the part most homeowners skip in their planning. Once permits are issued, a full kitchen typically runs 6-10 weeks, a bathroom 3-5 weeks. The contract includes written penalty clauses for missed deadlines. Call (206) 591-1096 — on-site consultations happen within the week, and you get a line-item quote, not a vague range.