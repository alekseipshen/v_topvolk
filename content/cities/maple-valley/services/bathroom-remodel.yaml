title: "Maple Valley Bathroom Remodel — 1990s Builds, Real Upgrades"

intro: |
  The subdivisions that spread across 98038 between 1993 and 2007 were built to a developer's margin. Homes near Lake Wilderness Park got builder-grade Moen faucets, 4×4 ceramic tile, and vanities that were barely adequate when new. Twenty-five years of Pacific Northwest humidity — 37 inches of rain a year, damp crawlspaces, bathrooms that never had proper ventilation — and those original finishes are showing every year of it.

localContext: |
  Most of the bathroom projects in Maple Valley fall in zip code 98038, east of Highway 169 toward the Cedar River corridor. The Wilderness Ridge area and neighborhoods off SE 256th saw the bulk of the 1995–2005 build-out — two-story colonials and split-levels with tight secondary baths and oversized garden tubs nobody actually uses. Builder-grade tile and grout throughout. Wet winters here accelerate grout failure faster than you'd see in drier Eastside suburbs like Sammamish or Issaquah.

commonProblems:
  - title: "Cracked 4×4 Tile and Failed Grout From 1990s Builder Installs"
    description: "Most 98038 homes from that era went up with standard 4×4 ceramic over backer board — no waterproofing membrane behind it. Once grout cracks, water reaches the substrate and the damage compounds. Replacing tile alone won't fix it. A proper Schluter Kerdi membrane or RedGard coating behind new large-format porcelain is the correct repair, not another tile swap."
  - title: "Ventilation Failure Leading to Mold Inside the Wall Cavity"
    description: "Maple Valley bathrooms with undersized exhaust fans trap moisture inside the wall — especially on north-facing exterior walls where sunlight never dries things out. By the time mold is visible, it's already in the framing. Fix involves opening the wall, treating the lumber, upgrading to a Broan or Panasonic unit with adequate CFM rating, and replacing the vapor barrier before closing up."
  - title: "Garden Tub Removal and Walk-In Shower Conversion"
    description: "The garden tub in 1990s master baths gets used maybe twice a year. Converting that footprint into a proper walk-in requires relocating drain lines, blocking the new shower area with PT lumber, and choosing between a curbed floor or curbless entry with a Schluter linear strip drain. King County DPER requires a permit for any plumbing relocation — plan review typically runs 3–5 weeks."

faq:
  - q: "How fast can you get to Maple Valley for a bathroom remodel consultation?"
    a: "Maple Valley is about 35 minutes from South Seattle via Highway 169 — we're out there regularly. Call (206) 591-1096 to schedule a free on-site visit. Vladislav comes out, measures the actual space, and puts line-item numbers in front of you the same day."
  - q: "Do you work with Kohler and Moen fixtures in Maple Valley bathrooms?"
    a: "Yes — most Maple Valley homes have original Moen or Kohler rough-in valves still in the wall. We can build around an existing valve if it tests clean, or replace with a Kohler or Delta pressure-balance cartridge. Rinnai tankless hookups come up often when homeowners upgrade the water heater at the same time as a master bath remodel."
  - q: "What does a full master bath remodel cost in Maple Valley, and how long does it take?"
    a: "A full gut-and-rebuild in 98038 — new shower, floor, vanity, fixtures, lighting — typically runs $28,000–$55,000 depending on layout changes and finish selections. King County DPER plan review adds 3–5 weeks upfront; build time is 6–10 weeks from permit approval to blue tape walkthrough. Vladislav is on-site personally — WA Licensed Contractor, 100+ projects since 2017, deadline penalty written into the contract. Call (206) 591-1096."