  - q: "Do handyman repairs in Maple Valley need permits through King County DPER?"
    a: |
      Most handyman-scale work — fixture replacement, drywall patches, weatherstripping, smart device installs, and finish repairs — doesn't require a permit under King County DPER jurisdiction for unincorporated parcels in the Maple Valley area. Deck work gets more nuanced: swapping individual boards usually doesn't trigger permit review, but replacing structural framing members, modifying footing conditions, or bringing handrail geometry up to current IRC compliance may require a King County DPER building permit. Incorporated parcels fall under Maple Valley city jurisdiction with similar thresholds. TopVolk Construction LLC is a WA Licensed Contractor and handles permit intake when a project crosses those lines. If you're uncertain whether your repair needs a permit, that's exactly the right question to raise at the free consultation.

  - q: "Can you match existing wall texture when patching drywall in a 1990s Maple Valley home?"
    a: |
      Yes — but it requires the right equipment and process. The standard wall finish in Maple Valley homes from the 1990s and early 2000s is spray-applied orange peel or knock-down texture. Matching it after a patch means using a hopper gun and compressor rather than an aerosol can, applying setting-type compound to control shrinkage, and blending the texture feather edge into the surrounding wall before any primer goes on. A two-coat prime sequence after texture — prime, sand lightly, prime again — prevents the patch from reading as a shadow under raking or angled light. Vladislav handles mud, texture, and prime as part of every drywall patch job, so the step that usually gets skipped doesn't get skipped.

  - q: "What warranty do you offer on handyman repairs in Maple Valley?"
    a: |
