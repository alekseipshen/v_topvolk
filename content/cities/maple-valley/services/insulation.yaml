      (206) 591-1096 to schedule a free consultation with Vladislav and get an actual
      number for your specific house.

  - q: "Do I need a permit for insulation work on my Maple Valley home?"
    a: |
      For standard insulation work on existing residential structures — attic blow-in,
      crawl space vapor barrier replacement, rim joist spray foam — King County DPER
      does not require a building permit. Most of Maple Valley's single-family
      residential parcels fall under unincorporated King County jurisdiction, so there
      is no separate city permit center to navigate. If the insulation project is part
      of a larger renovation involving structural changes, an addition, or a new access
      hatch cut into the floor, those other scopes may trigger a permit even if the
      insulation work itself would not. TopVolk (WA Licensed Contractor) confirms the
      permit picture during the site visit before any scope is committed to paper.

  - q: "Blown-in cellulose or fiberglass batt — which is better for Maple Valley attics?"
    a: |
      Both materials can reach R-49, but blown-in cellulose performs more consistently
      in the truss-framed attics common in Maple Valley's 1990s-2000s homes. Cellulose
      — recycled paper treated with borate fire retardant — conforms to irregular bays
      and framing obstructions, settles less than blown fiberglass over time, and adds
      modest air resistance that batts simply cannot provide. Fiberglass batt cut-and-
      fit leaves small edge gaps that compound over hundreds of joist bays. For attic
      retrofits where existing HVAC equipment or ducts need to be worked around, a
      truck-mounted cellulose blower with a flex hose is also faster and cleaner than
      manual batt installation. Greenfiber and CertainTeed InsulSafe SP are the two
      products used most often on Maple Valley attic jobs.

  - q: "How long does insulation last in the Pacific Northwest, and what's covered?"
    a: |
      Blown-in cellulose carries a manufacturer warranty of 20-plus years against
      significant settling; a properly installed attic blow in Maple Valley's climate
      realistically holds R-value for 30-plus years with no maintenance. Closed-cell
      spray foam on rim joists is essentially permanent in a dry crawl space —
      Icynene and comparable closed-cell products do not degrade over normal
      residential lifespans. A 20-mil reinforced vapor barrier carries a 25-year
      manufacturer warranty against material failure under normal conditions. TopVolk's
      workmanship warranty covers installation defects separately — if something does
      not perform as specified after the job is done, we come back and fix it. That
      obligation is written into the contract, alongside the deadline penalty clause.

