  - q: "What does attic insulation to R-49 cost in Maple Valley?"
    a: |
      For most 1,800-2,400 sq ft Maple Valley homes, blown-in cellulose to R-49 runs
      $2,800-$4,500 installed. That price should include air sealing the top plates,
      penetrations, and recessed can lights before the blow — skip that step and the
