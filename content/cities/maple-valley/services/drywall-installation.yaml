  - q: "Do I need a permit for drywall work in Maple Valley?"
    a: |
      Most interior drywall work — patching, popcorn removal, finish-level upgrades within existing rooms — doesn't require a permit. The requirement kicks in when drywall is part of a structural alteration, a change in occupancy (garage conversion, ADU addition), or a room addition that triggers building permit review. Unincorporated Maple Valley falls under King County DPER for permits; the City of Maple Valley has its own permit center for parcels within incorporated city limits. ADU separation walls requiring type-X firecode drywall go through plan review — currently 4–8 weeks at King County DPER for full remodel packages. TopVolk Construction is a WA Licensed Contractor and handles permit coordination as part of the project scope.

  - q: "What's the difference between Level 3, 4, and 5 drywall finish — and which one do I actually need?"
    a: |
      The Gypsum Association's GA-214 standard defines five finish levels. Level 3 — tape embedded, one coat over fasteners — is only appropriate under heavy spray texture. Level 4 is standard for most painted walls: tape plus two coats, edges flat and smooth. Level 5 adds a full skim coat over the entire board face and is required anywhere raking light hits a wall — recessed lighting, pendant fixtures, low-angle windows. In Maple Valley kitchen remodels with LED recessed grids or island pendants, Level 5 prevents the surface telegraphing that shows every seam and fastener dimple through paint. We follow the Level 5 skim coat with USG Tuff-Hide primer surfacer, which seals porosity differences between compound and paper face before final paint.

  - q: "How long does drywall work last, and what's covered under warranty?"
    a: |
      Drywall in a properly conditioned interior space lasts the life of the building — it's not a component that ages out on a schedule. What shortens the lifespan is moisture intrusion, structural movement, or mechanical damage. TopVolk Construction warranties workmanship — tape separation, nail pops, finish cracking — for one year after project completion. Maple Valley's extended wet season, October through May, makes vapor management critical in basements and below-grade assemblies; purple board and a proper vapor barrier address that at installation. A moisture source that develops after project completion — a new plumbing leak, foundation crack — falls outside workmanship coverage. Contractor liability insurance covers the project during active construction.

