  - q: "What post depth do you use for fences in Maple Valley's soil?"
    a: |
      Standard post depth for a 6-foot privacy fence in Maple Valley is 36 inches — deeper than the 24-inch minimum in many DIY guides, and necessary given the clay-heavy glacial soil and high seasonal moisture in the 98038 area. Corner posts and gate posts go to 42 inches because they carry the most lateral load, especially on double-drive gates with daily use. Each hole takes 60–80 lbs of fast-setting concrete; the post gets plumbed in two directions and braced before the pour. All posts cure 24–48 hours before panel or rail work begins — that window is non-negotiable on every TopVolk fence project, because it's the step most budget contractors skip.

  - q: "What warranty do you offer on fence installation in Maple Valley?"
    a: |
