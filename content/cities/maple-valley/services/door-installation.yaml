  - q: "Do I need a permit for door installation in Maple Valley?"
    a: |
      Replacing a door in the same location and same rough opening size generally doesn't require a City of Maple Valley building permit. Work that does trigger a permit: widening the rough opening, converting a window opening to a door, or any associated structural framing changes. The City of Maple Valley Building Department handles residential permits; plan review for structural residential work typically runs 2–4 weeks. TopVolk is a WA Licensed Contractor and manages the permit application and inspection coordination when the scope requires it — homeowners don't navigate the city portal on their own. If your subdivision has an HOA, check CC&Rs for exterior color and hardware finish requirements before placing a door order, since some developments near Four Corners Road enforce those rules.

  - q: "Fiberglass vs. steel entry doors — which holds up better in King County rain?"
    a: |
      Fiberglass wins for King County's climate on almost every measure. Steel door slabs corrode at the bottom rail and exposed edges after 15–20 years of PNW exposure — the persistent moisture that rolls through the Cascade foothills accelerates surface rust even on painted units. Fiberglass door slabs from Therma-Tru or Pella carry core R-values of R-5 to R-6.8 versus R-2 to R-3 for hollow-core steel, and a fiberglass surface holds stain or paint without bubbling or peeling through repeated wet seasons. Steel costs less upfront ($800–$1,500 for the unit alone), but the 10-year maintenance and replacement math typically favors fiberglass for homes in Maple Valley's income range. Solid wood exterior doors are the hardest case to make here — they require repainting or re-staining every 3–5 years and can swell enough in wet months to bind in the jamb.

  - q: "What warranty comes with a new door installation in Maple Valley?"
    a: |
      Door unit warranties vary by manufacturer: Therma-Tru covers the door slab for the lifetime of the original purchaser, the insulated glass unit for 10 years, and the factory finish for 5 years. Pella's fiberglass line carries similar terms. TopVolk's labor warranty covers workmanship for three years from project completion — the installation itself, meaning flashing integrity, threshold seating, jamb alignment, and hardware function. In Maple Valley's climate, the most common post-install issue is threshold seal compression after the first full wet season, which falls under the workmanship warranty. Manufacturer warranty claims — glass seal failure, delamination, hardware defects — go through the manufacturer's process, and TopVolk provides all purchase documentation to make that straightforward.

