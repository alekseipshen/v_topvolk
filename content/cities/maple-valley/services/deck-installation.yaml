title: "Maple Valley Deck Installation — Rain-Ready Builds in 98038"

intro: |
  Lots along SE 256th Street and the hillside properties near Lake Wilderness Park
  in 98038 sit on terrain that drains toward the creek corridors — slopes that make
  drainage planning critical before a single post goes in the ground. Cedar works for
  about two seasons before the north-facing boards start greening up. Most homeowners
  here are switching to Trex Transcend or TimberTech Terrain composite decking because
  the maintenance math on cedar doesn't add up at this rain exposure.

localContext: |
  Maple Valley's housing stock runs from early-2000s tract developments off Witte Road
  to larger custom lots near the Cedar Grove area. Homes built between 2000 and 2010
  typically have engineered rim joists that require specific lag bolt spacing when
  attaching a ledger board — different from framing into solid dimensional lumber.
  The 98038 zip has a high share of split-level and walkout-basement footprints, so
  second-story decks over a garage or lower level are the most common configuration
  we build here.

commonProblems:
  - title: "Cedar Boards Going Green — Is Composite Worth the Upfront Cost?"
    description: |
      North-facing deck surfaces in Maple Valley accumulate moss and mildew faster than
      most homeowners expect. Cedar requires annual cleaning plus re-staining every two
      to three years to stay protected. Trex Transcend or TimberTech Terrain composite
      decking costs roughly $4–8 more per linear foot upfront but eliminates that
      maintenance cycle entirely. For a 400-square-foot deck, the 10-year cost math
      usually favors composite by a wide margin.
  - title: "Post Footings Too Shallow — Frost Line and Ground-Contact Lumber Compliance"
    description: |
      King County requires deck footings to reach at least 12 inches below grade. Frost
      line depth in the Cascade foothills near Maple Valley can push that to 18 inches
      on north-facing lots. Any lumber in ground contact must be pressure-treated (PT)
      to AWPA UC4B standard — not the standard UC3B boards sold at most home centers.
      Footings poured short, or with the wrong lumber grade, rot from below and
      eventually pull the deck off the house.
  - title: "Ledger Rot — Where Decks Fail at the House Connection"
    description: |
      The ledger board — the framing member bolted to the house to carry the deck load
      — is the most common failure point on aging Maple Valley decks. Bad ledger
      flashing lets water wick behind the board into the rim joist. King County DPER
      requires a ledger flashing inspection before framing is covered. On 2000s-era
      homes with OSB sheathing, we use Vycor self-adhered flashing tape and stainless
      ledger screws to prevent galvanic corrosion between treated lumber and hardware.

