  - q: "Do I need a permit for flooring installation in Maple Valley?"
    a: |
      Like-for-like flooring replacement — carpet out, LVP in — does not require a permit from
      the City of Maple Valley. Structural subfloor repairs involving framing modifications, or
      flooring tied to a larger remodel scope such as a kitchen expansion or ADU conversion, do
      require pulling permits through the City of Maple Valley's permit center. Work on
      unincorporated King County parcels just outside city limits routes through King County
      DPER instead. Vladislav confirms the correct jurisdiction at the consultation before any
      scope is written. TopVolk, as a WA Licensed Contractor, pulls all required permits and
      handles inspection scheduling — nothing lands on the homeowner to manage.

  - q: "Should I choose engineered hardwood or solid hardwood for a slab-on-grade home in Maple Valley?"
    a: |
      Slab-on-grade construction, common in the 98042 Covington-border area, rules out solid
      3/4-inch hardwood in nearly every case. Moisture vapor emissions from concrete in this
      climate routinely run 5-8 lbs per 1,000 sf per 24 hours — well above the 3 lb maximum
      most solid hardwood manufacturers allow. Engineered hardwood with a factory-applied
      aluminum oxide finish, like Kahrs or Mirage, handles slab conditions with a proper
      moisture vapor mitigation coating applied first. If concrete RH probe readings exceed 80%
      RH at depth, a product like Bostik MVP goes down before any wood product is installed.
      A jobsite moisture test at the consultation answers the question with actual numbers,
      not a guess.

  - q: "What warranty covers the flooring TopVolk installs in Maple Valley?"
    a: |
      TopVolk provides a written workmanship warranty covering installation labor — subfloor
      prep, adhesive application, expansion gap clearance, and transition strip installation.
      Material warranties come from the manufacturer: Kahrs engineered hardwood carries a
      30-year residential warranty, COREtec Pro LVP carries a 30-year residential warranty,
      and Shaw Floorté carries a lifetime residential warranty on qualifying product lines.
      One condition applies to all wood-based flooring: interior RH must stay between 35-65%
      year-round. Maple Valley's dry August stretches can drop humidity below that threshold,
      causing gap formation — that's documented in writing before install begins so there are
      no surprises. The workmanship warranty does not cover humidity-related movement outside
      the specified range.

