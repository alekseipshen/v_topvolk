  - q: "Does Maple Valley have HOA or permit restrictions specific to ADUs?"
    a: |
      The City of Maple Valley Building Division processes ADU permits in-house, and WA HB 1337 (2024) preempts most local restrictions — Maple Valley cannot impose owner-occupancy requirements or ADU size limits that conflict with state law. HOAs are a separate matter entirely, running in parallel with city permits. Some Maple Valley neighborhoods, particularly HOA-governed communities near Lake Wilderness Park, require architectural committee approval before construction begins. Unincorporated parcels near the Covington boundary (98042) route through King County DPER instead of the city. TopVolk identifies HOA and jurisdiction requirements during the initial site visit so there are no permit-counter surprises mid-project. As a WA Licensed Contractor, Vladislav pulls permits directly and tracks all inspection milestones through the City of Maple Valley's permit portal.

  - q: "DADU or basement conversion — which ADU type works better in Maple Valley?"
    a: |
      The right choice depends on your lot, existing structure, and rental goals. A DADU delivers a fully separate unit with a private entrance, independent utilities, and typically higher rental value — but it costs more and requires more site work, plus a longer permit process. A basement conversion (AADU) is faster and cheaper if the basement has at least 7-foot ceiling height (8 feet preferred) and can fit egress windows per IRC requirements. Many 1990s Maple Valley homes have unfinished basements with 8-foot poured concrete walls — solid candidates for an AADU. Adding a Mitsubishi mini-split and a Navien tankless water heater keeps the MEP rough-in compact and avoids disrupting the main living area much. Vladislav can walk both options and sketch out rough costs on the same site visit.

  - q: "What warranty does TopVolk offer on an ADU build, and how does Maple Valley's climate affect it?"
    a: |
