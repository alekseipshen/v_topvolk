title: "Mercer Island Deck Installation — Lake Views, No Rot"

intro: |
  The homes along East Mercer Way sit within feet of Lake Washington.

  Lake humidity stacked on Seattle's 37 inches of annual rain accelerates wood decay faster than most homeowners expect. Cedar decking on a 1960s split-level here can look rough in five years without proper ledger board flashing. That's why more Mercer Island owners are specifying TimberTech or Trex composite — and why the structural attachment to the rim joist matters as much as the surface choice.

  Composite doesn't rot. Cedar does.

localContext: |
  Most of the housing stock in zip code 98040 was built between 1955 and 1980 — ranchers, split-levels, and mid-century contemporaries that step down the hillsides toward the waterfront. The North End along NE 24th Street and Island Crest Way tends to run slightly newer, 1970s–80s. The South End near SE 68th Street and the Roanoke Passage shoreline skews older — post-and-pier foundations, galvanized plumbing still common, original cedar siding on houses that haven't been touched since the Carter administration.

  Those rim joists are 50–60 years old. Before attaching any ledger board, we probe for rot, check the blocking, and sister any compromised framing. Lots near Luther Burbank Park on the northeast shore often feature post-and-pier foundations that need careful load calculations before adding a cantilevered deck above a slope. The same is true for waterfront parcels off West Mercer Way, where the grade drops sharply toward the East Channel.

  The downhill edge on a sloped Mercer Island lot can sit 10 feet off grade. That changes the structural conversation entirely — LVL beam sizing, post-to-beam connections, guardrail post embedment. None of it is off-the-shelf.

  Mercer Island runs its own building division out of City Hall on SE 36th Street — separate from King County DPER, which handles unincorporated parcels elsewhere in the county. Two different permit tracks, two different plan review timelines. The city's online portal has improved, but structural deck submittals still typically take 4–8 weeks to move through plan review. We handle the application and track it directly.

  The island's microclimate also matters. Sitting between the east and west channels of Lake Washington, north-facing surfaces accumulate moss faster than anywhere on the Eastside — composite decking with a ventilated substructure stays cleaner year to year compared to cedar, which needs stripping and sealing every 2–3 seasons just to hold its look.

commonProblems:
  - title: "Punky Rim Joists Behind Old Cedar Siding"
    description: "Many 1960s–70s Mercer Island split-levels have no proper flashing where the ledger board meets the house — water infiltrates that joint for decades unnoticed. By the time a contractor pulls the old ledger, the rim joist is soft and needs full sistering before a new ledger can be through-bolted. Every attachment point gets probed before a drill touches it."
  - title: "Post Footings That Don't Reach Frost Depth"
    description: "King County requires deck post footings at 12–18 inches below grade to reach frost line — older unpermitted decks on the island commonly heave because footings were poured too shallow. Proper depth, pressure-treated PT lumber for all ground-contact posts, and footings sized to pass structural review are not optional details here."
  - title: "Guardrails on Elevated Hillside Decks"
    description: "IRC requires guardrails at 36 inches minimum for any deck surface over 30 inches off grade. Mercer Island's sloped lots — especially those stepping down toward East Mercer Way or the Roanoke Passage shoreline — often put the downhill edge 8–12 feet up. That's a structural post and through-bolt connection, not a surface attachment. Trex and TimberTech both make code-compliant railing systems, but the post-to-rim-joist connection is where the load actually lives."

faq:
