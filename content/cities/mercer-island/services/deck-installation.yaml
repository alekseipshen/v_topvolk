title: "Mercer Island Deck Installation — Built for Lake Washington"

intro: |
  Hillside properties above Luther Burbank Park and the waterfront lots along the East Channel sit in sustained exposure to Lake Washington humidity — exactly the conditions that separate a 10-year deck from a 4-year one. Trex Transcend and TimberTech Azek handle that moisture without the cupping and moss growth you get from cedar on a north-facing 98040 lot by year three. Vladislav Volkov (WA Licensed Contractor) has built and permitted decks on Mercer Island since 2017 — 100+ projects completed across the Seattle metro.

localContext: |
  The housing stock in 98040 splits roughly between mid-century ranchers and split-levels from the 1960s and '70s — concentrated through the South End and along Island Crest Way — and newer custom builds from the 2000s forward. Those older homes often have original 2x8 or 2x10 rim joists that were never engineered for deck loads, which matters at the ledger attachment point and during the City of Mercer Island's framing inspection. Newer builds tend to use engineered LVL beam framing, but shoreline setback rules near the lake can still constrain what's buildable on a given lot.

commonProblems:
  - title: "Lake moisture accelerates cedar decay on north-facing decks"
    description: "North and west-facing lots in 98040 get direct moisture off Lake Washington from October through April. Cedar absorbs it, boards cup and split within five years, and moss colonizes the grain. Composite decking — Trex Transcend or TimberTech Azek — holds up without annual sealing and doesn't give moss an organic surface to establish on."
  - title: "Ledger attachment to 1960s rim joists fails the flashing inspection"
    description: "Many South End homes were framed with rim joists not sized for modern deck loads. Proper ledger board installation requires a specific lag bolt pattern per IRC, full ledger flashing with kick-out diverter, and a rough-in inspection before framing continues. Skip the flashing and rot forms inside the wall within ten years."
  - title: "Post footings in saturated island soil shift without reaching frost line"
    description: "Shoreline soils on Mercer Island hold water year-round. Post footings need to reach below frost depth — minimum 12 inches in Washington, often 18 inches in saturated zones near the water — and posts must be ground-contact pressure-treated (PT) lumber rated for soil contact. An undersized footing shifts during wet season and pulls joist hangers apart at the connections."

faq:
  - q: "How fast can you get to Mercer Island for Deck Installation?"
    a: "Mercer Island is 15-20 minutes via I-90 — no ferry, no complicated access. Vladislav does the site visit himself, not a salesperson. Call (206) 591-1096 to schedule a free on-site consultation, usually within a few business days."
  - q: "Do you build with Trex and TimberTech, or do you also do cedar?"
    a: "Both. Most Mercer Island clients choose Trex Transcend or TimberTech Azek given the lake exposure. Cedar is a real option for covered or sheltered decks — we walk through the long-term maintenance comparison before you decide, not after you've signed."
  - q: "What does the permit process look like for a deck in 98040?"
    a: "City of Mercer Island runs its own permit center — separate from King County DPER. Plan review for an attached deck typically runs 4-8 weeks. Expect a ledger flashing rough-in inspection, framing inspection, and final inspection before use. We handle the permit application and coordinate all three inspections. Deadline penalties are written into our contract."