    a: "Mercer Island is a straight shot off I-90 — 20–25 minutes from most active sites in Seattle or Bellevue. Residential street parking is easy. Call (206) 591-1096 to schedule a free on-site consultation with Vladislav directly."
  - q: "What decking materials do you install — cedar, Trex, or composite?"
    a: "Trex, TimberTech, and Fiberon composite are all options, plus clear cedar for clients who want natural wood. Composite holds up better against the lake-side humidity and moss growth common in 98040. The real cost and maintenance tradeoffs get covered on-site, not over the phone."
  - q: "Does building a deck on Mercer Island require a permit, and how long does it take?"
    a: "Yes — Mercer Island runs its own building division, separate from King County DPER. Decks over 30 inches off grade need a permit, ledger flashing inspection, and final inspection. Plan review typically runs 4–8 weeks. WA Licensed Contractor, 100+ projects completed since 2023 — we handle the application, and deadline commitments are written into every contract."