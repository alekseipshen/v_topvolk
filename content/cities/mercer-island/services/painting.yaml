title: "Mercer Island Painting — Cedar Shake to Cabinet Refinishing"

answer: "TopVolk Construction handles residential painting on Mercer Island, WA — exterior cedar, cabinet refinishing, EPA RRP lead compliance, WA Licensed Contractor."

intro: |
  Homes built before 1978 make up a significant share of Mercer Island's residential stock, and every scraping or sanding job on those properties requires EPA RRP lead testing before work starts — a step many painting crews skip or don't know how to document. TopVolk Construction handles painting projects across the island: exterior cedar shake and Hardie siding repaints, interior trim and wall work after kitchen and bathroom remodels, and cabinet refinishing as a cost-effective alternative to full replacement. The island's position in Lake Washington, split by the I-90 corridor, creates a microclimate where north-facing walls near Luther Burbank Park and the Roanoke Road neighborhoods accumulate mildew faster than south-facing exposures — that surface contamination has to be treated and removed before primer touches the wood, not painted over. Cedar shake on older homes in the Mercerdale area typically needs a full repaint cycle every 5-7 years; cut corners on prep or skip the back-prime coat, and you're repainting in three. Sherwin-Williams Duration and Benjamin Moore Aura both hold well on PNW cedar, but the prep work underneath determines whether either one actually lasts.

localContext: |
  Mercer Island falls entirely within zip code 98040 — one island, one ZIP, distinct from the Bellevue 98004 corridor visible across the East Channel to the east. The City of Mercer Island handles its own building permits at the city hall permit counter; a straight exterior repaint rarely triggers a permit requirement unless it's part of a larger structural remodel already under an active building permit. Lead paint compliance is the more pressing concern here: any home built before 1978 falls under the EPA RRP (Renovation, Repair and Painting) Rule, which requires a certified renovator, plastic sheeting containment during surface disturbance, and documented debris disposal. The housing stock in 98040 breaks into two distinct eras — mid-century split-levels and ranchers concentrated in the North End above Island Crest Way, built roughly 1950-1975, and larger custom builds from the 1980s through early 2000s that dominate the South End near SE 68th Street. Both eras carry specific painting complications: the older homes often have multiple layers of oil-based paint under latex topcoats, which causes adhesion failure at the surface interface if the existing finish isn't properly deglossed and primed before new paint goes on.

commonProblems:
  - title: "Cedar Shake Failing at 3-4 Years Instead of the Typical 5-7"
    description: |
      Cedar shake is the most demanding exterior substrate in the Pacific Northwest. The wood expands and contracts significantly between Mercer Island's wet winters — roughly 37 inches of annual rainfall — and the drier July-August stretch, and that movement opens microcracks in the paint film if the product lacks sufficient elasticity. On new installations, back-priming all four sides of each shake before nailing is standard practice; on a repaint, priming all bare and weathered wood faces before topcoats is the equivalent critical step. Sherwin-Williams Duration Exterior in a satin sheen handles PNW expansion cycles better than standard acrylic formulations, and the satin finish sheds moisture from horizontal shake edges rather than trapping it. Two full topcoats over primer — not one thick coat — is the correct application sequence regardless of brand. Budget $4,500-$9,000 for a full cedar shake exterior repaint on a 1,800-2,400 sq ft Mercer Island home, depending on story count, the condition of the existing paint, and staging requirements on sloped lots.

  - title: "Pre-1978 Lead Paint — EPA RRP Compliance Before Any Sanding Starts"
    description: |
      Mercer Island's North End carries a concentration of homes built between 1945 and 1975 — split-levels and ranchers that have often never had a professional lead paint assessment done. Under the EPA RRP Rule, any contractor disturbing more than six square feet of painted interior surface or 20 square feet of exterior surface in a pre-1978 home must be a certified renovator, use containment sheeting, and document the disposal of all paint chip and dust debris. XRF testing or a certified lead swab test is the standard verification method before a repaint project scopes out. Non-compliant work starts at EPA fines of $37,500 per day per violation — the liability attaches to the contractor, but homeowners who knowingly hire an uncertified crew carry their own exposure. TopVolk handles the full RRP documentation workflow on pre-1978 homes as part of the project scope, not as an add-on. Properly set-up RRP containment and teardown typically adds 1-2 days to the overall project timeline.

  - title: "Interior Trim and Wall Repaint After a Kitchen or Bathroom Remodel"
    description: |
      A kitchen remodel that replaces cabinets always exposes wall and trim sections that were hidden behind the original cabinetry — raw drywall patches, mismatched priming, or surfaces that haven't seen paint in decades. New drywall areas from electrical rough-in or plumbing rough-in work need a high-hide primer like Zinsser Bulls Eye 1-2-3 before any finish coat goes on; skip the primer and the sheen difference between patched and original drywall reads clearly under raking light from South End windows. The City of Mercer Island doesn't require a separate painting permit for interior repaint work, but if painting is part of a permitted remodel, finished surfaces need to be complete before the final inspection sign-off. Matching existing paint color accurately takes more than a chip at the paint counter — UV exposure and cleaning cycles shift the original finish over time, so accurate matching typically requires multiple test samples dried on the actual wall surface. Budget 2-5 days of labor for a full kitchen repaint including trim, ceiling, and walls on a typical 98040 home.

  - title: "Cabinet Repainting vs. Full Replacement — What Makes Financial Sense"
    description: |
      Full cabinet replacement on a Mercer Island kitchen runs $20,000-$60,000 once semi-custom boxes, new hardware, and installation are factored in. Cabinet repainting — done with the right process — runs $2,500-$5,500 for a standard 10x12 kitchen and delivers a credible finish when the cabinet boxes are structurally sound and door faces are flat or minimally profiled. Process is what separates a lasting result from a peeling one: liquid degloss across all surfaces, light sanding of door faces, a shellac-based primer (Zinsser BIN bonds to oil, latex, or any previous finish without adhesion problems), and two coats of Benjamin Moore Advance in semi-gloss. That system holds up to daily use for 7-10 years with normal care. One firm caveat: thermofoil cabinet faces don't repaint — the vinyl film lifts from heat and steam cycles, and edge adhesion fails within a year. Solid wood, recessed-panel wood, and MDF flat-front doors are the best candidates. Total timeline runs 4-7 days including mandatory dry time between coats.

  - title: "Bathroom and Laundry Room Paint Peeling from Steam and Condensation"
    description: |
      Standard flat or eggshell latex fails on bathroom walls within 18-24 months in high-use master baths — especially the larger walk-in shower configurations common in Mercer Island's South End custom builds, where steam exposure is heavy and windows stay closed from October through April. The paint film softens, loses adhesion at seams, and starts peeling at the ceiling line first before working downward toward the tile backer. The fix isn't more coats of the same product — it's the right product category. Zinsser Perma-White Mold and Mildew-Proof Interior Paint is formulated specifically for steam environments and maintains adhesion where standard latex fails after repeated wet cycles. For laundry rooms with front-load washer condensation migrating to adjacent walls, add a vapor barrier primer under the topcoat. Prep is non-negotiable: strip all failing paint back to the substrate, apply mold-inhibiting primer, then two coats of semi-gloss or satin. Topcoating over peeling paint in a wet environment extends the problem by one season at most. Typical bathroom repaint runs $600-$1,500 depending on square footage and how much surface preparation the existing condition requires.

