  - q: "What does flooring installation cost per square foot on Mercer Island?"
    a: |
      LVP installation with underlayment runs roughly $6-$9 per square foot installed on Mercer Island, materials and labor included. Solid hardwood strip in a standard layout is $10-$16 per square foot; engineered hardwood lands in the $12-$18 range depending on species and wear layer thickness. Large-format porcelain tile — 24x24 or 24x48 format — runs $14-$22 per square foot installed because of the additional subfloor leveling and mortar setting time. Those numbers assume a clean, structurally sound subfloor in good condition. Moisture remediation, VAT abatement, or subfloor replacement adds cost that gets priced per job after the on-site inspection. TopVolk provides a written line-item quote after every site visit — no vague ranges on the contract, no surprises mid-project. Call (206) 591-1096 to set up a free estimate.

  - q: "Does flooring installation on Mercer Island require a permit from the city?"
    a: |
      Straight flooring replacement — hardwood, LVP, or tile — typically does not require a permit from the City of Mercer Island Building Department. The permit requirement kicks in when flooring work connects to a larger remodel scope: structural subfloor replacement, adding in-floor radiant heat, or a kitchen or bath remodel that triggers a full building permit review. Mercer Island runs its own permit center, separate from Seattle SDCI or King County DPER, with its own plan review queue. Simple permits can sometimes be processed over the counter; larger connected scopes take 4-8 weeks for plan review. TopVolk Construction is a WA Licensed Contractor and handles permit applications and inspection scheduling for any project where a permit is required. Call (206) 591-1096 to talk through your specific scope.

  - q: "Can you install hardwood over radiant heat in a Mercer Island home?"
    a: |
      Solid 3/4-inch hardwood and radiant heat are a difficult pairing — radiant systems push subfloor surface temperatures to 80-85°F, and solid wood expands and contracts significantly at those temps. Engineered hardwood handles radiant applications much more reliably because the cross-ply plywood core is dimensionally stable. Kahrs manufactures several lines specifically rated for radiant heat; the installation protocol requires running the system at operating temperature for 72 hours before laying any material, then acclimating the engineered hardwood in the space with the heat on. Shaw COREtec LVP is another strong option — most products in that line are tested to 85°F surface temperature. Vladislav walks through radiant-compatible product selection during the free on-site consultation and confirms the subfloor temperature profile before specifying material.

  - q: "How long will new flooring last on Mercer Island, and what warranty comes with the work?"
    a: |
      In the PNW climate, moisture management at installation determines longevity more than any brand choice. Engineered hardwood installed over a properly prepped subfloor with correct acclimation typically lasts 30-40 years on Mercer Island. Kahrs offers a 25-year residential warranty on most engineered lines; Shaw COREtec LVP warranties range from 15 years to lifetime residential depending on product tier. Large-format porcelain tile is effectively indefinite if the substrate remains stable. TopVolk's installation workmanship is warranted for one year against defects. The most common post-installation issue is minor gap formation at perimeter transitions during dry summers — easily addressed during an annual walkthrough. Solid hardwood with proper care and periodic refinishing can outlast the house itself.

