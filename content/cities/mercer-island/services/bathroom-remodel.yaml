title: "Mercer Island Bathroom Remodel — Mid-Century Homes, Rebuilt Right"

intro: |
  Mid-century ranchers along East Mercer Way look solid from the street. The bathrooms inside tell a different story. Homes in 98040 built between 1958 and 1975 usually have galvanized drain lines, no waterproofing behind the original tile, and fixtures spec'd for a different decade.

  Pacific Northwest humidity does slow damage — 37-plus inches of rain a year, and crawlspace moisture migrating up through the floor. Pull out a cracked tub surround near Luther Burbank Park and you often find black mold and rotted blocking. Schluter Kerdi membrane behind large-format porcelain fixes what decades of damp have done. And keeps it from happening again.

localContext: |
  Mercer Island's residential core mostly went up between 1955 and 1980. The North End — properties clustered off Island Crest Way north of SE 40th Street — tends to be the oldest stock, with post-and-pier crawlspace foundations and original cast-iron plumbing. Split-levels and ranchers on steep lots dominate the East Mercer Way corridor and the hillside streets dropping toward Lake Washington. The South End pushed development into the late 1960s and 70s, adding aluminum-wired builds and slab-on-grade sections that complicate bathroom scope when radiant heat is involved.

  Those crawlspaces collect moisture from October through May and push it upward. West-facing lots near Mercerdale Park and the Town Center area get partial shelter from the ridge, but north-facing bathroom walls anywhere on the island grow moss on exterior cladding and trap humidity inside.

  Bathrooms in 98040 frequently show subfloor rot at the tub perimeter and exhaust fans ducted into attic space instead of outside. That second one is a code violation. In this climate, it compounds mold risk every single year it goes unfixed. Add deteriorated caulk around cast-iron surrounds and you've got a scope that goes well beyond a tile refresh.

  Permits run through the City of Mercer Island Building Division — not King County DPER, since Mercer Island is an incorporated city with its own permit center. Plan review on a full bath remodel typically takes 4-6 weeks. Scheduling a consultation early means construction can begin the week permits clear.

commonProblems:
  - title: "No waterproofing membrane behind original 1960s-70s tile"
    description: "Builders set tile directly over green drywall or cement board with no waterproofing layer. That was standard in the era. Forty years later, moisture has been wicking behind the field tile on most unremodeled walls in 98040. Pull a cracked tub surround and you often find black mold and rotted blocking. That means full subfloor replacement before any finish work can begin — not just a re-tile."

  - title: "Galvanized drain stack corrosion slowing drainage in split-level floor plans"
    description: "Cast-iron and galvanized steel drain lines from 1960s builds corrode from the inside out. Slow drains in the master bath aren't always a clog. Often the pipe has scaled down to half its original diameter. When walls and floors are already open for a full remodel, rerouting to PVC during rough-in is the right call — costs a fraction of what it would to do it separately later."

  - title: "Undersized exhaust ventilation causing mold regrowth after new tile"
    description: "A 50 CFM bath fan running through 14 feet of flex duct with two elbows vents almost nothing. Fresh grout and new caulk show surface mold within a year in Mercer Island's damp climate. Every bathroom scope in 98040 includes swapping to a Panasonic WhisperCeiling or Broan unit rated 110 CFM minimum, with a direct exterior exhaust run — no attic duct loops. Call (206) 591-1096 to schedule a free walkthrough and we'll check your existing vent path before demo begins."

