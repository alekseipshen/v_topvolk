title: "Mercer Island Bathroom Remodel — From 1960s Ranch to Modern"

intro: |
  Lake Washington wraps around every address in 98040, and the housing here reflects four decades of Pacific Northwest residential construction. Split-level ranchers from the 1960s, updated Colonials from the 1980s, and custom builds near Luther Burbank Park — many still running original Moen single-handle shower valves and tile set directly over greenboard with no waterproofing layer underneath. That's what turns up during demo. TopVolk has completed bathroom remodels across Mercer Island since 2017. Vladislav Volkov handles every project personally — no sales staff, no handoffs.

localContext: |
  Most of the island's mid-century housing — split-levels and single-story ranchers on the interior streets — went up between 1958 and 1978. Galvanized supply lines, cast-iron drain stacks, 4x4 ceramic tile over untreated drywall. Zip code 98040 covers the entire island; newer custom builds cluster toward the north end and along the east shore, but even those homes often have builder-grade secondary baths untouched since construction. PNW humidity works on all of them the same way.

commonProblems:
  - title: "Corroded galvanized supply lines and cast-iron drain stacks"
    description: |
      Homes in 98040 built during the 1960s and 1970s typically run galvanized steel supply lines that narrow from mineral deposits over decades and cast-iron drain stacks that pit from internal rust. Rerouting to copper or PEX during bathroom demo is far cheaper than returning later. Rough-in inspection with the City of Mercer Island building department confirms the new work before walls close.
  - title: "Rotted substrate from decades of shower steam — no waterproofing membrane"
    description: |
      Standard greenboard drywall backed most 1980s and 1990s tile work across the island — no Schluter Kerdi, no RedGard membrane. Seattle averages 37 inches of annual rainfall, and daily shower steam adds to that. After two or three decades, the backer board fails, framing rots, and subfloor takes damage. It's a consistent finding on demo day in this housing stock.
  - title: "Master bath footprint locked around a soaking tub nobody fills anymore"
    description: |
      Custom builds on Mercer Island from 1990 to 2008 frequently feature oversized soaking tubs — sometimes Kohler or American Standard freestanding units — used maybe twice a year. Converting that footprint to a curbless walk-in shower with a linear drain requires relocating the rough-in drain point and sometimes shifting a non-load-bearing partition wall. Adds scope, but produces a bath that actually gets used.

faq:
  - q: "How fast can you get to Mercer Island for Bathroom Remodel?"
    a: |
      Mercer Island is 15-20 minutes from central Seattle via I-90 — straightforward drive, no ferry involved. Vladislav takes every initial consultation in person. Call (206) 591-1096 to schedule a free on-site walkthrough. WA Licensed Contractor, 100+ projects completed since 2017.
  - q: "What fixture brands do you work with for Mercer Island bathroom remodels?"
    a: |
      Hansgrohe and Kohler are the most common specs in 98040. Some clients choose Moen for secondary baths, others bring in Brizo or Rohl for primary suites. Vladislav coordinates directly with the supply house — no markup surprises. Bring your fixture spec sheet to the consultation and we'll rough-in accordingly.
  - q: "What does the permit process look like and how long will the project take?"
    a: |
      Permits go through Mercer Island's own city building department — not King County DPER, which handles unincorporated areas only. Plan review for a bathroom remodel runs approximately 3-5 weeks. Construction: 5-7 weeks for a full gut-and-rebuild, 3-4 weeks if the layout stays put. Vladislav puts the completion date in writing — if TopVolk misses it, the penalty comes out of the final invoice.