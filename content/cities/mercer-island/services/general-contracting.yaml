title: "Mercer Island General Contractor — Remodels, Permits, Real Results"

intro: |
  Homes along the Luther Burbank waterfront corridor and up through Mercerdale were built fast
  between 1962 and 1982 — and they're showing it now. Homeowners are gut-renovating kitchens
  to spec in Wolf ranges and Sub-Zero columns, only to hit original framing that doesn't line
  up with today's cabinet depths or ventilation requirements. TopVolk Construction LLC handles
  everything from permit application through blue tape walkthrough — WA Licensed Contractor,
  100+ projects completed since 2023, with Vladislav Volkov as your direct contact from day one.

localContext: |
  Zip 98040 covers the entire island, and the housing mix runs from postwar ramblers on wooded
  lots near the south end to 1970s split-levels off Island Crest Way and newer custom builds
  closer to Town Center. The City of Mercer Island runs its own building department — plan review
  here is separate from King County DPER and Seattle SDCI. For structural work or additions, expect
  a 6-10 week plan review cycle. Older homes often sit on post-and-pier foundations with crawlspaces
  that need a vapor barrier upgrade before any addition work breaks ground.

commonProblems:
  - title: "Mercer Island's Own Permit Center Catches People Off Guard"
    description: "Most homeowners assume major remodels fall under King County DPER or Seattle SDCI — they don't. The City of Mercer Island processes its own permits, with specific intake requirements for structural alterations, FAR calculations on smaller lakeside lots, and setback verification before anything gets stamped. A missing dimension on your site plan triggers a resubmit cycle that adds 3-6 weeks. Pulling the permit correctly the first time isn't optional on a $150K+ project."
  - title: "1960s–70s Framing Doesn't Cooperate With Modern Remodels"
    description: "Split-levels and ramblers from the Island Crest Way area routinely have undersized headers over openings — code-compliant in 1970, not today. The moment you open a wall to relocate a doorway or extend a kitchen, the AHJ requires a properly engineered replacement. Installing an LVL beam or PSL post mid-project after the dumpster is already on-site adds unplanned cost. A pre-demo structural walk catches these before they become surprises."
  - title: "Multi-Trade Scheduling Falls Apart Without a Single GC Holding the Calendar"
    description: "High-end kitchen remodels with Thermador or Miele panel-ready appliances need MEP rough-in sequenced correctly before cabinets arrive — specific cavity dimensions, dedicated circuits, and hood CFM specs have to be locked in at the framing stage. When homeowners manage their own subs, one trade running late cascades into a three-week gap. Vladislav coordinates the framing, electrical, plumbing, and HVAC rough-ins as a single schedule, not four separate phone trees."

faq:
  - q: "How fast can you get to Mercer Island for a General Contracting consultation?"
    a: "I-90 connects directly to the island — 20 minutes from Seattle, 15 from Bellevue. Vladislav comes to the site himself, not a salesperson. Call (206) 591-1096 to schedule a free on-site walkthrough. No commitment required."
  - q: "Do you manage high-end kitchen remodels with Sub-Zero, Wolf, or Thermador appliances?"
    a: "Yes, and the appliance selection drives the rough-in plan. Sub-Zero column refrigerators and Wolf dual-fuel ranges have specific utility and dimensional requirements that have to be framed for before cabinets are ordered. We coordinate those specs with the MEP trades early — not as a correction after the fact."
  - q: "What does a whole-house renovation cost on Mercer Island, and how does contracting work here?"
    a: "Most full remodels we complete in 98040 run $150K–$250K depending on scope and finish level. You get a line-item quote, not a vague range. Mercer Island Building Department plan review typically adds 6-10 weeks before construction starts — that's built into the schedule. Deadlines are written into the contract with penalty clauses. Call (206) 591-1096 for a quote from an actual contractor."