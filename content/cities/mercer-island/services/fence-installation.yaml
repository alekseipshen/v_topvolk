title: "Mercer Island Fence Installation — Cedar & Vinyl for 98040"

answer: "TopVolk Construction installs cedar, vinyl, and horizontal slat fences in Mercer Island, WA — WA Licensed Contractor, 100+ projects completed, free estimate."

intro: |
  Privacy fencing on Mercer Island's hillside lots is a different project than a flat suburban
  install — grade changes of 3 to 6 feet across a typical 98040 property demand deeper post
  footings, careful drainage planning, and a clear picture of the moisture load coming off Lake
  Washington through the long October-to-May rain season. TopVolk Construction LLC, owner-operated
  by Vladislav Volkov, handles fence installation on Mercer Island directly: survey review, City of
  Mercer Island permit application, post setting, and finish work — no sales staff, no handoffs.
  Luther Burbank Park-area properties on the east slope are seeing the most demand for horizontal
  cedar slat fences, the modern PNW style that has become the standard in high-income neighborhoods
  from Mercerdale to the Island Crest corridor. Western Red Cedar is the traditional choice, but on
  Mercer Island's north and west exposures where wood rarely dries between November and April, vinyl
  PVC fence is the more practical call — and Trex composite capped posts offer cedar aesthetics with
  significantly lower long-term maintenance. Call (206) 591-1096 to schedule a free on-site
  consultation with Vladislav, not a commissioned closer.

localContext: |
  Sitting entirely within the 98040 zip code, Mercer Island is a single-jurisdiction island city of
  roughly 25,000 residents surrounded by Lake Washington, accessible via I-90 across the Homer M.
  Hadley and Lacey V. Murrow Memorial Bridges. The housing stock splits into two main eras:
  mid-century ranchers and split-levels built between 1955 and 1975, concentrated along Island Crest
  Way and the west-side slopes, and larger custom homes built through the 1980s and 2000s on hillside
  lots with significant grade in East Mercer. The older rancher-era fences — cedar board-on-board
  installed in the 1980s and 1990s — were typically built with 4x4 posts set only 18 to 24 inches
  deep in clay-heavy soil, undersized for the lake-adjacent saturation that keeps ground moisture
  elevated from October through May. Retaining wall combinations on sloped properties trigger a City
  of Mercer Island Development Services building permit for any fence over 4 feet attached to a wall,
  and front-yard fences above 4 feet also require plan review. Shared property lines along the denser
  residential blocks near SE 40th Street and 77th Ave SE frequently require survey verification before
  any post is set — a step that gets skipped on DIY installs and surfaces as a title problem during
  real estate transactions.

commonProblems:
  - title: "Rotted posts and undersized footings on Island Crest-era cedar fences"
    description: |
      Cedar fences installed on Mercer Island's mid-century ranch properties in the 1980s and 1990s
      were typically built with 4x4 posts set 18 to 24 inches deep — adequate for dry climates, not
      for the clay-heavy, lake-adjacent soil in 98040 that holds moisture through six-plus months of
      rain. The post base sits in near-saturated ground for most of the year; end-grain rot starts at
      the concrete collar within 8 to 10 years, and the fence begins leaning within 12 to 15 years as
      clay shifts seasonally. The fix is pulling rotted posts entirely and resetting 4x4 or 6x6
      pressure-treated (PT) lumber posts at 30 to 36 inches deep in concrete tube forms, with a
      gravel drainage layer below the footing. On a typical Mercer Island lot with 150 to 180 linear
      feet of fence, full post replacement runs $3,500 to $6,500 depending on post count and whether
      rails need sister-post reinforcement alongside the original set — not just cosmetic repair.

  - title: "Cedar weathering and moss on north-facing and shaded fence runs"
    description: |
      Mercer Island's west-slope properties — particularly between Mercerdale Park and the I-90
      corridor — have fence runs that face north or sit under Douglas-fir canopy and see almost no
      direct sun from October through April. Western Red Cedar in those exposures develops moss,
      mildew, and surface checking within two to three seasons without a penetrating oil stain applied
      every 18 to 24 months. CertainTeed Bufftech vinyl fence eliminates that maintenance cycle
      entirely, holds color for 20-plus years, and genuinely outperforms cedar on perpetually shaded
      runs. The tradeoff is visual: vinyl boards flex noticeably between posts on spans over 6 feet
      and don't hold the visual weight of cedar on horizontal slat designs. For shaded runs in
      standard shadowbox style, vinyl is the straight recommendation. For horizontal slat on a shaded
      exposure, using cedar with a factory-applied stain and committing to a reapplication schedule
      every two years preserves the look without fighting a losing battle against the climate.

  - title: "Horizontal slat fence post spacing and City of Mercer Island permit requirements"
    description: |
      Horizontal cedar slat fences — typically 1x6 boards running lengthwise with a 1/4-inch reveal
      gap — don't contribute to racking resistance the way vertical-board shadowbox construction does.
      That structural difference means posts need to be set every 6 feet maximum (not the 8-foot
      spacing that works on traditional vertical fences) and should be 4x4 or 6x6 PT lumber at 30 to
      36 inches deep in concrete. For fences over 6 feet tall, or any fence combined with a retaining
      wall over 4 feet, the City of Mercer Island Development Services requires a building permit and
      plan review — currently running 2 to 4 weeks for residential fence permits. TopVolk Construction
      LLC, as a WA Licensed Contractor, handles permit applications, site plans, and coordination with
      the city's plan review staff. Homeowners who submit permit applications without a licensed
      contractor on a design-sensitive horizontal slat install typically receive a revision request on
      the first submittal, adding another 2 to 3 weeks to the timeline before a single post is set.

  - title: "What fence installation actually costs on Mercer Island"
    description: |
      A standard cedar board-on-board fence — 6 feet tall, 150 linear feet, 6x6 PT posts at 8-foot
      spacing set 30 inches deep in concrete — runs $18 to $28 per linear foot installed on Mercer
      Island, or $2,700 to $4,200 for that run. Horizontal cedar slat with tighter 6-foot post
      spacing and higher board count costs $30 to $46 per linear foot, putting a 150-foot run at
      $4,500 to $6,900. CertainTeed Bufftech vinyl fence in a comparable board-on-board style sits in
      the middle at $24 to $38 per linear foot. Gate hardware adds $400 to $900 per gate — self-
      closing hinges and a keyed latch for a street-facing gate versus a basic strap hinge and barrel
      bolt is a $300 difference per opening that shows up immediately in daily performance. Every
      TopVolk quote is line-itemized with separate costs for materials, labor, hardware, and permit
      fees — not a vague range. Call (206) 591-1096 for a free on-site estimate with exact pricing on
      your Mercer Island project.

  - title: "Gate post lean and hardware failure on high-use residential gates"
    description: |
      A backyard or driveway gate on a Mercer Island property cycles 700-plus times per year. The
      hinge-side post carries the cantilever load every time the gate swings, and posts originally set
      at 24 inches deep in saturated clay start leaning inward within 3 to 5 years. Once the post
      leans, the gate drags; the self-closing spring loses calibration, and the latch stops catching —
      usually in that sequence over 12 to 18 months. Adjusting the hinges doesn't fix a leaning post.
      The repair is resetting the hinge post at 36 inches with a 6x6 PT timber or a PSL post for
      gates wider than 5 feet. D&D Technologies TruClose heavy-duty self-closing hinges are the right
      hardware for residential wood gates used daily — re-tensionable without removing the gate and
      backed by a 10-year warranty. Budget $650 to $1,200 to rebuild a failing gate correctly: reset
      post, new hardware, and a keyed latch with Adjust-A-Gate frame if the gate itself has racked.

