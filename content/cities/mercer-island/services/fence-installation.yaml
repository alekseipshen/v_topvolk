  - q: "Does fence installation on Mercer Island require a building permit?"
    a: |
      Most standard residential fences under 6 feet tall on Mercer Island don't require a permit. The
      City of Mercer Island Development Services does require one for fences over 6 feet, any fence
      attached to a retaining wall over 4 feet in height, and fences within shoreline or steep-slope
      setback zones — both of which appear regularly on Mercer Island's hillside and waterfront lots.
      Front-yard fence height is capped at 4 feet without a variance review. TopVolk Construction LLC,
      as a WA Licensed Contractor, handles permit applications, site plans, and city coordination on
      every permitted project. Residential fence permit review at the City of Mercer Island currently
      runs 2 to 4 weeks. Projects are sequenced so material ordering and site prep happen during plan
      review, minimizing dead time in the overall schedule.

  - q: "Should I use cedar or vinyl for a fence on Mercer Island?"
    a: |
      Exposure is the deciding factor. Western Red Cedar on a south or east-facing run, properly
      stained every 18 to 24 months, lasts 20 to 25 years and looks significantly better than vinyl
      on horizontal slat designs — the grain and shadow lines read better in natural wood. Cedar on a
      north-facing or fully shaded run, which is common on the west-slope properties between Mercerdale
      Park and the I-90 lid, collects moisture, grows moss, and checks within a few seasons without
      consistent annual maintenance. CertainTeed Bufftech vinyl PVC fence on those exposures is a
      genuinely better long-term choice: no staining, no moss cycle, and manufacturer warranties
      typically run 20-plus years against cracking and fading. Vladislav will give you a straight
      recommendation based on the actual exposure and slope of your specific lot — not a pitch for
      whichever product carries the higher margin.

  - q: "What warranty does TopVolk provide on fence installation on Mercer Island?"
    a: |
      Workmanship — post setting depth, concrete footing placement, rail attachment, and hardware
      installation — is warranted for 3 years. If a post set by TopVolk shifts, leans, or heaves due
      to an installation error within that period, it gets reset at no cost. Western Red Cedar is a
      natural material and isn't warrantied against weathering, checking, or color change; that's
      managed through stain maintenance, not installation guarantees. CertainTeed Bufftech vinyl fence
      panels carry a manufacturer's limited lifetime warranty against cracking, splitting, and fading.
      D&D Technologies TruClose hinges carry a 10-year warranty on the hinge mechanism. Worth noting:
      the deadline penalty clause written into every TopVolk contract applies to fence projects the
      same as it does to full remodels — if the agreed completion date is missed, there's a financial
      penalty paid by TopVolk, not an apology email.

