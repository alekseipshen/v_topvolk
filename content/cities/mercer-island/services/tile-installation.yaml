  - q: "How much does tile installation cost in Mercer Island?"
    a: "Bathroom tile installation in Mercer Island typically runs $3,500–$12,000 for most scopes — a standard 36×60 shower rebuild with porcelain and Schluter Kerdi waterproofing sits mid-range, while a full master bath with Ditra-Heat, 24×48 large-format porcelain, a curbless shower, and natural stone accents can reach $10,000–$18,000 or more with materials. Kitchen backsplash installation runs $800–$3,500 depending on material and linear footage. Main cost drivers: tile selection, substrate prep required, heated floor systems, custom cuts around fixtures, and niche framing. Written line-item quotes only — no vague ranges. Call (206) 591-1096 for a free on-site estimate."

  - q: "Does tile installation require a permit from the City of Mercer Island?"
    a: "Standard interior tile replacement — shower walls and floor, bathroom floor, kitchen backsplash — typically does not require a permit from the City of Mercer Island unless plumbing rough-in locations are changing or structural framing is being modified. Heated floor systems (Schluter Ditra-Heat, Warmup) require a City of Mercer Island electrical permit; rough-in inspection for residential electrical work typically clears in 1–2 weeks. Shower remodels that involve relocating a floor drain require a plumbing permit as well. TopVolk Construction LLC is a WA Licensed Contractor and handles permit applications as part of the project — homeowners don't manage that step separately."

  - q: "What waterproofing system do you use for tiled showers, and why not RedGard?"
    a: "Schluter Kerdi sheet membrane is the standard on all TopVolk shower builds. Kerdi bonds to the substrate with unmodified thinset and creates a waterproof plane behind the tile — the grout joints are not doing the waterproofing, Kerdi is. That separation matters in Mercer Island's climate, where interior bathroom humidity runs high from October through May without much of a dry-out period. RedGard liquid membrane is a legitimate option for flat floor applications, but getting consistent coverage on vertical surfaces and inside corners without multiple inspected coats is difficult to verify after tile is set. Kerdi corners and seams are sealed with Kerdi-Band for a positive mechanical connection, and the system carries a Schluter warranty when installed with compatible thinset and grout."

  - q: "How long does tile last in the Pacific Northwest, and what's the workmanship warranty?"
    a: "Tile installed over a properly waterproofed and structurally adequate substrate should last 20–30 years or longer. Grout joints in wet areas benefit from re-sealing every 1–3 years; caulk at inside corners and floor-wall transitions needs inspection annually and replacement every 3–5 years as it ages and loses adhesion. In Mercer Island's climate — extended wet season, high interior humidity — waterproofing integrity is the main longevity factor, not the tile material itself. TopVolk backs workmanship for one year: cracked grout or loosened tile due to installation issues gets fixed at no charge. Missed completion deadlines are covered too — penalty terms are written into the contract."

