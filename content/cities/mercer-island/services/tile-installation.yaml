    a: "Mercer Island sits at the center of our King County work area. Bellevue, Kirkland, Renton, Issaquah, and Seattle are all within 30 minutes via I-90 or SR-520. We also take on tile work in Snohomish, Pierce, and Kitsap counties for larger remodeling projects. Scheduling for Mercer Island tile projects typically runs 2–4 weeks out from the consultation date — spring and summer book faster than fall. Every project starts with a free on-site visit: Vladislav looks at the substrate, reviews the scope, and delivers a written line-item quote before any work begins. Call (206) 591-1096 to get on the schedule."