localContext: |
  Mercer Island's entire city falls within a single zip code — 98040 — but the housing inside that zip covers five decades of construction. The North End holds the island's densest concentration of mid-century split-levels and ranchers built between 1958 and 1975. Original single-pane windows (many Milgard predecessors), galvanized supply lines, and undersized electrical panels are standard finds in those homes. Toward the South End and along the waterfront near Luther Burbank Park, homes built in the 1990s and 2000s already have Wolf or Sub-Zero appliances in place, and the owners want touchup work executed at that same standard. Permit thresholds for handyman-scale repairs on Mercer Island fall under the city's own building department — not King County DPER, since Mercer Island is incorporated. Most fixture swaps, weatherstripping installs, and patch-and-paint jobs stay below the permit trigger. The island's north-facing exposures accumulate heavy moss and mildew from October through April, which accelerates cedar trim decay and deck surface deterioration faster than most homeowners realize until the damage is already deep.

commonProblems:
  - title: "Punch List Backlog After a Kitchen or Bathroom Remodel"
    description: |
      Remodels in Mercer Island's South End regularly close out construction-complete but not move-in-complete. The GC wraps up, and the homeowner is left holding cabinet hardware still in a box, a bathroom niche with a cracked grout joint at the Schluter transition strip, two interior doors that drag on the threshold, and a back-ordered light fixture that arrived three weeks post-completion. Each item is small. Collectively they add up to two full workdays for someone who actually knows the trades. A blue tape walkthrough — room by room, item by item — takes about an hour before work starts and keeps the scope from expanding unpredictably mid-job. Punch list visits on Mercer Island typically run $450–$950 depending on item count and whether any items require material procurement. Vladislav handles the walkthrough and the work himself — no hand-off to a sub you've never met.

  - title: "Drywall Patches That Won't Match the Existing Wall Texture"
    description: |
      Texture matching is where most handyman repairs fail visibly. Cutting out a damaged section, setting a California patch or a backer board, and running the tape-mud-sand sequence is straightforward. Matching the texture is the part that trips people up. North End homes built in the 1960s commonly have hand-applied skip trowel or knockdown texture that was never consistent in the first place — no spray pattern replicates it cleanly. Vladislav test-patches on scrap board first, adjusts mud consistency, and feathers the final coat wide so the blend disappears under paint rather than creating a visible halo. Material cost for a typical repair runs $50–$80 in joint compound, mesh tape, and primer. Total cost for a patch-and-blend usually lands in the $275–$550 range, depending on wall area and how many texture coats the blend requires.

  - title: "Smart Thermostat and Doorbell Camera Installs With Hidden Compatibility Issues"
    description: |
      Newer Mercer Island waterfront homes often run multi-zone HVAC systems or proprietary controls that don't pair with a Nest or Ecobee straight out of the box. The C-wire situation needs checking first — homes built before 1985 frequently lack one, and both Nest and Ecobee require it for stable power without a battery workaround that causes intermittent disconnects. Running a new C-wire from the air handler adds 30-60 minutes to the install. Doorbell cameras like the Ring Video Doorbell Pro 2 require a transformer rated at 16V/30VA minimum; many older Mercer Island homes still have the original 8V or 10V unit, which causes random offline behavior after install. Transformer replacement runs about $25 in parts. Full smart thermostat and doorbell install — including compatibility verification and any low-voltage wiring corrections — typically lands between $200 and $380. No permit is required for low-voltage device swaps in Mercer Island.

  - title: "Rotted Deck Boards and Compromised Post Bases on Lake-Exposed Decks"
    description: |
      Decks in Mercer Island's waterfront neighborhoods take moisture from two directions — rain off Lake Washington running October through April, and ground-level humidity that migrates up through the framing when ventilation is inadequate. Untreated cedar surface boards installed without proper end-grain sealing typically last eight to twelve years before checking, splitting, and rotting out at the ledger board connections. Replacing individual boards with Trex Transcend composite or TimberTech AZEK eliminates the rot cycle entirely and cuts annual maintenance down to an occasional wash. The railing post bases are worth inspecting at the same time: posts set directly in concrete without a standoff base connector have almost always absorbed moisture into the end grain, compromising structural integrity in ways that aren't visible until you push on the railing. Deck board replacement on Mercer Island runs $18–$32 per linear foot installed, depending on material selection.

  - title: "Drafty Doors, Failed Weatherstripping, and Rotted Exterior Trim"
    description: |
      Door weatherstripping on mid-century Mercer Island homes fails on a predictable cycle. The foam-backed adhesive tape used in builder-grade installs compresses and loses its profile within five to eight years — faster on north-facing entries that stay damp well into spring. Replacing it with a Pemko 303 series compression weatherstrip on the door stop and a quality door sweep on the threshold makes a measurable difference, especially on the island's windward elevations. Exterior trim is a bigger repair: cedar trim painted without back-priming absorbs moisture from behind, blisters, and rots from the inside out long before the face shows damage. The fix is removing the rotted section, cutting in new cellular PVC trim like Versatex or Kleer, priming all six sides before install, and sealing the joints with paintable siliconized latex caulk. Exterior trim repairs on a typical Mercer Island home run $350–$750 per elevation, materials included.

