  - q: "Do I need a permit for handyman repairs on Mercer Island?"
    a: |
      Most standard handyman repairs on Mercer Island — fixture replacements, weatherstripping, drywall patches, deck board swaps — fall below the permit threshold under the City of Mercer Island's building code. Permit requirements kick in when work involves modifying the electrical panel, altering structural elements, or adding habitable square footage. Some South End neighborhoods with active HOAs may require architectural committee approval for exterior changes like trim replacement or paint color — typically a one-page submittal, not a lengthy review process. TopVolk Construction LLC is a WA Licensed Contractor, so if the scope does cross into permit territory, the filing goes through Mercer Island's permit portal with proper documentation prepared from the start rather than as an afterthought.

  - q: "Can you install a Nest or Ecobee if my home has a multi-zone HVAC system?"
    a: |
      Multi-zone systems need a compatibility check before ordering anything. Ecobee Smart Thermostat Premium handles most zoned setups natively, but C-wire availability at each thermostat location needs to be confirmed, and the zone controller model has to be cross-referenced against the compatibility list. Homes with Mitsubishi mini-split systems run a different protocol entirely — the Kumo Cloud adapter is the correct solution there, not a standard smart thermostat wired into a conventional furnace circuit. Vladislav checks the existing HVAC equipment before specifying any hardware, so the install doesn't stall halfway through because an incompatible device was already purchased and unboxed. Multi-zone thermostat installs typically run 1.5-3 hours per zone depending on access and wiring condition.

  - q: "What warranty comes with handyman work on Mercer Island?"
