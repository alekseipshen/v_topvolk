  - q: "What does blown-in attic insulation to R-49 cost on Mercer Island?"
    a: "Blown-in cellulose or fiberglass to R-49 in a 1,400–2,000 sq ft Mercer Island attic runs $2,800–$5,500 installed. Price drivers include existing insulation depth (topping off is significantly cheaper than full removal and replacement), attic access hatch size, available headroom, and whether ventilation baffles need to be installed at the eaves to protect soffit airflow before blown-in goes in. PSE rebates for qualifying attic upgrades can reduce out-of-pocket cost by $600–$2,000. TopVolk provides line-item pricing after walking the attic — no ranges guessed over the phone. Schedule a free on-site estimate at (206) 591-1096."

  - q: "Do I need a permit for insulation work through the City of Mercer Island?"
    a: "Mercer Island uses its own Building Department — separate from Seattle SDCI and King County DPER. Standalone attic insulation topping (adding blown-in over existing batt with no structural changes) typically falls under the residential exemption and requires no permit. Crawl space encapsulation that includes structural repairs, joist sistering, or changes to mechanical ventilation does require a permit and plan review. Any insulation work done as part of a broader remodel or addition must meet WSEC 2021 requirements and will be reviewed at the rough-in inspection stage. TopVolk is a WA Licensed Contractor and prepares all permit documentation when required — no additional coordination needed from the homeowner."

  - q: "Should I use blown-in cellulose or fiberglass batt for my Mercer Island attic retrofit?"
    a: "Blown-in wins for retrofitting nearly every older Mercer Island attic. Loose-fill cellulose or CertainTeed InsulSafe SP fiberglass fills around existing wiring, blocking, and irregular framing without gaps — and gaps are exactly where batt fails in 1960s-era 24-inch on-center framing. Faced batt layered on top of existing insulation also places a vapor barrier mid-assembly, which can trap moisture between layers. Cellulose settles 15-20% over time, so installers account for that in the initial depth calculation. In North End rancher attics with evidence of past moisture intrusion, InsulSafe SP fiberglass loose-fill is the safer material choice — it doesn't hold moisture the way cellulose can if the vapor barrier below has minor failures."

  - q: "How long does insulation last, and what does TopVolk's warranty cover?"
    a: "Blown-in cellulose has a functional lifespan of 20-30 years before settling measurably reduces R-value. Closed-cell spray foam on rim joists is effectively permanent if protected from mechanical damage. Mercer Island's persistent lake humidity is harder on kraft-faced fiberglass batt than on Rockwool mineral wool or closed-cell foam — material selection matters more here than on drier inland sites. TopVolk warranties installation workmanship for 2 years. Manufacturer warranties are separate: CertainTeed and Owens Corning both offer 25-year limited product warranties on their blown-in materials; CleanSpace liner carries a 25-year transferable warranty. If any work installed by TopVolk fails within the workmanship period, Vladislav comes back at no additional charge."

