title: "Mercer Island Insulation — Mid-Century Homes Upgraded to R-49"

answer: "TopVolk Construction installs attic and crawl space insulation in Mercer Island, Washington (98040) — WA Licensed Contractor, 100+ projects since 2023."

intro: |
  Blown-in cellulose to R-49 in the attic and closed-cell spray foam on the rim joists — that's the starting point for most Mercer Island insulation retrofits, not the finish line. TopVolk Construction, owner-operated by Vladislav Volkov, has completed these upgrades across the island since 2023, from North End split-levels near the I-90 interchange to lakefront custom homes along West Mercer Way. Lake Washington wraps around every square foot of this island, and the resulting humidity pushes moisture up through crawl space floors faster than most King County neighborhoods. Original 6-mil poly vapor barriers installed under 1960s ranchers are long past their useful life. CertainTeed InsulSafe SP blown-in fiberglass handles damp-attic conditions well, but a proper crawl space encapsulation with a 20-mil liner is what actually stops the moisture cycle. PSE rebates offset part of the attic upgrade cost for qualifying homes — Vladislav handles that paperwork.

localContext: |
  The entire island operates under a single zip code — 98040 — and all residential permits run through the City of Mercer Island Building Department, not Seattle SDCI or King County DPER. That distinction matters: Mercer Island manages its own plan review, typically 1-2 weeks for insulation permits that touch the thermal envelope. Washington State Energy Code 2021 requires R-49 in attic assemblies and R-10 continuous rigid foam or equivalent under crawl space slabs for conditioned spaces in Climate Zone 4C. The housing stock splits by era: 1950s-1970s ranchers and split-levels dominate the North End near Luther Burbank Park, where original kraft-faced R-11 batts are still common. South End properties near Island Crest Way trend toward 1980s and newer construction with better baseline insulation but still fall short of current code. Neighboring Bellevue across the lake (98006) runs permits through the City of Bellevue Building Department — worth noting if you're managing upgrades on both sides.

commonProblems:
  - title: "Attic Insulation Below R-49 — Standard in North End Ranchers and Split-Levels"
    description: "Most 1960s-era Mercer Island attics were insulated to R-19 or R-22 — the code ceiling of that decade. Topping off to R-49 with blown-in cellulose adds 8-10 inches above existing batt without requiring removal in most cases, saving $1,200–$2,000 in demo labor. Cellulose conforms to irregular joist bays and around existing wiring far better than additional batt layers stacked on top. CertainTeed InsulSafe SP fiberglass loose-fill is the better call where attic humidity is elevated — it won't absorb moisture like cellulose can if the vapor barrier below has minor failures. A 1,600 sq ft attic topping runs $2,800–$4,200 installed; full removal and replacement adds $1,500–$2,500. Mercer Island may require a permit if insulation is part of a larger remodel that alters the thermal envelope — plan review typically takes 1-2 weeks."

  - title: "Crawl Space Vapor Barrier Degradation — Lake Washington's Perimeter Effect"
    description: "Mercer Island sits surrounded by Lake Washington, and the water table under older North End lots runs consistently high. Original 6-mil poly sheeting from 1970s construction is typically shredded by rodent traffic, compressed under foot loads, and missing at piers and penetrations. Another layer of poly isn't the fix — full encapsulation is. That means a 20-mil reinforced liner (CleanSpace or equivalent) lapped up the stem walls, sealed at every pier and utility penetration, and taped at seams. Rigid foam board between the liner and the concrete stem wall adds R-10, meeting WSEC crawl space requirements. A passive radon mitigation pipe is worth adding while the crawl is open and accessible. Budget $7,000–$12,000 for a 1,200–1,800 sq ft crawl; South End lots on larger parcels can run higher. Timeline is typically 2-3 days on-site after materials are staged."

  - title: "Rim Joist Air Sealing — Where Most Island Heat Actually Escapes"
    description: "The rim joist — the perimeter band joist sitting directly on top of the foundation wall — is the biggest air leakage failure point in mid-century Mercer Island construction. Original kraft-faced batt stuffed into the rim joist bays provides some R-value but zero air sealing. Closed-cell spray foam at 2-inch minimum depth (Lapolla FoamLok or Demilec Heatlok equivalent) hits R-12 to R-13 and creates a genuine air barrier simultaneously. Washington State Energy Code requires this treatment for conditioned crawl spaces. No separate permit is needed for rim joist spray foam alone, but the work should be documented for PSE rebate applications. On a 180-lineal-foot perimeter, budget $900–$1,600 for professional application. TopVolk is a WA Licensed Contractor — Vladislav walks every crawl before quoting, so rim joist dimensions and condition are confirmed, not estimated."

  - title: "What a Full Insulation Upgrade Costs on Mercer Island — Real Numbers"
    description: "A complete envelope package — attic blown-in to R-49, closed-cell rim joist foam, and crawl space encapsulation — runs $13,000–$23,000 on a typical 2,000 sq ft Mercer Island home. The largest cost variable is existing insulation removal: if degraded batts need full demo before blown-in goes in, add $1,500–$3,000 for attic tearout alone. PSE rebates for qualifying attic upgrades offset $600–$2,000 depending on the R-value improvement achieved. Seattle City Light rebates don't apply here — Mercer Island is PSE territory exclusively. Owens Corning and CertainTeed both carry 25-year limited product warranties on their blown-in materials; CleanSpace crawl space liner carries a 25-year transferable warranty. TopVolk prices every job line-by-line — you see exactly what each component costs before signing anything. Call (206) 591-1096 to schedule a free on-site estimate with Vladislav."

  - title: "Knee Wall Insulation in Mercer Island's Older 1.5-Story and Cape Cod Homes"
    description: "Several older Mercer Island homes — particularly 1.5-story Cape Cods and dormered ranchers in the South End near Clarke Beach Park — have knee walls separating conditioned bedrooms from unconditioned attic voids. These are almost universally uninsulated or have faced batt with no air barrier behind them. Conditioned air drives laterally into the void regardless of how much insulation sits in the main attic deck. The correct assembly: Rockwool Comfortbatt R-21 mineral wool in the knee wall stud bays (moisture-tolerant, dimensionally stable, and class A fire-rated), rigid foam board on the attic-side face of the knee wall framing, and the attic floor behind the knee wall insulated to R-49 as the thermal boundary. Skipping that attic floor piece leaves the thermal bypass intact — a detail many contractors miss. This scope adds $4,000–$7,000 to a project depending on knee wall lineal footage and interior access."

