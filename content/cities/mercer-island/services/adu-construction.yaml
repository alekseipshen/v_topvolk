  - q: "What's the permit process for an ADU on Mercer Island, and how long does it take?"
    a: |
      City of Mercer Island Development Services handles all ADU permits — this is not a King County DPER jurisdiction since Mercer Island is an incorporated city. For a DADU over 650 square feet, the process runs design review application (6–8 weeks), standard plan review (4–8 weeks), and then permit issuance — roughly 14–18 weeks total before a shovel goes in the ground. Smaller AADUs and basement conversions often skip the design review step, cutting 6–8 weeks off the front end. WA HB 1337 (2024) prohibits Mercer Island from requiring owner-occupancy as an ADU approval condition, and parking minimums are waived within half a mile of the East Link Mercer Island Station. TopVolk, as a WA Licensed Contractor, prepares the full permit package — drawings, site plan, structural calculations — and tracks the application through review.

  - q: "Should I build a detached DADU or convert my basement to an attached ADU?"
    a: |
      For most 98040 lots, the answer comes down to lot geometry and what you're optimizing for. A DADU delivers complete separation — independent entrance, separate utilities, no shared walls — which maximizes rental income potential and adds the most flexibility for a future sale. A basement AADU conversion costs less ($85,000–$140,000 vs. $175,000–$280,000 for a DADU) but requires solving moisture, egress window sizing, and ceiling height compliance first. Mercer Island's 1960s ranchers frequently have 7-foot basement ceilings — just enough to meet IRC minimums, but tight for livability. If the basement has serious water intrusion, the remediation cost — DriCore, RedGard, drain tile — can close the budget gap between AADU and DADU faster than most homeowners expect. Vladislav walks both options at the site visit with actual measurements in hand.

