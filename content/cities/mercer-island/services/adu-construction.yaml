localContext: |
  The 98040 zip code covers all of Mercer Island — roughly 7 square miles of residential neighborhoods between Lake Washington's east and west channels — and the dominant housing stock is 1960s and 1970s ranchers, split-levels, and mid-century modern builds that arrived with the first wave of I-90 bridge commuters. Lot sizes in 98040 typically run 8,000 to 15,000 square feet, which is large enough for a code-compliant DADU footprint without immediately triggering lot coverage violations. Contractors used to pulling permits in Seattle's 98112 (Madison Park, Madrona) or Bellevue's 98004 often discover that Mercer Island Development Services handles design review differently — DADUs over 650 square feet require a separate design review application before permit issuance, adding 6–8 weeks contractors from off-island consistently underestimate. North End lots near Luther Burbank Park tend toward generous side setbacks and mature tree canopy that affects DADU siting; South End parcels closer to Town Center face tighter lot coverage scrutiny. October through May, Mercer Island absorbs roughly 37 inches of annual rainfall — so any DADU with a slab-on-grade foundation needs a proper vapor barrier system and perimeter drainage plan from day one, or moisture damage shows up inside the first two rainy seasons.

commonProblems:
  - title: "City of Mercer Island's Design Review Adding Months Most Contractors Don't Budget"
    description: |
      Mercer Island runs its own Development Services department — separate from King County DPER — and DADUs over 650 square feet trigger a design review application before the building permit can issue. That review covers building massing, exterior material compatibility with the neighborhood, and site plan compliance; it typically runs 6–8 weeks on top of the standard plan review queue of 4–8 weeks. Contractors who regularly pull permits through Seattle SDCI or Bellevue's permit center often miss this step entirely because neither jurisdiction handles design review the same way for residential ADUs. Front-loading the application with complete architectural drawings, an exterior material board showing Hardie cement-board siding or cedar trim options, and a site plan that clearly addresses setback lines and tree canopy cuts review time significantly. Budget 14–18 weeks total from permit submission to approved permit for a DADU over 650 square feet on Mercer Island. TopVolk prepares the full permit package in-house — drawings, structural calculations, site plan — no outsourcing to a third-party expediter.

  - title: "1960s Rancher Basements on Mercer Island: Moisture Is the Real Scope Item in AADU Conversions"
    description: |
      Mercer Island's 1960s and 1970s ranchers and split-levels were built before modern waterproofing standards existed. Converting an existing basement to a livable AADU in 98040 almost always reveals inadequate vapor barrier, galvanized drain lines at or past their service life, and post-and-pier foundation sections that allow cold, damp air to migrate through the subfloor assembly. Proper remediation means installing DriCore subfloor panels over the existing slab, applying RedGard waterproofing membrane on any below-grade concrete walls, and replacing galvanized drains with PVC before closing up walls. HVAC for a basement AADU on Mercer Island typically calls for a Mitsubishi mini-split — the island's mild but humid summers create dehumidification demands that most forced-air systems aren't sized for. Full basement AADU conversion scope in 98040 runs $85,000–$140,000 depending on existing conditions, ceiling height (7 feet is the IRC minimum), and whether the City of Mercer Island inspector requires a separate electrical panel.

  - title: "Setback and Height Limits Shrinking the Buildable DADU Footprint More Than Expected"
    description: |
      Mercer Island enforces a standard 24-foot height limit for DADUs, but rear and side setback requirements reduce the buildable envelope considerably on lots with irregular geometry, recorded easements, or existing accessory structures. City of Mercer Island zoning requires a minimum 5-foot rear setback and 5-foot side setback for a DADU — and those numbers shift if an overhead utility line, a protected tree's drip line, or a recorded drainage easement falls within the proposed building area. FAR (Floor Area Ratio) calculations apply on top of setbacks, meaning a larger primary residence on a mid-sized lot can leave less available ADU floor area than the homeowner expects before any design work starts. Vladislav walks every Mercer Island site personally before design begins — measuring actual setbacks, flagging City-designated tree protection zones, and confirming lot coverage math against current zoning code. That site visit is free, and it prevents the costly mid-design revision that happens when a contractor starts drawing without checking real lot conditions. Call (206) 591-1096 to get on the schedule.

  - title: "What a DADU Actually Costs to Build on Mercer Island: Real Numbers, Not Phone Estimates"
    description: |
      A finished DADU in 98040 typically runs $175,000–$280,000 for a 600–850 square foot unit at Mercer Island finish levels — that spread reflects genuine variation in foundation type, utility separation, and interior specification. Lots with significant grade change require a concrete stem wall or daylight basement foundation rather than a simple slab, adding $20,000–$40,000 in structural cost before framing starts. Interior finishes for Mercer Island's market generally mean LVL beam spans for open floor plans, Wolf or Bosch appliances, quartz countertops, and large-format porcelain tile — not the builder-grade package that lands at the low end of ADU cost guides. Utility separation (separate water and sewer lateral to the street) adds $15,000–$30,000 depending on distance and whether boring or open-cut is required through existing landscaping. Soft costs — City of Mercer Island permit fees, architectural drawings, structural engineering — typically run $18,000–$28,000 on top of construction. TopVolk provides a line-item quote after the free site visit; no vague ranges, no contingencies revealed after demolition starts.

  - title: "Shared vs. Separate Utility Connections: The Decision That Affects Long-Term Rental Value"
    description: |
      City of Mercer Island allows shared water and sewer service between the primary residence and a DADU in many configurations, but the shared-vs-separate decision has real consequences for rental income, resale value, and future liability. A separate water meter and dedicated sewer lateral makes the DADU independently metered — simpler billing for long-term tenants, cleaner financials for a future buyer evaluating the property as a two-income asset. Running a new sewer lateral on Mercer Island typically means boring or open-cutting through landscaped yards to reach the public main, with costs ranging from $12,000 to $28,000 depending on distance and soil conditions. Electrical service separation requires a dedicated panel, a new meter base, and coordination with Puget Sound Energy for a second meter installation — typically $6,000–$10,000 in materials and labor. MEP coordination alone on a fully separated DADU runs 3–4 weeks; compressing that timeline causes failed rough-in inspections that push the certificate of occupancy back further than the delay itself cost.

