title: "Mercer Island Power Washing — Wooded Lots, Moss, Cedar Prep"

answer: "TopVolk Construction does power washing in Mercer Island, WA — moss removal, cedar prep, driveway cleaning, WA Licensed Contractor, 100+ projects since 2017."

intro: |
  Moss on a north-facing cedar deck in the 98040 zip doesn't wait — and on Mercer Island it moves faster than almost anywhere else in King County. The island's dense Douglas-fir and big-leaf maple canopy keeps surfaces shaded and damp from October through May, and algae colonies establish well before a homeowner notices the deck turning slippery. TopVolk Construction handles power washing and soft washing across the island: cedar deck and fence surface prep before TWP 1500 or Defy Extreme stain application, Hardie siding and stucco cleaning ahead of repaint, concrete driveway and paver restoration, and moss treatment on roof-line surfaces above north-facing walls. Luther Burbank Park-area homes on the north end tend to have older cedar structures that need careful low-pressure treatment — high-PSI blasting on weathered cedar grain raises fibers and shortens board life fast. Vladislav Volkov handles the site walk himself, which means you get a straight line-item quote, not a vague range passed through a phone rep.

localContext: |
  All of Mercer Island falls inside a single zip code — 98040 — on a 6-square-mile island in Lake Washington. The North End, running roughly from the I-90 interchange south toward Mercerdale Park and the town center, has a dense cluster of mid-century ranch and split-level homes built between 1955 and 1975. Many still carry their original cedar siding, and on north- and west-facing walls that cedar has been absorbing rain and humidity for 50-plus years. Moss and lichen embed deeply into the grain and don't release without the right chemical dwell time before rinsing. The South End — heavier with custom builds from the 1990s and 2000s — tends toward composite decking (Trex or TimberTech) and James Hardie cement-board siding, both of which require soft washing at low PSI rather than aggressive pressure that can delaminate or streak the surface. Mercer Island's municipal code doesn't require a permit for exterior surface cleaning, so scheduling moves quickly. Some waterfront enclaves near the Lake Washington shoreline have HOA or shoreline-management runoff rules — TopVolk uses biodegradable, phosphate-free detergents and contains runoff where those protocols apply.

commonProblems:
  - title: "Moss and Algae Embedded in Cedar Deck Boards — North-Facing South End Properties"
    description: |
      Cedar deck boards sitting under island canopy stay damp from October through May. That sustained moisture is exactly what moss spores need to anchor, and by spring a deck surface can be 30–40% covered with green-black growth that makes boards slippery and accelerates surface fiber breakdown. Soft washing — sodium hypochlorite solution applied at 100–200 PSI via downstream injection, then allowed to dwell 10–15 minutes — kills the root structure without raising grain the way a 2,500 PSI blast would. After the rinse and a 48–72 hour dry window, the surface is ready for TWP 1500 or Defy Extreme stain. Skipping the chemical dwell step and just pressure washing leaves live spores in the grain, and the moss returns in one season. Budget $300–$600 for a typical 400–600 sq ft cedar deck wash and prep, depending on coverage level and access constraints on sloped lots.

  - title: "Hardie Siding Going Dark Before a Repaint — North End Mid-Century Remodels"
    description: |
      James Hardie cement-board siding became the dominant exterior choice on Mercer Island remodels through the 2000s and 2010s because it handles the 37-inch annual rainfall better than wood. But Hardie still collects biological growth — algae, mildew, and airborne organics — especially on west-facing elevations that take the brunt of winter storms sweeping off Lake Washington. Before a repaint, the surface must be clean and dry for paint adhesion; a dirty substrate causes early delamination regardless of primer brand. Soft washing at 500–800 PSI removes the growth layer without damaging the factory or painted finish. Stucco needs even lower pressure — 300–500 PSI with a fan tip rather than a concentrated stream — to avoid fracturing the finish coat. Allow 3–5 days of dry time after washing before prime-and-paint begins. A typical single-story exterior wash on a Mercer Island home runs $400–$700 depending on square footage and surface type mix.

  - title: "Concrete Driveway Efflorescence and Oil Staining — Standard Issue on 98040 Lots"
    description: |
      Concrete driveways on Mercer Island accumulate two distinct problems: efflorescence — the white mineral blush that migrates to the surface as concrete cures and re-wets through rainy seasons — and petroleum staining from parked vehicles. Efflorescence responds to a diluted muriatic acid pre-treatment followed by surface cleaner attachment passes at 2,500–3,000 PSI. The rotary surface cleaner head keeps pressure even and eliminates the striping that a wand creates. Oil stains need a degreaser pre-soak (Simple Green Pro HD or equivalent) with 10–15 minutes of dwell before the surface cleaner pass. Most Mercer Island driveways run 400–800 sq ft; a full clean including both treatments takes 2–3 hours on site. Cost typically lands between $250–$450. No permit is required for driveway cleaning under Mercer Island's municipal code, so the project can move on short notice.

  - title: "Cedar Fence Cleaning and Brightening — the 3-5 Year PNW Maintenance Cycle"
    description: |
      Wood fences in the Pacific Northwest need stripping and re-sealing every 3–5 years, and the cleaning step is where most homeowners get it wrong. Gray, oxidized cedar — the weathered silver tone common on fences that last got attention five or six years ago — looks like it just needs a coat of stain. But applying Olympic Maximum or TWP over sealed gray wood causes blotchy absorption and early peeling. The proper cleaning sequence runs hot-water soft wash at 200–400 PSI, then a wood brightener (oxalic acid-based) that opens the grain and neutralizes pH before staining. That brightener step is what separates a 5-year finish from a 2-year one. On a typical 150–200 linear-foot cedar fence, plan on $350–$550 for the full clean-and-brighten sequence. Stain application is a separate scope — TopVolk can quote it as an add-on or you can coordinate a painter independently.

  - title: "Paver Patio Bio-Crust and Joint Sand Failure — Luther Burbank Park Area Yards"
    description: |
      Concrete pavers and natural stone patios in shaded Mercer Island yards develop a bio-crust — moss, liverwort, and algae layered over the joint sand — that gets slippery fast and deteriorates the joint material underneath. The joint sand itself often needs replacement after cleaning because the organic matter binding it together washes out with the rinse water. Cleaning sequence: surface cleaner attachment at 2,000–2,500 PSI for the field pavers, then hand-lance the joints at reduced pressure to avoid blowing out remaining sand, then re-sand with polymeric joint sand before the surface dries. Skipping polymeric sand lets weeds re-establish within one season and moss returns faster. Most Mercer Island patio projects run 200–400 sq ft. Cleaning runs $300–$500; polymeric sand re-application adds $100–$200 depending on linear joint footage. TopVolk quotes both as a package so the full scope is clear before any work starts.

