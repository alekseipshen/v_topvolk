  - q: "Is soft washing or pressure washing better for cedar siding and decks?"
    a: |
      Cedar is soft wood — sustained high-PSI pressure above 1,500 PSI raises the grain, drives water into end grain, and shortens board life measurably. Soft washing uses sodium hypochlorite solution applied at 100–300 PSI via downstream injection with a 10–15 minute dwell time, killing moss and algae at the root without mechanical damage to the wood fibers. For decks scheduled for TWP 1500 or Defy Extreme stain after cleaning, the soft wash approach leaves a tight, clean grain surface that accepts stain evenly. Hard surfaces like concrete driveways or brick get standard pressure washing at 2,500–3,000 PSI with a surface cleaner attachment. TopVolk scopes each surface area separately so cedar panels don't receive the same pressure as a driveway slab.

  - q: "How long will power washing results last in Mercer Island's climate?"
    a: |
      On concrete driveways with properly treated oil stains, expect a clean surface for 2–4 years before significant re-accumulation. Cedar decks that get washed, brightened, and sealed with TWP or Defy Extreme typically hold for 3–5 years before the full process needs repeating. Hardie siding, once cleaned, usually stays clear for 3–5 years if the paint system above it remains intact and uncracked. Moss returns faster on north-facing and heavily shaded surfaces — some Island Crest Way properties need deck and roof-line moss treatment on a 2–3 year cycle due to overhead canopy. The on-site consultation is free, so you can get a straight answer on your specific property's realistic maintenance cycle before committing to any cleaning scope.

