  - q: "Who issues garage building permits on Mercer Island, and how long does plan review take?"
    a: |
      Mercer Island is an incorporated city, so permits go through the City of Mercer Island Development Services Department — not King County DPER, which handles unincorporated county areas. A straightforward detached garage permit typically takes 4-8 weeks for plan review. A DADU-above build adds structural drawings, an energy code compliance report per WA State Energy Code, and a full MEP plan set — which can push plan review to 10-14 weeks. TopVolk prepares the complete permit package — site plan, elevations, structural details, energy calculations — and tracks the application through the city portal, handling any correction responses. WA Licensed Contractor on all permitted work.

  - q: "Can I put a DADU above my new detached garage under WA HB 1337?"
    a: |
      Yes — WA HB 1337 (effective 2024) allows up to two ADUs on any single-family lot statewide, including a DADU above a detached garage. Mercer Island's municipal code must conform to state law, though local height limits (typically 24 feet for a DADU) and lot coverage calculations still apply. The structural requirements are real: the floor system between the garage and DADU needs LP LVL beams or TJI engineered joists, egress stairs must meet IRC rise-and-run specs, and fire separation between the garage and living space above must comply with IRC R302. Vladislav walks through all of this during the site visit before the permit package is drafted — you will know exactly what is structurally and legally required before any money changes hands.

  - q: "What warranty covers a new garage build from TopVolk?"
    a: |
