localContext: |
  Mercer Island's housing stock splits into two distinct eras that affect garage construction differently. The North End (zip 98040, near the I-90 interchange) holds a concentration of mid-century ranchers and split-levels built between 1955 and 1975 — tighter lots where setback compliance and FAR (Floor Area Ratio) calculations are required reading before a foundation plan gets drawn. The South End carries more generous lots with 1980s-2000s construction, where full detached garage footprints are feasible without the same constraints. Either way, permits go through the City of Mercer Island Development Services Department, not King County DPER — Mercer Island is incorporated, with its own plan review queue and fee schedule. On North End lots where lot coverage limits are binding, going vertical — a DADU above a two-car garage — often delivers more usable square footage than trying to expand the footprint. Vladislav pulls parcel data and lot coverage numbers before quoting, so there are no surprises at permit submittal.

commonProblems:
  - title: "DADU-above-garage builds require a real structural floor system, not standard ceiling framing"
    description: |
      A standard garage ceiling isn't engineered to carry living space above it. For a DADU over a detached garage in 98040, the floor assembly between stories has to meet IRC sound separation and fire resistance requirements — which means the structural system calls for LP LVL beams or Weyerhaeuser TJI joists rather than dimensional lumber, especially on spans over 14 feet across a two-car bay. City of Mercer Island plan review will catch undersized framing before the permit issues, but that triggers a redesign delay if the structural drawings weren't right from the start. Add blocking for lateral load transfer, hold-downs at shear wall corners, and the structural framing for the floor system alone runs $18,000-$30,000 depending on span and engineering complexity. Getting the structural engineer's stamp on drawings before submittal avoids a correction notice mid-review — and avoids rebuilding framing that already passed rough-in inspection.

  - title: "EV charger circuit costs two to three times more after drywall than at rough-in"
    description: |
      On Mercer Island, where Tesla, Rivian, and BMW EV ownership is common, every new garage build should include a 50A or 60A dedicated circuit roughed in during framing — even if the charger itself goes in six months later. Fishing wire through finished walls and cutting drywall for conduit after the garage is closed runs expensive and unnecessary labor. The right setup: a 60A circuit to a hardwired Level 2 charger — Chargepoint Home Flex, Tesla Wall Connector, or Wallbox Pulsar Plus — positioned for the parking layout you actually use. Two-EV households or workshop users benefit from a 100A sub-panel in the garage rather than a single dedicated circuit. Installing that sub-panel during construction, while the electrician is already on site for rough-in, runs $2,500-$4,500. Calling the electrician back after the garage is finished typically runs $5,000-$8,000 once wall patching and re-inspection are factored in.

  - title: "Concrete slab poured light or without vapor barrier fails faster on Mercer Island soils"
    description: |
      A 4-inch minimum slab is the IRC baseline for a garage floor, but Mercer Island's clay-heavy soils shift during wet-season saturation — and a 5-inch slab with fiber reinforcement and a 3,000 PSI concrete mix is the smarter specification for vehicle loads and long-term stability. Install a 6-mil poly vapor barrier beneath the slab without exception. Moisture transmission through a bare slab is significant in the Pacific Northwest, and it accelerates corrosion on stored metal tooling and degrades any wiring that contacts uncovered concrete. For workshop use with a two-post lift or heavy machinery, bump to 6 inches with #4 rebar at 18-inch centers. City of Mercer Island inspectors verify footing depth — typically 18 inches below grade — at the foundation inspection before the pour. A failed footing inspection means no concrete until the inspector returns, so getting this signed off on schedule is not optional.

  - title: "Exterior mismatch between a new garage and the main house reads poorly in a market averaging $2M+"
    description: |
      Mercer Island property values regularly clear two million dollars, and a detached garage that looks architecturally disconnected from the main house is something buyers notice and discount. Matching roofline pitch, fascia profile, and siding material takes real planning before a shovel goes in. If the existing house has cedar shake, the options are matching it — which means a repainting cycle every 5-7 years in PNW conditions — or transitioning to Hardie HardiePlank lap siding in a compatible profile and pre-primed finish. Hardie's 30-year limited warranty and resistance to rot and moisture make it the practical call in most cases. Garage door selection carries weight too: a carriage-style Clopay Canyon Ridge door reads well with Craftsman and traditional architecture, while a flush aluminum door suits contemporary builds. Budget $8,000-$15,000 for siding, windows, trim, and roofing on a two-car garage to get the exterior finish right.

  - title: "What drives the price on a Mercer Island garage build — and what the number actually includes"
    description: |
      A single-car detached garage starts around $45,000-$60,000 in 98040 for a full-permit build: concrete slab with PT sill plates, dimensional framing, roofing, one insulated door, and basic electrical. A two-car detached without DADU runs $80,000-$120,000. The DADU-above version — kitchen rough-in, bathroom with Schluter Kerdi waterproofing in the shower, a Navien or Rinnai tankless water heater, and a separate utility connection — lands between $180,000-$280,000+. Cost drivers include garage door quality (an insulated Clopay or Amarr solid-core door runs $1,800-$3,500 vs $800 builder-grade), roof material (standing seam metal costs more upfront but outlasts architectural shingles by 20+ years), sewer lateral distance for DADU tie-in, and permit complexity. TopVolk quotes line-item — every trade and material phase has its own number, not a bundled lump sum. Call (206) 591-1096 to schedule an on-site estimate.

