title: "Mercer Island Kitchen Remodel — 60s Ranchers, Open Concept"

intro: |
  Most homes along Island Crest Way and the SE 40th Street corridor in 98040 were built between
  1960 and 1978 — back when Wolf ranges were not part of the plan. The original layouts isolated
  the kitchen from the dining room and from any view of Lake Washington. Vladislav has opened up
  a dozen of those kitchens, replacing bearing walls with LVL beams and integrating Sub-Zero
  refrigerator columns into spaces originally sized for a single-door Sears box.

localContext: |
  The 98040 zip code covers the entire island, and the dominant housing stock runs from mid-1950s
  split-levels on the hillside lots to 1970s contemporary ranchers along East and West Mercer Way.
  Many of those homes sit on sloped lots where the kitchen faces inward — toward a wall — rather
  than toward the water. Stem-wall concrete foundations are common here; removing a bearing wall
  requires a stamped structural engineer drawing before the City of Mercer Island permit center
  issues the structural work permit.

commonProblems:
  - title: "Load-Bearing Wall Removal and LVL Beam Sizing for Open-Concept Layouts"
    description: >-
      The interior wall separating the kitchen from the dining room in Mercer Island ranchers from
      the 1960s is almost always load-bearing. Taking it out means specifying an LVL beam — often
      a 3-ply 1-3/4" x 9-1/2" or deeper depending on the span — plus post columns carrying the
      load to the foundation. City of Mercer Island requires a stamped engineer drawing before
      issuing the permit. Plan review typically runs 3-6 weeks.
  - title: "100-Amp Service Panels Too Small for Sub-Zero and Wolf Appliances"
    description: >-
      A 48-inch Wolf dual-fuel range paired with a Sub-Zero 36-inch refrigerator column draws close
      to 60 amps at peak load. Most 1960s-era homes in 98040 left the builder with 100-amp service
      panels — not enough capacity for a fully outfitted modern kitchen. Upgrading to a 200-amp
      panel requires a licensed electrician, a Puget Sound Energy service entrance upgrade, and a
      separate electrical permit through the city.
  - title: "Soffit Removal and Panel-Ready Appliance Rough Openings"
    description: >-
      Panel-ready Sub-Zero and Thermador column refrigerators require precise rough openings —
      Sub-Zero's 36-inch built-in needs exactly a 36-1/8" opening with specific depth clearance for
      the door panel overlay. Older Mercer Island kitchens almost always have a soffit at 7 feet
      that has to come down before 42-inch upper cabinets or integrated appliance panels will fit.
      Opening that soffit regularly exposes original galvanized supply lines worth replacing while
      the walls are already open.

faq:
  - q: "How fast can you get to Mercer Island for Kitchen Remodel?"
    a: >-
      From Capitol Hill or Bellevue, 98040 is 15-20 minutes via I-90 depending on bridge traffic.
      Vladislav schedules consultations himself — you talk to the contractor running the job, not a
      salesperson. Call (206) 591-1096 to set something up.
  - q: "Do you work with Sub-Zero, Wolf, and Thermador in kitchen remodels?"
    a: >-
      Those three come up on most Mercer Island kitchen projects at this price point. Standard work
      includes gas line sizing for Wolf ranges, range hood CFM ducting calculations, circuit planning
      for Thermador steam ovens and warming drawers, and precision rough openings for Sub-Zero
      built-in columns. All permits pulled by us.
  - q: "How long does a full kitchen remodel take in Mercer Island, and what permits are needed?"
    a: >-
      Construction runs 6-10 weeks once permits are approved. Structural changes — LVL beam for
      wall removal — and gas line modifications both require City of Mercer Island permits; plan
      review typically takes 3-6 weeks. TopVolk is a WA Licensed Contractor with 100+ projects
      completed since 2017. Deadline commitments are written into the contract with penalties for
      missed milestones. Call (206) 591-1096 for a free on-site estimate with Vladislav directly.