localContext: |
  Oak Harbor's 98277 zip code covers a housing mix ranging from 1950s and 1960s military-era ranch homes near Ault Field Road to newer subdivisions on the hills east of downtown. The 98278 zip covering the NAS Whidbey station perimeter sits adjacent to some of the densest residential clusters on north Whidbey Island, and homes in that corridor face two compounding problems: aircraft noise infiltration and salt-laden marine air blowing off Admiralty Inlet. Aluminum window frames oxidize fast in this environment — the pitting and swelling prevents a clean sash-to-frame seal, which means drafts and moisture infiltration every October through May. Window replacement in Oak Harbor goes through Island County Community Development Services; like-for-like insert replacements on existing rough openings are often permit-exempt, but any rough opening modification, egress cut-in, or structural header work requires a building permit. Cedar-sided homes from the 1970s throughout the Pioneer Way neighborhood need careful flashing tape work around new window fins — water tracking behind the fin frame is the fastest path to framing rot in Island County's wet climate.

commonProblems:
  - title: "Aircraft Noise From NAS Whidbey — Upgrading to Sound-Attenuating Glass"
    description: |
      Standard double-pane windows with argon-filled IGUs achieve STC ratings of roughly 26-28 — not enough to meaningfully cut the noise from F/A-18 approach patterns over Oak Harbor neighborhoods. Laminated glass uses a PVB (polyvinyl butyral) interlayer bonded between two glass lites, which damps the specific frequency ranges aircraft generate. Milgard's SoundControl glass option and Pella's Impervia line with laminated glass both reach STC ratings in the 38-45 range depending on IGU configuration. For homes along Scenic Heights or anywhere within the NAS Whidbey noise contour zones, a full-frame replacement with a proper acoustic IGU is the right move — insert replacements that preserve old aluminum frames still leak sound around degraded weatherstripping. Budget $850-$1,400 per window installed for a standard casement or double-hung with acoustic glass, more for large picture windows. The noise reduction is noticeable the day installation wraps up.

  - title: "Corroded Aluminum Frames From Marine Air — When Repainting Isn't Enough"
    description: |
      Salt-laden air off Admiralty Inlet and Saratoga Passage oxidizes aluminum window frames faster than most homeowners expect. The pitting and swelling on 1970s-era aluminum frames isn't just cosmetic — oxidized frames prevent the sash from sealing against the frame stop, which lets cold air and moisture in every storm. Repainting aluminum buys maybe two or three seasons before the corrosion cycles through again. A full-frame replacement — pulling the old fin frame and installing a new vinyl or fiberglass unit — is the correct long-term fix. Milgard's Ultra Series fiberglass frame resists marine air better than standard vinyl over a 20-30 year horizon and holds its finish permanently. New installations need marine-grade flashing tape on the rough opening sill and head to protect the Douglas-fir framing from moisture wicking in between rain events. Standard double-hung replacement on a single-story Oak Harbor home runs $700-$1,100 per window installed.

  - title: "Island County Permits and Egress Requirements for Basement Bedroom Windows"
    description: |
      Island County Community Development Services requires a building permit for any window installation that modifies the rough opening — including egress cut-ins for below-grade bedrooms. IRC egress rules mandate a minimum 44-inch net clear opening height, 20-inch width, and 5.7 square feet of net clear area for sleeping rooms at or below grade. Enlarging the rough opening means header work — typically a new LVL beam or doubled 2×10 — plus a window well and drainage if grade is tight against the foundation. TopVolk is a WA Licensed Contractor and handles the Island County permit application, any required structural drawings, and coordinates the rough-in inspection before framing closes up. Island County permit review for residential window work typically runs 2-4 weeks. Skipping this permit will surface during a home inspection at resale, and retrofitting a permit after the fact costs more than doing it right the first time.

  - title: "What Window Replacement Actually Costs in Oak Harbor — Insert vs. Full-Frame"
    description: |
      The choice between an insert replacement and a full-frame tear-out changes the project cost significantly. An insert replacement — where the new window unit slides into the existing frame — runs $400-$700 per window installed for standard vinyl units like Milgard Tuscany or Simonton. Full-frame replacement, pulling the fin frame, reflashing the rough opening, and reinstalling interior and exterior trim, runs $750-$1,300 per window. For a whole-house project on a typical Oak Harbor 1960s ranch with 12-16 windows, budget $8,000-$18,000 depending on product tier and what the framing looks like after tear-out. Pella 250 Series or Milgard Tuscany Series hit a solid mid-range price point with low-E glass packages that satisfy Island County's energy code. Vladislav provides line-item quotes after a free on-site visit — no vague ranges, no estimate that balloons at contract signing. Call (206) 591-1096 to schedule.

  - title: "Foggy Double-Pane Windows — IGU Seal Failure and When to Repair vs. Replace"
    description: |
      Condensation or haze trapped between two glass panes means the IGU seal has failed — the argon or krypton gas fill has escaped, the desiccant strip inside the aluminum spacer bar is saturated, and the unit is now performing at single-pane thermal efficiency. In Oak Harbor's climate with heavy rain running October through May, a failed IGU accelerates frame moisture damage if the frame joint allows water to track alongside the glass. On a vinyl or fiberglass frame that's structurally sound, replacing just the IGU runs $150-$350 per unit and is worth doing when the frame is under 15 years old. Frames older than 20 years showing oxidation, corner joint gaps, or weatherstripping failure need full replacement — a glass swap won't fix a compromised frame. Milgard's lifetime warranty on vinyl products covers glass seal failure for the original owner, so pull the warranty documentation before paying out of pocket for an IGU that may already be covered.

