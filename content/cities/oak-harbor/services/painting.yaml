      Residential painting alone — interior or exterior — does not require a building permit under City of Oak Harbor or Island County codes. Painting is classified as maintenance and cosmetic work, not construction, so no plan review or permit fee applies. The regulatory piece that does apply regardless of permit status is EPA RRP: on any pre-1978 home, disturbing painted surfaces through scraping or sanding requires a certified renovator following containment and cleanup protocols per federal regulation. TopVolk handles lead testing coordination and RRP-compliant procedures on qualifying homes. WA Licensed Contractor — all work is scoped in writing before it starts, with a contract that includes a deadline penalty clause if the project runs over schedule.

  - q: "What's the difference between acrylic and oil-based exterior paint for Whidbey Island homes?"
    a: |
      For exterior work in Oak Harbor's wet climate, 100% acrylic latex is almost always the right call over oil-based products. Acrylics stay flexible as temperatures cycle through PNW winters — critical for cedar siding and wood trim that expand and contract with seasonal moisture changes. Oil-based paints cure harder but are less elastic, meaning they crack earlier when substrates move. The exception is cabinet and trim painting, where a waterborne alkyd like Benjamin Moore Advance or Sherwin-Williams Emerald Urethane Trim delivers the hard, self-leveling finish of an oil without extended dry time or high VOC output. For interior walls, flat or matte finishes suit low-traffic areas; satin or semi-gloss is standard for kitchens, baths, and all trim throughout.

  - q: "What warranty do you offer on painting work in Oak Harbor?"
    a: |
      Exterior repaint work on properly primed Hardie siding and cedar shake should hold 6–8 years in Oak Harbor's coastal conditions — less on north-facing walls with no overhang protection against the winter rain. Interior cabinet refinishing with Benjamin Moore Advance typically holds 8–10 years under normal household use. TopVolk backs painting work with a written warranty covering adhesion failure and peeling within the first two years — if paint fails because of prep or application on our end, it gets fixed. What the warranty doesn't cover: failure caused by ongoing moisture intrusion from a roof leak or failed caulk joints the homeowner chose not to address, or substrate movement beyond normal seasonal variation.

