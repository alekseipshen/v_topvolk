  - q: "What does tile installation in Oak Harbor cost?"
    a: "Bathroom floor tile installation in Oak Harbor runs $12–$18 per square foot for standard formats (12×24 or smaller), and $20–$30 per square foot for large-format porcelain (24×48 or 32×32) with Schluter Ditra membrane and substrate leveling. Full shower rebuilds with Schluter Kerdi waterproofing and new tile run $5,500–$10,000 for a standard alcove; heated floor systems with Schluter Ditra-Heat or Warmup add $800–$2,000. Kitchen backsplash installation during a remodel typically runs $1,500–$3,500 depending on square footage and whether electrical relocation is involved. Call (206) 591-1096 for a free on-site estimate — Vladislav measures and prices on-site and provides a written line-item quote, not a verbal range."

  - q: "Do I need a permit for tile installation in Oak Harbor?"
    a: "Surface retiling — replacing existing tile without touching framing, plumbing, or electrical — generally doesn't require a permit through the City of Oak Harbor's building department. Work that involves shower niche framing, plumbing rough-in relocation, or any structural wall modification does trigger a permit. TopVolk Construction is a WA Licensed Contractor and manages the permit application, plan drawings, and inspection scheduling when required. For tile work in unincorporated Island County just outside Oak Harbor city limits, permits run through Island County Building Department instead of the city. Plan review typically takes 2–4 weeks for straightforward bathroom work."

  - q: "Should I use Schluter Ditra or cement board under bathroom floor tile?"
    a: "Schluter Ditra is an uncoupling membrane that allows the subfloor and the tile assembly to move slightly independent of each other — that tolerance prevents stress transfer that would otherwise crack grout joints on a floor with any seasonal flex. Cement board like Hardiebacker bonds rigidly to the subfloor, which performs well on concrete slabs or very stiff floor systems but transmits deflection directly into the tile on anything older. For Oak Harbor's 1960s–1980s construction with 2×8 floor joists, Ditra is the better call in almost every situation. It also doubles as a thermal break under Schluter Ditra-Heat radiant systems. Cost difference is minor — Ditra adds roughly $1.50–$2.50 per square foot over cement board, and it's worth it."

  - q: "How long does tile work last in Oak Harbor's climate, and what's the warranty?"
    a: "Tile installed with proper substrate preparation — Schluter Ditra under floor tile, Kerdi membrane in wet areas, polymer-modified thinset at correct coverage — holds 20–30 years without grout failure or tile movement in a typical Oak Harbor bathroom. TopVolk Construction warranties workmanship for 2 years from project completion; tile and material manufacturer warranties are separate. The first maintenance item that usually comes up is caulk at floor-wall intersections, which compresses and cracks before grout does — roughly $50–$100 every 4–6 years, not a tile failure. Grout in high-use shower floors should be resealed every 2–3 years in Whidbey Island's humid climate."

