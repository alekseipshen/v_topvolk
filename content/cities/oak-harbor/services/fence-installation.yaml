  - q: "Do I need a permit to install a fence in Oak Harbor?"
    a: |
      Within Oak Harbor city limits, fences up to 6 feet on side and rear property lines are
      generally permit-exempt. Front yard fences are typically capped at 4 feet. Any fence
      combined with a retaining wall that totals more than 4 feet in height — or any standalone
      fence over 6 feet — requires a building permit through Oak Harbor's permit center. For
      properties in unincorporated Island County outside city limits, Island County Community
      Development handles permit applications, with plan review running three to six weeks for
      residential fence projects. TopVolk manages the permit application and site plan prep as
      part of the project — WA Licensed Contractor, so we sign the documents. We verify survey
      pins before setting any posts, particularly on the older platted lots near Pioneer Way
      where property line locations are frequently ambiguous.

  - q: "Should I choose cedar or vinyl for my Oak Harbor fence?"
    a: |
      Cedar fences on Whidbey Island need staining or sealing every two to three years on exposed
      elevations — north-facing sections near the water gray out and check faster than a sheltered
      inland yard would. If you're comfortable with that maintenance cycle, cedar looks better,
      repairs more easily board-by-board, and holds fasteners tighter over time. Vinyl (Bufftech
      CertainTeed or equivalent) requires essentially zero maintenance beyond an annual wash and
      holds color for decades in salt air. The 10-year total cost difference often favors vinyl
      once you factor in two or three stain applications and any board replacements. For a fence
      near City Beach Park or on a lot directly exposed to Admiralty Inlet winds, vinyl is usually
      the more practical long-term spec.

  - q: "How long will a cedar fence last in Oak Harbor's climate?"
    a: |
      A properly installed cedar fence — 36-inch PT post depth, concrete collar, PT kickboard
      along the bottom rail, and sealed every two to three years — should last 15–25 years in
      Oak Harbor before needing significant structural work. Skip the maintenance cycle and
      board replacement shows up by year ten on exposed elevations. Vinyl fence material has a
      longer lifespan (25–40 years) but gate hardware and post caps need periodic replacement.
      Coastal exposure is hard on zinc-plated hardware; stainless or hot-dipped galvanized
      hardware inspected annually lasts 10–15 years in this environment. TopVolk warranties
      installation workmanship for two years from project completion — covering post setting,
      framing, and gate hardware installation. Material warranties run separately through the
      manufacturer.

