title: "Oak Harbor Bathroom Remodel — Built for Whidbey's Wet Winters"

intro: |
  Whidbey Island pulls in moisture differently than the mainland. The fog off Puget Sound,
  the north-facing exposures, the houses that sat through sixty wet winters without a single
  ventilation upgrade — it all collects inside bathrooms first.

  Oak Harbor's residential neighborhoods near NAS Whidbey, particularly along Goldie Road
  and the tracts off SE Midway Boulevard, were built fast for military contractors and their
  families starting in the 1960s. Most of those bathrooms shipped with fiberglass surrounds,
  basic 4-inch ceramic tile, and exhaust fans that stopped moving air sometime around 2005.
  The grout cracks. The caulk turns black. The subfloor softens at the tub surround. A
  bathroom remodel here isn't just cosmetic — it's structural waterproofing first, Schluter
  Kerdi membrane over cement board, then the finish work on top. TopVolk Construction has
  completed bathroom remodels across Whidbey Island and the Seattle Metro since 2017.
  Vladislav Volkov is the one who shows up for the consultation and runs the job. Call
  (206) 591-1096 to schedule a site visit.

localContext: |
  Most of Oak Harbor's housing stock falls into two categories. The neighborhoods concentrated
  around zip code 98277 — Freund Hill, the blocks near City Beach, the cul-de-sacs off SE
  Midway Boulevard — run mostly 1960s through 1980s ranch homes and split-levels.

  Military-adjacent rental properties near the 98278 corridor tend to be older still, some
  pushing post-WWII construction with original cast-iron tub surrounds and galvanized drain
  lines that have been patching leaks for decades.

  The second category: newer subdivisions off NE Regatta Drive and developments closer to
  Windjammer Park — built in the 1990s and 2000s — where builder-grade hollow-core vanities
  and fiberglass surrounds have aged out faster than expected.

  Whidbey Island's climate is wetter and windier than central Puget Sound. Rainfall
  accumulates October through April, and the humidity doesn't fully clear even in July. That
  moisture finds every gap in old caulk, every unprotected seam in a fiberglass panel. Island
  County Building Department handles permits here — not Seattle SDCI, not King County DPER.
  Timelines and submittal requirements differ from the mainland, and knowing that upfront
  saves weeks off your project schedule.

commonProblems:
  - title: "Subfloor rot under the tub surround from years of missed caulk maintenance"
    description: "In Oak Harbor's 1970s and 1980s ranch homes, the tub-to-wall joint fails
      long before anyone notices it. Water migrates behind the fiberglass panel at the caulk
      line, wicks into the drywall underneath, and saturates the subfloor over months or
      years. By the time there's a visible soft-spot underfoot, the OSB subfloor panel is
      compromised. The fix involves pulling the tub or shower surround completely, cutting
      out the rotted subfloor section, sistering the joists if they've taken water damage,
      and installing new exterior-grade plywood before waterproofing. For the new shower
      surround, Schluter Kerdi membrane over cement board is the right call — it decouples
      the tile from the substrate and stops moisture migration at the source. A full tub-to-
      curbless-shower conversion with subfloor repair typically runs $8,000–$14,000 depending
      on joist condition and tile selection. Active construction: 3–5 weeks after permits
      clear."

  - title: "Ventilation failure causing chronic mold on ceiling drywall"
    description: "Whidbey Island humidity does not give bathrooms a break the way inland
      climates do. The original builder exhaust fans in Oak Harbor's 1980s and 1990s homes —
      typical 50 CFM units — were undersized even when new. After two decades of intermittent
      use, the motors seize. Shower steam has nowhere to go, so it condenses on ceiling
      drywall, paint bubbles, and black mold establishes in the paper facing. The visible
      mildew is the surface symptom. The actual problem is the drywall itself, which often
      needs full replacement in a 4×8 section or more before any finish work makes sense.
      Every bathroom remodel TopVolk does in Oak Harbor includes an exhaust fan upgrade to a
      minimum 110 CFM unit — typically a Panasonic WhisperCeiling or Broan model — vented
      directly through the roof, not into the attic cavity. If the attic run is long, we
      upsize to 4-inch rigid duct. Skipping this step just recreates the same mold problem
      in five years."

  - title: "Failing 4-inch ceramic tile set over greenboard — full removal and re-tile"
    description: "The original 4-inch ceramic wall tile in Oak Harbor's 1970s–1990s bathrooms
      was typically thinset over greenboard drywall — not cement board, not membrane-
      waterproofed. Greenboard holds up until moisture gets behind it through failed grout,
      then the tile comes off in sheets. Regrouting only works when the tile and substrate
      underneath are both solid. Any flex in the wall or hollow sound when you knock means
      the bond has broken and new grout will fail within a year. Full removal back to studs,
      Hardiebacker cement board or Schluter Kerdi-DS membrane, and large-format porcelain
      tile (12×24 or 18×36) is the lasting repair. Large-format tile has fewer grout lines —
      fewer entry points for moisture. Island County Building Department requires a permit
      for full bathroom remodels involving plumbing or electrical. Plan review typically runs
      4–6 weeks. Vladislav handles the application and coordinates the rough-in inspection
      checkpoint. Call (206) 591-1096 to get the permit clock started."

  - title: "Galvanized supply lines and cast-iron drains in pre-1980 homes near the base"
    description: "Some of the older homes in Oak Harbor — particularly the blocks closest to
      NAS Whidbey in the 98277 zip — still carry original galvanized steel supply lines and
      cast-iron horizontal drain runs. Galvanized pipe corrodes from the inside, restricts
      water pressure, and eventually scales into the water supply. Cast-iron horizontal runs
      under the bathroom floor frequently develop partial blockages in older crawlspace
      foundations. A bathroom remodel is the right time to address both. Replumbing bathroom
      supply lines to PEX-A or copper adds to project cost but eliminates the single biggest
      long-term maintenance risk. TopVolk coordinates licensed plumbers for rough-in work;
      our scope covers waterproofing, tile, and fixtures. Moen and Kohler both make reliable
      mid-range fixture packages in the $800–$1,400 range per bathroom, with solid replacement
      part availability for the long haul. Expect both a rough-in inspection and a final
      inspection from Island County Building Department as permit milestones."

  - title: "Master bath reconfiguration — tub-shower combo converted to walk-in shower"
    description: "A lot of Oak Harbor homeowners — especially those in the 1,400–1,800 square
      foot ranch homes off Midway Boulevard — have a master bath that's really just a tub-
      shower combo with a narrow vanity. Once kids grow up and out, the tub goes unused.
      Reconfiguring to a curbless walk-in shower with a built-in bench and tiled niche gains
      real usable space. Curbless also matters for aging-in-place: installing grab bar blocking
      — 3/4-inch plywood between studs behind the Schluter Kerdi membrane during rough-in —
      means ADA-rated grab bars can be added later without drilling blind through large-format
      porcelain. The layout change typically involves moving the drain, shifting the plumbing
      rough-in, and sometimes relocating a vanity wall. That's a 6–9 week project end-to-end
      including permit, demo, rough-in, waterproofing, tile, and finish work. Quartz on a
      floating vanity, a Moen or Kohler fixture set, and recessed LED lighting on a dimmer
      complete the standard master bath remodel at this scope level."

faq:
  - q: "How far is Oak Harbor from your base of operations, and what does that mean for scheduling?"
    a: "Oak Harbor is on Whidbey Island — getting there from the Seattle side means either
      the Mukilteo–Clinton ferry plus the SR-525 north run, or coming around through
      Burlington and across the Deception Pass Bridge on SR-20. Either route runs 1.5 to 2
      hours each direction, which we account for in scheduling by batching site visits to
      Whidbey Island on dedicated days. For an active project, Vladislav is on-site every
      day work is happening — not a subcontractor drop-off situation. Call (206) 591-1096 to
      check availability for a free on-site consultation. We walk the bathroom, assess
      substrate condition, and deliver a written scope before anything is signed."

  - q: "What does a full bathroom remodel cost in Oak Harbor?"
    a: "A mid-range full bathroom remodel in Oak Harbor — demo, Schluter Kerdi membrane or
      cement board, large-format porcelain tile on walls and floor, new vanity with quartz
      top, Moen or Kohler fixture set, toilet, exhaust fan upgrade — runs $14,000–$22,000
      for a standard 50–60 square foot bathroom. Master bath reconfigurations with plumbing
      moves, a curbless shower conversion, and custom tile work push to $25,000–$40,000.
      What drives cost higher: rotted subfloor or joist repair, galvanized pipe replacement,
      Island County Building Department permit fees, and tile selection. TopVolk provides a
      fixed-price quote with line-item detail before you sign. No vague ranges mid-project.
      Free on-site estimate — call (206) 591-1096."

  - q: "Do you manage the Island County Building Department permit process?"
    a: "Yes. Any bathroom remodel involving plumbing moves, structural changes, or electrical
      work requires a permit through Island County Building Department. TopVolk prepares the
      permit application and basic plan set, submits it, and tracks the review. Island County
      plan review for residential work typically runs 4–6 weeks — faster than Seattle SDCI
      for comparable projects, but still needs to be built into the schedule from day one.
      Rough-in inspection happens after plumbing and framing are in but before cement board
      or membrane goes up. Final inspection closes the permit after all finish work is
      complete. Vladislav coordinates directly with the inspector. WA Licensed Contractor —
      you don't need to manage any of that process yourself."

  - q: "Can you install grab bar blocking during rough-in for future ADA accessibility?"
    a: "Yes — and rough-in is the only logical time to do it. Installing 3/4-inch plywood
      blocking between studs behind the Schluter Kerdi membrane means grab bars can be
      anchored to solid wood at any point in the future, including years after tile is
      installed. Post-tile grab bar installation means drilling through large-format porcelain
      and hoping you hit framing, which is a gamble. TopVolk includes grab bar blocking as
      standard practice on shower rough-ins whenever the homeowner is 55+ or requests aging-
      in-place features. Kohler, Moen, and Bobrick all manufacture ADA-rated grab bars
      compatible with standard wall depth. The addition costs almost nothing during rough-in
      and removes a major retrofit headache later."

  - q: "How long does a bathroom remodel take start to finish in Oak Harbor?"
    a: "For a standard full bathroom remodel — no unusual substrate or plumbing surprises —
      the realistic end-to-end timeline is 10–14 weeks. That breaks down as 4–6 weeks for
      Island County Building Department permit review, 1–2 weeks for material lead times on
      tile and fixtures, and 3–5 weeks of active construction. Active build phase covers
      demo, rough-in inspection checkpoint, Schluter Kerdi waterproofing, tile install,
      fixture rough-in, drywall hang and mud, and finish work. A blue tape walkthrough
      happens before the punch list closes. Timelines written into the contract include a
      penalty clause for missed deadlines — not a verbal promise, a financial commitment on
      our end in writing."

  - q: "Do you cover other Island County cities or nearby areas outside Oak Harbor?"
    a: "Oak Harbor is the primary Whidbey Island market. Coupeville and Langley projects are
      evaluated case by case. On the mainland side, Anacortes and Burlington in Skagit County
      are reachable without ferry logistics, which simplifies scheduling significantly. For
      south-island locations like Freeland or Clinton, project scope and size determine
      whether the travel pencils out. Minimum project size for Whidbey Island work is $20,000.
      If you're in the 98277 or 98278 zip code with a real bathroom remodel scope, call
      (206) 591-1096. Vladislav will tell you directly — yes or no — if the project is a fit
      for TopVolk. 100+ projects completed since 2017 across the Seattle Metro."