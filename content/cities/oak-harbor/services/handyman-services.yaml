  - q: "Do handyman repairs in Oak Harbor require a permit from the city?"
    a: |
      Most standard handyman work falls below the City of Oak Harbor Building Department's permit threshold. Fixture-for-fixture replacements (toilet, faucet, light fixture), drywall patches, deck board replacement on an existing structure, weatherstripping, and low-voltage smart device installs are all permit-exempt under typical circumstances. Work that crosses into structural modifications, electrical panel changes, or new additions would go through City of Oak Harbor Building and Community Development directly. If a repair uncovers something that needs permitted work — deteriorated wiring behind a fixture, for example — Vladislav flags it and won't cover it up. TopVolk Construction LLC is a WA Licensed Contractor; Vladislav coordinates with Island County and City of Oak Harbor building departments directly when permitted scope is involved.

  - q: "Can you match the original drywall texture in my 1960s Oak Harbor home?"
    a: |
      Yes — texture matching on mid-century ranch drywall is a regular job in Oak Harbor and requires more setup than a basic patch. The process starts with identifying the original texture type: orange-peel, knockdown, or skip trowel. Then Durabond 90 for structural fill on deeper voids, three coats of USG lightweight compound with full dry time between each, and test passes on cardboard before applying to the actual wall surface. Multiple paint layers change the texture's visual profile, so spray pressure and nozzle distance get adjusted until the test patch reads correctly under raking light from the side. Done right, the patch is invisible after prime and two finish coats. Sections with heavily inconsistent texture buildup sometimes need a skim coat across the full wall for a consistent result.

