  - q: "Do I need a permit for flooring installation in Oak Harbor?"
    a: |
      Standard cosmetic flooring replacement — removing old carpet or vinyl and installing LVP, hardwood, or tile over an existing subfloor — does not require a building permit from City of Oak Harbor Community Development. Structural work is a different category: replacing a deteriorated subfloor, sistering floor joists, or modifying framing requires a permit reviewed under the IRC and Washington State Building Code. Island County Building Department handles permits for unincorporated parcels outside city limits; properties inside Oak Harbor city limits go through the city's own building department. TopVolk (WA Licensed Contractor) pulls all required permits and manages the submission process — homeowners don't have to navigate that on their own.

  - q: "Should I use engineered hardwood or solid hardwood in my Oak Harbor home?"
    a: |
      Solid hardwood — 3/4-inch sawn lumber — expands and contracts significantly with the humidity swings Oak Harbor sees every fall and spring as relative humidity climbs past 70%. Engineered hardwood has a real wood veneer (typically 2-4mm thick) bonded over a cross-ply plywood core, which makes it dimensionally stable in the 65-80% RH range typical here from October through May. Over a concrete slab or any subfloor showing elevated moisture on a calcium chloride test (above 3 lbs per 1,000 sq ft per 24 hours), engineered hardwood or glue-down LVP is the right call — solid hardwood will fail under those conditions. Shaw Floors and Bruce both produce engineered products in 2-1/4 and 3-1/4 inch widths that perform reliably in island conditions.

  - q: "What warranty covers flooring installation work in Oak Harbor?"
    a: |
      TopVolk backs installation workmanship — glue lines, nail patterns, transitions, and subfloor prep — for one year from the final walkthrough. Material warranties come separately from the manufacturer: Shaw and Bruce typically carry 25-50 year finish warranties on engineered products, and most LVP lines offer 15-25 year wear warranties based on wear layer thickness (12 mil, 20 mil, or 28 mil). Manufacturer warranties don't cover installation error or moisture damage from a subfloor that wasn't properly tested before the floor went down — which is exactly why the moisture meter readings happen before materials are ordered. Missed project deadlines are covered by penalty clauses written directly into the contract, not just a verbal promise.

