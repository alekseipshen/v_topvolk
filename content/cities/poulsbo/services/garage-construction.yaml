title: "Poulsbo Garage Construction — DADUs, Conversions, Permits"

answer: "TopVolk Construction builds detached and attached garages in Poulsbo, Washington — WA Licensed Contractor, 100+ projects since 2023, quotes in days."

intro: |
  A detached garage in Poulsbo gets designed, permitted, and framed by TopVolk Construction from the first site visit through final inspection — owner Vladislav Volkov runs the job himself, no subcontracted sales rep involved, and the company has completed 100+ projects since 2023 across Kitsap, King, Snohomish, and Pierce counties. Half the driveways in Lemolo and Vinland still have a single-car garage sized for a 1975 Datsun, not a modern pickup or a 24-foot boat trailer parked next to Liberty Bay. Down near Front Street and the waterfront park, lot lines run tight and the Community Development Department cares about roofline and setback before it cares about square footage. A garage built here needs a plan that survives Poulsbo's plan review the first time, not the third. TopVolk pours 4-inch fiber-reinforced slabs, frames with PT lumber at the mudsill, and pre-wires a 50A circuit for a Tesla Wall Connector or ChargePoint charger before drywall goes up — because running conduit after the fact costs more than doing it during rough-in.

localContext: |
  Poulsbo splits into two very different permitting worlds. Inside city limits — the 98370 zip covering downtown, Fjord Drive, and the Bond Road corridor — garage permits route through the City of Poulsbo Community Development Department. Step outside the city line into Keyport (98307) or the unincorporated pockets around Lemolo and Vinland, and the same garage falls under Kitsap County DCD instead, with different setback and lot-coverage rules. Housing stock varies just as much: Scandinavian-style cottages from the early 1900s cluster near Front Street and Liberty Bay, ranch homes from the 1960s-80s sit on wooded half-acre and acre lots off Big Valley Road, and newer builds near Olhava and College Marketplace already meet current energy code. Older lots often run on septic and well, which matters when a garage conversion adds a bathroom or a DADU above adds a kitchen — Kitsap Public Health has to sign off on capacity before the county issues anything. Rain here averages close to 40 inches a year, so footings need to sit below frost depth and slabs need proper drainage away from the foundation, or you get standing water at the overhead door track by December.

commonProblems:
  - title: "DADU Above the Garage — HB 1337 Changed What's Allowed on a Poulsbo Lot"
    description: "WA HB 1337, passed in 2024, lets a single-family lot in Poulsbo carry up to two ADUs — which means a detached garage with a DADU built on top pencils out on lots that couldn't support a second structure before. The framing has to carry that second floor without stealing headroom below: an LVL beam over the garage door opening, PSL posts at the corners, and joist hangers rated for the live load of a full apartment upstairs, not just storage. Height limit for a DADU tops out around 24 feet, so roof pitch and dormers get drawn tight against that ceiling. We run a Mitsubishi mini-split for the unit's heat instead of ducting from the main house, and Milgard windows to hit energy code. End to end, including City of Poulsbo plan review, a garage-plus-DADU runs 4-7 months and $180K-$260K depending on finish level."
  - title: "Converting an Attached Garage Into Living Space Without Cracking the Slab"
    description: "Turning an attached garage into a bedroom or home office sounds simple until someone notices the slab sits four inches below the house's finished floor and slopes toward the overhead door for drainage. Fixing that means a build-up: DriCore subfloor over a vapor barrier, rigid foam, then finish flooring, tied into the rim joist with proper blocking so the new floor doesn't telegraph a step at the threshold. Walls need R-49 in the ceiling if it's under the roof, not leftover garage-grade insulation, and any gas or water line running through has to get inspected before it's buried in drywall. In Lemolo and Vinland, where a lot of these garages sit on post-and-pier from the 1970s, we sometimes sister joists or add a grade beam before the new load-bearing wall goes in. Budget $35K-$65K depending on how much structural work the conversion needs."
  - title: "Setbacks and Roofline Matching Depend on Which Side of the Poulsbo City Line You're On"
    description: "Inside Poulsbo city limits, the Community Development Department wants a garage set back the same distance as the house or further, and if the roofline doesn't match — different pitch, different overhang — plan review kicks the drawings back for revision. Cross into unincorporated Kitsap County around Keyport or the Bond Road corridor and Kitsap County DCD applies its own setback table plus lot-coverage math that folds the garage footprint into FAR calculations. IRC governs the framing either way, but the AHJ signing off on it changes what gets asked for at rough-in inspection. We match Hardie siding profile and reveal to the existing house — most of Poulsbo's newer stock is cement board already, but a few older Front Street-area homes still have cedar shake, which we can match panel by panel. Getting the packet right the first time usually means a 3-6 week plan review instead of 10."
  - title: "What a New Garage Actually Costs in Poulsbo"
    description: "A detached two-car garage in Poulsbo typically runs $55K-$95K; add a DADU on top and it climbs to $180K-$260K; a straight attached-to-living conversion lands lower, around $35K-$65K. What moves the number: slab size and reinforcement (4-inch fiber-reinforced minimum, thicker if it's carrying a lift or heavy tools), how much of the existing siding and roofline needs matching, whether we're pulling a new 50A or 60A circuit for an EV charger and sub-panel, and door specs — an insulated steel door with a quiet-drive LiftMaster opener costs more upfront than a bare-bones panel door but pays back in a workshop that's usable in January. Every quote from TopVolk is line-item, not a range guess, and the contract includes a deadline penalty if we run past the agreed finish date. Call (206) 591-1096 for a free on-site estimate."
  - title: "Insulated Doors, Weatherstripping, and Keeping a Workshop Garage Dry Through a Kitsap Winter"
    description: "Kitsap County sees close to 40 inches of rain a year, most of it between October and May, and a garage door with worn weatherstripping lets water track in under the threshold every time it opens. Insulated doors (we spec 2-inch panels, R-16 or better) cut condensation on the inside face, which matters if the garage doubles as a workshop with tools that rust. North-facing siding — common on garages tucked against the tree line in Vinland — grows moss faster than anything facing south, so we detail Hardie cement board with a rainscreen gap instead of nailing it flush, and CertainTeed roofing with a proper drip edge keeps water off the wall entirely. Expect to replace weatherstripping every 3-5 years and re-caulk trim on that same schedule. A well-built slab and Hardie exterior should outlast the original garage door opener by decades — LiftMaster units typically run 10-15 years before the motor needs replacing."

faq:
  - q: "How fast can you get to Poulsbo for Garage Construction?"
    a: "TopVolk covers Poulsbo as part of the wider Kitsap service area, usually crossing the Agate Pass Bridge off Highway 305 or coming up SR-3 from Bremerton. Site visits for a garage project — measuring the lot, checking setbacks, looking at the existing roofline — typically get scheduled within a week of your call. Access on most Poulsbo lots is straightforward since garages sit at the front of the property, though a few wooded lots off Big Valley Road need a quick walk-through to confirm equipment access before we quote. Call (206) 591-1096 to get a visit on the calendar."
  - q: "What does a detached garage in Poulsbo cost?"
    a: "A basic detached two-car garage in Poulsbo runs $55K-$95K depending on slab size, siding match, and whether we're pre-wiring for an EV charger or workshop power. Add a DADU above it and the number moves to $180K-$260K, since that adds a second floor, plumbing, and a mini-split heating system. Every quote is line-item — slab, framing, siding, electrical, doors — not a single lump-sum guess, and it's free after the on-site visit. Ask for the full breakdown when you call (206) 591-1096."
  - q: "Do I need a permit to build a garage in Poulsbo?"
    a: "Yes — inside city limits the City of Poulsbo Community Development Department requires a building permit for any detached garage over 200 square feet, plus a separate permit if you're adding a DADU under HB 1337. TopVolk prepares the site plan, structural drawings, and energy code forms and submits through the city's portal; plan review usually takes 3-6 weeks for a standard garage and longer for a garage-plus-DADU package. Properties in unincorporated Kitsap County near Keyport or Lemolo go through Kitsap County DCD instead, on its own timeline. TopVolk is a WA Licensed Contractor and handles the whole submittal so you're not the one chasing down redlines."
  - q: "Can you pre-wire my garage for an EV charger during construction?"
    a: "Pre-wiring for an EV charger happens during rough-in, before drywall closes anything up — we run a dedicated 50A or 60A circuit from the panel, or a new sub-panel if the main is already full, straight to the garage wall. That circuit works with a Tesla Wall Connector, a ChargePoint Home Flex, or any Level 2 charger you switch to later. We spec GFCI protection and a breaker sized to the charger's actual draw, not a generic guess. Mention it at the site visit and it goes straight into the line-item quote."
  - q: "How long should a new garage last in Poulsbo's climate?"
    a: "A properly built garage — fiber-reinforced slab, PT lumber at ground contact, Hardie siding with a rainscreen gap — should run 40+ years before any structural work is needed, even with close to 40 inches of rain a year. The garage door and opener wear faster; expect 15-20 years from the door itself and 10-15 from a LiftMaster or Chamberlain opener motor. TopVolk's workmanship is covered under the contract, and manufacturer warranties on doors, siding, and windows pass through to you directly. Weatherstripping and caulking are maintenance items, not defects — plan to redo those every 3-5 years."
  - q: "Do you build garages outside Poulsbo too?"
    a: "TopVolk works across Kitsap, King, Snohomish, and Pierce counties, so Poulsbo jobs often sit on the same schedule as projects in Silverdale, Bremerton, Kingston, and Suquamish. Scheduling windows run 2-4 weeks out for a site visit and quote, sooner if the project already has a survey and site plan ready. Vladislav Volkov runs every job directly — no dispatch center, no commissioned sales rep — so the person quoting your garage is the person building it. Call (206) 591-1096 or ask for a free consultation to get started."