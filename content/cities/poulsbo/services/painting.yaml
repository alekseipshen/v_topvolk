  - q: "Can you help pick exterior colors that work with Poulsbo's light?"
    a: "Yes — Pacific Northwest overcast skies flatten color more than direct sun does, so a swatch that looks warm in a showroom can read gray and flat against Liberty Bay's cloud cover. Color consultations use Sherwin-Williams and Benjamin Moore fan decks with actual light-reflectance values, and TopVolk paints a full test patch on the actual siding, not just a poster board sample, so the homeowner sees it in real morning and afternoon light before committing to five gallons."
  - q: "How long should a repaint last in Poulsbo's climate?"
