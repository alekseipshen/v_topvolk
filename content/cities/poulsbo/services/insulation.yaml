  - q: "What does an attic insulation upgrade cost in Poulsbo?"
    a: "A typical attic top-up to R-49 on a 1,400-1,800 sq ft footprint runs $2,200-$4,500. The exact number depends on whether old batt gets removed or cellulose goes over it. Crawlspace encapsulation with vapor barrier and rigid foam board runs $4,500-$9,000, depending on access and moisture damage found once the crew gets under there. Pricing depends on square footage, material choice, and how much of the old insulation is salvageable versus needing to come out. Every quote comes as a fixed, line-item number after a free on-site look — not a phone estimate."
  - q: "Do I need a permit for spray foam or attic insulation in Poulsbo?"
    a: "Inside city limits, insulation work tied to a remodel routes through the City of Poulsbo permit office. Unincorporated parcels near Keyport and Suquamish go through Kitsap County DCD instead. Standalone attic or crawlspace insulation often doesn't need a separate permit. But closed-cell spray foam near combustion appliances or in unvented assemblies usually does, since it needs an ignition barrier per code. TopVolk Construction is a WA Licensed Contractor and handles that filing directly with the correct AHJ. Standalone insulation permits typically clear in one to two weeks."
  - q: "Blown-in cellulose or fiberglass batt — which is better for my attic?"
    a: "Cellulose fills irregular joist bays and gaps around wiring better than batt. That makes it the better call for older Poulsbo attics with uneven framing near Front Street. Fiberglass batt from Owens Corning or CertainTeed installs faster in open, regular joist spacing and costs a bit less per square foot. Both hit R-49 when installed to the right depth. The real difference is coverage in tight or irregular spaces, not the R-value printed on the bag. TopVolk recommends based on what the attic framing actually looks like, not a default pitch."
  - q: "How long does new insulation last in Poulsbo's climate?"
    a: "Blown cellulose and fiberglass batt settle 15-20% over 15-20 years. Both generally last the life of the house if the attic and crawlspace stay dry. Closed-cell spray foam on rim joists holds its R-value and air seal for 20+ years and doesn't settle at all. The real threat in Kitsap County's wet climate is moisture. A torn vapor barrier or a slow roof leak will ruin insulation faster than age ever will. TopVolk backs its installation work and flags any moisture issues found during the job, not after."
