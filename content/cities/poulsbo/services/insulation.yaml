title: "Poulsbo Insulation — Fix Cold Floors Near Liberty Bay"

answer: "TopVolk Construction upgrades attic, crawl space, and rim joist insulation in Poulsbo, WA — R-49 retrofits, PSE rebates, owner-led since 2023."

intro: |
  A heat pump runs nonstop in a Liberty Bay-view rancher. The thermostat still won't hold 68 degrees on a January night. Nine times out of ten, the attic up there sits at R-19. Washington's state energy code calls for R-49. That gap is the single biggest energy waster in older Poulsbo homes. It shows up as ice-cold bedroom floors. It shows up as a furnace that short-cycles. And it shows up as a power bill that climbs every winter while the house never quite feels warm.

  Down near Front Street, the early-1900s cottages built by Norwegian settlers often have no wall insulation at all behind the lath and plaster. Out toward Vinland and Lemolo, 1970s split-levels usually run fiberglass batt insulation. Decades of attic foot traffic and squirrel activity have flattened most of it. TopVolk Construction is owner-operated by Vladislav Volkov. Since 2023, TopVolk has handled attic, crawl space, and rim joist insulation as part of larger remodel and addition projects across Kitsap County — Owens Corning batt, blown cellulose, closed-cell spray foam, whatever the framing calls for. Call (206) 591-1096 to talk through what's actually sitting in your attic right now.

localContext: |
  Poulsbo's housing stock splits into three clear eras, and each one insulates differently. The 98370 core covers Front Street, Noll Road, and the blocks around American Legion Park. It mixes early-1900s wood-frame cottages with 1960s-80s ranch and split-level homes. Many of those still run original fiberglass batt, sagged or gone moldy wherever a roof leak found it.

  Out toward Keyport (98345), just south along Liberty Bay, the building stock looks similar. But the crawlspaces sit closer to tidal grade. That means more standing moisture and faster vapor barrier failure. Newer construction in the Olhava and Bond Road corridor was built 2000 and later. It generally met Washington State Energy Code (WSEC) insulation minimums at the time. But meeting minimum code and performing well twenty years later aren't the same thing — especially once ductwork gets added or a bonus room gets finished over a garage.

  Kitsap's rainfall runs heavier than Seattle's — often 50+ inches a year. Crawlspace and rim joist moisture control matters as much as R-value here. Insulation work inside Poulsbo city limits goes through the City of Poulsbo permit process. Unincorporated parcels near Liberty Bay's edges fall under Kitsap County DCD instead.

commonProblems:
  - title: "Attic sitting at R-19 or R-30 instead of code-minimum R-49"
    description: "Most Poulsbo attics built before 2010 got insulated to whatever code required back then — usually R-30 or less. That batt has since compressed or shifted off the joists. Washington State Energy Code now calls for R-49 in vented attics. The difference between R-19 and R-49 can run 20-30% higher on winter heating costs alone. The fix is either blowing cellulose over the existing fiberglass batt (cheaper, faster, good for irregular joist spacing) or pulling the old material and starting fresh with Owens Corning or CertainTeed batt plus baffles to keep soffit vents clear. A standard 1,400-1,800 sq ft attic top-up runs about $2,200-$4,500 and takes one to two days once access and baffles are sorted out."
  - title: "Crawlspace vapor barrier torn out from under a waterfront home"
    description: "Homes on the lower streets near Liberty Bay sit closer to tidal grade than the rest of Poulsbo. Crawlspace humidity there is more than regular fiberglass batt can handle. It absorbs moisture, sags off the rim joist, and grows mold within a couple seasons. Full crawlspace encapsulation replaces sagging batt with rigid foam board on the walls, a sealed 10-mil vapor barrier across the ground, and closed-cell spray foam at the rim joist and band joist — that's where most of the air leakage actually happens. This isn't cosmetic. A failed vapor barrier under a house is usually what's behind cold, springy floors and a musty smell in the room above. Encapsulation on an average 900-1,200 sq ft crawlspace runs $4,500-$9,000, depending on access and how much old material has to come out first."
  - title: "Spray foam and permits — what actually requires a permit in Poulsbo"
    description: "Closed-cell spray foam on rim joists and in unvented attic assemblies is one of the best air-sealing moves available. But it also needs a thermal or ignition barrier under most versions of the IRC, and that's exactly the detail an AHJ checks during inspection. Work inside Poulsbo city limits routes through the City of Poulsbo permit desk. Unincorporated addresses near Keyport and Suquamish go through Kitsap County DCD instead, and the requirements aren't identical. TopVolk Construction is a WA Licensed Contractor and pulls the right permit for the right jurisdiction before spray crews show up — no guessing, no stop-work orders mid-project. Insulation-only permits in Kitsap typically clear in one to two weeks. Work folded into a larger remodel follows that project's plan review timeline instead."
  - title: "What insulation upgrades actually cost in Poulsbo, and what changes the price"
    description: "Pricing swings on three things: attic or crawlspace access, whether old material has to be removed first, and material choice. Blown cellulose runs cheaper per square foot than closed-cell spray foam, but foam air-seals as well as it insulates. A straightforward attic top-up with cellulose lands around $1.50-$2.25 per sq ft. Full crawlspace encapsulation with rigid foam and a sealed vapor barrier runs higher, because of the labor involved in tight spaces. Puget Sound Energy offers rebates on qualifying attic and floor insulation upgrades that can knock a few hundred dollars off the total. TopVolk handles that rebate paperwork as part of the job, not as an upsell. Every quote is line-item, not a range, and it's written before any work starts."
  - title: "Knee walls, mineral wool, and when old insulation needs replacing, not topping up"
    description: "1.5-story homes near Lemolo and Vinland — Cape Cod and Dutch colonial styles with finished space tucked under the roofline — almost always have thin or missing insulation behind the knee walls. Builders often skipped that detail to save on framing time. Blown cellulose settles roughly 15-20% over 15-20 years. A home insulated in the early 2000s is likely due for a top-up now, not a full replacement. During remodels where a bedroom sits above a living room, mineral wool (Rockwool or similar) gets stapled between joists purely for sound control. It doesn't add much R-value, but it kills footstep noise and voice transfer between floors. Most insulation upgrades last the life of the house if kept dry. The failure mode is almost always moisture, not the material wearing out."

