title: "Poulsbo Plumbing — Repiping Liberty Bay's Older Homes"

answer: "TopVolk Construction folds plumbing repiping and fixture work into Poulsbo remodels — WA Licensed Contractor, 100+ projects completed since 2023."

intro: |
  TopVolk Construction folds plumbing rough-in and repipe work into remodel and addition projects across Poulsbo, from Front Street cottages near Liberty Bay to newer builds off Bond Road by Olhava. A lot of the older housing stock downtown went up fast — the Navy built roughly 300 units for shipyard workers in the early 1940s, and much of that original galvanized supply piping is still buried in the walls eight decades later. Pull a permit for a kitchen remodel near Fish Park and the inspector will flag corroded galvanized line before it fails on its own. Same story with a Rinnai tankless conversion during a bath remodel: somebody has to size the gas line and set the venting correctly before drywall goes back up, and that's plumbing scope TopVolk handles directly, not a sub nobody vets. Vladislav Volkov walks the crawlspace himself before writing the quote.

localContext: |
  Poulsbo's 98370 zip code covers everything from the Front Street waterfront to the Bond Road corridor near Olhava, and we also pick up plumbing scope on remodels just outside city limits in 98383 Silverdale and 98392 Suquamish addresses. Downtown and the streets climbing up from Liberty Bay still have a good number of 1940s shipyard-worker cottages with original galvanized steel supply lines and cast iron DWV — Kitsap's damp crawlspaces don't do that pipe any favors over 80 years. Head out toward Olhava or Noll Road and the housing skews 1980s-90s tract, which means polybutylene supply line and gray acetal fittings are still hiding behind the drywall in some of those kitchens and baths. Permits for in-city work run through City of Poulsbo Community Development; a few pockets like Lemolo and Keyport sit in unincorporated Kitsap County and fall under Kitsap County DCD instead, which changes the plan review timeline. Either way, water heater swaps and repipes tied to a remodel need seismic strapping under WA code, and we write that into the rough-in before the inspector ever shows up.

commonProblems:
  - title: "Galvanized Supply Lines in Poulsbo's 1940s Shipyard Cottages"
    description: "A lot of the cottages the Navy built near downtown Poulsbo in the early 1940s still run on original galvanized steel supply pipe, and by now the inside diameter is choked down with rust scale — tuberculation, not just surface corrosion. Water pressure drops room to room, and where that galvanized pipe meets a newer copper fitting, the dielectric union usually corrodes fastest. During a bath remodel near Fish Park, we typically cut the galvanized out wall by wall and run PEX-A back to a Moen shut-off valve at each fixture, sistering in copper stub-outs where code requires. A full-house repipe folded into a remodel runs $6,500-$12,000 depending on fixture count and crawlspace access, and adds three to four days to the rough-in schedule."
  - title: "Polybutylene Repipes in Bond Road and Olhava-Area Homes"
    description: "Homes built through the 1980s and into the early '90s around Olhava and the Bond Road corridor often have polybutylene supply pipe, and the gray acetal crimp fittings on that system are the actual failure point — they get brittle and split, usually behind a wall you can't see until there's a stain on the ceiling below. Insurance companies know poly-B by name and some won't renew a policy until it's gone. When we're already opening walls for a kitchen remodel, swapping poly-B for PEX-B with copper crimp rings and setting new Kohler or Delta valves at the sink and dishwasher line adds relatively little labor since the drywall's already open. Doing it during the remodel costs far less than an emergency repipe after a fitting lets go at 2 a.m."
  - title: "Water Heater Swaps and Seismic Strapping — What City of Poulsbo Requires"
    description: "Washington code requires a permit for any water heater replacement, tank or tankless, and City of Poulsbo Community Development wants seismic strapping specified on the plan before they'll sign off — two straps, upper and lower third of the tank, anchored to framing, not just drywall. Houses on a pressure-reducing valve, common on the hillside lots above Liberty Bay, also need a thermal expansion tank on the cold side under code. Converting to a Rinnai or Navien tankless unit during a remodel usually means upsizing the gas line — 1/2-inch CSST often has to go to 3/4-inch to feed the higher BTU draw — and that gets checked at rough-in inspection along with everything else. We pull the permit ourselves and schedule the inspection around the remodel timeline, so plumbing isn't what holds up drywall."
  - title: "Rerouting Drain Lines for a Kitchen Island or Basement Bath"
    description: "Add a kitchen island sink or a basement bathroom to a Poulsbo remodel and the drain line has to get back to the DWV stack somehow, and that's usually the line-item that surprises people on the estimate. If the run is long, we'll spec an AAV — a Studor-style air admittance valve — under the island cabinet instead of cutting a vent path through the roof, which code allows in most cases and saves real money. A basement bath under a crawlspace-foundation cottage is more straightforward than one under a slab, where we're coring concrete for the new P-trap and cleanout. Cost on this piece of a remodel runs $2,800-$7,500 depending on distance to the stack and whether we're cutting slab, quoted as its own line item rather than folded into a vague allowance."
  - title: "Pressure Regulators and Water Heater Lifespan on Poulsbo's City Water"
    description: "Parts of Poulsbo up the hill from Liberty Bay run city water well above 80 psi, and without a pressure-reducing valve at the main, that pressure shortens the life of everything downstream — supply lines, the wax ring at the toilet, the solenoid in a dishwasher. We check static pressure on every remodel walkthrough and install a PRV set to 60-70 psi where it's missing, paired with an expansion tank since that's required once the system becomes a closed loop. A standard 50-gallon tank water heater — Whirlpool and GE units are common at this price point — lasts 8 to 12 years, less if sediment builds up from never being flushed. A Rinnai or Navien tankless unit runs 15-20 years with an annual descale, worth factoring in when we're pricing a water heater swap into a bigger remodel."

faq:
  - q: "How fast can you get to Poulsbo for Plumbing?"
    a: "Kitsap County is part of our regular Seattle Metro service area, and getting to Poulsbo means Hwy 3 through Silverdale or Hwy 305 across the Agate Pass Bridge from Bainbridge Island — usually 45 minutes to an hour from other job sites. Plumbing scope on a Poulsbo project gets scheduled around a free on-site consultation, where Vladislav walks the crawlspace or existing bath layout himself before anything gets quoted. Since this is project-based remodel work, not an emergency truck roll, we typically get a consultation on the calendar within a week. Call (206) 591-1096 to get a date set."
  - q: "What does a whole-house repipe cost in Poulsbo?"
    a: "A whole-house repipe folded into a remodel in Poulsbo typically runs $6,500-$14,000, depending on square footage, fixture count, and whether we're working through walls already opened for the remodel or fishing PEX through finished ones. Older Front Street cottages with crawlspace access price lower than a two-story Olhava-area home built on a slab. Fixture swaps alone, like a Kohler or Delta valve replacement during a bath remodel, run closer to $400-$900 per fixture installed. We give a line-item quote after the free on-site walkthrough, not a phone guess — call (206) 591-1096 to schedule one."
  - q: "Does City of Poulsbo require a permit for repiping or water heater replacement?"
    a: "Yes — City of Poulsbo Community Development requires a permit for water heater replacement and for repiping beyond simple fixture swaps, with plan review generally running one to three weeks for residential remodel scope. Addresses in unincorporated Kitsap County, like parts of Lemolo or Keyport, fall under Kitsap County DCD instead, and that timeline can run a little longer. TopVolk is a WA Licensed Contractor and pulls the permit as part of the project, scheduling rough-in and final inspection so plumbing doesn't stall the rest of the job. We build that review time into the schedule up front, with a deadline penalty written into the contract if we're the cause of any delay."
  - q: "Can you convert my tank water heater to tankless during a remodel?"
    a: "Yes, and the gas line is usually the part people don't budget for — going from a 40-gallon tank to a Rinnai or Navien tankless unit often means upsizing the CSST from 1/2-inch to 3/4-inch to feed the higher BTU input, plus adding a condensate drain and concentric vent through the wall or roof. We size that during the design phase of the remodel, not after the unit shows up, so there's no surprise change order. Expect the swap itself to take about a day once the gas line and venting are roughed in, usually sequenced with the rest of the bath or kitchen work."
  - q: "How long will new plumbing last in a Poulsbo home?"
    a: "PEX-A and copper repipe work is warrantied for three years on workmanship, and the materials themselves are rated for 50-plus years under normal residential pressure. Kitsap's rain — around 37 inches a year — doesn't touch interior supply lines, but it does affect crawlspace humidity, which is why we pair any repipe with a proper vapor barrier if the existing one's degraded or missing. Fixtures like Moen and Kohler carry their own manufacturer warranties, typically limited lifetime on the valve cartridge. Tankless units run 15-20 years with annual descaling; tank water heaters run 8-12 years before sediment buildup starts costing efficiency."
  - q: "Do you work outside Poulsbo too?"
    a: "Poulsbo sits inside our regular Kitsap County coverage, along with Silverdale, Bremerton, and Suquamish, and we run the same scheduling across the rest of the Seattle Metro area — King, Snohomish, and Pierce counties too. Plumbing scope on a Poulsbo remodel gets handled the same way as anywhere else: free on-site consultation first, then a line-item quote with a firm start date. Most remodel projects here book three to six weeks out depending on the season. Call (206) 591-1096 or ask for a consultation date when you reach out."