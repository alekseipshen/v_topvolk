title: "Poulsbo Bathroom Remodel — Old Navy-Town Ranchers, Fixed Right"

intro: |
  Liberty Bay sits a block from downtown 98370, but the houses fanning out along Viking Avenue NE and up toward Finn Hill tell a different story than the waterfront. Most of them are 1970s–1990s ranchers and split-levels built when Kitsap County was filling in fast with Navy families and commuters. Builder-grade Moen faucets, fiberglass tub surrounds, and no Schluter Kerdi waterproofing behind the tile — that's the standard setup. Vladislav Volkov, WA Licensed Contractor, has remodeled 100+ projects since 2017 with direct owner involvement on every one.

localContext: |
  The bulk of 98370's residential stock went up between 1972 and 1995, clustered off Highway 3 and Noll Road NE. Those ranchers share a common profile: galvanized drain stacks showing rust staining at the fixtures, 4-inch ceramic tile surrounds set in drywall with zero vapor barrier, and 50 CFM exhaust fans that terminate in attic insulation. Kitsap Peninsula's wet season runs October through May — that's seven months of elevated humidity hitting every weak joint in a 30-year-old bathroom. Permits for in-city work go through the City of Poulsbo Community Development Department; unincorporated parcels nearby fall under Kitsap County DCD.

commonProblems:
  - title: "Well Water Mineral Buildup Killing Kohler and Moen Cartridges"
    description: "Kitsap County well water runs high in iron and manganese. Both eat through chrome plating and clog the ceramic disc cartridges inside Kohler and Moen pressure-balance valves in 3–5 years instead of the standard 15. Swapping fixtures without addressing source water just resets the clock. We spec filter-compatible rough-in configurations and use bronze or PVD finish trim that actually holds up here."
  - title: "Greenboard Substrate Behind 1980s Tile — No Waterproofing at All"
    description: "Builder installs in 98370 used standard drywall or greenboard behind tub surrounds — no RedGard membrane, no Schluter Kerdi, just paper-faced gypsum. After 30-plus wet winters, that substrate turns soft. Demo almost always reveals black mold, rotted blocking, and compromised rim joist framing at the tub deck line. Cement board backer and a full liquid membrane go in before any new tile touches the wall."
  - title: "50 CFM Exhaust Fans Ducted Into Attic Insulation"
    description: "Original exhaust fans in these Poulsbo ranchers typically terminate inside the attic cavity — no exterior cap, no rigid duct, just flex hose stuffed between joists. That dead-end exhaust saturates roof framing with moisture from October through April. Upgrading to a 110 CFM Broan or Panasonic WhisperCeiling fan with a proper exterior duct run and backdraft damper stops the mold cycle at the source rather than just repainting over it."

faq:
  - q: "How fast can you get to Poulsbo for a bathroom remodel consultation?"
    a: "Vladislav takes the Hood Canal Bridge route or comes through Bremerton depending on traffic — Poulsbo is typically 60–90 minutes from Seattle. Call (206) 591-1096 to schedule a free on-site walk-through. You get the contractor on the phone, not an office coordinator."
  - q: "Do you work with Kohler, Moen, and Delta bathroom fixtures in Kitsap County?"
    a: "Yes. Most 98370 master baths have Kohler or Moen pressure-balance rough-in that's still usable if the layout stays put. Delta single-handle valves are common in 1990s builds here too. Matching replacement specs to existing rough-in dimensions keeps demo scope tight and avoids unnecessary wall tear-out."
  - q: "What does a full bathroom remodel cost in Poulsbo and how long does it take?"
    a: "A full gut-and-replace in 98370 — curbless shower with large-format porcelain, new vanity, fixture swap, and proper Schluter waterproofing — typically runs $32K–$65K depending on tile selection and whether drain lines need rerouting. Permitting through Poulsbo Community Development takes 2–4 weeks. Total project: 5–8 weeks. Deadline penalty is written into the contract. Call (206) 591-1096 for a line-item quote."