  - q: "What does foundation crack repair cost in Poulsbo?"
    a: |
      Epoxy injection on an active stem wall crack runs $450-$1,200 per crack, depending on length and whether hydrostatic pressure requires added drainage work. Full pier leveling and post-and-pier repair on an older bungalow typically lands between $6,000 and $18,000. Pricing depends on crawlspace access, soil conditions, and how much of the foundation is affected. TopVolk gives a written line-item quote after walking the crawlspace in person — not a phone estimate. Call (206) 591-1096 for a free on-site walkthrough.
  - q: "Do I need a permit for foundation repair in Poulsbo?"
    a: |
      Most structural foundation work needs a permit — pier replacement, seismic retrofit, new footings, all of it. Inside city limits, that goes through the City of Poulsbo Community Development office. Homes on unincorporated Kitsap County land off Big Valley Road or similar areas route through Kitsap County DCD instead. Plan review typically runs 2-4 weeks for standard crawlspace work, longer if a geotech letter is required. TopVolk Construction is a WA Licensed Contractor and handles the permit application and inspection scheduling as part of the job.
  - q: "Post-and-pier vs helical piers — which does my Poulsbo home need?"
    a: |
      If the crawlspace has decent access and settlement is under 2 inches, replacing individual pier footings with new concrete and leveling the existing post-and-pier grid is usually enough. Helical piers come into play when soil is soft or saturated near a slope, or when a footing has failed and needs to reach deeper load-bearing soil. That's common on hillside lots near Liberty Bay. A soils assessment during the free estimate determines which approach fits. The quote reflects that specific fix, not a generic package.
  - q: "How long does a foundation repair last in Poulsbo's climate?"
    a: |
      Pier and footing work carries a workmanship warranty. Materials like Simpson Strong-Tie hardware and PT lumber sills are rated for ground-contact exposure, so the structural fix itself should outlast the house. What fails first is usually drainage. A sump pump or French drain needs periodic maintenance, given how much rain Kitsap County gets October through May. TopVolk explains the maintenance schedule at handoff, so the repair doesn't need redoing in five years just because water wasn't managed.
