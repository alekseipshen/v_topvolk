title: "Poulsbo Foundation Repair — Hillside & Waterfront Fixes"

answer: "TopVolk Construction repairs settling post-and-pier foundations in Poulsbo, WA — epoxy crack injection, sump pumps, seismic retrofits, most jobs 1-3 weeks."

intro: |
  A cracked stem wall under a 1948 bungalow near downtown Front Street usually starts small — a hairline in August. By the following spring rains, it's a quarter-inch gap. That's the pattern TopVolk Construction sees across Liberty Bay and the Olhava corridor. Older homes here sit on post-and-pier crawlspaces, and Kitsap County's clay-heavy soil swells and drains hard through the wet season, so they settle. Vladislav Volkov, the owner, has pulled up vapor barriers in Poulsbo crawlspaces and found rotted mudsills and sistered joists nobody permitted. He's also found sump pumps — usually a tired Zoeller unit wired straight into a GFCI outlet, no battery backup — that quit the first time the power flickered during a January windstorm off the Sound. Settlement here isn't cosmetic. It's a structural problem tied to soil, drainage, and code compliance. TopVolk Construction LLC has handled foundation and crawlspace work across Kitsap County since 2017. Vladislav works directly with the homeowner, from the first crawlspace inspection through final permit sign-off — no sales team in between.

localContext: |
  Poulsbo's housing stock splits pretty cleanly by elevation and decade. Down near the waterfront on Front Street and around Liberty Bay, expect cottages and bungalows from the 1930s-50s. Most sit on post-and-pier foundations, many untouched since the original build. No mudsill bolting. Minimal blocking. Cripple walls framed before anyone in this part of Kitsap County thought about seismic bracing. Head up the hill toward Olhava and the Bond Road corridor, and the stock gets newer. Think 1970s-80s ranches on poured concrete stem walls, plus 2000s-era homes near Poulsbo Village built to modern IRC seismic bracing standards. Even those newer homes can see hydrostatic pressure where a lot backs up to a slope. Zip code 98370 covers most of the city itself. Crews also run out toward 98346 (Kingston) and 98392 (Suquamish) for North Kitsap jobs on the same trip. Foundation work inside city limits routes through the City of Poulsbo Community Development permit center. Anything on unincorporated county land off Big Valley Road or Nolls Landing goes through Kitsap County DCD instead. Either way, expect a soils note or geotech letter once settlement passes an inch.

commonProblems:
  - title: "Post-and-Pier Settlement Under Liberty Bay Bungalows"
    description: |
      Older Poulsbo homes near the waterfront sit on isolated concrete piers instead of a continuous footing. After 70-80 years, those piers shift unevenly as the ground around Liberty Bay saturates every winter. The floor develops a bounce. Doors stop latching. A level across the kitchen floor often shows a 2-3 inch drop toward the low corner. The fix is usually new concrete footings or helical piers driven to load-bearing soil, then leveling and shimming the existing post-and-pier grid with Simpson Strong-Tie post bases and hardware. Most jobs run $6,000-$18,000, depending on how many piers need replacing and how tight the crawlspace access is. Timeline is typically 5-10 working days once the permit clears.
  - title: "Foundation Cracks From Kitsap's Clay Soil and Wet Winters"
    description: |
      Concrete stem walls on Bond Road and in the Olhava area crack for a simple reason: clay soil expands during the wet months, then pulls back in late summer. That cycle puts real stress on the pour. A hairline crack lets water track through by the second winter, staining the crawlspace floor and softening the rim joist above it. TopVolk seals active cracks with Sika epoxy injection, which bonds the concrete back into one structural piece instead of just patching the surface. For cracks under hydrostatic pressure, a curtain drain gets tied in alongside the injection so groundwater stops re-loading the wall. Cost runs $450-$1,200 per crack, depending on length and whether drainage work gets bundled in.
  - title: "Seismic Retrofit Requirements for Pre-1980 Poulsbo Homes"
    description: |
      Homes built before 1980 in Poulsbo rarely have their mudsill bolted to the foundation. Cripple walls under 4 feet tall usually lack any plywood shear bracing at all. Both are gaps under current WA seismic code. Retrofit work adds anchor bolts or foundation plates every 4-6 feet along the mudsill, then nails structural plywood to the cripple wall studs to resist lateral movement. Inside city limits, this requires a permit through the City of Poulsbo Community Development office. Plan review usually takes 2-4 weeks for a straightforward retrofit, longer if the AHJ requests engineering. TopVolk Construction is a WA Licensed Contractor and pulls the permit as part of the job — not an add-on fee. Retrofits typically run $4,000-$9,000 for an average crawlspace.
  - title: "What Drives the Cost of Foundation Repair in Poulsbo"
    description: |
      Pricing swings on four things. Crawlspace access is the first — a 24-inch clearance under a 1940s cottage costs more labor than an open 4-foot crawlspace. Second is how many piers or footings need replacing. Third is whether drainage work gets bundled in. Fourth is whether a geotech letter is required for the permit. Small crack injection and spot leveling starts around $2,500. Full crawlspace pier replacement with seismic retrofit and a French drain can run $15,000-$25,000+ on a larger waterfront lot. TopVolk quotes with line-item pricing after an on-site walkthrough, not a vague per-square-foot guess. The contract includes a written deadline with a penalty clause if TopVolk misses it. Call (206) 591-1096 for a free on-site estimate with Vladislav directly — not a commissioned sales rep.
  - title: "Sump Pumps, French Drains, and Crawlspace Moisture Control"
    description: |
      A foundation repair holds up only as long as the water gets managed afterward. Poulsbo sees roughly 50+ inches of annual rain, and a lot of it pushes toward the crawlspace. Zoeller sump pumps with battery backup handle intermittent water intrusion. A perforated French drain tied to daylight or a dry well handles chronic seepage along a slope-facing wall. Vapor barrier under the crawlspace should get replaced every 10-15 years, sooner if it's torn or compressed from foot traffic during prior repairs. Sump pump systems run $1,800-$3,500 installed. French drains run $40-$70 per linear foot, depending on depth and soil conditions. Skipping this step is the most common reason a repaired foundation cracks again within five years.

