title: "Poulsbo General Contracting — Kitsap Peninsula Remodels & Permits"

intro: |
  Old Town Poulsbo — the Scandinavian waterfront blocks along Front Street — sits just
  downhill from residential streets packed with 1950s and 1960s ranchers that have
  never been touched since original construction. Full renovation work up here means
  pulling permits through Kitsap County's Department of Community Development, dealing
  with original post-and-pier foundations, and coordinating MEP rough-ins for modern
  appliance layouts. A homeowner adding a KitchenAid range with a dedicated 240V
  circuit into a 1962 kitchen isn't just swapping a unit — that's an electrical panel
  upgrade, a new rough-in, and a permit inspection before the wall goes back up.

localContext: |
  The 98370 zip covers most of Poulsbo — from the dense older blocks near Liberty Bay
  up through the subdivisions along Bond Road and Finn Hill Road built in the 1980s
  and 1990s. Homes near downtown date to the 1940s–1960s and commonly have knob-and-
  tube wiring in the oldest sections, galvanized supply lines, and single-pane windows
  that make hitting modern energy codes on a remodel expensive. Newer tracts east of
  Highway 305 are structurally sound but builder-grade throughout — dated laminate
  cabinets, hollow-core doors, the full 1990s package. Both housing generations have
  their own renovation cost profile.

commonProblems:
  - title: "Kitsap County DCD Plan Review Adding Months to Renovation Timelines"
    description: "Structural work in Poulsbo — removing a load-bearing wall, adding an LVL
      beam to open a kitchen to a living room, or any addition over 200 square feet —
      requires stamped engineering drawings and a full plan review through Kitsap County
      DCD. Budget 4 to 8 weeks for that window before a shovel touches dirt. Homeowners
      who skip the permit to save time end up with a stop-work order, unpermitted work
      flagged at resale, and lenders who won't close on the property."

  - title: "Demo Day Surprises in 1960s Liberty Bay-Area Ranchers"
    description: "Pull drywall on a 1962 rancher near the Liberty Bay waterfront and you'll
      commonly find failed vapor barriers in the crawlspace, wet framing from years of
      condensation, and sister joists nailed in informally decades ago. PT lumber
      replacements, rim joist repairs, and proper blocking all land outside the original
      project scope. Standard contingency on homes this age is 10–15% of the hard cost
      budget — not a worst-case number, a realistic one."

  - title: "Multi-Trade Sequencing Breaking Down Without a General Contractor"
    description: "Poulsbo homeowners managing their own remodel hit the same wall: rough-in
      inspection has to clear with Kitsap County DCD before drywall goes up, drywall
      has to cure before tile, and a missed inspection appointment pushes every trade
      behind it. Electricians don't wait for plumbers. Plumbers don't hold dates for
      tile setters. A general contractor owns the schedule — and absorbs the
      coordination cost so it doesn't fall on the homeowner."

faq:
  - q: "How do permits work for a major renovation in Poulsbo?"
    a: "Poulsbo falls under Kitsap County DCD for structural permits, additions, and
      ADUs under WA HB 1337. Full plan review runs 4–8 weeks for projects with
      engineering drawings. We handle the application, coordinate with the AHJ, and
      schedule rough-in and final inspections. Call (206) 591-1096 to go over your
      project scope — Vladislav can tell you in the first conversation what requires
      a permit and what doesn't."

  - q: "What materials and brands do you work with on Poulsbo renovations?"
    a: "For exterior work, Hardie cement-board siding handles the Kitsap Peninsula rain
      season better than wood alternatives — no rot, no warping from the 37-plus inches
      of annual rainfall. On mechanical, Mitsubishi mini-split systems are common in
      Poulsbo additions where ducted HVAC isn't practical. Interior finishes: Milgard
      windows, Schluter Kerdi waterproofing in bathrooms, quartz countertops, and
      appliance rough-ins for KitchenAid, Bosch, and GE configurations."

  - q: "What's a realistic timeline for a full renovation project in Poulsbo?"
    a: "A full kitchen gut-and-rebuild runs 6–10 weeks once permits clear. A bathroom
      with a new curbless shower, large-format porcelain tile, and a Moen or Kohler
      fixture package is 4–6 weeks. An addition or DADU under the 2024 WA HB 1337
      statewide ADU law — separate utility connection, full structural build — runs
      4–7 months end-to-end including Kitsap County DCD plan review. Schedule a free
      on-site consultation at (206) 591-1096. Vladislav comes out personally — not a
      commissioned closer running a sales script. Deadline penalties are written into
      the contract."