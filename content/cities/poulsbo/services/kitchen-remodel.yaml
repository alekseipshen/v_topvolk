title: "Poulsbo Kitchen Remodel — Open Layouts for Liberty Bay Homes"

intro: |
  The ranchers and split-levels up the hill from downtown Poulsbo — out toward Viking
  Avenue NW and the residential streets behind Liberty Bay — were built when a 30-inch
  range and a wall between the kitchen and living room were standard. That layout doesn't
  work for how most households cook today. A Bosch dishwasher won't fit the original
  rough-in, and a 100-amp panel won't run an induction range without an upgrade. Vladislav
  Volkov has remodeled kitchens in 98370 since 2023 — WA Licensed Contractor, 100+ projects
  completed.

localContext: |
  Poulsbo's 98370 zip code covers housing built mostly between the 1960s and 1980s, with
  some older craftsman-era homes near the historic downtown waterfront. These houses share
  the same structural fingerprint: load-bearing walls between the kitchen and main living
  area, 100-amp electrical services, and galvanized plumbing. Moisture off the inlet is a
  constant — crawlspaces under older homes near Liberty Bay often need vapor barrier work
  before any kitchen renovation starts.

commonProblems:
  - title: "Load-bearing wall removal for open-concept layouts in mid-century ranchers"
    description: |
      The wall between the kitchen and dining room in most 1960s-70s Poulsbo ranchers carries
      roof or floor load. Removing it requires an LVL beam sized to the span, PSL posts at
      each end, and a permit from Kitsap County DCD. Plan review typically runs 3-6 weeks.
      Skipping the structural analysis is how you get a sagging ceiling 10 years later.
  - title: "Undersized electrical panels that can't support modern kitchen loads"
    description: |
      A KitchenAid refrigerator, induction range, and built-in microwave together exceed what
      a 1970s 100-amp service was designed to handle. Upgrading to a 200-amp panel requires a
      Kitsap County DCD electrical permit, rough-in inspection, and coordination with Puget
      Sound Energy for the service entrance. That work adds 2-3 weeks to the timeline and
      happens before appliance rough-in.
  - title: "Drop soffits and dark oak finishes dating 1980s kitchens"
    description: |
      Soffits above cabinets in older Poulsbo homes eat 12-14 inches of ceiling height and
      often hide outdated wiring from the original build. Removing them means reframing,
      then drywall hang, tape, and mud before semi-custom cabinets go up. Pairing full-height
      uppers with a quartz countertop transforms the same footprint without touching the
      footprint itself.

faq:
  - q: "How fast can you get to Poulsbo for Kitchen Remodel?"
    a: |
      Poulsbo is a regular Kitsap County job site — we're in 98370 multiple times a month.
      Getting there from the east side typically means the Bainbridge Island ferry or the
      Hood Canal Bridge. Call (206) 591-1096 to schedule a free on-site walkthrough with
      Vladislav directly.
  - q: "Which appliance brands do you typically spec in Poulsbo kitchen remodels?"
    a: |
      Most Poulsbo kitchens we remodel get KitchenAid, Bosch, or GE Profile appliances —
      mid-range brands that fit the budget. Rough-in dimensions differ by brand, so appliance
      selection happens early. Gas line modifications and dedicated circuits are handled as
      part of the project scope, not as add-ons later.
  - q: "What does a full kitchen remodel cost in Poulsbo, and how long does it take?"
    a: |
      Full kitchen remodels in Poulsbo typically run $45K-$120K depending on structural work,
      cabinet grade, and appliance selection. Construction takes 6-10 weeks; add 3-6 weeks
      for Kitsap County DCD plan review if load-bearing walls or electrical upgrades are
      involved. Deadline penalties are written into the contract. Call (206) 591-1096 for a
      line-item quote.