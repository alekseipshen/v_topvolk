  - q: "Does my Poulsbo home addition need a permit through the city or the county?"
    a: "It depends on the parcel. Homes inside Poulsbo city limits — most of the 98370 core near downtown and Liberty Bay — go through the City of Poulsbo Community Development Department, with plan review typically running 4-8 weeks for a standard addition. Properties out on Finn Hill, Lincoln Hill, or toward Vinland often sit in unincorporated Kitsap County, where Kitsap County DCD handles the application instead, and DADU permits under WA HB 1337 there also require septic approval from Kitsap Public Health District. TopVolk Construction, a WA Licensed Contractor, prepares the site plan, structural drawings, and application paperwork for either jurisdiction and tracks the review through to final inspection."
  - q: "Can I add a DADU if my lot is on a septic system?"
    a: "Usually yes, but the drainfield has to be evaluated first. Kitsap Public Health District requires proof the existing septic system — or a new one — can handle the added bedroom and bathroom count before a DADU permit gets approved. TopVolk Construction pulls the septic as-built and, where capacity falls short, coordinates with a septic designer on an engineered upgrade or a separate system for the DADU. This step typically adds a few weeks to the front end of the timeline, but skipping it is the single most common reason DADU permits stall in Kitsap County."
  - q: "What's covered under warranty on a Poulsbo addition, and how long does the work last?"
    a: "TopVolk Construction backs structural work and workmanship on every addition, with manufacturer warranties passed through on top of that — Hardie siding carries a 30-year finish warranty, and a Mitsubishi mini-split typically runs 10-12 years on parts before service is needed. PNW rain is the real durability test here: roughly 37 inches a year means flashing, ledger board connections, and roofline tie-ins get extra attention so water doesn't find its way behind the new siding. Cedar trim needs refinishing every 5-7 years to keep up with moss and weathering; Hardie board needs less. Deadline penalties are written into the contract too, so delays cost TopVolk, not the homeowner."
