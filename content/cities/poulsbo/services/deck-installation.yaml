title: "Poulsbo Deck Installation - Built for Kitsap Rain and Salt Air"

intro: |
  Liberty Bay sits within a few blocks of most of 98370's older neighborhoods, and that salt-humid air off the water accelerates wood decay faster than people expect. Homes along Hostmark Street and out toward Olhava have been adding outdoor living space for years. The Kitsap Peninsula averages over 45 inches of rain annually, and a deck built without proper ledger flashing and ground-contact PT lumber will not hold up a decade here. TopVolk Construction, owner-operated by Vladislav Volkov, has completed 100+ projects across King, Snohomish, Pierce, and Kitsap counties since 2023.

localContext: |
  Poulsbo's residential stock splits between older homes near downtown — some Craftsman-era construction dating to the 1910s and 1920s — and 1980s-to-2000s suburban development spreading east toward NW Finn Hill Road. The older homes in the 98370 core often have post-and-pier foundations with narrow rim joist access, which complicates ledger board attachment. Newer builds in Olhava and Vinland have solid framing but tighter lot setbacks, and Kitsap County's building department enforces those setback rules carefully during plan review.

commonProblems:
  - title: "Cedar Decking Does Not Survive Kitsap Winters Without Real Maintenance"
    description: |
      North-facing decks in Poulsbo develop moss and mildew by November — sometimes earlier. Untreated cedar can start cupping and checking within three to four seasons under that constant moisture load. Trex and TimberTech composite decking skip the annual staining cycle entirely and resist the mildew buildup that plagues natural wood from October through May. Composite costs more upfront; in this climate, the break-even is typically around year six or seven.

  - title: "Ledger-to-Rim-Joist Connection Without Flashing Causes Hidden Rot"
    description: |
      A ledger board attached directly to the rim joist with no Z-flashing or drainage gap traps water against the house framing. In Kitsap's wet winters, that moisture wicks into the band joist over two or three seasons — invisible until the wood is soft enough to probe with a screwdriver. Kitsap County requires a ledger flashing inspection before deck framing proceeds, and for good reason. Skipping it voids the permit and leaves structural rot behind the siding.

  - title: "Post Footings Dug Too Shallow for Sloped Lots"
    description: |
      Poulsbo lots near the water commonly slope toward the bay, which means post loads are not purely vertical — there is a lateral component that undersized footings cannot resist. Footings need to reach frost line, minimum 12 inches in Kitsap County and typically 18 inches on any slope, poured with adequate bearing area using Sonotube forms. Ground-contact posts require PT lumber rated UC4B for direct burial. Standard UC2-rated PT lumber sold at most hardware stores is not code-compliant for in-ground deck posts.

faq:
  - q: "How fast can you get to Poulsbo for Deck Installation?"
    a: |
      Poulsbo is about 45 minutes from Seattle via the Bainbridge Island ferry, or roughly an hour via the Kingston-Edmonds route depending on sailings. Vladislav schedules Kitsap County consultations weekly — no ferry wait on your end. Call (206) 591-1096 to set a day.

  - q: "What deck materials hold up best in Poulsbo's wet climate?"
    a: |
      Trex Transcend and TimberTech Azek are the two composite lines that perform consistently here. Neither absorbs the October-to-May rainfall that splits and grays cedar boards within a few seasons. Clear vertical-grain Douglas-fir works too, but it needs proper sealing every one to two years without exception — most homeowners underestimate that commitment.

  - q: "How does the permit process work for a new deck in Poulsbo?"
    a: |
      Most of Poulsbo falls under Kitsap County's Department of Community Development for building permits. Plan review on a standard deck permit typically runs four to eight weeks. Vladislav handles the permit application as part of the project scope — you are not chasing the county on your own. Deadline commitments are written into the contract, with penalties paid if we miss them. Call (206) 591-1096 to discuss scope and get a line-item quote.