  - q: "What does finishing a basement in Poulsbo cost?"
    a: "Most jobs run $45,000 to $85,000 for a 700 to 900 square foot space with a bedroom and bathroom. A simple rec room with no plumbing changes can come in under $30,000. Waterproofing scope, ceiling height fixes, and an egress window requirement all move the number. TopVolk has completed 100+ projects since 2023 across Kitsap, King, Snohomish, and Pierce counties. Every quote is line-item pricing, not a range. A free on-site consultation gets you an exact number before any contract gets signed."
  - q: "Do I need a permit to finish a basement in Poulsbo?"
    a: "Yes, if the scope includes a new bedroom, bathroom, egress window, or structural changes to joists or beams. The City of Poulsbo's building department requires plan review and inspections at rough-in and final. Cosmetic work in an already-dry, already-framed basement sometimes skips full permitting, but it's worth checking before demo starts. As a WA Licensed Contractor, we pull permits directly and manage the inspection schedule so the job doesn't stall waiting on paperwork. Typical plan review takes two to four weeks depending on the city's queue."
  - q: "What subfloor works best in a damp Poulsbo basement?"
    a: "DriCore subfloor panels are standard for basements here. The raised air gap underneath keeps moisture from wicking up into flooring even if the slab sweats during a wet winter. That's a better call than laying plywood or engineered flooring straight on concrete, especially in a basement without a proven vapor barrier already in place. Large-format porcelain tile is the other common choice for a basement bathroom floor, paired with a Schluter Kerdi system for a curbless shower. We'll walk through options during the free estimate based on how the specific basement tests for moisture."
  - q: "What's the warranty on basement waterproofing work?"
    a: "Perimeter drain and sump pump installations carry a workmanship warranty. The Zoeller pump itself carries its own manufacturer warranty, separate from our labor guarantee. Expect the sump system to perform reliably for 7 to 10 years with normal maintenance, longer if the battery backup gets serviced on schedule. What's not covered is damage from a homeowner disconnecting or bypassing the system after the fact. Every contract also includes a deadline penalty clause, so delays cost us, not you."
