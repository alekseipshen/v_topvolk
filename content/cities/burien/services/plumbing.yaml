title: "Burien Plumbing — Repiping, Tankless Heaters & Drain Work"

intro: |
  Galvanized steel supply lines don't announce their failure. They just slowly
  choke the flow to your showerhead, tint the hot water orange for the first 30
  seconds each morning, and eventually split at a threaded joint behind drywall.

  Most of the post-war ramblers in Gregory Heights and along the older streets
  near Marine View Drive in 98148 were built between 1948 and 1968. A lot of
  them are still running original galvanized plumbing. Moving to PEX-A — Uponor
  AquaPEX is what we spec most often — solves both the flow restriction and the
  corrosion problem in a single pass.

  Out in the 98166 zip — Seahurst, Three Tree Point — the pattern shifts to a
  different decade. Mid-1980s homes with polybutylene gray supply lines and acetal
  fittings that insurers now flag at inspection. That's a plumbing replacement
  problem, not a repair problem.

  A Moen quarter-turn ball valve at the new main shutoff is something we include
  on every repipe. It's cheap. It matters the next time you need to kill the water
  fast. TopVolk has completed 100+ projects since 2023 across King, Snohomish,
  Pierce, and Kitsap counties — Vladislav Volkov does the estimate himself.

localContext: |
  Three zip codes cover Burien's residential plumbing footprint: 98146 along the
  northern edge near White Center, 98148 through the town center and Gregory
  Heights, and 98166 sweeping southwest to the Puget Sound shoreline.

  Housing ages shift noticeably as you move through those zones. Properties in
  98146 lean older — pre-1960 construction is common. That means cast-iron drain
  stacks, galvanized supply pipe, and post-and-pier foundations with low
  crawlspaces that make plumbing access slow and difficult.

  The 98166 stock from the early 1980s frequently has polybutylene supply pipe.
  It's the flexible gray tubing that was standard new-construction practice until
  the mid-1990s.

  Seattle's 37 inches of annual rain keeps Burien crawlspaces wet from October
  through May. A damp crawlspace without a proper vapor barrier dramatically
  shortens the service life of any steel plumbing pipe running through it.

  Pressure is also a factor. Parts of Burien served by Highline Water District
  regularly see 90 psi or higher at the meter. That stresses every fixture valve,
  fill valve, and water heater inlet connection in the house. A pressure-reducing
  valve (PRV) set to 60-65 psi is often the first plumbing fix we recommend before
  any fixture upgrade.

commonProblems:
  - title: "Galvanized Supply Pipe Replacement in Pre-1960 Burien Homes"
    description: |
      Inside a 65-year-old galvanized supply line, rust scale has typically
      narrowed the pipe's effective diameter to 30-40% of original capacity.
      Low pressure at the master bath, orange-tinted hot water at startup, and
      weeping at threaded unions are the three signs the plumbing is past repair.

      Uponor AquaPEX (PEX-A with expansion fittings) is the material we use for
      most Burien repiping jobs. The expansion connections are more reliable than
      crimp fittings and handle crawlspace humidity better than copper in tight,
      damp spaces.

      A whole-house repipe on a 1,300-1,600 square foot Gregory Heights rambler
      typically runs 4 to 7 working days from rough-in through pressure test.
      The plumbing permit goes through the City of Burien Building Division, with
      a required rough-in inspection before drywall close-up.

      Total project cost runs $8,000-$16,000 depending on crawlspace access and
      whether fixtures are being upgraded at the same time.

  - title: "Polybutylene Pipe Failure in 1980s Burien Construction"
    description: |
      From 1978 through roughly 1995, polybutylene was standard new construction
      across the Seattle metro — including a significant share of 98166 homes.
      Gray or white flexible plastic, usually paired with gray acetal fittings.

      The pipe walls hold up reasonably well. It's the acetal fittings at tees,
      elbows, and supply stops that fail. Chlorine in municipal water slowly
      embrittles those fittings until they crack without warning, at full pressure.

      Insurance carriers have started refusing to write or renew policies on homes
      with polybutylene still in service. That makes it a real estate problem at
      resale, not just a plumbing problem.

      Replacing poly with PEX-A or Type L copper costs similar to a galvanized
      repipe — $7,500 to $14,000 for a mid-size Burien home. The plumbing work
      often moves faster because poly joints aren't rust-locked the way galvanized
      threaded fittings are after six decades. King County requires a plumbing
      permit with rough-in inspection.

  - title: "Tankless Water Heater Conversion and Gas Line Upsizing"
    description: |
      Swapping a 40-gallon tank for a Rinnai RU199iN or Navien NPE-240A2 is not
      a direct swap. It's a gas line project first.

      Most Burien homes have 1/2-inch gas supply from the meter. A high-output
      condensing tankless unit typically needs 3/4-inch or 1-inch supply to run
      at full capacity without pressure drop. That means running new gas line from
      the meter — not just swapping the heater.

      Washington state code requires seismic strapping on all water heater
      installations. The City of Burien issues mechanical permits for water heater
      work. An unlicensed plumbing installation without a permit card creates
      problems at sale when the buyer's inspector starts asking questions.

      TopVolk is a WA Licensed Contractor and pulls all required mechanical permits
      before any gas line work starts. Installed cost for a Navien NPE-240A2 with
      gas line upsizing and new venting runs $3,500-$5,500 depending on the length
      of the gas run and whether the existing B-vent needs to be converted to
      concentric PVC for a sealed-combustion unit.

  - title: "Pressure Regulator Installation for High City Water Pressure"
    description: |
      The IRC sets 80 psi as the maximum recommended residential supply pressure.
      Parts of Burien served by Highline Water District run 90-100 psi at the
      meter. That's a plumbing problem waiting to happen.

      Sustained overpressure quietly damages Moen and Kohler cartridge faucets,
      toilet fill valves, washing machine inlet hoses, and water heater connections.
      All items with warranty terms voided by high inlet pressure.

      Installing a Watts 25AUB-Z3 or Wilkins 600XL pressure-reducing valve at the
      main shutoff brings supply pressure down to a consistent 60-65 psi. Parts
      run $150-$300. Total installed cost including shutoff valve upgrade and any
      adjacent plumbing repairs runs $450-$800.

      No permit required for a standalone PRV swap in most King County
      jurisdictions. Done alongside a permitted water heater replacement, we
      combine the inspections into one visit. The fixture savings over five years
      typically exceed the install cost.

  - title: "Drain Line Rerouting for Kitchen Islands and Basement Bathrooms"
    description: |
      Kitchen island sinks and basement bathrooms hit the same plumbing problem:
      gravity drain is on the wrong side of the slab or the wrong wall, with no
      easy path to the main stack.

      Island sink drains require either an air admittance valve (AAV) in an
      accessible cabinet or a full vented loop back to an exterior wall. Both are
      code-compliant under IRC if done correctly. Both require a plumbing permit
      from the City of Burien or King County DPER depending on jurisdiction.

      Basement bathrooms in Burien homes with partial slab-on-grade go one of two
      ways. Upflush route — Saniflo Saniplus is a common spec, $2,500-$4,000
      installed, 10-15 year pump service life. Or a concrete saw trench to connect
      to the gravity drain system ($1,200-$2,500 for the trench alone, plus
      rough-in).

      Full basement bathroom rough-in with drain, vent, and supply plumbing
      typically adds $4,000-$7,000 to a finish-basement project. We price both
      options with line-item breakdowns so the decision is yours.

faq:
  - q: "How fast can you get to Burien for a plumbing consultation?"
    a: |
      Burien is a straightforward run — SR-509 and 1st Avenue S put us in the
      Gregory Heights or Seahurst area in 20-30 minutes without dealing with I-5
      through downtown.

      On-site consultation scheduling typically runs 3-5 days out. Written
      line-item plumbing estimates come back within 48 hours for most scopes.
      Repipe and water heater projects can generally start within 2-3 weeks of
      signed contract.

      The contract includes a deadline penalty clause. Missed milestones have real
      consequences — written in, not just promised. Call (206) 591-1096 to set up
      a time; you'll talk to Vladislav directly, not an answering service.

  - q: "What does whole-house repiping cost in a typical Burien home?"
    a: |
      For a 1,200-1,600 square foot rambler or split-level in the 98148 or 98166
      zip, a full repipe from galvanized or polybutylene to PEX-A typically runs
      $8,000-$15,000.

      That range reflects crawlspace access conditions, number of bathrooms,
      whether fixtures are being upgraded at the same time, and how much drywall
      needs to be opened and patched. Homes with corroded galvanized under a
      partial slab add cost.

      The plumbing estimate is free, on-site, and itemized. No vague ranges — just
      actual line items for each scope item. Call (206) 591-1096 or use the contact
      form to send project details ahead of the visit.

  - q: "Does the City of Burien require permits for water heater replacement or repiping?"
    a: |
      Yes on both counts.

      The City of Burien Building Division issues mechanical permits for water
      heater replacements. WA state code requires seismic strapping on any new
      water heater installation — tank or tankless. Full repiping requires a
      plumbing permit with a rough-in inspection before any walls close up.

      Properties in unincorporated King County just outside Burien city limits
      run permits through King County DPER rather than the city. TopVolk is a
      WA Licensed Contractor and handles the permit application as part of the
      project — no trips to the permit counter on your end. City of Burien water
      heater permit fees typically run $150-$300; plumbing permits for repiping
      vary with scope.

  - q: "Can TopVolk handle both the plumbing and the finish work in a bathroom remodel?"
    a: |
      That's the main reason to use a general contractor for bathroom work rather
      than calling a plumber and a tile sub separately.

      TopVolk coordinates the plumbing rough-in, drywall hang and tape, Schluter
      Kerdi waterproofing membrane installation, large-format porcelain tile, and
      Kohler or Moen fixture installation as one project under one contract. No
      handoff gaps. No one waiting on someone else's inspection.

      For a full bathroom remodel in a Burien home — curbless shower conversion,
      new vanity plumbing, and finish tile — the typical timeline runs 5-8 weeks
      from permit approval through blue tape walkthrough and punch list. Call
      (206) 591-1096 to talk scope; Vladislav does the estimate himself.

  - q: "How long does PEX-A piping last, and is it better than copper in Burien homes?"
    a: |
      Uponor AquaPEX (PEX-A) carries a 25-year manufacturer warranty. Real-world
      service life in normal residential plumbing conditions runs longer than that.

      Type L copper lasts 50+ years but costs significantly more in materials and
      labor — particularly in Burien's older homes where crawlspace clearance is
      tight and plumbing access is difficult. PEX-A expansion fittings don't
      corrode, handle freeze-thaw cycling better than copper, and require no
      soldering in confined spaces.

      For most Burien repipe projects, PEX-A is the practical and cost-effective
      choice. Copper makes more sense for targeted spot repairs or when a buyer or
      insurer specifically requires it. We'll tell you which situation you're
      actually in.

  - q: "Does TopVolk serve the cities near Burien, or just Burien itself?"
    a: |
      The full service area covers King, Snohomish, Pierce, and Kitsap counties.
      Des Moines, SeaTac, Tukwila, Renton, and West Seattle are all regular stops.
      Further out into Federal Way, Auburn, and Tacoma for larger plumbing and
      renovation projects.

      The 98148 and 98166 zip codes are well within the regular rotation.
      Scheduling for on-site plumbing estimates typically runs 3-7 days out
      depending on project volume.

      For larger scopes — full repiping, additions, ADU construction — send
      project details through the contact form before the visit so the on-site
      conversation is productive from the start. Call (206) 591-1096 to get on
      the calendar.