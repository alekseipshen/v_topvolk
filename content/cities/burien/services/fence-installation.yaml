title: "Burien Fence Installation — Cedar & Posts Set Right for Clay Soil"

intro: |
  Three Tree Point drops sharply toward Puget Sound, and the residential lots backing that bluff — most of them 1950s and early-1960s ranchers — sit on clay-heavy soil that stays saturated from October through April. That matters for fence installation more than most homeowners realize. A cedar post set 18 inches deep in well-drained soil holds for decades; that same post in Burien's ground heaves and rots at the base within 8 to 10 years without the right footing setup. TopVolk Construction LLC has completed 100+ projects across King County since 2023, and Vladislav Volkov handles every fence consultation personally — you talk to the contractor, not a sales rep. In the Sunnydale neighborhood near 98146, we typically set posts 30 to 36 inches deep with a concrete collar and drain gravel below the footing. The Lake Burien area presents slope challenges that affect material choice — horizontal cedar slats on a terraced lot look sharp, but the rail-to-post connections require blocking and proper hardware to stay rigid after years of wet-dry cycling.

localContext: |
  Burien's housing stock concentrates around two distinct eras. Older neighborhoods — zip codes 98146 and 98148, particularly the blocks around Lake Burien and the Shorewood area — are mostly 1950s and 1960s single-family ranchers on 6,000 to 8,000 square foot lots. Those properties often have fence lines that haven't been professionally surveyed since the original plat. In the newer sections near 98166 and around Three Tree Point, you get more split-levels and mid-70s builds on steeper terrain. Burien also sits under the Sea-Tac flight path, which means wind loading matters — not dramatically, but enough that a 6-foot cedar fence without adequate mid-rail blocking will start racking within a few years of exposure. The City of Burien Development Services handles permits locally, separate from King County DPER, so plan review timelines and code interpretations differ from unincorporated King County or Seattle SDCI. Front yard fence height limits here cap at 4 feet per City of Burien municipal code, with 6 feet allowed on side and rear property lines — standard across most of the county, but the front-yard rule catches homeowners off guard regularly.

commonProblems:
  - title: "Cedar Posts Rotting Early in Burien's Saturated Clay Soil"
    description: |
      Western red cedar is the default fence material across the Seattle metro, and for good reason — it handles moisture better than most domestic woods and takes stain evenly. The problem shows up underground. Cedar posts buried directly in Burien's clay-heavy soil, especially in the Lake Burien and Sunnydale areas where drainage is slow, show rot at the ground line within 8 to 10 years. The fix is concrete footings at 30 to 36 inches deep, drain gravel in the bottom 6 inches, and a Simpson Strong-Tie ABA post base to keep the cedar post above the concrete surface entirely. That approach adds $15 to $25 per post compared to direct burial, but it extends post life from roughly 10 years to 25-plus. For existing fences showing early ground-line rot, sister posts — a pressure-treated 4x4 set immediately adjacent and through-bolted to the failing cedar — can buy another 5 to 7 years without full fence replacement.

  - title: "6-Foot Cedar Going Up in the Front Yard — And Then Coming Down"
    description: |
      This situation comes up several times a year in Burien. A homeowner wants street privacy, orders 6-foot cedar privacy panels, and starts setting post holes in the front yard. Burien municipal code caps front yard fences at 4 feet — measured from finished grade, not from the top of the concrete footing. City of Burien Development Services will flag the violation on a neighbor complaint or routine inspection, and the fence comes down at the owner's expense. Corner lot properties face stricter sight-triangle restrictions near intersections on top of that. One practical approach: a 4-foot solid cedar fence with open lattice above to 5.5 feet, where the lattice is under 50% solid. That interpretation varies by inspector, so it's worth a pre-application meeting with the City before installation. Call (206) 591-1096 and Vladislav can walk you through exactly what Burien will and won't approve before a single post hole gets dug.

  - title: "Property Line Uncertainty on Burien's 1950s-Era Subdivision Lots"
    description: |
      Shared fence lines in Burien's mid-century subdivisions are more complicated than they look. Original lot surveys from that era used wood stakes that rotted decades ago, and the GPS boundary apps on smartphones are not legally defensible in a property dispute. Before TopVolk sets any post on a shared property line, we ask for a current survey or visible survey pins. If they don't exist, a licensed surveyor runs $800 to $1,500 in King County — worth it before committing to an installed fence. Building 6 inches inside your own property line avoids the shared-line dispute entirely but costs you footage. For fences near the rear property line in the Shorewood area, where lots back up to alleys or utility easements, the easement width affects legal fence placement. City of Burien Development Services requires a site plan showing fence location relative to property lines for any permit-required installation. TopVolk, a WA Licensed Contractor, prepares and submits that documentation as part of the project scope.

  - title: "What Fence Installation Actually Costs in Burien — and What Pushes the Number Up"
    description: |
      Cedar privacy fence in Burien runs $45 to $65 per linear foot installed, including posts, concrete footings, top and bottom rails, and pickets. Vinyl fence — CertainTeed or comparable product — comes in at $55 to $80 per linear foot. Three factors move those numbers: slope, gate count, and material grade. A fence running across a 10-foot grade change requires stepped or raked panel transitions and extra post labor. Gates are priced separately — a single walk gate with D&D Technologies TruClose self-closing hinges and a drop-rod latch runs $400 to $700 installed; a double drive gate with heavy-duty hardware runs $900 to $1,600. Horizontal slat cedar fences cost 20 to 30% more than standard vertical picket because rail layout is more complex and picket spacing must be precise to read correctly. TopVolk provides line-item quotes with specific post count, linear footage, gate count, and material spec — and missed deadlines carry a financial penalty written into the contract.

  - title: "Horizontal Cedar Slat Fences: Why They Fail When Installed Like Vertical Picket"
    description: |
      The horizontal cedar slat fence has become the default modern look in Burien's newer neighborhoods and in remodeled 1960s ranchers. It's less forgiving to install than vertical picket. Horizontal boards pull differently on posts — they bow the post inward if the rails aren't properly blocked at each connection point. Posts for horizontal-style fences typically need to be 4x6 cedar or 6x6 pressure-treated rather than a standard 4x4, spaced no more than 6 feet on center. The gap between slats also matters for code compliance: pool barrier fences in Burien must meet IRC Section R326 requirements, which typically limits gaps to 4 inches maximum between horizontal boards. Stain selection matters too — horizontal cedar holds moisture along the top edge of each board, so a penetrating oil-based stain like Penofin or Armstrong Clark extends finish life considerably compared to a film-forming product that traps moisture underneath and peels. Plan for restaining every 3 to 4 years in the Puget Sound climate.

faq:
  - q: "How fast can you get to Burien for a fence installation estimate?"
    a: |
      Burien is roughly 20 to 25 minutes from our typical work area via SR-509 or 1st Avenue S, depending on traffic around the Sea-Tac corridor. Most Burien estimates happen within 3 to 5 days of initial contact. After the estimate, cedar material lead time runs 1 to 2 weeks; CertainTeed vinyl panels can run 2 to 4 weeks depending on style and color. Standard installation on a 150-foot fence takes 2 to 3 days on-site. Call (206) 591-1096 to set up a free on-site consultation — Vladislav comes out personally, measures the fence line, flags any slope or code issues, and hands you a line-item quote before he leaves.

  - q: "What does fence installation cost per linear foot in Burien?"
    a: |
      Cedar privacy fence runs $45 to $65 per linear foot installed. Vinyl runs $55 to $80. Horizontal slat cedar adds 20 to 30% to the cedar base price due to larger post requirements and additional labor. Gates are priced separately — walk gates start at $400 to $700 installed, double drive gates run $900 to $1,600 depending on hardware selection. Slope is the biggest pricing variable: a flat lot in the Shorewood area is straightforward; a terraced lot near Three Tree Point may require stepped panel transitions and extra blocking at each post. Schedule a free on-site estimate by calling (206) 591-1096 — you'll get exact numbers for your specific fence line, not a range that shifts after the contract is signed.

  - q: "Does the City of Burien require a permit for fence installation?"
    a: |
      Most standard fence installations in Burien — cedar or vinyl, under 6 feet tall on side and rear lines — don't require a permit from City of Burien Development Services. Permits are required for fences over 6 feet, fences that double as retaining walls retaining more than 4 feet of soil, and pool barrier fences, which require inspection for IRC Section R326 compliance. TopVolk, a WA Licensed Contractor, handles the permit application, site plan, and submittal when a permit is required. Plan review at the City of Burien typically runs 2 to 4 weeks for fence permits. If your property sits near the unincorporated King County boundary, permit jurisdiction may fall to King County DPER instead — worth verifying before any paperwork is filed.

  - q: "Cedar or vinyl — which holds up better in Burien's wet winters?"
    a: |
      Cedar weathers naturally but needs maintenance. Left unstained in Burien's wet season, cedar grays out within 2 years and starts checking — surface cracking along the grain — within 5. A penetrating oil-based stain like Penofin every 3 to 4 years keeps cedar looking right and extends board life to 20 to 25 years. Posts are the weak point regardless of species, which is why we use concrete footings and Simpson Strong-Tie post bases rather than direct burial. Vinyl — CertainTeed or similar — needs no staining, won't rot, and handles Puget Sound rain without any seasonal maintenance. The tradeoff is repairability: cedar boards can be replaced individually when one fails; vinyl panels are harder to patch invisibly. Most Lake Burien homeowners choose cedar for the natural look; Shorewood and Three Tree Point tend to split based on maintenance budget.

  - q: "What warranty covers a fence installed by TopVolk in Burien?"
    a: |
      TopVolk warranties installation workmanship for three years — that covers post lean, rail separation, and gate hardware alignment issues that result from installation rather than material failure or impact damage. Material warranties come from the manufacturer: CertainTeed vinyl carries a limited lifetime warranty on panels against fading and cracking; Western red cedar boards carry no manufacturer warranty, but the species has a 100-year track record in PNW conditions when properly maintained. We source cedar from regional suppliers and vinyl systems from established manufacturers — not factory-direct panels we produce ourselves. For cedar, the honest lifespan expectation is 20 to 25 years on boards and 25-plus years on posts when set with concrete footings and post bases. Gate hardware from D&D Technologies carries its own manufacturer warranty separate from the fence structure.

