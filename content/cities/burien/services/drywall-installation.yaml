title: "Burien Drywall Installation — SeaTac Noise & Older Homes"

intro: |
  The ramblers and split-levels running through Gregory Heights and the blocks off SW 148th Street were mostly built between 1958 and 1975 — and a lot of them still have their original walls. That means spray-applied texture, joint compound patched over joint compound, and in some cases actual blue board and veneer plaster in the older sections closer to Three Tree Point. Burien also sits directly under the SeaTac approach corridor, and that changes the conversation about interior walls — Resilient channel with QuietRock 530 panels makes a real, measurable difference in bedrooms facing north toward the airport. Add in the PNW moisture load — roughly 37 inches of rain a year, with north-facing walls staying damp October through April — and mold-resistant drywall is the standard call for bathrooms, laundry rooms, and basement conversions throughout this area. TopVolk Construction LLC is a WA Licensed Contractor that has completed 100+ projects across King County since 2017, including full gut-and-reframe remodels and drywall finish work after electrical and plumbing rough-ins. Owner Vladislav Volkov handles every consultation personally — no sales staff, no estimator relay.

localContext: |
  Burien's residential stock splits fairly cleanly by decade. The 98166 zip code covers the western and southern edges — Three Tree Point, Seahurst, the hillside streets above Puget Sound — where post-war and early Craftsman-era construction shows up alongside occasional blue board and veneer plaster that won't accept a standard patch without a visible seam. The 98146 zip holds the bulk of the inland grid: Gregory Heights, Boulevard Park, the streets around Burien Town Square — 1960s and 70s ramblers with skip-trowel ceilings, original builder-grade texture, and walls that were never designed to hold up under modern LED recessed lighting. That era of construction also used paper-faced gypsum in areas that are now bathrooms and laundry rooms, which has not aged well in the PNW climate. Garage-to-ADU conversions are picking up under WA HB 1337 (2024), and those projects require 5/8-inch Type-X firecode drywall on separation walls — a code requirement that gets verified at the rough-in inspection. Permit review for remodels in incorporated Burien goes through the City of Burien's own permit center, not King County DPER, which is relevant for project scheduling.

commonProblems:
  - title: "Popcorn Ceilings With Potential Asbestos in Gregory Heights Ramblers"
    description: |
      Homes in 98146 built before 1980 — which is most of Gregory Heights and Boulevard Park — frequently have spray-applied texture containing chrysotile asbestos. The only way to confirm is a certified lab sample, which runs $30-$60 and takes 3-5 business days. Skipping that step to save time is how a $600 popcorn removal turns into a $4,000 abatement bill. If the test comes back clean, the process is mechanical scraping followed by two to three passes of finish-grade skim coat — USG Sheetrock Brand All Purpose applied with a 12-inch knife works well on these older ceilings. A standard 12x14 bedroom ceiling, test included, runs $450-$750 depending on texture depth and existing patch history. If asbestos is confirmed, abatement goes first, then skim coat after clearance. Vladislav will walk you through the testing sequence during the on-site estimate.

  - title: "SeaTac Flight Noise Penetrating Bedroom Walls in 98146 and 98166"
    description: |
      Burien sits inside the FAA's elevated DNL noise contour for SeaTac — both 98146 and 98166 are affected, with the worst exposure on north-facing rooms. Standard 1/2-inch drywall on a 2x4 stud wall does almost nothing for low-frequency aircraft noise. Resilient channel (RC-1) decoupled from the stud and covered with 5/8-inch Type-X drywall improves the STC rating by 8-12 points over a standard assembly. QuietRock 530 panels on resilient channel push that to STC 52-54 without adding framing depth — useful in older homes where interior dimensions are already tight. QuietRock 530 runs $65-$85 per panel versus $15-$18 for standard 5/8-inch; labor cost is identical. For any remodel that opens bedroom walls, adding the sound-isolation assembly at that point is far cheaper than coming back for it later. This is one of the more common upgrades on Burien remodel projects in the flight corridor.

  - title: "Mold-Resistant Drywall for Basement Conversions Near Ground Contact"
    description: |
      Burien's 37-plus inches of annual rainfall keeps crawlspace moisture levels elevated from October through May, and that moisture migrates into lower-level walls. Standard paper-faced drywall in a basement bathroom or laundry room typically shows mold within two to three years — sometimes faster on north-facing walls. The right material is USG Sheetrock Mold Tough (purple board) or Georgia-Pacific DensArmor Plus, with a Schluter Kerdi or RedGard membrane behind tile in wet areas. Non-wet basement walls still benefit from mold-resistant board plus a proper vapor barrier and DriCore subfloor below. Basement conversions that add habitable space require a permit through the City of Burien's permit center — plan review runs 4-8 weeks. TopVolk is a WA Licensed Contractor and manages the permit application, coordinates the MEP rough-in inspection, and schedules drywall hang after the inspector has signed off on framing and mechanical. That sequencing matters — drywall hung before rough-in inspection means opening it back up.

  - title: "5/8-Inch Type-X Firecode Requirements for Garage ADU Conversions"
    description: |
      Under WA HB 1337 (2024), Burien homeowners can now convert attached garages to AADUs without the parking replacement requirements that previously made the math hard. The IRC still requires 5/8-inch Type-X firecode drywall on every wall and ceiling separating the ADU from the garage or from the main living space — and that gets checked at the rough-in inspection. Showing up with 1/2-inch standard board fails that inspection. For a typical two-car garage conversion, Type-X hang on walls and ceiling runs $1,800-$3,400 in materials and labor depending on square footage and whether existing insulation needs to come out first. ADU permits in Burien go through the city's own permit center — plan review typically runs 6-10 weeks for ADU projects. Getting the fire-separation layer right on the first hang avoids a failed inspection, a re-inspection fee, and the cost of tearing out and redoing work that didn't meet code.

  - title: "Level 5 Finish for Kitchen and Bath Walls Under Recessed LED Lighting"
    description: |
      Patching drywall after electrical and plumbing rough-in is where finish quality either holds or falls apart. In Burien's 1960s-70s ramblers, the original wall texture is usually skip-trowel or orange-peel — hand-applied and inconsistent wall to wall. A patch skim-coated flat reads differently under light than the surrounding wall. Under recessed LED lighting with a dimmer, every joint line and taping mark shows. The solution that actually works is skim-coating the entire wall to Level 5 — one coat of finish compound applied with a 12-inch knife, sanded smooth, and primed — then re-applying a light matching texture if the rest of the room still has it. This adds 2-3 working days per room over a basic tape-and-mud approach, but it's the difference between a patch that's invisible and one a buyer's inspector flags on a future sale. For kitchens and baths going into Bosch or KitchenAid appliance packages where the finishes are high-end, Level 5 walls are standard — the rest of the room expects it.

faq:
  - q: "How fast can TopVolk get to Burien for drywall work?"
    a: |
      Burien is a direct run — SR-518 and SR-509 both connect efficiently, and Vladislav is typically on-site within 24-48 hours of a call for an estimate. Parking on residential streets in Gregory Heights and Boulevard Park is generally straightforward; narrow lots near Three Tree Point occasionally require street parking but that hasn't been an issue on past projects. For standalone work like a popcorn ceiling removal or patch job, scheduling usually opens within 1-2 weeks. Drywall scoped inside a kitchen or bath remodel is sequenced around the MEP rough-in inspection — hang happens after the inspector signs off, not before. Call (206) 591-1096 to set up a free on-site consultation with Vladislav directly.

  - q: "What does drywall installation cost in Burien?"
    a: |
      Hanging and taping new 1/2-inch drywall in a standard room runs roughly $1.50-$2.50 per square foot for hang, tape, mud, and sand. Level 5 finish brings that to $3.00-$4.00 per square foot. Soundproofing assemblies with QuietRock 530 or resilient channel add $2-$3 per square foot in materials on top of standard labor. Popcorn ceiling removal plus skim-coat on a 12x14 bedroom ceiling typically lands $450-$750 depending on texture depth and whether asbestos testing is needed first. For an accurate number on your specific project — wall area, finish level, firecode or moisture-resistant requirements — call (206) 591-1096. Vladislav quotes line-item pricing with actual figures, not ranges that double by contract signing.

  - q: "Do I need a permit for drywall work in Burien?"
    a: |
      Standalone drywall replacement or patching generally does not require a permit. If the drywall is part of a larger scope — kitchen remodel, bath remodel, ADU conversion, basement finish — permits go through the City of Burien's own permit center, not King County DPER, since Burien is an incorporated city with its own AHJ. Plan review for a mid-size remodel typically runs 4-8 weeks; ADU projects run 6-10 weeks. TopVolk is a WA Licensed Contractor and handles permit applications as part of project management — drawings, submittal, and rough-in inspection scheduling are all coordinated so drywall hang happens at the right point in the sequence, not before the inspector has seen the framing and mechanical.

  - q: "Can you match existing wall texture after a patch in an older home?"
    a: |
      Texture matching on 1960s-70s skip-trowel or orange-peel is honest work to discuss upfront. Those original textures were hand-applied and vary across the same wall — a small patch almost never disappears completely. The approach that produces a clean result is skim-coating the entire wall to Level 5, priming, then applying a light consistent texture across the full surface. For kitchens and baths going under recessed LED lighting, Level 5 is the right choice anyway — directional light exposes every joint line and taping mark on lower finish levels. For homes in 98166 with original blue board and veneer plaster, patching requires matching the veneer thickness and blend, not standard joint compound. Vladislav walks walls before quoting to give you an accurate scope, not a surprise at punch list.

  - q: "How long does a drywall project take in Burien?"
    a: |
      A standalone bedroom popcorn removal and skim-coat typically runs 3-5 working days including dry time between coats. Full drywall replacement in a kitchen or bath — hang, tape, three coats of mud, sand, prime — runs 5-8 working days. Whole-house remodel drywall alongside a kitchen and bath remodel: plan 2-3 weeks from hang through paint-ready. Soundproofing assemblies with resilient channel add 1-2 days for framing prep before the hang begins. Every TopVolk project has a written schedule, and missed deadlines come with financial penalties built into the contract — that is a contract term, not a verbal reassurance. Call (206) 591-1096 to discuss your specific timeline and what affects it.

  - q: "Do you cover White Center, Normandy Park, and other areas near Burien?"
    a: |
      Yes — White Center (98106), Normandy Park (98166 overlap), SeaTac (98188), Tukwila, and Des Moines are all within the regular service area, typically a 10-15 minute drive. Renton, Kent, and Bellevue are also covered without a travel premium. For projects in unincorporated King County pockets around these cities, permits go through King County DPER rather than a city permit center — the plan review timeline and submittal requirements differ, and Vladislav knows which applies before he quotes the project. Summer books faster than winter — if your remodel is targeting a spring or summer start, earlier scheduling conversations are better. Call (206) 591-1096 or reach out online to get on the calendar.