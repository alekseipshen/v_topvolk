title: "Burien Door Installation — Sealed Right for PNW Rain Season"

intro: |
  Seahurst Park anchors the western edge of Burien, and the rancher-style homes
  stretching east toward SR-509 are mostly 1960s and early 1970s build — solid
  framing, but the original steel entry doors have been repainted half a dozen
  times and the weatherstripping compressed flat for years. Moisture is getting
  behind the brick mold on most of them whether the homeowner notices it or not.
  That's not a caulk-and-paint fix. It's a full door replacement with proper
  aluminum pan flashing at the sill and a new threshold assembly.

  TopVolk Construction has replaced entry and patio doors across Burien since
  2023 — fiberglass Therma-Tru units flashed correctly into the rough opening,
  Milgard sliding glass systems with thermally broken frames, interior passage
  doors with rebuilt casing during kitchen and bath remodels. Owner Vladislav
  Volkov does the estimates himself. No sales staff, no handoff to a crew you've
  never met — the person measuring your opening in Gregory Heights or Three Tree
  Point is the person running the installation.

localContext: |
  Zip codes 98146 and 98166 split most of Burien's residential stock, and the
  two areas have noticeably different door profiles. The 98146 side — Gregory
  Heights, the blocks surrounding Highline College — runs heavily 1950s through
  1970s construction. Those homes have 6'8" rough openings as standard, original
  fir jambs, and factory door units that were never upgraded. The 98166 corridor
  toward Three Tree Point and Seahurst trends slightly newer — some 1980s and
  1990s build-out — but patio doors in those homes are often single-pane or early
  double-pane aluminum sliders with no thermal break and failed IGU seals.

  Both areas deal with north-facing and west-facing exposures that accelerate
  moisture damage on wood casings. Cedar trim weathers fast on the wet side of
  any Burien house, and the freeze-thaw cycles in winter push door frames enough
  to misalign strike plates over time. Flashing detail — aluminum z-bar above the
  door head, self-adhering membrane at the sill pan — is non-negotiable here.
  King County's rain load isn't forgiving of shortcuts at the rough opening, and
  proper installation is what separates a 30-year door from one you're pulling
  out in 12.

commonProblems:
  - title: "Steel Entry Doors Trapping Moisture Behind the Brick Mold"
    description: |
      The 1960s-era steel entry doors in Gregory Heights follow a predictable
      failure path. Factory foam core delaminates from the steel skin, R-value
      drops, and water begins wicking into the rough opening past the brick mold.
      By the time a homeowner notices interior staining or a sticky latch, the
      sheathing behind the frame has been absorbing moisture for years. Replacement
      with a Therma-Tru Benchmark or Pulse fiberglass door — properly flashed with
      aluminum z-bar at the head and a self-adhering sill membrane — stops that
      cycle permanently. We size the new unit to the existing rough opening when
      possible, or frame out to a standard 36"x80" if the original was narrower.
      Budget $2,800–$4,500 installed for a single fiberglass entry door including
      new exterior casing, threshold, and basic hardware — more with sidelites or
      decorative glass.

  - title: "Interior Door Swings and Casing Conflict During Remodels"
    description: |
      Pull a wall for a kitchen expansion or reconfigure a bathroom layout in a
      98146 rancher and the adjacent interior doors almost always need attention.
      Existing swings conflict with new cabinet runs or open into the remodeled
      space wrong. Casing gets damaged during demo. In most cases the original
      hollow-core doors — typically 1-3/8" lauan-faced units from the 1960s and
      70s — aren't worth reinstalling. Switching to a solid-core 1-3/4" MDF or
      paint-grade wood door makes a real difference in sound transmission and
      perceived quality. We hang new pre-hung units, cut and install new casing
      (Colonial or craftsman-profile to match existing trim), and adjust the strike
      plate for a clean latch pull. Cost runs $600–$1,200 per opening installed,
      including casing and hardware — more if the rough opening needs to be
      reframed for a new swing direction.

  - title: "Fogged Sliding Glass Doors with No Thermal Break on West Elevations"
    description: |
      The aluminum sliding patio doors on west-facing elevations in 98166 are
      single-pane or early double-pane units — no low-E coating, no thermal break
      in the frame. On a January morning with fog rolling in off Puget Sound,
      interior glass surfaces are near dew point and condensation streaks the
      frames constantly. A Milgard Tuscany or Trinsic Series sliding door — dual-
      pane low-E, thermally broken frame — cuts heat loss and eliminates the
      moisture problem. French door conversions are popular in Burien too: Pella
      150 Series inswing French units fit common 60" and 72" openings without
      major framing work. Budget $3,500–$7,500 depending on unit width, glazing
      package, and whether the project is a straight swap or involves rough opening
      modification. City of Burien permits are required if the opening size changes.

  - title: "Uninsulated Garage Doors Draining Heat From Attached Living Space"
    description: |
      Single-layer steel garage doors with no insulation are standard on Burien's
      1980s and 1990s tract homes in 98148. An uninsulated door on an attached
      garage means that wall is a thermal drain into your living space — a real
      problem when the garage sits below a bedroom or shares a wall with the
      kitchen. Upgrading to a Clopay Gallery Series or Wayne Dalton 8000 Series
      door with R-12 polyurethane-injected panels makes a measurable difference in
      comfort. LiftMaster belt-drive openers are quieter than the old chain-drive
      units common on 1990s installs — worth the upgrade on attached garages where
      noise carries into the house. Single-car insulated steel door replacement
      runs $1,800–$2,800 installed; two-car units $2,400–$3,800, depending on panel
      style and whether an opener is included.

  - title: "Weatherstripping Failure and Smart Lock Retrofits on Aging Entry Doors"
    description: |
      A door that's structurally sound — good fiberglass core, no frame rot — can
      still lose significant efficiency when the door sweep flattens and the jamb
      weatherstripping compresses. In Burien's wet climate, that gap also lets in
      insects and humidity through October. Replacing a worn sweep with a Pemko 018
      Series automatic door bottom and installing new compression foam weatherstrip
      on the jamb is a $300–$600 repair that extends door life by years. Smart lock
      integration is a separate but common add-on: Schlage Encode Plus and the
      August Wi-Fi Smart Lock both retrofit onto standard deadbolt prep holes.
      Backset dimension matters — 2-3/4" vs. 3-3/4" — and we verify that before
      recommending a unit. Lock installation runs $150–$300 per door including
      programming, and both units work without a hub, which matters in older Burien
      homes that don't have a smart home ecosystem already in place.

faq:
  - q: "How fast can you get to Burien for a door installation estimate?"
    a: |
      Burien is a straightforward drive — SR-509 southbound or I-5 to the 148th
      Street exit, typically 20-30 minutes from Seattle depending on traffic.
      Consultations can usually be scheduled within 3-5 business days. Material
      lead times vary: in-stock fiberglass entry door units from local suppliers
      run 1-2 weeks; special-order Milgard or Pella configurations can run 3-6
      weeks depending on the series and glazing package. Actual installation once
      materials are on-site is typically 1-2 days for an entry door swap and 2-4
      days for a patio door conversion. Call (206) 591-1096 to set up a free
      on-site consultation — Vladislav does the estimates himself and brings a
      tape measure, not a brochure.

  - q: "What does a full entry door replacement cost in Burien?"
    a: |
      Entry door replacement in Burien runs $2,500–$5,500 installed, depending
      on door material (fiberglass vs. solid wood vs. steel), unit size, sidelite
      configuration, and hardware selection. That price includes removing the
      existing door and frame, any necessary rough opening repair, installing the
      new pre-hung unit, aluminum pan flashing, exterior casing, and threshold.
      Patio door or sliding glass door replacement typically runs $3,500–$8,000
      depending on unit width and glazing package. Interior passage door
      replacements start around $600 per opening. On-site estimates produce a
      fixed line-item quote — not a range you find out is wrong after demo.
      Call (206) 591-1096 or use the contact form. No charge for the visit, and
      missed deadlines carry a financial penalty written into the contract.

  - q: "Do I need a permit to replace a door in Burien?"
    a: |
      Direct door-for-door swaps — same size, same location — typically don't
      require a permit from the City of Burien's permit center. Enlarging a rough
      opening, adding a new exterior door opening, or converting a window to a
      door does trigger a building permit. Burien handles its own permitting
      separately from King County DPER (which covers unincorporated areas). A
      structural opening modification permit runs $200–$500 in fees and typically
      takes 2-4 weeks for plan review. TopVolk Construction is a WA Licensed
      Contractor and manages the permit application, drawings, and inspection
      coordination when required — you don't need to navigate that process on
      your own. We schedule rough-in and final inspections around the installation
      sequence so the project doesn't sit waiting on an inspector.

  - q: "Is a French door conversion worth it compared to replacing an existing slider?"
    a: |
      Depends on how you use the space. Sliding glass doors handle high-traffic
      openings better — no swing clearance, wider net opening when partially
      open. French doors give you a fully unobstructed opening when both panels
      are swung back, better sight lines, and an aesthetic that fits Burien's
      mid-century housing stock better than the aluminum slider look. Pella and
      Milgard both make inswing and outswing French units that fit common 60"
      and 72" rough openings without framing changes. Outswing configurations
      are more common in PNW climates — they seal better against driving rain
      because the door closes against an exterior stop rather than a compressible
      interior seal. Rough opening conversion adds $400–$800 to the project
      cost, but if you're planning to stay in the house, the difference in daily
      usability is real.

  - q: "How long will a new entry door last in Burien's climate?"
    a: |
      A properly installed fiberglass door — correct flashing at the sill pan,
      quality threshold, intact jamb weatherstripping — should perform 30-40
      years in Burien without significant degradation. Therma-Tru and Pella both
      carry limited lifetime warranties on the door slab itself. The vulnerable
      components are the finish and the weatherstripping, not the core. Repaint
      or re-stain exterior-facing fiberglass every 5-7 years on south and west
      exposures; north-facing doors in Burien's moss-prone climate need a
      mildewcide treatment and cleaning every few years. Door sweeps and threshold
      seals are the first things to wear — inspect them annually. Those parts run
      $30–$80 in materials and are straightforward homeowner replacements. We do
      a blue tape walkthrough at project completion so you know exactly what to
      watch for and when.

  - q: "Do you install doors in SeaTac, Normandy Park, and other cities near Burien?"
    a: |
      Yes — TopVolk covers the full southwest King County corridor: SeaTac
      (98188), Normandy Park, Tukwila, Des Moines, and Renton are all part of
      the same scheduling rotation as Burien projects. Snohomish County and
      Pierce County projects also get handled through the same direct process —
      100+ projects completed since 2023 across all four counties. Scheduling a
      consultation typically happens within a week of first contact. Installation
      start date depends on material lead time — stock configurations move faster
      than special-order units. Current booking generally runs 3-5 weeks from
      signed contract to install, depending on project scope. Call (206) 591-1096
      or use the site contact form. Vladislav handles scheduling directly, and
      the same contractor who estimates the job manages the install.