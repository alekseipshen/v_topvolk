title: "Burien Bathroom Remodel — Mid-Century Baths Rebuilt for Real Use"

intro: |
  Three Tree Point and the hillside ranchers along Ambaum Blvd in 98166 tell the
  same bathroom story: a Moen cartridge someone replaced in 1994, original 1960s
  hex tile still holding on with 50-year-old grout, and a bath fan that vents into
  the attic instead of outside. Vladislav has walked these bathrooms. The moisture
  damage behind that tile runs deeper than any inspection report will tell you.

localContext: |
  Burien's 98146 and 98148 zip codes are dense with one-story ranchers and split-
  levels built between 1955 and 1975 — small master baths, single shared hall bath,
  and original cast-iron drain stacks that nobody has touched since Ford was president.
  Mud-bed tile floors that crack with age, galvanized supply lines going brown, zero
  waterproofing membrane behind any of it. That's the baseline we're working from in
  most of Seahurst and the neighborhoods around Burien Town Square.

commonProblems:
  - title: "Subfloor rot hiding under 1960s mud-bed tile"
    description: "Cracked mortar in old mud-bed floors lets water migrate sideways for
      years before the tile shifts or the floor goes soft. In Burien ranchers, that
      subfloor is usually 3/4-inch plywood or OSB — and by the time it's visible,
      it's already compromised. Demo comes first. DriCore or a full plywood replacement
      goes in before any Schluter Kerdi membrane or new tile. We've found this in
      multiple 98148 homes — it never shows in a pre-purchase inspection."

  - title: "No waterproofing membrane behind the tub surround — ever"
    description: "Tract builds from the 1960s and 70s used drywall backer, thinset,
      and tile. No RedGard, no Schluter, nothing. When grout fails — and it will —
      water hits the wall cavity directly. Mold establishes in the framing inside
      of 12 months in Puget Sound humidity. The fix isn't cosmetic: cement board,
      RedGard or Schluter Kerdi waterproofing membrane, then new large-format
      porcelain. Skipping that step just resets the same clock."

  - title: "Undersized bath fan venting moisture into the attic"
    description: "A 50 CFM fan in a 70-square-foot Burien bathroom is not a ventilation
      system — it's decoration. Mid-century homes got fans added as afterthoughts,
      often ducted into the attic cavity instead of exterior. October through April,
      that attic collects moisture until you've got a mold problem up there too. We
      spec Panasonic WhisperCeiling fans at 110 CFM minimum with a humidity sensor,
      ducted through the roof or soffit. King County DPER requires a permit for this
      — we pull it."

faq:
  - q: "How fast can you get to Burien for a bathroom remodel consultation?"
    a: "Burien is 20-25 minutes from our base via SR-509 or 1st Ave S — straightforward
      drive, no tolls. Vladislav comes out himself for the walk-through, not a sales
      rep. Call (206) 591-1096 to set a time. TopVolk is a WA Licensed Contractor;
      100+ projects completed since 2023 across King and Snohomish counties."

  - q: "Do you work with Kohler and Moen fixtures common in 98146 homes?"
    a: "Yes. Most Burien bathrooms we estimate have Kohler or Moen rough-in hardware
      that's 25-40 years old. We replace it — supply lines, shutoff valves, the works —
      and source new fixtures from Kohler, Moen, or American Standard depending on the
      budget. No sense doing new tile and leaving 50-year-old galvanized supply lines
      behind the wall."

  - q: "What does a bathroom remodel in Burien actually cost and how long does it take?"
    a: "A single hall bath gut-and-replace — new tile, vanity, tub-to-shower conversion
      with a curbless shower, updated ventilation — typically runs $18K-$34K in this
      market. Timeline: 4-6 weeks of active construction once permits are pulled.
      King County DPER plan review adds 3-5 weeks on the front end for structural or
      plumbing changes. You get a line-item quote from us, not a range. Missed deadline
      penalty is written into the contract — call (206) 591-1096 to schedule a free
      on-site estimate."