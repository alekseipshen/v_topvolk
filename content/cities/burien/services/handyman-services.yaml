title: "Burien Handyman Services — Punch Lists, Patches & Small Repairs"

intro: |
  Post-war ranchers and early 1960s split-levels make up the backbone of Burien's
  residential stock — and most of them have been renovated in pieces, not all at once.
  A bathroom update wraps up in Seahurst, the GC moves on, and the homeowner is left
  holding a paper bag with door hardware, a Moen Align faucet still in the box, two
  plumber access patches in the drywall, and a deck board that was definitely getting
  replaced "after the remodel." That backlog is exactly what TopVolk Construction LLC
  handles. Owner Vladislav Volkov has worked through punch lists, fixture swaps, and
  small-scope repairs on 100+ projects since 2017 — across Burien, Normandy Park, the
  Five Corners corridor, and unincorporated King County parcels east of 1st Avenue S.
  Direct line to the person doing the work: (206) 591-1096. No sales staff, no dispatch
  queue.

localContext: |
  Burien's residential character splits pretty cleanly by geography. The 98146 zip —
  Seahurst, Three Tree Point, and the neighborhoods west of Ambaum Blvd SW — is
  predominantly post-war construction: 1948-1968 wood-frame ranchers with original
  galvanized supply lines being converted to PEX in phases, single-pane windows getting
  swapped one room at a time, and decades of owner-DIY work layered under every surface.
  Over in 98148 — the stretch bordering SeaTac and Tukwila — the housing runs 1970s
  and early 1980s tract, builder-grade fixtures hitting end of life roughly all at the
  same time. Heavy rainfall from October through May (~37 inches per year) keeps moss
  active on north-facing trim, compresses door weatherstripping down to nothing in 3-4
  seasons, and accelerates rot in any exposed wood that isn't pressure-treated or
  composite. For handyman-scope work specifically, most tasks in Burien — fixture swaps,
  drywall patches, weatherstripping, deck board replacement — fall below the permit
  threshold for both the City of Burien's permit portal and King County DPER for
  unincorporated parcels. Structural framing work or new electrical circuits are a
  different conversation.

commonProblems:
  - title: "Punch List Pile-Up After Remodels in Seahurst and Three Tree Point"
    description: |
      Remodel crews hand off a punch list at project close-out, but a lot of those line
      items slide because the crew is already on the next job. What stays behind: cabinet
      knobs and pulls still in a bag, a towel bar never anchored into blocking, caulk
      joints at the tub deck skipped during the blue tape walkthrough, and drywall dings
      from appliance delivery. In the older Seahurst homes, mounting hardware often means
      hitting original lath-and-plaster behind the drywall — standard toggle bolts pull
      through in that situation, so you need a properly sized molly anchor or a stud
      location. A 20-item punch list from a mid-scope kitchen or bath remodel in the
      98146 zip typically runs 4-6 hours of labor and closes out in a single visit.
      Labor for that scope usually lands between $400-$700 depending on complexity.
      Call (206) 591-1096 to get a specific estimate before booking.

  - title: "Drywall Patches and Texture Matching in 1960s Wood-Frame Homes"
    description: |
      Older ranchers through the Five Corners and Ambaum neighborhoods were often
      drywalled over original plaster, or absorbed patchwork repairs across multiple
      ownership cycles. An access hole from a plumber, a cable bracket that got pulled,
      a doorknob punching through — each leaves a different substrate situation underneath.
      Texture matching is where amateur patches fail: skip trowel, orange peel, and the
      heavier hand-texture common in 1970s-era homes each need different spray settings
      and mud viscosity. A 6-inch patch done wrong reads as a perfect circle on the wall
      the moment light hits it at an angle. USG Sheetrock 90-minute setting compound for
      the base, lightweight all-purpose for the finish layer — that combination feathers
      correctly and holds the texture. Most patches in this housing stock take two visits:
      one for patching and texture, one return visit for paint after full cure (minimum
      24 hours). Per-patch labor runs $150-$300 depending on size and texture complexity.

  - title: "Weatherstripping Replacement Before the October Rains Hit"
    description: |
      Side-entry and back doors on 1960s-1970s Burien ranchers are the worst offenders —
      they get used constantly but rarely maintained. The original foam weatherstripping
      on the jamb stops compresses to near-nothing over 10-15 years, and the door sweep
      aluminum carrier bends until the vinyl wiper is dragging instead of sealing.
      That gap at the threshold pulls cold air through all winter and adds measurable
      load to a gas furnace or a Mitsubishi mini-split. Replacing a door sweep with a
      Pemko 315CN heavy-duty model and installing fresh Q-Lon bulb weatherstripping on
      the three jamb stops closes the draft completely. Most exterior door weatherstripping
      jobs take 45-90 minutes per door; a 3-bedroom rancher with 2-3 problem doors runs
      $200-$350 total for labor and materials. Worth doing in September before the rain
      starts — not in November after you've already been cold for a month.

  - title: "Deck Board Replacement and Railing Repairs on Bluff-Side Homes"
    description: |
      A lot of the elevated rear decks in Seahurst and the Three Tree Point area were
      built in the late 1980s or early 1990s — they have views toward Vashon Island and
      they've been weathering PNW rain ever since. Douglas-fir decking from that era is
      past structural service life in this climate: surface checks, holds moisture between
      boards, and the rot eventually works down to the rim joist and joist hanger
      connections from underneath. Replacing individual boards only makes sense when the
      framing is still solid — soft bounce in the deck surface means a framing inspection
      before any board work starts. For structurally sound decks, swapping rotted boards
      with Trex Enhance Naturals composite and re-securing loose railing pickets and
      post cap hardware on a 200-square-foot deck typically runs $400-$900 for labor,
      not counting structural repairs. Ledger board connections to the house should get
      checked during any deck work — that's usually the first place hidden rot shows up.

  - title: "Smart Home Device Installation Without an Electrician Invoice"
    description: |
      Ring Video Doorbell Pro 2, Nest Learning Thermostat, Ecobee with occupancy sensors,
      Lutron Caseta dimmer switches — Burien homeowners in the 98146 and 98148 zips are
      buying these regularly, and installation is where the project stalls. The Ring Pro
      needs a transformer with at least 16VA output; the original doorbell transformers
      in most 1970s homes put out 10VA and won't power it reliably. A Nest thermostat
      on a 2-wire heating system needs a C-wire adapter or a new thermostat cable run
      through a finished wall. Neither of these requires a licensed electrician or a
      permit — but they do require someone who can check transformer output with a
      multimeter and fish a new cable without opening up drywall. Most smart home device
      installs run $75-$150 per device depending on what the existing wiring situation
      requires. Vladislav handles these regularly as add-ons to punch list visits, so
      batching them with other work keeps the per-item cost down.

faq:
  - q: "How fast can you get to Burien for handyman work?"
    a: |
      Burien sits right off SR-509, roughly 20 minutes south of Seattle, and TopVolk
      works throughout King County consistently — so scheduling is not a distance issue.
      For handyman visits, Vladislav typically books 1-2 weeks out depending on current
      project load. Call (206) 591-1096 directly; there's no dispatch office, so you'll
      get a straight answer on availability right away. Street parking around Five
      Corners and Seahurst is generally easy. On-site estimates for multi-item punch
      lists are free — pricing is done in person, not over the phone, so the quote
      reflects what's actually there.

  - q: "What does handyman work in Burien typically cost per visit?"
    a: |
      Pricing depends on what's on the list. A single fixture replacement — faucet,
      toilet, exhaust fan — usually runs $150-$250 including basic materials. A full
      20-item punch list after a remodel (hardware install, caulking, drywall patches,
      door adjustment) typically fills a full day and runs $500-$800 in labor, materials
      separate. Weatherstripping 3 doors is $200-$350 all-in. Smart home device installs
      run $75-$150 per device. Written line-item estimates are provided before any work
      starts — not vague hourly guesses. Call (206) 591-1096 to schedule a free on-site
      estimate.

  - q: "Do handyman repairs in Burien require a permit from King County?"
    a: |
      Most handyman-scope work doesn't trigger a permit requirement. Fixture replacements
      (faucets, toilets, light fixtures swapped like-for-like), drywall patches,
      weatherstripping, deck board replacement on sound framing — none of these require
      a King County DPER permit for unincorporated parcels, and the City of Burien's
      threshold for maintenance-category work is consistent with that. It gets more
      nuanced if deck board work reveals structural damage needing new joist work, or
      if any electrical circuit work is involved — those cross into permitted territory
      regardless of scope. For work that does need a permit, TopVolk is a WA Licensed
      Contractor and handles the application through the correct jurisdiction, whether
      that's King County DPER or the City of Burien's permit portal directly.

  - q: "Can you handle smart home installs and fixture swaps on the same visit?"
    a: |
      Yes — that combination is common. A single visit might cover a Nest thermostat
      installation, a Ring doorbell transformer upgrade, two Moen bathroom faucets, and
      a Kohler fill valve replacement all in one trip. Batching multiple items into one
      visit is the most cost-efficient way to work through a backlog. Vladislav arrives
      with a standard materials kit — weatherstripping stock, toggle anchors, caulk,
      common supply line fittings — so most small items don't require a second materials
      run. Give a full list when you call (206) 591-1096 so the visit is properly
      stocked and nothing gets pushed to a follow-up trip.

  - q: "How long do repairs hold up in Burien's wet climate?"
    a: |
      Material selection is what determines longevity in a wet environment. Pemko door
      sweeps and Q-Lon weatherstripping hold up 5-7 years in PNW conditions with normal
      use; cheap foam tape lasts one rainy season. Deck repairs done with Trex composite
      or properly sealed pressure-treated lumber should be good for 15-20 years without
      needing board replacement again. Drywall patches done with the right setting
      compound and matched texture don't fail on their own — the only risk is painting
      too soon before the mud fully cures. Smart home devices carry manufacturer
      warranties; Vladislav installs to spec so the warranty isn't voided by a wiring
      shortcut. Any workmanship issue gets corrected — deadline and quality accountability
      are written into every TopVolk contract, not just stated verbally.

  - q: "Do you cover Normandy Park, SeaTac, and other cities near Burien?"
    a: |
      Coverage spans King County, Snohomish County, Pierce County, and Kitsap County —
      so Normandy Park, SeaTac, Tukwila, Des Moines, Renton, and Federal Way are all
      routine scheduling for TopVolk. Drive times from Burien to any of those cities
      are under 20 minutes, which keeps the logistics simple. Vladislav runs the
      schedule himself, so there's no confusion about territory or coverage area
      restrictions. Call (206) 591-1096 to check current availability for your
      location and get a free on-site estimate scheduled.