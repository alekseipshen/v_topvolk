title: "Burien General Contracting — Remodels, ADUs, Permits Handled"

intro: |
  Post-war ranchers in Gregory Heights and Boulevard Park — zip 98146 — were
  built fast in the early 1950s and haven't been touched since. Demo day on a
  Burien remodel often surfaces galvanized supply lines, a load-bearing partition
  nobody drew on the permit set, and a KitchenAid range sitting on a floor joist
  that needs sistering before new tile goes down. TopVolk Construction LLC has
  handled exactly these surprises on 100+ projects across King County since 2023.

localContext: |
  Most of the housing stock in 98146 and 98148 was framed in Douglas-fir between
  1948 and 1968 — solid bones, but crawlspaces that collect moisture year-round
  off Puget Sound. Ranchers around Three Tree Point and Seahurst often sit on
  post-and-pier foundations with minimal ventilation, making a vapor barrier and
  DriCore subfloor standard before any finish work starts. Permit jurisdiction is
  the City of Burien — smaller operation than Seattle SDCI, but plan review still
  runs 6-10 weeks on structural submittals.

commonProblems:
  - title: "Structural surprises mid-demo on 1950s Burien ranchers"
    description: "Pull drywall on a 1950s Burien rancher and the ceiling joist
      might also be carrying lateral load — rafters toe-nailed to a wall someone
      removed in the 1980s, no LVL beam in sight. Sistering the joist or dropping
      a proper beam becomes a change order nobody budgeted. Bringing a structural
      engineer in before demo is the fix, not the reaction."

  - title: "Multi-trade scheduling gaps killing project timelines"
    description: "Framing passes rough-in inspection, then the electrician is
      three weeks out, then the plumber can't thread the schedule around a Bosch
      tankless water heater install that needs a gas line reroute. Gaps between
      trades kill timelines. Managing MEP coordination — mechanical, electrical,
      plumbing — keeps those gaps to days, not months."

  - title: "Incomplete permit submittals stalling the project start"
    description: "City of Burien runs its own permit portal, separate from King
      County DPER. For an addition or DADU, the AHJ requires a site plan, floor
      plan, structural drawings, and energy code compliance docs before issuing.
      Homeowners submitting without a complete package often lose 4-6 weeks
      waiting on a correction letter. TopVolk prepares the full submittal upfront."

faq:
  - q: "How fast can you get to Burien for a General Contracting consultation?"
    a: "Burien is 20-25 minutes out — straight down 1st Avenue S or SR-509.
      Call (206) 591-1096 to set up a free on-site consultation with Vladislav
      directly. Most weeks we can get there within a few days of you reaching out."

  - q: "Which appliance brands do you work with during a Burien kitchen remodel?"
    a: "Bosch, KitchenAid, GE Profile, Samsung — those are the brands we see most
      in 98146 kitchens. That covers 240V rough-in for induction ranges, gas line
      modifications for range hoods pulling 400+ CFM, and refrigerator water lines.
      Whatever the homeowner selects, we coordinate the rough-in before drywall closes."

  - q: "What does a whole-house remodel in Burien typically cost and how long does it run?"
    a: "Most full renovations in 98146-98148 fall between $100K and $200K depending
      on scope. Permits run 6-10 weeks; construction follows for 3-5 months.
      Vladislav — WA Licensed Contractor, owner of TopVolk — walks through a
      line-item quote after the site visit, not a vague ballpark. Deadline penalties
      go into the contract. Call (206) 591-1096 to schedule."