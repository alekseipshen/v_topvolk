title: "Burien Basement Finishing — Waterproof & Permitted Rooms"

intro: |
  Seahurst Park sits right on the Puget Sound bluff, and the neighborhoods behind
  it — along 26th Avenue SW and back toward Five Corners — sit on glacial till that
  doesn't drain fast. From October through April, hydrostatic pressure builds against
  basement walls throughout Burien's 98146 zip code, and the result shows up the same
  way in house after house: efflorescence striping the block walls, a corner puddle
  that appears every January, and a mildew smell that no amount of ventilation fixes.
  Finishing a basement here is a moisture management project first, and a construction
  project second. Vladislav Volkov at TopVolk Construction has completed basement
  finishing work across King County since 2023, and Burien's soil conditions and
  housing stock are a known quantity by now. Homes in the Seahurst area and around
  Boulevard Park nearly always get a DriCore subfloor panel system before any
  framing begins — slab-on-grade moisture transmission in this part of King County
  is high enough that standard OSB subfloor will cup and buckle within two heating
  seasons if you skip that step.

localContext: |
  Burien's residential blocks developed mostly between the late 1940s and the
  mid-1970s — post-WWII construction that pushed south from Seattle along the
  Highway 99 corridor. The ranchers and split-levels in the 98168 zip around
  Sunnydale and Gregory Heights typically have full basements with 7- to 7.5-foot
  poured concrete walls, but the utility chases, ductwork, and drain lines eat
  8 to 10 inches of headroom once a finished ceiling goes in. Hitting the IRC
  minimum of 7 feet for habitable space — with drywall hung — often requires
  rerouting mechanical runs before a single stud goes up. In the older blocks
  closer to 98148, particularly near Three Tree Point and the lower Seahurst
  streets, post-and-pier foundations appear in some homes, which changes the
  scope entirely. The City of Burien has run its own permit center since
  incorporation in 1993, so plan review goes through Burien's building division
  rather than King County DPER. For a full basement finish with a bedroom and
  bathroom rough-in, plan review typically runs 4-6 weeks in the current queue.

commonProblems:
  - title: "Active Water Intrusion Before Framing Can Begin"
    description: "Hydrostatic pressure against Burien basement walls peaks during the heavy
      rain cycles that run from November through February. Block-wall construction
      — common in homes built through the 1960s around Five Corners — lets water
      wick through mortar joints even when there are no visible cracks.
      A perimeter interior drain channel (Schluter Kerdi-Drain profile or a
      standard French drain system) along the footing, tied into a sump pump
      pit with a battery backup unit, is the correct fix before any framing
      or insulation goes in. Skipping this and framing directly against a
      damp wall produces mold behind the drywall within 18 months — which
      means demo, remediation, and a second finish job at full cost. The
      perimeter drain and sump pump installation adds roughly $4,000-$8,000
      depending on linear footage. TopVolk will not frame a Burien basement
      without resolving active moisture first."

  - title: "Egress Windows for Legal Basement Bedrooms"
    description: "Any bedroom in a finished Burien basement requires an egress window meeting
      IRC minimums: 5.7 square feet net clear opening, 20-inch minimum width,
      24-inch minimum height, sill no more than 44 inches above finished floor.
      The existing hopper-style windows in most 1950s and 1960s Burien ranchers
      — around Gregory Heights and Sunnydale — have 10 to 14 inches of net
      opening. They don't come close to qualifying. Cutting a code-compliant
      egress opening means saw-cutting the poured concrete or block wall,
      installing a window well with at least 9 square feet of floor area and
      proper drain rock at the base, then setting a casement unit. Milgard's
      egress-rated casement in a 36x24 configuration fits this application
      well. Budget $2,500-$4,500 per egress opening including the window well
      and drainage, and expect Burien's building division to inspect the rough
      opening before any insulation or drywall is permitted."

  - title: "Mold Remediation and Vapor Barrier Sequencing"
    description: "In Burien homes built before 1975, block and poured walls commonly show
      mold colonies 12 to 20 inches up from the slab — sometimes higher on
      north-facing or below-grade walls that never see direct sun. Framing
      over active mold is a code violation and a health hazard that doesn't
      disappear behind drywall. The correct sequence: treat visible growth
      with an EPA-registered encapsulant like Fiberlock AFP, apply RedGard or
      Drylok Extreme directly to the masonry surface, then install 2x4 stud
      walls furred out at least 1 inch from the block — never bearing against
      it — with unfaced fiberglass batt between studs. Burien's permit center
      requires a framing inspection before insulation can be installed, which
      means the sequencing isn't optional. TopVolk, a WA Licensed Contractor,
      pulls all required permits and coordinates inspection scheduling so
      remediation, framing, and rough-in inspections hit in the right order."

  - title: "Ceiling Height: Ductwork and Mechanical Chase Conflicts"
    description: "The biggest cost variable in finishing a Burien basement is usually what
      the mechanical contractor finds at the ceiling. A 1965 rancher in the
      98168 zip often has sheet-metal duct runs crossing at 6'8\" rough-in
      height, with a soil stack and drain lines dropping another 4 to 6 inches
      lower near the wet walls. Hang drywall on a standard dropped ceiling
      frame and you're sometimes at 6'5\" finished — below the IRC 7-foot
      minimum for habitable space. Rerouting duct runs before framing adds
      $1,500-$4,000 depending on how many transitions and offsets the HVAC
      sub needs to make. Some runs can be boxed into perimeter soffits and
      still clear the 7-foot threshold in the main room. In bedroom
      applications, a Mitsubishi mini-split can sometimes eliminate ductwork
      conflict entirely. This is a design-phase question, not something to
      discover after the studs are in."

  - title: "Permit Sequencing and Inspection Hold Management"
    description: "Burien issues its own building permits through the city's permit center.
      A full basement finish with a bedroom, bathroom rough-in, and electrical
      subpanel requires building, electrical, plumbing, and mechanical permits
      — sometimes pulled in parallel, sometimes sequentially depending on
      scope. The rough-in inspection (framing, electrical rough, plumbing
      rough, mechanical rough) must pass before insulation goes in. Insulation
      sign-off has to happen before drywall is hung. If the finish bathroom
      includes a tiled shower, Burien inspectors require a Schluter Kerdi
      membrane inspection before any tile gets set. Missing a single
      inspection hold — even by a day — can push the schedule by a week or
      more. TopVolk coordinates all trade inspections directly, builds the
      inspection calendar into the project timeline before work starts, and
      has penalties for missed completion milestones written into the
      contract."

