title: "Burien Power Washing — Cedar, Concrete, and Salt-Air Buildup"

intro: |
  Salt air off Puget Sound doesn't stay at the shoreline. Drive up from Seahurst Park
  into the hillside neighborhoods around zip 98166, and you'll find concrete driveways
  wearing a gray-white mineral haze, cedar fences with dark streaks running down the
  grain, and north-facing deck boards that haven't fully dried since October. Burien
  sits low enough that southwest marine winds push moisture and salt spray further
  inland than most homeowners expect — then the area's mature Douglas-fir canopy drops
  needles and tannin on every horizontal surface throughout the winter. A cedar deck
  off the back of a 1960s ranch in Gregory Heights can look worse after two rainy
  seasons than the same deck in Bellevue after four, purely because of the exposure
  pattern here. Solid surface prep before any staining, sealing, or exterior paint job
  starts with a proper wash — soft-wash for biologicals on wood and Hardie cement-board
  siding, higher-PSI for concrete and pavers where a Jomax-based pre-treatment handles
  embedded oil and tire marks. TopVolk Construction LLC has run this sequence on 100+
  projects across the Seattle Metro since 2017, and it consistently makes the
  difference between paint that bonds and paint that peels.

localContext: |
  Burien's housing stock runs heavily toward post-WWII construction — peak build years
  were the 1950s and '60s, and you'll find single-story ranchers and split-levels across
  both the 98148 and 98166 zip codes with original poured-concrete driveways, cedar
  board fences, and covered carports that trap moisture year-round. North Burien
  neighborhoods like Boulevard Park have block after block of these, and the carport
  configuration means the concrete underneath never fully dries between October and
  June. Closer to Three Tree Point in 98166, homes sit on steeper lots with heavier
  canopy overhang — chronic shade on north and west-facing surfaces means a cedar fence
  that hasn't been cleaned in four years won't just look bad, it'll have surface fiber
  breakdown that prevents stain from penetrating properly even after sanding. Seahurst
  Park area homeowners also contend with salt-spray residue on Hardie panel siding and
  painted wood trim, which requires thorough low-pressure rinsing before any exterior
  paint will bond correctly. King County DPER doesn't require a permit for washing
  itself, but the prep work is often the first line item before permitted exterior
  renovation begins — sequencing matters.

commonProblems:
  - title: "Moss and Algae on North-Facing Cedar Decks — The Annual PNW Reset"
    description: |
      North-facing deck boards in Burien's tree-canopy neighborhoods stay damp eight
      months out of twelve. Between October and May, any cedar or composite surface
      without afternoon sun will host moss colonies inside a single season — boards turn
      green, then gray, then the surface fiber starts to lift. Soft-washing with a
      sodium hypochlorite (SH) solution at 1–3% concentration, mixed with a surfactant
      to improve dwell time, kills biologicals at the root rather than just blasting the
      surface layer off. Running straight high-PSI water at cedar grain raises the wood
      fibers, which actually accelerates moss re-establishment the following fall. After
      the soft-wash application, a 15–20 minute dwell period breaks down the dead
      biologicals before the post-rinse cycle. For composite decking like Trex or
      TimberTech, PSI stays below 1,500 — most manufacturers void the board warranty
      above that threshold. Budget $150–$300 for a 300–400 sq ft deck wash, depending
      on moss density and whether a pre-treatment soak is required.

  - title: "Hardie Siding and Stucco Prep Before Exterior Repaint"
    description: |
      Hardie cement-board siding is popular on Burien's post-2000 builds and 1990s
      re-sides precisely because it resists rot. What it doesn't resist is biological
      surface staining — mold, mildew, and algae colonize the paint layer, especially
      on north and west elevations that face the prevailing marine weather. Painting
      over a contaminated surface means the new coat bonds to a biological film, not
      the substrate, and peeling starts within a season. Correct prep sequence: low-
      pressure soft-wash under 500 PSI using downstream injection of SH solution, clean
      water rinse, then a full dry period of 48–72 hours before primer touches the
      surface. Stucco needs the same sequence but demands closer attention to cracks,
      since pressure above 800 PSI can drive water behind the scratch coat. On a
      1,500 sq ft single-story exterior in 98148, plan $400–$600 for the wash, scheduled
      as the first line item before any paint contractor arrives on site.

  - title: "Washing as Required Prep Before Permitted Deck and Ledger Work"
    description: |
      When a permitted deck replacement or ledger board attachment goes through Burien's
      permit center or King County DPER, the rough-in inspection often requires the
      existing ledger-to-rim-joist connection to be visible and assessable. Washing
      the existing structure — ledger board, post bases, and flashing detail — before
      demolition documentation is standard sequencing on our exterior projects. If the
      ledger inspection fails because biological growth obscures the flashing condition,
      the project waits weeks for a re-inspection slot. For homes in 98166 adding an
      attached deck that needs a permit for the ledger connection, both Burien's permit
      center and King County DPER want clean, clear permit photos of the ledger, flashing,
      and band joist. TopVolk is a WA Licensed Contractor, and the wash sequence gets
      built into our permit packages whenever exterior structural work is involved — the
      wash isn't just aesthetic prep, it's part of the documentation chain.

  - title: "Cedar Fence Cleaning Before Staining — Burien's 3-to-4 Year Cycle"
    description: |
      Cedar fence stain in the Pacific Northwest has a realistic service life of three
      to five years before UV breakdown and moisture cycling degrade the finish. In
      Burien's wetter coastal microclimate, the low end of that range is the norm,
      particularly for fence runs with north-facing boards. Before any Armstrong Clark
      or TWP (Total Wood Preservative) stain application, the fence surface needs to be
      clean, free of gray oxidation, and open at the grain. A low-pressure wash combined
      with an oxalic acid wood brightener handles both biological contamination and gray
      surface oxidation simultaneously, restoring the natural cedar color and preparing
      the grain to accept stain. Skip the brightener and apply stain over gray oxidized
      wood, and the new coat sits on degraded fiber rather than bonding into it. For
      a 150-linear-foot cedar fence in 98148, figure $300–$500 for the wash and brighten
      step — stain application is priced separately. Wash-to-stain window is 48–72 hours.

  - title: "Patio and Paver Restoration — Organic Buildup in Shaded Burien Yards"
    description: |
      Concrete pavers and natural stone patios in shaded Burien backyards accumulate a
      layer of algae, lichen, and efflorescence that rainfall and foot traffic won't
      clear on their own. Efflorescence — the white calcium-carbonate bloom that migrates
      up through concrete paver joints — is cosmetic but signals moisture movement through
      the base. Algae and lichen on paver surfaces become a slip hazard, especially on
      steps or near areas with frequent foot traffic. Soft-wash treatment with SH solution
      clears the biologicals; a follow-up application of Armor AR350 penetrating concrete
      sealer closes the pores and slows re-contamination by 12–18 months. The joint sand
      between pavers also needs inspection post-wash — high-pressure surface cleaning
      can flush out polymeric sand, which then requires replacement with fresh stabilizing
      jointing sand and compaction before the patio is back in use. Typical patio
      restoration runs $300–$600 for a 200–300 sq ft surface, plus sealer material cost.

