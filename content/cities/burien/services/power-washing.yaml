      of a larger project. Call (206) 591-1096 to schedule.

  - q: "Do I need a permit for power washing in Burien, or does exterior work trigger King County review?"
    a: |
      Power washing itself doesn't require a permit from King County DPER or Burien's
      permit center — it's maintenance, not construction. But if the wash is scheduled
      as prep for work that does require a permit (deck replacement, siding replacement,
      ledger repair, ADU exterior work), the wash gets sequenced into that project
      timeline and the two get coordinated. King County DPER handles permits for
      unincorporated King County parcels; Burien has its own permit intake for properties
      inside city limits. TopVolk is a WA Licensed Contractor and handles permit
      paperwork when the wash is part of a larger permitted scope — the sequencing gets
      planned so inspections don't stall the project downstream.

  - q: "Can you soft-wash my roof in Burien without voiding the shingle warranty?"
    a: |
      Soft-wash is the only correct method for asphalt shingles, and it's the only one
      we use on roofs. Pressure washing above roughly 100 PSI strips granules from the
      shingle surface, which shortens shingle lifespan and voids the manufacturer warranty
      — GAF, CertainTeed, and Owens Corning all state this directly in their product
      documentation. Low-pressure soft-wash applies sodium hypochlorite solution via
      downstream injection at under 100 PSI, with dwell time that kills moss and algae
      at the root structure. Burien's north-facing roof planes under heavy tree canopy
      are the highest-demand application for this — moss colonies on asphalt shingles
      trap moisture against the substrate and can accelerate granule loss by a full
      season or two if left untreated past year three.

  - q: "How long will the results last after a power wash in Burien's climate?"
    a: |
      Concrete surfaces cleaned and then sealed with a penetrating sealer like Armor
      AR350 typically stay clean 18–24 months under Burien's conditions. Unsealed
      concrete re-contaminates within 12–18 months, depending on tree canopy overhead.
      Cedar fences and decks washed and immediately stained with Armstrong Clark or TWP
      will hold the finish 3–4 years on south and west faces, 2–3 years on north-facing
      boards before the next cycle is needed. Hardie siding, once washed and repainted
      with a quality 100% acrylic exterior paint, typically goes 6–10 years before the
      next full repaint cycle. Staying on that schedule costs far less than letting
      biological contamination work into the paint bond and triggering a full strip-and-
      reprime cycle.

