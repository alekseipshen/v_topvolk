title: "Burien Insulation — Attics, Crawl Spaces & Rim Joists"

intro: |
  The post-war ranchers and split-levels that line Burien's residential streets — most of them built
  between 1952 and 1972 in neighborhoods like Seahurst and the hillside blocks above Three Tree Point
  — were insulated to standards that made sense at the time but fall well short of what Washington
  State Energy Code requires today. A lot of those attics are sitting at R-11 to R-19, while current
  code calls for R-49 in the Seattle metro climate zone. Add in the moisture that rolls in off Puget
  Sound from October through April and you've got crawl spaces that grow mold on fiberglass batts
  within a few years. TopVolk Construction LLC has completed 100+ projects across the Seattle metro
  since 2023, including blown-in cellulose retrofits in tight Craftsman attics and closed-cell spray
  foam on rim joists in 1960s ranchers. Vladislav Volkov handles the scope directly — you talk to the
  person doing the work, not an estimator relaying information from an inspection he didn't attend.

localContext: |
  Most of Burien's housing stock falls in zip codes 98146 and 98166, and the insulation situation is
  similar in both. The 98146 corridor along Ambaum Boulevard has block after block of 1950s and 1960s
  ranchers with vented crawl spaces, where fiberglass batts stapled to the floor joists have absorbed
  enough Puget Sound humidity to sag and separate from the subfloor. Out toward Three Tree Point and
  the 98166 zip, you see more 1970s split-levels with knee walls — those uninsulated triangular
  cavities behind finished walls are a consistent source of heat loss that homeowners often don't
  realize exists. Older homes near the original Burien Town Square add another layer of complexity:
  attic geometry that makes blown-in equipment difficult to maneuver through a standard 18-inch hatch.
  Burien operates its own building department (separate from King County DPER), and Washington State
  Energy Code applies uniformly regardless: R-49 for attics, R-21 for walls where accessible, and
  vapor barriers required in all crawl spaces. Knowing which scope triggers a permit — and which
  doesn't — is part of what we sort out before a contract is signed.

commonProblems:
  - title: "Attic Insulation Below R-49 in 1950s–60s Burien Ranchers"
    description: |
      Burien ranchers in the 98146 zip commonly show attic insulation at R-11 to R-19 — whatever was
      standard when the permit was pulled in 1958 or 1965. Upgrading to R-49 means blowing in roughly
      14–16 inches of cellulose over what's already there, though we check first for moisture damage
      that would require removal before adding new material. For attics with tight 18-inch hatches
      (common in original rancher construction), blown-in CertainTeed InsulSafe cellulose is easier to
      deploy than rolling in full fiberglass batts — you don't have to maneuver full rolls through a
      2-square-foot opening. The job typically takes one day for a standard 1,200 sq ft attic
      footprint. Cellulose's higher density also resists settling better over time than blown fiberglass
      in this climate. Full attic upgrades in Burien run $2,500–$5,500 depending on existing
      conditions, access difficulty, and whether old deteriorated batting needs removal first.

  - title: "Crawl Space Encapsulation — Vented Crawls Failing in Burien's Climate"
    description: |
      Unencapsulated crawl spaces are the single most common insulation problem in Burien homes built
      before 1980. The vented crawl space design — code-standard for decades — lets humid Pacific air
      cycle through from October to May. That moisture condenses on cold Douglas-fir floor joists and
      compresses fiberglass batts below the subfloor, cutting their R-value by half or more. What we
      typically find: sagging insulation that's dropped out of its staples, visible mold on framing,
      and rust on steel joist hangers. The fix is full encapsulation — remove degraded insulation,
      treat joists for mold if needed, install a 20-mil reinforced vapor barrier across the ground,
      tape all seams, then add Owens Corning FOAMULAR rigid foam board against the foundation walls.
      This converts the crawl space from vented to conditioned. Timeline is 2–3 days for a typical
      Burien rancher. Cost range: $4,000–$9,000 depending on crawl space size, access, and whether
      mold remediation is required.

  - title: "Rim Joist Spray Foam — The Air Leak Most Homeowners Never See"
    description: |
      The rim joist — the band of framing that runs around the perimeter of your foundation at floor
      level — is one of the biggest air leakage points in any pre-1980 Burien home. In winter, you
      may notice frost on the inside of that framing, or drafts near baseboards on exterior walls.
      Closed-cell spray foam at 2–3 inches (roughly R-12 to R-19) seals the air gap and provides
      insulation value in a single application. For smaller homes, two-component spray foam kits
      handle the job efficiently; for larger footprints, we coordinate with a licensed spray foam
      applicator. Burien's building department does not require a permit for rim joist foam-only work
      — it's the crawl space encapsulation that triggers the permit requirement. That distinction
      matters for scheduling: rim joist work can typically start within 1–2 weeks of contract
      signature. Cost on a standard Burien rancher runs $800–$2,200 depending on linear footage and
      access conditions. It's consistently one of the highest-ROI insulation upgrades per dollar spent.

  - title: "PSE Rebates and Seattle City Light Credits — Real Numbers for Burien Projects"
    description: |
      Puget Sound Energy is the dominant utility in Burien, and PSE's rebate program for insulation
      upgrades is worth working into your project budget. Current PSE rebates for attic insulation
      run up to $0.25 per square foot when upgrading to R-49 or higher — on a 1,500 sq ft attic,
      that's $375 back. Crawl space insulation rebates are in the $0.15–$0.30 per square foot range.
      The rebates require work to be performed by a registered contractor and documentation needs to
      match the permit record. TopVolk handles the rebate paperwork as part of the project scope — we
      pull utility receipts, complete the forms, and submit. Factoring in PSE rebates, a full attic
      plus crawl space encapsulation project that costs $7,000–$10,000 gross can net out $500–$1,200
      lower after credits. Call (206) 591-1096 to get a line-item quote that breaks out rebate-eligible
      work separately so you know exactly what to expect back.

  - title: "Knee Wall Insulation in 1970s Burien Split-Levels"
    description: |
      Split-level homes in the 98166 zip — common along the hillside blocks toward Three Tree Point
      — often have knee walls: short vertical framing in 1.5-story sections where the roof pitch drops
      to meet the floor. These cavities are almost never insulated in original construction. The space
      behind the knee wall is unconditioned attic air, and without insulation and an air barrier on
      the knee wall face, you're essentially heating a triangle of open attic. Rockwool Safe'n'Sound
      mineral wool works well here — it delivers both thermal performance and meaningful acoustic
      improvement compared to fiberglass batt. The knee wall cavity also needs rigid foam blocking at
      the rafter-floor joist junction; otherwise warm interior air bypasses the insulation entirely
      through the open joist cavity. This is detail work that's easy to miss if you're not methodical
      about air sealing at every transition point. Knee wall insulation on a typical Burien split-level
      costs $1,200–$3,000 depending on linear footage, and most projects are completed in a single day.

faq:
  - q: "How fast can TopVolk get to Burien for an insulation estimate?"
    a: |
      Burien is an easy run — SR-509 south or I-5 to 148th, roughly 20–25 minutes from Seattle proper
      depending on SeaTac traffic. We can typically schedule an on-site estimate within 3–5 business
      days of your call. The estimate is free and Vladislav does it in person — you get a line-item
      scope on the spot and a written quote within 24 hours of the visit. Call (206) 591-1096 to set
      that up. For most insulation scopes (attic upgrade or crawl space encapsulation), work starts
      within 2–4 weeks of a signed contract. Deadline commitments are written into the contract —
      not verbal assurances.

  - q: "What does attic insulation to R-49 cost in Burien?"
    a: |
      For a standard 1,200–1,500 sq ft Burien rancher attic, blown-in cellulose to R-49 runs
      $2,500–$5,500. What moves the number: access difficulty (tight hatch vs. pull-down stair),
      existing insulation condition (add-over vs. full removal), and whether knob-and-tube wiring is
      present (requires clearance from an electrician before covering). Crawl space encapsulation adds
      $4,000–$9,000 on top. Rim joist spray foam is $800–$2,200 separately. These are real ranges from
      recent Burien-area projects. PSE rebates can recover $375–$1,200 of that total depending on scope.
      The on-site estimate is free — call (206) 591-1096 or schedule online to get a written line-item
      quote with no padded ballparks.

  - q: "Does insulation work in Burien require a building permit?"
    a: |
      Attic insulation upgrades — blowing additional material over existing — generally don't require a
      permit in Burien. Crawl space conversions from vented to conditioned (encapsulation with rigid
      foam on foundation walls) typically do. Burien has its own permit center, separate from King
      County DPER, and the review process for a crawl space encapsulation permit usually runs 2–3
      weeks. We handle permit submission, schedule rough-in and final inspections, and make sure the
      work passes Washington State Energy Code requirements. TopVolk is a WA Licensed Contractor — the
      permit is pulled in our license. You don't fill out paperwork or make calls to the building
      department; that's our end.

  - q: "Can you add mineral wool soundproofing between floors during a remodel?"
    a: |
      Yes — and the right time to do it is during rough-in, when walls or ceilings are open. Adding
      Rockwool Safe'n'Sound or CertainTeed SoundBreaker after drywall is hung costs three to four times
      more because you're cutting access, insulating in sections, and patching behind you. For Burien
      homes finishing a basement or adding a bedroom above a living space, mineral wool between floor
      joists is a straightforward add-on to a remodel scope — no separate permit when it's part of the
      larger project. Thermal R-value is modest (around R-15 for 3.5 inches), but the airborne sound
      transmission reduction is the main payoff. Coordinate it during your initial scope call so it's
      priced into the project rather than added as a change order mid-build.

  - q: "How long does blown-in cellulose last in a Burien attic?"
    a: |
      Properly installed cellulose in a dry, well-ventilated attic should hold its performance for
      20–30 years before meaningful settling affects the R-value. The risk in Burien specifically is
      moisture infiltration — a small roof leak or inadequate attic ventilation lets cellulose absorb
      water and compress faster than fiberglass. We check attic ventilation on every estimate and flag
      issues before installation begins. One important note for pre-1980 homes: if original insulation
      includes vermiculite (uncommon but possible), it requires asbestos testing before any disturbance.
      We can refer you to a certified industrial hygienist for that test. CertainTeed blown-in products
      carry a manufacturer warranty; our workmanship is covered separately under the contract terms,
      with deadline penalties built in if we run over schedule.

