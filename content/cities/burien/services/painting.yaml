title: "Burien Painting — Cedar, Lead Testing & Exterior Repaints"

intro: |
  The post-war ranchers scattered across 98146 — Seahurst, Gregory Heights, the streets
  running back from the waterfront — carry a lot of original paint history. Most were
  built between 1948 and 1972, painted once in the 1980s and patched ever since. Cedar
  lap siding on those homes absorbs moisture against the grain end all winter, and the
  paint film that's still holding typically has three to five layers underneath it —
  including, in any house built before 1978, a high probability of lead-based paint that
  requires EPA RRP protocol before any scraping or sanding starts. That's federal law,
  not a contractor upsell. Exterior repaints in Burien done right run a proper power
  wash, oil-based prime on bare wood, and two coats of Sherwin-Williams Duration
  Exterior — that sequence buys 7–8 years before the next cycle. Interior painting in
  this area tends to follow bathroom or kitchen remodels: trim repaint after new cabinets,
  ceiling work after recessed lighting, full-room repaint when builder-grade flat paint
  starts showing every scuff. TopVolk Construction LLC is a WA Licensed Contractor,
  owner-operated by Vladislav Volkov, with 100+ projects completed since 2017 across
  King County and the broader Seattle metro. Call (206) 591-1096 to schedule a free
  on-site estimate — you'll talk to Vladislav, not a sales rep.

localContext: |
  Burien splits into roughly three housing eras that each behave differently under paint.
  The oldest stock in 98146 — Seahurst and Gregory Heights — runs 1940s through early
  1960s: cedar lap or shake siding, galvanized plumbing under the house, original single-
  pane aluminum windows with trim that's been caulked and recaulked to the point of
  failure. These homes average six to eight paint layers and nearly always test positive
  for lead on at least one coat. Moving south into 98166, Three Tree Point and Shorewood
  carry more late-1970s through 1990s construction — Masonite and early Hardie cement
  board, both reaching second or third repaint cycles now. The climate here pushes paint
  hard: roughly 37 inches of rain annually, with north-facing and west-facing walls
  staying damp from October through May. Moss establishes on cedar shake within two or
  three seasons if zinc strips aren't installed at the ridge. Interior painting in Burien
  kitchens and baths follows the remodel market — 1960s ranchers getting IKEA or semi-
  custom cabinet installations usually need full trim and ceiling repaint to match, and
  bathrooms that lack exhaust fans (common in pre-1970 construction) need moisture-
  resistant paint systems, not just a fresh color.

commonProblems:
  - title: "Cedar Lap and Shake in 98146 — Failed Paint Film and Short Repaint Windows"
    description: |
      Cedar shake on 1950s homes in Seahurst absorbs moisture at the grain end and face
      when the paint film fails. You'll see bubbling, flaking, or weathered gray wood
      showing through within one wet season after the coating breaks down. Exposed cedar
      left in PNW rain checks and cracks at the face within two seasons — that's a repair
      bill, not just a repaint. The correct sequence is 1,500 PSI power wash, hand-scrape
      all loose paint, spot-prime bare wood with an alkyd oil-based primer — Zinsser
      Bulls Eye 1-2-3 or Sherwin-Williams Extreme Bond — then two finish coats of a 100%
      acrylic exterior. Benjamin Moore Aura Exterior holds up particularly well on cedar
      in this climate. A typical 1,800 sq ft single-story rancher exterior runs
      $4,500–$8,000 depending on story height, trim complexity, and existing paint
      condition. Skipping the oil-based prime step on bare cedar is the single most
      common reason exterior paint fails at year three instead of year eight.

  - title: "EPA RRP Lead Paint Compliance in Pre-1978 Burien Construction"
    description: |
      Any home built before 1978 in Gregory Heights, Three Tree Point, or anywhere else
      in Burien falls under EPA RRP (Renovation, Repair, and Painting) rules when work
      involves disturbing painted surfaces. That means lead testing before scraping,
      plastic containment sheeting on the ground, HEPA vacuum on all debris, and proper
      disposal — required steps on pre-1978 construction, not optional add-ons. Federal
      fines for RRP violations run up to $37,500 per day per violation. A certified
      inspector charges $200–$400 for a written lead report; DIY swab kits run $30–$50
      but don't produce documentation. Many painting contractors working the south King
      County area skip RRP protocol entirely — that's the homeowner's liability if a
      child in the house tests positive for lead exposure afterward. TopVolk Construction
      LLC carries EPA RRP certification for pre-1978 work and WA Licensed Contractor
      status. It gets documented before the first scraper touches the siding.

  - title: "Hardie Siding Repaints on 1990s–2000s Homes in 98166"
    description: |
      James Hardie cement board doesn't rot, but the factory finish chalks out and caulk
      at panel joints and corner trim cracks over a 7–10 year cycle. Homes in Shorewood
      and the Three Tree Point corridor built between 1992 and 2005 are hitting that
      second or third repaint now. Preparation is more important than paint brand on
      Hardie: the surface needs to be clean and dry, all failed caulk removed and replaced
      with a Hardie-compatible paintable sealant, and two full coats of a 100% acrylic
      latex — Sherwin-Williams Emerald or Duration both perform well on fiber cement.
      Exterior repaints in Burien don't require a permit from the City of Burien Community
      Development department unless the scope includes replacing trim boards or fascia
      (which crosses into repair work). TopVolk is a WA Licensed Contractor and handles
      any associated permit paperwork when the scope requires it. Missed-deadline
      penalties are written into the contract — if the schedule slips past the agreed
      date without a weather hold on record, there's a financial consequence, not just an
      apology.

  - title: "Cabinet Repainting as an Alternative to Full Kitchen Replacement"
    description: |
      A full kitchen cabinet replacement in a Burien home runs $12,000–$35,000 depending
      on layout and cabinet grade. Cabinet repainting on solid-wood or MDF doors runs
      $1,500–$4,500 for a typical kitchen and holds up if the prep is correct: degrease
      all surfaces with TSP substitute, sand to 150-grit, fill dents and dings with Bondo
      or vinyl spackling, then prime with a shellac-based primer — Zinsser BIN — before
      spraying two finish coats of a waterborne alkyd. Benjamin Moore Advance and
      Sherwin-Williams Emerald Urethane both cure hard enough for daily kitchen use and
      can be wiped down without marring. Color requests in Burien's $400K–$600K home
      range trend heavily toward white and off-white on painted cabinets — Benjamin Moore
      Chantilly Lace and White Dove are consistently the two most-requested colors right
      now. Doors and drawer fronts are removed and sprayed flat in a controlled
      environment; boxes are brush-and-rolled in place. Turnaround on a standard kitchen
      runs four to six days including cure time before reinstalling hardware.

  - title: "Moisture-Resistant Paint Systems for Bathrooms and Laundry Rooms"
    description: |
      Builder-grade flat latex in bathrooms fails within three to five years in the PNW —
      ceiling corners bubble, paint near the shower surround peels, and north-facing
      exterior walls develop mildew staining. A different product category is needed, not
      just a different color. Bathrooms require a mold-and-mildew-resistant formulation
      in satin or semi-gloss: Sherwin-Williams Emerald Interior with mildewcide or
      Benjamin Moore Aura Bath & Spa are both rated for high-humidity environments.
      Ceiling above a shower or tub needs shellac-based spot-prime on any existing water
      stain, then two coats of a semi-gloss ceiling paint — flat ceilings in wet rooms
      absorb moisture and fail faster. In Burien ranchers with no bathroom exhaust fans
      — common in pre-1970 construction — the paint alone won't resolve the moisture
      problem long-term, but the right system buys time while ventilation gets addressed.
      A typical bathroom repaint runs $400–$900 depending on size, ceiling height, and
      prep condition, and takes one to two days.

faq:
  - q: "How fast can you get to Burien for a painting estimate?"
    a: |
      Burien is a straightforward drive — SR-509 or SR-99 southbound depending on
      traffic, typically 20–30 minutes from central Seattle. Street parking in Seahurst
      and Gregory Heights is generally fine for a work truck. Estimate scheduling usually
      runs two to four days out. Once a proposal is approved and materials ordered, most
      exterior paint jobs start within one to two weeks — exterior work in the PNW needs
