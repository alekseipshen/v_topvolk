title: "Burien Deck Installation — Built for 37 Inches of Rain and Moss"

intro: |
  Seahurst Park sits at the western edge of Burien, and the homes along that bluff in 98166 get a full dose of what Puget Sound weather actually does to wood. Cedar grays and splits. North-facing surfaces moss over by October. Vladislav Volkov has replaced rotted cedar decks in this area since 2023 — and the first question is always the same: cedar or composite? The answer depends on your budget, your maintenance tolerance, and how much shade your yard actually gets.

localContext: |
  Gregory Heights and the neighborhoods along 1st Avenue South (98146) are mostly 1950s and 1960s ranch homes — single story, modest footprint, back-of-house decks bolted to a rim joist that hasn't been touched since the Carter administration. The ledger flashing on those connections is typically missing or corroded down to nothing. Homes closer to 98148, near the Sea-Tac corridor, tend to run slightly newer tract construction, but King County's rain doesn't give you a pass on rot just because the house is from 1978.

commonProblems:
  - title: "Cedar vs. Composite: The PNW Rain Decision Nobody Told You About"
    description: "Cedar is traditional and looks great new, but in a 98166 backyard with 37 inches of annual rain and moss creeping in from October, you're sealing or staining every 2-3 years or watching it gray and crack. Trex and TimberTech composite boards resist moisture, skip the sealing, and hold surface color without turning silver-gray. The upfront cost premium is real — but so is the maintenance math over 10 years in this climate."
  - title: "Ledger Attachment and Flashing — Where Burien Decks Rot From the Inside"
    description: "Most deck failures in older Burien homes start at the ledger board where it bolts to the house rim joist. Missing or improper flashing lets rain wick behind the board and sit against the band joist for years, unseen. King County DPER requires a ledger flashing inspection during the permit process and looks at this closely. Correct installation means through-bolts, continuous joist hangers, and flashing kicked out from under the siding at the right angle."
  - title: "Post Footings: Frost Depth and Ground-Contact PT Lumber"
    description: "Burien proper skips the hard freeze-thaw cycles you get up in North Bend, but footings still need to hit 12-18 inches below grade under IRC requirements. Posts sitting on surface pads with standard framing lumber will rot within 5-7 years in this soil moisture. All ground-contact members need pressure-treated (PT) lumber rated specifically for ground contact — not just treated, but stamped for it. King County DPER inspects this at rough framing."

faq:
  - q: "How fast can you get to Burien for a deck consultation?"
    a: "Burien is a straightforward drive via the 509 or 1st Avenue South — no problem reaching Gregory Heights or Seahurst neighborhoods. We schedule on-site visits within a week, sometimes faster. Call (206) 591-1096 to set a time directly with Vladislav."
  - q: "Do you build with Trex and TimberTech, or only cedar?"
    a: "Both. Trex Transcend and TimberTech Legacy are the two composite lines we spec most often for Burien yards — they hold up against moss and rain without annual sealing. Cedar remains an option if the budget calls for it. We'll walk through the long-term maintenance difference before you commit to either."
  - q: "Does a deck in Burien require a permit, and what does the process look like?"
    a: "Burien falls under King County DPER for permitting. Attached decks, any deck over 30 inches above grade, or structural changes all require a permit — typically 4-8 weeks for plan review. TopVolk handles the permit application, ledger flashing inspection scheduling, and final sign-off. WA Licensed Contractor, 100+ projects completed since 2023, deadline penalty written into every contract. Call (206) 591-1096 or schedule a free on-site consultation to get started."