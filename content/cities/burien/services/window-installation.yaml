title: "Burien Window Installation — Sea-Tac Noise & Rot Fixes"

intro: |
  Sea-Tac Airport sits less than two miles east of central Burien, and the primary
  departure corridor runs straight over Gregory Heights and parts of 98146. Old aluminum
  slider windows — the kind still common in mid-century ranchers near Lake Burien — conduct
  aircraft noise directly into living rooms in a way newer frames simply don't. Milgard's
  SoundGuard laminated glass, available in their Tuscany vinyl series, uses a PVB interlayer
  between lites to push STC ratings from the standard double-pane range of 26–28 up to
  35–38. That's a difference you notice on the first quiet morning after install. Burien also
  takes the full force of Puget Sound weather from October through April, and those same
  aluminum frames from the 1960s were never designed for the flashing and drainage detail
  that 37 inches of annual rain actually demands. TopVolk Construction LLC is a WA Licensed
  Contractor that has completed 100+ projects across Seattle Metro since 2023. Vladislav
  Volkov runs every estimate himself — call (206) 591-1096 to schedule a free on-site look.

localContext: |
  The housing in 98146 — central Burien around 152nd St SW and the downtown core — skews
  heavily mid-century. Most of it went up between 1950 and 1972: ranch plans, split-levels,
  single-pane aluminum frames, and the occasional jalousie window in a laundry room that
  nobody ever replaced. Those aluminum frames conduct cold and transfer sound with almost
  zero resistance, and the original installation details rarely included a sill pan flashing
  or back-dam to route water out of the rough opening. Over in 98166, toward the Three Tree
  Point bluffs above Puget Sound, earlier construction from the late 1940s mixes with
  1970s–80s infill. West-facing elevations there take the full brunt of Puget Sound fog and
  rain; north-facing wood sills grow moss and soften when flashing isn't correct. The Hazel
  Valley area has seen more recent teardown-rebuild activity, mixing newer vinyl-frame
  construction with the older aluminum stock. Each era and frame type requires a different
  installation approach — the flashing and rough-opening prep for a 1958 ranch is completely
  different from a 2008 house where the WRB is still intact and sound.

commonProblems:
  - title: "Flight Path Noise — Laminated STC Glass vs. Standard Double-Pane Near Sea-Tac"
    description: |
      Homes in 98146 and 98148 that sit under Sea-Tac's primary departure routes deal with
      noise levels standard double-pane units can't adequately block. A typical double-pane
      with 1/2-inch airspace rates around STC 26–28. Milgard's SoundGuard laminated glass —
      available in the Tuscany vinyl series and the Essence fiberglass line — uses a PVB
      interlayer to push that rating to STC 35–38 in the same frame. The glass spec alone
      isn't enough; flanking paths through the rough opening matter just as much. Compressed
      foam backer rod, acoustic caulk at every penetration, and a properly back-dammed sill
      pan eliminate the air gaps that let sound route around the glass entirely. Budget
      $400–$700 per window installed for Milgard Tuscany with SoundGuard in a standard
      double-hung configuration. The acoustic difference is immediately noticeable. Call
      (206) 591-1096 — Vladislav can walk through glass spec options during a free on-site
      visit and show you the STC ratings side by side.

  - title: "Flashing Failures and Frame Rot — The Damage Hiding Behind Burien's Aluminum Windows"
    description: |
      Mid-century aluminum frames in 98146 and 98166 were set directly into rough framing
      with a bead of caulk — no sill pan flashing, no back-dam, no drainage path for water
      that gets past the exterior. Fifty years of PNW rain means the rough sill and king
      studs below the frame have often rotted out silently. Soft drywall beneath the window
      sill is the usual tell. The fix involves pulling the old frame, sistering any
      compromised framing members with pressure-treated (PT) lumber, installing a sloped sill
      pan using Schluter Kerdi membrane or formed sheet-metal, then setting the new window
      with proper head flashing lapped over the housewrap. Skipping the sill pan on a new
      install — which some crews do to save 45 minutes — is exactly how the rot problem
      repeats in a decade. Hardie cement-board exterior casing is worth specifying while
      you're in there too, since wood casing on a west-facing Burien elevation won't survive
      long. Framing repair adds $200–$600 per opening to the install cost, depending on how
      far the damage has traveled toward the jack studs.

  - title: "Basement Bedroom Egress — IRC Requirements and the City of Burien Permit Process"
    description: |
      Finishing a basement room as a bedroom in Burien triggers an egress window requirement
      under the IRC: minimum 44-inch net clear opening height, 20-inch net clear width, and
      at least 5.7 square feet of net clear opening area. Burien is an incorporated city, so
      permits run through the City of Burien's permit center — not King County DPER. Plan
      review for a basement egress cut typically runs 3–6 weeks. The rough opening needs to
      be saw-cut through the foundation wall, soil excavated for a window well, and a proper
      drainage bed with perforated pipe installed so the well doesn't flood in a heavy rain
      event. Pella casement or Milgard casement windows are the standard choice because they
      hinge fully open without reducing the net clear area. Vladislav holds a WA Licensed
      Contractor credential, which Washington requires for any structural rough opening
      modification. Full egress installs in Burien typically run $1,800–$3,500 per opening
      depending on foundation wall thickness and excavation depth.

  - title: "Double-Pane to Triple-Pane Upgrade — WSEC Compliance and Real Cost Tradeoffs"
    description: |
      Washington's 2021 residential energy code (WSEC) requires U-factor 0.27 or better for
      replacement windows in conditioned space. Most Milgard Tuscany and Pella 250 Series
      double-pane units already hit that spec. Triple-pane is worth the premium in a few
      specific cases: north- or northwest-facing rooms in 98166 with sustained moisture
      exposure, or any room where the current aluminum frame is hemorrhaging heat through
      the frame itself, not just the glass. Marvin's Integrity line and Pella's Impervia
      fiberglass both offer triple-pane configurations that perform well in PNW conditions
      without the weight penalty of some European systems. Cost delta between double and
      triple-pane typically runs $80–$150 per window in material, with no change in labor.
      For most Burien homes, going from original single-pane aluminum to a quality
      double-pane with low-E coating and argon fill recovers heat loss faster than the
      incremental jump to triple-pane. The bigger lever is always the air sealing detail at
      the rough opening — and that costs nothing extra if the installer does it correctly.

  - title: "Matching Divided-Light Grille Patterns in Burien's Late-1940s and 1950s Homes"
    description: |
      Some of the earlier Burien housing stock — particularly the late-1940s and early-1950s
      cottages near Three Tree Point and the older blocks in Gregory Heights — has original
      divided-light wood sash in 6-over-6 or 4-over-4 patterns. Replacing those with a blank
      insulated unit changes the exterior character noticeably. Both Milgard's Tuscany series
      and Pella's 250 Series offer between-the-glass grille options that simulate
      divided-light patterns without the thermal bridging of true divided lites. For
      design-sensitive work, Marvin's Integrity line does a traditional divided-light unit
      with a Douglas-fir interior and fiberglass exterior that holds up far better in PNW
      weather than all-wood sash — which checks out fast on a north-facing elevation in full
      Puget Sound exposure. Grille-match upgrades typically add $50–$120 per window over
      blank-unit pricing depending on pattern complexity and whether you want simulated
      divided light or true divided. Vladislav brings samples on the initial site visit so
      you can compare grille options against the actual house before signing anything.

faq:
  - q: "How fast can you get to Burien for a window installation estimate?"
    a: |
      Burien is a straightforward run from the north — SR-509 south from West Seattle puts
      you in central Burien in under 20 minutes outside of peak traffic, and I-5 south to
      the 148th St exit works when 509 is backed up. Most consultations are scheduled within
      3–5 business days of first contact. Vladislav comes to the estimate himself with a tape
      measure and a direct quote — not a commissioned closer with a brochure. For standard
      retrofit replacements with no structural work, projects typically start 2–4 weeks after
      a signed contract. Call (206) 591-1096 to get on the schedule.

  - q: "What does window replacement cost in Burien?"
    a: |
      Standard retrofit replacement — removing the old unit, prepping the rough opening,
      installing a Milgard Tuscany or comparable vinyl double-pane, and trimming out both
      sides — runs $350–$650 per window installed in Burien. Fiberglass frames (Milgard
      Fiberglass, Pella Impervia) add $100–$200 per unit over vinyl pricing. SoundGuard
      laminated glass for the Sea-Tac noise corridor adds $80–$150 per window. Egress cuts
      in a concrete or CMU foundation wall are priced separately at $1,800–$3,500 per
      opening. Every quote from TopVolk is line-itemed — labor, material, and permit fee
      broken out separately. Free on-site estimate with specific numbers, not a vague range.

  - q: "Do I need a permit to replace windows in Burien?"
    a: |
      Like-for-like replacement in the same rough opening typically does not require a permit
      in Burien. Any work that changes the rough opening size — egress cuts, enlarging an
      existing window, adding a new opening, or any structural header modification — requires
      a building permit through the City of Burien's permit center. Vladislav is a WA
      Licensed Contractor and handles the permit application and plan submission when a
      permit is required; that paperwork burden doesn't fall on you. Plan review for standard
      residential window work in Burien generally takes 3–6 weeks. The permit fee is included
      in the project quote upfront, with no surprise add-ons at the end.

  - q: "Vinyl vs. fiberglass frames — which holds up better in Burien's climate?"
    a: |
      Both perform well in PNW conditions, but they fail differently over time. Vinyl frames
      expand and contract more with temperature swings, which can loosen weatherstripping
      seal in older installs after 15–20 years. Fiberglass — Milgard's Fiberglass line or
      Pella's Impervia — has a coefficient of thermal expansion close to glass itself, so the
      seal integrity stays tighter over decades. For north- and west-facing elevations in
      98166 near the Sound, where moisture exposure is sustained from October through April,
      fiberglass is worth the extra cost. Vinyl is the right call for most south-facing or
      interior-exposure replacements where budget matters and thermal movement is less
      extreme. Marvin's Integrity line — fiberglass exterior, wood interior — is a solid
      middle-ground option for homes where interior trim character matters to the homeowner.

  - q: "What warranty covers windows TopVolk installs in Burien?"
    a: |
      Milgard backs their Tuscany and Fiberglass series with a full lifetime warranty on
      glass seal and frame for the original homeowner — including glass pack seal failure
      and hardware. Pella's 250 Series carries a 20-year glass warranty and 10-year frame
      warranty. Marvin's Integrity line is a limited lifetime on the fiberglass exterior.
      On the installation side, TopVolk provides a written workmanship warranty covering
      flashing and water intrusion. If a flashing detail fails and causes water damage,
      that's on us to fix — not a negotiation. Vladislav writes both the workmanship
      warranty terms and deadline commitments directly into every contract. Missed deadlines
      carry a financial penalty, not an apology email.

  - q: "Do you install windows in cities near Burien, like Tukwila, SeaTac, or Des Moines?"
    a: |
      Yes — TopVolk serves the full south King County corridor, including Tukwila (98168),
      SeaTac (98188), Des Moines (98198), Normandy Park, and Renton. Depending on project
      scope, work in Federal Way, Kent, and Auburn is also in regular rotation. No travel
      surcharge for Burien or its immediate neighbors. Most projects in this area are
      scheduled within 3–6 weeks of a signed contract, depending on permit timing and
      window lead time from the manufacturer. Call (206) 591-1096 or schedule a free
      on-site estimate to get on the calendar.