title: "Burien Carpentry — Trim, Built-Ins & Stair Work for Older Homes"

intro: |
  The houses climbing the hillside streets between Ambaum Boulevard SW and Seahurst Park
  hold a specific kind of carpentry problem. Most of the stock out here dates to the 1940s
  and 1950s — post-war construction with original fir window casings, panel doors that
  predate anything at a lumber yard today, and built-in china cabinets nobody bothered to
  remove because they still worked. Then a kitchen remodel happens, or someone knocks out
  a wall, and suddenly three different casing profiles are coexisting in the same room.
  The trim situation in a Gregory Heights rancher from 1958 is different from the stair
  stringer problem in a Craftsman bungalow near Three Tree Point — but both call for the
  same approach: reading the house before making any cuts. TopVolk Construction LLC,
  owner-operated by Vladislav Volkov, has handled finish carpentry work like this since
  2023 — 100+ projects completed across King, Snohomish, Pierce, and Kitsap counties.
  Call (206) 591-1096 to schedule a free on-site look.

localContext: |
  Burien's 98146 zip code covers a swath of mid-century ranchers and split-levels running
  west from Gregory Heights toward the Sound — most of them built between 1950 and 1972.
  Original fir trim, hollow-core passage doors, and cabinet-style stair railings with
  metal balusters are standard issue in these homes. Over in 98166, closer to Seahurst
  and Three Tree Point, the housing stock gets older and more varied — 1930s and 1940s
  Craftsman bungalows with post-and-pier foundations, original wainscoting, built-in
  window seats, and wide casing profiles no big-box store carries anymore. Heavy rain
  runs October through May out here — 37 inches a year is typical — and that moisture
  finds cedar fascia boards, exterior trim joints, and the bottom rails of porch columns
  on north-facing exposures. Interior carpentry stays protected from direct weather, but
  the age of the housing stock means surprises: sistered joists under floors, original
  galvanized pipes running through partition walls, and plaster that doesn't behave the
  same as drywall when you're scribing a cabinet or setting a door frame.

commonProblems:
  - title: "Craftsman Built-Ins and Window Seat Fabrication in 98166 Bungalows"
    description: |
      The Craftsman bungalows along the 98166 hillside lots near Three Tree Point were built
      with integrated storage — window seats flanking the living room fireplace, floor-to-ceiling
      bookshelves, a built-in hutch in the dining room. Most of those original pieces are still
      in place but painted over so many times the profile details read as a blur. Adding a new
      built-in to a bedroom or den means matching what's already there — typically a 3½-inch
      craftsman flat casing with a back band, or a simple colonial profile depending on the
      decade the house was finished. Cabinet-grade plywood forms the carcass; solid poplar or
      clear pine goes on the face frame, stiles, and rails. Drawer boxes run on Blum undermount
      slides, which hold up better than side-mount hardware over the long haul. A 10-foot window
      seat with flanking bookshelves and three drawers runs 5–7 days on site, with material and
      labor typically landing between $2,800 and $5,500 depending on size and finish requirements.

  - title: "Wainscoting and Beadboard Installation When the Walls Aren't Plumb"
    description: |
      Installing wainscoting in a 1940s Burien rancher sounds simple until the chalk line shows
      the floor running a half-inch out of level across 14 feet — and the existing baseboard was
      set at three different heights by three different owners. Homes in Gregory Heights and
      through the 98146 zip run into this constantly. Metrie pre-primed MDF beadboard panels
      hold paint edges better than solid wood in Pacific Northwest humidity and are the right
      call for painted applications here. Blocking needs to be added behind drywall wherever
      stud spacing doesn't align with panel joints — 16-inch on-center framing rarely lands
      cleanly against 48-inch panel widths. Cap rail and chair rail transitions need tight
      miters at inside corners; coped joints on these profiles open up seasonally through
      Seattle's wet winters. All cut ends get back-primed before installation. Layout, level
      lines, blocking, and scribing to an imperfect floor add a full day to what looks simple
      on paper. Budget $45–$75 per linear foot for supply and labor combined.

  - title: "Stair Stringer Rebuilds and Tread Replacement in Mid-Century Split-Levels"
    description: |
      A stair stringer is structural — the angled boards on each side of the flight that carry
      the tread load. In 1960s split-levels throughout the Boulevard Park neighborhood, those
      stringers were typically cut from Douglas-fir 2×12 stock, and after 60-plus years, tread
      nosings crack, risers loosen, and the stringer itself can check along the grain where step
      notches reduce its cross-section. Individual treads can often be replaced without touching
      the stringer — 1-inch oak tread stock, pre-sanded and finished on site. When the stringer
      has failed, the whole assembly comes out. Riser replacement almost always disturbs the
      drywall at the stringer wall and requires baseboard to be reset. A full stair rebuild on
      a standard residential flight of 13–14 risers typically takes 3–4 days and runs $3,500–
      $6,500 depending on species, tread profile, and whether balusters and the newel post also
      need replacement. TopVolk handles the carpentry and coordinates any drywall patching
      within the same job scope.

  - title: "Interior Door Replacement When Original Openings Aren't Standard Size"
    description: |
      The original interior doors in 1940s and 1950s Burien homes are 1⅜-inch solid wood, set
      in openings that may measure 2 feet 2 inches or 2 feet 4 inches — widths that don't
      correspond to any current standard pre-hung unit. A modern door doesn't drop into those
      openings without real work. Split-jamb pre-hung units handle out-of-plumb openings better
      than standard jamb-and-stop assemblies; JELD-WEN solid-core MDF doors in the $180–$350
      range per unit are a practical choice for painted interiors. The casing profile matters
      as much as the door itself — replace one door and the new casing has to match the existing
      profile throughout the room, or you're redoing all the casings anyway. We carry common
      legacy profiles and work with local millwork suppliers to have custom profiles reproduced
      from a sample when needed. Installing 4–6 doors in a single visit spreads setup and
      scribing overhead across the whole job, which is the most cost-efficient way to handle
      a house.

  - title: "Cedar Fascia and Exterior Trim Rot on North-Facing Burien Homes"
    description: |
      North-facing eaves on Burien's 1940s bungalows take a consistent beating. Moss
      colonizes the cedar fascia, the drip edge lifts slightly, water wicks behind the board,
      and the back face rots while the front still looks acceptable from the driveway. By the
      time someone calls about a soffit or gutter problem, the fascia is soft for 6–10 feet and
      the blocking at the rafter tails may have absorbed moisture too. The correct sequence:
      pull the gutter, remove the rotted board, probe the rafter tails, and install new 1×6
      clear cedar or James Hardie cement-board trim. Hardie is worth specifying on north
      exposures — it won't absorb moisture the way wood will, and it doesn't require
      back-priming the way cedar does. Any exposed cedar end-grain gets back-primed regardless.
      Labor and material for a 40-foot fascia run with gutter removal and rehang typically runs
      $900–$1,500, depending on ladder access and how far the rot has spread into adjacent
      framing members.

faq:
  - q: "How fast can you get to Burien for a carpentry estimate?"
    a: |
      Burien is easy to reach from most active King County job sites — SR-509 and SR-99 both
      run through or alongside the city, and proximity to Sea-Tac Airport means traffic patterns
      here are predictable. From most projects in the area, drive time is under 30 minutes.
      Vladislav typically schedules on-site estimates within 3–5 business days of initial contact.
      The estimate is free, done in person, and conducted by the person who'll actually run the
      job — not a sales coordinator. Once a scope is agreed on and materials ordered, most
      interior carpentry projects start within 2–4 weeks. Call (206) 591-1096 to get on
      the schedule.

  - q: "What does carpentry work typically cost in Burien?"
    a: |
      Costs shift a lot by project type. A single interior door replacement with new casing
      runs $350–$650 installed. Wainscoting or beadboard installation ranges $45–$75 per
      linear foot. Custom built-in bookshelves or a window seat with drawers lands between
      $2,800 and $5,500 depending on size, hardware, and finish. Stair tread replacements
      start around $150–$225 per tread; a full stair rebuild with new stringers runs
      $3,500–$6,500. Exterior cedar fascia replacement typically runs $22–$38 per linear foot
      including gutter removal and rehang. Hidden conditions — rot behind walls, non-square
      openings, plaster instead of drywall — can shift those numbers. TopVolk provides
      line-item quotes, not vague ranges, after seeing the actual space. Free on-site
      consultation: call (206) 591-1096.

  - q: "Does interior carpentry in Burien require permits?"
    a: |
      Most interior finish carpentry — built-ins, wainscoting, door replacement, trim work —
      falls below the threshold for a permit through the City of Burien's building department.
      Structural work is different. Stair stringer replacement that alters the load path, or
      any scope that opens walls and changes framing, may trigger building permit review. For
      larger scopes that do require permits, Burien processes residential building permits
      through its own permit center, separate from King County DPER — plan review timelines
      vary but typically run 3–6 weeks for residential work. TopVolk handles permit
      documentation as part of the project when required. WA Licensed Contractor.

  - q: "Can you match original trim and casing profiles in a 1940s or 1950s Burien home?"
    a: |
      Yes — and it's one of the more common challenges in Burien's older housing stock.
      Original 1940s profiles — craftsman flat-stock with a back band, simple colonial casing,
      ogee baseboard — are not stocked at hardware chains. We carry a selection of legacy
      profiles and work with local millwork suppliers who can reproduce custom profiles from a
      physical sample when needed. The process involves pulling a small section of existing
      trim, running it to the mill, and getting back stock that matches within 1/32 inch.
      Custom milling lead time is typically 1–2 weeks. For painted applications, the match
      is nearly invisible once primed and finished. For stained or clear-finish work, wood
      species also has to align — original fir trim doesn't take stain the same way modern
      pine or poplar does.

  - q: "What warranty does TopVolk offer on carpentry work in Burien?"
    a: |
      Workmanship is warranted for three years from project completion. If a miter opens, a
      drawer slide fails, or a door develops a bind due to the installation, the crew comes
      back and fixes it at no charge. Material warranties pass through from the manufacturer —
      Blum hardware carries a lifetime warranty; lumber and sheet goods are covered under
      standard manufacturer terms. What workmanship warranty doesn't cover is normal seasonal
      wood movement. Every piece of trim in a Seattle-area home expands and contracts through
      the wet season, and small gaps at painted joints in January are expected. Back-priming
      all six faces of trim stock before installation reduces that movement significantly.
      Deadline commitments are written into TopVolk contracts — if Vladislav misses a stated
      milestone, there's a financial penalty built into the agreement, not just a phone
      call with an apology.

  - q: "Do you cover nearby cities like Tukwila, SeaTac, and Des Moines for carpentry?"
    a: |
      Yes. TopVolk works throughout King County and extends into Snohomish, Pierce, and Kitsap
      counties as well. From Burien, that makes Tukwila, SeaTac, Renton, Des Moines, and
      Federal Way all straightforward travel — typically 15–25 minutes. Bellevue, Kirkland,
      and Redmond projects are also on the regular rotation. Longer-distance work in Pierce
      County (Tacoma, Puyallup) or Snohomish County (Lynnwood, Mill Creek) gets batched to
      keep scheduling efficient. New projects typically start 2–4 weeks out depending on
      current workload. Call (206) 591-1096 or reach out online — Vladislav handles all
      initial consultations directly, with no call center or sales staff in between.