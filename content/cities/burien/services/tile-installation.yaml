  - q: "What does tile installation cost for a bathroom remodel in Burien?"
    a: |
      Bathroom tile installation in Burien runs roughly $18–$35 per square foot installed, depending on
      tile format, substrate condition, and layout complexity. A standard 5x8 bathroom with 12x24
      porcelain, full shower tile, and Schluter Kerdi waterproofing typically lands in the $6,500–$11,000
      range for materials and labor combined. Large-format 24x48 tile on a floor that needs self-leveling
      compound before install adds $400–$900 to the substrate prep line. Natural stone — marble,
      travertine — runs 15–20% higher than standard porcelain for the same square footage due to sealing,
      additional cutting time, and waste factors. TopVolk provides line-item quotes, not vague ranges —
      you see exactly what each phase costs before signing. Call (206) 591-1096 for a free on-site estimate.

  - q: "Do I need a building permit for tile work in Burien, WA?"
    a: |
      Most tile-only work — replacing bathroom floor tile, shower retile, kitchen backsplash — does not
      require a building permit in Burien. Permits become necessary when the project involves structural
      changes (opening a wall, moving a load-bearing element), electrical work (Ditra-Heat or Warmup
      heated floor systems), or plumbing relocation (moving a drain for a curbless shower conversion).
      In those cases, you're pulling permits through Burien's Development Services department, or King
      County DPER for projects in unincorporated areas. Electrical permits for heated floor systems are
      common and typically carry a two to four week plan review timeline. TopVolk Construction is a WA
      Licensed Contractor and handles permit paperwork as part of the project scope — you don't need to
      navigate the portal yourself.

  - q: "Do you install large-format tile (24x48, 32x32) in Burien homes?"
    a: |
      Yes — large-format porcelain installation is a standard part of TopVolk's bathroom and kitchen work.
      The process starts with a laser level check across the full floor or wall field before any tile goes
      down. If the subfloor isn't flat to within 1/8 inch over 10 feet (TCNA standard for large-format
      work), self-leveling compound gets applied first — no exceptions. Wall installations for 24x48 tile
      require back-buttering on both the tile and the substrate to achieve full thinset coverage; spot-bonding
      large-format tile causes hollow spots and eventual cracking. Schluter Ditra-XL uncoupling membrane
      on floors adds a crack-isolation layer that protects large-format tile from minor seasonal subfloor
      movement. The result is a floor without lippage that stays flat under raking light years after install.

  - q: "What warranty covers tile installation work in Burien?"
    a: |
      TopVolk Construction backs tile installation labor for one year from project completion — if grout
      cracks, a tile debonds, or a waterproofing detail fails within that period, it gets fixed at no
      charge. Material warranties are separate and vary by product: Schluter systems (Kerdi, Ditra-Heat)
      carry manufacturer warranties of 10 to 15 years when installed per spec; most porcelain tile carries
      a lifetime warranty against manufacturing defects. The one-year labor warranty covers workmanship —
      not tile cracked by impact or grout discolored by improper cleaning products. Natural stone needs
      resealing every 12–18 months regardless of who installed it — that's the maintenance reality in a
      wet climate. Deadline penalties are also written into the contract: if TopVolk misses a committed
      project milestone, there's a financial consequence, not just an apology.

