title: "Burien Tile Installation — Substrate-First Work for PNW Homes"

intro: |
  Seahurst Park sits at Burien's western edge, a few blocks from residential streets where most of
  the housing was framed between 1952 and 1970. Those homes carry decades of plumbing history —
  and a lot of them have shower tile set directly over greenboard or standard drywall, with no real
  waterproofing membrane behind it. In the 98146 zip code, TopVolk Construction has pulled apart
  more than a few of those showers during full bathroom remodels and found wet, soft framing behind
  what looked like perfectly fine tile from the outside. Schluter Kerdi membrane didn't exist in
  1963, and whoever set that original tile didn't have a lot of good options. Today there are better
  solutions — and getting them installed correctly, with proper substrate prep, waterproofing, and
  large-format porcelain laid on a laser-leveled surface, is what separates a 30-year installation
  from one that needs redoing in eight. Call (206) 591-1096 to schedule a free on-site look with
  Vladislav before demo day.

localContext: |
  Burien's housing stock splits pretty clearly. The older blocks around Boulevard Park and Gregory
  Heights — zip codes 98146 and 98148 — are mostly 1950s and 60s construction: original post-and-pier
  or poured-perimeter foundations, subfloors that have moved over the years, and bathrooms where the
  existing tile tells you everything about what corners were cut. Deflection in those older floor
  systems causes grout cracking and lippage on anything larger than a 12x12 tile, which rules out
  the 24x48 large-format porcelain most homeowners want today without first addressing the structure.
  Newer infill construction near Burien Town Square and along SR-509 (98166) has tighter floor
  systems, but still deals with King County's wet winters — roughly 37 inches of annual rainfall that
  keeps crawlspaces damp and puts real pressure on shower waterproofing. Tile work in this climate
  has to be built for moisture, not just aesthetics. A shower that looks good on installation day
  but has no real vapor barrier behind the tile will show the consequences within three to five years.

commonProblems:
  - title: "Shower Tile Set Over Greenboard — Waterproofing Failure in 1960s Burien Bathrooms"
    description: |
      The most common tile problem in Burien's older housing isn't grout color or layout — it's what's
      behind the tile. Greenboard (water-resistant drywall) was the standard shower backer for decades,
      but it absorbs moisture over time, especially with daily shower use. Once the greenboard softens,
      tile debonds from the wall in sections, and the framing behind it starts showing rot. The fix is a
      full demo and rebuild using Schluter Kerdi uncoupling membrane bonded to cement board, or a full
      RedGard liquid membrane application over a Hardiebacker substrate — either approach adds two to
      three days of waterproofing work before a single tile goes up, but it's the only way to get a
      20-year result in a Burien bathroom. Rebuild cost for a standard 5x8 shower enclosure typically
      runs $4,500–$7,500 depending on tile selection and niche count. TopVolk Construction — WA Licensed
      Contractor, 100+ projects since 2023 — Vladislav handles this work directly, no middlemen.

  - title: "Large-Format Porcelain Lippage on Floors With Too Much Deflection"
    description: |
      A 24x48 or 32x32 porcelain tile requires a nearly flat substrate — the TCNA (Tile Council of North
      America) standard allows no more than 1/8-inch variation over 10 feet for large-format work. Most
      1960s Burien subfloors don't come close to that. Joists deflect, subfloor panels have crowned edges,
      and you end up with lippage — tile edges that sit high or low relative to adjacent tiles — visible
      across the entire field. Schluter Ditra uncoupling membrane helps isolate the tile layer from minor
      subfloor movement, but it doesn't fix a floor that's already out of plane. The real fix is
      self-leveling compound applied to the full field before setting, which adds one to two days and
      typically $400–$900 in material cost depending on square footage. Skipping this step and hoping
      thinset makes up the difference produces lippage you'll see under raking light every single day.
      TopVolk uses a laser level to verify flatness across the full field before tile placement starts.

  - title: "Heated Tile Floors — Ditra-Heat Installation Requires a Permit in King County"
    description: |
      Schluter Ditra-Heat or Warmup electric floor heating systems installed under bathroom tile aren't
      a DIY addition — they require an electrical rough-in permit through Burien's Development Services
      department, or through King County DPER for unincorporated parcels nearby. The heating mat installs
      between the Ditra uncoupling membrane and the tile, and the thermostat requires a dedicated 120V or
      240V circuit depending on zone size. Getting the electrical permitted and inspected before the tile
      goes down matters because fixing a problem after the floor is finished means tearing it out. Typical
      Ditra-Heat installation for a standard 60 sq ft bathroom floor runs $1,800–$3,200 including
      electrical, depending on circuit distance from the panel. Plan review for this scope of work in
      Burien typically takes two to four weeks — start the permit before demo day, not after. TopVolk
      Construction is a WA Licensed Contractor and handles permit paperwork as part of the project scope.

  - title: "Marble and Travertine in Burien Bathrooms — Sealing Against PNW Moisture"
    description: |
      Natural stone behaves differently in a Seattle-area bathroom than it does in a dry climate. Marble
      and travertine are porous, and in a region that runs humid from October through April, unsealed or
      under-sealed stone absorbs moisture that causes staining, efflorescence (white mineral deposits),
      and surface pitting within a few years. Travertine with unfilled voids is especially vulnerable —
      water gets into the holes, and freeze-thaw cycles in a poorly insulated exterior bathroom wall can
      cause spalling. The fix on new installation is a penetrating impregnator sealer — Aqua Mix Sealer's
      Choice Gold or StoneTech BulletProof are both proven performers in this climate — applied twice
      before grouting and once after. For existing stone that's already showing staining, a deep clean
      with a stone-safe stripper followed by two fresh coats usually stabilizes things. Budget $200–$450
      for a full sealing service on a standard bathroom, and plan on resealing every 12–18 months.

  - title: "Tile-to-Hardwood Transition Failures in Open-Plan Burien Remodels"
    description: |
      Open-concept kitchen and living room remodels in Burien often run large-format porcelain through the
      kitchen and transition to hardwood or engineered flooring in the adjacent space. That transition has
      to account for expansion — tile essentially doesn't move, wood expands and contracts seasonally.
      Without a Schluter Schiene aluminum edge strip and a minimum 1/4-inch expansion gap at the
      transition, the hardwood buckles into the tile field or the tile lifts at the edge within one or two
      heating seasons. On a typical Burien home with forced-air heat, that seasonal movement is real and
      measurable. The correct detail uses a Schluter Schiene-A (angled) or Schiene-AE (with embedded
      edge) profile set in the expansion gap, keeping both floors terminating cleanly without compressing
      against each other. Getting this wrong on a $12,000 kitchen floor replacement costs significantly
      more than getting the detail right during install. Shower niche framing at wall intersections
      requires the same discipline — proper blocking and back-buttered tile edges, no shortcuts.

