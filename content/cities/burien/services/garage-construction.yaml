title: "Burien Garage Construction — New Builds, ADUs & Slabs for 98146"

intro: |
  Ranchers and split-levels from the 1950s and early 1970s make up the backbone of
  Burien's residential fabric — the older blocks in Gregory Heights near SW 128th
  Street, the flat lots running toward Seahurst Park along the 98166 zip corridor.
  Most of those houses got built with a carport or nothing at all. A detached garage
  wasn't a budget priority in 1963. Now those same lots qualify under WA HB 1337,
  the 2024 statewide ADU law that lets you build a detached garage with a DADU above
  it — legal rental unit included — without the old King County restrictions that used
  to kill the idea before it got started. TopVolk Construction LLC has completed garage
  builds and ADU packages across King County since 2017, including projects in Burien's
  98146 and 98166 zip codes. Vladislav Volkov runs every project directly — you talk
  to the person doing the work, not a salesperson. Free on-site consultation, line-item
  quote, no vague ranges. Call (206) 591-1096 to get on the schedule.

localContext: |
  Burien's housing breaks into two distinct eras that matter for garage construction.
  The older core — Boulevard Park, the neighborhoods west of Ambaum Boulevard SW, and
  the hillside lots dropping toward Three Tree Point — runs 1940s through early 1970s
  construction. Lots in the 98166 zip code can be narrow, sometimes 40 to 50 feet wide,
  which makes setback compliance with the City of Burien's Community Development
  Department a real constraint when siting a new detached garage. The 98146 zip, east
  of SR-509, trends toward 1980s and 1990s construction with larger lot footprints —
  more room for a two-car garage or a garage-plus-DADU footprint, but grade changes
  here can complicate slab drainage and sub-base preparation. Burien is an incorporated
  city with its own permit office, separate from King County DPER, so the plan review
  process and turnaround timelines differ from unincorporated county projects. The
  climate here averages around 37 inches of rain annually, and the clay-heavy soils
  common to this stretch of King County make proper vapor barrier installation and
  compacted gravel sub-base non-negotiable — not an upgrade.

commonProblems:
  - title: "Garage + DADU Builds Under WA HB 1337 — Permitting in Burien"
    description: |
      WA HB 1337, effective 2024, allows up to two ADUs on a single-family lot statewide —
      including a detached accessory dwelling unit (DADU) above a new garage. In Burien,
      that permit goes through the City of Burien Community Development Department, not
      Seattle SDCI or King County DPER. The structural package for a two-story
      garage-plus-DADU needs to show LVL beam sizing for the floor-ceiling assembly
      between garage space and living space, fire separation per IRC Chapter 3, and
      stair access details. Plan review for a combined garage-ADU project typically runs
      8–14 weeks through Burien's permit office depending on submittal completeness and
      current queue. Typical cost for a 600–800 sq ft DADU above a two-car garage shell
      lands between $180,000 and $240,000 depending on finish level. TopVolk has
      navigated this permit type across King County — Vladislav handles submittals,
      revision responses, and inspector coordination from start to final inspection.

  - title: "Concrete Slab Failures — Clay Soil, Poor Sub-Base, and Winter Heaving"
    description: |
      Burien's clay-heavy soils drain poorly, and a garage slab poured directly on
      native clay or uncompacted fill will show cracks and settlement within a few
      winters. The fix is straightforward but can't be skipped: a minimum 4-inch
      compacted crushed-rock sub-base at 95% Proctor density, a 6-mil poly vapor
      barrier lapped at seams and turned up at the perimeter, and fiber-reinforced
      concrete at 3,000 PSI minimum. Control joints cut at roughly 10-foot intervals
      manage shrinkage cracking. Without proper drainage slope — a minimum 2% fall
      toward the garage door — water pools at the back wall and wicks into the
      framing over time. For a standard 24×24 slab in Burien, budget $8,000–$12,000
      depending on site grading needs. Slabs that skip these steps fail fast in the
      sustained wet season running October through May here. It's not dramatic — just
      steady moisture doing slow damage.

  - title: "Setback and FAR Compliance — Siting a Garage on Tight Burien Lots"
    description: |
      The City of Burien enforces setback rules that regularly surprise homeowners in
      the 98166 zip, where lots in the Boulevard Park and Three Tree Point areas can
      be 40–50 feet wide. A standard detached garage typically requires a 5-foot rear
      and 5-foot side setback, but corner lots, flag lots, and properties near critical
      areas — ravines and drainage corridors show up frequently in Burien's hillside
      neighborhoods — can carry larger required setbacks that shrink the buildable
      envelope significantly. FAR (Floor Area Ratio) limits come into play once you
      add a DADU above the garage; exceeding the allowable FAR triggers a variance
      process that can add months. Before finalizing any garage footprint, a site plan
      review confirms what's actually buildable on your parcel. TopVolk is a WA
      Licensed Contractor and handles the site plan, structural drawings, and permit
      submission — you don't chase correction notices or respond to DPER plan review
      comments directly. Straight detached garage permits (no ADU) typically take
      4–8 weeks through Burien's permit office.

  - title: "Matching the Exterior — Siding and Roofline on 1960s Burien Ranchers"
    description: |
      A 1960s Burien rancher typically has a low-pitch gable roof, painted wood or
      T1-11 panel siding, and minimal trim profile. Building a garage that visually
      belongs next to that house — rather than looking like it arrived from a different
      decade — takes real attention to fascia depth, rafter tail exposure, and siding
      exposure width. Hardie cement-board lap siding (HardiePlank in 6.25-inch
      exposure) holds paint dramatically better than wood in Burien's wet climate
      and won't rot on north-facing walls where moss accumulates every winter without
      maintenance. Matching the roof pitch and shingle color adds roughly $1,500–$3,000
      to the build cost but prevents the garage from undercutting the property's
      curb appeal. Trim details — corner boards, frieze boards, fascia profile — are
      specified during the design phase at TopVolk, not an afterthought. That
      consultation is included in the project cost, not a separate charge.

  - title: "EV Charger Pre-Wire and Workshop Electrical — Plan It Before the Slab"
    description: |
      Running a 50A or 60A circuit for a Level 2 EV charger is far cheaper during
      new garage construction than retrofitting it later. Before the slab pours,
      conduit can be stubbed through the foundation stem wall and trenched to the
      main panel at minimal cost. Waiting until framing and drywall are complete
      adds $800–$1,500 in labor and patching. For a workshop-ready garage, plan on
      a 100A sub-panel: 240V circuits for a table saw or air compressor, 20A circuits
      on multiple walls, and recessed lighting on dimmer-compatible LED drivers.
      A 50A hardwired circuit works with ChargePoint Home Flex, Tesla Wall Connector,
      and Grizzl-E units without adapters. TopVolk coordinates the electrical
      rough-in with a licensed electrician after framing, before insulation — the
      rough-in inspection is part of the main garage building permit, not a separate
      pull in most cases. Budget $2,500–$4,500 for a well-planned garage electrical
      package depending on panel distance and circuit count.

