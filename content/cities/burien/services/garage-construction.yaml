  - q: "What does a new detached garage build in Burien typically cost?"
    a: |
      A basic single-car detached garage — 12×20 footprint, concrete slab, framed,
      insulated, with a standard garage door — runs $45,000–$65,000 fully permitted
      in Burien. A two-car 24×24 garage steps up to $70,000–$105,000 depending on
      electrical complexity, finish level, and whether the site needs grading. Add
      a DADU above and the combined project ranges $180,000–$260,000 including City
      of Burien permit fees. Site prep — grading, tree removal, poor soil conditions —
      is the biggest variable on tight lots in the 98166 zip. TopVolk provides a
      written quote with line-item pricing after the on-site visit. Call (206) 591-1096
      or schedule a free consultation to get real numbers for your specific lot.

  - q: "Do I need a permit to build a garage in Burien, and how does the process work?"
    a: |
      Any new garage structure in Burien requires a building permit through the City
      of Burien Community Development Department. The submittal package includes a
      site plan showing the garage footprint relative to property lines and required
      setbacks, floor plans, and structural drawings stamped by a WA-licensed engineer
      for anything with a DADU above. Plan review for a detached garage alone typically
      runs 4–8 weeks; a garage-plus-DADU package can take 8–14 weeks. TopVolk is a
      WA Licensed Contractor and manages the full permit submission — structural
      drawings, site plan, and any correction responses — so you're not navigating
      the permit portal or responding to plan review comments yourself.

  - q: "Can you pre-wire my new Burien garage for an EV charger during construction?"
    a: |
      That's exactly the right time to do it. During framing, before insulation and
      drywall, the electrical rough-in goes in clean — conduit stubbed through the
      foundation, wire run to the main panel, J-box mounted at the charger location.
      The rough-in inspection is part of the overall garage building permit in most
      cases. A 50A circuit handles ChargePoint Home Flex, Tesla Wall Connector, and
      Grizzl-E units on a hardwired or NEMA 14-50 connection without issue. A 60A
      circuit gives headroom for future faster charging. Adding this during construction
      typically costs $600–$1,200 for the dedicated circuit; the same work after the
      fact runs $1,500–$2,500 with drywall patching. Just mention it during the
      consultation and it goes into the quoted scope from the start.

  - q: "What warranty do you offer on garage construction in Burien?"
    a: |
      TopVolk provides a 1-year workmanship warranty covering framing, siding
      installation, roofing, concrete flatwork, and all finish work. Manufacturer
      warranties layer on top: HardiePlank siding carries a 30-year limited warranty,
      Clopay and Wayne Dalton insulated garage doors typically offer 10-year panel
      warranties, and composite trim products carry their own coverage. The concrete
      slab has a 1-year workmanship warranty on settlement and cracking beyond
      normal shrinkage control joints. Every TopVolk contract includes a written
      deadline penalty clause — if the project misses the agreed completion date,
      there's a financial penalty written into the paperwork. Ask Vladislav about it
      during the consultation. It's not a verbal promise.

