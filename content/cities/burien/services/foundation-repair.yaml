title: "Burien Foundation Repair — Crawlspace & Seismic Retrofit"

intro: |
  Floor bounce in a Seahurst rancher or a door that stopped latching around 2019 in the Gregory
  Heights neighborhood — those aren't random house quirks. They're signs the post-and-pier
  foundation underneath has been settling unevenly, driven by the same wet-season soil saturation
  that affects most of Burien's older housing stock. Burien averages over 37 inches of rain
  annually, and from October through May that moisture works into crawlspaces, softens framing
  that should have been replaced a decade ago, and slowly drives individual piers into the glacial
  till at different rates. The fix involves more than stacking a shim under a sagging joist — it
  means assessing every pier, checking sill plates and rim joists for rot, and installing a vapor
  barrier that actually seals rather than the torn poly sheeting stapled up in 1987. TopVolk
  Construction LLC has completed 100+ projects since 2017 across King County, and Vladislav
  Volkov does the crawlspace assessment himself — not a sales rep who hands notes to a crew
  you've never met.

localContext: |
  Most of Burien's residential housing went up between 1945 and 1975, in the same post-war
  construction wave that shaped much of South King County. In the 98146 zip code — covering
  central Burien and the Gregory Heights corridor — post-and-pier construction was the standard.
  Those homes sit on glacially deposited soils that compact unevenly and drain poorly during wet
  winters. The 98166 zip code, which covers Seahurst and the Three Tree Point bluff area, sits at
  higher elevation, but proximity to Puget Sound means seasonal groundwater still fluctuates
  significantly from lot to lot. Seismic exposure adds a second concern: most Burien homes built
  before 1994 lack the mudsill anchor bolts and shear wall plywood now required under IRC
  seismic provisions. Foundation permits in Burien run through King County DPER — the city
  contracts its building services to the county — so structural work triggers a King County plan
  review and inspection schedule, typically 4-8 weeks for permit approval. Knowing that timeline
  upfront prevents schedule surprises on projects where scope is weather-dependent.

commonProblems:
  - title: "Settling Post-and-Pier Foundations Under 1950s–1960s Burien Ranchers"
    description: |
      Original concrete piers under most Burien ranchers from this era weren't anchored —
      they were set directly on grade, sometimes on compacted gravel, sometimes on bare soil.
      Over 60-plus years, the glacial till beneath compacts unevenly, and individual piers sink
      at different rates. One corner drops half an inch, another a full inch, and suddenly you
      have sloped floors, binding doors, and diagonal drywall cracks radiating from window
      corners. Repair means temporarily shoring the floor system, removing the old pier, pouring
      a new concrete footing to frost depth, and setting a new pressure-treated post connected
      with Simpson Strong-Tie post bases rated for the load. Blocking between joists stiffens the
      floor once posts are back in position. Jobs involving 6–10 piers typically run $4,000–$8,000
      depending on crawlspace access and required depth. King County DPER requires a permit for
      structural post replacement, with a rough-in inspection before the crawlspace is closed.

  - title: "Crawlspace Moisture Damage — Rotted Sill Plates and Rim Joists from Failed Vapor Barriers"
    description: |
      Burien's wet season runs roughly October through May, and in lower-lying sections of 98146
      the groundwater table rises enough to produce standing water under crawlspaces for weeks at
      a time. Without an intact vapor barrier, moisture wicks into the framing above the piers.
      Sill plates — the pressure-treated lumber sitting directly on top of the foundation wall —
      are the first to rot. Rim joists soften next. Once those members are compromised, loads
      transfer poorly through the posts above and the floor starts to feel soft or springy
      underfoot. Replacing a rotted sill plate and rim joist section runs $2,500–$5,000 depending
      on length and access. At the same time, we install a reinforced 20-mil vapor barrier with
      taped seams — replacing whatever poly sheeting was stapled up in a previous decade. For
      homes near Seahurst where moisture is recurring, a Zoeller M53 submersible sump pump adds
      active groundwater removal. Skipping the vapor fix after structural repairs means the same
      rot cycle restarts within 10–15 years.

  - title: "Seismic Retrofit — Mudsill Bolting and Shear Wall Plywood for Pre-1994 Burien Homes"
    description: |
      Homes built before the seismic code updates that followed the 1994 Northridge earthquake
      almost universally lack anchor bolts connecting the mudsill to the concrete stem wall. In
      Burien, that describes the majority of the housing stock. An unbolted house in a seismic
      event doesn't just crack — it can slide laterally off the foundation. The retrofit involves
      drilling through the mudsill into the concrete and installing Simpson Strong-Tie URFP
      foundation plate connectors at engineered intervals, plus adding shear wall plywood panels
      in the cripple wall area of the crawlspace to resist lateral racking forces. King County
      DPER requires engineered drawings for full seismic retrofits, so we coordinate with a
      structural engineer on the permit package. TopVolk Construction is a WA Licensed Contractor
      — permits go in under our license. A typical seismic retrofit for a 1,200–1,800 sq ft Burien
      rancher runs $6,000–$14,000. Deadline for project completion is written into the contract,
      with penalties paid if we miss it.

  - title: "Concrete Crack Repair and Epoxy Injection for Stem Wall Foundations in Gregory Heights"
    description: |
      Some Burien homes — particularly those in the Gregory Heights and central 98146 corridor
      built in the 1960s — have continuous concrete stem wall foundations rather than post-and-pier.
      These crack for two reasons: hydrostatic pressure from saturated soil pushing inward during
      wet season, and differential settlement as the footing shifts in uneven glacial till.
      Hairline cracks under 1/8 inch with no displacement get cleaned and sealed with
      polyurethane caulk. Structural cracks — anything wider than 1/4 inch, or any crack with
      horizontal displacement — require two-part epoxy injection using Sika Crack Fix or an
      equivalent structural epoxy rated for concrete. The epoxy restores tensile strength across
      the crack and stops water infiltration at the same time. Drainage correction typically
      happens alongside crack repair: regrading soil away from the foundation, adding a French
      drain with perforated pipe in washed gravel, and extending downspouts at least six feet
      from the house. Epoxy injection on a residential stem wall typically runs $1,500–$4,000
      depending on crack count and total length.

  - title: "Sump Pump and Interior Perimeter Drain Installation for High Water Table Areas Near 98148"
    description: |
      In the lower sections of Burien near the 98148 zip code — parcels that slope toward the
      drainage basins feeding Puget Sound — standing water under the crawlspace after heavy rain
      events is common. Passive drainage alone isn't sufficient when the water table is genuinely
      high. A sump pit at the crawlspace low point, properly sized and lined, with a Zoeller M53
      or Wayne CDU980E submersible pump handles active removal. The discharge line runs to
      daylight outside the foundation perimeter, pitched away from the house at minimum 1/8 inch
      per foot. Adding an interior perimeter drain — 4-inch perforated pipe set in washed gravel
      around the inside of the stem wall — collects groundwater before it pools and channels it to
      the sump pit. Full installation including sump pit, pump, and interior perimeter drain runs
      $3,500–$7,000 for a typical Burien crawlspace. King County DPER doesn't require a permit
      for sump pump installation alone, but grading work tied to exterior French drain systems
      may trigger a grading permit.

faq:
  - q: "How fast can you get to Burien for foundation repair?"
    a: |
      Burien is a straightforward drive — roughly 20–30 minutes via I-5 south or Highway 509
      depending on traffic. The 98146, 98148, and 98166 zip codes all fall within our regular
      King County service area. Vladislav does the on-site crawlspace walk-through himself, not
      a dispatcher-sent representative. Call (206) 591-1096 and we can typically schedule an
      assessment within one week. If there's time pressure from a real estate transaction or
      active water intrusion, mention that when you call and we'll prioritize the visit
      accordingly.

  - q: "What does foundation repair cost in Burien?"
    a: |
      Vapor barrier replacement for an average 1,200 sq ft crawlspace runs $2,000–$4,000.
      Post-and-pier work with 6–10 posts is typically $4,000–$8,000. Seismic retrofits — mudsill
      bolting plus shear wall plywood — run $6,000–$14,000 for most Burien ranchers. Epoxy crack
      injection on a stem wall foundation is usually $1,500–$4,000. Full crawlspace overhauls
      combining post replacement, vapor barrier, sump pump, and rim joist repair can reach
      $15,000–$30,000. Those are real numbers from actual projects across King County, not
      loss-leader minimums. Call (206) 591-1096 or schedule a free on-site consultation —
      Vladislav will walk the crawlspace and provide a fixed-price written quote, not a vague
      range.

  - q: "Do I need a permit for foundation repair in Burien, and how does that process work?"
    a: |
      Permit requirements depend on scope. Burien contracts its building permit services to
      King County DPER, so structural foundation work — post replacement, seismic retrofits,
      stem wall repair — goes through King County's online permit portal. Vapor barrier
      replacement and standalone sump pump installation typically don't require permits. For
      permit-required work, TopVolk handles the application, coordinates structural engineering
      if DPER requires stamped drawings, and schedules all inspections — rough-in before closing
      the crawlspace, final at project completion. Plan review at King County DPER for structural
      foundation work typically takes 4–8 weeks. TopVolk Construction is a WA Licensed
      Contractor, so the permit application goes in under our license without you navigating
      the DPER portal yourself.

  - q: "Can you combine seismic retrofit work with post-and-pier replacement in one project?"
    a: |
      Yes — and that's usually the efficient approach. If the crawlspace is already open and
      staged for post replacement, adding mudsill bolting and shear wall plywood to the same
      mobilization cuts labor overhead significantly compared to scheduling two separate projects.
      Simpson Strong-Tie URFP connectors go in alongside the new post bases, and cripple wall
      plywood gets installed while the crew is already working in that space. The King County
      DPER inspection sequence — rough-in and final — covers both scopes in one set of
      inspections rather than two separate permit cycles. Combined post-and-pier plus seismic
      retrofit projects in Burien typically run 2–4 weeks from permit issuance to final sign-off,
      depending on crawlspace conditions and overall scope.

  - q: "How long does foundation repair last, and what does TopVolk warranty?"
    a: |
      Pressure-treated posts on poured concrete footings with Simpson Strong-Tie hardware,
      installed correctly with the moisture problem also addressed, will outlast the house.
      Realistic lifespan is 40–60 years. Epoxy-injected cracks stay sealed indefinitely provided
      the underlying drainage issue causing hydrostatic pressure was corrected at the same time.
      Sump pumps are mechanical: the Zoeller M53 is reliable for residential crawlspace use, but
      any pump should be tested annually and replaced every 7–10 years. TopVolk Construction
      warranties its workmanship on all structural installations — if something we installed fails
      due to our work, we come back and fix it. Specific warranty terms are written into the
      project contract, not offered verbally after the fact.

