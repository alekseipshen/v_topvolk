title: "Burien Home Additions — ADUs, Suites & Second Stories"

intro: |
  The ramblers along Seahurst and into the Gregory Heights neighborhood were built for
  families in the 1950s — 1,000 to 1,200 square feet felt like plenty back then. Burien
  lots in 98146 routinely run 7,000–10,000 square feet, which leaves real room to expand
  without touching the property line. A main-floor addition, a detached ADU in the
  backyard, or a second story over the existing footprint — each involves different
  structural math, different permit pathways, and a different impact on daily life during
  construction. Under WA HB 1337 (2024), single-family lots statewide can now have up
  to two ADUs, which has opened conversations for a lot of Burien homeowners wondering
  what to do with that backyard. A Mitsubishi mini-split conditions new space cleanly
  without tearing into existing ductwork — common solution on older homes where the
  furnace is already working hard. TopVolk Construction has completed 100+ addition and
  remodel projects across King, Snohomish, and Pierce counties since 2023 — Vladislav
  Volkov manages every project directly, talks to every client himself, and signs every
  contract personally.

localContext: |
  Most of Burien's residential stock in 98146 and 98148 was built between 1950 and 1975.
  That era means post-and-pier or shallow perimeter foundations — engineered for one
  story, not automatically rated for a second. Older ranch-style homes in Boulevard Park
  and along the Three Tree Point waterfront corridor often have 2x8 floor joists and
  original 4x4 posts where today's IRC span tables would call for LVL beams or engineered
  lumber. Adding 400 square feet over an existing garage is a structurally different
  conversation than a ground-floor bump-out against the rear setback line. Burien's
  climate adds another layer: October through May brings 37-plus inches of rain, which
  means any exterior opening cut during addition framing — window rough-ins, ledger board
  connections to the existing structure — needs weather-resistant barrier details that
  actually get inspected, not just assumed complete.

commonProblems:
  - title: "Building a DADU in Burien After WA HB 1337 Changed the Rules"
    description: |
      WA HB 1337 passed in 2024 and allows up to two ADUs on any single-family lot
      statewide. For most Burien homeowners in 98146 and 98148, that means a detached
      ADU (DADU) in the backyard is now a legal option — subject to the City of Burien's
      setback requirements (typically 5 feet side and rear for a DADU) and lot coverage
      limits. Plan review through the City of Burien Community Development Department
      typically runs 6–10 weeks for a DADU; total project timeline from permit submission
      to final inspection runs 4–7 months. A separate electrical service and a Navien
      tankless water heater keep the unit genuinely independent for rental or
      multigenerational living. Budget $180,000–$260,000 for a 700-square-foot DADU with
      full kitchen, bathroom, and Mitsubishi mini-split conditioning — the range moves
      based on site prep requirements, utility run distance, and finish level.

  - title: "Structural Engineering for Second Stories on Mid-Century Ramblers"
    description: |
      Adding a second story to a 1950s or 1960s rambler is not just a framing job — the
      existing foundation and wall framing need to be evaluated for the added load before
      a single piece of lumber goes up. A licensed structural engineer checks the load
      path and specifies what's required: PSL posts in the first-floor walls, LVL beam
      replacements for original built-up lumber headers, new shear walls to meet current
      seismic requirements under the IRC. The rim joist and sill plate connections also
      get inspected at this phase — moisture infiltration over 60-plus years is common in
      homes without proper vapor barriers, and rot in those members affects structural
      capacity directly. A full second-story addition on a 1,200-square-foot Burien
      rambler typically runs $200,000–$350,000, depending on first-floor remediation
      scope. Timeline is 7–10 months from permit submission to move-in.

  - title: "Permit Process, Setbacks, and FAR for Burien Home Additions"
    description: |
      Burien is an incorporated city, so building permits go through the City of Burien
      Community Development Department — not King County DPER. The permit package for an
      addition includes a site plan with setback dimensions, floor plan, structural
      drawings, and energy code compliance documentation. FAR limits in Burien's
      single-family zones determine how much total floor area is allowed across the main
      house and any ADUs — confirming compliance before design is finalized avoids costly
      redesigns mid-project. For a DADU under WA HB 1337, the parking exemption applies
      if the property sits within a half-mile of a qualifying transit stop, which covers
      many Burien neighborhoods near the A Line RapidRide corridor on Pacific Highway S.
      TopVolk — WA Licensed Contractor — prepares and submits the full permit package and
      manages correction responses so the project doesn't stall at the plan review stage.
      Call (206) 591-1096 to schedule a free on-site consultation with Vladislav.

  - title: "What Actually Drives the Cost of a Burien Home Addition"
    description: |
      Addition pricing in Burien runs roughly $150–$250 per square foot for ground-floor
      work in standard conditions — a 400-square-foot addition lands around $60,000–
      $100,000 before site-specific variables. Second-story builds and DADUs push higher:
      $200,000–$350,000-plus based on structural scope, utility work, and finishes. The
      biggest cost variable is almost always structural. A 1960s rambler in 98146 that
      needs PSL post and LVL beam upgrades before framing starts can add $15,000–$40,000
      to the structural line alone. Matching existing Hardie cement-board siding or cedar
      shake trim adds to exterior scope compared to choosing a standard new profile.
      TopVolk provides direct, line-item pricing — no vague ranges. Deadline penalties are
      written into the contract, which means missed completion dates carry a financial
      consequence on the contractor's side, not just the homeowner's.

  - title: "Matching Exterior Finish and Conditioning New Space on Older Burien Homes"
    description: |
      A common result of additions on 1950s–1960s ramblers: the new section looks exactly
      like it was bolted on. Getting the exterior to blend requires matching the existing
      roofline pitch, using the same siding profile or a Hardie cement-board equivalent
      with a matching finish, and detailing trim at the addition-to-existing junction so
      there's no visible seam. North-facing cedar shake siding on Burien homes develops
      moss and mildew by year 8–10 given the wet winters — new addition exteriors in
      Hardie skip that maintenance cycle entirely. On the mechanical side, extending
      original ductwork into a new space usually means either upsizing the furnace or
      adding a dedicated Mitsubishi mini-split zone. Mini-splits are typically cleaner:
      no new duct runs, independent temperature control, and Milgard window rough-ins in
      the new space can be scheduled within the same framing sequence. Blue tape walkthrough
      and punch list are completed before final payment is released.

