  - q: "What permits are required for a home addition in Burien?"
    a: |
      Permits for a Burien addition go through the City of Burien Community Development
      Department — Burien is an incorporated city, not an unincorporated county parcel,
      so King County DPER is not the right office. A standard home addition requires a
      building permit covering the site plan, structural drawings, floor plan, and energy
      code documentation. For a DADU under WA HB 1337, you'll also need to demonstrate
      setback compliance and lot coverage, and coordinate with applicable utility providers
      for electrical and water service connections. Plan review typically runs 6–10 weeks
      for major additions; budget an additional 2–3 weeks if the initial submittal needs
      corrections. TopVolk — WA Licensed Contractor — handles the full permit package from
      drawing coordination to submittal and manages the correction response process so
      the project doesn't stall mid-permitting.

  - q: "Can you add a second story to a 1960s Burien rambler?"
    a: |
      Yes — but a structural engineer assessment comes before design drawings or permit
      submittal. The existing foundation, wall framing, and interior load path need to be
      evaluated to determine what upgrades the build requires. Most mid-century ramblers
      in 98146 have perimeter concrete foundations that handle the added load adequately,
      but the interior framing almost always needs PSL post and LVL beam upgrades, plus
      new shear walls for seismic and wind compliance under the current IRC. Once the
      structural drawings are stamped by the engineer, they go into the City of Burien
      permit package. Expect 7–10 months from permit submission to move-in for a full
      second-story addition. Call (206) 591-1096 to talk through what's structurally
      realistic for your specific house.

  - q: "What warranty does TopVolk provide on home additions?"
    a: |
      Washington State requires a three-year workmanship warranty on all residential
      construction. The more meaningful protection comes from how the project is inspected
      during the build — rough-in inspections by the AHJ for framing, electrical,
      plumbing, and mechanical mean structural and MEP issues get caught before walls
      close, not discovered two years later. Materials carry manufacturer warranties:
      Hardie siding covers 30 years; Mitsubishi mini-split equipment runs a 12-year
      compressor warranty with registration; Navien water heaters carry a 15-year heat
      exchanger warranty. Proper vapor barrier installation and flashing details protect
      the structural framing long-term — those details are inspected at rough-in, not
      assumed complete. Deadline penalties are written into the contract: if TopVolk
      misses the agreed completion date, there are financial consequences built into the
      agreement on the contractor's side.

