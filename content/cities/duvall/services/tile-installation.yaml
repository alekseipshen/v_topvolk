  - q: "What does a tile shower or backsplash install cost in Duvall?"
    a: "A standard bathroom floor re-tile runs $9-$12 per square foot installed, a full shower rebuild with Schluter Kerdi waterproofing runs $5,500-$9,500, and a kitchen backsplash typically lands between $1,800-$3,500 depending on tile size and outlet cutouts. Natural stone and large-format porcelain both add cost due to labor time and sealing. Every job gets a written, line-item estimate on-site — no vague phone quotes. Schedule a free consultation and we'll walk the space with you."
  - q: "Do I need a permit for shower tile work in Duvall?"
    a: "If the job involves moving plumbing or electrical behind the wall — which most full shower rebuilds do — the permit goes through the City of Duvall Building Department, not King County. Straight cosmetic re-tile with no rough-in changes usually doesn't require a permit, but we confirm that with the AHJ before starting either way. TopVolk is a WA Licensed Contractor and we pull and manage the permit, schedule the rough-in inspection, and close it out with the final inspection so you're not chasing paperwork."
  - q: "What's the difference between Schluter Kerdi and just using cement board in a shower?"
    a: "Cement backer board (like HardieBacker or Durock) is a stable tile substrate, but it isn't waterproof on its own — grout and thinset are porous. Schluter Kerdi is a bonded membrane that goes over the backer board or Kerdi-Board panel and actually stops water from reaching the framing. For Duvall's humidity and our older crawlspace homes, we treat Kerdi (or a comparable RedGard liquid membrane) as standard on every shower, not an upsell."
  - q: "How long does tile installation last, and what's covered under warranty?"
    a: "Properly installed and waterproofed tile should last 20-plus years — the tile itself rarely fails first, the waterproofing membrane and grout do. We warranty our installation workmanship, and product warranties (Schluter membrane systems, porcelain manufacturers) pass through separately. Grout sealing and stone sealing are maintenance items on your end, typically every 12-18 months, and we'll walk you through the schedule at handoff so nothing catches you off guard down the road."
  - q: "Do you cover areas near Duvall like Carnation or Fall City?"
    a: "Yes — we work Duvall, Carnation, Fall City, and the rest of the Snoqualmie Valley alongside our core King, Snohomish, Pierce, and Kitsap County service area. Scheduling windows run about 1-2 weeks out for a consultation and 3-5 weeks for a typical bathroom tile job once permits clear. Vladislav handles every consultation directly — no sales reps. Call (206) 591-1096 to check current availability."