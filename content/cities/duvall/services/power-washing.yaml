  - q: "Will pressure washing damage my Hardie siding or cedar deck?"
    a: "Not if it's done at the right pressure — TopVolk uses a soft-wash system with a chemical injector for siding, staying under the 1200-1500 psi range James Hardie's own care guide recommends, and switches to a wider fan tip for cedar to avoid gouging the grain. High-pressure blasting from a rented consumer unit is the most common cause of stripped paint and blown caulk joints on Hardie plank. Decks get an oxalic acid brightening step, not just a rinse, so the wood is actually ready for Cabot or Ready Seal stain afterward."
  - q: "How long does a power wash last before moss or algae comes back?"
    a: "In Duvall's valley fog, expect 12-18 months on north-facing roofs and shaded decks before moss starts showing again, versus 2-3 years on south-facing surfaces with more sun exposure. Concrete and pavers typically hold clean 1-2 years depending on tree cover and traffic. There's no product-based warranty on organic regrowth since it's driven by weather, but TopVolk stands behind the workmanship on every job. Keeping gutters clear extends the interval noticeably on roofs."
