title: "Duvall Drywall Installation — Flood-Zone & Farmhouse Ready"

answer: "Licensed drywall crews serve Duvall, WA (98019) with same-week quotes, Type-X firecode board, and Level 5 finishes for $1.75-$3.50/sq ft installed."

intro: |
  The direct answer: drywall installation in Duvall runs $1.75 to $3.50 per square foot hung, taped, and finished, with most whole-room jobs booked within a week of the estimate. Farmhouses off NE Big Rock Road and newer builds near McCormick Park don't need the same drywall spec, and that gap trips up a lot of homeowners here. A daylight basement two blocks from the Snoqualmie River trail needs mold-resistant purple board and a proper vapor barrier behind it, while a kitchen remodel near Taylor's Landing Park calling for recessed lighting under a Sub-Zero panel-ready fridge wall needs Level 5 skim finish so shadows don't show under the can lights. Duvall sits low against the river, and that river has flooded Cherry Valley Road more than once, which changes what board goes into a lower level. Get the spec wrong and you're re-hanging within two years.

localContext: |
  Most of Duvall's housing stock splits into two eras: older farmhouse-style homes scattered through the 98019 zip near Cherry Valley and Stillwater, built with balloon framing and thin furring strips, and newer construction from the 2000s-2010s clustered closer to downtown and the McCormick Park side of town. The older homes often still carry blue board and veneer plaster in a few rooms, which doesn't patch cleanly with standard joint compound — you need a plaster-compatible skim coat or the patch telegraphs through under daylight. Duvall's river-adjacent lots, especially anything near the Snoqualmie River floodplain maps, push crews toward 5/8-inch Type-X and mold-resistant board in any lower-level room, crawlspace access wall, or laundry room. The City of Duvall handles interior permit review for work tied to electrical or plumbing rough-in; standalone drywall replacement in an existing footprint usually doesn't trigger a separate permit, but anything touching a fire-rated wall between an attached ADU and the main house does, and that's common on the larger Novelty Hill-adjacent lots just outside the 98019 core near Carnation's 98014 line.

commonProblems:
  - title: "Basement and crawlspace walls going soft near the river"
    description: "Homes within a half-mile of the Snoqualmie River, especially off Cherry Valley Road, see gypsum board wick moisture from the base plate up, and standard half-inch board turns soft and stained within two seasons. The fix is purple board (mold-resistant gypsum, like CertainTeed M2Tech) run from the slab up 4 feet, paired with a 6-mil vapor barrier behind the studs and PT lumber at the sill. Crews also swap paper-faced corner bead for a vinyl or metal J-bead in these rooms since paper wicks water sideways. A typical basement redo runs $2,200-$4,800 depending on square footage, and catching it early saves a full tear-out later."
  - title: "Garage and ADU separation walls failing fire-rating checks"
    description: "Duvall's larger lots near Big Rock Park and Novelty Hill Road have added a lot of detached and attached ADUs since WA HB 1337 opened up two-unit allowances, and inspectors are strict about the shared wall assembly. A single layer of half-inch board between an attached garage and living space, or between an AADU and the main structure, fails plan review — code calls for 5/8-inch Type-X firecode on both sides with taped and mudded seams, no gaps around outlet boxes. USG Sheetrock Firecode C is the standard spec here. Getting this wrong means a failed rough-in inspection and a scheduling delay of 1-2 weeks while the AHJ re-reviews. Budget roughly $3.10-$3.80/sq ft for correctly rated assemblies."
  - title: "Popcorn ceiling removal in 1970s-80s Duvall homes"
    description: "A chunk of Duvall's older stock, particularly the ranch-style homes scattered off the highway toward Stillwater, still carries textured popcorn ceilings, and homeowners doing a kitchen or living room remodel usually want it gone. Pre-1980 texture sometimes tests positive for asbestos, so a scrape without testing is a liability, not a shortcut. Once cleared, the fix is a full skim coat with a thin veneer of joint compound over the existing board, sanded to a smooth Level 4 or Level 5 finish depending on the lighting plan. No permit is needed for this on its own through the City of Duvall unless it's tied to a larger structural scope. Expect $3-$6 per square foot for skim-coat work, testing fee separate."
  - title: "Sidewall lighting shadows in remodeled kitchens"
    description: "Kitchens getting recessed lighting near cabinet runs — common in the newer builds by McCormick Park — show every seam and screw dimple under grazing light from can lights or under-cabinet strips. Standard Level 4 finish leaves faint ridges that a $12,000 kitchen with a Wolf range and quartz counters shouldn't have. The fix is a Level 5 skim finish: a thin veneer plaster or drywall compound coat across the whole wall, not just the seams, sanded flat before primer. It adds roughly $0.50-$0.90 per square foot over standard taping but it's the difference between a wall that photographs clean and one that doesn't. This is worth flagging to your GC before the electrician even starts rough-in."
  - title: "Shared-wall noise between bedrooms in additions"
    description: "Second-story additions and bonus rooms built onto older Duvall farmhouses often reuse standard 2x4 framing with single-layer half-inch board on shared bedroom walls, and sound carries straight through. Retrofitting with resilient channel adds cost after the fact since it means pulling existing board. Cheaper mid-remodel: QuietRock or a double-layer 5/8-inch assembly with Green Glue between layers, which cuts sound transmission without touching the stud bay. Expect $4-$7 per square foot for a soundproofed wall versus $2 for standard. Lifespan on either assembly matches the house — 40-plus years — as long as it stays dry, so this is a one-time cost, not a maintenance item."

