title: "Duvall HVAC — Heat Pump & Mini-Split Pros for the Valley"

answer: "TopVolk installs heat pumps, mini-splits, and high-efficiency furnaces in Duvall, Washington — WA Licensed Contractor, 100+ projects since 2017."

intro: |
  A 1978 rancher off NE Stephens Street with a single wall furnace and zero ductwork isn't unusual to find in Duvall — and it's the kind of house TopVolk gets called to most, usually because a homeowner wants central heat and AC without ripping out plaster walls. Vladislav Volkov handles these jobs directly: no dispatcher, no sales rep, just the guy sizing the load calc and pulling the permit. Duvall's location in the Snoqualmie Valley means houses near Big Rock Park and the river bottom deal with humidity swings that inland Union Hill homes don't see as much, which changes how a system gets sized. A recent job near Taylor Landing Park paired a Mitsubishi Hyper-Heat mini-split with a whole-house dehumidifier because the existing forced-air ducts couldn't be salvaged. Most projects here run $8,000 to $22,000 depending on whether ductwork survives inspection or needs a full redo.

localContext: |
  Duvall proper, zip 98019, is mostly split-level and daylight-basement homes built between the late 1970s and mid-1990s, plus a growing cluster of newer construction off Big Rock Road and in the Ridgeview area built to the 2018-or-later Washington State Energy Code. Head east toward Novelty Hill or south into the Union Hill corridor — zip 98053 — and you're in unincorporated King County, which means HVAC permits go through King County DPER instead of Duvall's own building department. That distinction matters for scheduling: DPER plan review can add a week or two compared to Duvall's smaller counter-permit process for a straight equipment swap. Cherry Valley homes closer to the Snoqualmie River often have crawlspaces that flood every few winters, so any furnace or heat pump air handler down there needs to sit on a stand with a proper vapor barrier, not just set on grade. Foothill lots pushing toward North Bend see more freeze-thaw cycling, one more reason outdoor heat pump units get mounted on pads above the expected snow line rather than a slab that pools water.

commonProblems:
  - title: "Swapping a Gas Furnace for a Heat Pump — and Chasing the IRA Rebate"
    description: "Homeowners near downtown Duvall who bought their gas furnace before 2015 are asking about heat pump conversion mostly because of the federal rebate money — up to $2,000 in tax credits plus Washington's point-of-sale rebate for qualifying households. The catch is the electrical panel. Older Duvall homes with 100-amp service usually need a panel upgrade or at least a load calc before a Daikin or Mitsubishi ducted heat pump can go in, since the outdoor condenser and backup electric strip heat both draw more amperage than a gas furnace ever did. TopVolk runs the Manual J load calculation on-site, checks the panel, and quotes the whole job — unit, refrigerant line set, condensate line, and any electrical work — as one line-item price. Most full conversions with ductwork already in place run 3 to 5 days and land between $11,000 and $18,000 before rebates."
  - title: "Ductless Mini-Splits for New ADUs and Bonus Rooms"
    description: "Duvall's lot sizes leave room for a detached ADU, and under Washington's HB 1337, homeowners can add up to two units on a single-family lot — meaning a lot of new DADUs going up off Big Rock Road and out toward Cherry Valley need their own independent heating and cooling. Running new ductwork from the main house isn't practical once it's a separate structure with its own utility connection, so TopVolk installs Mitsubishi or Daikin ductless mini-split systems sized to the ADU's square footage, usually one wall cassette per zone with its own line set and a condensate pump if there's no gravity drain nearby. These units also handle the muggy August stretch older ducted-only homes in town can't touch, since most 1980s Duvall houses were built heat-only with no AC at all. A single-zone mini-split for a 400-600 square foot DADU typically runs $5,500 to $8,500 installed, permit included."
  - title: "Hot Upstairs, Cold Downstairs — Ductwork That Was Never Balanced Right"
    description: "Split-level homes built in Duvall through the 1980s and 90s almost always have the same complaint: the primary bedroom upstairs is ten degrees warmer than the family room on the daylight-basement level. Nine times out of ten it's undersized return air ducts or a trunk line that was never balanced when the house was built, sometimes made worse by flex duct kinked behind a soffit. TopVolk pressure-tests the system with a manometer, seals leaky joints with mastic instead of tape that dries out and fails in five years, and rebalances the dampers zone by zone. For any work touching the equipment itself — not just duct sealing — a permit gets pulled either through Duvall's building department or King County DPER depending on the address, with rough-in and final inspection scheduled around the homeowner's timeline. Sealing and rebalancing a typical 1,800 square foot split-level runs about 2 days and $1,800 to $3,200."
  - title: "Adding AC to an Existing Furnace — Why Duct Capacity Sets the Price"
    description: "A straight AC add-on to an existing forced-air furnace sounds simple until the ductwork can't move enough air for the new coil, common in Duvall homes built before 2000 with narrower trunk lines sized for heat-only systems. TopVolk measures static pressure before quoting anything, because undersized return ducts choke a new condenser's efficiency and shorten compressor life within a few years regardless of brand. When ducts check out, a Trane or Lennox AC add-on with a matched coil typically runs $6,500 to $9,500 including the line set and a new disconnect. When ducts need enlarging or a return added, add another $2,000 to $4,000 and a day or two of labor. Every quote is a fixed line-item price, and the contract includes a deadline penalty — if TopVolk misses the agreed completion date, the homeowner gets a credit written into the paperwork, not an apology."
  - title: "Keeping a Heat Pump or Mini-Split Alive Through Valley Winters"
    description: "Heat pumps and ductless mini-splits installed around Duvall generally last 12 to 15 years if the outdoor unit gets serviced — cleaning the condenser coil, checking refrigerant charge, clearing leaves and cottonwood fluff that build up fast near the river trails by Taylor Landing Park. Skipping annual maintenance is the single biggest reason TopVolk gets called for an early compressor failure instead of a routine tune-up. Pairing the system with an ecobee or Nest thermostat and proper zoning also stretches equipment life, since it stops the unit from short-cycling in mild shoulder-season weather common here from March through May. Filters on ducted systems should get swapped every 60-90 days, more often with pets in the house. TopVolk's installs come with a manufacturer parts warranty plus a one-year labor warranty on the work itself, and repeat maintenance visits are quoted flat-rate, not hourly."

