title: "Duvall ADU Construction — DADUs Built for the Valley"

answer: "TopVolk Construction builds permitted DADUs, AADUs, and basement conversions in Duvall, WA — owner-led, 100+ projects since 2017, line-item quotes."

intro: |
  TopVolk Construction designs and builds DADUs, attached ADUs, and basement conversions for Duvall homeowners, with Vladislav Volkov handling the plan set and permit submittal directly — no sales rep in between. Half the larger lots between Big Rock and the river bottom near Taylor Landing Park sit inside or near the Snoqualmie floodplain, and that changes the foundation conversation before it changes anything about layout. A DADU on a McCormick Park-adjacent lot might need a raised slab or piers instead of standard slab-on-grade, and that gets decided at the site visit, not after the concrete truck shows up. Given household incomes here well above the King County average, most Duvall ADU clients aren't building a bare-bones rental unit — they're asking for a Thermador range and a Sub-Zero undercounter fridge in the kitchenette, not a hot plate and a mini-fridge. WA HB 1337 opened the door to two ADUs per lot on most parcels in town. Call (206) 591-1096 for a site visit before you pick a floor plan off the internet.

localContext: |
  Most of Duvall falls under zip code 98019, though several larger-acreage properties on the east side blur into 98014 near Carnation. Downtown, along Main Street and the blocks around Depot Park, sit older farmhouses and early-1900s homestead lots — houses built when this was timber and dairy country, often on post-and-pier foundations that need real evaluation before a DADU utility tie-in. Head out toward Cherry Valley or Novelty Hill Road and the housing stock shifts to 1990s-2010s custom homes on one-to-five-acre parcels, built to modern energy code but still needing a full utility trench run to a detached unit. Properties inside city limits go through the City of Duvall Building Department for plan review and inspections; a handful of unincorporated parcels just outside the city line fall under King County DPER instead, and that distinction changes which office holds your permit file. The Snoqualmie and Tolt Rivers run close enough to town that flood zone maps matter — a foundation height decision can add a week to plan review if an elevation certificate is required.

commonProblems:
  - title: "DADU, Attached ADU, or Basement Conversion — Picking the Right Math"
    description: "A basement conversion looks like the cheapest path to rental income until you hit ceiling height and egress. Most Duvall basements built before 2005 sit around 6'8\" under the joists, and IRC egress rules mean cutting a window well and installing a Milgard casement unit sized for emergency escape, not just daylight. If a load-bearing wall needs to open up for a legal bedroom, that's an LVL beam and new post footings, not a quick knock-down. A basement conversion here typically runs $85K-$130K depending on how much mechanical — HVAC, water heater, panel — has to relocate. A detached DADU costs more upfront, usually $190K-$270K, but separates utilities cleanly and rents higher; the math depends on your lot, not a rule of thumb."
  - title: "Two ADUs Per Lot Sounds Simple Until Setbacks Say Otherwise"
    description: "WA HB 1337 lets most Duvall lots carry two ADUs alongside the main house, but the state law doesn't erase the City of Duvall's setback and height rules. A DADU is generally capped at 24 feet to the ridge and has to clear rear and side setbacks that tighten up on smaller in-town lots near Main Street. Lot coverage and FAR (floor area ratio) numbers matter more on a 6,000-square-foot in-town parcel than on five acres out toward Cherry Valley, and we run those calculations before drawing anything. Exterior matching also comes up in the city's design comments — Hardie siding or cedar shake to tie into an existing Craftsman-style house is a common ask. Plan review for a DADU here typically runs 6-10 weeks once the site plan and setback survey are complete."
  - title: "Separate Water Meter or Shared Line — The Utility Question Nobody Budgets For"
    description: "Utility separation is where a lot of Duvall ADU budgets go sideways. A DADU can run on a shared water and sewer connection from the main house or get its own service line — the city's public works review decides which, and a new sewer lateral or water tap can add $8K-$15K depending on where the existing line sits in the yard. MEP coordination gets simpler if you plan for it early: a Rinnai tankless water heater and a Mitsubishi mini-split handle heating and hot water in a detached unit without a full mechanical room, and both fit the tight utility closets typical of a 600-800 square foot DADU. A dedicated electrical sub-panel is required either way, and skipping this planning step is the single biggest cause of change orders on Duvall permit sets."
  - title: "What a Duvall ADU Actually Costs, Line by Line"
    description: "Pricing for ADU work here isn't a single number — it's driven by foundation type, finish level, and utility distance from the main house. A basement conversion with builder-grade finishes starts around $85K; the same square footage with semi-custom cabinets, quartz counters, and a Bosch or KitchenAid appliance package pushes toward $140K. A ground-up DADU with a Thermador range and Sub-Zero undercounter fridge — common asks given household incomes out here — lands between $220K and $280K depending on lot prep and grading. TopVolk quotes these line by line, not as a range pulled from a brochure, and the contract includes a penalty clause if we miss the completion date we sign up for. That's a different conversation than most GCs will have with you before signing."
  - title: "Cedar, Composite Decking, and What the Valley's Rain Does to a New ADU"
    description: "A new DADU built to current energy code gets R-49 in the ceiling and a proper vapor barrier in the crawlspace, which matters more here than people expect — Duvall sits low in the valley and holds fog and standing moisture long after Seattle proper has dried out. Any deck framing or stair stringer touching grade needs PT lumber, and for the deck boards themselves, Trex or TimberTech composite holds up better than cedar against the moss and mildew that creeps across north-facing surfaces November through April. A cedar-sided DADU will need refinishing within 5-7 years in this climate; Hardie fiber-cement siding stretches that maintenance cycle past 15 years. None of this is exotic — it's what the Snoqualmie Valley's rain and humidity do to a structure, and building for it upfront costs less than fixing it in year six."

faq:
  - q: "How fast can you get to Duvall for Adu Construction?"
    a: "Duvall sits about a 35-40 minute drive from TopVolk's usual service loop, out along the Woodinville-Duvall Road or SR-203 depending on where you're coming from. Vladislav handles the site visits directly, so scheduling is one call, not a dispatch system — most Duvall consultations get booked within a week. For ADU work specifically, that first visit includes a look at the lot, a rough setback check, and a conversation about DADU versus basement conversion before any design work starts. Call (206) 591-1096 to get on the schedule; there's no sales team filtering the call."
  - q: "What does a DADU cost in Duvall?"
    a: "A detached ADU in Duvall typically runs $190K to $280K all-in, covering foundation, framing, MEP, and interior finish — the range comes down to lot grading, utility distance, and finish level, whether that's a Bosch appliance package or a full Sub-Zero and Thermador kitchen. Basement conversions run less, usually $85K-$140K, since the shell already exists. TopVolk gives a line-item quote after the site visit, not a ballpark number over the phone. Ask for the free estimate and you'll get actual figures tied to your lot and your plan, not a brochure range."
  - q: "Does my Duvall ADU need City permits or King County DPER approval?"
    a: "If your property sits inside Duvall city limits, plan review and inspections go through the City of Duvall Building Department, not King County DPER — that includes the site plan, setback survey, and rough-in and final inspections. A handful of parcels just outside city limits, out toward Cherry Valley, fall under King County DPER instead, with a slightly different paperwork and review timeline. TopVolk, as a WA Licensed Contractor, prepares the full plan set — including an elevation certificate if your lot touches the Snoqualmie floodplain — and handles the submittal directly. Expect 6-10 weeks for DADU plan review once the application is complete; a basement conversion permit usually clears faster, around 3-5 weeks."
  - q: "Can I put a full kitchen in a Duvall DADU or just a kitchenette?"
    a: "WA state ADU rules allow a full kitchen in a DADU, not just a kitchenette — that's changed from older code that limited cooking appliances in accessory units. Most Duvall clients go with a full kitchen given the rental income potential, and given the price point out here, that often means a slide-in range from Wolf or Thermador, a Sub-Zero undercounter unit, and semi-custom cabinets rather than stock boxes. Ventilation matters too: a range hood needs to hit code-minimum CFM for whatever cooktop you choose, gas or induction. We spec that during design, not after the cabinets are ordered."
  - q: "What's the warranty on a TopVolk-built ADU, and how long does it hold up in this climate?"
    a: "TopVolk backs structural and workmanship items for one year after final inspection, and manufacturer warranties layer on top of that — a Rinnai tankless unit or a Mitsubishi mini-split typically carries 10-12 years on parts. Built correctly, with R-49 insulation, a proper vapor barrier, and Hardie siding or well-maintained cedar, a Duvall DADU should perform structurally for 40-plus years. What wears out first is finish-level stuff — deck boards, exterior paint, caulking around windows — which is why we push composite decking and fiber-cement siding out here instead of cedar, given how much rain this valley gets October through May."
  - q: "Do you cover areas near Duvall besides the city itself?"
    a: "Yes — TopVolk works Duvall alongside Carnation, Woodinville, Redmond, and unincorporated Snoqualmie Valley out to Cherry Valley and Novelty Hill, all inside the King County service area. Scheduling runs on a rolling basis; most ADU projects book a design and permit slot 2-3 weeks out from the first call. Since it's owner-led with no office staff, response time on estimates is usually next business day, and every contract includes a deadline penalty clause. Call (206) 591-1096 or ask for a free consultation — Vladislav has walked well over 100 of these lots across King, Snohomish, Pierce, and Kitsap counties since 2017."