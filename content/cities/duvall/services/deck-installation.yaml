  - q: "What does deck installation in Duvall cost per square foot?"
    a: "Ground-level composite decks generally run $45-$65 per square foot installed in Duvall, with cedar landing closer to $35-$50 depending on grade and fastener choice. Elevated decks with engineered beams, deeper footings, and code-required guardrails push costs higher because of the additional structural work, not just the decking surface. Every quote from TopVolk is line-item — lumber, hardware, labor, permit fees — not a vague range. Call for a free estimate with exact numbers for your lot."
  - q: "Do I need a permit for a deck in Duvall, and how long does that take?"
    a: "Yes — any deck over 200 square feet or more than 30 inches above grade needs a permit through Duvall's Community Development Department if you're inside city limits, or King County DPER if your property sits in an unincorporated area near 98072. TopVolk prepares the ledger flashing detail, footing plan, and guardrail spec as part of the submittal, and typical review takes 2-4 weeks for standard attached decks. Rough-in and final inspections get scheduled once framing and railing are complete, and as a WA Licensed Contractor we handle that coordination directly."
  - q: "Should I pick composite decking or cedar for a house near the Snoqualmie River?"
    a: "Composite — Trex or TimberTech specifically — handles the moisture and shade near the river better than cedar, which tends toward moss and gray streaking on north-facing lots within a couple of seasons. Cedar still works well on sunnier, higher-elevation lots toward Big Rock where airflow keeps boards drier. Either way, the frame underneath needs joist tape and stainless or hot-dipped fasteners, since that hardware fails before the decking surface does in this climate."
  - q: "What's the warranty on a new deck, and how long will it actually last?"
    a: "TopVolk backs workmanship on framing, footings, and flashing, and composite decking from Trex or TimberTech typically carries a 25-to-50-year manufacturer warranty against rot and fading. Cedar doesn't come with that kind of material warranty and needs re-sealing every 12-18 months to hold up in Duvall's wet winters. With proper footing depth and ledger flashing, the structural frame itself should last 25+ years even if the decking surface gets replaced once in that span."
  - q: "Do you cover areas near Duvall too, or just the town itself?"
    a: "TopVolk covers the greater Duvall area including Cherry Valley, Stillwater, and the unincorporated stretch toward Cottage Lake, plus King, Snohomish, Pierce, and Kitsap counties more broadly. Scheduling windows typically run 2-3 weeks out for a design and permit prep meeting, sooner if the project is already permitted. Call (206) 591-1096 or ask for a free consultation to get a specific date on the calendar."