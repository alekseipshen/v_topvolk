title: "Duvall Deck Installation — Built for River Valley Weather"

answer: "TopVolk Construction builds Trex, TimberTech, and cedar decks in Duvall, Washington -- footings to frost line, guardrails to code, owner-run since 2023."

intro: |
  Ground contact PT lumber for the posts, hot-dipped joist hangers at the rim, and a ledger flashed correctly before the first board goes down -- that's the short version of what separates a deck that lasts fifteen years from one that's spongy by year six. Duvall sits right along the Snoqualmie River, and homes on Cherry Valley Road or up near Big Rock deal with a wetter, mossier microclimate than folks in Redmond fifteen minutes south. A client near McCormick Park wanted Trex Transcend over a walkout basement patio last year, plus a built-in Wolf outdoor grill bumped into the rail line; a homeowner off Stillwater Road two miles out went with clear cedar because it matched the farmhouse trim on a 1970s remodel. Both jobs needed different footing depths because of how the soil drains near the river bottom versus up on the bluff. Vladislav Volkov runs every Duvall project personally -- no sales rep, no subcontracted project manager, just the guy pulling the permit and standing on the ledger board.

localContext: |
  Duvall's housing stock runs from older farmhouses and river-bottom cabins near 98019 built before the town incorporated in 1913, up through newer large-lot construction on the hillsides toward Novelty Hill and Cherry Valley. A lot of homes close to downtown Main Street sit on older post-and-pier foundations that were never built to carry a second-story deck load, so we end up adding a sistered rim joist or an LVL beam more often here than in a newer subdivision. Just west, the unincorporated pocket around 98072 near Cottage Lake and Union Hill has larger parcels with septic systems, which changes where footings can go relative to the drain field. Because Duvall floods along the Snoqualmie in a wet winter, we grade footing depth and ledger flashing height with that in mind, especially on lots below Taylor's Landing Park. Homes built after 2005 out toward the Stillwater area usually have decent structural bones already, but the composite decking installed by the original builder is often the cheapest grade available at the time and due for a full tear-off.

commonProblems:
  - title: "Cedar looks right on a farmhouse but moss doesn't care about style"
    description: "North-facing decks near the river tree line — common around Cherry Valley and Stillwater — stay damp long after the rest of the yard dries out, and untreated cedar picks up moss and gray streaking within two seasons. Composite boards like Trex Transcend or TimberTech AZEK solve the moss problem but read as too modern for some of Duvall's older farmhouses, so a cedar fascia board over a composite deck surface often splits the difference. The real fix underneath either choice is joist tape over the frame plus Simpson Strong-Tie hangers instead of the cheaper galvanized hardware most lumber yards stock. Budget roughly $12-$18 more per square foot for composite over standard cedar, offset by skipping the annual sealing."
  - title: "Guardrail height gets missed on walkout decks over a daylight basement"
    description: "Plenty of Duvall lots slope toward the river, which means a deck off the main floor can sit 6 to 10 feet above grade at the low end — well past the 30-inch threshold that triggers a 36-inch guardrail requirement under IRC. Homeowners doing DIY railing repairs sometimes reuse old 32-inch cap rail sections meant for a lower deck, which fails inspection immediately. Baluster spacing has to pass the 4-inch sphere rule too, and older decks built before 2010 routinely don't. A rebuild with pressure-treated posts and a graspable 1.5-inch top rail typically runs $2,800-$6,500 depending on linear footage and whether cable rail or wood balusters get used."
  - title: "Permits go through Duvall's building department, not always King County DPER"
    description: "Inside city limits, a new deck over 200 square feet or more than 30 inches high needs a permit through Duvall's own Community Development Department, while properties just outside town in unincorporated pockets near 98072 file through King County DPER instead — two different desks, two different timelines. Both require a ledger flashing detail using a self-adhered membrane like Grace Ice & Water Shield, plus footing depth to frost line, generally 18 inches in King County's soil conditions, before a rough-in inspection gets scheduled. TopVolk pulls the permit, schedules the ledger inspection, and handles the final walkthrough as WA Licensed Contractor so the homeowner isn't the one chasing paperwork. Typical review takes 2-4 weeks for a straightforward attached deck in Duvall's smaller department, faster than Seattle SDCI's queue."
  - title: "Deck cost swings hard based on height, footings, and whether it's over living space"
    description: "A simple ground-level deck in Duvall — PT lumber frame, Trex decking, basic rail — usually lands between $9,000 and $16,000 depending on square footage. Add a second story over an existing patio, and structural engineering for the LVL beam and post footings pushes that toward $22,000-$40,000, especially on river-adjacent lots where soil bearing capacity needs a deeper footing than standard 12-18 inches. Drainage matters even more on a second-story deck built over usable space below, since water has to shed through a proper membrane system instead of just draining through the boards. TopVolk writes a line-item quote before work starts, with a deadline penalty built into the contract if the schedule slips."
  - title: "Composite outlasts cedar here, but nothing lasts forever without upkeep"
    description: "Cedar decking in Duvall's climate needs re-sealing every 12-18 months to fight the moss and gray weathering that river-valley humidity causes, and most homeowners let that slide after year three. Composite boards from Trex or TimberTech carry 25-to-50-year warranties and mainly need an annual wash to keep mildew off the north side of the house, particularly under tree cover near Cherry Valley. Ledger flashing and joist hardware are the parts that actually fail first regardless of decking material — galvanized hangers corrode faster than the boards above them in a wet crawlspace. A full deck typically needs framing inspection again around year 20-25 if the original footings and posts were sized correctly at install."

