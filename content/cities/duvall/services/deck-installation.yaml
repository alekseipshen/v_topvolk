answer: "Deck building in Duvall, WA: Seattle-area 2025 averages are about $20K for a 16x20 wood deck and about $29K in composite. Repairs are priced after the framing is opened. Building usually takes 1-3 weeks once permitted. Free on-site estimate: (206) 591-1096."

title: "Duvall Deck Building and Deck Repair: Cost and City Rules"

intro: |
  For a new deck in Duvall, Remodeling magazine's 2025 Cost vs. Value
  report gives a useful starting point: a 16 by 20 foot deck with railing
  and steps costs about $20,000 in pressure-treated wood and about $29,000
  in composite in the Seattle market. Height, stairs down a slope and
  removing an old deck move the number, so call for a written quote after a
  free on-site estimate. Once the permit is issued, building usually takes
  about one to three weeks on site.

  Deck repair is priced differently. Replacing boards on a sound frame is a
  short job; rot in the ledger, joists or posts is not, and the real scope
  shows only once the old boards come up.

localContext: |
  Duvall's Building Division issues its own building permits, and permit
  questions go to the city's permit technician. Electrical work, such as
  deck lighting or an outlet, is permitted by the Washington State
  Department of Labor & Industries, not the city.

  Duvall's houses are mostly from one long building wave. The city's 2023
  Housing Needs Assessment, based on Census estimates, counts 29% of homes
  built in the 1980s, 21% in the 1990s and 28% between 2000 and 2009,
  with only a few percent older than 1970. Many decks on those houses are
  original, which puts them at roughly 20 to 45 years old. That is the age
  when ledger boards, joist tops and posts at grade start to show rot,
  especially on decks that stay shaded and wet through the winter.

commonProblems:
  - title: "When a Duvall deck needs a permit"
    description: |
      The City of Duvall requires a permit for a deck more than 30 inches
      above grade, measured straight down to the ground at any point within
      36 inches of the deck's outer edge. On a lot that slopes away from the
      house, a deck that is low at the door can cross that line at the far
      edge. Replacing decking on an existing deck without changing or adding
      structural members does not need a permit, so a board-only repair can
      start sooner than a rebuild.
  - title: "Setbacks from the property line"
    description: |
      Duvall's development code lets an uncovered deck that is more than 18
      inches above finished grade project 18 inches into an interior
      setback and 5 feet into a street setback, except in the zones where
      the allowed setback is 0 feet. An uncovered deck no higher than 18
      inches may extend to the property line. A roof over the deck changes
      that, because these allowances are written for uncovered decks. Check
      your zone with the city before the footprint is fixed.
  - title: "Rotted deck repair: ledger, joists and posts"
    description: |
      Rot on an older deck usually starts where water sits: behind a ledger
      that was installed without flashing, on the tops of joists under the
      boards, and at posts set in soil. Soft spots, boards that bounce and
      fasteners that pull out are the signs. A repair opens the affected
      area, replaces the rotten framing, adds flashing at the house, and
      sets posts on concrete above grade. If the ledger or the house rim
      behind it is rotten, that part is fixed before any new boards go on.
      Where a lot of the framing is affected, rebuilding the deck can cost
      less than repairing it piece by piece.
  - title: "Leaking and waterproof decks over living space"
    description: |
      A deck that sits over a room, a garage or a covered patio has to
      keep water out, not just shed it between boards. That takes a
      walkable waterproof membrane on a sloped surface, with flashing at
      the house wall and the edges. A leak shows up as stains on the ceiling
      below, and by then the framing under the membrane is often wet. Repair
      starts by finding where water gets in, removing the damaged section,
      drying out or replacing wet framing, and then installing a new
      membrane over the repaired deck.

faq:
  - q: "How much does it cost to build a deck in Duvall?"
    a: |
      The 2025 Cost vs. Value report puts a 16 by 20 foot deck in the
      Seattle market at about $20,000 in wood and about $29,000 in
      composite. Height, stairs and demolition of an old deck add to that.
      Call for a written quote after a free on-site estimate; 0% financing
      for 24 months is available, subject to credit approval.
  - q: "How much does deck repair cost in Duvall?"
    a: |
      It depends on how much framing is damaged. Replacing boards on a
      sound frame costs far less than replacing a rotten ledger or joists,
      and a waterproof deck over living space costs more than both because
      the membrane has to be redone. The estimate is free, and the written
      quote follows an inspection of the frame.
  - q: "Do I need a permit to repair my deck in Duvall?"
    a: |
      Not to replace decking boards without changing structural members.
      A deck more than 30 inches above grade that is being built or
      structurally altered needs a city permit, and any electrical work
      needs a Labor & Industries permit.
  - q: "Who do I talk to when I call?"
    a: |
      Call (206) 591-1096 and you reach Vladislav Volkov, the owner of
      TopVolk, a licensed and insured Washington general contractor. The
      contract includes a written warranty and $100 for every day past the
      agreed deadline.
