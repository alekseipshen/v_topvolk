  - q: "Do I need a permit for a fence in Duvall?"
    a: "Fences under 6 feet in rear and side yards, and under 4 feet in front yards, generally don't need a permit under City of Duvall code — anything taller, or any fence tied to a retaining wall over 4 feet, does. If your property falls in unincorporated King County near Novelty Hill instead of inside city limits, King County DPER handles that permit instead of the city. As a WA Licensed Contractor, we confirm your parcel's jurisdiction and pull the correct permit before ordering material, so there's no surprise stop-work order mid-project."
  - q: "What's the difference between cedar and vinyl for a Duvall property?"
    a: "Western Red Cedar looks natural and takes stain well but needs re-coating every 2-3 years to resist our wet-season moisture; CertainTeed vinyl panels cost more upfront but need almost no upkeep and won't rot at the post base. Horizontal slat cedar fencing is popular right now on newer builds for a cleaner, modern look, while traditional picket-style cedar still fits older lots better. We'll show you both up close before you commit — no pressure toward the pricier option."
  - q: "What's the warranty on a TopVolk fence in Duvall?"
