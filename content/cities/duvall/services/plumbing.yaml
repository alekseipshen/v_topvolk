  - q: "Do I need a permit for plumbing work in Duvall?"
    a: "Yes — water heater replacements, gas line changes, and any repipe touching the main supply line need a permit whether the property sits inside Duvall's city limits or in unincorporated King County nearby, where King County DPER handles review instead of the city building department. Seismic strapping on any water heater is required under Washington state code regardless of jurisdiction, and that gets checked at final inspection along with the gas line pressure test on a tankless swap. TopVolk pulls the permit, schedules the rough-in and final inspections, and builds that timeline into the project schedule up front — WA Licensed Contractor, so the paperwork side isn't left to the homeowner to chase down."
  - q: "Can I actually convert to a tankless water heater in an older Duvall home?"
    a: "Most older Duvall homes can convert to a Rinnai or Navien tankless unit, but the gas line almost always needs a look first — older 1/2-inch black iron sized for a 40-gallon tank usually can't feed a tankless unit's 180,000 BTU draw without upsizing to 3/4-inch pipe, sometimes with a dedicated run back to the meter. Electric-only homes need a 120V outlet near the install point plus venting run to the exterior, which is a bigger job on an interior utility closet than a garage install. TopVolk checks gas meter capacity and line sizing during the free consultation before quoting the conversion, so there's no surprise mid-project."
  - q: "What's the warranty on plumbing work and how long does it last in this climate?"
    a: "Fixture and pipe materials carry the manufacturer's warranty — Kohler and Moen both run limited lifetime on most fixtures, Rinnai and Navien typically 10-12 years on tankless heat exchangers — and TopVolk backs the labor separately on top of that. PEX-A and copper repipes should outlast the house, 40-plus years with no real maintenance beyond checking shutoff valves periodically. The valley's freeze-thaw swings in a cold winter are hard on exposed exterior hose bibs and crawlspace lines without insulation, which is why any repipe here gets pipe insulation and a vapor barrier in the crawlspace as standard, not an upsell. If a completion date on the contract slips, that penalty is written in — not a verbal promise."
