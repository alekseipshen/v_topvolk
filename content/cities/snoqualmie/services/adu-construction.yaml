  - q: "What does an ADU cost in Snoqualmie?"
    a: "Most projects run $190K-$320K. The build type — basement conversion, attached bump-out, or full detached unit — sets the baseline, and sloped-lot site work is the biggest cost driver on Snoqualmie Ridge. Utility separation, foundation type, and finish level (builder-grade versus Sub-Zero and Thermador appliances) shift the number further. Every quote is a line-item breakdown, not a ballpark range. Call (206) 591-1096 for a free estimate with actual numbers, not a guess."
  - q: "How does ADU permitting work with the City of Snoqualmie?"
    a: "The City of Snoqualmie handles its own plan review out of City Hall on Falls Avenue, separate from King County DPER. Plan review generally runs 6-10 weeks. Snoqualmie Ridge parcels also go through HOA architectural review for exterior materials and placement, which can add another few weeks. We prepare the full submittal — site plan, floor plan, structural details — and track it through both the city and the HOA where it applies. TopVolk is a WA Licensed Contractor and manages the whole permit process directly."
  - q: "Can I add a DADU and still use my basement as a second unit under HB 1337?"
    a: "Yes. On most single-family lots in Snoqualmie, WA HB 1337 allows two ADUs total — a detached unit plus a basement conversion or attached ADU — as long as setbacks and lot coverage limits are met. The basement unit needs its own egress window meeting IRC requirements, plus a separate entrance. The detached unit needs its own foundation and utility connection, or a shared tap sized for the added fixture count. We check both lot coverage and existing framing (looking for load-bearing walls that need an LVL beam) before confirming the layout works."
  - q: "What's the warranty on an ADU build, and how long will it hold up?"
    a: "Workmanship is warranted. Manufacturer warranties on components like Hardie siding (30+ years), Milgard windows, and Mitsubishi mini-split systems carry through separately. Hardie board handles Snoqualmie's damp, shaded lots better than cedar over the long run, with less recoating needed. Foundation and structural work is built to current IRC standards for this elevation, including frost depth and roof snow load. Call (206) 591-1096 if you want the specifics in writing before signing anything."
