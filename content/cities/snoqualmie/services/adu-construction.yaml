    a: "Yes — North Bend, Fall City, Issaquah, and Sammamish are all in the regular service area alongside Snoqualmie. Scheduling for a full ADU project, from first consultation to move-in, typically runs 4-7 months once you count permit review. Smaller basement conversions can move faster if the foundation and framing are in good shape. Schedule a free consultation at (206) 591-1096 to get an actual timeline for your lot."