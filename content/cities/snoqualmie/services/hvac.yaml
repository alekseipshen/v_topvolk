  - q: "What does a heat pump conversion cost in Snoqualmie?"
    a: "A ducted heat pump conversion in Snoqualmie typically runs $9,000-$16,000 installed, and the swing depends on tonnage, whether existing ductwork passes a static pressure test, and how much electrical panel work the new circuit needs. Ductless mini-split installs for a single zone run $5,500-$8,500, less than a full ducted swap since there's no trunk line to reuse. IRA and Washington state rebates can offset $2,000-$4,000 of that when the old furnace is fully retired rather than kept as backup. TopVolk gives a line-item quote after the on-site walkthrough, not a phone estimate — call (206) 591-1096 to schedule one."
  - q: "Do I need a permit for HVAC work in Snoqualmie, and will the Snoqualmie Ridge HOA sign off on the equipment?"
    a: "Yes — anything beyond a like-for-like furnace swap needs a mechanical permit through the City of Snoqualmie Building Division, and plan review on a heat pump or AC addition typically takes 1-3 weeks before work can start. If the house is in Snoqualmie Ridge, the HOA's architectural committee usually wants a site plan showing where the outdoor condensing unit sits and how it's screened from the street — TopVolk prepares that alongside the permit set so there's no second trip. Vladislav Volkov is a WA Licensed Contractor and handles inspection scheduling directly with the AHJ, with rough-in and final inspection typically covered in the same visit window."
  - q: "Can a ductless mini-split actually heat a DADU through a Snoqualmie winter?"
    a: "Cold-climate mini-splits like the Mitsubishi Hyper-Heat or Daikin low-temperature series are rated to keep producing heat down to -13°F, well below anything Snoqualmie sees even with cold air draining off Mount Si in a hard winter. The outdoor condensing section modulates output as the refrigerant line set carries variable refrigerant flow to the indoor cassette, so it doesn't shut off and default to electric strip heat like older systems did. For a detached ADU under Washington's HB 1337, a single-zone Hyper-Heat setup usually covers both heating and cooling without a backup furnace. Sizing it right still takes a real Manual J calculation, not square-footage guesswork off a listing sheet."
  - q: "What's the warranty on a new heat pump or furnace installed in Snoqualmie?"
    a: "Manufacturer parts warranties on Trane, Daikin, and Mitsubishi equipment run 10 years when registered within 60 days of installation, and TopVolk backs the labor on new HVAC work separately in the written contract. In this climate, heat pumps typically last 12-15 years and gas furnaces 18-20 years with annual maintenance — coil cleaning, filter changes, and a condensate drain line check before the rainy season backs up a drain pan. What's not covered: damage from skipped maintenance or a condensing unit left buried in moss and debris, a real issue on shaded, north-facing sides of Snoqualmie Ridge lots most of the winter."
