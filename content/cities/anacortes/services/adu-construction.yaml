title: "Anacortes ADU Construction — DADUs & Conversions on Fidalgo Island"

answer: "Vladislav Volkov builds DADUs, AADUs, and basement conversions in Anacortes under WA HB 1337 — WA Licensed Contractor, 100+ projects completed."

intro: |
  Vladislav Volkov builds detached and attached ADUs in Anacortes under WA HB 1337 — permitted through the City of Anacortes, with 100+ projects completed across the Puget Sound region since 2017. Fidalgo Island runs a tight rental market between the ferry terminal crowds heading to the San Juans and the refinery workforce out at March Point, so a legal second unit pencils out fast — whether it's rental income or space for aging parents near Cap Sante Park. A lot of homeowners near Old Town start the conversation wanting a garage converted into a DADU, then find out the existing slab won't carry a bathroom drain line without breaking it out and repouring — that's a real cost driver, not an upsell. Others in the Skyline neighborhood have room for a full detached cottage with its own Rinnai tankless water heater and a Mitsubishi mini-split instead of tying into the main house's aging forced-air system. Either way, the permit set, the utility separation plan, and the framing all get scoped before a number goes on paper.

localContext: |
  Housing stock in 98221 runs from early-1900s Old Town Victorians and Craftsman cottages near downtown to 1970s-90s ranch and split-level construction spread through Skyline and the streets off Oakes Avenue. Out toward 98279 and March Point, lots tend to run bigger with more room for a detached unit, but septic systems on some older parcels change the utility-separation math before DADU square footage is even on the table. Fidalgo Island sits on rock and glacial till in spots, so foundation work for a new DADU sometimes means spread footings instead of a standard perimeter wall, especially on the slopes above Guemes Channel. Anacortes permits ADU projects through the City's own Planning, Community & Economic Development Department, not Skagit County PDS — that office only covers unincorporated parcels outside the city boundary, and it wants a site plan showing setbacks, lot coverage, and the separate utility connection before plan review even starts. Marine exposure off Rosario Strait means any DADU sided in cedar needs real detailing; Hardie siding holds up better against salt air and driving rain than a cedar lap job left unfinished.

commonProblems:
  - title: "Septic Capacity and Utility Separation on Older Fidalgo Island Lots"
    description: "Older lots near March Point and out toward Similk Beach are still on septic, not city sewer, and the health department has to sign off before a second unit's wastewater load gets added to an existing drainfield. If the DADU shares the septic system, they'll want a capacity letter proving the tank and drainfield can handle a second bedroom's flow; if it can't, that's a $15K-$30K drainfield expansion before framing even starts. On sewer-connected parcels closer to downtown, the fix is simpler — a new sewer lateral tied in with its own cleanout, sized per IRC and inspected by the City before backfill. Water usually stays on the shared meter, but a backflow preventer gets added at the branch line. We scope septic vs. sewer status during the free site visit, before a design ever gets drawn."
  - title: "The 24-Foot Height Limit, Setbacks, and Lot Coverage"
    description: "Anacortes zoning caps most detached accessory structures at 24 feet to the roof ridge and requires minimum setbacks from rear and side property lines that get tighter on the narrow lots platted in Old Town before 1920. Add lot coverage limits — Anacortes counts the DADU footprint against total impervious surface — and a homeowner with an existing garage plus a shed can find out fast there's no coverage left to spend. WA HB 1337 overrides a lot of the old ADU restrictions on paper, but Anacortes still layers its own height, setback, and design standards on top of the state minimums. We pull the actual zoning envelope for the parcel — not just an HB 1337 summary — before pricing a DADU, because a redesign after plan review costs more than a week of survey work up front."
  - title: "Plan Review Runs Through the City of Anacortes, Not Skagit County PDS"
    description: "Anacortes permits its own ADU projects through the Planning, Community & Economic Development Department downtown — Skagit County PDS only handles unincorporated parcels outside city limits, which trips up homeowners who call the wrong office first. A complete DADU submittal needs a site plan, structural drawings sized with a stamped LVL beam and joist hanger schedule where the floor system spans over 12 feet, and an energy code compliance form. Plan review is running 6-10 weeks for a detached unit right now, plus separate mechanical and electrical permits for the mini-split and sub-panel. Framing gets a rough-in inspection before drywall goes up, and a final inspection closes the permit once the AHJ signs off. TopVolk Construction is a WA Licensed Contractor and handles the permit set and every inspection call — Vladislav walks the inspector through the job personally."
  - title: "What a DADU Actually Costs on Fidalgo Island"
    description: "A detached ADU here typically runs $180K-$260K depending on size, foundation type, and finish level; a basement conversion runs less, usually $60K-$110K, since the shell already exists. Framing with PT lumber at the mudsill and an LVL beam over the garage door opening if the DADU sits above parking adds real cost, and so does a full kitchen with a range hood and mid-range appliances — Samsung, LG, Whirlpool, GE, or KitchenAid are the common calls at this income level, with Bosch dishwashers showing up more often lately. A Rinnai or Navien tankless water heater paired with a Mitsubishi mini-split runs $12K-$18K combined installed, less than a gas furnace and standalone AC in most cases. Every quote is line-item, not a range, and the contract has a deadline penalty written in — if TopVolk misses the finish date, that's a cost to us, not you."
  - title: "Cedar Weathering, Crawlspace Moisture, and What Actually Holds Up"
    description: "Marine air off Rosario Strait and roughly 30-plus inches of rain a year means an unfinished cedar-sided DADU starts graying and picking up moss on the north wall within two or three seasons. Hardie fiber-cement siding costs more up front but doesn't rot, doesn't need repainting as often, and holds up better against wind-driven rain than cedar left without a real maintenance schedule. Underneath, a crawlspace foundation needs a proper vapor barrier and R-49 insulation at the floor system, or moisture works its way into the rim joist and blocking within a few winters. Composite decking — Trex or TimberTech — outlasts PT lumber decking on a DADU porch by a decade or more with zero refinishing. Expect 25-30 years out of Hardie siding before recoating, and a properly detailed crawlspace should need nothing more than an annual look with a flashlight."

faq:
  - q: "How fast can you get to Anacortes for ADU Construction?"
    a: "Anacortes sits about 75-80 minutes north of Seattle off I-5 and Highway 20, and TopVolk covers it as part of the broader Puget Sound service area run out of Snohomish and King County. Vladislav schedules the free on-site consultation directly — no dispatcher, no sales rep — usually within a week of the first call. Most DADU jobs need a laydown area for materials near the build site, which gets worked out during that first walk. Once permits clear, actual construction on a detached unit typically runs 10-14 weeks. Call (206) 591-1096 to get on the schedule."
  - q: "What does ADU construction cost per square foot in Anacortes?"
    a: "A detached ADU generally lands between $350 and $450 per square foot in Skagit County once site work, utility separation, and finishes are counted, with basement conversions running lower per foot since the foundation and roof already exist. Foundation type moves the number most — a sloped Fidalgo Island lot near Guemes Channel needing spread footings costs more than a flat interior lot in Skyline. Finish level is the other big swing: semi-custom cabinets and quartz counters versus IKEA cabinets and laminate can be a $20K spread on a single kitchen. TopVolk gives a line-item quote with exact numbers after the free site consultation. Call (206) 591-1096."
  - q: "Who handles ADU permits in Anacortes — the city or Skagit County?"
    a: "Inside Anacortes city limits, ADU permits run through the City's Planning, Community & Economic Development Department, not Skagit County PDS — that office only covers unincorporated parcels outside the boundary, including some lots out past March Point. Under WA HB 1337 the city can't require owner-occupancy or extra parking near the ferry terminal transit corridor, but it still enforces its own height, setback, and lot-coverage standards on the permit set. Plan review typically takes 6-10 weeks for a detached unit; TopVolk prepares the site plan, structural drawings, and energy code forms as a WA Licensed Contractor and tracks the application the whole way through."
  - q: "Should I build a detached ADU or convert my basement in Anacortes?"
    a: "It comes down to the existing structure and the lot. A basement conversion works if there's 7 feet of ceiling height, room for an egress window, and a foundation dry enough to skip a full vapor barrier retrofit — common in the 1970s-90s ranch homes off Highway 20. A detached DADU makes more sense on a lot with septic capacity and coverage room to spare, since it gets full separation from the main house plus its own Rinnai tankless and mini-split instead of tying into existing HVAC. Vladislav walks both options with real numbers during the site visit before you commit to a design."
  - q: "How long does a new ADU in Anacortes last, and what's the warranty?"
    a: "Structural framing and the building envelope carry a 1-year workmanship warranty from TopVolk on top of manufacturer warranties on the mechanical equipment — a Rinnai tankless typically runs a 12-year warranty on the heat exchanger, a Mitsubishi mini-split runs 5-12 years depending on registration. Hardie siding is rated for the marine climate off Rosario Strait and holds 30-plus years with basic upkeep; PT lumber framing and proper flashing at every penetration keep moisture out of the wall assembly for decades. What's not covered: normal weathering, moss growth on north-facing surfaces, or gutters a homeowner never cleaned."
  - q: "Do you build ADUs outside Anacortes too — Mount Vernon, Oak Harbor, La Conner?"
    a: "TopVolk covers the wider Puget Sound region out of Snohomish, King, Pierce, and Kitsap counties, and takes Skagit County jobs including Mount Vernon, Burlington, Oak Harbor, and La Conner on the same trip schedule as Anacortes work. Most weeks a site visit lands on the calendar within 5-7 days of the first call. Scheduling fills up faster in spring and summer construction season, so earlier calls get earlier start dates. Call (206) 591-1096 or ask for a free consultation to lock in a design and permit timeline before the fall rain sets in."