  - q: "Do I need a permit for a water heater or repipe in Anacortes?"
    a: "Yes — the City of Anacortes Building Division requires a mechanical permit for any water heater replacement, including seismic strapping documentation, and a plumbing permit for repipes that touch supply lines behind walls or under the slab. TopVolk pulls these permits directly since Vladislav is a WA Licensed Contractor, and schedules the rough-in inspection and final inspection around the crew's timeline instead of leaving the homeowner to coordinate with the city. Turnaround on a straightforward water heater permit is usually a few days; a full repipe permit can take one to two weeks depending on the city's review queue. Anacortes permitting is separate from Skagit County's process for unincorporated areas outside city limits."
  - q: "Can you convert my galvanized pipes to PEX without opening every wall?"
    a: "Most of the time, yes. TopVolk runs PEX-A tubing through the same crawlspace or attic chases the galvanized pipe used, dropping down to fixtures through existing wall cavities wherever a stud bay lines up. Old Town homes on post-and-pier foundations make this easier than a slab-on-grade house since there's full crawlspace access to work from below. A handful of tight spots — like a second-floor bathroom with no clear chase — may need a small patch of drywall, which TopVolk includes in the quote so there's no surprise cost later."
  - q: "How long do the fixtures and pipe you install actually last?"
