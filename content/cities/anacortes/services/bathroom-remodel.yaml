  - q: "What does a bathroom remodel cost in Anacortes?"
    a: |
      A basic tile-and-fixture refresh — vanity swap, new toilet, updated faucets — runs
      $7,000–$14,000. A full gut-rebuild with curbless shower, plumbing rough-in, new exhaust
      fan, and finish work runs $18,000–$35,000. What pushes cost up: water damage in the
      subfloor or walls, drain relocation, load-bearing wall removal, or special-order
      materials with longer lead times. Every TopVolk quote breaks out materials and labor
      line by line — no bundled estimates or vague allowances. Call (206) 591-1096 for a
      free on-site estimate.

  - q: "Do bathroom remodels in Anacortes require permits?"
    a: |
      Plumbing changes — drain relocation, new shower rough-in, supply line rerouting —
      require a permit through the City of Anacortes Building Department. Structural changes
      like removing a wall or installing an LVL beam header also require review. Cosmetic-only
      work (replacing a toilet without moving the drain, swapping a vanity, tiling over sound
      substrate) typically does not trigger a permit. TopVolk Construction is a WA Licensed
      Contractor and handles permit applications, coordinates required rough-in and final
      inspections, and keeps the project on schedule around the city's review timeline, which
      runs 2–4 weeks for standard residential bathroom work.

  - q: "Can you convert a cast-iron tub to a curbless walk-in shower in an older Anacortes home?"
    a: |
      Yes — and it's among the most common requests in the downtown bungalows where an
      original 5-foot cast-iron tub occupies most of a narrow bathroom. The conversion starts
      with a subfloor inspection: if moisture has compromised the joists under the tub, that
      gets addressed with sister joists and a PT subfloor layer before the new drain rough-in
      goes in. The shower gets Schluter Kerdi membrane on all wet surfaces, large-format
      porcelain tile, a linear drain flush with the floor, and a frameless glass panel.
      Plumbing rough-in and the curbless threshold both require a City of Anacortes permit,
      so add 2–3 weeks for plan review before construction begins.

  - q: "How long does a bathroom remodel take in Anacortes?"
    a: |
      A tile-and-fixture refresh without structural or plumbing changes: 2–3 weeks of active
      work. A full gut-rebuild with new shower, drain rough-in, vanity, exhaust fan, and final
      punch list: 4–6 weeks from demo to final inspection. Permit review through the City of
      Anacortes Building Department adds 2–4 weeks before construction can start. Materials
      lead time matters too — Kohler and Moen fixtures, semi-custom vanities, and
      special-order tile can take 2–4 weeks from order. Vladislav builds a detailed project
      schedule at kickoff, and deadline penalties for overruns are written into the contract.

