title: "Anacortes Bathroom Remodel — Island Moisture Stops Here"

intro: |
  Fidalgo Island sits at the intersection of Padilla Bay, Guemes Channel, and the broader
  Salish Sea — that marine exposure means bathroom moisture problems here aren't seasonal.
  They're constant. The neighborhoods along 4th and 7th streets in downtown Anacortes,
  within a few blocks of the Cap Sante Marina, carry a dense run of Craftsman bungalows
  built between 1905 and 1935. Pull the tile in any of those bathrooms and there's a fair
  chance you find no real waterproofing layer at all — just drywall or lime plaster sitting
  directly behind decades of Pacific moisture. Up the hill in the Skyline neighborhood, the
  problem shifts: 1960s and 70s homes with original fiberglass tub surrounds that have been
  flexing at the seams for fifty years, and exhaust fans that haven't moved adequate air in
  decades. Schluter Kerdi membrane, proper CFM exhaust sizing, and drain rough-in work that
  passes City of Anacortes inspection — that's what a bathroom remodel on this island actually
  requires. TopVolk Construction has completed 100+ projects across the Seattle metro since
  2017, and Vladislav Volkov runs every project personally, no sales staff in between.

localContext: |
  Anacortes falls entirely within the 98221 zip code, but housing age and condition vary
  sharply across the island. The downtown grid — roughly Commercial Avenue east to the water,
  4th Street south to 12th — holds the oldest stock, mostly Craftsman and American Foursquare
  construction from before World War II. These homes have post-and-pier foundations with no
  vapor barrier in the crawlspace, which means ground moisture works its way up into floor
  systems year-round. In a bathroom, that translates directly to soft subfloor under the tile,
  failed grout joints, and eventual joist damage if moisture isn't interrupted at the DriCore
  or pressure-treated (PT) subfloor layer before tile goes down. The City of Anacortes
  Building Department handles all structural and plumbing permits within city limits —
  separate from Skagit County's permit office, which covers unincorporated island parcels near
  Deception Pass and Heart Lake Road. Plan review for a standard bathroom remodel with
  plumbing changes runs 2–4 weeks through the city. Homes on the northern hillside, built
  through the 1980s and 90s along Skyline Way, are newer but typically have builder-grade
  fixtures and dated fiberglass surrounds that are well past their service life in this
  climate.

commonProblems:
  - title: "Waterproofing Membrane Failures Behind Tile — The Root Cause in Most Anacortes Bathrooms"
    description: |
      Marine air off Padilla Bay keeps relative humidity elevated for months at a stretch, and
      standard cement board installed without a membrane is not enough in that environment.
      Moisture vapor migrates through grout joints and tile edges, saturating the substrate
      until the adhesion layer fails — tile starts to hollow-sound, then pops loose at the
      wall base. The correct fix is Schluter Kerdi sheet membrane bonded to the substrate
      before tile sets, or RedGard liquid membrane rolled on in two coats across every surface
      in the wet zone. In the older downtown bungalows near Cap Sante Marina, sand-mortar tile
      beds fully separated from the floor and walls are common — those require complete demo
      before any new membrane work can begin. A properly waterproofed shower surround with
      large-format porcelain tile typically costs $4,500–$9,000 in a standard Anacortes
      bathroom, depending on shower dimensions, niche count, and bench configuration.

  - title: "Cast-Iron Drain Stacks and Galvanized Supply Lines in Pre-War Downtown Homes"
    description: |
      The Craftsman bungalows along 6th and 8th streets in downtown Anacortes are now
      85–100 years old. Cast-iron drain stacks corrode at the floor collar over time, and
      galvanized hot and cold supply lines have typically scaled down to well below their
      original diameter — enough to kill water pressure at the shower valve. Rerouting a
      3-inch cast-iron stack to accommodate a new shower drain position requires cutting into
      the subfloor and opening the joist bay below. Damaged joists get sistered with new
      Douglas-fir framing; the drain stub gets rebuilt in PVC before the subfloor is
      reinstalled. A rough-in inspection through the City of Anacortes Building Department is
      required at this stage before anything gets closed up — scheduling that inspection adds
      5–10 business days to the timeline. Full plumbing rough-in and drain rerouting on a
      pre-war Anacortes bathroom typically adds $2,500–$5,000 to the overall remodel budget.

  - title: "Inadequate Exhaust Ventilation — Where Mold Actually Starts in an Island Climate"
    description: |
      Original exhaust fans in Skyline-area homes from the 1960s and 70s were rated at 50 CFM
      or less. After fifty years on Fidalgo Island's foggy coast, the ductwork has partially
      collapsed and actual airflow is closer to 20 CFM — sometimes less. Washington State
      Energy Code and ASHRAE 62.2 both require ventilation sized to the room: a standard
      60-square-foot bathroom needs at least 50 CFM continuous; a master bath with a walk-in
      shower should run 110 CFM or higher. Mold rings at ceiling light fixtures and persistent
      grout discoloration on north-facing walls are the visible symptoms of chronic
      under-ventilation. Broan and Panasonic both make humidity-sensing fans with quiet
      operation that pair cleanly with a Moen or Kohler shower system during a remodel.
      Ventilation fan replacement with a properly sealed duct run costs $350–$800 installed,
      depending on whether the duct exits through an exterior wall or through the attic.
      TopVolk is a WA Licensed Contractor and coordinates fan permits with the City of
      Anacortes when the scope requires it.

  - title: "Walk-In Shower Conversion — Layout Changes That Trigger Permits in Anacortes"
    description: |
      Converting a tub-shower combo to a curbless walk-in shower means relocating the drain —
      and relocating the drain means a plumbing permit through the City of Anacortes Building
      Department, with plan review running 2–3 weeks for residential plumbing work. Removing
      a knee wall to gain floor space often involves a load-bearing partition in these older
      homes, which adds a structural review and potentially an LVL beam header or added joist
      blocking to maintain floor integrity. Full scope on a walk-in conversion includes permit
      coordination, Schluter Kerdi waterproofing on all wet surfaces, large-format porcelain
      floor tile with a linear drain for the curbless threshold, and a niche or bench built
      into the shower wall. Walk-in shower conversions in 98221 homes typically run
      $8,500–$18,000 depending on size, fixture grade, and whether the drain needs to move
      more than 12 inches from its current position. Vladislav provides a line-item quote
      before any work begins — call (206) 591-1096 to schedule a site visit.

  - title: "What a Full Bathroom Remodel Actually Costs in a 98221 Anacortes Home"
    description: |
      A cosmetic refresh — new vanity, Kohler toilet, Moen faucets, and fresh tile over sound
      substrate — runs $7,000–$14,000 in most Anacortes bathrooms. A full gut-rebuild with a
      curbless shower, heated floor, new exhaust fan, and quartz countertop lands between
      $18,000–$35,000 depending on square footage and what turns up behind the walls. Water
      damage remediation, joist sistering, and drain rerouting add real cost — especially
      common in the downtown bungalows built before 1940. Vladislav builds line-item quotes
      with no vague ranges, materials and labor separated. The contract includes deadline
      penalty clauses if the project runs over schedule without a documented reason — written
      into the agreement, not a verbal commitment. Timeline: a full gut-rebuild typically runs
      4–6 weeks from demo day to final inspection, assuming permits are pulled before
      demolition begins and materials are staged on site.

