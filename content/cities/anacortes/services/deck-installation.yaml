  - q: "Does TopVolk handle the building permit for a deck in Anacortes?"
    a: >-
      Yes. TopVolk prepares the construction documents, submits to Anacortes Community
      Development, and schedules all required inspections — footing, framing rough-in, and
      final. For properties on unincorporated Fidalgo Island outside city limits, the submission
      goes to Skagit County's permit office instead, which runs on a slightly different timeline.
      Plan review for a standard residential deck in Anacortes typically takes 2–4 weeks. All
      permits pull under our WA Licensed Contractor status. Homeowners who skip permits often
      surface the problem at resale — lenders flag unpermitted structures, and retroactive
      approval consistently costs more than doing it right the first time.

  - q: "Can you build a freestanding deck instead of attaching it to the house?"
    a: >-
      Yes, and for some older Anacortes homes it's the stronger structural choice. If the rim
      joist on a 1940s or 1950s home in Old Town or the South End is compromised, a freestanding
      deck skips the ledger attachment entirely — no flashing detail, no rot risk at the house
      connection point. Freestanding decks require additional post footings on the house-side
      beam (roughly every 6–8 feet) rather than a single ledger line, which adds footing cost
      modestly but simplifies the structural connection. Anacortes Community Development reviews
      freestanding and attached decks under the same permit process — same plan requirements,
      same footing and framing inspections.

  - q: "How long does composite decking last in Anacortes's marine climate?"
    a: >-
      Trex Transcend and TimberTech Azek both carry 25-year limited warranties covering fading,
      staining, and structural defects in the deck boards themselves. In Anacortes's environment —
      salt air, 37-plus inches of annual rain, and an extended moss-growing season from October
      through May — composite deck boards outlast pressure-treated wood decking by 10–15 years
      on exposed surfaces. The framing underneath (posts, beams, joists) is PT lumber and typically
      lasts 20–30 years with adequate drainage and proper ground-contact ratings. What warranties
      don't cover: impact damage, standing water caused by inadequate slope, and substructure
      problems from deferred maintenance. Every TopVolk deck is designed with a minimum
      1/8-inch-per-foot pitch away from the house to keep water moving off the surface.

