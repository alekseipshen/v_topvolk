title: "Anacortes Deck Installation — Salt Air and Skagit Rain"

intro: |
  Cap Sante overlook draws people to Anacortes from all over Skagit County — the view toward
  Guemes Channel, the ferries moving between Fidalgo Island and the San Juans, the marina
  sitting below. Homeowners on the hillside above that overlook have been trying to capture
  that same angle from their own backyard for decades, and most of them eventually land on
  adding a deck. The trouble is that Anacortes isn't just another rainy PNW town — it's a
  coastal marine environment with salt-laden southwest wind and an extended wet season that
  runs October through May. A deck built without proper through-flashing at the ledger board,
  without ground-contact PT lumber rated UC4B at the posts, and without a deliberate drainage
  plan isn't going to hold up 20 years here. Composite decking — specifically Trex Transcend
  or TimberTech Azek — handles salt air and moss pressure better than cedar in exposed coastal
  locations, and for Washington Park-area properties with north-facing decks, that material
  choice often determines whether the deck looks decent in year ten or starts cupping and
  greening by year four. TopVolk Construction has completed 100+ projects across the Seattle
  metro and Skagit County since 2023; owner Vladislav Volkov handles the estimate personally —
  no sales rep, no middleman.

localContext: |
  Anacortes (98221) covers Fidalgo Island's main residential grid — Old Town near downtown,
  the Skyline area west toward Cap Sante Marina, and South End neighborhoods that spread toward
  March Point. The housing stock spans roughly 80 years: 1920s and 1930s Craftsman bungalows
  near downtown where original Douglas-fir rim joists sometimes need sistering before a ledger
  board can be properly attached, to mid-century ramblers throughout Skyline and the South End
  built in the 1950s–1970s with shallow overhangs and aging framing. Newer construction on the
  hillsides above Washington Park is better framed but still needs composite or well-sealed wood
  to handle the west-facing salt and moss exposure that's consistent throughout 98221. Properties
  outside city limits on Fidalgo Island fall under Skagit County's permit authority rather than
  the City of Anacortes Community Development department — that distinction matters for plan
  submission timelines and inspection scheduling. North-facing deck surfaces in this zip code
  develop surface algae within two to three seasons without an annual cleaning plan, which is
  one more reason composite decking makes practical sense on most exposed residential builds here.

commonProblems:
  - title: "Ledger Board Rot Where Decks Meet Older Anacortes Homes"
    description: >-
      In Old Town and the South End, original rim joists from the 1930s through 1960s are often
      Douglas-fir that has absorbed decades of Pacific Northwest moisture — and any deck ledger
      attached without proper through-flashing creates a slow rot trap behind it. Water migrates
      behind the ledger, sits against the rim joist, and can silently compromise the structural
      connection over five to eight years without visible signs at the deck surface. The correct
      fix starts with removing the existing ledger (or evaluating before a new one goes in),
      inspecting and sistering the rim joist where needed, then installing metal step flashing
      or a self-adhering membrane like Vycor Plus before re-attaching with code-compliant lag
      screws into the band joist. Anacortes Community Development requires a framing inspection
      at rough-in, so the flashing detail gets reviewed before any sheathing covers it. Depending
      on how much rim joist work is needed, this adds $800–$1,500 to a standard ledger attachment
      scope — far cheaper than replacing a rotted rim joist five years after the deck is finished.

  - title: "Cedar vs. Composite — Getting the Material Choice Right for Fidalgo Island"
    description: >-
      Cedar is a Pacific Northwest staple and performs well on covered structures or south-facing
      exposures with regular maintenance. In Anacortes, the combination of salt air and north-facing
      shade creates conditions where cedar goes mossy, gray, and soft faster than in inland Puget
      Sound towns like Kirkland or Sammamish. Trex Transcend and TimberTech Azek are the two
      composite lines most frequently specified for exposed coastal applications in Skagit County —
      both carry a 25-year warranty against fading and staining, and neither absorbs water the way
      open wood grain does. Cost difference is real: composite decking installed runs roughly
      $40–$65 per square foot, versus $25–$40 for cedar, depending on complexity and guardrail
      system. Over a 25-year horizon in Anacortes's marine climate, the maintenance savings on
      composite typically close that gap by year ten. For covered decks or pergola-shaded surfaces,
      cedar remains a reasonable choice — but it needs annual sealing and consistent debris clearing
      to stay ahead of the moss cycle.

  - title: "Deck Permits in Anacortes — What the City Actually Requires"
    description: >-
      Any deck over 200 square feet or more than 30 inches above grade in Anacortes requires a
      building permit from the City's Community Development department. Submitted plans need to
      show post layout, beam sizing (LVL beams are often required for spans over 10 feet), ledger
      attachment detail, guardrail height (36-inch minimum above the deck surface), and footing
      design. Frost line in Skagit County is 12 inches per code, but inspectors routinely expect
      footings at 18 inches given the high soil moisture on Fidalgo Island — deeper on sloped
      sites. Post footings require poured concrete with PT post bases or direct-embed PT lumber
      at UC4B ground-contact rating. TopVolk Construction is a WA Licensed Contractor and handles
      plan preparation and permit submission for Anacortes projects; typical plan review runs 2–4
      weeks for a standard residential deck. Properties on unincorporated Fidalgo Island outside
      city limits go through Skagit County's permit office, which has a different submission
      process and a slightly longer review window.

  - title: "What a Deck Actually Costs in Anacortes — and What Moves the Number"
    description: >-
      A straightforward attached deck — pressure-treated framing, composite decking, standard
      aluminum railing system, under 300 square feet — typically runs $22,000–$35,000 in the
      current Anacortes market, including permit and footings. A cedar deck with painted wood
      guardrails on similar scope pulls that down to $16,000–$26,000. What pushes cost up:
      sloped sites requiring longer posts or additional blocking, second-story configurations
      with waterproofing under the deck (add $15–$25 per square foot for a Trex RainEscape
      trough system or torch-down membrane), custom stair layouts with multiple landings, and
      steel cable railing instead of aluminum balusters. Freestanding decks cost more than
      attached ones due to additional post footings on the house-side beam. TopVolk provides
      written line-item quotes after measuring the site — no ranges that expand at contract
      signing, and a missed-deadline penalty clause is written into every contract.

  - title: "Second-Story Deck Drainage Over Conditioned Space"
    description: >-
      Several hillside properties above Washington Park and along the Cap Sante ridge have
      second-story decks sitting directly over finished rooms or attached garages. Standard
      decking with gaps between boards drains fine on a ground-level structure — on an elevated
      deck above living space, that same gap system deposits water into the ceiling below every
      rain event. The fix is either a between-joist trough system like Trex RainEscape, installed
      before decking goes down, or a torch-down membrane sloped to perimeter drains. Both options
      add $15–$25 per square foot to the project. Joist hanger selection also changes in this
      application — standard zinc-plated joist hangers corrode in trapped wet cavities, so
      hot-dipped galvanized or stainless hardware is required throughout. This scope requires
      careful sequencing: drainage installation has to happen immediately after joist framing
      and before any decking is laid, which means it needs to be designed into the project from
      the start, not added after framing is complete.

