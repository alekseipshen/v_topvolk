title: "Kelso Power Washing — Moss, Siding & Driveway Cleanup"

answer: "Soft-wash cleaning strips moss, algae, and grime off roofs, siding, and driveways in Kelso, WA — booked in 3-5 days, house washes from $250."

intro: |
  Soft-wash cleaning strips moss, algae, and grime off roofs, siding, and driveways in Kelso, Washington, and most jobs get booked within three to five days of the first call, with a single-story house wash running $250 to $450 depending on square footage. The Cowlitz River sits close enough to town that fog rolls in most mornings between October and May, and that extra moisture is exactly what feeds the black algae streaking down north-facing roof slopes in West Kelso and the moss carpeting the cedar decks up on Rose Valley Road. Rust bleeding from an old Frigidaire or GE window air conditioner mounted in a bedroom sash is another common call — the streak runs straight down the vinyl siding and doesn't come off with a garden hose. A soft-wash rig with the right surfactant mix handles all of it in one visit, without blasting paint or gouging old T1-11 siding.

localContext: |
  Kelso's housing stock splits pretty cleanly by elevation and era. Down in the flats near 98626 — West Kelso, downtown, and the blocks around Catlin Street — you'll find early-1900s bungalows and post-war cottages with original cedar siding or T1-11 panels that have gone gray and mossy under decades of fir needle drop. Up the hill in Rose Valley and around Mount Solo, the housing runs newer: 1950s-70s ranch homes with aluminum or vinyl siding, composition shingle roofs, and attached carports where oil drips have stained the concrete black. Just across the Cowlitz River in the 98632 zip (Longview), the same builder patterns repeat, and plenty of Kelso customers share a driveway wall or fence line with a Longview neighbor. Kelso doesn't require a permit for exterior pressure washing, but Washington Department of Ecology rules do apply — wash water carrying detergent or bleach residue can't be allowed to run straight into a storm drain that empties toward the Cowlitz, so containment or diversion to a vegetated area is standard practice on every job here.

commonProblems:
  - title: "Moss and Black Algae on North-Facing Roofs and Decks"
    description: "North-facing roof slopes in West Kelso and along Allen Street stay shaded most of the day once the fir and maple canopy fills in, and that shade keeps the composition shingles damp long enough for moss spores to root in the granule layer. Left alone, moss rhizoids work under the shingle tabs and lift them off the deck, which is how a $6,000 roof turns into a leak two winters early. A low-pressure soft-wash application with a sodium hypochlorite solution kills the moss and algae without stripping granules the way a straight pressure wash would. Most single-story roof treatments run $300-$500 and include a zinc sulfate rinse that slows regrowth for 12-18 months. Decks under the same tree cover get the same algae film on the boards — usually cleared in the same visit."
  - title: "Cedar Deck Prep Before Staining or Sealing"
    description: "Cedar decks up in Rose Valley and Mount Solo take a beating every wet season, and by the time March rolls around most have a slick gray patina of algae and tannin bleed sitting on top of the grain. Staining or sealing over that film — with Cabot, Ready Seal, or any oil-based product — just traps the moisture underneath and the finish peels within a year. The fix is a deck-specific soft wash using a surface cleaner attachment and a wood brightener rinse (oxalic acid based) that pulls the gray back out and reopens the grain so stain actually penetrates. Full deck prep runs $200-$400 depending on square footage and railing detail, and it needs to happen 48-72 hours before any stain crew shows up so the wood has time to dry."
  - title: "Hardie Siding and Stucco Cleaning Before Repaint"
    description: "Hardie siding and older stucco jobs around the Three Rivers Mall area and south Kelso pick up a dull chalky film from paint oxidation, plus streaking below every window AC unit and dryer vent — GE, Whirlpool, Kenmore, and Amana units are the most common brands mounted on these houses, and the condensate drip or vent moisture feeds mold growth on the siding right below the unit. A repaint crew won't get proper adhesion over that residue, so most painters here require a documented wash within two weeks of primer. No City of Kelso permit is needed for the wash itself, but if a ladder or lift has to sit in the right-of-way on a narrow street like Catlin, a quick call to the city public works line avoids a parking complaint. Siding washes typically run $250-$450 for an average single-story home."
  - title: "Driveway and Walkway Oil and Tire Stains"
    description: "Driveway and walkway cleaning is priced by square footage more than anything else, and oil stains change the math. A plain rinse-and-scrub with a surface cleaner attachment runs about $0.15-$0.25 per square foot, so a standard two-car driveway lands around $150-$250. Old motor oil or transmission fluid stains need a degreaser pretreatment before the pressure washer ever touches the concrete, and stubborn spots sometimes need a second pass with a turbo nozzle — that pushes the job closer to $300. Concrete with visible efflorescence (the white mineral haze common on driveways poured without a proper vapor barrier) cleans up in the same visit but tends to come back within a year since it's a moisture issue from below, not a surface one. Every quote here is a flat number after a look at the driveway, not a phone-guess range."
  - title: "Fence, Patio, and Paver Maintenance Before Re-Staining"
    description: "Fence lines on the PNW's typical 3-5 year stain cycle need a wash before every re-coat, and cedar or PT lumber fencing around Kelso yards usually has moss creeping up from the ground contact posts by year two. Skipping the wash and just spraying new stain over old mildew locks the mildew under the finish, and it bleeds back through within a season. A soft wash with a mildewcide-treated cleaner handles fence panels and gates in a few hours for most residential lots, running $150-$300 depending on linear footage and gate count. Pavers and patios get the same organic buildup between the joints — a pressure wash followed by joint sand replacement keeps them from going slick with algae again by the following spring. Garage doors and entry doors near the same patio areas are usually washed in the same stop at no extra trip charge."

faq:
  - q: "How fast can you get to Kelso for Power Washing?"
    a: "I-5 runs right through Kelso, so most crews can be on-site within a day or two of a call, sometimes same-day if the schedule has an opening that morning — Longview, Castle Rock, and Kalama jobs often get grouped on the same route when the timing lines up, which keeps travel costs off the estimate. Most homes here have driveway or curb access wide enough for the trailer-mounted rig, though tight lots down in West Kelso and along Catlin Street sometimes need hose extensions to reach a fenced backyard or a deck tucked behind a carport. A standard single-story house wash takes about 2-4 hours start to finish, longer if the roof gets treated too. Call to check the current opening and lock in a same-week estimate before the next rain system rolls through."
  - q: "What does house washing cost in Kelso?"
    a: "A full single-story house wash in Kelso typically runs $250-$450, a two-car driveway $150-$300, and a fence or deck job $150-$400 depending on linear footage or square footage — roof soft-washing is quoted separately since it uses a different chemical dwell time and a lift or ladder setup. Pricing mostly comes down to square footage, story count, and how much oil, moss, or mildew buildup needs pretreatment before the main wash gets applied. A house with heavy moss on the north side or years of built-up oxidation on the siding takes longer than a house that got washed last summer. Every estimate is a flat number given after a walk around the property, not a phone-guess range — ask for a free on-site quote before anything gets booked."
  - q: "Do you need a permit for power washing in Kelso?"
    a: "The City of Kelso doesn't require a permit for exterior pressure washing on a single-family home, so there's no plan review or inspection step to schedule around before the crew shows up. The rule that actually matters here comes from the Washington Department of Ecology's wash-water discharge guidance — detergent or bleach runoff can't be allowed to flow straight into a storm drain that feeds the Cowlitz River, so containment mats, wet-vacuum recovery, or diversion to a lawn area gets used on every residential job. Rental properties in Cowlitz County occasionally need a wash documented as part of a code compliance case with the county; that paperwork and before/after photos are provided on request at no extra charge."
  - q: "Do you use bleach, and is it safe for plants and pets?"
    a: "Moss and algae on roofs get a diluted sodium hypochlorite soft-wash solution applied at low pressure through a downstreamer injector, never a direct high-pressure blast, since granule loss from a straight power wash voids most asphalt shingle warranties. Siding, decks, and driveways each get a surfactant-based cleaner matched to the material — an oxalic acid wood brightener for cedar, a degreaser pretreatment for concrete oil stains, and a milder mix for painted Hardie board — applied and then rinsed at controlled pressure with a turbo nozzle or surface cleaner attachment depending on the surface. Plants, grass, and garden beds get pre-soaked and rinsed afterward to prevent any chemical burn from overspray drift."
  - q: "How long does a power washing job last before it needs to be redone?"
    a: "Roof and siding soft-wash treatments typically hold back moss and algae regrowth for 12-18 months in Cowlitz County's wet climate, while driveway or deck cleaning generally needs a repeat pass once a year given the rain totals between October and May. There's no painted-on coating involved in a soft wash, so there's nothing to peel, crack, or yellow the way a cheap sealant can — the guarantee covers the cleaning result itself, not a permanent surface treatment. Homes with heavy tree cover up in Rose Valley or on Mount Solo tend to need a repeat service closer to the 12-month mark rather than 18, simply because more shade means more moss pressure. A follow-up reminder typically goes out as that window approaches."
  - q: "Do you cover areas near Kelso, and how far out are you booking?"
    a: "Longview, Castle Rock, Kalama, and Woodland all get covered on the same routes as Kelso, and Longview jobs in the 98632 zip are frequently scheduled back-to-back with Kelso addresses given how close the two cities sit across the Cowlitz River from each other. Scheduling typically runs about a week out during the dry summer months and can tighten to just a few days once the fall rain slows outdoor work down for most homeowners. Moss and algae jobs tend to spike right before the wet season hits, so booking early in September beats waiting until the roof is already green. Call to check current availability and get a date on the calendar before the next storm system rolls in."