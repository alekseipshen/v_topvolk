title: "Kelso Insulation — Attic, Crawl Space & Rim Joist Upgrades"

answer: "TopVolk Construction upgrades attic, crawl space, and rim joist insulation in Kelso, WA — owner-led by Vladislav Volkov, 100+ jobs done since 2023."

intro: |
  Attic, crawl space, and rim joist insulation work in Kelso runs through Vladislav Volkov directly — no call center, no commissioned closer walking your basement — and the company has closed out more than 100 projects since 2023 across the I-5 corridor. Kelso's housing stock skews old: mill-town homes off Allen Street and up in Rose Valley were mostly framed in the 1940s through 60s, back when R-11 fiberglass batt passed for a finished attic. That's a third of what current energy code wants to see. Add in the Cowlitz River floodplain running through the lower part of town, and you get a second problem layer — pier-and-post foundations with open, damp crawl spaces sitting under homes near West Kelso and the Three Rivers Mall area. A homeowner near Beacon Hill called in this spring after finding the batt insulation under her floor packed flat and moldy, sitting six inches above standing water, with a Whirlpool water heater rusting at the base from the humidity. That's the kind of job this page is about.

localContext: |
  Most of Kelso proper falls under zip 98626, though homes closer to the Cowlitz River bridge and the county line often share utility accounts and permit questions with Longview's 98632 side. Rose Valley and the hillside streets above downtown carry a mix of 1950s ranch-style homes and 1970s split-levels, many with a half-story knee wall bumping into an unfinished attic — a spot that almost never got insulated right the first time. Down in West Kelso and the flatland blocks near Beacon Hill, older homes sit on pier-and-post foundations built to tolerate periodic flooding, which means crawl spaces with dirt floors, standing moisture, and fiberglass batt that's absorbed water for decades. Kelso Building Department handles permits inside city limits; Cowlitz County Building & Planning takes over for the unincorporated pockets past the city line. Cowlitz PUD runs a weatherization rebate program that covers part of the cost on qualifying attic and crawl space upgrades, which matters in a city where median household income sits under $50,000 and every dollar of the bid counts.

commonProblems:
  - title: "Attic insulation stuck at R-11 or R-19 in 1950s-60s mill homes"
    description: "Pull the access hatch on a typical Rose Valley or Catlin-area attic and you'll find old fiberglass batt laid between the ceiling joists, usually 3 to 6 inches deep — R-11 to R-19 depending on when it went in. Current code target for this climate is R-49. The fix is a blown-in cellulose top-up, either Owens Corning ProPink Fiberglas Blow-In or a dense-pack cellulose fill, laid over the existing batt after air-sealing the top plates and can lights. A straightforward 1,200 sq ft attic runs roughly $1,800 to $3,200 depending on access and whether knob-and-tube wiring needs a licensed electrician to clear first."
  - title: "Crawl space encapsulation on flood-plain lots near West Kelso"
    description: "Homes built low near the Cowlitz River sit on pier-and-post foundations with vented crawl spaces that stay damp nine months out of the year. Fiberglass batt sagging off the subfloor, black mold on the rim joist, and a musty smell coming up through the floor registers are the usual complaints. Ductwork running through that same crawl space corrodes faster too — a Whirlpool or GE water heater tucked under the house can rust out years ahead of schedule when it's sitting in standing moisture. The fix is a proper encapsulation: 6-mil or 10-mil vapor barrier sealed to the foundation walls, rigid foam board against the band joist, and closed-cell spray foam on the rim joist itself to stop air leaks. Jobs like this typically run $3,500 to $7,500 depending on square footage and whether a sump pump gets added."
  - title: "Knee wall gaps in 1.5-story split-levels above Rose Valley"
    description: "Split-level homes built through the 70s and 80s in the hillside neighborhoods above downtown have a knee wall separating the finished bonus room from an unheated attic triangle behind it. That cavity is almost always empty or stuffed with loose, sagging batt that's fallen away from the studs. Rigid foam board cut tight to the stud bays, backed by fiberglass batt or mineral wool, closes the gap and stops the cold-floor complaint in the room below. Insulation-only work like this doesn't usually trigger a Kelso Building Department permit unless it's bundled with electrical or structural changes — TopVolk is a WA Licensed Contractor and pulls permits when the scope calls for it."
  - title: "What insulation upgrades actually cost in Kelso"
    description: "Pricing depends on where the work happens and how bad the starting point is. Attic top-ups with blown-in cellulose run about $1.50 to $2.50 per square foot; crawl space encapsulation with vapor barrier and rigid foam runs $3 to $5 per square foot; closed-cell spray foam on rim joists alone is usually $800 to $1,600 for an average Kelso ranch or split-level. Access, moisture damage, and whether old batt needs to be pulled and hauled out first are the real cost drivers — not the square footage alone. Every quote comes as a line-item number, not a range, and there's a deadline penalty written into the contract if the crew runs long."
  - title: "When old batt insulation needs replacing instead of topping up"
    description: "Fiberglass batt that's been sitting in a wet Kelso crawl space for 20-plus years isn't insulating much of anything — it's holding water and losing R-value by the year. Same goes for attic batt that's been flattened by decades of foot traffic or chewed up by rodents, a common problem in the older mill-town homes near downtown. If batt is compressed under 50% of its rated thickness or shows mold, it comes out and gets replaced rather than covered over. CertainTeed and Rockwool mineral wool batt both hold up better in damp conditions than standard fiberglass and are the go-to swap for crawl spaces on flood-prone lots."

