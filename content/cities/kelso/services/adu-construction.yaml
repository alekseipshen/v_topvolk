    a: "TopVolk covers Kelso alongside Longview, Castle Rock, and other Cowlitz County communities along the I-5 corridor, scheduled around the primary Seattle Metro service area. Free consultations for Cowlitz County lots typically get booked within a week, with site visits grouped to keep travel efficient. Once a contract's signed, expect a permit-ready plan set within 3-4 weeks and construction start shortly after city or county sign-off. Call (206) 591-1096 to check the current schedule and get a free on-site estimate."