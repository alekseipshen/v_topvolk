  - q: "Do I need a permit to replace windows in Kelso?"
    a: "A straight retrofit swap — same size opening, same wall — doesn't need a separate permit through Cowlitz County in most cases, since it's treated as like-for-like replacement. Anything that changes the rough opening, like cutting in an egress window or enlarging a picture window, does require a permit and plan review through the county building department, typically two to three weeks. TopVolk handles the application and schedules the inspection as part of the contract, and Vladislav is a WA Licensed Contractor so paperwork clears without back-and-forth. Unincorporated Cowlitz County near Kelso runs through the same building department, just a different counter."
  - q: "Should I go with vinyl or fiberglass windows for a Kelso house?"
    a: "Vinyl is the right call for most Kelso budgets — Milgard's Tuscany or Style Line series holds up fine in this climate, costs less upfront, and won't rot or need repainting. Fiberglass, like Milgard's Ultra line or a Marvin Infinity unit, costs 20-30% more but expands and contracts less through temperature swings, which matters more toward the Toutle foothills than in town. For homes near I-5, laminated glass in either frame material cuts road noise noticeably — ask for it specifically, since it isn't standard on base packages. Pella and Marvin cost more but make sense when matching original divided-light grilles on an older Craftsman near downtown."
  - q: "How long do replacement windows last in Kelso's climate?"
    a: "Vinyl windows installed correctly, with proper flashing and a good seal, run 20-25 years in Cowlitz County's wet climate before glass seals or hardware need attention. Milgard backs their vinyl units with a lifetime warranty on the frame and a 20-year warranty on the glass seal, transferable once to a new owner. What actually fails first is usually the installation, not the product — bad flashing lets water behind the siding and rots framing around a perfectly good window. TopVolk's labor is covered separately, and any callback for an install issue gets handled directly by Vladislav, not routed through a call center."
