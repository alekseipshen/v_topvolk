title: "Kelso Carpentry — Trim, Built-Ins & Stair Repair"

answer: "TopVolk Construction provides finish and structural carpentry in Kelso, Washington — owner-led, WA Licensed, 100+ projects completed since 2017."

intro: |
  Stair treads that bounce underfoot in a West Kelso rental built before 1950 usually trace back to a stringer that's split near the third step, not the tread itself — and catching that difference is what separates a real carpenter from someone with a nail gun and a truck. Kelso mixes eras block by block: 1920s bungalows down near Allen Street, post-war additions bolted onto older foundations, and 1980s infill climbing the hill toward Beacon Hill and Rose Valley. TopVolk Construction gets calls for split stringers, cedar fascia that rotted out after a wet Cowlitz County winter, and pantry built-ins that need to fit a GE range or a Frigidaire fridge without leaving a half-inch gap at the trim. Vladislav Volkov runs the walk-through himself — no sales rep quoting from a truck, no sub guessing at a casing profile he's never cut before. WA Licensed Contractor, 100+ projects completed since 2017, and every job gets a written quote with line-item pricing before a blade touches wood.

localContext: |
  Zip code 98626 covers most of Kelso, from the flood-plain flats downtown up through the hillside lots in Rose Valley and Beacon Hill, and 98632 next door in Longview shares the same Cowlitz River weather and a lot of the same 1940s-60s housing stock. Homes in West Kelso and along Allen Street tend to run pre-1950, with original fir trim, tongue-and-groove siding, and casing profiles nobody stocks at the Longview big-box stores anymore. Up toward Beacon Hill and Catlin, most of what's on the ground is 1965-1985 ranch and split-level construction — builder-grade doors, stock colonial casing, and mitered corners that were rarely square to begin with. Because Kelso sits close to where the Cowlitz meets the Columbia, older crawlspaces near downtown need a proper vapor barrier before any finish carpentry goes in, or new trim just cups again within a year. Structural carpentry work — stair rebuilds, header replacement, anything load-bearing — runs through the City of Kelso Community Development Department inside city limits, or Cowlitz County Building & Planning out past the city line toward Lexington.

commonProblems:
  - title: "Split Stair Stringers in Pre-War West Kelso Homes"
    description: "A cracked stringer near the third or fourth riser is the most common structural call TopVolk gets from West Kelso's older housing stock, where original Douglas-fir stringers were never sized for decades of settling and moisture. The fix isn't a shim under the tread — it's sistering a new PT lumber or LVL stringer alongside the old one, then resetting the treads and risers so the rise-and-run stays code-consistent top to bottom. Left alone, a split stringer eventually pulls the newel post loose too. Most stair rebuilds run $900-2,400 depending on run length and whether the risers get replaced or just refastened."
  - title: "Cedar Fascia Rot After Wet Cowlitz County Winters"
    description: "Kelso gets soaked from October through May, and north-facing cedar fascia boards on older homes near Rose Valley and Catlin hold moisture long after the rain stops, especially where a gutter's been dripping onto the same board for years. Once the fascia goes soft, the rot usually travels into the rafter tails and soffit blocking behind it. TopVolk typically pulls the rotted run back to solid wood, replaces it with either PT lumber or a Hardie cement-board trim piece that won't take on water the same way, and reflashes the drip edge. Exterior fascia replacement runs roughly $600-1,600 per elevation depending on rafter tail damage."
  - title: "Pantry Built-Ins and Closet Organizers That Skip Permit Review"
    description: "Kitchen pantry builds and closet organizer installs sound cosmetic, but the moment a job involves moving a wall, adding blocking for heavy shelving, or reframing an opening for a Whirlpool or Amana appliance, the City of Kelso Community Development Department wants it on record if it touches structure. TopVolk pulls permits when the scope calls for it and builds semi-custom cabinet boxes sized to the actual appliance — not a stock width that leaves a Samsung fridge sticking out past the counter line. WA Licensed Contractor status means the paperwork is handled before framing starts, not after an inspector flags it."
  - title: "Interior Door and Trim Work Priced Without Line Items"
    description: "A lot of Kelso homeowners get a single lump-sum number for door and trim work with no breakdown of labor versus material, which makes it impossible to know if replacing six interior doors with matching casing should cost $2,800 or $5,500. TopVolk quotes casing, door slabs, hinges, and labor as separate line items, so a homeowner in Beacon Hill matching 1970s colonial profile can see exactly what the router work costs versus the door hardware. Missed deadlines carry a penalty written into the contract itself, not a verbal promise. Most interior door and trim packages land between $250 and $600 per opening."
  - title: "Wainscoting and Beadboard Miters Opening Up Seasonally"
    description: "Beadboard and wainscoting installed with tight miter joints tend to gap open every winter in Kelso because the wood swells and shrinks with the humidity swing between the dry summer and the wet season. Cheap MDF beadboard is the usual culprit — it doesn't move as predictably as solid wood, and caulk alone can't hold a miter that's fighting seasonal movement. TopVolk installs with scarf joints at long runs and back-primes the boards before install, which cuts down on the yearly touch-up. A full wainscoting redo in a standard dining room runs $1,400-3,200, and workmanship on new installs is covered for two years."

faq:
  - q: "How fast can you get to Kelso for Carpentry?"
    a: "Kelso sits right off I-5, and jobs there get scheduled in blocks rather than same-day drop-ins since it's outside the core Seattle Metro service radius. Once a project is booked, most stair, trim, and built-in jobs start within two to three weeks of the estimate. Parking on residential streets in West Kelso and Rose Valley is generally open, which keeps material staging simple. Call (206) 591-1096 to get a date on the calendar."
  - q: "What does trim and stair carpentry cost in Kelso?"
    a: "Interior trim and door work typically runs $250-600 per opening, stair stringer and tread rebuilds run $900-2,400 per run, and full wainscoting installs land between $1,400 and $3,200 depending on room size. Pricing swings mainly on wood species, whether old material needs demo first, and how much structural blocking is involved. Every quote comes as a line-item breakdown, not a single lump number. Schedule a free consultation and get exact pricing before any work is booked."
  - q: "Do I need a permit for a built-in or stair rebuild in Kelso?"
    a: "Anything touching structure — a stringer replacement, a wall opening for a pantry, a header swap — needs to go through the City of Kelso Community Development Department if the property is inside city limits, or Cowlitz County Building & Planning for addresses out past the city line. Straight trim and casing swaps typically don't need a permit. TopVolk is a WA Licensed Contractor and handles the permit application and inspection scheduling as part of the project, not as an add-on fee."
  - q: "Can you match the original casing profile in my old Kelso bungalow?"
    a: "Most pre-1950 homes in West Kelso used a fir casing profile that isn't stocked at any Longview lumber yard anymore, so matching it means running custom knives on a shaper or sourcing a close historical profile and hand-coping the joints. TopVolk brings a profile gauge to the estimate to trace the existing molding before quoting the work. Paint-grade pine is the cheaper route if an exact species match isn't critical to the homeowner."
  - q: "How long will new trim and fascia hold up in Kelso's climate?"
    a: "PT lumber and Hardie cement-board trim on exterior fascia typically outlast painted cedar by a decade or more in a climate that sees close to 45 inches of rain a year. Interior trim and built-ins, properly primed on all sides before install, generally don't need touch-up for years beyond routine caulk maintenance. Workmanship on new carpentry installs carries a two-year warranty. Materials carry their own manufacturer warranty on top of that."
  - q: "Do you cover areas near Kelso, like Longview or Castle Rock?"
    a: "TopVolk takes on carpentry projects around Longview, Castle Rock, Kalama, and Woodland in addition to Kelso proper, since the driving distance between those towns is minor. Scheduling in this corridor usually runs two to four weeks out from the initial estimate, depending on project size. Bundling nearby jobs on the same trip keeps costs down for everyone in the area. Call (206) 591-1096 to check current availability."