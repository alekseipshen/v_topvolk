title: "Kelso HVAC — Heat Pump Conversions Built Into Remodels"

answer: "TopVolk Construction installs heat pump conversions and ductless mini-splits in Kelso, Washington — owner-led, 100+ projects completed since 2023."

intro: |
  A dead Amana furnace in a 1958 rancher near Rose Valley is usually the moment a Kelso homeowner starts asking about heat pumps instead of a straight furnace swap. TopVolk Construction handles that HVAC conversion as part of bigger scopes — additions, detached ADUs, whole-home remodels — where the mechanical system gets rebuilt alongside the walls, not patched as a stand-alone repair call. Vladislav Volkov runs these jobs himself, from the first walkthrough near Tam O'Shanter Park to the final rough-in inspection with the City of Kelso Building Department. Cowlitz County's mill-town housing stock, much of it built before 1960 back when Weyerhaeuser and Longview Fibre ran three shifts, tends to have undersized ductwork and zero return air in back bedrooms, so a Mitsubishi or Daikin mini-split has to be sized to the actual house, not picked off a shelf. Federal IRA heat pump rebates apply here too, and given Kelso's median income, plenty of households near Lexington and Aldercrest qualify for the higher rebate tier. Call (206) 591-1096 for a free on-site estimate with real line-item pricing, not a phone quote.

localContext: |
  Kelso's housing splits pretty cleanly by era. Mill-worker bungalows from the 1900s through the 1940s cluster near downtown and Beacon Hill, post-war ranch homes from the 1950s and 60s fill in Lexington and Aldercrest, and newer construction sits out toward Rose Valley and West Kelso. Zip code 98626 covers nearly all of Kelso, and a good chunk of our conversion work runs right up against the Longview line at 98632, since the two cities share the same housing stock, the same electricians, and often the same crawlspace problems. Older bungalows still wired with knob-and-tube or early two-prong Romex usually need an electrical load calculation before a heat pump goes in — sometimes the panel upgrade costs more than the unit itself. Mechanical permits for furnace and heat pump swaps go through the City of Kelso Building Department on South Pacific Avenue, filed through the PermitTrax portal, with a rough-in inspection scheduled through the city's inspection line before drywall closes anything up. Kelso sits in the Cowlitz River valley, pulling close to 49 inches of rain a year, so ductwork routed through crawlspaces needs a real vapor barrier or you're dealing with mold and a musty mini-split return by year three.

commonProblems:
  - title: "Swapping an old Amana gas furnace for a heat pump without blowing the budget"
    description: "Plenty of Kelso homes still run a 1990s Amana or Kenmore gas furnace paired with a single-stage thermostat and no cooling at all. When that furnace dies mid-winter, the fix TopVolk usually specs is a cold-climate heat pump — something like a Bosch or Mitsubishi unit with a variable-speed compressor and a reversing valve that handles both heating and cooling off the same air handler. The existing duct trunk usually works fine; what changes is the refrigerant line set, the outdoor condenser pad, and sometimes a backup electric heat strip for the rare hard freeze night. Federal IRA rebates through Washington's HEEHRA program can knock $2,000 to $8,000 off the install for income-qualified households, which covers a lot of ground at Kelso's median income. Full conversions typically run $9,000 to $16,000 and take two to three days on site."
  - title: "Heating and cooling a new DADU or bonus room without extending ductwork"
    description: "Backyard DADUs are showing up all over Kelso since WA HB 1337 opened the door to two ADUs per lot, and running new ductwork out to a detached unit is rarely worth the cost. A ductless mini-split — Mitsubishi and Daikin both make cold-climate models rated well below freezing — solves it with a single wall-mounted head, a small line set through the exterior wall, and a condensate pump if there's no gravity drain nearby. Additions built over a garage or a converted bonus room get the same treatment, since tying into the main trunk line usually means the room at the far end never gets enough air anyway. Material and labor for a single-zone mini-split runs about $4,500 to $7,500 installed, more for a multi-zone system feeding two or three rooms off one outdoor condenser."
  - title: "Permits and venting rules for a 95% AFUE furnace swap in Kelso"
    description: "A 95%+ AFUE condensing furnace vents differently than the 80% AFUE unit it replaces — instead of a metal flue up through the roof, it needs PVC sidewall venting with proper clearance from windows and a condensate line running to a neutralizer before it hits the drain. That change alone requires a mechanical permit through the City of Kelso Building Department, filed through the PermitTrax portal, plus a rough-in inspection before the walls close up and a final inspection before the system fires for good. Combustion air intake sizing matters more in tighter, newer construction near Rose Valley than in the drafty 1940s bungalows near downtown. TopVolk pulls the permit, schedules the inspections, and builds the deadline into the contract — miss it, and there's a penalty spelled out up front, not a vague apology."
  - title: "Adding AC to a furnace-only system without overloading the ductwork"
    description: "A lot of Kelso homes built through the 1970s have a gas furnace and nothing else, which was fine until the last few summers got hot enough to matter. Before quoting an AC add-on, TopVolk runs a Manual J load calculation and a static pressure test on the existing trunk and branch ducts — undersized returns are the reason half the AC add-ons in older homes never cool the back bedrooms right. Coil, line set, and a matched outdoor condenser (Amana and Bosch both build reliable mid-range units) typically run $6,500 to $11,000 depending on tonnage and whether the ductwork needs rework first. Most equipment carries a three-year parts warranty when registered within 60 days of install, and TopVolk backs the labor separately in writing — no fine print explaining why it doesn't apply."
  - title: "Hot upstairs, cold downstairs — duct sealing and zoning fixes for older Kelso homes"
    description: "Single-thermostat ranch homes in Aldercrest and Lexington almost always run hot in one room and cold in another, and the cause is usually leaky duct joints, not a failing furnace. A duct blaster test finds the leaks, mastic sealant (not tape) closes them up, and zone dampers split the system into two or three sections so the bonus room over the garage stops fighting the master bedroom for airflow. Pairing that with a Nest or ecobee thermostat adds scheduling and remote sensors that catch temperature swings a single wall stat misses entirely. Sealing and rebalancing a typical 1,600 square foot duct system runs $1,800 to $3,500, and it's worth doing before replacing any equipment — a new furnace pushed through leaky ducts wastes 20-30% of its output before it ever reaches a room. Ducts themselves last 20-25 years if sealed properly."

