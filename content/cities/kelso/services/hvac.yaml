    a: "TopVolk is based in the Seattle Metro area, and Kelso projects run down I-5 as part of larger addition, ADU, or whole-home remodel work rather than same-day HVAC repair calls. Once a scope is set and the contract's signed, on-site work typically starts within two to four weeks, with the mechanical rough-in timed around the City of Kelso's inspection line. Kelso's larger residential lots near Rose Valley and West Kelso make staging equipment easier than a tight Seattle infill site. Call (206) 591-1096 to book a free on-site consultation directly with Vladislav — no dispatcher, no sales rep."
  - q: "What does a heat pump conversion in Kelso cost?"
    a: "A full gas-to-heat-pump conversion in Kelso typically runs $9,000 to $16,000 installed, depending on whether the existing ductwork needs resizing and whether a panel upgrade is needed to handle the new electrical load. Ductless mini-split installs for an ADU or addition run less, usually $4,500 to $7,500 for a single zone. IRA-funded HEEHRA rebates can offset $2,000 to $8,000 of that for income-qualified households, which covers a meaningful share of Kelso's median-income homeowners. TopVolk provides a written, line-item quote after the on-site walkthrough — call (206) 591-1096 for the free estimate."
  - q: "Do I need a permit to install a heat pump or furnace in Kelso?"
    a: "Yes — any furnace, heat pump, or ductwork change in Kelso needs a mechanical permit through the City of Kelso Building Department at 203 South Pacific Avenue, filed through the PermitTrax online portal. Plan review on a straightforward equipment swap usually takes one to two weeks, longer if the job involves new gas line routing or an electrical panel upgrade. TopVolk pulls the permit, coordinates the rough-in and final inspections through the city's inspection request line, and builds the whole timeline into the written contract as a WA Licensed Contractor. Miss the agreed date, and the penalty clause in the contract kicks in — that's not negotiable."
  - q: "Will a ductless mini-split actually keep up during a Kelso cold snap?"
    a: "Cold-climate mini-splits from Mitsubishi and Daikin are rated to maintain full heating output down to 5°F and still produce heat well below that, which covers Cowlitz County's occasional hard freezes without issue. The compressor modulates instead of cycling on and off, so a properly sized single-zone or multi-zone system holds temperature evenly instead of overshooting and dropping off like an older window unit. Backup electric strip heat is rarely necessary on these systems, unlike a straight electric furnace conversion. TopVolk sizes every unit off an actual room-by-room load calculation — call (206) 591-1096 if you want that done before committing to a brand or model."
  - q: "How long will a new furnace or heat pump last in Cowlitz County's climate?"
    a: "A well-installed 95% AFUE furnace or heat pump typically lasts 15-18 years in Cowlitz County, though river valley humidity can shorten coil life on units installed without proper condensate drainage. Manufacturer parts warranties on Amana and Bosch equipment run 10 years when registered within 60 days of install, and TopVolk backs the installation labor separately in the written contract. Corrosion on outdoor condenser coils is the most common early failure here, usually from units set too close to sprinkler spray or ground-level moisture. Regular filter changes and an annual refrigerant check extend that lifespan considerably."
