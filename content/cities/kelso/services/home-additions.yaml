title: "Kelso Home Additions — ADUs, In-Law Suites, Second Stories"

answer: "TopVolk Construction, an owner-led WA Licensed Contractor, plans and builds home additions and ADUs in Kelso, Washington with line-item pricing."

intro: |
  A three-bedroom rancher off Rose Valley Road doesn't grow a fourth bedroom on its own, and that's the call TopVolk Construction gets most from Kelso homeowners — someone's parent is moving in, a grown kid needs a separate door to come and go, or the family just ran out of room. TopVolk Construction has completed 100+ projects since 2023 across the Seattle Metro and takes on a limited number of larger builds farther out, including additions, second stories, and detached ADUs here in Kelso, working directly with owner Vladislav Volkov from the first site measurement through the final inspection with the City of Kelso Building & Planning Division. Lots near West Kelso and up toward North Kelso tend to run narrower than the newer subdivisions closer to Rose Valley, which changes where a DADU can legally sit relative to the property line. A mother-in-law suite built out here usually gets a modest kitchenette — a Frigidaire range, an Amana microwave, maybe a stacked Kenmore washer-dryer — sized to the budget and the space, not a showroom kitchen. Most addition projects run $30,000 to $200,000+ depending on scope, with a written deadline penalty in the contract if the schedule slips.

localContext: |
  Kelso's building stock skews older and modest — a lot of it dates to the mill-town boom of the 1920s through the 1950s, with smaller footprints and post-and-pier or shallow perimeter foundations that weren't built to carry a second story without help. Homes in the 98626 zip code, which covers the whole city, split roughly between older cottages near downtown and the Cowlitz County Historical Museum, and mid-century ranches out in Rose Valley and North Kelso built during the plywood-mill years. Add a bedroom over an existing crawlspace in one of those older places and the first question is footing capacity — a lot of the original footings were poured for a single story, period. Lower-lying parcels near the Cowlitz River and the Three Rivers Mall corridor sit inside FEMA-mapped flood zones, which means an addition there may need a base flood elevation check before the City of Kelso will stamp the permit. Just across the county line in Longview's 98632 zip, the same rules and the same river geography apply, which is why TopVolk treats the two cities as one job site.

commonProblems:
  - title: "Squeezing a legal DADU onto a narrow Kelso lot"
    description: "Washington's HB 1337 lets any single-family lot in Kelso carry up to two ADUs, but the law doesn't override the city's lot coverage and setback rules, and a lot of West Kelso and North Kelso parcels only run 50 to 60 feet wide. That leaves a narrow buildable envelope once you subtract the required side-yard setback and the 24-foot height limit on a detached ADU. TopVolk starts every DADU quote with an actual survey and a lot coverage calculation, not a guess, because a 600-square-foot detached unit that looks fine on paper can blow past FAR limits once the existing garage and shed get counted. A separate utility connection for water and sewer adds $8,000 to $15,000 depending on where the existing lateral sits. Most DADU builds in Kelso run $130,000 to $180,000 and take four to six months including City of Kelso permit review."
  - title: "Old footings weren't poured for a second story"
    description: "A lot of Kelso's 1920s-40s cottages near downtown sit on shallow perimeter footings and post-and-pier crawlspace foundations, built for one story of Douglas-fir framing and not much else. Stack a second story on top without checking the numbers and you're asking a 60-year-old footing to carry loads it was never designed for. TopVolk brings in a structural engineer to run the calculations before any lumber gets ordered, and the fix usually means new concrete footings poured alongside the old ones, an LVL beam or PSL post carrying the new floor load down to grade, and sistered joists where the existing rim joist has softened from decades of crawlspace moisture. Expect $15,000 to $35,000 in foundation and framing work on top of the addition itself, and expect the City of Kelso to require an engineer's stamp on the plan set before rough-in inspection gets scheduled."
  - title: "Building near the river means a flood-zone check first"
    description: "Parcels close to the Cowlitz River and the low ground around the Three Rivers Mall corridor sit inside FEMA base flood elevation zones, and the City of Kelso Building & Planning Division checks that before anything else gets reviewed. An addition on one of those lots may need an elevated foundation, an engineered fill pad, or flood vents in the crawlspace to clear plan review — skip that step and the permit gets bounced back, adding weeks to the timeline. TopVolk pulls the FEMA flood map and elevation certificate during the free consultation, before drafting starts, so the design accounts for it from day one instead of getting redesigned mid-permit. Standard plan review at Kelso City Hall runs 3 to 5 weeks for most additions; anything touching flood-zone compliance or requiring an engineer's stamp tends to run closer to 6 to 8. TopVolk is a WA Licensed Contractor and handles the whole permit application directly."
  - title: "What actually drives the price of an addition in Kelso"
    description: "Median household income in Kelso runs lower than the Seattle side of the state, and most homeowners here are adding one room or a modest in-law suite, not a luxury wing — that shows up in the numbers. Home additions typically run $150 to $250 per square foot once you count foundation work, roofing tie-in, and finish materials, which puts a 400-square-foot addition around $60,000 to $100,000 depending on whether it needs a full bath. Kitchen and bath count moves the price more than square footage does: a mother-in-law suite with its own kitchenette — a Frigidaire range, GE dishwasher, Kenmore fridge — and a walk-in shower runs higher per square foot than a simple bedroom-and-closet addition with no plumbing. TopVolk quotes every job line by line — lumber, labor, permits, fixtures — with a written deadline penalty in the contract, so the number in the estimate is the number on the invoice."
  - title: "Matching old siding and keeping the addition dry through Cowlitz County winters"
    description: "Cowlitz County gets soaked from October through May, and a lot of Kelso's older cottages are still wearing original cedar siding that's weathered gray and started cupping at the butt joints. Tie a new addition into that wall and mismatched siding sticks out fast, so TopVolk typically switches the whole elevation to Hardie cement-board siding — it doesn't rot, it holds paint better than cedar, and it stands up to freeze-thaw swings in the foothills toward Toutle and Mount St. Helens. Inside, the addition needs its own insulation package: R-49 in the ceiling, a proper vapor barrier in the crawlspace, and pressure-treated lumber anywhere framing sits near grade, since ground-contact rot is the most common callback on additions built here. For heat, a Mitsubishi mini-split head usually gives the new space its own zone without touching the old ductwork, adding roughly $3,500 to $5,500 to the project."

faq:
  - q: "How fast can you get to Kelso for Home Additions?"
    a: "Kelso sits right off I-5 about two and a half hours south of the Seattle core, so this isn't a same-day repair call — it gets scheduled around the size of the project instead. Street parking on the older, narrower lots around West Kelso and downtown is tight enough that materials usually get staged in the driveway or off a trailer rather than blocking the road. Vladislav blocks out a full day for the initial site walk-through and measurements, then times follow-up visits around framing, rough-in inspection, and the final walkthrough. For additions and ADU builds in the $30,000 to $200,000+ range, call (206) 591-1096 to get a date on the calendar."
  - q: "What does a home addition or ADU cost in Kelso?"
    a: "Home additions in Kelso typically run $150 to $250 a square foot, and a detached ADU built under HB 1337 usually lands between $130,000 and $180,000 depending on finishes and utility hookups. What moves the number: foundation type, whether the addition includes a kitchen or bath, roofline complexity where it ties into the existing house, and site access for equipment. A simple bedroom addition with no plumbing costs less per square foot than a mother-in-law suite with its own kitchenette and walk-in shower. TopVolk provides a free on-site consultation and a line-item quote — lumber, labor, permits, fixtures spelled out — so there's no vague range in the contract, just a number."
  - q: "What's the permit process for an addition in Kelso?"
    a: "Additions and ADUs in Kelso go through the City of Kelso Community Development Department's Building & Planning Division at City Hall, not Cowlitz County — Kelso is incorporated and runs its own permit counter. Standard plan review typically takes 3 to 5 weeks; projects needing a structural engineer's stamp or flood-zone elevation review usually run 6 to 8 weeks. TopVolk pulls the property's zoning, setback, and flood-map data during the free consultation and prepares the full permit packet — site plan, structural details, energy code compliance — before submitting. As a WA Licensed Contractor, TopVolk handles the application and every inspection, from footing to final, directly with the city."
  - q: "Can a new mini-split or the existing furnace heat the addition?"
    a: "Tying a bedroom or in-law suite into an old forced-air system usually means resizing ductwork and rebalancing the whole house, which gets expensive fast on an older Kelso furnace. Most additions here get their own Mitsubishi mini-split head instead — it's a separate zone, no ductwork to extend, and it handles both heating and cooling for Cowlitz County's humid summers. For a mother-in-law suite with its own kitchenette, a Rinnai tankless unit often replaces relying on the main water heater, since running a long branch line to a detached ADU loses too much pressure and heat. MEP coordination — mechanical, electrical, plumbing — gets mapped out during design, not improvised mid-build."
  - q: "How well will an addition hold up in Kelso's rain and river-valley damp?"
    a: "Cowlitz County gets heavy rain from October through May and enough humidity in summer to grow moss on north-facing siding within a couple of years if the wrong material goes up. TopVolk builds additions with Hardie cement-board siding or CertainTeed roofing rated for the exposure, pressure-treated lumber anywhere framing sits near grade, and a proper vapor barrier in the crawlspace to keep ground moisture out of the floor joists. Workmanship is covered under warranty, and the contract includes a written deadline penalty if the schedule slips — a commitment on paper, not a sales promise. Expect 25-plus years out of the siding and roofing before it needs attention again."
  - q: "Do you build additions outside Kelso, like Longview or Castle Rock?"
    a: "Yes — Longview, Castle Rock, Kalama, and Woodland all fall on the same trip down I-5, and most of Cowlitz County shares the same river geography and flood-zone considerations as Kelso. TopVolk's core service area is King, Snohomish, Pierce, and Kitsap counties, but project-based additions and ADU builds worth $30,000 or more get scheduled farther out, including here — same owner-led process, same line-item quote, no separate sales rep for the outlying jobs. Scheduling typically runs 2 to 4 weeks out for a first site visit, longer during peak spring and summer construction season. Call (206) 591-1096 or ask for a free consultation to get on the calendar."