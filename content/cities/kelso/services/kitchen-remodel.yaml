title: "Kelso Kitchen Remodel — Real Costs, No Guesswork"

answer: "TopVolk Construction runs project-based kitchen remodels in Kelso, Washington — line-item quotes, owner-run jobs, 100+ projects since 2017."

intro: |
  A 60-amp fuse panel wedged behind the water heater still runs plenty of houses in West Kelso, and it's usually the first thing that stalls a kitchen remodel once a homeowner asks for a Whirlpool electric range instead of the old gas cooktop from decades back. TopVolk Construction runs kitchen remodels here as project-based work — full scope, permits pulled, appliances set — typically $30,000 to $65,000 depending on cabinet grade and whether a wall comes down. Vladislav Volkov, the owner, walks every Kelso job himself; there's no sales rep quoting numbers he then has to explain to a crew. Kelso's kitchens tend to fall into two camps: narrow galley layouts near downtown and Rose Valley built when the mills still ran three shifts, and wider ranch kitchens out toward the Highlands and Lexington built in the 1960s and 70s. Both need the same basics done right — panel capacity, ventilation, and cabinets that don't come from a clearance aisle. A missed deadline costs TopVolk money, not the homeowner — that penalty is written into the contract before the first stud gets pulled.

localContext: |
  Most of Kelso's older housing stock sits in the flats near downtown and along the Cowlitz River, zip code 98626, in mill-worker cottages built between the 1930s and 1950s — small kitchens, single 15-amp circuits, and galvanized supply lines that don't love being tied into a new dishwasher line. Head up the hill toward Rose Valley Heights or out past the Three Rivers Mall toward 98632, where the Longview line blurs right through that corridor, and the housing skews newer — 1960s-70s ranch and split-level construction with more square footage but the same builder-grade oak cabinets and single-bulb ceiling fixtures. Permits for a Kelso kitchen remodel go through the City of Kelso Building Division, not Cowlitz County — plan review on a standard remodel with an electrical panel upgrade usually runs 2-4 weeks. The Cowlitz River valley holds humidity longer than the hill neighborhoods, so crawlspace vapor barrier condition matters more here than most homeowners realize before a contractor pulls the kick plate off the base cabinets and finds soft subfloor underneath.

commonProblems:
  - title: "Galley Kitchens Boxed In by a Load-Bearing Wall"
    description: "Downtown Kelso and the older Rose Valley blocks are full of 1950s ranch kitchens boxed off from the dining room by a load-bearing wall carrying the ceiling joists above. Homeowners want that wall gone for an open layout, but it takes a structural read first — a doubled 2x10 header isn't enough once you're spanning 12-14 feet. TopVolk sizes an LVL beam, sets a PSL post at the end bearing point, and ties everything down with Simpson Strong-Tie hardware instead of guessing at joist hangers from a big-box bin. Wall removal with beam and post typically runs $4,500-$9,000 depending on span and whether plumbing or wiring has to be rerouted through the old wall cavity, and that part of the job usually takes 5-8 working days including the City of Kelso structural permit review."
  - title: "A 100-Amp Panel That Can't Carry a New Range and Dishwasher Together"
    description: "Homes in the Highlands and Lexington built in the 1960s and 70s still run on original 100A service, and some of the oldest downtown cottages still have 60A fuse panels. Adding a GE or Whirlpool electric range, a Frigidaire dishwasher, and a microwave hood on dedicated circuits pushes past what an old panel can safely carry, especially with an electric water heater already on the same service. TopVolk brings in a licensed electrician sub to upgrade to a 200A panel, sizes new circuits to IRC requirements, and pulls the electrical permit alongside the building permit rather than after the fact. Panel upgrades run roughly $3,500-$6,000 depending on how far the service line runs from the meter, and it's the one line item that shows up on almost every 1960s-70s Kelso remodel budget."
  - title: "Builder-Grade Oak Cabinets and the Rough-In Inspection Sequence"
    description: "Kelso kitchens built between 1965 and 1980 almost all shipped with the same builder-grade oak cabinets and laminate counters, and by now the boxes have usually racked out of square from decades of humidity swings off the Cowlitz River. Replacing them means choosing between IKEA cabinet boxes, budget-friendly and fine for a starter remodel, and semi-custom cabinet lines that hold up better under daily full-extension drawer use. Either way, cabinets don't go in until rough electrical and plumbing pass inspection, drywall gets hung, taped, and mudded, and the City of Kelso building inspector signs off on the rough-in. TopVolk runs a blue tape walkthrough before the final punch list so nothing gets buttoned up behind drywall that still needs a fix. Cabinet-only budgets on a Kelso remodel usually land between $8,000 and $18,000 depending on box quality and layout changes."
  - title: "What Actually Moves the Number on a Kelso Kitchen Quote"
    description: "Full kitchen remodels in Kelso typically land between $28,000 and $65,000, lower than the same scope runs in King County mostly because labor and permit fees cost less here — but the drivers are the same everywhere: cabinet grade, countertop material, appliance package, and whether a wall comes down. A kitchen that keeps its footprint and swaps laminate for quartz with new Whirlpool or Frigidaire appliances sits at the low end; one that opens a wall, moves a gas line, and upgrades the panel climbs toward the top. TopVolk writes a line-item quote before any demo starts, not a ballpark range, and the contract includes a penalty TopVolk pays if Vladislav misses the agreed completion date. Call (206) 591-1096 for a free on-site walkthrough and an actual number."
  - title: "How Long Kelso Kitchen Materials Actually Hold Up"
    description: "Laminate countertops fail first at the seam near the sink, where years of standing water lift the substrate — that's usually the tell that a kitchen hasn't been touched since the original build. Quartz doesn't need sealing and shrugs off the humidity that rolls up from the Cowlitz River valley, while granite still needs sealant reapplied every year or two to keep from staining. On the appliance side, GE, Whirlpool, and Amana ranges hold up fine in this climate, but a range hood under 300 CFM leaves grease film and mildew build-up on cabinet faces near the stove faster than homeowners expect during Kelso's damp winters. TopVolk specs range hoods sized to the actual cooktop BTU output, and quartz counters carry a manufacturer warranty that typically runs 10-15 years against staining and cracking under normal use."

faq:
  - q: "How fast can you get to Kelso for Kitchen Remodel?"
    a: "Kelso sits about two and a half hours south of Seattle on I-5, so TopVolk schedules Kelso jobs as full project trips rather than quick drop-ins — this makes sense for project-based kitchen remodels in the $30,000-plus range, not small repair calls. Vladislav drives down for the initial walkthrough himself, measures the kitchen, checks the panel and crawlspace, and gets a line-item quote back within a few days. Once a contract is signed, on-site work typically runs 6-10 weeks depending on scope, with return trips scheduled around subcontractor availability for electrical and plumbing rough-in. Call (206) 591-1096 to set up a free on-site consultation and get a real timeline instead of a guess."
  - q: "What does a kitchen remodel in Kelso cost?"
    a: "A full Kelso kitchen remodel usually runs $28,000 to $65,000, with cabinet grade, countertop material, and appliance package driving most of the swing between a modest refresh and a full open-concept rebuild. Panel upgrades, wall removal with an LVL beam, and gas line relocation add to that number and get called out as separate line items, not folded into a vague estimate. Homeowners keeping GE, Whirlpool, or Frigidaire appliances instead of upgrading to premium brands usually land closer to the lower end of that range. TopVolk provides a free on-site consultation and a written, line-item quote before any contract gets signed — call (206) 591-1096 to schedule one."
  - q: "Do I need a City of Kelso permit for a kitchen remodel?"
    a: "Kitchen remodels that move walls, add circuits, or touch gas lines need a permit through the City of Kelso Building Division, not Cowlitz County — Kelso is incorporated, so county-level review doesn't apply here. Plan review on a standard kitchen remodel with a structural or electrical component usually takes 2-4 weeks, and TopVolk prepares the permit application, structural calculations for any LVL beam, and the electrical permit for panel work as part of the project scope. Inspections happen at rough-in and final, with the City of Kelso inspector signing off before drywall closes up the walls. TopVolk is a WA Licensed Contractor and handles the paperwork directly — no separate permit runner billing extra for it."
  - q: "Do I need a permit to switch my range from electric to gas, or gas to electric?"
    a: "Switching a range from electric to gas, or gas to electric, always needs a permit in Kelso, because it touches either a new gas line and venting or a new dedicated circuit, and both get inspected separately from the general remodel permit. Moving to gas means running new black iron or CSST line to the range location, plus a code-compliant vent hood sized to the BTU output of the new cooktop. Moving to a heavier electric range often means the panel needs a 40-50 amp dedicated circuit, which is often the point where a 100A panel needs the 200A upgrade. TopVolk pulls both permits together so the gas and electrical inspections don't hold up the rest of the schedule."
  - q: "What's the warranty on cabinets and countertops in TopVolk kitchen remodels?"
    a: "Cabinet installation and countertop work carry TopVolk's workmanship warranty, separate from manufacturer coverage on the materials themselves — quartz counters typically carry 10-15 years against staining and cracking, while semi-custom cabinet boxes run 5-10 years depending on the line. Kelso's river-valley humidity is harder on laminate and particleboard than on quartz or plywood-box cabinets, so TopVolk specs moisture-resistant materials near the sink and dishwasher by default rather than as an upsell. Appliances carry their own manufacturer warranty — GE, Whirlpool, and Frigidaire typically run 1-2 years standard, longer on sealed components like compressors. Ask about the written warranty terms during the free consultation."
  - q: "Do you cover cities near Kelso, and how far out is scheduling?"
    a: "TopVolk's core service area is King, Snohomish, Pierce, and Kitsap counties, but Kelso, Longview, and Castle Rock get scheduled as project-based trips for kitchen remodels large enough to justify the drive down I-5. TopVolk has completed 100+ projects since 2017 across the Seattle Metro area, and Kelso jobs get the same line-item quoting and direct owner communication as any King County project. Scheduling windows run 4-8 weeks out depending on the season, with spring and early summer booking fastest. Vladislav handles every consultation and every project himself — no sales staff, no subcontracted project manager passing the job along. Call (206) 591-1096 to check current availability for a Kelso kitchen remodel."