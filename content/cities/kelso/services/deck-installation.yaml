  - q: "How fast can you get to Kelso for Deck Installation?"
    a: "Kelso sits just off I-5, so a site visit usually happens within a few days of your call, whether you're near Three Rivers Mall or up on the Mount Solo hillside. Most decks go from signed contract to final inspection in 3-5 weeks, depending on permit review time with the City of Kelso or Cowlitz County. Access for equipment is rarely an issue on Kelso's residential lots, even on the steeper Rose Valley streets. Call (206) 591-1096 to get a date on the calendar."
  - q: "What does deck installation in Kelso cost?"
    a: "Most ground-level decks run $9,000-$16,000, and second-story decks over a daylight basement run $18,000-$28,000 once you add taller posts, deeper footings, and a full guardrail system. Material choice moves the number the most — composite from Trex or TimberTech costs more upfront than cedar or bare PT decking but needs less upkeep. Stair count, footing count, and any drainage system underneath also factor in. TopVolk gives a line-item quote after a free on-site consultation, not a ballpark range."
  - q: "Do I need a permit for a deck in Kelso, and how long does it take?"
    a: "Yes — any deck attached to the house or more than 30 inches above grade needs a permit through the City of Kelso Community Development Department, or the Cowlitz County Building Department if you're in an unincorporated pocket near Coweeman. Plan review typically takes 2-4 weeks, and the job needs a rough-in inspection for ledger flashing before decking goes down, plus a final inspection for guardrails and stairs. TopVolk pulls the permit and handles both inspections as part of the contract. WA Licensed Contractor, no extra paperwork on your end."
  - q: "Should I go with cedar, composite, or pressure-treated decking?"
    a: "For a budget-friendly build, pressure-treated joists and beams under composite decking boards give you a low-maintenance surface without paying composite prices on the whole structure. Cedar looks good initially but needs refinishing every 2-3 years in Cowlitz County's rain, especially on shaded, north-facing sections prone to moss. Trex and TimberTech composite decking costs more per square foot but skips the annual sealing and resists moisture damage better over a 25-30 year lifespan. We'll walk you through the actual cost difference for your specific deck during the free consultation."
  - q: "What's the warranty on a TopVolk deck in Kelso?"
    a: "Structural work — footings, framing, ledger flashing — is covered under workmanship warranty for the life of the build, separate from manufacturer warranties on decking material, which run 25-30 years for Trex and TimberTech composite products. Ground-contact PT lumber posts and footings poured below the 12-18 inch frost line typically last 25-40 years in this climate without structural issues. What's not covered is normal wear on the decking surface — fading, minor scratching — which is cosmetic, not structural. Any settling or flashing failure within the workmanship period gets fixed at no charge."
