    a: "Yes — TopVolk covers Kelso, Longview, Castle Rock, and the surrounding Cowlitz County area, with the same owner-led process and line-item pricing throughout. Scheduling windows run about 1-2 weeks out for an on-site consultation, faster if there's a specific concern like a soft ledger board or a red-tagged inspection. Vladislav Volkov handles every site visit personally — no sales reps, no subcontracted estimators. Call (206) 591-1096 to check current availability."