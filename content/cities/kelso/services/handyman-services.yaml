title: "Kelso Handyman Services — West Kelso to Rose Valley Repairs"

answer: "One visit fixes fixture, deck, drywall, and punch-list jobs in Kelso, Washington — owner-operator scheduling, most jobs done inside a week."

intro: |
  A Kenmore range hood that stopped venting, three loose deck boards on a Rose Valley walk-out, and a punch list of nail holes left over from a Kelso Heights bathroom remodel — that's a normal Tuesday for owner-operator Vladislav Volkov at TopVolk Construction. Single-visit repair work like this doesn't need a general contractor back on site; it needs someone who shows up with the right anchors, caulk, and a level, and gets it done. Kelso's housing stock runs old — a lot of it traces back to the Long-Bell lumber mill years — so trim doesn't always sit flush and outlets aren't always where current code wants them. West Kelso bungalows near Tam O'Shanter Park generate a lot of weatherstripping calls once the fall rain sets in along the Cowlitz River bottomland. Out near the volcano exhibit by the Cowlitz County Visitor Center off I-5, newer construction still needs smart thermostat installs and deck repairs same as anywhere else. Jobs get scheduled directly with Vladislav — no dispatcher, no subcontractor rotation — and most single-visit work gets closed out inside a week. Call (206) 591-1096 to get on the schedule.

localContext: |
  Kelso's addresses run mostly under zip code 98626, with some Lexington-area properties on the south end bordering 98632 near Longview. West Kelso and the downtown blocks still carry a stock of 1900s-1940s mill-worker cottages, many with plaster walls that crack every time the ground shifts near the river, and wiring nobody's touched since the Truman administration. Rose Valley and Kelso Heights fill in mostly with 1960s-70s ranch homes — single-pane aluminum windows, original Formica counters, and GE or Whirlpool appliances now on their second or third replacement cycle. Newer infill near Allen Street and the Three Rivers area trends toward vinyl siding and standard 2x6 framing, which handles the wet winters noticeably better than the older cedar lap siding still hanging on some downtown blocks. Cowlitz County doesn't require a permit for most handyman-scale work — fixture swaps, deck board replacement, drywall patches — but anything touching structural framing or adding a circuit needs a look from the county building department first.

commonProblems:
  - title: "Punch List Completion After a Kelso Remodel"
    description: "A drywall crew finishes a Kelso Heights kitchen remodel and leaves a list behind: two cabinet pulls not installed, a Whirlpool range hood duct still hanging loose, caulk lines around a new tile backsplash, a missing GFCI outlet cover. That's a punch list, and it doesn't need the original general contractor back on-site to close it out. Vladislav handles these directly, bringing a torque driver, silicone caulk, and matching paint sheen so the touch-ups don't stand out later. A typical punch list run in Kelso costs $250 to $600 depending on item count, and most get knocked out in a single half-day visit. Homeowners near Three Rivers and downtown call these in most often once a remodel finishes behind its original schedule."
  - title: "Drywall Patches That Match Kelso's Older Texture"
    description: "West Kelso's older cottages still carry lath-and-plaster behind newer drywall patches, and matching the surface texture is where most handyman jobs go wrong. A hole from a towel bar pull-out or a doorknob punch-through needs a butterfly patch, two coats of joint compound, and a hand-textured finish matching the orange-peel spray common in 1970s Rose Valley additions. Get the texture wrong and it shows the second afternoon light hits the wall. Small patches run $150 to $350 and dry enough to paint within a day, though a full skim coat after water damage can stretch to two visits. Cowlitz County's damp winters mean ceiling stains near the Coweeman River lowlands usually mean a roof check before drywall gets touched at all."
  - title: "Fixture Swaps Without Triggering a County Permit"
    description: "Swapping a failing kitchen faucet or a running toilet doesn't trigger a Cowlitz County plumbing permit as long as the water lines and drain locations stay put — fixture for fixture, and it's handyman-scale work. That's most of what gets called in around Kelso: a Whirlpool dishwasher supply line corroded through, a wax ring failing on a slab-on-grade ranch in Rose Valley, a kitchen faucet cartridge shot after twenty years of hard water. Move a drain line or add a circuit for a garbage disposal, though, and it needs a permit pulled through the county building department before work starts. Vladislav flags that distinction upfront during the estimate. TopVolk is a WA Licensed Contractor, and straightforward fixture swaps run $200 to $450 parts and labor combined."
  - title: "Deck Boards and Railings Rotting from Valley Rain"
    description: "Cowlitz Valley sees roughly 50 inches of rain a year, and it shows on decks first — the ledger board where the deck meets the house, the joists underneath, and any railing baluster set in end-grain contact with standing water. A deck that looked fine in July can show soft, spongy boards by the following spring near Lexington and the river-bottom lots. Replacing individual pressure-treated boards runs $40 to $70 per board installed; a full re-decking with Trex composite instead of wood costs more upfront but skips the yearly re-staining older cedar decking needs. Railing repair alone typically runs $300 to $700 depending on how many baluster connections need new hardware. Vladislav writes a firm price into the estimate before starting — no open-ended time-and-materials billing on repair work."
  - title: "Weatherstripping, Smart Thermostats, and Aging Furnaces"
    description: "Single-pane aluminum windows are still common in Kelso's 1960s-70s ranch stock, and the door sweep and weatherstrip gasket around exterior doors usually wear out well before the window itself needs replacing. Fresh weatherstripping on a standard door runs about $80 to $150 installed and cuts noticeable drafts before the wet season sets in around October. It pairs well with a smart thermostat or video doorbell install, since both jobs use the same ladder and the same half-day window. A smart thermostat mounted correctly extends the service life of an aging Amana or Frigidaire furnace by keeping the cycling consistent instead of short-cycling. Weatherstripping typically needs replacing every 5 to 8 years in this climate, sooner on south and west-facing doors that take direct rain."

