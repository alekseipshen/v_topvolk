  - q: "What does entry door installation in Kelso cost?"
    a: "A straight fiberglass entry door swap in an existing opening runs $1,800-$3,200 installed, including the Therma-Tru slab, new threshold, and flashing — the range depends mostly on hardware grade and whether the jamb needs rebuilding from rot. Garage doors run $1,800-$3,200 for a standard insulated double door, and a patio slider or French door conversion with reframing lands between $4,500 and $14,000 depending on scope. TopVolk quotes a line-item number after an on-site look at the opening, not a phone estimate. Call (206) 591-1096 or ask for a free consultation — the quote itself is free."
  - q: "Do I need a permit for door installation in Kelso?"
    a: "A like-for-like door swap in the same rough opening usually doesn't need a permit in Kelso, but widening an opening, adding a header, or converting a slider to a multi-slide door does — that goes through the City of Kelso Building Department on South Pacific Avenue. Homes just outside city limits, like those toward Lexington, fall under Cowlitz County's permit process instead. TopVolk is a WA Licensed Contractor and pulls whichever permit applies, handles inspection scheduling, and builds the plan review timeline — usually a week or two for a residential door opening change — into the project schedule up front."
  - q: "Which is better for a Kelso entry door — fiberglass or solid wood?"
    a: "Fiberglass wins for most Kelso entries — a Therma-Tru slab doesn't swell, rot, or need refinishing the way solid wood does after a few Cowlitz County winters, and it takes paint or a wood-grain finish just fine for homes that want the look. Solid wood from Simpson Door still makes sense on covered porches or historic-style entries where the door's protected from direct rain. Either way, the sill pan flashing and jamb sealant matter more for long-term durability than which slab material gets picked. Ask about both options during the on-site walk-through — call (206) 591-1096 to schedule one."
  - q: "What's the warranty on a new door installed in Kelso?"
    a: "Therma-Tru and Milgard both carry manufacturer warranties on the door unit itself — typically limited lifetime on fiberglass slabs and 10-20 years on glass and hardware, depending on the product line. TopVolk backs the installation labor separately, and if a deadline slips on a scheduled Cowlitz County project, that penalty is written into the contract, not just promised verbally. Expect a properly flashed and installed exterior door to last 20-30 years in this climate before hardware or weatherstripping needs attention. Interior doors typically outlast the house's next remodel."
