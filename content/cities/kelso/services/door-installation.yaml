title: "Kelso Door Installation — Entry, Patio & Garage Doors"

answer: "TopVolk installs entry, patio, and garage doors in Kelso, Washington — most swaps close in a day, WA Licensed Contractor, 100+ projects since 2017."

intro: |
  A single-pane aluminum slider from the 1970s doesn't hold up long against a Cowlitz County winter — the track pits, the glass fogs between panes, and cold air leaks through the frame no matter how much foam tape gets jammed into the gap. TopVolk swaps those out for insulated Milgard vinyl sliders and Therma-Tru fiberglass entry units across Kelso, from the hillside tract homes on Beacon Hill to the flatter lots near Tam O'Shanter Park. A straightforward entry door replacement — same rough opening, new fiberglass slab — closes out in four to six hours once the old unit's pulled. Jobs that involve reframing, like widening an opening for a set of French doors, run one to two days depending on whether the header needs to be upsized. Vladislav Volkov runs every job himself, no sales rep walking the site before a sub shows up to do the actual work, and TopVolk's logged 100+ projects since 2017 across the Seattle Metro and lower Columbia corridor. Call (206) 591-1096 for a quote with line-item pricing, not a range.

localContext: |
  Most of Kelso's housing stock in 98626 dates to two build waves: pre-1960 bungalows down near the river flats, and the tract ranch homes that went up on the hillsides — Aldercrest, Beacon Hill, Columbia Heights — through the 1960s, '70s, and '80s. Those ranch-era houses almost always shipped with builder-grade steel entry doors and single-track aluminum sliders that were never rated for the amount of rain this valley sees. Cowlitz County averages over 45 inches a year, and the fog that settles where the Cowlitz and Coweeman Rivers meet keeps wood jambs damp longer than they'd like. A straight door swap in an existing rough opening usually doesn't trigger a permit, but altering the opening — widening it for a multi-slide patio door or adding a header for a garage door upgrade — needs one through the City of Kelso Building Department on South Pacific Avenue. For homes just outside city limits, out toward Lexington or the 98632 side near Longview, that permit runs through Cowlitz County instead. TopVolk pulls whichever one applies before work starts.

commonProblems:
  - title: "Rotted sill and missing flashing behind old entry doors"
    description: "Pull the trim off a 30-year-old steel entry door in Beacon Hill or Aldercrest and there's a decent chance the pan flashing under the sill was never installed — a lot of production-built ranch homes from that era just caulked the sill and called it done. Water gets behind the jamb, the king stud rots, and eventually the whole opening needs rebuilding, not just the door. TopVolk pulls the old unit, checks the rough opening for rot back to solid framing, and sets a Therma-Tru fiberglass slab with a sloped sill pan and self-adhered flashing tape up the jambs before the brickmold goes back on. A straight swap with sound framing runs about four hours and $1,800-$2,800 installed. If the jamb's rotted and framing needs rebuilding, add a day and $600-$1,200."
  - title: "Interior door swing and casing mismatches during a remodel"
    description: "Kitchen and bath remodels in Kelso's older homes almost always turn up a door that swings the wrong way once cabinets or a vanity move — a hinge side that now blocks a walkway, or casing that doesn't match the new baseboard profile. TopVolk rehangs the door on the opposite jamb, cuts a new mortise for the hinges and strike plate, and replaces the casing to match trim elsewhere in the house. Solid-core doors from Simpson Door hold up better than the hollow slabs builders used through the '70s and '80s tract-home boom, especially on bedroom and bathroom doors that see daily use. Per-door pricing for a swing reversal with new casing runs $350-$650 depending on whether the jamb needs to be reset. Most remodel-driven door work gets scheduled the same crew day as drywall and finish carpentry, so it doesn't add time to the project."
  - title: "Aluminum patio sliders too drafty for a Cowlitz County winter"
    description: "A lot of the ranch homes in Aldercrest and Columbia Heights still have the original aluminum-frame slider that shipped with the house in the 1970s — single-pane glass, a track pitted from decades of rain, and a lock that barely catches anymore. Swapping it for a Milgard vinyl slider or a Pella multi-slide door usually means widening the rough opening, which means a new LVL header sized to the span and jack studs to carry it. That's a permit job through the City of Kelso Building Department, not a same-day swap. Budget $4,500-$7,500 for a like-for-like vinyl slider replacement, and closer to $9,000-$14,000 for a full French door or multi-slide conversion with new framing, flashing, and exterior trim. Plan review and inspection add roughly a week to the schedule on top of two to three days of actual construction."
  - title: "Garage door panels that aren't insulated for this climate"
    description: "Plenty of Kelso garages still have the uninsulated steel panel door that came with the house — fine in July, miserable in a January windstorm coming off the Columbia River Gorge. Swapping to a Clopay insulated door with a polystyrene or polyurethane core (look for an R-value of 12 or higher) cuts the draft and quiets the door down considerably, especially if the garage backs up to a bedroom. The job includes new rollers, hinges, and usually a torsion spring sized to the new door's weight — reusing an old spring rated for a lighter door is a common shortcut that fails within a year. Installed cost runs $1,800-$3,200 for a standard 16-foot double door depending on panel style and window inserts, and the swap takes about half a day including disposal of the old door and tracks."
  - title: "Drafty thresholds and outdated hardware driving up the power bill"
    description: "Older thresholds compress and crack over time, and once the sweep on the bottom of a door stops making contact with the threshold, conditioned air leaks out and rain wicks in under the slab — a common complaint on north-facing entries that don't get much sun to dry out between storms. TopVolk resets the threshold, installs a new adjustable sweep and compression weatherstripping around the full jamb, and checks the strike plate alignment while the door's off its hinges. A lot of customers add a Schlage Encode or August smart lock at the same time since the door's already apart — no extra labor charge if it's done during the same visit. Weatherstripping and threshold work runs $250-$500 per door; adding a smart lock deadbolt is another $220-$320 installed. Expect this kind of maintenance every 8-12 years on a door that gets daily use."

