title: "Kelso Bathroom Remodel — Cowlitz River Homes Done Right"

answer: "TopVolk Construction remodels bathrooms in Kelso, WA — owner-led by Vladislav Volkov, 100+ projects since 2023, call (206) 591-1096."

intro: |
  Pull the surround off a bathtub in a Hilltop rancher and you'll often find black staining creeping up the studs — not because the house is falling apart, but because nobody ever ran the exhaust duct through the roof or tied a real waterproofing membrane into the drain flange. That's the bathroom remodel story in Kelso more than anywhere: the Cowlitz and Columbia rivers keep humidity high year-round, and a lot of the housing stock near Rose Valley and West Kelso was built fast during past growth cycles without much thought for moisture control. A GE bath fan rated for the room's square footage and a Schluter Kerdi membrane behind the tile fix that problem for good instead of papering over it with a new vanity. Vladislav Volkov runs every job himself — no dispatcher, no rotating sub crew, no upsell pitch halfway through demo. WA Licensed Contractor, 100+ bathroom and remodel projects completed since 2023, and a deadline penalty written directly into the contract before anyone picks up a hammer.

localContext: |
  Kelso's housing runs older than people expect for a city its size. Downtown and the Old Kelso Hill area still hold homes from the early 1900s lumber-boom years, many with cast-iron drain stacks and galvanized supply lines that were never meant to handle a modern walk-in shower's water volume. Out toward Aldercrest and Mt Pleasant, most bathrooms date to the 1970s-80s tract wave — pink tile, fiberglass tub-shower combos, single 50-CFM fans that can't keep up with a hot shower on a wet November morning. Both zip codes we work in this pocket of Cowlitz County, 98626 for Kelso proper and 98632 next door in Longview, sit close to the river confluence, which means crawlspaces stay damp and vapor barrier condition matters as much as the finish work upstairs. Any bathroom remodel that touches plumbing, electrical, or moves a wall goes through the City of Kelso Building Department for plan review and inspection under the IRC — we pull that paperwork and schedule rough-in and final inspection as part of the job, not as a separate headache for the homeowner.

commonProblems:
  - title: "Worn-Out 1970s-80s Tract Bathrooms in Rose Valley and Mt Pleasant"
    description: "A lot of Kelso's housing stock got its bathrooms once, in the 1970s or 80s, and never touched again — fiberglass tub-shower units, particleboard vanities swelling at the base, and a single builder-grade light fixture over the mirror. The fiberglass surrounds crack at the corners over time and let water behind the wall, which is when the subfloor starts to soften near the toilet flange. We tear out down to the studs, swap in a GE or Broan exhaust fan sized correctly for the room, and rebuild with a Kohler or Moen fixture package that fits a working-class budget without looking like it. A gut-and-rebuild on a room this size usually runs 3 to 4 weeks and lands in the $15,000-$22,000 range depending on tile selection."
  - title: "Moisture Damage Behind Tile From Cowlitz County Humidity"
    description: "Kelso sits at the meeting point of the Cowlitz and Columbia rivers, and that proximity to water keeps indoor humidity higher than most of Washington outside the coast. Old thin-set and cracked grout let shower water track behind the tile, and without a real waterproofing membrane it eventually reaches the framing and blocking around the tub. We pull everything to bare studs when this shows up, treat the area, and install Schluter Kerdi or RedGard liquid membrane before any new tile goes down — that's the difference between a shower that lasts 20 years and one that fails again in five. On a full surround this adds roughly $2,000-$3,500 to the job but it's non-negotiable in a house this close to two rivers."
  - title: "Craftsman-Era Cast-Iron Stacks Blocking Walk-In Shower Conversions"
    description: "The bungalows up on Old Kelso Hill date back to the lumber-boom years, and a good number still run on the original cast-iron drain stack — heavy, prone to scaling on the inside, and almost never positioned where a modern curbless shower needs the drain to sit. Converting a cramped tub-shower into a walk-in with a proper curb or curbless pan usually means rerouting a section of that stack and adding a new joist hanger or sistering a floor joist where the old tub drain cut through framing. That work requires a plumbing permit and plan review through the City of Kelso Building Department before demo starts, and we handle that filing as part of the estimate. A layout reconfiguration like this typically adds 1-2 weeks to the schedule over a like-for-like replacement."
  - title: "What Actually Drives Bathroom Remodel Cost in Kelso"
    description: "Homeowners usually assume tile choice drives the price, but the real cost swings come from whether plumbing or walls move. A like-for-like refresh — new vanity, new tub-shower, new floor — runs $12,000-$18,000 and takes about 3 weeks. Reconfiguring the layout, relocating a drain, or converting to a curbless shower with a bench and tiled niche pushes the number to $20,000-$35,000 and adds real time for permit review and rough-in inspection. Large-format porcelain costs more per square foot than standard tile but cuts down on grout lines and long-term maintenance. Every quote from TopVolk is a line-item breakdown, not a range pulled out of thin air, and the deadline written into the contract carries a real penalty if we miss it."
  - title: "Ventilation, ADA Retrofits, and How Long a Remodel Actually Lasts"
    description: "A bathroom fan undersized for the room is the number one reason mold comes back within a year of a remodel — Kelso's river-valley humidity doesn't forgive a cheap 50-CFM unit in a room that needs 80-110 CFM. We size the exhaust fan to the square footage and duct it straight through the roof or sidewall, not into an attic where the moisture just relocates. For aging homeowners in Aldercrest and South Kelso, ADA retrofits — comfort-height toilets, blocking behind the wall for future grab bars, curbless shower entries — add modest cost now and save a second remodel later. Properly waterproofed tile and a right-sized fan should give 20-plus years before another full gut is needed; grout sealing every 1-2 years stretches that further."

faq:
  - q: "How fast can you get to Kelso for a bathroom remodel?"
    a: "Kelso sits right off I-5, so scheduling isn't the bottleneck — getting a firm start date after the estimate is. Vladislav does the on-site walkthrough himself, usually within a week of a call, and most jobs start within 2-4 weeks of signing once tile and fixtures are ordered. Parking and material staging are easy on most Kelso lots, which keeps demo days moving. Call (206) 591-1096 to get on the schedule or ask about a free consultation."
  - q: "What does a full bathroom remodel cost in Kelso?"
    a: "A like-for-like remodel — same footprint, new tub-shower, vanity, and floor — typically runs $12,000-$18,000 and takes about 3 weeks. Moving plumbing or converting to a curbless walk-in shower with a tiled niche and bench pushes cost to $20,000-$35,000 and adds time for permit review. Tile selection, whether you go quartz or standard porcelain on the vanity top, and fixture brand all move the number too. Every estimate comes as a line-item quote, and the first consultation is free."
  - q: "Do I need a permit to remodel my bathroom in Kelso?"
    a: "If the job moves plumbing, adds electrical circuits, or changes the room's layout, yes — that goes through the City of Kelso Building Department for plan review under the IRC, with rough-in and final inspection before the room is signed off. A straight fixture swap with no layout change sometimes skips full plan review, but we confirm that with the AHJ before demo either way. TopVolk is a WA Licensed Contractor and we file the paperwork as part of the job, not as an add-on fee."
  - q: "Curbless shower or standard walk-in with a curb — which makes sense for my bathroom?"
    a: "Curbless showers need more subfloor work — usually a recessed pan or a DriCore subfloor buildup to get the slope right — but they're easier for aging homeowners and look cleaner with large-format porcelain running floor to wall. A standard curb is cheaper and faster since it doesn't touch the framing as much. We walk both options with actual tile samples and a Schluter Kerdi drain layout during the free consultation so you're deciding on real product, not a sketch."
  - q: "What's the warranty on a bathroom remodel, and how long does the work actually last?"
    a: "Workmanship is covered for one year, and manufacturer warranties on fixtures — Kohler, Moen, GE ventilation fans — apply on top of that per the manufacturer's terms. A properly membraned shower with Schluter Kerdi or RedGard behind the tile should run 20-plus years before it needs another gut job, well beyond what a builder-grade fiberglass surround ever manages. Grout sealing every year or two and keeping the exhaust fan running 20 minutes post-shower are the two things that actually extend that lifespan."
  - q: "Do you cover areas near Kelso, like Longview or Castle Rock?"
    a: "Yes — Longview (98632) is basically next door and Castle Rock isn't far up I-5, so both fall inside the same service trip as Kelso. Scheduling works the same way: free on-site consultation with Vladislav, line-item quote within a few days, and a start date locked into the contract with a deadline penalty attached. Call (206) 591-1096 to check current availability for your part of Cowlitz County."