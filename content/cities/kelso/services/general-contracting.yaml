commonProblems:
  - title: "Framing, electrical, and plumbing show up on three different days — and nobody scheduled it"
    description: "Homeowners managing their own remodel in Kelso often book an electrician for a Tuesday, a plumber for the following week, and framing whenever the carpenter has an opening — then wonder why the drywall crew is stuck waiting on a rough-in inspection nobody scheduled. A kitchen wall opening needs an LVL beam sized and installed before the electrician can run new circuits for a Samsung range or GE double oven. TopVolk sequences all of it under one schedule: framing first, then rough-in mechanical/electrical/plumbing (MEP) together, then inspection, then finish work. On a typical $60K-$120K kitchen and structural project in Kelso, that coordination alone saves 2-4 weeks compared to homeowners self-managing separate subs."
  - title: "Demo opens a wall and finds rot, old wiring, or a foundation problem nobody bid on"
    description: "Cowlitz County's flood history means a lot of Kelso homes near the river flats have crawlspace moisture damage that doesn't show up until the subfloor gets pulled. A demo crew ripping out a bathroom floor near Allen Street recently found a rim joist rotted from years of trapped moisture with no vapor barrier below — that's a sister joist repair and PT lumber replacement before any tile work can start. Knob-and-tube or early aluminum wiring behind old plaster is another common find in pre-1960s homes. TopVolk writes contingency language into every contract up front instead of surprise change orders, and structural surprises like this typically add $3,000-$9,000 and one to two weeks, not a blown budget."
  - title: "Permit paperwork and inspection scheduling stall the whole project"
    description: "Additions and structural remodels in Kelso require a permit through the City of Kelso building department, or Cowlitz County if the parcel is unincorporated — plan review typically runs 3-6 weeks depending on scope. Homeowners pulling their own permit often miss required setback documentation or submit incomplete framing plans, which bounces the application back and adds weeks. TopVolk handles the permit application, plan review submittal, and inspection scheduling directly with the AHJ (authority having jurisdiction) as part of the contract — rough-in inspection before drywall, final inspection before closeout. WA Licensed Contractor status means the paperwork is handled correctly the first time, not resubmitted twice."
  - title: "Subcontractor bids come back vague, and quality control falls on the homeowner"
    description: "On a $100K+ remodel, a homeowner acting as their own general contractor ends up doing the job nobody wants — checking whether the framer's work passes inspection, whether the tile setter used RedGard or Schluter Kerdi correctly in a wet area, whether the electrician's panel work matches code. TopVolk provides line-item pricing up front, not a vague lump-sum range, so homeowners in Kelso know exactly what framing, MEP rough-in, and finish work cost before signing. Missed deadlines carry a penalty written into the contract itself. Typical full-remodel pricing in Kelso runs $30K-$200K depending on scope, with quality control and punch-list walkthroughs handled by the owner directly, not a site super who's never met the client."
  - title: "Budget-grade finishes need to hold up through Kelso's wet winters, not just look good on day one"
    description: "With Kelso's median household income sitting around $48,000, most remodels here are built around solid, durable materials rather than luxury upgrades — GE or Amana appliances, Hardie cement-board siding instead of cedar that needs repainting every few years, and composite decking instead of untreated wood that rots in the rain. Cowlitz County sees roughly the same heavy October-through-May rainfall as the rest of the I-5 corridor, so exterior work leans on PT lumber for ground contact and proper flashing at every ledger board connection. A well-built addition with R-49 attic insulation and correctly installed vapor barrier in the crawlspace should run 25+ years before major work is needed again. TopVolk stands behind the work with a punch-list walkthrough before final sign-off, not just a handshake."

