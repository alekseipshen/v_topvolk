localContext: |
  Zip code 98626 covers most of Kelso, from the Beacon Hill bluff down through Longview Heights and the flats along the Cowlitz River. Building permits for anything touching a water heater or gas line route through the City of Kelso building department, not Cowlitz County directly. Homes in the Rose Valley and Catlin school areas were mostly built between 1955 and 1985. Douglas-fir framing, slab or crawlspace foundations, and a lot of original galvanized plumbing pipe that was never meant to last this long. Further out toward unincorporated Cowlitz County near Kalama (98625), permitting runs through the county instead. That changes the timeline on anything requiring inspection. Kelso sits near the confluence of the Cowlitz and Columbia Rivers. That means high groundwater tables in crawlspaces most winters. Vapor barrier condition matters almost as much as pipe condition when diagnosing a slow plumbing leak. Washington's seismic strapping requirement on water heaters catches a lot of Kelso homeowners off guard during a straight swap-out. Older units were never strapped to begin with.

commonProblems:
  - title: "Galvanized Supply Lines Rusting From the Inside Out"
    description: "Homes built before 1960 near Beacon Hill and the older blocks off Allen Street almost always shipped with galvanized steel supply lines. By year fifty, the zinc coating inside the pipe is gone. Rust builds up at every threaded joint until the nipple closes down to a pinhole of actual flow. That's why a shower upstairs barely dribbles while the kitchen sink runs fine. Cutting one section open usually tells the story: orange water, flaking scale, sometimes a joint rusted through and seeping into the crawlspace insulation. TopVolk repipes Kelso plumbing systems with PEX-A tubing and brass SharkBite or Uponor fittings, run through the same stud bays. That keeps drywall damage down to inspection ports instead of open walls. A full plumbing repipe on a 1,400 square-foot rancher runs $3,800 to $7,200 depending on fixture count, usually done in three to four working days."
  - title: "Water Heaters That Outlived Their Warranty by a Decade"
    description: "A lot of Kelso houses still have the original Kenmore or GE 40-gallon tank that came with the house in the 90s. Once the anode rod fully dissolves, the steel tank starts corroding from the inside. Sediment settles on the bottom of the tank. That cuts efficiency and makes the burner run longer to hit temperature. Straight swap-outs go in for $1,650 to $2,400 installed, usually a GE or Whirlpool 40- or 50-gallon unit sized to match the existing gas line and vent. Homeowners cutting winter gas bills sometimes upgrade to a Rinnai or Navien tankless unit instead. That almost always means upsizing the gas line to 3/4 inch and adding a dedicated vent — that job runs closer to $3,600 to $4,200. Washington code requires seismic strapping on the tank either way, and a surprising number of older Kelso plumbing installs never had it."
  - title: "Rerouting Plumbing Drain Lines for a Basement Bath or Kitchen Island"
    description: "Adding a bathroom in a daylight basement near the Cowlitz River flats, or moving a kitchen sink out to an island, means the drain has to reach the main stack without losing slope. Minimum slope is 1/4 inch per foot under the IRC as adopted by Washington State. Low ceiling height in older Kelso basements makes that slope hard to hit. An ejector pump, or an air admittance valve (AAV) in place of a full vent stack, usually solves the venting problem legally. Anything touching the drain, waste, or vent system needs a plumbing permit through the City of Kelso building department. Rough-in inspection happens before the wall closes up, and final inspection signs it off. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023, and pulls these permits directly. No homeowner-pulled workaround, no missed inspection window. Timeline runs two to three weeks from permit submittal to rough-in."
  - title: "Fixture Swaps That Cost More Than They Should"
    description: "Pricing on a fixture upgrade swings hard based on what's behind the wall, not just the faucet picked out at the store. A straight Moen or Delta faucet swap on existing supply lines runs $250 to $450 in labor. Move the drain, or change rough-in spacing for a new vanity, and that number climbs fast because the wall has to open up. A full bathroom fixture package — Kohler toilet, Delta or Moen shower valve, new supply stops — typically lands between $1,200 and $3,500 installed, depending on tile work around the valve. Moen's finish and cartridge warranties are transferable, and cover more than most builder-grade fixtures already in Kelso homes from the 80s and 90s. Paying for a quality valve body once, instead of replacing a stripped-out cartridge every two years, is where the real plumbing savings show up."
  - title: "City Water Pressure Spiking Past 80 PSI"
    description: "Parts of Kelso on the lower grade near the river sit on municipal lines that run 85 to 100 psi at certain times of day. That's well above the 80 psi max the plumbing code allows into a house. That pressure shows up as banging pipes, or water hammer, when a washing machine valve snaps shut. It shortens the life of everything downstream — supply hoses on a Whirlpool washer, the icemaker line on a Samsung fridge, even toilet fill valves. A Watts pressure-reducing valve (PRV) installed at the main, right after the shutoff, brings that down to a safe 55-65 psi. That takes the strain off every fixture in the house. Installed cost runs $450 to $850 depending on access to the main line. A PRV typically lasts 10 to 15 years before the diaphragm wears out and needs replacing. Worth checking anytime a fixture starts failing early for no clear reason."

