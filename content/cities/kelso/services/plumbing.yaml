  - q: "Do I need a permit to replace a water heater in Kelso?"
    a: "Yes. Any water heater replacement in Kelso needs a permit through the City of Kelso building department. Washington code requires seismic strapping on the tank, for a straight swap or a brand-new install. TopVolk is a WA Licensed Contractor and pulls the permit directly, schedules the inspection, and handles the paperwork, so nobody's standing in line at City Hall. Turnaround on a straight tank swap permit usually runs three to five business days. Tankless conversions involving a gas line change take longer, because they need a mechanical permit too. If the water heater is one piece of a bigger remodel, it gets folded into the same permit set."
  - q: "Can you convert my old tank water heater to tankless?"
    a: "Rinnai and Navien are the two units TopVolk installs most in Kelso homes. The honest answer depends on your gas line. Most older Kelso houses were plumbed for a 40-gallon tank on a 1/2 inch gas line. A tankless unit needs 3/4 inch to keep up with the burner's higher BTU draw. That means running new gas pipe from the meter, not just swapping the appliance. Add a dedicated vent through the wall or roof, and the full plumbing conversion runs $3,600 to $4,200 installed. It pays off fastest in a house with two teenagers running back-to-back showers."
  - q: "How long will new PEX plumbing last in a Kelso home?"
    a: "PEX-A supply lines are rated for 40 to 50 years, and don't corrode the way original galvanized steel does. That matters in a river-bottom climate where crawlspace humidity runs high most of the year. TopVolk backs repipe work with a workmanship warranty. PEX manufacturers like Uponor back the material itself separately — two different documents, both worth reading. What fails first in Kelso plumbing systems usually isn't the pipe. It's a fitting or a valve that wasn't upgraded during the repipe. Replacing supply stops and shutoffs at the same time as the pipe avoids a second opened wall five years later."
