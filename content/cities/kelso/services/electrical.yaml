  - q: "What does a panel upgrade cost in Kelso?"
    a: "A straightforward 100-to-200-amp panel upgrade in Kelso runs $3,200 to $4,800, while a full knob-and-tube or aluminum wiring rewire on an older bungalow can run $6,000 to $9,000 depending on square footage and how many device boxes need pigtailing. What drives the price is the distance from the meter to the panel, whether the service mast needs relocating, and how many circuits need new AFCI/GFCI breakers to meet code. TopVolk doesn't quote a range over the phone — Vladislav looks at the panel, the meter base, and the crawlspace in person, then sends a line-item quote with permit fees broken out separately. The on-site estimate is free, and there's no obligation to book after."
  - q: "Who handles electrical permits for panel upgrades in Kelso?"
    a: "Electrical permits for panel upgrades and rewires in Kelso go through Washington State Department of Labor & Industries, not a city building counter, since L&I handles electrical inspection for most of Cowlitz County. TopVolk pulls that permit directly, schedules the rough-in inspection once wiring is exposed, and books the final inspection before any drywall or insulation goes back. Typical L&I turnaround for a residential panel permit runs one to two weeks, faster than Seattle's SDCI queue. TopVolk is a WA Licensed Contractor and handles the paperwork so a homeowner isn't stuck calling the state directly. Vladislav attends both inspections in person rather than sending a permit runner."
  - q: "What size circuit does a Tesla or ChargePoint charger actually need?"
    a: "A Tesla Wall Connector, a ChargePoint Home Flex, or a JuiceBox unit typically needs a dedicated 50 or 60-amp circuit run from the panel to the garage, sized with either a NEMA 14-50 outlet or a hardwired connection depending on the charger. If the existing panel is already near its 100-amp limit — common in Rose Valley ranch homes — the charger circuit forces a service upgrade to 200 amps rather than just adding a breaker. TopVolk's electrician calculates the full house load first, including the range, water heater, and any heat pump or mini-split, before sizing the new circuit. That load calculation is what L&I inspectors check before signing off."
  - q: "How long does a panel or wiring upgrade actually last?"
    a: "Breakers, panels, and wiring installed through TopVolk carry the manufacturer's warranty — typically 10 years on a Square D or Eaton panel — plus a one-year labor warranty on the installation itself. In Cowlitz County's wet winters, the parts most likely to fail early are outdoor GFCI outlets and any crawlspace wiring exposed to flood moisture near the river, which is why TopVolk seals crawlspace junction boxes and elevates them above documented flood level. A properly sized 200-amp panel should last 25 to 30 years with no issues. Aluminum wiring pigtailed with AlumiConn connectors is rated for the life of the house once corrected."
