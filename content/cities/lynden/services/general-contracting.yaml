  - q: "What does a full kitchen or bathroom renovation cost in Lynden?"
    a: |
      A primary bathroom renovation — curbless shower with Schluter Kerdi waterproofing membrane, large-format porcelain tile, Kohler or Moen fixtures, new vanity, and recessed dimmer-compatible LED lighting — typically runs $30,000-$58,000 depending on footprint and existing rough-in condition. Full kitchen remodels range $48,000-$120,000, with the high end reflecting structural work, panel upgrades, and semi-custom cabinetry. Those ranges tighten fast once the first site visit happens. Call (206) 591-1096 to schedule the free on-site consultation and get a real number with a real scope attached to it.

  - q: "What's the permit process for a renovation in Lynden, and how long does it take?"
    a: |
      Work within Lynden city limits goes through the City of Lynden Building Department. Structural work, additions, or ADUs require engineered drawings and a plan review cycle — typically four to eight weeks for complex projects depending on current workload. Parcels outside city limits route through Whatcom County PDS with its own submittal requirements and review timeline. TopVolk prepares and submits the full permit package — architectural drawings, structural details, site plans — as part of every project. WA Licensed Contractor status is required to pull permits here, and every TopVolk project is permitted correctly before work begins.

  - q: "Can TopVolk manage an ADU or addition project under WA HB 1337 in Lynden?"
    a: |
      Yes. WA HB 1337, Washington's 2024 statewide ADU law, allows up to two ADUs per single-family lot — meaning a property can carry both an attached ADU (AADU) and a detached ADU (DADU) at the same time. Local lot coverage limits, setbacks, and height restrictions (typically 24 feet for a DADU) still apply, so the site plan drives feasibility before anything else. A DADU in the Lynden area runs $185,000-$290,000 depending on size, finish level, and separate utility connection complexity. TopVolk handles the full scope: permit package, framing, MEP coordination, and finish work through punch list. Call (206) 591-1096 to discuss what your lot can support under current Whatcom County rules.

  - q: "What does a full renovation timeline actually look like from start to finish?"
    a: |
      A primary bathroom renovation — demo through final inspection — runs five to eight weeks from permit issuance. A kitchen remodel with structural work takes eight to twelve weeks. An ADU from permit submission to move-in is typically five to seven months, with a significant portion spent in plan review before a single nail is pulled. The construction sequences are non-negotiable: rough-in before insulation, insulation before drywall, drywall before cabinets and finish work. TopVolk builds every milestone into the project schedule before demo starts, and missed deadlines carry financial penalties written directly into the contract — not mentioned in a sales conversation and forgotten later.

  - q: "Do you cover Ferndale, Bellingham, or other Whatcom County cities near Lynden?"
    a: |
      Projects in Ferndale (98248), Bellingham, Blaine, and surrounding Whatcom County areas are possible when project scope is the right fit. Ferndale runs permits through its own city building department; Bellingham has a separate permit center with its own plan review timeline. Unincorporated areas outside those city limits route through Whatcom County PDS. TopVolk has navigated multiple permit jurisdictions across the Seattle Metro since 2023, and different AHJ requirements don't change how a project gets managed. Call (206) 591-1096 to talk through your location, scope, and timeline.