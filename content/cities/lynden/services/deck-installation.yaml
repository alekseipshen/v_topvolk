title: "Lynden Deck Installation — Built for Whatcom County Rain and Real Winters"

intro: |
  Berthusen Park sits at the north end of Lynden along Berthusen Road, and the
  cedar-lined trails there give you a pretty clear picture of what PNW weather does
  to untreated wood — gray, soft, moss-covered within two seasons. Lynden gets
  around 45 inches of rain annually, and that moisture doesn't let up from October
  through May. A deck built without proper ledger flashing and ground-contact PT
  lumber here won't make it 10 years. The housing along Grover Street and out toward
  Hannegan Road runs from 1960s-era ranchers to newer two-story builds — both present
  different structural attachment challenges when adding outdoor living space. TopVolk
  Construction LLC has completed 100+ projects across the Seattle Metro and surrounding
  counties since 2023; Vladislav Volkov handles every estimate directly, no sales staff
  in between. Call (206) 591-1096 to schedule a free on-site consultation.

localContext: |
  Lynden's older housing stock — the ranchers and split-levels near downtown and around
  the 98264 core — typically has 2x8 or 2x10 rim joists that need careful inspection
  before any ledger board gets bolted on. Rot is common in rim joists that were never
  flashed properly. Newer developments east of town off Benson Road and out toward
  the rural 98264 corridor sit on larger lots with south-facing yards that are
  genuinely well-suited for composite decking and full outdoor build-outs. Whatcom
  County's climate means moss accumulates fast on horizontal surfaces — a north-facing
  pressure-treated deck can look neglected inside three years without the right
  material choice or periodic treatment. Composite options like Trex Transcend or
  TimberTech Azek eliminate most of that upkeep. Post footings here need to reach at
  least 18 inches to clear the frost line — Lynden winters run colder than Seattle's,
  and frost heave on shallow footings is a structural problem that shows up in racked
  posts and failed guardrail connections within a few years.

commonProblems:
  - title: "Ledger Board Rot from Absent or Failed Flashing"
    description: |
      The most common deck failure in Lynden isn't the decking boards — it's the
      ledger board attachment to the house. When flashing isn't installed correctly
      behind the ledger, water migrates into the gap between the ledger and the rim
      joist, stays trapped, and rots both members out over several wet seasons. On
      1960s and 70s homes near Grover and Front Streets, the rim joists are often
      Douglas-fir — solid when built, but vulnerable once moisture gets behind the
      ledger. Fixing it means removing the old ledger, sistering the rim joist if
      it's compromised, installing a proper through-wall flashing assembly with
      Vycor Plus tape at all fastener penetrations, and reattaching with structural
      lag screws into solid framing. Budget $600–$1,200 for ledger repair alone
      before the new deck goes on top. Getting the flashing detail right the first
      time is the whole job — we include a ledger inspection in every deck estimate.

  - title: "Post Footings That Don't Reach Frost Depth"
    description: |
      Lynden sits far enough north that the ground freezes in hard winters, and
      Whatcom County's frost depth requirement is 18 inches minimum for post
      footings. A lot of older decks around town — especially those added by
      previous homeowners without permits — were set on 12-inch tube footings or
      concrete blocks sitting directly on grade. Those move. Within a few seasons
      you get racked posts, out-of-level framing, and guardrail connections that no
      longer meet structural requirements. Replacing them means digging out the old
      footings, boring new 18-inch-deep holes, setting 10-inch Sonotube forms, and
      pouring 3,000 PSI concrete with post standoffs to keep the base above grade.
      Ground-contact PT lumber rated UC4B is required for any post going into or
      near soil. Full footing replacement on a 300 sq ft deck typically runs
      $900–$1,500 depending on site access and how many posts are involved.

  - title: "Pulling Deck Permits Through the City of Lynden Building Department"
    description: |
      Lynden city limits fall under the City of Lynden Building Department — not
      Whatcom County's permit center — and that distinction trips up homeowners and
      some contractors who assume county rules apply. Any deck over 200 square feet
      or elevated more than 30 inches above grade requires a building permit with a
      site plan, framing plan, and ledger attachment detail. Plan review in Lynden
      typically runs 2–4 weeks for a straightforward residential deck. Two
      inspections are required: a footing inspection before concrete is poured, and
      a framing inspection before decking goes down. Skipping the permit isn't worth
      it — it creates title disclosure issues at sale and can require retroactive
      demolition or legalization. TopVolk Construction LLC is a WA Licensed
      Contractor; we prepare the full permit package and coordinate both inspections.
      Permit fees for a typical 300–400 sq ft deck in Lynden run roughly $250–$400.

  - title: "Cedar vs. Composite — Getting the Material Decision Right for 45 Inches of Annual Rain"
    description: |
      Cedar has a solid reputation in the PNW for a reason — it's naturally
      rot-resistant and looks good when new. The problem in Lynden is the
      maintenance load. At 45+ inches of annual rainfall with humidity that stays
      elevated through fall and spring, cedar needs cleaning and re-sealing every
      one to two years to stay stable, resist checking, and avoid the gray
      weathered look. Composite decking — specifically Trex Transcend or TimberTech
      Azek — runs $12–$22 per square foot installed versus $8–$14 for cedar, but
      the 25-year fade and stain warranty changes the math significantly over a
      decade. Moss won't root into composite the way it does in cedar grain. For a
      400 sq ft deck in the 98264 zip, the material cost difference is roughly
      $1,600–$3,200 — and most homeowners who've owned a cedar deck before choose
      composite the second time around.

  - title: "Guardrail Height and Graspable Handrail Requirements at Final Inspection"
    description: |
      Guardrails on decks more than 30 inches above grade must be 36 inches tall
      minimum — that's IRC, and Lynden enforces it at final inspection. Baluster
      spacing can't exceed 4 inches on center (a 4-inch sphere cannot pass through).
      On stairs, a graspable handrail — meaning a rail you can actually wrap your
      hand around, typically 1.25-to-2-inch round or an equivalent graspable
      profile — is required on any stair run with 4 or more risers. A flat 2x6
      cap rail does not qualify as graspable and will fail inspection. Replacing
      non-compliant railings on an existing deck typically costs $35–$65 per linear
      foot for aluminum or composite railing systems. Fiberon Horizon and Trex
      Transcend railing both meet IRC graspable requirements and hold up in Whatcom
      County weather without annual refinishing. Stair stringer rise/run dimensions
      also get checked — maximum 7¾-inch rise, minimum 10-inch run — so we confirm
      those before any stair framing goes up.

faq:
  - q: "How fast can you get to Lynden for a deck estimate?"
    a: |
      Lynden is roughly 90 minutes north of Seattle via I-5 and Highway 539 (Meridian
      Street). Vladislav schedules estimates in Whatcom County on dedicated site visit
      days to make the drive efficient — typically available within 5–10 business days
