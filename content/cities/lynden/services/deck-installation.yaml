      most Lynden deck projects begin within 3–6 weeks of contract signing.

  - q: "What does a new deck installation cost in Lynden?"
    a: |
      A basic 300 sq ft pressure-treated deck in Lynden — single level, standard
      guardrail, one stair run — typically runs $18,000–$26,000 installed with permit
      costs included. Composite decking (Trex Transcend, TimberTech Azek) adds
      $3,000–$6,000 depending on board profile and railing system chosen. Slope,
      second-story ledger complexity, and custom stair configurations push costs
      higher. What you won't get is a vague estimate range — the on-site quote
      includes a line-item breakdown with specific material grades, hardware specs,
      and the permit fee. Call (206) 591-1096 or schedule a free consultation.
      Vladislav Volkov handles every estimate personally, and deadline penalties are
      written into every contract.

  - q: "Does a deck in Lynden need a permit, and how does the process work?"
    a: |
      Yes — any deck over 200 square feet or elevated more than 30 inches above grade
      requires a permit through the City of Lynden Building Department. We handle the
      full application package: site plan, framing plan, ledger attachment detail, and
      footing specification. Plan review typically takes 2–4 weeks. Two inspections
      are required — footing before the concrete pour, framing before decking goes
      down — and we coordinate both so you don't have to manage the schedule.
      TopVolk Construction LLC is a WA Licensed Contractor; the application is
      submitted under our license with required liability insurance in place. Permit
      fees for a standard residential deck in Lynden run approximately $250–$400
      depending on project valuation.

  - q: "What's the difference between Trex and TimberTech, and which holds up better in Whatcom County?"
    a: |
      Both are solid composite choices for Lynden's wet climate — neither rots, checks,
      or needs sealing. The main difference is core construction. Trex Transcend uses
      a full perimeter cap over a wood-fiber core, protecting it from moisture
      absorption at edges and ends. TimberTech Azek is a full PVC board with no wood
      fiber at all, which gives it a slight edge in sustained high-moisture
      environments. Azek runs about 10–15% more per square foot than Trex Transcend
      at current pricing. For most Lynden homeowners, Trex Transcend is the stronger
      value — the 25-year fade and stain warranty covers what matters most in a
      high-rainfall climate. If you're building a second-story deck over living space
      and want maximum moisture resistance in the substructure gap, Azek is worth the
      premium. We install both and can show samples on-site.

  - q: "How long will a new deck last in Lynden's climate?"
    a: |
      Composite decking (Trex, TimberTech) carries 25–30 year manufacturer warranties
      against fade and staining. The structural framing — built with UC4B-rated
      ground-contact PT lumber for posts and proper joist hangers and blocking
      throughout — should hold 30+ years without major work if water isn't pooling
      on horizontal framing members. Cedar decking lasts 15–25 years with consistent
      maintenance; without it, closer to 10 in Whatcom County's climate. The ledger
      connection is typically the first failure point — proper Vycor Plus flashing and
      stainless hardware at the ledger joint extends that significantly. Deadline
      penalties are written into every TopVolk contract, and the same accountability
      goes into how the structural work gets done.

  - q: "Do you build decks in other Whatcom County cities besides Lynden?"
    a: |
      Yes — TopVolk serves Bellingham, Ferndale, Blaine, Birch Bay, and surrounding
      Whatcom County communities in addition to Lynden. The 98264, 98225, and 98230
      zip codes are all part of our regular project territory. Scheduling works the
      same regardless of city: free on-site estimate, written line-item quote, permit
      handled by us, work starts once materials are staged. Call (206) 591-1096 to
