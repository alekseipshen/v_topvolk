  - q: "Do I need a permit for insulation work in Lynden?"
    a: "Standalone attic or crawlspace insulation usually doesn't trigger a permit, but insulation done as part of a larger remodel, addition, or rim joist air sealing job does need to show up on the plan set. Inside city limits that's the City of Lynden Building Department; homes out past the city line toward Line Road or Northwood fall under Whatcom County Planning & Development Services instead. Both offices want the R-value and blower door target noted before they'll sign off, and final inspection usually checks the ACH50 number. TopVolk handles that paperwork directly as part of the project, WA Licensed Contractor, so you're not the one tracking down forms."
  - q: "Blown-in cellulose or fiberglass batt for an old Lynden attic?"
    a: "For a farmhouse attic with irregular joist spacing and old wiring or ductwork already up there, blown-in cellulose (or loose-fill fiberglass from Owens Corning or CertainTeed) gets into gaps a batt can't, which is why it's the more common recommendation for pre-1950s attics here. Batt from CertainTeed or Knauf still makes sense for a straightforward, unobstructed attic or for knee wall cavities where loose-fill would just fall through. Rim joists get closed-cell spray foam instead of either one, since that assembly needs an air seal as much as an R-value. We'll look at your specific attic before recommending one over the other."
  - q: "How long does insulation actually last in Lynden's climate?"
    a: "Fiberglass batt and cellulose don't have a hard expiration date, but expect noticeable settling and reduced performance somewhere around the 15-20 year mark, faster in attics with active roof leaks or rodent activity. Closed-cell spray foam on rim joists and in crawlspaces holds up for the life of the building since it doesn't settle or absorb moisture the way batt does. TopVolk backs installation workmanship, and material manufacturers like Icynene, Owens Corning, and Rockwool carry their own product warranties on top of that. Damage from a roof leak or pest intrusion isn't covered under either warranty — that's a separate repair."
