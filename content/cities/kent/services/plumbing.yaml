title: "Kent Plumbing — Pipe Replacement & Remodel Rough-In"

intro: |
  Green River Trail runs through the valley and past some of Kent's oldest residential
  pockets — post-war ramblers and 1960s ranch-style homes where the original plumbing
  was never touched during kitchen or bath updates.

  City water pressure in parts of 98030 regularly climbs past 80 psi, and that matters: a pressure regulator installed upstream of everything protects supply lines and fixtures like Moen or Kohler valves from chronic stress that shortens their service life. Getting pressure right before pulling permits on a remodel prevents callbacks. Supply sizing also comes into the conversation early — older homes running 3/4-inch galvanized mains restrict flow enough to cause problems with multi-head shower systems or appliances like a Bosch 500 Series dishwasher that rely on steady pressure through the full wash cycle.

localContext: |
  East Hill (98042) was built out mostly between 1965 and 1985 — a stretch covering
  both the tail end of galvanized steel supply lines and the full run of polybutylene
  pipe installation. Both materials are now at or past their reliable service life.
  Valley-floor neighborhoods around 98032 trend older, with homes from the 1950s and
  early 1960s still on original cast-iron stacks. Kent's wet season runs October
  through May — moisture in crawlspaces accelerates corrosion on any galvanized lines
  that weren't replaced during a prior remodel. Cast-iron stacks from that era also
  develop pinhole leaks at horizontal runs where standing water sits between drain
  events — often inside finished walls before the homeowner notices anything.

  That's not a slow problem. Once subfloor damage starts from a slow drain leak, the scope grows fast.

commonProblems:
  - title: "Polybutylene Pipe Failure in East Hill 1980s Homes"
    description: |
      Polybutylene supply lines — gray plastic pipe widely installed across Kent's East
      Hill between roughly 1978 and 1994 — break down from the inside when exposed to
      chlorinated city water. The acetal fittings crack before the pipe itself most of
      the time. Patching individual joints buys months, not years. Full replacement with
      PEX-A tubing is the lasting fix, done in phases if the house is occupied — bathrooms
      stay functional while supply lines get rerouted through attic or crawlspace runs.

  - title: "Tankless Water Heater Conversion Requiring Gas Line Upsize"
    description: |
      Switching a standard 40- or 50-gallon tank for a Rinnai or Navien condensing
      tankless unit is not a simple swap. Most Kent homes — especially 1970s builds —
      have half-inch gas supply lines sized for the original tank, and tankless units need
      three-quarter inch minimum for adequate BTU delivery. Add in seismic strapping
      required under WA code, a permit through Kent's building department, and a gas
      pressure test, and this job takes two to three days done correctly.

  - title: "Drain Line Rerouting for Islands and Basement Rough-Ins"
    description: |
      A kitchen island with a sink needs a drain path — and in most Kent slab-on-grade
      homes, that means cutting concrete, establishing the 1/4-inch-per-foot slope
      required under IRC, and coordinating a rough-in inspection before the slab is
      patched. Basement bathroom additions often require an ejector pump when the floor
      drops below the main sewer line. Getting rough-in signed off before drywall closes
      things up is non-negotiable — missed inspections mean tear-out. The cast-iron
      cleanout locations in older valley-floor homes also need to be mapped before any
      new drain tie-in; they're rarely where original plans show them, and chasing them
      mid-project adds days.

faq:
  - q: "How fast can you get to Kent for plumbing work?"
    a: |
      Kent is a regular part of the schedule — we cover 98030, 98031, and 98042 weekly.
      SR-167 connects directly from most of the South King County corridor. Vladislav
      Volkov is WA Licensed Contractor with 100+ projects completed since 2023. Call
      (206) 591-1096 to set up a free on-site consultation — you're talking to the
      contractor, not a scheduler.

  - q: "Do you work with Moen, Kohler, and Rinnai fixtures during remodels?"
    a: |
      Yes — Moen, Kohler, and Delta are the most common fixture brands in Kent remodels,
      and Rinnai and Navien for water heaters. Fixture rough-in, supply sizing, valve
      placement for walk-in shower enclosures and curbless shower conversions are all
      part of a complete bathroom remodel scope. Fixture specs come from us, finish
      choices come from you.

  - q: "What does the permit process look like for plumbing work in Kent?"
    a: |
      Kent has its own permit center — a simpler process than Seattle SDCI for most
      residential plumbing work. A water heater replacement permit is typically
      over-the-counter or issued within a couple of business days. Full tankless
      conversion with a gas line upsize and rough-in inspection runs 2-4 weeks start
      to finish. Vladislav writes deadline commitments into the contract — if the
      timeline slips on our side, there is a financial penalty. Schedule a consultation
      to get a real timeline, not a range.