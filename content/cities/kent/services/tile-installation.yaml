  - q: "Do you install natural stone tile — marble or travertine — in Kent bathrooms?"
    a: |
      Yes. Marble and travertine need stone-specific thinset mortar, not standard tile
      adhesive, and proper sealing after grouting. In PNW homes with Seattle's 37-inch
      annual rainfall and humid winters, that means a full Schluter Kerdi waterproofing layer
      underneath plus sealer application after grouting. Realistic maintenance: resealing
      marble every 1-2 years.

      TopVolk is a WA Licensed Contractor — 100+ projects completed since 2023 across King
      and Snohomish counties.

