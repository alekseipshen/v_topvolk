title: "Kent Tile Installation — Fixing What Builder-Grade Missed"

intro: |
  East Hill tract housing — the split-levels and two-story colonials packed into Kent's 98042
  and 98031 zip codes — was built fast between 1982 and 2000. The original tile work matches:
  4-inch ceramic over greenboard drywall, mastic adhesive, no waterproofing membrane behind it.

  Kitchen retiles in these homes often pair with appliance upgrades — backsplash cuts around
  a new Bosch dishwasher or KitchenAid range require electrical rough-in relocation before any
  tile goes up. TopVolk handles tile as part of full remodel scopes — not patchwork-only calls.

localContext: |
  Panther Lake, East Hill, and the subdivisions along SE 240th Street sit at elevation, but the
  Green River Valley corridor — 98030 and parts of 98032 — deals with elevated ground moisture.
  Crawlspace humidity in older Kent ranchers accelerates rot under bathroom floors when a tile
  pan leaks. Post-1990 homes used cement board over greenboard, which is better — but installers
  routinely skipped the vapor barrier behind it, leaving moisture a direct path into wall
  framing over Seattle's long rainy season.

  Thirty-seven inches of annual rainfall finds every gap you left open.

  North-facing walls in East Hill subdivisions grow moss on Hardie siding by November. Same
  damp logic applies behind shower walls. A vapor barrier isn't optional here — it's load-bearing
  on the project's long-term outcome.

commonProblems:
  - title: "Shower Substrate Failure Behind Decades-Old Greenboard Tile"
    description: |
      Greenboard drywall behind tiled showers was standard in Kent's 1980s-90s construction —
      and it was never rated for continuous wet exposure. It absorbs moisture through grout
      joints and around penetrations until the paper face delaminates and tile pops off the
      wall in sections.

      Correct repair means demo to studs, inspection for rot, then Schluter Kerdi membrane or
      RedGard applied over cement board before any new tile goes up. No shortcuts on this step.

  - title: "Large-Format Porcelain Lippage on Out-of-Flat Subfloor"
    description: |
      32x32 or 24x48 porcelain tile amplifies every floor imperfection. Industry standard
      requires substrate flatness within 1/8 inch over 10 feet — most original 1990s Kent
      bathroom subfloors aren't within 3/8 inch. Tile installed without a self-leveling
      underlayment or mud bed float produces lippage: raised tile edges that catch toes and
      look unfinished.

      Laser-leveled substrate prep adds a day to the schedule. Skipping it adds a callback
      within a year.

  - title: "Heated Floor Systems Cracking Grout Due to Joist Deflection"
    description: |
      Schluter Ditra-Heat and Warmup heated floor mats are popular in Kent bathroom remodels —
      but they demand a dimensionally stable subfloor. Joists in older split-levels and ranchers
      can have minor deflection invisible underfoot yet enough to crack grout lines within
      12 months. The uncoupling membrane must be installed over solid framing, and the added
      tile-height stack — roughly 3/4 inch — needs to be planned for in tile-to-hardwood
      expansion gap transitions and door swing clearances.

