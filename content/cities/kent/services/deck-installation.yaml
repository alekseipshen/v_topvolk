title: "Kent Deck Installation — Composite Decking, Permits, 98042"

intro: |
  Panther Lake sits at the edge of 98042, and the backyards out there are some
  of the more usable in Kent — flat lots, decent square footage, no dramatic
  grade changes to complicate the build. Seven months of rain still take a toll.
  Cedar checks and splits without regular refinishing, and north-facing boards
  grow moss by January. Trex and TimberTech composite hold up to that cycle
  without annual maintenance — and with proper ledger flashing and ground-contact
  PT post footings, the structure stays solid for decades.

localContext: |
  Kent's 98031 and 98032 zip codes are packed with 1970s and 80s tract homes —
  bi-levels and split-levels where the back door opens onto a concrete slab or
  bare dirt. Scenic Hill has older stock where the rim joist has been damp behind
  the original siding for years. City of Kent Building Services handles permit
  review here — separate from King County DPER, which applies only to
  unincorporated parcels — and plan review for a standard deck typically runs
  two to four weeks.

commonProblems:
  - title: "Rim Joist Rot at the Ledger Attachment Point"
    description: >
      On 1970s–80s Kent homes in 98031, the rim joist behind original T1-11 or
      Hardboard siding is often soft — moisture has been sitting there for years
      without proper flashing. Bolting a ledger board to rotted framing creates
      a structural liability. The fix: sister the rim joist with new dimensional
      lumber, flash the full ledger connection with Vycor flashing tape, then
      re-attach with approved lag pattern.

  - title: "Post Footings in Kent's Glacial Clay"
    description: >
      Large parts of Kent sit on clay-heavy glacial till that drains slowly
      after winter rain. Post footings need to reach below the frost line — 12
      to 18 inches minimum in this area — and concrete must cure fully before
      load goes on it. Rushing depth or cure time leads to post movement and
      deck sag within a few seasons. Ground-contact PT lumber at every
      post-to-footing transition is non-negotiable.

  - title: "Guardrail Height and Stair Code on 1980s–90s Decks"
    description: >
      Decks over 30 inches off grade require guardrails at 36 inches minimum
      under IRC — and many of Kent's tract-era decks were built without them,
      or with pickets that are now out of spec. Stair stringers have rise/run
      limits too (max 7¾-inch rise, min 10-inch run), plus graspable handrails
      on any stair with more than three risers. A City of Kent permit triggers
      rough-in inspection where all of this gets verified.

faq:
  - q: "How fast can you get to Kent for Deck Installation?"
    a: >
      Kent is straightforward — SR-167 south or SR-516 off I-5, 25–35 minutes
      from Seattle depending on traffic. TopVolk is a WA Licensed Contractor
      with 100+ projects completed since 2017. Call (206) 591-1096 —
      Vladislav picks up, not a call center.

  - q: "Do you build with Trex, TimberTech, or other composite brands?"
    a: >
      Yes. Trex, TimberTech, and Fiberon are all in regular rotation. Each has
      different board profiles, color options, and price points — Fiberon tends
      to sit between Trex Entry and TimberTech Pro on cost. Vladislav brings
      samples to the site visit and walks through the tradeoffs in person.

  - q: "How long does a Kent deck permit and build actually take?"
    a: >
      City of Kent plan review runs 2–4 weeks for a standard deck. After
      permit approval, a 12×16 single-level deck builds out in 1–2 weeks;
      multi-level or covered structures run 3–4 weeks. Deadline is written
      into the contract — if we miss it, we pay a penalty. Schedule a free
      on-site consultation to get a real number, not a range.