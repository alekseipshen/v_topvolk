title: "Kent HVAC — Heat Pump Upgrades for East Hill Homes"

intro: |
  Homes in Kent's East Hill — zip 98031 — were built through the 1970s and 80s with oversized gas furnaces and undersized duct insulation. Cold rooms upstairs. Bills that don't match the square footage. Mitsubishi and Carrier ducted heat pumps on existing ductwork fix both problems, and IRA rebates through 2032 bring the upfront cost closer to a straight furnace swap than most homeowners expect. Vladislav has walked this conversion through City of Kent mechanical permits on several East Hill properties. Call (206) 591-1096 before committing to anything — a site visit costs nothing.

localContext: |
  The 1970s-80s tract ranches around East Hill (98031) and the Meridian corridor (98030) have 10-14 inch sheet metal trunk lines running through unconditioned crawlspaces — fine for a gas furnace, problematic for a heat pump's airflow requirements. Kent sits in the Green River valley; wetter winters than higher-elevation King County suburbs push moisture into those crawlspaces and degrade duct joint seals. A duct leakage test and vapor barrier inspection belong in any HVAC scope here.

  East Hill also gets cold air drainage off the Cascade foothills in January. Freeze-thaw cycles hit harder than most Kent homeowners expect.

commonProblems:
  - title: "Cracked Heat Exchangers in Aging Carrier and Lennox Furnaces"
    description: "East Hill ranches — especially along the 98042 corridor toward Covington — are running Carrier and Lennox furnaces that are 20-25 years old. Cracked heat exchangers and failing inducer motors are the typical end-of-life pattern. Carbon monoxide risk becomes real once the exchanger cracks; that's a replacement conversation, not a repair estimate. Before sizing any replacement, a duct static pressure test catches whether existing trunk lines can actually handle a heat pump's higher airflow demands — undersized trunks force the system to hunt static pressure and short-cycle, which destroys compressors faster than age does. IRA federal tax credits up to $2,000 apply to qualifying high-efficiency heat pumps installed through 2032, which changes the cost math significantly versus a straight furnace-only swap. Vladislav pulls the City of Kent mechanical permit; rough-in inspection and final run together as one sequence. No separate scheduling on your end. WA Licensed Contractor, 100+ projects since 2017. Deadline penalties written into every contract."

  - title: "Ductless Mini-Splits for ADUs and Garage Conversions"
    description: "Kent residential lots qualify for up to two ADUs under WA HB 1337 (2024). A detached ADU in 98042 or a converted garage in 98030 can't tap the main home's ductwork — supply runs are too long and static pressure too high. A Mitsubishi or Daikin single-zone mini-split handles this cleanly. Vladislav coordinates the electrical rough-in and sub-panel work with the mechanical permit application so it runs as one City of Kent inspection sequence."

  - title: "AC Addition on Ductwork Sized for Heating Only"
    description: "Pre-1990 construction throughout 98031 mostly has forced-air gas heat and no cooling. Adding a central AC evaporator coil requires verifying blower motor capacity, checking return air duct cross-sections, and confirming refrigerant line set sizing. Undersized return ducts cause short-cycling. A Trane or Carrier unit sized to actual duct capacity — not square footage — avoids a full duct rebuild."

faq:
  - q: "How fast can you get to Kent for HVAC work?"
    a: "Kent is a regular stop — 30-40 minutes from Seattle via I-5 or SR-167, reachable from Bellevue via SR-169. Call (206) 591-1096 to book a site visit. Same-day visits available when heating or cooling is completely down. Most East Hill and Meridian neighborhoods have straightforward street parking; for downtown Kent jobs near the Sounder station, site access gets coordinated ahead of time."

  - q: "Which HVAC brands do you install and service in Kent?"
    a: "Mitsubishi and Daikin for ductless, Carrier and Trane for ducted heat pumps. Samsung and LG mini-split cassettes show up in newer ADU builds across the 98031-98042 corridor. Nest and ecobee thermostats are part of most heat pump installs — zoning configuration matters as much as the hardware. Lennox and Rheem come up frequently in 98031 diagnostics. Assessment first, replace only what the numbers justify."

  - q: "What does a heat pump permit cost in Kent, and how long does the process take?"
    a: "City of Kent mechanical permits for equipment replacement run $150-350. Heat pump conversions with new ductwork or significant duct modifications run $300-500, with plan review typically taking 2-4 weeks. TopVolk handles permit applications, rough-in inspections, and finals — no dealing with the permit office on your end. WA Licensed Contractor, 100+ projects completed since 2017 across King, Snohomish, Pierce, and Kitsap counties."