title: "Kent Kitchen Remodel — Opening Up 80s Builder Kitchens"

intro: |
  The residential grids east of Lake Meridian — zip 98042, built out through the late 1980s — came with spaces that builders treated as an afterthought. Eight-foot ceilings, galley layout, laminate on particleboard, a wall separating the dining area nobody's touched in 30 years.

  Swapping in a KitchenAid or Bosch isn't the whole job.

  Cabinet work, rough-in adjustments, and a probable panel upgrade come with it. The layout changes. Sometimes the structure changes too. Budget for that reality before the first demo swing.

localContext: |
  Kent's 98032 zip around downtown and the Meridian neighborhood in 98042 cover two distinct housing eras. Downtown Kent carries mid-century homes from the 1960s — occasionally with galvanized plumbing still in the walls. The Meridian grid is mostly 1985–1998 tract construction: 100-amp panels, galley layouts, and builder-grade finishes that have held up poorly in Western Washington's wet climate. Both go through the City of Kent's own permit center, not King County DPER — worth knowing before comparing bids from contractors quoting different jurisdictions.

  The structural realities also differ. A 1965 downtown home may have load paths that were never engineered. A 1990 Meridian split-level is framed to code but offers zero layout flexibility without removing a wall — which, in most of those plans, carries roof load.

commonProblems:
  - title: "Load-Bearing Wall Between the Cooking and Dining Areas"
    description: |
      That half-wall or full partition separating the two rooms looks cosmetic. In most of the 1980s floor plans we've opened in Kent, it carries roof load.

      Removal requires a structural engineer's report, an LVL beam sized to span the opening, and a City of Kent building permit. Plan review for structural modifications typically runs 4–6 weeks. Budget a few hundred dollars for the engineer's letter — it's not optional, and an inspector will ask for it at rough-in. Vladislav walks every load-bearing assessment personally before any demo begins. Call (206) 591-1096 to schedule a site look.

  - title: "100-Amp Panels Can't Handle a Modern Setup"
    description: "A Bosch induction cooktop draws 40 amps on its own. Stack a GE refrigerator, dishwasher, microwave, and range hood on the same panel and 100-amp service is maxed before noon. Upgrading to 200 amps requires a permit and Puget Sound Energy coordination for the meter. Budget this into the scope from day one — it's not optional on an induction build."

  - title: "Off-Spec Rough-In Dimensions in Builder Layouts"
    description: |
      1980s framing wasn't cut for today's appliance depths. Refrigerator alcoves are often 30 inches deep when a Samsung or LG counter-depth unit with surround cabinet needs closer to 32. Dishwasher rough-in is frequently off by 2–3 inches.

      IKEA cabinets need custom filler panels. Semi-custom cabinets need shop drawings reviewed against actual field measurements before the order goes in — not after. Getting this sequence wrong means a 2-week delay while the mill re-cuts doors.

