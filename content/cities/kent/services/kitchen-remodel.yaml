  - q: "What appliance brands do you frame around in Kent renovations?"
    a: "Most places we walk into have original Whirlpool, GE, or older Samsung still running. Common upgrades we rough-in for: KitchenAid ranges, Bosch dishwashers, LG French-door refrigerators. We don't supply appliances — we rough-in to the unit's spec sheet and coordinate delivery timing before walls close."

