title: "Kent Window Installation — Seal Failures and PNW Rain Rot"

intro: |
  SR-167 cuts through western Kent, and the subdivisions spread across East Hill in the 98042 zip
  still have thousands of original builder-grade vinyl windows installed when those homes were built
  in the mid-1980s. Forty-year-old IGU seals fail consistently—argon escapes, panes fog permanently,
  and barely adequate sill flashing pulls moisture into the wall framing every wet season from October
  through May. Milgard's retrofit series fits most of those rough openings without reframing, but the
  flashing and blocking detail around the new unit matters as much as the glass itself.

  Vladislav Volkov handles Kent window projects directly—no sales staff, no middlemen. TopVolk is a
  WA Licensed Contractor with 100+ projects completed since 2017 across King County. Call (206) 591-1096
  to schedule a free on-site consultation.

localContext: |
  The 98030 zip covers downtown Kent and the neighborhoods running along the Green River Trail, where
  1960s ranchers still have original aluminum sliding windows with no thermal break—condensation pools
  on the interior sill every October and mold follows. East Hill in 98042 is almost entirely 1980s to
  mid-90s tract housing with failing double-pane vinyl units. Valley Floor neighborhoods in 98032 sit
  within two miles of both SR-167 and I-5, which adds consistent road noise to the window replacement
  conversation.

commonProblems:
  - title: "Failed IGU Seals on 1980s–90s Vinyl Frames"
    description: |
      Builder-grade vinyl units from that era used butyl and silicone edge seals with a roughly
      20–25 year service life under PNW humidity cycles. Once the IGU seal fails, argon escapes
      and moisture permanently fogs the glass between the panes—no cleaning fixes that. Milgard
      and Pella both manufacture direct-replacement insulated glass units sized for standard rough
      opening dimensions, but frames this old typically need full-unit swap rather than glass-only
      replacement to meet current Seattle Energy Code performance requirements.
  - title: "Basement Egress Windows in Kent's Converted Bedrooms"
    description: |
      Many East Hill basements were converted to bedrooms in the 1990s without permits—common
      practice in that era. Per IRC Section R310, an egress window requires a minimum 5.7 sq ft
      net clear opening with a sill height no higher than 44 inches above the finished floor.
      Kent's Development Services Center processes these as new window installs. Cutting into
      poured concrete or CMU block is part of the scope, and rough-in inspection is required
      before any drywall closes the framing. Deadline penalty is written into every TopVolk
      contract—call (206) 591-1096 to get a line-item quote before the next permit window opens.
  - title: "Road Noise Infiltration Near SR-167 and I-5"
    description: |
      Standard double-pane glass does almost nothing to block traffic noise at highway frequencies.
      Sound-attenuating units use a PVB (polyvinyl butyral) interlayer—same laminate technology
      in automotive windshields—that disrupts sound wave transmission before it passes through the
      frame assembly. Marvin and Pella offer STC-rated retrofit units sized for existing rough
      openings. For 98032 Valley Floor homes within a mile of SR-167, the ambient noise reduction
      is noticeable within the first week after install.

