  - q: "Which window brands do you install—Milgard, Pella, or Marvin?"
    a: |
      Milgard is the default for most Kent retrofits because the frame dimensions align well with
      1980s rough opening sizes. Pella works better on 1960s aluminum-frame openings where the
      profile runs wider. Marvin is an option for higher-budget work where fiberglass frames justify
      the price difference. Material cost is quoted line by line—you see exactly what each window
      unit costs before we order anything. Schedule a free consultation with Vladislav at
      (206) 591-1096 to walk through which product fits your rough opening and budget.
  - q: "Does Kent require a permit for window replacement, and who handles the paperwork?"
    a: |
      Structural replacements—anything that changes the rough opening size or adds egress to a
      basement bedroom—require a permit through Kent's Development Services Center. Fees typically
      run $150–$300 for a residential project. Plan on 1–2 weeks for permit review, then 2–3 days
      on-site for a 10-window replacement. Deadline penalty is written into our contract.
      TopVolk handles the permit application. Call (206) 591-1096 for a line-item quote.