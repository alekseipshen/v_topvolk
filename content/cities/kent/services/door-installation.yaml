title: "Kent Door Installation — East Hill Tract Homes, Flashing Done Right"

intro: |
  The 1980s tract homes across Kent's East Hill in 98042 were built fast — entry doors
  with Z-bar flashing that's now pushing 40 years old and threshold seals compressed to
  almost nothing. Swapping in a Therma-Tru fiberglass unit means prepping the rough
  opening properly, not just hanging a new slab. TopVolk has handled entry door work
  across Kent neighborhoods from Panther Lake to the West Hill corridor near SR-167.
  King County's wet winters — 37-plus inches of rain a year — accelerate what builder-grade
  flashing should have prevented decades ago.

localContext: |
  Kent's 98032 zip, west of the Green River, carries mid-century ranchers and split-levels
  where door frames have racked with foundation movement over decades — getting a prehung
  unit to sit square means shimming the jack studs and sometimes planing the rough opening.
  East Hill's 1990s builds run straighter, but builder-grade hollow-core slabs have taken
  enough abuse to justify full replacement when a remodel opens up the wall anyway. Straight
  door swaps don't require a permit; structural header changes in unincorporated King County
  go through DPER. Vladislav handles the permit paperwork directly — no project manager
  relay, no phone tag with an office. Call (206) 591-1096 and you're talking to the
  contractor who'll be on site. Missed deadlines carry a financial penalty written into
  every TopVolk contract — not a vague promise, an actual clause.

commonProblems:
  - title: "Rotted Rough Opening Framing Behind Old Entry Doors"
    description: "Minimal Z-bar flashing on 1980s East Hill tract homes lets water migrate behind
      the exterior casing and into the king stud cavity. A fiberglass replacement door —
      Therma-Tru or Masonite — won't hold if the rough opening framing is saturated. We pull
      the casing, probe the studs, flash with self-adhering membrane, and let the framing dry
      before the new unit goes in. On Kent's north-facing elevations, that moisture damage
      often runs deeper than it looks — compromised jack studs need sistering with pressure-treated
      lumber before anything else happens. Rushing past that step means the new door rots out
      in half the time the original did."

  - title: "Worn-Out Patio Slider Rollers and Upgrade to Multi-Slide or French Doors"
    description: "Aluminum sliders from the 1990s have worn roller carriages and frames that
      no longer seal against King County's wet winters. Widening the opening for a Milgard
      or Pella multi-slide system means checking the existing header span — most Kent ranchers
      have a doubled 2x or single LVL beam that may need sistering if the rough opening grows.
      King County DPER requires a permit when the structural header changes, which typically
      adds 2-4 weeks of plan review to the timeline. The structural assessment happens at
      the free on-site consultation — Vladislav pulls the permit, coordinates the rough-in
      inspection, and doesn't hand the project off partway through."

  - title: "Interior Door Swing Conflicts During Remodels"
    description: "Reconfiguring a 98031 split-level kitchen almost always surfaces door swings
      that hit new cabinet runs. Hollow-core 6-panel doors from the 1990s get swapped for
      solid-core units, and the casing has to be rebuilt to match surrounding millwork. Door
      placement gets locked in during rough-in so there are no surprises at the blue tape
      walkthrough. In Kent's older split-level layouts — particularly around the 98030 zip
      near downtown — the original door schedules rarely accounted for modern appliance depths.
      Blocking gets added to the partition framing at rough-in to support the new hardware,
      so hinges and latches land in solid wood rather than drywall edge. That's the kind of
      detail that shows up at the punch list if it's skipped."

faq:
  - q: "How fast can you get to Kent for Door Installation?"
    a: "Kent sits right on TopVolk's regular route down SR-167 and I-5 south. Most projects
      start within 1-2 weeks of the site walk. Vladislav is a WA Licensed Contractor with
      100+ projects completed since 2017 across King County — call (206) 591-1096 to set up
      a free on-site consultation directly with him, not a sales rep. The consultation includes
      a line-item quote, not a ballpark range, and a start date that goes into the contract
      with a deadline penalty if TopVolk misses it."

  - q: "What door brands do you install in Kent homes?"
    a: "Therma-Tru and Masonite for fiberglass entry doors, Milgard and Pella for sliders
      and French door systems. Interior solid-core doors come from local suppliers sized to
      match existing millwork profiles. Smart lock integration — August smart locks and
      Schlage Encode deadbolts — is standard on entry door installs. For Kent's mid-century
      ranchers where the original door jambs are narrower than today's standard prehung units,
      the rough opening gets modified at framing, not forced with shims."

  - q: "Do you need a permit to replace a door in Kent?"
    a: "Straight swaps — same rough opening size, no header work — don't require a permit
      in King County. Widen the opening or modify the structural header and the project goes
      through King County DPER, adding roughly 2-4 weeks for plan review. TopVolk handles
      the permit application as part of the project scope, not as an add-on. For work in
      unincorporated King County east of Kent toward Covington or Maple Valley, DPER
      jurisdiction applies regardless of whether the city has its own permit center. Vladislav
      has navigated both paths enough times to know which projects need engineered drawings
      and which don't. Call (206) 591-1096 with the rough opening dimensions and framing
      details and he'll give you a straight answer on permitting before the site visit."