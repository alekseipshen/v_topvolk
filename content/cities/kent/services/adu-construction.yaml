title: "Kent ADU Construction — East Hill Lots Ready for a Second Unit"

intro: |
  East Hill sits on some of the largest residential parcels in south King County —
  6,000 to 10,000 sq ft lots that now legally support two separate dwelling units
  under WA HB 1337. That 2024 state law removed the variance hurdle for most
  single-family properties in Kent. A Mitsubishi mini-split handles heating and
  cooling in a well-insulated DADU without running new gas lines across the yard —
  practical for the rental income math that Kent homeowners are running right now.
  With rents in the 98042 corridor holding strong, the payback period on a
  600–800 sq ft detached unit pencils out faster than most owners expect.

localContext: |
  Most of Kent's residential stock landed between 1968 and 1988 — split-levels
  and ranchers concentrated in zip codes 98042 and 98031, particularly around
  Panther Lake and the East Hill plateau. Poured-slab and full-basement foundations
  are common in that era, which opens up basement AADU conversion as a lower-cost
  path compared to building detached. Older 150-amp or 200-amp service panels
  in those homes almost always need evaluation before adding a separate ADU
  electrical meter — something that affects your permit drawings from day one.
  City of Kent Building Services handles permitting locally, separate from King
  County DPER, so the plan review queue and checklist requirements are specific
  to Kent's own process. Knowing which counter to submit to — and in what order —
  saves weeks on the front end of the project.

commonProblems:
  - title: "Setback and Height Rules That Catch Kent Owners Off Guard"
    description: "City of Kent Building Services applies its own rear setback minimums — typically 5 feet — even under the statewide HB 1337 framework. DADUs are capped at 24 feet in height. East Hill lots near 98042 usually have enough rear depth for a 600–800 sq ft detached unit, but a site plan with accurate setback calculations has to be submitted before the permit counter will accept the application. FAR limits and lot coverage percentages also apply and vary by zone — R4 and R6 zoning cover most of East Hill. Skipping the zoning check is the most common reason plan review kicks a packet back."
  - title: "Utility Separation: Shared vs. Independent Connection to the Street"
    description: "East Hill sits across multiple water service districts — Lakehaven Utility District covers parts of 98042, while City of Kent water serves other zones. Which district owns your lateral affects connection fees and the engineering requirement for a separate ADU meter. A shared connection costs less upfront but can complicate future sale or separate financing of the unit. Navien tankless water heaters are standard on most DADU builds we do here — compact footprint, no standby loss, easier to size for a one-bedroom unit. For sewer, most East Hill parcels tie into the King County regional system, which adds a Metro connection fee line item to your utility budget."
  - title: "Basement AADU: Egress, Moisture Barrier, and Below-Grade Code"
    description: "Older Kent homes in 98030 and 98031 with existing basements make good AADU candidates — the shell is already there. The technical gap is usually egress: IRC requires a minimum 5.7 sq ft net clear opening on bedroom windows, and most 1970s builders didn't spec that. Window wells and cut-and-patch concrete work are typically part of that fix. Below-grade walls also need Schluter Kerdi membrane or RedGard applied before any framing touches concrete, given King County's groundwater table and the 37-plus inches of annual rainfall that saturates these soils Oct through May. A DriCore subfloor panel system goes over the slab before any finished flooring — skipping it means moisture wicks up and destroys whatever you install on top."

faq:
  - q: "How fast can you get to Kent for ADU Construction?"
    a: "Kent is a straightforward run south on I-5 or 167 from our base — no unusual travel time. Call (206) 591-1096 to schedule a free on-site consultation. Vladislav comes out, walks the lot, and gives you a real scope assessment — not a generic estimate from a salesperson."
  - q: "What materials do you typically spec for Kent ADU builds?"
    a: "Hardie cement-board siding is the standard exterior on most builds here — it holds up through the wet season without the rot risk of wood. Interior framing uses LVL beams where we open load-bearing walls, Milgard vinyl windows for the budget range, or Pella if the client wants fiberglass. Mini-split HVAC, Navien on-demand hot water, pressure-treated lumber anywhere near grade. R-49 insulation in the roof assembly is required under current Washington energy code for new construction — that affects the ceiling height calculation in any DADU with a low-slope roof."
  - q: "How long does the full ADU process take in Kent from consultation to move-in?"
    a: "Plan on 4–7 months end-to-end. City of Kent plan review runs 6–10 weeks for a DADU, faster for a basement AADU. Construction itself is 8–14 weeks depending on scope — rough-in inspections, framing inspection, and final inspection are all separate scheduling events with the city. Vladislav puts a written deadline schedule in the contract — with penalty clauses if we miss it. That's not a talking point; it's a line item. Call (206) 591-1096 to start the timeline from today. TopVolk is a WA Licensed Contractor, 100+ projects completed since 2023 across King, Snohomish, Pierce, and Kitsap counties."