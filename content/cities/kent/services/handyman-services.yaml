title: "Kent Handyman Services — Repairs Other Crews Leave Behind"

intro: |
  East Hill's 1980s builder-grade ranchers and the older rentals near downtown Kent
  rack up small repairs that sit undone for months. A Whirlpool dishwasher drain basket
  seal that nobody replaced. Weatherstripping compressing since the last wet season. Deck
  boards soft from nine months of valley rain. TopVolk handles exactly this — the details
  that don't justify calling in a full remodel crew. Owner Vladislav Volkov does the work
  himself or coordinates directly. Call (206) 591-1096 to schedule.

localContext: |
  Zip code 98042 covers most of East Hill — a dense residential belt built mainly
  between 1985 and 1998. Builder-grade vinyl windows, hollow-core doors, and vinyl lap
  siding were standard on every block. Those materials are now 28 to 40 years old and
  starting to fail in Kent's wet winters and the occasional freeze-thaw cycles east
  toward Auburn. Further west, 98030 covers original Kent downtown blocks — 1960s ranchers
  with galvanized supply lines and aluminum wiring in the older units that hasn't been
  fully replaced.

  The 98031 corridor along Central Avenue runs through some of Kent's denser rental
  stock — 1970s duplexes and small apartment conversions where deferred maintenance
  compounds fast. Crawlspace vapor barriers in that zone are often original polyethylene
  sheeting from the late 1970s, torn in places, doing little against the Green River
  valley's persistent ground moisture. King County DPER handles permits for unincorporated
  pockets east of Kent city limits — worth knowing before starting anything structural,
  even something as straightforward as replacing a rotted ledger board.

commonProblems:
  - title: "Door and Window Seals Failing After the Wet Season"
    description: >
      Kent sits in the valley between two ridgelines and catches heavy rain from October
      through May. Builder-grade bulb seals and door sweeps on East Hill homes from the
      1990s compress permanently after a few hard winters. Once the seal fails, the draft
      is constant. A Bosch smart thermostat or a Nest can adjust all it wants — neither
      compensates for a gap along the door frame or a failed glazing seal on an aluminum
      window. Replacing the sweep takes under an hour. Shimming a door that's dropped in
      the frame and binding against the jamb is a separate issue, but the two almost
      always show up together on homes this age.

  - title: "Soft Deck Boards and Failing Ledger Connections in 98042"
    description: >
      Pressure-treated lumber on decks built in the 1990s needs attention now. The ledger
      board connection at the rim joist is usually the first point of rot — especially on
      north-facing decks where moss builds up year-round and moisture never fully dries.
      Replacing boards without checking the blocking and joist hangers underneath just
      delays the next call. The ledger lag bolts are worth inspecting too — original
      installations often used standard construction screws rather than structural ledger
      screws, and those connections have been wet for three decades straight. Most East
      Hill homeowners switching to Trex composite are doing it after the second round of
      board replacement, not the first.

  - title: "Open Punch List Items After a Remodel"
    description: >
      Major contractors leave when the rough-in and finish work are signed off. Cabinet
      hardware goes uninstalled. A Moen kitchen faucet leaks at the supply line connection.
      Drywall texture doesn't match where a patch was cut for a new electrical box. The
      blue tape walkthrough list from six weeks ago is still half-open. Most remodel punch
      lists in Kent — full kitchens, bathroom rebuilds, basement finishes — take one
      dedicated day to close out completely. Vladislav has closed out punch lists on
      GE Profile kitchen installs, Kohler fixture swaps, and LVL beam soffit patches that
      other crews walked away from mid-job.

faq:
  - q: "How fast can you get to Kent for a handyman call?"
    a: >
      East Hill is easy via SR-516 or southbound on the 167. Rush-hour traffic in the
      Kent valley adds 20 to 30 minutes — book before noon for same-day visits. Call
      (206) 591-1096 directly. We cover all Kent zip codes: 98030, 98031, 98032, and
      98042, plus surrounding unincorporated King County under DPER jurisdiction.

  - q: "Do you work on Samsung and LG appliances in Kent homes?"
    a: >
      Samsung and LG dishwashers and refrigerators show up constantly on East Hill. We
      handle installation, supply line connections, drain line routing, and fixture swaps
      — not warranty repair. An LG French-door fridge water line swap or a Samsung
      dishwasher drain re-route to an undersink disposal are typical single-visit jobs.
      KitchenAid and GE Profile units are frequent too. Vladislav will tell you upfront
      if something needs a certified appliance tech instead.

  - q: "How do you price handyman work — flat rate or hourly?"
    a: >
      Vladislav quotes the job on-site after seeing it — no range estimates, no
      commissioned estimator in between. Weatherstripping, drywall patches, or a fixture
      swap usually run a few hours. Remodel punch lists get scoped on the first visit with
      a line-item price. WA Licensed Contractor, 100+ projects completed since 2023.
      Deadline penalty is written into the contract. Free on-site consultation with the
      person doing the work — call (206) 591-1096 to set it up.