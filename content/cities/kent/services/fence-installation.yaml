title: "Kent Fence Installation — Clay Soil, Survey Lines, Permits"

intro: |
  East Hill subdivisions in the 98042 zip have been accumulating fence problems for three decades — posts set too shallow in clay-heavy soil, cedar boards gone gray from no maintenance, property lines assumed from old plats rather than verified. Vladislav Volkov at TopVolk Construction, WA Licensed Contractor, has been building fences across Kent since 2017. Board-on-board cedar, Trex composite panels, horizontal cedar slats — City of Kent permits pulled before the first post goes in the ground. Parcel boundaries checked against King County Assessor records. That's how a fence lasts 20 years in this climate, not five.

localContext: |
  Most of Kent's residential stock is 1980s and 1990s tract construction — subdivisions across West Hill, the Meridian neighborhood, and along SE 272nd Street in zip codes 98030 and 98031. Survey stakes from those original builds are long gone on most parcels. Plat maps from that era frequently don't match current fence lines, and King County GIS data can be off by a foot or two at the corners. East Hill in 98042 skews toward larger lots, but north-facing fence runs there pick up persistent moisture from the Green River corridor. Valley-bottom lots near the river also run higher water tables, which affects post depth calculations and concrete footing sizing.

commonProblems:
  - title: "Post depth in Kent's clay soil — the 24-inch standard doesn't hold up here"
    description: |
      Standard post-depth guidelines assume soil that drains between rain events. Kent's clay doesn't — it holds water from October into late April, and posts set at 24 inches start rotating at the base after two or three wet seasons. Minimum 36-inch depth here, gravel backfill at the bottom of each post hole, and a concrete collar around each post. Concrete needs 48 hours to cure before backfill. Where the fence meets a poured slab, Simpson Strong-Tie post bases keep pressure-treated lumber out of the wet zone entirely.
  - title: "Cedar vs. composite — what Kent's rain does to untreated fence boards"
    description: |
      Western red cedar is the default fence wood in the Seattle area, and it earns that — for a few years. Left unstained in Kent's wet climate, north-facing boards moss over by year three and start checking along the grain. Trex and TimberTech composite eliminate that maintenance cycle. Horizontal cedar slat designs, common in newer East Hill builds, also need blocking every 24 inches between posts. Skip the blocking, and the boards cup and warp through PNW winters.
  - title: "City of Kent permits — when your fence project triggers a building review"
    description: |
      Fences under 6 feet in Kent usually don't need a permit. That changes when the fence sits on a retaining wall, or when height exceeds 6 feet near a front setback — both trigger City of Kent Development Engineering review. Kent's permit process moves faster than Seattle SDCI, typically 2-4 weeks for a complete residential application. East Hill and Meridian subdivisions may also have HOA CC&Rs that restrict fence materials or colors. Pull those before choosing cedar or composite.

faq:
  - q: "How fast can you get to Kent for Fence Installation?"
    a: |
      Kent is a regular service area — East Hill, West Hill, downtown near Kent Station, and properties along the Green River Trail corridor. SR-167 puts most of the city 35-40 minutes out. Call (206) 591-1096 to schedule a free on-site consultation with Vladislav directly. No answering service, no salesperson.
  - q: "Do you install Trex or TimberTech composite fencing, or only cedar?"
    a: |
      Both. TopVolk installs cedar board-on-board, horizontal cedar slat, vinyl, and Trex or TimberTech composite panels. On north-facing runs in Kent's wet climate, composite holds up without staining — no moss cycles, no checking or cupping over the years. Cedar still wins on upfront cost and PNW aesthetics, but it needs stain every 2-3 seasons to stay that way. Vladislav walks through both options with line-item pricing during the on-site visit.
  - q: "What does a Kent fence project cost and how long does the work take?"
    a: |
      Project-based fence work at TopVolk typically runs $8,000–$25,000+ depending on linear footage, material choice, gate hardware, and whether permits are required. Most Kent residential fences take 3-5 install days after permits clear — quicker when the parcel line is clean and soil doesn't need special post treatment. Over 100 projects completed across King County since 2017. Vladislav provides a written line-item quote after walking the property. Deadline penalties are written into the contract.