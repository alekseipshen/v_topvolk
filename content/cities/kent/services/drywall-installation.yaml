title: "Kent Drywall Installation — Popcorn Ceilings, Fire Walls, Level 5 Finish"

intro: |
  East Hill and the neighborhoods around Lake Meridian (98042) are packed with late-1970s
  and 1980s two-stories — builder-grade homes where every ceiling got the popcorn treatment
  and the original drywall is 3/8-inch throughout. Pull out a 1978-era GE range hood for a
  kitchen remodel and you'll find patch-on-patch drywall work that reads like geological strata.
  TopVolk handles the full scope: new hang, skim coat, Level 5 finish, mold-resistant board,
  and fire-rated assemblies.

localContext: |
  Kent sits in the Green River Valley moisture corridor — rain rolls in from October through May
  and basements absorb it. The 98032 zip (West Hill, Downtown Kent) has older housing stock where
  plaster-and-lath walls got covered over with drywall patches during 1970s and 80s remodels;
  matching finish across those surfaces takes real skill, not just joint compound. Homes in 98030
  and 98031 built after 1985 are more straightforward, but every garage-to-living conversion and
  ADU separation wall still requires 5/8-inch Type X under IRC — King County DPER will catch it
  on rough-in inspection if it's not there.

commonProblems:
  - title: "Popcorn Ceiling Skim Coat on East Hill 1970s–80s Stock"
    description: "Two-stories built before 1985 throughout the 98042 zip almost universally got
      spray-on texture — and it's the first thing homeowners want gone during a kitchen or bath
      remodel. Scraping is only half the job. After scrape, the ceiling needs a skim coat to Level 4
      minimum, Level 5 if recessed lighting with sidewall illumination is going in. We finish with
      USG Tuff-Hide primer-surfacer before paint to keep sheen consistent across old and new surfaces."

  - title: "Mold-Resistant Board in Kent Basements and Laundry Rooms"
    description: "Below-grade rooms in Kent's valley-floor neighborhoods collect moisture even with
      a vapor barrier in the crawlspace. Standard 1/2-inch gypsum in a laundry room or basement
      bathroom will paper-face within a few years — you see it all the time in 98032 remodels.
      National Gypsum Gold Bond XP (purple board) or USG Mold Tough goes in instead, with RedGard
      applied over the shower niche and bench before tile."

  - title: "5/8-Inch Type X for Garage Conversions and ADU Separation Walls"
    description: "WA HB 1337 opened up ADU construction across King County and Kent homeowners are
      building — garage conversions, DADUs in the backyard, finished basements with separate
      entrances. IRC requires 5/8-inch Type X drywall on every garage-to-living boundary wall and
      ceiling. Miss it and the rough-in inspection gets held. King County DPER runs plan review on
      these jobs; budget 4–8 weeks for permit approval before framing starts."

  - title: "Soundproofing Between Bedrooms and Shared ADU Walls"
    description: "Room additions and ADU conversions increasingly need acoustic separation —
      especially when a bedroom shares a wall with a home office or a new attached ADU unit.
      Resilient channel decouples the drywall layer from the framing studs; pair it with QuietRock
      510 and you get meaningful STC reduction. It adds cost up front but avoids the complaint
      call three months after move-in. Standard builder drywall does nothing for sound."

faq:
