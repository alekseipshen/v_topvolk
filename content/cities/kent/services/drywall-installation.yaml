    a: "Kent is a regular part of our schedule — East Hill, West Hill, and the ShoWare Center area
      all fall inside our King County service zone. Call (206) 591-1096 and we'll set up an
      on-site walkthrough, typically within a few days. Vladislav comes out directly — no salesperson."

  - q: "Can you match existing drywall texture on older Kent homes?"
    a: "Yes. Knock-down, orange peel, skip trowel — all standard. East Hill homes from the 1970s
      and 80s commonly have orange peel throughout; we spray and knock to match before painting.
      Level 5 skim coat is available for kitchens and bathrooms where new recessed lighting creates
      sidewall wash that shows every imperfection."

