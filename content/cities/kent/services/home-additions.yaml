title: "Kent Home Additions — ADUs, Second Stories & In-Law Suites"

intro: |
  East Hill split-levels in 98042 were built when single-income households were the norm — three bedrooms, one bath, no room for aging parents or a rental unit. That math doesn't work anymore. Adding a DADU in the backyard or converting the basement into a proper mother-in-law suite with a separate entrance and a Bosch range changes how the house works for the next two decades. Vladislav walks every lot before a single line goes on paper.

localContext: |
  Most Kent additions happen in 98042 and 98031 — East Hill and the neighborhoods stretching south toward Covington. Houses out here went up between 1975 and 1995, builder-grade throughout: 2x4 exterior walls, shallow foundations, and insulation that doesn't meet current IRC requirements. The Lake Meridian pocket runs slightly newer stock, but the permit process is identical. City of Kent Building Services handles plan review for all residential work inside city limits — not King County DPER.

commonProblems:
  - title: "Foundation Capacity for Second-Story Additions"
    description: |
      East Hill tract homes from the 1980s typically sit on continuous perimeter foundations poured for a single-story load. Go up a second floor and you're asking that foundation to carry roof load, floor load, and live load through bearing walls that weren't designed for it. A structural engineer needs to stamp the calculations before Kent Building Services will schedule plan review — usually speccing a new LVL beam at the ridge or a PSL post at midspan. Budget $3,000–$8,000 for engineering alone, before framing starts.

  - title: "Matching Exterior Finishes on 1970s–80s Homes"
    description: |
      Kent's older stock runs mostly T1-11 panel siding and aluminum trim — materials that changed or disappeared decades ago. Matching that envelope on a new addition is nearly impossible. The practical move is switching the whole house to Hardie cement-board siding during the project, which also gives the original exterior a weather-tight upgrade. Hardie handles the October-through-May rains without delaminating or rotting. Painted finishes hold 10–15 years; T1-11 panels need repainting every 4–5 or they fail at the seams.

  - title: "HVAC Zoning for Detached ADUs"
    description: |
      Detached ADUs under WA HB 1337 sit outside the main house's mechanical envelope. Running ductwork from an existing forced-air system to a DADU means penetrating the foundation, crossing an unconditioned crawlspace, and coordinating with the AHJ inspection sequence — all for a zone that'll be occupied independently. Most DADUs we build in Kent get a Mitsubishi mini-split: one head unit, one outdoor condenser, no ductwork to run under the house. The rough-in for the line set goes in during framing, before insulation and drywall close up the walls.

faq:
  - q: "How fast can you get to Kent for a Home Additions consultation?"
    a: |
      Kent is a straight shot down SR-167 from Renton — 20–30 minutes depending on traffic near the Auburn merge. Vladislav does every initial walkthrough himself. Call (206) 591-1096 and we can usually schedule within a week. The on-site consult is free. You're talking to the contractor from the first call, not a commissioned closer.

  - q: "What window and siding brands do you install on Kent additions?"
    a: |
      Milgard is the standard window spec for Kent-area additions — good thermal performance for this climate, locally stocked, and sized to current code without special ordering. For siding, Hardie lap and panel cover most scenarios. On larger-budget projects, Pella and Marvin both hold up well in the Pacific Northwest. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023 across King, Snohomish, Pierce, and Kitsap counties.

  - q: "What's the permit timeline for a home addition in Kent?"
    a: |
      City of Kent Building Services handles residential permits — not King County DPER. Plan review for a major addition runs 6–10 weeks. Ground-floor addition: 4–6 months total from design to final inspection. Second-story or ADU under WA HB 1337: 6–9 months. Scope and pricing are quoted line-by-line — no vague ranges. Deadline commitments are written into every TopVolk contract, with penalties if we miss. Call (206) 591-1096 to walk through your specific lot.