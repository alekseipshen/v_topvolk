title: "Kent Carpentry — Trim, Built-Ins & Millwork Across 98030–98042"

intro: |
  Scenic Hill and the blocks around downtown Kent (98032) have a dense run of 1950s and 1960s ranchers where original fir trim has been painted over so many times it's lost all its detail. Pull a window casing off one of those houses and you'll often find four coats of latex hiding decent wood underneath. On the east side in 98042, the ask shifts: pantry fabrication around Bosch dishwasher and refrigerator banks, built-in shelving for garage conversions, closet systems in the bedroom additions that spread through the 1990s. Different era, same need for accurate work.

localContext: |
  The older core of Kent — zip codes 98030 and 98032 — runs mostly mid-century ranchers and split-levels built between 1955 and 1975. Builder-grade trim profiles, hollow-core interior doors, stair framing that wasn't engineered to last 60 years. East Hill (98042) trends 1980s through early 2000s: bigger lots, tract homes, closet organizer requests, addition trim-out. Kent's valley-floor soil also moves more than hillside sites — that shows up in anything framed directly on slab or sitting on original pier.

commonProblems:
  - title: "Sagging stair stringers in 1960s split-levels"
    description: |
      Split-levels in Scenic Hill and around 98032 used dimensional lumber for stair stringers — not engineered LVL stock — and after six decades of seasonal wet-dry cycling, they develop visible sag, flex underfoot, and creak with every step. Fixing it means pulling treads and risers, cutting a replacement stringer to the existing rise-run layout, and reattaching with joist hangers into the landing framing. We match the existing tread profile wherever available stock allows; custom-route on a router table when it doesn't. Kent sits in the Green River valley, which traps moisture from October through May — unventilated crawlspaces under these ranchers stay damp, and that accelerates wood movement in anything close to grade. A vapor barrier and blocking upgrade often goes alongside the stringer work.
  - title: "Window seat framing racked out of square"
    description: |
      Kent's valley-floor clay shifts differently than hillside ground in Beacon Hill or West Seattle. A window seat box framed in 1965 can be half an inch out of plumb today, which turns a simple cushion platform or wainscoting install into a much bigger problem. The right approach is sistering the subframe with fresh blocking, re-leveling the face framing, then installing beadboard or shiplap that actually sits flush — not bowing with the old frame underneath.
  - title: "Interior door casing that won't match existing profiles"
    description: |
      Tract housing from the early 1970s in 98030 and 98031 uses casing profiles not in current production. Swapping the door itself takes an afternoon — the miter work to blend new casing into original profiles without a visible seam is the actual job. We run custom casing on a router table when a close off-the-shelf match doesn't exist. A remodel near Kent Station last year required this on four doorways; the KitchenAid appliance wall and surrounding cabinetry would have looked mismatched without it.

