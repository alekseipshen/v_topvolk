    a: |
      Kent sits in our regular King County rotation. SR-167 from Auburn puts us in the valley in under 15 minutes; from Seattle via I-5 it's 30-40 minutes in normal traffic. Call (206) 591-1096 to set up a free on-site visit with Vladislav directly — not a scheduler, the contractor doing the work.
  - q: "Do you build custom pantry and closet systems in Kent kitchens?"
    a: |
      Yes, steady part of our scope here. Face-frame pantry systems around Bosch, GE, and Samsung appliance banks, shelf pin boring, custom door profiles matched to existing kitchen casing — all custom-built, not assembled from flat-pack. We quote the scope line by line after measuring on-site.
  - q: "What does carpentry work in Kent typically cost and how long does it take?"
    a: |
      Scope drives both. A stair stringer rebuild runs one to two weeks of carpentry time. A window seat with flanking built-in bookcases, two to three weeks. Vladislav quotes every project with a line-item breakdown and a written completion date — miss the date, we pay a penalty, written into the contract. Call (206) 591-1096. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023.