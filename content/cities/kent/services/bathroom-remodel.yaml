title: "Kent Bathroom Remodel — Fixing 30-Year-Old Tract Bathrooms"

intro: |
  East Hill homes along 104th Ave SE and around Lake Meridian (98042) were
  built fast in the late 1980s and early '90s — and the bathrooms show it.
  Builder-grade Moen fixtures, vinyl flooring over bare concrete board, no
  waterproofing membrane behind the tub surround. Thirty-plus years of PNW
  rain does a number on that. Starting from studs, with Schluter Kerdi
  installed correctly and layouts that actually work — that's what a real
  remodel looks like here.

localContext: |
  The bulk of Kent's housing, especially on East Hill (98042) and near the
  Green River corridor (98032), dates to 1985-1998. These tract builds used
  minimal blocking behind walls — a problem when mounting heavy vanity mirrors,
  towel bars, or ADA grab bars years later. Original drain rough-ins were
  positioned for standard alcove tubs, not walk-in showers. Rerouting those
  cast-iron or ABS drain lines to hit a new shower layout adds scope, but it's
  standard work for any remodel in these zip codes.

commonProblems:
  - title: "Failed waterproofing behind 1990s tub surrounds"
    description: "Most East Hill tract bathrooms have fiberglass tub surrounds installed
      over standard drywall — no real waterproofing membrane. Seams fail around
      year 20-25, water wicks into the framing, and you get rot behind walls that
      look fine from the outside. Fix involves stripping to studs, treating any
      affected framing, and installing Schluter Kerdi or RedGard before new tile
      goes up."
  - title: "Converting alcove tub layouts to walk-in showers"
    description: "The 98042 tract builds rough-in drains at the alcove tub position —
      wrong spot for a walk-in shower. Conversion means rerouting the drain,
      moving hot/cold supply lines, adding blocking for a shower niche and bench,
      and running a proper 2-inch drain line. Curbless showers require sloping the
      subfloor too — not just setting a mud bed flat."
  - title: "Exhaust fans that can't handle Pacific Northwest humidity"
    description: "Kent gets around 37 inches of rain annually. Original bath fans in these
      homes push 50 CFM at best — often venting into attic space instead of
      through the roof. That's a mold setup. During a full remodel we swap in
      Broan or Panasonic units at 110+ CFM, ducted properly to the exterior, with
      a humidistat so they cycle when moisture actually builds."

