  - q: "Engineered hardwood or LVP — which holds up better in East Hill slab-on-grade homes?"
    a: |
      Both work over slab with proper prep. Engineered hardwood — white oak,
      hickory, or maple from Shaw or Mohawk — gives a real wood look and sands
      once or twice over its life. LVP is waterproof and typically costs 30-40%
      less installed. Transitions between materials finish with Schluter reducer
      or T-strip profiles for a clean break. For homes with active crawlspace
      moisture history, LVP is usually the safer first call.
  - q: "What does flooring installation cost in Kent, and how long does it take?"
    a: |
      Material and subfloor condition drive the number. LVP over an existing
      prepared subfloor in a 1,200 sq ft Kent home typically runs $8,000-$15,000
      installed. VAT abatement or significant subfloor repair adds days and cost
      before flooring even starts. TopVolk provides line-item quotes after site
      inspection — no per-square-foot estimates without seeing the subfloor.
      Deadline penalties are written into the contract. WA Licensed Contractor,
      100+ projects across King County since 2023. Call (206) 591-1096 or
