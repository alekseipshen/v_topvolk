title: "Kent Flooring Installation — Subfloor Moisture Comes First"

intro: |
  Tract homes built between 1982 and 1998 fill most of East Hill and the Lake
  Meridian neighborhoods in zip 98042, and they share a consistent subfloor
  problem: original OSB that has absorbed decades of King County rain and
  crawlspace vapor. TopVolk moisture-tests before a single board goes down. One
  job off SE 240th Street came back at 13% subfloor moisture content — solid
  hardwood would have cupped by the following spring. DriCore panels stabilized
  that slab, and LVP went in after. Vladislav Volkov runs every Kent job
  directly — WA Licensed Contractor, 100+ projects completed since 2023 across
  King and Pierce counties. Call (206) 591-1096 to schedule a site assessment
  before any materials get ordered.

localContext: |
  East Hill (98042) and the West Hill corridor near SR-167 lean heavily toward
  slab-on-grade construction from the early 1990s. That foundation limits
  material choices — solid hardwood on slab carries real risk of cupping through
  humidity cycles. Engineered hardwood or LVP are the practical calls for most
  of those homes. Older pockets near downtown Kent (98032) include 1960s
  split-levels with crawlspaces and post-and-pier foundations, where vapor
  barrier condition and floor joist spacing need checking before any new floor
  goes in. Kent pulls close to 37 inches of rain annually. Crawlspace vapor
  stays active October through April, and any install that skips a proper vapor
  barrier inspection will show moisture damage within one or two heating cycles.
  The 6-mil poly under the crawlspace is often original — degraded or missing
  entirely in homes near Lake Meridian Drive.

commonProblems:
  - title: "Subfloor moisture above safe thresholds for hardwood installs"
    description: |
      OSB subfloors in 1980s Kent tract homes absorb humidity from crawlspace
      vapor and heavy seasonal rain. Moisture content above 10% means holding on
      any hardwood install until the subfloor stabilizes — solid hardwood exposed
      to that level cups and gaps within one heating season. TopVolk runs a
      pin-type moisture meter on every job before material gets ordered. A DriCore
      subfloor panel system can bridge the moisture gap over damp slab where full
      replacement is not practical. Call (206) 591-1096 to book a moisture
      assessment with Vladislav before committing to any flooring material.
  - title: "Hardwood acclimation skipped — boards buckle post-install"
    description: |
      Solid and engineered hardwood need 4-7 days to acclimate inside the
      installation space — matching the room's actual temperature and humidity —
      before a single board goes down. Skip that during Kent's October-through-April
      wet season and boards expand post-install, pushing at seams and buckling
      through tongue-and-groove joints. TopVolk has re-done installations from
      other contractors where acclimation was treated as optional. It is not
      optional.
  - title: "Vinyl asbestos tile (VAT) concealed under 1960s kitchen flooring"
    description: |
      Split-levels and ranchers from 1960-1975 near downtown Kent (98032)
      frequently have VAT under current sheet vinyl. The tile contains chrysotile
      asbestos — cutting or pulling it without licensed abatement releases fibers.
      Floating new flooring directly over undisturbed VAT may be permissible in
      limited cases, but any damage or moisture changes that calculus. TopVolk
      coordinates Washington-certified abatement before flooring work begins in
      homes of that era.

