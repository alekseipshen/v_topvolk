title: "Kent General Contracting — Permits, Trades & Full Remodels"

intro: |
  East Hill in zip code 98042 is packed with 1982–1998 tract homes — solid
  bones, but kitchens with original GE ranges and bathrooms that haven't
  changed in thirty years. Gutting and rebuilding that kitchen means pulling
  a King County permit, sequencing four trades in the right order, and
  managing a project in the $60K–$150K range without losing weeks between
  rough-in and finish work. Vladislav Volkov has been running these projects
  across Kent since 2023 — 100+ completed, WA Licensed Contractor.

localContext: |
  Most of Kent's residential stock sits on East Hill and around Panther Lake
  — builder-grade construction from the 1980s and 1990s. West Hill has older
  ranchers from the 1960s-70s near the Green River corridor. Homes inside
  city limits permit through the City of Kent building department; some
  unincorporated pockets in the 98042 area pull King County DPER permits
  instead. Knowing which jurisdiction applies before submitting drawings
  saves three to four weeks of avoidable back-and-forth.

commonProblems:
  - title: "Permit coordination when multiple trades touch the same remodel"
    description: |
      A full kitchen gut in Kent requires a building permit plus separate
      electrical and plumbing permits, with rough-in inspections before walls
      can close. City of Kent plan review on a major kitchen or bathroom
      remodel typically runs three to six weeks. If the framing sub finishes
      and walls close before electrical rough-in is inspected, the inspector
      will require drywall to come back down. Sequencing those three gates
      correctly is the core job of a general contractor — and the part
      homeowners who go sub-direct most often get wrong.

  - title: "Demo reveals structural surprises in East Hill tract homes"
    description: |
      Pull drywall in a 1987 Kent rancher and you might find undersized LVL
      beam spans at a load-bearing wall, galvanized supply lines corroded
      near-blockage, or an electrical panel loaded with double-tapped
      breakers. These aren't rare. One in three remodels on East Hill turns
      up at least one of them. Experienced GCs build 10–15% contingency into
      $100K+ project bids upfront — not to pad the number, but because demo
      day in houses this age is genuinely unpredictable, and a cost
      contingency is cheaper than a stopped job.

  - title: "Multi-sub scheduling that falls apart without a single coordinator"
    description: |
      Homeowners who hire framing, electrical, and plumbing subs separately
      end up scheduling around each trade's backlog instead of around the
      project. Framers finish. Electrical won't start for two weeks. Plumbing
      reschedules twice. On a $120K remodel, that fragmentation adds weeks of
      carrying costs and dead time on a vacant kitchen. MEP coordination —
      managing the mechanical, electrical, and plumbing sequence so trades
      show up in the right order — is exactly what a general contractor
      is there to own.

faq:
  - q: "How fast can you get to Kent for General Contracting?"
    a: |
      Kent is a regular stop — East Hill, West Hill, the downtown corridor
      near Kent Station. Vladislav can usually schedule an on-site
      consultation within a few days of first contact. Call (206) 591-1096
      to set it up. Free consultation, no sales rep — just the contractor
      who will actually run the job.

  - q: "What brands and finishes do Kent homeowners typically choose for remodels?"
    a: |
      Most East Hill projects land in the KitchenAid and Bosch range for
      appliances — mid-tier that's solid without being mismatched to the
      neighborhood. Plumbing fixtures typically go Kohler or Moen. On larger
      jobs in the $150K+ range, some clients spec Sub-Zero refrigeration and
      semi-custom cabinetry. We work with whatever the client selects and
      coordinate delivery around the installation sequence.

  - q: "How long does a full kitchen remodel take in Kent, and what's the permit process?"
    a: |
      Full kitchen gut-and-rebuild: six to ten weeks from permit approval
      to punch list and blue tape walkthrough. City of Kent plan review for
      a remodel involving electrical and plumbing changes runs three to six
      weeks — submit early, because the clock doesn't start until the
      application is in. Deadline penalties for missed milestones are written
      into every TopVolk contract.