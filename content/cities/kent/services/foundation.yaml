title: "Kent Foundation Repair — Valley Settling, Seismic Retrofit & Drainage"

intro: |
  Sitting on the Green River Valley floor puts 98030 and 98032 homes on compressible alluvial silt — not the glacial till up on East Hill. That distinction matters every wet season. Valley-floor homes from the 1960s and 70s shift seasonally, and the first signs often show up inside: a Whirlpool water heater sitting visibly off-plumb, or drain connections pulling apart under the crawlspace. Those aren't appliance problems. They're foundation problems.

  October through April, the Green River corridor saturates. Soil that holds up fine in a dry August starts to compress and migrate when the water table climbs. Post-and-pier foundations that were shimmed level in 1975 aren't necessarily level now.

localContext: |
  East Hill addresses in 98042 sit on more stable glacial till ground. Down in the valley — along the 98030 and 98032 corridors near the Riverbend area and south toward SE 240th Street — homes are on alluvial fill with a water table that climbs hard from October through April. During the wettest stretches, water can pool within 18 inches of the surface in low-lying lots near the Green River Natural Resources Area.

  Most of Kent's residential stock is 1960s to 1980s ranch-style construction with crawlspace foundations and post-and-pier supports. Builder-grade lumber from that era wasn't pressure-treated for ground contact — decades of PNW moisture have worked on it. A handful of older homes near downtown Kent have poured concrete stem walls that have been absorbing that same moisture cycle for 50-plus years. The Meridian corridor and neighborhoods off James Street show both types in adjacent blocks, so a proper diagnosis starts with identifying exactly what's under the house before anything else.

commonProblems:
  - title: "Post-and-Pier Settling on Kent Valley-Floor Crawlspaces"
    description: "Compressible silt lets pier footings sink unevenly — the floor above follows. You feel it as a slope across the living room or a soft spot near the kitchen. Leveling and shimming post-and-pier supports corrects the visible sag. Simpson Strong-Tie adjustable column bases replace deteriorated wood blocking and hold position long-term. Drainage redirection addresses why the footings moved in the first place. In saturated valley-floor conditions, adding a vapor barrier across the crawlspace floor is part of the repair, not an optional upgrade — uncontrolled ground moisture is what accelerated the wood deterioration. A DriCore subfloor panel or 6-mil poly sheet, properly lapped and pinned to the stem wall, cuts that moisture source significantly."
  - title: "Seismic Retrofit: Mudsill Bolting and Cripple Wall Bracing"
    description: "Pre-1980 ranchers throughout Kent — common along SE 240th and the Meridian corridor — typically have no anchor bolts connecting the mudsill to the concrete foundation. A seismic event can slide the structure right off. Retrofit scope includes through-bolting the mudsill with 5/8-inch anchor bolts at 6-foot intervals, shear wall plywood on cripple walls using 15/32 structural-grade panels with 4-inch edge nailing, and bringing the assembly to current WA seismic code per AHJ requirements. King County DPER and the City of Kent Building Division both require engineered drawings for this scope of work. Plan review typically runs 3–5 weeks through Kent's permit center. The finished assembly needs a rough-in inspection before the crawlspace access gets closed back up."
  - title: "Concrete Crack Repair and Sump Installation for High Water Table"
    description: "Poured stem walls in older Kent homes crack as the ground moves. Hairline fractures widen, water follows them in. Epoxy injection seals active cracks and restores structural integrity. In low-lying valley-floor homes near 98030 — particularly lots within a half-mile of the Green River — a Zoeller sump pump with interior drainage tile handles the rising groundwater that's driving the cracking. Without addressing the hydrostatic pressure, an epoxy repair is temporary at best. Interior drain tile runs along the footing perimeter, channels water to the sump basin, and gives the pump a defined collection point rather than letting water find its own path through the wall. That system requires a dedicated 20-amp circuit, which is part of the permit scope."

faq:
  - q: "How fast can you get to Kent for Foundation Repair?"
    a: "Kent is a regular stop. East Hill, the valley floor, Meridian — we work across 98030, 98031, and 98042 routinely. Most consultations book within a week. Call (206) 591-1096 to check current availability and schedule a free on-site walkthrough with Vladislav directly. You're talking to the owner, not a sales coordinator."
  - q: "Can foundation settling damage our plumbing or appliances?"
    a: "It happens more than people expect. A sagging crawlspace puts mechanical stress on supply and drain lines. GE and Whirlpool water heaters sitting on a tilting slab develop connection issues at the flue and water supply fittings. LG washer platforms level out only after the subfloor is addressed. Samsung refrigerators with built-in ice makers start throwing level errors when the floor slope exceeds a quarter inch over six feet. The root cause is always the foundation, not the equipment."
  - q: "What does foundation repair cost in Kent, and who pulls the permits?"
    a: "Crawlspace leveling with vapor barrier runs roughly $8K–$15K depending on pier count and access. A full seismic retrofit on a 1970s rancher — mudsill bolting plus cripple wall plywood — runs $15K–$35K. Sump installation with drain tile adds $4K–$8K on top of crack repair. Permit-required work goes through the City of Kent's Building Division — plan review typically takes 3–6 weeks. Vladislav handles permitting directly. WA Licensed Contractor, 100+ projects completed since 2017, and missed-deadline penalties written into every contract. Call (206) 591-1096 to schedule an on-site estimate."