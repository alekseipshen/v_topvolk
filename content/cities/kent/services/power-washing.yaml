title: "Kent Power Washing — Moss, Algae, and Surface Prep"

intro: |
  East Hill subdivisions in Kent get more shade than people realize, and
  the results show up every spring — cedar fences coated in green, concrete
  driveways stained with tire marks, and Hardie cement-board siding that's
  been collecting mildew since October. Surface condition decides whether
  a stain or exterior repaint lasts three years or eight. TopVolk has handled
  exterior prep on 100+ projects since 2023 across King County, and power
  washing is where most of that work starts.

  That's not a marketing line. Stain applied over embedded moss fails by the
  following winter. Primer over mildew-filmed Hardie panels loses adhesion
  before the second rainy season. Prep is the job.

localContext: |
  The bulk of Kent's residential stock in zip codes 98030 and 98042 went up
  between the late 1970s and mid-1990s — tract homes with poured concrete
  driveways, wood privacy fences, and either cedar or composite decks. Those
  surfaces sit under 37 inches of annual rainfall. East Hill's north-facing
  elevations barely dry out between November and April, which means organic
  buildup isn't just cosmetic by the time spring arrives — it's embedded in
  the substrate.

  The Meridian area along 104th Ave SE sees especially heavy tree canopy
  from the green belt parcels. Shaded driveways and fences in that corridor
  build up moss significantly faster than south-facing lots near Kent Station
  or in the flatter sections of 98031. Different microclimates, different
  maintenance windows, same annual rainfall total.

  West Hill and the neighborhoods closer to SR-167 tend to have more
  exposed surfaces — less canopy, but more road grime and tire oxidation
  from proximity to the industrial corridors on Valley Highway. The staining
  pattern is different. Hot water pressure washing plus a rotary surface
  cleaner handles the petroleum-based buildup there better than cold rinse
  alone.

commonProblems:
  - title: "Moss on cedar decks — the biology problem, not just a dirt problem"
    description: |
      Cedar decking in Kent's 98042 neighborhoods turns visibly green by late
      fall. That's biological growth working into the wood grain, not surface film
      you can rinse off. Pressure washing at the correct PSI removes the moss
      without blowing out soft-grain fibers, so stain or sealer can actually
      penetrate the substrate. Paint or sealant applied over live moss fails fast —
      typically within one PNW winter.

      Timing matters too. Best window to wash and restain cedar in Kent is
      late April through June — after the heavy rain but before summer heat
      bakes existing mildew deeper into the grain. A 2,000-square-foot cedar
      fence run can take a full day to wash, dry, and prep correctly. Rushing
      the dry time is how stain jobs peel early.

  - title: "Concrete driveways — oil, tire oxidation, and hard mineral deposits"
    description: |
      1980s-90s Kent tract homes typically have 20-to-30-foot poured concrete
      driveways. Years of motor oil drips and brake dust bond into the pores.
      Cold water pressure washing alone won't cut petroleum residue — you need
      a hot-water unit with a rotary surface cleaner head. This matters especially
      before concrete sealer or any decorative coating goes down.

      Calcium and mineral deposits from Kent's water table also streak older
      slabs near downspout discharge points. Those require a different approach
      than oil — acid-based pre-treatment, then rinse. Combining the two
      cleaning chemistries without sequence control just makes a mess. The
      rotary head and correct dwell time on the degreaser do the actual work.

  - title: "Hardie siding clouding before exterior repaint"
    description: |
      Hardie cement-board resists rot, but it still accumulates atmospheric
      grime and mildew — especially on west- and north-facing walls. Painting
      over that film traps moisture and causes premature adhesion failure. The
      fix is low-pressure soft wash on the panels, full rinse, then drying time
      before primer contacts the board. Skipping this step voids most paint
      manufacturer warranties.

      Most Kent homes in 98030 that are coming up on their 30-year mark have
      original Hardie installs. Those panels are still structurally sound, but
      the factory finish has weathered enough that surface prep before repainting
      is non-negotiable. Vladislav walks the elevations during the consultation
      and identifies any panels with active separation or failed caulk at the
      lap joints — those get flagged before paint scheduling, not discovered
      mid-project.

faq:
  - q: "How fast can you get to Kent for power washing?"
    a: |
      Kent is a regular stop in our King County project rotation — we're in
      98030, 98031, and 98042 multiple times a month. Vladislav does the
      consultation himself. Call (206) 591-1096 and we'll check current
      availability. Most slots book 2-3 weeks out. If you're coordinating
      power washing ahead of an exterior paint project, give us a 4-week
      lead — the wash and dry cycle needs to complete before primer scheduling.

  - q: "Can you wash Trex or TimberTech composite decking without damaging it?"
    a: |
      Yes, but the approach is different from cedar. Composite decking like Trex
      and TimberTech requires lower PSI — under 1,500 — a wider fan tip, and no
      bleach-based cleaners. Cedar tolerates more pressure. Composites don't.
      We've done both across dozens of King County decks. WA Licensed Contractor,
      so this isn't guesswork.

      One thing to watch: older Trex (pre-2010 formula) can show surface
      scratching even at moderate PSI if the tip angle is wrong. If your deck
      was installed before 2010, mention that when you call — it changes the
      tip and distance setup.

  - q: "What does power washing typically cost for a Kent home, and is same-day available?"
    a: |
      Pricing depends on surface type and square footage — a single deck quotes
      differently than a driveway, fence, and siding pass combined. Vladislav
      walks the property and gives a line-item number on the spot, no vague
      ranges. Same-day slots are rare; same-week is realistic. Call
      (206) 591-1096 to check.

      Deadline commitments are written into the contract. If we miss the agreed
      schedule, there are penalties — that's not a sales pitch, it's in the
      paperwork. For paint-prep sequencing especially, hitting the wash date
      matters, and homeowners deserve a contractor who's accountable to that.