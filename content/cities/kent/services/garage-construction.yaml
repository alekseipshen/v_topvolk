title: "Kent Garage Construction — Detached, ADU-Ready, EV Pre-Wire"

intro: |
  East Hill in zip code 98042 is lined with 1980s and 1990s tract homes — solid lots,
  mostly 6,000–8,000 square feet, but almost all built with a single attached garage that
  barely fits a modern F-150. Vladislav Volkov has built detached garages and garage-plus-DADU
  structures across Kent, from Panther Lake to the Lake Meridian corridor. Under WA HB 1337
  you may qualify to add a habitable unit above a new detached garage on the same lot — worth
  figuring out before you pour the slab.

  That conversation happens at the first site visit. Not over the phone, not with a salesperson.
  WA Licensed Contractor, 100+ projects since 2023.

localContext: |
  Zip codes 98030 and 98031 cover West Hill and Downtown Kent — older stock, some 1960s
  ranch-style, some post-war bungalows. Setback requirements vary depending on whether
  your parcel sits inside Kent city limits or unincorporated King County DPER jurisdiction.
  Getting that confirmed early changes the footprint you can actually build.

  East Hill (98042) tends to have more room on the lot, but lot coverage and FAR limits still
  cap how much structure you can add. The Green River separates East Hill from downtown
  geographically and also from a drainage and soil perspective — worth knowing before anyone
  starts talking foundation depth. Kent's permit center handles its own plan review separately
  from King County DPER, so the submission portal and timeline differ depending on your address.

commonProblems:
  - title: "Garage-with-DADU permit complexity under WA HB 1337"
    description: "Adding a habitable DADU above a new detached garage is now legal statewide
      under WA HB 1337 (2024), but Kent still requires full plan review through its own
      permit center — not King County DPER. The second floor load means LVL beams and
      engineered joist hangers, not standard dimensional lumber. Height limit for a DADU
      is typically 24 feet, and the stair access layout affects your usable footprint
      on the ground level.

      Hardie cement-board siding on the exterior handles Kent's wet winters better than
      wood lap — rot resistance matters on a north-facing wall that sees moss by year three.
      Separate utility connections for the DADU — water, electrical service, possibly gas —
      are required by code for a legal rental unit and need to be coordinated with the
      utility companies during the permit phase, not after rough-in inspection."

  - title: "Concrete slab performance on Kent's clay-heavy valley floor"
    description: "Kent sits in the Green River valley with expansive clay soils that move
      after every wet season — and October through May brings close to 37 inches of rain
      on average. A 4-inch fiber-reinforced slab with vapor barrier underneath and
      compacted gravel base isn't a luxury; it's what keeps the floor level in year five.
      Control joint placement and rebar grid layout matter on any pour over 400 square feet,
      especially if you're planning a workshop with heavy equipment.

      Soil reports matter here, not just compaction tests. Some East Hill parcels have fill
      layers from old grading work — that changes the subbase spec entirely. Budget for a
      soils assessment on larger slabs before finalizing the slab design."

  - title: "EV charger pre-wire skipped during framing — expensive later"
    description: "Roughing in a 50A or 60A dedicated circuit for a Tesla Wall Connector or
      Leviton EVSE during construction costs a fraction of what it takes to run conduit
      through a finished wall after drywall is up. East Hill households increasingly run
      two EVs. Getting the subpanel location and panel capacity right during the build —
      coordinating with the electrician at rough-in inspection — avoids a second permit
      and a second contractor mobilization.

      A 200A main panel feeding the house plus two EV chargers plus a workshop subpanel
      needs to be sized correctly from day one. An undersized panel means a costly
      upgrade mid-project or a forced choice between charging capacity and shop tools."

faq:
  - q: "How soon can TopVolk start a garage build in Kent?"
    a: "Kent is a regular stop — Vladislav covers all of King County. From first on-site
      visit to permit submittal at Kent's permit center typically takes 2–3 weeks. After
      permit issuance, a standard two-car detached garage runs 4–6 weeks of active
      construction. Call (206) 591-1096 to schedule a free on-site estimate."

  - q: "What garage door products hold up in Kent's wet climate?"
    a: "Clopay and Amarr both make insulated steel doors with polyurethane core — better
      moisture resistance than polystyrene-panel options. Insulated sections plus proper
      weatherstripping at the bottom seal matter more here than they would in a dry climate.
      Threshold installation and opener pre-wire are included in the build scope."

  - q: "What does a garage build in Kent cost, and how does permitting work?"
    a: "A detached two-car garage in Kent typically runs $45,000–$80,000 depending on
      size, finish level, and whether you're roughing in for a DADU above. Permit
      submittal goes through Kent's online portal — plan review for a garage-only build
      is usually 3–6 weeks; add 4–8 weeks if there's a DADU component.

      Vladislav provides a line-item quote after the site visit — not a range pulled from
      a spreadsheet. Deadline penalties are written into the contract, not just mentioned
      verbally. Call (206) 591-1096 or schedule a free on-site consultation."