title: "Kent Basement Finishing — From Wet Storage to Finished Rooms"

intro: |
  Ranch homes on East Hill — most built between 1975 and 1995, especially
  in the 98042 zip — were delivered with unfinished basements that ended up
  holding the furnace, a Whirlpool washer-dryer stack, and boxes nobody
  opened since 2011. The Green River Valley's high seasonal water table
  means those same basements take on groundwater every November. Finishing
  that space the right way starts with waterproofing before a single stud
  gets framed. Done correctly, a finished Kent basement adds a bedroom,
  home office, or rec room without touching the footprint — and at a cost
  per square foot well below what a full addition runs through City of Kent
  permitting.

localContext: |
  East Hill is the densest residential pocket in Kent, and the housing
  there is almost entirely builder-grade tract construction from the late
  1970s through mid-1990s. Many split-levels and ranchers in 98042 have
  basements with roughly 7-foot 4-inch rough ceilings — workable, barely,
  once ductwork and mechanical runs eat into it. Valley-floor homes near
  the Green River Trail (98032) run into a different problem: older
  poured-concrete walls with no exterior waterproofing membrane and no
  interior drain tile. West Hill is a different story — steeper lots with
  daylight basements, which have better natural drainage but often need
  updated framing to meet current blocking and fire-stop requirements
  under the City of Kent's adopted IRC amendments. Permit review for
  basement finishing in Kent typically runs 4–8 weeks through the City's
  building department, separate from King County DPER jurisdiction that
  applies to unincorporated pockets further east.

commonProblems:
  - title: "Perimeter Water Intrusion — Solve It Before Framing Starts"
    description: |
      Kent gets around 37 inches of rain annually, and the heaviest of it
      lands between October and April. Block and poured-concrete foundations
      on East Hill built in the 1980s typically have no interior drain tile.
      Water follows the wall-to-slab joint straight in. We install a
      perimeter French drain, a sump pump with battery backup, and a 6-mil
      vapor barrier before DriCore subfloor panels go down — otherwise
      moisture just traps under your new floor. The sump discharge line
      runs to daylight or a dry well clear of the foundation; a battery
      backup unit keeps the pump running during the November storms that
      tend to knock out East Hill power for hours at a stretch.
  - title: "Ceiling Height After Mechanical Rerouting"
    description: |
      A forced-air trunk running down the basement centerline on 1980s East
      Hill split-levels typically drops finished ceiling height to 6 feet
      8 inches. Legal per IRC, but uncomfortably tight for daily living.
      Rerouting the trunk to the perimeter — and using LVL beam work where
      we need to clear a load path — recovers 6 to 8 inches of headroom.
      LVL sizing gets engineered to the span; a 3-ply 1¾-inch LVL is
      common for the 18–22 foot spans typical of 98042 ranchers. That
      difference turns a space people avoid into one they actually use.
  - title: "Egress Windows for Code-Compliant Bedrooms"
    description: |
      Any room classified as a bedroom in a finished Kent basement requires
      an egress window with a minimum 5.7 sq ft net clear opening under IRC
      and the City of Kent building code. Most 1980s homes in 98042 have
      undersized hopper windows that fail that threshold. We cut the rough
      opening, frame it to spec, install a window well sized for egress,
      and fold the window work into the full permit scope — one plan review,
      one permit fee.

faq:
  - q: "How fast can you get to Kent for a basement consultation?"
    a: |
      Kent — East Hill, the Valley, West Hill — is a regular stop. Call
      (206) 591-1096 to schedule a free on-site consultation. Vladislav
      does the site visit himself. No sales staff, no estimation coordinator
      — you talk directly to the contractor who will run the project.
  - q: "What HVAC setup works best for a finished Kent basement?"
    a: |
      A Mitsubishi mini-split is the clean answer for most Kent basements:
      no new ductwork extension, better humidity control than extending the
      existing furnace, and independent zone control. Valley-floor homes in
      98032 see higher ambient humidity October through March; a mini-split
      with a built-in dehumidification mode handles that load without a
      separate unit. We spec the unit based on finished square footage,
      ceiling height, and whether the space includes a bathroom with shower
      humidity load.
  - q: "What does a full Kent basement finish cost, and how long does it take?"
    a: |
      A typical 600–800 sq ft Kent basement finish runs $45,000–$85,000
      depending on bathroom rough-in, egress cuts, and finish-level choices.
      City of Kent permit review for a basement finish averages 4–8 weeks
      from submission to approval; we submit a full drawing set upfront to
      avoid back-and-forth with the plan reviewer. Rough-in inspection,
      insulation inspection, and final inspection each add a few days to
      schedule around. Total timeline from permit submission through blue
      tape walkthrough is usually 10–16 weeks. TopVolk is WA Licensed
      Contractor, 100+ projects completed since 2023, and deadline
      penalties are written into the contract — not just mentioned in a pitch.