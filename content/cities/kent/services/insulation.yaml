title: "Kent Insulation Contractor — R-49 Attic & Crawl Space Work"

intro: |
  East Hill tract builds from the 1980s and 90s — the dense residential development
  stretching through the 98042 zip code toward Lake Meridian Park — came standard
  with R-11 to R-19 attic insulation. Code-minimum at the time, not today. A Carrier
  forced-air unit serving a typical 1,800-square-foot home at R-19 runs noticeably
  longer every October through April than it needs to — and the heating bills reflect
  it. TopVolk upgrades attic assemblies to current Seattle Energy Code: R-49 minimum,
  closed-cell spray foam on rim joists, and full crawl space encapsulation where
  moisture has already done damage.

localContext: |
  The Valley Floor zip codes — 98030 and 98031 — hold a mix of 1960s-70s ranch-style
  builds and early 80s tract construction, many sitting over unencapsulated crawl
  spaces with no vapor barrier. Homes in older East Hill subdivisions near Clark Lake
  Park frequently show fiberglass batt that's compressed from decades of moisture
  exposure, or missing entirely from joist bays beneath the subfloor. Kent averages
  over 37 inches of rainfall annually. That moisture finds its way through foundation
  vents, and in homes this age the original insulation rarely survives intact.

commonProblems:
  - title: "Attic Under-Insulation in 1980s-90s East Hill Tract Builds"
    description: |
      Most East Hill builds left the attic at R-19 or less — code-minimum in the
      mid-1980s, but well below the current Seattle Energy Code requirement of R-49.
      Blown-in cellulose fills irregular joist bays better than replacing existing
      batt, and it doesn't compress at the eaves or around the rim joist the way
      fiberglass tends to after a decade of humidity cycling. PSE offers rebates for
      attic upgrades that typically run $400-$800 depending on square footage and
      existing R-value.

  - title: "Moisture-Damaged Crawl Space Insulation in 98030"
    description: |
      Kent's Valley Floor sits in a drainage basin with a seasonal high water table.
      Homes in the 98030 zip — many built between 1965 and 1985 — frequently have
      fiberglass batt stapled to the subfloor that has long since absorbed moisture,
      sagged, and detached from the joist bays. Full crawl space encapsulation means
      removing the damaged material, installing a 20-mil vapor barrier across the
      ground plane, and adding rigid foam board against the foundation walls. King
      County DPER issues the permit for the mechanical scope within this assembly.

  - title: "Rim Joist Air Leakage on Mid-Century Ranchers in 98031"
    description: |
      Air infiltration through the rim joist accounts for a significant share of heat
      loss in 1960s-70s ranchers — a common building type throughout 98031 and the
      valley corridor between Kent and Auburn. Two inches of closed-cell spray foam
      at the rim joist seals the air gap and delivers approximately R-12 at that
      connection. It also addresses moisture intrusion at the sill plate, which
      matters in homes that have sat over a vented crawl space for 50-plus years.
      PSE includes rim joist air sealing in their residential rebate program.

faq:
  - q: "How fast can you get to Kent for insulation work?"
    a: |
      Kent is a regular part of the service area — we come down SR-167 or SR-516
      depending on where the job is. Initial on-site consultations can typically be
      scheduled within a week. TopVolk is a WA Licensed Contractor with 100+ projects
      completed since 2023. Call (206) 591-1096 — Vladislav handles the consultation
      directly, not a salesperson.

  - q: "What insulation materials and brands do you work with?"
    a: |
      Blown-in cellulose from Johns Manville and Owens Corning fiberglass batt cover
      most attic and wall assemblies. Rockwool mineral wool is the right call for
      soundproofing between floors during full remodels — significantly better
      acoustic performance than standard fiberglass. For rim joists and band joists,
      two-part closed-cell spray foam is standard. Material choice depends on the
      assembly, existing conditions, and applicable rebate incentives — all of which
      we cover at the site visit.

  - q: "What does an insulation project cost and how does permitting work in Kent?"
    a: |
      Crawl space encapsulation typically runs $3,000-$8,000 depending on square
      footage and existing condition. Attic upgrades to R-49 fall in the $2,500-$6,000
      range for most Kent homes. Permits go through the Kent Building Department —
      smaller air sealing scopes often don't require a permit at all. PSE rebates can
      offset a meaningful portion of the total cost. Deadline penalty is written into
      every TopVolk contract. Call (206) 591-1096 for a line-item estimate.