title: "Bremerton Power Washing — Cedar, Concrete & Hardie Siding Prep"

intro: |
  Salt air off Puget Sound accelerates biological growth on every exterior surface in
  Bremerton that doesn't see direct afternoon sun — and given the Douglas-fir canopy
  above Manette and the north-facing hillside lots in Charleston, that's most of them.
  The 1940s Cape Cod and craftsman homes built for shipyard workers at Naval Base Kitsap
  have cedar siding and fir decking that's been through decades of wet seasons, and by
  spring those surfaces are carrying moss, oxidized grain, and mildew that no amount of
  rain rinse clears on its own. Power washing here isn't cosmetic work — it's substrate
  prep. Hardie cement-board siding needs a clean surface before primer bonds correctly,
  and cedar deck boards need dead surface fibers removed before a penetrating oil like
  Armstrong Clark actually soaks into the wood rather than sitting on top of the gray
  layer. Vladislav adjusts tip pressure and dwell time by surface type — 1,200-1,500
  PSI with a 40-degree tip on cedar, soft wash at 500-800 PSI on Hardie lap joints —
  because getting it wrong strips grain or forces water behind the cladding. Call
  (206) 591-1096 to schedule a free on-site assessment before your exterior project
  starts.

localContext: |
  Bremerton's housing stock runs older than most of King County. Manette, east of the
  Manette Bridge in the 98310 zip, is dense with pre-war bungalows — original cedar
  siding on post-and-pier foundations, narrow lots with mature tree canopy that keeps
  surfaces shaded and damp through May. Over in 98312, the West Bremerton blocks along
  Wheaton Way and toward Loxie Eagans Boulevard mix mid-century ranchers with post-war
  Cape Cods, many with unsealed concrete driveways poured in the 1950s that have been
  absorbing motor oil and tire rubber ever since. Fog rolling off Puget Sound between
  October and March keeps surface humidity elevated even on dry days — mildew doesn't
  need standing water, just shade and still air, both of which are standard in this
  part of Kitsap County. Some newer HOA subdivisions on Bremerton's east side include
  exterior maintenance language that requires documented cleaning before a repaint.
  Knowing which surfaces tolerate pressure and which need a surfactant-only soft wash
  is the difference between good prep and a warranty call six months later.

commonProblems:
  - title: "Moss and Algae on North-Facing Cedar Decks in Manette and Charleston"
    description: |
      Cedar deck boards shaded by Douglas-fir overhang stay damp from October through
      April, and Gloeocapsa magma — the algae species responsible for dark biological
      streaking — establishes in the surface pores within a single wet season. A garden
      hose won't touch it. The correct sequence is a low-pressure pre-soak with a
      sodium hypochlorite solution (3-5% diluted from pool shock), a 10-15 minute dwell
      time, then a pressure rinse at 1,200-1,500 PSI with a 40-degree tip to avoid
      raising the grain. Scrubbing with a stiff-bristle brush after the chemical dwell
      clears residual biofilm that pressure alone misses. Staining over active biological
      growth fails within one season — a penetrating product like Defy Extreme or
      Armstrong Clark needs clean, open wood fibers to bond. Budget $350-$600 for a
      400-500 sq ft deck depending on infestation level and site access.

  - title: "Hardie Siding and Stucco Cleaning Before Exterior Repaint"
    description: |
      James Hardie lap siding handles Kitsap's wet climate well structurally, but the
      painted surface accumulates chalk, mildew, and airborne algae spores that bond
      to the existing coat. Painting over contamination causes delamination — new primer
      never contacts the actual substrate, and the coat peels within 12-18 months.
      Soft washing at 500-800 PSI with a surfactant solution is the right approach on
      Hardie; high-pressure direct spray on lap joints drives water behind the boards
      and compromises the vapor barrier behind the sheathing. On 1950s stucco surfaces
      — present on some older Bremerton homes — the same principle applies: surfactant
      soak, then a top-down rinse at controlled pressure. After cleaning, a 48-hour dry
      window is required before primer. This exterior cleaning step typically runs
      $400-$700 for a 1,500-1,800 sq ft home, depending on story count and surface
      condition.

  - title: "Concrete Driveway Oil Stain Removal in West Bremerton's 98312 Zip"
    description: |
      The 1950s and early 1960s concrete driveways common along Wheaton Way and the
      adjacent residential blocks in 98312 are porous by modern standards — unsealed,
      low-PSI mix that absorbs motor oil quickly and holds it. Surface degreaser applied
      to dry concrete, scrubbed in with a stiff deck brush, then pulled up with a
      rotating surface cleaner attachment spinning at 3,000 PSI covers flat areas
      efficiently without the striping pattern a direct wand leaves. Hot water extraction
      at 180-200°F is the correct tool for older embedded petroleum stains — commercial
      hot-water units break down hydrocarbon chains that cold water pressure alone cannot
      lift. Two-pass treatment is usually required on stains polymerizing in the slab for
      years. Post-clean, a penetrating sealer like Ghostshield Lithi-Tek 4500 closes the
      pores and dramatically speeds the next cleaning cycle. Flat driveway cleaning runs
      $150-$300; oil stain treatment adds $75-$150 depending on severity.

  - title: "Cedar Fence Cleaning Before Staining — The 3-5 Year Kitsap Cycle"
    description: |
      Untreated cedar fence boards in Bremerton gray out within 18-24 months and start
      pulling surface checks by year three. The standard maintenance cycle in Kitsap
      County is clean and re-stain every 3-5 years, and skipping the clean step is the
      most common reason stain jobs fail early. After the initial pressure wash, an
      oxalic acid wood brightener application neutralizes the gray oxidation and opens
      wood fibers so stain absorbs evenly — without this step, semi-transparent stain
      goes on blotchy at the gray patches and peels at those spots within one season.
      Olympic Maximum Semi-Transparent and Cabot Australian Timber Oil are both solid
      options for western red cedar in this climate. Fence cleaning runs $1.50-$2.50
      per linear foot depending on fence height and vegetation encroachment; a
      100-linear-foot section with oxalic brightener treatment lands at $200-$350
      before staining begins.

  - title: "Patio Paver Restoration — Organic Buildup on Shaded Bremerton Backyards"
    description: |
      Concrete pavers and poured patios in shaded Bremerton backyards accumulate green
      algae, black mold, and compacted organic debris from tree drop over two or three
      wet seasons. The slippery surface is the first complaint; staining comes second.
      A rotating surface cleaner attachment covers paver fields without blowing out the
      joint sand — direct wand spray on pavers displaces polymeric sand and destabilizes
      the field, requiring re-sanding before the surface is usable again. After cleaning,
      joint sand replacement with TECHNISEAL HP+ polymeric sand re-locks the field and
      resists future organic infiltration better than standard mason sand. The complete
      sequence — clean, rinse, dry, re-sand joints, seal with matte penetrating sealer
      — runs $500-$900 for a 300-400 sq ft patio. Sealing with a breathable penetrating
      product after cleaning reliably adds 2-3 years to the maintenance cycle in
      Kitsap's climate.

