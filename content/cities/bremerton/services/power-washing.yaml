  - q: "What does power washing a house exterior cost in Bremerton?"
    a: |
      Single-story home exteriors in the 1,200-1,600 sq ft range typically run $350-$550
      for a standard soft wash. Two-story homes or those with heavy moss buildup or
      complex rooflines push into the $550-$900 range. Cedar deck prep with oxalic
      brightener runs $350-$600 for a 400 sq ft deck; concrete driveways add $150-$300
      depending on square footage and stain severity. Pricing shifts based on access,
      surface condition, and whether chemical treatment is needed beyond pressure alone.
      TopVolk provides a written line-item quote on-site — not a range, but the actual
      number. Missed project deadlines carry a written financial penalty in the contract,
      and that same discipline applies to showing up on estimate day.

  - q: "Does Bremerton require permits for power washing, or do HOAs have rules about it?"
    a: |
      Standalone power washing of residential surfaces doesn't require a City of
      Bremerton building permit through the Community Development department. That said,
      some newer subdivisions on Bremerton's east side have HOA exterior maintenance
      guidelines specifying approved cleaning methods or requiring written notification
      before exterior prep work. If the cleaning is part of a larger permitted scope —
      a deck refinishing or exterior repaint that crosses the permit threshold — the
      cleaning gets documented as part of that project. TopVolk is a WA Licensed
      Contractor and handles permit coordination for associated structural or finishing
      work when needed, including pulling documentation required by HOA review boards
      before work starts.

  - q: "Do you use hot water or cold water pressure washing, and does it matter for my surfaces?"
    a: |
      It matters substantially on certain materials. Cold water at appropriate pressure
      handles most biological growth removal on concrete, pavers, and Hardie siding.
      Hot water extraction — 180-200°F from a commercial unit — is the right tool for
      motor oil and heavy petroleum stains embedded in older porous concrete driveways,
      common in Bremerton's 1950s-era 98312 stock. Hot water breaks down the hydrocarbon
      chains cold pressure alone cannot lift, especially on stains that have been
      polymerizing in the slab for years. On cedar and fir decking, hot water isn't
      used — it raises grain aggressively and drives moisture deeper into the wood
      fibers before they can be prepped for stain. The right tool depends on the
      contaminant and the substrate, not a one-size setting.

  - q: "How long does a power wash last before moss comes back in Kitsap County?"
    a: |
      On untreated cedar surfaces — decks and fences — moss and algae typically return
      within 12-18 months in Kitsap's climate without a follow-up stain or sealant
      applied within 48 hours of the clean. With Armstrong Clark penetrating oil applied
      correctly after the wash, the treated surface resists biological growth for 3-5
      years before the next cycle. Concrete and pavers without sealant see visible
      regrowth in 18-24 months in shaded areas. Sealing with a breathable penetrating
      product like Ghostshield extends that to 3-4 years on horizontal surfaces.
      Hardie siding after soft wash and a quality exterior repaint stays clean far longer
      — paint-grade surfaces don't hold moisture the way raw wood grain does.

