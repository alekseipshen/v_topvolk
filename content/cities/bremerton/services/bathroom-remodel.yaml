title: "Bremerton Bathroom Remodel — Navy Town Homes, Real Waterproofing"

intro: |
  Manette and East Bremerton are packed with post-WWII construction — homes built fast in the late 1940s and '50s to house Puget Sound Naval Shipyard workers and their families. Those bathrooms are mostly original: 4-inch subway tile, a Moen faucet from 1991, and an exhaust fan that's been fighting Puget Sound humidity since Clinton was president. Remodeling here means dealing with what's actually behind the walls, not what you hoped was there.

localContext: |
  Most of the housing stock in 98310 and 98312 dates to the 1945–1975 build cycle — small bath footprints, cast-iron drain stacks, and galvanized supply lines past their service life. West Bremerton near the shipyard corridor runs mostly single-story ranchers. The Manette neighborhood east of the Warren Avenue Bridge mixes Craftsman bungalows with mid-century builds. Both create the same problem: layouts that were never designed around a modern walk-in shower.

commonProblems:
  - title: "Cast-Iron Drain Stacks and Rerouting in 1950s Ranchers"
    description: "Homes built between 1948 and 1965 in 98310 typically have 3-inch cast-iron drain stacks that corrode from the inside out. A curbless shower conversion almost always requires rerouting the drain rough-in. Crawlspaces in this part of Bremerton are tight — budget time and cost for access, not just the pipe swap."
  - title: "Moisture Damage Behind Fiberglass Surrounds"
    description: "Bremerton gets the same 37 inches of annual rain Seattle does, and deferred maintenance is common in rentals and navy family housing. Fiberglass surrounds from the 1980s fail at the seams quietly. Strip one and you'll often find wet OSB or green board behind it — full substrate replacement with Schluter Kerdi membrane over Hardiebacker, not tile over moisture-wrecked drywall."
  - title: "Ventilation That Can't Handle PNW Humidity"
    description: "A 50 CFM exhaust fan venting into the attic — not outside — is the standard find in 98312 homes. Mold on ceiling joists, chronic grout discoloration, and peeling paint follow. Upgrading to a 110 CFM Panasonic unit with a direct exterior duct run changes the humidity equation, especially in a bathroom with a new walk-in shower and bench."

faq:
  - q: "How fast can you get to Bremerton for a bathroom remodel consultation?"
    a: "We drive the Hood Canal Bridge or catch the Bremerton-Seattle ferry depending on the day. Can usually schedule an on-site visit in East or West Bremerton within a week. Call (206) 591-1096 — you'll talk to Vladislav directly, not a scheduler."
  - q: "Do you work with Kohler and Moen fixtures during a Bremerton bathroom remodel?"
    a: "Both are everywhere in 98310 and 98312 homes. Kohler toilets, Moen shower valves, Rinnai tankless heaters when clients upgrade water supply as part of the remodel — handled. We quote fixtures line by line, no vague allowances."
  - q: "What does the permit process look like for a bathroom remodel in Bremerton?"
    a: "Work inside Bremerton city limits goes through the City of Bremerton permit center — plan review typically runs 3–5 weeks for a full bathroom remodel with layout changes. Vladislav handles the permit application and coordinates rough-in and final inspections. TopVolk is a WA Licensed Contractor, 100+ projects completed since 2017, and missed deadlines are penalized in the contract. Call (206) 591-1096 for a realistic scope-specific timeline."