title: "Bremerton Bathroom Remodel — Navy-Era Tile, Fixed for Good"

intro: |
  Navy housing built near the Puget Sound Naval Shipyard in the 1940s and '50s didn't come with quality bathrooms — it came with the minimum. Cast-iron tubs, 4-inch ceramic set over drywall backer, a Moen single-handle faucet that's been dripping since the Carter administration.

  The Manette neighborhood east of the Manette Bridge and the hillside streets in 98310 are packed with these bathrooms. So are the blocks running up from Sinclair Inlet toward the Naval Avenue corridor in 98314. PNW moisture is patient. Eventually, it wins.

localContext: |
  Most of Bremerton's residential stock in 98310, 98312, and 98314 was built between the 1940s and early 1970s — constructed fast to house Navy families reporting to Naval Base Kitsap, not to last a century. Tile went over greenboard or drywall, never a proper substrate, and cast-iron drain stacks in older homes near the Manette Bridge often need rerouting when a master bath layout changes.

  Slab-on-grade construction in the Westpark corridor means no crawlspace access.

  The Charleston neighborhood along 11th Street and the hillside blocks in East Bremerton (98312) are heavy with post-WWII tract homes: low-pitch roofs, small windows, and bathrooms untouched since the Reagan years. Over in Westpark and the Sylvan Way corridor (98310), mid-century ranchers on slab foundations add another layer of complexity — supply lines buried in concrete, layout changes that require saw-cutting the slab before any rough-in work begins. The Naval Avenue corridor in 98314 has similar stock: duplexes and small ranchers originally built as worker housing, now owner-occupied and long overdue for a real upgrade.

  Work inside city limits goes through the City of Bremerton building department. Unincorporated Kitsap County — including properties east of Wheaton Way closer to Silverdale — falls under Kitsap County DPER. Both jurisdictions require permits for any structural or plumbing change. Bremerton's plan review typically runs 3-6 weeks.

commonProblems:
  - title: "Failed Waterproofing Behind 1950s Tile Surrounds"
    description: |
      Tile set directly over drywall backer — standard in Bremerton homes built before 1975 — absorbs moisture for years before you see the damage. By the time the wall flexes, there's rot behind the substrate and likely into the subfloor.

      The fix is a full tear-out and rebuild: Schluter Kerdi membrane or RedGard coating over cement board before any new tile goes up. No surface patch survives Kitsap County humidity long-term. Every shortcut here gets redone within five years.

      In Manette and Charleston bungalows especially, that drywall backer has been wet for decades.

      It's not a repair situation — it's a gut and rebuild.

  - title: "Galvanized Supply Lines Choked With Mineral Buildup"
    description: |
      Pre-1970 Bremerton homes frequently have galvanized steel supply lines that have narrowed to a trickle from decades of iron and calcium deposits — you'll notice the pressure drop at the Kohler or Moen fixture before anything fails visibly. Rerouting to copper or PEX during a bath remodel is the right window, especially when adding a walk-in shower with a new rough-in and Schluter linear drain.

      Slab homes in Westpark make this more involved.

      Supply line rerouting in 98310 ranchers sometimes means running new lines through the attic and down interior walls rather than through the floor — because cutting the slab costs more than people expect. Vladislav scopes that during the site visit so the number in the quote reflects actual conditions. Call (206) 591-1096 to schedule.

  - title: "Undersized Exhaust Fans That Can't Handle Puget Sound Air"
    description: |
      Kitsap Peninsula gets Puget Sound moisture stacked on top of Seattle's standard 37 inches of annual rainfall.

      An original 1960s bath fan — sized for a closet — leaves humidity sitting, and mold reappears on north-facing walls within a season. Upgrading to a properly spec'd exhaust fan at the correct CFM rating, vented through the roof deck instead of the soffit, breaks the cycle. East Bremerton homes in 98312 face this constantly: the hillside exposures catch marine fog rolling in off Sinclair Inlet, and undersized ventilation just can't keep pace with that kind of moisture load. The result is visible mildew by October every year.

faq:
