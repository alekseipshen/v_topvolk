title: "Bremerton Door Installation — Salt Air, Rain, and Real Fixes"

intro: |
  Sinclair Inlet sits less than a mile from some of Bremerton's oldest
  residential blocks, and that salt-tinged air does a number on door hardware
  most homeowners don't notice until a deadbolt seizes or a threshold starts
  flaking rust onto the porch floor. Manette — with its 1920s and 1930s
  craftsman bungalows clustered east of the bridge — sees this constantly:
  original Douglas-fir doors that have soaked up eight decades of Puget Sound
  moisture, frames that have racked with seasonal settling, and weatherstripping
  so compressed it stopped sealing around 1998. Charleston, closer to the
  shipyard, has a different problem — mid-century homes built quickly for naval
  families where door rough openings were framed loose, and every decade of
  settling makes the swing worse. A Pella fiberglass unit or a Masonite steel
  prehung door, properly sill-pan flashed and shimmed into a corrected rough
  opening, changes the whole character of an entry and cuts the draft that was
  running the heating bill up all winter.

localContext: |
  Bremerton's housing stock runs a wide range. East Bremerton — the 98310 zip
  out toward Riddell Road and Wheaton Way — holds a lot of 1950s and 1960s
  ranchers built when naval base employment was at its peak. Doors in those
  homes are often the original steel or hollow-core wood units, frames painted
  over so many times the weatherstripping can't compress, and sill pans that
  were never properly flashed to begin with. Central Bremerton and the hillside
  neighborhoods running up toward Loxie Eagans Boulevard fall in the 98311 zip,
  mixing those same mid-century builds with 1980s and 1990s tract construction
  where builder-grade prehung doors were standard. Both zones see Kitsap
  County's full rainfall load — around 55 inches annually, noticeably wetter
  than Seattle proper — and the salt air off Sinclair Inlet adds a corrosion
  factor that contractors from drier parts of the region sometimes underestimate.
  Garage doors in the 98312 zone out toward Chico Creek face the same exposure,
  with insulated panel systems losing their perimeter seal integrity faster than
  most product warranties predict.

commonProblems:
  - title: "Salt Air Corrosion on Entry Door Hardware, Hinges, and Threshold"
    description: |
      Living within a mile of Sinclair Inlet puts door hardware in a coastal
      environment, even if the address doesn't feel that way. Zinc-plated hinges
      and standard deadbolt cases corrode from the inside out — the Schlage B60N
      is a common casualty, where the internal spring mechanism seizes before the
      exterior even shows obvious rust. Threshold assemblies take the worst of
      it: aluminum saddle thresholds with vinyl insert seals oxidize at the
      fastener points, the insert lifts, and you get a gap at the bottom even
      when the door is fully latched. The fix is a stainless-steel threshold
      plate with a replaceable EPDM door sweep, combined with a Schlage Encode
      or similar deadbolt in a marine-rated PVD finish. Hardware replacement
      alone runs $180–$320. Folding it into a full entry door unit swap gives
      better long-term value and lets you address the sill pan flashing at the
      same time.

  - title: "Wood Door Swelling, Rot, and Failed Jambs in Manette Craftsman Homes"
    description: |
      Manette's pre-war housing stock — roughly the blocks between Wheaton Way
      and the waterfront in 98310 — includes a lot of original Douglas-fir door
      frames and solid wood slabs that have been cycling through wet winters and
      dry summers for 80-plus years. By the time a door stops latching correctly,
      the jamb is often showing early rot at the door stop base where it meets
      the sill. Sistering a new jamb onto old framing doesn't hold if the rot has
      spread to the king stud. The correct sequence is a full rough opening
      tear-out, pressure-treated (PT) lumber sill replacement, self-adhering
      flashing membrane lapped over the sill pan, and a fiberglass door slab that
      won't repeat the same failure cycle. JELD-WEN's W-2500 fiberglass door —
      available in smooth or woodgrain skin — tolerates PNW humidity cycling
      better than painted wood and doesn't require repainting every three years
      to stay sealed.

  - title: "Kitsap County and City of Bremerton Permit Requirements for Door Work"
    description: |
      A straight like-for-like door swap — same rough opening, same size —
      typically doesn't require a permit in Bremerton. That changes fast. Adding
      a sidelight panel, converting a single door to a French door pair, or
      cutting a new exterior opening all require a permit and plan submittal.
      Kitsap County's Department of Community Development handles permits for
      unincorporated areas; the City of Bremerton Building Division covers
      addresses inside city limits. Plan review for residential exterior
      alterations typically runs 2–4 weeks. Structural work — like widening a
      rough opening to fit a 6-foot sliding patio door where a 36-inch door used
      to be — requires a stamped plan and often an LVL beam header sized to the
      new span. TopVolk is a WA Licensed Contractor and manages the permit
      application, drawings, and inspection scheduling. You don't need to figure
      out what the DCD portal requires.

  - title: "True Cost of Entry Door Replacement: Fiberglass vs. Steel vs. Wood"
    description: |
      Entry door replacement in Bremerton typically runs $1,200–$3,500 installed,
      depending on door material, glass options, hardware, and whether the rough
      opening needs correction. A Masonite steel prehung unit with a single
      sidelight and standard deadbolt prep lands in the $1,400–$1,900 range
      installed. Fiberglass — Pella's Therma-Tru line or the Andersen 400 Series
      — runs $2,000–$3,500 because the door skin holds up to PNW moisture cycling
      far better and doesn't need repainting. Solid wood remains available but
      rarely makes sense for a west-facing Bremerton entry that takes direct
      weather; budget an extra $500–$800 every 3–4 years for repainting alone.
      All figures include old unit removal, sill pan flashing, shimming, casing
      installation, and hardware. Call (206) 591-1096 for a free on-site estimate
      with exact line-item pricing — no vague ranges, no estimate creep at
      invoice.

  - title: "Weatherstripping, Door Bottoms, and Garage Door Insulation Upgrades"
    description: |
      A door that passes a visual inspection can still leak significant air if
      the weatherstripping is compressed flat or the door bottom doesn't contact
      the threshold consistently. Mid-century ranchers in the 98311 zip — the
      kind with original aluminum threshold saddles and foam-backed weatherstrip
      from the 1980s — lose measurable heat at the entry and garage access door
      combined. Replacing perimeter weatherstripping with a Q-Lon compression
      seal and installing an automatic door bottom instead of a static sweep
      makes a noticeable difference by November. Garage doors are worth
      addressing at the same time: insulated panels at R-12 or R-16 — Clopay's
      Gallery Steel series hits that range at a reasonable price point — help
      especially in attached-garage homes where the garage temperature directly
      pulls heat from the living space. Full weatherproofing on a single entry
      door runs $300–$600 in labor and materials, and it's one of the faster
      payback improvements available.

