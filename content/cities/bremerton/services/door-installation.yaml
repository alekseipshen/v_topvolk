  - q: "What does entry door replacement cost in Bremerton?"
    a: |
      For most Bremerton homes — mid-century ranchers in 98310 or 98311,
      craftsman bungalows in Manette, newer builds out toward Riddell Road —
      a complete entry door replacement runs $1,200–$3,500 installed. Steel
      doors sit at the lower end; fiberglass units from Pella or Andersen run
      higher but hold up better in salt-air, high-rainfall conditions. Garage
      door replacement with insulated panels is priced separately, typically
      $900–$1,800 installed for a single-car R-12 unit. Every TopVolk quote is
      fixed-price and fully itemized. No surprise charges at final invoice.
      Schedule a free on-site estimate at (206) 591-1096.

  - q: "Do I need a permit for door replacement in Bremerton or Kitsap County?"
    a: |
      Direct like-for-like swaps in the same rough opening — no size change,
      no new opening — generally don't require a permit through the City of
      Bremerton Building Division or Kitsap County DCD. Modifying the rough
      opening, adding sidelights, or converting to a French door configuration
      changes that. Those projects require a permit and, depending on wall
      framing, a plan submittal showing the header design. Kitsap County
      residential plan review typically runs 2–4 weeks. TopVolk is a WA
      Licensed Contractor and handles the permit application and inspection
      coordination when it's required — you don't need to manage the process
      or figure out what drawings the DCD portal requires.

  - q: "Can you install French doors or multi-slide patio door systems?"
    a: |
      Yes. It's a common upgrade in Bremerton homes where a 1970s or 1980s
      aluminum sliding door — usually foggy, drafty, and operating on worn
      rollers — gets replaced with a French door pair or a wider multi-slide
      system. Andersen's 200 Series and Pella's Impervia fiberglass patio doors
      both perform well in PNW conditions without the condensation problem of
      aluminum frames. Wider openings — going from a 6-foot slider to an 8-foot
      or 9-foot multi-panel system — require an LVL beam header sized to the new
      span and a permit submittal. That structural work adds $400–$900 to the
      project. Full patio door replacement with structural work included typically
      runs $3,500–$7,000 installed.

  - q: "What warranty covers a new door installation in Bremerton?"
    a: |
      Manufacturer warranties vary by product. Pella and Andersen carry limited
      lifetime warranties on fiberglass door slabs covering delamination, rot,
      and structural defects. JELD-WEN's fiberglass line offers similar coverage.
      Masonite steel doors typically carry a 10-year skin warranty and a lifetime
      frame warranty. Hardware runs separately — Schlage Encode includes a
      limited lifetime mechanical warranty and a 1-year electronics warranty.
      TopVolk's installation workmanship is warranted independently: if a door
      we installed develops a seal failure, swing problem, or threshold gap due
      to our work, we come back and correct it at no charge. Deadline commitments
      are written into every contract, with penalties if we miss the agreed
      completion date.

