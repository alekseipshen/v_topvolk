title: "Bremerton Tile Installation — Waterproofing That Holds in Puget Sound Air"

intro: |
  The post-WWII bungalows and cape cods packed along Wheaton Way and through the
  Manette neighborhood were built fast — shipyard workers needed housing, and
  bathrooms got 4×4 ceramic on greenboard and not much else. Those original
  installations are now 60 to 70 years old, and the constant moisture rolling in
  off Puget Sound has done its work. Greenboard was never actually waterproof; it
  just held together longer than standard drywall, and once water gets behind it
  the substrate goes soft, tiles loosen, and the floor underneath starts moving.
  By the time a homeowner in 98310 calls us, grout has crumbled at the shower base
  and there's often soft subfloor to address before any new tile goes down.
  TopVolk Construction LLC installs Schluter Kerdi waterproofing membrane directly
  to the studs, sets large-format porcelain in the 24×48 and 32×32 formats that
  homeowners are requesting right now, and frames shower niches with proper
  waterproofing detail — not just a hole cut into wet substrate and tiled over.
  Vladislav Volkov handles these projects personally. You're talking to the person
  actually setting the tile, not a scheduler working from a script.

localContext: |
  Bremerton's housing stock breaks roughly into two eras, and both create specific
  tile challenges. The shipyard-era homes concentrated in 98312 — the Charleston
  neighborhood, East Park, and the blocks near the Puget Sound Naval Shipyard gates
  — went up in the 1940s with post-and-pier foundations, narrow stud bays, and
  bathroom subfloors that have cycled through wet and dry conditions for decades.
  Those older frames are frequently out of plumb by ¾" to 1" across an 8-foot
  wall, which creates real problems when you're setting 24×48 large-format
  porcelain. Even a slight bow in the wall produces lippage — tile edges that catch
  your fingernail and, over time, crack. The 1960s and 1970s ranch homes spread
  across East Bremerton and the 98310 zip code are structurally more regular, but
  their original fiberglass tub surrounds and builder-grade 4×4 ceramic are
  overdue for replacement. Getting the substrate truly flat — typically with a
  Schluter Ditra uncoupling membrane or a self-leveling underlayment pour before
  setting — is where most of the real labor happens on a Bremerton tile job.

commonProblems:
  - title: "Greenboard Substrates Behind Old Tile — What Looks Fine Until You Demo It"
    description: |
      Pull the original tile off a 1940s or 1950s Bremerton shower wall and you'll
      usually find greenboard that has been wet for years. It crumbles in chunks.
      Greenboard was the standard substrate for decades, but it absorbs moisture
      steadily in a high-humidity bathroom — and in a climate averaging 37 inches
      of rain annually with marine air off Puget Sound year-round, those walls
      stay damp. The fix is a complete demo back to studs, followed by Schluter
      Kerdi waterproofing membrane bonded directly to the framing before any tile
      goes down. Kerdi creates a continuous bonded waterproof layer — not just a
      surface that sheds water, but a barrier that stops it at the wall plane. Cost
      for a full shower demo, Kerdi installation, and retile in a standard 36×36
      or 36×60 shower typically runs $4,500–$8,500 depending on tile selection,
      niche count, and whether the shower pan needs replacement as well. Timeline
      is usually 5–8 business days once materials are on-site.

  - title: "Large-Format Porcelain on Walls That Aren't Flat — Substrate Prep Before a Single Tile Goes Up"
    description: |
      A 24×48 porcelain slab will not tolerate a wall out of plumb by more than
      1/8" across 10 feet. On older Bremerton homes in the 98312 area, framing
      sometimes runs ¾" or more out of plumb from top to bottom, and that variance
      shows clearly in large-format tile. We map the wall with a laser level first,
      then apply a bonding agent and skim coat of self-leveling underlayment, or
      in some cases shim ¼" cement board to flat before tiling. Every large-format
      slab gets full back-buttering with a medium-bed mortar to eliminate voids
      underneath — voids are how tiles crack months after installation when foot
      traffic or thermal cycling creates point loads. Lippage on large-format tile
      is one of the most common callbacks in the industry. Avoiding it starts with
      a substrate that's actually ready, not just close enough.

  - title: "Heated Tile Floors and the City of Bremerton Permit Process"
    description: |
      Schluter Ditra-Heat and Warmup mat systems are popular in Bremerton bathroom
      remodels, especially for tile floors in older homes that never had any
      subfloor heating. Both systems embed a low-voltage heating cable within a
      tile uncoupling membrane, which simultaneously handles substrate crack
      isolation — a meaningful benefit over older subfloor assemblies in 1940s
      homes. The electrical connection, typically a 120V or 240V dedicated circuit
      with a programmable thermostat, requires an electrical permit through City
      of Bremerton Development Services. The rough-in inspection happens before any
      tile or drywall covers the new wiring. TopVolk Construction LLC is a WA
      Licensed Contractor and coordinates the permit and the licensed electrician
      as part of the project scope — homeowners don't manage two separate
      contractors or two permit applications. A heated floor rough-in adds roughly
      3–5 days to the overall project schedule depending on permit review speed,
      which has run 1–2 weeks for electrical-only scopes in Bremerton recently.

  - title: "What Tile Installation Actually Costs in a 1950s Bremerton Bathroom"
    description: |
      A basic bathroom floor retile — pulling old vinyl or ceramic and setting
      12×24 porcelain — typically runs $1,800–$3,200 for a 50–80 sq ft bathroom
      in Bremerton. Full shower retiles covering demo, Schluter Kerdi
      waterproofing, new tile, a shower niche, and finish grout land between
      $4,500 and $9,000 depending on tile material, slab format, and extras like
      a built-in bench or curbless shower conversion. Natural stone — marble or
      travertine — adds material cost plus the penetrating sealer application
      needed to protect it from PNW moisture conditions. Heated floor systems add
      $900–$2,200 depending on mat size and electrical scope. TopVolk provides
      line-item quotes: exact square footage, material spec, and labor breakdown,
      not a single lump number. The estimate is free, done on-site, and the
      numbers don't move between quote and invoice. Missed-deadline penalties are
      written into the contract — a concrete commitment, not a vague promise.

  - title: "Tile-to-Hardwood Transitions and Long-Term Grout Care in a Wet Climate"
    description: |
      Where a tiled bathroom floor meets hardwood in a hallway, there needs to be
      a proper expansion gap — typically 1/8" — with a Schluter transition strip
      or a matching caulk joint, not grout packed hard against the wood. Skipping
      that gap causes the hardwood to buckle when it expands during Bremerton's wet
      October-through-May stretch. This shows up regularly on remodels in 98310
      where a previous installer grouted flush to the hardwood threshold. Shower
      grout joints also need annual inspection for cracking and resealing,
      particularly on horizontal surfaces that hold standing water. Inside corners
      in a tiled shower should always be caulked, not grouted — grout at inside
      corners cracks with normal structural movement, and that crack is a direct
      water path to the substrate. Unsanded grout handles joints under 1/8";
      sanded grout handles wider joints. Using the wrong type causes adhesion
      failure within 12–18 months in a PNW bathroom.

faq:
  - q: "How fast can you get to Bremerton for a tile installation estimate?"
    a: |
      Bremerton is typically a 45–55 minute drive from Seattle via the Tacoma
      Narrows Bridge on Highway 16, or about 60 minutes by Washington State Ferry
      from Colman Dock to the Bremerton Terminal. TopVolk schedules on-site
      estimates in Bremerton and across Kitsap County regularly — lead time for a
      free consultation is usually 3–7 business days. Once the quote is accepted
      and materials are ordered, tile projects typically start within 2–4 weeks
      depending on tile availability and any permit timing. Call (206) 591-1096 to
      schedule directly with Vladislav — he does the estimate himself, which means
      the scope and quote reflect what he's actually going to build, not what a
      closer sold you.

  - q: "What does a full bathroom tile installation cost in Bremerton?"
    a: |
      Bathroom floor retiles — pulling old vinyl or ceramic and setting new
      porcelain — run $1,800–$3,200 for a typical 50–80 sq ft space. Full shower
      retiles including demo, Schluter Kerdi waterproofing membrane, tile, shower
      niche, and grout run $4,500–$9,000. Large-format 24×48 or 32×32 porcelain,
      natural stone, or a heated Schluter Ditra-Heat floor system push toward the
      higher end of those ranges. TopVolk provides itemized quotes with exact
      square footage, material spec, and labor line items — not a single number
      that expands after demo day. The estimate is free, done on-site, and backed
      by 100+ projects completed since 2023.

  - q: "Do I need a permit for tile work in Bremerton?"
    a: |
      Standard tile replacement — swapping old tile for new on an existing shower
      or floor without changing the layout — typically does not require a City of
      Bremerton permit. But adding a heated floor system with a new dedicated
      electrical circuit, converting to a curbless shower with modified drain
      plumbing, or relocating plumbing for a layout change all trigger permits
      through City of Bremerton Development Services. TopVolk Construction LLC is
      a WA Licensed Contractor and handles permit applications as part of the
      project scope — homeowners don't need to navigate the permit portal on their
      own. Plan review for a bathroom remodel with electrical and plumbing changes
      currently runs about 2–4 weeks in Bremerton for most residential scopes.

  - q: "Can you install a heated tile floor in my older Bremerton home?"
    a: |
      Yes. Schluter Ditra-Heat is the system used most frequently here — the
      heating cable embeds directly in the Ditra-Heat membrane, which also
      functions as the uncoupling layer between subfloor and tile. That matters in
      older Bremerton homes where subfloor movement is common. Warmup mat systems
      are an alternative for simpler or smaller installations. Both require a
      dedicated electrical circuit, a programmable floor thermostat, and an
      electrical permit through City of Bremerton Development Services for the
      rough-in inspection. The heated layer adds approximately 3/8" of total
      height, which gets planned for at tile-to-hardwood or tile-to-carpet
      transitions. Total add-on cost for a heated floor system in a standard
      bathroom runs $900–$2,200 including materials and electrical coordination.

  - q: "What warranty does TopVolk offer on tile installation?"
    a: |
      TopVolk provides a 2-year workmanship warranty on all tile installations.
      That covers grout cracking, tile lippage, waterproofing failures, and any
      substrate or setting issues that trace back to the installation itself. Tile
      and grout materials carry manufacturer warranties that vary by product.
      Schluter membranes and profiles are backed by Schluter's own warranty
      program. What's not covered is impact damage, grout discoloration from
      cleaning chemicals, or normal wear. The most common warranty issues in
      Bremerton bathrooms are grout cracking at inside corners — which should have
      been caulked — and waterproofing failure where original greenboard wasn't
      fully demoed. Both are entirely preventable with correct installation
      method, which is the point of doing it right the first time.

  - q: "Do you work in other parts of Kitsap County besides Bremerton?"
    a: |
      All of Kitsap County falls within the regular service area — Silverdale,
      Port Orchard, Poulsbo, Bainbridge Island, and Kingston are all regular
      project locations. TopVolk also covers King County, Snohomish County, and
      Pierce County across the broader Seattle metro. For Kitsap jobs, site visits
      get scheduled in batches to keep travel efficient, so clients in Silverdale
      or Port Orchard can usually get an on-site estimate the same week as
