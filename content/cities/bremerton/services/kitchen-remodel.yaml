title: "Bremerton Kitchen Remodel — Opening Up Navy-Era Kitchens"

intro: |
  Post-war housing built to house shipyard workers around the Puget Sound Naval
  Shipyard was never designed for open-concept cooking. The ranchers and Cape Cods
  through Manette and across East Bremerton (98310) have the same narrow galley
  kitchens — one overhead light, 30-inch counters, door closed off from the living
  room. Fitting a KitchenAid induction range and a proper island into that layout
  means wall removal, structural work, and usually a panel upgrade. TopVolk
  Construction LLC has run that exact scope on 100+ projects since 2023. WA
  Licensed Contractor, owner-led by Vladislav Volkov — call (206) 591-1096 to
  schedule a free on-site consultation. No sales rep. No middleman. You talk to the
  person doing the work.

localContext: |
  Most of 98310 and 98312 was built between 1940 and 1975 — post-war ranchers,
  small Cape Cods, and split-levels clustered around the naval base and the ferry
  terminal. Original galvanized plumbing runs inside the walls, panels are often
  still 100A, and the kitchens were sized for a rotisserie oven and a harvest-gold
  range. Manette and the older blocks of West Bremerton see the most of this stock.
  Kitsap County's humidity — same wet season as Seattle, October through May —
  means moisture has had decades to work on north-facing cabinet walls and the
  subfloor underneath.

commonProblems:
  - title: "Load-bearing wall between kitchen and living room in 1950s ranchers"
    description: "The wall separating the kitchen from the living room in most
      Bremerton-era ranchers carries point loads from above. Removing it requires
      a structural engineer's calc sheet and an LVL beam sized to the span before
      the City of Bremerton issues the permit. Sister joists and new blocking get
      installed at both bearing points before demo starts. Get the beam sizing
      wrong and the floor above starts to deflect. Vladislav does the structural
      coordination directly — call (206) 591-1096 to walk through the scope before
      committing to any design."
  - title: "100A electrical panels too small for modern cooking"
    description: "Induction cooking draws 40–50A on its own. Most homes in 98312
      are still running original 100A service — enough for the old GE range and a
      few circuits, not enough once you add a Bosch dishwasher and a range hood
      pulling 600 CFM. Upgrading to 200A requires PSE coordination, a new meter
      base, and a rough-in inspection before the panel is energized. TopVolk is a
      WA Licensed Contractor and manages that coordination as part of the project
      scope — missed-deadline penalties are written into the contract, not just
      promised verbally."
  - title: "Rot and failed vapor barriers behind original cabinetry"
    description: "Bremerton pulls ~37 inches of rain annually, and north-facing
      kitchen walls trap moisture against the sheathing for months at a time. Pull
      the base cabinets on homes built before 1970 and you routinely find soft
      subfloor decking, compromised rim joists, and vapor barriers that failed
      decades ago. That remediation happens before any Whirlpool or KitchenAid
      appliance is specified. Schedule a free on-site walkthrough with Vladislav
      to get a clear picture of what's actually behind the walls before any numbers
      are discussed."

