title: "Bremerton ADU Construction — Navy Town Rental Demand Pays"

intro: |
  Puget Sound Naval Complex is the largest naval installation on the West Coast, and the
  thousands of civilian workers and active-duty personnel assigned there need somewhere to
  live in 98310 and 98312. Rental vacancy in Bremerton runs consistently tight compared to
  most Kitsap County cities — and under WA HB 1337, passed in 2024, most single-family
  lots in the city can now host up to two ADUs without triggering design review or
  owner-occupancy requirements. That changes the math on a detached ADU (DADU) or
  basement conversion significantly. Vladislav Volkov at TopVolk Construction has built
  ADUs across King and Kitsap counties since 2023 — from a 500-square-foot DADU behind
  a craftsman bungalow in Manette to a full basement conversion in a 1960s rancher near
  the Wheaton Way corridor. Owner-led, direct communication — you talk to Vladislav,
  not a salesperson. Call (206) 591-1096 to talk through what your lot can realistically
  support.

localContext: |
  Most of the housing stock in 98310 — Manette especially — dates to the 1940s and early
  1950s, built fast to house Navy families during and after WWII. Those post-war lots are
  typically 6,000–8,000 square feet, and existing homes sit close to the street, which
  means a DADU in the rear yard is often the cleaner path than an attached addition.
  West Bremerton in 98312 runs a bit newer — more 1960s and 1970s ranchers — with
  slightly larger lots on the hillside streets above Sheridan Park. The climate here is
  wetter than most people expect: Bremerton gets around 55 inches of rain per year, more
  than Seattle proper, which matters for crawlspace vapor barriers, PT lumber for sill
  plates and mudsills, and Hardie cement-board siding on any new DADU. North-facing walls
  accumulate moss and mildew fast on untreated cedar or LP SmartSide without a proper
  paint system. Hillside topography across Kitsap County also means some lots have
  meaningful grade changes, which directly affects foundation type and cost for a
  detached unit.

commonProblems:
  - title: "Navigating Bremerton's ADU Permit Process Under HB 1337"
    description: |
      WA HB 1337 (2024) removed most owner-occupancy requirements and parking minimums
      for ADUs statewide, but you still need a building permit through City of Bremerton
      Development Services before breaking ground on anything. For a new DADU, plan
      review typically runs 6–10 weeks for a straightforward design — longer if you hit
      a correction cycle on incomplete drawings. The application requires site plans
      showing setbacks (typically 5 feet rear and side for a DADU in Bremerton), lot
      coverage calculations, and engineered drawings if any structural work is involved.
      TopVolk handles permit submittal as part of every ADU project — Vladislav has been
      through this process across multiple Kitsap County jurisdictions and knows what
      reviewers flag on the first pass. Skipping detailed drawings to save money upfront
      typically adds 4–6 weeks when the city issues a correction notice. Budget
      $80,000–$130,000 for a finished DADU with kitchen, bathroom, and separate
      utility rough-in; simpler shells start around $50,000–$65,000.

  - title: "DADU vs. Basement Conversion — Which Works for Your Bremerton Lot?"
    description: |
      The right answer depends on what you actually have. A 1950s bungalow in Manette
      with an unfinished basement and 7-foot ceiling height is often a strong candidate
      for an attached ADU (AADU) conversion — less foundation work, shared utility
      connections keep costs down, and you stay comfortably under the lot coverage
      limit. A 1970s rancher in 98312 with a concrete slab foundation and a generous
      rear yard might work better as a DADU — fully separate entrance, optional separate
      utility meters, and the main house stays undisturbed during construction. Grade
      matters too. Hillside lots near Sheridan Park can require a stepped foundation or
      a post-and-pier approach, which adds cost but also creates opportunity for a
      daylight basement unit with real natural light and a proper egress window. TopVolk
      looks at both options during the first site visit — no charge — and gives you
      straight numbers for each path before you commit to either direction.

  - title: "Moisture and Crawlspace Problems in Older Bremerton Homes"
    description: |
      Bremerton's rainfall punishes crawlspaces under 1940s and 1950s homes that never
      got a proper vapor barrier installed. Before converting a basement to an AADU or
      adding floor area above a crawlspace, that moisture condition has to be addressed —
      otherwise you're building on top of an active rot problem. A proper fix means
      6-mil poly vapor barrier across the entire crawlspace floor, sealed to the
      foundation walls, with any drainage or standing water issues resolved first. LVL
      beams used in new floor framing above that space won't tolerate sustained moisture
      exposure either. Sister joists may be needed where original Douglas-fir framing
      has softened from years of humidity. Bremerton's building inspector will check
      this at rough-in inspection — it's not optional. TopVolk includes a crawlspace
      assessment in the initial scoping visit. Missing it early adds $4,000–$10,000
      mid-project when rot turns up during framing.

  - title: "Utility Connections — Separate Meter or Shared Service?"
    description: |
      One of the first decisions any Bremerton ADU project faces is whether to run a
      separate water and sewer connection to the new unit or share the existing service.
      Shared connections cost less upfront — sometimes $3,000–$6,000 less — but mean
      the landlord controls both utility bills, which complicates long-term tenant
      relationships and reduces rental appeal. A separate meter requires a new tap with
      Puget Sound Energy for electrical service and coordination with Bremerton Public
      Works or Kitsap PUD depending on the specific service area. For a DADU intended as
      a long-term rental, separate utility connections typically make more sense. The
      permit application needs to call out which path you're taking — this decision
      affects the full MEP coordination drawings. Navien or Rinnai tankless water
      heaters are practical for a small ADU: compact, no large utility closet required,
      and operating costs are low enough that tenants notice. Budget $8,000–$15,000 for
      full MEP rough-in in a new DADU.

  - title: "Finish Quality That Attracts Long-Term Tenants in Bremerton's Market"
    description: |
      A bare-bones ADU will rent, but in Bremerton's market — where you're competing
      for PSNS workers, ferry commuters to Seattle, and healthcare staff from St.
      Michael Medical Center — finish quality matters more than most first-time landlords
      expect. Curbless showers with Schluter Kerdi waterproofing membrane and
      large-format porcelain tile read significantly better than a fiberglass tub
      surround and hold up far longer. Kitchen cabinets from IKEA's SEKTION line,
      paired with quartz countertops, hold up to tenant use better than builder-grade
      particleboard boxes. Mitsubishi mini-split systems handle heating and cooling
      efficiently in a 500–800 square foot unit without requiring separate ductwork
      runs. Recessed lighting on dimmer-compatible LED drivers and Moen or Kohler
      fixtures throughout signal a well-built unit without inflating the budget into
      luxury territory. TopVolk completes ADU projects from rough framing through
      final inspection and blue tape walkthrough — the goal is a unit still in good
      shape after 10 years of tenants.

faq:
  - q: "How fast can TopVolk get to Bremerton for an ADU consultation?"
    a: |
      Bremerton is a regular part of the service area — TopVolk works across King,
      Kitsap, and Pierce counties. Getting there via the Bremerton ferry or Highway 3
      through Silverdale is straightforward for site visits. The initial consultation
      is free, on-site, and runs about 90 minutes — enough time to walk the lot,
      assess the existing structure, and talk through permit requirements with
      Vladislav directly. From that visit to a written line-item quote typically takes
      5–7 business days. Full ADU projects run 4–7 months end-to-end, including City
      of Bremerton plan review. Call (206) 591-1096 to set up a site visit — you
      reach Vladislav, not a scheduler.

  - q: "What does ADU construction cost in Bremerton?"
    a: |
      A finished DADU in Bremerton in the 400–650 square foot range runs
      $80,000–$150,000, depending on foundation type, finish level, and whether
      separate utility connections are included. Basement conversions to attached ADUs
      start lower — $40,000–$80,000 — but vary widely based on existing framing
      condition and how much MEP work needs updating. These ranges cover permit
      fees, design, framing, rough-in, insulation, drywall, and finish work. Site
      conditions like grade changes, crawlspace remediation, or older electrical panels
      can push costs up. TopVolk provides direct line-item quotes after the site
      visit — no vague ranges that balloon later. Schedule a free on-site consultation
      at (206) 591-1096.

  - q: "What permits are required for an ADU in Bremerton, and who handles the process?"
    a: |
      Any new DADU or converted AADU in Bremerton requires a building permit through
      City of Bremerton Development Services. The application package needs site plans,
      floor plans, elevation drawings, and a structural package if new beams or
      load-bearing changes are involved. Plan review for straightforward ADU projects
      runs 6–10 weeks; complex sites with grade changes or older homes needing
      structural upgrades can stretch longer. TopVolk prepares and submits the full
      permit package as part of every project — Vladislav is a WA Licensed Contractor
      and has navigated Bremerton's review process on multiple ADU builds. Rough-in
      inspections and the final inspection are both scheduled into the project timeline,
      not treated as afterthoughts.

  - q: "Can I build two ADUs on my Bremerton lot under the new state law?"
    a: |
      Yes — WA HB 1337, effective 2024, allows up to two ADUs on most single-family
      lots statewide, including within Bremerton city limits. In practice, that means
      one attached ADU (basement conversion or addition) plus one detached ADU in the
      rear yard, or potentially two detached units if lot coverage and setback math
      allows. HB 1337 removes owner-occupancy requirements and parking minimums —
      it does not override Bremerton's local dimensional standards. The 24-foot
      height limit for a DADU and standard setback requirements still apply. A
      6,000-square-foot lot in Manette can often support one DADU comfortably;
      a 9,000-square-foot lot in West Bremerton has a better shot at two units.
      Vladislav walks through both scenarios during the initial site visit.

  - q: "How long does it take to build a DADU in Bremerton from start to finish?"
    a: |
      End-to-end, including permit submittal and plan review, most DADU projects in
      Bremerton run 4–7 months. The permit process alone at City of Bremerton
      Development Services takes 6–10 weeks. Actual construction — foundation,
      framing, MEP rough-in, insulation, drywall hang and mud, finish work — runs
      8–14 weeks depending on size and complexity. Delays typically come from
      correction cycles in plan review (avoidable with complete drawings) or
      unexpected site conditions found during demo or excavation. TopVolk writes
      deadline milestones into the contract, with penalties paid for missed dates —
      that's a signed agreement term, not a marketing claim. Call (206) 591-1096
      to discuss your specific timeline.

  - q: "Does TopVolk serve other Kitsap County areas besides Bremerton?"
    a: |
      Yes — the service area covers Kitsap County broadly: Port Orchard, Silverdale,
      Poulsbo, and Bainbridge Island, plus King County, Snohomish County, and Pierce
      County. ADU projects in unincorporated Kitsap County go through Kitsap County
      DCD (Department of Community Development) rather than a city permit center —
      different jurisdiction, similar timeline. 100+ projects completed since 2023
      across the Seattle Metro and Kitsap areas. If your property sits outside
      Bremerton city limits, the permit authority changes but the construction process
      stays the same. Reach Vladislav directly at (206) 591-1096 — no sales staff,
      no middleman, just the contractor.