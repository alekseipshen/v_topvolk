title: "Bremerton Home Additions — More Space Without Leaving Kitsap"

intro: |
  Navy shipyard towns build housing fast. Bremerton's 1940s and 1950s construction boom
  left thousands of 900-to-1,200-square-foot worker cottages and postwar ranchers that
  were never meant for a modern family's square footage demands. Manette, Charleston, and
  the neighborhoods spreading east from the ferry terminal are full of those homes —
  compact lots, low ceiling heights, floor plans that predate the home office or in-law
  suite. That gap is where addition work starts making sense.

  Bremerton's ferry access to Seattle creates a particular calculus. A lot of homeowners
  here have run the numbers and decided that $100,000–$150,000 in a well-built addition
  beats chasing a King County mortgage. Since 2023, TopVolk Construction has added onto
  homes across Kitsap County — including a detached ADU on a Manette lot where a
  Mitsubishi mini-split handled the HVAC and the City of Bremerton's plan review ran
  about eight weeks start to finish. Call (206) 591-1096 to talk through what's possible
  on your specific lot.

localContext: |
  The housing stock in East Bremerton (98310) and West Bremerton (98312) skews older
  than most cities in the Seattle metro area. East Bremerton is mostly WWII-era and
  early postwar — 1940s to mid-1950s — on post-and-pier foundations with original
  Douglas-fir framing. That framing has held up well. It was not, however, engineered
  for second-story loads.

  West Bremerton picked up a wave of 1960s and early-1970s split-levels near the
  Phinney Bay waterfront. Most are still on original foundation systems. For any addition
  work, the foundation question comes first. A structural engineer reviews the existing
  rim joist condition, footing dimensions, and post bearing capacity before any framing
  quote carries real meaning.

  Salt air off Sinclair Inlet is hard on metal connectors. Joist hangers, post bases,
  and hold-downs corrode faster here than inland. Hot-dipped galvanized or stainless
  hardware is the right call — not standard zinc-plated. The City of Bremerton runs its
  own permit center separately from Kitsap County's office, and plan review for a
  structural addition typically takes six to ten weeks. PNW rainfall averaging 37 inches
  annually makes vapor barrier detailing and proper flashing at any new roof-to-wall
  transition non-negotiable.

commonProblems:
  - title: "Post-and-Pier Foundations That Weren't Built for a Second Story"
    description: |
      Bremerton's WWII-era homes in Manette and East Bremerton went up fast, on
      post-and-pier foundations. One story — fine. Add a second story and those systems
      weren't engineered for the point loads bearing walls now carry. A licensed
      structural engineer has to assess the existing rim joist integrity, footing
      dimensions, and post bearing capacity before a framing quote means anything.

      Decay at the base of original wood posts is common after 70-plus years of PNW
      ground moisture. The fix is usually a continuous perimeter foundation pour or
      helical piers at key load transfer points. Retrofitting a perimeter foundation on
      a Bremerton rancher typically runs $15,000–$35,000 depending on soil conditions
      and access. That foundation work then supports a $90,000–$140,000 second-story
      addition with LVL beams at critical spans and metal joist hangers rated for the
      live load. TopVolk coordinates the structural engineering scope before issuing a
      line-item quote — no surprises after demo starts.

  - title: "Building a Detached ADU Under WA HB 1337 on a Bremerton Lot"
    description: |
      WA HB 1337 (2024) allows up to two ADUs on a single-family lot statewide. That's
      a real opportunity for Bremerton homeowners sitting on lots with unused rear yard
      space. Detached ADUs (DADUs) are now permissible in all SF zones. The City of
      Bremerton still enforces setback minimums — typically 5 feet from rear and side
      property lines — a 24-foot height limit for detached structures, and FAR limits
      that vary by zoning district.

      On narrower lots in the 98312 zip code near Charleston, fitting a 500-square-foot
      DADU within those setbacks requires careful siting at the design phase. Not after
      permit submission. A DADU with a separate utility connection and new slab
      foundation runs $90,000–$160,000 in Bremerton's current market, depending on
      finish level. End-to-end timeline including City of Bremerton plan review and
      construction typically runs four to seven months. Vladislav walks through the
      permit timeline with homeowners upfront so the schedule isn't a surprise
      mid-project.

  - title: "Matching 80-Year-Old Exterior Siding When Tying In an Addition"
    description: |
      Cedar lap siding from the 1940s doesn't match anything made today. The profiles
      differ, the widths differ, and eight decades of weathering means even fresh cedar
      won't align visually with original material. Most Bremerton homeowners adding a
      family room bump-out or a rear primary suite choose to re-side the entire visible
      face with Hardie cement-board. It handles PNW moisture without the annual
      maintenance cycle cedar demands.

      James Hardie's HardiePlank lap siding in an 8.25-inch profile blends with the
      proportions of postwar homes and won't absorb the 37 inches of annual rainfall
      this area gets. New window openings in the addition get Milgard vinyl units sized
      to match the framing layout — dual-pane, low-E glass meets current Washington
      energy code. Roofline transitions where the addition ties into the existing
      structure require careful step-flashing and counter-flashing detail at the ledger
      board. That flashing work is part of the addition scope, not a subcontracted
      afterthought.

  - title: "Heating a New Addition When the Existing Ductwork Won't Reach"
    description: |
      Extending ductwork from a 1950s forced-air system into a new addition sounds
      straightforward. Open the walls and you often find trunk lines already undersized
      for the original house. Forcing an undersized system to carry more load means the
      new room is cold in January and existing rooms lose pressure.

      A ductless Mitsubishi mini-split — a single-zone 9,000 or 12,000 BTU wall-mounted
      head unit, sized to the addition's square footage — handles heating and cooling
      independently. It also qualifies for WA state energy efficiency incentives.
      Single-zone installation runs $3,500–$6,500 including the line set and dedicated
      electrical circuit. If the addition includes a bathroom or wet bar, a Navien
      tankless water heater avoids a long hot-water run from a distant existing tank.
      MEP coordination — mechanical, electrical, and plumbing rough-in — happens before
      drywall hang, with a rough-in inspection scheduled through the City of Bremerton
      building department before any walls close.

  - title: "Attached ADU Layouts With a Separate Entrance and Kitchenette"
    description: |
      Attached ADUs (AADUs) are among the most requested addition types in Bremerton.
      Aging parents, returning adult children, rental income — the reasons vary, but the
      design challenge is the same. Carve out a private entrance, a small kitchen with a
      sink and GE induction cooktop, and a full bathroom without hollowing out the
      primary living area.

      On a typical 1,200-square-foot rancher in the 98310 zip code, an AADU addition off
      the rear — 400 to 600 square feet — is the workable scope. Structural work at the
      new doorway opening requires a properly sized LVL beam above the header: a
      3.5-inch × 9.25-inch LVL handles a standard 6-foot opening in most load
      conditions. The City of Bremerton requires a separate building permit for any
      addition containing a kitchenette, and plan review runs six to eight weeks.
      TopVolk Construction, a WA Licensed Contractor, files the permit application and
      manages inspection scheduling as part of every project — not as a line-item add-on.

faq:
  - q: "How fast can you get to Bremerton for a Home Additions consultation?"
    a: |
      Bremerton is about 90 minutes from Seattle by car — Highway 16 west from Tacoma
      or Highway 3 down from the north end of Kitsap. Vladislav drives out for site
      visits rather than taking the ferry; it's easier to bring drawings, a measuring
      tape, and a laptop. Scheduling an on-site consultation typically takes three to
      five business days from first contact. A written line-item estimate follows within
      a week of the visit. Call (206) 591-1096 — you're talking directly to Vladislav,
      not a scheduling coordinator or sales rep.

  - q: "What does a home addition cost in Bremerton?"
    a: |
      Scope drives the number more than anything else. A ground-floor bump-out of
      200–300 square feet — new foundation, framing, exterior Hardie siding, insulation,
      drywall, and electrical — typically runs $80,000–$130,000 in Bremerton's current
      labor and materials market. A second-story addition over an existing footprint,
      including structural foundation upgrades, ranges $120,000–$200,000 depending on
      what the engineer finds. Detached ADUs under WA HB 1337 run $90,000–$160,000
      depending on finish level and separate utility connection requirements. TopVolk
      gives direct line-item quotes after an on-site visit — no vague ranges, no
      escalation surprises mid-project. Schedule a free on-site estimate at
      (206) 591-1096.

  - q: "What permits does a home addition require in Bremerton, and how long does it take?"
    a: |
      The City of Bremerton handles permits through its own Development Services
      department — separate from Kitsap County's permit office, which covers
      unincorporated areas. A structural addition requires a building permit, stamped
      structural drawings from a licensed engineer, and typically a separate electrical
      permit. Plan review for a project with structural changes runs approximately six
      to ten weeks.

      Inspections follow the construction sequence: foundation, rough-in framing, MEP
      rough-in (mechanical, electrical, plumbing), insulation, and final inspection
      before the certificate of occupancy issues. TopVolk Construction, a WA Licensed
      Contractor, prepares and files permit applications and manages the full inspection
      schedule as part of every project scope.

  - q: "Can you add a second story to a 1940s or 1950s Bremerton home?"
    a: |
      Yes — but the foundation gets evaluated first. The post-and-pier systems common in
      Bremerton's shipyard-era housing weren't engineered for the point loads a second
      story introduces at the bearing walls. A structural engineer's report identifies
      what the foundation needs — perimeter upgrades, helical piers, or additional
      blocking and connection hardware. That report drives the scope, not guesswork.

      Once the foundation is confirmed or upgraded, second-story framing uses LVL beams
      at critical spans, load-rated joist hangers, and R-49 insulation at the new
      ceiling assembly to meet current IRC energy code. Hot-dipped galvanized hardware
      is standard at all exposed connections given the salt air off Puget Sound. Full
      second-story addition timeline including permitting typically runs six to nine
      months.

  - q: "How long does a home addition project take from start to finish in Bremerton?"
    a: |
      The timeline splits into two phases: design and permitting, then construction. For
      a ground-floor addition, City of Bremerton plan review takes six to ten weeks,
      followed by three to five months of construction. A DADU under WA HB 1337 with a
      separate utility connection runs four to seven months end-to-end. Second-story
      additions with structural foundation upgrades stretch eight to ten months total.

      Vladislav builds a construction schedule into every contract — and deadline
      penalties for missed milestones are written in as a binding term, not mentioned
      casually. That accountability structure is standard at TopVolk, not something you
      negotiate for separately.

  - q: "Does TopVolk serve other Kitsap County cities beyond Bremerton?"
    a: |
      Yes — Port Orchard, Poulsbo, Silverdale, Kingston, and Bainbridge Island are all
      within regular service range. Projects in unincorporated Kitsap County route
      through the Kitsap County permit office rather than a city building department.
      Bainbridge Island has its own permit center with slightly different review
      timelines. King County, Snohomish County, and Pierce County projects are also
      within scope — TopVolk has completed 100+ projects since 2023 across all four
      counties. Call (206) 591-1096 and Vladislav can tell you in a few minutes whether
      your lot, project scope, and timeline make sense for a site visit.