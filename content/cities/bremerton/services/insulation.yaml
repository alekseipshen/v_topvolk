title: "Bremerton Insulation — R-49 Attic & Crawl Space Upgrades"

intro: |
  Puget Sound Naval Shipyard turned Bremerton into a boomtown twice over — once in the 1940s and
  again in the Cold War era — and the housing that went up to serve those shipyard families wasn't
  built with energy performance in mind. Attics in the Manette peninsula got 2-3 inches of blown
  fiberglass when they got anything at all. Crawl spaces under the older Craftsman stock near
  Charleston sat open to ground moisture, unlined and uninsulated, for sixty or seventy years.
  Puget Sound Energy serves most of Kitsap County, and their current rebate program pays back real
  money — $0.25 to $0.35 per square foot — on qualifying attic insulation upgrades. Getting a
  Bremerton home to R-49 in the attic and sealing a crawl space properly with a reinforced poly
  vapor barrier and rigid foam on the stem walls isn't a luxury renovation. For most houses in this
  zip code, it's the highest return-on-investment project you can do before touching a single cabinet
  or fixture.

localContext: |
  The 98310 zip covers East Bremerton and the Manette peninsula — a dense grid of homes built
  between 1935 and 1965, many on post-and-pier foundations with unencapsulated crawl spaces and
  attics that have never been touched. Knee walls are everywhere in these 1.5-story floor plans:
  short vertical walls between conditioned living space and the unconditioned attic triangle on each
  side, usually with no insulation behind the knee wall sheathing and no coverage on the attic
  floor beyond. Across town in 98312 — the Wheaton Way corridor and the west side neighborhoods
  near Riddell Road — you hit more 1970s and early-1980s construction. Better than nothing, but
  still well under Washington State Energy Code for climate zone 4C. Kitsap County pulls around 40
  inches of rain a year, and north-facing roof lines grow moss within a few seasons — a sign that
  moisture is moving where it shouldn't. Crawl spaces within a half-mile of Sinclair Inlet see
  year-round ground moisture, not just a wet-season problem.

commonProblems:
  - title: "Attic R-Values in 98310 Homes Are Nowhere Near Code — and Heating Bills Show It"
    description: |
      Probe an attic in the older Manette or Charleston neighborhoods and you'll typically land
      between R-11 and R-19 of settled fiberglass batt — the original builder install, never
      touched. Washington State Energy Code for climate zone 4C requires R-49 in attics. Closing
      that gap starts with air sealing: every recessed light penetration, top plate gap, and attic
      hatch gets sealed with canned foam or fire-rated sealant before a single inch of insulation
      goes in. Then we blow in cellulose — Greenfiber is the standard product we use, rebate-
      eligible through PSE — to a settled depth of 14-16 inches. A 1,200-1,500 sq ft attic takes
      two days: one for air sealing, one for blowing. Total cost typically runs $3,500-$6,500. PSE
      rebates can offset $400-$800 of that after we submit the paperwork on your behalf.

  - title: "Open Crawl Spaces Near Sinclair Inlet Are Rotting Sill Plates From the Bottom Up"
    description: |
      An unlined dirt crawl with a few passive vents doesn't control moisture — it just routes
      damp outside air under your floor structure all winter. On homes close to the waterfront in
      98310 or near Port Washington Narrows, sill plates and rim joists show early decay within
      15-20 years of construction without intervention. Full encapsulation means installing a 20-mil
      reinforced poly liner (we spec TerraBlock or a comparable product) across the floor, up the
      stem walls, and sealed at every seam and penetration. Rigid foam board — typically 2-inch
      polyiso — goes against the stem walls for R-13, then gets sealed at all edges. If there's
      mechanical equipment in the crawl, we add a small supply register to maintain positive pressure
      and prevent negative draft. Budget $8,000-$14,000 for a 1,000-1,400 sq ft footprint, depending
      on access points, existing debris, and foundation geometry.

  - title: "Knee Wall and Rim Joist Heat Loss — The Two Spots Older Bremerton Homes Bleed Energy"
    description: |
      A 1.5-story bungalow in the blocks behind Naval Avenue or up near Sheridan Park almost always
      has triangular unconditioned voids flanking the upper-floor living space. Those knee walls —
      short vertical stud walls between heated rooms and cold attic space — lose heat in two
      directions simultaneously: through the knee wall itself and through the uninsulated attic floor
      on each side. Fixing it right means 2-inch rigid polyiso against the knee wall sheathing
      (R-13), mineral wool batt filling the stud cavity, and coverage on the attic floor triangles.
      Separately, rim joists at the mudsill level get two inches of closed-cell spray foam — which
      handles both air sealing and R-value (R-12 to R-14) in a tight assembly where batt insulation
      would fall out or trap moisture. Standalone insulation work like this generally doesn't require
      a City of Bremerton building permit, but we verify the scope with the city before starting.
      TopVolk is a WA Licensed Contractor; permit compliance isn't negotiable.

  - title: "Spray Foam Isn't Always the Answer — Cost-Realistic Insulation Sequencing for Bremerton"
    description: |
      Closed-cell spray foam runs $1.50-$2.50 per board foot. Filling an entire attic with it would
      cost three to four times what blown-in cellulose costs for the same R-value. For most Bremerton
      homes, the right sequencing is: attic air sealing plus blown-in cellulose to R-49 first
      ($3,500-$6,500), crawl space encapsulation with vapor barrier and rigid foam second
      ($8,000-$14,000), then rim joist closed-cell spray foam ($800-$1,500 for a standard perimeter).
      Wall cavity upgrades — fiberglass or mineral wool batt replacement — make sense only when
      walls are already open during a remodel, adding roughly $1.50-$2.50 per square foot of wall
      area. TopVolk's quotes are line-item breakdowns, not lump sums. 100+ projects completed since
      2017 across the Seattle metro and Kitsap County — Vladislav gives you a number, not a range
      designed to expand later. Deadline penalties are written directly into the contract.

  - title: "Floor-to-Floor Soundproofing During Remodels — Mineral Wool While the Joists Are Exposed"
    description: |
      Exposed joists during a bathroom or kitchen remodel in a two-story Bremerton home create a
      short window to add sound attenuation that would otherwise cost twice as much. Rockwool
      Safe'n'Sound is the go-to product for between-floor assemblies: its density suppresses mid-
      frequency sound (footfall, voices) far better than standard fiberglass batt, and it carries a
      fire rating that matters for any floor above a garage. Installation runs $1.50-$2.25 per square
      foot of floor area when staged alongside a remodel, because there's no separate demo or drywall
      cost added. We sequence the mineral wool install immediately after rough-in inspection closes —
      one crew movement, no second mobilization fee. For older homes in Manette or Wheaton Way where
      sound between floors has always been an issue, this is the fix, and the remodel is the right
      time to do it.

faq:
  - q: "How fast can you get to Bremerton for an insulation estimate?"
    a: |
      Bremerton is 30-35 minutes from our typical starting point — we route through Belfair on WA-3
      or catch the Bremerton ferry from Colman Dock depending on time of day. Estimates in Kitsap
      County get scheduled within 3-7 business days of your first call. The site visit is free and
