      back within 48 hours of the visit. Call (206) 591-1096 to get on the calendar.

  - q: "What does attic insulation to R-49 cost in Bremerton?"
    a: |
      A standard 1,200-1,500 sq ft attic — accessible, no major obstructions — runs $3,500-$6,500
      for air sealing plus blown-in cellulose to R-49 in Washington State Energy Code zone 4C. Knee
      wall attics, low-clearance spaces, and heavy debris removal push toward the high end. PSE
      rebates ($0.25-$0.35 per sq ft for qualifying insulation upgrades) come off your utility bill
      after we file the paperwork — we handle that as part of the job. Call (206) 591-1096 for a
      free on-site estimate with exact line-item pricing.

  - q: "Does insulation work in Bremerton require a permit from the city?"
    a: |
      Standalone insulation scopes — attic blown-in, crawl space vapor barrier, rim joist spray foam
      — typically fall below the City of Bremerton's permit threshold. Where insulation is one piece
      of a larger remodel (structural work, HVAC changes, an addition), the master permit covers it
      and insulation gets inspected as part of that package through Bremerton's Building Department.
      For unincorporated Kitsap County parcels outside city limits, Kitsap County's permit center
      applies the same general rule. TopVolk is a WA Licensed Contractor and we confirm the permit
      requirement for your specific scope before anything starts — no assumptions either way.

  - q: "Do you install spray foam, or only blown-in insulation?"
    a: |
      Both — and the product choice depends on the assembly, not a sales preference. Closed-cell
      spray foam is the right call at rim joists: two inches gives you R-12 to R-14 plus a full air
      seal in a space too tight for batt. It also works for crawl space rim joists and any assembly
      where condensation risk is high. Blown-in cellulose covers attic decks better per dollar than
      spray foam and qualifies for PSE rebates. Rockwool Safe'n'Sound mineral wool handles between-
      floor sound and fire assemblies. Fiberglass batt stays useful for wall cavities during open
      remodels. We spec by location, not by default.

  - q: "How long does crawl space encapsulation last in a Kitsap County home?"
    a: |
      A 20-mil reinforced poly liner with taped seams and mechanically fastened edges — installed
      correctly — is rated for permanent installation and routinely lasts 25+ years. The rigid foam
      on stem walls doesn't degrade from moisture, and the liner itself won't break down under normal
      conditions. TopVolk warrants our labor on crawl space encapsulation for two years from
      completion; the liner and foam materials carry manufacturer warranties independently. Annual
      visual inspection — checking seam integrity, looking for pest intrusion points, confirming no
      liner shifting — is the only maintenance this system needs. An encapsulated crawl is also far
      easier to inspect than a vented dirt crawl.

  - q: "Do you cover Port Orchard and Silverdale, or just Bremerton?"
    a: |
      All of Kitsap County is in our service area — Bremerton, Port Orchard, Silverdale, Poulsbo,
      Bainbridge Island, Kingston, and the unincorporated stretches in between. TopVolk also works
      regularly across King, Snohomish, and Pierce counties. Scheduling for insulation-only projects
      in Kitsap typically opens within 2-4 weeks of a signed contract; insulation scoped inside a
      larger remodel gets sequenced into that project's timeline. Vladislav handles the estimate
      personally — 100+ projects completed since 2017, deadline penalties written into every
      contract. Call (206) 591-1096 or request a free on-site consultation directly.