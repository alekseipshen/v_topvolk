title: "Bremerton Electrical — Panel Upgrades, EV Circuits & Old Wiring"

intro: |
  Manette's stretch of 1940s bungalows — the blocks running back from the bridge toward 4th Street NE in 98310 — were built for Puget Sound Naval Shipyard workers whose biggest electrical load was a GE refrigerator and a couple of lamps. Those same houses now sit in driveways where Chevy Bolts and Ford F-150 Lightnings need overnight charging, and the 60-amp fuse panel behind the furnace room door wasn't designed for that. Add a Mitsubishi mini-split heat pump and a new induction range, and the math doesn't work anymore. TopVolk Construction LLC has handled panel upgrades, knob-and-tube replacements, and EV charger circuit installations across Kitsap County as part of kitchen remodels, ADU builds, and basement conversions since 2023 — 100+ projects completed. Vladislav Volkov manages the electrical scope directly and coordinates with PSE for the meter socket swap. No dispatcher relay, no sales rep quoting work he won't be on-site to oversee. Call (206) 591-1096 to set up a free on-site consultation.

localContext: |
  Bremerton's housing stock tells two distinct stories. The Manette neighborhood and the older blocks around downtown (98310) run heavily pre-1950 — post-and-pier foundations, original Douglas-fir framing, and in a significant percentage of cases, knob-and-tube wiring that's been running untouched for seven or eight decades. Charleston and the West Bremerton residential grid (98312) shift into mid-century territory — split-levels and ranchers built between 1962 and 1975, some of which have aluminum branch wiring on 15A and 20A circuits that requires AlumiConn connectors or CO/ALR-rated devices to meet current NEC standards. Bremerton sits entirely within Puget Sound Energy's service territory, which means any service upgrade involves a PSE coordination step for the new meter socket — something that adds a week to the timeline if you don't know the utility's process. The ferry commuter population switching to EVs has driven steady demand for 50A and 60A Level 2 charger circuits since 2022. PNW moisture doesn't forgive a poorly sealed service entrance either — rain runs October through May, and corroded service entrance conductors are a recurring finding in older Bremerton homes.

commonProblems:
  - title: "100A to 200A Service Upgrades in East Bremerton Ranchers and Bungalows"
    description: |
      East Bremerton homes in 98310 built between 1945 and 1970 came with 100-amp service that handled the loads of that era without complaint. Stack a Mitsubishi MXZ multi-zone heat pump, a 50A Tesla Wall Connector circuit, and a new range onto that panel, and the main breaker starts tripping under normal evening loads. The solution is a 200A service upgrade: new main breaker panel, updated service entrance conductors, and PSE coordination for the meter socket replacement — a step that requires scheduling with the utility and typically adds 5-10 business days to the project timeline. City of Bremerton handles electrical permits; plan review on a panel swap runs approximately 2-3 weeks. Full 200A upgrade cost in Bremerton typically lands between $2,800 and $4,800, shifting higher if the service entrance mast needs relocation or the existing branch circuits need AFCI breaker retrofits to pass final inspection.

  - title: "Knob-and-Tube Wiring Replacement in Manette's Pre-1950 Bungalows"
    description: |
      Knob-and-tube wiring in Manette's older homes isn't automatically a fire hazard — but it's ungrounded, it was never rated for the insulation techniques now required around it, and insurance carriers have started refusing to bind homeowner policies on active K&T systems. The replacement process involves selective wall opening, running new NM-B (Romex) cable through original framing paths, and swapping the fuse panel for a modern breaker panel with AFCI breakers on all bedroom circuits per current NEC. In a typical 1,100 sq ft Manette bungalow, a full K&T replacement combined with a panel upgrade runs $9,000–$16,000 depending on attic and crawlspace access. Post-and-pier foundations in Manette actually make the crawlspace runs cleaner than slab construction. Two inspections required — rough-in and final — through the City of Bremerton permit office. TopVolk coordinates both as part of the project scope, and deadline penalties are written into the contract.

  - title: "Aluminum Branch Wiring Remediation in Charleston and West Bremerton Homes"
    description: |
      Homes in Charleston (98312) built between 1965 and 1973 frequently have aluminum branch wiring at the 15A and 20A circuit level — not the large-gauge aluminum service entrance wire, but smaller branch circuit aluminum that expands and contracts with heat cycling and loosens at device terminals over time. Loose connections at outlets and switches generate heat and represent a real fire risk that most homeowners don't know about until an inspection flags it. The standard remediation uses AlumiConn push-in connectors at every device termination and CO/ALR-rated outlets and switches throughout. City of Bremerton requires a permit for this work. As a WA Licensed Contractor, TopVolk pulls the permit, schedules the rough-in inspection, and handles the final sign-off — so the remediation is documented and doesn't come up as an open liability at resale. Whole-house AlumiConn remediation in a typical Charleston split-level runs $1,500–$3,800 depending on circuit count.

  - title: "EV Charger Circuit Installation for Ferry Commuters in 98310 and 98312"
    description: |
      Bremerton ferry commuters who've switched to a Rivian, Chevy Bolt EUV, or any other EV run into the same problem: a 120V outlet in the garage charges at 4-5 miles per hour, which is barely enough if you're driving to the Bremerton ferry terminal and back every day. A dedicated 50A circuit for a ChargePoint Home Flex or 60A circuit for a JuiceBox 48 gets a full charge in 6-8 hours. Running the circuit from panel to a garage mounting location in a typical East Bremerton split-level costs $650–$1,300 depending on panel location and conduit run distance. If the panel is at capacity, add a load management device or a subpanel to the scope before committing to the charger install. Permit required through the City of Bremerton — straightforward EV charger circuits typically turn around in 5-7 business days. Permit filing is included in the quoted price.

  - title: "AFCI and GFCI Breaker Upgrades During Kitchen and Bathroom Remodels"
    description: |
      Any permitted remodel in Bremerton that touches bedroom, bathroom, kitchen, or garage circuits now triggers NEC requirements for arc-fault circuit interrupter (AFCI) and ground-fault circuit interrupter (GFCI) protection. Older Square D and Eaton panels from the 1980s and 1990s accept AFCI/GFCI combination breakers, but the retrofit takes longer than a straight swap because you need to test every circuit for nuisance tripping — some older LED dimmer-compatible fixtures and appliances cause false trips with lower-grade breakers. Specifying Square D QO or Eaton BR combination breakers avoids most nuisance trip issues. Adding proper AFCI/GFCI protection and bringing affected circuits up to NEC during a bathroom or kitchen remodel adds roughly $450–$950 to the electrical scope. A Bremerton building inspector will verify this at final — an open permit from skipping it costs more than doing it correctly the first time.

