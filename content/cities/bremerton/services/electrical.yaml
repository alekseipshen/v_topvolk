  - q: "How fast can TopVolk get to Bremerton for an electrical consultation?"
    a: |
      Bremerton is accessible via WA-3 and WA-304, roughly 45–60 minutes from Seattle depending on ferry timing or the Tacoma Narrows approach from the south. TopVolk schedules free on-site consultations Tuesday through Saturday — typically within 5–7 business days of first contact. For electrical work tied to a larger remodel or ADU project, the electrical scope gets priced into the full project quote on the same visit. Vladislav comes out himself, walks the panel, identifies permit requirements, and delivers a written line-item quote — not an estimate range. Call (206) 591-1096 to book.

  - q: "What does a 200A panel upgrade cost in Bremerton?"
    a: |
      A straightforward 200A service upgrade in Bremerton — new main breaker panel, updated service entrance conductors, PSE meter socket coordination — typically runs $2,800–$4,800. That range moves if the service entrance mast needs replacement, the panel needs to be relocated, or a significant number of existing circuits require AFCI breaker retrofits to meet current NEC at final inspection. Homes in Manette or West Bremerton with original 60A fuse equipment sometimes involve more extensive work than a straight panel swap. A free on-site estimate pins down the exact number before any work is scheduled — no surprises after demo starts.

  - q: "Do I need a permit for electrical work in Bremerton, and how long does it take?"
    a: |
      Yes, for any service upgrade, panel replacement, new circuit installation, or EV charger circuit in the city. The City of Bremerton's Development Services office handles electrical permits for properties within city limits; unincorporated Kitsap County parcels go through the Kitsap County permit office separately. Plan review on a panel upgrade or EV charger circuit typically takes 2–3 weeks. As a WA Licensed Contractor, TopVolk files the permit application as part of the project scope — you don't navigate that separately. Rough-in and final inspections are scheduled and closed out before the project is considered complete. That permit documentation also protects you at resale, where buyers and their inspectors ask for it.

  - q: "Can you install a Tesla Wall Connector or JuiceBox charger in my garage?"
    a: |
      Yes. The Tesla Wall Connector requires a dedicated 60A double-pole breaker circuit; the JuiceBox 48 runs on a 50A dedicated circuit. Both installations require a permit through the City of Bremerton, and both need a proper dedicated breaker — not a shared circuit or a split-bus workaround. For most East Bremerton split-levels and ranchers with an attached garage, the conduit run from the main panel to the charger mounting location is straightforward. If the existing panel is already loaded, TopVolk evaluates a load management solution before recommending a full service upgrade. Call (206) 591-1096 to schedule an on-site assessment of your panel capacity.

  - q: "What warranty covers electrical work done by TopVolk?"
    a: |
      Labor is warranted for one year from permit final. If a connection fails, a breaker trips without load cause, or any workmanship issue surfaces, TopVolk returns and corrects it at no charge. Equipment carries manufacturer warranties: Square D QO panels and breakers carry a limited lifetime warranty on the enclosure; JuiceBox and ChargePoint charger units carry 3-year manufacturer warranties. The permit process also provides independent verification — a City of Bremerton inspector reviews the rough-in and final, which is a quality check that sits outside TopVolk's own sign-off. Deadline penalties for missed milestones are written into the contract, not offered as a verbal promise.

  - q: "Does TopVolk cover other Kitsap County cities besides Bremerton?"
    a: |
      Yes. Beyond Bremerton's 98310, 98311, and 98312 zip codes, TopVolk covers Silverdale, Port Orchard, Poulsbo, and Bainbridge Island within Kitsap County — plus King County, Snohomish County, and Pierce County. Permit jurisdictions differ by location: Silverdale is unincorporated and permits through the Kitsap County office; Bainbridge Island has its own city permit center. Initial consultation scheduling across Kitsap typically runs 5–7 business days. Vladislav handles the walk-through personally so the scope discussed on-site is the scope that gets built. Call (206) 591-1096 or schedule online.