title: "Bremerton General Contracting — Old Homes, Current Code"

intro: |
  Manette's bungalows and the post-war worker housing built near the Puget Sound Naval
  Shipyard share a common problem: what's behind the walls rarely matches what the
  listing said. A kitchen gut in a 98310 home often starts as a Bosch dishwasher
  hookup and ends with an LVL beam order and a structural plan review. That's not
  unusual here — it's just what remodeling post-war housing looks like.

localContext: |
  Most of the housing in zip 98312 — Bremerton's west side — was built between 1945
  and 1965, originally for shipyard workers and naval families. Small ranchers and
  split-levels with original single-pane windows, galvanized supply lines, and
  subfloor systems that were never designed for a modern kitchen layout. Over in
  98310, the Manette neighborhood runs on Craftsman-era framing with post-and-pier
  foundations that shift every wet season from October through May.

commonProblems:
  - title: "Structural Surprises During Demo on 1940s–1960s Homes"
    description: >-
      Opening a wall in a post-war Bremerton rancher routinely finds undersized
      framing — 2×4 studs at 24-inch spacing where a point load transfer now
      needs an LVL beam or PSL post to meet IRC. That structural fix adds cost
      and timeline. Budget for it upfront or you'll be mid-demo with no
      contingency left. On projects over $100K, we scope structural unknowns
      before the contract is signed, not after the saw runs.
  - title: "MEP Coordination When Three Trades Are Running at Once"
    description: >-
      Framing inspection, rough-in electrical, rough-in plumbing, and
      mechanical rough-in can't all happen the same day. City of Bremerton
      permit review for major remodels runs 4–8 weeks. Trades sequence
      matters — paying a licensed electrician to wait on a plumber is a real
      cost. Getting MEP coordination right is most of the general contracting
      job on a $100K–$200K remodel. We schedule it, we track it, we own it.
  - title: "Crawlspace and Subfloor Failures From Years of Kitsap Rain"
    description: >-
      Kitsap Peninsula gets roughly 37 inches of rain a year, and older
      Bremerton homes accumulate that moisture in crawlspaces with failed vapor
      barriers and sistered joists that have been wet for years. A KitchenAid
      range sitting on a soft, deflecting subfloor is a sign the fix goes below
      the floor assembly. We demo, install a proper vapor barrier, and use
      DriCore subfloor panels before any finish work goes down — not after.

faq:
  - q: "How fast can you get to Bremerton for General Contracting?"
    a: >-
      We're on the Kitsap Peninsula regularly — routed via Highway 3 and SR-304,
      no ferry required. Call (206) 591-1096 to schedule a free on-site
      consultation. First visit is Vladislav walking your project, not a
      sales pitch from a closer.
  - q: "Do you handle Bosch, KitchenAid, and Samsung appliance hookups during a remodel?"
    a: >-
      Yes — connecting a Bosch dishwasher or a KitchenAid range to new rough-in
      plumbing and a 240V circuit is standard scope in a kitchen remodel.
      Samsung French-door fridges with ice maker lines get a dedicated shut-off
      roughed in during plumbing. We coordinate install timing with the MEP
      rough-in so nothing gets redone after drywall goes up.
  - q: "What does a full remodel cost in Bremerton, and how long does it take?"
    a: >-
      A full kitchen remodel in a 98310 or 98312 home typically runs
      $45K–$95K depending on structural scope and finish selections. City of
      Bremerton plan review adds 4–8 weeks before construction starts.
      Budget 8–12 weeks build time after permit. Deadline is written into
      the contract — if we miss it, we pay. WA Licensed Contractor,
      100+ projects completed since 2023. Call (206) 591-1096.