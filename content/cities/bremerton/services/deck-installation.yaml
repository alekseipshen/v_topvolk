title: "Bremerton Deck Installation — Built for Salt Air and Kitsap Rain"

intro: |
  Sinclair Inlet sits less than a mile from East Bremerton's older neighborhoods,
  and that marine air off the water accelerates cedar weathering faster than
  anything you'd see on a comparable house in Renton. Homes along Loxie Eagans
  Boulevard and up through the 98310 corridor are mostly postwar Navy-era
  construction — 1940s and 50s bungalows where original rear decks, if they
  still exist, are splitting at the grain and pulling away from the rim joist.
  Vladislav Volkov (TopVolk Construction, WA Licensed Contractor) has replaced
  dozens of these platforms across Kitsap County since 2023, working with Trex
  composite and pressure-treated framing that actually holds up in this climate.

localContext: |
  Most of Bremerton's housing stock dates from 1942 to 1965, built quickly to
  house shipyard workers at Puget Sound Naval Shipyard and their families. In
  98312 (West Bremerton) and the Manette neighborhood east of the bay, post-and-
  pier foundations are common, and original rim joists were never designed to
  carry a ledger board without modern through-flashing. Before any deck bolts go
  in, those rim joists need inspection — rot gets sistered out before framing
  begins. Deck permits run through the City of Bremerton Building Division, not
  King County DPER.

commonProblems:
  - title: "Cedar Grays and Splits Fast in Marine Air"
    description: "Standard cedar decking lasts 8-12 years in inland King County.
      Near Sinclair Inlet, 40+ inches of annual rain combined with salt-tinged
      marine air cuts that to 6-8 years before structural checking and cupping
      set in. TimberTech Terrain composite holds its finish without annual
      sealing, doesn't absorb the moisture that causes freeze-thaw cupping on
      north-facing deck surfaces, and handles the moss-growth pressure that
      comes with Bremerton's shaded lots."

  - title: "Ledger-to-Rim Joist Connection Without Proper Flashing"
    description: "The ledger board — the structural member that bolts your deck
      directly to the house framing — creates a horizontal surface that channels
      water against the sheathing and rim joist behind it. IRC R507.2 requires
      through-flashing with a drainage gap between the ledger and the wall.
      Skip it, or do it wrong, and you're rotting out the rim joist and floor
      framing within 5-7 years. Bremerton's rain window runs October through
      May with almost no drying time between storms."

  - title: "Post Footings Too Shallow for Kitsap Soils"
    description: "Kitsap County frost depth runs 12-18 inches depending on
      elevation and soil drainage. Inspectors at the City of Bremerton Building
      Division want concrete footings at 18 inches for most deck posts, especially
      on lots with saturated marine soils near lower elevations. Undersized
      piers heave seasonally and pull ledger fasteners loose over time. Posts
      set in concrete require UC4B-rated pressure-treated (PT) lumber; standard
      PT isn't rated for that contact condition. Simpson Strong-Tie post bases
      are the standard here — they keep the post end out of standing water
      inside the footing."

faq:
  - q: "How fast can you get to Bremerton for Deck Installation?"
    a: "We drive over via Highway 16 or catch the Bremerton-Seattle ferry
      depending on schedule. Most initial site visits happen within 5-7 business
      days of your call. Phone (206) 591-1096 — you'll reach Vladislav directly,
      not a call center. On-site consultations are free."

  - q: "Is cedar or composite decking the better choice for a Bremerton home?"
    a: "For most 98310-98312 homeowners, Trex or TimberTech composite comes out
      ahead over a 15-20 year horizon. Cedar is $4-7/sq ft less upfront, but
      needs sealing every 1-2 years in this climate and the saltwater proximity
      near the shipyard area shortens it further. We'll price both options
      side-by-side on-site so you can decide with real numbers."

  - q: "Do you pull permits for deck projects in Bremerton, and how long does that take?"
    a: "Yes — every structural deck project goes through the City of Bremerton
      Building Division for plan review. Standard attached deck permits typically
      take 3-5 weeks. We submit the application; you don't have to deal with
      the building department. Permit cost runs roughly $300-$600 depending on
      project valuation. Total project timeline: 6-10 weeks from signed contract
      to final inspection, depending on permit queue. Missed deadline? Penalty
      clause is written into the contract — TopVolk pays, not you. 100+ projects
      completed since 2023 across King, Snohomish, Pierce, and Kitsap counties."