title: "Bremerton Fence Installation — Built for Kitsap's Wet, Salty Winters"

intro: |
  Salt air off Port Washington Narrows does something specific to untreated wood fence posts. It pushes moisture into the post base faster than ground-contact decay does — and most homeowners don't notice until the post is already soft at the collar.

  Bremerton's spot on Puget Sound creates marine exposure that inland Kitsap simply doesn't see at the same intensity. Manette and the Charleston district live with that salt-and-moisture combination every single month. Cedar still makes sense here — it looks right against the older craftsman homes along Warren Avenue — but without a penetrating sealer every 18 to 24 months, it goes gray and starts checking within three seasons.

  Vinyl fencing — cellular PVC from CertainTeed or Bufftech — cuts that maintenance cycle out entirely.

  The real variable on either material isn't the picket or the rail. It's post setting depth and footing quality in Bremerton's saturated clay soils. Those soils shift enough over winter to rack a fence that wasn't set deep enough from the start.

localContext: |
  Bremerton's residential stock splits fairly cleanly between the older neighborhoods west of the ferry terminal — zip codes 98337 and 98312 — and newer development east into 98310 toward Silverdale.

  Homes in the 98312 corridor, around Sheridan Park and the streets running uphill from the naval base housing, were mostly built between the 1950s and 1970s. Lot lines on that era aren't always filed with precision. Boundary disputes on fence jobs come up more often there than anywhere else we work in Kitsap.

  East Bremerton (98310) brings a different problem. Lots near Kitsap Lake run 8 to 14 percent grade in places. That requires either stepping fence panels or racking them continuously to follow slope — both add labor and need planning before the first post goes in.

  Bremerton's fence height code caps side and rear yards at 6 feet, front yards at 4 feet. Pool barriers require a 48-inch minimum enclosure per IRC section R326, with self-latching gate hardware that opens outward away from the pool. That detail gets missed on DIY installs and fails inspection every time.

commonProblems:
  - title: "Post Lean on Sloped Lots Near Kitsap Lake (98310)"
    description: |
      Lots in the 98310 zip — especially the blocks east of Kitsap Lake Road — frequently run significant grade. That slope loads fence posts hard through the first few wet seasons.

      The failure starts at the rail bracket connection. A 4x4 cedar post that tilts even slightly causes the bracket to rack, the top rail loses level, and pickets start popping at the face-nail points within 12 to 18 months.

      The fix depends on how much slope you're working with. Under 6 percent, racking panels continuously works cleanly. Above that, stepping sections at fixed elevations gives a cleaner look and puts less stress on the post.

      Either way, posts go into 30-inch deep Quik-Tube forms with a concrete crown sloped away from the post base to direct water outward. That alone adds years to post life versus dry-setting in gravel. Sloped cedar fence installation in this area runs $65–$90 per linear foot installed, footings included.

  - title: "Cedar Checking and Mildew on North-Facing Fence Runs in Manette"
    description: |
      North-facing fence sections in Manette and on the hillside streets of West Bremerton get almost no direct sun from October through March.

      That extended shade traps moisture in the wood surface and feeds the dark mildew streaking visible on unsealed cedar within two seasons. Checking — the longitudinal cracking that opens as cedar cycles between wet and dry — gets worse on those exposures because the swing is more extreme than on south-facing runs.

      Western Red Cedar handles it fine with maintenance. TWP-100 Series or Cabot Australian Timber Oil every 18 to 24 months keeps checking controlled and the gray off. If existing pickets already show checking deeper than 1/4 inch, targeted board replacement is cheaper than full refinishing.

      Picket stock on hand includes 1x6 rough-sawn cedar in profiles that match boards from fences installed back to the 1990s. Replacement pickets run $4–$7 each for material. A full refresh coat on 150 linear feet of cedar fence runs roughly $600–$900 in labor plus product.

  - title: "Permit Thresholds for Fence and Retaining Wall Combinations in Bremerton"
    description: |
      A standalone residential fence under 6 feet in Bremerton typically doesn't require a building permit from the City's Development Services department.

      Combine that fence with a retaining wall — even a modest one to level a sloped yard — and the permit requirement kicks in once the wall exceeds 4 feet measured from the bottom of the footing. Multiple jobs in the Sheridan Park area and on the older lots near downtown (98337) have gone through Bremerton's online portal exactly this way. The application needs a site plan showing setbacks from property lines, stated fence height, and wall construction details with footing size.

      Plan review for a straightforward residential fence-and-wall combination typically runs 2–4 weeks.

      TopVolk Construction LLC is a WA Licensed Contractor with 100+ projects completed across Seattle Metro since 2017 — permit applications are handled as part of the project scope, not as a separate line item. Call (206) 591-1096 to talk through whether your specific lot and wall height trigger the threshold.

  - title: "Cedar vs Vinyl: What the 15-Year Cost Math Actually Looks Like"
    description: |
      A standard 150-linear-foot privacy fence in Bremerton runs approximately $18–$24 per linear foot installed for vinyl PVC, and $22–$32 per linear foot for cedar. The upfront gap is usually $500–$1,500 on a typical residential job.

      Over 15 years, cedar requires roughly $400–$600 in sealer product every two years, plus occasional picket and post replacement as ground contact decay sets in. Vinyl has essentially zero ongoing material cost and carries a lifetime structural warranty — CertainTeed's is transferable if the home sells.

      Cedar wins on aesthetics. Horizontal slat designs with tight 1/4-inch spacing look significantly better in cedar on the craftsman-era homes in Manette than in vinyl.

      Gate count moves the total quickly — each framed gate opening adds $350–$600 to the installed price regardless of material, depending on width and hardware grade. Slope, rock subsurface, and corner post count all affect the final number. That's why the on-site quote matters.

  - title: "Gate Hardware Failure: The Most Common Callback on Kitsap Fence Jobs"
    description: |
      Gate hardware fails faster than any other fence component in Bremerton's climate.

      It's almost always the same two parts. The top hinge binds because the post has shifted slightly through freeze-thaw cycling. The self-closing spring loses tension after two winters and the gate stops latching reliably.

      D&D Technologies makes the TCA (Through-Carriage Adjustable) hinge series. It holds post-alignment tolerance far better than standard strap hinges and stays adjustable after installation without removing the gate. Pool barrier gates get paired with a Lokk-Latch magnetic gate latch for IRC R326 compliance.

      On double drive gates, heavy-duty stainless-steel cane bolts set into a concrete drop-rod receiver in the footing prevent sag on the passive panel. Upgrading from builder-grade to D&D TCA hinges and Lokk-Latch hardware adds $180–$260 per gate opening. On any gate used more than twice a day — driveway access, side yard access to a deck — that upgrade pays back in the first year by skipping one service call.

