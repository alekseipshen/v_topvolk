      All of those ranges include posts set in concrete footings, rails, pickets, and standard gate hardware.

      A 150-foot cedar privacy fence with two walk gates on a flat Bremerton lot typically totals $3,800–$5,500. Slope, gate count, and rock subsurface all move the number. The on-site estimate delivers exact line-item pricing — no ranges, no surprises at invoice. Free consultation; call (206) 591-1096 or schedule online.

  - q: "Does Bremerton require a building permit for a standard backyard fence?"
    a: |
      A residential fence under 6 feet in height in Bremerton generally does not require a building permit through City of Bremerton Development Services.

      The exception is fences attached to or built on top of a retaining wall over 4 feet tall (measured from footing bottom). Those require a permit and a site plan showing property line setbacks. Fence work near a shared boundary line sometimes also triggers a survey verification step before the city will sign off.

      TopVolk is a WA Licensed Contractor and handles permit applications on your behalf when required — that's included in the project scope. Call (206) 591-1096 with specifics about your lot if you're unsure whether your project crosses the permit threshold.

  - q: "Can you build a horizontal slat cedar fence in the Manette neighborhood?"
    a: |
      Yes, and it's one of the more common requests we get in Manette and the newer construction areas near East Bremerton.

      Horizontal slat fencing requires structural 4x4 posts at 6-foot centers maximum — sometimes 5-foot centers on 6-foot-tall designs — because horizontal rails act as a sail in wind events without enough intermediate post support. Slats are 1x4 or 1x6 clear vertical-grain cedar, spaced 1/4 to 3/8 inch for privacy with airflow.

      Every slat gets secured with stainless-steel screws. Standard galvanized fasteners corrode visibly within two seasons in Bremerton's salt air off the Narrows. Design, post layout, and slat spacing take about 30 minutes to nail down on-site during the estimate visit.

  - q: "How long will a cedar fence actually last in Bremerton's climate?"
    a: |
      A properly installed cedar fence with maintained footings and sealed boards lasts 15–20 years in Kitsap County conditions before full replacement makes more sense than ongoing repair.

      Posts in direct ground contact are the weak point. AWPA UC4B pressure-treated lumber for posts instead of cedar extends post life by 5–8 years. Pickets and rails treated with TWP-100 Series penetrating oil sealer every 18–24 months typically hold structure for 15-plus years.

      Vinyl panels from CertainTeed carry a lifetime structural warranty transferable to new homeowners. Gate hardware — hinges and latches specifically — is the first component to service on any fence regardless of material, generally around year 5 to 7 depending on use frequency.

