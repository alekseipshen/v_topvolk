title: "Ferndale Drywall Installation — Hang, Tape, Finish, Firecode"

answer: "Vladislav Volkov hangs, tapes, and finishes drywall in Ferndale, Washington in 3-6 days per room, with Type-X firecode and Level 5 finish options."

intro: |
  Pull the popcorn texture down in a Pacific Highlands rancher built in the late 1970s and the ceiling drywall underneath is almost never finished past a Level 2 tape job — the old texture was there to hide seams, not celebrate them. Skim-coating that ceiling flat enough for can lights or a smooth paint job takes a real coat of joint compound over the whole surface, not just a patch at the seams. Out toward Craig Road and the Ferndale Golf Course side of town, a different problem shows up: garage-to-DADU conversions under WA HB 1337 that need 5/8-inch Type-X firecode board (USG Sheetrock Brand Fire-Rated) on the wall shared with living space before Whatcom County PDS will clear the rough-in inspection. Vladislav Volkov handles both jobs directly, from popcorn removal near Tennant Lake to Level 5 sidewall finish for a remodeled kitchen. Quotes list board type, mud coats, and labor as separate line items — no lump-sum guessing. Call (206) 591-1096 before you sign anything with a bigger outfit.

localContext: |
  Ferndale's housing stock splits pretty cleanly by decade. Downtown and the blocks near Pioneer Park still have older homes with plaster-and-lath or early blue board walls that need veneer plaster matching when a wall gets opened up for a remodel. The ranch and split-level homes built through the 1970s and 80s around Pacific Highlands and Correll Park carry the popcorn ceilings and single-layer 1/2-inch board that was standard then — no vapor barrier detailing at exterior walls, which matters once Whatcom County's fall rain soaks into an uninsulated crawlspace and telegraphs through as ceiling staining. Newer construction out past 98248 toward the county line, including infill and DADU builds, falls under different rules depending on parcel: inside city limits it's the City of Ferndale Building Department, while unincorporated pockets toward Custer and the 98226 Bellingham fringe go through Whatcom County PDS. Humidity off the Nooksack River floodplain is also a factor — laundry rooms and basements near the river need moisture-resistant board, not standard white board, or the paper facing goes soft within a couple of wet seasons.

commonProblems:
  - title: "Purple Board Gone Soft Behind the Tub Surround"
    description: "Standard drywall behind a tub or shower pan holds up for a while, then the paper facing on regular white board starts to bubble once steam gets behind the tile — usually inside 3-5 years if nobody ran the bath fan. The fix is National Gypsum PURPLE XP or USG Sheetrock Mold Tough board set behind any wet-area tile, tied into a Schluter Kerdi membrane or RedGard liquid membrane at the pan itself. Laundry rooms near Correll Park see the same failure on the wall behind the washer. Swapping a standard 5x8 bathroom to purple board runs roughly $650-$1,200 including tear-out, and it's a 2-3 day job once the old board is out."
  - title: "5/8-Inch Type-X Firecode Walls for Garage and DADU Conversions"
    description: "Converting a garage into living space, or building a detached ADU under WA HB 1337, means the shared wall between garage and habitable space needs 5/8-inch Type-X firecode board, not standard 1/2-inch — USG Sheetrock Brand Fire-Rated Type X is the standard call-out. Skip it and the rough-in inspection fails, full stop, whether it's Whatcom County PDS or the City of Ferndale Building Department reviewing the plan set. Taping and mudding Type-X takes an extra coat compared to standard board because the core is denser and drinks more compound. Expect $3.50-$5 per square foot installed for a firecode wall, finish included, and 4-6 weeks lead time once the DADU permit itself is approved."
  - title: "Patching Drywall After the Electrician and Plumber Rough-In"
    description: "Whole-house remodels always leave a trail of holes — outlet boxes moved, a new supply line run through a top plate, a Mitsubishi mini-split line set punched through a bedroom wall. Each opening needs blocking behind it if it's near a corner, then a proper patch with tapered edges so the mud doesn't telegraph a bump once it's painted. This is where a blue tape walkthrough matters: marking every patch location before the drywall crew shows up so nothing gets missed and the punch list stays short. On a typical 1,800 sq ft remodel in Ferndale, patch-and-finish work after MEP rough-in adds 3-4 days and runs $1,500-$3,000 depending on how many openings there are."
  - title: "What Ferndale Homeowners Actually Pay Per Square Foot"
    description: "Hang, tape, and standard Level 4 finish runs about $2.25-$3.50 per square foot in Ferndale once labor and board are both counted — Level 5 skim coat for sidewall lighting adds another $0.75-$1.25 per square foot on top of that. Ceiling height, access (a two-story stairwell versus a single-story bedroom), and board type all move the number up or down. Type-X firecode and moisture-resistant purple board both cost more per sheet than standard white board, which shows up in the line-item quote rather than getting buried. Every TopVolk quote breaks out board type, number of mud coats, and labor separately, and the deadline itself is written into the contract with a penalty if it slips."
  - title: "Popcorn Ceiling Skim Coats and Veneer Plaster Matching in Older Homes"
    description: "Homes built before the early 1980s sometimes have popcorn texture that needs asbestos testing before anyone touches it — that's a separate step, not optional, and it should happen before demo starts. Once it's cleared, skim-coating the ceiling flat takes two to three coats of joint compound feathered out wide, usually CertainTeed or USG topping compound, then a light sand and prime. Older homes near downtown Ferndale with original blue board and veneer plaster walls need a plaster-compatible patch mix, not standard drywall mud, or the new patch will flash a different sheen under raking light. A full ceiling skim coat in a 12x14 room runs $900-$1,500 and typically takes 4-5 days including dry time between coats."

