  - q: "Do I need a permit for firecode drywall in a Ferndale garage-to-ADU conversion?"
    a: "Yes — a garage conversion or DADU build under WA HB 1337 needs a permit before the firecode wall goes up, and the rough-in inspection specifically checks for 5/8-inch Type-X board on the shared wall. Projects inside city limits go through the City of Ferndale Building Department; unincorporated parcels toward Custer or the county line go through Whatcom County PDS instead. Plan review typically runs a few weeks depending on the jurisdiction's queue. TopVolk is a WA Licensed Contractor and handles the plan set and inspection scheduling as part of the project."
  - q: "What drywall do you use for bathrooms and laundry rooms in Ferndale?"
    a: "Wet areas get National Gypsum PURPLE XP or USG Sheetrock Mold Tough board instead of standard white board, tied into a Schluter Kerdi or RedGard membrane at the shower pan and niche. Ceilings over tub surrounds get the same moisture-resistant board, since steam rises before it settles. For shared-wall soundproofing between a laundry room and a bedroom, resilient channel or QuietRock gets added to cut down on washer and dryer noise transferring through the studs. All of it gets specified on the quote by product name, not just 'drywall.'"
  - q: "How long does a drywall finish actually last in Ferndale's climate?"
    a: "A properly finished wall or ceiling — Type-X, purple board, or standard, doesn't matter — should hold up 20+ years with no issues as long as moisture stays out from behind it. Whatcom County's wet fall-to-spring stretch is hard on drywall specifically where a roof leak or a bath fan that never got installed lets humidity sit behind the board; that's where bubbling and staining show up first. Workmanship on hang and finish is warrantied, and TopVolk builds a deadline penalty into every contract so the schedule isn't just a verbal promise. Moisture damage from an unrelated leak isn't covered, but the original installation is."
