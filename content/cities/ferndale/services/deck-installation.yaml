title: "Ferndale Deck Installation — Cedar or Composite, Built to Code"

answer: "TopVolk Construction builds code-compliant decks in Ferndale, Washington — cedar or composite, permits pulled, owner on-site, 100+ projects since 2023."

intro: |
  A rotted ledger board hiding behind the siding is the most common reason a "deck repair" call in Ferndale turns into a full rebuild — by the time the spongy spot near the house shows up, the rim joist behind it is usually compromised too. TopVolk Construction handles that from the ground up: proper footings, flashed ledger attachment, code-height guardrails, and a material choice that actually survives Whatcom County winters. Ferndale sits close enough to the Nooksack River and Hovander Homestead Park that plenty of backyards here run damp well into June, and a deck built with the wrong fasteners or undersized footings shows it within two or three seasons. We've built decks off older farmhouses near downtown Main Street and off newer builds out toward Star Ridge, and the failure points are almost always the same — ledger flashing, footing depth, and cheap hardware. TopVolk uses Trex or TimberTech composite decking where low maintenance matters, or cedar where the homeowner wants the traditional look and is willing to reseal it. Either way, Vladislav Volkov is the one on-site measuring the footings, not a subcontractor you've never met.

localContext: |
  Ferndale's housing stock runs from early-1900s homes near downtown (98248) to 1960s-70s ranch houses scattered through the older residential streets, up to newer subdivisions like Star Ridge and Vista View built in the 2000s. Older homes near Pioneer Park often have rim joists installed without modern flashing details, which matters a lot once you're bolting a ledger board into that same wall for a new deck. Homes inside city limits pull permits through the City of Ferndale Building Department; anything just outside the city line — plenty of the acreage lots off Portal Way and Delta Line Road fall this way — goes through Whatcom County Planning and Development Services (PDS) instead, and the two offices don't always want the same paperwork. Both zip codes we work in, 98248 and 98266, see enough winter rain and river-bottom humidity that ground-contact PT lumber and proper footing depth below the frost line aren't optional. A deck built without that in Ferndale is a deck you're repairing again in five years.

commonProblems:
  - title: "Cedar looks good in the shade — and grows moss faster than you'd think"
    description: "Cedar decking on the shaded side of a house near Tennant Lake or under mature trees along the Nooksack holds moisture against the board face, and moss takes hold on the north-facing boards within two seasons if it isn't sealed and cleaned annually. The fix isn't always tearing it out — Cabot semi-transparent stain reapplied every 2-3 years and a yearly oxygen-bleach wash keeps cedar decking serviceable for 15-20 years. For homeowners who don't want that maintenance schedule, we spec Trex Transcend or TimberTech AZEK composite instead, both of which shed moss with a garden hose. Composite conversion on an existing 300 sq ft deck runs roughly $9,000-$14,000 depending on railing choice."
  - title: "Guardrail height gets missed on DIY and older decks constantly"
    description: "Any deck surface more than 30 inches above grade needs a guardrail at least 36 inches high under the IRC, with baluster spacing that won't pass a 4-inch sphere through — that second part is the one older Ferndale decks fail almost every time. We see this on 1970s ranch homes where a deck was added without a permit decades ago, and now a listing inspection or a resale appraisal flags it. Bringing an existing deck up to code usually means swapping the top rail and adding intermediate balusters, not rebuilding the whole structure. DeckoRail aluminum baluster kits fit most existing post spacing and run about $40-$60 per linear foot installed."
  - title: "Permit paperwork depends on which side of the city line you're on"
    description: "Inside Ferndale city limits, deck permits go through the City of Ferndale Building Department, and any deck attached to the house needs a ledger flashing inspection before the decking goes down, plus a final inspection after railings are installed. Just outside the line — several properties off Portal Way and out toward Custer — fall under Whatcom County PDS instead, with a slightly longer plan review window, typically 3-4 weeks versus 2-3 for the city. TopVolk pulls the permit, schedules both inspections, and shows up for them; you don't have to take time off work to meet an inspector. As a WA Licensed Contractor, we've been through this process on both sides of that city line more than once, and missing an inspection date is written into our contract as a penalty we pay, not you."
  - title: "What actually drives the price on a Ferndale deck"
    description: "A straightforward ground-level deck in Ferndale runs $30-$45 per sq ft in PT lumber and roughly $45-$70 per sq ft in composite, once you count post footings, joist hangers, and railing. Second-story decks over living space cost more because they need proper drainage planning underneath — a sloped sub-deck membrane system, not just gaps between boards — plus larger LVL beams to carry the span. Stairs, built-in benches, and lighting add line items too. For a typical 250-300 sq ft attached deck with Trex decking and aluminum railing, expect $18,000-$26,000, quoted with exact line-item pricing, not a vague range."
  - title: "How long a deck actually lasts here — and when to stop patching it"
    description: "PT lumber framing under a well-built deck runs 25-30 years if the footings and flashing were done right from the start; the decking surface itself wears out faster, especially cedar left unsealed. Simpson Strong-Tie joist hangers and structural screws corrode faster than people expect in ground-contact, humid crawlspace conditions, so we inspect hardware on any rebuild before reusing the frame. Composite decking from Trex or Fiberon carries a 25-50 year fade and stain warranty and needs nothing beyond a seasonal wash. Once you're replacing more than a third of the boards or the ledger board shows soft spots, it's a rebuild, not a repair — patching past that point just delays the same cost."

