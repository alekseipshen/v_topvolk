  - q: "What does a panel upgrade cost in Enumclaw?"
    a: "A straightforward 100A to 200A panel upgrade typically runs $3,200-$5,800 here, depending on whether the meter base needs replacing and how PSE's coordination timeline lines up. Homes with knob-and-tube or aluminum wiring feeding the panel often need extra work at the same time, which changes the number. Every quote is line-item — panel, breakers, permit, labor — not a range. TopVolk offers a free on-site consultation to give an exact figure before signing anything."
  - q: "Does Enumclaw require a permit for panel work?"
    a: "Yes — Enumclaw is an incorporated city, so panel swaps, service upgrades, and most rewiring go through the City of Enumclaw building department rather than King County DPER (DPER only applies to unincorporated county land nearby). Expect roughly 1-2 weeks for plan review and scheduling on a standard panel swap, plus a rough-in inspection and final inspection once the work's done. TopVolk pulls the permit, coordinates with PSE for the meter side, and handles both inspections. WA Licensed Contractor — Vladislav manages the paperwork directly, no third party."
  - q: "Can you run a 60A circuit for a Tesla Wall Connector?"
    a: "Yes, that's a common install — a dedicated 60A circuit with 6-gauge copper back to the panel, sized specifically for a Tesla Wall Connector rather than a shared circuit. ChargePoint and JuiceBox units usually run on a 50A circuit instead, so the wire gauge and breaker size get matched to whichever charger is going in. If the panel's already near capacity, that gets flagged during the on-site visit before any wire gets pulled. Detached garages add conduit and trenching cost depending on distance from the main panel."
  - q: "How long does electrical work like this actually last?"
    a: "Copper wiring and modern breakers installed today should outlast the house — 40+ years is normal with no maintenance beyond occasional breaker testing. AlumiConn connectors on aluminum wiring are rated for the life of the connection, not just a temporary fix, and don't need revisiting once installed correctly. Panels and breakers from Square D or Eaton carry manufacturer warranties, typically 5-10 years on the breakers themselves, with the panel enclosure lasting decades in a dry, code-compliant install. What doesn't hold up is deferred maintenance — loose aluminum connections left alone for years are the actual failure point, not the wire."
