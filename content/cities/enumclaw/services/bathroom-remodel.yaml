title: "Enumclaw Bathroom Remodel — Foothill Homes, King County Permits"

intro: |
  Crystal Mountain sits 24 miles up Highway 410 from downtown Enumclaw — that elevation gap matters when you're renovating a bathroom. Freeze-thaw cycles in 98022 run harder than lowland King County, which accelerates grout cracking and tile separation in foothill homes year over year. A Kohler pressure-balance valve that's been dripping behind cracked caulk all winter does more damage than most homeowners realize until demo day.

localContext: |
  The neighborhoods east of Highway 169 and along the Griffin Avenue corridor are mostly mid-century ranchers and 1970s split-levels — built between 1955 and 1980, many with original galvanized supply lines and cast-iron drain stacks. Zip code 98022 also includes 1980s-90s tract subdivisions with builder-grade fixtures well past their useful life. Enumclaw's agricultural lots often run on well water with higher mineral content than city supply, which shortens faucet cartridge and valve body lifespan noticeably.

commonProblems:
  - title: "Freeze-Thaw Grout Cracking and Tile Separation in Foothill Homes"
    description: "Temperature swings near the Cascades — colder winters than Renton or Kent — cause grout joints to open and organic mastic adhesive under field tiles to fail. Once the grout cracks, moisture migrates behind the substrate. Schluter Kerdi membrane or RedGard applied to concrete board during the remodel breaks the cycle; the builder-era poly sheeting underneath does not."
  - title: "Cast-Iron and Galvanized Drain Stacks Past Service Life in 1960s-70s Ranchers"
    description: "Mid-century Enumclaw homes frequently have original galvanized supply lines and cast-iron drain stacks corroding from the inside out — slow drains and rust-colored water on first use after vacation are the early signs. Any master bath layout change requires rough-in rerouting and a new ABS branch line before finish work begins, work the City of Enumclaw building department inspects at rough-in stage."
  - title: "Single-Layer Waterproofing Failure in 1980s-90s Builder-Grade Baths"
    description: "The 1980s subdivisions off Highway 169 were built with poly sheeting behind tile instead of a bonded waterproofing membrane. PNW humidity combined with undersized exhaust fans — many pull under 50 CFM — drives mold into the backer board behind the shower surround. Moen and Delta shower valve cartridges from that era also show temperature control failure that a valve body swap fixes during the remodel."

