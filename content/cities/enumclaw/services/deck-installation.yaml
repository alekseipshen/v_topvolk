title: "Enumclaw Deck Installation — Foothills-Ready Framing and Permits"

intro: |
  Sitting at roughly 750 feet elevation, Enumclaw gets genuine freeze-thaw winters — the kind
  that crack improperly seated concrete piers and heave post footings that weren't dug past
  frost line. Most housing near the Enumclaw Expo Center and along Griffin Avenue is 1970s ranch
  construction, with original cedar decks long past replacement. Vladislav has pulled multiple
  permits through King County DPER for these ranchers, with ledger flashing inspections handled
  correctly before a single decking board goes down.

localContext: |
  The 98022 zip covers a mix of 1970s ranchers and some older bungalows on the north side of
  town. Lot sizes tend to run generous — quarter-acre and up — so homeowners have room for a
  real deck, not just a landing. Properties east of downtown toward the White River valley
  sometimes sit on slope, which adds beam span calculations to the structural plan and changes
  footing depth requirements. King County DPER issues permits here, not Seattle SDCI — different
  process, different timeline.

commonProblems:
  - title: "Post Footings Heaving on Enumclaw's Frost-Affected Soils"
    description: >-
      Enumclaw's elevation keeps soil temperatures lower and longer than Bellevue or Renton.
      Footings set at 12 inches — standard in the lowlands — crack and move here within two
      seasons. Code in this jurisdiction calls for 18-inch minimum depth into undisturbed soil,
      tube forms filled with structural concrete, and PT lumber posts rated for ground contact.
      Skip that depth and the whole frame shifts.

  - title: "Ledger Rot Destroying Rim Joists on 1970s Ranchers Along Griffin Avenue"
    description: >-
      Original ranchers in 98022 have exposed rim joists that have absorbed 50 years of PNW
      rain. Bolting a ledger board without through-flashing — metal flashing lapped over the
      ledger top, sealed, and kicked out at the bottom — lets water sit behind the ledger and
      rot the rim joist in three to five years. King County DPER requires a ledger flashing
      inspection before framing can continue; that inspection exists for a reason.

  - title: "Cedar Decking Mossing Over Fast on North-Facing Enumclaw Lots"
    description: >-
      North-facing lots here stay damp from October through May. Cedar greyes out within one
      season and starts mossin over by year two without yearly treatment and cleaning. Trex
      and TimberTech composite boards don't absorb moisture, so mold and algae have no foothold.
      The upfront cost runs $3-5 more per linear foot, but there's no annual sealing cycle and
      no replacing cupped boards in year seven.

faq:
  - q: "How fast can you get to Enumclaw for Deck Installation?"
    a: >-
      Enumclaw is about 45 minutes southeast of Auburn via SR-164 — Vladislav schedules
      on-site consultations within the week. King County DPER plan review for a new attached
      deck typically runs 4-8 weeks after submittal. Call (206) 591-1096 to set up a free
      on-site estimate with the contractor who'll actually build it.

  - q: "Do you work with Trex, TimberTech, or is cedar still worth it for Enumclaw?"
    a: >-
      Both Trex Transcend and TimberTech AZEK lines hold up well in 98022's climate —
      AZEK especially handles the moisture exposure on shaded lots. Tight-grain Western red
      cedar is still a solid option if you're willing to seal and clean annually. We'll walk
      through the real cost difference at the consultation. TopVolk is a WA Licensed
      Contractor — no upsell pressure, just line-item pricing.

  - q: "What does the permit process look like for a deck in Enumclaw, and how long does it take?"
    a: >-
      King County DPER handles permits for Enumclaw — not the City of Enumclaw, which matters
      for where you submit. Plan review on a standard attached deck runs 4-8 weeks. We pull
      the permit, manage the ledger flashing inspection, rough-in, and final inspection.
      Total project timeline from permit submittal to a finished deck with guardrails and stair
      stringers: typically 8-12 weeks. Deadline penalties are written into every contract.
      Call (206) 591-1096 to start.