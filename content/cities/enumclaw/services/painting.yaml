  - q: "Do I need a permit to repaint my house in Enumclaw?"
    a: "King County doesn't require a building permit for a standard interior or exterior repaint since it's cosmetic and doesn't touch structure, electrical, or egress. Newer plateau developments with an HOA, especially ones near the golf course, often require exterior color approval before work starts, so it's worth pulling those covenants first. Pre-1978 homes near Franklin and Cumberland fall under EPA RRP rules if scraping or sanding disturbs old paint, which is a federal requirement, not a King County one. TopVolk Construction is a WA Licensed Contractor and handles RRP documentation as part of the job on qualifying homes."
  - q: "What paint actually holds up on cedar siding out here?"
    a: "Sherwin-Williams Duration and Benjamin Moore Aura exterior both perform well on cedar in this climate because they stay flexible through freeze-thaw swings instead of cracking at the grain. Back-priming new cedar boards before installation, coating the back side and not just the face, cuts moisture absorption significantly and is worth the extra day on new siding sections. Oil-based primers still beat acrylic for blocking tannin bleed on raw cedar, which is why a shellac primer like Zinsser BIN often goes down first even under a fully acrylic topcoat system."
  - q: "How long does an exterior repaint actually last around Enumclaw?"
    a: "A properly prepped and primed exterior repaint holds seven to ten years in this climate before it needs more than a touch-up. Skipping spot-priming on bare wood or cutting the acrylic down to one coat instead of two usually cuts that lifespan to two or three years. Workmanship is warrantied against early peeling or blistering, though normal UV fading on darker colors isn't covered since sun exposure varies by elevation and tree cover on each lot. North-facing walls near tree lines tend to hold paint the longest but grow moss faster, which is a maintenance issue, not a paint failure."
