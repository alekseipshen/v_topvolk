  - q: "What does a repipe or tankless conversion cost in Enumclaw?"
    a: "Pricing for a galvanized or polybutylene repipe runs $2,500-$15,000 on an average Enumclaw home. It depends on square footage, number of fixtures, and single-bath versus whole-house scope. A tankless conversion with gas line upsize typically lands between $4,500 and $8,000 installed, more if the electrical panel needs work too. Rinnai and Navien units themselves run $1,800-$3,200, depending on BTU output and venting setup. Every quote from TopVolk is line-item — labor, materials, and permit fees broken out separately. A free on-site consultation gets you exact pricing before any contract gets signed."
  - q: "Do I need a permit for a water heater replacement in Enumclaw?"
    a: "Yes. City of Enumclaw requires a plumbing permit for any water heater replacement, tankless or tank-style. WA state code requires seismic strapping regardless of jurisdiction. Addresses in unincorporated pockets like Selleck or Cumberland go through King County DPER instead of the city desk. Plan review usually runs a few days for a straightforward swap. TopVolk pulls the permit, schedules the rough-in and final inspection, and handles the AHJ paperwork as part of the contract. WA Licensed Contractor, so nothing gets installed off the books."
  - q: "PEX or copper — which is better for a repipe in Enumclaw?"
    a: "PEX-A is what gets run on most remodel repipes. It handles freeze-thaw cycles better than rigid copper, costs less installed, and there's no soldering near existing framing. Copper still shows up for exposed runs near a water heater, or where local code calls for it. Either material outperforms the galvanized or polybutylene it's replacing. SharkBite push-fit fittings speed up tie-ins during a remodel where walls are only open for a few days. Either one holds up fine through an Enumclaw winter as long as crawlspace lines get proper insulation."
  - q: "What's the warranty on plumbing work done during a remodel?"
    a: "Workmanship on plumbing scope is covered for one year. Manufacturer warranties carry through separately. Rinnai and Navien tankless units typically run 10-12 years on the heat exchanger. Moen and Kohler fixtures carry lifetime warranties on the cartridge. PEX-A supply lines have a service life well past 40 years when they're not exposed to UV or freeze damage. TopVolk also writes a deadline penalty into the contract. A delayed rough-in or final inspection isn't just an apology — it's a number in the paperwork."
