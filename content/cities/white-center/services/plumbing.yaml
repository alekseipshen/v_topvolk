title: "White Center Plumbing — Old Pipe Fixes for 98106 Homes"

answer: "A licensed contractor repipes galvanized pipe and installs tankless water heaters in White Center — King County DPER permits, owner-run since 2023."

intro: |
  A licensed contractor repipes galvanized and polybutylene lines, converts homes to tankless water heaters, and pulls King County DPER permits for White Center residents, with most repipe jobs scheduled inside two weeks of the estimate. A lot of the calls start the same way — someone near Steve Cox Memorial Park or Roxhill Park notices the shower pressure dropping every winter and figures the water heater is dying. It usually isn't. White Center's housing stock runs older than most of unincorporated King County, and pipe age catches up with these homes on its own schedule. A Moen shower valve that's worked fine since the first owner installed it in 1962 stops delivering water once the galvanized supply line behind it has rusted down to a pinhole. Vladislav Volkov runs the walkthrough, the permit, and the install personally — the number on the estimate is the number on the invoice, and if the job runs past the agreed deadline, a penalty written into the contract kicks in.

localContext: |
  White Center sits in unincorporated King County split across 98106 and 98146, wedged between West Seattle and Burien with Highway 509 running the eastern edge. A big share of the housing near 16th Ave SW and Delridge Way dates to the 1940s and 50s — small single-story bungalows built for shipyard and Boeing workers after the war — plus a scattering of older cottages closer to Roxhill Park and White Center Heights Park. Those homes came standard with galvanized steel supply lines and cast iron or Orangeburg drain pipe, and past the 70-year mark, most of that plumbing is past its intended service life. Because White Center is unincorporated, permits for water heater swaps and repipes go through King County DPER, not Seattle SDCI — different portal, different inspector rotation, usually a shorter turnaround for a straightforward residential permit. Crawlspace access is tight on a lot of these lots, which matters when PEX has to get fished through a post-and-pier foundation instead of a poured slab.

commonProblems:
  - title: "Galvanized Supply Lines Rusting Shut Near 16th Ave SW"
    description: "Rust builds up on the inside wall of galvanized steel pipe faster than it shows on the outside, so a homeowner near 16th Ave SW usually notices weak flow at the upstairs shower years before a pipe actually fails. The fix isn't patching the shutoff valve or swapping the Moen cartridge — it's rerouting the branch lines in PEX-A, tied in with SharkBite or Uponor fittings where a full copper run isn't practical through the crawlspace. A whole-house repipe on a typical White Center bungalow runs $8,000 to $14,000 depending on the number of fixtures and how much drywall has to come down, and takes 3 to 4 working days plus the King County DPER inspection."
  - title: "Polybutylene Behind the Walls in 80s Infill Homes"
    description: "A handful of townhomes and infill builds from the 1980s in White Center still run polybutylene, the gray plastic pipe that was standard before it started failing at the acetal fittings and got pulled from code in most states. It doesn't always leak right away — it just goes brittle over time, and a freeze-thaw week in the foothills is enough to crack a joint that looked fine the day before. Most insurers won't renew a policy once poly-B shows up on an inspection report. The fix is a full PEX-A repipe, usually Uponor AquaPEX, run in the same walk-space as the old poly-B lines to keep drywall damage to a minimum."
  - title: "Tankless Conversions Need a Bigger Gas Line and a DPER Permit"
    description: "Swapping a 40-gallon tank for a Rinnai or Navien tankless unit sounds like a straight swap, but the BTU jump almost always means upsizing the gas line — often re-running CSST from the meter instead of relying on the old 1/2-inch black iron branch. Add in seismic strapping required under Washington state code for any water heater, tank or tankless, and a proper vent run to the exterior. King County DPER requires a permit and a final inspection on this work; skipping it is the kind of thing that shows up during a home sale. Vladislav Volkov pulls the permit and schedules the rough-in and final inspection as part of the job, not as an afterthought."
  - title: "What Actually Drives the Price on a Bathroom Repipe or Fixture Swap"
    description: "Line-item pricing on a bathroom plumbing job in White Center depends on four things: how many fixtures move, how much wall or ceiling has to open up, what tier of fixture goes in, and whether the drain line needs rerouting for a new layout. A Kohler or Delta fixture package runs different money than a builder-grade set, and moving a toilet drain even 18 inches can mean cutting into the cast iron main instead of just swapping a supply line. Straightforward fixture-only jobs start around $1,200 to $2,500 per bathroom; full repipe-and-remodel work runs higher once framing and finish work get involved. Every quote from TopVolk is a flat number, not a range — no change orders that weren't discussed first."
  - title: "High Static Pressure Wearing Out Water Heaters Early"
    description: "Water pressure on parts of the King County system feeding White Center runs above 80 psi at certain times of day, which is hard on tank seams, supply line fittings, and the tankless heat exchanger alike. Without a pressure-reducing valve (PRV) and a properly sized expansion tank, a water heater rated for 10-12 years can start weeping at the tank seam in half that time. A PRV install runs a few hundred dollars and takes under two hours, and it's cheap insurance against a tank failure that floods a finished basement. Anyone doing a water heater replacement in White Center should get pressure tested at the same visit — it's a five-minute check with a gauge on an outdoor spigot."

