  - q: "Should I replace galvanized pipe with PEX or copper?"
    a: "PEX-A, run with Uponor or SharkBite fittings, is the more common call in White Center's crawlspace-style foundations because it flexes around framing without needing as many joints, and it holds up better through freeze-thaw swings in the colder months. Copper still gets used for exposed runs near a water heater or where local code requires it. Both outperform the original galvanized steel by a wide margin — the failure point with galvanized is always internal corrosion narrowing the pipe, not the material choice at install."
