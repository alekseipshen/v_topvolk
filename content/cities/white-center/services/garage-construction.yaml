  - q: "What does a detached garage cost in White Center?"
    a: "A standard single-car detached garage runs $28,000-$42,000, and a two-car version with a DADU above under WA HB 1337 runs $120,000-$180,000-plus depending on finishes and mechanical scope. Site condition drives a lot of the swing — sloped lots near Shorewood need more excavation, and older parcels sometimes need utility relocation before the slab pours. We quote line-item, not lump-sum guesses, so you see what the LVL beam, siding package, and garage door cost separately. That estimate holds even if lumber pricing shifts mid-project, since it's locked into the signed contract."

  - q: "Does White Center require a permit for a detached garage?"
    a: "Yes — since White Center is unincorporated King County, every detached garage, attached conversion, or DADU addition goes through King County DPER, not Seattle SDCI, even though the Seattle city line runs a few blocks east near Highland Park. DPER requires a site plan, setback confirmation, and structural drawings for anything over 200 square feet or with a second story. We prepare and submit that packet ourselves, then handle rough-in and final inspection scheduling once framing's done. TopVolk is a WA Licensed Contractor, and plan review typically takes 4-8 weeks for a detached garage, longer with a DADU."

  - q: "Can you pre-wire my new garage for an EV charger?"
    a: "Yes, we run a dedicated 50A or 60A circuit from the main panel during framing, before drywall goes up, so there's no need to open walls later for a Level 2 charger. Most older homes in White Center have 100A service, so we check panel capacity first and recommend an upgrade if the math doesn't leave headroom for the garage's other loads — lighting, opener, mini-split. We typically spec a NEMA 14-50 outlet even before you've picked a charger brand, since most residential EV chargers use that plug standard. It adds roughly $900-$1,500 depending on panel distance."

  - q: "How long will a new garage hold up in this climate?"
    a: "A properly built garage here — 4-inch fiber-reinforced slab, PT sill plates, Hardie or engineered siding — should run 40-plus years structurally with basic upkeep. The parts that wear faster are the garage door seals and any cedar trim facing north, since White Center gets shaded, moss-prone exposure near the greenbelt and roughly 37 inches of rain a year. We warranty our structural and workmanship work, and steer clients toward composite trim over cedar wherever the roofline sits in shade most of the day. Weatherstripping and door hardware are wear items — replace those every 10-15 years regardless of build quality."

  - q: "Do you serve areas near White Center too?"
    a: "King, Snohomish, Pierce, and Kitsap counties make up our full service area out of Seattle, so Burien, West Seattle, Tukwila, and Normandy Park are regular stops alongside White Center jobs. Scheduling windows run 2-4 weeks out for design and permit prep, longer during peak spring and summer building season. Vladislav handles every site visit and contract personally — no subcontracted sales calls, no middlemen quoting a job he hasn't seen. Call (206) 591-1096 for current lead times; we've completed 100-plus projects since 2017 across this exact service area."