title: "White Center Garage Builds — DADU-Ready Under HB 1337"

answer: "TopVolk Construction builds detached and attached garages in White Center, Washington — King County DPER permits, 4-inch slabs, 100+ projects since 2017."

intro: |
  A detached garage in White Center runs $28,000 to $95,000-plus depending on size, foundation work, and whether you're building DADU-ready under WA HB 1337 — TopVolk Construction has framed more than a dozen of these across the 98106 and 98146 zips since 2017. Most lots here run narrow, a holdover from the post-war platting that put small ramblers and bungalows on quarter-acre parcels between Evergreen and Shorewood. That means garage placement has to clear King County DPER setback rules before a shovel ever hits dirt. A homeowner near Steve Cox Memorial Park called us last spring after her contractor quoted a garage door install without checking the property line — DPER review would've bounced the whole permit. We pour the slab, frame the walls, hang a LiftMaster opener, and pre-wire the EV circuit in the same visit, so there's no second trip for a sub. Vladislav Volkov runs every job personally — no sales rep, no missed-deadline excuses, penalties written into the contract.

localContext: |
  White Center's housing stock skews small and old — plenty of 1940s and 1950s post-war ramblers on 98106 lots that never got a garage at all, just a gravel pad or a carport bolted onto the side yard. Newer infill near Boulevard Park and Gregory Heights, built after 2005, comes with two-car attached garages already poured, but those slabs often run 3.5 inches instead of the 4-inch fiber-reinforced minimum we spec today. Because White Center sits in unincorporated King County, every garage permit — new detached build, attached conversion, or DADU addition — runs through King County DPER, not Seattle SDCI, even though South Delridge and Highland Park sit two blocks away inside Seattle city limits. That jurisdiction line trips up a lot of DIY permit applications. Rain matters too: roughly 37 inches a year, and a garage roofline that doesn't tie into the existing house's drainage will pond water against the ledger board by December. We run Hardie siding on new builds facing north for that reason — it doesn't take on moss the way cedar does on a shaded wall near the greenbelt.

commonProblems:
  - title: "Detached Garage + DADU Above Under WA HB 1337"
    description: "Since WA HB 1337 passed, we've gotten a steady stream of calls from homeowners near Evergreen wanting a two-story detached garage — shop below, DADU above, rented out or used for family. The second floor needs an LVL beam or PSL post system sized for live load, not the 2x8 joists a single-story garage gets away with, and King County DPER plan review checks that math before permits issue. We frame with Douglas-fir, run R-49 insulation in the DADU ceiling, and install Milgard windows since they hold up against wind-driven rain better than aluminum-frame units from the 1990s. Height caps out at 24 feet for a DADU, and lot coverage rules can shrink your footprint if the parcel's under 5,000 square feet, which plenty are here. Full builds run 4 to 7 months end to end, permits included. Call (206) 591-1096 before you finalize a floor plan."

  - title: "Attached Garage Conversion Hits Foundation Problems"
    description: "Converting an attached garage to a bedroom or in-law space sounds simple until we open the slab and find it's poured 4 inches below the house's finish floor — standard for garages built before 1975 near Shorewood. That step-down means a full subfloor build-up: pressure-treated sleepers, DriCore subfloor panels, and a vapor barrier over the existing slab, before drywall goes up. Skip that step and you get cold floors and condensation every winter once the space is heated. We also check the rim joist and shared wall for insulation gaps, since garages were never built to R-49 wall standards. Budget an extra $8,000 to $15,000 over a straight cosmetic conversion once foundation and insulation work gets added in. It's the most underquoted line item on other contractors' bids."

  - title: "Setback and Permit Confusion at the County Line"
    description: "White Center sits close enough to Seattle that homeowners assume Seattle SDCI handles their garage permit — it doesn't, King County DPER does, since the neighborhood is unincorporated. Setback rules differ from the city: DPER typically wants several feet clear from the rear property line for a detached garage under a certain height, and corner lots near 98146 can trigger additional street-side setback review. We pull the survey, confirm FAR and lot coverage math, and submit through DPER's online portal ourselves, so you're not stuck deciphering the AHJ's checklist alone. Plan review for a detached garage usually takes 4 to 8 weeks; add a DADU on top and it stretches to 10-12 weeks with extra egress and mechanical review. TopVolk is a WA Licensed Contractor and handles every submittal directly."

  - title: "What Actually Drives Garage Construction Costs Here"
    description: "A basic single-car detached garage in White Center — slab, framing, siding, one insulated garage door — lands around $28,000 to $42,000 depending on site access and how much grading the sloped lots near Shorewood need. Add a second-story DADU and you're at $120,000-$180,000-plus once you count a second HVAC zone, a Mitsubishi mini-split, plumbing rough-in, and finish work. What moves the number most: excavation for a level 4-inch fiber-reinforced slab, foundation type on uneven lots, and whether the panel needs an upgrade to support a 50A or 60A EV charger circuit alongside the garage's own subpanel. We give line-item quotes, not ballpark ranges, so you know what a PSL post or extra concrete truck actually costs before you sign. Every contract carries a deadline penalty clause."

  - title: "Garage Doors, Weatherstripping, and Workshop Insulation"
    description: "Most garages built in White Center before the 1990s got a single steel door with zero insulation and a rubber seal that hardens and cracks within about eight Pacific Northwest winters. If you're using the space as a workshop — table saw, compressor, the works — an uninsulated door plus a leaky rim joist means single-digit temperature swings during a January cold snap. We swap in an insulated steel or composite door rated for wind load, reseal with new bulb-style weatherstripping, and add blocking around the frame if the opening's racked out of square, common on older post-and-pier foundations. Expect 15-20 years out of a quality insulated door versus 8-10 for a basic hollow panel. Budget $1,800-$3,500 installed, more if we're also insulating walls and running a mini-split."

