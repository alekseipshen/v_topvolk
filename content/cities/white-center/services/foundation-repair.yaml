  - q: "What does foundation repair cost in White Center?"
    a: "Small jobs like a single epoxy crack injection start around $450, while a full post-and-pier reinforcement with new footings and joist work runs $6,000-$18,000 depending on crawlspace access and how many posts need replacing. Seismic retrofit with mudsill bolting and shear wall plywood adds $4,000-$9,000 on top of that. Pricing depends on square footage, soil condition, and whether drainage work is needed alongside the structural fix. We provide a free on-site estimate with exact line-item pricing — no phone quotes, no vague ranges."
  - q: "Do I need a permit for foundation work in White Center?"
    a: "Yes — White Center is unincorporated King County, so foundation and seismic retrofit permits go through King County DPER rather than City of Seattle SDCI. DPER plan review for residential foundation work usually takes 2-4 weeks, and inspectors require a rough-in inspection before framing is covered plus a final inspection before close-out. TopVolk Construction is a WA Licensed Contractor and handles the full permit submittal, scheduling, and inspection coordination as part of the contract, so you're not chasing paperwork on your own."
  - q: "What's the difference between epoxy injection and mudjacking for a cracked foundation?"
    a: "Epoxy injection, using a low-viscosity product like Sika epoxy, bonds a crack back into a structural unit and stops water intrusion — it's the right call for hairline to quarter-inch cracks in a stem wall. Mudjacking or polyurethane foam lifting is a different repair entirely, used when a concrete slab has sunk and needs to be raised back to level rather than just sealed. Most White Center foundation cracks we see are settlement cracks in stem walls, which call for epoxy injection plus a Simpson Strong-Tie bracket if there's any bowing. We'll tell you on-site which one your house actually needs."
  - q: "How long does a foundation repair last in Seattle's climate?"
    a: "A properly installed pier post replacement on PT lumber with a poured concrete footing typically lasts 40-50 years, well past the lifespan of the untreated Douglas-fir posts common in older White Center crawlspaces. Vapor barrier and sump pump systems need an annual check but otherwise run 15-20 years before parts wear out. Epoxy-injected cracks are permanent as long as the surrounding soil movement is addressed with drainage, which is why we usually pair crack repair with a French drain on sloped lots. Workmanship is covered under warranty — ask for the specifics during your consultation."
  - q: "Do you cover areas near White Center, and how far out do you book?"
    a: "We work throughout King, Snohomish, Pierce, and Kitsap counties, including Burien, West Seattle, South Park, and the rest of the Highline area right around White Center. Scheduling typically runs 1-2 weeks out for a walkthrough during busy season, faster in the drier summer months when crawlspace conditions are easier to work in. Every contract includes a written completion date with a penalty if we miss it — that's not a verbal promise. Call (206) 591-1096 or ask about a free consultation to get on the schedule."