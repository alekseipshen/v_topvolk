title: "White Center Deck Installation — King County DPER, Post-War Homes"

intro: |
  Steve Cox Memorial Park sits a few blocks from streets lined with
  post-war bungalows and ranchers built between 1948 and 1965 — the
  core of 98146's housing stock. Those original rim joists are Douglas-fir,
  and a lot of them have never had a ledger flashing installed. That's
  the conversation that starts most deck projects here.

  White Center is unincorporated King County, so permits run through
  King County DPER — not Seattle SDCI. Vladislav Volkov (WA Licensed
  Contractor) handles the permit application, plan review, and all
  inspections personally. No project managers relaying messages.
  Call (206) 591-1096 to schedule a free on-site look.

localContext: |
  The 98146 zip is dense with 1950s and early 1960s single-family homes —
  mostly 1,000–1,400 sq ft ranchers and bungalows on flat to gently sloped
  lots. Highland Park borders White Center to the northeast; Roxbury Park
  sits at the neighborhood's southern edge. The housing stock along
  16th Ave SW and SW Roxbury Street is almost entirely original post-war:
  Douglas-fir framing, shallow crawlspaces with poor drainage, and vapor
  barriers either missing or original polyethylene long past useful life.
  The Greenbridge district — redeveloped in the early 2000s on the former
  Holly Park footprint — has newer engineered lumber and modern foundation
  plates, but the surrounding blocks remain predominantly original post-war
  single-family stock. On lots near Roxbury Park, expect 1940s-era post-and-
  pier foundations, no treated lumber near grade, and deck footings that sit
  on surface-laid concrete rather than poured tube footings to frost depth.
  King County DPER requires correcting both — and inspects footing depth at
  rough-in before any concrete is poured. Soil conditions in parts of 98146
  run soft fill, which is one reason we typically pour to 18 inches rather
  than the code-minimum 12 inches.

commonProblems:
  - title: "Ledger Rot on 1950s–60s Ranchers Without Flashing"
    description: |
      Post-war homes in 98146 were built without ledger flashing — the
      concept wasn't in widespread practice here until the 1990s IRC cycles.
      Water wicks behind the ledger board into the original Douglas-fir rim
      joist and stays there for decades. By the time a homeowner calls, the
      rot is usually 4–6 inches deep and wide. The fix: sister new pressure-
      treated lumber alongside the compromised rim joist, install metal
      z-flashing with self-adhesive membrane, then attach the new ledger
      with lag screws to code spacing. King County DPER requires a ledger
      flashing inspection before any decking goes down.

  - title: "Composite vs. Cedar on White Center's Shaded, North-Facing Lots"
    description: |
      Seattle's 37-inch annual rainfall hits north-facing decks in 98146
      hard from October through May. Raw cedar boards moss over within two
      wet seasons without consistent annual cleaning and re-sealing. Most
      homeowners stop maintaining it after year three. Trex Transcend and
      TimberTech Azek composite decking carry 25-year fade and stain
      warranties and need no annual sealing. On any lot with heavy tree
      canopy or north-facing exposure — common along the streets near
      Roxbury Park — composite is the honest material recommendation.

  - title: "Post Footings Poured to Surface Grade Instead of Frost Depth"
    description: |
      A large share of the older decks in 98146 have posts sitting on
      surface-level concrete pads — no tube footings, no depth. King County
      DPER requires footings to frost line, a minimum of 12 inches in this
      area (we typically pour to 18 inches for the post-and-pier setups on
      older lots here). Pressure-treated lumber rated UC4B for ground contact
      is required at any post base within 6 inches of soil. Standard PT
      lumber at 0.40 pcf retention doesn't meet that spec — and DPER
      inspectors check it at rough-in before any concrete is poured.

faq:
  - q: "How fast can you get to White Center for deck installation?"
    a: |
      White Center is 15–20 minutes from North Seattle via I-5 south to
      Roxbury Street. No travel surcharge for 98146 or 98106. Vladislav
      comes out for the free on-site consultation — not a sales rep.
      Call (206) 591-1096 to pick a time.

  - q: "What decking brands do you install in White Center?"
    a: |
      Trex and TimberTech are the most common requests — both hold up
      well in PNW moisture conditions. For the shaded, high-rainfall lots
      in 98146, TimberTech Azek and Trex Transcend are the right call.
      Cedar is available for homeowners who want natural wood and are
      committed to annual maintenance. We bring physical samples on-site
      so you're comparing real boards in your actual light conditions,
      not website swatches.

  - q: "What does the deck permit process look like in White Center, and how long does it take?"
    a: |
      White Center is unincorporated King County — permits go through
      King County DPER, not Seattle SDCI. For a standard attached deck
      over 200 sq ft, plan review runs 4–8 weeks. We submit the drawings
      with footing specs, ledger details, guardrail heights (36-inch
      minimum for decks over 30 inches off grade per IRC), and stair
      stringer rise/run calculations. After approval: pull the permit,
      schedule rough-in inspection before footings are poured, then
      final inspection once guardrails and stair handrails are complete.
      Start-to-finished-deck is typically 10–14 weeks including permit
      lead time. TopVolk is a WA Licensed Contractor — deadline commitments
      are written into the contract with a penalty clause. Call
      (206) 591-1096 to get started.