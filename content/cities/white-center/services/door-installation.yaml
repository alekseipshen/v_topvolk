  - q: "What does entry door replacement in White Center cost?"
    a: "A full entry door swap — fiberglass slab, sill pan flashing, new brick mold, and standard hardware — typically runs $1,400-$2,600, with smart lock upgrades like Schlage Encode or August adding $250-$400. Cost depends on whether the jamb and header are in good shape or need repair, and whether you're adding sidelights or decorative glass. TopVolk provides a free on-site estimate with exact line-item pricing, not a phone quote. Reach Vladislav directly at (206) 591-1096."
  - q: "Do I need a permit for door installation in White Center?"
    a: "White Center is unincorporated, so any permit needed runs through King County DPER rather than a city office. Straight door replacements — same size opening, no structural changes — typically don't require a permit, but widening an opening, adding a header, or altering an egress bedroom door usually does. TopVolk is a WA Licensed Contractor and handles the DPER paperwork and inspection scheduling when a job requires it, so nothing gets built without sign-off."
  - q: "Can you match hardware on an older White Center home?"
    a: "Yes — a lot of the 1950s-60s houses here have original mortise locksets or hinge patterns that don't match modern prehung stock hardware. TopVolk either sources compatible reproduction hardware or adjusts the new door's hinge mortises and strike plate to fit the existing casing, so you're not replacing trim you want to keep. Smart lock retrofits, like Schlage Encode or August, are set up to work with the existing deadbolt bore in most cases without touching the casing at all."
  - q: "How long do new doors last in this climate, and what's the warranty?"
    a: "Fiberglass entry doors from Therma-Tru or Pella typically hold up 25-30 years in the Seattle Metro's wet winters, provided the sill pan and flashing were installed correctly at the start. Garage doors with insulated steel panels from Clopay generally run 20+ years before torsion springs or panels need attention. TopVolk stands behind the installation workmanship, and manufacturer warranties on the door units themselves are passed through directly to the homeowner — call (206) 591-1096 with any warranty question."
