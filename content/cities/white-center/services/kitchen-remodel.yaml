title: "White Center Kitchen Remodel — Postwar Galley to Open Plan"

intro: |
  Roxbury Street bisects a neighborhood built mostly between 1945 and 1962, when North Highline was filling in fast with returning GIs and their families. Those houses are structurally solid.

  The kitchens are not — boxed in, dark, and nowhere near large enough for a KitchenAid stand mixer and two people cooking at once. TopVolk Construction has opened up these layouts across 98106 since 2017, handling everything from load-bearing wall removal to the full permit pull with King County DPER. Vladislav Volkov is on every site visit himself — not a salesperson, not an estimator.

localContext: |
  White Center's 98106 zip holds a dense mix of 900–1,200 sq ft postwar bungalows and early-ranch homes, most built without the expectation of open-concept anything. Greenbridge, the rebuilt housing corridor along 16th Ave SW, and the older blocks of White Center Heights toward Roxbury Park all follow the same construction pattern: compact kitchens walled off from the living area, galvanized supply lines, and 100-amp panels that predate modern appliance loads. The Highland Park border on the north side sees the same floor plans — slightly larger lots, same structural headaches inside.

  A typical kitchen here runs 9x11 feet, separated from the living space by a wall that often carries roof or floor load. Mid-century electrical is a constant — 100-amp panels and older wiring that can't support induction cooking without a service upgrade. Crawlspaces under these homes are routine; drain stack relocation for island layouts requires opening the subfloor and working around floor joists, which adds cost that needs to be in the quote from day one. White Center's heavy October-through-May rainfall means those crawlspaces also accumulate moisture — a proper vapor barrier check is standard on any project we take in 98106, not an upsell.

  None of that is a dealbreaker. It just has to be scoped honestly before the cabinet order goes in.

commonProblems:
  - title: "Load-Bearing Interior Wall Between Kitchen and Main Living Space"
    description: |
      In North Highline ranchers, the wall separating kitchen from dining or living area frequently carries roof or floor load from above. Pulling it without engineering creates real structural risk — not theoretical risk.

      We run the load path analysis, spec the LVL beam size with a licensed structural engineer, and pull the King County DPER permit before any demolition happens. Plan review for structural work in unincorporated King County runs 4–8 weeks. That's not a buffer we pad in — it's the actual DPER timeline, and your project schedule needs to account for it. Temporary support walls go in while the beam is installed; the kitchen stays functional longer than most homeowners expect.

  - title: "Undersized 100-Amp Electrical Panels Blocking Appliance Upgrades"
    description: |
      Switching from a gas range to a Bosch or Samsung induction cooktop regularly means upgrading from 100A to 200A electrical service. Add a wall oven alongside a new range and the math gets tight fast.

      Many 1950s and early-1960s White Center homes still have the original panel. The upgrade requires a permit, a licensed electrician sub, and coordination with Seattle City Light for the meter base — that coordination alone can take 2–3 weeks. We scope this at the first site visit.

  - title: "Drain Stack Location Killing the Island Layout"
    description: |
      Homeowners in 98106 often sketch a kitchen island and don't realize the original drain stack sits exactly where the island needs to go.

      Moving it means opening the subfloor, working in the crawlspace, and sometimes rerouting through floor joists with proper blocking and joist hangers to maintain structural integrity. We verify plumbing location before finalizing the cabinet layout — whether that's IKEA boxes, semi-custom, or full custom — so the quote reflects what the job actually costs. No discovering the drain problem on demo day.

