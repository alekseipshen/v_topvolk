title: "White Center Handyman Services — Fix-It Pros, Not Remodels"

answer: "TopVolk Construction handles punch-list repairs, fixture swaps, and small fixes in White Center, WA — owner-run, free estimates, call (206) 591-1096."

intro: |
  A dripping Moen faucet, a Ring doorbell that won't hold a charge on the porch by Steve Cox Memorial Park, three soft deck boards out back — none of it needs a full remodel crew, but all of it needs someone who'll actually show up for a two-hour job. TopVolk Construction takes on that exact category of work in White Center: drywall patches, hardware installs, small fixture swaps, the stuff that sits on a to-do list for months because contractors want a $30K minimum before they'll pick up the phone. White Center's housing runs older — plenty of 1940s and '50s cottages between 16th Ave SW and Dick Thurnau Memorial Pool with original trim and settled drywall that needs texture-matched patching, not a drywall crew showing up for one hole. Vladislav Volkov runs the jobs directly, no subcontractor juggling for small work, no sales rep quoting a range and disappearing. Call (206) 591-1096 and describe the job — most small repairs get scheduled within the week.

localContext: |
  White Center sits in unincorporated King County, split mostly across zip codes 98106 and 98146, which means permitting for anything beyond cosmetic work runs through King County DPER rather than Seattle SDCI — a distinction that trips up homeowners who assume Seattle rules apply. Housing stock near White Center Heights and the Top Hat area leans older: post-war bungalows with galvanized supply lines, plaster-and-lath walls in the pre-1960 blocks, and newer infill closer to Evergreen High School with more standard drywall and PEX plumbing. That mix matters for handyman work — a texture match on a 1948 bungalow wall is a different job than patching drywall in a 2015 townhome, and pricing should reflect that. Rain exposure is a real factor too: covered porches and decks near the ravines below Puget Ridge see more moss and rot on north-facing trim than homes up on higher ground. Electrical fixture swaps that touch wiring (not just a like-for-like light fixture) can trigger a King County electrical permit, which we handle as part of the job rather than leaving it on the homeowner's plate.

commonProblems:
  - title: "Punch list items left behind after a remodel"
    description: "A kitchen or bath remodel wraps up and there's always a short list left over — a cabinet door that won't close flush, missing switch plate covers, caulking around a Kohler tub that never got finished, a light fixture the electrician left half-mounted. General contractors move their crews to the next job and these small items get ignored for weeks. We come in with a punch list, knock out hardware installs, caulk with RedGard or standard silicone depending on the surface, and do the touchup paint matching. Most punch-list visits run $250-$600 and finish same-day, depending on item count."
  - title: "Drywall patches that don't match the surrounding texture"
    description: "Older White Center homes near 16th Ave SW often have hand-troweled plaster or knockdown texture from the '60s and '70s, and a patch that isn't texture-matched sticks out under any light. The fix isn't just mudding the hole — it's matching the texture pattern with a hopper gun or knockdown knife before priming and painting. We patch the drywall, feather the tape three coats deep, match texture, then prime with a stain-blocking primer so the patch doesn't flash a different sheen once painted. Small patches (under 2 sq ft) run $175-$350; larger sections with texture matching run higher depending on ceiling height and access."
  - title: "Fixture swaps that cross into permit territory"
    description: "Swapping a faucet or toilet is straightforward — shut off the supply, pull the old wax ring, set the new Kohler or Moen fixture, done in an hour or two. But replacing a light fixture that involves rewiring a junction box, adding a GFCI outlet near a wet area, or relocating a switch legally requires a King County DPER electrical permit since White Center is unincorporated. We pull the permit when the scope requires it, schedule the rough-in inspection if needed, and don't skip that step to save time — TopVolk is a WA Licensed Contractor and that license means something on inspection day. Straightforward fixture swaps without permit triggers usually finish in one visit."
  - title: "Deck boards and railings that cost more the longer they wait"
    description: "Rot spreads. A few soft deck boards near a ledger board connection this year turn into a joist hanger replacement and a full railing rebuild in two years if the moisture keeps getting in — and White Center's rain exposure (37+ inches a year) speeds that up on shaded, north-facing decks. Board-for-board PT lumber replacement runs $40-$90 per board installed; swapping to Trex composite decking costs more upfront but skips the yearly refinishing. Railing repairs depend on whether posts are still sound or need new blocking. A full estimate with line-item pricing, not a vague range, comes with every on-site visit — no charge for the visit itself."
  - title: "Weatherstripping, smart home installs, and small exterior repairs"
    description: "Doors and windows in older White Center homes lose their weatherstripping seal after 15-20 years, and the gap shows up as a cold draft and a higher heating bill every winter. We replace door sweeps and window weatherstripping in an afternoon, usually $150-$400 per opening depending on door size and hardware condition. Same visit often covers a Ring or Nest doorbell camera install, a smart thermostat swap for an aging system, or rotted trim and loose Hardie siding panels near a downspout. Gutter cleaning prep — clearing debris before a cleaning crew or before winter rains hit — gets bundled into the same trip when it makes sense."

faq:
  - q: "How fast can you get to White Center for Handyman Services?"
    a: "White Center sits right off SR 509 and Ambaum Blvd SW, so travel time from most of our King County jobs runs 15-25 minutes depending on where the crew is that day. Street parking is usually available near the job site, though older blocks near 16th Ave SW can be tight — we plan for that when scheduling. Most small repair jobs get booked within a week of the call, and same-week emergency-adjacent fixes (a failed toilet flapper, a stuck garage door) can often be worked in sooner. Call (206) 591-1096 and describe the job so we can give you a real window, not a vague callback promise."
  - q: "What does a faucet or toilet replacement cost in White Center?"
    a: "A straightforward faucet swap runs $175-$350 installed depending on the fixture — a Moen or Kohler unit versus a builder-grade replacement changes the labor slightly. Toilet replacement, including pulling the old wax ring and setting a new unit, typically runs $250-$450 including the toilet if you want us to supply it. Older galvanized supply lines sometimes need updating during the swap, which adds to the cost but prevents a leak six months later. Every job gets a free on-site estimate with line-item pricing before any work starts — no vague ranges quoted over the phone."
  - q: "Do I need a permit for handyman repairs in unincorporated King County?"
    a: "Most of what falls under handyman work — fixture swaps, drywall patches, deck board replacement, weatherstripping — doesn't require a permit through King County DPER. Work that changes electrical circuits, adds a new outlet, or restructures a deck's framing does need a permit and inspection, since White Center is unincorporated and falls under King County rather than Seattle SDCI. We identify which category a job falls into during the estimate visit and pull the DPER permit ourselves when it's required, including scheduling the rough-in and final inspection. TopVolk is a WA Licensed Contractor, which keeps that process straightforward with the inspector."
  - q: "Can you match texture on old plaster walls, or just patch drywall?"
    a: "Both — a lot of White Center homes built before 1960 have plaster-and-lath walls, not drywall, and a patch needs plaster-compatible joint compound and hand-matched texture, not a drywall skim coat. We assess the wall type during the estimate, then use the right patch material and texture tool — knockdown knife, hopper gun, or hand-trowel depending on the original finish — so the repair doesn't show once it's painted. Ceiling texture (popcorn or knockdown) gets matched the same way. This is a common request in the older blocks near White Center Heights."
  - q: "How long do weatherstripping and deck repairs last in this climate?"
    a: "Weatherstripping typically holds up 10-15 years before it compresses and stops sealing, faster on south-facing doors that get more sun exposure and UV breakdown. PT lumber deck boards last 10-15 years with basic maintenance; Trex or TimberTech composite boards run 25+ years and don't need annual staining, which matters given how much rain White Center gets October through May. We stand behind the install itself — if a repair fails from workmanship within a reasonable window, we come back and fix it, no separate service call."
  - q: "Do you cover areas near White Center like Burien or West Seattle?"
    a: "Yes — we work White Center, Burien, West Seattle, and the rest of King, Snohomish, Pierce, and Kitsap counties as part of the regular service area. Scheduling windows run about a week out for standard handyman work, sooner if there's flexibility on timing. Vladislav handles the estimates and the work directly, so there's no dispatcher relay or sales team in between. Call (206) 591-1096 or schedule a free consultation to get a real appointment window instead of a callback promise."