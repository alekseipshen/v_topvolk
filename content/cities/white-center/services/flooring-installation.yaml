  - q: "What does LVP or hardwood installation cost in White Center?"
    a: "LVP installed typically runs $6-12 per square foot, engineered hardwood $9-16, and solid hardwood restoration work more depending on how much matching and blending the existing 2-1/4 inch oak strip flooring needs. Subfloor prep, old flooring removal, and any asbestos testing on pre-1980 homes are the main things that move the number. We give a written, line-item quote after the on-site visit — material, labor, and prep broken out separately, not a vague range. Call (206) 591-1096 for a free estimate before you commit to anything."
  - q: "Does White Center require a permit for flooring installation?"
    a: "Straight flooring replacement usually doesn't need a King County DPER permit since White Center is unincorporated, but if we uncover vinyl asbestos tile (VAT) during demo, WA Department of Labor & Industries asbestos rules kick in and a certified abatement contractor has to clear it before we install anything new. That testing and paperwork typically adds 3-7 days to the schedule if abatement is needed. TopVolk is a WA Licensed Contractor and we handle the coordination with abatement subs directly so the homeowner isn't chasing separate contractors. We build any expected delay into the written timeline up front."
  - q: "Is engineered or solid hardwood better for a White Center home?"
    a: "Engineered hardwood is the safer call over a slab-on-grade or a subfloor with any history of moisture readings above 8-10%, since the plywood core handles humidity swings better than solid wood. Solid hardwood works well on the original fir subfloor in the older bungalows near Top Hat as long as there's a vapor barrier below and the crawlspace is dry. Bruce and similar solid oak products need that 4-7 day acclimation period in the actual room before install, engineered products need less. We test subfloor moisture on every quote before recommending one over the other."
  - q: "How long does new flooring last with White Center's weather?"
    a: "LVP with a 20-mil wear layer typically runs 15-20 years even with our wet October-through-May stretch, since the vinyl core doesn't react to humidity the way solid wood does. Solid hardwood needs a refinish every 7-10 years and can cup if the subfloor moisture isn't controlled with a proper vapor barrier. Tile holds up longest structurally but grout lines need resealing every couple years near entryways where wet shoes track in. We cover installation defects under our standard workmanship warranty, and manufacturer warranties on materials like Shaw or Mohawk products apply separately."
