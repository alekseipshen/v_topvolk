  - q: "What does a full exterior repaint in White Center cost?"
    a: |
      Exterior repaints in White Center typically run $6,000 to $16,000 depending on square footage, siding material, and how much scraping and priming the old coat needs before a topcoat goes on. Interior work — trim, cabinets, or a full room repaint — usually falls between $500 and $4,500 per room depending on ceiling height and whether cabinet doors get pulled and sprayed separately. Lead testing and EPA RRP containment on pre-1978 homes add a few hundred dollars when it applies. Every bid comes as a free on-site estimate with line-item pricing, not a phone-quoted range — call (206) 591-1096 to get one scheduled.
  - q: "Does painting my White Center home require a King County permit?"
    a: |
      Straight repainting — interior or exterior — doesn't require a King County DPER permit, since White Center is unincorporated and DPER only gets involved once work touches structural framing, siding replacement, or new construction. The paperwork that does apply is EPA RRP compliance on any home built before 1978, which covers a large share of the cottages near Top Hat and along Ambaum Blvd SW. TopVolk is a WA Licensed Contractor and handles the lead test kit, RRP disclosure forms, and containment setup as part of the standard bid. There's no HOA layer to navigate in most of White Center's unincorporated pockets, which keeps the paperwork simpler than in some Seattle neighborhoods with design review.
  - q: "Do you use oil-based or acrylic paint on old cedar siding?"
    a: |
      Bare or previously oil-painted cedar needs an oil-based bonding primer first — an acrylic topcoat applied straight over old oil paint without it tends to peel within a year or two. Once that primer coat is down, TopVolk switches to a 100% acrylic topcoat like Sherwin-Williams Duration or Benjamin Moore Aura, both of which stay flexible through our long wet season without cracking. Hardie siding, being factory-primed fiber cement, usually just needs a wash and can go straight to two acrylic coats. Color matching gets checked against Pacific Northwest daylight, not showroom lighting, since a shade that looks right under fluorescent bulbs can read completely different under our gray, filtered daylight most of the year.
  - q: "How long does a repaint actually last in this climate?"
    a: |
      Workmanship on the labor and surface prep is backed separately from the manufacturer's own paint warranty — Sherwin-Williams Duration, for example, carries its own limited warranty against peeling and fading. In White Center's climate, expect 7 to 10 years out of a properly primed acrylic exterior coat on Hardie siding, and closer to 5 years on cedar or any heavily shaded, moss-prone north wall. What's not covered is moisture damage from an unrelated source, like a leaking gutter apron or failed flashing — that gets flagged during the estimate walk so it gets fixed before paint goes over it, not after.
