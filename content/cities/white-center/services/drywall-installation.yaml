  - q: "What does drywall repair or installation cost in White Center?"
    a: "A single room patch after a plumbing or electrical fix runs $400-$900. A full bathroom re-hang with purple board runs $1,200-$2,800, and a whole-house remodel with Level 5 finish in the kitchen can run $3,000-$8,000 depending on square footage and ceiling height. Finish level, moisture damage extent, and access are the three biggest cost drivers. We provide a free on-site estimate with exact line-item pricing — no vague per-square-foot guess over the phone."
  - q: "Do I need a permit for drywall work in White Center?"
    a: "White Center is unincorporated King County, so permits go through King County DPER rather than Seattle SDCI. Cosmetic patching and standard room re-hangs typically don't need a permit, but fire-rated separation walls for garage or ADU conversions do, and DPER inspects those at rough-in before drywall gets closed up. We're a WA Licensed Contractor and handle the DPER paperwork and inspection scheduling as part of ADU and structural jobs. Straight repair work usually starts within days since there's nothing to file."
  - q: "Can you match old veneer plaster walls in my bungalow?"
    a: "Yes — a lot of White Center's 1940s-50s homes still have original blue board and veneer plaster, and patching it with standard joint compound leaves a visible flat spot under raking light. We either skim-coat the patch with a plaster-compatible compound or re-veneer the whole wall section so texture and sheen match. It takes an extra coat and more drying time than drywall mud, usually one to two extra days on the schedule. Worth doing right if the rest of the room is original plaster."
  - q: "How long does new drywall last in this climate?"
    a: "Properly installed drywall with the right board for the location — purple board in bathrooms and basements, standard board everywhere else with good ventilation — lasts decades with no issues. The failures we see are almost always moisture-related: a bath fan that's undersized, a washer supply line that seeps for months, or a crawlspace without a vapor barrier. We size ventilation and moisture barriers into the plan up front so you're not calling us back in three years. Standard workmanship issues are covered; damage from a new leak or plumbing failure after installation isn't, which is normal in this trade."
