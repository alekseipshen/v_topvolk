title: "White Center Drywall Installation — Purple Board & Firecode Pros"

answer: "TopVolk Construction hangs and finishes drywall in White Center, Washington — 3-6 day turnaround, WA Licensed Contractor, direct pricing from owner Vladislav Volkov."

intro: |
  A bathroom remodel near Steve Cox Memorial Park stalled last spring because the original blue board behind the tub surround had gone soft — nobody had run a fan during showers for probably a decade. That's the kind of call TopVolk Construction gets most often in White Center: drywall that failed quietly, behind tile or under a laundry room Samsung washer that's been leaking at the supply line for months. Most standard bedroom or bathroom drywall jobs here run three to six days from hang to final coat, longer if we're skim-coating a popcorn ceiling or matching old veneer plaster near Hamm Creek. This is a neighborhood full of 1940s and '50s bungalows, plus scattered mid-century additions, so plaster-to-drywall transitions come up constantly. Vladislav Volkov runs every job personally — no sales rep, no dispatcher, just the contractor doing the estimate and the work. Call (206) 591-1096 if a wall's gone soft or a ceiling's sagging; we'll tell you straight if it's a quick patch or a full re-hang.

localContext: |
  White Center sits in unincorporated King County, split mostly across 98106 and the edge of 98146 near Boulevard Park, which means permits for structural drywall work — think garage-to-ADU conversions or fire-rated separation walls — go through King County DPER, not Seattle SDCI. Housing stock here leans heavily on small 1940s-1950s post-war bungalows built for shipyard and Boeing workers, plus a handful of 1960s-70s ranch additions scattered near White Center Heights Park. Older homes still carry original blue board and veneer plaster in hallways and living rooms, which doesn't patch cleanly with standard joint compound — it needs a plaster-matching skim coat or a full veneer plaster finish to blend in. Basements and crawlspaces around here run damp for months at a time given our roughly 37 inches of annual rain, so any below-grade room gets purple board or paperless mold-resistant panels as a baseline, not an upsell. Detached garage conversions to ADUs, common under WA HB 1337, require 5/8-inch Type-X firecode drywall on shared walls and ceilings, which DPER inspectors check at rough-in before anything gets taped.

commonProblems:
  - title: "Soft, bubbling drywall in bathrooms and laundry rooms"
    description: "Standard 1/2-inch drywall in a shower surround or behind a leaking Samsung or LG washer supply line absorbs moisture and turns to mush within a season, especially in homes near Hamm Creek where crawlspace humidity runs high. The paper facing delaminates first, then the gypsum core crumbles when you press a thumb into it. Our fix is purple board (moisture and mold-resistant gypsum) rated for wet areas, paired with a proper vapor barrier behind it and RedGard-style waterproofing at the tub surround. A standard bathroom re-hang runs $1,200-$2,800 depending on how much framing needs drying out first. We always check the stud bay before closing it back up — no point covering a mold problem instead of solving it."
  - title: "Fire-rated separation walls for garage-to-ADU conversions"
    description: "Homeowners converting a detached garage into a DADU under WA HB 1337 often don't realize the shared wall and ceiling assembly needs 5/8-inch Type-X firecode drywall, not standard board, to meet IRC fire-separation requirements. King County DPER checks this at rough-in inspection, and if it's wrong, the job stops until it's corrected. Type-X has a denser core with glass fibers that slows fire spread for roughly an hour, which is the whole point of the assembly. We hang and tape it to spec the first time, including proper joint tape and fire-rated caulk at penetrations. Getting this wrong after drywall is already painted means tearing out finished work — a $3,000-$6,000 mistake we see other crews make."
  - title: "Popcorn ceiling removal and skim-coating in older bungalows"
    description: "A lot of White Center's 1940s-50s homes near White Center Heights Park still have original popcorn texture, and some of it — pre-1980s — can contain asbestos, which means testing before anything gets scraped. Once it's cleared or abated, we skim-coat the ceiling flat or re-texture to match adjacent rooms, which takes real skill to blend without visible seams under daylight from a north-facing window. Skim-coating alone typically runs $2-$4 per square foot depending on ceiling condition and how much of the original lath or veneer plaster is underneath. We test first, then quote a flat number — no surprise change orders once we're in the ceiling."
  - title: "Cost drivers on a whole-house drywall job"
    description: "A full kitchen or bath remodel that involves patching drywall after electrical and plumbing rough-in usually runs $1,500-$5,000 for the drywall portion alone, and the biggest cost swing is finish level — Level 5 finish, which skims the entire surface for smooth sidewall lighting, costs noticeably more than a standard Level 4 tape-and-mud job. Corner bead type matters too; metal bead is cheaper, Trim-Tex vinyl bead holds up better against door swings and kids' backpacks. Access is another factor — a second-story bedroom near a narrow White Center street adds labor time just getting sheets upstairs. We give a line-item quote up front, and if we miss our stated deadline, that penalty is written into the contract, not just a promise."
  - title: "Soundproofing shared walls between bedrooms"
    description: "Older White Center homes with additions built onto the original footprint often have zero sound isolation between bedrooms — you hear every footstep and TV through a single layer of 1/2-inch drywall. Resilient channel decouples drywall from the studs to cut impact noise, and QuietRock adds mass-loaded vinyl inside the panel itself for airborne sound like voices and music. Combining both gets you close to a 50 STC rating, which is a real difference at 11pm. This kind of retrofit runs $8-$15 per square foot of wall since it usually means opening the wall to install blocking and resilient channel correctly. It's not cheap, but it's the only fix that actually works long-term — foam panels on the surface don't touch the problem."

