  - q: "Do I need a permit for tile work in White Center?"
    a: "White Center is unincorporated King County, so permits go through King County DPER rather than a city building department. Tile itself usually doesn't need a standalone permit, but any electrical relocation for a backsplash or vanity light, or plumbing rough-in for a new shower, does. TopVolk is a WA Licensed Contractor and pulls the DPER permit, schedules the rough-in inspection, and closes out the final inspection as part of the project timeline — no extra paperwork lands on the homeowner."
  - q: "Can you install heated floors under new bathroom tile?"
    a: "Yes — TopVolk installs Schluter Ditra-Heat or Warmup electric radiant systems under porcelain or natural stone bathroom floors, wired to a programmable thermostat during the same rough-in phase as the tile substrate. It adds roughly $9-12 per square foot over standard tile install, sensor wire and thermostat included. Most homeowners in the older White Center bungalows add it during a full bathroom gut since the subfloor is already open."
  - q: "How long does tile grout and sealant last here?"
    a: "Epoxy grout in a shower holds up 8-10 years before it needs resealing; standard cement grout should get sealed every 2-3 years given the humidity White Center holds through the rainy season. Natural stone like travertine or marble needs resealing every 12-18 months or moisture stains the stone from below. Porcelain tile itself doesn't wear out — failures almost always trace back to grout, sealant, or the waterproofing membrane underneath, not the tile."
