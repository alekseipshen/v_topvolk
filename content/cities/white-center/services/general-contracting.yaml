title: "White Center General Contracting — Remodels & DPER Permits"

intro: |
  Pull a permit in 98106 and the form goes to King County DPER, not Seattle SDCI — White Center is unincorporated King County, and that distinction matters before a single wall comes down. A kitchen teardown upgrading a 1958 rancher to a KitchenAid induction range and Bosch dishwasher layout still needs plan review from DPER, running 6-10 weeks on major structural or MEP work. Vladislav Volkov, WA Licensed Contractor, has managed DPER submissions and full remodels across this zip since 2023.

localContext: |
  The 98106 zip covers a dense grid of post-WWII housing built between 1945 and 1968 — Boeing-era bungalows and ranchers that went up fast and cheap for a workforce that needed somewhere to live. Post-and-pier foundations, galvanized supply lines, and fuse boxes that predate circuit breakers are still hiding inside these walls. The blocks east of Roxbury Street toward White Center Heights follow the same pattern. Older than they look, and full of the kind of structural and electrical conditions that rewrite a project scope on day one of demo.

commonProblems:
  - title: "King County DPER Plan Review Adding Months Before Construction Starts"
    description: "White Center sits outside Seattle city limits, which means no SDCI portal — permit applications go through King County DPER. Plan review on a full gut remodel or structural addition typically runs 6-10 weeks. Submit drawings with FAR errors or missing setback calculations and the clock resets. Getting the application complete and code-compliant on the first pass is the only way to protect the project schedule."

  - title: "Structural Damage Inside Post-WWII Walls That Changes the Budget Midstream"
    description: "Open walls in a 1955 White Center rancher and the framing tells a different story than the estimate assumed. Undersized headers above window openings, a rim joist absorbing decades of crawlspace moisture, or blocking that was never installed — any of these trigger an LVL beam replacement and a revised structural set. Homes from this era in the 98106 zip should carry a 10-15% contingency line from the start. That's not padding. That's what this housing stock actually costs."

  - title: "MEP Coordination Collapsing Without a GC Holding the Schedule"
    description: "Homeowners managing their own remodel run into the same wall: the electrician starts rough-in before HVAC duct routing is finalized, or the plumber sets drain lines before the kitchen layout is locked. Each sequencing error costs a return visit. Framing inspection has to pass before electrical rough-in can start — that's not a preference, it's AHJ sequence. Vladislav coordinates MEP scheduling directly, no project manager layer, no phone tag between trades."

faq:
  - q: "How fast can you get to White Center for General Contracting?"
    a: "White Center is straightforward — Roxbury Street, 16th Ave SW, and Highway 509 off West Seattle. Vladislav can typically schedule a free on-site walkthrough within a week. Call (206) 591-1096 to book directly — no intake form, no sales call first."

  - q: "Do you work on older White Center homes with original systems and dated appliances?"
    a: "Most homes in 98106 were built before 1970, and nearly all have original-era infrastructure under the finishes. Kitchens getting upgraded to Samsung or Whirlpool appliances often need a panel evaluation first — a 1960 fuse box won't support a modern induction range circuit. GE and LG refrigerators with filtered water lines require a proper cold-water stub-out. These aren't surprises. They're scope items that belong in the quote before demo starts."

  - q: "What does a full kitchen or bathroom remodel cost in White Center, and how long does it take?"
    a: "Full kitchen remodels in the 98106 zip run $55K-$120K depending on layout changes and finish tier, with 6-10 weeks of build time after King County DPER plan review clears. Bathroom remodels run 3-6 weeks. ADU additions under WA HB 1337 are 4-7 months end-to-end — DPER review, rough-in inspections, final inspection. Vladislav provides line-item quotes, not ranges. Missed deadlines trigger contract penalties. Call (206) 591-1096 to schedule a free consultation on your specific project."