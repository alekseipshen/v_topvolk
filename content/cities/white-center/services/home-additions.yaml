title: "White Center Home Additions — DADUs & Second Stories"

answer: "TopVolk Construction LLC builds DADUs, second-story additions, and in-law suites in White Center — King County DPER permits, 100+ projects since 2017."

intro: |
  Unincorporated means a different permit desk. A lot of homeowners in White Center assume Seattle SDCI handles their addition paperwork. But this stretch of the county — between Westwood Village and the Duwamish valley — falls under King County DPER instead. That changes plan review timelines, setback math, and which inspector shows up for rough-in. TopVolk Construction LLC is owner-operated by Vladislav Volkov, running since 2017. He's handled enough DADU and second-story projects through DPER to know which reviewers flag foundation details first. Housing near Steve Cox Memorial Park and White Center Heights Park skews toward 1940s post-war bungalows. Most sit on post-and-pier foundations, built long before anyone planned for a second floor or a detached unit out back. One recent project off Ambaum Blvd added a mother-in-law suite with a GE range in the kitchenette and its own entrance. No shared laundry. No shared thermostat. WA HB 1337 now allows two ADUs per single-family lot, so a lot of these small parcels have real square footage left — if the foundation and side sewer can carry it. Call (206) 591-1096 for a site walk before you file anything with DPER.

localContext: |
  Most of White Center's housing stock in 98106 and the 98146 fringe near Boulevard Park and Shorewood dates from two building booms. Small 1940s-50s bungalows sit on post-and-pier footings. A scattering of 1960s-70s ramblers use slab-on-grade or basic perimeter foundations. Neither type was built with a second story or a backyard DADU in mind. That's why almost every addition here starts with a foundation assessment before anything else gets drawn. White Center is unincorporated, so permits route through King County DPER rather than Seattle SDCI. That means a different fee schedule and a different plan review queue. DPER also checks critical areas — steep slope, seismic — more closely, given the grade change down toward the Duwamish valley. Rain matters too. Roughly 37 inches a year means any new roofline has to tie into existing flashing without creating a dam. North-facing additions near mature trees by Steve Cox Memorial Park see moss buildup on cedar trim within a couple seasons if it's not back-primed. Vapor barrier detailing in crawlspaces is non-negotiable on the post-and-pier lots. DPER inspectors check it at rough-in, not just at final.

commonProblems:
  - title: "ADU permitting under WA HB 1337 in unincorporated King County"
    description: "HB 1337 opened the door to two ADUs per lot, but King County DPER still reviews a DADU here as new construction. That means a separate utility connection, a side sewer tap, and often a new electrical panel if the main service is under 150 amp. A lot of White Center lots near Roxbury and 16th Ave SW are narrow. Setback and lot coverage limits drive the footprint before square footage does. TopVolk scopes the side sewer and panel upgrade during the estimate, so it's not a change order mid-build. A typical detached ADU with a Rinnai tankless water heater and GE appliance package runs $190K-$240K depending on finish level — roughly 5-7 months from DPER submittal to final inspection."
  - title: "Second-story additions on post-and-pier foundations"
    description: "Plenty of the bungalows near White Center Heights Park sit on post-and-pier foundations poured for a single story. Stacking a bedroom or two on top means an engineer has to verify the existing footings can carry the new load, or spec new concrete piers where they can't. Framing typically calls for an LVL beam at the new floor line, PSL posts down to footings, and sistering joists on the original floor framing to stop bounce. Skipping the structural calc is the single most common reason a King County DPER plan reviewer kicks a permit back. Engineering runs $2,500-$4,000 and adds 3-4 weeks. Still cheaper than a stop-work order after framing is up."
  - title: "Mother-in-law suites with a separate entrance and kitchen"
    description: "A real in-law suite needs its own egress window, a full kitchenette rough-in tied into the existing plumbing stack, and a code-compliant separate entrance. DPER treats this as an AADU — attached ADU — with its own permit set, distinct from a simple bedroom addition. Plumbing runs a new branch line and vent stack. Most homeowners here go with a Whirlpool or GE compact appliance package to keep the footprint under 300 square feet. Getting the egress window sized right the first time — minimum 5.7 sq ft clear opening — avoids a costly reframe after drywall. Plan on 8-10 weeks for DPER review on an AADU conversion, plus 6-8 weeks of construction once permits are in hand."
  - title: "Matching siding and roofline on Craftsman and mid-century additions"
    description: "Tying a new dormer or second-story wall into a 1940s bungalow's original siding is harder than it looks. Hardie siding profiles change every few years. Matching a weathered cedar shake roof with new CertainTeed shingles almost never looks right without re-siding the whole elevation. Flashing at the new roof-to-wall intersection is the part that actually fails first if it's rushed — that's where White Center's rain load finds every gap. Full re-siding on the addition side plus flashing detail typically adds $8K-$15K to a project budget. Usually cheaper long-term than a patchwork match that stains differently within two winters."
  - title: "Tying new HVAC zones into old ductwork or going ductless"
    description: "A lot of White Center's original forced-air systems weren't sized for an extra 400-600 square feet. Running new ductwork through a post-and-pier crawlspace with R-49 insulation and a vapor barrier already in place gets tight fast. TopVolk usually specs a Mitsubishi ductless mini-split head for the addition instead of extending the existing trunk line. It's a cleaner install and doesn't overload the old furnace. Pair it with a Rinnai or Navien tankless unit if the suite needs its own hot water. A single mini-split zone runs $4,500-$7,000 installed, with a 12-15 year expected service life in this climate if the outdoor unit is mounted clear of roof runoff."

faq:
  - q: "How fast can you get to White Center for Home Additions?"
    a: "White Center sits just off Highway 509 and Ambaum Blvd, about 15-20 minutes from TopVolk's usual job sites in West Seattle and Burien. Scheduling a site walk is easy to fit in. Vladislav does the initial walkthrough himself — no salesperson, no scheduling middleman. Most consultations get booked within a week of the call. Call (206) 591-1096 and describe the lot and what you're picturing. He'll tell you honestly if it's a good fit for a DADU, a second story, or something smaller."
  - q: "What does a home addition or ADU cost in White Center?"
    a: "A detached ADU (DADU) typically runs $190K-$240K all-in. A second-story addition on an existing bungalow runs $150K-$220K depending on structural work. An attached in-law suite conversion runs $80K-$130K. Cost drivers are foundation condition, how much of the existing roofline gets rebuilt, and finish level — quartz counters and a KitchenAid appliance package cost more than laminate and a Whirlpool package. Every quote from TopVolk is line-item, not a ballpark range. Call for a free on-site estimate before you budget off an online calculator."
  - q: "How does the King County DPER permit process work for White Center additions?"
    a: "White Center is unincorporated, so permits go through King County DPER, not Seattle SDCI. Plan review typically runs 8-12 weeks for a second-story or DADU project, longer if the lot has a critical areas flag near the valley slope. TopVolk prepares the site plan, structural calcs, and energy code compliance forms as part of the bid package. TopVolk also handles rough-in and final inspection scheduling. TopVolk is a WA Licensed Contractor, and Vladislav walks every DPER inspection in person. Deadline penalties are written into the contract, not just promised."
  - q: "Can my 1940s bungalow's foundation actually support a second story?"
    a: "Not always without work. Post-and-pier foundations common in White Center's older housing stock were sized for one floor. Adding a second means an engineer verifies footing capacity, then specs new concrete piers, an LVL beam, and PSL posts where the load path needs reinforcing. Existing floor joists often get sistered for stiffness before any framing goes up. This gets checked during the free estimate walkthrough, before pricing gets finalized. It's the difference between a permit that sails through DPER and one that bounces back twice."
  - q: "What's the warranty on a home addition, and how does it hold up in this climate?"
    a: "TopVolk backs structural and framing work for 2 years. Manufacturer warranties cover materials like Hardie siding (30 years) and Milgard windows (lifetime on glass). White Center's 37 inches of annual rain is hard on flashing and unsealed cedar trim, so proper detailing at install matters more than the warranty paperwork. Expect moss to show up on north-facing surfaces within a couple seasons regardless of product — that's maintenance, not a defect. Ask about the specific product warranties during your estimate."
  - q: "Do you cover areas near White Center, and how far out are you booking?"
    a: "Yes — TopVolk regularly works White Center alongside Burien, West Seattle, Tukwila, and Des Moines, all part of the King County service area. Scheduling is typically 2-4 weeks out for a first site visit and design consult. Construction start depends on DPER permit timing. Owner-led means Vladislav is the one showing up, not a rotating crew lead. Call (206) 591-1096 to get on the schedule."