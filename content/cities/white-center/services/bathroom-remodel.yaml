title: "White Center Bathroom Remodel — Galvanized Out, Tile In"

intro: |
  The ranchers and bungalows along 16th Ave SW and the blocks off Roxbury Street sit in 98106 — unincorporated King County, meaning bathroom permits pull through King County DPER, not Seattle SDCI. Most of the housing here went up between 1952 and 1978, and a lot of it still has original galvanized supply lines running to builder-grade Kohler fixtures nobody updated since the 1980s. Any remodel worth doing has to address what's behind the tile, not just what the homeowner sees. Post-war construction in White Center typically means concrete perimeter foundations with crawlspaces — and those crawlspaces matter for every bathroom above them. Water intrusion from a failed vapor barrier shows up as soft subfloor long before the tile even shifts. By the time a homeowner notices flex underfoot, the damage is already weeks or months old.

localContext: |
  Zip codes 98106 and 98146 cover a denser neighborhood than most people expect — post-war ranchers, mid-century split-levels, and some 1980s infill near Delridge Way. Crawlspace vapor barriers fail quietly in this rain corridor, and the bathroom floor is usually the first place the damage shows.

commonProblems:
  - title: "Galvanized Supply Lines Corroding Inside the Wall"
    description: "Mid-century White Center homes frequently still have galvanized steel supply pipes — not copper, not PEX. They rust from the inside out, choking water pressure to a trickle before anyone realizes there's a problem. The pipe looks intact from the outside and fails from the inside — you won't see it until there's a burst or a brown-water call. A bathroom remodel is the practical moment to replumb with PEX-A, since the wall is already open. King County DPER requires a rough-in inspection before closing walls, so the plumbing gets verified by the inspector before anything gets covered. Skipping the repipe during a tile job means tearing the wall open again inside a decade, paying demo costs twice."
  - title: "Failed Fiberglass Surrounds and Mold Behind Cement Board"
    description: "Builder-grade fiberglass tub surrounds flex under load and crack at seams — water gets behind the panel into unprotected drywall and mold sets in fast. The fix is full tear-out to the stud bays, Schluter Kerdi membrane over new cement board, and large-format porcelain set in modified thinset."
  - title: "Ventilation That Can't Handle PNW Humidity Cycles"
    description: "A 50 CFM exhaust fan from a 1971 build is no match for White Center's October-through-May rain season. Insufficient CFM lets moisture accumulate on north-facing tile and grout, feeding mildew that returns every winter. Broan and Panasonic both make humidity-sensing units rated 110 CFM that we spec into full bath remodels as a standard line item when pulling King County DPER permits. The CFM rating has to match the bathroom square footage — undersized fans are one of the most common plan review comments DPER sends back on these older homes. Getting ventilation right is the difference between a remodel that holds up for twenty years and one that needs remediation in five."

