  - q: "Do you replace Kohler, Moen, and American Standard fixtures during a bathroom remodel?"
    a: "Those are the three brands we pull out most often in this neighborhood. Replacement fixtures get spec'd based on budget and style — Kohler and Moen for mid-range builds, Hansgrohe if the homeowner wants to step up. Everything gets replaced as part of the full remodel scope, not pieced together separately. Line-item quotes cover fixture costs up front so there are no surprises mid-project."
