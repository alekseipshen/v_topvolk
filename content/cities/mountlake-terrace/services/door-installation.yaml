  - q: "Does replacing a door in Mountlake Terrace require a building permit?"
    a: |
      Swapping a door within the existing rough opening — same size, no wall changes — is permit-exempt for residential work in Mountlake Terrace. The City of Mountlake Terrace Building Division handles all residential permits within city limits; Snohomish County PDS does not apply here. Widening an opening, cutting through framing for a new sidelight, or converting a window to a door opening all require a building permit with a framing plan and structural header specification. TopVolk Construction is a WA Licensed Contractor and handles the permit application, plan submission, and inspection coordination as part of the project. Permit fees for straightforward residential structural work in Mountlake Terrace typically run $200–$500.

  - q: "Fiberglass vs. wood entry door — which holds up better in the Mountlake Terrace climate?"
    a: |
      Wood doors absorb moisture and swell seasonally — that is the primary reason door latches stop catching reliably every January in the 98043 zip. A quality fiberglass unit like the Therma-Tru Pulse or Pella Thermastar won't swell, won't rot, and takes paint or stain well enough to replicate historic wood profiles on older homes. The foam-filled core also gives fiberglass better thermal performance than solid wood, which matters in attached-wall situations. For the 1965–1985 ranchers that make up the majority of Mountlake Terrace's housing stock, fiberglass is the clear long-term value. Expected lifespan with proper flashing is 30–40 years; most painted wood doors in this climate need refinishing or replacement within 10–15.

  - q: "What warranty comes with a door installation in Mountlake Terrace?"
    a: |
      Therma-Tru and Pella carry limited lifetime warranties on fiberglass door slabs against rot, delamination, and structural failure. Schlage and Kwikset both offer lifetime mechanical warranties on residential-grade deadbolts and lever sets. The installation itself is warranted by TopVolk Construction against defects in workmanship — and a penalty clause for missed deadlines is written directly into the signed contract. That is not a verbal commitment; it is in the agreement. If the flashing detail fails or the door doesn't seal correctly at commissioning, it gets corrected at no additional cost. Warranty questions go directly to Vladislav, not a call center or a subcontractor chain.

