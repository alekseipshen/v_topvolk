localContext: |
  Nearly all of Mountlake Terrace falls in the 98043 zip code, with a thin sliver of the southern
  edge bordering Shoreline's 98155. The housing stock is predominantly post-WWII construction: one-
  story ramblers and split-levels built between 1952 and 1972 fill the neighborhoods east of I-5 near
  Veterans Memorial Park, while the Town Center corridor and blocks near the Mountlake Terrace
  Transit Center have seen newer infill and townhome development since about 2012. Those older lots
  frequently have original board-on-board cedar or grape-stake fences now pushing 25–35 years old —
  past the point where staining buys more time. North-facing panels in this climate collect moss and
  mildew starting around year seven, and cedar that's gone unstained for a decade degrades faster
  than most homeowners realize until boards start splitting. Fence permits in Mountlake Terrace go
  through the City's own Community & Economic Development department — separate from Snohomish County
  PDS, since Mountlake Terrace is an incorporated city with its own permit center. Fences combined
  with retaining walls over 4 feet, or any structure exceeding 6 feet in height, require a formal
  building permit submittal before construction starts.

commonProblems:
  - title: "Post Heaving in Mountlake Terrace's Clay Soil After One or Two Winters"
    description: |
      Clay-heavy soil in the 98043 area doesn't drain the way sandy loam does. It holds moisture
      through the rainy season — October to April — then swells and contracts as temperatures dip
      below freezing in January and February. Posts set at 18–24 inches in that soil start leaning
      within two to three winters, especially on the uphill side of sloped lots. The correct spec:
      pressure-treated 4x4 or 6x6 posts rated UC4B for high-moisture ground contact, set 30–36
      inches deep with a concrete collar that flares slightly at the base to resist frost heave. A
      standard 150-linear-foot cedar privacy fence with properly set PT posts and concrete footings
      in Mountlake Terrace runs $5,800–$9,000 installed depending on height and gate count. Shallow
      footings are the most common reason fences fail early here — cutting that corner costs more to
      fix later than doing it correctly upfront.

  - title: "Cedar vs Vinyl: Which Material Actually Holds Up in the 98043 Climate"
    description: |
      Western red cedar looks sharp on installation day and weathers to gray within 18 months if it
      isn't sealed — which most homeowners skip. In Mountlake Terrace's wet winters, north-facing
      cedar panels see consistent moisture for six-plus months straight and develop surface mildew by
      year five. Vinyl (PVC) fence doesn't rot, doesn't need staining, and pressure-washes clean.
      The trade-off: vinyl runs $55–$75 per linear foot installed versus $38–$55 for cedar, and
      color is permanent since it can't be painted. For homeowners near Ballinger Lake who want a
      natural wood appearance with less maintenance, cedar treated with Cabot Australian Timber Oil
      every three to four years is a workable middle ground. Horizontal-slat cedar with a dark
      penetrating stain is the most-requested style in this neighborhood right now — it photographs
      well and holds up better than unstained board-on-board because the horizontal orientation sheds
      water instead of trapping it.

  - title: "Mountlake Terrace Fence Height Limits and When a Permit Is Actually Required"
    description: |
      Standard residential rules in Mountlake Terrace cap fence height at 6 feet in side and rear
      yards, 4 feet in the front yard measured from finished grade. No permit is required for a
      straightforward fence within those limits. The permit requirement changes when a fence also
      retains soil — any retained height over 4 feet triggers a building permit submittal through the
      City of Mountlake Terrace Community & Economic Development department. That scenario is common
      on the sloped lots near Veterans Memorial Park, where a fence on a 3-foot grade change can
      easily become a combined retaining wall and fence structure. Plan review for residential fence
      and wall submittals typically takes 2–4 weeks. Shared fences on property lines also require
      neighbor agreement in writing before construction, and a survey confirmation is recommended on
      any lot where the line hasn't been formally marked. As a WA Licensed Contractor, TopVolk
      handles the permit paperwork as part of the project scope.

  - title: "What a Fence Installation Actually Costs in Mountlake Terrace — Real Numbers"
    description: |
      Material, post depth, slope, and gate count all move the final number. A 6-foot board-on-board
      cedar privacy fence in Mountlake Terrace runs $38–$55 per linear foot installed, including PT
      posts, concrete footings, and one standard gate. Vinyl fence at the same height runs $55–$75
      per linear foot. Horizontal-slat cedar with steel post sleeves runs $65–$90 per linear foot
      because the layout is more precise and the steel hardware costs more than standard post caps.
      Gates add $450–$950 each depending on width and hardware — a self-closing D&D Technologies
      TruClose hinge set with a heavy-duty latch runs $90–$130 in hardware alone, before labor. For
      a typical Mountlake Terrace lot needing 150 linear feet and two gates, budget $6,500–$14,500
      depending on material and style. TopVolk provides written, line-item quotes after the on-site
      visit — not a ballpark over the phone.

  - title: "Gate Hardware Failure on Fences Used Every Day"
    description: |
      Standard strap hinges and a barrel latch — the hardware on most builder-grade residential
      fences in the 98043 area — weren't designed for a gate opened and closed 8–12 times a day.
      Gravity hinges sag within two to three years, the latch stops catching cleanly, and eventually
      the gate drags on the ground. The fix is specifying the right hardware upfront: D&D
      Technologies Magnus or TruClose self-closing hinges, rated for residential daily use, with a
      heavy-duty stainless steel latch that adjusts for post movement over time. Gate post size
      matters as much as the hardware — any gate wider than 4 feet needs a minimum 6x6 PT post on
      the hinge side to handle the cantilever load without deflecting. Soft-close hardware adds
      $150–$250 per gate to the installation cost but eliminates the most common complaint we hear
      from homeowners two to three years after a fence goes in. Specifying it upfront is cheaper
      than retrofitting it later.

