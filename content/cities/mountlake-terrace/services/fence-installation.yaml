  - q: "Does the City of Mountlake Terrace require a fence permit?"
    a: |
      Standard fences under 6 feet in side and rear yards and under 4 feet in the front yard do
      not require a permit in Mountlake Terrace. The permit threshold triggers when a fence also
      acts as a retaining wall with retained height over 4 feet, or when the fence itself exceeds 6
      feet. Permits are submitted to the City of Mountlake Terrace Community & Economic Development
      department — not Snohomish County PDS, since Mountlake Terrace handles its own permits as an
      incorporated city. Residential fence and wall permits typically clear plan review in 2–4 weeks.
      TopVolk, as a WA Licensed Contractor, prepares and submits permit applications as part of the
      job on any project that requires them.

  - q: "What post depth is correct for Mountlake Terrace soil conditions?"
    a: |
      For the clay-heavy residential soil throughout the 98043 area, posts should go 30–36 inches
      deep — deeper than the standard one-third-of-height rule. Clay retains moisture and swells
      with freeze-thaw temperature swings, which pushes shallow posts out of plumb within a couple
      of winters. UC4B pressure-treated 4x4 or 6x6 posts set with a concrete collar that flares
      slightly at the base resist frost heave better than a straight tube footing. Gate posts get
      the full 36-inch depth regardless of fence height — the cantilever load from a daily-use gate
      demands it. That extra post depth adds an hour or two of labor per post, but it's what makes
      the difference between a fence that holds plumb for 20 years and one that needs re-setting
      after the third winter.

  - q: "How long does a cedar or vinyl fence last in Mountlake Terrace's climate?"
    a: |
      Properly installed cedar fence — UC4B PT posts, concrete footings, and a penetrating oil like
      Cabot Australian Timber Oil applied every 3–4 years — lasts 15–25 years in Mountlake
      Terrace's climate before boards need wholesale replacement. Unstained cedar in this rain
      pattern starts showing real degradation by year 8–10, especially north-facing sections that
      stay wet for months at a stretch. Vinyl (PVC) fence typically lasts 25–30 years with periodic
      pressure washing — Bufftech and similar manufacturers back their product with 20-year limited
      warranties. TopVolk's installation warranty covers workmanship defects for one year from
      completion. The fence boards are the replaceable part; improperly set posts that need re-
      digging and re-concreting years later are where the real cost lands.

