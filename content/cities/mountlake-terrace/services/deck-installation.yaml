title: "Mountlake Terrace Deck Installation — Flat Lots, Real Permits"

intro: |
  The 1950s and 60s ranchers between Lake Ballinger and the Interurban Trail sit
  on flat lots that drain slowly after October rains — meaning water pools against
  foundations and ledger boards take abuse that sloped lots don't see. Original
  rim joists on those homes were never flashed, and that's the first thing the
  City of Mountlake Terrace's inspectors want to see addressed. Vladislav Volkov
  has been pulling permits and building in 98043 since 2023 — 100+ projects
  completed, WA Licensed Contractor, owner on every job. Call (206) 591-1096
  for a free on-site walkthrough — no sales staff, no vague ranges.

localContext: |
  Zip code 98043 is largely postwar housing built between 1952 and 1972: single-
  story ranchers, modest split-levels, Douglas-fir framing throughout. Rear yards
  along the Interurban Trail corridor tend to run flat or slightly toward the
  house, which makes deck drainage a design decision rather than an assumption.
  Mountlake Terrace is an incorporated city — deck permits go through the City's
  own building department, not Snohomish County PDS, and plan review for a
  standard attached deck typically runs 3–5 weeks from submission.

commonProblems:
  - title: "Ledger Flashing on 1960s Vinyl-Sided Homes — MLT Inspection Requirements"
    description: |
      Original ranchers in 98043 have rim joists that were never flashed at
      the ledger connection. Mountlake Terrace requires a flashing inspection
      before concrete pours — Vycor tape or Z-flashing lapped correctly under
      the siding to direct water away from lag bolt penetrations. On vinyl-sided
      homes, the siding comes off to do this right. Miss the step and the
      rough-in inspection fails.

  - title: "Footing Depth and Saturated Soil Near Lake Ballinger"
    description: |
      Flat terrain near Lake Ballinger can mean hitting saturated soil at 12 to
      14 inches during a wet spring. Footings still need to reach 12–18 inches
      for Snohomish County lowland frost protection and may need wider pads in
      softer ground. Any post set in-ground requires UC4B-rated pressure-treated
      lumber — standard 0.40 pcf PT is not rated for direct soil contact.

  - title: "Cedar vs. Composite on Moss-Prone North-Facing 98043 Yards"
    description: |
      North-facing rear yards in Mountlake Terrace grow moss on raw cedar within
      two seasons without regular maintenance. Trex Transcend and TimberTech
      Azek carry 25-year fade and stain warranties and resist moss growth that
      raw cedar can't match. On a 300–400 sq ft deck, composite runs $2,000–
      $4,000 more than cedar but eliminates the annual cleaning and sealing cycle.

faq:
  - q: "How fast can you get to Mountlake Terrace for Deck Installation?"
    a: |
      Mountlake Terrace is a regular service area — 25 minutes from North Seattle
      via I-5 to the 236th St SW exit. No travel surcharge for 98043. Call
      (206) 591-1096 to schedule a free on-site consultation with Vladislav
      directly, not a sales rep. Line-item quote at the visit, not a vague range.

  - q: "Which composite decking brands do you install in Mountlake Terrace?"
    a: |
      Trex, TimberTech, and Fiberon are all installed regularly on 98043 jobs.
      Each handles PNW temperature cycling differently — expansion tolerances
      affect fastener spacing and gap sizing at install. Cedar is available for
      homeowners who prefer natural wood and plan to maintain it through the wet
      season. We'll walk through the tradeoffs on site.

  - q: "How long does a deck permit and full build take in Mountlake Terrace?"
    a: |
      Permits go through the City of Mountlake Terrace — not Snohomish County
      PDS. Plan review for a standard deck: 3–5 weeks. The sequence includes
      rough-in inspection on footings before concrete, then final inspection for
      36-inch guardrail height and IRC stair stringer rise/run compliance.
      End-to-end with permit lead time: 8–12 weeks. TopVolk is a WA Licensed
      Contractor and handles all permit applications. Deadline penalty is written
      into every contract. Call (206) 591-1096 to start the permit drawings.