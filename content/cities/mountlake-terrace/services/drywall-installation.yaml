  - q: "Do I need a permit for drywall work in Mountlake Terrace?"
    a: |
      Standalone drywall repair — swapping out damaged panels, patching, re-texturing — generally doesn't need its own permit in Mountlake Terrace. The situation changes when drywall is part of a larger scope: electrical panel upgrades, plumbing re-routes, kitchen remodels, bathroom gut-and-rebuilds, and ADU additions all require permits pulled through Mountlake Terrace's city permit center. Plan review on a full remodel permit runs roughly 3-6 weeks. TopVolk Construction is a WA Licensed Contractor and manages permit applications directly — homeowners don't need to track down the paperwork or navigate the portal themselves.

  - q: "What is the difference between Level 4 and Level 5 drywall finish, and when do I actually need Level 5?"
    a: |
      Level 4 is the standard for most interior walls: three coats of joint compound over taped seams, sanded smooth. It performs fine under flat paint in average lighting. Level 5 adds a thin skim coat of all-purpose compound across the entire wall or ceiling face, eliminating any texture variation from the paper facing or compound application. You need Level 5 anywhere painted with eggshell or semi-gloss, and anywhere that receives raking light — recessed LEDs in a kitchen ceiling, or sidewall light from a bathroom vanity strip. Skip it in those spots and you'll see every joint and fastener shadow within months. The upcharge runs roughly $1.00-$2.00 per square foot over a standard Level 4 finish. Worth it every time in a remodeled kitchen or bath.

  - q: "How long does drywall finish work last, and what does TopVolk warranty?"
    a: |
      Properly installed interior drywall — correct board thickness, glued-and-screwed fastening pattern, full three-coat finish, quality primer — holds up 20-30 years in a conditioned space without issues. In Mountlake Terrace's climate, the long-term risks are moisture intrusion in bathrooms and crawlspace-adjacent walls, which is exactly why mold-resistant board and vapor management at install time matter. TopVolk warranties all finish work for 12 months after project completion — joint cracking, fastener pops, texture inconsistencies within that window, we come back and fix it. Damage caused by a plumbing failure or roof leak after completion isn't covered, but the drywall scope itself is.

