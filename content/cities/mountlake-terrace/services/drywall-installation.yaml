intro: |
  The 1960s split-levels around Ballinger Lake in Mountlake Terrace's 98043 zip code need exactly three things from a drywall contractor: proper Level 5 finish for remodeled kitchens, 5/8-inch Type-X on converted garages, and mold-resistant board anywhere near a crawlspace — and TopVolk Construction handles all three, Vladislav Volkov owner-operated, WA Licensed Contractor, 100+ projects completed since 2023 across Snohomish County. Patching after electrical and plumbing rough-in is the scope that gets added mid-project on almost every remodel in that housing era. Homeowners near the Mountlake Terrace Recreation Pavilion are converting garages and adding DADUs at a faster rate since WA HB 1337 passed, and fire-separation drywall requirements are triggering permit reviews on what people assumed would be simple conversions. QuietRock ES is going into more shared walls as those ADU projects move through permit. Call (206) 591-1096 for an on-site walkthrough — Vladislav comes out himself, not a salesperson.

localContext: |
  Mountlake Terrace's 98043 zip code is almost entirely residential, with the majority of homes built between 1955 and 1978 — ranchers, split-levels, and the occasional Cape Cod. That era of construction means original drywall (or, in the oldest stock, plaster-over-board) installed before vapor management was a code concern. Crawlspace moisture in this part of Snohomish County is real — the area averages close to 37 inches of rain annually, and ground-level humidity travels up through subfloor assemblies into first-floor walls faster than most homeowners expect. The stretch of homes near Town Center is seeing heavy renovation activity as owners upgrade to compete with newer Lynnwood inventory in the adjacent 98036 zip. Permit applications for structural or MEP-related work go through Mountlake Terrace's own city permit center — not Snohomish County PDS, since Mountlake Terrace is an incorporated city with its own building department — with plan review running 3-6 weeks for larger remodel scopes. Non-structural drywall replacement generally doesn't require a standalone permit, but work triggered by electrical or plumbing rough-in pulls its own inspection sequence before walls can close.

commonProblems:
  - title: "Popcorn and Knockdown Ceilings in 1960s-70s Split-Levels Need More Than Scraping"
    description: |
      Scraping textured ceiling is the easy part. The hard part is what's underneath: original drywall that was never properly taped, joints that were never feathered flat, and fastener pops that show up the moment raking light hits the surface. In Mountlake Terrace's older split-levels — especially around the Ballinger Lake area — getting from scraped ceiling to a paintable surface means a full Level 5 finish: two passes of USG Sheetrock All-Purpose joint compound over the entire surface, sanded between coats, not just skimmed over the seams. That's not a one-afternoon job. Most ceilings in the 800-1,200 square-foot range take 2-3 days to complete correctly, including dry time between coats. Installed cost for Level 5 skim on existing ceilings runs $3.50-$5.50 per square foot depending on surface condition and ceiling height. Skip a pass and you'll see every joint under flat paint within a season — especially once recessed LED fixtures are trimmed and aimed at an angle.

  - title: "Garage Drywall That Fails Fire-Separation Inspection on ADU Conversions"
    description: |
      Half-inch standard drywall on a garage wall was acceptable in 1968. It doesn't pass now when you're converting a garage to habitable space or adding a living unit above it under WA HB 1337. IRC R302.6 requires a minimum 1/2-inch gypsum board on the garage side of any separation wall, and 5/8-inch Type-X on ceilings directly below habitable rooms. Mountlake Terrace building inspectors are checking this on every AADU and DADU permit. Replacing original drywall with 5/8-inch Type-X — National Gypsum Gold Bond Fire-Shield is the common spec — means reframing around outlets, coordinating any vapor barrier relocation, and sequencing electrical rough-in before the new drywall goes up. Budget 2-3 days of labor for a standard two-car garage conversion. Account for debris haul-away on the demo side — original drywall from this era can be brittle and creates more volume than homeowners expect.

  - title: "Bathroom Moisture and Mold-Resistant Board — Not Optional in the Pacific Northwest"
    description: |
      Standard drywall behind tile fails in Seattle-area bathrooms. The paper facing absorbs humidity over time, the gypsum core softens, and by the time a bulge appears at the tub surround, the damage has already spread behind the tile into the framing. In Mountlake Terrace, where the rainy season runs October through May and unventilated bathrooms stay damp for months at a time, mold-resistant drywall behind any wet area is the baseline. Purple board — National Gypsum Purple or USG Mold Tough — behind cement board or tile backer, combined with a RedGard waterproofing membrane on the wet zone, is the correct assembly for tub surrounds and curbless shower walls. Walk-in shower niches get Schluter Kerdi over the board before any tile. The assembly at the framing plane matters more than the surface coating. A full bathroom drywall tear-out-and-rebuild in a 60-square-foot 98043 bathroom runs $1,800-$3,200 in labor and materials depending on how far moisture has traveled into the framing.

  - title: "ADU Shared-Wall Soundproofing — QuietRock and Resilient Channel for Rentable Units"
    description: |
      Renting an ADU in Mountlake Terrace makes financial sense since WA HB 1337 passed — two ADUs are now permitted per single-family lot statewide, and demand for rental units in the 98043 area is genuine. The problem is acoustic performance. Standard drywall on a shared wall between an ADU and primary residence delivers an STC rating in the low 30s, which means your tenant hears your television clearly. QuietRock ES 725 on both sides of a decoupled wall assembly, with resilient channel breaking the rigid connection between drywall and framing, can push STC into the 50-55 range — the threshold where conversations stop transmitting. This work is done during rough-in phase, before insulation is sprayed and before any drywall is hung. Retrofitting after the fact is expensive and disruptive. Labor and materials for soundproofing one 20-linear-foot shared wall typically runs $2,500-$4,500 installed. Budget it as a line item in your ADU contract from the start.

  - title: "Patching After Rough-In — Getting Invisible Repairs on Walls That Were Already Finished"
    description: |
      Whole-house remodels in Mountlake Terrace's 1960s-era stock almost always involve new electrical circuits or plumbing re-routes — which means opening existing walls, completing rough-in, clearing inspection, and then closing everything back up cleanly. Patching is where corners get cut. A flush mesh-tape patch over an existing painted surface looks fine for a week; within a year, thermal cycling telegraphs the seam through the paint. Correct patching on existing drywall uses back-blocking for openings larger than a few inches — a strip of scrap drywall secured from behind gives the patch solid edges to fasten to — then Durabond 45 hot-mud for the first coat, which sets chemically and doesn't shrink the way air-dry all-purpose compound does. Minimum three-coat finish sequence before sanding. On a whole-house remodel scope, rough-in patching alone adds 3-5 days to the drywall schedule. It should be a separate line item in the contract, not buried in a general drywall allowance.

