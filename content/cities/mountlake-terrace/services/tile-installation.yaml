  - q: "Do tile projects in Mountlake Terrace require a permit?"
    a: |
      Cosmetic retile work — swapping out floor tile or a backsplash without touching framing, plumbing, or electrical — generally does not require a permit through the City of Mountlake Terrace Building Division. Shower rebuilds that involve opening walls, repairing framing, or adding or relocating a drain do require a permit. Any heated floor system — Ditra-Heat, Warmup, or similar — triggers a separate electrical permit regardless of whether the tile scope itself does. TopVolk handles permit applications and coordinates all inspections as part of the project, including rough-in inspection scheduling so tile installation doesn't stall waiting on an inspector. TopVolk Construction LLC is a WA Licensed Contractor, and every contract includes written deadline commitments with financial penalties if TopVolk runs over schedule without cause.

  - q: "What waterproofing system do you use for tiled showers?"
    a: |
      Schluter Kerdi sheet membrane is the standard on all shower walls and floor pans — it bonds directly to cement board and eliminates the moisture migration path that destroys conventional drywall-based assemblies over time. Kerdi-Band covers all seams, inside corners, and the transition to the drain flange; every one of those connections matters as much as the field membrane itself. For curbless shower designs, a pre-sloped Schluter Kerdi-Shower Tray simplifies achieving the required 1/4" per foot drain slope without a custom mortar mud bed. RedGard liquid membrane is used in secondary wet applications — tub surrounds, laundry room tile, utility spaces — where sheet membrane is harder to install cleanly in tight areas.

  - q: "How long will tile installation last in the Pacific Northwest climate?"
    a: |
      A properly installed porcelain tile shower — cement board substrate, complete Schluter Kerdi membrane system with Kerdi-Band at all transitions, correctly spaced grout joints with room for seasonal movement — should hold up 20–30 years in Mountlake Terrace's wet climate without structural failure. High-use shower grout typically needs resealing every 2–3 years. Natural stone installations require annual sealing to stay ahead of the PNW's ambient humidity, or a penetrating sealer like Aqua Mix Sealer's Choice Gold at installation extends that to 3–5 years. TopVolk backs workmanship with a written warranty covering materials and installation. The project contract also includes a deadline penalty clause — if the project runs over schedule without a documented cause, the financial consequence falls on TopVolk, not on you.

