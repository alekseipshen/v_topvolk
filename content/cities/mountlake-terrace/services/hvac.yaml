  - q: "How do I know if my ductwork can handle a heat pump?"
    a: |
      Heat pumps move significantly more air volume than gas furnaces at lower temperature differentials. Undersized return-air openings and leaky flex duct create real problems — short-cycling, noise, and efficiency well below rated SEER2. Before recommending any HVAC equipment, Vladislav inspects duct sizing, checks flex duct connections for leakage, and evaluates return-air grille sizing relative to the blower's airflow specs.

      Common red flags: rooms that never reach set temperature, a furnace blower that sounds strained, or supply registers with barely any airflow at full speed. Sealing duct joints with mastic and adding return-air capacity usually resolves these issues before any new HVAC equipment goes in.

  - q: "What warranty comes with heat pump or furnace installation in Mountlake Terrace?"
    a: |
      Mitsubishi and Bosch typically offer 5-year parts warranties on their HVAC equipment, extendable to 12 years with product registration within 60 days of installation. Carrier and Lennox run 10-year limited parts warranties when registered within 90 days. TopVolk's installation labor carries a three-year warranty covering defects in wiring, refrigerant connections, and duct transitions.

      The PNW's wet winters and freeze-thaw cycles are harder on outdoor condenser units than drier climates. Annual HVAC maintenance — coil cleaning, refrigerant charge verification, condensate drain flush — is worth doing regardless of warranty status. Skipping it can void manufacturer coverage.

