localContext: |
  The 98043 zip code covers nearly all of Mountlake Terrace's residential grid. Most homes are 1950s–1970s ranchers and split-levels with crawlspace ductwork that's been patched, re-routed, and wrapped in degraded fiberglass batting that's lost most of its R-value. Near Main Street and the Rec Pavilion along 236th Street SW, many homes still run original galvanized gas lines and furnaces pushing 25–30 years old. That puts them squarely in HVAC replacement territory.

  On the eastern edge toward Lynnwood (98036), some addresses straddle the city boundary. HVAC permits for Mountlake Terrace properties go through the City of Mountlake Terrace Building Division — not Snohomish County PDS. The Washington State Energy Code governs all new HVAC equipment installs, including minimum SEER2 and HSPF2 ratings. An AHJ inspection sign-off is required before any system can be commissioned and legally operated.

  The region gets 37-plus inches of rain annually. Any refrigerant line set penetrations through exterior walls need proper flashing. Skip that step on an HVAC install and you're looking at rot problems within a few seasons — a common shortcut on low-bid jobs in this area.

commonProblems:
  - title: "Duct Systems in 1960s Ranchers Can't Handle Heat Pump Airflow Without Remediation"
    description: |
      Rancher-style homes near Ballinger Lake were built with duct systems sized for a 60,000–80,000 BTU gas furnace. High heat output, relatively low airflow volume. Cold-climate heat pumps like the Bosch IDS 2.0 or Carrier Infinity need higher airflow at lower temperature differentials. That means existing return-air openings are almost always undersized for heat pump HVAC operation.

      Without fixing the duct system first, the heat pump short-cycles. The blower motor strains against restricted airflow. The unit's SEER2 rating becomes fictional. The fix means adding a second return-air chase in the hallway, sealing all flex duct joints with mastic compound rather than foil tape, and rebalancing supply registers room by room using a flow hood. Duct remediation alongside a heat pump conversion typically adds $1,500–$3,500 to the total HVAC project cost.

  - title: "Ductless Mini-Split Installation for ADUs and Garage Conversions Without Existing Ductwork"
    description: |
      Homeowners in Mountlake Terrace adding a basement ADU or converting an attached garage have no existing duct system to extend. A Mitsubishi Hyper-Heat or Daikin Aurora ductless HVAC system is the practical answer. These cold-climate units maintain rated heating capacity down to -13°F — important during the freeze-thaw stretches the area sees most Januaries.

      Installation runs refrigerant line sets and a condensate drain line through the exterior wall. The outdoor condenser sits on a concrete pad or wall bracket. That wall penetration needs to be flashed and air-sealed against the region's heavy winter rain. This step gets skipped on low-bid HVAC installs. Moisture intrusion follows within two to three seasons. A single-zone Mitsubishi MXZ system installed all-in typically runs $3,800–$6,500, with multi-zone configurations scaling from there.

  - title: "Pulling the Right HVAC Permit in Mountlake Terrace — What Triggers Inspection and What Doesn't"
    description: |
      A straight like-for-like furnace swap — same fuel type, same location, same duct connections — typically qualifies for a simplified mechanical permit through the City of Mountlake Terrace Building Division. Review often completes within a few business days. Heat pump conversions that change the fuel source, new electrical circuits for an air handler, or ductwork additions all require a full mechanical permit. That means a rough-in inspection before closing walls and a final inspection after commissioning.

      The Washington State Energy Code mandates that new HVAC heat pump systems meet minimum HSPF2 ratings. The AHJ — the City Building Division — reviews equipment specifications as part of permit approval. TopVolk is a WA Licensed Contractor and handles permit applications on every HVAC project. Homeowners don't need to deal with the city's permit portal or coordinate inspection scheduling themselves.

  - title: "What a Furnace Replacement or Heat Pump Conversion Actually Costs in 98043"
    description: |
      Swapping out an 80% AFUE furnace from the 1990s for a 96% AFUE modulating unit — like the Carrier Performance 96 or Lennox SLP99V — typically runs $4,500–$8,500 installed. That range shifts based on flue venting changes and whether the variable-speed blower motor requires an electrical service upgrade. Full cold-climate heat pump HVAC conversions run $9,000–$16,000.

      The Inflation Reduction Act currently provides up to $2,000 in federal tax credits for qualifying HVAC systems. Puget Sound Energy (PSE) rebates can add another $600–$1,200 depending on the HSPF2 rating of the equipment chosen. Every TopVolk quote is a written line-item breakdown — equipment, labor, permits, and applicable rebates listed separately. No vague ranges. Project deadlines go into the contract with penalties paid if they're missed. That commitment covers every HVAC job across 100+ projects since 2023.

  - title: "Smart Thermostat Upgrades and Zoning Problems in Older Mountlake Terrace Split-Levels"
    description: |
      Nest Learning Thermostat and ecobee SmartThermostat Premium both work reliably with modern heat pump and furnace HVAC systems. But 1960s–1970s homes in Mountlake Terrace frequently have 2-wire thermostat wiring that lacks the C-wire (common wire). Without a C-wire, smart thermostats suffer battery drain or random reboots.

      The fix is either running new 5-conductor thermostat cable from the air handler to the wall, or installing an add-a-wire adapter that repurposes an existing conductor for C-wire function. For split-level homes with persistent hot-upstairs, cold-downstairs imbalances, a Honeywell Truezone panel with motorized duct dampers — sized against the system's static pressure curve — corrects the problem without replacing HVAC equipment. Thermostat installs with wiring corrections run $300–$800. Adding a two-zone damper system adds another $1,200–$2,500 depending on duct access.

