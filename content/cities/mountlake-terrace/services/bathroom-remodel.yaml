title: "Mountlake Terrace Bathroom Remodel — Built for PNW Moisture"

intro: |
  Most of 98043 was platted and filled in between 1955 and 1975 — split-levels and ranchers running up and down 212th Street SW, with original cast-iron drain stacks, galvanized supply lines, and bathrooms tiled in 4×4 pink or avocado ceramic over greenboard. That greenboard soaks up moisture like a sponge. Moen and Kohler fixtures from two owners ago are past their service life. Vladislav Volkov has remodeled baths in these exact floor plans throughout Mountlake Terrace — he knows what's behind those walls.

localContext: |
  The streets fanning out from Terrace Creek Park are textbook mid-century Pacific Northwest: post-and-pier or perimeter foundations, Douglas-fir framing, and crawlspace vapor barriers that are either missing or disintegrated. In 98043, most original bathrooms ran 5×7 or 5×8 — tight enough that a vanity swap involves reconfiguring the rough-in entirely. The City of Mountlake Terrace handles its own permit review, separate from Snohomish County PDS, and plan review for layout-change remodels typically runs 3–6 weeks before demo can start.

commonProblems:
  - title: "Greenboard failure behind 1960s tile"
    description: "Pre-1980 builds in the Terrace Creek area used greenboard drywall as a shower backer — not cement board, not a waterproofing membrane. After 40+ years of PNW steam and humidity, the paper facing has often delaminated completely. The fix is to strip to studs, apply RedGard over new cement board, then set tile — or install a Schluter Kerdi membrane where moisture exposure is heavy."
  - title: "Cast-iron drain stack rerouting for layout changes"
    description: "Original plumbing in 98043 ranchers runs cast-iron drain stacks to the crawlspace — serviceable, but not flexible. Moving the shower drain 18 inches for a curbless conversion means cutting the subfloor, rerouting the P-trap and trap arm, and passing a rough-in inspection before closing up. Permits through the City of Mountlake Terrace; we coordinate and pull them."
  - title: "Attic-vented bath fans feeding mold cycles"
    description: "Mountlake Terrace pulls 37+ inches of rain a year, and original bath fans in these mid-century builds typically vent into the attic — not outside — dumping moisture into insulation all winter. Upgraded Panasonic WhisperSense fans with humidity sensing, new ductwork, and proper exterior termination fix this without tearing out the whole ceiling."

faq:
  - q: "How fast can you get to Mountlake Terrace for a bathroom remodel consultation?"
    a: "Mountlake Terrace is a regular stop — we work throughout 98043 and neighboring Lynnwood and Shoreline. From Seattle it's 20–25 minutes via I-5. WA Licensed Contractor. 100+ projects completed since 2023. Call (206) 591-1096 to schedule a free on-site walk-through with Vladislav directly — no sales staff involved."
  - q: "Do you install Kohler and Toto fixtures, or are you limited to builder-grade stock?"
    a: "Both Kohler and Toto are standard installs for us, along with Moen, Delta, and Brizo. Many Mountlake Terrace homeowners pick fixtures at tile showrooms in Lynnwood or Bellevue — supply your own or let us specify. Either way, the quote breaks out labor and materials line by line."
  - q: "How long does a bathroom remodel take in Mountlake Terrace, and what does the permit process look like?"
    a: "Full gut-and-redo with layout changes runs 6–10 weeks including permit lead time. The City of Mountlake Terrace requires permits for plumbing, electrical, and structural work — plan review averages 3–6 weeks. Smaller scope (tile, vanity, fixtures, no layout change) typically finishes in 3–5 weeks. Deadline penalty is written into every contract."