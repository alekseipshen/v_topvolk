  - q: "What PSI do you use on cedar siding and decks, and will it damage the wood?"
    a: "Cedar siding gets washed at 600-1,000 PSI with a wide 40-degree fan tip nozzle — never a turbo nozzle, which rotates the pressure in a tight pattern and raises the grain on weathered cedar almost instantly. Cedar deck boards take slightly higher pressure, 1,200-1,500 PSI with a 25-degree tip, because horizontal decking sheds the rinse differently than vertical siding. The actual spore kill is done by the sodium hypochlorite soft-wash solution applied before the rinse, not by raw pressure. High PSI alone tends to strip surface-level moss while leaving live algae spores embedded in the grain, which means visible regrowth within one season regardless of how clean the surface looks immediately after washing."

  - q: "How long do the results last, and what happens if something wasn't cleaned correctly?"
