  - q: "Do plumbing projects in Covington require a King County DPER permit?"
    a: |
      Covington is unincorporated King County, so all permit-required plumbing work goes through King County DPER (Department of Permitting and Environmental Review) — not the City of Covington, which is not an incorporated city. Water heater replacements, gas line modifications, drain line reroutes, and new fixture additions in remodels all require permits. Plan review for standard residential plumbing typically clears in 2-4 weeks. Vladislav handles the permit application, coordinates rough-in inspections, and schedules the final inspection as part of every project scope — as a WA Licensed Contractor, he pulls permits directly with the county. Homeowners don't manage any of that paperwork.

  - q: "Should I repipe with PEX or copper in my Covington home?"
    a: |
      PEX-A using Uponor expansion fittings is the current standard for residential repipes in this area, and it is what TopVolk installs. It handles freeze-thaw cycles better than rigid copper — relevant in Covington's colder winters — and the expansion-style fittings are more reliable long-term than crimp connections or push-fit options. Copper remains a strong choice for exposed supply runs in utility rooms or garages where rigidity matters, but it costs 20-30% more in both material and labor. For most 1980s–2000s Covington homes, PEX-A is the practical call: faster to route through existing walls without extensive drywall removal, quieter during thermal expansion cycles, and backed by a 25-year manufacturer warranty on Uponor tubing. Vladislav will walk you through both options with real cost figures at the on-site consultation.

  - q: "What warranty comes with plumbing work from TopVolk Construction?"
    a: |
      Workmanship warranty on all plumbing installations is one year — any fitting or connection we installed that fails gets fixed at no cost. Product warranties are manufacturer-specific: Rinnai and Navien tankless units carry a 12-year heat exchanger warranty when registered; Moen faucets carry a lifetime limited warranty; Uponor PEX-A tubing carries a 25-year warranty. All repipe work is pressure-tested before walls are closed, which catches any fitting issues before drywall goes up. What is not covered: damage from water hammer caused by missing thermal expansion tanks on closed systems, or problems from third-party modifications after project completion. Every project contract also includes a deadline penalty clause — if TopVolk misses the agreed schedule, there is a financial penalty written into the agreement.

