  - q: "What pressure settings do you use on cedar versus Hardie siding?"
    a: |
      Cedar gets soft-wash treatment — 1,500-2,000 PSI with sodium percarbonate solution and a 40-degree nozzle tip to avoid raising the grain. High-pressure blasting on cedar pushes water deep into the wood structure, causes checking, and produces uneven grain texture that makes staining patchy.

      Hardie fiber-cement tolerates slightly more pressure (2,000-2,500 PSI) but still performs better with downstream-injected surfactant chemistry rather than raw water force alone. Concrete driveways handle 3,000-3,500 PSI with a surface cleaner attachment for streak-free results. Paver patios get treated at 1,800-2,500 PSI depending on joint condition. The right PSI-to-chemistry ratio matters more than sheer water pressure on most residential surfaces.

