commonProblems:
  - title: "Moss and Lichen on Cedar Decks and Fence Panels Before Staining"
    description: |
      Cedar surfaces in the 98042 zip see moss and lichen establish within 18-24 months on north-facing exposures. The problem isn't just cosmetic. Lichen rhizines penetrate wood grain and mechanically lift applied stain if the surface isn't prepared first.

      Soft-washing with sodium percarbonate solution at 1,500-2,000 PSI removes the biological layer and brightens the wood back near its original tone. High-pressure blasting raises cedar grain and causes checking — that's the wrong approach. After cleaning, the surface needs a 48-72 hour dry window before Armstrong Clark or Cabot deck stain goes down. That timing matters in Covington's unpredictable spring shoulder season.

      Staining over existing biofilm is the main reason deck finishes fail at 2-3 years instead of lasting 5-6. A typical cedar deck cleaning in Covington runs $200-$450 depending on square footage and moss saturation.

  - title: "Hardie Siding and Stucco Cleaning Before Exterior Repaint"
    description: |
      Fiber-cement siding like HardiePlank builds up airborne pollen, road dust, and mildew spore over time. Nearly invisible when dry — then it smears and blocks primer adhesion the moment the surface gets wet.

      Painters working in Covington's 98042 zip run into this constantly when prepping homes along the Highway 18 corridor. A 2,000-2,500 PSI wash with downstream-injected surfactant strips the contaminant layer without damaging Hardie's factory finish or surface texture. Stucco on older homes needs lower pressure — 1,200-1,500 PSI — to avoid cracking the finish coat. Three-coat stucco systems from the early 1990s that have started developing hairline fractures are especially vulnerable.

      Most exterior repaint scopes in Covington should include a dedicated cleaning step 3-5 days before first primer coat. The wash typically adds $300-$600 to project cost. That's cheaper than fixing adhesion failures after the paint is down.

  - title: "Concrete Driveway and Walkway Cleaning — Oil, Tire Transfer, Efflorescence"
    description: |
      Concrete driveways in Covington subdivisions collect two distinct stain types: petroleum-based (motor oil, tire rubber transfer) and mineral-based (efflorescence, calcium carbonate deposits from water migrating through the concrete matrix). These need different treatment approaches.

      Oil requires degreaser pre-treatment — Zep Heavy-Duty Citrus Degreaser with sufficient dwell time before the surface cleaner attachment makes contact. Efflorescence responds to dilute muriatic acid before washing, handled with proper safety protocols. A spinning surface cleaner at 3,000-3,500 PSI cleans flat concrete efficiently and eliminates the banding pattern a pressure wand creates with overlapping passes.

      King County DPER doesn't require permits for driveway cleaning. HOAs in planned communities near SE 272nd often have runoff rules — containment and drainage management are part of the scope. A two-car driveway plus walkways in Covington typically runs $175-$350.

  - title: "What Power Washing Actually Costs in Covington — The Real Variables"
    description: |
      Flat-rate pricing doesn't reflect real cost drivers.

      Surface type matters most. Cedar decks cost more than concrete because they require lower pressure settings, specific chemistry, and more care around wood grain. Moss saturation level affects labor time — heavy biological growth on a fence untouched for four years takes longer than light surface contamination. Access matters too. Single-story homes are faster to work around than two-story structures where roofline soffit areas need attention.

