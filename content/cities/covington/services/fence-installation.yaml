  - q: "Do I need a permit for a fence in Covington, and which agency handles it?"
    a: |
      Covington is unincorporated King County, so permits are issued through King County DPER — not a city building department. Fences under 6 feet on a standard residential lot don't require a DPER permit. Go above 6 feet on any section, or combine the fence with a retaining wall over 4 feet, and a permit with plan review is required — typically a 4–8 week review timeline depending on DPER's current queue. Fence-retaining-wall combinations on sloped lots are the most common trigger in this area. TopVolk Construction, WA Licensed Contractor, manages DPER permit applications and coordinates plan documentation when required. Vladislav identifies permit exposure during the initial site visit so the project timeline accounts for it from the start.

  - q: "What is a horizontal slat fence, and does it work well on Covington lots?"
    a: |
      Horizontal slat fencing runs boards left-to-right rather than vertically — it's the modern PNW residential aesthetic that's become popular in newer Covington and Maple Valley subdivisions, especially on lots with clean sightlines and contemporary landscaping. Structurally it requires posts set no more than 6 feet on center and solid blocking between the stringers to prevent individual boards from bowing inward over time — both details that matter in Covington's wet winters. Material options include Western Red Cedar (needs staining), composite, or aluminum-frame slat systems. Cedar slats benefit from a Cabot or TWP pre-installation end-grain treatment to slow moisture uptake at the cuts. Horizontal fencing also demands posts that are plumb to a tighter tolerance than standard vertical privacy fence, since any lean reads immediately against the horizontal line.

