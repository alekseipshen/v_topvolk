  - q: "Who handles garage permits in Covington — is there a city permit office?"
    a: |
      No city permit office exists for Covington. The city is unincorporated King County, so all residential building permits route through King County DPER (Department of Permitting and Environmental Review), based in Renton. For a standard detached garage, plan review runs 4–8 weeks. A garage with a DADU above typically takes 8–14 weeks through DPER review. TopVolk prepares and submits the permit package — site plan, foundation plan, framing drawings, and electrical plan — as part of the project scope. As a WA Licensed Contractor with 100+ projects completed since 2017 across King County, this permit workflow is routine. Missed construction deadline? There's a financial penalty written into the contract — not just a verbal promise.

  - q: "What concrete spec should I require for a garage slab in King County?"
    a: |
      King County code requires a minimum 4-inch slab for residential garages, but that's the floor, not the recommendation. For any garage that will see regular vehicle traffic, a lift, or workshop equipment, specify 5 inches at 3,000–3,500 PSI with fiber reinforcement — polypropylene fiber in the mix handles plastic shrinkage cracking better than wire mesh alone. A vapor barrier (10-mil poly) under the slab is non-negotiable on Covington's clay-heavy soils, and the perimeter edge beam should be 12 inches deep for settlement resistance. Drainage slope of 1/8-inch per foot toward the door is standard. Contractors who skip any of those details are cutting cost on your slab — TopVolk spells out every spec line by line in the quote before you sign anything.

  - q: "What warranty covers a new garage build, and how does it hold up in PNW weather?"
    a: |
      New garage builds from TopVolk carry a one-year workmanship warranty covering framing, roofing, siding installation, and finish carpentry — Washington State contractor warranty law extends structural coverage beyond that. The materials carry their own long-term ratings: Hardie fiber-cement siding is rated 30 years and handles Covington's wet winters without rotting or warping, 30-year composition roofing manages the moss cycle better than cedar shake, and PT lumber at all ground-contact points eliminates the rot that ends the life of older PNW garages early. Insulated garage doors from Clopay or Wayne Dalton are rated 10,000–15,000 cycles and hold their weatherstrip seal through years of humidity. Concrete slabs, poured to spec, last the life of the structure without needing replacement.

