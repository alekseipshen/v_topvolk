  - q: "What permits does a DADU require in Covington, and how long does it take?"
    a: |
      Covington contracts building permit review through King County DPER for residential
      construction. A DADU permit application requires a site plan, architectural drawings,
      structural calculations, and utility connection documentation — all submitted together
      to avoid intake rejection. Plan review at King County DPER runs 8–14 weeks for a new
      detached ADU; applications returned for corrections restart that clock. TopVolk prepares
      the full permit package and manages county correspondence throughout. Once permits issue,
      construction on a 600–800 sq ft DADU runs 12–16 weeks, including rough-in inspections
      for framing, plumbing, electrical, and mechanical. Total timeline from signed contract to
      occupancy: 5–7 months. TopVolk is a WA Licensed Contractor.

  - q: "Can I build two ADUs on my Covington lot under WA HB 1337?"
    a: |
      Yes. WA HB 1337 (2024) allows up to two ADUs on most single-family lots statewide — one
      attached (AADU) and one detached (DADU), or configurations that fit the lot. Covington
      lots in the 98042 zip typically run 6,000–9,000 sq ft, which can support two units if
      the existing house footprint leaves enough room under lot coverage limits. A second unit
      also triggers additional utility coordination — two rental units invites more scrutiny on
      sewer capacity and may require a separate water meter through Covington Water District.
      TopVolk has completed two-ADU scopes in King County and will assess your parcel's actual
      capacity — one unit, two, or neither — before you commit to drawings.

  - q: "What warranty covers a new DADU built by TopVolk in Covington?"
    a: |
      Washington state mandates a one-year workmanship warranty on all contractor work, and
      TopVolk stands behind structural work beyond that statutory minimum. A site-built DADU
      with correct moisture management — vapor barrier in the crawlspace, Hardie cement-board
      on the exterior, proper flashing at all penetrations — should perform without major issues
      for 20–30 years with routine maintenance. Mitsubishi mini-split units carry a 12-year
      compressor warranty when installed by a certified contractor. Windows spec'd to Milgard
      or equivalent carry 20-year manufacturer coverage. If something comes up in the first
      year, Vladislav addresses it directly — no warranty department to route calls through.

