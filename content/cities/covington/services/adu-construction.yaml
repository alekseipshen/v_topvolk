title: "Covington ADU Construction — WA HB 1337 lots, King County DPER handled"

answer: "TopVolk builds DADUs and attached ADUs in Covington, WA — WA Licensed Contractor, 100+ projects since 2023, owner Vladislav Volkov leads each job."

intro: |
  King County DPER is where most Covington ADU projects stall — plan review for a detached ADU
  in the 98042 zip runs 8–14 weeks, and applications with incomplete site plans or missing setback
  calculations get kicked back without a refund of review fees. TopVolk Construction handles the
  full permit package: site plan, floor plan, elevation drawings, MEP coordination, and utility
  separation documents. Covington's 1990s and early-2000s builder-grade subdivisions — particularly
  the clusters off SE 256th St near Jenkins Creek Park and the neighborhoods surrounding Covington
  Community Park — sit on lots where DADU footprints often need careful lot coverage math before
  anyone draws a single wall. WA HB 1337 (2024) now allows up to two ADUs on most single-family
  lots statewide, which meaningfully changes what's possible on a 7,000–9,000 sq ft Covington
  parcel. Vladislav Volkov handles the consultation in person — not a sales rep — and the contract
  includes written penalty clauses for missed milestone dates.

localContext: |
  Most of Covington's residential stock was built between 1988 and 2008 — tract subdivisions with
  builder-grade framing, standard 6-foot side setbacks, and rear yards that often have room for a
  600–800 sq ft DADU if lot coverage math clears. The 98042 zip covers the core of Covington, and
  properties here fall under King County DPER jurisdiction for building permits — Covington
  incorporated only in 2020 and still contracts building permit services through the county. The
  98038 zip covers the Maple Valley fringe just to the southeast, where similar housing patterns
  appear on slightly larger lots, giving more room to stay under lot coverage thresholds on a
  detached unit. The PNW climate hits these homes hard: 37+ inches of rain per year means vapor
  barriers in crawlspaces are non-negotiable for any ADU tied to an existing foundation, and
  ground-contact framing requires pressure-treated (PT) lumber throughout. Hardie cement-board
  siding is the standard exterior choice on new DADUs here — cedar shake looks good but demands
  repainting every 5–7 years in this climate, and Hardie holds up with far less maintenance.

commonProblems:
  - title: "Lot Coverage Math Kills DADU Plans Before Permits Are Even Filed"
    description: |
      King County limits lot coverage — typically 35% for residential zones in unincorporated
      areas, and Covington's own adopted zoning may vary by district. On a 7,500 sq ft lot with
      a 1,800 sq ft house footprint plus attached garage, you're already at 24% before a DADU
      goes on paper. Run the FAR calculation wrong and King County DPER rejects the application
      at intake. A 600 sq ft DADU footprint puts that same lot at 32% — still under the limit,
      but only if the site plan correctly accounts for existing impervious surface like driveways
      and concrete patios. TopVolk calculates lot coverage and setback compliance before a single
      drawing goes to the permit office, so you know the DADU is buildable on your specific
      parcel before spending money on architectural plans. This takes a site visit, the parcel
      report from the King County Assessor, and about a week — not months of back-and-forth.

  - title: "Utility Separation: Shared vs. Separate Water and Sewer Connections"
    description: |
      Covington properties are served by Covington Water District for domestic water and connect
      to King County Metro sewer in most of the 98042 zip. A DADU can share connections with the
      main house or get a separate meter — that choice affects upfront cost and long-term rental
      flexibility significantly. Separate water meters typically run $8,000–$15,000 depending on
      trench distance and meter size, and King County Metro charges its own sewer connection fees
      on top of that. A shared connection is cheaper upfront but complicates billing when you're
      renting the unit long-term. The plumbing rough-in inspection has to happen before walls
      close, which means sequencing utility work correctly with the framing schedule. TopVolk
      coordinates directly with Covington Water District and the county sewer authority on
      connection requirements so there are no surprises when the inspector shows up.

  - title: "Height Limits and Setbacks for DADUs in Covington's Residential Zones"
    description: |
      Washington state allows DADUs up to 24 feet in height under WA HB 1337 (2024), but local
      zoning can be more restrictive — Covington's adopted code post-incorporation needs to be
      checked parcel by parcel, especially on lots that border greenbelt areas near Jenkins Creek.
      Rear setback for a DADU defaults to 5 feet from the property line under statewide rules,
      but recorded easements and utility corridors can eat into that buildable envelope fast. A
      5-foot rear setback sounds workable until you discover a 10-foot utility easement running
      along the back of the property — a common situation in Covington's late-1990s subdivisions.
      King County DPER will flag these at plan review. Better to find them on the survey before
      the unit is designed. TopVolk pulls parcel data, checks recorded easements with the county
      recorder, and designs within the actual buildable envelope from day one — not day sixty.

  - title: "What a 600–800 sq ft DADU Actually Costs in Covington"
    description: |
      A site-built DADU in Covington runs $180,000–$280,000 for a 600–800 sq ft unit, finished
      and permitted. That range moves based on grading requirements, utility connection distance,
      and finish level. A Bosch dishwasher and KitchenAid range in the ADU kitchen add under
      $3,000 to the budget and make the unit meaningfully more rentable at market rate. A
      Mitsubishi mini-split handles heat and cooling without requiring ductwork through a small
      floor plan — it's the standard choice for new DADUs across King County. Permit fees through
      King County DPER run $4,000–$8,000 depending on project valuation. Total timeline from
      signed contract to final inspection is 5–7 months, with 8–14 weeks of that sitting in
      plan review. TopVolk provides a line-item quote — not a ballpark range — after the site
      visit. Call (206) 591-1096 to schedule that conversation with Vladislav directly.

  - title: "Attached ADU vs. Basement Conversion: What Covington's 1990s Homes Actually Support"
    description: |
      Covington's 1990s builder-grade homes typically have unfinished crawlspaces or shallow
      basements, not true walkout lower levels — which limits the basement conversion option for
      most parcels. An attached ADU (AADU) built as a bump-out addition or above a detached
      garage is often more practical than excavating a crawlspace to create habitable square
      footage. Structural work for an AADU addition means LVL beam work at the new wall opening,
      joist hangers, sister joist reinforcement where spans change, and blocking at the rim joist
      — not light carpentry. A basement conversion where feasible runs $80,000–$130,000. A new
      addition AADU runs $150,000–$220,000 depending on size and finishes. Both require full MEP
      rough-in, staged inspections, and a final inspection before occupancy. The right call
      depends on your specific floor plan and lot shape — which is why TopVolk starts with a
      site visit, not a phone quote.

