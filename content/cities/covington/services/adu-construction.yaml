  - q: "What does ADU construction cost in Covington?"
    a: |
      A finished, permitted DADU in Covington runs $180,000–$280,000 for a 600–800 sq ft unit.
      Attached ADU additions typically land at $150,000–$220,000. Basement conversions, where
      the existing structure actually allows it, run $80,000–$130,000. Main cost drivers are
      utility connection distance, grading, finish-level choices, and separate water meter work
