  - q: "What does custom carpentry cost in Covington?"
    a: |
      Pricing varies significantly by scope. A single interior door replacement with matching casing and hardware runs $650 to $1,100. A window seat with flanking bookcases costs $5,500 to $10,000. Full interior door replacement on a standard two-story (8 to 12 doors) lands at $6,000 to $12,000. Stair stringer rebuilds with new treads, risers, newel posts, and balusters typically run $4,500 to $9,000. Dining room wainscoting installs are $2,800 to $5,500. Exterior cedar fascia repair or replacement on a two-story runs $1,500 to $4,500. Key cost drivers include wood species choice, finish complexity, and whether structural elements like LVL stringers are involved. Vladislav provides written line-item quotes with exact pricing — call (206) 591-1096 or schedule a free consultation to get actual numbers for your project.

  - q: "Does carpentry work in Covington require a building permit?"
    a: |
      Most interior carpentry — trim installation, wainscoting, built-ins, door replacement — doesn't require a permit in Covington. Structural work is different. Stair stringer replacement is a structural scope under the IRC, and the City of Covington Community Development department requires a building permit for that work. Exterior projects that modify roofline drainage, such as fascia replacement tied to soffit changes, can also trigger permit review. Vladislav is a WA Licensed Contractor and handles permit applications where required — that's part of the project scope, not an add-on. Permit lead time through the City of Covington's office typically runs 2 to 4 weeks for standard residential carpentry work.

  - q: "What wood species do you use for built-ins and trim in Covington homes?"
    a: |
      Species choice depends on finish and location. For painted interiors — built-ins, wainscoting, door casing — paint-grade poplar is the standard. It's dimensionally stable, takes primer and topcoat cleanly, and costs less than hardwood for painted applications. Alder is a solid middle ground for stained or clear-coated work, with a tight grain that reads closer to cherry than pine. Douglas-fir is the structural default for stair stringers and blocking — standard PNW framing material and what most AHJs in King County expect to see. For exterior or high-moisture applications, Vladislav specs Hardie cement-board or primed finger-jointed cedar rather than raw cedar, to break the rot cycle common on Covington's north-facing elevations after repeated wet seasons.

  - q: "What warranty do you offer on carpentry work in Covington?"
    a: |
      Workmanship warranty on all TopVolk carpentry is one year minimum, covering joint failure, finish adhesion issues, and hardware function. Structural work like stair stringer installs carries additional protection through the City of Covington's building inspection process — a signed-off rough-in inspection means the structural work is code-compliant and on record. Material warranties vary by product: James Hardie's cement-board fascia carries a 30-year product warranty and 15-year finish warranty. Solid-wood built-ins and trim in a conditioned interior space don't have a manufacturer warranty, but properly built and finished work should last the life of the home. Deadline penalty provisions are written into every TopVolk contract — not a verbal assurance, an actual contractual clause with teeth.

