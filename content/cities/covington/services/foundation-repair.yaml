  - q: "Does foundation repair in Covington require a building permit?"
    a: |
      Structural foundation work — stem wall repair, mudsill bolting, shear wall installation, or post-and-pier replacement — requires a building permit through the City of Covington. The City coordinates inspections through King County's permitting system for structural scopes. Plan review on straightforward work typically takes 4–8 weeks; projects that require engineering submittals can run longer. TopVolk handles the permit application as a WA Licensed Contractor, prepares required documentation, and schedules both the rough-in inspection and the final inspection. Non-structural work such as hairline crack injection, drainage correction, or vapor barrier installation typically does not require a permit, but jurisdiction is always confirmed before any scope begins.

  - q: "What's the difference between epoxy injection and carbon fiber straps for a cracked foundation wall?"
    a: |
      Sika or equivalent two-part structural epoxy injection is the right call for cracks that have stopped moving and measure less than about 1/4 inch. It restores tensile strength across the crack but doesn't address whatever pressure caused the movement. Carbon fiber straps are a different tool — bonded vertically to the interior face of an inward-bowing wall to resist ongoing hydrostatic or soil pressure. Injecting epoxy into a wall that's still actively moving is money wasted; the crack will re-open. The correct repair depends on crack width, crack pattern, movement history, and what's happening outside the wall — all things that require a physical inspection, not a phone diagnosis.

  - q: "How long does foundation repair hold up in the Pacific Northwest climate?"
    a: |
      Done correctly and with drainage addressed, structural foundation repairs carry a long service life in Covington's wet climate. Simpson Strong-Tie hardware used for mudsill bolting is rated for the structure's lifetime when installed per specification. Sika epoxy-injected cracks in stable walls don't re-open once the underlying drainage problem is resolved. Post-and-pier work using Perma-Column steel bases instead of wood posts eliminates the rot mechanism that caused the original failure — effectively maintenance-free once properly set and shimmed. The thing that shortens repair lifespan is unresolved drainage: water pressure is what moved the foundation in the first place. Waterproofing and drainage correction done at the same time as structural repair is the difference between a one-time fix and a recurring problem.

