  - q: "Do I need HOA approval or a permit to repaint my house in Covington?"
    a: |
      Exterior painting alone doesn't require a building permit through King County DPER. Several Covington subdivisions, though, have HOA covenants that restrict color palettes and require formal color-board submission before exterior color changes begin — plan for a two-to-four-week approval window before paint is ordered if your neighborhood is HOA-governed. TopVolk can work within those guidelines and flag any color conflicts during the initial consultation. Separately, pre-1978 homes require EPA RRP federal compliance for all surface prep work — that's not a local permit, but it is a legal requirement that affects project scheduling and scope.

  - q: "What paint system works best on cedar siding in Covington's climate?"
    a: |
      Cedar in King County's climate — 37-plus inches of annual rainfall, with heavy moss pressure on north-facing surfaces — needs a system that bonds to the substrate and resists moisture intrusion without trapping moisture behind the film. Recommended sequence: pressure wash, three to five days of dry time, spot-prime bare wood with KILZ Original (oil-based) or a comparable alkyd primer, then two coats of Sherwin-Williams Duration or Benjamin Moore Regal Select Exterior. Avoid applying solid stain over previously painted cedar — it traps moisture and peels within two seasons if the surface wasn't fully stripped first. On north-facing Covington walls, plan for a 5-to-6-year recoat interval; south-facing walls can extend to 7 or 8 years with annual moss treatment.

  - q: "How long does exterior paint last on a Covington home?"
    a: |
      On Hardie cement-board siding with proper prep and a quality acrylic topcoat, expect 10 to 15 years before the next full repaint in Covington's climate. Cedar siding runs shorter: 5 to 8 years on south and west exposures, 4 to 6 years on north-facing walls where moss and mildew growth is a consistent seasonal issue. Trim, doors, and soffits wear faster than field siding and typically need touch-ups between full repaint cycles. Sherwin-Williams Duration carries a lifetime limited warranty on the coating film; workmanship warranty terms are spelled out in the TopVolk contract. Annual moss treatment on north walls — a zinc-sulfate or diluted bleach spray applied each October — extends the paint cycle by a year or two without additional cost.

