title: "Covington Deck Installation — King County Rain-Proof Builds"

intro: |
  Rain in the 98042 zip runs hard from October through May — cedar decks on
  Covington's 1980s builder-era homes near Lake Sawyer Regional Park start
  rotting at the ledger zone within a decade without proper through-flashing.
  Composite decking from Trex or TimberTech handles that wet season far better
  and doesn't need resealing every two years. TopVolk Construction has built
  and replaced decks across southeast King County since 2017, pulling permits
  through King County DPER and managing every inspection from ledger flashing
  through final.

localContext: |
  Most of 98042 was developed in the 1980s and 1990s — two-stories and ramblers
  off SE 272nd Street and around Big Soos Creek, built fast with pressure-treated
  pine decks that are now past their service life. Posts from that era often sit
  in undersized concrete tube forms without UC4B-rated PT lumber, which rots
  quietly beneath the surface. King County DPER oversees permits for Covington,
  and attached decks over 200 square feet require full plan review — typically a
  four-to-eight-week wait before a shovel goes in the ground.

commonProblems:
  - title: "Ledger rot from missing through-flashing on 1980s homes"
    description: "On Covington's builder-era homes, the ledger board was bolted
      directly to the rim joist with no flashing — standard practice in the 1980s,
      a code failure now. Pacific Northwest rain drives moisture behind the ledger
      and rots the rim joist from the inside. King County DPER requires a ledger
      flashing inspection at rough-in, and replacing a rotted rim joist typically
      adds $800–$1,500 to the scope before a single deck board goes down."
  - title: "Post footings too shallow and wrong lumber grade for ground contact"
    description: "King County code requires footings below the frost line — minimum
      12 inches in Covington, often 18 inches on sloped lots closer to Maple Valley.
      Builder-era decks frequently used surface blocks or undersized tube forms.
      Posts embedded in concrete need UC4B pressure-treated lumber or Simpson
      Strong-Tie standoff post bases to keep wood off wet concrete. Undersized
      footings also fail tributary load calculations during permit review."
  - title: "Guardrail height and stair stringer violations on older decks"
    description: "Decks more than 30 inches off grade require guardrails at least
      36 inches high per IRC — most 1980s and 90s Covington decks have 34-inch rails
      that fail current code. Stair stringers get missed too: maximum 7-3/4-inch
      rise, 10-inch minimum run, graspable handrail required for four or more risers.
      TimberTech railing systems are pre-engineered to those specs, which keeps the
      final inspection clean."

faq:
  - q: "How fast can you get to Covington for Deck Installation?"
    a: "Covington is about 30 minutes from our base via SR-18 or SE 272nd. Site visits
      are usually available within two to three business days. Call (206) 591-1096 —
      you'll reach Vladislav directly, not a scheduler or sales rep."
  - q: "Should I use Trex or TimberTech composite, or is cedar still worth it for a Covington deck?"
    a: "Cedar looks good at install but needs sealing every one to two years in southeast
      King County's wet climate, and north-facing sections grow moss by year three. Trex
      Transcend and TimberTech Azek composites resist mildew and carry 25–30-year
      warranties that cedar cannot match. Upfront cost runs 20–30% more than cedar; long-term
      maintenance cost drops sharply."
  - q: "What does the King County permit process look like for a new deck in 98042?"
    a: "Attached decks in Covington go through King County DPER. Plan review for a standard
      deck typically runs four to eight weeks. TopVolk handles the drawings, submittal, and
      all inspections — ledger flashing, framing, and final. WA Licensed Contractor, 100+
      projects completed since 2017, deadline written into the contract."