title: "Covington General Contracting — King County DPER, Owner-Led"

intro: |
  Covington sits in unincorporated King County — which means every structural
  permit flows through King County DPER, not a city building department. Plan
  review alone runs 4-8 weeks before framing can start. Homes off Covington Way
  SE in the 98042 zip code, built mostly between 1985 and 2002, are exactly at
  the point where kitchens get gut-renovated: Thermador range swaps, layout
  changes that require LVL beam work, the kind of scope that needs a licensed GC
  coordinating every trade. That's the job.

localContext: |
  The 98042 zip covers subdivisions that went up fast during King County's
  suburban push southeast of Kent — Jenkins Creek, the streets east of
  Covington Community Park, the clusters near SR-18. Builder-grade framing,
  no flex in the original layouts, crawlspaces with degraded or missing vapor
  barriers from 30-plus years of PNW rain cycling. Homes here are structurally
  sound. The finishes and the systems — HVAC, plumbing stack, electrical panel
  — are done. Owners know it. TopVolk has completed 100+ projects like this
  across King and Pierce counties since 2023.

commonProblems:
  - title: "King County DPER Review Stalls Projects That Skipped the Pre-App Step"
    description: "Unincorporated Covington requires King County DPER approval for anything
      structural — additions, ADUs, load-bearing wall removals, deck ledger board
      attachments. Contractors who submit incomplete drawings add 3-4 weeks of
      resubmittal cycles on top of the standard 4-8 week plan review. Front-loading
      the permit package with full MEP coordination drawings cuts that down hard.
      Vladislav handles this directly — no project manager in the middle."
  - title: "Undersized Headers Surface on Demo Day and Blow the Budget"
    description: "Late-'80s and '90s homes in the 98042 used headers sized to minimum
      code — which worked for the original layout. Open a wall to reconfigure a
      kitchen or primary suite and you'll often find a doubled 2x10 where a
      Parallam PSL post and LVL beam are required to carry the new span. Pre-demo
      structural review by a licensed engineer costs $500-$800. Skipping it can
      add $15K mid-project when the framing crew stops work and waits."
  - title: "Multi-Trade Gaps That Stretch a 10-Week Remodel Into Six Months"
    description: "Electrical rough-in can't start until framing inspection passes. HVAC
      ductwork has to be stubbed and cleared before insulation goes in. Plumbing
      rough-in needs to align with cabinet layout finalized weeks earlier.
      Homeowners managing their own subs — even good ones — routinely hit 3-4
      week gaps between trades. General contractor coordination keeps the punch
      list on schedule, with deadline penalties written into the contract if it
      doesn't."

faq:
  - q: "How fast can you get to Covington for a site visit?"
    a: "Covington is about 25-30 minutes from our base near Kent via SR-18 — same
      week for initial visits in most cases. Call (206) 591-1096 to set up a free
      on-site consultation directly with Vladislav, WA Licensed Contractor."
  - q: "Do you install Sub-Zero, Thermador, and Bosch appliances during kitchen remodels?"
    a: "Yes, regularly. Sub-Zero refrigerators need dedicated circuits and precise
      cabinet panel reveals. Thermador ranges require range hood CFM sizing before
      rough-in. Bosch dishwashers have specific drain loop and electrical specs that
      need to be in the cabinet plans before install day. We spec all of it upfront
      so nothing gets retrofitted later."
  - q: "What does a full kitchen remodel or addition cost in Covington, and how long does it take?"
    a: "Full kitchen remodels in Covington typically run $65K-$130K depending on
      layout changes, structural work, and appliance tier. Timeline: 6-10 weeks
      for kitchens, 4-7 months for ADUs or additions including King County DPER
      permit review. Free on-site estimate with line-item pricing — call
      (206) 591-1096 or schedule at topvolkconstruction.com."