  - q: "What permits does a home addition in Covington require, and how long does the process take?"
    a: "Covington is unincorporated King County, so building permits go through King County DPER — not a city permit office. A standard addition requires a building permit application with site plan, floor plans, and stamped structural drawings. ADUs also require a separate ADU application under WA HB 1337. Plan review at DPER currently runs 6–10 weeks for residential addition projects. As a WA Licensed Contractor, TopVolk prepares and submits the full permit package, coordinates rough-in inspections and the final inspection, and handles any code clarification requests — homeowners don't need to manage the back-and-forth with the county themselves."

  - q: "Can I add a second story to my Covington ranch home without major foundation work?"
    a: "It depends on the original footing dimensions and the load being added. Ranch homes in the 98042 area built before 1995 often have 12-inch continuous perimeter footings that can carry a modest second floor if new loads are distributed carefully through LVL beams and properly placed load-bearing walls. Homes with lighter footings — or those on softer soils closer to the Pipe Lake lowlands — need footing reinforcement or new grade beams before second-floor framing can begin. A structural engineer reviews the existing foundation early in the design process, well before DPER submittal, so there are no surprises mid-project. That engineering review typically costs $1,500–$3,500 and is worth every dollar."

  - q: "What warranty does TopVolk provide on home additions in Covington?"
