title: "Covington Bathroom Remodel — King County DPER Permits, Full Master Bath Reconfigs"

intro: |
  Covington's 98042 zip is heavy with late-1980s and early-2000s tract builds — the master bath
  came with a builder-grade Moen pressure-balance valve, a garden tub nobody soaks in, and a
  fiberglass surround that's been flexing against OSB framing for 25 years. Permits here run
  through King County DPER, not Seattle SDCI — plan review for a plumbing and structural scope
  typically takes 6-10 weeks. Vladislav Volkov has pulled DPER permits across this corridor
  dozens of times.

localContext: |
  The residential streets off SE 256th Street and the neighborhoods fanning out from Lake
  Meridian in 98042 are mostly 1990s-to-early-2000s construction — PVC waste lines, OSB
  subfloors, and exhaust fans spec'd at 50 CFM when 110 CFM is the realistic minimum for
  Pacific Northwest humidity levels. Occasionally you find a late-1980s build near SE
  Kent-Kangley Road with a cast-iron drain stack that needs rerouting before the new shower
  layout works. Subfloor moisture damage from failed fiberglass surrounds is the most common
  surprise on demo day in this zip.

commonProblems:
  - title: "Fiberglass Surround Failure Over OSB — The 1990s Tract Standard"
    description: "Builder-grade fiberglass one-piece surrounds in Covington homes were installed
    directly over OSB framing — no cement board, no Schluter Kerdi membrane, no real
    waterproofing layer. After 25-30 years of PNW humidity cycling, that OSB wicks moisture
    and delaminates. The surround starts flexing at the seam, caulk fails, and water gets into
    the wall cavity. Full demo down to framing, Schluter substrate or cement board, then a
    properly waterproofed tile system is the only lasting fix."
  - title: "Undersized Exhaust Fans and Mold Growing Behind Greenboard"
    description: "Fifty-CFM exhaust fans were code-compliant in 1995. They are not adequate
    for a bathroom in a climate averaging 37 inches of annual rain with consistently high indoor
    humidity. Moisture migrates into wall cavities behind greenboard and drywall, feeding mold
    colonies that don't show until demo. A full remodel scope here includes upgrading to a
    110+ CFM fan, applying RedGard waterproofing membrane to all wet-zone walls, and replacing
    any compromised framing before the new tile goes up."
  - title: "Garden Tub Nobody Uses — Reconfiguring Into a Walk-In Shower"
    description: "The classic 98042 master bath: garden tub in the corner, cultured marble
    double vanity, and a tub-shower combo on the opposite wall. Most Covington homeowners now
    want that garden tub footprint converted into a curbless or curbed walk-in shower with a
    Schluter Kerdi-Board niche and bench. Drain relocation triggers a King County DPER plumbing
    permit — that's a separate submittal from the building permit if structural work is also
    in scope."

faq:
  - q: "How fast can you get to Covington for a bathroom remodel consultation?"
    a: "Covington sits about 30 minutes out via SR-516 or 212th Avenue SE — no complications
    getting there. Call (206) 591-1096 to book an on-site walk-through. Vladislav does the
    consultation himself and brings a rough cost breakdown to the first visit."
  - q: "Do you spec Kohler, Moen, or Delta fixtures for Covington bathroom remodels?"
    a: "All three, depending on the project tier. Kohler rough-in valves are common for
    walk-in shower builds. Moen shows up on secondary bath scopes. For master baths in this
    income bracket, some clients go Hansgrohe or Brizo — we source through Ferguson or the
    client's preferred supplier and coordinate delivery before rough-in inspection."
  - q: "What does a full bathroom remodel cost in Covington, and how long does the project take?"
    a: "A complete master bath reconfiguration in 98042 — demo, Schluter waterproofing system,
    large-format porcelain tile, new vanity, plumbing rough-in and finish, electrical — typically
    runs $35,000–$65,000. Construction takes 6-9 weeks once permits are in hand. King County
    DPER plan review adds 6-10 weeks upfront, so budget 4-5 months total from contract signing
    to punch list. TopVolk is a WA Licensed Contractor, 100+ projects completed since 2017,
    and deadline commitments are written into the contract — missed milestones come with
    financial penalties, not excuses. Call (206) 591-1096 for a line-item quote."