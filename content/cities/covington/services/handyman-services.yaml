intro: |
  Punch-list items from a remodel — loose cabinet hardware, a light switch not flush to the box, caulk gaps around a shower niche — are exactly the kind of work that gets left undone for months because no contractor wants a two-hour job. Vladislav Volkov at TopVolk Construction (WA Licensed Contractor) takes those calls in Covington. Most of the housing stock along the 98042 corridor was built between 1990 and 2010, and those homes are aging in predictable ways: Moen cartridges failing, weatherstripping compressed flat on vinyl sliders, drywall texture that doesn't match a previous patch. Near Covington Community Park and throughout the subdivisions running off 272nd Street SE, Vladislav handles fixture swaps, drywall repairs, exterior trim work, smart home installs, and post-remodel punch lists — the jobs that don't fit a plumber's or electrician's invoice but still need doing right. Call (206) 591-1096 to schedule a free on-site look.

localContext: |
  Covington sits in southeastern King County, primarily zip 98042, with a handful of addresses spilling into 98038 near the Maple Valley border along SR-18. The housing here is mostly 1990s-to-early-2000s tract construction — two-story colonials, split-entry ranchettes, and some townhome clusters near the SR-18 interchange. At that age, builder-grade fixtures are failing on schedule: pressure-balance valves losing their cartridges, door sweep rubber crumbling off steel thresholds, recessed light trims pulling away from the ceiling drywall. King County doesn't require permits for most handyman-scope repairs — fixture swaps, drywall patches, weatherstripping, deck board replacement without structural changes — so these jobs move fast with no permit timeline to navigate. Smart thermostat installs or any work touching the electrical panel needs to follow King County DPER standards, and Vladislav knows exactly where that line sits. Several Covington subdivisions also carry HOA rules restricting exterior paint colors and material choices — worth confirming before touching any siding or trim.

commonProblems:
  - title: "Drywall Patches That Don't Match the Surrounding Texture"
    description: |
      Orange-peel and knock-down texture from the 1990s is nearly impossible to match perfectly off a spray can — but close matters, and it takes practice to get there. The problem usually starts with a TV mounting bracket pulled off the wrong way, a doorstop that punched clean through, or a plumber's access hole that never got patched after a Rinnai tankless water heater install. Vladislav cuts the damaged section back to the nearest stud, hangs a fresh drywall panel or uses a California patch for smaller voids, then builds up joint compound in layers — fill coat, feather coat, light sand, skim finish. Matching existing texture requires adjusting spray distance and overlap; most rattle-can texture products run too heavy without dialing them back. Budget $150–$350 for a standard patch depending on size and how many texture coats the surrounding wall has. Paintable within 24–48 hours after the final coat dries.

  - title: "Weatherstripping Failure on Doors and Vinyl Slider Windows"
    description: |
      Covington's rainy season runs hard from October through April — roughly 37 inches of annual precipitation — and door weatherstripping that's been compressed for 20-plus years loses its memory. The door bottom sweep fails first: the rubber lip tears or flattens out and stops sealing against the threshold. On the vinyl slider windows common in 1990s construction, the fin seal (the brush-style weatherstrip inside the track) compresses flat and stops making contact with the sliding panel. Vladislav replaces door bottom sweeps with a recessed automatic drop sweep — it lifts when the door opens, so it doesn't drag on carpet — and re-installs the correct foam or pile weatherstrip on the door frame stops. Threshold-to-floor joints get re-caulked using a Schluter-compatible flexible sealant. Cost runs $80–$200 per exterior door depending on door type. Window fin seal replacement is $40–$90 per window. Most homes in the 272nd Street SE corridor need four to six doors addressed at once.

  - title: "Smart Thermostat and Doorbell Camera Installation"
    description: |
      A Nest or Ecobee thermostat is a 45-minute install — until it's not. Covington's 1990s tract homes commonly have a two-wire thermostat circuit with no common (C-wire), which means the smart thermostat can't draw the 24V it needs to stay online. Installing a C-wire adapter at the air handler or running a new wire from the furnace control board solves it, but you need to know what you're looking at before pulling the old thermostat. Ring and Nest doorbell cameras carry their own version of the same problem: older chime transformers rated at 8–10VA can't supply the 24VA a video doorbell requires, causing the camera to reset constantly or fail to ring. Vladislav swaps the transformer — $15 part, 20-minute job — and confirms the doorbell loop voltage before leaving. For Nest Protect smoke detectors and Schlage smart lock installs, same process: confirm power and connectivity are solid before calling it done. These installs run $75–$175 depending on what's behind the wall. No King County DPER permit required for low-voltage work of this type.

  - title: "Fixture Replacement — Faucets, Toilets, and Recessed Lights"
    description: |
      A Moen single-handle kitchen faucet with a failing 1225 cartridge gets a $12 cartridge swap or a full faucet replacement, depending on the valve body condition. If the valve seat is pitted or the original braided steel supply lines are from 1998, Vladislav replaces the whole unit — Moen or Kohler pull-down faucets are the standard upgrade, running $150–$350 for the fixture itself. Toilet replacements in Covington's 1990s framing typically involve a standard 12-inch rough-in; most American Standard or Kohler elongated models drop right in. Installed cost runs $250–$500 for a standard toilet, $600–$800 for a dual-flush elongated model. Recessed light swaps in 2x6 ceiling framing are straightforward unless the original cans are IC-rated for insulation contact — worth confirming before ordering LED retrofit kits, since non-IC cans need clearance from insulation. Budget $60–$120 per fixture for a basic LED swap. Vladislav provides a written line-item estimate before touching anything — no vague ranges, no invoice surprises.

  - title: "Deck Board Replacement and Railing Repair"
    description: |
      Pressure-treated (PT) lumber deck boards installed in the late 1990s are often at end-of-life by now — checking, splitting along the grain, fasteners backing out as the wood cycles through wet Pacific Northwest winters and dry summers. Moss establishes on north-facing deck surfaces by November in Covington, and freeze-thaw cycles in late winter accelerate splitting on any board with existing checks. Replacing individual boards with 5/4x6 composite decking — Trex Enhance or TimberTech AZEK are the common choices — makes sense if more than 30% of the surface needs replacement. Composite won't rot, won't need annual sealing, and the color holds. Railing repair typically means replacing the bottom rail where it's held moisture and checking every baluster connection for loose fasteners or rotted blocking. A 200 sq ft deck board replacement with composite decking runs $1,800–$3,500 depending on board count and whether the rim joist or ledger board need sister joist reinforcement. King County DPER does not require a permit for in-kind deck board replacement without structural changes.

