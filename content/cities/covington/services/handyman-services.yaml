  - q: "Do handyman repairs in Covington require King County permits?"
    a: |
      Most handyman-scope work in unincorporated Covington is permit-exempt under King County DPER rules — fixture replacements (faucets, toilets, light fixtures), drywall patches, weatherstripping, and deck board replacement without structural changes all fall below the permit threshold. The line gets crossed with new electrical circuits, structural modifications, or changes to the building envelope. Vladislav will flag anything that tips into permit territory before starting, and if a King County DPER permit is needed, he handles the filing as WA Licensed Contractor. Low-voltage smart home installs — Nest, Ring, Ecobee, Schlage — remain permit-exempt under current county rules.

  - q: "Can you match the texture on 1990s drywall in Covington homes?"
    a: |
      Yes, with a realistic expectation. Most 1990s Covington homes have orange-peel or light knock-down texture — both are achievable with a hopper gun or spray can if you dial in air pressure and overlap correctly. Popcorn ceilings are harder: matching an existing popcorn field over a small patch rarely looks right. The better move is scraping the surrounding area and retexturing a broader section — at least 12–18 inches past the repair edge — so the new texture blends before hitting a seam. Process is primer coat, texture, prime again, then paint. The full sequence takes one to two visits depending on dry time. Homes that have been repainted multiple times over the original texture present adhesion challenges that affect how new texture sits.

  - q: "What warranty do you provide on handyman work in Covington?"
    a: |
      Workmanship is warranted for one year. If a fixture Vladislav installed develops a problem tied to the installation — not normal wear or a product defect — he returns and fixes it. Product warranties run separately: Moen and Kohler carry lifetime or limited warranties on faucets and fixtures, and Trex composite decking carries a 25-year fade and stain warranty. For drywall texture repairs, if the patch cracks along the seam within a year — common in homes where framing is still drying seasonally — Vladislav comes back to feather and repaint. Larger scoped jobs at TopVolk include a deadline penalty clause written into the contract. Single-visit handyman calls carry a standard completion-on-visit expectation. WA Licensed Contractor, owner-operated since 2023.

