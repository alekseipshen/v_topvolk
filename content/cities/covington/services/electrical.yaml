  - q: "What does a 200A panel upgrade cost in Covington?"
    a: |
      A 200A service upgrade in Covington typically runs $3,500-$6,500 all-in — permit fees, panel and breakers, service entrance cable, PSE coordination, and grounding system update included. The main cost variables are panel location (detached garage vs. interior wall), the length of the service entrance cable run, and whether the existing meter socket meets PSE's current requirements or needs replacement. Homes with older Federal Pacific or Zinsco panels usually need more grounding and bonding work to meet current NEC. Call (206) 591-1096 for a free on-site estimate with exact line-item pricing — no ranges that balloon after the fact.

  - q: "Do electrical permits in Covington go through the city or King County?"
    a: |
      Electrical permits in Covington are issued by the City of Covington's own building department — not King County DPER, which handles unincorporated areas. Since Covington incorporated in 2008, it runs its own permit review process. For panel upgrades, you pull a city electrical permit AND coordinate separately with PSE for the utility disconnect and reconnect. Simple circuit additions (EV chargers, dedicated appliance circuits) often get over-the-counter review. Larger panel swaps may need a short plan review cycle. TopVolk is a WA Licensed Contractor and manages permit applications and PSE coordination on your behalf — you don't have to track two separate processes.

  - q: "What size breaker and wire do I need for a Tesla Wall Connector or JuiceBox 48?"
    a: |
      Both the Tesla Wall Connector and JuiceBox 48 are rated for up to 48A continuous draw, which means a 60A double-pole breaker (NEC requires 125% sizing for continuous loads). The circuit conductor must be 6 AWG copper minimum in conduit, or 4 AWG aluminum. Runs longer than 50 feet from the panel to the garage should step up a wire gauge to keep voltage drop within 3% — otherwise the charger throttles itself and charges slower than rated. If you're running a ChargePoint Home Flex set to 32A or 40A, a 50A breaker and 8 AWG copper works. We size the conductor and breaker correctly on the first pull so the charger performs at full capacity.

  - q: "What warranty do you provide on electrical work in Covington?"
    a: |
      All labor carries a three-year workmanship warranty. Panel components — Square D QO breakers and enclosures — are backed by Schneider Electric's manufacturer warranty. Lutron dimmer products carry a 5-year warranty. The City of Covington permit inspection process provides an independent third-party check: if work doesn't pass inspection, we correct it before the permit closes at no additional cost. Outdoor conduit runs, weatherproof enclosures, and exterior EV charger installations are spec'd for PNW moisture exposure from the start. Deadline commitments are written into the contract — if we miss an agreed completion date, there are financial penalties on our side, not just an apology.

