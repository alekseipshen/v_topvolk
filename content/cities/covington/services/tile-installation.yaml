commonProblems:
  - title: "Original 1990s Shower Tile Over Greenboard — Waterproofing Has Already Failed"
    description: |
      Homes built in Covington through the early 2000s used paper-faced gypsum — greenboard — as the shower wall substrate. It was code-acceptable then. It isn't a good choice now. Greenboard absorbs moisture through grout lines and delaminates behind the tile. By the time tile starts popping or grout cracks at the shower base, the greenboard behind it is often saturated and moldy.

      Re-grouting won't fix it. Spot patching won't fix it. Demo goes all the way to the studs. Cement board goes up. Then Schluter Kerdi membrane bonds directly to that substrate before any new tile sets. For a standard 3x5 shower stall in a Timberlane-area home, that full rebuild — demo, waterproofing, new tile, finish work — runs $6,500–$10,500 depending on tile choice and whether the shower niche and bench need new framing. Plan on 2–3 weeks from demo to blue tape walkthrough.

  - title: "Large-Format Porcelain Cracking on Deflecting Subfloors"
    description: |
      32x32 or 24x48 porcelain tile doesn't forgive subfloor movement. Any deflection beyond 1/8" over 10 feet and grout joints crack within a season or two. Sometimes faster.

      In Covington's two-story 2000s homes, the problem usually traces to undersized floor joist spans in bathrooms over garages or bonus rooms. Add two decades of wet seasons and OSB that's absorbed moisture, and you've got a floor that moves. Before large-format tile is ordered, Vladislav checks deflection with a laser level. When it's marginal, the options are sistering additional joists or installing Schluter Ditra uncoupling membrane to absorb minor movement. Ditra won't save a severely deflecting floor — structural work comes first. Skipping that step and setting tile on a bouncy subfloor is how $4,000 in Italian porcelain becomes rubble inside 18 months. Structural floor work, when needed, adds $800–$2,000 to project cost before tile touches the ground.

  - title: "Shower Niche Framing and Waterproofing — Where Most Tile Jobs Develop Leaks"
    description: |
      Shower niches are a common source of hidden water intrusion. Most failures come from two mistakes: no slope on the niche shelf, and waterproofing membrane that stops at the niche opening instead of wrapping the full interior.

      Kerdi membrane needs to cover every surface inside the niche box — back wall, sides, and floor. The shelf needs at least 1/4" per foot of pitch toward the shower side so water drains off. It can't pool. In Covington bathrooms where the original niche was framed with untreated lumber behind drywall, there's frequently rot once the tile comes off. Reframing with pressure-treated (PT) lumber, then applying Kerdi to the full niche interior with Kerdi-Band at all corners and seams, is the only rebuild that holds reliably through nine months of wet season. Niche rebuilds add $400–$800 to a shower retile, depending on size and what demo uncovers.

  - title: "Heated Floor Systems — Ditra-Heat vs. Warmup and Real Installed Costs"
    description: |
      Radiant heated tile floors are a real upgrade in Covington homes. Bathrooms are cold from October through April. Heated tile eliminates the bath-rug problem on large-format porcelain floors.

      Schluter Ditra-Heat combines the uncoupling membrane and electric heating cable into one system. No separate membrane layer. Thinner total floor assembly. Warmup is a strong alternative with reliable thermostat controls and solid contractor support. Either system needs a dedicated 20-amp circuit run by an electrician before tile sets. That's real MEP coordination, not just a tile purchase. In a standard Covington master bath with 60–80 square feet of tile area, Ditra-Heat or Warmup materials run $800–$1,400. Full installed cost — including electrical rough-in and tile labor — typically lands between $3,200 and $5,500. Operating cost runs roughly $15–$20 per month during the winter heating season.

  - title: "Natural Stone Tile — Marble and Travertine Sealing in PNW Moisture Conditions"
    description: |
      Marble and travertine show up in the master baths of higher-end Covington homes. Both need penetrating sealer applied before grouting — then reapplied annually. Skip the pre-grout seal and grout haze soaks into the stone surface during installation. It won't buff out after the fact.

      Travertine has natural voids — that characteristic pitting — which get filled with matching grout during installation. Wrong technique with a rubber float tears those fills out instead of setting them. For homeowners in 98042 choosing Calacatta marble or noce travertine for a master bath floor, installed cost runs $18–$28 per square foot for material and labor combined, not including demo. Annual sealing with a penetrating impregnator like Miracle Sealants 511 adds roughly $150–$250 for a typical bathroom floor. In a climate where humidity stays elevated most of the year, that maintenance isn't optional.

