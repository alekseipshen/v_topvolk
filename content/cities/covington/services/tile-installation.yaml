  - q: "What's the difference between Schluter Kerdi and RedGard for shower waterproofing?"
    a: |
      Kerdi is a sheet membrane bonded directly to the wall substrate with modified thinset mortar. It creates a continuous waterproof layer that tile sets over. RedGard is a liquid-applied membrane painted on in multiple coats — it needs to fully cure before tile sets.

      Both work. Kerdi is more reliable in high-use PNW showers because it's a physically bonded layer with no pinholes or thin-spot risk. RedGard is faster to apply and works well on shower floors and niche interiors as a secondary treatment. For a full Covington shower retile, Kerdi is the standard system on wall faces — with Kerdi-Band at all corners, seams, and curb transitions. Schluter's warranty only applies when the full system is installed per their specs. That warranty detail matters if you're selling the house.

  - q: "How long does tile installation last in a Covington bathroom?"
    a: |
      Tile itself is essentially permanent. The failure point is the waterproofing membrane and grout — behind and between tiles. A properly installed Schluter Kerdi shower assembly should hold 20–30 years without water intrusion issues.

      Grout in a frequently used shower needs resealing every 1–2 years. Selective regrouting around high-movement areas — the curb, corners, and floor-to-wall transition — may come at the 8–12 year mark. Heated floor systems like Ditra-Heat or Warmup have no moving parts under the tile and typically last 25 or more years. PNW humidity makes annual grout sealing non-optional in tiled showers. Skipping it is how grout failures and substrate moisture intrusion begin. TopVolk warranties the installation workmanship, separate from manufacturer material warranties.

