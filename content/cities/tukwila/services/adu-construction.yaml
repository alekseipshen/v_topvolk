title: "Tukwila ADU Construction — DADU Builds Near Southcenter"

answer: "TopVolk Construction builds DADUs and attached ADUs in Tukwila, Washington — WA Licensed Contractor, 100+ projects completed since 2017."

intro: |
  A homeowner near Southcenter can add a detached backyard unit or convert a basement into a legal rental under WA HB 1337, and TopVolk Construction handles design through final inspection as a WA Licensed Contractor with 100+ projects completed since 2017. Tukwila's light rail station on International Boulevard puts several residential pockets — Riverton Heights and the area around Tukwila Pond — inside the state's transit parking exemption radius, meaning a DADU project there doesn't need to add an off-street stall just to pencil out. Plenty of the ranch homes built here in the 1950s and 60s sit on crawlspace foundations with aluminum wiring that needs addressing before a detached unit's utility tie-in goes in. One recent build near Foster Golf Links paired a 600 sq ft DADU with a Mitsubishi mini-split system instead of running ductwork from the main house — cheaper trenching, faster rough-in. Vladislav walks every lot personally before pricing it.

localContext: |
  Most of Tukwila's single-family stock sits in the 98168 and 98188 zip codes, a mix of 1950s-60s ranch homes in Riverton Heights and Allentown alongside newer infill near Southcenter and the Tukwila Urban Center. Lots here tend to run smaller than in Renton or Kent, so FAR and lot coverage calculations matter early — a DADU has to fit within the 24 ft height limit and standard setbacks without eating the existing detached garage. Tukwila runs its own permit center separate from King County DPER since it's an incorporated city, and plan review for a detached ADU typically takes 6-10 weeks once the site plan, utility plan, and structural calcs for the LVL beam or PSL post supporting the new unit are submitted complete. Heavy rain from October through May means any DADU built over a crawlspace needs a proper vapor barrier and positive drainage away from the slab — skip it and you're looking at mold under the subfloor within a couple winters. Older galvanized water lines on some 1960s lots also need evaluation before a separate utility connection gets run to the new unit.

commonProblems:
  - title: "DADU, Attached ADU, or Basement Conversion — Picking the Right One for Your Lot"
    description: "WA HB 1337 lets most Tukwila single-family lots carry up to two ADUs, but which type pencils out depends on the lot and the house. A basement conversion in one of the 1960s ranches off Tukwila International Blvd usually needs a new egress window cut into the foundation wall and sister joists added to the existing floor framing to meet IRC live-load requirements — that's a 4-6 week job before drywall even starts. An attached ADU bolts onto the house with a ledger board and shares the water heater, which is cheaper but caps rental flexibility. A detached unit (DADU) runs independent utilities and a Mitsubishi mini-split for heat, typically $180K-$240K, but rents separately and holds resale value better. Vladislav prices all three options before you commit to one."
  - title: "Utility Separation — Shared Meter vs. Separate Water/Sewer Connection"
    description: "Renting a DADU separately from the main house means the city wants its own water meter and, in most cases, an independent sewer lateral tied into the street main rather than tapping the existing line. That trenching work runs through the yard and can hit $8K-$15K depending on how far the new unit sits from the right-of-way, and it has to pass a rough-in inspection before the trench gets backfilled. Basement conversions near lots closer to the Duwamish sometimes sit below the sewer main's invert elevation, which means a sewer ejector pump instead of gravity drainage — a Zoeller pump system handles it, but it adds $2K-$4K and a maintenance item the owner needs to know about. We spec a Navien or Rinnai tankless water heater for the new unit instead of sharing the house's tank, since shared hot water becomes the first tenant complaint."
  - title: "Permit Timeline and Setbacks Through the City of Tukwila"
    description: "Tukwila issues its own ADU permits through the Community Development Department rather than King County DPER, since the whole city is incorporated — different from unincorporated pockets like West Hill nearby. Plan review for a detached ADU typically runs 6-10 weeks once site plan, elevations, and structural calculations are in, longer if the lot backs onto a critical area near the Duwamish or a creek buffer, which triggers an extra environmental checklist. A DADU has to stay under the 24 ft height limit and clear setback minimums, but HB 1337 also waives off-street parking requirements for lots within a half-mile of the Tukwila International Boulevard light rail station, covering a good chunk of Riverton Heights. We pull the permit, handle review comments, and schedule the rough-in and final inspections — as a WA Licensed Contractor, TopVolk pulls permits under its own name, not a sub's."
  - title: "What an ADU Actually Costs in Tukwila — and What Drives the Number"
    description: "A detached ADU in Tukwila typically lands between $180K and $260K depending on size, foundation type, and how far utilities have to travel from the street. A basement conversion is the cheapest path to a legal rental — often $70K-$110K — since the foundation and roof already exist, but egress windows, fire-rated separation between units, and a sister-joisted floor for sound control eat into that savings fast. Finish level swings the number too: semi-custom cabinets and KitchenAid appliances cost less than a Sub-Zero/Wolf package, and most Tukwila rentals don't need that upgrade to cash flow. Every TopVolk quote is line-item — slab, framing, MEP rough-in, finish work — not a vague range, and the contract has a deadline penalty clause built in if we run late. Call (206) 591-1096 for a free on-site walkthrough and an actual number."
  - title: "Siding, Decking, and the Mini-Split — What Holds Up in Tukwila's Wet Winters"
    description: "Tukwila sees the same wet stretch as the rest of the Sound — close to 37 inches of rain between October and May — and it shows on whatever siding gets picked for the new unit. Cedar looks right against an older Riverton Heights ranch, but it needs restaining every 3-4 years or it streaks and grows moss on the north wall; Hardie cement-board siding costs more upfront but holds paint a decade or longer and doesn't rot. For any deck or stair landing on a DADU, we spec Trex or TimberTech composite over PT lumber — composite shrugs off the freeze-thaw cycles that hit the foothill side of King County and never needs sealing. A Mitsubishi mini-split heating the unit should get a filter clean every few months and runs 15-20 years with basic upkeep, and R-49 attic insulation with a proper crawlspace vapor barrier keeps moisture problems in check long after we're done."

faq:
  - q: "How fast can you get to Tukwila for Adu Construction?"
    a: "Tukwila sits right at the I-5/I-405 interchange, so getting a TopVolk truck out for a site walk is usually same-week, often within a day or two of your call. Most lots here have driveway or street parking close enough that the initial measure-and-photos visit takes under an hour — no special access needed unless your lot backs onto a creek buffer or other critical area, which we'd flag ahead of time. From that first walkthrough to a signed contract with line-item pricing usually takes 1-2 weeks, depending on how fast utility locates come back. Call (206) 591-1096 to get on the schedule — Vladislav does the walkthrough himself, not a salesperson."
  - q: "What does an ADU cost in Tukwila?"
    a: "A detached ADU in Tukwila generally runs $180K-$260K all-in, while converting an existing basement into a legal rental unit runs closer to $70K-$110K since you're not pouring a new foundation. Attached ADUs fall in between, usually $120K-$170K, depending on whether the kitchen and bathroom are new builds or upgrades to existing space. The biggest swing factors are utility separation — a separate water meter and sewer lateral add real trenching cost — plus finish level and site access for equipment. Every quote from TopVolk is a free on-site estimate with line-item pricing spelled out, not a ballpark range."
  - q: "How does ADU permitting work in Tukwila?"
    a: "Tukwila handles ADU permits through its own Community Development Department rather than King County DPER, since the city is incorporated — that's different from unincorporated pockets like West Hill close by. We prepare the full submittal: site plan, floor plan, elevations, structural calculations for any LVL beam or PSL post, and energy code compliance forms before anything goes to the counter. Plan review for a detached unit typically takes 6-10 weeks; a basement conversion with no exterior footprint change can move faster, sometimes 4-6 weeks. As a WA Licensed Contractor, TopVolk pulls the permit under its own name and handles every round of review comments plus the rough-in and final inspections."
  - q: "Do I need a separate water and sewer connection for my ADU?"
    a: "It depends on the configuration. A basement conversion or attached ADU usually shares the house's existing water service and sewer lateral, with a sub-meter added if you want to bill a tenant separately. A detached ADU more often needs its own water meter and sewer lateral tied into the street main, which Tukwila will require if the unit is going to be rented independently long-term. We also install a dedicated tankless water heater — typically a Rinnai or Navien — for detached units instead of running a long hot water line back to the main house, since heat loss over distance makes shared hot water unreliable."
  - q: "What's the warranty on an ADU build, and how long will it last in Tukwila's climate?"
    a: "TopVolk backs structural and workmanship items under a standard contractor warranty, and manufacturer warranties carry through on top of that — a Mitsubishi mini-split typically carries a 5-12 year parts warranty depending on registration, and Hardie siding is warranted for decades against the rot and moss buildup that hits north-facing walls here. Built correctly, with R-49 attic insulation, a proper vapor barrier, and standard Douglas-fir framing to spec, an ADU in Tukwila should perform like the main house for 40+ years with normal maintenance. The deadline penalty clause in every contract is separate from the warranty — it's there so a missed completion date costs us, not you."
  - q: "Do you build ADUs outside Tukwila too?"
    a: "TopVolk covers the Seattle Metro area — King, Snohomish, Pierce, and Kitsap counties — so Tukwila jobs sit right in the middle of our usual radius alongside Renton, SeaTac, Burien, and Kent. Scheduling typically runs 2-4 weeks out for a start date once permits are in hand, though the design and permitting phase itself takes longer. We've completed 100+ projects since 2017, all owner-led, so Vladislav is the one on-site coordinating the rough-in, inspections, and the final punch list walkthrough. Call (206) 591-1096 or schedule a free consultation to get your lot on the calendar."