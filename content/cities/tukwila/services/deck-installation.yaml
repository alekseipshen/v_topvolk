title: "Tukwila Deck Installation — King County Permits and PNW Rain"

intro: |
  Fort Dent Park pulls the neighborhood out to the Green River corridor, and the
  residential streets east of Southcenter in 98168 are full of 1960s and 70s
  split-levels — many with original wood decks that were never flashed at the
  ledger. King County averages 37 inches of rain a year. That moisture wicks
  straight into an unflashed rim joist connection and stays there. Vladislav
  Volkov at TopVolk Construction has been pulling apart those connections since
  2017, and the rot picture inside is usually worse than what shows from the
  outside.

localContext: |
  Housing in 98168 runs mostly from the late 1960s through the 1980s — ranchers,
  split-levels, and modest two-stories on smaller lots near the Green River
  greenbelt. Original decks on these homes used standard framing lumber bolted
  against the rim joist, no Vycor tape, no metal Z-flashing — a code violation
  since the 2006 IRC update. The 98188 area near SeaTac follows the same pattern.
  Post footings here need to reach at least 12 inches below grade to meet King
  County frost-line requirements, using ground-contact rated PT lumber, not
  above-ground stamped stock.

commonProblems:
  - title: "Ledger Rot Behind the Flashing That Was Never Installed"
    description: |
      Tukwila split-levels from the 60s and 70s had decks bolted straight into the
      rim joist with lag screws — no standoffs, no membrane. Rainfall works into
      that joint for a decade before anything shifts visibly. By then the rim joist
      and often the band joist inside the floor system are rotted through. Patching
      won't fix it. The repair is full ledger replacement, Vycor or metal Z-flashing
      installation, and a ledger flashing inspection through King County DPER before
      any new decking goes back on.

  - title: "Cedar Decking That Turns Green and Soft by Year Four"
    description: |
      Cedar reads as the obvious choice, but north-facing Tukwila decks stay wet
      from October through May. Moss roots in by year three, and once it does,
      you're refinishing every 18 months or the boards soften. Trex Transcend and
      TimberTech Azek composite boards don't retain moisture the same way — both
      carry 25-year fade and stain warranties and resist the moss cycle that cedar
      can't. The upfront material cost runs higher, but the maintenance math over a
      20-year PNW lifespan is not close.

  - title: "Post Footings Above the Frost Line — the Heave and Rack Problem"
    description: |
      Older decks in 98168 often sit on 4-to-6-inch concrete pads poured just below
      sod — well above the 12-inch King County frost depth minimum. Wet winters with
      freeze-thaw cycles heave those pads unevenly, racking the post-and-beam
      structure and pulling the ledger connection out of alignment. Correct footings
      use Sonotubes poured to 12-18 inches minimum depth, hot-dipped galvanized PT
      post bases set plumb before the concrete sets, and 6x6 ground-contact rated
      posts throughout.

faq:
  - q: "How fast can you get to Tukwila for a deck estimate?"
    a: |
      Tukwila is straightforward off I-5 — we cover 98168 and 98188 regularly.
      Vladislav does the consultation himself, not a sales rep. Call (206) 591-1096
      to schedule. Most first visits happen within the week and you get a line-item
      quote, not a vague range.

  - q: "Do you work with Trex and TimberTech, or are you locked to one brand?"
    a: |
      Both, no preference. Trex Transcend handles high foot-traffic well; TimberTech
      Azek carries stronger warranty coverage in moisture-heavy zones. We bring
      actual samples on-site — color and texture in hand, not catalog photos. 100+
      projects completed since 2017 across King, Snohomish, Pierce, and Kitsap
      counties, so both lines are well represented in our work.

  - q: "What does the permit process look like for a deck in Tukwila?"
    a: |
      Tukwila falls under King County DPER. Plan review for an attached deck runs
      3–6 weeks — longer for designs over 200 sq ft or where structural framing
      changes are involved. TopVolk handles the permit application, any structural
      drawings required by the AHJ, and all inspections including ledger flashing
      and final sign-off. WA Licensed Contractor. Build time after permit approval:
      1–2 weeks for most decks under 400 sq ft. Call (206) 591-1096 to map out the
      full timeline and what the contract deadline penalty looks like in writing.