title: "Tukwila Deck Installation — Built for Duwamish River Rain"

intro: |
  Fort Dent Park sits at the Duwamish River confluence, and 98168 stays wet from October through May.

  Cedar decks on Tukwila's 1970s and 80s ranchers typically start rotting at the ledger zone within 10-12 years without proper flashing — faster on north-facing elevations where moss colonizes by year two. More homeowners in Cascade View and Riverton Heights are switching to Trex composite this season. The 10-year maintenance math makes a clear case for why, especially on shaded lots where cedar needs sealing every two years just to stay ahead of the mold cycle.

localContext: |
  Most of Tukwila's residential stock sits in the 98168 and 98188 zip codes — post-war ramblers, 1960s split-levels, and 1980s builder-grade construction close to Southcenter Mall. Homes in Riverton Heights and Cascade View were built before ledger flashing became a code requirement. Original decks here are often attached directly to the rim joist with no moisture barrier whatsoever. That's the rot pattern we find most often when homeowners call about a deck that's started to feel soft underfoot. The clay-heavy soils throughout this part of King County compound the footing problem — wet-season heave is real here, even without the hard freezes you'd see in North Bend or Enumclaw. Tukwila runs its own building permit department rather than routing through King County DPER, so drainage setbacks and soil bearing requirements get reviewed locally — worth knowing before you schedule a footing pour.

commonProblems:
  - title: "Ledger Rot at the Rim Joist — Common on Pre-1990 Tukwila Homes"
    description: "Homes built before 1992 frequently have ledger boards attached without through-wall flashing. Rainwater wicks behind the ledger, stays against the rim joist through winter, and rots from the inside out. By the time the deck surface feels spongy, the structural connection to the house is already compromised. Correct installation requires Vycor Plus flashing behind every ledger and a rough-in inspection before decking goes down. Tukwila's building department requires that intermediate inspection — skipping it and hoping nobody notices is how homeowners end up with an unpermitted structure they can't sell without disclosing."

  - title: "Post Footings Too Shallow for Wet-Winter Ground Movement"
    description: "Surface-mount post hardware with no footing shows up constantly on older Tukwila decks. Clay-heavy soils heave during wet winters even without a hard freeze. IRC requires footings to frost line — minimum 12 inches in this zone, 18 for added margin. Shallow footings rack the frame and open gaps where water enters the substructure."

  - title: "Cedar on Shaded Lots — Moss Takes Hold by Year Two"
    description: "North-facing decks in 98168 stay damp most of the year under Douglas-fir and maple. TimberTech and Trex composite don't give moss a grain to grip. On a shaded Tukwila lot, composite wins on 10-year cost."

faq:
  - q: "How fast can you get to Tukwila for Deck Installation?"
    a: "Tukwila is easy from I-5 or SR-99 — we cover all of King County. Call (206) 591-1096 to reach Vladislav directly and schedule a free on-site visit. No sales staff, no estimator in between."

  - q: "Trex or cedar — what do you actually recommend for Tukwila decks?"
    a: "Cedar holds up fine on sunny, south-facing decks with good drainage and a homeowner who'll seal it every two years. On shaded or north-facing lots — which describes a significant share of homes in Riverton Heights and 98168 — TimberTech or Trex composite is the practical call. Composite drains faster, skips the annual maintenance cycle, and doesn't check and split through Seattle's dry-wet-dry summers. Site conditions decide it, not brand preference."

  - q: "Do I need a permit for a new deck in Tukwila, and how long does it take?"
    a: "Tukwila runs its own building department — this isn't King County DPER. Decks over 200 sq ft or 30 inches above grade require a building permit, and plan review typically runs 3-5 weeks. Vladislav is a WA Licensed Contractor with 100+ projects completed since 2017 across King County — he handles permit applications and coordinates both the ledger flashing rough-in and footing inspections mid-build. Start-to-finish on a standard 300-400 sq ft deck runs 4-6 weeks after permit approval. Deadline commitments go in the contract — if we miss the schedule, there's a written financial penalty, not just an apology."