  - q: "Does a water heater replacement need a permit in Tukwila?"
    a: "Yes — Washington state code requires a permit and inspection for any water heater replacement, plus seismic strapping at two points on the tank. The City of Tukwila Building Division handles these permits directly rather than routing through King County DPER, and turnaround for a straightforward swap permit usually runs a few business days. TopVolk pulls the permit, schedules the inspection, and handles the paperwork as part of the quoted price — it's WA Licensed Contractor work start to finish. Most tank swaps finish in a single day; tankless conversions with a gas line upsize take 2-3 days including inspection scheduling."
  - q: "Should I switch to a tankless water heater in Tukwila?"
    a: "It depends on your gas line size and how much hot water your household actually uses — a Rinnai or Navien tankless unit delivers endless hot water but needs a properly sized gas line and a dedicated condensate drain for the high-efficiency models. Homes with electric water heaters need an even bigger conversation, since adding gas service is a separate scope. TopVolk evaluates the existing gas meter capacity and line size on-site before quoting, since an undersized line is the most common reason a tankless install underperforms. Most conversions land between $4,200-$6,800 fully installed and permitted."
  - q: "How long do PEX and copper supply lines last in Tukwila?"
    a: "PEX-A supply lines typically run 40-50 years before any meaningful degradation, and copper lasts even longer if water chemistry stays neutral — both outperform the original galvanized steel by decades. Tukwila's water isn't especially hard, but homes below 80 psi static pressure see noticeably less wear on fittings and fixture cartridges over time. TopVolk backs repipe labor with a 1-year workmanship warranty, and material manufacturers like Moen and Kohler carry their own lifetime cartridge warranties on top of that. Galvanized pipe, by comparison, is already past its expected lifespan in most homes built before 1965."
