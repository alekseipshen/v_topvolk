title: "Tukwila Plumbing — Fixing What 1960s Ranch Homes Hide"

answer: "TopVolk repipes galvanized and polybutylene lines, swaps water heaters, and fixes drains in Tukwila, WA — WA Licensed Contractor, 100+ jobs since 2023."

intro: |
  A water heater that won't fire past pilot light usually means a bad thermocouple — but in Tukwila's older ranch homes near Riverton Heights, it's just as often the galvanized supply line feeding the unit that's down to a quarter of its original diameter. TopVolk Construction, owner-operated by Vladislav Volkov, has repiped homes, swapped in Rinnai and Navien tankless units, and rerouted drain lines across King County since 2023. Tukwila's housing runs from 1950s-60s ranch homes near Foster Golf Links to apartment and townhome stock built up along Tukwila International Boulevard in the 1980s, and each era brings a different plumbing problem to the door. A homeowner near Westfield Southcenter recently needed her galvanized kitchen line swapped for PEX before a new Moen pull-down faucet would hold steady pressure at the spout. Call (206) 591-1096 for a quote with actual line items, not a ballpark guess over the phone.

localContext: |
  Tukwila splits mainly across zip codes 98168 and 98178, with pockets of 98188 near the airport corridor. Riverton Heights and Allentown still hold a fair number of 1950s and 60s ranch and split-level homes built with galvanized steel supply lines and cast iron drains, both of which are well past their service life. Closer to Tukwila Village and the Southcenter retail district, you'll find 1980s and 90s townhomes and apartment buildings — a chunk of that era used polybutylene (poly-B) supply pipe, which cracks at the crimp fittings as the plastic breaks down from chlorinated city water. Washington's plumbing code requires seismic strapping on every water heater tank, and the City of Tukwila pulls its own permits through the Community Development Department rather than routing through King County DPER. Older crawlspaces near the Duwamish River floodplain also see more moisture intrusion, which speeds up corrosion on any exposed galvanized fittings.

commonProblems:
  - title: "Galvanized Pipe Choking Off Flow in Riverton Heights Ranches"
    description: "Galvanized steel pipe rusts from the inside out, and by year 40 or 50 the mineral buildup inside the threaded fittings can cut a 3/4-inch line down to the flow of a 1/4-inch line. Homeowners usually notice it as weak shower pressure on the second floor or a kitchen faucet that sputters when the dishwasher runs. The fix is a full repipe with PEX or copper supply lines, run with new shutoff valves at every fixture and a fresh main shutoff at the meter. On a typical 3-bedroom ranch near Foster Golf Links, that runs $7,000–$14,000 depending on whether walls get opened or lines get fished. Most jobs finish in 3-5 working days, including drywall patch."
  - title: "Poly-B Supply Lines Cracking in 1980s Tukwila Townhomes"
    description: "Polybutylene pipe — gray plastic tubing installed in a lot of Pacific Northwest construction between 1978 and 1995 — degrades from the inside as chlorine in city water reacts with the plastic over decades. Fittings at the crimp rings are usually where it lets go first, often behind a wall or under a slab where nobody sees it until drywall stains or a water bill spikes. Insurance companies in Washington increasingly flag poly-B during claims review, which pushes some owners to repipe ahead of a sale. TopVolk swaps it for PEX-A with home-run manifolds, which also makes future fixture work easier. Budget $6,500-$12,000 for a typical 1,400 sq ft townhome, with most work done wall-to-wall in under a week."
  - title: "Tankless Water Heater Conversion and the Gas Line Upsize Nobody Mentions"
    description: "Switching from a 40-gallon tank to a Rinnai or Navien tankless unit isn't a drop-in swap — tankless units pull a higher BTU load, and a lot of older Tukwila homes have a 1/2-inch gas line sized for the original tank, not the new unit's burner. That means upsizing the gas line, sometimes adding a new branch off the meter, plus a dedicated condensate drain for the high-efficiency models. Washington code also requires a permit and inspection for the swap, plus seismic strapping if a tank-style unit stays as backup. City of Tukwila pulls these permits through its own Building Division, and TopVolk handles the application and schedules the rough-in and final inspection. Expect $4,200-$6,800 installed, with the gas line upsize being the main cost swing."
  - title: "Bathroom Fixture Upgrades — What Actually Drives the Price"
    description: "Swapping a builder-grade faucet for a Kohler or Delta fixture sounds simple until the old shutoff valves seize or the drain trap doesn't line up with the new fixture's rough-in dimensions. Labor on a straightforward faucet and trap swap runs $350-$650 per fixture; a full vanity with new supply lines, P-trap, and angle stops climbs to $800-$1,400. Tukwila's median household income sits around $63,000, so most homeowners here go mid-range — Moen and Kohler over the ultra-premium lines — and TopVolk quotes exact part numbers up front so there's no surprise on material cost. Fixture work carries a 1-year labor warranty on top of manufacturer parts coverage, which on Kohler and Delta typically runs lifetime on the cartridge."
  - title: "Drain Reroutes for Kitchen Islands and Basement Bathrooms"
    description: "Adding a sink to a kitchen island or a bathroom in a basement means routing new drain line back to the main stack, often below the slab or through joist bays, plus a vent connection so the trap doesn't siphon dry. In Tukwila's older homes, this is also when a pressure regulator (PRV) gets added if static city pressure tests above 80 psi, which is common in the lower elevations near the Duwamish River. Skipping the PRV shortens the life of every fixture and supply line downstream. A basement bath drain reroute with a sewage ejector pump typically runs $3,500-$7,500 depending on distance to the main stack; a PRV install alone is $450-$750. Both require permit sign-off and a rough-in inspection before drywall closes the wall."

