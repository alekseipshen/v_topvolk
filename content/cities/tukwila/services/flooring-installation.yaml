  - q: "Do I need a permit for flooring replacement in Tukwila?"
    a: "Straight flooring replacement — pulling up old material and installing new hardwood, LVP, or tile — generally doesn't require a permit in Tukwila. If the job involves removing a load-bearing wall, altering subfloor framing, or changing the building footprint, it routes through King County DPER since Tukwila runs its own building department under the same IRC code baseline as the rest of the county. TopVolk handles the permit application and inspection scheduling on any job that crosses that line. As a WA Licensed Contractor, Vladislav pulls and manages the paperwork directly — no separate permit expediter involved."
  - q: "How long does hardwood need to acclimate before installation in Tukwila?"
    a: "Solid and engineered hardwood both need 4-7 days inside the conditioned space before installation, stacked and unwrapped so the wood adjusts to the home's actual humidity — which runs higher in Tukwila than drier parts of King County given the Duwamish River proximity. Skipping acclimation is the number-one cause of gapping or cupping within the first year, especially with Bruce or Mohawk solid oak products. TopVolk delivers material to the site and checks moisture content again right before nailing or gluing starts. This step adds time to the schedule but it's non-negotiable on solid wood jobs."
  - q: "What's the warranty on new flooring installation?"
    a: "TopVolk backs installation workmanship for one year, separate from the manufacturer's product warranty on materials like Shaw or COREtec, which typically run 10-25 years for LVP and 25-50 years for engineered hardwood finish. Tukwila's humidity swings mean proper acclimation and subfloor prep matter more here than in drier climates, so warranty claims almost always trace back to moisture, not material defect. Solid hardwood, properly installed and maintained, lasts 30+ years and can be refinished multiple times. Ask about the specific manufacturer warranty terms during your free estimate."
