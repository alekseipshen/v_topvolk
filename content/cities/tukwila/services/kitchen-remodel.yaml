title: "Tukwila Kitchen Remodel — Opening Up 1960s Ranch Floor Plans"

intro: |
  Riverton Heights and the blocks off Fort Dent Way hold a lot of 1960s ranch houses — solid bones, decent lots, but kitchens boxed off from the living room behind solid partition walls. That layout made sense when a GE electric range and a separate dining room were the standard. Homeowners now want open sightlines, islands, and KitchenAid appliances where the pass-through wall used to be. That wall removal almost always means load-bearing analysis and an LVL beam.

localContext: |
  Most of Tukwila's residential stock sits in the 98168 and 98178 zip codes — ranch-style builds from 1955 to 1975. Original 100-amp panels are common throughout Cascade View and the streets north of Southcenter. Crawlspaces under these ranch floors face real moisture pressure from the Green River corridor and the city's 37-plus inches of annual rain — a vapor barrier under the kitchen subfloor is worth doing during any remodel. Tukwila's own building department handles permits, not King County DPER.

commonProblems:
  - title: "Load-Bearing Walls Blocking the Open-Concept Layout"
    description: "A lot of Tukwila ramblers have a full structural wall exactly where homeowners want an island or wide passage. Confirming load-bearing vs. partition means pulling ceiling drywall to trace joist direction. Once structural, we spec an LVL beam sized for the span, install temporary shoring, make the swap, and patch back. Tukwila Building requires a permit and structural drawings before any wall comes down."
  - title: "100-Amp Panels Undersized for Modern Kitchen Loads"
    description: "Original 100-amp service in the 98168 zip causes problems when you add an induction range alongside a refrigerator and dishwasher. An induction cooktop draws up to 50 amps on a dedicated 240V circuit alone. The fix is a 200-amp service upgrade — new meter base, new panel, updated load calculation. Bosch and KitchenAid both publish electrical minimums most original panels cannot meet."
  - title: "Soffits Hiding Ductwork Above Cabinet Runs"
    description: "Ranch-era kitchens in Tukwila typically have 8-foot ceilings with soffits boxed above original cabinets. Demo those soffits and you frequently find HVAC ducts or wiring running through them — rerouting adds scope and cost that's hard to estimate without opening the ceiling first. IKEA cabinet boxes top out at 96 inches, but semi-custom cases handle non-standard heights and widths when the soffit configuration is unusual."

faq:
  - q: "How fast can you get to Tukwila for Kitchen Remodel?"
    a: "Tukwila is a direct run down I-5 or SR-99 from our usual South King County work zone. Site visits are typically available same-week. Call (206) 591-1096 — Vladislav answers directly, no scheduler or call center involved."
  - q: "Which appliance brands do you work with during a kitchen remodel in Tukwila?"
    a: "KitchenAid and Bosch are the two most common mid-range brands in the Tukwila remodels we've done. GE Profile shows up in older kitchens being refreshed. Each brand has specific rough-in cutout dimensions and electrical requirements we build for during framing — before cabinets are ever ordered."
  - q: "How long does a full kitchen remodel take in Tukwila, and what does the permit process look like?"
    a: "A full gut-and-rebuild typically runs 6-10 weeks once permits are in hand. Tukwila Building reviews most kitchen permits in 2-4 weeks — structural work adds plan review time. We handle permit submittal. WA Licensed Contractor, 100+ projects completed since 2023. Milestone deadlines go into the contract with written penalties for missed dates. Call (206) 591-1096 to schedule a free on-site estimate."