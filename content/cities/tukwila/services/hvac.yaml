title: "Tukwila HVAC: Heat Pump & Ductless Installs for Remodels"

answer: "TopVolk handles heat pump conversions, ductless mini-splits, and HVAC for remodels/ADUs in Tukwila, WA — WA Licensed Contractor, 100+ projects since 2017."

intro: |
  A heat pump conversion in a Foster-area rancher and a ductless mini-split install in a new Riverton Heights ADU look like two different jobs, but they hit the same obstacles: an electrical panel that's maxed out, a crawlspace with zero clearance, and ductwork original to the Eisenhower administration. TopVolk Construction handles HVAC scope as part of larger remodel, addition, and ADU projects across Tukwila — not as a standalone repair call. Vladislav Volkov sizes every system with a Manual J load calculation before anyone touches a Mitsubishi or Daikin unit, because guessing on BTU output is how homeowners near Fort Dent Park end up with a bedroom that never cools below 78°F in August. Most of this work ties into bigger projects — finishing a basement near the Tukwila Community Center, converting a garage to an ADU off Interurban Avenue, or gutting a kitchen where the old gas furnace needs to come out anyway. Call (206) 591-1096 for a free on-site consultation before signing anything.

localContext: |
  Zip codes 98168 and 98188 cover most of Tukwila's housing stock, split roughly into two eras: 1950s-60s ranch and split-entry homes around Allentown and Riverton Heights, and newer townhome and multifamily construction near Westfield Southcenter and the Tukwila International Blvd light rail station. The older ranches typically run a single zone off one furnace, with sheet metal trunk lines that were never sealed at the boots — that's the rebalancing problem. Crawlspace duct runs in those same homes need an intact vapor barrier, since Tukwila gets close to 37 inches of rain a year and damp crawlspace air rusts sheet metal ductwork from the outside in. Newer builds near the light rail station already meet Washington State Energy Code (WSEC) minimums but often get value-engineered HVAC — the builder installed the smallest unit that passed inspection, not the one that keeps south-facing rooms comfortable. Permits for HVAC work in Tukwila run through the City of Tukwila Community Development Department, not King County DPER, since Tukwila is its own incorporated jurisdiction. A 200-amp electrical panel is standard in homes built after 1990 here, but plenty of 1960s ranches near Duwamish Hill Preserve still run 100-amp service, which limits heat pump conversion options until the panel gets upgraded.

commonProblems:
  - title: "Gas Furnace to Heat Pump Conversion — Electrical Panel Is the Bottleneck"
    description: "Half the heat pump conversion calls TopVolk gets in Tukwila start the same way: a homeowner near Riverton Heights wants a Mitsubishi Hyper-Heat or Daikin cold-climate heat pump to replace an aging 80% AFUE furnace, but the 100-amp electrical panel can't carry the new air handler and backup strip heat. The fix usually means a panel upgrade to 200 amps, a dedicated 30-amp circuit for the outdoor condenser, and a line set sized for R-410A refrigerant. Federal tax credits can offset part of the equipment cost on qualifying cold-climate units. Budget $9,500-$16,000 for a full ducted heat pump swap once electrical work is included, with the panel upgrade itself running $2,500-$4,000 separately. Most jobs finish in 2-3 weeks including inspection."
  - title: "Ductless Mini-Splits for ADUs and Additions — No Existing Duct Run to Tap Into"
    description: "A detached ADU behind a house off Christensen Road or a bonus room addition near Fort Dent Park almost never has ductwork to extend, so running a new supply trunk back to the main furnace isn't realistic. TopVolk specs ductless mini-split systems — usually LG or Samsung single-zone units for one room, Daikin multi-zone for a full ADU — because the refrigerant line set can run through a 3-inch wall penetration instead of a full duct chase. Each indoor head needs its own condensate drain routed to daylight or a condensate pump, which matters in a slab-on-grade ADU with no crawlspace access. A single-zone mini-split runs $4,500-$7,000 installed; a 3-zone system for a full ADU lands closer to $11,000-$15,000. Under WA HB 1337, the unit still needs its own disconnect box and dedicated circuit."
  - title: "95% AFUE Furnace Replacement — Venting Has to Change, and the City Wants to See It"
    description: "Swapping an 80% AFUE furnace for a 95%+ AFUE condensing furnace changes the exhaust from a metal flue running into a chimney to PVC venting that exits through a sidewall, and the City of Tukwila Community Development Department requires a mechanical permit before that work starts. TopVolk pulls the permit, schedules the rough-in inspection after the line set and venting are run, and books final inspection once the Rheem or Carrier unit is fired up and tested. Combustion air intake and condensate drain routing both get checked at rough-in — miss either one and the inspector red-tags the job. Plan review for a straightforward furnace swap in Tukwila usually takes 1-2 weeks; full installation including both inspections runs 2-4 weeks end to end. TopVolk is a WA Licensed Contractor, and Vladislav handles the permit paperwork directly — no third-party permit runner."
  - title: "Adding AC to an Existing Forced-Air System — Duct Capacity Sets the Price"
    description: "Plenty of homes near Southcenter were built with a forced-air furnace and ductwork sized only for heating, so bolting on a Bosch or Trane condenser without checking duct capacity just means a system that short-cycles and a power bill that climbs every July. TopVolk runs a static pressure test on the existing supply trunk and return air duct before quoting AC addition work — if the trunk line is undersized, the cost goes up because TopVolk resizes runs rather than overloading a 25-year-old duct system. A straightforward AC addition with adequate ductwork runs $5,500-$8,500; jobs needing duct upgrades or a new return run $9,000-$13,000. Every quote is line-item — refrigerant line set, condenser pad, electrical disconnect, labor — not a vague range. TopVolk pays a contract penalty for missed deadlines, which isn't standard in this trade."
  - title: "Hot Upstairs, Cold Downstairs — Ductwork Rebalancing and Smart Thermostat Zoning"
    description: "Split-level homes near Duwamish Hill Preserve built in the 1960s often run one thermostat for two floors, so the upstairs bakes while the basement stays 15 degrees colder all winter — classic single-zone ductwork fighting a two-story load. TopVolk rebalances the system by adding zoning dampers in the supply trunk and installing a Nest or ecobee thermostat per zone, sometimes two thermostats wired to one zone control board. Sealing leaky duct joints with mastic instead of cloth-backed tape alone can cut 15-20% of conditioned air loss in a crawlspace duct run. A zoning retrofit with two dampers and matched thermostats runs $2,800-$4,500. Furnaces and AC condensers in this climate typically last 15-18 years; ductless mini-split compressors from Mitsubishi or Daikin often outlast that if the filters get cleaned twice a year."

