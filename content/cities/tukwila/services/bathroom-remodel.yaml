title: "Tukwila Bathroom Remodel — Gutting the Builder Bath in 98168"

intro: |
  Southcenter draws shoppers from half of King County, but the neighborhoods a mile west — Foster Road, Riverton, the streets feeding off Tukwila Pkwy — are full of 1960s and early-70s ranchers built for Boeing-area workers. Those bathrooms got fiberglass surrounds, builder-grade Moen pressure-balance valves, and 4x4 ceramic tile over drywall — no cement board, no waterproofing membrane, just tile adhesive and optimism. Forty years of Pacific Northwest moisture have made that optimism expensive.

localContext: |
  The 98168 zip covers the bulk of Tukwila's residential stock — ranchers and split-levels built between 1962 and 1985, mostly slab-on-grade or crawlspace foundations. The 98188 zip picks up the strip east of International Boulevard toward SeaTac, where the same housing era continues into Riverton Heights and the blocks flanking Tukwila Pkwy. Near the International Boulevard corridor and the Foster Golf Links area, you'll find the densest concentration of homes that were never updated past a coat of paint.

  Cascade neighborhood and the streets south of Southcenter Mall — Tukwila Village, Baker Boulevard, Andover Park — are split-level country. Homes here were built to mid-century Washington State code, which didn't require cement board behind tile, didn't mandate vapor barriers in crawlspaces, and sized bathrooms to fit a toilet, a pedestal sink, and a 5-foot tub with nothing left over. Cast-iron drain stacks are standard. Galvanized supply lines show up in anything pre-1975. The bathrooms in the Foster Road area near the Duwamish River greenway are particularly prone to moisture damage — low-lying lots, older crawlspace foundations, and north-facing exterior walls that never fully dry out between October and April.

  Permits for Tukwila remodels go through King County DPER for most residential addresses — not Seattle SDCI. That distinction matters for timeline. DPER plan review on a bathroom remodel typically runs 4-8 weeks. Some parcels inside Tukwila city limits pull permits through the City of Tukwila Building Division directly, so address verification is the first step before any demo starts.

commonProblems:
  - title: "Fiberglass Surrounds Glued Over Drywall — No Waterproof Substrate Behind Them"
    description: "Tukwila's 1960s-70s ranchers got fiberglass tub surrounds adhered directly to standard drywall — no cement board, no Schluter Kerdi, no RedGard. Grout lines fail at the tub lip, water wicks into the wall cavity, and you find rotted OSB or blackened studs once demo starts. Replacing the surround alone doesn't fix it — the substrate has to go too."
  - title: "Galvanized Supply Lines Corroding Behind the Tile"
    description: "Homes in the 98168 and 98188 zip codes built before 1975 typically ran galvanized steel supply lines. Interior rust builds up over decades, reducing flow pressure and discoloring water at the Kohler or Delta fixture. A bathroom remodel is the right time to repipe that section to PEX or copper — doing it after tile is set costs three times as much."
  - title: "Exhaust Fans Too Weak to Handle PNW Humidity"
    description: "Builder-grade exhaust fans rated at 50 CFM weren't adequate in 1972 and they're worse now with gasket seals dried out. PNW humidity — 37 inches of annual rain, damp winters from October through May — turns a weak fan into a mold incubation problem. Upgrading to a Broan or Panasonic unit rated at 110 CFM with a humidity sensor is standard on every remodel we run."

faq:
  - q: "How fast can you get to Tukwila for a bathroom remodel consultation?"
    a: "Tukwila is a straightforward pull from our King County routes — I-405 south or SR-99 through SeaTac, no ferry, no bridge wait. Call (206) 591-1096 and most consultations in the 98168 and 98188 area are scheduled within a week of first contact."
  - q: "Do you work with Moen, Kohler, and Delta fixtures in these older Tukwila homes?"
    a: "Yes — those three brands are exactly what's in most of this housing stock. Moen 1222 cartridges, Kohler pressure-balance valves, Delta Monitor series — we spec replacements or upgrades based on what's already roughed in, so you're not paying to relocate supply lines when you don't have to."
  - q: "What's the realistic timeline and cost for a full bathroom remodel in Tukwila?"
    a: "A master bath gut-and-rebuild — cement board substrate, Schluter Kerdi waterproofing, large-format porcelain tile, vanity swap, and fixture upgrade — runs 6-10 weeks and typically lands $30K-$60K depending on scope. King County DPER permit review adds 4-8 weeks upfront. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023, and missed-deadline penalties are written into every contract. Call (206) 591-1096 for a line-item quote specific to your layout."