title: "University Place Foundation Repair — Crawl Space to Seismic Retrofit"

intro: |
  Chambers Bay sits right at the water's edge along the Puget Sound in University Place,
  and the glacial outwash layered over clay that makes that 2015 US Open course so visually
  dramatic is the same geology making foundations unpredictable under residential streets a
  mile inland. In the 98466 zip code — Grandview, Cirque, the neighborhoods that spread east
  from the waterfront — the soil absorbs rainfall from October through May, expands, then
  dries and contracts through summer. That cycle, repeated over fifty-plus years, is what
  tilts post-and-pier supports out of plumb and opens diagonal cracks above door frames in
  ranch homes that were already old when Kurt Cobain was in middle school. Homes built
  between 1950 and 1980 dominate the University Place housing stock, and most of them were
  set on foundations without the drainage grades, anchor bolts, or vapor barriers that
  current IRC provisions require. Vladislav Volkov at TopVolk Construction has pulled permits
  through Pierce County PALS for foundation work across this area since 2023. A crack can
  be patched. What caused the crack needs a different conversation.

localContext: |
  University Place's residential core runs through the 98466 and 98467 zip codes, with
  the bulk of older housing concentrated west of 67th Avenue near the Cirque neighborhood
  and south toward the Chambers Bay corridor. Ranch homes and split-levels from the 1955
  to 1975 era are the most common foundation repair candidates — post-and-pier systems
  set on concrete piers without vapor barriers, crawlspaces that have been collecting
  condensation for decades, and stem walls poured with no positive drainage grade away
  from the footing. Pierce County's western residential soils are a mix of glacial till
  and clay-dominant fill that holds groundwater longer than you'd expect on a lot that
  looks perfectly flat from the street. The Puget Sound proximity also pushes seasonal
  water table elevation higher than inland areas, which means standing water in
  crawlspaces after heavy January rain is not unusual in University Place. Foundation
  work with structural scope — seismic retrofit, stem wall repair, any modification to
  the connection between foundation and framing — requires a building permit through
  Pierce County PALS, with plan review running 3 to 6 weeks depending on project
  complexity. Engineering drawings are required before PALS will issue a permit for
  seismic retrofit or major foundation repair.

commonProblems:
  - title: "Post-and-Pier Settling Under 1960s Ranch Floors in the Cirque Area"
    description: |
      A floor that bounces in the center of the room, doors that stick seasonally, gaps
      opening between baseboard and hardwood — these are the signatures of post-and-pier
      supports that have settled unevenly under decades of soil movement. Concrete piers
      installed in the 1960s were typically set without engineered bearing depth, which
      means they compress at different rates depending on what each one is bearing on.
      The repair involves sistering deflected floor joists where they've sagged, then
      re-leveling supports using steel adjustable pier systems or replacing deteriorated
      wood posts with PSL posts set on new concrete pads. Crawlspace clearance in most
      University Place ranchers is tight — often 18 to 24 inches — so this is slow,
      physical work. A full crawlspace re-leveling covering 10 to 15 pier locations
      typically runs $9,000 to $22,000 and takes 4 to 6 days on site.

  - title: "Stem Wall Cracking from Hydrostatic Pressure and Clay Soil Expansion"
    description: |
      Diagonal cracks running down from window corners and horizontal cracks mid-height
      on a concrete stem wall are the two patterns that signal soil pressure is exceeding
      what the wall was designed to handle. In University Place's 98466 neighborhoods,
      lots graded flat during 1970s subdivision development often lack drainage swales,
      so rainwater pools against the foundation through the wet season. Epoxy injection
      using Simpson Strong-Tie SET-3G low-viscosity adhesive restores compressive
      strength and stops moisture infiltration through narrow cracks. Horizontal cracks
      or walls showing inward bow need carbon fiber strap reinforcement — CarbonArmor
      or equivalent — installed across the damaged section to prevent further deflection.
      Crack repair scopes run 1 to 3 days and cost $1,800 to $5,500 depending on crack
      count and whether carbon fiber strapping is needed. Left alone through another wet
      season, active horizontal cracks allow enough moisture into the rim joist and sill
      plate framing to cause rot within 2 to 3 years.

  - title: "Seismic Retrofit — Mudsill Bolting and Shear Wall Installation"
    description: |
      Pierce County sits in a Cascadia Subduction Zone risk area, and University Place
      homes built before 1980 almost universally lack the mudsill anchor bolts and
      cripple wall shear plywood required under current IRC seismic provisions. A
      standard retrofit means installing 1/2-inch Hilti HIT-RE 500 epoxy anchor bolts
      at 4-foot intervals into the existing concrete foundation, then nailing 15/32-inch
      structural plywood shear panels between the mudsill and the first-floor diaphragm.
      Pierce County PALS requires stamped structural engineering drawings before issuing
      a permit for this scope — budget $1,400 to $2,800 for engineering, and PALS plan
      review adds another 3 to 5 weeks. TopVolk Construction is WA Licensed for general
      contracting and manages the PALS submission, engineering coordination, and
      inspection scheduling on your behalf. Total retrofit cost for a typical University
      Place single-story rancher with a full crawlspace perimeter runs $7,000 to
      $15,000 depending on linear footage and cripple wall height.

  - title: "Crawlspace Drainage and Sump Pump Installation for High Water Table Lots"
    description: |
      Standing water in the crawlspace after a heavy January rain is a foundation problem,
      not a maintenance nuisance. White calcium deposits (efflorescence) creeping up the
      inside face of a stem wall mean water is already pushing through the concrete under
      hydrostatic pressure. The fix is a French drain trench running the interior crawlspace
      perimeter, pitched to a sump basin with a Zoeller M53 submersible pump — a proven
      unit that handles the continuous-duty cycling that wet Pierce County winters demand.
      Vapor barrier replacement using Stego Wrap 15-mil reinforced poly ties into the
      drainage system and replaces the builder-grade 6-mil sheet that was standard in 1970s
      construction and has likely degraded completely by now. A full crawlspace drainage
      and pump installation for a typical University Place rancher footprint runs $5,000
      to $10,000. That drainage work protects any framing repair or re-leveling done
      upstream — without it, re-settlement starts the next wet season.

  - title: "Recognizing When Repair Stops Making Sense vs. Foundation Replacement"
    description: |
      Epoxy injection and post shimming hold until they don't. If floor deflection
      across a 10-foot span exceeds 1 inch, or if a stem wall is actively bowing inward
      with multiple horizontal cracks, repair costs can climb past what partial replacement
      would cost — and replacement leaves you with a code-compliant engineered foundation
      instead of a patched one. Full perimeter foundation replacement — demo existing
      concrete, excavate, pour continuous footing with rebar per IRC Table R403.1, set
      anchor bolts, waterproofing — runs $40,000 to $95,000 for a typical University
      Place single-story home. That number is worth knowing before authorizing a $15,000
      repair on a system that may need replacing in 5 years anyway. Vladislav goes through
      this honestly during the on-site visit — no upsell pressure, no vague
      recommendations. If repair is the right call structurally, that's what gets quoted
      with a line-item breakdown and a written deadline commitment backed by a contract
      penalty clause.

faq:
  - q: "How fast can you get to University Place for a foundation repair consultation?"
    a: |
      University Place is roughly 35 to 40 miles south of Seattle via I-5 through Tacoma
      and the SR-16 interchange — typically 50 to 70 minutes depending on Tacoma Narrows
      Bridge congestion. On-site consultations are scheduled within 3 to 7 business days
      of first contact. Vladislav does the consultation himself — not a commissioned closer
      — so you're getting an actual contractor reading your crawlspace, not a salesperson
      giving you a range. Permit submission through Pierce County PALS goes in after the
      design phase, with plan review adding 3 to 6 weeks for structural scopes. Call
      (206) 591-1096 to check current availability and get on the schedule.

  - q: "What does foundation repair typically cost in University Place?"
    a: |
      Scope is the main variable. Epoxy crack injection on a stem wall runs $1,800 to
      $5,500 depending on crack length, wall access, and whether carbon fiber strapping
      is needed. Post-and-pier re-leveling for a full crawlspace runs $9,000 to $22,000.
      Seismic retrofit with mudsill bolting and shear wall plywood typically lands at
      $7,000 to $15,000 plus $1,400 to $2,800 for the structural engineering drawings
      Pierce County PALS requires. Crawlspace drainage with a Zoeller sump pump adds
      $5,000 to $10,000. TopVolk provides a line-item written quote after the on-site
      visit — no vague ranges, no contingency padding. Call (206) 591-1096 or schedule
      a free on-site estimate to get actual numbers for your specific foundation.

  - q: "Do I need a permit for foundation repair work in University Place?"
    a: |
      It depends on what's being done. Epoxy crack injection and minor shimming typically
      fall below the permit threshold. Seismic retrofit — mudsill anchor bolts, shear wall
      plywood, any structural modification at the foundation-to-framing connection — requires
      a building permit through Pierce County PALS, and PALS requires stamped engineering
      drawings before issuing that permit. Foundation replacement or major drainage work
      also triggers permit requirements. TopVolk Construction is WA Licensed for general
      contracting and handles the PALS application, engineering coordination, and rough-in
      and final inspection scheduling as part of the project scope. Permit fees are included
      in the quoted price — no billing surprises mid-project.

  - q: "Can you handle seismic retrofits alongside foundation crack repair?"
    a: |
      Yes — and in University Place's pre-1980 rancher stock, those two scopes often come
      up together. Homes in the Grandview and Cirque neighborhoods built before 1980
      typically have neither the mudsill anchor bolts nor the cripple wall shear plywood
      that current IRC seismic provisions require. When the crawlspace is already open for
      post re-leveling or drainage work, assessing the mudsill connection costs almost
      nothing extra. Seismic retrofit scope includes Hilti HIT-RE 500 epoxy anchor bolt
      installation into existing concrete, Simpson Strong-Tie joist blocking, and structural
      plywood shear panel nailing per the engineer's layout. Pierce County PALS requires
      stamped drawings for this work — we coordinate a licensed structural engineer and
      include that timeline in the project schedule from the start.

  - q: "How long does foundation repair last, and what does the work warranty cover?"
    a: |
      Epoxy-injected cracks on a stabilized foundation, done correctly, are permanent —
      the cured adhesive is stronger than the surrounding concrete. Post-and-pier re-leveling
      with steel adjustable pier systems carries a three-year workmanship warranty through
      TopVolk, plus the hardware manufacturer's warranty on the pier components. Seismic
      retrofit connections are engineered to current code and won't need revisiting absent
      a major seismic event. The thing that voids repair warranties faster than anything
      else is unresolved drainage — if groundwater is still saturating crawlspace soil
      after the repair, re-settlement follows. That's why TopVolk scopes drainage and
      site grading as part of every foundation project. Deadline commitments are written
      into the contract with penalty clauses — not verbal assurances.

  - q: "Do you cover Tacoma and Lakewood, or just University Place?"
    a: |
      TopVolk covers the full Pierce County area — Tacoma, Lakewood, Puyallup, Gig
