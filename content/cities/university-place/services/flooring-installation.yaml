title: "University Place Flooring Installation — Subfloor Moisture Starts Here"

intro: |
  Original fir strip flooring from the 1950s still runs through living rooms across University
  Place's 98466 zip code. Walk through a home near Curran Apple Orchard Park built in that
  era and you'll likely find 2-1/4 inch oak or Douglas-fir strip under the carpet — sometimes
  in surprisingly good shape, sometimes buckled from years of crawlspace moisture working up
  through an aging vapor barrier. Before any board gets pulled or new material gets selected,
  TopVolk reads the subfloor: moisture content with a Delmhorst pin meter, flatness within
  3/16 inch over 10 feet, and whether anything under those older vinyl tiles requires a
  licensed abatement sub rather than a standard demo crew. The marine air off Puget Sound
  and Chambers Bay keeps humidity elevated from October into May, and the mix of crawlspace
  foundations in 98466 and slab-on-grade construction in 98467 means no two flooring projects
  here start the same way. Vladislav Volkov has been doing this work since 2017 across King,
  Pierce, and Snohomish counties, and the subfloor condition almost always shapes the material
  conversation before price ever comes up.

localContext: |
  University Place divides roughly between the older residential streets in 98466 — homes
  built from the mid-1950s through the 1970s along Drexler Drive and Cirque Drive that often
  still carry original oak strip or vinyl composition tile — and the more recent construction
  in 98467 near the Chambers Creek watershed, which includes slab-on-grade homes from the
  1990s and early 2000s. The 1960s housing stock comes with 9×9 and 12×12 floor tiles in
  kitchens and utility rooms that frequently contain asbestos, requiring licensed abatement
  before any flooring demo rather than grinding them down and floating new material over the
  top. Pierce County PALS does not typically require a permit for standard flooring
  replacement, but structural subfloor repairs — sistering joists or replacing rim joist
  sections — can trigger a building permit through the City of University Place's building
  department. The Narrows waterfront and Pierce County's roughly 45 inches of annual rainfall
  mean underlayment selection and vapor barrier details carry more weight here than they would
  in a drier eastern Washington market.

commonProblems:
  - title: "High Subfloor Moisture Destroying Hardwood in 1960s Slab Homes"
    description: |
      Concrete slabs in University Place's 1960s and 1970s homes frequently test at moisture
      levels that disqualify solid hardwood installation under most manufacturer warranty terms.
      TopVolk runs a calcium chloride test per ASTM F1869 — a closed 72-hour test that gives
      a real number, not a quick-pin reading that can miss pockets of vapor drive. Results
      above 3 lbs per 1,000 sq ft per 24 hours push the project toward engineered hardwood
      with a minimum 9-ply core, or a quality LVP product like COREtec Plus. Even then,
      the hardwood acclimation period matters — 4 to 7 days in the conditioned space, stacked
      with spacers, with the HVAC running at normal living conditions. A MAPEI moisture barrier
      membrane applied over the slab before installation adds $1.50–$2.00 per sq ft but
      prevents a full replacement callback. Skipping that step to save a few hundred dollars
      upfront routinely costs homeowners $6,000–$12,000 in replacement costs within 18 months.

  - title: "Vinyl Asbestos Tile Under Pre-1980 University Place Kitchen Floors"
    description: |
      The 9×9 and 12×12 floor tiles found in University Place kitchens and utility rooms built
      before 1980 are frequently VAT — vinyl asbestos tile. The tiles may be stable if intact,
      but cutting, sanding, or grinding them releases asbestos fibers. Washington State WAC
      296-62-07721 requires licensed asbestos abatement before demolition, and floating new
      flooring directly over untested tile does not meet state code. TopVolk coordinates with
      a licensed abatement subcontractor before any demo in pre-1980 homes on Cirque Drive
      and similar vintage streets in 98466. Abatement typically adds $800–$2,500 to the
      project scope depending on square footage and tile condition. Some homeowners opt to
      encapsulate rather than remove — installing a DriCore subfloor system over intact,
      non-friable VAT is legal and avoids full abatement costs — but that decision requires
      an on-site assessment of tile condition, not an assumption made from a photo.

  - title: "Matching 2-1/4 Inch Oak Strip in Post-War University Place Homes"
    description: |
      Post-war homes near Curran Apple Orchard Park in the 98466 zip code frequently carry
      original 2-1/4 inch red or white oak strip flooring installed in the 1950s or 1960s.
      Adding a room, converting a garage, or repairing a section means matching that strip
      width — and standard stock at most local lumber yards runs 3-1/4 inch or wider. The
      2-1/4 inch profile still exists but requires sourcing through specialty hardwood
      distributors in the South Sound area, with lead times of 2–4 weeks. Beyond width,
      finish matching matters: a worn, oil-penetrating patina on a 60-year-old floor looks
      nothing like fresh polyurethane applied to new material. TopVolk sands a test section
      of the existing floor before quoting to evaluate species, grade, and stain receptiveness,
      then builds a 10–15% waste factor into the material order for layout cuts. Vladislav
      handles this coordination directly — no project manager in between.

  - title: "Engineered vs. Solid Hardwood on Slab-On-Grade in 98467 Homes"
    description: |
      Slab-on-grade construction in University Place's 1990s and 2000s homes — particularly
      those in the 98467 area near Chambers Creek — creates a genuine choice between engineered
      and solid hardwood. Solid 3/4-inch hardwood cannot be glued or floated over concrete
      without significant moisture risk; it requires nailing or stapling into a wood subfloor
      that most of these homes do not have. Engineered hardwood with a 9-ply or 11-ply core
      handles concrete-level moisture far better and can be glued down with a moisture-cured
      urethane adhesive like Bostik's Best. The trade-off is refinishing depth — most
      engineered products carry a 2mm–4mm wear layer, allowing one or two sandings before
      you are into the plywood core. Kahrs and Shaw both produce engineered lines with a
      3mm-plus wear layer that hold up well under PNW humidity swings. Installed cost runs
      $11–$22 per sq ft for mid-grade engineered on a prepped concrete slab, versus $14–$20
      per sq ft for solid hardwood over an existing wood subfloor.

  - title: "Underlayment Selection for Sound and Moisture in University Place Remodels"
    description: |
      LVP has become the most common flooring choice in University Place remodels, and
      underlayment selection matters more than most homeowners expect going in. Many LVP
      products ship with a thin factory-attached pad, but those pads rarely meet the IIC 50
      or STC 50 sound ratings that some HOA communities in the 98466 area require. Roberts
      Super Felt or QuietWalk Plus provides meaningful impact noise reduction on both concrete
      and wood subfloor installations. In homes over a crawlspace — common on the older
      streets near Drexler Drive — a 6-mil poly vapor barrier stapled to the joists below,
      combined with a separate 2mm closed-cell foam underlayment, handles both moisture drive
      and airborne sound. Skipping the vapor barrier under LVP in a crawlspace home is the
      most frequent cause of mold developing beneath the planks within two to three years of
      installation. TopVolk specs the underlayment system based on actual subfloor conditions,
      not a default upsell applied to every job.

faq:
  - q: "How fast can you get to University Place for a flooring estimate?"
    a: |
      University Place sits roughly 45 minutes from TopVolk's Seattle-area base via I-5 South
      — closer during off-peak hours when the Tacoma Narrows interchange moves freely. Vladislav
      can typically reach a University Place property for an on-site estimate within 3–5 business
      days of your call. Most residential streets along Cirque Drive and Drexler Drive have
      straightforward truck and trailer access, with driveway clearance for material delivery.
      From estimate to project start, expect 1–2 weeks for material lead time on standard LVP,
      or 2–4 weeks if you are sourcing specialty hardwood or waiting on engineered stock. Call
      (206) 591-1096 — you will speak directly with Vladislav, not a receptionist or sales
      coordinator.

  - q: "What does hardwood flooring installation cost in University Place?"
    a: |
      Labor for nail-down hardwood over existing plywood subfloor runs $6–$10 per sq ft in
      University Place, not including material. Add mid-grade engineered hardwood (Kahrs or
      Shaw) at $5–$12 per sq ft and most projects land between $11–$22 per sq ft installed.
      Slab prep and MAPEI moisture barrier membrane add $800–$1,500 to the scope on
      concrete-slab installations. LVP installs run less: $4–$7 per sq ft labor plus $3–$6
      per sq ft for mid-range products like COREtec. TopVolk provides a line-item quote after
      the on-site visit — specific numbers broken out by scope item, not a per-sq-ft range
      that shifts at invoice. Call (206) 591-1096 to schedule a free on-site estimate.

  - q: "Does flooring installation in University Place require a permit?"
    a: |
      Standard flooring replacement — LVP, hardwood, or tile — does not require a permit
      through the City of University Place or Pierce County PALS in most situations. The
      exceptions involve structural subfloor work: sistering joists, replacing rim joist
      sections, or repairing beam damage all typically require a building permit. Bathroom
      tile projects that include a full waterproofing system replacement — such as a Schluter
      Kerdi membrane installation — may also carry permit requirements when part of a larger
      remodel scope. TopVolk is a WA Licensed Contractor and handles permit identification
      and application when the scope triggers it. Deadline penalty terms are written into
      every contract, so permit timelines get managed as part of the project schedule, not
      passed off to the homeowner to track.

  - q: "How do you handle hardwood acclimation in University Place's wet climate?"
    a: |
      Most solid hardwood manufacturers require 4–7 days of acclimation in the conditioned
      living space before installation in Western Washington. University Place sits close to
      Puget Sound, and indoor relative humidity can run 55–65% from October through May
      without active humidity control running. Wood gets delivered, stacked with spacers
      between bundles, and sits while the HVAC holds the house at normal living conditions —
      65–70°F, 35–55% RH. Vladislav reads each bundle's moisture content with a Delmhorst
      pin-type meter on delivery day and again immediately before nailing begins. If the
      numbers are still shifting, the installation date moves rather than forcing boards
      down prematurely. Rushing that acclimation window is the single most common cause of
      cupped hardwood floors in PNW installations.

  - q: "What warranty applies to flooring work TopVolk installs?"
    a: |
      Material warranties come from the manufacturer — COREtec and Shaw carry 15–25 year
      residential wear-layer warranties on their LVP lines, and Kahrs engineered hardwood
      carries a 25-year finish warranty. TopVolk warranties installation workmanship
      separately: if a floor failure ties back to fastener pattern, adhesive failure, or
      transition strip work, TopVolk returns and corrects it. Manufacturer defect claims go
      through TopVolk as the installing contractor — homeowners do not navigate that process
      alone. Every contract also includes a written deadline penalty clause: if TopVolk
      misses the agreed completion date, financial penalties apply. That is documented in
      the contract, not offered as a verbal assurance. TopVolk has completed 100+ projects
      since 2017 without needing to hide behind fine print.

  - q: "Do you cover Tacoma and other Pierce County cities near University Place?"
    a: |
      Yes — TopVolk serves Tacoma, Gig Harbor, Puyallup, Lakewood, and unincorporated Pierce
      County areas under PALS jurisdiction, in addition to University Place. Jobs in University
      Place and Tacoma typically get scheduled in the same work block given the short drive
      between them — no travel surcharge applies to either location. Current scheduling lead
      time for Pierce County projects runs 1–3 weeks depending on project size and material
      availability. TopVolk also maintains active service areas across King, Snohomish, and
      Kitsap counties, so if you hold properties in multiple counties, one contractor handles
      all of them. Call (206) 591-1096 to check current availability and set up a free
      on-site estimate anywhere in the South Sound area.