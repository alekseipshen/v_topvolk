title: "University Place Bathroom Remodel — 1960s Ranch Homes Rebuilt Right"

intro: |
  Split-levels and ranchers lining the bluffs above Chambers Bay in 98466 went up between 1965 and 1982 — and the bathrooms haven't changed much since. Single-handle Moen faucets with worn cartridges, fiberglass surrounds that have yellowed and cracked, exhaust fans spinning at 40 CFM on a good day. University Place gets Pierce County's full measure of wet winters, and those old surrounds let moisture in quietly. Remodeling here isn't cosmetic — it's damage control with a design upgrade.

localContext: |
  The 98466 zip covers most of University Place's residential core — 1960s and '70s ranchers between Cirque Drive and Grandview Drive West, many with original cast-iron tubs and single-wall fiberglass surrounds. In 98467, late-'80s and early-'90s builder homes dominate: updated kitchens, but bathrooms that still have original vanity strips and 4-inch tile. Both zip codes fall under University Place's own building permit office — separate from Pierce County PALS — so plan review runs through the city directly.

commonProblems:
  - title: "Failed Waterproofing Behind 1970s Tile — Saturated Shower Walls"
    description: |
      Homes in 98466 built before 1980 typically used wet-set mortar beds behind shower tile — that technique worked in 1974, but the mortar has since cracked and the waterproofing layer failed long ago. Schluter Kerdi membrane or RedGard coating over new cement board is the correct repair, not another layer of tile over a wet substrate. Skipping this step means demoing the same shower again in five years.
  - title: "Cast-Iron Drain Stack Conflicts During Master Bath Reconfigurations"
    description: |
      Most University Place ranchers route a single cast-iron drain stack through one interior wall, with every bathroom drain in the house tied into it. Moving a shower drain or shifting a toilet footprint during a layout reconfiguration means cutting into that stack at rough-in. Kohler and American Standard fixtures won't save a remodel where the drain slope or venting is wrong — plumbing geometry comes first.
  - title: "Undersized Exhaust Fans Turning PNW Humidity Into Mold"
    description: |
      The 50 CFM fan installed in a 1986 builder bath was undersized from the start. University Place sits close enough to Puget Sound that indoor humidity stays elevated October through April — and north-facing bathroom walls show it first. Upgrading to a minimum 110 CFM unit — Panasonic WhisperCeiling or Broan are reliable choices — plus verifying the duct exits the building envelope (not just the attic) actually solves the mold problem.

faq:
  - q: "How fast can you get to University Place for Bathroom Remodel?"
    a: |
      University Place is 35-40 minutes south of Seattle on I-5 to Highway 16. Vladislav — WA Licensed Contractor, 100+ projects completed since 2017 — does the on-site consult himself, not a salesperson. Call (206) 591-1096 to check current availability and schedule directly.
  - q: "What plumbing fixture brands do you work with on University Place bathroom remodels?"
    a: |
      Most homes in 98466 and 98467 have Moen or Kohler fixtures — sometimes original Delta pressure-balance valves from the '80s still in the wall. For new shower builds we typically spec Moen Posi-Temp or Kohler Rite-Temp valves. Vanity faucets, toilets, and tub fillers from Moen, Kohler, or Delta are all workable — no exclusions.
  - q: "How long does a bathroom remodel take, and what's the permit process in University Place?"
    a: |
      A full master bath — demo through blue tape walkthrough — typically runs 5-8 weeks. University Place issues its own building permits separate from Pierce County PALS; plan review adds 3-5 weeks before demo starts. Missed deadlines carry a written penalty in the contract. Vladislav's schedule books 4-6 weeks out spring through summer — call (206) 591-1096 early.