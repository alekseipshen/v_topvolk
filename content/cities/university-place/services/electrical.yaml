      calendar. TopVolk is a WA Licensed Contractor covering all of Pierce County.

  - q: "What does a 200-amp panel upgrade cost in University Place?"
    a: |
      A 200A panel replacement in University Place runs $3,500–$6,500 installed.
      Service entrance condition is the biggest variable — if existing conduit and
      meter base are in good shape, you're toward the lower end. Add aluminum
      wiring remediation throughout the house, or a subpanel for a detached garage,
      and costs climb accordingly. The Pierce County PALS permit, PSE meter pull
      coordination, and both required inspections are included in our scope. No
      range estimates: TopVolk provides a fixed quote before work starts, with
      deadline penalties written into the contract if we miss the agreed completion
      date.

  - q: "Do I need a permit for electrical work in University Place, and who handles it?"
    a: |
      Almost all electrical work beyond basic device swaps requires a permit in
      University Place. Pierce County PALS processes applications online — plan
      review for a panel upgrade or new EV charger circuit runs about 2–4 weeks.
      After permit issuance, PSE needs 5–10 business days advance notice to pull
      the meter. Two inspections follow: rough-in before walls close, then final
      after all cover plates and fixtures are installed. As a WA Licensed
      Contractor, TopVolk pulls the permit directly — we file the application,
      schedule inspections, and coordinate the PSE pull. You don't chase
      paperwork. That's part of the job scope.

  - q: "Can you install a Level 2 EV charger circuit in my University Place garage?"
    a: |
      Yes — it's one of the more frequent scopes in Pierce County right now. The
      process starts with a load calculation to confirm panel capacity. If your
      service can absorb the draw, we run a dedicated 50A or 60A circuit to the
      garage and install the outlet or hardwire the unit. JuiceBox 48 and
      ChargePoint Home Flex both need a 50A circuit; the Tesla Wall Connector
      can run on 60A for faster charge rates. If your panel is a maxed-out 100A
      Federal Pacific or similar, we scope the panel upgrade at the same time to
      handle both in one permit. Call (206) 591-1096 — Vladislav walks through
      the load numbers with you during the site visit before any work is quoted.

  - q: "What warranty does TopVolk provide on electrical work in University Place?"
    a: |
      Workmanship carries a 2-year warranty — if something we wired fails due to
      an installation error, we come back and fix it. Equipment warranties depend
      on the manufacturer: Square D and Eaton panels carry 1–5 year limited
      warranties on the hardware. EV charger units like JuiceBox and ChargePoint
      Home Flex include 3-year manufacturer warranties registered in your name.
      More practically: Vladislav is the one on the job, so a callback means
      calling the same person who did the work. That direct accountability tends
      to matter more than warranty fine print when something comes up two years
      later.

