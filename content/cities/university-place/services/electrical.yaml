title: "University Place Electrical — Panel Upgrades & EV Circuits"

intro: |
  Chambers Bay sits about a mile west of University Place's oldest residential
  streets — and the ranchers and split-levels built in the 1960s along Grandview
  Drive W and 40th Street W are generating most of the electrical calls in 98466
  right now. PSE (Puget Sound Energy) serves both zip codes here, so a panel swap
  or new circuit means coordinating a PSE meter pull — not Seattle City Light.
  Most of these homes came stock with 100-amp Federal Pacific Stab-Lok panels,
  which insurance carriers increasingly flag and which simply can't carry a modern
  load: heat pump, EV charger, induction range, all at once. Installing a JuiceBox
  48 EV charger on a saturated 100A panel isn't just inconvenient — it creates real
  arc-fault risk. TopVolk Construction LLC handles the full scope: permit filing
  with Pierce County PALS, PSE coordination, panel replacement, and circuit
  rough-in, with Vladislav Volkov on the job directly. 100+ projects completed
  since 2023 across King, Pierce, Snohomish, and Kitsap counties.

localContext: |
  University Place's housing stock breaks into two main eras. Zip code 98466
  holds a large share of post-war and early 1960s construction — single-story
  ranchers and modest split-levels near Curran Apple Orchard Park and the Cirque
  neighborhood. These homes frequently have original 100-amp service with
  ungrounded two-prong outlets and the occasional knob-and-tube remnant tucked
  behind insulated walls. Zip code 98467 covers newer development closer to the
  Bridgeport area and some 1980s–90s tract builds — better service capacity but
  often with builder-grade panels aging toward the end of their useful life. The
  1965–1973 window is especially relevant here: homes built during that stretch
  commonly have aluminum branch circuit wiring, which requires AlumiConn
  connectors or copper pigtailing at every device termination. Pierce County PALS
  handles all permit applications in University Place — the city contracts out
  its permitting, so there's no separate city building counter. Plan review for
  a panel upgrade typically runs 2–4 weeks. PSE requires advance scheduling for
  meter pulls, so timeline planning matters from day one.

commonProblems:
  - title: "100A Federal Pacific or Zinsco Panel — Can't Support Modern Electrical Loads"
    description: |
      Federal Pacific Stab-Lok breakers have a documented failure-to-trip problem —
      they don't always open under overcurrent conditions, which is the entire job
      of a breaker. Zinsco panels have a related bus bar corrosion issue that causes
      breakers to weld to the bus and fail to interrupt faults. Both show up in
      University Place homes built between 1955 and 1975, concentrated in the 98466
      zip. The fix is a full panel replacement: typically a 200A Square D QO or
      Eaton CH series load center, new service entrance conductors, and an updated
      grounding electrode system per NEC 250. A 200A upgrade also requires a PSE
      meter pull, which adds scheduling lead time — plan 4–6 weeks from permit
      submission to Pierce County PALS final inspection. Straight panel swap cost
      runs $3,500–$6,500 depending on service entrance configuration and interior
      circuit condition.

  - title: "Aluminum Branch Circuit Wiring in University Place's 1965–1973 Builds"
    description: |
      Aluminum was used for residential branch circuits during a copper shortage
      from roughly 1965 to 1973. It's not inherently dangerous if the connections
      are maintained — but aluminum expands and contracts differently than copper,
      and over fifty years, terminations at outlets and switches loosen. That's
      where overheating starts. In University Place homes near the Grandview area
      built during those years, proper remediation means AlumiConn push-in
      connectors or CO/ALR-rated devices at every single termination point.
      A full assessment involves opening every outlet box, checking for oxidation
      (the gray-to-white discoloration on aluminum conductors), and re-terminating
      with anti-oxidant compound. Noalox alone on old connections isn't a fix —
      every device needs correct CO/ALR rating or a copper pigtail. This work
      requires an electrical permit in Pierce County. Budget $1,500–$4,000
      depending on circuit count and house footprint.

  - title: "EV Charger Circuit Installation — Dedicated 50A or 60A Run From Panel"
    description: |
      A Level 2 EV charger — JuiceBox 48, ChargePoint Home Flex, or Tesla Wall
      Connector — needs a dedicated 50A or 60A circuit from the panel to the
      garage. On a 100A panel already serving a heat pump and an electric range,
      that circuit likely doesn't fit without a panel upgrade first. Load
      calculation per NEC 220 determines whether existing service capacity can
      absorb the additional draw. If the panel has headroom, the rough-in involves
      running 6 AWG or 4 AWG copper to the garage, installing a flush-mount outlet
      or hardwiring the unit, and filing for an electrical permit with Pierce County
      PALS — two inspections required: rough-in before walls close, then final.
      Total installed cost for a charger circuit on an existing 200A panel runs
      $800–$1,800 depending on run length and conduit requirements. Call
      (206) 591-1096 — Vladislav comes out, runs the load numbers, and gives you
      a fixed quote before any work starts.

  - title: "AFCI and GFCI Breaker Upgrades Triggered by Renovation Permits"
    description: |
      Pull a kitchen or bathroom permit in Pierce County and the inspector will
      expect current NEC compliance on every circuit touched during the work.
      That means AFCI protection for bedroom circuits and GFCI protection for
      bathrooms, kitchens, garages, and exterior outlets — per NEC 2020, which
      Pierce County has adopted. On older University Place homes in 98466, this
      surfaces during a kitchen remodel when the inspector flags that existing
      circuits lack AFCI breakers. Square D QO AFCI/GFCI combination breakers
      run $50–$80 each; Eaton CH series are in the same range. A typical kitchen
      or bath permit scope involves 4–8 breakers. Tracing circuits in a 1960s
      home with unlabeled panels takes time — factor that into the schedule.
      Budget $400–$1,200 for AFCI/GFCI compliance work tied to a renovation
      permit, separate from the primary remodel cost.

  - title: "LED Recessed Lighting Retrofit and Dimmer Compatibility Problems"
    description: |
      Swapping out incandescent can lights for LED retrofit kits sounds
      straightforward — and it mostly is, until the dimmer starts flickering or
      buzzing. Many University Place homes in the Bridgeport area have Lutron or
      Leviton dimmers wired for incandescent loads. LEDs require a dimmer rated
      for LED minimum load; mismatched combinations cause visible flicker,
      audible buzz from the fixture, or early LED failure. The right fix: Lutron
      Caséta or Leviton Decora Smart dimmers, which handle LED loads down to
      near-zero minimum. Retrofit IC-rated LED wafers like the Halo LT series drop
      directly into existing can housings — no new housing cut required in most
      cases. Each fixture takes 20–30 minutes when wiring is accessible. For a
      whole-house refresh across 20–30 fixtures including new dimmers, budget
      $1,500–$3,500 installed.

faq:
  - q: "How fast can you get to University Place for an electrical estimate?"
    a: |
      University Place is right off SR-16 and I-5 — from our regular project areas
      in King and Pierce counties, that's usually 30–45 minutes depending on Tacoma
      traffic near the Nalley Valley interchange. Street parking is easy on
      residential blocks near Chambers Creek Regional Park and throughout the Cirque
