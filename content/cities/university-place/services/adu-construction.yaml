title: "University Place ADU Construction — HB 1337 Unlocks Pierce County Lots"

intro: |
  Chambers Bay Golf Course put University Place on the national map in 2015, but the
  residential blocks climbing the bluff above it — Cirque Drive, Grandview Drive W,
  the grid of streets running inland from the Puget Sound shoreline — have been quiet
  single-family territory for decades. Most of those lots in 98466 were built out
  between 1960 and 1985: split-levels, two-story colonials, ranchers with attached
  garages and modest backyards. WA HB 1337, signed into law in 2024, opened every
  one of them up to a second dwelling unit — or two. University Place runs its own
  permit process through the city's Community Development department, separate from
  Pierce County PALS, which means timelines and code requirements differ from
  unincorporated areas just a few miles east. TopVolk Construction LLC has completed
  ADU projects across Pierce, King, and Snohomish counties since 2023. Vladislav
  Volkov handles every project directly — no sales staff, no middlemen. Call
  (206) 591-1096 to walk through what your specific lot in University Place actually
  allows.

localContext: |
  The bulk of University Place falls within 98466, with the southern edge near
  Chambers Creek Road picking up 98467. Lots in the Cirque neighborhood run
  7,500–10,000 square feet on average — enough room for a backyard DADU once you
  account for the required setbacks (typically 5 feet rear, 5 feet side in UP's
  R-1 zones) and any existing detached garage or shed eating into available
  footprint. The bluff lots above Chambers Bay add a slope variable that flat
  inland lots don't have: steep grades force pier-and-grade-beam foundations
  instead of slab-on-grade, which adds cost and structural engineering time.
  Homes built in the 1965–1975 window — and there are many in the Bridgeport Way W
  corridor — often have 100-amp electrical service and galvanized supply plumbing,
  both of which need to be evaluated before adding a second dwelling unit. Pierce
  County gets 38–40 inches of rain annually, concentrated October through April,
  and any ADU built at or near grade needs a crawlspace vapor barrier as a baseline
  — not an upgrade. That's code in Washington State, and it's the kind of detail
  that gets missed when a homeowner tries to manage the project without a licensed
  general contractor involved from the start.

commonProblems:
  - title: "DADU vs. Attached ADU vs. Basement Conversion: Which Path Fits Your Lot"
    description: |
      University Place lots in 98466 generally give you three options: a detached ADU
      in the backyard, an attached addition, or a basement conversion if the existing
      foundation allows 7-foot minimum ceiling height per IRC requirements. Basement
      AADUs avoid the foundation and roofing costs of new construction — total project
      cost typically $85,000–$140,000 — but require egress window installation (minimum
      5.7 sq ft net clear opening per code), waterproofing with a membrane system like
      DELTA-MS drainage board, and a full mechanical rough-in. A detached DADU in
      University Place runs $150,000–$225,000 depending on size, foundation type, and
      finish level. The decision often comes down to what the lot physically allows after
      setback, lot coverage, and FAR calculations are applied. TopVolk has completed 100+
      projects since 2023 across the Seattle metro — Vladislav can run those numbers on
      your parcel during the free on-site consultation. Call (206) 591-1096.

  - title: "Utility Connections: Separate Meter vs. Shared Service for Pierce County ADUs"
    description: |
      Homeowners in the Chambers Creek and Cirque areas frequently underestimate utility
      connection costs. University Place's building department may require a separate water
      meter for a DADU — confirm the current threshold during plan review, as it depends on
      unit size and the city's current policy cycle. Electrical is the bigger issue: a
      100-amp panel serving a 1970s rancher cannot support a new 200-amp sub-panel for a
      detached ADU without a main service upgrade through Tacoma Public Utilities, which
      adds 4–6 weeks and $4,500–$9,000 before framing starts. Sewer laterals from a
      backyard DADU to the street main in 98466 typically run $6,000–$14,000 depending on
      distance and soil composition. These aren't contingency numbers — they're baseline
      costs that need to be in the budget before permit submittal. A contractor who gives
      you a DADU price without asking about utility conditions isn't quoting the real job.

  - title: "Permit Routing: University Place Building Dept vs. Pierce County PALS"
    description: |
      University Place is an incorporated city, so ADU permits go through the city's own
      Community Development department — not Pierce County PALS, which covers unincorporated
      Pierce County. This distinction matters because the two systems have different review
      timelines, submittal checklists, and correction processes. A complete DADU permit
      package in University Place requires a site plan showing setbacks and existing
      impervious surface, architectural floor plans and elevations, structural calculations
      for any LVL beam or engineered lumber elements, and a full MEP (mechanical, electrical,
      plumbing) scope. First-submittal plan review runs 6–10 weeks; correction cycles add
      3–5 weeks each. Submitting an incomplete package is the single biggest cause of permit
      delays. TopVolk is a WA Licensed Contractor and prepares the full permit package —
      from first submittal through rough-in inspections and final inspection sign-off. Call
      (206) 591-1096 to talk through your project timeline.

  - title: "Lot Coverage, FAR, and Slope Constraints on Bluff-Side UP Properties"
    description: |
      The lots above Chambers Bay on the western edge of University Place are some of the
      most constrained in the city for ADU construction. Slope affects foundation choice
      directly — grades above 10–15% push you toward a pier foundation or daylight-basement
      design, both of which cost more and require geotechnical input in some cases. University
      Place's R-1 zoning caps lot coverage around 40–50% (verify current code), meaning a
      home with an existing large footprint plus a detached garage may leave almost no room
      for a DADU without demolishing something first. FAR limits add a second ceiling on
      total square footage. Getting accurate site analysis done before paying for architectural
      drawings saves $3,000–$7,000 in redesign fees. The design-to-permit phase on a
      constrained lot typically runs 8–14 weeks even before ground breaks. Budget that time
      into your project plan from the start.

  - title: "Building Envelope and PNW Climate Performance for Long-Term ADU Value"
    description: |
      A DADU in University Place that isn't built to handle 40 inches of annual rainfall will
      show moisture problems within a few years — mold in framing cavities, rot at the sill
      plate, condensation in a poorly detailed crawlspace. Hardie cement-board siding is the
      standard spec here: it handles the sustained wet exposure that cedar shake struggles with
      on north-facing walls after 10–12 years. Roofing requires ice-and-water shield at the
      eaves as a code minimum, and 30-year architectural shingles are the practical baseline
      for a rental unit you want to hold for 20 years. Washington State Energy Code requires
      R-49 attic insulation and R-21 walls for new ADU construction — no exceptions. For
      mechanical, a Mitsubishi mini-split heat pump handles heating and cooling in a 400–600
      sq ft DADU far more efficiently than extending the main house system, and avoids the
      complication of running ductwork to a separate structure. Budget $3,500–$6,500 for
      mini-split supply and installation including dedicated electrical circuit.

faq:
  - q: "How fast can TopVolk get to University Place for an ADU consultation?"
    a: |
      University Place is roughly 35 minutes south of Seattle via I-5 — a standard drive
      for Pierce County project work. Vladislav schedules on-site consultations in University
      Place, Tacoma, and Lakewood regularly throughout the year. The consultation is free,
      done in person by Vladislav (not a sales rep), and results in a written scope with
      line-item pricing — not a ballpark range. Call (206) 591-1096 to set something up.
      Most consultations happen within 5–7 business days of the initial call. From first
      meeting to permit submittal typically runs 4–7 weeks, depending on how quickly design
      decisions get finalized and whether a surveyor is needed for your site plan.

  - q: "What does a detached ADU cost to build in University Place?"
    a: |
      A detached ADU in 98466 or 98467 typically runs $150,000–$225,000 for a 400–600 sq ft
      unit finished to rental-ready standard. What moves the price: foundation type (slab-on-
      grade vs. pier on sloped lots), utility connection complexity (separate water meter and
      new sewer lateral add $12,000–$22,000), and finish level. Attached ADUs and basement
      conversions generally land between $85,000–$145,000 but depend heavily on existing
      conditions. Permit fees in University Place add $3,000–$6,000 depending on project
      valuation. TopVolk provides direct written quotes with line-item pricing after the
      on-site visit — call (206) 591-1096. No ranges that shift after you sign, no allowance
      games with cabinets or fixtures.

  - q: "Does my University Place lot qualify under WA HB 1337, and what's the permit process?"
    a: |
      HB 1337 (effective 2024) allows up to two ADUs on any single-family lot statewide —
      University Place cannot prohibit them outright. The city can still regulate setbacks,
      height (typically 24 feet maximum for a DADU), lot coverage, and design standards, so
      what's legally permitted statewide may be physically constrained by your specific parcel.
      Permits go through University Place's Community Development department, not Pierce County
      PALS. A complete submittal includes site plan, architectural drawings, structural
      calculations, and full MEP scope. Plan review runs 6–10 weeks on first submittal.
      TopVolk is a WA Licensed Contractor and manages the permit package start to finish.
      End-to-end from contract signing to final inspection on a DADU in University Place
      typically runs 5–8 months.

  - q: "Can a DADU in University Place have a separate entrance and be rented independently?"
    a: |
      A detached ADU is by definition a separate structure with its own entrance, kitchen,
      and bathroom — fully independent from the primary dwelling. University Place's code
      requires it to have its own address for utility billing purposes once a separate meter
      is installed. The unit can be rented on a standard lease with no owner-occupancy
      requirement under current WA state law (HB 1337 eliminated that requirement statewide).
      Design decisions like a covered entry, private outdoor space, and soundproofing between
      units (if attached) directly affect rental value. Vladislav has built ADUs that rent for
      $1,400–$2,200/month in the Pierce County market depending on size, finish, and location
      relative to transit corridors. Those specifics come up during the on-site consultation —
      (206) 591-1096.

  - q: "How long does DADU construction take in University Place once permits are approved?"
    a: |
      Construction on a standard DADU in University Place runs 3–5 months post-permit,
      depending on size and site conditions. Rough sequence: foundation and framing (4–6
      weeks), rough-in inspections for mechanical, electrical, and plumbing (1–2 weeks per
      trade), insulation and drywall hang/tape/mud (2–3 weeks), finish work and fixture
      installation (3–5 weeks), blue tape walkthrough and punch list (1 week), final
      inspection. Sloped lots requiring pier foundations add 2–3 weeks on the front end.
      Utility connection work — new sewer lateral, service upgrade through Tacoma Public
      Utilities — runs parallel to foundation work when scheduled early. TopVolk writes
      deadline milestones into every contract with financial penalties for missed dates.
      That commitment is in the contract language, not in the pitch.

  - q: "Does TopVolk handle ADU projects in nearby Tacoma, Lakewood, and Puyallup?"
    a: |
      TopVolk works throughout Pierce County — Tacoma (98402 through 98409 zip codes),
