title: "University Place Painting — Cedar Siding & Lead Testing"

intro: |
  Grandview Drive and the streets running toward Chambers Bay give you a clear cross-section
  of University Place's housing stock — 1960s and early 1970s split-levels and ranchers built
  during Pierce County's postwar suburban push, most with cedar trim that's been cycling through
  paint jobs for fifty-plus years. The problem with cedar in zip code 98466 isn't the wood
  itself. It's that rain from October through May keeps north-facing siding damp long enough to
  push paint off at the substrate — blistering and peeling that looks like a finish failure but
  is really a prep failure from whoever did the last coat. Sherwin-Williams Resilience in a satin
  sheen handles the PNW moisture cycle well, but only after the full surface sequence: pressure
  wash, TSP scrub, spot prime on bare wood, and a full alkyd primer coat before the finish goes
  on. TopVolk Construction LLC has completed 100+ projects across King and Pierce counties since
  2023, with exterior repaints and post-remodel interior painting throughout the area. Call
  (206) 591-1096 to set up a free on-site consultation with Vladislav directly — no scheduler,
  no sales rep in between.

localContext: |
  Zip codes 98466 and 98467 cover mostly single-family residential stock built between 1955 and
  1985 — a period when cedar siding, aluminum windows, and oil-based interior trim paint were
  standard. Homes along the Grandview corridor, especially those on the western slope facing
  the Narrows, get significant wind-driven rain exposure from November through March. That
  exposure accelerates paint breakdown on west- and north-facing siding noticeably faster than
  on sheltered east-facing walls. Over in the Cirque Drive area and the neighborhoods around
  Curran Apple Orchard Park, a large portion of the housing was built before 1978 — which means
  lead-based paint is a real probability, not a remote one. Pierce County PALS (Permit and
  Licensing System) doesn't require a separate lead permit for repaints on occupied single-family
  homes, but EPA RRP (Renovation, Repair, and Painting) federal rules still apply when work
  disturbs more than six square feet of painted surface per room indoors, or twenty square feet
  outside. Any WA Licensed Contractor doing this work needs current RRP certification on file.

commonProblems:
  - title: "Cedar and Hardie Siding Repaint Cycles — University Place's 5-7 Year Clock"
    description: |
      Cedar shake and cedar-look lap siding on University Place's 1960s-70s ranchers typically
      need a full repaint cycle every five to seven years under Pierce County's climate. The
      failure mode is consistent: UV degradation in summer, moisture infiltration October through
      May, and freeze-thaw stress on north-facing walls cause the top coat to lose adhesion and
      start checking or peeling in sheets. Hardie cement-board siding, common on University Place
      homes built after 2000, holds paint longer — closer to eight to ten years — but it's not
      immune; the factory primer can fail at cut edges if they weren't field-primed at
      installation. The correct sequence is pressure wash at 1,500-2,000 PSI, hand-scrape any
      loose material, spot-prime bare substrate with an alkyd primer, caulk all lap joints and
      trim-to-siding gaps, then two finish coats of a 100% acrylic like Sherwin-Williams
      Resilience or Benjamin Moore Aura Exterior. Plan for $4,500-$9,000 for a typical 1,800 sq
      ft University Place rancher exterior, depending on story count and surface condition.

  - title: "Lead Paint in Pre-1978 University Place Homes — EPA RRP Compliance"
    description: |
      A large percentage of homes in the 98466 zip code were built before 1978, the federal
      cutoff for lead-based paint in residential construction. Many have had multiple paint layers
      applied since — but lead can still be present in the primer layers beneath the current
      finish coat. Before any scraping, sanding, or pressure washing that disturbs painted
      surfaces, an XRF analyzer test or certified swab test is the right first step. EPA RRP
      rules require certified renovators to use containment, HEPA vacuuming, wet methods, and
      specific disposal procedures when lead is disturbed beyond those thresholds. Violations
      carry fines up to $37,500 per day — that's the federal number, not a local guideline.
      TopVolk Construction LLC holds current RRP certification and handles pre-work testing and
      proper containment setup before any surface prep begins. If you're unsure whether your home
      has lead paint, call (206) 591-1096 and Vladislav can walk you through what testing makes
      sense before you schedule anything.

  - title: "Cabinet Repainting After a Kitchen Remodel — Getting the Process Right"
    description: |
      After a kitchen remodel in University Place, a common question is whether to repaint
      existing cabinets or go full replacement. For solid-wood or MDF door cabinets in decent
      structural shape, repainting is a legitimate option — but the process is very different
      from wall painting. Doors and drawer fronts need to come off, be deglossed with liquid
      deglosser or 220-grit scuff sand, primed with Zinsser BIN shellac-based primer (which
      bonds to MDF edges and thermofoil without lifting), then sprayed with a waterborne alkyd
      topcoat in a satin or semi-gloss finish. Brush-rolling cabinets in place always leaves
      texture marks. An HVLP spray setup, either off-site or with thorough on-site masking,
      gives a factory-smooth finish. Expect $1,800-$4,500 for a full cabinet repaint on a
      typical University Place kitchen depending on door count and current finish condition —
      significantly less than semi-custom cabinetry, which runs $8,000-$20,000 installed. Pierce
      County PALS does not require a permit for cabinet refinishing as a standalone scope.

  - title: "Moisture-Resistant Paint for Bathrooms — A Real Prep Sequence, Not Just a Label"
    description: |
      University Place homes built in the 1960s and 1970s often have small bathrooms with
      minimal ventilation — a single exhaust fan pulling 50 CFM or less, if one exists at all.
      Daily shower steam cycles against drywall or plaster painted with standard latex decades
      ago. The result is paint blistering at the ceiling line, mildew staining in corners, and
      eventually substrate damage if ignored. The fix isn't simply a fresh coat of bathroom paint.
      First, run a moisture meter on the drywall — readings above 17% mean a drying problem that
      paint alone won't solve. Address the ventilation (80 CFM exhaust fan minimum per IRC
      bathroom requirements), let walls dry fully, prime with Zinsser Mold Killing Primer, then
      finish with Benjamin Moore Bath & Spa or Sherwin-Williams Emerald Interior in a semi-gloss
      sheen. Semi-gloss sheens resist moisture absorption significantly better than eggshell.
      This sequence adds a day to the job. It's also the difference between a result that holds
      five years and one that starts peeling in eighteen months.

  - title: "Exterior Prep Sequence — Why Most Repaints Fail Early in Pierce County"
    description: |
      The primary reason exterior paint jobs fail before their time in University Place is
      inadequate prep — not inferior paint. A coat of Duration or Aura over a dirty, chalky, or
      partially failing previous coat will peel in eighteen months regardless of brand. The
      correct exterior prep sequence for Pierce County conditions: pressure wash at 1,500 PSI
      minimum with a wide-fan tip (never a zero-degree tip that damages wood grain), TSP
      substitute solution rinse for surfaces with heavy chalk or mildew staining, a full 48-72
      hour dry time before any primer goes on, then a full coat of alkyd primer on all bare wood
      — not spot prime, full coat. Back-roll any sprayed primer into the wood grain before it
      sets. Two finish coats of 100% acrylic in a satin sheen follow — flat sheens trap moisture,
      high-gloss shows every surface imperfection. This sequence adds a day to the job. It's also
      why a properly prepped exterior in University Place can reach the eight-to-ten year mark
      instead of stalling at five.

faq:
  - q: "How fast can TopVolk get to University Place for a painting estimate?"
    a: |
      University Place is about 35-40 minutes south of Seattle via I-5 — a straightforward drive
      that Vladislav makes regularly for Pierce County projects. Scheduling a free on-site
      estimate typically runs three to five business days from your first call. From estimate to
      project start, plan for one to three weeks depending on current workload and whether lead
      XRF testing needs to happen first. For exterior repaints, the prime scheduling window is
      May through September, when University Place gets consistent dry stretches long enough for
      proper dry times between coats. Call (206) 591-1096 — you'll reach Vladislav directly,
      not a scheduling assistant or commissioned closer.

  - q: "What does an exterior house repaint cost in University Place?"
    a: |
      A typical 1,600-2,000 square foot single-story rancher in University Place runs $4,500-
      $8,500 for a full exterior repaint — that covers pressure washing, scrape and prep, alkyd
      prime on bare areas, and two finish coats of 100% acrylic. Two-story homes or those with
      significant cedar shake area run $7,000-$12,000 due to added setup time and surface
      complexity. Lead paint testing adds $200-$400 if XRF or swab testing is needed before
      work begins. Every estimate is line-item priced — no vague ranges, no number that shifts
      at invoice. Project contracts also include a written deadline penalty clause: if TopVolk
      misses the agreed completion date, there's a financial consequence in writing, not a verbal
      promise. Call (206) 591-1096 to schedule a free on-site estimate.

  - q: "Do I need a permit for exterior repainting in University Place, and what about lead paint rules?"
    a: |
      A straight exterior repaint doesn't require a building permit through Pierce County PALS.
      If the scope includes structural repairs — replacing rotted sheathing, repairing window
      framing, patching siding — a permit may be required depending on how much structural
      material is disturbed. EPA RRP rules are separate from the permit system entirely: they
      apply regardless of permit status on any pre-1978 home where work disturbs more than
      twenty square feet of painted exterior surface. TopVolk Construction LLC is a WA Licensed
      Contractor with current RRP certification. Pre-work lead testing and all containment setup
      are handled as part of the job scope — not an add-on you coordinate separately. Questions
      about what applies to your specific property? Call (206) 591-1096.

  - q: "What's the difference between cabinet repainting and cabinet refinishing in University Place?"
    a: |
      Repainting means applying a new painted finish over existing cabinet surfaces after proper
      prep — deglosser, bonding primer, then a sprayed alkyd topcoat. Refinishing typically
      means stripping back to bare wood and applying a stain or clear coat to show the wood
      grain — a completely different process and significantly more labor-intensive. For most
      University Place kitchens where existing cabinets are painted MDF or maple with a factory
      finish, repainting is the right call. The critical steps are liquid deglosser prep, Zinsser
      BIN primer on any MDF edges or thermofoil surfaces, and spray application with an HVLP
      gun rather than brush-rolling. If your cabinet boxes are structurally sound but the finish
      is dated, repainting at $1,800-$4,500 makes considerably more sense than $10,000-plus in
      new cabinetry. Call (206) 591-1096 to find out whether your cabinets are good candidates.

  - q: "How long will an exterior paint job last on a University Place home?"
    a: |
      On cedar siding with proper prep — pressure wash, full alkyd prime on bare wood, two coats
      of 100% acrylic — eight to ten years is realistic in University Place's climate. On Hardie
      cement-board siding with intact factory prime, you can push ten to twelve years with a
      quality finish coat. The variables that shorten that lifespan: north-facing or heavily
      shaded walls that stay damp through winter, failing caulk at window and door trim joints
      that lets moisture in behind the paint film, and anything that skips the primer step on
      bare wood. Every TopVolk project includes a two-year workmanship warranty on application
      defects. If paint is peeling at eighteen months, that's a prep failure and we come back to
      address it — that's written into the contract, not a policy stated verbally on-site.

  - q: "Do you cover Tacoma, Gig Harbor, and other areas near University Place?"
    a: |
      TopVolk Construction LLC covers all of Pierce County — Tacoma, Gig Harbor, Lakewood,
