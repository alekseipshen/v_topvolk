title: "University Place Kitchen Remodel — Galley to Open-Concept"

intro: |
  Chambers Bay sits a mile west, and the neighborhoods along Bridgeport Way
  and Cirque Drive tell the same story as most of Pierce County's older
  suburbs: 1960s and 70s ranch homes with closed-off galley kitchens built
  for a different era. Swapping in a KitchenAid refrigerator or adding a
  Bosch dishwasher is straightforward. The harder part — the load-bearing
  wall between the kitchen and the dining room — is where most 98466
  remodels actually start.

localContext: |
  The 98466 and 98467 zip codes cover most of University Place, with the
  bulk of housing dating from the late 1950s through the mid-1980s. Ranch-
  style single-stories and split-levels dominate near Curran Apple Orchard
  Park and along the Chambers Creek bluffs. Many of these homes still run
  original 100-amp electrical service and have galvanized supply lines
  behind the walls — plus crawlspaces that accumulate moisture through
  Pierce County's wet winters, which shows up the moment kitchen flooring
  comes up during demo.

commonProblems:
  - title: "Load-Bearing Walls Blocking Open-Concept Layouts"
    description: "Ranch and split-level homes in 98466 typically place the
      kitchen against a load-bearing wall separating it from the living or
      dining room. Removing it requires a properly engineered LVL beam and
      PSL post at each bearing point — not a demo-and-patch job. The City
      of University Place requires structural drawings and plan review
      before a demo permit is issued."

  - title: "100-Amp Panels That Can't Support Modern Kitchens"
    description: "Homes built before 1975 came with 100-amp service as
      standard. A Bosch induction range needs a dedicated 50-amp circuit on
      its own. Add a KitchenAid dishwasher, recessed lighting on dimmers,
      and a microwave, and you've exceeded safe capacity. Upgrading to
      200-amp service requires a separate electrical permit and coordination
      with Puget Sound Energy — budget this before the cabinet quote."

  - title: "Builder-Grade Cabinet Layouts That Waste the Room"
    description: "Builder-spec kitchens from the 1970s and 80s in the
      Chambers Creek area were designed to minimize cost. Replacing stock
      boxes with IKEA SEKTION or semi-custom cabinets gains full-extension
      drawer boxes, better corner utilization, and actual pull-out shelving.
      Pair with quartz countertops and a range hood rated above 400 CFM,
      and the kitchen works the way the original layout never did."

faq:
  - q: "How fast can you get to University Place for Kitchen Remodel?"
    a: "University Place is about 25-30 minutes south via I-5 — easy access
      from Bridgeport Way or 40th Street W. Vladislav comes out directly for
      free on-site consultations, no salesperson. Call (206) 591-1096 to
      schedule. TopVolk is a WA Licensed Contractor."

  - q: "Do you work with KitchenAid and Samsung appliances during the remodel?"
    a: "Yes — KitchenAid, Samsung, GE Profile, and Bosch are the brands most
      common in 98466 and 98467 kitchens. We handle appliance fitment,
      circuit rough-in, and venting modifications for range hood upgrades as
      part of the remodel scope."

  - q: "What does the permit process look like for a kitchen remodel in University Place?"
    a: "The City of University Place issues building permits directly — not
      Pierce County PALS. Structural work like LVL beam installation requires
      plan review, typically 3-5 weeks. Full kitchen remodel timeline: 6-10
      weeks after permit approval. Deadline penalties are written into every
      contract. Call (206) 591-1096 for a line-item quote from Vladislav
      directly — 100+ projects completed since 2017 across Pierce and King
      counties."