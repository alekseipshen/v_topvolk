title: "University Place Insulation — Fix Attic Heat Loss for Good"

intro: |
  Chambers Bay sits on the western edge of University Place, right where Puget Sound fog rolls
  in most mornings from October through April. That moisture doesn't stay outside. Homes built
  between 1955 and 1975 — which describes most of the housing stock in the 98466 zip code —
  often have crawl spaces without a continuous vapor barrier and attics sitting at R-12 or less,
  where Washington State Energy Code now requires R-49. Adding blown-in cellulose like GreenFiber
  is usually the fastest path to compliance in finished attics without tearing out ceilings.
  TopVolk Construction LLC has completed attic and crawl space insulation upgrades across Pierce
  County since 2017, including homes near Chambers Creek Regional Park where post-and-pier
  foundations make crawl space encapsulation more involved. Vladislav Volkov handles the estimate
  and the work directly — no sales staff, no vague price ranges, just a line-item quote before
  anything gets scheduled.

localContext: |
  University Place's residential streets run largely along the Bridgeport Way and 27th Street
  corridors, with most single-family housing concentrated in the 98466 zip code west of I-5 and
  the 98467 corridor that borders Fircrest to the east. Homes from the 1960s and early 1970s —
  common throughout the Sunset Grove area and neighborhoods near Chambers Bay — typically have
  R-11 fiberglass batts in the walls and R-19 or less in the attic, well below Washington State
  Energy Code's current R-49 requirement for climate zone 4C. Pierce County's wet season runs
  October through May, averaging over 40 inches of annual rainfall, and crawl spaces under pier
  foundations accumulate ground moisture year-round without continuous vapor barrier coverage and
  proper drainage. That moisture wicking up through uninsulated floor cavities accounts for a
  measurable share of heating loss in older ranchers here. Insulation work within University Place
  city limits goes through the city's own building department; projects in adjacent unincorporated
  Pierce County areas fall under Pierce County PALS review, typically a 2-4 week turnaround for
  residential permits.

commonProblems:
  - title: "Attic Insulation Below R-49 in 1960s Ranchers and Split-Levels"
    description: |
      Original blown-in fiberglass or batt insulation in most University Place attics installed
      before 1980 settles over time, compressing from R-19 down to R-12 or less at the center of
      each joist bay. Meeting the current Washington State Energy Code R-49 minimum for climate
      zone 4C means adding roughly 12-14 inches of material above whatever is already there.
      Blown-in cellulose — products like GreenFiber recycled-content loose-fill — installs quickly
      in finished attics where rolling batts isn't practical and handles the irregular joist spacing
      common in older University Place homes better than batt alternatives. CertainTeed Smart Batt
      works well in unobstructed attic floors with consistent joist spacing and full access.
      A typical 1,400-square-foot attic upgrade runs $3,500–$6,500 depending on access, existing
      material condition, and whether baffles need installation at the eaves to maintain ventilation
      clearance. Puget Sound Energy offers rebates up to $0.25 per square foot for qualifying attic
      insulation work — worth confirming eligibility before scheduling.

  - title: "Crawl Space Moisture Damage from Missing or Failing Vapor Barrier"
    description: |
      Post-and-pier foundations under 1950s and 1960s homes near Chambers Creek see ground moisture
      year-round in University Place's wet climate. A bare dirt crawl space — even with patchy old
      4-mil poly — lets vapor wick up into floor joists, subfloor sheathing, and the living space
      above. Full encapsulation means installing a continuous 20-mil reinforced vapor barrier across
      the ground, lapped up the foundation walls, and sealed at all penetrations. Adding 2 inches
      of rigid foam board — Owens Corning FOAMULAR or Dow Thermax — to the foundation walls brings
      the crawl space thermal envelope into compliance with current IRC Section N1102 requirements.
      The typical encapsulation job in University Place, including vapor barrier, rigid foam, and
      mechanical fasteners, runs $4,000–$9,000 depending on crawl space height and linear footage
      of foundation wall. Mold remediation, if needed before encapsulation, adds time and cost and
      has to happen first.

  - title: "Uninsulated Rim Joists Driving Cold Floors and Air Infiltration"
    description: |
      The rim joist — the perimeter framing member that sits on top of the foundation wall and
      closes off the floor joist bays — is one of the highest air-leakage points in any pre-1990
      University Place home. Most original construction left these either completely uninsulated or
      with loosely pushed fiberglass batt, which handles thermal resistance poorly and does
      essentially nothing for air sealing. Closed-cell spray foam applied at 2-inch minimum
      thickness reaches R-12 and stops both thermal loss and air infiltration simultaneously.
      Two-component kits like Froth-Pak work in accessible crawl spaces; larger perimeter runs
      warrant a dedicated spray foam rig for consistent coverage and adhesion. University Place's
      building department may require a building permit when spray foam is applied as part of a
      broader air-sealing scope or during a remodel. TopVolk Construction LLC — WA Licensed
      Contractor — handles permit applications when required and coordinates inspection scheduling
      with the AHJ so work doesn't stall mid-project.

  - title: "Calculating ROI on Insulation Upgrades and PSE Rebates"
    description: |
      A full insulation package in University Place — attic to R-49, crawl space encapsulation, and
      rim joist closed-cell spray foam — typically runs $8,000–$18,000 depending on house size and
      existing conditions. That's a real number, and the math usually holds up. A poorly insulated
      1,800-square-foot rancher in Pierce County can lose 25–30% of its heating load through the
      building envelope. PSE offers rebates for insulation upgrades, including up to $1,200 for
      qualifying whole-home projects — University Place is PSE service territory, not Seattle City
      Light. The payback period for attic insulation alone typically lands in the 4–7 year range
      based on current natural gas and electric rates in Pierce County. Getting a Manual J heat load
      calculation after insulation work confirms actual energy savings and helps right-size any HVAC
      upgrade — useful if a Mitsubishi mini-split is also on the renovation plan. Deadlines for
      TopVolk's work are written into the contract with a penalty clause, so the schedule isn't
      just a suggestion.

  - title: "Knee Wall Insulation Gaps in 1.5-Story Craftsman-Influenced Homes"
    description: |
      Several University Place neighborhoods include 1.5-story homes where finished living space
      extends partially into the attic — common in Craftsman-influenced floor plans from the 1940s
      through the 1960s. Knee walls in these homes — the short vertical walls separating the attic
      space from finished rooms — are often either uninsulated entirely or have deteriorated
      fiberglass batts that have sagged out of the cavity over decades. R-15 mineral wool or R-21
      fiberglass batts in the knee wall cavities, paired with rigid foam on the interior face, bring
      this assembly to current code. The attic space behind the knee wall also needs blocking and
      insulation at the sloped ceiling line to prevent convective loops from bypassing the thermal
      barrier entirely. Rockwool Safe'n'Sound does double duty in this application — thermal
      performance plus noise reduction between floors, which matters during full remodels when walls
      are already open. Expect knee wall insulation to need inspection every 15–20 years, and
      replace when batts show significant settling or moisture staining.

faq:
  - q: "How fast can you get to University Place for Insulation?"
    a: |
      University Place is about 35–40 minutes from central Seattle via I-5 south or SR-16,
