  - q: "What does attic insulation in University Place cost?"
    a: |
      Blown-in cellulose or fiberglass attic insulation in University Place typically runs
      $1.50–$3.50 per square foot installed, depending on existing insulation depth, attic access
      conditions, and whether baffles or blocking are needed at the eaves. A 1,400-square-foot
      attic upgrade comes out to roughly $3,500–$6,500 all in. Crawl space encapsulation with
      20-mil vapor barrier and rigid foam adds $4,000–$9,000 depending on foundation perimeter and
      crawl height. PSE rebates can offset $300–$1,200 of qualifying work. Every TopVolk estimate
      includes a line-item breakdown — no ranges, no ballpark guesses. Call (206) 591-1096 or use
      the contact form to schedule a free site visit.

  - q: "Do I need a permit for insulation work in University Place?"
    a: |
      Adding blown-in insulation to an existing attic — no structural work involved — generally
      doesn't require a permit in University Place. Crawl space encapsulation is typically
      permit-exempt as well. Closed-cell spray foam on rim joists, or any insulation work connected
      to a larger remodel or addition, will likely trigger a permit requirement through University
      Place's building department; work in adjacent unincorporated Pierce County areas routes
      through Pierce County PALS instead. TopVolk Construction LLC is a WA Licensed Contractor and
      handles permit applications when required, including plan review submission and coordinating
      with the AHJ on rough-in and final inspection scheduling. The process typically takes 2–4
      weeks for standard residential insulation work.

  - q: "What is the difference between blown-in cellulose and closed-cell spray foam?"
    a: |
      Blown-in cellulose — products like GreenFiber — works well in attic floors. It fills
      irregular joist bays completely, handles humidity better than fiberglass in damp PNW
      environments, and uses recycled content. It does not air-seal, which is the critical
      difference for rim joists and crawl space walls. Closed-cell spray foam (Icynene or similar
      two-component products) bonds directly to framing, foundation wall, or subfloor, creating
      both a thermal barrier and a continuous air barrier in one application. Two inches of
      closed-cell reaches roughly R-12 and stops air infiltration entirely. For crawl space floor
      coverage, rigid foam board like Owens Corning FOAMULAR is often more cost-effective and
      performs equally well under a vapor barrier. The right product depends on the specific
      assembly — not just the R-value target.

  - q: "How long does insulation last in a University Place home?"
    a: |
      Blown-in cellulose and fiberglass in attics typically hold their R-value for 20–30 years
      before settling noticeably affects performance — though checking depth every 10 years is
      worthwhile, especially after any roof work or heavy snow loading. Closed-cell spray foam on
      rim joists is effectively permanent; it doesn't sag, settle, or lose adhesion when installed
      correctly. Rigid foam board in crawl spaces lasts indefinitely as long as it stays dry and
      isn't physically damaged. The 20-mil reinforced poly vapor barrier used in crawl space
      encapsulation holds up well under University Place's wet conditions for 20+ years. CertainTeed
      and Owens Corning manufacturer warranties typically run 25–50 years on materials; workmanship
      coverage is separate — ask for specifics at the estimate.

