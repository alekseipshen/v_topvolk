title: "University Place Power Washing — Moss & Algae Removal"

intro: |
  Chambers Bay sits at the western edge of University Place, and the same marine
  moisture that makes that stretch of Puget Sound beautiful is why cedar decks in
  98466 develop a gray-green algae crust by February. The 1960s and 1970s ranch
  homes running through the Cirque neighborhood and down Grandview Drive represent
  the bulk of local housing stock — and those properties have north-facing surfaces
  that haven't seen direct sun for six months straight. Concrete driveways, Hardie
  cement-board siding, composite decking, cedar fences, asphalt roofs — all of it
  accumulates biological growth under the 37-plus inches of annual rainfall this
  region absorbs. A Briggs & Stratton rental unit from the hardware store isn't
  going to cut it on moss-embedded concrete; the spores survive surface pressure
  and regrow within six weeks. Proper soft-wash chemistry — sodium hypochlorite
  solution applied at low pressure with the right surfactant — kills the root
  structure and keeps surfaces clean for two to three seasons rather than two to
  three months.

localContext: |
  Most of University Place was built between 1955 and 1985, a period when cedar
  lap siding, concrete block foundations, and post-and-pier decks were standard.
  The 98466 zip code covers the bulk of the city; 98467 picks up the eastern edge
  near the Fircrest border and parts of the commercial corridor along Bridgeport
  Way. Homes in the Cirque neighborhood — the curved street grid in the western
  residential area — tend to have low-pitched roofs with significant moss
  accumulation because overhanging Douglas-fir trees block afternoon sun for six
  months of the year. Properties near Chambers Creek Regional Park see heavier
  organic buildup from leaf tannins and pine needle debris decomposing on concrete
  flatwork. HOA communities in University Place, particularly the townhome clusters
  near 67th Avenue West, have exterior maintenance requirements that specify
  cleaning before any repaint cycle. Pierce County PALS doesn't require permits for
  pressure washing itself, but when cleaning is part of a surface prep sequence
  before painting or residing, the repaint project may trigger a separate building
  permit review through the City of University Place's permit office.

commonProblems:
  - title: "North-Facing Cedar Deck Surfaces Covered in Black Algae and Mold"
    description: |
      Cedar decks on the north sides of 1960s-era homes in University Place —
      especially those with tree canopy overhead — often go from stainable wood to
      black biological crust within two years of the last cleaning. The problem is
      not just cosmetic: algae embeds into the wood grain and retains moisture,
      accelerating the rot cycle in the deck boards themselves. A proper soft-wash
      sequence uses a diluted sodium hypochlorite solution (typically 1–3% SH
      concentration) applied via downstream injector at low pressure, under 1,200
      PSI, followed by a 10–15 minute dwell time and thorough rinse. Mechanical
      scrubbing with a stiff-bristle deck brush loosens residual biological material
      before the final rinse pass. After the surface dries — usually 48–72 hours in
      dry weather — the deck is ready for an oil-based penetrating stain like Defy
      Extreme or Armstrong Clark, both of which need clean, open wood grain to
      penetrate correctly. Staining over biological growth is the most common reason
      cedar deck stains fail within a single season.

  - title: "Concrete Driveways Gone Green and Slippery from Algae and Efflorescence"
    description: |
      Concrete flatwork in University Place's residential neighborhoods turns a
      blotchy green-black by mid-winter, especially on sections shaded by the house
      or a fence line. The biological growth — a mix of green algae, black algae,
      and mold — creates a slip hazard on entry walks and driveway aprons. Beneath
      that, efflorescence (mineral salt deposits migrating to the surface) leaves a
      white powdery crust that traps moisture and accelerates spalling. Removing
      both requires a hot-water pressure washer running at 2,500–3,000 PSI with a
      rotating surface cleaner attachment — not a straight wand, which leaves
      tiger-stripe marks in the concrete. A sodium hypochlorite pre-treat kills the
      biologicals, the surface cleaner removes the crust, and a post-wash
      application of a dedicated concrete degreaser handles oil and tire rubber
      transfer near garage aprons. A two-car driveway with a standard 20-foot apron
      runs 3–4 hours of work. Oil staining that has penetrated deeper than the
      surface layer may require a second treatment or a 30-plus minute degreaser
      dwell to fully lift.

  - title: "Hardie Siding Cleaning Before Exterior Repaint on 1970s Ranch Homes"
    description: |
      A significant portion of University Place's older ranchers and split-levels
      have had their original cedar lap siding replaced with James Hardie
      HardiePlank cement-board — and before any exterior repaint, the surface needs
      to be cleaned to bare, paint-ready condition. HardiePlank collects algae,
      mildew, and chalking oxidized paint just like wood siding does, and rolling
      new paint over a contaminated surface causes bond failure within one to two
      seasons. Cleaning HardiePlank requires low-pressure soft wash, under 1,000
      PSI on the panel face, to avoid forcing water behind the planks at the lap
      joints. A sodium hypochlorite solution handles the biological kill; a final
      top-to-bottom rinse avoids water infiltration at fastener holes. Areas with
      paint chalking need a mild TSP-substitute solution pass to remove oxidation
      before priming. The cleaning-to-repaint sequence takes a week of dry weather:
      clean, dry 3–4 days, spot-prime, paint. This prep step is why exterior paint
      jobs in the Puget Sound climate last seven to ten years instead of failing at
      three. Pierce County PALS may require a permit for the repaint portion if it's
      paired with any siding repair — the cleaning itself does not.

  - title: "Moss Removal from Asphalt Shingle Roofs Without Voiding the Warranty"
    description: |
      University Place properties under Douglas-fir and big-leaf maple canopy —
      which covers a large portion of the Cirque neighborhood — accumulate thick
      moss blankets on north-facing roof slopes within three to five years. Thick
      moss retains water against the shingles, lifts the tabs, and eventually
      creates pathways for water infiltration into the roof deck. The critical issue
      is pressure: standard architectural shingles from CertainTeed Landmark and GAF
      Timberline series void their manufacturer warranty if cleaned above 100 PSI.
      Soft wash is the only warranty-safe method — sodium hypochlorite solution
      applied by soft-wash pump at near-zero pressure, left to dwell 20–30 minutes,
      then rinsed. Dead moss sloughs off over the following weeks of rain. Zinc
      strips installed at the ridge line suppress regrowth by releasing zinc
      carbonate in runoff during rainfall events. On a typical University Place ranch
      with a 1,800 square-foot footprint, roof soft wash runs $350–$600 depending on
      pitch and moss density. Zinc strip installation adds $150–$250 and extends the
      clean interval from 1–2 years to 3–5 years.

  - title: "Cedar and Composite Fence Cleaning Before the 3-Year Stain Cycle"
    description: |
      Cedar fencing in University Place follows the same 3-to-5-year staining
      cycle as the rest of the Puget Sound basin — and the cleaning step before
      restaining is what most homeowners skip or rush. Staining over gray, weathered
      cedar that still carries old stain residue means the new coat bonds to the old
      coating rather than the wood, and it peels within a season. The proper process
      strips gray oxidation and old stain using an oxalic acid-based wood brightener
      like Defy Wood Brightener applied after a sodium hypochlorite pre-wash. For
      composite fencing — Trex, TimberTech — the process is simpler: low-pressure
      wash under 1,500 PSI with a composite-safe cleaner, no bleach. Both materials
      need 48–72 hours of dry weather before stain or sealant goes on. On a standard
      6-foot cedar privacy fence with 150 linear feet — a common University Place
      backyard perimeter — cleaning runs $200–$350 depending on fence condition and
      access. Skipping professional cleaning and staining over dirty cedar is the
      primary reason cedar fences in the PNW need full replacement at 10–12 years
      instead of lasting 20-plus.

faq:
  - q: "How fast can you get to University Place for Power Washing?"
    a: |
      University Place is right off Highway 16, which puts it about 20 minutes
      from most of the south Pierce County service area and 30–35 minutes from
      Tacoma proper. Scheduling an on-site estimate typically takes 2–4 business
      days, and most residential power washing jobs can be booked within 1–2 weeks
      of confirming. We need a window of dry weather — ideally 48 hours before and
      after — for any project involving surface prep before staining or painting. If
      your project has a painting contractor waiting on the cleaning, call (660)
      999-9960 directly to coordinate the sequencing so nothing sits idle between
      trades.

  - q: "What does power washing a driveway or deck cost in University Place?"
    a: |
      Driveway cleaning on a standard two-car concrete driveway runs $180–$280
      depending on square footage, staining, and moss density. Cedar deck cleaning
      — wash only, not staining — runs $150–$350 for a 400–600 square-foot deck
      depending on biological load and accessibility. Roof soft wash is $350–$600
      for a typical ranch-style footprint. Full-house exterior wash covering siding,
      gutters, and fascia runs $350–$550 for a 1,500–2,000 square-foot home. Every
      quote is a firm, line-item number after the on-site walk — not a vague range
      that changes at the invoice. Call (660) 999-9960 or schedule a free on-site
      estimate to get an exact figure for your property.

  - q: "Do I need a permit for power washing, and will my HOA in University Place need to approve it?"
    a: |
      Power washing alone doesn't require a permit in University Place or anywhere
      under Pierce County PALS jurisdiction. If the cleaning is part of a larger
      scope — exterior repaint, residing, or deck replacement — those projects may
      require a building permit through the City of University Place's permit office,
      separate from the cleaning itself. HOA review is a parallel process. Several
      communities in University Place, particularly townhome clusters along the 67th
      Avenue West corridor, require homeowner notification before exterior work
      begins. HOA approval boards typically take 2–4 weeks. As a WA Licensed
      Contractor (#1136541), we can provide documentation, scope letters, and photo
      records that satisfy most HOA submittal requirements.

  - q: "Do you use soft wash or high-pressure washing, and how do you decide which?"
    a: |
      Both, depending on the surface. High-pressure washing — 2,500–3,500 PSI with
      a rotating surface cleaner attachment — is correct for concrete flatwork:
      driveways, walkways, and patios. Low-pressure soft wash is the right method
      for roofs, HardiePlank siding, painted wood, composite decking, and most
      fencing. Soft wash applies a sodium hypochlorite solution at under 100 PSI —
      low enough to kill biological growth at the root without driving water behind
      lap joints or lifting shingle tabs. High-pressure on shingles or Hardie siding
      voids manufacturer warranties and doesn't kill the spores; the moss comes back
      in six months. Soft-wash chemistry keeps those same surfaces clean for 2–3
      seasons.

  - q: "How long does power washing actually keep surfaces clean in University Place's climate?"
    a: |
      In University Place's climate — 37-plus inches of annual rainfall and
      significant tree canopy across most residential areas — realistic maintenance
      intervals run 2–3 years for concrete flatwork, 3–4 years for HardiePlank or
      painted siding, and 1–2 years for roofs without zinc strip treatment. Add zinc
      strips at the ridge line and roof intervals extend to 3–5 years. Cedar decks
      need cleaning every 2–3 years as part of the restaining cycle. Composite
      decking — Trex, TimberTech — can go 3–4 years between cleanings. These
      intervals shorten on north-facing surfaces and anywhere under heavy tree
      canopy. During the estimate walk, high-maintenance areas on the property get
      flagged so you know which surfaces to watch first.

  - q: "Do you cover Tacoma, Lakewood, and Fircrest, or just University Place?"
    a: |
      University Place is the core of the south Pierce County schedule, but the
      regular service area includes Tacoma (98402 through 98409 zip codes),
      Lakewood, Fircrest, Steilacoom, and Gig Harbor. Puyallup and Spanaway jobs
      get scheduled based on current workload — travel time doesn't affect pricing
      for any of these areas since they're all within a 20–30 minute radius.
      Estimate response time runs 2–4 business days across the area. Call (660)
      999-9960 to check availability for your specific address and get on the
      calendar.