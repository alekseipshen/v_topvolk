title: "University Place Fence Installation — Post Depth, Cedar & PNW Soil Realities"

intro: |
  Fence posts around the 98466 zip code — particularly on lots backing up to the greenbelt
  corridors near Chambers Bay Golf Course — sit in glacial clay-mix soils that stay saturated
  from October through April. That constant moisture accelerates post rot at the base, and a
  standard 24-inch post depth is often not enough to keep a fence plumb through a wet Puget
  Sound winter with southwest winds rolling off the water. University Place has a high
  concentration of 1970s and 1980s ranch-style homes in neighborhoods like Grandview and along
  Cirque Drive where original cedar fencing is right at the replacement threshold — 15 to 20
  years in and starting to lean, with gate frames that no longer latch cleanly. Bufftech vinyl
  fence systems with 4x4 post sleeves rated for high-moisture environments solve most of the
  durability problems cedar owners face here, but the right choice still depends on slope, HOA
  rules, and how much maintenance a homeowner realistically wants to commit to. TopVolk
  Construction, owner-operated by Vladislav Volkov, has completed 100+ projects across Pierce,
  King, and Snohomish counties since 2017 — Vladislav handles the on-site estimate himself,
  no sales rep in between.

localContext: |
  University Place sits on a mix of glacial till and sandy-loam soils that drain better than
  the heavy clay found further east toward Graham, but still hold enough moisture to be
  destructive to untreated wood posts over time. Most of the residential fabric in the 98466
  zip dates from the 1970s through 1990s — primarily one-story ranch houses and split-levels
  on quarter-acre to half-acre lots, with existing fence lines that often haven't been surveyed
  since the original subdivision plat. The 98467 zip, which covers the northeast fringe near
  Fircrest, has similar housing stock with occasional HOA covenants that restrict fence height
  to five feet or limit materials to white vinyl or painted wood — worth confirming before
  pulling a permit. University Place uses its own Community Development department for fence
  permits rather than routing through Pierce County PALS, so the permit process is handled
  locally at City Hall. For fences over six feet or any fence tied to a retaining wall
  exceeding 48 inches, a site plan and engineering review are typically required before the
  city issues an approval.

commonProblems:
  - title: "Cedar Post Rot at the Base — The 98466's Most Common Fence Failure"
    description: |
      Cedar pickets hold up reasonably well above grade in the PNW, but cedar posts in direct
      ground contact are a different story. The combination of University Place's moist soil and
      mild freeze-thaw cycles in winter breaks down wood fibers at the post base, and by year
      eight to twelve, posts start to lean or snap at grade. The fix isn't just swapping posts:
      pull the old concrete footing, dig to 36 inches minimum depth, and reset with a
      pressure-treated (PT) 4x6 post — not cedar — using drainage gravel at the bottom before
      backfilling with concrete. Simpson Strong-Tie ABA post bases with standoff design work
      well where the post can be kept above the concrete surface entirely, cutting off the
      primary rot pathway. Budget $80–$140 per post replacement including labor and concrete; a
      full fence rebuild in cedar with PT posts typically runs $35–$55 per linear foot depending
      on terrain and gate count.

  - title: "Fence Heights and City of University Place Code Requirements"
    description: |
      University Place follows standard Washington residential fence code: six feet maximum on
      side and rear property lines, four feet on front yard setbacks. Corner lots add another
      layer — the sight-triangle requirement near intersections limits fence height to 42 inches
      within a 20-foot setback zone, and not every installer measures this correctly before
      posts go in. Horizontal slat fences, popular right now near the Chambers Bay viewshed and
      in the Grandview area, are treated identically to vertical board fences for height
      calculation — but they require tighter post spacing, 6 feet maximum on-center, to prevent
      rail sag on 1x4 horizontal boards. Gate height is included in the overall fence height
      measurement. Call (206) 591-1096 to have Vladislav walk the property line and confirm
      setbacks and sight-triangle compliance before any posts go in the ground.

  - title: "Survey and Property Line Disputes Before Setting Posts"
    description: |
      A significant number of University Place fence replacements uncover property line
      discrepancies. Original subdivision surveys from the 1970s weren't always precise, and
      decades of informal neighbor agreements have shifted fence positions a few inches to a few
      feet from the legal line — installing a new fence on the wrong line can mean removal at
      your expense. Standard practice is to pull the Pierce County Assessor's parcel map,
      compare it to existing survey pins or monuments, and — if there's any doubt — hire a
      licensed surveyor before posts are set. TopVolk coordinates this as part of pre-
      construction planning on contested lots rather than just assuming the old fence was in the
      right place. Boundary surveys in Pierce County typically run $800–$1,500 depending on lot
      complexity. The City of University Place Community Development office also requires a site
      plan showing fence location relative to property lines for any permit-required project.
      TopVolk is a WA Licensed Contractor and handles permit preparation and submission as part
      of the project scope.

  - title: "Cedar vs. Vinyl — Real Cost Comparison for University Place's Climate"
    description: |
      A six-foot cedar privacy fence in University Place runs $30–$45 per linear foot installed,
      with tight-knot cedar at the lower end and clear-grade cedar at the upper. Vinyl — Bufftech
      Classic Alternating Board profiles or ActiveYards Freedom Series — runs $40–$60 per linear
      foot but requires almost no maintenance over a 20-plus-year lifespan. Cedar needs staining
      or sealing every three to four years in the PNW to prevent the greying and mildew growth
      common on north-facing fence sections; skipping that cycle accelerates rot noticeably.
      On a 150-linear-foot fence with two gates, cedar might look cheaper upfront by $1,500–
      $2,500 — but factor in three or four refinishing cycles over 15 years and the cost gap
      closes or inverts. Gate hardware is a separate variable: a self-closing D&D Technologies
      TruClose hinge set runs $40–$80 per gate and eliminates the most common gate callback — a
      sagging gate that won't latch in year two.

  - title: "Gate Hardware Failure — The Most Frequent Post-Install Callback"
    description: |
      Gate callbacks are the most common service call TopVolk receives from homeowners who had
      fence work done by someone else. The cause is almost always hardware: cheap hinges not
      rated for gate weight, lag screws that pulled out of a saturated cedar post, or a self-
      closing mechanism not adjusted for the gate's actual mass. Residential cedar gates at six
      feet tall weigh 40–70 pounds depending on picket style; a flat strap hinge from a big-box
      store isn't designed for that load long-term. D&D Technologies TruClose hinges and Snug
      Cottage Hardware heavy-duty gate latches are the standard used on TopVolk installs — rated
      for gates up to 100 pounds with 10-year hardware warranties. Installation detail matters
      too: hinge lags should go into solid blocking added inside the post, not just into the
      face grain of wet cedar. A properly hung gate with correct hardware on a 4x4 PT post
      should operate cleanly for 10–15 years without adjustment.

faq:
  - q: "How fast can you get to University Place for a fence estimate?"
    a: |
      University Place is about 35–45 minutes from our typical staging area depending on I-5
      traffic through Tacoma — a straightforward run. For most projects in the 98466 or 98467
      zip, we can schedule an on-site estimate within 3–5 business days of first contact.
      Vladislav does the estimates himself, not a salesperson, so the site visit is actually
      productive — he's measuring post spacing, checking soil conditions at the post locations,
      and confirming code setbacks on that same trip. After the estimate, most residential fence
      projects in University Place are scheduled to start within 2–4 weeks depending on permit
      status and material lead times. Call (206) 591-1096 to get on the calendar.

  - q: "What does cedar fence installation cost per linear foot in University Place?"
    a: |
      Cedar privacy fence in University Place typically runs $30–$45 per linear foot installed.
      Tight-knot cedar sits at the lower end; clear-grade cedar pushes toward the top. That
      range assumes reasonably flat terrain — sloped lots or terraced sections add $8–$15 per
      linear foot for stepped or raked panel runs. Each gate adds $350–$650 depending on width
      and hardware selection (self-closing TruClose hinges versus manual latches). Vinyl runs
      $40–$60 per linear foot for profiles like Bufftech or ActiveYards, with minimal
      maintenance cost over the life of the fence. All pricing comes as a written line-item
      quote after the on-site visit — no vague ranges over the phone. Schedule a free estimate
      at (206) 591-1096.

  - q: "Do I need a permit for a fence in University Place, and how does that process work?"
    a: |
      Most standard residential fences — six feet or under on side and rear property lines —
      don't require a permit in University Place. Front yard fences over 36 inches in some
      zones, fences attached to retaining walls over 48 inches, or anything in a critical areas
      buffer (steep slope, shoreline) will trigger a permit review through the City of
      University Place Community Development department. The application requires a site plan
      showing fence location, property lines, and dimensions. Processing typically takes 2–4
      weeks for straightforward submittals. TopVolk, a WA Licensed Contractor, handles permit
      preparation and submission as part of the project — you don't need to navigate the permit
      counter yourself.

  - q: "Can you install a horizontal slat fence in University Place, and what does it cost?"
    a: |
      Horizontal slat fences are one of the more requested styles right now, especially on
      properties near the Chambers Bay corridor where homeowners want a cleaner, modern profile.
      The construction is slightly more labor-intensive than vertical board: posts need to be set
      at 6-foot maximum on-center spacing to prevent rail sag, and 2x4 horizontal rail backing
      — PT or cedar — is required behind the slats on fences over four feet tall. Typical cost
      runs $45–$65 per linear foot for a six-foot horizontal cedar slat fence with PT post
      framing. Material should be kiln-dried cedar — green lumber will cup and warp as it dries
      in place, especially on fences with tighter-spaced horizontal boards that trap moisture
      behind them during PNW winters.

  - q: "What warranty do you provide on fence installation work?"
    a: |
      Labor warranty on TopVolk fence projects covers one year of workmanship — post plumb, gate
      alignment, rail attachment, and fastener pull-out. Material warranties vary by product:
      Bufftech and ActiveYards vinyl fence systems carry 20-year limited manufacturer warranties
      against fading, cracking, and structural failure. Cedar doesn't carry a traditional
      material warranty since it's a natural product, but we use #1 grade tight-knot cedar
      minimum and pressure-treated posts on every installation, which significantly extends
      service life compared to builder-grade material. Gate hardware from D&D Technologies
      TruClose carries a 10-year warranty on the hinge mechanism. If a gate shifts or a post
      moves within the first year, we come back and fix it — and missed project deadlines carry
      a penalty clause written into the contract, not just a verbal promise.

  - q: "What nearby areas do you serve around University Place?"
    a: |
      In addition to University Place (98466, 98467), TopVolk regularly works in Tacoma,
      Steilacoom, Lakewood, Fircrest, and unincorporated Pierce County areas around Graham and
      Spanaway. King County projects — Renton, Kent, Federal Way — are also in regular rotation,
      as are Snohomish County jobs in Edmonds, Lynnwood, and Mountlake Terrace. For fence
      projects, most Pierce County scheduling runs 2–4 weeks out from estimate to start date;
      permit-required projects add 2–4 weeks for city review. Call (206) 591-1096 or schedule a
      free on-site consultation — Vladislav will come out, walk the lot, and hand you a written
      quote the same week.