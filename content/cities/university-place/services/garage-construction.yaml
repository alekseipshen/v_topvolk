title: "University Place Garage Construction — EV-Ready, ADU-Capable"

intro: |
  Chambers Bay Golf Course sits on the northwest edge of University Place — and the
  residential blocks climbing east from that Puget Sound shoreline are stacked with
  1960s and 1970s ranchers whose original single-car garages stopped making sense
  decades ago. A truck, an EV, and a chest freezer don't fit in a 12-foot door bay.
  The rain doesn't let up October through May in the 98466 zip code, which means an
  uncovered driveway becomes a mud problem fast — and a cramped carport means working
  on anything in a wet jacket. Building a proper detached garage here, whether a
  standard two-car or a structure with a DADU above under WA HB 1337, is one of the
  most practical upgrades a University Place homeowner can make. TopVolk Construction
  LLC has completed 100+ projects since 2017 across Pierce, King, Snohomish, and
  Kitsap counties. Vladislav Volkov handles every consultation personally — you talk
  to the contractor, not a salesperson.

localContext: |
  The ranchers and split-levels concentrated in University Place's 98466 zip code —
  particularly along Grandview Drive and in the neighborhoods climbing toward Cirque
  Drive — were built when a single-car attached garage was standard issue. Lots are
  typically 7,000-10,000 square feet, which gives enough room for a detached build,
  but setback math matters. University Place operates its own Building Division (not
  Pierce County PALS, which governs unincorporated Pierce County parcels), and
  accessory structures generally need to clear 5 feet from side and rear property
  lines, with additional requirements on corner lots. The 98467 zip code, covering
  newer subdivisions near Bridgeport Way, tends to have slightly larger lots with
  more flexibility. Statewide, WA HB 1337 (2024) now permits up to two ADUs per
  single-family lot — so a detached garage with a DADU above is approvable in most
  University Place zones without a variance. Matching Hardie cement-board siding and
  roofline to a 1970s ranch takes more design work than people expect, but the
  curb-appeal difference is significant.

commonProblems:
  - title: "Undersized, Cracked Concrete Slabs on 1960s–70s University Place Garages"
    description: |
      Original slabs poured on University Place's ranch-era properties frequently
      come in at 3 inches — under the current 4-inch minimum — without fiber
      reinforcement and on inadequately compacted base rock. PNW moisture cycles do
      the rest: water infiltrates, the subgrade shifts, and edge cracking follows.
      A correct replacement pour means full demo of the old slab, excavation to
      compacted crushed rock base, and a 4-inch minimum pour using 3,000 PSI
      fiber-reinforced concrete with polypropylene fiber at roughly 1.5 lb per cubic
      yard, plus control joints cut at intervals to direct cracking. For a 24x24
      footprint, slab work alone runs $6,500–$10,000 depending on site grade and
      whether soil import is needed. That number goes into a line-item quote, not a
      ballpark range. Vladislav walks every slab site before committing to a price.

  - title: "Setback and Lot Coverage Conflicts Before Permit Submission"
    description: |
      A surprising number of homeowners in the 98466 zip code pick a garage size —
      say, 26x30 — based on what they want, not what the lot allows. University
      Place's zoning code ties lot coverage (the combined footprint of all structures
      as a percentage of total lot area) and setback requirements together. A 1,600
      sq ft house on a 7,500 sq ft lot doesn't leave much FAR headroom for a large
      detached structure. Corner lots near Chambers Creek Road face additional
      street-side setbacks that eat into the buildable envelope even further. Before
      any design work starts, TopVolk pulls current parcel data and checks setback
      maps through the city's permit portal. Catching a coverage problem before plan
      review saves 6-8 weeks of revision time. Getting that research done upfront
      costs nothing.

  - title: "Permitting a Garage with a DADU Above Under WA HB 1337"
    description: |
      Adding a DADU above a new detached garage is structurally more complex than a
      standard garage permit. The framing needs an LVL beam or PSL post system sized
      to carry residential floor loads — not just garage loads — and the floor
      assembly between the garage ceiling and DADU floor requires R-49 insulation
      and a proper vapor barrier on the garage side. University Place's Building
      Division reviews DADU-over-garage submittals as full residential projects:
      architectural plans, structural calculations, mechanical, electrical, and
      plumbing drawings. Plan review runs 8–12 weeks for this scope. Rough-in
      inspection and final inspection both require coordination with the city's
      inspection schedule. TopVolk is a WA Licensed Contractor and has managed
      similar permit packages across Pierce and King counties — call (206) 591-1096
      to talk through what your specific lot can support under current University
      Place zoning.

  - title: "EV Charger Circuit and Workshop Sub-Panel — Rough-In Timing Matters"
    description: |
      Running a 50A or 60A EV charger circuit during construction, while stud bays
      are open, costs roughly $500–$800. Running the same circuit after drywall hang
      and tape means cutting, fishing wire through finished walls, patching, and
      repainting — easily $1,800–$2,500 for the same result. The standard rough-in
      is a 240V/50A NEMA 14-50 outlet compatible with any Level 2 charger, or a
      hardwired dedicated circuit for a specific unit like a ChargePoint Home Flex.
      For workshop use, a separate 60A or 100A sub-panel gives enough capacity for
      table saws, compressors, and dust collection running simultaneously. One issue
      to flag first: many 1970s homes in the 98466 zip code run 100A or 150A main
      panels that may need an upgrade before a 50A branch circuit can be added
      safely. Vladislav identifies panel capacity during the site walk.

  - title: "Matching Exterior Siding and Roofline to a University Place Ranch"
    description: |
      A detached garage that looks like it arrived from a different decade knocks
      value off a property. Most 1970s ranchers in University Place use horizontal
      lap siding, low-pitched gable roofs (typically 4:12 to 5:12 slope), and
      shallow overhangs. Cedar weathers fast on north-facing surfaces in PNW
      conditions without regular maintenance — which most homeowners skip. Hardie
      HardiePlank lap siding is the practical match: it comes in profiles that
      replicate original wood lap closely, it's rot- and moisture-resistant, and
      it accepts paint systems that hold color longer than wood. Trim details matter
      too — fascia width, rake board profile, soffit vent placement. Get those
      wrong and the garage reads as an afterthought even if the siding color
      matches. Roofing material, color, and granule texture need to coordinate with
      the existing house, even if the roof itself is years from replacement.

faq:
  - q: "How fast can you get to University Place for a garage construction estimate?"
    a: |
      University Place is a direct run south on I-5 — roughly 35–45 minutes from
      TopVolk's regular project territory depending on traffic through Tacoma.
      Vladislav typically schedules on-site consultations within a week of first
      contact for Pierce County projects. The site meeting is with the contractor
      doing the work, not a closer looking to sign a contract that day. You walk
      away with a clear sense of scope, site constraints, and what permit submission
      looks like for your specific address. Call (206) 591-1096 to set up a time.

  - q: "What does a new detached garage cost in University Place?"
    a: |
      A standard two-car detached garage (24x24 footprint, fiber-reinforced concrete
      slab, wood framing, Hardie siding, insulated steel door, basic electrical)
      typically runs $55,000–$85,000 in the current Pierce County market. Site prep
      and soil conditions are the biggest variables — a level lot near Bridgeport
      Way costs less to prepare than a sloped site closer to Chambers Creek. Adding
      a full DADU above the garage under WA HB 1337 pushes total project cost into
      the $140,000–$200,000+ range depending on finish level and utility connection
      scope. Free on-site estimate with exact line-item pricing — call
      (206) 591-1096 to get on the schedule.

  - q: "What permits are required for a garage build in University Place, and how long does review take?"
    a: |
      University Place has its own Building Division — permit applications go through
      the city directly, not Pierce County PALS (which handles unincorporated county
      parcels). A standard detached garage submittal requires a site plan with
      dimensions and setbacks, floor plan, foundation plan, and structural details.
      Plan review runs 4–8 weeks for straightforward garage permits. A DADU-above-
      garage project adds residential code requirements and typically extends review
      to 8–12 weeks. TopVolk prepares the full permit package, manages submission,
      and coordinates rough-in and final inspection scheduling. As a WA Licensed
      Contractor with completed projects across Pierce County, we know what
      University Place reviewers flag and how to submit without triggering revision
      loops.

  - q: "Can you rough-in EV charging and a workshop setup in the same garage build?"
    a: |
      Yes — and doing both during the original build is significantly cheaper than
      retrofitting either afterward. EV charger rough-in (50A or 60A circuit, conduit
      sleeve to the main panel) and a workshop sub-panel (typically 60A or 100A)
      both get installed during the same electrical rough-in phase, before drywall
      goes up. Insulating the garage to workshop standard — R-13 or R-15 in 2x4
      stud bays, R-38 or higher in the ceiling, plus an insulated garage door rated
      R-12 or better — makes year-round use comfortable. A Mitsubishi mini-split
      handles climate control efficiently if you want heating and cooling. All rough-
      in work gets inspected before walls close.

  - q: "How long does a garage construction project take from permit approval to final inspection?"
    a: |
      For a standard two-car detached garage in University Place: plan review runs
      4–8 weeks, followed by 6–10 weeks of construction (slab pour and cure,
      framing, roofing, siding, electrical rough-in, insulation, drywall
      hang/tape/mud, doors and hardware). A DADU-above-garage project adds 8–14
      weeks for the living space finish work — MEP coordination, finish carpentry,
      blue tape walkthrough, and punch list. Realistic total: 3–5 months for a
      garage-only project, 6–9 months for a garage with a DADU. Milestone deadlines
      are written into the contract with penalty provisions for missed dates — that
      is a binding commitment, not a marketing line.

  - q: "Do you build garages in Tacoma and other cities near University Place?"
    a: |
      TopVolk works across Pierce, King, Snohomish, and Kitsap counties. Completed
      projects near University Place include Tacoma (98405, 98406, 98407), Lakewood,
      Gig Harbor, and Federal Way. Permit jurisdictions differ: Tacoma runs its own
      Building Division, while some Gig Harbor and South Pierce County work flows
      through Pierce County PALS for unincorporated parcels. Vladislav handles
      permit jurisdiction research before any design work starts — the scope you're
      quoted matches what the AHJ will actually approve. Call (206) 591-1096 or
      schedule a free on-site consultation to get started.