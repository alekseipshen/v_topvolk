  - q: "What does drywall installation cost for a full room or addition in University Place?"
    a: |
      Standard 1/2-inch board with a Level 4 finish on 8-foot walls runs $2.50–$3.50 per
      square foot installed. Level 5 finish — skim coat, multiple passes, required under
      recessed lighting in remodeled kitchens and primary bathrooms — goes to $3.75–$5.00
      per square foot. A full primary bathroom gut-and-redo, including mold-resistant board,
      RedGard waterproofing membrane, and Level 4 finish ready for tile, typically lands
      between $2,800 and $5,500. Type-X firecode board for garage or ADU separation adds
      roughly 15–25% to material cost. Free on-site estimates with exact line-item pricing
      — not ranges — are available by calling (206) 591-1096. Vladislav walks the space
      before committing to any number.

  - q: "Does drywall work in University Place require a Pierce County permit?"
    a: |
      Interior drywall-only scopes — patching after a pipe repair, skim-coating ceilings,
      replacing damaged board in an existing room — don't require a separate permit through
      Pierce County PALS in most cases. The line gets crossed when drywall is part of a
      structural change, room addition, ADU conversion, or garage-to-living-space project.
      Those require a building permit, and Pierce County PALS inspectors check fire
      separation compliance — 5/8-inch Type-X on garage walls and ceilings, proper blocking
      for grab bars — at both rough-in and final inspection. TopVolk Construction is a WA
      Licensed Contractor and handles permit application, plan submission, and inspection
      coordination on any scope that requires it. Homeowners don't need to manage that
      process themselves.

  - q: "Can you match existing skip-trowel or knockdown texture when patching?"
    a: |
      Texture matching is genuinely one of the harder parts of patch work — most painters
      skip it entirely. Skip-trowel and knockdown textures from the 1970s and 1980s vary
      by whoever applied them, and there's no single standard recipe to reproduce. The
      process starts with testing joint compound consistency in an inconspicuous area, then
      applying by hand or hopper gun depending on what the original texture pattern required.
      University Place homes from that era predominantly have skip-trowel on walls and heavier
      spray texture on ceilings. For small patches in a room being repainted, the blend
      disappears under flat latex. For larger areas, Vladislav will tell you honestly during
      the estimate whether a blend is achievable or if a full-wall rehang and retexture makes
      more practical sense — and what the cost difference looks like between the two options.

  - q: "What warranty comes with a drywall installation or finishing scope?"
    a: |
      The workmanship warranty covers tape joints that crack or lift, seams that telegraph
      through paint, and finish defects visible under normal lighting — one year from
      completion. Material defects on mold-resistant board are covered under manufacturer
      warranty: National Gypsum and USG both carry limited warranties on the Purple XP and
      Mold Tough product lines for defects under normal use. Structural cracking caused by
      foundation movement or framing shifts isn't a drywall defect — that's a separate
      conversation about what's moving underneath the finish. TopVolk also writes deadline
      penalties directly into the contract: if the drywall scope runs past the agreed
      completion date, there's a financial consequence on TopVolk's side — not just an
      acknowledgment that things ran long.

