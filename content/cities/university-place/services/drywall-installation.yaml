title: "University Place Drywall Installation — Level 5 Finish, Code-Ready Scopes"

intro: |
  Split-level and ranch homes lining Grandview Drive W and the hillside blocks fanning
  out behind Chambers Bay were mostly built between 1965 and 1985 — which means a lot
  of University Place homeowners are dealing with the same combination: skip-trowel
  texture on every ceiling, walls that have shifted enough over four decades to make a
  Level 5 finish anything but routine, and drywall that's survived five paint-overs but
  not a single remodel. The moment a kitchen or bathroom project starts, drywall work
  touches almost every phase — patching after electrical and plumbing rough-in, hanging
  new board where walls came down, finishing to a standard that holds up under recessed
  LED lighting. Moisture off Puget Sound keeps basement and crawlspace humidity elevated
  through the October–May rainy season, which pushes wet-area projects in 98466 toward
  National Gypsum Purple XP or USG Sheetrock Mold Tough as the baseline choice. Vladislav
  Volkov at TopVolk Construction has run drywall scopes on remodels throughout University
  Place since 2017 — 100+ projects completed across Pierce, King, and Snohomish counties.
  Call (206) 591-1096 to schedule a free on-site consultation.

localContext: |
  Most of the housing in 98466 — the zip covering University Place's interior neighborhoods
  along Cirque Drive and the streets dropping toward Chambers Creek Road — was built between
  1962 and 1984. That era means original drywall seen through multiple skim-coat attempts
  of varying quality, and in some of the older homes closer to the waterfront, sections of
  lath-and-plaster in load-bearing walls built before about 1965. Patching into plaster
  requires a different approach than standard 1/2-inch gypsum work — you can't just butt
  new board up to it and expect a flat seam. In 98467, covering the Fircrest border and the
  eastern edge of University Place, mid-century construction dominates and popcorn ceilings
  from the 1970s show up on nearly every house on the block. Moisture is a real factor here.
  University Place's north-facing hillside lots combined with proximity to the Sound create
  conditions for mildew behind shower walls and staining in below-grade spaces where vapor
  barriers weren't part of the original build. Pierce County PALS handles permits for ADU
  additions, garage conversions, and room-addition work — drywall-only interior scopes
  typically don't require a separate permit, but any scope tied to a structural change or
  change of occupancy does.

commonProblems:
  - title: "Mold-Resistant Purple Board in Bathrooms, Basements, and Laundry Rooms"
    description: |
      Standard 1/2-inch gypsum behind a tile shower in a 1970s University Place bathroom
      wasn't designed to last indefinitely — and most of the time, it hasn't. Moisture
      migrates through grout lines and around unsealed penetrations until it reaches the
      paper facing on regular drywall, and from there, mold follows within months in
      University Place's persistently damp climate. The fix is National Gypsum Purple XP
      or USG Mold Tough for wet-area walls, combined with Schluter Kerdi membrane or
      RedGard on tiled surfaces — the board alone isn't enough without a proper waterproofing
      layer. Below-grade spaces are another pressure point: finished basements in the hillside
      homes near Chambers Creek Road need mold-resistant board on every wall, not just the
      shower. A bathroom gut-and-redo in a mid-sized University Place home — board removal
      and replacement, RedGard or Kerdi membrane, Level 4 finish ready for tile or paint —
      typically runs $2,800–$5,500 depending on square footage and whether the ceiling is
      coming down as part of the scope.

  - title: "Popcorn Ceiling Removal and Skim-Coating to a Flat, Paint-Ready Finish"
    description: |
      Spray-applied popcorn texture landed on nearly every ceiling in University Place homes
      built between 1968 and 1988. It hid imperfections well, which is why contractors
      sprayed it on everything — but under recessed LED fixtures on a dimmer, every wave and
      ding in the underlying drywall becomes visible once that texture is gone. Proper
      skim-coating to a Level 5 finish means two to three passes of joint compound, full
      dry time between coats (critical in humid November — rushing it with fans creates
      bubbles), thorough sanding, and a high-build primer before paint goes on. The Cirque
      neighborhood and the blocks near Chambers Bay Elementary see this scope constantly on
      kitchen and living room remodels. A 400 sq ft ceiling — texture removal, skim coat,
      sand, prime — runs roughly $900–$1,600 depending on the condition of the existing
      board underneath. Damaged or saturated board below the texture adds scope and cost.

  - title: "5/8-Inch Type-X Firecode Drywall for Garage Conversions and ADU Separation Walls"
    description: |
      Washington's WA HB 1337 (2024) allows up to two ADUs per single-family lot, and
      University Place homeowners are actively exploring garage conversions and basement
      AADU projects as a result. The IRC requires 5/8-inch Type-X firecode drywall on every
      garage-to-living-space separation wall and ceiling — and Pierce County PALS inspectors
      verify this specifically at both rough-in and final inspection. Two layers of 5/8-inch
      Type-X on the ceiling side is standard for multi-family separation requirements on
      converted garages. Standard 1/2-inch board doesn't satisfy the fire separation
      requirement regardless of finish quality. TopVolk Construction is a WA Licensed
      Contractor and pulls permits directly through Pierce County PALS for ADU and conversion
      scopes, coordinating MEP rough-in sign-off before drywall goes up. Hanging board before
      electrical and plumbing inspections pass means tearing out finished walls for inspection
      access — a costly mistake on a $60,000–$120,000 ADU project.

  - title: "What Drywall Work Actually Costs on a University Place Remodel"
    description: |
      Drywall pricing isn't a single number — it shifts based on ceiling height, board type,
      finish level, and how much patching the trades leave behind after rough-in. Standard
      1/2-inch board on flat 8-foot walls with a Level 4 finish runs roughly $2.50–$3.50
      per square foot installed in University Place. Level 5 finish — full skim coat, two
      to three passes, required under raking light in remodeled kitchens and primary baths
      — moves that to $3.75–$5.00 per square foot. Type-X firecode board costs more per
      sheet and takes longer to hang cleanly, adding roughly 15–25% to material cost over
      standard board. On a full kitchen remodel in a 1970s University Place ranch — tear-out,
      patch, hang, tape, finish — the drywall scope alone typically lands between $4,500 and
      $9,000 depending on whether the ceiling is included. Free on-site estimates with
      line-item pricing — not ballpark ranges — are available by calling (206) 591-1096.
      Vladislav walks the space himself before any number goes on paper.

  - title: "Soundproofing Shared Walls with Resilient Channel and QuietRock"
    description: |
      Homes built in University Place during the 1970s and 1980s used standard stud framing
      with minimal insulation in interior walls — sound carries freely between bedrooms, and
      between units in garage or basement spaces now being converted to ADUs. Resilient
      channel (RC-1 decoupler) mechanically separates the drywall face from the stud, which
      is the foundational step toward meaningful sound attenuation. Pairing resilient channel
      with QuietRock 530 panels instead of standard 5/8-inch board can push a wall from STC
      33 up to STC 52 or higher without significant added thickness. Acoustic sealant —
      Tremco or OSI — at the perimeter and around penetrations closes the flanking paths that
      resilient channel alone won't address. A typical soundproofing scope covering one shared
      bedroom wall in a 98466 home runs $1,800–$3,800 depending on wall length and whether
      existing board is coming off both sides or just the side being upgraded.

