title: "University Place Deck Installation — Chambers Bay Views Built Right"

intro: |
  Lots in the 98466 zip code, especially those backing up toward Chambers Creek Regional
  Park, sit in that classic PNW exposure pattern — morning fog, sustained rain October
  through April, and moss colonizing any north-facing surface within two seasons. Ranch
  homes along Bridgeport Way commonly have original cedar decks from the 1970s that look
  fine visually but flex underfoot — a sign the ledger board attachment or post footings
  have failed. Trex composite has replaced cedar on most of the Pierce County rebuilds
  TopVolk has done; the maintenance math just works out better in this rainfall pattern.

localContext: |
  University Place's housing stock in 98466 and 98467 breaks down predictably: 1960s–70s
  ranch homes dominate near Chambers Bay, built on slab or crawlspace foundations with
  attached wood decks now 40–50 years old. That era predates current ledger flashing
  requirements and minimum post-footing depth codes. The Chambers Creek corridor
  neighborhoods — Chambers Hill, Quarterdeck, and streets west of Grandview Drive — are
  where we see the most replacement work, often because the original PT lumber was never
  actually ground-contact rated and the posts have rotted at grade.

commonProblems:
  - title: "Ledger Board Rot on 1970s Ranch Homes Near Chambers Bay"
    description: >
      Original decks in this area were lag-bolted directly against house sheathing with no
      through-flashing. Water infiltrates the rim joist for years before anyone notices the
      soft feel underfoot. Correct repair means stripping the deck, replacing the rotted rim
      joist, installing proper drip-cap flashing, and reattaching with structural screws per
      IRC R507. We see this on nearly every pre-1985 deck we pull a permit on in Pierce County.
  - title: "Post Footings Too Shallow for University Place Soil Conditions"
    description: >
      University Place doesn't freeze hard like North Bend or Enumclaw, but footings still
      need to reach minimum 12–18 inches per Pierce County code — deeper on larger or elevated
      decks. Undersized footings settle unevenly and tilt the whole structure. Installing
      Simpson Strong-Tie post bases on properly poured concrete footings, sized to the deck
      load, solves this permanently and passes rough-in inspection the first time.
  - title: "Guardrail Height and Stair Stringer Code Failures on Older Decks"
    description: >
      Decks from the 1980s frequently have 32-inch guardrails — below the 36-inch minimum
      IRC requires for any deck surface more than 30 inches above grade. Stair stringers on
      those same decks often lack graspable handrails entirely. TimberTech and Trex both make
      code-compliant railing systems that integrate with composite decking. University Place's
      building department catches both issues at plan review, so replacements get brought
      to current code before a single board goes down.

