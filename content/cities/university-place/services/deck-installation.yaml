      days for 98466 and 98467 addresses. Call (206) 591-1096 to set a time. Vladislav
      walks the site with you — no sales rep, no estimator in between.
  - q: "Trex or cedar — which actually makes sense for a University Place deck?"
    a: >
      Cedar looks better new. But in Pierce County's rainfall pattern, cedar needs annual
      cleaning and sealing or moss moves in by year three. Trex and TimberTech composite
      boards cost more upfront — roughly 20–30% more for materials — and the maintenance
      comparison flips within five years. On decks that face northwest or sit under tree
      canopy, composite is the practical answer almost every time.
  - q: "What does the deck permit process look like in University Place?"
    a: >
      University Place has its own building department — separate from Pierce County PALS —
      and plan review runs roughly 3–6 weeks for a standard attached deck. You'll need
      drawings showing footing depths, ledger attachment detail, guardrail specs, and stair
      layout with rise/run dimensions. We handle the permit application start to finish,
      respond to plan corrections, and schedule the rough-in and final inspections. Most
      projects run 10–16 weeks from permit submission to final sign-off. For a free
      on-site look, call (206) 591-1096 — WA Licensed Contractor, 100+ projects completed
      since 2023, and deadline penalties written into every contract.