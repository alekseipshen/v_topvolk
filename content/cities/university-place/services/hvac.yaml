title: "University Place HVAC — Heat Pumps, Mini-Splits & Duct Work"

intro: |
  Gas furnaces were the default choice in nearly every University Place subdivision built
  through the 1970s. The split-levels and ranchers along Bridgeport Way W, and the older
  streets running down toward Chambers Creek Regional Park, got builder-grade heating
  equipment — much of it now 25 to 40 years old and well past its design life. Replacing
  that furnace isn't just a comfort decision. With the Inflation Reduction Act's 30% federal
  tax credit (capped at $2,000) stacking on top of Puget Sound Energy's heat pump rebates,
  the financial case for switching to a Mitsubishi Hyper-Heat cold-climate system has
  genuinely shifted in the homeowner's favor. That system holds rated efficiency down into
  the low teens Fahrenheit — relevant here in 98466 when overnight lows dip toward freezing
  in December and January. TopVolk Construction LLC has managed HVAC upgrades across the
  Pierce County side of the metro since 2023. Owner Vladislav Volkov handles estimates
  directly — no call center, no commissioned sales staff between you and the person running
  the job.

localContext: |
  University Place is primarily zip code 98466, with a narrow slice of 98467 along the
  northeastern edge near the Tacoma city limits. The housing stock splits into two clear
  eras: post-war construction from the late 1940s through the mid-1960s concentrated on
  the Chambers Bay bluff side and the older streets west of 67th Avenue W, and then a
  second wave of 1980s to early-1990s builder homes in the subdivisions closer to Drexler
  Drive. Both eras share the same core HVAC challenge — ductwork that was sized for a gas
  furnace, not a heat pump, and degraded enough that 20 to 30 percent of conditioned air
  leaks into unconditioned crawlspace before it reaches a room. The Pacific Northwest's
  37-plus inches of annual rainfall keeps crawlspace relative humidity high from October
  through May, which accelerates flex duct liner deterioration and promotes mildew growth
  inside unsealed boot connections. Mechanical permits for HVAC work in University Place
  run through Pierce County PALS — heat pump installations typically trigger a plan review
  that adds two to four weeks to the front end of a project, so planning ahead matters.

commonProblems:
  - title: "Converting Aging Gas Furnaces to Heat Pumps Using IRA Rebates"
    description: |
      A large portion of the ranchers and split-levels in 98466 are still running Bryant or
      Carrier furnaces installed in the late 1980s or early 1990s — equipment at or past its
      20-year service mark. Converting to a Daikin or Mitsubishi Hyper-Heat heat pump
      involves more than swapping boxes. The existing duct system needs a static pressure
      test and a Manual J load calculation to confirm it can handle heat pump airflow, which
      runs higher CFM than what a furnace pushes. Undersized return air ducting is the most
      common bottleneck. On the cost side: the IRA Section 25C credit covers 30% of
      installation up to $2,000, and Puget Sound Energy's heat pump rebate adds another
      $800 to $1,500 depending on the system's SEER2 rating. Full conversion projects in
      University Place typically land between $8,000 and $14,000 installed — higher when the
      electrical panel needs a disconnect circuit upgrade to support the new outdoor unit.

  - title: "Ductless Mini-Split Installation for ADUs and Additions"
    description: |
      Under WA HB 1337 (effective 2024), University Place homeowners can now permit up to
      two ADUs on a single-family lot. Most DADUs and garage conversions don't connect to
      the main house duct system — and running new ductwork to a detached structure rarely
      pencils out. A single-zone Mitsubishi MXZ or Daikin Fit mini-split handles both
      heating and cooling without touching the existing forced-air equipment. Installation
      means running a refrigerant line set through the exterior wall, mounting the wall-mount
      air handler inside, and setting the outdoor condenser on a concrete pad or wall bracket
      — typically a one- to two-day job per zone. Multi-zone systems covering a sunroom,
      finished basement, and a new bedroom addition off a single outdoor unit are also common
      in the Chambers Creek bluff-side homes where additions get added in phases. Per-zone
      costs run $3,500 to $6,500 installed, with higher pricing when line set routing
      requires opening finished walls.

  - title: "Ductwork Sealing and Rebalancing in 1950s–70s Homes with Hot/Cold Rooms"
    description: |
      The homes built between 1950 and 1975 along 67th Avenue W and the streets flanking
      Cirque Park typically have flex duct runs in unconditioned crawlspaces — spaces that
      stay at 60 to 70 percent relative humidity from October through May. Flex duct sitting
      in those conditions for 30-plus years develops liner cracks, separating joints, and
      failed duct tape (not mastic, which is what current code requires at all connections).
      The result: hot rooms upstairs, cold rooms at the far end of the run, and a system
      that short-cycles because it can't move enough air volume to hit setpoint. Proper
      remediation starts with a duct blaster and blower door test to measure actual leakage
      rates, followed by mastic sealing at all joints and re-securing sagging flex runs with
      code-required strapping every four feet. Severe cases warrant replacing flex with rigid
      sheet metal. Duct sealing projects in University Place typically run $1,500 to $4,500
      depending on crawlspace access and total duct footage.

  - title: "High-Efficiency Furnace Replacement (95%+ AFUE) and Condensate Venting"
    description: |
      Swapping a mid-efficiency 80% AFUE furnace for a 95%-plus unit is common in the
      1980s to 1990s homes near Drexler Drive, and it's where lowball bids tend to hide
      scope. A 95%+ furnace produces acidic condensate exhaust and requires PVC flue venting
      — not the existing B-vent running up through the original chase. That means opening
      the chase, re-routing the flue to PVC, and adding a condensate drain line to a floor
      drain or utility sink. Combustion air requirements also need to meet IRC Section G2407,
      which specifies minimum mechanical room volume or dedicated makeup air openings. Skip
      that step and the furnace pulls combustion air from the crawlspace, shortening its
      life. A Carrier Infinity 96 or Lennox SLP99 in a University Place rancher typically
      runs $4,500 to $7,500 installed — the higher end reflects homes where the B-vent chase
      modification adds meaningful labor. Pierce County PALS requires a mechanical permit;
      plan for one to two weeks on review.

  - title: "Smart Thermostat Integration and Zoning in Split-Level Homes"
    description: |
      Split-level homes are the hardest HVAC configuration to keep comfortable. The upper
      level runs hot in summer because heat stratifies upward; the lower level stays cold in
      winter because a single-zone system can't compensate for the physics. Installing a
      Nest Learning Thermostat or ecobee SmartThermostat improves scheduling and remote
      control, but it doesn't fix a zoning problem without damper-based zoning hardware
      added to the duct system. A full two-zone setup — Honeywell TrueZONE controller,
      motorized bypass dampers in the main trunk, and a thermostat in each zone — modulates
      airflow by demand instead of running the system full-blast at one setpoint. In
      University Place split-levels, a two-zone conversion on existing equipment typically
      adds $2,500 to $4,500 in parts and labor. Integration with an existing Nest or ecobee
      is usually straightforward, since most zone controllers support both platforms. The
      comfort difference on a 1,800-square-foot split-level is significant enough that most
      homeowners wish they'd done it earlier.

faq:
  - q: "How fast can TopVolk get to University Place for an HVAC estimate?"
    a: |
      University Place sits about 20 to 25 minutes from the I-5 corridor, usually via the
      Bridgeport Way W exit. On-site estimates typically schedule within three to five
      business days of first contact. For most HVAC projects — furnace replacements,
      mini-split installs, duct sealing — actual work can start two to four weeks after the
      estimate, depending on equipment lead times from local Tacoma and Kent distributors.
      Mitsubishi and Daikin equipment is generally available within a week from regional
      supply houses. Call (206) 591-1096 to schedule directly with Vladislav — he runs
      the estimate and the job, not separate people.

  - q: "What does a heat pump installation cost in University Place?"
    a: |
      Whole-home heat pump installations in University Place — converting from an existing
      gas furnace — typically land between $8,000 and $14,000 installed. Ductless mini-split
      systems run $3,500 to $6,500 per zone. What moves that number: duct condition and
      leakage rate, whether the electrical panel can support the new disconnect load without
      a sub-panel upgrade, and refrigerant line set routing complexity. The IRA Section 25C
      credit (30%, up to $2,000) and Puget Sound Energy rebates apply to qualifying
      cold-climate heat pump systems. TopVolk provides line-item quotes — not vague ranges
      — after an on-site assessment. Schedule a free estimate at (206) 591-1096.

  - q: "Do you pull HVAC permits through Pierce County PALS in University Place?"
    a: |
      Yes. Heat pump installations, furnace replacements, new mini-split systems, and
      ductwork modifications in University Place all require a mechanical permit through
      Pierce County PALS. The application covers equipment specifications, Manual J load
      calculations for new heat pump sizing, and combustion venting details where applicable.
      Plan review for residential mechanical permits typically runs one to three weeks.
      TopVolk Construction, WA Licensed Contractor, handles the permit application,
      coordinates the rough-in inspection, and schedules the final inspection with the
      county. Permit costs are included in the project quote — no surprise fees added after
      the fact.

  - q: "Can you add central AC to an existing forced-air furnace in University Place?"
    a: |
      It depends on the duct system. Most forced-air systems installed before 1990 in
      98466 were sized conservatively for heating-only airflow and don't have adequate
      return air capacity for a modern cooling coil. The right starting point is a static
      pressure measurement across the air handler — if return static is too high, adding a
      3-ton or 4-ton evaporator coil will push the system into a high-pressure fault
      condition. If the ducts pass the pressure test, we add an evaporator coil inside the
      air handler cabinet and run refrigerant lines to a new condenser outside. A properly
      sized AC addition on an existing forced-air system in University Place typically runs
      $4,500 to $7,000 installed, including the Pierce County PALS mechanical permit.

  - q: "What warranty covers HVAC work TopVolk installs?"
    a: |
      Equipment warranties on Mitsubishi and Daikin systems run 5 to 12 years on parts,
      depending on product line and whether the installation is registered with the
      manufacturer within 60 days of install. Mitsubishi's Diamond Contractor program
      extends the compressor warranty to 12 years on registered systems. TopVolk's
      workmanship warranty covers installation defects — refrigerant leaks at brazed joints,
      improper condensate drain pitch, loose electrical connections — for two years from
      project completion. If something fails because of an installation error, we return and
      fix it at no charge. Beyond that: deadline commitments are written into the contract
      with financial penalties if we miss them. That's an actual commitment, not a
      marketing line.

  - q: "Does TopVolk cover Tacoma, Lakewood, and other nearby Pierce County cities?"
    a: |
      The service area covers all of Pierce County: Tacoma, Lakewood, Steilacoom, Fircrest,
      Gig Harbor, Puyallup, and surrounding unincorporated areas. Projects also run into
      King County — Seattle, Renton, Federal Way, Kent — and Snohomish County as far north
      as Lynnwood and Edmonds. TopVolk has completed 100-plus projects across the Seattle
      metro since 2023. Scheduling for new HVAC work typically runs two to four weeks out.
      Call (206) 591-1096 or use the contact form to describe the project scope, and
      Vladislav will confirm availability and provide a realistic start-date window — not a
      placeholder booking.