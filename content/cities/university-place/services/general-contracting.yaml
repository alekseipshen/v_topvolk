title: "University Place General Contracting — Permits & Trade Coordination"

intro: |
  Chambers Bay sits two miles west of the homes along Cirque Drive, and most of those
  homes in zip 98466 were built between 1962 and 1985 — a generation of split-levels and
  ranchers that look fine from the street but hide galvanized plumbing and undersized
  panels the moment you open walls. Coordinating framing, electrical, plumbing, and
  mechanical on a $120K remodel while navigating Pierce County PALS plan review is a
  full-time job. That's the work Vladislav handles directly on every project.

localContext: |
  The residential streets off Bridgeport Way and north toward Sunset Drive were
  developed in waves — some 1960s original construction, some 1980s builder-grade
  additions that used whatever was cheap at the time. Crawlspaces in this area collect
  moisture from October through April, and vapor barriers installed 30 years ago have
  typically failed. Zip 98466 falls under Pierce County PALS for all permitted
  residential work — not Seattle SDCI, not King County DPER. That distinction matters
  for scheduling.

commonProblems:
  - title: "Pierce County PALS Plan Review Stalls Multi-Trade Projects"
    description: "Additions and kitchen reconfigurations that touch structure or relocate
      MEP rough-in require permit packages with site plans and structural drawings before
      Pierce County will issue. Plan review runs 6-10 weeks on complex submittals. Submit
      an incomplete package and it comes back — adding another 3-4 weeks. We prepare
      permit documentation in-house so the package clears first review without a
      correction loop."
  - title: "Demo Exposes Structural Surprises in 1960s-80s University Place Ranchers"
    description: "Open a wall in a Bridgeport-area rancher and the framing tells a
      different story than the inspection report did. A rotted rim joist from a
      decades-old crawlspace leak, point loads sitting on a non-bearing partition, or
      galvanized drain lines that need full replacement — these are not rare finds.
      Every project budget includes a contingency line for structural conditions found
      during demo, because the cost of ignoring them shows up at final inspection."
  - title: "Multi-Trade Sequencing Breaks Without a Single Point of Contact"
    description: "A kitchen renovation involving Bosch or KitchenAid appliance hookups,
      a gas line relocation, and a new circuit panel sub-feed requires plumber,
      electrician, and sometimes a Mitsubishi mini-split install to hit the site in the
      right order. Rough-in inspection has to happen before drywall hang. Miss the
      sequence and you're cutting into fresh mud to pass inspection. Vladislav schedules
      and confirms every sub directly — no go-between."

