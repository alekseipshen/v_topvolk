  - q: "What brands do you typically specify for University Place kitchen and bath remodels?"
    a: "Mid-range remodels in 98466 typically land on Bosch or KitchenAid appliances, Moen or Kohler fixtures, and Schluter Kerdi waterproofing membrane under shower tile. Milgard windows hold up well in PNW rainfall without the maintenance overhead of wood. IKEA cabinets work on tighter budgets; semi-custom is worth the step-up above $65K when box dimensions won't solve the layout. The older University Place housing stock — ranchers and split-levels east of Cirque Drive — often has non-standard rough openings that make semi-custom the only practical option anyway."
