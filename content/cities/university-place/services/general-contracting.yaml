title: "University Place General Contracting — Permits, Trades, No Middlemen"

intro: |
  The post-war ranchers and early-60s split-levels off Bridgeport Way SW in zip 98466 were
  built for Tacoma-area workers and JBLM families — solid enough construction, but layers
  of patchwork renovation and rarely a permit on record. Gut a kitchen in one of these
  and you're staring at galvanized supply lines behind the KitchenAid, possible splice
  boxes inside the walls, and structural headers that weren't engineered for the opening
  you want. Pierce County PALS permitting is mandatory for that scope, and coordinating
  framing, electrical, and plumbing without a GC is where most self-managed remodels
  stall completely.

localContext: |
  Zip code 98466 covers most of University Place — a city wedged between Tacoma and the
  Narrows, about ten minutes from Chambers Bay Golf Course. Heavy rainfall from October
  through April means vapor barriers in crawlspaces aren't optional on pre-1980 homes;
  most of them never had one installed, or had it done wrong the first time.

  The housing stock runs heavily mid-century. Homes built between 1950 and 1975 near the
  Curran Apple Orchard Park area frequently show undersized framing, original galvanized
  plumbing, and fuse panels tucked into utility closets. These aren't surprises if you've
  opened enough of them. They're predictable based on era and zip — and a contractor
  who's worked in Pierce County knows how to price for them before demo, not after.
  The Grandview Drive corridor and neighborhoods east of Cirque Drive follow the same
  pattern: post-war bones, decades of DIY layering on top.

  Newer construction along the western edge of 98466 — some 1990s and 2000s builds near
  the Chambers Bay neighborhood — is a different scope problem. Framing is sound,
  energy-code compliant, but the finish work is dated builder-grade. Owners there are
  increasingly asking about DADU additions under WA HB 1337, which allows two ADUs per
  single-family lot statewide. Lot coverage, FAR calculations, and height limits (24 ft
  typical for a detached unit) still apply. Pierce County PALS plan review on a DADU
  runs 8-14 weeks. Plan for it.

commonProblems:
  - title: "Pierce County PALS Plan Review Delaying Project Start by Months"
    description: "Full gut-remodels, additions, and DADU projects in University Place go through Pierce County PALS — not a fast process. Plan review on a structural remodel typically runs 8-12 weeks, and submittals with missing engineer stamps or incorrect setback calculations get kicked back and restart the clock. If you've already scheduled a Mitsubishi mini-split rough-in for a specific week, that crew isn't holding the date while the county reviews your paperwork. This plays out regularly on projects in the Chambers Bay neighborhood and along the Grandview Drive corridor — areas where DADUs and additions have picked up since WA HB 1337 passed. Permit application, plan set coordination, and inspection scheduling are part of the general contracting scope — not an afterthought."
  - title: "Structural Surprises Discovered After Demo Starts in 1960s Homes"
    description: "University Place ranchers built in the 1960s — especially the blocks between Cirque Drive and Bridgeport Way SW — commonly have undersized headers over window and door openings. Two-by-four flat stock where current IRC load requirements call for an LVL beam. Widen an opening for a Pella picture window and suddenly the structural engineer is on-site, the schedule shifts two weeks, and the budget expands mid-project. Pre-demo inspection catches most of these. Budget a 10-15% contingency on homes in this era regardless — that's not pessimism, it's what the mid-century housing stock in 98466 actually requires."
  - title: "Multi-Trade Sequencing Breaking Down Without Active Coordination"
    description: "Rough-in inspection has to pass before drywall hang starts. Electrical rough-in can't run until framing inspection clears. If the plumber doesn't show on Thursday, the whole MEP sequence backs up. Homeowners who try to coordinate subcontractors directly without a GC discover fast that nobody returns calls with the same urgency they would for a contractor relationship. This is especially true on larger remodels in University Place where the scope touches multiple systems — kitchens in the Curran Apple Orchard area, full-bath overhauls in the Grandview neighborhoods, structural additions near the Chambers Bay Golf Course side of 98466. TopVolk's contracts include a deadline penalty clause — missed milestones carry a dollar consequence, written in, not a handshake promise. That structure keeps the sequence honest on projects over $60K."

