  - q: "Do you install Tesla and ChargePoint EV charger circuits?"
    a: |
      Yes — Tesla Wall Connector (hardwired 60A or NEMA 14-50), ChargePoint Home Flex, and JuiceBox 40/48A are the most common installs. Each needs a dedicated circuit sized to the unit, proper conduit run from the panel to the garage, and GFCI protection where required by code. Permit required through City of Everett for all hardwired EV charger work. The 98208 neighborhoods east of I-5 have a high concentration of recent EV adopters in 1980s-2000s homes — panels there need load evaluation before adding a 60A circuit. Vladislav checks capacity at the walk-through so there are no surprises mid-job.
