title: "Everett ADU Construction — Add Rental Space to Your Lot"

intro: |
  Rental demand near Naval Station Everett and the Boeing Everett plant runs year-round. Military
  families, hospital staff, and aerospace contractors all compete for housing that barely exists in
  this market. WA HB 1337 (2024) changed the math: most Everett single-family lots now legally
  support two ADUs without a variance hearing. That's a real shift.

  Vladislav Volkov has built attached and detached units across North Everett and Lowell — kitchens
  finished with Bosch dishwashers, Mitsubishi mini-splits for heat and AC, and every permit filed
  through the City of Everett from start to finish.

localContext: |
  The blocks around downtown Everett (98201) are dense with Craftsman bungalows from 1910–1930.
  Post-and-pier foundations, deep lots, unfinished basements. Those basements often convert cleanly
  to attached ADUs (AADUs) with moderate structural work — new egress window, LVL beam where a
  load-bearing wall comes out, subfloor upgrade with DriCore panels over the concrete slab.

  Out in 98208 around Eastmont and Silver Lake, the stock shifts to 1970s–80s ranchers on concrete
  slabs. Different lot geometry. Those properties typically suit a freestanding DADU better —
  slab-on-grade foundation, separate utility lateral, clean separation from the main house.

  Both housing types carry different foundation conditions, utility layouts, and permit pathways.
  That distinction shapes the whole project scope before a single shovel breaks ground. Getting
  it wrong at design phase means expensive corrections after framing is already up.

commonProblems:
  - title: "City of Everett Permits vs. Snohomish County PDS — Two Different Systems"
    description: "City of Everett runs its own permit center. Entirely separate from Snohomish County
      PDS, which handles unincorporated areas like Marysville and Sultan. Plan review for a DADU in
      Everett proper averages 6–10 weeks. Pre-approved plan sets can compress that timeline — some
      projects shave three to four weeks off the front end. Vladislav files through both jurisdictions,
      so clients don't end up rescheduling rough-in inspections because the wrong agency got the
      application."
  - title: "Utility Separation for Detached ADUs — Plan It Early or Pay for It Later"
    description: "Most DADUs in Everett require separate water and sewer laterals: new meter, tap fee,
      and trenching that can run 60–100 feet across a typical backyard. That trench needs to happen
      before the foundation pour — not after. Tighter lots may qualify for a shared connection under
      Everett Public Works review, but that variance needs to be decided in design phase. Changing
      utility routing mid-build is expensive. FAR calculations lock early and don't move."
  - title: "Crawlspace Moisture Under Backyard Cottages"
    description: "Everett averages 34 inches of rain annually. DADUs on grade without proper drainage
      develop crawlspace moisture within two or three winters — wood rot on rim joists, mold on the
      subfloor, failed vapor barriers. Perimeter drains, 6-mil poly, and IRC-compliant cross-ventilation
      go in on every build. All ground-contact framing uses PT (pressure-treated) lumber. Standard
      Douglas-fir sitting directly on damp Snohomish County soil doesn't last."

faq:
  - q: "How fast can you get to Everett for an ADU consultation?"
    a: "Vladislav covers Everett regularly along the South Snohomish corridor. On-site consultations
      typically happen within a few business days. Call (206) 591-1096 to schedule a free site visit.
      We walk the lot, measure setbacks, check utility access, and hand you a realistic scope with
      lot coverage numbers — right there on the property, not in a follow-up email two weeks later.
      TopVolk is WA Licensed, and 100+ projects since 2023 means we've seen most lot configurations
      this area throws at us."
  - q: "What brands do you typically install in ADU kitchens and mechanical systems?"
    a: "Most Everett rentals land on GE or Whirlpool ranges, LG refrigerators, and Bosch dishwashers.
      Mid-range, locally serviceable, and what tenants in this income bracket actually expect. Samsung
      and KitchenAid appliances show up on owner-occupied units where the finish level steps up. For
      mechanical: Navien or Rinnai tankless water heaters handle the separate hot water system, and
      Mitsubishi mini-splits cover HVAC. Both hold up well in PNW humidity without constant maintenance
      calls from tenants."
  - q: "What does an Everett ADU cost, and how long does the project take?"
    a: "A detached DADU in Everett typically runs $130,000–$185,000. Size, finish level, and utility
      connection complexity all move that number. End-to-end — permit filing through final inspection —
      is usually 5–7 months. Basement AADU conversions move faster: 3–5 months with lighter structural
      and mechanical work. TopVolk Construction LLC is WA Licensed. Deadline penalties are written into
      the contract — that's not a verbal promise, it's a line item you can point to if a milestone
      gets missed."