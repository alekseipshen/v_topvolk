title: "Everett Insulation — Attic R-49, Crawlspace & Rim Joist Work"

intro: |
  North Everett's older blocks — Port Gardner to Rucker Hill, zip 98201 — have some of the worst attic insulation in Snohomish County. Houses from the 1910s and 1920s got R-11 at best; many haven't been touched since original construction. That Mitsubishi heat pump or gas furnace you installed runs longer cycles than it should when heat leaks straight through an under-insulated ceiling. Crawlspace moisture from Everett's 38-plus inches of annual rain compounds the energy loss. TopVolk handles attic upgrades to R-49, closed-cell spray foam on rim joists, and full crawlspace encapsulation — permitted through the City of Everett's building department.

localContext: |
  South Everett and the Silver Lake corridor (98208) run mostly 1970s through 1990s construction — builder-grade fiberglass batt that has settled, compressed, and gap-filled over 30 years of west Puget Sound freeze-thaw cycles. North of Broadway toward 98203, the housing gets older: 1940s through 1960s ranchers and Craftsman-adjacent bungalows where crawlspace vapor barriers are rotted through or were never installed. Unincorporated pockets near the city edge permit through Snohomish County PDS; homes inside Everett's limits use the city's own permit center.

commonProblems:
  - title: "Attic Insulation Below the R-49 Code Minimum"
    description: "Homes in 98201 and 98203 — downtown Everett, North Broadway, the Rucker Hill neighborhood — commonly have R-11 to R-19 original fiberglass batt that's compressed, moisture-damaged, or both. Washington State Energy Code requires R-49 in attics for Climate Zone 4C. Dense-pack blown-in cellulose over existing batt handles the irregular joist bays typical of Craftsman-era framing. Owens Corning blown-in products are what TopVolk typically specs for Snohomish County attic work — air-sealed first, insulated second."
  - title: "Crawlspace Vapor Barriers That Have Failed or Were Never Installed"
    description: "Everett gets 38-plus inches of rain annually, and crawlspace moisture is a persistent problem in north Puget Sound housing. Without a sealed vapor barrier on the crawlspace floor, moisture climbs through the subfloor and degrades floor insulation R-value over time. Rockwool ComfortBatt loses thermal performance when damp. Full encapsulation — rigid foam on crawlspace walls, sealed reinforced poly on the floor, controlled mechanical ventilation — stops the cycle and keeps subfloor temperatures stable through winter."
  - title: "Uninsulated Rim Joists and Sill Plates in Pre-1980 Homes"
    description: "Rim joists sit right where conditioned floor framing meets cold crawlspace air — a common heat-loss point in Everett's older housing stock. The original builder solution was one-inch fiberglass batt stuffed into the cavity, which barely addresses the air sealing problem. Two-inch closed-cell spray foam delivers R-13 plus a continuous air barrier in a single application. On a 1,500 sq ft footprint, that's roughly 120-150 linear feet of rim joist — a focused half-day scope with a measurable impact on heating bills."

