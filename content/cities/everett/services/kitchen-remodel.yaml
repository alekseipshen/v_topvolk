title: "Everett Kitchen Remodel — Open-Concept Upgrades for Snohomish Homes"

intro: |
  Homes along Rucker Avenue and through North Everett's pre-war grid were built when kitchens stayed small and separate — closed off from everything, designed around an icebox, not a refrigerator. A 1920s foursquare on Wetmore Avenue typically runs 90 square feet with a load-bearing wall between the kitchen and dining room, and a Whirlpool or GE range that's been there since the Clinton administration. Vladislav Volkov (TopVolk Construction, WA Licensed Contractor) has opened up over 100 of these layouts since 2023 — every wall removal gets a proper LVL beam spec and a City of Everett building permit, not a guess.

localContext: |
  The 98201 zip code covers downtown and North Everett, some of the oldest residential stock in Snohomish County. Craftsman bungalows and foursquares here date from 1910 to 1940 — post-and-pier foundations, galley kitchens, knob-and-tube wiring in a few of the untouched ones. South into 98208 (Silver Lake, Eastmont), the housing shifts to 1970s-80s split-levels: slightly bigger kitchens, but still the same closed-off floor plan and 100-amp panels that can't handle modern appliances without an upgrade.

commonProblems:
  - title: "Load-Bearing Walls in North Everett's Pre-War Homes"
    description: "Removing the wall between a galley kitchen and dining room in a 1930s Everett bungalow means engineering, not just demo. That wall typically carries roof load. A flush 3.5\" x 9.5\" LVL beam on PSL posts is the standard fix — but it requires a structural engineer stamp and a City of Everett building permit before framing starts. Skip that step and you're looking at sagging ceilings within a year."
  - title: "100-Amp Panels Can't Support Induction or Double Ovens"
    description: "A mid-range KitchenAid induction range pulls a dedicated 50-amp circuit on its own. Add a Bosch dishwasher and an over-the-range microwave, and a 1970s 100-amp panel is already over capacity. In Everett's Silver Lake and Eastmont neighborhoods, kitchen remodels routinely trigger an electrical sub-permit and a service upgrade to 200 amps before cabinet rough-in even starts."
  - title: "Cabinet Layouts That Waste Vertical Space in Split-Levels"
    description: "Builder-grade 30\" upper cabinets in 1980s Eastmont homes stop well short of 8-foot ceilings. Replacing with 42\" semi-custom cabinets — IKEA SEKTION on a budget, Fabuwood or KraftMaid in the mid-range — plus a lazy Susan or pull-out corner unit, adds 40-50% usable storage with no footprint change. Quartz countertops outlast laminate in Everett's humid climate; laminate seams swell and separate within a few PNW winters."

faq:
  - q: "How fast can you get to Everett for a kitchen remodel consultation?"
    a: "Everett is about 25 minutes from Seattle on I-5 or US-2, and TopVolk is in the Snohomish County area regularly. Call (206) 591-1096 to schedule a free on-site walk-through — Vladislav will assess load-bearing walls and give you a line-item quote the same visit."
  - q: "Do you work with Samsung, LG, and KitchenAid appliances during the remodel?"
    a: "Yes — TopVolk coordinates appliance fitment throughout the project. Whether you're putting in a Samsung French Door, an LG slide-in range, or a KitchenAid dishwasher, rough-in dimensions, dedicated circuits, and plumbing stub-outs all get spec'd to match your actual appliances before delivery day."
  - q: "What's the permit process and timeline for a kitchen remodel in Everett?"
    a: "Everett permitting runs through the City of Everett Building Division — not Snohomish County PDS, which handles unincorporated areas. Plan review for a full kitchen remodel with structural work typically takes 4-8 weeks. Construction from demo to punch list runs 6-10 weeks after permit approval. Vladislav handles permit submission and the deadline penalty clause is written into every contract. Call (206) 591-1096 to map out your specific timeline."