title: "Everett Tile Installation — Waterproof Work for PNW Homes"

intro: |
  North Everett's Craftsman-era stock along the Broadway corridor — built mostly 1910 to 1930, a few blocks from the Port of Everett waterfront — has subfloors that have settled through a century of wet winters and freeze-thaw cycles. Original 4×4 ceramic in 98201 bathrooms is typically bedded on degraded mud or cracked backer board. When homeowners remodel a bathroom or add a Bosch dishwasher with a new tile backsplash, the substrate work underneath never just fixes itself.

  Solid tile starts below the surface. Before any porcelain goes down, the subfloor deflection gets measured, the backer gets cut out, and whatever caused the original failure gets addressed — not concealed.

localContext: |
  Most 1970s and 1980s tract housing in South Everett (98203) and the Silver Lake area was built with standard drywall as a tile backer in shower surrounds — out of code for wet areas for decades. Those substrates absorb moisture, swell, and fail behind the tile long before any surface damage shows up. Snohomish County PDS handles permits in this jurisdiction; plan review runs 3–5 weeks for full bathroom remodels involving shower tear-outs and structural changes to the floor assembly.

  98208 tract homes in the east Everett corridor around Mariner and Airport Road tell the same story. Builder-grade finishes, minimal waterproofing, and forty years of Pacific Northwest winters.

commonProblems:
  - title: "Large-Format Porcelain on Settling Subfloors"
    description: "32×32 and 24×48 porcelain tiles have almost no flex tolerance. Subfloor deflection greater than 3/16 inch over a 10-foot span will crack grout joints within a single wet season. Post-and-pier Craftsman homes in 98201 often need sister joists added — each one face-nailed and construction-adhesive bonded to the existing joist, then blocking installed at mid-span to reduce bounce. After that, a Schluter Ditra uncoupling membrane absorbs any remaining micro-movement before a single tile is set. Skip the substrate work and a $4,000 tile floor fails in two winters. The prep is the job."

  - title: "Shower Waterproofing Failures in PNW Humidity"
    description: "Everett averages 37+ inches of rain annually, and daily shower steam compounds it. Tiled surrounds built without Schluter Kerdi or RedGard waterproofing behind the backer let moisture migrate into wall framing silently, for years. By the time a 98203 homeowner sees mold on the exterior drywall, the rim joist and blocking are usually rotted through. Kerdi isn't an upgrade — it's the code-compliant baseline for any tiled shower rebuild here."

  - title: "Heated Floor Wiring Sequence Under Tile"
    description: "Schluter Ditra-Heat and Warmup mats go down before the tile. The thermostat rough-in requires a dedicated circuit, which means the electrician has to complete MEP rough-in before the tile contractor touches the substrate. Sequence it wrong and the finished large-format porcelain floor comes back up to run conduit. On TopVolk projects, trade scheduling happens before the tile order is placed — because re-sequencing after demo costs three times the original coordination. Final inspection with the AHJ closes out the permit once grout and caulk cure."

faq:
  - q: "How fast can you get to Everett for tile installation work?"
    a: "Everett is about 30 miles north of Seattle — typically a 35–45 minute drive up I-5. Full coverage of the 98201 through 98208 zip code range. Call (206) 591-1096 and Vladislav will schedule a free on-site walkthrough himself. He measures the substrate, checks for deflection issues, and reviews scope before any numbers are discussed — not a sales call."

  - q: "Do you work with Schluter systems and large-format porcelain tile?"
    a: "Yes — Schluter Kerdi, Ditra, and Ditra-Heat are standard on bathroom and kitchen projects. Large-format porcelain (24×48, 32×32) requires laser-leveled substrate and an uncoupling membrane before any tile goes down. That prep step is what separates a floor that holds from one that grout-cracks in two winters. Bring your tile selections to the consultation; the substrate plan gets built around them."

  - q: "What does a full bathroom tile remodel cost in Everett, and how long does it take?"
    a: "A shower rebuild with Kerdi waterproofing, niche framing, large-format porcelain, and a bench seat typically runs $8,000–$18,000 depending on square footage and fixtures. Snohomish County PDS permits add 3–5 weeks for structural or drain work. Smaller scope — backsplash, laundry room floor, powder room — can close in 1–3 weeks if there's no structural or plumbing change involved. TopVolk is a WA Licensed Contractor — 100+ projects completed since 2017, with missed-deadline penalties written into every contract. Call (206) 591-1096 for a line-item quote from Vladislav directly."