title: "Everett Home Additions — More Space on the Lot You Already Own"

intro: |
  The postwar ranchers and mid-century split-levels packed into 98203 and 98208 were sized for smaller households — two bedrooms, one bath, no room for aging parents or a work-from-home setup. Silver Lake homeowners are adding primary suites, in-law apartments, and detached ADUs rather than fighting Everett's tight resale market. A DADU with a proper kitchenette — Bosch dishwasher, two-burner induction range, full bath — pencils out faster than a move when you're already settled in your neighborhood.

localContext: |
  Most of Everett's older residential stock sits on lots that clear City of Everett setback requirements for a detached addition. The 1950s and early 1960s blocks around Rucker Hill and the neighborhoods east of I-5 in 98201 and 98203 have plenty of underbuilt yards where a DADU can hit under the 24-foot height limit without a variance. WA HB 1337 (2024) changed the math statewide — two ADUs per single-family lot is now allowed by right across virtually the entire city. Even on the narrower parcels near Colby Avenue and the denser blocks in 98201, side-yard setbacks frequently still leave a workable footprint for a 600-to-800 sq ft detached unit. Vladislav walks every lot in person before anything gets drawn — satellite images do not show drainage grades, utility easements, or existing outbuildings that determine where a foundation can actually go.

commonProblems:
  - title: "City of Everett Permit Timeline Isn't the Same as Snohomish County"
    description: |
      Everett runs its own permit center, separate from Snohomish County PDS, which handles unincorporated areas. Plan review for an addition or DADU typically runs 5-10 weeks depending on structural complexity. Second-story additions require foundation capacity calculations and LVL beam sizing before submittal — owners who skip this step face revision cycles that add months to the schedule. Getting the structural package right on the first submission is the difference between a 6-week review and a 14-week one.
  - title: "Connecting a New Wing to 1960s Framing and Ductwork"
    description: |
      Mid-century Everett homes were framed with true-dimension lumber and ductwork sized for the original footprint. A new 400 sq ft addition means sister joists, new rim joist connections, and full MEP coordination before drywall hangs. When existing HVAC can't serve the new zone — which is common in homes from this era — a Mitsubishi mini-split keeps the project clean and avoids opening up ceiling runs throughout the house.
  - title: "Matching Siding and Roofline on Postwar and Craftsman-Era Homes"
    description: |
      Everett averages close to 37 inches of rain annually. Cedar alternatives look fine at project completion but require repainting every four to five years on north-facing surfaces where moss sets in fast. Hardie cement-board siding is the standard choice for new additions on postwar homes here — it holds paint, handles the moisture cycle, and can be profiled to match original lap siding widths on 1950s and 1960s builds.

