  - q: "Can you build a detached ADU on my Everett lot under WA HB 1337?"
    a: |
      Under WA HB 1337 (2024), most Everett single-family lots now allow up to two ADUs. A detached ADU up to 1,000 sq ft is the typical path. Before drawing anything, Vladislav walks the site to verify lot coverage, FAR limits, setbacks, and the 24-foot height cap — no guessing from a satellite image. Call (206) 591-1096 to schedule that visit.
