title: "Everett Garage Construction — Detached Builds & ADU-Ready Garages"

intro: |
  The north Everett neighborhoods around Silver Lake in zip 98208 are dense with 1970s
  split-levels — solid mid-century construction on 7,000-to-9,000-square-foot lots,
  almost all built with a single attached garage that wasn't designed for two modern
  vehicles or workshop use. Adding a detached structure in the backyard changes what the
  property can actually do. Under WA HB 1337, that same footprint can carry a finished
  studio above it — with a stacked Bosch washer-dryer roughed in from the start.
  TopVolk Construction handles these builds in Everett start to finish, permit through
  final inspection, with Vladislav Volkov leading the work directly.

localContext: |
  Older housing in the 98201 and 98202 zip codes — blocks around Bayside, Port Gardner,
  and Rucker Hill — dates to the 1920s and 1930s. Pre-war Craftsman bungalows on narrow
  lots, most without a usable garage at all. Setback requirements here are enforced by
  the City of Everett's own building department, not Snohomish County PDS, which handles
  unincorporated areas only. Concrete slabs on these builds require 4-inch minimum
  thickness, fiber-reinforced, with a vapor barrier below — the clay-heavy soils in this
  part of Snohomish County shift seasonally, and an undersized slab will show it within
  a few winters.

commonProblems:
  - title: "Narrow 1920s lots in 98201 — setback math before a single permit is filed"
    description: "Pre-war lots near Rucker Hill and Port Gardner run 40–50 feet wide.
      Hitting Everett's side and rear setback requirements while fitting a two-car
      garage leaves very little margin — the site plan has to be drawn and reviewed
      before the permit is submitted, or you lose a car's width of interior space.
      TopVolk draws the site plan in-house and files directly with the City of Everett
      building department. Plan review for a standard detached garage runs 4–8 weeks.
      These tight-lot layouts come up constantly in the 98201 zip code."
  - title: "EV charger circuit: rough-in during framing or pay twice later"
    description: "Running a 50A or 60A sub-panel circuit to the garage is clean work
      during rough-in — conduit goes into the wall cavity, the panel knockout is placed,
      and the electrician has a clear run to the main. Retrofitting after drywall is
      hung costs $1,500–$2,500 in added labor. Tesla, F-150 Lightning, or any Level 2
      charger — the pre-wire infrastructure goes in during framing at minimal added
      cost. Most Everett homeowners adding a garage today are thinking five years ahead
      on EV adoption."
  - title: "Matching a new garage exterior to 1970s split-level siding"
    description: "Most split-levels in the 98208 zip code came clad in T1-11 plywood
      panels or original cedar shake — neither weathers predictably through Snohomish
      County's October-through-May rainy season. A new detached structure next to that
      old cladding creates a visible mismatch within a few years. Hardie cement-board
      siding solves this: it holds paint evenly, resists the moss and mildew that
      accumulates on north-facing walls, and can be cut to approximate the horizontal
      lap profile on the existing house."

