title: "Everett Deck Installation — Built for Snohomish Rain and Moss Season"

intro: |
  Lowell and Delta neighborhoods in 98203 see north-facing backyards that moss
  over anything wood inside two seasons. That's the first conversation on
  every deck job here — cedar vs. composite. Trex holds color and structure
  through the Oct-to-May wet season without annual sealing. Jetty Island gets
  the summer crowds, but your deck is the space you'll actually use nine months
  out of twelve. TopVolk Construction builds decks in Everett designed around
  that reality, not around catalog photos.

localContext: |
  Silver Lake and the 98208 corridor runs mostly 1990s-2000s builder construction
  — original pressure-treated decks bolted to rim joists with no ledger flashing,
  which is exactly where rot starts. Closer to downtown at 98201 and 98203, the
  housing stock shifts to mid-century ranchers and some 1940s-50s frames where
  existing rim joist condition has to be assessed before any ledger attachment
  can be code-compliant. Both situations are common. Both need different
  approaches from the ground up.

commonProblems:
  - title: "Cedar Goes Gray and Soft Fast on Shaded Everett Lots"
    description: "North-facing or heavily treed lots in Lowell and Bayside see moss
      colonize cedar decking within 18-24 months. TimberTech and Trex composite
      boards solve the maintenance cycle, but cost 30-50% more upfront. The trade-off
      is real: composite lasts 25+ years with no sealing, cedar needs attention
      every two years or the boards cup and split by year five in Snohomish rain."

  - title: "Ledger Flashing Inspection — Snohomish County PDS Won't Skip It"
    description: "Snohomish County PDS requires a ledger flashing inspection before
      sheathing goes back on the house. The ledger bolt pattern has to match the
      rim joist size, and the flashing must lap correctly over existing housewrap.
      A re-inspection delay at this stage runs 2-3 weeks minimum. Getting the
      details right during rough-in is cheaper than a failed inspection."

  - title: "Post Footings Must Clear 18 Inches — AHJ in Snohomish Is Strict"
    description: "Frost depth in Everett runs 12-18 inches depending on site conditions,
      and Snohomish PDS enforces footing depth at inspection. Any post in ground
      contact needs UC4B-rated pressure-treated (PT) lumber minimum — standard
      above-ground PT is not the same spec. Using the wrong treatment rating gets
      flagged at rough-in and requires the footing to be dug again. Azek composite
      trim won't help you at the footing level."

faq:
  - q: "How fast can you get to Everett for a deck consultation?"
    a: "Everett — 98201, 98203, 98208 — is a regular service area. Most on-site
      consultations happen within a week. Call (206) 591-1096 directly. You'll
      talk to Vladislav, not a scheduling coordinator. He does the estimate and
      the build."

  - q: "Trex or TimberTech — which composite holds up better in Snohomish weather?"
    a: "Both outlast cedar in constant PNW moisture. Trex Enhance runs lower cost
      and holds up fine. TimberTech ProLegacy has better scratch resistance and a
      capped polymer surface that handles Snohomish freeze-thaw better at the
      foothills edge. Cedar still works if you'll actually seal it every two years.
      I'll walk through real pricing on-site for all three options."

  - q: "How long does a deck permit take through Snohomish County PDS?"
    a: "Standard deck plan review at Snohomish PDS typically runs 4-8 weeks. Smaller
      decks may qualify for over-the-counter review and move faster. Factor in
      the mid-build ledger flashing inspection. Full project timeline from permit
      submission to final inspection: 6-12 weeks depending on scope and material
      lead times. Deadline penalties for our work schedule are written into the
      contract — not a verbal commitment."