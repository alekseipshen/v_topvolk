title: "Everett Drywall Installation — Moisture-Smart Work for PNW Homes"

intro: |
  Lowell and the older blocks near Rucker Hill (98201) have housing back to the 1910s and 1920s — wood lath behind plaster, patched with mismatched drywall across decades of half-finished remodels. Silver Lake (98208) is a different era: 1970s tract construction, every ceiling textured and garage walls undersized by today's code. Snohomish County averages around 35 inches of rain annually. Skipping mold-resistant purple board in a laundry room or basement bathroom isn't a stylistic choice — it's a mold problem waiting about two years to show up behind the wall. Everett's climate is unforgiving on standard drywall in any moisture-adjacent space, and the homes here reflect every era of that lesson.

localContext: |
  The 98208 zip covers Silver Lake and the neighborhoods running north toward Everett Mall — mostly 1970s and early-80s wood-frame builds where the original drywall is still in place. Those homes need Level 5 finish work the moment you add sidewall lighting in a remodeled kitchen or bath; every trowel mark shows under a Bosch range hood or new recessed LED trim. Downtown 98201 skews older: post-WWII bungalows and Craftsman-era houses where the City of Everett requires plan review before you open structural walls. Snohomish County PDS handles permits for unincorporated parcels just outside the city boundary. For structural wall openings or fire-separation assemblies in Everett proper, plan review typically runs 3-6 weeks — factor that into any gut remodel schedule.

commonProblems:
  - title: "Popcorn Ceilings in 1970s Silver Lake Homes That Fail Under New Lighting"
    description: |
      Acoustic texture was standard in 1970s tract builds throughout 98208. During any kitchen or bathroom remodel, that texture becomes a problem the moment recessed lighting or sidewall fixtures go in — every trowel mark and hollow shows. Skim-coating over popcorn doesn't bond reliably long-term. The right approach is removal, substrate prep, and a Level 5 finish before painting. A Bosch or Moen fixture installation shouldn't be revealing 50-year-old ceiling work.
  - title: "Mold Growing Behind Drywall in Basements and Laundry Rooms"
    description: |
      Snohomish County's rainfall pushes crawlspace humidity into conditioned basement space. Standard 1/2-inch drywall in a basement bathroom or laundry room absorbs that moisture, and mold grows behind it quietly for years. The fix means removing existing board, correcting the vapor barrier on the foundation side, and replacing with mold-resistant purple board — USG Sheetrock Mold Tough is what we typically spec before taping and finishing. Blocking air infiltration at the rim joist matters too, especially in Everett homes built before vapor barrier requirements tightened through the 1990s code cycles.
  - title: "Garage Separation Walls That Fail Rough-In Inspection"
    description: |
      ADU conversions and garage remodels in Everett require 5/8-inch Type X firecode drywall on the separation wall between garage and living space — the AHJ enforces this at rough-in inspection. Older Silver Lake homes commonly have 1/2-inch standard board there, or just plywood. Snohomish County PDS applies the same IRC standard for unincorporated properties near the city edge. Failing rough-in stops the project until it's corrected. Under WA HB 1337, DADU and AADU conversions are increasingly common in Everett — and every one of them hits this inspection point.

