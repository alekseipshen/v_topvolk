  - q: "What drywall board do you spec for moisture-prone rooms in Everett?"
    a: |
      Bathrooms and laundry rooms get mold-resistant purple board or USG Sheetrock Mold Tough — not standard green board, which still absorbs moisture. At the shower, that pairs with Schluter Kerdi membrane or RedGard waterproofing membrane before any tile goes up. Shared walls or ADU separation between bedrooms get QuietRock panels or resilient channel framing for soundproofing. Product choice follows the application, not the cheapest option at the supply house.
