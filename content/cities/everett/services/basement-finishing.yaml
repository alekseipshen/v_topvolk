title: "Everett Basement Finishing — Dry, Code-Legal Living Space"

intro: |
  Homes on the bluff above Port Gardner Bay in north Everett (98201) were
  built in the 1940s and 1950s with poured concrete basements that nobody
  finished because nobody needed to. Different situation now. Those same
  800-square-foot slabs are the cheapest square footage in Snohomish County
  — if you solve the moisture problem first. A DriCore subfloor and a
  properly sloped perimeter drain separate a livable bonus room from a
  mold problem waiting to happen.

localContext: |
  South Everett — the Pinehurst neighborhood and the stretches of 98208
  nearest Paine Field — filled in heavily during the 1970s and early 1980s
  with ramblers and split-levels. Basements in that stock typically run 7'2"
  to 7'8" slab to joist, which sounds fine until the HVAC trunk line drops
  18 inches through the middle of the space. Rerouting ductwork to the
  perimeter is almost always part of the scope here. Older concrete block
  walls in 98201 show efflorescence and active seepage by October — that
  gets addressed before any framing goes in.

commonProblems:
  - title: "Failing Perimeter Drain Tile and Active Foundation Seepage"
    description: |
      Everett sits on glacial till and clay-heavy soils that hold groundwater
      against foundation walls from October through May — 37-plus inches of
      annual rainfall doesn't drain fast on clay. Original drain tile in homes
      built before 1985 is typically 4-inch clay or early corrugated plastic
      that silts over or collapses after three or four decades. The fix is an
      interior perimeter trench, new sloped drain tile, a sump basin, and a
      Zoeller sump pump with battery backup. Skipping any part of that sequence
      means mold behind the drywall within two rainy seasons.
  - title: "Egress Window Cuts for Legal Bedrooms"
    description: |
      IRC requires a minimum 5.7 square feet of net clear opening for any
      basement bedroom — roughly a 20-by-24-inch net opening after the frame.
      Original hopper windows in Everett ramblers won't meet that. Cutting a
      new opening through poured concrete or concrete block, forming an
      oversized window well with gravel drainage, and installing a Milgard or
      Pella egress unit is a structural job that requires a permit through the
      City of Everett Building Division. The permit triggers a rough-in
      inspection and a final inspection — both need to be on the schedule
      before the project closes.
  - title: "Vapor Barrier Gaps and Mold Behind Framing"
    description: |
      North-facing basement walls in Everett condensate heavily in summer when
      warm exterior air contacts cold concrete — the same climate that puts moss
      on every north-facing roof in the county. Any existing mold gets treated
      with registered biocide, then walls get a coat of RedGard elastomeric
      membrane before framing. Six-mil poly vapor barrier goes behind the stud
      wall. CertainTeed mold-resistant drywall — not standard greenboard, not
      standard moisture-resistant — goes on the finish side. Both layers matter.
      One without the other gives you the same problem back in 18 months.

faq:
  - q: "How fast can you get to Everett for Basement Finishing?"
    a: |
      Everett is a regular stop — I-5 North from Seattle or SR-99 depending
      on traffic. We schedule on-site consultations Tuesday through Saturday.
      Call (206) 591-1096 to set up a visit directly with Vladislav — no
      dispatcher, no sales staff, the person who will run the job.
  - q: "What permits does a basement finish in Everett actually need?"
    a: |
      City of Everett Building Division is the AHJ here — not Snohomish County
      PDS, because Everett is incorporated. A full basement finish with egress,
      electrical, and mechanical work requires a building permit plus electrical
      and mechanical sub-permits. Plan review typically runs 4–8 weeks. TopVolk
      pulls all permits and schedules rough-in and final inspections — that's
      included in the contract price, not billed separately.
  - q: "What does basement finishing cost in Everett, and what's the timeline?"
    a: |
      A 600–800 sq ft basement finish — framing, R-15 batt insulation, drywall
      hang/tape/mud, one bathroom rough-in, recessed lighting, and LVL beam
      work where needed — runs $45,000 to $90,000 in the current Everett
      market. Waterproofing adds $8,000–$14,000 if the perimeter drain needs
      full replacement. Egress window cuts add $2,500–$4,000 per opening
      including the permit. Timeline from permit submission to blue tape
      walkthrough and punch list is typically 10–16 weeks. TopVolk is a WA
      Licensed Contractor with 100+ projects completed since 2017. Missed
      deadlines have a penalty clause written into the contract — not a
      promise, an obligation. Call (206) 591-1096 or schedule a free on-site
      consultation to get a line-item quote, not a range.