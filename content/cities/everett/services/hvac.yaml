title: "Everett HVAC — Heat Pumps, Mini-Splits & Duct Work 98201"

intro: |
  Neighborhoods like Bayside and North Everett — built out in the late 1940s and early
  50s to house Boeing and Naval Station Everett workers — are still running original
  forced-air gas systems nobody sized for 2024 energy costs.

  A Mitsubishi inverter heat pump at 3.0+ HSPF2 cuts those bills substantially against
  a 60% AFUE gas furnace. Snohomish PUD's below-average electricity rates make that
  conversion math work better here than in most of the Seattle metro. The PUD also
  runs cash rebate programs on qualifying heat pump installs that stack on top of
  Inflation Reduction Act credits — worth running the numbers before assuming gas
  is cheaper.

localContext: |
  The housing stock in zip 98201 and 98203 — North Everett, Lowell, Pinehurst — runs
  from post-war two-bedrooms to 1960s split-levels with original galvanized duct systems.
  East toward the 98208 corridor near Silver Lake, 1990s and 2000s tract construction has
  better envelope insulation but undersized ductwork once homeowners add square footage
  or convert garages.

  Both eras create different HVAC problems. Same wet PNW winters. And the same 37+ inches
  of annual rainfall that keeps moss growing on north-facing rooflines also drives the
  humidity load that an undersized system can't handle without short-cycling.

commonProblems:
  - title: "Hot Upstairs, Cold Downstairs: Unsealed Duct Systems in Post-War Homes"
    description: |
      Original galvanized trunk-and-branch ductwork in 98201 homes loses 25–35% of
      conditioned air through unsealed joints before it reaches the registers. Duct
      pressure testing pinpoints where the air is going. Sealing with mastic compound —
      not hardware-store duct tape — combined with balancing dampers fixes the
      distribution problem without replacing the whole system.

      Daikin and Lennox equipment running into leaky ducts never performs to rated
      efficiency anyway. You can install the best inverter compressor on the market
      and still get $280 utility bills if the duct system bleeds air into the crawlspace.
      Fix the duct first, then evaluate whether the air handler itself needs replacement.

  - title: "Cracked Heat Exchanger: The Real Reason to Switch Off That Old Furnace"
    description: |
      Gas furnaces in Everett homes from the late 1980s and 90s are well past their
      service life. A cracked heat exchanger pulls combustion gases — including carbon
      monoxide — into living air. That's not an efficiency problem, it's a safety one.

      Replacing with a Mitsubishi or Daikin inverter heat pump qualifies for up to
      $8,000 in Inflation Reduction Act rebates for income-qualifying households, plus
      Snohomish PUD incentives on top. The electrical panel in most late-80s Everett
      homes runs 100–150 amp service — confirm capacity before specifying equipment,
      because a heat pump with electric backup strips can pull 30–40 amps on a cold
      snap and trip the main breaker if the panel is already loaded.

  - title: "Mini-Split Oversizing on ADU and Addition Projects"
    description: |
      Garage conversions and DADUs in the 98208 corridor — increasingly common since
      WA HB 1337 removed most city-level ADU restrictions — get undersized or oversized
      ductless systems constantly. An oversized Mitsubishi or Bosch mini-split short-
      cycles, leaving rooms humid through Everett's wet winters.

      Proper Manual J load calculation on the actual insulated square footage, not a
      BTU-per-square-foot guess, determines the right air handler size from the start.
      Vapor barrier condition in the garage slab or crawlspace matters here too —
      a converted space with no vapor control adds moisture load the HVAC calculation
      has to account for.

faq:
  - q: "How fast can you get to Everett for HVAC work?"
    a: |
      Everett is a regular project area for us. I-5 north through Lynnwood puts North
      Everett about 40 minutes from Seattle on a reasonable day. Consultations typically
      happen within 2–3 days of your call — you'll talk to Vladislav directly, not a
      scheduler. Call (206) 591-1096 to set it up.

  - q: "What heat pump and mini-split brands do you work with in Everett?"
    a: |
      Mitsubishi and Daikin are what we specify most often for ADUs and room additions —
      both have solid Snohomish County distributor support. Bosch works well for
      whole-home ductless conversions. For any brand, we verify refrigerant line sizing,
      electrical panel capacity, and condenser drain routing before the install.

      Samsung and LG ductless units come up frequently in Everett homes where a previous
      owner did a partial install. Those systems are serviceable if the line set and
      electrical were sized correctly — if not, we document what needs correction
      before recommending repair vs. replacement.

  - q: "Does HVAC work in Everett require a permit, and how long does that take?"
    a: |
      Mechanical permits through the City of Everett Building Division are required for
      new equipment installations and significant ductwork modifications — skipping this
      causes problems at resale and during inspections. Simple replacements often move
      through plan review in 1–2 weeks. Heat pump conversions with duct modifications
      run 3–5 weeks start to finish, including rough-in and final inspection sign-offs.

      TopVolk handles the permit application. WA Licensed Contractor.
      Schedule a free on-site consultation at (206) 591-1096.