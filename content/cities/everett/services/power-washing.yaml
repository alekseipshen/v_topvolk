  - q: "Do you clean Trex and TimberTech composite decking differently than cedar?"
    a: "Yes — significantly. Cedar handles up to 2,500 PSI for deep surface prep and stain readiness. Trex and TimberTech max out around 1,200 PSI before the cap layer shows pressure marks. Detergent dwell time does most of the work on composites. Nozzle angle and distance matter more than raw pressure on those surfaces."

  - q: "What does power washing typically cost for an Everett house?"
    a: |
      A standard two-story in the 98208 zip runs roughly 1,600-2,200 sq ft of surface. Soft-wash exterior cleaning typically falls in the $300-$600 range depending on story count and how much biological growth has built up. Driveways and decks price separately.

