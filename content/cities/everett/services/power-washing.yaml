title: "Everett Power Washing — Surface Prep Before Paint or Stain"

intro: |
  Salt-tinged air off Puget Sound and the Snohomish River delta shortens the maintenance cycle on Everett exteriors faster than most homeowners plan for. Cedar fences in the Lowell neighborhood and cedar shake bungalows along Norton Avenue are typically green by February. Power washing here isn't cosmetic — it's the prep step that determines whether Hardie cement-board siding holds a new coat for six years or starts peeling in two. Surface condition dictates paint adhesion. Full stop.

localContext: |
  North Everett (98201) has housing going back to the 1910s and 1940s — post-and-pier Craftsman bungalows with cedar shake exteriors and aging concrete flatwork that accumulates tire marks and embedded moss over decades. Silver Lake (98208) runs newer: mostly 1980s-90s builder-grade construction with T1-11 and vinyl siding, pressure-treated decks, and patios that see hard freeze-thaw exposure in colder winters. Heavy tree canopy in both areas accelerates organic buildup on north-facing surfaces, especially through October to May.

  The Colby and Rucker Avenue corridors in central Everett mix older commercial storefronts with residential side streets — concrete flatwork there ranges from 1950s broom-finish slabs to mid-2000s stamped concrete, each requiring a different PSI and nozzle selection. Homes near the Snohomish River delta in south Everett (98203) deal with an extra layer of salt-laden fog that accelerates mildew on vinyl siding and oxidizes Hardie panel paint faster than inland neighborhoods. Same county, noticeably different maintenance intervals.

commonProblems:
  - title: "Cedar Deck and Fence Moss Before Staining or Sealing"
    description: |
      Cedar is the default decking and fencing material on older Everett homes, and it absorbs Puget Sound moisture from October through April. North-facing boards develop a layered biofilm — moss spores, algae, and oxidized wood fiber — that blocks stain penetration completely. A soft wash with downstream-injected cleaner followed by a 1,200-1,500 PSI rinse using a 40-degree fan nozzle lifts the layer without raising the grain. Skipping this step means the new Defy or Armstrong Clark coat sits on dead material and fails within one season.
  - title: "Hardie Siding Chalk-Coat Before Exterior Repaint"
    description: |
      Hardie cement-board siding oxidizes after five to seven years — swipe your hand across it and you pick up pigment. Painting over that chalk layer causes adhesion failure fast, regardless of primer quality. A 1,500 PSI pass with a fan nozzle at proper standoff distance removes the oxidized layer and surface mildew without driving water behind the panel laps. Getting the standoff angle wrong on Hardie causes moisture intrusion at the butt joints.
  - title: "Concrete Driveway Oil and Tire Mark Removal"
    description: |
      Concrete flatwork in 98201 and 98203 — especially in front of older detached garages — accumulates motor oil, rubber deposits, and embedded organic matter over decades of use. A rotary surface cleaner running at 3,000 PSI with downstream detergent injection breaks down petroleum residue without etching the slab unevenly. Older broom-finish concrete needs a lower PSI pass — surface aggregate is already exposed, and excess pressure accelerates spalling at the edges.

