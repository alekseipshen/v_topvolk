  - q: "How fast can you get to Everett for Power Washing?"
    a: |
      Everett is a regular stop — we work throughout Snohomish County and route up from King County projects regularly. Scheduling for surface prep tied to a paint or stain project is typically within one to two weeks. Call (206) 591-1096 to confirm availability.
  - q: "Do you clean Trex and TimberTech composite decking, or just wood and Hardie?"
    a: |
      Both. Trex and TimberTech composite surfaces clean at significantly lower PSI than cedar or pressure-treated lumber — excess pressure embeds debris into the composite grain rather than removing it. We adjust nozzle type and working pressure to the specific surface material before starting. Soft wash for composite; controlled rinse for Hardie; higher PSI for concrete flatwork.
