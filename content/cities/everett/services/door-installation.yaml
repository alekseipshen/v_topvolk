title: "Everett Door Installation — Salt Air, Rain, Done Right"

intro: |
  Salt air off Possession Sound corrodes hinge hardware and strike plates faster than most homeowners expect — especially in North Everett near the waterfront in 98201, where homes from the late 1940s still have original door frames. Pulling exterior casing on a house along Rucker Avenue often exposes a sill plate that's been wicking moisture for decades under a door that looked solid from the street. Therma-Tru fiberglass units hold up well in PNW conditions. The framing behind the threshold usually needs an honest look before any door gets ordered.

localContext: |
  Everett's housing spans three distinct eras, each with different door challenges. North Everett and the Bayside neighborhood (98203) hold post-war bungalows with rough openings that weren't framed to modern tolerances — fitting a standard 36-inch entry door plumb and square often means shimming and trimming king studs to get the reveal right. East Everett around Silver Lake (98208) runs mostly 1980s-90s tract construction: builder-grade hollow-core interior doors are wearing out on schedule, and original aluminum-framed sliding patio doors lost their thermal seal integrity years ago.

commonProblems:
  - title: "Rotted Sill Plates Behind Failed Z-Bar Flashing on Post-War Homes"
    description: "Original door frames on 1940s and 50s Everett bungalows used Z-bar flashing nailed directly over cedar siding with no self-adhering membrane or housewrap underneath. After 70+ years of Everett's 37 inches of annual rainfall, corners fail first — water tracks behind the casing and into the rough opening. Replacing a Therma-Tru door takes half a day. Replacing the rotted king studs and cripple stud framing behind it can easily double the project scope. TopVolk inspects the full frame before quoting — no surprise add-ons once work starts."
  - title: "Fogged and Dragging Patio Doors in Silver Lake Tract Homes"
    description: "Sliding glass doors installed in Silver Lake homes around 1988-1995 used aluminum frames with minimal thermal break — seal failure between panes is near-universal at this age, and roller hardware has worn to the point where panels drag or jump track. Milgard and Pella multi-slide replacements fix both problems. A proper threshold with compression weatherstripping and a new aluminum sill track makes a measurable difference in heating bills through Everett's October-to-May rain season. Most of these rough openings accept a standard replacement without structural modification."
  - title: "Smart Lock Retrofits on Non-Standard Everett Entry Doors"
    description: "August smart locks and the Schlage Encode both require a 2-1/8-inch deadbolt bore in the door face and correct backset alignment with the strike plate in the jamb. Pre-1970 steel and solid-wood entry doors in older Everett neighborhoods often have non-standard backsets or door thickness under 1-3/4 inches that cause the bolt mechanism to bind. Shimming the strike plate depth and re-boring fixes most retrofits. On genuinely worn-out doors, full replacement costs about the same as fighting a 50-year-old frame."

