  - q: "Which door brands do you work with in Everett?"
    a: "Milgard, Pella, Therma-Tru, and JELD-WEN are what we spec and install most often across Everett. Each has different rough opening tolerances and flashing requirements — Pella's brick mould profile needs different caulking details than Milgard's flush-frame option. We supply and install, or install owner-supplied units after a thorough rough opening inspection to confirm the frame is square and the sill isn't soft."
  - q: "Does replacing an exterior door in Everett require a permit?"
    a: "Straight like-for-like door swaps don't require a permit through the City of Everett permit center. New openings or structural rough opening changes do — plan review typically runs 2-4 weeks. For permitted work, TopVolk handles the application as part of the project scope. WA Licensed Contractor, 100+ projects completed across Snohomish, King, Pierce, and Kitsap counties since 2023. Call (206) 591-1096 to walk through what your specific project needs before any permits get pulled."