title: "Everett Foundation Repair — Glacial Soil & Seismic Retrofits"

intro: |
  Boeing's main assembly building anchors its footprint on engineered fill near Paine Field — but six
  miles south in Everett's Delta neighborhood (98203), homes still sit on original post-and-pier
  crawlspaces from the 1930s. Those cedar posts weren't shimmed for seismic loads, and the glacial till
  under the waterfront blocks doesn't drain well after October. A Samsung front-loader vibrating on a
  floor that's drifted 2 inches out of level isn't a washing machine problem. It's a foundation problem.

  TopVolk Construction LLC is a WA Licensed Contractor with 100+ projects completed since 2023 across
  King, Snohomish, Pierce, and Kitsap counties. Vladislav Volkov handles Everett assessments directly —
  call (206) 591-1096 to schedule a free on-site consultation.

localContext: |
  The 98201 and 98203 zip codes hold most of Everett's older housing stock — Craftsman bungalows and
  early two-stories along Colby Avenue and Rucker Hill, built between 1910 and 1955. Most still have
  unimproved post-and-pier crawlspaces: no vapor barrier, original cedar mudsills, no seismic anchoring.
  Moisture accumulates under those homes every wet season, and Everett averages close to 38 inches of
  rain annually — nearly all of it landing between October and May when soils stay saturated for weeks.

  East into 98208, the Silver Lake corridor shifts to 1960s–70s slab-on-grade ranchers — a different
  failure mode, but the same damp Pacific Northwest climate accelerating it either way. Farther north
  toward the Hewitt Avenue commercial strip and south toward Lowell, you see a mix of mid-century
  construction and post-war additions that were built before Snohomish County PDS required engineered
  foundation plans. Those additions sometimes bear on inadequate footings that have settled independently
  from the original structure.

commonProblems:
  - title: "Post-and-Pier Settlement in Delta and Rucker Hill Neighborhoods"
    description: |
      Soils in the waterfront-adjacent blocks of 98203 stay saturated from October through April.
      Cedar posts rot upward from ground contact, and the bearing points shift unevenly season after
      season. Correction means replacing failed posts with PT (pressure-treated) lumber columns or
      adjustable steel lally columns, then shimming the main carrying beam back to within 3/8-inch
      tolerance. Where the original carrying beam has sagged, sistering with an LVL beam restores
      load path without full replacement. Snohomish County PDS requires a structural permit for this
      scope of work — plan for 3–5 weeks of review before work begins.

  - title: "Concrete Crack Repair and Epoxy Injection on Slab Foundations"
    description: |
      Silver Lake and Airport Road corridor homes from the 1960s and 70s use slab-on-grade construction.
      Hairline cracks are normal concrete shrinkage. Diagonal cracks running from the corners of door
      or window openings indicate differential settlement — a different problem. Two-part epoxy
      injection seals structural cracks and stops water infiltration, which matters in a city that averages
      38 inches of rain a year. Simpson Strong-Tie perimeter anchor systems address voids where soil has
      eroded beneath the slab edge. Deadline penalties for schedule overruns are written into every
      TopVolk contract — call (206) 591-1096 to get a line-item quote.

  - title: "Seismic Retrofit — Mudsill Bolting and Cripple Wall Shear Panels"
    description: |
      Washington sits in Seismic Zone D2, and most pre-1980 homes in 98201 and 98203 have no mudsill
      anchor bolts — the sill plate rests on the foundation with nothing holding it down. A full seismic
      retrofit installs anchor bolts at 6-foot maximum spacing per IRC requirements, adds plywood shear
      wall panels at crawlspace cripple walls, and reinforces framing where an LVL beam or PSL post is
      undersized. Snohomish County PDS issues the permit; rough-in and final inspections are required.

