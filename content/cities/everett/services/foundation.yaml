  - q: "What does foundation repair typically cost for an Everett home?"
    a: |
      Post-and-pier leveling on a 1,200 sq ft crawlspace runs $8,000–$18,000 depending on access and
      how many posts have failed. A full seismic retrofit for a Craftsman bungalow is $4,500–$9,000.
      Written line-item quotes upfront — no vague estimates. Snohomish County PDS permits are included
      in scope. Deadline penalties are written into the contract: if we miss the committed completion
      date, we pay. 100+ projects completed since 2023 across the Seattle metro.

  - q: "Do you pull permits for foundation work in Snohomish County?"
    a: |
      Yes — structural foundation work requires it. Seismic retrofits, post replacements, new concrete
      footings: all trigger either a City of Everett permit or Snohomish County PDS review depending on
      your parcel location. Plan review runs 3–6 weeks. TopVolk handles the submittal as part of the
      project. WA Licensed Contractor. Call (206) 591-1096 to get started.

  - q: "What's the difference between a structural problem and a drainage problem?"
    a: |
      Most Everett homeowners see standing water in the crawlspace and assume the foundation itself is
      failing. Sometimes that's true. Often the bearing posts are fine but the vapor barrier is missing
      or torn, and the mudsills are absorbing moisture without bearing load problems yet. Vladislav
      walks the crawlspace during the assessment and separates the two before recommending scope.
      Fixing drainage alone — French drain, vapor barrier, ventilation — costs far less than structural
      work. Getting the diagnosis right upfront saves money. Schedule a free on-site consultation at
      (206) 591-1096 and get a straight answer before committing to anything.