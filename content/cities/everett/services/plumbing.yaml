  - q: "Do you install Rinnai and Navien tankless water heaters in Everett homes?"
    a: |
      Both, yes. Navien NPE series and Rinnai RU-series are the two we see most in Everett remodels. Installation includes sizing the gas supply line, pulling the Snohomish County PDS permit, and scheduling rough-in and final inspections — not just dropping the unit in. Call (206) 591-1096 for a line-item estimate before any work begins.
  - q: "What does a water heater replacement cost in Everett, and who handles the permit?"
    a: |
