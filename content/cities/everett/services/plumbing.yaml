title: "Everett Plumbing — Old Pipes, Permits & PEX in Snohomish County"

intro: |
  Homes along Rucker Avenue and through the Bayside neighborhood were mostly built before World War II — galvanized supply lines and cast-iron drain stacks still run in a lot of them, unmodified. Boeing's postwar workforce packed south Everett with mid-century ranchers through the 1950s and 1960s, and those houses are now 65-70 years past original plumbing that was never touched during kitchen or bathroom updates. A full PEX repipe or Rinnai tankless water heater conversion here runs through Snohomish County PDS. TopVolk, a WA Licensed Contractor, handles the permit application, coordinates rough-in and final inspections, and writes the completion deadline into the contract with a penalty clause.

localContext: |
  The 98201 zip — downtown Everett and Bayside — holds the city's oldest residential stock. Craftsman bungalows from the 1910s through the 1930s still commonly run original galvanized supply lines and cast-iron drain stacks; post-and-pier foundations with damp crawlspaces accelerate corrosion from below during Everett's long wet season. Silver Lake (98208) is a different problem: 1980s tract development where polybutylene pipe was the standard install. Homes along Mukilteo Boulevard and near Everett Community College represent a third era — 1950s and 1960s ranchers where galvanized has been calcifying quietly for decades, typically unnoticed until a Kohler shower drops to a trickle.

commonProblems:
  - title: "Galvanized Supply Lines Killing Water Pressure in Pre-1960 Everett Homes"
    description: |
      Galvanized steel corrodes from the inside out. After 60-plus years of Everett's treated city water, the interior bore on many of these pipes has narrowed badly — pressure at every Moen or Kohler fixture downstream suffers noticeably. Rust-colored water after returning from a trip is the other reliable signal. A full PEX-A repipe restores flow through the entire house, not just a patched section, and that corrosion problem doesn't come back.
  - title: "Polybutylene Pipe Failures Across Silver Lake and South Everett (98203)"
    description: |
      Polybutylene was the default supply pipe in 1980s Snohomish County tract construction — Silver Lake and south Everett (98203) have a lot of it still inside the walls. The material degrades at compression fittings first, typically inside wall cavities and without warning. Everett's wet winters mean any slow leak compounds fast. When a fitting lets go, water damage starts and doesn't stop until the main is shut. PEX-A replacement is the only durable fix, and Snohomish County PDS requires a permit for full repiping work.
  - title: "Tankless Water Heater Conversions and the Gas Line Problem"
    description: |
      Rinnai and Navien tankless units draw a significantly higher BTU load on demand than any storage tank. Most 1970s and 1980s Everett homes run ¾-inch black iron gas supply lines — not enough to support that draw without pressure drop. The unit error-codes and shuts off mid-shower. Proper conversion means upsizing the gas supply line to at least 1-inch, pulling a Snohomish County PDS permit, passing a rough-in inspection, and clearing a final inspection before the unit goes live.

