title: "Everett Handyman Services — Fixes That Actually Get Done"

intro: |
  The bungalows and post-war ranchers along Colby Avenue and through Lowell (98203)
  pile up small jobs in a way that bigger remodels don't. A Whirlpool faucet leaking
  past two rainy seasons. Weatherstripping so flattened it stopped sealing entirely.
  TopVolk handles these punch-list items for Everett homeowners — the work that stays
  undone because no single trade wants a half-day call.

  Vladislav takes calls directly. No dispatcher.

localContext: |
  Housing in Everett spans several distinct eras. Blocks near the waterfront and the
  Historic Colby neighborhood run craftsman and bungalow stock from 1910 to 1940 —
  original wood trim, older casement windows, and exterior surfaces that have taken
  decades of Snohomish County rain.

  Out in Silver Lake (98208), 1970s and 80s tract development brought aluminum-framed
  windows and builder-grade fixtures that are aging out now. The foam weatherstripping
  compressed into nothing. Deck hardware corroded through. Door sweeps worn flat before
  the second owner ever moved in.

  South Everett (98203, 98204) adds another layer: 1990s construction hitting its first
  serious round of deferred maintenance — GE dishwashers with drain issues, LG range
  hoods losing their seal, interior doors that no longer latch cleanly after the framing
  settled. Each era has a different punch list. Each one is real work, not a YouTube fix.

commonProblems:
  - title: "Rotted Exterior Trim and Fascia on North-Facing Walls"
    description: |
      North-facing walls on Everett's older homes stay damp from October through April.
      Cedar fascia boards, window trim, and corner boards from the 1940s–70s build era
      are frequently at end-of-life — spongy to the touch, paint failing, sections
      pulling away from the wall. We cut out the damaged material, install Hardie
      cement-board or PT lumber replacement pieces, and re-caulk all seams before
      prime and paint.

      That stops the rot cycle instead of painting over it. Every home along Rucker
      Avenue and down into the Bayside neighborhoods has at least one wall that fits
      this description.

  - title: "Deck Board Replacement and Corroded Railing Hardware"
    description: |
      Pressure-treated deck boards from the 1990s are now pushing 30 years. Most are
      cupping, splitting at knots, or soft near the ledger board connection where water
      pools longest. We replace individual boards or full deck surfaces, inspect the
      rim joist and joist hanger hardware for corrosion, and re-secure or replace
      railings where post bases have rusted through.

      Common on Lowell and Bayside homes where decks haven't been touched since the
      original build. Silver Lake houses from the same era show the same pattern —
      especially on west-facing decks that catch the full Puget Sound weather.

  - title: "Door Frame Racking and Weatherstripping Worn to Nothing"
    description: |
      Silver Lake homes from the 1970s and 80s run aluminum-frame windows with foam
      weatherstripping compressed down to a sliver. Entry doors have similar issues —
      door sweeps worn flat, frames racked a few degrees after decades of settling.
      We add V-strip and closed-cell foam tape to window channels, replace door sweeps,
      and adjust strike plate position where the latch no longer catches cleanly.

      For homes running a Mitsubishi mini-split, tightening the building envelope shows
      up as a measurable drop in heating cost by the first cold snap. It's not a minor
      detail — air sealing at the door and window perimeters is where the heat loss
      actually lives in these older builds.

faq:
  - q: "How fast can you get to Everett for Handyman Services?"
    a: |
      Everett is a regular stop — Snohomish County is inside our core service area.
      From North Seattle we're typically 35–45 minutes depending on I-5 conditions
      north of Lynnwood. Call (206) 591-1096 to check current availability; we give
      you a confirmed appointment window, not a four-hour block.

  - q: "Do you work on Moen, Kohler, and Samsung fixtures?"
    a: |
      Yes — Moen faucet swaps, Kohler toilet installs, GE and Samsung dishwasher drain
      hookups are all standard handyman scope. Whirlpool supply line replacements,
      Bosch dishwasher door latch adjustments, KitchenAid range hood filter swaps —
      all of it. We handle the mechanical swap and connection. If a job needs permitted
      rough-in work under Snohomish County PDS jurisdiction, we'll tell you before we
      start — not after we're halfway through the wall.

  - q: "How is handyman work priced and what should I expect?"
    a: |
      Scope-based line-item pricing — Vladislav walks the job, writes out what each
