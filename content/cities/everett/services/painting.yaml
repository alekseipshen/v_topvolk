title: "Everett Painting — Lead-Safe Prep & Cedar Cycle for Snohomish Homes"

intro: |
  Silver Lake and the older blocks ringing downtown Everett (98201) hold a lot of
  pre-1978 housing — Craftsman bungalows, four-squares, and mid-century ranchers
  where the original paint has been layered over a half-dozen times. North-facing
  cedar shake on those homes goes gray and mossy inside two wet seasons. Hardie
  siding holds longer, but still needs a power wash and two-coat acrylic cycle on
  a 5-7 year clock. TopVolk runs that full sequence — pressure wash, spot prime,
  finish coats — around Everett's rainy shoulder seasons, not through them.

localContext: |
  The 98201 and 98203 zip codes carry significant pre-1978 housing stock where
  federal EPA RRP rules apply to any project disturbing more than six square feet
  of painted surface. Snohomish County PDS doesn't require a separate permit for
  a straight exterior repaint, but if painting is part of a larger remodel
  — an addition, window replacement, or siding swap — plan review enters the
  picture. Silver Lake (98208) skews 1990s-2000s tract builds where the issue
  shifts from lead paint to faded builder-grade latex and moisture infiltration
  around window casings. Different problems. Same climate: 35+ inches of rain a year.

commonProblems:
  - title: "Cedar shake and Hardie siding losing paint adhesion after 5-7 PNW seasons"
    description: |
      Heavy rain from October through May keeps north-facing surfaces perpetually
      damp, which breaks paint film faster than anything else in this climate.
      The fix is a specific prep sequence: pressure wash at 1,500-2,000 PSI, TSP
      rinse on mildewed areas, spot-prime bare wood with an oil-based primer, then
      two coats of 100% acrylic exterior — Sherwin-Williams Duration or Benjamin
      Moore Aura both hold up on cedar here. Skip any of those steps and you're
      repainting in three years instead of seven.
  - title: "Lead-based paint in pre-1978 Everett homes — EPA RRP compliance required"
    description: |
      Much of the housing in 98201 and 98203 predates the 1978 lead paint ban.
      Before any sanding, scraping, or surface prep, an XRF analyzer or certified
      swab test determines lead presence. Under EPA RRP rules, certified contractors
      must use HEPA vacuums, plastic containment, and documented cleanup — not
      optional for any home built before 1978. Fines run $37,500 per violation per
      day. TopVolk is RRP-certified and handles testing coordination before the
      first brush touches the wall. WA Licensed Contractor.
  - title: "Cabinet repainting after kitchen remodels — adhesion failures on MDF doors"
    description: |
      Cabinet repainting costs a fraction of replacement, but it fails fast when
      prep gets skipped. MDF door faces telegraph grain and peel within a year if
      you roll standard latex over them without a bonding primer. On Bosch or
      KitchenAid semi-custom boxes — common in Everett's 1990s-era kitchen remodels
      — the finish needs to stay wipeable and hold up to daily use. TopVolk uses
      a two-step process: degloss, 220-grit sand, shellac-based bonding primer,
      then two coats of waterborne alkyd. It cures harder than latex and doesn't
      yellow.

faq:
  - q: "How fast can you get to Everett for a painting estimate?"
    a: |
      Everett is a regular stop — TopVolk works throughout Snohomish County from
      Lynnwood up to Marysville. Call (206) 591-1096 to book a free on-site estimate
      with Vladislav directly. Most Everett appointments land within 3-5 business
      days. For exterior projects, we try to schedule estimates before the fall
      rains lock in.
  - q: "Which paint brands do you use for Everett's wet climate?"
    a: |
      For exteriors, Sherwin-Williams Duration Exterior and Benjamin Moore Aura
      are the standard — both carry strong moisture resistance and flex through
      Snohomish County's freeze-thaw shoulder seasons. For bathrooms and laundry
      rooms, Behr Marquee or SW Emerald with a mold-resistant additive. No
      substitutions for lower-grade products to protect margin.
  - q: "What does an exterior repaint actually cost and how long does it take in Everett?"
    a: |
      A 1,800-2,200 sq ft single-family exterior typically runs 4-6 working days:
      one day pressure washing and caulk repair, one day priming, two to three
      days finish coats. Total project window with weather gaps is 1.5-2 weeks.
      Snohomish County PDS doesn't require a permit for a straight repaint. Call
      (206) 591-1096 for a line-item quote — Vladislav quotes directly, no
      commissioned estimator. Deadline commitments are written into the contract,
      with penalties paid if we miss them. TopVolk has completed 100+ projects
      across the Seattle Metro since 2023.