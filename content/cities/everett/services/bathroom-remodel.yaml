title: "Everett Bathroom Remodel — Waterproofing That Holds Through PNW Rain"

intro: |
  Split-levels and post-war colonials near Rucker Avenue and the North
  Everett waterfront (98201) were built without waterproofing membranes
  behind the tile — just greenboard drywall and decades of Pacific
  Northwest humidity doing their work. Port Gardner Bay keeps this city
  damp eight months a year. Moen fixtures from the original build are still
  in most of these bathrooms, corroded at the supply line connections, with
  tile grout so cracked it's basically decoration at this point.

localContext: |
  Silver Lake homes in 98208 and the 1980s-90s tract builds spreading
  south toward Evergreen Way (98203) were put up fast — and the bathroom
  substrates show it. No vapor barrier, no blocking behind future grab-bar
  locations, ventilation ducted sideways into the soffit instead of up
  through the roof. Older north Everett bungalows from the 1920s-1940s
  carry a different problem: cast-iron drain stacks that haven't moved
  since they were installed, original galvanized supply lines, and
  foundations that shift enough to crack tile in the first five years
  after any remodel done without proper subfloor prep.

commonProblems:
  - title: "No Waterproofing Membrane Behind Shower Walls"
    description: "Pull tile off a 1975 Everett shower and you'll find greenboard — sometimes
      plain drywall — with no Schluter Kerdi, no RedGard, nothing. Thirty years
      of moisture from PNW showers have worked behind the tile face. We strip
      it to studs, install a full Kerdi or RedGard membrane system, and reset
      large-format porcelain over a surface that won't fail in another decade."

  - title: "Cast-Iron Drain Stack Conflicts in Older North Everett Homes"
    description: "Converting a tub alcove to a curbless shower or moving a toilet in a
      pre-1960 Everett home means cutting into a cast-iron drain stack —
      a rough-in job that requires a permit and rough-in inspection through
      the City of Everett Building Division before anything closes up.
      Stack rerouting adds 1-2 weeks but skipping it means failed inspections
      or buried leaks that show up three years later."

  - title: "Ventilation Failure Feeding Mold Cycles Through Silver Lake Bathrooms"
    description: "A 50 CFM builder-grade fan exhausted into the soffit can't beat an
      Everett winter. The mold comes back every spring no matter how often it's
      bleached. The real fix is a 110 CFM fan — Kohler or Broan — ducted
      straight up through the roof, combined with RedGard on shower walls and
      a vapor barrier behind any cement board before Schluter strips go down."

faq:
  - q: "How fast can you get to Everett for a bathroom remodel consultation?"
    a: "Vladislav runs Everett regularly — about 30 minutes from Seattle via I-5,
      less from Lynnwood. Most consultations happen within 3-4 days of your
      call. Reach out at (206) 591-1096 to schedule a free on-site walkthrough.
      No sales staff — you're talking directly to the contractor."

  - q: "What fixture brands do you typically work with on Everett bathroom remodels?"
    a: "Kohler and Moen are in nearly every Everett home we open up. For new
      builds we spec Kohler vanities, Moen or Delta pressure-balance valves
      for shower rough-ins, and Rinnai tankless if the project includes a
      water heater upgrade. Mid-range fixtures that hold up — not budget box
      store, not Sub-Zero pricing."

  - q: "What does a bathroom remodel cost in Everett and how long does it take?"
    a: "Full master bath gut-and-rebuild — layout changes, new shower, vanity,
      tile — runs $35K-$75K in Everett. Budget 6-9 weeks total: City of
      Everett Building Division plan review takes 2-4 weeks, rough-in
      inspection mid-project, blue tape walkthrough before final sign-off.
      All quotes are line-item. Vladislav pulls permits himself. Deadline
      penalties are written into the contract — TopVolk has completed 100+
      projects since 2017 as a WA Licensed Contractor, and missed deadlines
      cost us money, not you."