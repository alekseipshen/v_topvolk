title: "Everett Window Installation — Paine Field Noise & PNW Rot"

intro: |
  Flight testing out of Paine Field adds a layer of noise that older double-pane windows in North
  Everett just aren't built for.

  The neighborhoods around 98201 — Craftsman blocks built before 1950, post-war ranchers closer to
  the waterfront — are also taking the full force of Snohomish County's 35+ inches of annual rain.
  Milgard's fiberglass Tuscany series handles both problems better than the builder-grade vinyl that's
  still sitting in thousands of these houses. The STC (Sound Transmission Class) rating difference
  between a standard IGU and a laminated acoustic unit is real — audible on a quiet Tuesday morning
  when Boeing is running flight checks on a 737 MAX.

localContext: |
  The 98201 and 98203 zips cover the older residential core — 1920s-1940s Craftsmans near Grand
  Avenue, early post-war stock in Lowell and Bayside, a lot of original divided-light windows that
  haven't been touched in 40 years.

  East toward Silver Lake in 98208, the housing shifts to 1980s-90s builder-grade vinyl where failed
  IGU seals and draft infiltration are the main complaints. North Everett's exposure to Port Gardner
  Bay means salt air rides the prevailing southwest wind straight into window frames on anything facing
  west — that accelerates vinyl oxidation and aluminum track corrosion faster than you see in inland
  zips like Snohomish proper or Monroe. The Riverside neighborhood near the Snohomish River delta sits
  low enough that ground-level moisture wicks into exterior trim year-round, and original wood frames
  from the 1940s ranchers there are usually soft well before the glass fails.

  Permit-required window work goes through City of Everett Development Services — not Snohomish County
  PDS — since Everett operates as its own AHJ.

commonProblems:
  - title: "Failed IGU Seals in 1980s-90s Builder Vinyl"
    description: |
      Builder-grade vinyl units installed across Silver Lake and Bayside in 98208 around 1988-1995 are
      past their service life. Once the argon fill escapes the insulated glass unit (IGU) seal, fogging
      between panes is permanent.

      Milgard and Pella both offer replacement glass for older frames, but warped vinyl sashes — common
      after years of PNW moisture cycling — usually mean a full retrofit is the cleaner fix. A
      replacement sash swap only makes sense when the frame tracks are still square and the rough
      opening framing is dry. More often in 98208, it isn't.

  - title: "Egress Window Deficiencies in Converted Basements"
    description: |
      Older Everett ranchers with converted basement bedrooms often have slider windows that fail IRC
      egress requirements — minimum 44-inch sill height from floor, 20-inch width, 5.7 sq ft net clear
      area. Most original basement units miss at least one dimension.

      Widening the rough opening into a concrete or block foundation wall typically requires a new LVL
      beam header and a permit through City of Everett Development Services before rough-in inspection.
      The plan review for this type of structural work usually runs 3-5 weeks. Vladislav submits the
      permit application as part of the project scope — call (206) 591-1096 to get a site look before
      assuming your existing opening is close enough.

  - title: "Missing Sill Pan Flashing on North Everett Craftsmans"
    description: |
      Pre-1950 Craftsmans in the 98201 zip were built without modern flashing detail — no sill pan,
      no head flashing integration with the WRB (weather-resistant barrier). Decades of heavy rain
      work into those gaps.

      Marvin Integrity windows include factory-applied sill pan flashing, but the rot usually starts
      at the rough sill framing before the new unit even goes in. Replacing the sill plate and
      sister-joisting adjacent framing adds a day to the job, sometimes two if the king stud is also
      compromised. Skipping it means the new window sits on soft wood and you're back in the same
      position in eight years. That repair sequence is standard practice on any North Everett
      Craftsman job — it's not optional, and any contractor who doesn't flag it hasn't looked closely.

