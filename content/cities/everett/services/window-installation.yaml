  - q: "Which window brands do you install in Everett homes?"
    a: |
      Milgard Tuscany and Style Line series are the most common choice here — manufactured in Tacoma,
      solid warranty, fit standard retrofit rough openings cleanly. Pella 250 series and Marvin Elevate
      fiberglass are options when thermal performance or divided-light grille matching matters for older
      Craftsman homes in 98201. For basement egress conversions, Andersen 400 series casements are
      worth looking at — the narrow frame profile helps when the rough opening is tight.

      TopVolk is a WA Licensed Contractor — 100+ projects completed since 2017.

  - q: "Does window replacement in Everett require a permit?"
    a: |
      Direct like-for-like replacements (same size opening, no structural change) are often exempt.
      Any rough opening enlargement — including egress upgrades or adding a window where none existed —
      needs a permit through City of Everett Development Services. Plan review for standard residential
      window permits typically runs 2-4 weeks; structural work with an LVL header can push that to
      5-6 weeks depending on current queue. Vladislav handles permit submission as part of the project.
      Deadline commitments are written into the contract with penalties for missed dates. Call
      (206) 591-1096 to walk through what your specific job requires.