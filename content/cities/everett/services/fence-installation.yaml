title: "Everett Fence Installation — Posts That Hold in PNW Soil"

intro: |
  Clay-heavy lots north of Evergreen Way in the 98204 zip don't forgive shallow post
  footings. Heavy rain rolls in off Port Gardner Bay from October through April, and
  posts set at 20 inches start leaning by the third winter. TimberTech composite panels
  have been gaining ground in this part of Everett for exactly that reason — no
  greying, no warping, no annual staining.

  Vladislav Volkov has set fence posts across 100+ projects in Snohomish and King
  counties since 2017. WA Licensed Contractor. You talk to the person doing the
  work — not a dispatcher, not a salesperson. Call (206) 591-1096 to get a real
  site visit scheduled.

localContext: |
  Most of Everett's 98201 and 98203 zip codes are post-war worker housing — tight lots,
  aging cedar fences from the late 1980s, and property lines that sometimes don't match
  the original plats recorded when the Boeing corridor neighborhoods were first platted.
  Silver Lake (98208) runs a bit newer but hits the same drainage issues in low spots.
  The Pinehurst area near 19th Street SE has a particular run of lots where grade drops
  toward the back — water sits against fence posts for weeks after a heavy event.

  Cedar installed in the mid-90s on these lots is typically checking, posts have shifted,
  and gate hardware has corroded through 30 years of PNW salt air and rain. That's not
  a repair situation. That's a full replacement job.

commonProblems:
  - title: "Post Depth in Everett's Clay Soil — Where Most Fences Fail"
    description: "Clay-dominant soil in the 98204 and 98201 corridors retains water year-round.
      Posts set at 18-20 inches heave and shift. Correct depth here is 30-36 inches with
      a concrete footing poured below the frost line — especially on any run adjacent to
      a grade change. A 6-foot cedar fence with shallow footings leans toward the neighbor's
      yard by year three.

      That's a full reinstall, not a straighten-and-brace patch. Pressure-treated 4x4
      posts with properly sized tube-form concrete footings are the baseline. On runs
      longer than 100 feet, corner and end posts go deeper still — 40 inches on some
      Everett lots where the clay layer doesn't break until you're past three feet."

  - title: "Cedar vs Vinyl on North-Facing Runs in Pinehurst and Bayside"
    description: "North-facing fence sections in Pinehurst and Bayside stay wet from October
      into May. Cedar boards moss over in two years without annual treatment — and most
      homeowners skip it. Vinyl holds color without maintenance, but cheaper vinyl panels
      bow in Everett's occasional July heat.

      Trex and TimberTech make fence-specific composite panel systems that split the
      difference: PNW-durable, no painting, no rot. They cost more upfront than cedar.
      Over a ten-year window in Everett's climate, the math usually flips."

  - title: "Permit Requirements for Front Yard and Retaining Wall Fences"
    description: "City of Everett limits front yard fences to 4 feet without a variance.
      Side and rear runs max at 6 feet. Anything attached to or built above a retaining
      wall over 4 feet tall triggers a separate permit review — the City reviews fence
      and wall loads together.

      Snohomish County PDS handles unincorporated parcels on Everett's eastern fringe,
      toward Cathcart and the Highway 2 corridor. Different jurisdiction, different
      application process, different plan review timeline. Skipping permits creates
      title issues at resale. TopVolk pulls the permits; it's included in the
      project scope."

faq:
  - q: "How fast can you get to Everett for a fence estimate?"
    a: "Everett is a regular run — I-5 north from Seattle or Highway 99 depending on
      traffic, typically 35-45 minutes from the city. Site visits happen weekdays and
      some Saturdays. The Everett waterfront and the neighborhoods east toward
      Paine Field are all in rotation. Call (206) 591-1096 to schedule directly
      with Vladislav — no sales staff, no call center. You get a contractor on site,
      not someone reading from a tablet."

  - q: "Do you install composite fencing like Trex or TimberTech in addition to cedar?"
    a: "Yes — both Trex and TimberTech offer fence panel systems purpose-built for wet
      climates. We source and install both. At the site visit we can show samples
      alongside cedar and vinyl so you can compare weight, look, and long-term
      maintenance honestly. No pressure toward a specific material. For Everett
      lots with north-facing exposure or low drainage, composite usually makes
      more sense over a ten-year horizon. Cedar still works fine on south-facing
      runs with proper post depth and PT lumber at ground contact."

  - q: "What's the timeline and permit process for a fence installation in Everett?"
    a: "Standard 150-foot cedar or vinyl fence with one gate: 2-4 days of installation
      once materials arrive. Materials lead time is typically 3-7 business days depending
      on supplier stock — composite panels sometimes run longer.

      If a permit is required — front yard, retaining wall combo, or any run over
      6 feet — City of Everett plan review adds 2-4 weeks. Snohomish County PDS
      review for unincorporated lots can run 3-5 weeks. We handle the permit
      application and AHJ coordination from start to finish. Deadline penalties
      are written into the contract — if we miss the agreed installation date,
      there's a financial consequence on our end, not just an apology."