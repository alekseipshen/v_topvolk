title: "Everett Fence Installation — Posts, Permits, PNW Materials"

intro: |
  Legion Memorial Park sits a few blocks from some of Everett's oldest residential streets in the
  98201 zip, where narrow lots and aging property surveys make fence placement more complicated
  than it looks. Snohomish County PDS requires permits for fences tied to retaining walls over
  4 feet — a detail that catches homeowners off guard at resale. TopVolk handles installs across
  Everett, from Silver Lake down to south Everett, with Vladislav on-site and direct line-item
  quotes. Call (206) 591-1096 to schedule.

localContext: |
  Southwest Everett near 98203 has a dense mix of post-war Craftsman homes and 1970s split-levels
  sitting on clay-heavy soil that retains water long after rain stops. Posts set at 18 inches
  fail here — 30-36 inches in concrete footings is the baseline. Further north, Silver Lake
  (98208) has newer HOA subdivisions where fence height limits from Snohomish County PDS and the
  HOA CC&Rs can conflict, requiring coordination before a single board goes in. Lot lines are
  another variable in these older Everett neighborhoods: survey pins get moved by decades of
  landscaping, utility work, and tree roots. Vladislav walks the property line before any post
  goes in — no surprises for the neighbor, no fence that needs to come out six months later.

  Terrain changes everything on sloped lots.

  The east Everett hillside lots near the 98203-98201 boundary often require step-fencing rather
  than racking — the fence runs in level sections stepping down the grade instead of following
  the slope. More posts, more cuts, and sometimes a permit drawing review if the grade change
  triggers retaining wall classification under Snohomish County PDS rules. It's a detail that
  gets missed in drive-by estimates. Snohomish County PDS plan review typically runs 3-5 weeks
  for fence-with-retaining-wall submittals; that timeline gets built into the project schedule
  from day one, not discovered after the deposit clears.

commonProblems:
  - title: "Posts Heaving After One or Two Winters in Clay Soil"
    description: |
      Everett's clay soil in the 98201 and 98203 areas drains slowly after heavy rain.

      Posts set without a gravel drainage layer at the base trap moisture around the concrete
      footing, accelerating freeze-thaw heave even in Everett's mild winters. QUIKRETE fast-set
      concrete with a 4-6 inch crushed-rock base and posts driven to 36 inches depth corrects
      this. Budget installs rarely include the gravel — it's a shortcut that shows up within
      two rainy seasons.

      The fix after the fact means pulling posts, repouring footings, and resetting pickets.
      Doing it right the first time costs less than doing it twice.

  - title: "Cedar Graying and Rotting on North-Facing Fence Runs"
    description: |
      Western Red Cedar is the standard PNW fence material, but north-facing panels in Everett's
      tree-shaded yards gray out and go soft in 5-7 years without annual sealing. Pressure-treated
      (PT) posts with cedar pickets above grade hold up better than all-cedar.

      Bufftech vinyl panels by CertainTeed don't rot or require sealing and are increasingly
      common in Silver Lake and Pinehurst where mature Douglas-fir canopy keeps fence boards
      damp nine months a year.

      Composite options like Trex split the difference — wood appearance without the maintenance
      cycle, and a 25-year warranty that outlasts most cedar installs by a decade. The material
      choice matters most on north-facing runs where sun never fully dries the boards between
      October and May.

  - title: "Gate Hardware Failing on Daily-Use Side Gates"
    description: |
      Gates on residential lots in Everett take constant abuse — dogs, kids, delivery access.
      Cheap butt hinges twist out of plumb within a year on heavier cedar or Trex composite gates.

      D&D Technologies TruClose self-closing hinges, sized for the gate weight, stay aligned
      without seasonal adjustment and include a built-in latch hold-back for when the gate needs
      to stay open. Soft-close versions eliminate the slam that irritates neighbors on a shared
      property line.

      Gate posts need to be set deeper than line posts — at least 42 inches in concrete. That
      extra depth resists the rotational pull and swing load of a gate working against saturated
      Everett clay soil every single day.

faq:
  - q: "How fast can you get to Everett for Fence Installation?"
    a: "Everett is a regular stop — I-5 north or Highway 99 depending on traffic. Most
      consultations can be scheduled within a week. A straightforward privacy fence on a flat
      lot typically takes 2-3 days once materials arrive. Sloped lots, HOA submittals, or
      retaining wall permits add time — usually 3-5 weeks for Snohomish County PDS review
      before any digging starts. Call (206) 591-1096 and I'll give you an honest timeline
      based on what the job actually requires."

  - q: "Do you install vinyl fencing, or is cedar the only option?"
    a: "Both are standard. Bufftech by CertainTeed and Trex composite are the most common
      low-maintenance requests in north Everett — no painting, no staining, no sealing every
      spring. Cedar with PT posts and stainless-steel fasteners is still the majority of
      installs and the right call when budget matters and the homeowner doesn't mind maintenance.
      Chain-link stays popular in south Everett for pet containment where visibility and
      durability matter more than aesthetics.

      The quote covers all three options with line-item pricing, so the comparison is
      apples-to-apples. No bundled package pricing."

  - q: "Does an Everett fence installation need a permit from Snohomish County?"
    a: "Standard 6-foot privacy fences within the City of Everett typically don't require a
      permit — but fences attached to retaining walls over 4 feet always do, processed through
      Snohomish County PDS. HOA approval runs on its own timeline, sometimes 4-6 weeks before
      the board responds.

      TopVolk identifies what's required at the consultation and pulls permits where needed.
      The homeowner doesn't navigate PDS submittal requirements solo — that's part of what
      WA Licensed Contractor work covers on a project like this."