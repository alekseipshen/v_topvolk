title: "Edgewood General Contracting — Full Remodels & ADUs, 98372"

intro: |
  Puyallup River sits a few miles east of Edgewood Town Park, and the residential
  streets running off Meridian Avenue E are where we've logged a good chunk of work
  lately. Homes here from the late 1990s and early 2000s are hitting the age where
  one project pulls another — a Bosch or Thermador appliance upgrade triggers a
  kitchen gut, which opens the wall, which reveals framing that needs to meet current
  IRC load requirements. Vladislav Volkov handles these projects directly. 100+ projects
  completed since 2023, WA Licensed Contractor.

localContext: |
  Most of Edgewood's housing stock in 98372 went up between 1990 and 2008 — split-levels
  and two-story colonials built during Pierce County's suburban expansion years. The
  neighborhoods along Jovita Boulevard E and 9th Street W have homes with 200-amp
  electrical panels, builder-grade cabinets, and crawlspaces that haven't seen a vapor
  barrier since original construction. Pierce County's wet winters — 40+ inches of annual
  rainfall — mean that unprotected crawlspace moisture shows up in the floor structure as
  rotted rim joists and failed blocking within 10-15 years.

commonProblems:
  - title: "Multi-Trade Scheduling Across a $100K+ Project"
    description: "Framing, electrical rough-in, plumbing, and HVAC mechanical don't overlap —
      they sequence. A rough-in inspection delayed by Pierce County PALS backs up all four
      trades simultaneously. MEP coordination is the hardest piece to manage on a full Edgewood
      renovation. Deadline penalties are written into the contract — so delays cost us, not you."
  - title: "Load-Bearing Wall Removals in 1990s Split-Levels"
    description: "Opening the kitchen-to-living wall in a 1990s Edgewood split-level almost always
      requires an LVL beam sized to current IRC load path requirements — well above what the original
      builder used. Engineering drawings, a structural permit amendment through Pierce County PALS, and
      a follow-up inspection add 3-5 weeks before framing resumes. Budget for it at the start."
  - title: "Budget Drift When Homeowners Self-Manage Subcontractors"
    description: "Trades booked independently don't read each other's plans. A Mitsubishi mini-split
      ductwork run installed without checking the framing plan gets torn out and redone — on the
      homeowner's tab. Blue tape walkthroughs at each phase milestone catch conflicts before drywall
      covers them. Every project starts with a direct quote and line-item scope."

faq:
  - q: "How fast can you get to Edgewood for General Contracting?"
    a: "Edgewood is a direct run down SR-167 or Pacific Avenue from our regular Pierce County
      work area. On-site consultations with Vladislav are typically available within 3-5 business
      days. Call (206) 591-1096 — no sales staff, no dispatcher, direct to the owner."
  - q: "Do you handle kitchen remodels with Bosch or Thermador appliances in Edgewood?"
    a: "Yes. Bosch, Thermador, and KitchenAid are the brands we see most often in 98372 kitchens.
      A Thermador range hood over 900 CFM needs a dedicated makeup air path and a 6-inch duct
      run — we spec the rough-in before appliances are ordered so nothing gets torn out post-install."
  - q: "What does the Pierce County PALS permit process look like for a full renovation?"
    a: "Structural renovations in 98372 go through Pierce County PALS — plan review typically
      runs 6-10 weeks for whole-house work, shorter for cosmetic-only scopes. Vladislav manages
      the application and inspection scheduling. Call (206) 591-1096 to walk through your specific
      scope and get a realistic timeline before anything is committed."