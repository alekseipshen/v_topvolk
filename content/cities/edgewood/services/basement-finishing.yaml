  - q: "What does a basement waterproofing and finishing package cost in Edgewood?"
    a: "A complete basement finish with waterproofing — perimeter drain, sump pump, framing, insulation, drywall, and flooring — runs $45,000-$95,000 in Edgewood, depending on square footage, ceiling height corrections, and whether you're adding a bedroom, bathroom, or wet bar. Waterproofing alone, if the basement's already framed and just needs a perimeter drain tied into a battery-backup sump pump, runs $6,000-$11,000. Egress windows add $4,500-$7,800 each. Every estimate comes from a free on-site visit with Vladislav and line-item pricing — no vague per-square-foot guess over the phone. Call (206) 591-1096 to schedule a walkthrough and get an exact number."
  - q: "Do I need a permit to finish a basement in Edgewood?"
    a: "Yes — Edgewood's Community Development Department requires a permit for any basement finish that adds living space, a bedroom, or a bathroom, and reviews it against the IRC (International Residential Code) rather than routing it through Pierce County PALS, since Edgewood is its own incorporated jurisdiction. Plan review typically takes 3-5 weeks for a straightforward finish, longer with an egress window or plumbing reroute. We handle the application, the plan set, and inspection scheduling — rough-in inspection for framing, electrical, and vapor barrier, then final inspection before the punch list. TopVolk is a WA Licensed Contractor and pulls the permit under our name, not yours."
  - q: "Can you fix a basement ceiling that's under 7 feet after framing?"
    a: "Older split-levels and ranches around Meridian Ave often have 6-foot-8 or lower clearance once you account for ductwork and framing, and code generally wants 7 feet of finished ceiling height in habitable basement rooms. We fix it by rerouting HVAC trunk lines tight against the joist bays, sistering an LVL beam to eliminate a mid-span support post, or dropping the soffit only where ducts actually run instead of across the whole ceiling. Sometimes a Mitsubishi mini-split replaces bulky ductwork entirely, buying back 4-6 inches without touching the framing. We measure this during the free estimate, before you get a bid you can't rely on."
  - q: "How long does a finished basement hold up in Edgewood's climate?"
    a: "With a working perimeter drain, a battery-backup sump pump, and mold-resistant drywall like CertainTeed's M2Tech, a finished basement in Edgewood should hold up 20+ years without moisture issues, even through the wet Pacific Northwest winters that run October through May. DriCore subfloor panels are rated for the life of the structure. We warranty our workmanship and stand behind the waterproofing system specifically, since that's what fails first if it's done wrong — most warranty calls we get on other contractors' work trace back to a skipped vapor barrier or an undersized sump pump, not the drywall or flooring."
