    a: "Edgewood sits right off SR 167 and SR 512, about a 20-25 minute drive from TopVolk's typical Pierce County jobs, so scheduling a walkthrough usually happens within the week. Most residential fence lines — 150 to 300 linear feet — install in 2 to 4 days once materials are on-site, weather permitting since wet clay soil slows post-hole digging. Access matters too: gate-width delivery paths get materials staged faster than tight side-yard lots. Call (206) 591-1096 to get on the schedule or book a free on-site consultation with Vladislav directly."
  - q: "What does fence installation in Edgewood cost per foot?"
    a: "Cedar picket runs roughly $28-$45 per linear foot installed, vinyl panel like Illusions or CertainTeed runs $38-$58/ft, and Trex composite fencing runs toward the higher end around $50-$70/ft depending on panel style and gate count. Sloped lots, extra gates with self-closing hardware, and retaining wall combinations push cost up. Every quote is a walked, measured, line-item number from Vladislav on-site — not a phone estimate — and it's free. Call (206) 591-1096 for a walkthrough."
  - q: "Do I need a permit to build a fence in Edgewood?"
    a: "Fences under 6 feet in side and rear yards, and under 4 feet in front setbacks, typically don't require a separate permit through the City of Edgewood Community Development Department, but retaining wall fences or anything combined with a wall over 4 feet does need plan review, usually 2-3 weeks. TopVolk Construction, a WA Licensed Contractor, verifies zoning setbacks and property lines before digging and handles permit submission when required. Unincorporated parcels near Frederickson fall under Pierce County PALS instead — the process differs slightly, and TopVolk knows both."
  - q: "Cedar or vinyl — which holds up better in Edgewood?"
    a: "Cedar picket looks better initially and costs less upfront, but it needs restaining every 3-4 years and the grade board tends to rot first in wet clay soil. Vinyl panels from CertainTeed or Illusions, and composite options like Trex Seclusions, cost more per foot but need essentially zero maintenance and resist the freeze-thaw cracking that hits lower-grade vinyl near the foothills. For gates, D&D Technologies self-closing hinges and a Mighty Mule opener add convenience on either material. Vladislav can walk through both options and real cost-over-10-years numbers on-site."
  - q: "What's the warranty on a new fence from TopVolk?"
    a: "Workmanship is covered for 2 years, including post movement, gate alignment, and hardware failure — not typical wear like cedar graying, which is expected weathering, not a defect. Material warranties pass through from the manufacturer: Trex and CertainTeed vinyl typically carry 20-25 year limited warranties against cracking and fading. Expected lifespan in Edgewood's climate runs 12-18 years for stained cedar and 20-25 years for vinyl or composite with proper post depth. Deadline penalties are written into every contract, not just promised verbally."
