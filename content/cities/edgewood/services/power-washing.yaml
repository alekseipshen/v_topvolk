  - q: "What does soft-wash power washing cost in Edgewood?"
    a: "Most single-family jobs in Edgewood run $350-$900 total, depending on how many surfaces you're combining — roof, siding, deck, driveway, and fence pricing all stack differently. A roof-and-gutter moss treatment alone typically runs $400-$650, while a driveway-only job is often under $300. We give a written line-item quote on-site before any work starts, not a phone estimate, so you know exactly what you're paying for each surface."
  - q: "Does power washing in Edgewood require a permit or HOA approval?"
    a: "Pierce County PALS doesn't require a permit for exterior cleaning, but several Edgewood developments have HOA architectural guidelines requiring siding cleaned before repaint approval goes through. We're a WA Licensed Contractor and we'll pull together whatever documentation your HOA committee wants — before-photos, product safety sheets, whatever's needed. Stormwater runoff near drains does fall under county regulation, so we use containment mats on driveway and paver jobs close to storm inlets."
  - q: "Will pressure washing damage my Hardie siding or cedar shake?"
    a: "Straight high-pressure washing can drive water behind Hardie panels and crack cedar shake, so we run a soft-wash process instead — low PSI, a diluted sodium hypochlorite mix, and a controlled dwell time before rinsing. It's the same method CertainTeed and James Hardie recommend in their own cleaning guidelines to keep the warranty intact. Stucco and painted trim get an even lighter touch to avoid pitting the finish coat."
  - q: "How long does a power washing job last before regrowth?"
    a: "Roof and deck moss treatments typically hold 2-3 years, especially with a zinc strip added at the ridge line to slow spore regrowth. Fences and paver patios usually need recleaning on that same 3-5 year window before staining. We don't warranty against new organic growth — that's just PNW weather — but workmanship on the cleaning itself is guaranteed, and we'll tell you honestly if a surface needs sealing instead of just washing."
