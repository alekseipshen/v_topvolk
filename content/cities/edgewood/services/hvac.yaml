title: "Edgewood WA HVAC — Heat Pump & Mini-Split Installs"

answer: "TopVolk handles HVAC installs — heat pumps, ductless mini-splits, and 95% AFUE furnaces — for homes in Edgewood, Washington. Owner-led, 100+ projects completed since 2017."

intro: |
  A Bosch heat pump quote on the kitchen counter near Meridian Avenue is usually what starts the conversation. TopVolk handles HVAC work for homes throughout Edgewood — heat pump conversions, ductless mini-split installs, furnace replacements, and duct sealing. Most single-system HVAC swaps finish in one to two days once the mechanical permit clears.

  Edgewood sits on the ridge between Sumner and the Jovita area. A lot of the housing stock out here runs on propane instead of natural gas, since Puget Sound Energy's gas main never reached every lot on the larger, semi-rural parcels the city is known for. That changes the math on an HVAC conversion fast. Homeowners near Jovita Booth Gulch Park are often swapping a propane furnace that costs three times as much to run as an electric heat pump, and the IRA rebate covers a real chunk of the difference.

  Additions and DADUs going in under WA HB 1337 usually need a dedicated ductless HVAC system, not a tap off the main trunk line. TopVolk quotes every HVAC project with line items, not ranges. Vladislav is the one on-site pulling the permit and running the install.

localContext: |
  Most of the housing in Edgewood is a mix of 1970s-80s daylight ranchers and split-levels on larger lots. A newer wave of custom-built homes went up from the 2000s on out toward the White River side of town. Both zip codes, 98371 and 98372, cover the city.

  The older ranch homes usually run one forced-air furnace and one thermostat trying to condition a home that's been added onto twice. That's why hot-cold room complaints are common in the Meridian corridor. Newer custom builds already have 95%+ AFUE furnaces and central AC from the builder. But the ductwork is frequently undersized if a homeowner later wants to add a bonus room or finish a bedroom over the garage — and that undersized duct run becomes an HVAC problem fast once a heat pump gets added.

  Edgewood is its own incorporated city, but it doesn't run a full building department. Mechanical permits for HVAC work typically route through Pierce County PALS for plan review, which adds a week or two to anything beyond a like-for-like swap. Crawlspace foundations are common on the older lots, so vapor barrier condition and duct insulation in that space matter as much as the HVAC equipment itself.

commonProblems:
  - title: "Heat pump conversion from a propane furnace"
    description: "A lot of Edgewood homes still run a propane-fed furnace with a standing tank out back. Once that unit hits 15-18 years old, the heat exchanger starts cracking and the furnace short-cycles. TopVolk swaps it for a Bosch or Mitsubishi heat pump sized to actual heat loss, not just the old furnace's BTU rating, and reuses the existing ductwork where the static pressure allows it. The propane tank gets pulled or capped. The outdoor condenser sits on a new pad with a refrigerant line set run to the air handler. The reversing valve is what lets the same HVAC unit heat in January and cool in August. Most single-family HVAC conversions run $9,000-$16,000 depending on ductwork condition, and the IRA rebate can knock several thousand off that for qualifying incomes. Install typically takes two days once permits clear."
  - title: "Ductless mini-split installs for additions and DADUs"
    description: "Edgewood lot sizes are big enough that a detached ADU under WA HB 1337 is a realistic project for a lot of homeowners here. Running new ductwork out to a standalone structure rarely pencils out. TopVolk installs Mitsubishi and Daikin wall-cassette mini-splits instead — one outdoor condenser feeding one or two indoor heads, connected by a line set and a condensate pump if there's no gravity drain available. A single-zone HVAC system for a 400-600 sq ft DADU usually runs $6,000-$9,000 installed, permit included. Bonus rooms over garages and finished basements near Jovita get the same treatment, since tapping the main trunk line usually starves the rest of the house. The Pierce County PALS mechanical permit for a mini-split moves faster than a full furnace swap — often 1-2 weeks for plan review versus 3-4 for a furnace and venting change."
  - title: "High-efficiency furnace replacement and the permit workflow"
    description: "Swapping a 15-year-old 80% AFUE furnace for a 95%+ AFUE model isn't a straight box swap. The higher-efficiency unit condenses flue gas, so it needs PVC intake and exhaust venting instead of the old metal flue. It also needs a new condensate drain routed to a floor sink or condensate pump. TopVolk pulls the mechanical permit through Pierce County PALS before HVAC work starts, since Edgewood contracts its plan review out rather than running its own building department. Rough-in gets inspected before the wall closes up, then a final inspection signs off on the venting and gas or propane line. Bosch and Trane both make solid 95%+ AFUE furnaces TopVolk installs regularly. Budget 1-2 weeks for permit turnaround on a straight replacement, longer if the venting run changes."
  - title: "What a full HVAC project actually costs in Edgewood"
    description: "Pricing swings on four things: equipment tonnage and brand, ductwork condition, permit complexity, and whether the job is a straight swap or a full system change — furnace to heat pump, for example. A single-zone mini-split runs $6,000-$9,000. A whole-home heat pump conversion with new ductwork runs $12,000-$22,000. A 95%+ AFUE furnace with an AC add-on lands around $14,000-$19,000 depending on duct capacity. TopVolk gives a line-item HVAC quote after an on-site walkthrough, not a phone estimate, and every contract has a deadline penalty written in — if the job runs past the agreed date, Vladislav pays it, not the homeowner. Equipment carries manufacturer warranties (Mitsubishi and Bosch both run 10-12 years on parts with registration), and labor is warrantied separately. Call (206) 591-1096 for a walkthrough and a real HVAC number, not a range."
  - title: "Maintenance, lifespan, and when to replace instead of repair"
    description: "A gas or propane furnace in this climate typically runs 15-20 years before the heat exchanger starts cracking. A heat pump's compressor usually lasts 12-15 years with annual HVAC service. Ductwork sealing matters more than most homeowners think — mastic-sealed plenums and boots stop 20-30% duct leakage. That leakage shows up as hot and cold rooms, especially in the older ranch homes with ductwork run through an unconditioned crawlspace. TopVolk rebalances dampers and reseals joints as part of any duct-connected HVAC install, and adds a Nest or ecobee thermostat with zoning where a home has that hot-cold split. If a furnace needs a second heat exchanger repair in five years, replacement usually wins on cost. Filters should be swapped every 60-90 days regardless of system type — mini-splits included."

faq:
  - q: "How fast can you get to Edgewood for HVAC work?"
    a: "TopVolk runs HVAC projects out of the South Sound. Edgewood is a short drive off SR-167 and SR-512, usually 20-30 minutes depending on where the crew is coming from that day. Most residential streets here have driveway parking, so there's no truck-access issue like you'd get in a dense Seattle neighborhood. A straight furnace or mini-split swap is typically scheduled within one to two weeks of the signed contract, once equipment is ordered. Call (206) 591-1096 and Vladislav will walk you through timing on your specific HVAC project."
  - q: "What does a heat pump or mini-split install cost in Edgewood?"
    a: "A single-zone ductless mini-split runs $6,000-$9,000 installed. A heat pump conversion off an existing furnace runs $9,000-$16,000. A full HVAC system replacement with new ductwork can run $12,000-$22,000. The biggest cost drivers are ductwork condition, equipment brand and tonnage, and whether the job is a like-for-like swap or a full system change. TopVolk doesn't quote HVAC work over the phone — Vladislav walks the crawlspace and attic first, then sends a line-item number, not a ballpark range. Ask for a free on-site consultation before comparing quotes from anyone giving you a number sight unseen."
  - q: "What's the permit process for HVAC work in Edgewood?"
    a: "Edgewood is incorporated, but it contracts mechanical plan review out to Pierce County PALS rather than running its own building department. Permits for anything beyond a like-for-like HVAC equipment swap go through the county's online portal. TopVolk pulls the permit before work starts, schedules the rough-in inspection once refrigerant lines and ductwork are run, and closes out with a final inspection on venting and electrical disconnects. Typical turnaround is 1-2 weeks for a straight swap, 3-4 weeks if the scope includes new ductwork or a system change. TopVolk is a WA Licensed Contractor and handles the HVAC paperwork directly — no separate permit-runner or subcontractor juggling forms."
  - q: "Can my existing ductwork handle a new AC unit or heat pump?"
    a: "For an AC add-on to an existing forced-air furnace, sizing depends on the ductwork already in the house, not just the square footage. Undersized trunk lines choke airflow and short-cycle the compressor regardless of how big a condenser gets installed. TopVolk runs a static pressure check and a Manual J load calc before quoting tonnage, then matches an evaporator coil to the existing air handler where the cabinet allows it. Bosch, LG, and Samsung all make condensers that work well paired into an existing plenum. If the ductwork can't handle it, a ductless mini-split add-on for problem rooms is usually the cheaper HVAC fix compared to resizing the whole trunk system."
  - q: "What's the warranty and expected lifespan on new HVAC equipment?"
    a: "Heat pump compressors from Mitsubishi and Bosch typically carry 10-12 year parts warranties when registered within 60 days of install. Both brands hold up fine through Puget Sound winters since they're rated well below freezing for heating capacity. Furnaces run a similar 10-year parts warranty, with the heat exchanger sometimes covered longer separately. Labor on any TopVolk HVAC install is warrantied for one year, and every contract has a deadline penalty clause — if the crew misses the agreed completion date, TopVolk pays it. Expect 15-20 years of service life from a furnace and 12-15 from a heat pump compressor with annual maintenance."
  - q: "Do you cover cities near Edgewood, and how far out is scheduling?"
    a: "TopVolk covers Edgewood alongside Sumner, Puyallup, Bonney Lake, and the rest of Pierce County, plus King, Snohomish, and Kitsap counties for larger remodel and ADU-connected HVAC work. Scheduling windows run 1-4 weeks out depending on season — spring and fall book up faster with heat pump conversions ahead of summer and winter. Since 2017, TopVolk has completed 100+ HVAC and remodel projects across the Seattle Metro area, all owner-led with Vladislav on-site rather than a rotating crew. Call (206) 591-1096 or schedule a free consultation to get on the calendar."