  - q: "Does Edgewood require its own building permit for an addition or ADU?"
    a: "Yes — Edgewood issues its own building permits through its Community Development Department rather than routing through Pierce County PALS, which mainly covers unincorporated areas nearby. We prepare the full submittal package: site plan, structural drawings, and ADU-specific paperwork required under WA HB 1337 if you're adding a second unit. Plan review typically runs 6-10 weeks for a detached ADU and 4-8 weeks for most additions. TopVolk is a WA Licensed Contractor and manages the entire permit process directly with the city."
  - q: "Can my existing foundation carry a second-story addition?"
    a: "It depends on how the original footings were sized, which is why we bring in a structural engineer before any framing decisions get made. Most 1970s and 1980s Edgewood ranches need an LVL beam or PSL post added at key bearing points, and sometimes a new footing poured under an interior wall to handle the extra load. Skipping this step shows up later as sagging floors or cracked drywall. We build the engineering cost into the estimate up front so there's no surprise mid-project."
