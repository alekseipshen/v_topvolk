title: "Edgewood Home Additions — ADUs & Second-Story Experts"

answer: "TopVolk Construction builds home additions, DADUs, and second-story expansions in Edgewood, Washington — 100+ projects completed since 2023, owner-led by Vladislav Volkov."

intro: |
  Two ADUs per lot changed the math for Edgewood homeowners the day WA HB 1337 took effect, and TopVolk Construction has been fielding calls ever since from families near Jovita Park and off Meridian Ave E asking what actually fits on their property. A home addition here almost never starts with the same question twice — one household wants a mother-in-law suite with its own entrance before a parent moves in from out of state, another wants a second story because the lot's too tight for a DADU near the White River corridor. Vladislav Volkov runs every one of these jobs personally, from the first site visit to the final walkthrough, so the person pricing your kitchen appliance rough-in (Bosch dishwasher, LG range, whatever you're running) is the same person swinging the hammer. TopVolk has completed 100+ projects since 2023 across Pierce, King, Snohomish, and Kitsap counties, and Edgewood's mix of split-entry ranches and newer subdivision homes brings its own structural puzzles. A missed deadline in the contract carries a real penalty — not a vague apology.

localContext: |
  Edgewood sits between Puyallup and Sumner, and most addresses here fall under zip codes 98371 and 98372, shared mail routing with Puyallup since Edgewood's own incorporation in 1996 came later than the postal boundaries. Housing stock skews toward 1970s and 1980s split-entry and daylight-basement ranches near the Meridian corridor, plus newer 2000s-era subdivisions closer to Jovita Park and the Edgewood Community Park area — different eras, different structural starting points for an addition crew. Older split-entries often have a daylight basement that can absorb a mother-in-law suite with minimal foundation work, while the newer builds already meet current energy code but need custom design work to avoid a boxy tack-on look. Edgewood issues its own building permits through its Community Development Department rather than routing through Pierce County PALS, though PALS still governs a few unincorporated pockets near the city's edges toward Sumner. Rain load matters too — Pierce County sees roughly the same 35-40 inches a year as Seattle, and any second-story tie-in or dormer needs proper ledger board flashing and rim joist detailing or you're looking at rot within a few winters.

commonProblems:
  - title: "ADU construction under WA HB 1337 — figuring out what your lot actually allows"
    description: "State law now allows up to two ADUs per single-family lot, but Edgewood's zoning still governs setbacks, lot coverage, and height limit (typically 24 ft for a DADU), and plenty of homeowners assume the state law overrides all of that — it doesn't. We run the lot coverage and FAR numbers before drawing anything, then size the DADU or AADU to what the parcel can carry, including a separate utility connection for water and sewer. A detached unit near Jovita Park runs roughly $180,000-$250,000 depending on finish level, with Milgard windows and a Mitsubishi mini-split for heating and cooling being the common baseline. Plan review typically adds 6-10 weeks before framing even starts."
  - title: "Second-story additions and whether the existing foundation can carry the load"
    description: "A lot of Edgewood's 1970s and 1980s ranches were built with footings sized for a single story, and stacking a second floor on top means recalculating point loads down to the foundation, not just framing new walls. We typically spec an LVL beam or PSL post at key bearing points, sister joist the existing floor framing where needed, and sometimes pour a new footing under an interior bearing wall to carry the added weight. Skipping this step is how you get bouncy floors and drywall cracks two years later. Structural engineering review adds time and cost — usually $2,500-$5,000 — but it's not optional once you're adding real square footage overhead."
  - title: "Mother-in-law suites with a separate entrance, kitchenette, and code-required egress"
    description: "Parents moving in usually want their own door, their own kitchen, and their own bathroom, which means the addition has to meet accessory dwelling code even if it's attached rather than detached. That means a proper egress window in any sleeping room, a rated separation wall if it shares a stud bay with the main house, and its own mechanical zone — often a Rinnai tankless unit or a dedicated mini-split rather than tying into old ductwork that wasn't sized for the extra load. Edgewood's permit center reviews these as AADU submittals, and plan review generally runs 4-8 weeks depending on how much of the existing structure is affected. TopVolk is a WA Licensed Contractor and handles the full submittal package, including the site plan showing setback compliance."
  - title: "What a home addition actually costs and what drives the number up or down"
    description: "Most additions in this price bracket run $150-$300 per square foot, with the spread driven by foundation work, finish level, and whether you're matching existing rooflines or starting fresh. A second-story addition on an existing ranch tends to land on the higher end because of the structural retrofit; a single-story bump-out with a slab-on-grade foundation runs cheaper. Kitchen and bath finishes inside an addition push the number too — quartz counters and a Bosch or KitchenAid appliance package cost more than builder-grade, but they're what most Edgewood buyers in this income bracket expect. Every quote is line-item, not a range, and the contract includes a penalty clause if we miss the agreed completion date. Call (206) 591-1096 for a free on-site estimate with actual numbers."
  - title: "Matching siding, roofing, and finishes so the addition doesn't look tacked on"
    description: "Edgewood's older split-entries were mostly built with lap siding that's since weathered differently than anything new, so a straight material match rarely looks right after five years of sun and rain exposure. We generally re-side the full elevation with Hardie fiber-cement rather than patching, since Hardie holds paint and resists the moss and mildew buildup common on north-facing walls in this climate. Roofing gets tied in with proper step flashing at the addition's new roofline, not just caulked and hoped for. Composite decking like Trex on any new deck off the addition avoids the rot problems that plague untreated lumber here, and it holds up longer than cedar with less upkeep."

