  - q: "What does foundation crack repair in Edgewood cost?"
    a: "A single epoxy or polyurethane crack injection typically runs $850 to $2,400 in Edgewood, depending on crack length and whether there's active water intrusion behind the wall. Larger jobs — multiple cracks plus a drainage correction or a new sump pump tied into a French drain — push the total to $4,000 to $7,000. Pricing depends heavily on crawlspace access, clay soil conditions common on the plateau, and how much excavation the drainage fix requires around the footing. TopVolk provides a free on-site estimate with exact line-item pricing after walking the crawlspace personally, not a phone quote, so nothing gets added mid-job."
  - q: "Does foundation repair in Edgewood require a permit?"
    a: "Most structural foundation work — pier replacement, seismic retrofit, stem wall repair — needs a permit, either through the City of Edgewood building department or Pierce County PALS when the city refers the review out. TopVolk pulls the permit, prepares the structural scope description and photos for plan review, and schedules the rough-in inspection before the crawlspace or wall gets closed back up, plus a final inspection to close the permit. Simple cosmetic crack sealing without structural work usually doesn't trigger a permit, but anything involving epoxy-set anchor bolts or shear wall plywood does. TopVolk is a WA Licensed Contractor and handles the paperwork directly — Vladislav manages every permit himself, no back office involved."
  - q: "Can you fix a foundation without excavating the whole yard?"
    a: "Most of Edgewood's foundation work happens from inside the crawlspace or through targeted excavation right at the problem area, not a full yard dig. Pier leveling and post replacement are done entirely from underneath the house with hydraulic jacks and LVL or PSL replacement posts. Crack injection is handled from the interior or exterior face of the wall depending on which side shows the active crack. A French drain or downspout tie-in typically needs a trench 12 to 18 inches wide along just the affected section, not the whole perimeter, which keeps landscaping disruption minimal and the yard back to normal within a few days of backfill."
  - q: "How long does a foundation repair last in this climate?"
    a: "A properly executed pier replacement or seismic retrofit should outlast the rest of the house — pressure-treated posts and galvanized hardware are rated for decades of ground contact, even with Pierce County's roughly 40 inches of annual rainfall. Epoxy-injected cracks are a permanent structural repair as long as the drainage issue causing the movement gets addressed at the same time; skip the drainage fix and a new crack can open nearby within a few years. TopVolk backs workmanship with a warranty that transfers to the next owner if the home sells, which matters at resale since foundation issues are one of the first things a home inspector flags."
