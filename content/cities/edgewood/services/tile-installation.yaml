title: "Edgewood Tile Installation — Ramblers to New Builds"

answer: "TopVolk Construction installs and waterproofs tile in Edgewood, Washington — WA Licensed Contractor, 100+ projects since 2017."

intro: |
  Vladislav Volkov and TopVolk Construction LLC install and waterproof tile for showers, kitchen backsplashes, and heated bathroom floors across Edgewood, Washington — full line-item quotes, no subcontracted tile crew standing in for the guy who bid the job. A kitchen remodel near Jovita Boulevard last spring needed a full-height quartz-and-porcelain backsplash built around a new Thermador range hood, and the electrical relocation for the under-cabinet lighting had to happen before a single tile went up. That's the sequencing problem homeowners on the North Hill ridge run into more than they expect: tile is usually the last trade in, but it exposes every mistake the trades before it made. Edgewood's mix of older ramblers near Surprise Lake and newer cul-de-sac builds off Meridian Avenue means substrate conditions vary a lot from one job to the next — some floors are dead flat OSB, some are 40-year-old plywood with a quarter inch of dip across a doorway. TopVolk Construction has completed 100+ tile and remodel projects across the Seattle Metro area since 2017, and Vladislav still walks every Edgewood job site himself before quoting it. Call (206) 591-1096 for a free on-site look before you buy tile.

localContext: |
  Most of Edgewood splits across 98371 and 98372, with older rambler-style homes concentrated closer to Surprise Lake and newer construction filling in the cul-de-sacs off 24th Street East and Jovita Boulevard on the North Hill ridge. The ramblers, plenty of them built in the 1970s and 80s, came with builder-grade tub surrounds and thin-set laid directly over particle board — substrate that's failed in most of the ones we've opened up. Homes going up now near the Edgewood Community Park area at 36th Street East and Meridian Avenue East get slab-on-grade or engineered subfloor, which holds large-format porcelain a lot better than the old stuff. Pierce County sees real rain from October through May, and Edgewood sits high enough on the ridge that wind-driven moisture gets into bathroom exhaust paths when the fan venting wasn't sized right — that moisture load is exactly what a Schluter Kerdi shower assembly is built to handle. Electrical work tied to heated floor systems (Ditra-Heat, Warmup) needs a permit pulled through City of Edgewood, coordinated with Pierce County inspectors for the rough-in.

commonProblems:
  - title: "Shower Waterproofing That Fails Behind the Tile, Not On It"
    description: "The membrane that actually stops water is Schluter Kerdi, not the grout — and on showers we've re-done near Surprise Lake, the original install skipped it entirely and relied on thin-set and hope. Pierce County's rain season keeps bathroom humidity high enough that a pinhole in a cheap vapor barrier behind the tile turns into black mold on the far side of the wall within two years. We rebuild the assembly with Kerdi membrane at the walls and floor, a properly sloped Kerdi shower pan, and a foam curb wrapped instead of framed with dimensional lumber that'll rot. A niche gets Kerdi-Board, not just backer board and RedGard brushed on afterward. A standard 60-square-foot shower tear-out and rebuild runs about $9,500 to $14,000 depending on tile choice, and takes 10-12 working days including the cure time required before tiling."
  - title: "Large-Format Porcelain Telegraphing Every Substrate Dip"
    description: "Large-format porcelain — 24x48, sometimes 32x32 — doesn't forgive an uneven substrate the way old 4x4 field tile did. Lippage shows up at every seam once the tile catches light from a window, and it's the number one callback we see on kitchen floors near the newer builds off Jovita Boulevard. Before we set a single piece, the floor gets checked with a laser level, and anything out of tolerance gets a self-leveling underlayment pour or a Ditra membrane to decouple the tile from subfloor movement. Large-format also needs back-buttering with a full-coverage notch trowel — skip that step and you get hollow spots that crack under a dropped cast-iron pan. Expect $12-$18 per square foot installed for large-format porcelain flooring, more if the subfloor needs leveling first, with most kitchen floors done in 3-4 days once material's on site."
  - title: "Backsplash Tile Held Up By Electrical Rough-In Timing"
    description: "Full-height backsplash tile tied to a range hood or under-cabinet lighting means an electrician touches the wall before the tile crew does, and in Edgewood that outlet relocation needs a permit through the city's building counter — skipping it is the fastest way to fail a home inspection at resale. We coordinate the rough-in with a licensed electrician so outlet boxes land at the right depth for tile thickness, GFCI protection is in place per IRC requirements, and nothing gets tiled over before final inspection on the electrical. A Bosch or KitchenAid range install often shifts the hood height an inch or two from what the old layout had, which changes where the backsplash tile pattern needs to break. Plan on 2-3 weeks from permit submittal to final sign-off, layered into the rest of the kitchen schedule, not stacked on top of it."
  - title: "What Bathroom Floors With Radiant Heat Actually Cost"
    description: "Radiant floor heat under bathroom tile is one of the few upgrades that pays off every winter morning, but pricing swings hard depending on the system. A Ditra-Heat mat runs the heating cable inside the same membrane that's already waterproofing and decoupling the floor, while a Warmup loose-cable system needs a separate self-leveling pour on top — that difference alone is $3-$5 per square foot. Total installed cost for a 40-square-foot bathroom floor with radiant heat, thermostat, and porcelain tile lands around $3,800-$6,500. The heating element itself carries a 25-year manufacturer warranty; TopVolk backs the tile and waterproofing install for as long as you own the house, and if we miss the schedule agreed to in the contract, a deadline penalty applies — Vladislav writes that into the quote, not just into a sales pitch."
  - title: "Marble and Travertine That Stain Before the Sealer Even Wears Off"
    description: "Marble and travertine look right in an Edgewood dining room with a view toward the Cascades, but both are calcium-based stone that etches from vinegar, lemon, and the acidic cleaners under most kitchen sinks. A penetrating sealer — not a topical coating — needs reapplying every 12-18 months in a PNW bathroom where humidity stays elevated most of the year, and skipping that schedule is why we get called for stains that never should have set in. Grout haze left over from a rushed install also traps moisture against unsealed stone, which becomes its own callback later. Porcelain doesn't have this problem, which is why we steer clients there for showers and toward stone only in low-moisture accent areas. Either way, a properly installed tile floor or shower should last 20+ years before anything but grout needs attention."

faq:
  - q: "How fast can you get to Edgewood for Tile Installation?"
    a: "Edgewood sits close enough to SR 167 and SR 512 that a free on-site consultation usually happens within a few days of your call, not weeks. Most driveways on the North Hill ridge and near Surprise Lake have room for a work truck without blocking the street, which keeps material staging simple on tear-out day. Once a contract's signed, tile work typically starts within 2-3 weeks depending on material lead time — porcelain in stock sizes moves faster than special-order stone. Call (206) 591-1096 and Vladislav will walk the site with you directly, no salesperson in between."
  - q: "What does a tile shower remodel in Edgewood cost?"
    a: "A full shower tear-out and retile with Schluter Kerdi waterproofing typically runs $9,500-$16,000 in Edgewood, depending on shower size, whether the pan needs reframing, and tile choice — large-format porcelain costs less to install than mosaic or natural stone per square foot because there's less grout work. Kitchen backsplash tile alone runs closer to $1,800-$4,500 depending on square footage and whether electrical needs to move. Every quote from TopVolk is line-item — tile material, thinset, membrane, and labor broken out separately, not a lump number. Call for a free on-site estimate with exact pricing before you commit to a design."
  - q: "Does tile work in Edgewood need a permit?"
    a: "Straight tile-over-tile or tile-on-existing-substrate work usually doesn't need a permit in Edgewood, but anything involving a shower pan rebuild, moved plumbing, or a new electrical circuit for heated floors does — that goes through City of Edgewood's building counter, with structural or plumbing review often coordinated through Pierce County. Turnaround on a straightforward bathroom permit typically runs 1-3 weeks. TopVolk is a WA Licensed Contractor and handles the permit application and inspection scheduling as part of the project, so homeowners don't have to run it themselves. We build the rough-in and final inspection dates into the project schedule up front."
  - q: "Do you install heated floors under tile, and which system do you use?"
    a: "Yes — we install both Schluter Ditra-Heat and Warmup systems depending on the floor plan and budget. Ditra-Heat combines the heating cable with the same uncoupling membrane used for waterproofing, which is our default for bathroom remodels because it's one less layer to fail. Warmup's cable system works better for irregular room shapes where Ditra-Heat's mat sizing doesn't fit as cleanly. Either system ties into a programmable thermostat, and we test the cable's resistance before and after tile goes down to confirm nothing got nicked during install."
  - q: "How long does tile installation actually last in Edgewood's climate?"
    a: "A properly waterproofed shower with Schluter Kerdi membrane and a correctly sloped pan should outlast the rest of the bathroom finishes — 20-25 years is normal before a full retile is needed. Grout maintenance and stone sealing, where applicable, matter more than the climate itself, since indoor bathroom conditions don't see the freeze-thaw cycles that hit exterior work near North Bend or Enumclaw. TopVolk warranties the installation and waterproofing workmanship for as long as you own the home; manufacturer warranties on tile and membrane materials run separately, typically 15-25 years depending on the product line. Grout and caulk lines are maintenance items, not warranty items, and we'll tell you that upfront."
  - q: "Do you cover cities near Edgewood too?"
    a: "Yes — alongside Edgewood, we regularly work in Puyallup, Fife, Milton, Sumner, and the rest of Pierce, King, Snohomish, and Kitsap counties. Scheduling windows fill up faster in spring and early summer when most kitchen and bathroom remodels get booked, so calling now typically gets you an on-site consultation within the week rather than a month out. Vladislav Volkov handles every consultation and every job personally — there's no rotating sales rep and no subcontracted crew showing up without him having walked the site first. Call (206) 591-1096 to get on the schedule."