title: "Edgewood Plumbing — PEX Repipes for Pierce County Homes"

answer: "Licensed plumbers handle galvanized repipes, tankless conversions, and fixture swaps in Edgewood, WA — 100+ projects completed since 2017."

intro: |
  Turn on a hose bib in a Jovita-area yard and you might feel city water pushing well past 80 psi — Pierce County's system runs high through parts of Edgewood, and that pressure will blow out a supply line fitting behind a dishwasher or washing machine within a few years if nobody installs a regulator. TopVolk Construction handles that kind of plumbing scope on the remodel jobs it runs across Edgewood, from a rancher near Windmill Park getting a full repipe to a kitchen addition off Meridian Avenue that needs a drain line rerouted for a new island sink. Owner Vladislav Volkov sizes the fix himself, whether that means swapping a corroded galvanized nipple for PEX or upsizing a gas line for a Rinnai tankless unit before a bathroom remodel closes up the wall. TopVolk has completed more than 100 projects like these since 2017 across Pierce, King, Snohomish, and Kitsap counties, so a $30K bath remodel and a $150K addition both get quoted by the person who actually pulls the Pierce County PALS permit, not a subcontractor working off a generic bid.

localContext: |
  Edgewood sits split across zip codes 98371 and 98372, and the building stock reflects decades of growth rather than one era. Near the Jovita Park side of town you'll still find farmhouses and ranch homes from the 1960s and 70s running on galvanized supply lines that were never meant to last sixty years. Closer to the Meridian Avenue corridor, tract homes built through the 1980s and 90s often have polybutylene supply lines behind the drywall — cheap, gray plastic pipe that cracks at the crimp fittings and shows up in insurance claims more than any other material in Pierce County. Newer construction off 24th Street East runs PEX or copper, but even those homes need a pressure-reducing valve if they're on Pierce County's higher-pressure mains. Any water heater swap or repipe past a certain scope needs a permit through Pierce County PALS, since Edgewood contracts its building department out rather than running its own. Wet winters here mean crawlspace plumbing needs a proper vapor barrier too, or condensation adds to whatever the old galvanized pipe is already dealing with.

commonProblems:
  - title: "Galvanized Supply Lines Rusting From the Inside Out"
    description: "Homes built before 1975 near the Jovita Park side of Edgewood were plumbed with galvanized steel supply lines, and by year fifty the zinc coating inside is long gone. Rust and mineral scale build up at every joint until a 3/4-inch line is functioning like a 1/4-inch line, and water pressure at the far fixtures drops to a trickle. The fix is a full repipe with PEX-A tubing — Uponor or SharkBite fittings, run through the same stud bays where possible to limit drywall damage. A whole-house repipe on a typical Edgewood rancher runs two to four days of rough-in plus a rough-in inspection before walls close back up. Expect $8,000 to $14,000 depending on fixture count and whether the water heater gets swapped at the same time."
  - title: "Polybutylene Supply Lines From 1980s Tract Construction"
    description: "Tract housing built through Edgewood in the 1980s and early 90s used polybutylene supply pipe with gray acetal insert fittings, and those fittings are the actual failure point — not usually the pipe itself. Chlorine in city water breaks the acetal down over decades, and it lets go at the crimp ring, often inside a wall or ceiling with no warning at all. Most Washington insurance carriers won't renew a policy without proof it's been replaced, which is what actually gets a homeowner calling in the first place. TopVolk pulls the poly out and repipes with PEX-A, keeping existing copper stub-outs at fixtures where they're still sound. A typical two-bath home takes 3 to 5 days including a blue tape walkthrough before final sign-off. Budget $9,000 to $15,000 depending on access."
  - title: "Tankless Conversions That Need a Bigger Gas Line and a Permit"
    description: "Swapping a 40-gallon tank for a Rinnai or Navien tankless unit isn't a drop-in job, whatever the box implies. Tankless units draw more BTUs on demand than a tank ever did, so the existing 1/2-inch gas line usually needs upsizing to 3/4-inch before the unit fires reliably under a shower and dishwasher running at once. Washington code also requires seismic strapping on any water heater, tank or tankless, and Pierce County PALS wants a permit pulled and a rough-in inspection scheduled before the wall closes up. Skipping that permit is the fastest way to have an insurance claim denied later if there's ever a gas leak. TopVolk pulls the permit, sizes the gas line, and books the final inspection as part of the quote. Plan on a two-day install plus inspection scheduling."
  - title: "What Fixture Upgrades Actually Cost During a Bath Remodel"
    description: "Edgewood's median household income runs well above the county average, and it shows in what people ask for during a bath remodel — Kohler comfort-height toilets, Delta or Brizo shower trims, Moen valves with dedicated volume control for a curbless shower. Pricing swings mostly on rough-in work, not the fixture itself: moving a drain for a new curbless shower with a linear drain and bench costs more than swapping a showerhead ever will. A mid-range bath remodel with fixture upgrades in Edgewood runs $28,000 to $45,000; a full gut job with a relocated toilet or tub-to-shower conversion pushes toward $60,000. TopVolk quotes line-item pricing so a homeowner sees what the Kohler toilet costs versus what the drain relocation costs. Fixtures carry manufacturer warranties of 5 to 10 years; labor is backed separately."
  - title: "Pressure Regulators, Kitchen Islands, and What Wears Out First"
    description: "A pressure-reducing valve is a wear part, not a set-it-and-forget-it fixture — the internal diaphragm typically lasts 8 to 12 years before it starts failing high, which is when a homeowner notices banging pipes or a suddenly weeping water heater relief valve. Edgewood's Pierce County mains run high enough in some areas that a PRV isn't optional if a home has copper or PEX supply lines feeding fixtures rated for 80 psi max. On the drain side, a kitchen island sink or a basement bathroom addition usually can't gravity-drain to the existing stack, so the fix is either a sewage ejector pump for a basement bath or an air admittance valve for an island sink where running a full vent isn't practical. Both add cost to a project, but both are code-legal shortcuts Pierce County PALS accepts with the right documentation."

faq:
  - q: "How fast can you get to Edgewood for Plumbing?"
    a: "Edgewood sits just off SR 161, a short run from Puyallup and Sumner, so a site visit usually happens within a day or two of a call, not weeks out. Most Edgewood lots have driveway parking, which makes staging materials for a repipe or water heater swap straightforward compared to tighter in-city lots in Seattle. For remodel-scale plumbing work — repipes, tankless conversions, drain rerouting — expect a walkthrough first, then a start date scheduled around permit approval with Pierce County PALS. There's no call center or scheduler here. Call (206) 591-1096 and Vladislav books the visit himself."
  - q: "What does a whole-house repipe in Edgewood cost?"
    a: "A whole-house repipe on a typical Edgewood home runs $8,000 to $15,000 depending on square footage, fixture count, and whether the water heater gets replaced at the same time. Homes with crawlspace access cost less to repipe than homes on a slab, since running new PEX under the floor is faster than opening walls. Older galvanized systems near Jovita Park tend to run toward the higher end because of how many fixtures need new shutoff valves. TopVolk gives a line-item quote after a walkthrough — call (206) 591-1096 for a free on-site estimate with exact numbers, not a phone guess."
  - q: "Do I need a permit for a water heater or repipe in Edgewood?"
    a: "Yes — Edgewood doesn't run its own building department, so any water heater replacement, repipe, or gas line change gets permitted through Pierce County PALS. That means a permit application, a rough-in inspection if walls are opened, and a final inspection before the job closes out, typically adding a few days to a couple weeks depending on PALS' review queue. TopVolk pulls the permit and schedules both inspections as part of the job, and is a WA Licensed Contractor, so the paperwork trail is already in place before work starts. Skipping the permit on a water heater swap is common and also the fastest way to void a homeowner's insurance claim later."
  - q: "Can you convert my tank water heater to a Rinnai or Navien tankless unit?"
    a: "Yes, and the real work is almost always the gas line, not the unit itself — most tank setups run 1/2-inch gas pipe, and a Rinnai or Navien tankless unit needs 3/4-inch to deliver enough BTUs on demand. We also check venting, since tankless units need dedicated stainless flue pipe rather than the shared galvanized flue a tank often used. Washington code requires seismic strapping either way, tank or tankless. Most Edgewood homes on natural gas can handle the upsize without a meter change, though that gets confirmed during the estimate, and it's a two-day job from gas line rough-in to final inspection scheduling."
  - q: "How long should PEX or copper plumbing last in Edgewood?"
    a: "PEX-A tubing carries manufacturer warranties of 25 years from Uponor and similar makers, and in practice lasts even longer indoors where it's not exposed to UV. Copper still outperforms PEX for exposed runs and water heater connections where a rodent or a nail puncture is a real risk. Edgewood's wet winters don't affect indoor supply lines much, but crawlspace copper without a vapor barrier above it can corrode faster from condensation over 20-plus years. Labor on any repipe TopVolk completes is covered separately from the material warranty, and if a completion deadline gets missed, that penalty is written into the contract up front."
  - q: "Do you cover areas near Edgewood, like Puyallup or Sumner?"
    a: "Edgewood plumbing work is part of TopVolk's regular coverage across King, Snohomish, Pierce, and Kitsap counties, so Puyallup, Sumner, Milton, and Fife are all routine stops, not special trips. Scheduling for remodel-scale plumbing usually books two to four weeks out depending on the season, with permit-heavy jobs like tankless conversions or repipes taking longer to start once PALS reviews the paperwork. Fall and winter tend to book faster since fewer homeowners are doing exterior work then. Call (206) 591-1096 or ask for a free consultation to get an actual date, not a general window."