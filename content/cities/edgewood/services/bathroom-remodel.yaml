title: "Edgewood Bathroom Remodel — Waterproofing & Layout Upgrades in 98372"

intro: |
  Right off Highway 18 in 98372, most of Edgewood's housing stock is 1985–2005 tract
  construction — and the bathrooms are showing it. Fiberglass tub surrounds, builder-grade
  Kohler fixtures, and no waterproofing membrane behind the tile are the norm. After 30+
  years of Pacific Northwest humidity cycling through grout lines, that translates to wet
  framing you won't find until the wall comes open. WA Licensed Contractor, 100+ projects
  completed since 2023 across King and Pierce counties.

localContext: |
  The split-levels and ranchers spread along Edgewood's corridors near Military Road S and
  the South Hill boundary mostly date to the mid-1980s through early 2000s. Zip code 98372
  housing was built fast — often with cast-iron drain stacks in older sections that need
  rerouting during any master bath layout change. Many slab-on-grade homes here have vinyl
  flooring directly over concrete, which matters when you're re-sloping a shower pan or
  pulling an old builder tub.

commonProblems:
  - title: "Failed Waterproofing Behind 1980s-90s Tile — Wet Framing Inside the Wall"
    description: "Edgewood's tract-era bathrooms used standard drywall and mastic adhesive behind
      ceramic tile — no cement board, no RedGard, no Schluter Kerdi membrane. After decades
      of PNW humidity cycling through grout lines, the substrate saturates. By demo day we're
      regularly cutting out rotted studs and replacing entire wall cavities before any new
      tile goes up."
  - title: "Master Bath Tub Removal and Walk-In Shower Conversion"
    description: "Pulling a builder tub to open up a walk-in shower means relocating the drain,
      re-sloping the floor, and rerouting supply lines — real plumbing work, not just a tile
      swap. Slab-on-grade homes in 98372 require saw-cutting the concrete to move the drain.
      We waterproof the new shower pan with Schluter Kerdi, frame a niche, and finish with
      large-format porcelain. Curbless entry available for ADA accessibility."
  - title: "Undersized Exhaust Fans Driving Mold Under Vanities"
    description: "The 50 CFM fans standard in 1990s construction can't keep up with a master bath
      in a climate that runs 37 inches of rain annually. Inadequate ventilation traps moisture
      under Moen and Kohler vanity cabinet bases — mold establishes behind the toe kick before
      it's visible. Upgrading to a properly ducted 110 CFM Panasonic WhisperCeiling fan,
      vented to the exterior, stops it at the source."

faq:
  - q: "How fast can you get to Edgewood for Bathroom Remodel?"
    a: "Edgewood is a straightforward run — Highway 18 west or Highway 99 south, depending on
      where you are in 98372. Vladislav handles on-site consultations directly, no sales rep
      or middleman. Call (206) 591-1096 to schedule a free walk-through."
  - q: "What fixture and tile brands do you install for Edgewood bathroom remodels?"
    a: "Kohler, Moen, and Hansgrohe cover most plumbing trim requests at the standard and
      mid-tier. For shower systems, Brizo and Grohe are common in this price range. Tile
      sourcing runs from domestic porcelain to Italian large-format — we'll walk you through
      options with actual samples, not just a catalog link."
  - q: "What does permitting look like for a bathroom remodel in Edgewood, and how long does the project take?"
    a: "Bathroom work with plumbing changes goes through the City of Edgewood Building
      Department — plan review typically runs 3–5 weeks. After permits clear, a full master
      bath remodel takes 4–7 weeks depending on scope and fixture lead times. Deadline penalty
      is written into every TopVolk contract — not a verbal promise."