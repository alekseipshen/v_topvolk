  - q: "What does a panel upgrade in Edgewood cost?"
    a: "A straight 100A to 200A panel upgrade for a single-family home typically runs $3,800 to $6,200, with the range driven by whether the meter base or service mast needs to move and how many circuits get AFCI/GFCI breakers added during the swap. Homes with detached shops or additional subpanels near the garage run higher because of added conduit, trenching, and labor for the second structure. TopVolk gives a written, line-item estimate after an on-site visit — panel size, breaker count, permit fees, and labor broken out separately — not a phone-quoted range. That written number is the number on the final invoice, and the consultation itself is free."
  - q: "Do I need a permit to upgrade my electrical panel in Edgewood?"
    a: "Yes — electrical permits in Edgewood route through Washington State L&I rather than a city building department, since Edgewood doesn't run its own electrical inspection program. TopVolk pulls the permit as a WA Licensed Contractor, schedules the rough-in and final inspection with the L&I inspector assigned to the area, and handles the paperwork so the homeowner isn't the one calling the state. Turnaround on inspection scheduling usually runs 3-7 business days depending on inspector availability that month. Panel work without a pulled permit can complicate a home sale or insurance claim later."
  - q: "Can you run a 50A or 60A circuit for a Tesla or ChargePoint charger from my existing panel?"
    a: "Sometimes, and it depends on the load calculation — if the existing 100A or 150A panel already has AC, an electric water heater, and a range on it, there may not be room for a 50A EV circuit without exceeding the total load allowed under NEC Article 220. TopVolk runs the calculation on-site, and if the panel has headroom, adds a dedicated 50A or 60A breaker and circuit for Tesla, ChargePoint, or JuiceBox chargers with no other work needed. If it doesn't, a panel upgrade solves it permanently instead of a workaround that trips under full load."
  - q: "How long will a new panel or circuit last in Edgewood's climate?"
    a: "A properly installed panel runs 25-40 years before it needs replacing, though individual breakers can wear out sooner if they're cycling frequently on an overloaded circuit. Exterior panels and meter bases take the brunt of Pierce County's wet fall and winter months, roughly 37 inches of rain a year regionally, so TopVolk seals penetrations and uses gasketed enclosures rated for outdoor exposure to avoid the corrosion that shows up on older, unsealed setups near Jovita and the rest of the city. Workmanship is covered under the project contract, and manufacturer warranties on the panel itself (Square D, Eaton) run separately, typically 10 years on the enclosure. Bring up specific coverage questions during the free on-site estimate before signing anything."
  - q: "Do you cover areas near Edgewood like Puyallup or Federal Way?"
    a: "Yes — TopVolk works across King, Snohomish, Pierce, and Kitsap counties, so Puyallup, Sumner, Federal Way, and Milton are all inside the regular service area alongside Edgewood. Scheduling generally runs within the same week for standard panel and circuit work, sooner if there's a safety issue like a scorched breaker or a failed GFCI. There's no call center routing the request — Vladislav takes the call directly. Reach out at (206) 591-1096 to check current availability."