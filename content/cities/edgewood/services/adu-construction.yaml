title: "Edgewood ADU Construction — DADU & AADU Builds"

answer: "TopVolk Construction builds DADUs and attached ADUs in Edgewood, Washington — WA Licensed Contractor with 100+ projects completed since 2023."

intro: |
  Question TopVolk gets on almost every Edgewood site visit: can this lot legally hold a second house? The answer is almost always yes. WA HB 1337 settled that statewide in 2024 — most single-family zoned parcels here, from the horse-property lots off Meridian to the half-acre yards near Jovita, qualify for a detached ADU, an attached ADU, or both. Vladislav Volkov has completed 100+ projects since 2023 across Pierce, King, Snohomish, and Kitsap counties, and Edgewood's larger lots (many over 10,000 square feet) make DADUs an easier fit than in tighter Seattle lots. One recent build near Edgewood Community Park converted a detached two-car garage into a 750-square-foot rental with a Bosch range and a Mitsubishi mini-split — no gas line trenching required. Owner-operated means Vladislav answers the phone and walks the lot with you, not a sales rep working off a script.

localContext: |
  Edgewood incorporated in 1996, and the housing stock reflects that timeline — zip codes 98371 and 98372 cover a mix of 1970s-90s ranch-style homes on generous lots, newer view-lot construction near the Sunset area, and a handful of older farmhouses left over from when this stretch of Pierce County was still orchard and dairy land. Big lots are the norm here, and that matters for ADU setback and lot coverage math: a parcel that would never clear FAR limits in a Seattle neighborhood often has plenty of room in Edgewood for a 24-foot-tall DADU plus the required side and rear setbacks. The City of Edgewood runs its own permit center, separate from Pierce County PALS, so plan review timelines and pre-approved plan options differ from what you'd find in unincorporated Pierce County or next door in Puyallup. Older septic systems on some larger parcels also change the utility-separation conversation — a detached ADU on septic needs a capacity letter before Vladislav can submit for plan review. Rain here runs close to 40 inches a year, so ground-contact framing on any DADU foundation gets PT lumber and a proper vapor barrier, no exceptions.

commonProblems:
  - title: "DADU, AADU, or Basement Conversion — Picking the Right Structure for the Lot"
    description: "Most Edgewood homeowners assume a basement conversion is cheapest, but a lot of these ranch and split-level homes have crawlspaces, not full basements, which rules that option out fast. Where there is a basement, IRC egress rules mean a legal bedroom needs an egress window well cut into the foundation — often a Milgard or Marvin unit sized to code, not the small hopper window that's there now. A detached garage conversion skips that problem entirely if the framing is sound; if not, we're sistering joists and adding blocking before drywall goes up. Straight garage-to-DADU conversions run 3-4 months; full new-construction DADUs run closer to 5-7 including plan review."
  - title: "Utility Separation Turns a Simple Build Into a Site-Work Project"
    description: "WA HB 1337 lets some jurisdictions allow a shared water and sewer connection between the main house and the ADU, but Edgewood's public works department still requires a separate sewer lateral or a septic capacity letter on larger parcels with private systems. That means trenching a new PEX supply line and running conduit for a subpanel before framing even starts — real money, usually $8,000-$18,000 depending on distance from the main line. A separate Rinnai or Navien tankless water heater in the DADU avoids tying into the main house's water heater capacity, which matters once a renter's showering on their own schedule. Skip this step and the City of Edgewood plan reviewer will kick the permit back."
  - title: "Permit Review at City of Edgewood Takes Longer Than People Expect"
    description: "Edgewood has its own AHJ, separate from Pierce County PALS, and plan review on a new DADU here typically runs 6-10 weeks before you get a permit in hand — longer if the lot needs a grading plan or a critical areas review near any drainage. Pre-approved plan sets speed this up when the footprint fits, but most Edgewood lots are custom enough that a stock plan doesn't pencil. Vladislav handles the permit application, plan review comments, rough-in inspection, and final inspection directly — no third-party permit expediter billing extra hours. TopVolk is a WA Licensed Contractor, and missed deadlines carry a penalty written into the contract, not a vague apology."
  - title: "What a DADU Actually Costs in Edgewood"
    description: "Detached ADUs here typically run $180,000-$260,000 all-in, higher than smaller-city averages because Edgewood's bigger lots often mean new sewer lateral work, grading for a level pad, and larger footprints than a tight urban infill lot allows. Finish level moves the number fast — a kitchen with a Sub-Zero fridge and Thermador range costs meaningfully more than one built around KitchenAid or Samsung appliances, and both are common choices in this income bracket. Foundation type matters too: a full slab-on-grade costs less than a crawlspace with R-49 insulation and proper venting. Every quote from TopVolk is line-item, not a range pulled from a spreadsheet."
  - title: "Cedar Siding, Composite Decking, and the Mini-Split — What Holds Up Locally"
    description: "North-facing walls in Edgewood collect moss the same way they do everywhere in Pierce County, so Hardie cement-board siding gets specified over cedar on most new DADUs — it doesn't need repainting every 5-7 years the way cedar shake does. Decks attached to the ADU do better in Trex or TimberTech composite than pressure-treated wood decking, which cups and checks after a few wet winters. A Mitsubishi mini-split handles heating and cooling for a detached unit without ductwork, and it needs a filter cleaning twice a year and a professional service check every 2-3 years. Expect 40-50 years out of Hardie siding and 15-20 out of a well-maintained mini-split compressor."

faq:
  - q: "How fast can you get to Edgewood for ADU Construction?"
    a: "Edgewood sits right off SR 512 and Meridian, about 20-25 minutes from Vladislav's usual routes through Puyallup and Sumner, so an initial site walk usually happens within a week of your call. Most lots here have room for a truck and trailer without blocking a neighbor's driveway, which speeds up the early framing and foundation phases. A full DADU project, permit to final inspection, generally runs 5-7 months. Call (206) 591-1096 to get a site visit scheduled."
  - q: "What does ADU construction cost in Edgewood?"
    a: "Detached ADUs in Edgewood typically run $180,000-$260,000 depending on square footage, foundation type, and finish level — appliance packages built around Sub-Zero and Thermador run higher than KitchenAid or LG. Attached ADUs and garage conversions can come in lower, sometimes $120,000-$170,000, since they reuse existing structure and walls. Site work — sewer lateral, grading, subpanel — is the biggest swing factor on any given lot. Call (206) 591-1096 for a free on-site consultation with a written, line-item quote."
  - q: "What does the City of Edgewood permit process look like for an ADU?"
    a: "Edgewood runs its own permit center separate from Pierce County PALS, and plan review on a DADU typically takes 6-10 weeks before a permit issues, longer if grading or drainage review is needed. Vladislav prepares the full application package — site plan, floor plan, structural details for any LVL beam or PSL post — and handles every round of plan review comments directly with the city. Rough-in and final inspections get scheduled once framing, MEP, and utility work pass their respective checks. TopVolk is a WA Licensed Contractor, and Vladislav is the one signing off on-site, not an office estimator."
  - q: "Do I need a separate water heater and electrical panel for the ADU?"
    a: "Yes, in most cases — a detached ADU needs its own subpanel fed from the main service or a new meter, and a standalone water heater, usually a Rinnai or Navien tankless unit, since running a second unit off the main house's existing water heater usually doesn't have the capacity. This also makes utility billing cleaner if you're renting the unit out. Bathroom fixtures typically run Moen or Kohler, and a Mitsubishi mini-split handles heating and cooling without extending ductwork from the main house."
  - q: "What's the warranty on a new ADU build?"
    a: "TopVolk backs structural and workmanship items for one year after final inspection, with manufacturer warranties on top of that for anything like a Bosch range, LG appliance package, or Mitsubishi mini-split system. Hardie siding is rated for decades and holds up well against Edgewood's wet fall-through-spring stretch; PT lumber and vapor barrier at the foundation keep moisture out of the crawlspace long-term. Deadline penalties are written into every contract, so delays cost TopVolk, not you."
  - q: "Do you cover areas near Edgewood?"
    a: "Yes — TopVolk builds ADUs throughout Pierce County including Puyallup, Sumner, Fife, and Federal Way, plus King, Snohomish, and Kitsap counties. Scheduling windows run a few weeks out for consultations and several months out for full builds, since Vladislav manages each project personally without a rotating crew. Call (206) 591-1096 or ask for a free consultation to get on the schedule."