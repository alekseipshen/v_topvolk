title: "Edgewood Kitchen Remodel — Opening Up 1980s Floor Plans for Real Life"

intro: |
  Tucked between the Puyallup River valley and Milton Road, Edgewood runs mostly on housing built between 1975 and 1995 — and those kitchens were designed for a 30-inch range and nobody watching cooking videos while they cook. Homeowners upgrading to a Bosch induction setup or a full KitchenAid suite run into the same wall, literally: a load-bearing partition that cuts the kitchen off from the dining area. Vladislav Volkov has opened up a lot of those walls.

localContext: |
  Edgewood sits in the 98372 zip code, with residential streets running off Edgewood Road and 78th Avenue E — mostly split-levels, bi-levels, and basic ramblers from the late 1970s through early 1990s. Original 100-amp panels are still common, as are galley-style kitchens with laminate counters and builder-grade cabinets that have seen better decades. Permits for structural kitchen work pull through Pierce County PALS; plan review on wall removal jobs typically runs 4-8 weeks before a shovel touches anything.

commonProblems:
  - title: "Load-Bearing Walls Between the Kitchen and Living Space"
    description: "Those 1980s ramblers in 98372 commonly put a structural wall exactly where you'd want an open-concept pass-through. Removing it means engineering drawings, a structural permit through Pierce County PALS, and an LVL beam sized to carry the floor load above — typically 10-14 feet spanning the opening. Skip the engineering step and you'll have a sag problem before the first dinner party."
  - title: "100-Amp Panels That Can't Support Modern Appliance Loads"
    description: "A Bosch induction range pulls 40-50 amps on its own dedicated circuit. Add a KitchenAid dishwasher, a built-in microwave drawer, and recessed lighting on dimmers, and a 100-amp service panel hits its limit fast. Upgrading to a 200-amp service before rough-in is the move — doing it after means opening finished walls and spending money twice."
  - title: "Gas Line Sizing and Makeup Air for High-BTU Ranges"
    description: "Upgrading to a Wolf or Thermador gas range often exposes undersized 1/2-inch gas supply lines — you need 3/4-inch to deliver the BTUs those burners are rated for. Range hood CFM requirements create a separate issue: anything above 400 CFM triggers makeup air calculations under current IRC, which have to be submitted with the permit package to PALS before work can start."

faq:
  - q: "How fast can you get to Edgewood for a kitchen remodel consultation?"
    a: "Edgewood is a straight run down SR-167 from most of our King County work — 25-35 minutes depending on traffic. Vladislav comes out himself for the site visit, not a salesperson. Call (206) 591-1096 to schedule."
  - q: "Do you have experience with Bosch, KitchenAid, Wolf, and Thermador appliances in kitchen remodels?"
    a: "Yes — each brand has specific rough-in requirements. Bosch dishwashers need a precise drain loop height. Wolf and Thermador ranges require gas line sizing and often trigger makeup air permits. KitchenAid refrigerators have tight depth clearances that affect cabinet layout. Getting the rough-in right before drywall avoids expensive corrections later."
  - q: "What does a kitchen remodel in Edgewood cost, and how long does it take?"
    a: "Full remodels in this area typically run $55K–$130K depending on layout changes, cabinet line (IKEA through semi-custom to full custom), and appliance tier. Pierce County PALS adds 4-6 weeks for permit review on structural jobs. Construction runs 6-10 weeks after permit. Vladislav is a WA Licensed Contractor — 100+ projects completed since 2017 — and deadline penalties go into the contract. Call (206) 591-1096 for a line-item quote."