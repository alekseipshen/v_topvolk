title: "Edgewood Deck Installation — Pierce County Permits, Ledger Right"

intro: |
  Most of the homes along Meridian Avenue East through 98372 went up
  between 1988 and 2003 — and a lot of those original pressure-treated
  decks are showing it. Boards cupping, ledger connections that were
  never flashed properly, post footings poured on grade instead of below
  frost line.

  Pierce County's wet season runs October through May. That's seven
  months of standing moisture on every horizontal surface — and cedar
  that wasn't maintained holds it like a sponge. TimberTech AZEK and
  Trex Transcend composite exist for exactly this climate.

  Vladislav Volkov (WA Licensed Contractor) runs every TopVolk job
  personally — no sales coordinators, no relay through a project
  manager. Direct line: (206) 591-1096. Free on-site consultation
  with the contractor, not a closer.

localContext: |
  Edgewood (98372) sits between Auburn and Puyallup on the plateau above
  the White River valley — mostly quarter-acre to half-acre residential
  lots developed through the 1990s and early 2000s. Two-story colonials
  and split-levels dominate the area west of Meridian and south toward
  the Edgewood Community Park corridor.

  That terrain matters for deck work. Rear yards on the valley-edge lots
  drop quickly — what reads as a single-story attachment at the back
  door can be 6-8 feet off grade by the time you reach the yard. Posts
  get taller, footings get wider, and Pierce County PALS requires a
  ledger flashing inspection before decking goes down. 100+ projects
  completed since 2017 across Pierce, King, Snohomish, and Kitsap
  counties — Edgewood-area decks are a regular part of that work.

commonProblems:
  - title: "Ledger Board Attached Without Step Flashing on Late-1990s Homes"
    description: |
      Homes in 98372 built before 2000 almost never have proper ledger
      flashing. The ledger board got nailed directly to the rim joist —
      sometimes with a strip of tar paper behind it, more often nothing.

      Water infiltrates that connection every fall, sits through winter,
      and rots both the ledger and the rim joist behind it. By the time
      the deck starts to feel soft, the damage usually extends 12-18
      inches into the floor framing on either side. Repair means opening
      the exterior sheathing, replacing the rim joist section, installing
      metal z-flashing and housewrap integration, and scheduling the
      ledger inspection with Pierce County PALS before any new decking
      goes down.

  - title: "Post Footings on Grade or Poured Too Shallow"
    description: |
      Pierce County requires deck post footings to extend below frost
      depth — 12 inches minimum in the Edgewood area. A lot of late-1980s
      and 1990s decks in 98372 sit on poured surface pads or 10-inch tube
      footings that don't meet that requirement.

      On the clay-heavy soils near the White River corridor, those
      footings shift. You'll see it as a slight lean in the posts or
      decking that's no longer level. Fix means augering new footings
      to depth, setting a Simpson Standoff post base above grade, and
      speccing ground-contact PT lumber for anything within 6 inches of
      soil. The PALS inspector checks footings before concrete pours
      on permitted jobs.

  - title: "Cedar vs. Composite on Shaded North-Facing Lots"
    description: |
      Cedar still makes sense in the right conditions — south-facing
      exposure, good airflow, homeowner willing to clean and seal every
      other year.

      North-facing backyards in Edgewood's tree-heavy residential areas
      don't have those conditions. Moss colonizes cedar boards within two
      wet seasons without consistent maintenance. Trex Transcend and
      TimberTech AZEK handle that exposure without annual sealing — both
      carry 25-year warranties, and neither absorbs the moisture that
      drives moss growth on wood. The cost gap from cedar narrows fast
      once you factor in maintenance over a decade.

faq:
  - q: "How fast can you get to Edgewood for a deck consultation?"
    a: |
      Edgewood is about 35 minutes from Seattle via SR-167 South —
      straightforward drive, no ferry wait. Vladislav schedules site
      visits directly, usually within the week. Call (206) 591-1096 or
      text to check current availability.

  - q: "Do you build with Trex and TimberTech, or only pressure-treated wood?"
    a: |
      Both composite and PT lumber framing are standard on every job.
      Trex Transcend and TimberTech AZEK hold up through Pierce County
      winters without annual sealing or staining. The structural framing —
      joists, posts, ledger, blocking — stays pressure-treated Douglas-fir
      regardless of which decking surface you choose.

      Sample boards come on-site. You're not picking off a website swatch.

  - q: "What does the permit process look like for a deck in Pierce County, and how long does it take?"
    a: |
      Pierce County PALS handles permits for unincorporated Edgewood.
      Standard deck permit review runs 3-5 weeks. We prepare the
      structural drawings, schedule the ledger flashing inspection at
      rough-in, and coordinate the final inspection.

      Start to finished deck: 6-10 weeks total depending on size. Missed
      deadline? That penalty is written into the contract — it costs us,
      not you. WA Licensed Contractor. Direct line: (206) 591-1096.