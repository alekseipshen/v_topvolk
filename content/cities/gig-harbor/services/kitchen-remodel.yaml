title: "Gig Harbor Kitchen Remodel — Open Layouts, Permits, Done Right"

intro: |
  Across Canterwood and the hillside streets above the harbor in 98335, kitchens in
  1990s and early-2000s homes show their age in predictable ways: dark oak cabinets,
  drop soffits eating 12 inches of ceiling height, and a layout routing foot traffic
  straight through the cooking zone. Homeowners here are dropping in Thermador ranges
  and quartzite islands — but making that work often means a load-bearing wall comes
  out first, and that triggers a Pierce County PALS permit before anyone swings a hammer.

localContext: |
  The 98332 zip, covering Uptown Gig Harbor and subdivisions off Borgen Boulevard,
  skews toward homes built between 1988 and 2005 — two-story colonials and split-levels
  with original builder kitchens. Closer to the downtown waterfront along Harborview
  Drive, you find 1960s and 70s cottages: smaller footprints, narrow galley layouts,
  and in some cases electrical panels still running 100A service that predates modern
  appliance loads. Both eras need a different approach.

commonProblems:
  - title: "Load-Bearing Walls in 1990s Two-Story Colonials"
    description: "The wall between kitchen and dining room in most 1988–2000 Gig Harbor
      colonials is structural — it's carrying the floor joists above. Removing it
      requires an LVL beam (typically 3½-inch × 11¼-inch or larger), a structural
      engineer's stamp, and a Pierce County PALS building permit. Skipping any of
      those steps creates a sag you'll catch at the resale inspection."
  - title: "100-Amp Service Can't Handle Induction Cooking"
    description: "Thermador and Bosch induction ranges require a dedicated 240V,
      40–50 amp circuit. Most Gig Harbor homes built before 1995 are running 100-amp
      service — workable for the original electric coil range, but not for a 36-inch
      induction cooktop plus a wall oven. The panel upgrade has to be permitted and
      complete before kitchen rough-in starts."
  - title: "Cabinet Depth and Appliance Fitment in Split-Level Layouts"
    description: "Split-levels in 98335 often have a soffit on one wall and a
      stairwell cutting into the layout on another. IKEA's SEKTION line handles
      straightforward galley runs but gets expensive fast on filler panels and
      non-standard ceiling heights. Semi-custom cabinets — Kraftmaid or similar —
      cost more upfront but cover those odd dimensions cleanly without stacking filler."

faq:
  - q: "How fast can you get to Gig Harbor for a kitchen remodel consultation?"
    a: "Gig Harbor is about 45 minutes from our King County work area via Highway 16
      and the Narrows Bridge — straightforward outside of Friday afternoon traffic.
      We schedule Gig Harbor consultations Tuesdays and Thursdays. Call (206) 591-1096
      to set a time with Vladislav directly."
  - q: "Do you handle Thermador and Sub-Zero appliance integration in kitchen remodels?"
    a: "Yes. Thermador Freedom refrigerators need custom cabinet panels and specific
      ventilation clearances. Sub-Zero units require framing modifications standard
      cabinets don't accommodate. We've handled both in Canterwood and Uptown Gig
      Harbor — appliance fitment is part of the scope, not an afterthought."
  - q: "What does a full kitchen remodel cost in Gig Harbor and how long does it take?"
    a: "Full kitchen remodel — demo, cabinets, countertops, electrical, plumbing —
      runs $55,000–$130,000 depending on scope. Pierce County PALS permit review
      adds 3–5 weeks before work starts. Figure 8–14 weeks from permit approval to
      blue tape walkthrough. Missed deadlines carry written financial penalties.
      WA Licensed Contractor. Free estimate with Vladislav: (206) 591-1096."