title: "Gig Harbor Bathroom Remodel — Waterproofing, Layouts, Modern Finishes"

intro: |
  Across the Narrows from Tacoma, Gig Harbor's older homes along Harborview Drive
  and through the Rosedale corridor carry a specific problem: decades of Puget Sound
  humidity working through bathroom walls that were never properly waterproofed.
  A Kohler fixture upgrade looks good for two years — then the tile starts cracking
  from substrate movement underneath. Fixing it right means Schluter Kerdi or RedGard
  over cement board before any tile goes down. That's the job, not just the cosmetics.

localContext: |
  The 98332 zip code spreads through Artondale, Wollochet, and the subdivisions that
  built out through the 1980s and 1990s as Gig Harbor grew beyond the harbor core.
  Those homes share a common bathroom profile: fiberglass tub surrounds with failing
  caulk seams, exhaust fans that dump moisture into the attic, and galvanized supply
  lines still running under the vanity. Older homes closer to the water in 98335 —
  the ranchers and split-levels near Olympic Drive W — add cast-iron drain stacks
  and original post-and-pier foundations to what we're working around.

commonProblems:
  - title: "Failed Waterproofing Behind 1980s-90s Tile"
    description: |
      Builder-era bathrooms in Artondale and Wollochet were typically tiled over
      paper-faced drywall — no Schluter Kerdi, no RedGard, sometimes just greenboard
      that has been cycling wet and dry for 25 years. Grout cracks are usually the
      last symptom, not the first. Tear-out regularly exposes soft framing and mold
      colonization behind the tub surround that goes back years before the tile
      showed any visible sign.
  - title: "Tub-to-Shower Conversions With Rough-In Complications"
    description: |
      The 5x8 bathrooms common in 1980s Gig Harbor tract builds were designed around
      a tub-shower combo footprint that doesn't translate cleanly to a modern curbless
      walk-in shower. Moving the drain and resizing the rough-in is standard scope,
      but it triggers a permit through Pierce County PALS — plan review runs 3-6 weeks.
      Rushing this step without a permit creates problems at resale. Vladislav pulls
      the permit; that's included in the quote.
  - title: "Ventilation Failures Feeding Chronic Mold Regrowth"
    description: |
      Gig Harbor sits in the October-May rain belt, averaging close to 37 inches
      annually, and bathroom exhaust that vents into attic space — instead of through
      a proper roof or wall cap — accelerates mold regrowth regardless of what
      waterproofing membrane is under the tile. Upgrading to a Panasonic WhisperGreen
      or equivalent CFM-rated unit with proper exterior ducting is part of every full
      bath remodel TopVolk completes in this area. It's not optional in this climate.

faq:
  - q: "How fast can you get to Gig Harbor for a bathroom remodel consultation?"
    a: |
      Gig Harbor is a regular stop on the Pierce County schedule. Vladislav crosses
      the Narrows Bridge from the Tacoma side — typically 35-45 minutes from South
      Seattle depending on traffic. Call (206) 591-1096 to set up a free on-site
      walkthrough directly with the owner, not a sales rep.
  - q: "Which fixture brands do you work with — Kohler, Moen, Brizo?"
    a: |
      All three. Walk-in shower systems, wall-mount vanity faucets, freestanding soaking
      tubs — Kohler, Moen, Delta, and Brizo come up regularly on Gig Harbor jobs. Some
      clients source their own unlisted fixtures; TopVolk installs those too as long as
      they meet IRC code requirements. WA Licensed Contractor, 100+ projects since 2017.
  - q: "What does a master bath remodel actually cost in Gig Harbor, and how long does it take?"
    a: |
      A full master bath gut-remodel runs $35K-$90K depending on layout changes and
      finish selections. Timeline after permit approval is typically 6-10 weeks.
      Pierce County PALS plan review adds 3-6 weeks upfront. Vladislav provides
      line-item quotes with no vague ranges, and missed-deadline penalties are written
      into the contract. Call (206) 591-1096 to schedule.