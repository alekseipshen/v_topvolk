title: "Gig Harbor Deck Installation — Built for Puget Sound Weather"

intro: |
  Salt-humid air off the harbor and rainfall that runs October through May make Gig Harbor
  one of the tougher environments for a wood deck in the entire Seattle metro. The waterfront
  homes near Soundview Drive look beautiful — and a cedar deck that isn't properly detailed
  looks rough within five years. Composite decking from Trex or TimberTech holds color and
  structure in this climate without the annual sealing schedule cedar demands.

localContext: |
  Much of Gig Harbor's older residential stock — split-levels and ramblers along the
  waterfront corridor in 98335 — dates to the 1970s and 1980s. Those original pressure-
  treated decks are now 35-45 years old. Farther east on the plateau, newer homes in 98332
  are adding first-time outdoor living structures. Both situations go through Pierce County
  PALS for permits, and plan review on structural additions currently runs four to eight
  weeks depending on project scope.

commonProblems:
  - title: "Ledger Rot Where the Deck Meets the Rim Joist"
    description: "Improper flashing at the ledger board connection is the most common structural
      problem on Gig Harbor decks built before 2000. Water migrates behind the siding and sits
      against the rim joist — sometimes for years before anyone notices. Repairs routinely
      involve replacing the rim joist entirely plus reframing the ledger connection with metal
      Z-flashing and self-adhering membrane. Pierce County PALS inspectors check this detail
      at rough-in inspection."
  - title: "Post Footings in Saturated Coastal Soil"
    description: "Gig Harbor soil near the waterfront is often clay-heavy over glacial till —
      slow to drain and subject to frost heave in hard winters. Standard 12-inch depth footings
      aren't adequate here. Posts need to reach 18 inches minimum into stable bearing soil, and
      ground-contact PT lumber rated UC4B is required. Simpson Strong-Tie post-base hardware
      keeps the post end-grain out of standing water and prevents the slow rot that takes out
      footings from the bottom up."
  - title: "Guardrail Height and Stair Stringer Code Compliance"
    description: "Decks built more than 30 inches above grade require guardrails at 36 inches
      minimum under IRC — and Pierce County enforces this strictly at final inspection. Stair
      stringers have to meet 7.75-inch maximum rise and 10-inch minimum run, plus graspable
      handrails with correct diameter. Decks that were permitted before 2010 often have
      guardrails that don't meet current code. Catching these before the inspection saves
      significant rework cost. TimberTech railing systems are pre-engineered to pass without
      field modifications."

faq:
  - q: "How fast can you get to Gig Harbor for a deck consultation?"
    a: "Vladislav covers Pierce County regularly, including Gig Harbor. No ferry —
      straight over the Tacoma Narrows Bridge to 98332 or 98335. Call (206) 591-1096
      to schedule a free on-site consultation. You get a contractor, not a salesperson,
      and a line-item quote within a few days of the visit."
  - q: "Cedar or composite — what actually makes sense for Gig Harbor's climate?"
    a: "For most homeowners here, Trex or TimberTech composite is the better 20-year
      decision. Cedar looks great at year one, but north-facing boards in 98335 can
      develop moss within two years without treatment. Composite has no end-grain to
      seal, no annual staining, and the material warranties now run 25-30 years.
      Cedar still works — it just requires a real maintenance commitment."
  - q: "What does the deck permit process look like in Gig Harbor?"
    a: "Pierce County PALS handles all permitting for Gig Harbor. For a standard
      attached deck, expect four to six weeks for plan review, plus scheduling time
      for rough-in and final inspections. Total timeline from permit application to
      finished deck runs ten to sixteen weeks. TopVolk handles permit submission
      as part of the project — call (206) 591-1096 and we walk through the full
      sequence on the first visit. WA Licensed Contractor, 100+ projects since 2023."