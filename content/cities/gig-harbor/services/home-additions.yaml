title: "Gig Harbor Home Additions — ADUs & Second Stories"

answer: "TopVolk Construction builds permitted additions, second stories, and ADUs in Gig Harbor, Washington — owner-led by Vladislav Volkov, 100+ projects completed since 2017."

intro: |
  TopVolk Construction plans and builds permitted additions, second stories, and detached ADUs for homeowners across Gig Harbor, with Vladislav Volkov handling design coordination, permitting, and framing directly instead of routing calls through a sales office. Space runs tight fast in the older homes near the downtown waterfront, where lots platted for a 1940s fishing cottage now hold families that need a third bedroom or a place for an aging parent. Out past Wollochet Bay and toward Canterwood, newer construction leaves more room to build up or out, but the city's setback and lot coverage rules still apply either way. A recent client near Skansie Brothers Park wanted a DADU with a Bosch induction range and a stacked LG washer-dryer instead of another rented storage unit sitting in the side yard. Under WA HB 1337, that same lot could legally support a second ADU too, which changes the math on what's worth building first.

localContext: |
  Gig Harbor's housing stock splits pretty cleanly by distance from the water. Down in 98335 near the harbor itself, expect early-to-mid-century cottages and bungalows on narrow lots with post-and-pier foundations that need real structural review before anyone frames a second story on top. Head toward 98332 and the Canterwood or Sehmel Enterprise corridor, and it's mostly 1980s-2000s construction with more square footage to work with and stick-built platforms that take an addition tie-in far more easily. Because Gig Harbor is incorporated, permits for additions and ADUs go through the City of Gig Harbor Building Department rather than Pierce County PALS — PALS only comes into play for unincorporated pockets like Artondale or parts of Purdy just north of town. Rain matters here too: at roughly 45 inches a year with heavy runoff toward the bay, any addition on a sloped lot needs proper drainage and vapor barrier detailing at the crawlspace before drywall goes up, especially on the older post-and-pier lots.

commonProblems:
  - title: "Fitting a DADU Under WA HB 1337 Without Blowing Lot Coverage"
    description: "WA HB 1337 opened the door to two ADUs per single-family lot statewide, but Gig Harbor's smaller parcels near the water in 98335 still bump against lot coverage limits and the 24-foot height cap for a detached ADU (DADU) fast. Most calls start with a homeowner wanting a one-bedroom unit over a garage, then realizing the setback math and a separate utility connection — a new sewer lateral or septic tie-in, plus its own electrical panel — eat into the budget before framing starts. Pre-approved plans through the City of Gig Harbor cut plan review from months down to roughly 6-8 weeks. A detached ADU with a Bosch range, quartz counters, and a Mitsubishi mini-split for heat typically runs $190,000-$230,000 depending on finish level and site work."
  - title: "Second-Story Additions on Homes That Weren't Built to Carry the Load"
    description: "Cottages and bungalows near downtown Gig Harbor were framed for a single story on post-and-pier foundations, and stacking a second story on top means an engineer has to run new load calculations before any framing crew shows up. The usual fix involves an LVL beam header over widened openings, PSL posts carrying that load down to new concrete footings, and sistering or replacing the rim joist where the old floor system can't take the extra weight. Skip this step and you get bounce in the new floor or a failed rough-in inspection from the city building official. Structural upgrades like this typically add $15,000-$40,000 to a second-story addition before finish work even starts, depending on how much of the original foundation needs reinforcing."
  - title: "Mother-in-Law Suite Layouts That Actually Meet Egress Code"
    description: "A separate entrance and a kitchenette sound simple until IRC egress window requirements come into play — any sleeping room in an AADU or converted basement suite needs a code-compliant escape window, not just a bigger view window. Homeowners near Peninsula and the Sehmel corridor often want to convert a daylight basement into a suite for a parent, which also means a dedicated exterior door, its own smoke and CO detection loop, and sometimes a mini-split zone since tying into existing ductwork rarely reaches a converted space efficiently. Plans go through the City of Gig Harbor Building Department, and TopVolk prepares that full submittal as a WA Licensed Contractor. A straightforward AADU conversion usually clears plan review and gets a permit in 4-6 weeks when the egress and MEP details are drawn correctly the first time."
  - title: "What a Home Addition Actually Costs in Gig Harbor"
    description: "Line-item quotes for additions here generally run $250-$400 per square foot once foundation work, roofline tie-in, and finish materials are counted — a bare-bones bump-out lands at the low end, a second story with a full kitchen and a Thermador or Sub-Zero appliance package pushes toward the high end. Foundation type drives a lot of that spread: a post-and-pier cottage needs more structural work than a home already sitting on a poured slab in Canterwood. TopVolk writes a deadline penalty into every contract instead of promising a vague completion date, and quotes come directly from Vladislav Volkov with actual line items, not a ballpark range from a sales rep. Call (206) 591-1096 for a free on-site estimate before committing to a design."
  - title: "Matching New Construction to 60-Year-Old Siding and Rooflines"
    description: "Tying a new addition into a home built before 1970 usually means matching cedar shake or lap siding that's weathered for decades under Gig Harbor's roughly 45 inches of annual rain, and a mismatched patch shows immediately once the sun hits it. Hardie cement-board siding is the common fix now — it takes paint evenly and resists the moss and mildew that build up on north-facing walls near the water, but it has to be color-matched or the whole elevation gets re-sided to avoid a visible seam. Roofing tie-ins need the same care: shingles matched to existing exposure and flashing detailed correctly at the new roofline, or water finds its way into the addition's rim joist within the first wet season. Budget an extra $8,000-$15,000 when full elevation re-siding is the only clean option."

faq:
  - q: "How fast can you get to Gig Harbor for Home Additions?"
    a: "Gig Harbor sits about 35-40 minutes out via WA-16 across the Tacoma Narrows Bridge, and most consultations get scheduled within a few days of a call. Parking and site access are rarely an issue outside the tighter lots near the downtown waterfront, where crews plan deliveries around narrow streets and limited turnaround space. A full addition project, from first walkthrough to permit-ready drawings, typically takes 3-4 weeks before construction even starts, with actual build time depending on scope. Call (206) 591-1096 to get a consultation on the calendar."
  - q: "What does a home addition in Gig Harbor cost?"
    a: "Most additions here run $250-$400 per square foot depending on foundation type, roofline complexity, and appliance package, and a complete detached ADU averages $190,000-$230,000. Second stories on post-and-pier cottages near the harbor cost more due to structural reinforcement, while additions on 1990s-2000s slab-on-grade homes in Canterwood or Sehmel run leaner. Every quote comes from Vladislav Volkov directly after a free on-site walkthrough, with line-item pricing instead of a rough range, and that number holds once the contract is signed — deadline penalty included."
  - q: "Does the City of Gig Harbor require a permit for a home addition?"
    a: "Yes — any addition, second story, or ADU inside Gig Harbor city limits goes through the City of Gig Harbor Building Department, not Pierce County PALS, which only handles unincorporated areas like nearby Artondale. Plan review for a straightforward addition runs 6-8 weeks, longer for a DADU that needs a separate utility connection reviewed alongside the structural set. TopVolk prepares the full submittal — site plan, structural calcs stamped by an engineer where required, and energy code compliance — as a WA Licensed Contractor. Homeowners don't deal with the counter directly; Vladislav handles that end of it start to finish."
  - q: "Can you tie a new addition into our existing ductwork, or do we need a mini-split?"
    a: "It depends on the existing system's capacity — older forced-air setups in 1980s-90s Gig Harbor homes often can't take another zone without a static pressure problem, so a Mitsubishi mini-split head in the new space is usually the cleaner fix. New additions with a bedroom or suite get their own zone either way, sized during MEP coordination rather than guessed at. For DADUs, a Rinnai or Navien tankless water heater paired with a mini-split keeps utility costs down without running a separate gas line. Load calculations happen before framing so line sets get roughed in during the right phase, not after drywall's already hung."
  - q: "What's the warranty on a home addition build?"
    a: "TopVolk backs workmanship on additions and ADUs for one year after final inspection, and manufacturer warranties carry through separately on brands like Milgard windows, Hardie siding, and Bosch or LG appliances installed during the project. Gig Harbor's wet winters put real stress on new roof tie-ins and exterior siding seams, so flashing and drainage details get checked again at the one-year mark if anything's settled. Structural work — LVL beams, footings, framing — is built to IRC code and inspected by the city before it's ever covered up. As a WA Licensed Contractor, TopVolk carries the coverage required to back all of it."
  - q: "Do you work outside Gig Harbor too?"
    a: "TopVolk covers the Seattle Metro area including King, Snohomish, Pierce, and Kitsap counties, so Gig Harbor jobs sit alongside work in Tacoma, University Place, Fircrest, and across the Narrows toward West Seattle. Scheduling generally runs 2-4 weeks out for a design consultation and further out for construction start, depending on permit timelines with the city. Vladislav handles every project directly — no dispatched crew of strangers, no sales handoff between the estimate and the build. Call (206) 591-1096 or schedule a free consultation to get an actual start date instead of a guess."