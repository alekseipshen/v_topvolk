  - q: "What does finishing a basement in Gig Harbor cost?"
    a: "Most Gig Harbor basement finishes fall between $30,000 and $120,000, depending on whether you're adding a bathroom, a wet bar, egress windows, or a full perimeter drain system. Ceiling height and existing moisture conditions swing the price more than square footage does. Every project gets a free on-site estimate with a line-item quote, not a ballpark range. Call (206) 591-1096 and Vladislav will walk the space with you before pricing anything."
  - q: "Do I need a permit to finish a basement in Gig Harbor?"
    a: "Yes — any basement finish that adds bedrooms, bathrooms, or reroutes electrical and plumbing needs a permit, and where you're located matters. Inside city limits it goes through City of Gig Harbor Community Development; out in unincorporated Pierce County areas like Artondale or Purdy, it's Pierce County PALS. TopVolk Construction, WA Licensed Contractor, handles the permit pull, schedules rough-in and final inspections, and manages the paperwork so you're not chasing the AHJ yourself. Typical plan review takes 3-6 weeks before framing can start."
  - q: "How do you deal with low ceiling height in an older basement?"
    a: "In basements under 7 feet of finished height, we look first at rerouting ducts and plumbing lines tighter to the joists, sometimes swapping bulky ductwork for a Mitsubishi mini-split system that doesn't need the same clearance. Sistering joists or adding blocking can sometimes recover an inch or two without touching the foundation. If the framing budget allows it, dropping the basement floor is an option, but it's a bigger job. We measure ceiling height room by room during the estimate, not just at the stairs."
  - q: "What's covered under warranty on a finished basement?"
    a: "Workmanship on framing, drywall, and waterproofing systems like perimeter drains and vapor barriers is covered for one year after final inspection, with the deadline penalty written into the contract if we run late. Sump pumps and mechanical equipment carry manufacturer warranties on top of that — Zoeller typically covers pumps for 3 years. Moisture issues traced back to installation are on us to fix; issues from a homeowner blocking a drain outlet or skipping dehumidifier maintenance aren't. We walk through what's covered before signing, not after something goes wrong."
  - q: "Do you work outside Gig Harbor too?"
    a: "TopVolk Construction covers King, Snohomish, Pierce, and Kitsap counties, so Gig Harbor, Fox Island, Purdy, and the Key Peninsula are all in the regular service area. Scheduling windows run 2-4 weeks out for a start date once a contract's signed, sooner for the initial consultation. 100+ projects completed since 2023, all owner-led with direct communication with Vladislav. Call (206) 591-1096 to get on the schedule."