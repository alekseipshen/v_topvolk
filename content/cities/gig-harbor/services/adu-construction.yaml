  - q: "What does an ADU cost in Gig Harbor?"
    a: "Detached ADUs generally run $180,000 to $320,000 depending on square footage, foundation type, and finish level; basement conversions run $90,000 to $160,000 since the structural shell already exists. Utility trenching distance, whether you're on septic or sewer, and appliance choices (KitchenAid versus Sub-Zero and Thermador) move the number more than anything else. Every project gets a written, line-item quote — no vague per-square-foot guess. Schedule a free consultation to get exact numbers for your lot."
  - q: "Do I need a permit from the City of Gig Harbor or Pierce County for my ADU?"
    a: "It depends on the parcel — properties inside city limits, mostly 98332, file with the City of Gig Harbor Community Development Department, while unincorporated areas near Artondale and parts of 98335 route through Pierce County PALS. Plan review typically takes six to ten weeks once WA HB 1337 documentation and site plans are submitted complete. TopVolk is a WA Licensed Contractor and handles the full application, plan review correspondence, and inspection scheduling directly with the AHJ."
  - q: "Can my ADU have its own water and sewer connection, or does it have to share the main house's line?"
    a: "Either works, but a separate meter and dedicated sewer lateral are usually required if you plan to rent the unit out, and that means trenching, a new backflow preventer, and a separate inspection pass. Shared connections are cheaper up front but limit resale flexibility later. Homes on septic near Wollochet Bay or Rosedale sometimes need a capacity review before a second unit gets approved. This gets evaluated during the first site visit, before design work starts."
  - q: "How long will an ADU hold up in Gig Harbor's climate?"
    a: "Built right, an ADU here easily runs 40-plus years before major systems need replacement. Hardie siding resists the moss and moisture that raw cedar picks up on shaded, north-facing walls, and R-49 insulation with a properly installed vapor barrier prevents the damp, cold feeling small units can get in the rainy months. Mini-split systems from Mitsubishi or LG typically last 15-20 years with basic filter maintenance. Structural framing, foundation, and waterproofing are covered under contract; appliance warranties run through the manufacturer."
