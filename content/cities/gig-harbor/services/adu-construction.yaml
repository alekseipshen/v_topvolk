title: "Gig Harbor ADU Construction — Permitted DADUs & Additions"

answer: "TopVolk Construction builds permitted DADUs, AADUs, and basement-conversion ADUs in Gig Harbor, Washington — WA Licensed, 100+ projects since 2017."

intro: |
  Vladislav Volkov and TopVolk Construction design and build permitted accessory dwelling units — detached, attached, and basement conversions — for homeowners across Gig Harbor, with the owner managing each job from first site visit through final inspection, no sales rep in between. A bonus room over a three-car garage in Canterwood is a different build than a walkout basement near Wollochet Bay with 7-foot ceilings and galvanized plumbing from the 1970s; each gets measured and scoped on-site before a number lands on paper. WA HB 1337 opened the door to two ADUs on most single-family lots statewide, and homeowners near Donkey Creek Park and the downtown waterfront are using that space for rental income or a spot for aging parents to land close by, not across town. One recent detached ADU near Skansie Brothers Park used a Mitsubishi mini-split for heat and a Rinnai tankless unit tucked into a mechanical closet, since 800 square feet doesn't leave room for a bulky storage tank. Line-item quotes, no vague ranges, deadline penalties written into the contract.

localContext: |
  Gig Harbor's housing stock splits roughly into three eras, and each one changes how an ADU gets designed. Downtown near 98332, older cottages and post-war homes sit close to the water on tight lots, which pushes setback and lot-coverage math to the front of the conversation before anyone talks finishes. Canterwood and Crescent Valley, both largely 98332, run newer — 1990s and 2000s custom homes with three-car garages that convert well to attached ADUs with a shared foundation and an existing ledger board to build from. Out toward Artondale and Wollochet in 98335, lots get bigger and many properties are unincorporated Pierce County, which means permits route through Pierce County PALS instead of the City of Gig Harbor Community Development Department downtown. Either way, expect a crawlspace vapor barrier requirement near the water table, since moisture wicking into floor joists is a real problem this close to the harbor, and north-facing siding grows moss fast without a rainscreen gap behind it.

commonProblems:
  - title: "Choosing between a DADU, an AADU, and a basement conversion"
    description: "A detached ADU (DADU) needs its own foundation, its own LVL beam or PSL post carrying the roof load, and separate utility trenching — the most flexible option but also the most expensive per square foot. An attached ADU (AADU) built over or beside an existing garage can often tie into the house's existing ledger board and joist hangers, cutting foundation cost significantly. A basement conversion in an older Gig Harbor home near downtown usually means adding an egress window — a Milgard casement rated for emergency escape — plus sistering floor joists if the original framing doesn't meet current live-load requirements. TopVolk walks through all three options on-site before recommending one, since the right call depends on lot size, existing framing, and whether you want rental income or a family suite."
  - title: "Utility separation: shared meter or new connection"
    description: "Renting out a DADU near Wollochet Bay or Rosedale usually means the tenant needs their own water meter and a dedicated sewer lateral, not a shared line running back to the main house's panel and plumbing stack. Cutting a new sewer connection means trenching across the yard, tying into the city main or an existing septic system, and installing a backflow preventer at the water tap — work that adds real cost and needs its own inspection pass. Properties still on septic near Artondale sometimes need a capacity review before a second unit gets approved, since the system was sized for one household. Skipping this step is the most common reason ADU permits stall mid-review. Budget for utility separation early instead of discovering it during framing."
  - title: "Permit jurisdiction and code review timelines"
    description: "Projects inside Gig Harbor city limits, including most of 98332, go through the City of Gig Harbor Community Development Department, while unincorporated pockets of 98335 near Artondale and Key Peninsula Road file with Pierce County PALS instead — two different offices, two different intake forms, and it matters which one your parcel falls under. Plan review under the IRC typically runs six to ten weeks for a detached ADU once the application is complete, plus another three to five months for construction from rough-in to final inspection. Height is capped around 24 feet for a DADU, and setback plus FAR (floor area ratio) limits get checked against your specific lot before design even starts. TopVolk is a WA Licensed Contractor and pulls permits, schedules inspections, and handles AHJ correspondence directly — no third-party permit runner involved."
  - title: "What an ADU actually costs in Gig Harbor"
    description: "Most detached ADU builds here land between $180,000 and $320,000 depending on size, foundation type, and finish level; basement conversions run lower, typically $90,000 to $160,000, since the shell already exists. Cost drivers include utility trenching distance, foundation type (slab versus crawlspace with a DriCore subfloor), and finish choices — semi-custom cabinets with quartz counters and a KitchenAid range cost meaningfully less than a Sub-Zero and Thermador kitchen in a rental unit that doesn't need it. Every quote is line-item, not a rough range, so you know what you're paying for insulation versus tile versus electrical. Deadline penalties are written into the contract itself, not promised verbally. Call (206) 591-1096 for a free on-site consultation with Vladislav directly."
  - title: "Building for the long haul in a marine climate"
    description: "Gig Harbor sits close enough to the water that siding, insulation, and mechanical choices all need to account for roughly 40 inches of rain a year and near-constant humidity. Hardie cement-board siding holds up better than raw cedar against moss and rot on north-facing walls, and R-49 attic insulation with a proper vapor barrier keeps a small ADU from feeling damp in January. PT lumber gets used anywhere framing touches grade or a deck ledger connects to the structure, since untreated Douglas-fir won't last in ground contact out here. A Mitsubishi or LG mini-split system typically runs 15-20 years with annual filter service; a Rinnai or Navien tankless water heater needs descaling every couple years given local water hardness. None of this is optional — it's what keeps a $200K build from needing siding repair by year eight."

