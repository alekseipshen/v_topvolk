title: "Gig Harbor HVAC — Heat Pumps for Waterfront Homes"

answer: "TopVolk installs heat pumps, ductless mini-splits, and high-efficiency furnaces in Gig Harbor, WA — 100+ projects since 2017, WA Licensed Contractor."

intro: |
  Vladislav Volkov gets the same call every August from Gig Harbor North: the upstairs bedrooms hit 82 degrees by 3pm and the single forced-air furnace downstairs can't do anything about it because it was never built to cool, only heat. That's the reality for a lot of homes near Canterwood and Skansie Brothers Park built in the '80s and '90s — gas furnace, ductwork sized for winter heat loss, zero air conditioning. TopVolk handles the fix as part of larger remodel and addition work: heat pump conversions that replace the gas furnace outright, or a Daikin or Mitsubishi ductless mini-split added to a bonus room or ADU that the existing ductwork never reached. Homeowners near the water on Wollochet Bay deal with a second issue — salt air corrodes outdoor condenser coils faster than inland units, so equipment choice and placement matter more here than in, say, Puyallup. Call (206) 591-1096 for a free on-site consultation with Vladislav directly, not a sales rep reading from a script.

localContext: |
  Housing in 98332 and 98335 splits into two eras that drive different HVAC problems. Older waterfront and near-town homes built before 1995 — around Artondale and the Wollochet Bay shoreline — often run galvanized ductwork with no return-air balancing, so upstairs rooms cook in summer and freeze in the shoulder seasons. Newer construction in Canterwood and Gig Harbor North (2000s and later) meets tighter energy code but still gets built with furnace-only systems since AC wasn't standard here until recently. Permit-wise, work inside city limits routes through the City of Gig Harbor Community Development Department; homes out toward Purdy, Rosedale, or unincorporated pockets near Wollochet fall under Pierce County PALS instead, and the two departments don't always want the same paperwork. Salt air off Henderson Bay and Colvos Passage also shortens condenser life on units mounted too close to the water without a coated coil.

commonProblems:
  - title: "Gas Furnace Still Running When a Heat Pump Would Cost Less to Operate"
    description: "A lot of Gig Harbor North homes built in the '90s still run an 80% AFUE gas furnace with no cooling attached. Swapping to a Bosch or Daikin heat pump means pulling the old furnace, running new refrigerant line sets to an outdoor condenser, and tying the air handler into existing ductwork — usually a 2-3 day job once the Manual J load calc is done. Federal Inflation Reduction Act tax credits plus whatever Puget Sound Energy is offering that quarter can knock $2,000-$4,000 off the total. Full conversions typically run $9,000-$16,000 depending on ductwork condition."
  - title: "Bonus Room or ADU That the Main Ductwork Never Reached"
    description: "Homes near Crescent Creek Park with a converted bonus room over the garage, or new DADUs going in under WA HB 1337, almost never have enough duct capacity to extend from the main furnace. A Mitsubishi or LG ductless mini-split solves it without cutting into existing plenum or drywall — one wall cassette, a condensate pump, and a 3-inch line set through the exterior wall. Installation runs $4,500-$8,000 per zone depending on line set length and whether the outdoor condenser needs a new pad. Most single-zone jobs finish in a day."
  - title: "Hot Upstairs, Cold Downstairs in Pre-2000 Homes Near Wollochet"
    description: "Older ductwork around Artondale and Wollochet Bay was never balanced for two-story airflow — undersized return air, no zoning dampers, and duct board joints leaking mastic that's dried out over 20+ years. TopVolk seals and rebalances the trunk line, adds a zoning damper with an ecobee or Nest smart thermostat, and pressure-tests before closing anything back up. Sealing and rebalancing runs $1,800-$3,500 depending on attic access. Work inside Gig Harbor city limits doesn't usually need a separate mechanical permit for duct sealing alone, but new equipment does — filed through the City of Gig Harbor, not Pierce County PALS, unless the property sits in an unincorporated pocket."
  - title: "AC Addition Sized Wrong for the Existing Furnace's Ductwork"
    description: "Adding a condenser to an existing forced-air system sounds simple until the ductwork can't actually move the extra air. TopVolk runs a Manual J load calculation before quoting anything, because undersized trunk lines mean a new AC unit short-cycles and never actually cools the far bedrooms. A properly matched AC add-on with a Daikin or LG condenser, new refrigerant lines, and a coil swap at the air handler runs $6,000-$11,000 in the Gig Harbor area. Skipping the load calc is the single biggest reason homeowners end up calling back a year later."
  - title: "15+ Year-Old Furnace or Heat Pump Nearing End of Life"
    description: "Most gas furnaces and heat pumps installed in Gig Harbor homes in the early 2010s are hitting 12-15 years now, which is when compressor and heat exchanger failures start showing up. A failing heat exchanger on a furnace is a safety issue, not a repair-and-wait situation — TopVolk replaces rather than patches those. New high-efficiency equipment (95%+ AFUE furnaces, or a Bosch heat pump) comes with 10-year parts warranties and cuts winter gas bills noticeably in a house that hasn't had the ductwork touched since it was built. Full replacement projects, bundled with duct sealing, typically land in the $12,000-$20,000 range and take 1-2 weeks including inspection."

faq:
  - q: "How fast can you get to Gig Harbor for HVAC work?"
    a: "Gig Harbor sits about 20 minutes off SR-16 from TopVolk's usual service loop through Pierce County, so on-site consultations are usually scheduled within a few days of the call. Waterfront properties around Wollochet Bay sometimes need extra coordination for equipment delivery access — narrow driveways, steep grades — which Vladislav walks through during the first visit. Larger jobs like a full heat pump conversion typically start within 2-3 weeks of signed contract, condenser and ductwork parts depending. Call (206) 591-1096 to get on the schedule."
  - q: "What does a heat pump conversion cost in Gig Harbor?"
    a: "A full gas-to-heat-pump conversion with a Bosch or Daikin system typically runs $9,000-$16,000 depending on existing ductwork condition and whether the electrical panel needs an upgrade to handle the new load. A single-zone ductless mini-split for an ADU or bonus room runs $4,500-$8,000 instead. Pricing depends on line set length, condenser placement, and whether the old furnace needs full removal. Every quote from TopVolk is a line-item estimate after a free on-site walkthrough, not a phone guess."
  - q: "Do I need a permit for HVAC work in Gig Harbor?"
    a: "Equipment replacement and new heat pump or AC installs need a mechanical permit, filed through the City of Gig Harbor Community Development Department for homes inside city limits, or Pierce County PALS if the property sits in an unincorporated area like parts of Wollochet or Rosedale. Plan review typically takes 1-3 weeks for straightforward equipment swaps. TopVolk is a WA Licensed Contractor and handles the permit filing and inspection scheduling directly — no separate permit-runner fee."
  - q: "Ductless mini-split or central heat pump — which fits my Gig Harbor house?"
    a: "If the whole house already has ductwork in decent shape, a central heat pump (Bosch, Daikin) usually makes more sense and costs less per square foot of coverage. If it's one room — a bonus room, a DADU under WA HB 1337, an addition — a Mitsubishi or LG ductless mini-split skips tearing into drywall entirely. Vladislav walks the ductwork and does a load calc on-site before recommending either, since guessing wrong means paying for it twice."
  - q: "What's the warranty on new HVAC equipment, and how long does it last near the water?"
    a: "Manufacturer warranties on Bosch, Daikin, and Mitsubishi equipment typically run 10 years on parts when registered at install. Salt air off Henderson Bay and Colvos Passage shortens outdoor condenser life compared to inland Pierce County, so coastal installs get coil placement and coating recommendations to offset it. Properly installed and maintained equipment runs 15-20 years inland, closer to 12-15 right on the waterfront. TopVolk also writes deadline penalties into every contract, so installation delays cost the company, not the homeowner."
  - q: "Do you cover areas near Gig Harbor too?"
    a: "Yes — TopVolk works throughout Pierce County plus King, Snohomish, and Kitsap, so Purdy, Fox Island, University Place, and the Key Peninsula are all in the normal service loop, not a special trip. Scheduling windows run similar to Gig Harbor itself, usually a few days out for consultations. Vladislav handles every project personally, so there's no dispatcher juggling crews across cities. Call (206) 591-1096 or ask for a free consultation to get a specific date."