title: "Gig Harbor Plumbing — Repipes, Repairs & Upgrades"

answer: "TopVolk Construction handles repipes, tankless conversions, and fixture installs in Gig Harbor, Washington — WA Licensed Contractor, 100+ projects since 2017."

intro: |
  Repiping a Gig Harbor home built before 1975 usually means swapping galvanized steel for PEX or copper, and TopVolk Construction handles that work along with tankless water heater conversions, fixture upgrades, and drain rerouting for kitchen and basement remodels across the Peninsula. A lot of the calls here start the same way — low water pressure in an upstairs bathroom near Skansie Park, or rust-colored water coming out of a kitchen faucet in a Canterwood rambler. Homeowners near the Gig Harbor waterfront and out toward Wollochet Bay are investing in higher-end fixtures too; a recent kitchen remodel off Point Fosdick Drive paired a new Rinnai tankless unit with a Kohler apron-front sink, which meant upsizing the gas line before the final inspection. Vladislav Volkov handles these jobs directly — no dispatcher, no sales rep walking the site first. Call (206) 591-1096 and get a straight answer on what the pipe work actually involves before anyone touches a wall.

localContext: |
  Gig Harbor's housing stock splits pretty cleanly by decade. In the 98332 core near downtown and the harbor, you'll find older frame houses from the 1960s and 70s still running galvanized supply lines and undersized drain stacks, while newer construction in Canterwood and out toward 98335 in Artondale and Rosedale tends to have copper or PEX already in place but original builder-grade fixtures from the 90s that are due for a Moen or Delta upgrade. Homes inside city limits go through the City of Gig Harbor Building Division for water heater and repipe permits, while properties out past Purdy and Horsehead Bay in unincorporated Pierce County fall under Pierce County PALS instead — different counter, different timeline, and TopVolk pulls whichever one applies before work starts. A fair number of houses out near the water still run on private wells, so pressure tank and pressure-regulator work comes up more here than in a typical Tacoma neighborhood. Winter cold snaps off the Sound can freeze an exposed crawlspace line if it's not wrapped, and that's a call we get every few years.

commonProblems:
  - title: "Galvanized Pipe Corrosion in Pre-1975 Gig Harbor Homes"
    description: "Houses built before the mid-70s near downtown Gig Harbor and along Soundview Drive were plumbed with galvanized steel, and after 40-50 years the inside of that pipe rusts down to a pinhole, which is why water pressure drops every time someone flushes a toilet upstairs. The fix is a full repipe with PEX-A tubing (we run Uponor) or copper where code or HOA rules require it, routed through the attic or crawlspace instead of tearing out finished walls wherever possible. A two-bath, one-kitchen repipe usually runs 3-5 days and lands in the $8,000-$14,000 range depending on how many fixtures need new shutoff valves. Galvanized-to-copper transitions also throw off electrical bonding in older homes, so we check that during rough-in, not after."
  - title: "Tankless Conversions That Need a Gas Line Upsize"
    description: "Swapping a 50-gallon tank for a Rinnai or Navien tankless unit sounds simple until the gas line turns out to be half-inch black iron sized for a furnace and a water heater combined, not the extra BTU draw a tankless unit pulls on demand. We resize to three-quarter-inch, sometimes CSST, from the meter or regulator, which on a typical Gig Harbor lot means a permit through the City of Gig Harbor or Pierce County PALS depending on the address, plus a rough-in inspection before the wall closes up. Vent routing matters too — a Navien needs PVC intake and exhaust run through the rim joist or roof, not a shared flue with a gas furnace. Budget $4,500-$7,500 installed, more if the gas upsize runs a long distance from the meter."
  - title: "Rerouting Drain Lines for Island Sinks and Basement Baths"
    description: "Adding a wet bar sink to a kitchen island or a bathroom in a daylight basement means running new drain line to an existing stack, and on a slab or a home with a low crawlspace that's often not enough fall to gravity-drain. We spec a Saniflo-style macerating pump when the vertical rise won't work, and route the vent through the nearest wall cavity to keep it code-legal under the IRC plumbing chapters. Permits for new drain and vent work go through the City of Gig Harbor Building Division for in-city addresses; plan review typically takes 2-4 weeks before we can schedule the rough-in inspection. We've done this for kitchen islands in Canterwood remodels and for basement baths added near Crescent Creek Park. Final inspection has to pass before drywall goes back up."
  - title: "What Drives Plumbing Costs Up (or Down) in Gig Harbor"
    description: "City water pressure on parts of the Peninsula tests above 80 psi, which is hard on every fixture in the house and shortens the life of a water heater — a $250-$400 pressure-reducing valve at the main shutoff fixes that and pays for itself in fewer failed supply lines. Beyond that, cost comes down to fixture tier: a builder-grade Delta faucet installs for a fraction of what a Kohler or Moen high-arc kitchen faucet with a touch feature runs, and premium brands often need a different rough-in valve body. Line-item quotes from TopVolk break out labor, fixture cost, and permit fees separately, so there's no guessing what's driving the number. Deadline penalties are written into the contract, which matters on a remodel where the plumbing schedule holds up drywall and tile crews behind it."
  - title: "Water Heater Lifespan and Seismic Strapping Requirements"
    description: "A standard 50-gallon tank water heater lasts 10-12 years around Puget Sound, less if the house is on well water with higher mineral content out past Rosedale. Washington code requires seismic strapping on every replacement — two straps, upper and lower third of the tank, anchored to wall framing, not just drywall — and that's an easy thing to miss if a homeowner does a swap without pulling a permit. We check the anode rod and flush sediment on service calls, since a neglected tank corrodes from the inside faster than the exterior lets on. Expect to replace a tank heater once it starts rumbling or the pilot won't hold; a tankless unit with proper isolation valves and annual descaling can run 15-20 years instead."

faq:
  - q: "How fast can you get to Gig Harbor for Plumbing?"
    a: "Gig Harbor sits a short run across the Tacoma Narrows Bridge off Highway 16, and most first visits get scheduled within two to three business days once we know the scope. Driveways and street parking in neighborhoods like Canterwood or the downtown waterfront area aren't usually a problem, though narrow lanes near Skansie Brothers Park sometimes mean parking a truck up the block. A straightforward fixture swap or valve repair often finishes same-day; a full repipe or tankless conversion is scheduled out as its own project with a start and end date in the contract. Call (206) 591-1096 to get on the calendar."
  - q: "What does a repipe or plumbing job cost in Gig Harbor?"
    a: "A whole-house repipe on a typical 3-bed, 2-bath Gig Harbor home runs $8,000-$14,000 depending on pipe material, number of fixtures, and whether walls need to be opened or we can route through the attic and crawlspace. Smaller jobs — a water heater swap, a fixture replacement, a pressure regulator install — land more in the $600-$2,500 range. What actually moves the number is access: a post-and-pier crawlspace is faster to work in than a slab foundation with no crawlspace at all. TopVolk gives a line-item quote after a free on-site consultation, not a phone estimate, so the price reflects what's actually behind the wall."
  - q: "Do I need a permit for plumbing work in Gig Harbor?"
    a: "Water heater replacements, repipes, and new drain or vent work inside Gig Harbor city limits go through the City of Gig Harbor Building Division, while addresses out past Purdy or in unincorporated parts of the Key Peninsula fall under Pierce County PALS. Plan review on a straightforward permit usually takes 1-3 weeks; a repipe with multiple fixture relocations can take longer if plan review flags the vent layout. TopVolk pulls the permit, schedules the rough-in inspection, and handles the final inspection walkthrough as a WA Licensed Contractor. Canterwood and some waterfront lots also have HOA design review for anything visible from the exterior, like a new gas meter location, which we account for before applying."
  - q: "Is a tankless water heater worth it for a Gig Harbor home?"
    a: "For a house with two bathrooms and a dishwasher and washer running at the same time, a Navien or Rinnai tankless unit keeps up better than a 40-gallon tank, especially with teenagers in the house. It needs a dedicated gas line sized correctly, a condensate drain if it's a condensing model, and isolation valves for descaling — skip those and the warranty can get denied. Well water on the Peninsula tends to run harder than city water, so we recommend a scale inhibitor ahead of the unit to protect the heat exchanger. Installed cost runs higher than a tank swap, but the 15-20 year lifespan makes it worth it for most families we've worked with here."
  - q: "How long should plumbing work last in Gig Harbor's climate?"
    a: "PEX-A and copper repipes carry a manufacturer warranty of 25 years or more, and TopVolk backs the labor on top of that. Puget Sound's wet winters aren't hard on interior plumbing the way freeze-thaw cycles are out in North Bend or Enumclaw, but exposed crawlspace lines near the water in Wollochet or Horsehead Bay still need insulation and heat tape if they run along an exterior wall. Fixtures like Kohler and Moen carry their own lifetime warranties on the cartridge and finish, which we register at install. Anything we install gets a workmanship warranty separate from the manufacturer's coverage."
  - q: "Do you cover areas outside Gig Harbor too?"
    a: "TopVolk works throughout Pierce County plus King, Snohomish, and Kitsap — so Fox Island, University Place, Tacoma, and the rest of the Key Peninsula are all in range along with Gig Harbor itself. Scheduling typically runs one to two weeks out for project-based plumbing work tied to a remodel, faster for standalone repairs. Vladislav handles the estimate and the job personally, so there's no separate sales visit before the work gets scheduled. Call (206) 591-1096 or ask for a free consultation to get a specific date."