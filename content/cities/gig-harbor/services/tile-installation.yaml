title: "Gig Harbor Tile Installation — Built for PNW Moisture"

answer: "Vladislav Volkov's crew installs and waterproofs tile in Gig Harbor homes — WA Licensed, 100+ projects since 2023, free on-site quotes."

intro: |
  Ask a tile setter in Gig Harbor what fails first, and it's almost never the tile itself — it's what's underneath it. TopVolk Construction handles tile installation and waterproofing for showers, kitchen floors, and backsplashes across the Gig Harbor peninsula, from downtown near the marina to Canterwood and out toward Wollochet Bay. Vladislav Volkov runs every job himself, so the person quoting your Schluter Kerdi shower pan or your kitchen backsplash tie-in is the same person checking the mud bed slope before tile goes down. Homes near the water here run humid year-round, which matters more for a tile shower than most homeowners realize — a membrane that holds up fine in Puyallup can fail within three years on a lot two blocks from Donkey Creek Park. Kitchens in Gig Harbor increasingly pair large-format porcelain floors with Bosch or Thermador ranges, and that combination needs a laser-leveled substrate or the grout lines telegraph every dip in the subfloor within a year.

localContext: |
  Housing stock around Gig Harbor splits pretty evenly between older waterfront cottages near downtown (98335) and newer construction out toward Canterwood, Purdy, and Artondale (98332), and each type creates different tile problems. The older homes, some dating to the 1950s and 60s, often have plywood subfloors that have seen decades of moisture cycling off the harbor air — that plywood needs to be checked for deflection before any large-format porcelain goes down, or you're setting tile on a substrate that's already flexing. Newer builds out toward Canterwood and the Peninsula school district area tend to have engineered floor systems that handle heated tile setups like Schluter Ditra-Heat better, but plenty still skip a proper vapor barrier in crawlspace-supported bathrooms. Permitting depends on which side of the city line you're on: inside Gig Harbor city limits, wet-area remodels route through the City of Gig Harbor Building Division; out in unincorporated Artondale, Wollochet, or Purdy, that same job falls under Pierce County PALS instead. Different intake, different review clock, and it changes how we schedule your rough-in inspection.

commonProblems:
  - title: "Kerdi Membrane Failures in Waterfront Shower Pans"
    description: "Gig Harbor sits right on the water, and that humidity gets into bathrooms whether the exhaust fan runs or not. A shower built with thinset alone and no membrane will show efflorescence at the grout lines within two years — moisture is wicking through the mortar bed into the framing behind it. Every pan gets built with Schluter Kerdi sheet membrane, sealed at the curb, the niche, and every corner with Kerdi-Band, then flood-tested before a single tile goes on. RedGard, a liquid-applied membrane, backs up the benches and curbs where sheet membrane is harder to detail. A properly membraned shower runs $9,000-$16,000 depending on size and tile selection, and it should outlast the house's next two paint jobs before anyone touches it again."
  - title: "Lippage on Large-Format Porcelain Floors"
    description: "24x48 and 32x32 porcelain floors are showing up in a lot of Gig Harbor kitchen remodels paired with LG or Samsung induction ranges, and they're unforgiving of an uneven subfloor. Anything more than 1/8 inch of variance across a 4-foot span shows up as lippage — a ridge you can catch a sock on — because a tile that size can't flex to follow a dip the way a 12x12 could. The fix starts with a laser-leveled substrate, sometimes a self-leveling underlayment poured over the subfloor, before tile gets set with large-format thinset and lippage-leveling clips. Skipping that step is the single most common callback in this trade. Budget an extra $2-$4 per square foot for substrate prep on an older Gig Harbor home versus new construction that's already flat."
  - title: "Backsplash Tie-Ins and Permit Jurisdiction Confusion"
    description: "A tile backsplash by itself usually doesn't need a permit, but the kitchen remodel it's part of often does — especially once an electrician is relocating outlets behind the range hood or adding under-cabinet lighting before tile goes up. Inside Gig Harbor city limits, that electrical and any wet-area plumbing work gets permitted through the City of Gig Harbor Building Division; out in Artondale or Wollochet, Pierce County PALS runs plan review instead, and their turnaround can add a couple weeks. Coordinating the outlet relocation, blue tape walkthrough, and tile layout together keeps the backsplash pattern from getting stuck with a half-tile next to a new outlet box. TopVolk is a WA Licensed Contractor, and Vladislav pulls and manages permits directly — no subcontractor guessing at whose job the inspection is."
  - title: "What Heated Tile Floors Actually Cost Here"
    description: "Bathroom remodels in Gig Harbor's higher-income neighborhoods increasingly ask for radiant heat under the tile, usually Schluter Ditra-Heat or a Warmup cable mat, since a cold porcelain floor in a house that's 55 degrees at 6am in January doesn't get used much. Ditra-Heat runs $12-$18 per square foot installed including the tile above it, more than a Warmup loose-cable system at $8-$12 per square foot, but Ditra-Heat also serves as the uncoupling membrane so you're not paying for two separate layers. The real cost driver isn't the mat — it's whether an electrician needs to add a dedicated thermostat circuit, which adds $400-$800 depending on panel location. Every quote from TopVolk is line-item, not a range, and if the completion date slips past what's in the contract, that penalty is written in."
  - title: "Natural Stone Sealing and Long-Term Maintenance"
    description: "Travertine and marble show up in Gig Harbor primary suites more than you'd expect for a town this size, and both are porous enough that PNW moisture works against them if nobody's sealing them on schedule. Unsealed natural stone in a shower will etch and stain within a year from soap scum and hard water alone. Sealing happens at installation with a penetrating sealer, and resealing every 12-18 months after that runs $150-$300, something homeowners can also do themselves. Porcelain doesn't need that upkeep at all, which is why a lot of clients get steered there for shower floors and save the marble for a low-moisture accent wall instead. Grout choice matters too — epoxy grout resists staining far longer than standard cement grout near a curbless shower entry."

faq:
  - q: "How fast can you get to Gig Harbor for Tile Installation?"
    a: "Gig Harbor is a straight shot down SR-16 from the rest of TopVolk's Pierce and King County service area, usually 25-40 minutes depending on where the job site sits relative to the Narrows Bridge. Most tile jobs start with a free on-site consultation with Vladislav directly, not a salesperson, so the substrate condition gets checked before quoting. Parking near downtown Gig Harbor waterfront homes can be tight, so material staging gets planned around that during scheduling. Call (206) 591-1096 to get on the calendar — small bathroom tile jobs typically start within 2-3 weeks of signing."
  - q: "What does a tile shower or kitchen tile job cost in Gig Harbor?"
    a: "A standard bathroom shower retile with waterproofing runs $9,000-$16,000, a kitchen backsplash typically runs $1,800-$4,500 depending on tile material and outlet count, and large-format porcelain floors run roughly $14-$22 per square foot installed including substrate prep. What actually moves the number is substrate condition, not the tile itself — an old plywood subfloor that needs leveling before large-format porcelain adds real cost. Natural stone and custom mosaic patterns push labor higher than standard porcelain or ceramic. A written, line-item quote follows the free on-site visit, not a phone estimate."
  - q: "Do I need a permit for a tile shower remodel in Gig Harbor?"
    a: "If the remodel touches plumbing, electrical, or structural framing — which most full shower gut jobs do — yes, and it routes through the City of Gig Harbor Building Division if you're inside city limits. Homes out in unincorporated Artondale, Wollochet, or Purdy go through Pierce County PALS instead, which can add a week or two to plan review. TopVolk is a WA Licensed Contractor, and Vladislav pulls the permit, schedules the rough-in inspection, and handles the final inspection walkthrough directly. A straightforward bathroom retile usually clears permitting and construction in 3-5 weeks total."
  - q: "What's the difference between Schluter Ditra and a traditional mud bed for tile floors?"
    a: "A mud bed is a mortar bed troweled and screeded flat, then tiled on top — it's been the standard for decades and still works well for sloped shower floors. Schluter Ditra is a thin polyethylene uncoupling membrane that decouples the tile from subfloor movement, so seasonal wood shrinkage in an older Gig Harbor home doesn't crack the grout lines above it. Ditra installs faster and adds less floor height, which matters at tile-to-hardwood transitions where an even expansion gap has to be maintained. Flat bathroom and kitchen floors usually get Ditra; shower pans and benches still get better detailing from a mud bed or Kerdi-Board."
  - q: "How long does tile installation last in Gig Harbor's climate?"
    a: "Properly waterproofed porcelain tile in a Gig Harbor bathroom should last 25+ years without needing anything beyond regrouting the caulk lines every few years. The failure point is almost always the membrane or substrate underneath, not the tile itself, which is why the waterproofing detailing gets warrantied separately from the tile material warranty that comes from the manufacturer. Natural stone needs more upkeep — sealing every 12-18 months — to hit that same lifespan given how much moisture sits in the air near the water. TopVolk backs the installation work, and since it's owner-led, any issue goes straight to Vladislav, not a call center."
  - q: "Do you cover areas near Gig Harbor like Purdy or Fox Island?"
    a: "Yes — TopVolk covers the whole peninsula, including Purdy, Wollochet, Artondale, Fox Island, and Key Peninsula, along with the rest of Pierce, King, Snohomish, and Kitsap counties. Scheduling for tile work usually books 2-4 weeks out depending on season, with spring and early summer being the busiest stretch for bathroom remodels. Full kitchen tile projects tied to a larger remodel run 6-10 weeks start to finish once permitting is done. Call (206) 591-1096 or schedule a free consultation to get an exact start date for your address."