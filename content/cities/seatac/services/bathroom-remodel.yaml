title: "SeaTac Bathroom Remodel — 40 Years of Humidity Caught Up"

intro: |
  Angle Lake's residential blocks — zip codes 98188 and 98148 — hold a lot of
  1960s and 1970s ranch-style homes where the original bathroom tile is still on
  the walls. No waterproofing membrane behind the tub surround. Galvanized supply
  lines. Moen faucets corroded past function. The rain stacking up here October
  through April accelerates everything — grout cracks, caulk fails, and what
  started cosmetic turns structural fast.

localContext: |
  Most of SeaTac's housing stock went up between 1958 and 1985, concentrated in
  the flatlands east of International Boulevard and the quieter residential blocks
  off S 188th St. Crawlspace foundations in 98168 trap moisture year-round —
  vapor barrier upgrades come up constantly in bathroom projects here. Bathrooms
  in these homes are typically 3x5 or 5x7 floor plans: tight, with undersized
  exhaust fans that can't move enough CFM to handle PNW humidity, and no room
  for error when repositioning plumbing.

commonProblems:
  - title: "No Waterproofing Membrane Behind the Tub Surround"
    description: >-
      Pre-1990 SeaTac homes typically have greenboard or plain drywall behind
      the tile — nothing approaching a real waterproofing system. Once grout or
      caulk cracks, water infiltrates the wall cavity fast. Installing Schluter
      Kerdi membrane or coating cement board with RedGard stops the cycle.
      Catching it late means mold remediation on top of the remodel cost.
  - title: "Undersized Exhaust Fans and Chronic Bathroom Mildew"
    description: >-
      A 50 CFM fan from 1975 isn't cutting it through SeaTac's wet season. Mold
      on ceiling drywall and peeling paint are the visible symptoms. Upgrading
      to a 110–130 CFM unit — vented to the exterior, not into the attic —
      requires a rough-in inspection under King County DPER permit review.
      That's the actual fix, not another coat of paint.
  - title: "Cast-Iron Drain Stack Constraints on Layout Changes"
    description: >-
      Many 1960s SeaTac ranchers have a cast-iron drain stack that locks in the
      bathroom layout. Moving a toilet or repositioning a walk-in shower drain
      means cutting the subfloor, adjusting the rough-in, and tying into the
      existing stack — all permitted work through King County DPER. Kohler's
      modern toilet rough-in dimensions often don't match the original plumbing
      spacing in these homes.

