title: "SeaTac Bathroom Remodel — Gut the 1970s Out of Your 98188 Bath"

intro: |
  SeaTac's airport sound mitigation program replaced windows across hundreds of 98188 homes over the last two decades — but nobody touched the bathrooms. Four-inch ceramic tile, dated Kohler fixtures, and galvanized drain piping still frozen in 1975. The ranchers lining South 154th to South 188th Street tell the same story: tile holds together on the surface, and the drywall behind the shower surround is soft.

localContext: |
  Most of SeaTac's housing stock landed between 1955 and 1985 — ranch-style and split-level builds in 98188 and neighboring 98148, constructed during the airport expansion years when this land was still unincorporated King County. The original bathrooms got 3/8-inch greenboard instead of cement backer, exhaust fans rated at 50 CFM, and cast-iron drain stacks that corrode from the inside out over 40-plus years. Moisture has had decades of runway.

  The Angle Lake neighborhood — a few blocks east of the Angle Lake Link Station on International Blvd — is a good snapshot of what we see throughout SeaTac. Split-levels built around 1968-1972, single-story ranchers just north toward South 144th, duplexes scattered through the 98148 zip closer to the Des Moines border. Many of these homes were owner-occupied for 30 years, then turned rental. Deferred maintenance shows up fast when you pull the first tile. Sub-floor sheeting wet from a failed caulk joint, blocking rotted behind the tub flange, cast-iron corroded down to scale at the cleanout.

  The airport flight corridor runs directly overhead, which matters more than people realize. The FAA Part 150 sound insulation retrofits sealed attic vents in a significant share of 98188 homes — and a sealed attic over a poorly ventilated bathroom accelerates mold growth inside wall cavities. That's a problem we find more often in SeaTac than anywhere else in King County.

  South of Angle Lake Park, the blocks running toward the 98168 boundary with Burien shift to slightly newer stock — late 1970s to early 1980s ranchers that skipped cast-iron but still used ABS drain piping that wasn't glued correctly at the joints. North of S 176th, closer to the Tukwila border along Military Rd S, you get a mix of 1960s original-owner homes and 1990s infill — two completely different substrate situations under the same tile. The strip along 24th Ave S between S 154th and S 160th runs through the McMicken Heights area, which is unincorporated King County (98168) rather than the city of SeaTac — permit jurisdiction matters when you're pulling a plumbing relocation permit, and King County DPER and the SeaTac city permit center are two separate processes.

commonProblems:
  - title: "Wet Wall Rot Behind Ceramic Tile"
    description: "1970s SeaTac bathrooms were tiled directly over drywall — no cement backer board, no waterproofing membrane. After 40 years of shower steam, that substrate is compromised. Pulling 4x4 ceramic in any 98188 ranch almost always exposes soft greenboard or visible mold. The correct fix is full demo to studs, Schluter Kerdi or RedGard over Hardiebacker, then large-format porcelain set in modified thinset. In Angle Lake-area homes with the sealed attic retrofits, we also add a dedicated exhaust path before closing up the wall — otherwise the moisture problem restarts."
  - title: "Master Bath Layout Stuck in 1975"
    description: "Ranch homes in 98148 were built with a 32x60 alcove tub and prefab surround in the master — which is exactly what most owners want gone. Converting to a curbless walk-in shower with a bench and niche means relocating drain rough-in and sometimes shifting a non-load-bearing wall. King County DPER handles permitting for plumbing relocation in unincorporated zones; the SeaTac city permit center covers addresses inside city limits — plan review typically runs 4-8 weeks for this scope. Worth confirming your address jurisdiction before submitting. Some blocks along International Blvd sit right on the boundary, and a handful of McMicken Heights addresses in 98168 file through DPER even though they feel like SeaTac."
  - title: "Exhaust Fans That Can't Handle PNW Humidity"
    description: "Original 50 CFM bath fans in 1960s-70s SeaTac homes were marginal when new. SeaTac averages 37 inches of rain annually, and under-ventilated bathrooms grow mold on grout lines within a season. Upgrading to a Broan or Panasonic WhisperCeiling fan rated at 110 CFM, ducted directly to the exterior — not into the attic — breaks the mildew cycle. Split-levels in the South 154th corridor often have a longer duct run to reach the soffit; that requires an inline booster fan to maintain adequate CFM at the grille. The sealed-attic problem from the FAA sound insulation program compounds this in 98188 — we account for the modified attic access path on every job in that corridor."

faq:
  - q: "How fast can you get to SeaTac for a bathroom remodel consultation?"
    a: "SeaTac is right off I-5 and SR-99 — roughly 20 minutes from most of our project corridor. Street parking on residential blocks in 98188 is straightforward. Call (206) 591-1096 to schedule a free on-site consultation; most slots open within the week."
  - q: "What fixture brands do you typically work with on SeaTac bathroom remodels?"
    a: "Moen and Kohler are the most common in 98188 ranchers. American Standard turns up in older builds. For new installs, we usually spec Moen Posi-Temp or Kohler Rite-Temp pressure-balance valves — solid mid-range that doesn't blow the budget. Schluter linear drains for curbless shower builds."
  - q: "What does a bathroom remodel cost in SeaTac, and do you pull the permits?"
    a: "Full bathroom remodel in SeaTac typically runs $18,000–$45,000 depending on layout changes and finish level. Plumbing relocation or structural work requires a King County DPER permit — we pull it. Vladislav quotes line-item pricing, no vague ranges, and deadline penalties are written into the contract. WA Licensed Contractor, 100+ projects since 2023. Call (206) 591-1096."