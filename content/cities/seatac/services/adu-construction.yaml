title: "SeaTac ADU Construction — Link Light Rail Makes Rental Income Real"

intro: |
  The Link Light Rail SeaTac/Airport station anchors the south end of the city, and that
  single fact changes the math on ADU rentals in 98188. Lots within a half-mile of light
  rail are exempt from off-street parking minimums under WA HB 1337 — which means a DADU
  in the backyard of a 1960s rancher on Military Road S doesn't need a dedicated stall to
  get permitted. McMicken Heights and the residential blocks along 24th Ave S are full of
  those ranchers, most sitting on 7,000–9,000 sq ft lots with genuine room to build. Airport-
  adjacent demand from traveling nurses, airline crew, and contractors on SEA expansion
  projects keeps SeaTac vacancy rates tight year-round. A Navien tankless water heater in
  a well-built 600 sq ft DADU supports a standalone unit that realistically rents for
  $1,400–$1,800/month. TopVolk Construction LLC — owner-operated by Vladislav Volkov,
  WA Licensed Contractor — has completed 100+ projects since 2023 across King and
  Snohomish counties, including ADU builds at multiple price points.

localContext: |
  The housing stock in zip codes 98148 and 98188 skews heavily toward 1955–1975
  construction — split-levels and single-story ranchers with crawlspaces or unfinished
  basements that are legitimate candidates for attached ADU conversion. McMicken Heights
  sits just east of SR-99, and lots there often run flat to a gentle rear-yard slope,
  which keeps DADU foundation costs manageable. The city of SeaTac operates its own permit
  center — this is not a King County DPER application — so plan review timelines and code
  interpretations are handled locally, typically running 6–10 weeks for ADU submittals.
  Structural drawings are required if you're converting an existing basement or adding
  square footage above grade. Douglas-fir framing is standard in these older homes, but
  galvanized supply plumbing shows up regularly in anything built before 1970 — budget for
  a plumbing assessment before committing to a basement AADU. Height limits for detached
  ADUs in SeaTac sit at 24 feet at peak, and FAR and lot coverage limits both apply, so
  pulling parcel data before design work starts is worth the time.

commonProblems:
  - title: "Choosing Between a DADU, Attached ADU, or Basement Conversion"
    description: |
      All three are legal under WA HB 1337, but they're different projects with different
      costs and permit paths. A basement AADU in a 1960s split-level in 98188 typically
      runs $80,000–$130,000 depending on ceiling height, existing egress window size, and
      how much MEP rough-in the space needs. A new detached DADU on a concrete slab starts
      around $150,000 for a simple 400–600 sq ft unit and can push past $250,000 for a
      two-story version with a separate utility connection and full kitchen. The decision
      usually comes down to lot coverage — SeaTac caps what percentage of a lot can be
      covered by structures, and a large house with an attached garage may already be close
      to that limit. Vladislav pulls parcel data and runs lot coverage numbers during the
      on-site consultation, before any design money is spent.

  - title: "Submitting a Complete Permit Package to SeaTac's Permit Center"
    description: |
      SeaTac's permit center handles ADU applications separately from standard residential
      work, and incomplete submittals are the most common reason projects stall. A new
      DADU requires architectural and structural drawings, a site plan confirming setback
      and lot coverage compliance, and separate electrical and plumbing permits. Plan review
      runs 6–10 weeks. During construction, a rough-in inspection covers framing, MEP
      rough-in, and insulation before drywall hang — then a final inspection clears the unit
      for occupancy. Setbacks in SeaTac generally require 5-foot rear and side yard clearance
      for DADUs, though corner lots and properties abutting arterials have variations.
      TopVolk prepares the full permit submittal — drawings, site plan, structural notes —
      so the file goes to the AHJ complete the first time and avoids back-and-forth with
      the plan reviewer.

  - title: "Utility Separation: Shared vs. Separate Water and Sewer Connection"
    description: |
      WA HB 1337 doesn't mandate separate utilities for ADUs, but SeaTac's code and
      Highline Water District requirements add complexity depending on the project. A shared
      connection off the main house supply is simpler and cheaper — interior plumbing
      stub-out for an ADU typically runs $8,000–$15,000 depending on distance and existing
      line size. A separate meter, if required or desired for independent rental billing,
      means coordination with Highline Water and King County Metro for the sewer side.
      Pre-1970 homes in 98148 often have galvanized supply lines that need full PEX repipe
      during this phase anyway. Installing a Rinnai or Navien tankless unit dedicated to
      the ADU keeps hot water independent without the cost of splitting the main service
      line — and both brands have solid service coverage in south King County.

  - title: "Lot Coverage and FAR Limits That Kill ADU Plans Before Permit"
    description: |
      This is the problem that ends projects that were never actually buildable. SeaTac,
      like most incorporated cities in King County, caps how much of a lot can be covered
      by structures — and a 1970s house with an attached garage, covered porch, and
      concrete driveway apron may already be at or near that ceiling. FAR (Floor Area
      Ratio) further constrains total gross square footage across all structures on the
      parcel. WA HB 1337 loosened some statewide minimums, but local lot coverage rules
      still apply. A 7,200 sq ft lot with a 1,600 sq ft house and 420 sq ft garage has
      more room than it looks — but you need the numbers in front of you before design
      starts, not after. Vladislav runs this calculation at the initial consultation using
      actual parcel data, so you know what's buildable before committing to architectural
      fees. Call (206) 591-1096 to schedule the site visit.

  - title: "Building Envelope Details That Get Skipped and Cost Money Later"
    description: |
      SeaTac gets roughly 37 inches of rain annually, and a DADU built without proper
      envelope details will show moisture problems within three to five years. Vapor barriers
      in crawlspaces, correct flashing at window and door rough openings, and Hardie cement-
      board siding rather than wood or vinyl make a measurable difference in long-term
      durability. R-49 ceiling insulation and vapor-retarder-class sheathing are required
      under current WA energy code for new ADU construction. North-facing DADU walls in
      McMicken Heights get minimal direct sun from October through March — moss and mildew
      on wood siding start within a year or two in those conditions. Composite or Hardie
      cladding eliminates that maintenance cycle entirely. Schluter Kerdi waterproofing
      membrane in the ADU bathroom shower prevents tile-to-substrate failure in humid PNW
      conditions. Budget an extra $8,000–$15,000 for proper envelope work up front —
      re-siding in five years costs more.

faq:
  - q: "How fast can TopVolk get to SeaTac for an ADU consultation?"
    a: |
      SeaTac is a straightforward drive from TopVolk's Seattle Metro base — SR-99 and I-5
      both run directly through the city, and travel time is under 30 minutes from most of
      the service area. On-site consultations are free, and Vladislav comes out personally —
      no sales rep, just the contractor who would actually run the project. After the site
      visit, you get a line-item written estimate within a few days, not a vague range.
      Most consultations can be booked within a week of first contact. Call (206) 591-1096
      to get on the schedule.

  - q: "What does ADU construction cost in SeaTac?"
    a: |
      Basement AADU conversions in SeaTac's 1960s–70s housing stock typically run
      $80,000–$130,000 depending on ceiling height, egress window scope, and MEP rough-in
      complexity. A new detached DADU on slab starts around $150,000 for a basic 400 sq ft
      unit and can reach $220,000–$270,000 for an 800 sq ft two-story with full kitchen and
      separate utility connection. What pushes the number up: slope requiring a stem wall or
      grade beam, a separate water meter, LVL beam work to open bearing walls in a basement
      conversion, and finish-level selections. TopVolk provides a fixed line-item quote after
      the site visit — no vague ranges. Call (206) 591-1096 to set up the initial consultation.

  - q: "What permits does SeaTac require for ADU construction?"
    a: |
      SeaTac runs its own permit center — ADU projects here don't go through King County
      DPER. A new DADU requires a building permit with full architectural and structural
      drawings, a site plan showing setback and lot coverage compliance, and separate
      electrical and plumbing permits. Plan review typically takes 6–10 weeks. During
      construction, a rough-in inspection covers framing, MEP, and insulation before drywall
      goes up — then a final inspection clears occupancy. TopVolk is a WA Licensed
      Contractor and prepares the complete permit submittal package — drawings, site plan,
      structural notes — so the file goes in complete and avoids back-and-forth with the
      AHJ plan reviewer.

  - q: "Can I rent out my SeaTac ADU to airport workers or traveling professionals?"
    a: |
      Long-term furnished rentals to airline crew, traveling nurses, and SEA airport
      contractors are one of the more reliable income streams for SeaTac ADU owners —
      demand from that group in 98188 is consistent year-round due to airport hub operations
      and the ongoing SEA expansion program. A well-built 600 sq ft DADU with a full
      kitchen, in-unit laundry, and a Mitsubishi mini-split for year-round comfort can
      command $1,500–$1,900/month on a furnished long-term basis. If you're considering
      short-term rental, SeaTac has its own STR ordinance requiring a city business license
      — verify the current rules with the city directly before building your revenue model
      around it.

  - q: "What warranty does TopVolk provide on ADU construction work?"
    a: |
      All TopVolk ADU projects include a three-year workmanship warranty on labor. Structural
      elements — framing, foundation, sheathing — are built to IRC standards, and materials
      carry manufacturer warranties: Hardie siding is backed by a 30-year James Hardie
      warranty when installed per spec, and Rinnai and Navien tankless units carry 5–12
      year parts warranties depending on the model. The contract also includes a deadline
      penalty clause — if the project misses the agreed completion date without a documented
      change order driving the delay, penalties apply to TopVolk. That's in writing before
      construction starts. For questions about specific material warranties or project scope,
      call (206) 591-1096.

  - q: "Does TopVolk build ADUs in cities near SeaTac?"
    a: |
      Yes — the service area covers King, Snohomish, Pierce, and Kitsap counties. ADU
      projects near SeaTac include work in Burien, Tukwila, Des Moines, Renton, and Federal
