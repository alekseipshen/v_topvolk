title: "SeaTac Home Additions — Room to Grow Without Leaving Your Lot"

intro: |
  Multigenerational households have become the norm around Angle Lake and the McMicken Heights
  corridor — adult children moving back, aging parents needing a space with a separate entrance,
  rental income helping offset a mortgage in a city where costs climbed faster than wages. Most
  of the ranchers in the 98188 zip were built between 1955 and 1968, on 6,000–9,000 sq ft lots
  that have real rear yard depth to work with. The challenge is not finding space on paper — it
  is knowing what the City of SeaTac's building department will permit, what FAR (Floor Area
  Ratio) limits the zoning code sets, and whether the original foundation can carry new square
  footage. Under WA HB 1337 (2024), SeaTac parcels now allow up to two ADUs per single-family
  lot, which opened up a new category of addition projects for families who want to keep
  relatives close without sharing a front door. TopVolk Construction LLC, owner-operated by
  Vladislav Volkov, has completed 100+ projects across King County since 2023. Call
  (206) 591-1096 to schedule a free on-site consultation — you will speak directly with
  Vladislav, not a salesperson.

localContext: |
  The 98188 and 98148 zip codes hold a mix of post-war ranchers, early 1960s split-levels, and
  a smaller share of 1970s two-stories along the SR-99 corridor east of the airport. Homes in
  the Bow Lake area and along Military Road South sit on standard R-1 lots — many with 20–25 ft
  rear setbacks that leave real room for a detached ADU (DADU) footprint once lot coverage
  limits are measured against the SeaTac Municipal Code. Exterior framing on these mid-century
  homes is almost always Douglas-fir, which ties in cleanly with new construction, but original
  crawlspace vapor barriers are often thin polyethylene sheeting or missing entirely — a problem
  when you are conditioning new space above. Seattle's heavy rain season runs October through
  May, averaging close to 37 inches a year, which means any addition with exposed sheathing
  during construction needs house wrap and temporary weatherproofing staged before the existing
  roof line is breached. SeaTac's permit center processes residential addition plans separately
  from Seattle SDCI — plan review timelines here typically run 6–10 weeks for structural
  additions, and shorter for straightforward room additions that do not touch load-bearing walls.

commonProblems:
  - title: "Structural Load Limits on 1960s Rancher Foundations Before Adding a Story"
    description: |
      A lot of the single-story homes near Angle Lake were built with post-and-pier or shallow
      concrete perimeter foundations — solid enough for a one-story load, but not automatically
      rated for a full second floor. Before any addition project reaches the permit drawing
      stage, a structural engineer needs to evaluate the existing foundation depth, the rim joist
      and floor joist assembly, and whether the beam spans can carry increased dead and live
      loads. In most SeaTac ranchers, that means sistering existing floor joists, adding an LVL
      (laminated veneer lumber) beam to anchor the new load path, and occasionally pouring
      concrete piers at key bearing points in the crawlspace. Engineering work adds 2–3 weeks to
      the pre-permit phase and typically costs $1,500–$3,000 for a stamped residential structural
      report. The City of SeaTac requires those stamped drawings before issuing a permit for any
      addition that touches load-bearing walls or adds a story — there is no skipping that step.

  - title: "DADU Setback and Lot Coverage Calculations Under WA HB 1337"
    description: |
      WA HB 1337 (2024) changed statewide ADU rules significantly, but local zoning still
      controls setbacks, height limits, and lot coverage maximums — and SeaTac's code was not
      drafted with dense DADU development in mind for every parcel. A typical 7,500 sq ft lot
      in the 98188 zip might carry a 20 ft rear setback, 5 ft side setbacks, and a 40% lot
      coverage cap. Subtract the existing house footprint and any attached garage, and the
      buildable DADU envelope often lands around 400–600 sq ft. That is workable for a studio
      or one-bedroom unit — a Bosch compact dishwasher, a two-burner induction cooktop, and a
      full bath can fit in 420 sq ft with a deliberate layout — but every square foot has to
      count. Vladislav walks each site before drawings begin, measuring actual setbacks and
      flagging any existing structures that would push the DADU footprint into non-compliance
      before money gets spent on plans.

  - title: "Matching Exterior Finishes When Adding to Mid-Century Homes Along Military Road"
    description: |
      Tying a new room bump-out or second-story addition to a 1960s rancher means the exterior
      has to look intentional — not like a box was bolted to the back of the house. Most
      original homes along Military Road South used horizontal cedar lap siding that is now
      weathered or discontinued, and 1990s vinyl additions rarely match any current profile.
      Hardie cement-board lap siding — specifically the HZ10 profile rated for Pacific Northwest
      humidity — has become the standard solution for addition exteriors in this zip. It holds
      paint, resists the wet season without swelling, and can be factory-primed to match existing
      color with a single finish coat. Window selection matters too: Milgard Tuscany Series
      vinyl-framed windows with a U-factor of 0.30 or lower meet the Washington State Energy
      Code requirement for additions and come in sizes that match the original window rhythm on
      most SeaTac ranchers. As a WA Licensed Contractor, TopVolk pulls the permit and
      coordinates the exterior rough-in inspection directly with the city.

  - title: "Running HVAC Into a New Addition Without Overloading Existing Ductwork"
    description: |
      Most mid-century ranchers in SeaTac came with undersized forced-air systems — a single
      gas furnace feeding eight to ten registers that barely covered the original floor plan.
      Adding 300–600 sq ft of conditioned space to that existing duct system without a Manual J
      load calculation is a mistake that shows up fast: the addition runs cold in February, or
      the main system short-cycles trying to compensate. The cleaner fix on most SeaTac addition
      projects is a dedicated Mitsubishi Mr. Slim mini-split — a single-zone 12,000 or 18,000
      BTU head unit handles the new space independently, operates efficiently down to -13°F, and
      does not require chasing new supply runs through finished ceilings. Rough-in for the
      refrigerant line set and the 240V electrical disconnect gets coordinated during framing,
      before drywall closes the walls. Retrofitting refrigerant lines through finished space adds
      $800–$1,500 to the mechanical cost — sequencing matters here.

  - title: "What a Home Addition Actually Costs in SeaTac — and What Moves the Number"
    description: |
      Room additions in SeaTac generally run $150–$250 per sq ft for basic living space —
      bedroom, home office, family room. Add a kitchen or full bath and that range shifts to
      $200–$320 per sq ft once MEP (mechanical, electrical, plumbing) coordination is factored
      in. A 400 sq ft DADU with a separate entrance, kitchenette, and full bath typically lands
      between $85,000 and $140,000 depending on finishes and site conditions. Sloped lots cost
      more. Matching discontinued exterior materials costs more. City of SeaTac permit fees
      typically run $3,000–$8,000 based on project valuation. TopVolk provides a written
      line-item quote after the on-site visit — every subcontractor scope, every material line,
      no vague ranges. Deadline penalties are written into every contract: if the project runs
      past the agreed completion date, there is a daily penalty rate that comes out of our end,
      not yours.

faq:
  - q: "How fast can you get to SeaTac for a home addition consultation?"
    a: |
      SeaTac is easy to reach from anywhere in King County — I-5 and SR-99 both run adjacent
      to the 98188 zip, and the city sits roughly 20 minutes south of downtown Seattle outside
      peak hours. For an addition project, the first step is always an on-site walk-through:
      Vladislav looks at the lot, the existing structure, and the crawlspace before any drawings
      are started. That visit gets scheduled within a week of first contact in most cases. From
      there, permit prep for a standard addition runs 2–4 weeks, followed by 6–10 weeks of plan
      review at SeaTac's permit center. Call (206) 591-1096 to get on the calendar — you will
      reach Vladislav directly.

  - q: "What does a home addition cost in SeaTac?"
    a: |
      Basic room additions — bedroom, home office, bonus room — run $150–$250 per sq ft.
      Add a kitchen or wet bar and costs shift toward $200–$320 per sq ft due to plumbing
      rough-in, ventilation requirements, and electrical panel capacity. A 400 sq ft detached
      ADU with full kitchen and bath typically lands between $85,000 and $140,000 before permit
      fees. Sloped lots, structural upgrades, and matching existing exterior finishes all affect
      the final number. TopVolk provides a written, line-item quote after the on-site visit —
      no ballpark ranges, no surprises at the contract stage. Call (206) 591-1096 or schedule a
      free on-site estimate to get an exact number for your project.

  - q: "Do I need a permit for a home addition in SeaTac, and how long does it take?"
    a: |
      Any structural addition in SeaTac requires a building permit through the City of SeaTac
      Community Development Department — not Seattle SDCI, which only covers Seattle city limits.
      The application requires architectural and structural drawings, a site plan showing
      setbacks and lot coverage, and a Washington State Energy Code compliance report (REScheck
      for residential projects). Plan review for a residential addition typically takes 6–10
      weeks, with faster turnaround for smaller additions that do not modify load-bearing walls.
      As a WA Licensed Contractor, TopVolk prepares all permit documentation and handles
      correction cycles with SeaTac's permit counter directly — including DADU applications
      under WA HB 1337 where lot coverage and setback calculations go in with the first
      submittal.

  - q: "Can I add an ADU to my SeaTac property under WA HB 1337?"
    a: |
      Yes — WA HB 1337 (2024) allows up to two ADUs on a single-family lot statewide, and
      SeaTac falls under that law. That could mean a detached ADU (DADU) in the rear yard plus
      an attached ADU (AADU) with a separate entrance off the side, or two DADUs if the lot
      footprint and setbacks allow both. SeaTac's local zoning still sets the height limit
      (typically 24 ft for a DADU), rear setback (5 ft minimum under state rules), and lot
      coverage cap. Whether you are building a 400 sq ft studio for rental income or an 800
      sq ft one-bedroom with a separate utility connection, the site walk-through is always the
      first step — Vladislav checks actual measurements against the zoning code before any
      drawings are ordered. Call (206) 591-1096 to set that up.

  - q: "What warranty comes with a home addition built by TopVolk?"
    a: |
      Washington State mandates a three-year workmanship warranty on all residential construction —
      that is the legal floor. TopVolk backs structural work beyond that: framing,
      waterproofing details, and custom assemblies are covered for defects traceable to
      installation. Material warranties run separately and get registered in the homeowner's
      name: Hardie cement-board siding carries a 30-year limited warranty, Mitsubishi Mr. Slim
      systems carry a 12-year parts warranty when registered, and Milgard windows carry a
      lifetime frame warranty plus a 10-year seal warranty. Every project ends with a blue tape
      walkthrough — Vladislav walks the job with the homeowner, marks every punch list item,
      and final payment is not released until those items are closed.

  - q: "Do you handle addition projects in cities near SeaTac?"
    a: |
      Yes — TopVolk works throughout King County and into Snohomish, Pierce, and Kitsap
      counties. Burien (98146, 98166) and Tukwila are both adjacent to SeaTac and come up
      often for ADU and addition work. Des Moines, Kent, and Renton are all within 15 minutes.
      Eastside cities — Bellevue, Kirkland, Redmond — are covered as well, though each has
      its own permit center and review timeline. For a project in the 98188 or 98148 zip,
      Vladislav typically schedules an on-site walk-through within a week of first contact.
      Addition projects generally run $30,000 on the low end for a modest bump-out and
      $200,000 or more for a full second story or large DADU with separate utilities. Call
      (206) 591-1096 to start with a site visit.