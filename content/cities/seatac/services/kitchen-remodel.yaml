title: "SeaTac Kitchen Remodel — Airport-Era Bungalows, Modern Layouts"

intro: |
  The streets around Angle Lake in the 98188 zip filled in between 1952 and
  1968 when Sea-Tac was growing from a regional field into a major hub and
  workers needed housing nearby. Those bungalows came with small, closed
  kitchens — one counter, one corner GE range, no room for a second person.
  Adding a Bosch dishwasher or induction cooktop to that layout isn't a
  cosmetic project. It's structural work, an electrical upgrade, and a permit
  from the City of SeaTac. TopVolk Construction handles all of it —
  WA Licensed Contractor, 100+ projects since 2023. Call (206) 591-1096 or
  schedule a free on-site consultation with Vladislav directly.

localContext: |
  SeaTac's residential core runs between the 98158 zip north of the airport
  and 98188 to the south along Military Road S. The 98188 stock — bungalows
  and compact ranchers between S 188th St and S 216th St — is mostly 1950
  through 1968 construction. Standard for the era: 100-amp panels, galvanized
  supply lines behind the kitchen walls, and a closed galley that made sense
  when cooking was utility, not the center of the house. SeaTac incorporated
  in 1990 and runs its own permit center. Structural kitchen permits go
  directly through the city — not King County DPER — which keeps submissions
  predictable. Deadline penalties are written into every TopVolk contract —
  if the schedule slips on our end, you get paid back.

commonProblems:
  - title: "Load-Bearing Walls Between the Kitchen and Living Room"
    description: |
      In a 1958 SeaTac bungalow, that wall between the kitchen and dining
      area is almost never just partition drywall. It's typically carrying
      ceiling joist load or a flush header that's part of the load path to
      the roof ridge. Pull it without a formal load-bearing wall analysis and
      you'll see deflection within a year — sticky doors, ceiling seam cracks.
      Correct removal means an engineered LVL beam, PSL posts at each bearing
      point, and a rough-in inspection through the City of SeaTac before the
      ceiling closes. Plan four to six weeks for permit plan review. Vladislav
      walks the framing with you on-site before a single permit is filed —
      call (206) 591-1096 to set that up.

  - title: "100-Amp Panels Can't Feed Modern Appliances"
    description: |
      Most homes in the 98188 zip built before 1970 still run original
      100-amp service. A Samsung or Bosch induction range pulls a 50-amp
      dedicated circuit before anything else in the kitchen turns on. That
      alone pushes an original panel past capacity. Upgrading to 200A service
      requires a City of SeaTac electrical permit plus Puget Sound Energy
      coordination — typically 3-4 weeks on the utility side. That timeline
      gets scoped at project start, not discovered when the cabinets are
      already set and the electrician is waiting. TopVolk is a WA Licensed
      Contractor — electrical scope and permit coordination are part of the
      project from day one, not an afterthought billed separately.

  - title: "Gas Conversion, Line Capping, and Range Hood Venting"
    description: |
      Most SeaTac bungalows have recirculating range hoods — no exterior duct,
      no real exhaust. Switching to a KitchenAid or GE induction range means
      capping the gas line (City of SeaTac permit required) and cutting a new
      duct chase through an exterior wall for a 400-600 CFM exhaust hood.
      PNW humidity makes proper venting non-optional — recirculating hoods
      leave grease and steam in the air year-round, accelerating cabinet
      finish damage. The duct path goes into the framing plan before cabinetry
      is ordered, not improvised at demo. 100+ projects completed since 2023
      means these sequencing calls are routine, not guesswork.

faq:
  - q: "How fast can you get to SeaTac for a kitchen remodel consultation?"
    a: |
      SeaTac is roughly 15 minutes from central Seattle on I-5 — we pull
      permits in 98158 and 98188 regularly. Call (206) 591-1096 to set up
      a free on-site walkthrough. Vladislav comes out himself — WA Licensed
      Contractor, 100+ projects since 2023. No salesperson, no commissioned
      closer.

  - q: "What appliance brands do you work with in SeaTac kitchen remodels?"
    a: |
      Most SeaTac projects at this price point run KitchenAid or Bosch for
      dishwashers and ranges, Samsung or LG for refrigerators, Whirlpool or
      GE for built-in microwaves. We scope the electrical circuits, vent
      sizing, and cabinet cutout dimensions around whatever you're installing.
      Appliance selection drives the layout plan, not the other way around.

  - q: "What does the permit process look like and how long does a SeaTac kitchen remodel take?"
    a: |
      Full kitchen — demo, structural work, MEP rough-in, cabinets,
      countertops, punch list — runs 8-12 weeks of active construction.
      City of SeaTac plan review for structural or electrical permits adds
      4-6 weeks before demo starts. Total from first consultation to blue
      tape walkthrough: roughly 3-5 months. Deadline penalties are written
      into the contract — if we miss the agreed schedule, you get compensated.
      Call (206) 591-1096 for a line-item quote from Vladislav directly.