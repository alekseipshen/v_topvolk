title: "SeaTac Deck Installation — Permits, PT Footings, PNW Rain"

intro: |
  The Angle Lake area and the residential blocks along Military Road South in 98188
  get the same sustained rain as anywhere in King County — and those 1960s split-levels
  weren't designed with composite decking or proper ledger flashing in mind. Old cedar
  decks on these houses rot from the rim joist outward, silently. Replacing a deck here
  means a King County DPER permit, a ledger flashing inspection, and a real conversation
  about whether Trex composite or cedar makes sense for how that deck faces.

localContext: |
  Most of SeaTac's housing stock — concentrated in zip codes 98148 and 98188 — was built
  between 1955 and 1975. The rim joists on those ranchers and split-levels may not have
  been properly flashed when the original deck went up. Homes near McMicken Heights and
  west of International Boulevard often sit on clay-heavy glacial till, which means post
  footings need to reach 18 inches of stable bearing soil before they carry any
  structural load worth talking about.

commonProblems:
  - title: "Cedar vs. Composite on North-Facing SeaTac Lots"
    description: |
      North-facing decks in 98188 stay damp nine months of the year. Cedar grays fast,
      traps moss, and needs sanding and resealing every two seasons. Trex and TimberTech
      composite boards don't absorb moisture the same way — no splitting, no annual
      maintenance cycle. The upfront cost is higher, but the long-term math usually
      favors composite on any SeaTac deck that doesn't get full afternoon sun.
  - title: "Ledger Board Attachment to 1960s Rim Joists"
    description: |
      Attaching a ledger board to an older SeaTac rancher means opening up the rim joist
      area first. Forty-year-old flashing — or none at all — creates moisture channels
      behind the ledger, and rot often runs 18 to 24 inches before it shows from outside.
      We pull back the siding, check with a moisture meter, sister any compromised
      sections, and install Simpson Strong-Tie joist hangers with through-bolted lag
      screws and proper ledger flashing before anything else goes up.
  - title: "Post Footings and Ground-Contact PT Lumber in Clay Soil"
    description: |
      King County requires post footings to reach frost-line depth — typically 12 to 18
      inches in SeaTac's climate zone. Standard construction-grade pressure-treated lumber
      is not rated for direct soil burial. We spec UC4B ground-contact PT for any post
      set in soil or concrete, sized to the actual structural load rather than minimum
      code dimensions. Get the footing wrong and the deck settles noticeably within five
      years.

faq:
  - q: "How fast can you get to SeaTac for Deck Installation?"
    a: |
      SeaTac is about 20 minutes south of Seattle on I-5 or SR-99 — a direct drive from
      most of our King County projects. Vladislav can usually schedule an on-site
      consultation within 3 to 5 business days. Call (206) 591-1096 to check current
      availability.
  - q: "Do you install Trex or TimberTech composite decking, or mostly cedar?"
    a: |
      Both, depending on exposure and budget. Cedar works well on covered or south-facing
      decks with regular maintenance. For SeaTac's north-facing and rain-exposed lots,
      Trex Transcend and TimberTech AZEK hold up better over a 15 to 20 year horizon.
      Every estimate includes line-item pricing for both materials so you can compare
      actual numbers.
  - q: "Does a new deck in SeaTac need a building permit, and how long does that add?"
    a: |
      Any attached deck over 30 inches off grade or larger than 200 square feet requires
      a building permit through King County DPER. Plan review typically runs 4 to 8
      weeks. We handle the permit application, attend the ledger flashing rough-in
      inspection, and schedule the final sign-off. Total timeline from permit submittal
      to finished deck is 10 to 14 weeks. TopVolk is a WA Licensed Contractor with 100+
      projects completed since 2023 — deadline penalties are written into every contract.