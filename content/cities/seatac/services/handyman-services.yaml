intro: |
  TopVolk Construction LLC handles handyman repairs and punch-list work for homeowners across SeaTac — owner-operated by Vladislav Volkov, WA Licensed Contractor, with 100+ projects completed since 2023 throughout King County. Most of the residential streets in this city sit within a mile or two of Sea-Tac International Airport, and the housing stock reflects that vintage: 1950s and 1960s ramblers in the McMicken Heights and Bow Lake neighborhoods, aluminum-frame windows that develop air gaps around the weatherstripping, and bathroom fixtures that were last updated when the airport was still expanding its cargo terminals. A corroded Moen cartridge in a bathroom faucet, a section of rotted exterior trim along a north-facing eave, a drywall patch where the doorstop punched through — those jobs don't need a full remodel crew. They need one person with the right tools who shows up on the day they said they would. Vladislav communicates directly with you, schedules around your availability, and charges a flat written estimate — not an hourly number that expands once he's inside the door.

localContext: |
  SeaTac's two main zip codes — 98148 on the west side near Bow Lake and 98188 along the International Boulevard corridor — contain mostly single-family homes built between 1950 and 1980, with a notable cluster of townhomes and smaller multi-family units added in the 2000s near the light rail stations. Homes in the 98148 area tend to be post-and-pier or slab-on-grade construction from the late 1950s and early 1960s, meaning crawlspace access is limited and vapor barriers degrade quietly over decades. The 37-plus inches of annual rain from October through May hits hard on north-facing surfaces — moss accumulates on wood trim, caulk around window frames splits by February, and deck boards check and cup after a few wet winters. Handyman work in SeaTac rarely requires a permit for individual repairs like fixture swaps or trim replacement, but any structural deck repair or electrical fixture change involving new circuits does trigger permit requirements. The city of SeaTac operates its own building department, separate from King County DPER, so projects beyond cosmetic repairs need to be verified against city code rather than unincorporated county rules.

commonProblems:
  - title: "Rotted Exterior Trim on North-Facing Eaves and Window Surrounds"
    description: "North-facing eaves and window surrounds on SeaTac's 1960s-era homes get almost no direct sun from November through March, and the moss and standing moisture that build up eventually degrade paint, then caulk, then the wood itself. The typical failure point is the drip cap flashing above a window — once that seal breaks, water migrates behind the Hardboard or T1-11 siding panels common in homes built before 1985. The fix involves pulling the rotted trim, cutting back to clean Douglas-fir framing, sistering in new blocking where needed, and replacing with primed finger-joint pine or Hardie cement-board trim for long-term rot resistance. Exterior caulk with a paintable siliconized acrylic — not cheap vinyl caulk — is applied at all joints before paint. Material cost for a typical window surround repair runs $80–$200; labor adds another two to four hours depending on height and ladder access."

  - title: "Drywall Patches That Don't Match the Existing Orange Peel Texture"
    description: "Towel bars pulled out of the wall, doorknobs punched through hollow-core drywall, a patched spot where a TV mount came down — these are constant in SeaTac homes that have changed hands a few times since the 1970s. The problem isn't the patch itself; it's matching the surrounding texture. Spray-on orange peel from a can almost never looks right next to original blown texture, and that mismatch shows the second you paint over it. The correct approach is to skim the patch area slightly wider than the hole, feather out with joint compound across two or three coats of drywall mud, let each coat dry fully, then use a hopper gun or careful hand technique to match the specific texture profile. A six-inch doorstop hole typically takes two to three hours including texture dry time. Larger patches covering a four-foot section run closer to a half-day of work."

  - title: "Faucet and Toilet Fixture Replacement Without a Full Plumbing Scope"
    description: "Many SeaTac homes in the 98188 zip have original 1970s-era Delta or Moen two-handle faucets where the cartridge is corroded, the aerator threads are stripped, and the shutoff valves underneath haven't moved in 30 years. Replacing the faucet is straightforward — but those frozen angle stop valves frequently need to be swapped out at the same time, or you lose reliable shutoff capability to the entire supply line. The process: replace the shutoff valves first using 1/2-inch compression-to-3/8-inch OD supply line fittings, then pull the old faucet, clean the sink deck, and install the new fixture per manufacturer rough-in specs. A standard single-hole Kohler or Moen kitchen faucet install with new supply lines and shutoff valves runs two to three hours. Vladislav sources fixtures at contractor pricing — if you haven't purchased yours yet, that typically saves 10–15% over retail and avoids a trip to the hardware store."

  - title: "Weatherstripping Replacement on Older Exterior Doors That Air-Leak All Winter"
    description: "The exterior doors on 1950s and 1960s SeaTac homes — especially the aluminum threshold units and wood-frame slabs common in the McMicken Heights area — develop noticeable air gaps that you can feel with your hand in January. The door sweep at the bottom compresses and flattens over years of foot traffic, and the foam or pile weatherstripping in the doorstop rabbet dries out and cracks. A proper fix isn't just peeling off old foam tape. It means measuring the door gap carefully, selecting the right profile — typically a Q-Lon compression strip for the jamb sides and a Pemko door sweep with an aluminum carrier at the threshold — and seating it so the door closes without binding. An exterior door weatherstripping replacement covering sweep and side seals runs one to two hours. If the door has settled out of square in the frame, you add time for planing or shimming the hinges. Cost range: $150–$350 depending on door condition."

  - title: "Smart Home Device Installation — Doorbells and Thermostats in Older Homes"
    description: "Nest, Ring, and Ecobee installations are common punch-list items for SeaTac homeowners who remodeled but didn't get around to the tech upgrades. The catch in older homes: many 1960s-era thermostats ran on two-wire low-voltage systems without a common (C-wire), which means a modern Ecobee or Nest thermostat won't power reliably without adding a C-wire adapter or running a new wire from the HVAC control board. Ring doorbell cameras also require a minimum 16–18V AC transformer — original 1970s doorbells often ran 10V and won't supply enough current. The fix for the thermostat is typically a Nest Power Connector or Ecobee PEK adapter installed at the furnace end. For the doorbell, transformer replacement at the chime box is usually a one-hour job. Bundling both installs in a single visit keeps trip cost down — combined, the two typically take two to three hours on site."

