  - q: "Can you match existing wall texture when patching drywall in an older home?"
    a: "Texture matching is one of the more skill-dependent handyman tasks — and the most common complaint people have about prior contractors who did patch work. The approach depends on what's on the wall: orange peel applied with a hopper gun, knockdown that was hand-troweled, or smooth skim coat. Matching requires feathering joint compound out wide enough that the transition disappears, then applying texture that mimics the original pattern's density and droplet size. A test patch on scrap drywall before touching the wall is standard practice. Small patches can often be matched well enough that they're invisible after two coats of paint. Larger sections — a two-foot repair or bigger — sometimes need the full wall panel skim-coated to blend correctly."

  - q: "What warranty do you provide on handyman work in SeaTac?"
