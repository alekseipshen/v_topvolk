    a: |
      SeaTac sits right on SR-99 with multiple I-5 exits serving the area — no unusual travel complications from Tukwila to the north or Burien to the south. From most of our King County schedule, SeaTac is a 20-25 minute drive without traffic. For a free on-site consultation, we typically schedule within 3-5 business days. A single entry door replacement takes one day on site. A patio door conversion with rough opening modification runs 2-3 days. Call (206) 591-1096 — Vladislav handles scheduling directly, no call center involved.

  - q: "What does door installation cost in SeaTac?"
    a: |
      A standard entry door replacement with a Therma-Tru or Pella fiberglass slab, new threshold, and compression weatherstrip system runs $2,200-$4,500 depending on sill pan condition and whether framing repair is needed. Patio door replacement — sliding to Andersen French or multi-slide — ranges $3,500-$7,000 with permit and rough opening work included. Interior pre-hung doors run $400-$900 each installed, more with structural rough opening modification.

      Every quote is line-item: material, labor, and permit fee broken out separately. No vague ranges — specific numbers for your specific opening. Call (206) 591-1096 or schedule online for a free on-site estimate.

  - q: "Does exterior door replacement in SeaTac require a permit?"
    a: |
      A like-for-like entry door swap in the existing rough opening — same size, same location — generally doesn't require a permit in SeaTac. Any change to rough opening dimensions, or a conversion from a sliding patio door to a French door system, does require a permit through SeaTac's own municipal permit center. This is not King County DPER. SeaTac handles its own building review. Plan review for a straightforward exterior opening modification typically takes 2-4 weeks. TopVolk is a WA Licensed Contractor and pulls every permit that's required — that step is not negotiable on our jobs.

  - q: "Fiberglass vs. solid wood entry door — which holds up better in SeaTac's climate?"
    a: |
      Wood doors need refinishing every 2-4 years in the Pacific Northwest. The October-through-May rain cycle, UV exposure in summer, and occasional freeze events push a wood door hard even with a covered entry. Fiberglass door skins — Therma-Tru Smooth-Star or Benchmark series — resist moisture absorption and denting. They hold paint or stain for 5-8 years and offer a foam core with R-values in the R-5 to R-6 range.

      For SeaTac homes near the airport flight path, a solid-core fiberglass door also provides a modest STC improvement over a hollow-steel unit. Wood makes sense when matching historic trim profiles is the priority, but it needs a deep overhang — 18 inches minimum — and a real commitment to regular maintenance. Most homeowners in this area are better served by fiberglass.

  - q: "What warranty do you provide on door installation work?"
    a: |
      Therma-Tru entry door slabs carry a limited lifetime warranty. Weather seals and glass are covered for 10 years. Andersen patio door units carry a 10-year limited warranty on glass and hardware. TopVolk's installation labor carries a three-year workmanship warranty — if weatherstripping pulls loose, pan flashing leaks, or hardware fails due to installation error, we come back and fix it at no charge.

      What's not covered: damage from deferred maintenance such as paint failure leading to jamb rot, or physical impact damage to the door slab. In SeaTac's climate, plan to inspect threshold compression seals and weatherstrip every 3-4 years. That's routine maintenance, not a warranty item.

