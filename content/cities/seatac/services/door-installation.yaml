title: "SeaTac Door Installation — Noise, Rain, and the Right Door for Both"

answer: "TopVolk Construction replaces entry, patio, and interior doors in SeaTac, WA — WA Licensed Contractor, 100+ projects since 2023, free on-site estimate."

intro: |
  Every exterior door in the 98188 zip takes a beating most of King County doesn't. Jet overpressure from runway 16R at Seattle-Tacoma International Airport creates low-frequency vibration cycles that wear out weatherstrip and move door frames faster than almost anywhere else nearby. TopVolk Construction installs and replaces entry, patio, and interior doors across SeaTac — owner Vladislav Volkov handles the estimate and the installation himself.

  Homes near Angle Lake and McMicken Heights carry a double load. Aircraft pressure cycles hit them on both approach and departure corridors. Then October through May brings roughly 37 inches of rain that saturates every exterior detail. A Therma-Tru fiberglass door with through-flashing at the sill pan and a compression weatherstrip system outlasts the original hollow-steel units in this area's 1960s and 1970s ranch stock by years. Call (206) 591-1096 and we'll come out and look.

localContext: |
  Most housing in the 98188 zip was built between 1960 and 1982, when SeaTac expanded alongside the airport. Ranchers and split-levels through Riverton Heights and McMicken Heights left the factory with builder-grade steel entry doors, hollow-core interior units, and aluminum sliding patio doors designed for maybe 20 years of service.

  The 98148 zip covers Riverton-area pockets west of International Boulevard toward Puget Sound. Similar vintage housing there, plus marine air that accelerates corrosion on metal thresholds and aluminum door frames. When those original doors come out, rough openings in these homes regularly show rot at the sill plate and jack studs — hidden damage that a drive-by quote won't catch.

  SeaTac issues building permits through its own municipal permit center, separate from King County DPER. Any exterior door work that changes rough opening dimensions requires a permit and inspection. Vladislav pulls those permits and schedules the rough-in inspection before finish work begins. That step doesn't get skipped.

commonProblems:
  - title: "Entry Door Frames Failing at the Sill Pan from Rain and Jet Vibration"
    description: |
      The most common entry door failure in SeaTac combines two stressors: low-frequency aircraft vibration and standing water at the sill. Over 15-20 years, sill pan flashing on 1970s installations corrodes or fails at the end dams. Water wicks into the jack studs and king studs flanking the rough opening. By the time the door starts sticking or daylight shows at the frame corner, the OSB behind the casing has gone soft.

      The fix requires pulling the door unit, repairing the framing with pressure-treated (PT) lumber where needed, installing a sloped metal pan with sealed end dams, and hanging a new Therma-Tru or Pella fiberglass unit with a multi-point compression weatherstrip. Fiberglass holds shape through freeze-thaw cycles. It won't rust at the bottom rail the way steel does. Budget $2,800-$4,500 for a standard 3/0 x 6/8 entry with sill pan repair included — more if framing damage extends into the wall cavity.

  - title: "Aluminum Patio Sliders Leaking at the Bottom Track During Wind-Driven Rain"
    description: |
      Original aluminum sliding patio doors from the 1970s and 1980s have two failure modes in SeaTac's climate. The thermal break is inadequate for sustained rain events. The bottom track corrodes and deforms, making the panel drag and gap at the corners. Homeowners near Angle Lake regularly report water running under the sill threshold during strong southwesterly storms.

      Full replacement is the real fix — either a new Andersen 400 Series sliding door with a composite sill and dual weatherstrip seals, or a conversion to a French door or multi-slide system if the rough opening allows it. Multi-slide systems require a flush sill detail for the interior floor transition and a continuous head jamb flashing integrated into the weather-resistant barrier (WRB) on the exterior sheathing. Rough opening modifications for a slider-to-French conversion need a SeaTac building permit. From permit application to finished installation typically runs 4-6 weeks for a single opening.

  - title: "Interior Door Rough Openings Too Narrow in 1960s Ranch Remodels"
    description: |
      Remodels in SeaTac's mid-century ranch homes frequently expose 2/6 x 6/6 interior rough openings — 30 inches wide. That's too narrow for wheelchair access or moving large furniture. Widening to a 2/8 opening means cutting the existing king stud, installing a new LVL header sized for the load above, and reframing before a new door unit can go in.

      Vladislav scopes that structural work at the initial visit. Not after demo day. So you know the full cost before anything is torn out. Hollow-core doors in these homes also come with undersized jamb depths — typically 4-9/16 inch — that don't fit today's thicker insulated wall assemblies. Jamb extensions and new casing are part of the finish package on those jobs. A pre-hung interior door with shimming, blocking, jamb extensions if needed, and mitered casing installed runs $400-$900 per door — more if the rough opening requires structural modification.

  - title: "Smart Lock Retrofits Exposing Weak Strike Plate Anchoring on Older Entry Doors"
    description: |
      Homeowners in 98188 and 98148 are adding Schlage Encode and August Wi-Fi Smart Lock units to existing entry doors. Most don't realize the deadbolt bore position and strike plate anchoring on their 1970s door don't meet current kick-resistance standards. The IRC requires a minimum 3-inch screw length through the strike plate into the door frame stud. Original hardware in these homes often has 3/4-inch screws going into jamb material only — which splits with one solid kick.

      Retrofitting a Schlage Encode also requires a 2-1/8-inch bore at the correct backset. Older doors commonly have a 2-3/8-inch backset versus the standard 2-3/4 inch on modern hardware. If the door frame is already compromised from moisture, the smart lock adds convenience but not security until the frame is reinforced or the door is replaced. We price both scenarios separately so the scope is clear before work starts.

  - title: "Garage Door Bottom Seal and Insulation Deficiencies on Aging Ranch Homes"
    description: |
      Uninsulated single-layer steel garage doors are standard on SeaTac's older ranch stock. They're one of the larger thermal weak points in an attached garage that shares a wall with living space. An insulated steel door with a polyurethane core rated R-12 or better cuts that heat transfer noticeably. In winter, the difference shows up in adjacent rooms within a few days.

      The rubber astragal bottom seal on existing doors hardens and cracks by year 8-12 in PNW conditions, letting in water, cold air, and pests. A two-car insulated steel door with new tracks, torsion springs, and a LiftMaster belt-drive opener runs $1,800-$3,200 installed depending on door dimensions and insulation spec. Springs and bottom seal alone run $300-$500 as a standalone repair — reasonable if the door is under 12 years old and the panels are in good shape. Past 18-20 years, patching aging hardware rarely makes financial sense versus replacing the whole system.

