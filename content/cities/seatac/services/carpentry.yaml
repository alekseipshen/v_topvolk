title: "SeaTac Carpentry — Built-Ins and Trim for Mid-Century Homes"

intro: |
  Angle Lake sits at the southern edge of SeaTac, surrounded by mid-century ranchers and compact
  split-levels built between 1960 and 1985 — houses put up fast for Boeing shift workers and airport
  employees, not designed to impress anyone. The interior finish work matched that priority.
  Finger-jointed colonial casings, hollow-core slab doors, and particleboard closet shelving were
  standard issue, and after five decades of Seattle-area rain, they look exactly as tired as you'd
  expect. Vladislav Volkov at TopVolk Construction has done carpentry work throughout SeaTac, Burien,
  and Tukwila: stair stringer rebuilds on split-levels off Des Moines Memorial Drive, custom pantry
  fabrication in kitchen expansions, exterior cedar fascia replacement on north-facing soffits coated
  in moss. He comes to the site himself, takes measurements, and writes a line-item quote — 100+
  projects completed since 2023, WA Licensed Contractor, no sales staff standing between you and the
  person running the job. The problems we see most often in the McMicken Heights corridor and around
  the 98188 zip code: interior trim replacements, built-in bookcases sized to awkward 7-foot-8-inch
  ceiling heights, and closet systems replacing wire shelving that was inadequate from day one.
  Call (206) 591-1096 to schedule a free on-site consultation.

localContext: |
  The 98148 zip code, covering the McMicken Heights neighborhood and residential streets west of
  International Boulevard, holds a dense cluster of 1960s–1970s ranchers where interior finish work
  was always economy-grade. Thin door casings, flat-profile baseboard, minimal window trim —
  functional but forgettable. Over in the 98188 zip code, closer to Angle Lake and the airport
  perimeter, you get a slightly newer mix: 1980s tract houses where builder-grade oak veneer
  cabinetry and hollow newel posts are now actively failing. Both zones share the same Pacific
  Northwest moisture problem — 37 inches of annual rainfall works its way into exterior trim at any
  paint break, and north-facing cedar fascia boards develop moss that retains moisture and accelerates
  rot well ahead of a normal replacement schedule. Door replacement in these homes also requires
  profile-matching. Existing casings are often 2¼-inch flat-ranch profiles or narrow colonial, neither
  of which is stocked at most lumber yards today. Carpentry projects in SeaTac run through the City
  of SeaTac Community Development Department; most interior finish work and cabinet installations are
  permit-exempt, but structural built-ins attached to bearing walls and egress-related door changes
  may require a building permit.

commonProblems:
  - title: "Stair Tread Replacement and Stringer Rot in SeaTac Split-Levels"
    description: |
      Many of SeaTac's split-level homes from the 1960s have single-flight stairs where treads are
      now checking, cupping, or separating at the nosing. The underlying stringer — typically a 2×12
      Douglas-fir cut stringer — may look solid from above while harboring soft rot at the base where
      it contacts the concrete pad. Before replacing treads, we probe the stringer with an awl and
      check for deflection under load. If the stringer is solid, new ¾-inch red oak treads can be
      glued and face-nailed, with painted MDF risers for a clean finish. A full stringer rebuild on a
      single-flight stair runs $900–$1,500 in labor and materials depending on tread count and
      profile. Standard stair tread stock from Dunn Lumber runs $18–$24 per linear foot for red oak;
      if the existing bull-nose profile is nonstandard, we mill matching replacements. Plan on one to
      two days for a complete tread-and-stringer replacement on a standard 13-step flight.

  - title: "Interior Door Casing Mismatch After Window or Door Upgrades"
    description: |
      Mid-century homes in SeaTac often have original hollow-core slab doors hung on 4-9/16-inch
      jambs with a flat-profile casing that hasn't been manufactured as a standard prehung unit in
      decades. Swapping one door with a modern Masonite or Jeld-Wen prehung unit creates an
      immediate visual mismatch with every adjacent casing in the hallway. The fix is to order the
      door slab only — a 1⅜-inch solid-core or hollow-core slab at the correct width — fit it to
      the existing frame, and custom-rip matching casing from 1×4 clear pine or paint-grade poplar
      run through a router table to reproduce the original profile. For the 2¼-inch flat-ranch
      profile common in 98148 homes, we fabricate on-site and install with a consistent ⅛-inch
      reveal. A single door swap with matched casing runs $400–$650 depending on whether the frame
      needs shimming or the rough opening has racked over the decades. Two to four doors in one visit
      is the most cost-efficient approach.

  - title: "Custom Built-In Bookcases and Window Seat Fabrication"
    description: |
      Living rooms in SeaTac ranchers frequently have a large picture window flanked by blank drywall
      — solid bones for a built-in unit with base cabinets, a window seat with lift-lid storage, and
      upper open shelving. The carcass is typically ¾-inch Arauco maple plywood assembled with pocket
      screws, face-framed with solid poplar stiles and rails. For a painted Craftsman finish, we
      route a shallow bead detail on the face-frame stiles to pick up the window's existing trim
      profile. Blum soft-close hinges on doors and Blum Tandem undermount drawer slides throughout —
      these are the components that make a built-in feel like furniture rather than a job-site box.
      A full 8-foot flanking unit with window seat runs $3,800–$5,800 installed, depending on door
      count, drawer count, and hardware selection. SeaTac Community Development does not require a
      permit for freestanding or wall-anchored built-ins in most residential cases; TopVolk confirms
      permit scope before any work begins, as a WA Licensed Contractor operating in King County.

  - title: "Exterior Cedar Fascia and Soffit Replacement"
    description: |
      North-facing soffits and fascia boards in SeaTac take the hardest hit from the region's rain
      and moss load. Cedar fascia typically holds 20–30 years before needing spot replacement, but
      deferred maintenance compresses that timeline fast — moss retains moisture against the paint
      film, the grain opens, and sections start to delaminate or check through. Repair starts with a
      low-pressure wash and oxalic acid treatment to kill the moss root system, then we cut out the
      compromised sections and splice in new clear-grade cedar back-primed on all four faces before
      install. For homeowners who want lower long-term maintenance, Hardie Trim boards at the fascia
      and pre-painted Hardie Soffit panels under the eaves are a rot-resistant alternative — the
      cement-fiber composition doesn't feed moss growth the way wood grain does. A 40-linear-foot
      fascia replacement on a SeaTac rancher runs approximately $1,300–$2,000 in materials and labor,
      painted with Sherwin-Williams Duration Exterior to match existing trim color.

  - title: "Wainscoting, Beadboard, and Hallway Trim Upgrades"
    description: |
      Beadboard wainscoting is one of the most cost-effective interior upgrades for 1970s SeaTac
      homes — it adds visual weight to plain drywall hallways, protects high-traffic wall surfaces,
      and in most cases requires no permit from the city. Installation starts with a level layout
      line at 36 or 42 inches, then ⅝-inch MDF beadboard panels are nailed to wall studs with a
      pneumatic finish nailer and capped with a chair rail milled from ¾-inch poplar. The critical
      details that separate a tight job from a sloppy one: baseboard height must factor into panel-cut
      calculations, and all inside corners get a coped return rather than a mitered butt joint so
      seasonal movement doesn't open a visible gap by spring. At tile-to-beadboard transitions in
      bathrooms, Schluter Rondec aluminum profiles give a clean, watertight edge that won't trap
      moisture. Full hallway wainscoting on a typical 50-linear-foot run — two coats of Benjamin
      Moore Advance in satin — runs $2,000–$3,000 installed.

faq:
  - q: "How quickly can TopVolk get to SeaTac for a carpentry estimate?"
    a: |
      SeaTac is a straightforward drive from our typical work areas — I-5 south from Seattle or
      SR-99 through Burien puts us at most addresses in the city within 20–35 minutes, and Angle Lake
      Park is practically a reference point for navigation on the south end. For scheduling, we can
      usually get an on-site estimate booked within a week. Most interior carpentry projects start
      within two to three weeks of a signed contract; larger scope like custom built-ins or a full
      stair rebuild may need a short material lead time, but we confirm that upfront before you
      commit to anything. Vladislav answers the phone directly — call (206) 591-1096 to get on
      the calendar.

  - q: "What does custom carpentry work typically cost in SeaTac?"
    a: |
      It depends heavily on scope. Interior door replacement with matched casing runs $400–$650 per
      door. A single-flight stair tread-and-stringer rebuild is $900–$1,500. Custom built-in
      bookcase flanking a window seat comes in at $3,800–$5,800 for an 8-foot unit. Exterior cedar
      fascia replacement (40 linear feet) runs $1,300–$2,000. Wainscoting installation at 50 linear
      feet, painted, is $2,000–$3,000. Pricing goes up for nonstandard profiles requiring custom
      milling, significant rot discovered behind finish surfaces, and high-difficulty access like
      stairwells with no clear staging room. Every TopVolk quote is a written line-item breakdown —
      no vague ranges, no surprise additions at the final invoice. Call (206) 591-1096 for a free
      on-site estimate.

  - q: "Does carpentry work in SeaTac require a building permit?"
    a: |
      Most interior finish carpentry — trim, casings, built-ins, wainscoting, closet organizers —
      is permit-exempt in SeaTac. Projects that do require a permit from the City of SeaTac
      Community Development Department include structural modifications tied to stair replacement
      when bearing wall framing is involved, egress door changes in sleeping rooms, and any scope
      that modifies a load path. TopVolk is a WA Licensed Contractor; we assess permit requirements
      at the estimate stage and handle application paperwork with SeaTac's department when a permit
      is needed. Plan review for a straightforward residential carpentry permit typically runs two
      to four weeks through the city's portal. No surprises on inspection day — we confirm all
      requirements before the first nail goes in.

  - q: "Can you match old trim profiles that aren't stocked at lumber yards anymore?"
    a: |
      This comes up constantly in SeaTac's mid-century housing stock, and yes, we handle it
      routinely. The flat-ranch casing profile common in 1960s–1970s ranchers and the narrow ogee
      baseboard used in 1980s tract homes are both largely out of general production. The approach:
      first, we check specialty suppliers like Dunn Lumber's custom milling program for a close
      match; if nothing stocked lands within 1/16-inch tolerance, we run custom profile stock on a
      router table using 1×4 or 1×6 clear pine or paint-grade poplar. For a full baseboard
      replacement in a 1,400-square-foot rancher, the custom-milled route is usually the most
      economical path once you factor in the labor cost of piecing together approximations. We bring
      a profile gauge to every site estimate and take a physical template before ordering anything.

  - q: "What warranty does TopVolk provide on carpentry work?"
    a: |
      All labor is warranted for one year against defects in workmanship — if a joint opens, a panel
      shifts, or a drawer slide binds within the first year, we return and correct it at no charge.
      Material warranties pass through from the manufacturer: Blum hardware carries a lifetime
      warranty on their drawer systems, Hardie Trim products carry a 15-year limited warranty
      against rot and fiber-cement defects, and Benjamin Moore Advance interior paint is covered
      under the manufacturer's limited lifetime guarantee. What falls outside warranty coverage:
      normal seasonal wood movement in a house without climate control, moisture intrusion damage
      from a separate roof or window failure, and any homeowner modifications to completed work.
      Scope and warranty terms are written clearly in the contract — no ambiguity at punch list.

  - q: "Do you work in Burien, Tukwila, and other cities near SeaTac?"
    a: |
      TopVolk works throughout King County — SeaTac, Burien, Tukwila, Renton, Des Moines, and
      Federal Way are all regular project areas, and we take on work in Snohomish, Pierce, and
      Kitsap counties for the right scope. Scheduling typically runs two to three weeks out for new
      projects; built-in fabrication or stair work with material lead times may be four to six weeks
      from signed contract to first day on site. Deadline commitments are written into every
      contract with penalty provisions if TopVolk misses them — that's not standard language in most
      contractor agreements, but it's how we operate. Call (206) 591-1096 or ask about availability
      for your specific address when you reach out.