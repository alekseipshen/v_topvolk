title: "SeaTac Garage Construction — ADU Above, Carport Conversion"

answer: "TopVolk Construction builds new garages in SeaTac, WA — detached, attached, or with ADU above — WA Licensed Contractor, 100+ projects completed."

intro: |
  Vladislav Volkov and TopVolk Construction build new garages in SeaTac — detached structures,
  attached additions, and DADU builds with living space above — all permitted through the City
  of SeaTac Building Division. SeaTac's housing stock tells you exactly why this work is
  constant: roughly 60% of the mid-century ranchers in the 98168 and 98188 zip codes went up
  in the 1950s and 1960s with carports instead of enclosed garages, and those carports don't
  cut it for workshop space, EV charging, or storage that stays dry through a Seattle-area
  winter. Angle Lake and McMicken Heights are two areas where the most garage builds are
  happening right now — compact lots, 1960s slab-on-grade houses, owners who have lived there
  20-plus years and finally have the equity to do it right. A detached two-car garage on a
  standard SeaTac lot runs $65,000–$120,000 depending on finish level, slab complexity, and
  whether you are adding a Clopay steel door or a carriage-style upgrade. Call (206) 591-1096
  to schedule a free on-site walk with Vladislav — he will measure the setbacks, check lot
  coverage, and give you a real number before any work begins.

localContext: |
  SeaTac incorporated in 1990, but the bulk of its housing was built between 1950 and 1975 —
  a generation before modern energy codes or residential garage standards. In the 98168 zip
  code, covering Riverton Heights and the neighborhoods east of Military Road S, you find
  mostly 900–1,400 square foot ranchers on lots running 7,000–9,000 square feet, with just
  enough room for a detached garage if you stay inside the 5-foot side setback and 20-foot
  rear setback enforced by the City of SeaTac Building Division. Boulevard Park, straddling
  the 98148 zip code boundary with Burien, has slightly larger lots — some 10,000 sq ft —
  where a 24x24 two-car garage is achievable without eating into required setbacks. SeaTac
  sits directly under the final approach for Sea-Tac Airport's north runways, and the Port of
  Seattle noise insulation program has upgraded insulation in hundreds of homes in the 98188
  corridor — meaning the existing house may already have sound-rated wall assemblies you will
  want the new garage to complement architecturally. Heavy rain October through May, averaging
  around 37 inches annually, makes vapor barriers and proper slab drainage non-negotiable on
  every build here.

commonProblems:
  - title: "Carport-to-Garage Conversion: Foundation and Slab Work on 1960s Lots"
    description: |
      Most carports in SeaTac's mid-century neighborhoods sit on a simple 3.5-inch slab with
      no perimeter footing — which is not a structural garage floor. Converting a carport to an
      enclosed garage means either demo-and-replace with a proper 4-inch fiber-reinforced slab
      on a perimeter frost footing, or in some cases a full stem wall depending on frost depth
      at the site. The City of SeaTac Building Division requires a structural plan review for
      any enclosed garage addition, and that review typically runs 3–5 weeks. Slab work alone
      on a 20x22 single-car footprint runs $8,000–$14,000 depending on soil conditions —
      SeaTac's glacial till is generally cooperative, but spots near the creek drainage
      corridors south of the airport can have fill soil requiring compaction testing. A
      pressure-treated (PT) mudsill and proper anchor bolts are required at the slab-wall
      connection regardless of finish level.

  - title: "Garage Header Sizing for Wide Door Openings"
    description: |
      A single 8-foot garage door opening is straightforward — a doubled 2x10 header clears
      it in most load conditions. But the 16-foot two-car openings common on SeaTac remodels
      require an LVL (laminated veneer lumber) beam, typically a 3.5x9.5 or 3.5x11.25 LVL,
      to handle the load without deflection over time. Mid-century framing in this area was
      done with smaller dimensional lumber and lower species grades, so when tying a new garage
      into an existing house, the connection details matter. TopVolk coordinates with a licensed
      structural engineer when required by the AHJ (Authority Having Jurisdiction), and the
      City of SeaTac does require stamped drawings for LVL substitutions on permitted work.
      Under-sized headers are the most common reason a garage door starts binding within five
      years — the header deflects, the rough opening racked, and suddenly a $1,200 LiftMaster
      opener is fighting a twisted frame that should have been engineered correctly from day
      one.

  - title: "Detached Garage with ADU Above: WA HB 1337 and Lot Coverage Rules"
    description: |
      Washington's HB 1337 (effective 2024) allows up to two ADUs on any single-family lot —
      including a DADU above a new garage. In SeaTac, the practical limiting factor is usually
      lot coverage: the City caps total impervious coverage at around 55% in most RS zoning,
      and a 24x24 garage footprint (576 sq ft) plus the existing house eats into that fast on
      smaller lots. Height limit for a DADU in SeaTac is generally 24 feet — enough for a
      single story of living space above a standard 10-foot garage bay. Permit timeline for a
      garage-with-ADU is considerably longer than a straight garage build: expect 8–14 weeks
      for plan review through the City of SeaTac Building Division, plus full MEP
      (mechanical, electrical, plumbing) coordination for the separate utility rough-in the
      ADU requires. A two-car garage with a 400-square-foot ADU above typically runs
      $180,000–$260,000 all-in including permits, MEP, and finish work. TopVolk is a WA
      Licensed Contractor and handles the permit application from start to final inspection.

  - title: "EV Charger Circuit Pre-Wire: Do It During Framing, Not After"
    description: |
      Roughing in a 50A or 60A dedicated circuit for an EV charger during framing adds
      $400–$800. Going back after drywall is hung and mud is done costs $1,500–$2,500
      depending on panel location and conduit routing. Nearly every SeaTac homeowner building
      a garage right now asks about this — and the ones who skip it regret it within two years.
      The sub-panel situation matters too: many mid-century homes in 98168 and 98188 have
      100-amp main panels already maxed out, so adding EV charging often means a 200-amp panel
      upgrade simultaneously, running another $3,000–$5,000. Electrical rough-in is
      coordinated with the licensed electrical sub during the structural rough-in phase so the
      inspector can sign off on both at the same rough-in inspection. A 1-inch EMT sleeve
      stubbed to the exterior wall costs almost nothing to add during framing and future-proofs
      a second charging station later.

  - title: "Exterior Siding Match: Making the New Garage Look Like It Belongs"
    description: |
      New construction next to a 1960s rancher looks jarring when the siding profile and
      roofline do not connect. Most mid-century homes in 98168 and 98188 have either original
      cedar lap siding — weathered, often 4-inch exposure — or 1990s vinyl replacement that no
      longer matches anything in current production. Hardie cement-board lap siding in 4-inch
      or 6-inch exposure is the reliable fix: it holds paint, resists SeaTac's persistent
      October-through-May rain, and can be ordered in profiles that approximate the original
      cedar look without the rot risk. For roof pitch, matching the existing house to within
      2/12 keeps the visual connection intact. CertainTeed Landmark shingles in the right color
      blend are typically close enough to a 10–15 year old existing roof to satisfy even the
      most detail-oriented homeowner. The goal is a coherent match — not a pixel-perfect
      reproduction — so the garage reads as part of the property rather than an afterthought
      bolted to the back of the lot.

faq:
  - q: "How fast can you get to SeaTac for Garage Construction?"
    a: |
      SeaTac is a direct run from the primary service corridor — SR-99 south from Seattle or
      I-5 exit 152 puts Vladislav on site in under 30 minutes from most of the metro. For an
      initial consultation, availability is typically within 3–5 business days of your call.
      Construction start depends on permit approval: a straightforward detached garage permit
      through the City of SeaTac Building Division runs 3–5 weeks for plan review on simpler
      builds, longer for a garage-with-ADU. Call (206) 591-1096 — Vladislav picks up directly,
      will come out to measure the site, check setbacks, and hand you a line-item quote with
      no middleman and no sales pitch involved.

  - q: "What does building a new garage in SeaTac cost?"
    a: |
      A basic single-car detached garage — 20x20, slab-on-grade, single door, no interior
      finish — in SeaTac runs $45,000–$70,000 depending on slab complexity and foundation
      type. A two-car detached garage with insulation, a Clopay 16-foot steel door, and EV
      charger rough-in is more typically $75,000–$120,000. Add an ADU above and the range
      moves to $180,000–$260,000 all-in. Main cost drivers are soil conditions, panel upgrade
      requirements, and how closely the exterior needs to match the existing house. Free
      on-site estimate includes a full line-item breakdown — call (206) 591-1096 to schedule
      with Vladislav directly.

  - q: "Does SeaTac require a permit to build a new garage?"
    a: |
      Yes — any new garage in SeaTac requires a building permit through the City of SeaTac
      Building Division, regardless of size. The application requires a site plan showing
      setbacks (typically 5 feet side, 20 feet rear in RS zoning), a floor plan, and
      structural drawings. For a garage-with-ADU, a full MEP submittal is required and plan
      review runs 8–14 weeks. Straight garage builds are faster — 3–5 weeks is typical for
      a complete submittal. TopVolk is a WA Licensed Contractor and handles the permit
      application, structural drawing coordination, and all inspection scheduling from
      rough-in through final — you do not have to show up to the permit counter.

  - q: "What concrete slab specification does a garage need in SeaTac?"
    a: |
      The City of SeaTac Building Division follows IRC (International Residential Code)
      minimums: 3.5-inch nominal thickness for garage slabs. TopVolk pours at 4 inches as
      standard for any slab that will see vehicle loads. Fiber reinforcement added to the
      concrete mix is specified on every pour — more reliable than wire mesh on residential
      placements and easier for inspectors to verify. Perimeter frost footing is required;
      SeaTac does not get hard freezes often, but code minimum footing depth in King County
      is 12 inches below finished grade. For workshop use with heavy equipment, a 5–6 inch
      slab with #4 rebar grid is available as an upgraded scope — priced separately at the
      estimate stage. Control joints are cut at roughly 10-foot intervals to manage cracking
      over time.

  - q: "What warranty comes with a new garage build in SeaTac?"
    a: |
      TopVolk provides a three-year workmanship warranty on all labor, and the contract includes
      a written penalty clause for missed substantial completion deadlines — not just a verbal
      promise. Structural elements like the foundation, framing, and LVL beams are covered
      under workmanship warranty; manufacturer warranties on products like Clopay garage doors
      (limited lifetime on steel panels) and LiftMaster openers (1–5 years depending on model)
      pass through to you directly. In SeaTac's climate — 37 inches of annual rainfall and
      persistent humidity from October through May — the real durability test is exterior
      detailing: flashing laps, caulk joints, and Hardie siding clearance from the slab. Those
      details are built correctly the first time. Any workmanship issue in year one, you call
      Vladislav directly.

  - q: "Do you cover cities near SeaTac, and how does scheduling work?"
    a: |
      TopVolk serves the full Seattle Metro — Burien, Tukwila, Renton, Des Moines, Kent,
      Federal Way, Auburn, and the broader King County area, plus Snohomish, Pierce, and
      Kitsap counties. SeaTac sits almost exactly in the center of the service footprint.
      Scheduling is direct: call (206) 591-1096 and Vladislav picks up — no call routing, no
      sales staff. On-site consultations for garage projects run 45–60 minutes; a written
      scope and line-item estimate follows within a week. Construction sequencing for a new
      garage typically goes permit approval, then site prep and slab, framing, rough-in
      inspections, exterior finish, garage door installation, and blue-tape punch list
      walkthrough before final sign-off.