title: "SeaTac General Contracting — Full Remodels From Permits to Punch List"

intro: |
  Angle Lake and the neighborhoods east of International Boulevard in zip 98188 are packed with 1960s ranch homes that haven't been seriously touched since someone threw down builder-grade cabinets in 1987. Whole-house renovations here mean original galvanized plumbing, undersized panels, and a City of SeaTac permit process that runs separately from King County DPER. Vladislav Volkov — WA Licensed Contractor, 100+ projects completed since 2017 — manages the whole sequence, demo through final inspection.

localContext: |
  The housing stock across zip 98148 and 98188 runs heavily toward mid-century construction — 1960-1975 builds with post-and-pier or slab foundations and original cast-iron drain lines. Single-pane aluminum windows do nothing for aircraft noise off the SEA-TAC flight paths. Crawlspaces on north-facing lots need vapor barrier work before any finish floor goes down — PNW rain and SeaTac's heavy marine air hit these older foundations harder than most homeowners realize.

commonProblems:
  - title: "SeaTac Runs Its Own Building Permit Office — Not King County DPER"
    description: "Many homeowners assume SeaTac falls under King County DPER. It doesn't — the city runs its own building permit office with separate plan review timelines and inspection scheduling. Pull from the wrong jurisdiction and you lose weeks. A full kitchen gut-and-rebuild with MEP rough-in typically takes 6-8 weeks from permit submittal to rough-in inspection clearance."
  - title: "Structural Surprises Behind 1960s Drywall"
    description: "Demo day on a 1967 split-level in 98188 regularly uncovers missing blocking, undersized joists, or load paths that were never transferred to the foundation. Opening a load-bearing wall requires an LVL beam, an engineered plan, and a separate structural review by the AHJ before framing sign-off. That's not optional — it's what the IRC requires."
  - title: "Multi-Trade Sequencing on $100K+ Kitchen and Bath Remodels"
    description: "Framing, electrical, plumbing, and HVAC all need to rough in before drywall goes up — each requiring a separate inspection. On a kitchen adding a Bosch induction range and Moen fixtures, sequence matters: panel upgrade first, then plumbing rough-in, then mechanical, then insulation, then drywall hang. Get the order wrong and you're tearing out work."

faq:
