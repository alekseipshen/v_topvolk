title: "SeaTac HVAC — Heat Pump Conversions & Duct Upgrades Near SEA"

intro: |
  Residential streets packed with post-war ranchers sit within half a mile of the runway
  threshold at SEA — and the homes around Angle Lake and McMicken Heights show exactly
  what that era of construction looks like inside: gas furnaces crammed into crawlspace
  closets, original ductwork sized for heat-only loads, and zero provision for cooling.
  Those systems ran fine for thirty years. Now the heat exchangers are cracking, the
  inducer motors are failing, and repair quotes on a 1990s Rheem or Carrier unit are
  climbing past $900 — on equipment that has eighteen months left at best. Vladislav
  Volkov at TopVolk Construction has worked HVAC upgrades across SeaTac (zip codes 98158
  and 98188) since 2017, covering heat pump conversions, Mitsubishi ductless mini-split
  installs, duct rebalancing, and high-efficiency furnace swaps that qualify for
  Inflation Reduction Act tax credits. Free on-site assessment — actual walkthrough of
  your mechanical room, not a phone estimate. Call (206) 591-1096 to schedule.

localContext: |
  SeaTac splits into two distinct housing eras that drive very different HVAC problems.
  The older blocks in 98158 — Military Road S, the streets running toward Bow Lake, the
  McMicken Heights grid — are mostly 1955-1975 construction: post-and-pier or slab
  foundations, minimal attic insulation (often below R-19 when we pull the hatch), and
  forced-air duct systems that were engineered for a gas furnace only. No cooling coil
  was ever part of the plan. Zip code 98188, closer to Angle Lake Park, trends toward
  1980s and 1990s construction — better insulated, often with an older heat pump already
  installed, but those original units are now 25-30 years old and well past rated service
  life. Mechanical permits for equipment replacement and new duct runs in the City of
  SeaTac go through the city's own permit center; unincorporated King County pockets nearby
  route through King County DPER. Seattle Energy Code applies in both jurisdictions —
  current efficiency minimums, duct leakage testing on new installations, and proper
  combustion air sizing per the IRC. The PNW's sustained moisture from October through
  May also takes a toll on outdoor condensers that go uninspected — coil corrosion and
  refrigerant line insulation breakdown are common findings on equipment over fifteen years
  old in this climate.

commonProblems:
  - title: "Cracked Heat Exchanger on an Aging Gas Furnace — Repair or Replace?"
    description: |
      The furnaces in SeaTac's older 98158 neighborhoods are mostly 80% AFUE units from
      the early 1990s — Carrier, Lennox, or Rheem models that have been running hard for
      close to thirty years. A cracked heat exchanger is a carbon monoxide risk and an
      automatic replacement trigger; repair is not an option once the primary exchanger
      fails. Even before that point, an inducer motor replacement ($450-$700 in parts)
      on a unit this age rarely pencils out. Replacing with a Daikin DM96VC or Lennox
      EL296V — both 96% AFUE two-stage condensing furnaces — gets the homeowner a unit
      that will run another twenty years and qualifies for the federal IRA 25C tax credit
      (up to $600 on a furnace). Full swap including new PVC flue, mechanical permit, and
      condensate drain routing runs $4,500-$7,500 depending on installation complexity.
      Vladislav walks through the full cost at the site visit, before any equipment is
      ordered.

  - title: "Ductwork Designed for Heat Only — Now You Want to Add Cooling"
    description: |
      Adding a cooling coil to a duct system built for a gas furnace is one of the most
      commonly mishandled HVAC jobs in older Seattle-area homes. Supply trunks sized for
      130°F furnace air don't move 55°F conditioned air at the right velocity — the result
      is high static pressure, a blower motor working harder than it should, and rooms
      that barely cool while others freeze. On top of that, under-insulated supply runs
      in an unheated crawlspace will sweat in summer. The fix requires a Manual J load
      calculation, checking existing trunk and branch dimensions against cooling airflow
      requirements, sealing all joints with mastic (not foil tape), and in some cases
      upsizing a trunk section or adding a return-air grille. Duct sealing alone on a
      typical SeaTac rancher runs $1,200-$2,500. Combined with a properly sized 2.5- or
      3-ton AC condenser and evaporator coil, the system actually delivers what the
      homeowner expected. Timeline from site visit to final inspection: typically three
      to four weeks.

  - title: "Ductless Mini-Split for a Garage Conversion or Backyard DADU"
    description: |
      WA HB 1337 (effective 2024) allows up to two ADUs per single-family lot statewide,
      and a steady number of SeaTac homeowners in the 98188 area are converting garages
      or adding detached backyard units. Neither of those spaces has existing ductwork,
      and tying into the main system is usually impractical. A single-zone Mitsubishi
      MXZ or Daikin Fit ductless unit — 9,000 or 12,000 BTU depending on square footage
      — handles both heat and cooling cleanly with one wall-mounted head and a compact
      outdoor condenser on a pad or bracket mount. The City of SeaTac requires a
      mechanical permit for mini-split installations; rough-in inspection happens before
      wall penetrations are closed, and final inspection confirms refrigerant charge and
      electrical connections. TopVolk is a WA Licensed Contractor — Vladislav pulls the
      permit, schedules both inspections, and coordinates the 240V dedicated circuit with
      the electrician. Installed cost for a single-zone system: $3,500-$5,500 depending
      on lineset run length and electrical distance.

  - title: "Heat Pump Conversion from Gas — Running the IRA Numbers"
    description: |
      The financial case for converting from gas to a heat pump has shifted significantly
      since the Inflation Reduction Act passed. A cold-climate heat pump — Mitsubishi
      Hyper Heat, Bosch IDS, or similar — qualifies for the 25C tax credit (up to $2,000
      per year) and may also stack with Puget Sound Energy rebates, which run $200-$800
      depending on equipment efficiency tier. The full conversion on a typical SeaTac
      rancher — heat pump, air handler, lineset, electrical disconnect, refrigerant
      permits, and mechanical permit — runs $8,000-$14,000 before incentives. After
      rebates and the tax credit, the net cost drops closer to $5,500-$11,000 depending
      on what programs the homeowner qualifies for. Vladislav provides a written line-item
      quote at the site visit and identifies which incentives apply to the specific
      equipment and installation — not a generic estimate that shifts when the crew
      arrives. Deadline commitments go into the contract; if a milestone is missed, there
      are financial penalties, not just an apology email.

  - title: "Smart Thermostat Wiring Problems and Zoning on Older Systems"
    description: |
      A Nest Learning Thermostat or ecobee SmartThermostat Premium is a reasonable
      upgrade on almost any forced-air system — but older SeaTac homes frequently lack
      the C-wire (common wire) that smart thermostats need to stay powered continuously.
      Nest's Power Connector and ecobee's included Power Extender Kit both solve this
      without rewiring the thermostat cable, but each solution has to be matched to the
      specific control board. Homes with an existing heat pump need a thermostat that
      handles O/B reversing valve logic correctly, or the system heats when it should
      cool. Adding two-zone control with Honeywell TrueZONE damper actuators and an
      ecobee with two remote sensors runs $1,800-$3,200 installed, depending on how
      many supply runs need dampers. In SeaTac's eight-month heating season, zoning
      unoccupied bedrooms off the main loop cuts energy waste in a way that shows up
      clearly on the utility bill within the first winter. Maintenance on smart-thermostat
      systems is minimal — filter changes every 60-90 days and a coil inspection annually.

faq:
  - q: "How fast can TopVolk get to SeaTac for an HVAC estimate?"
    a: |
      SeaTac sits right off I-5, which makes it a straightforward run from most of
      Vladislav's other King County project sites. Most initial estimates in 98158 or
      98188 can be scheduled within two to three days of your call. The site visit
      takes 45-60 minutes — mechanical room, ductwork condition, attic insulation depth,
      electrical panel capacity — and produces a written line-item quote before you
      commit to anything. Equipment lead times are typically one to two weeks for
      stocked items; mini-splits sometimes run longer depending on model. Call
      (206) 591-1096 to get on the schedule.

  - q: "What does a heat pump installation cost in SeaTac?"
    a: |
      For a straightforward equipment swap on an existing heat pump system, expect
      $5,500-$9,000 installed. A full conversion from gas furnace to heat pump — new
      air handler, outdoor unit, lineset, electrical, and permit — runs $8,000-$14,000
      before IRA tax credits and Puget Sound Energy rebates, which can offset
      $2,000-$3,000 of that total. What moves the number: house square footage, required
      tonnage, how far the lineset runs, and whether the electrical panel needs a
      breaker added. Vladislav provides exact pricing per line item at the site visit —
      call (206) 591-1096 for a free on-site assessment.

  - q: "Do I need a permit for HVAC work in SeaTac, and who handles that?"
    a: |
      Yes — equipment replacement, new duct runs, and mini-split installations all require
      a mechanical permit in the City of SeaTac. Properties in unincorporated King County
      pockets nearby go through King County DPER instead. Both jurisdictions enforce the
      Seattle Energy Code for efficiency minimums and duct leakage requirements. TopVolk
      is a WA Licensed Contractor; Vladislav prepares and submits permit documentation,
      tracks plan review status, and schedules required inspections — rough-in and final.
      You don't have to manage any of that process. Permit fees for mechanical work in
      SeaTac typically run $150-$400 depending on project scope and are included in the
      project quote.

  - q: "Can you add central air to an existing forced-air furnace system in SeaTac?"
    a: |
      Yes, but the duct system has to be evaluated before sizing the equipment. Homes
      in SeaTac's older neighborhoods have supply trunks designed for heat-only loads —
      add a cooling coil without checking static pressure and airflow, and the evaporator
      ices up within the first hot week. Vladislav measures existing trunk and branch
      dimensions, runs a Manual J load calculation, and identifies any ductwork
      modifications needed before recommending a condenser size. A proper AC addition —
      evaporator coil, condenser, refrigerant lines, electrical disconnect, and permit —
      runs $4,200-$7,500 depending on system tonnage and how much duct modification
      the existing system requires.

  - q: "How long does HVAC equipment last in the Seattle climate, and when should I replace instead of repair?"
    a: |
      Gas furnaces in SeaTac's climate run 18-22 years with regular filter changes and
      annual inspections. Heat pumps typically reach 15-18 years before compressor
      efficiency drops to the point where replacement makes more financial sense than
      repair. The rule of thumb: if the repair cost exceeds half the replacement value,
      new equipment pencils out better — especially when the new unit qualifies for IRA
      incentives. Seattle's mild marine climate is actually easier on compressors than
      colder inland markets like North Bend or Enumclaw. That said, outdoor condensers
      on north-facing walls collect moss and debris year-round here, and coil corrosion
      from sustained humidity shortens equipment life if the unit goes uninspected for
      several seasons.

