title: "Kirkland Power Washing — Cedar, Hardie & Concrete Done Right"

intro: |
  Concrete driveways in Bridle Trails accumulate tire marks and oil from two decades of daily parking — a garden hose doesn't address that. Cedar fencing and north-facing decks throughout 98033 and 98034 pick up moss and organic staining by February most years, shaded by the mature Douglas-fir that defines much of this neighborhood. Hardie siding repainted before 2020 needs a surfactant pre-wash before fresh primer bonds — Armstrong Clark deck stain won't adhere to chalky, oxidized fiber-cement. The Pacific Northwest rain cycle does the damage gradually, but the repair window matters: late spring, before summer stain season, is when surface prep actually holds.

localContext: |
  Kirkland's Bridle Trails and Totem Lake neighborhoods (primarily zip 98034) are dominated by 1970s-1980s construction — split-level homes and two-story colonials with aggregate concrete driveways, original cedar fencing, and James Hardie siding installed during 2000s renovation waves. Closer to Houghton and downtown Kirkland in 98033, mid-century homes on post-and-pier foundations trap moisture against wood siding and crawlspace rim joists. Seattle's 37-plus inches of annual rain cycles all of these surfaces through organic buildup faster than most homeowners plan maintenance around. Finn Hill properties above the Juanita watershed sit at a slightly higher elevation where freeze-thaw cycles in late February crack sealers on aggregate slabs — a factor that changes both prep chemistry and post-wash sealer selection.

commonProblems:
  - title: "Moss and Lichen Embedding into Cedar Deck Grain"
    description: |
      North-facing cedar decks in Finn Hill and the Juanita corridor don't just grow surface moss — rhizoids (root-like structures) push 1-2mm into the softwood grain by mid-winter. A 2,500 PSI wand pass cleans what's visible but leaves embedded spores that regrow within one growing season. Biocide pre-soak with 10-15 minutes dwell time, followed by a controlled 600-800 PSI downstream rinse, clears the colony without raising the grain. After that, stain or sealer bonds to bare wood properly.
  - title: "Hardie Cement-Board Chalk and Oxidation Before Exterior Repaint"
    description: |
      James Hardie fiber-cement siding on Kirkland's 1990s-2000s homes develops chalk and surface oxidation on south and west exposures after 12-15 years — normal weathering, but paint adhesion requires a clean, chalk-free surface. A 1,200-1,500 PSI soft wash with downstream surfactant injection strips the oxidized layer without cracking the board face. Rose Hill and Totem Lake homes are hitting that repaint cycle right now; skipping the pre-wash means primer peels inside 12 months.
  - title: "Efflorescence and Oil Staining on Aggregate Concrete Driveways"
    description: |
      Aggregate concrete driveways in 98034 develop two distinct problems over time: motor oil from daily vehicle parking and efflorescence — white mineral salt deposits that leach to the surface as groundwater evaporates through the slab. Both need different chemistry applied in sequence. Hot-water pressure washing with a commercial degreaser handles oil penetration into the concrete; efflorescence requires an acid-based pre-treatment with a 5-10 minute dwell applied first, or the salts redeposit as the slab dries after rinsing.

