  - q: "Do you clean composite decks like Trex and TimberTech, or only wood?"
    a: |
      Both. Composite decks — Trex, TimberTech, and comparable products — need lower pressure than cedar or fir, typically under 1,200 PSI, and no sodium hypochlorite solutions, which discolor the composite surface. GPM and nozzle selection adjust by material type. We've cleaned wood and composite surfaces on 100+ projects across Kirkland, Bellevue, and Redmond since 2023.

