  - q: "Do you wash Trex composite decking differently than cedar?"
    a: |
      Yes — Trex and TimberTech composite cap-stock requires a maximum 600-800 PSI fan-tip rinse. A zero-degree nozzle etches the surface permanently and voids most manufacturer warranties. Hardie fiber-cement siding sits in the 1,200-1,500 PSI range with surfactant pre-treatment. Cedar is the most pressure-sensitive of the three; 500-700 PSI avoids raising the grain before any stain application.
