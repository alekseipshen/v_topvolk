title: "Kirkland Power Washing — Cedar, Concrete & Hardie Prep"

intro: |
  Driving up Market Street toward Rose Hill, you can spot the houses that skipped last fall's cleaning cycle — dark streaking down Hardie cement-board siding, green moss patches settled into north-facing cedar deck boards, oil shadows on concrete driveways that rain alone never lifts. Kirkland's hillside lots and heavy tree canopy hold moisture against exterior surfaces for months at a stretch. Exterior cleaning here isn't cosmetic maintenance; it's surface prep that determines whether a stain job, repaint, or sealant actually bonds and holds through the next wet season.

  That distinction matters more in Kirkland than most people expect.

localContext: |
  The 98034 zip covers Juanita and Totem Lake — areas dense with 1970s-1980s split-levels and ranchers whose original cedar siding, board fences, and poured concrete driveways carry years of organic buildup. The 98033 zip, running through Kirkland's older lakefront and downtown-adjacent blocks near Marina Park, holds similar maintenance debt on 1960s-era homes. Bridle Trails and Rose Hill lean toward 1990s-2000s construction where Trex and TimberTech composite decks sit under Douglas-fir canopy that keeps surfaces damp well into June.

commonProblems:
  - title: "Moss rooting into cedar deck grain after back-to-back wet winters"
    description: |
      Kirkland pulls about 37 inches of rain annually, and mature tree cover in Juanita and Rose Hill adds shade that keeps cedar surfaces wet from October into April. Moss doesn't just sit on top — it drives rhizoids into the wood grain and holds moisture against the surface year-round. Scrubbing without a sodium hypochlorite pre-treat pulls surface fibers and accelerates weathering. Proper cedar surface prep here means a chemical dwell period before any pressure is applied, so the biology is dead before the wand touches the boards.

  - title: "Efflorescence and tire-rubber deposits on concrete driveways"
    description: |
      Concrete driveways in 98033 and 98034 deal with two problems at once. Efflorescence — the white calcium carbonate crust that migrates up through aging slabs as groundwater evaporates — accumulates in shaded sections where drying is slow. Tire rubber and oil deposits stack on top. A garden hose rinse won't cut either bond. The right approach is a surface cleaner attachment with targeted PSI — enough pressure to lift the deposits without etching the aggregate and leaving the slab rougher than you found it.

      Some Kirkland driveways near the lakefront have been sitting since the 1960s with no previous pressure treatment. Those slabs need a pre-soak and a second pass.

  - title: "Hardie siding and stucco cleaning before exterior repaint"
    description: |
      James Hardie cement-board holds algae and mildew in its textured surface, especially on north and west-facing walls that dry slowly through winter. Painting over contaminated siding voids most manufacturer warranties and shortens the bond life regardless of primer quality. The cleaning process for Hardie isn't aggressive pressure washing — it's a soft-wash pass at 500-800 PSI with the right surfactant concentration and rinse timing, so you're not fracturing the factory color coat or blasting the acrylic primer layer underneath. TimberTech and Trex composite surfaces get the same low-pressure treatment. On homes with stucco accents, which show up in some of the 1990s-era construction in Bridle Trails, nozzle distance and dwell time adjust again — stucco is porous and holds cleaning solution longer than cement-board, so the rinse sequence matters as much as the wash itself.

