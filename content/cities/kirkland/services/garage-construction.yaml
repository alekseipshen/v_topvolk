title: "Kirkland Garage Construction — Permit-Ready Builds for 98033 & 98034"

intro: |
  Juanita and Bridle Trails in zip 98034 were built out mostly between 1968 and 1985 — garages from that era weren't designed for a Rivian, a workshop bench, and a potential ADU rental above. Vladislav Volkov, WA Licensed Contractor, has permitted and built garages across Kirkland since 2023, with 100+ projects completed across King County. Permit applications run through the city's own permit center, not King County DPER, which covers unincorporated areas only. Deadline penalties are written into every contract — Vladislav works the job directly, not through a middleman.

localContext: |
  Kirkland runs its own permit center — separate from King County DPER. Plan review for a detached garage or DADU-above-garage project typically takes 6-10 weeks. Lots in 98033, covering South Kirkland, Norkirk, and areas near Marina Park on the Lake Washington waterfront, run 7,000 to 9,500 square feet. At that size, setback compliance and lot coverage limits under Kirkland Municipal Code often determine whether the footprint you want is buildable at all. Seattle area rainfall averages around 37 inches annually — vapor barriers under slab-on-grade and proper footing drainage are standard, not optional. The 1970s split-levels in these neighborhoods have rooflines and Hardie siding that any addition needs to match.

commonProblems:
  - title: "Setback and Lot Coverage Calculations That Sink Permit Applications"
    description: "Kirkland requires 5-foot rear and side setbacks for accessory structures, and total lot coverage — house, driveway, and proposed garage combined — caps at 40-55% depending on zone. On a 7,500-square-foot lot in 98033, those limits can eliminate the footprint size you want entirely. A lot coverage calculation submitted wrong at the permit center adds 6-8 weeks waiting for a correction response. The design conversation starts with a site survey and zoning check, not a floor plan sketch. Getting that right before engineering drawings are commissioned saves real money."
  - title: "ADU Above the Garage Needs Structural Engineering That Budget Bids Skip"
    description: "WA HB 1337 opened up DADUs above detached garages on virtually every Kirkland single-family lot. But a livable second floor changes the structural spec entirely: LVL beams at garage door openings, engineered floor joists instead of dimensional lumber, a rim joist sized for live load. A rough-in inspection by the AHJ is required before the floor system gets covered. Bids that omit structural engineering costs aren't saving money — they're deferring a change order to the middle of the project."
  - title: "Concrete Slab Spec for Workshop Use or an EV Charging Bay"
    description: "Standard 4-inch plain concrete is fine for parking. A workshop floor or a wall-mounted Bosch Level 2 charger bay calls for 5-inch fiber-reinforced concrete with control joints spaced for point loads. Pre-wiring a 60A circuit stub-out during the pour means conduit in the slab, junction box set, and panel home run pulled before the concrete cures. At construction: roughly $400. Cutting into finished concrete afterward: $2,500 minimum, and the vapor barrier underneath gets compromised in the process."

faq:
  - q: "How fast can you get to Kirkland for Garage Construction?"
    a: "Juanita, South Kirkland, Totem Lake, Bridle Trails — all on the regular schedule. Vladislav walks the lot in person, checks setbacks and lot coverage on the spot, and delivers a written line-item quote. No sales staff, no middleman. Call (206) 591-1096 to schedule a site visit."
  - q: "Do you pre-wire garages for EV charging during construction?"
    a: "Yes — and it has to happen during rough-in, before the slab pours or walls close. A 50A or 60A circuit stub-out sized for a Bosch, ChargePoint, or Tesla Wall Connector gets roughed in: conduit in the slab, the panel home run is pulled, and the junction box is set while everything is still open. Retrofitting after the slab cures costs three to five times more and usually means cutting through finished concrete."
  - q: "What does a Kirkland garage build with a DADU above actually cost?"
    a: "A detached two-car garage without living space runs $65,000-$110,000 depending on size and finish. Add a DADU above — framing, MEP rough-in, R-49 insulation in the roof assembly, drywall, a Mitsubishi mini-split, separate electrical panel with meter base — and you're typically looking at $190,000-$270,000 all-in, permits included. Deadline penalties are written into the contract. Free on-site consultation with Vladislav: call (206) 591-1096."