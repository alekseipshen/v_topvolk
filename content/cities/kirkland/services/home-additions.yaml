title: "Kirkland Home Additions — ADUs, Suites & Second Stories"

intro: |
  Kirkland's lakeside neighborhoods — Juanita, Houghton, Rose Hill — have a housing
  stock that doesn't match today's household sizes. A 1,400-square-foot rancher built
  in 1962 for a family of four is now a home office, aging parent, and occasional
  rental situation all fighting for the same square footage.

  Adding a proper suite means a Mitsubishi mini-split for the new zone, a separate
  entrance off the side yard, and a kitchen pass with room for a real Bosch dishwasher —
  not a hotplate crammed into a closet. Call (206) 591-1096 to schedule a free
  on-site consultation — Vladislav walks the property himself before any design starts.

localContext: |
  Most of the homes in 98034 — covering Juanita, Totem Lake, and North Kirkland — were
  built between 1955 and 1975. Crawlspaces under these ranchers often show moisture
  intrusion from Kirkland's wet winters, so any addition touching the foundation needs a
  vapor barrier inspection before framing starts.

  Parts of 98033 near downtown and the Norkirk neighborhood carry older Craftsman-era
  stock where original framing wasn't engineered to carry additional floor loads — that
  changes the scope and the structural calculations significantly. A lot of homeowners
  in those blocks also discover galvanized supply lines when the walls open up, which
  adds a copper retrofit to the plumbing rough-in scope.

  Different story along Bridle Trails and Education Hill. Those 1990s and early-2000s
  builds are structurally sound for additions, but energy-code compliance for the new
  square footage still has to be addressed in the plan set — Kirkland's permit center
  reviews that carefully on any conditioned space addition.

commonProblems:
  - title: "Setback and FAR Limits Eating Into Your Addition Footprint"
    description: "Kirkland runs its own permit center — not King County DPER — so plan
      review timelines and FAR calculations follow city-specific zoning tables. Standard
      single-family zones often cap lot coverage at 35-40%, which can shrink your
      buildable footprint by several hundred square feet compared to what's sketched on
      paper. Front-loading a zoning review before design finalizes saves months of
      back-and-forth. Vladislav pulls the parcel data and walks through the FAR math at
      the initial site visit — call (206) 591-1096 before you've paid a designer to
      draw something that won't fit. WA Licensed Contractor, 100+ projects completed
      since 2023 across Kirkland and King County."
  - title: "Foundation Capacity for Second-Story Work on 1960s Ranchers"
    description: "Post-and-pier foundations under most 98034 split-levels weren't
      engineered for a second story. A structural engineer has to assess bearing capacity
      and typically designs new continuous footings or a reinforced perimeter before any
      LVL beam and new floor system can tie in. Skip the engineer and Kirkland's plan
      review will require one anyway — better to have that report before design is
      finalized. Scope the structural assessment into the early budget and it stops being
      a surprise that restarts your timeline mid-permit."
  - title: "HVAC Zoning When Existing Ductwork Can't Handle More Square Footage"
    description: "Older Rose Hill and Juanita homes often have undersized supply runs
      already working at capacity. Extending to a new addition zone through existing
      ductwork usually means cold corners and pressure imbalances throughout the house.
      A Mitsubishi mini-split ducted to the new space solves this cleanly — separate
      controls, no new duct penetrations through finished framing, and better efficiency
      for the added square footage. Deadline penalties are written into the contract, so
      the mechanical rough-in doesn't slip a week while a sub reschedules."

faq:
  - q: "How long does a home addition take to permit and build in Kirkland?"
    a: "Kirkland's permit center runs plan review 6-10 weeks for additions. Construction
      follows: a 400-500 sq ft suite typically takes 3-4 months, a second story 5-7
      months. Those timelines assume the structural report is in hand before permit
      submittal — missing it adds 3-6 weeks to plan review. Call (206) 591-1096 to
      walk through your scope before committing to a start date. Vladislav does those
      consultations himself, no sales staff."
  - q: "Can you match existing Craftsman or mid-century siding and rooflines on a new addition?"
    a: "For Craftsman bungalows, cedar trim profiles and Hardie cement-board siding take
      paint like original wood. Mid-century stucco is matchable with modern three-coat
      systems. Roofline tie-ins — dormers, shed roofs — need careful rafter layout and
      blocking; that's where a lot of additions look patched if the framing isn't thought
      through from the start. Schedule a free consultation to review the existing
      roofline geometry — matching it gets priced in from day one, not value-engineered
      out during framing."
  - q: "What does a home addition or ADU cost in Kirkland, and how does WA HB 1337 change things?"
    a: "Attached room additions typically run $80K-$130K depending on foundation work,
      MEP rough-in, and finishes. Under WA HB 1337, Kirkland lots now allow up to 2
      ADUs — a full DADU with separate utility connection usually comes in at
      $150K-$250K+. Vladislav provides line-item quotes with deadline penalties written
      into the contract. WA Licensed Contractor, 100+ projects completed since 2023."