title: "Kirkland Home Additions — Expand Without Selling or Moving"

intro: |
  Juanita and the South Kirkland neighborhoods along 98033 were mostly built in the 1960s and early 1970s — split-levels and ranchers on decent-sized lots, designed for smaller households. The lot is still there. The floor plan isn't cutting it anymore. Vladislav Volkov at TopVolk Construction (WA Licensed Contractor) has completed 100+ additions across the Seattle Metro since 2017, including full second-story builds and DADUs in Kirkland where plan review runs through Kirkland's own permit center, not King County DPER.

localContext: |
  Bridle Trails and the Totem Lake corridor in 98034 mix early-1970s ranchers with 1980s builder homes and newer infill — post-and-pier foundations on the older stock, full perimeter stem walls on the 1980s builds, and slab-on-grade on some 1990s infill. Those distinctions matter before any addition goes to design. An older rancher on post-and-pier with 2x6 framing wasn't built for a second story without new LVL beam sizing and point load engineering down to the footings. Kirkland runs its own permit center; major addition plan review typically takes 6-10 weeks. That timeline gets built into every project schedule, with a deadline penalty clause in the contract — written in, not just mentioned.

commonProblems:
  - title: "Existing Foundation Can't Handle Second-Story Weight"
    description: "A 1968 rancher in 98033 wasn't engineered for a second floor. Structural calculations have to come first — where can the existing foundation accept new point loads, where does a new LVL beam need to land at the ridge, and does the stem wall need reinforcement? Get that wrong and you're tearing out framing after a failed rough-in inspection. We pull an engineer before the design goes to permit."
  - title: "FAR Caps and Setback Lines Restricting the Addition Footprint"
    description: "Kirkland's single-family zones have FAR limits tied to your lot size, and setback requirements on side and rear yards shrink the buildable envelope fast. A design that ignores those numbers goes back to the drawing board after plan review — adding 6-8 weeks and extra engineering fees. We pull zoning data and run the FAR math during design, before anything gets submitted to Kirkland's permit center."
  - title: "Matching Exterior Siding and Roofline Tie-In on Older Homes"
    description: "Adding a master suite wing to a 1972 Bridle Trails split-level means the exterior has to read as part of the original house. Hardie cement-board siding handles Kirkland's 37 inches of annual rain and the moss that grows on north-facing walls better than the original wood lap it's replacing. The roofline connection needs a proper ledger board and step flashing — that's where water infiltration starts when framing connections are sloppy."

faq:
  - q: "How fast can you get to Kirkland for Home Additions consultations?"
    a: "Kirkland is a 15-25 minute drive from our base, depending on 405 traffic. Vladislav comes to your property for the initial walkthrough — not a salesperson. Call (206) 591-1096 to schedule a free on-site consultation, usually within a few days."
  - q: "Can you integrate Mitsubishi mini-splits or Bosch appliances into the new addition?"
    a: "Yes. Tying new square footage into existing ductwork rarely works well, so we typically spec a Mitsubishi mini-split for the new HVAC zone. If the addition includes a kitchen expansion with Bosch, Thermador, or Sub-Zero equipment, we rough-in for the exact appliances you're installing — not a generic layout. That means the right CFM rough-in for the range hood, correct circuit sizing for induction, and cabinet dimensions that match what you've ordered."
  - q: "What does a home addition cost in Kirkland and how long does it take?"
    a: "Single-story bedroom-and-bath additions run $120K-$180K. Second-story additions on existing ranchers start around $200K. A DADU under WA HB 1337 — detached, with separate utility connection — typically runs $180K-$280K. Timeline from contract to final inspection: 3-5 months for room additions, 4-7 months for ADUs including Kirkland permit center plan review. Call (206) 591-1096 — we provide a line-item quote after the site visit, not a vague range."