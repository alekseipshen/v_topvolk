  - q: "Trex or TimberTech — which composite holds up better on Kirkland's shaded lots?"
    a: "Both capped composites outperform cedar in high-moisture, shaded
      conditions. Trex Transcend and TimberTech PRO Legacy both carry 25-year
      fade and stain warranties. Cedar still works on open south-facing lots —
      but most Kirkland hillside sites don't qualify. We walk through the
      material decision on site so you're not guessing."

  - q: "What does the Kirkland deck permit process look like and how long does it take?"
    a: "Kirkland runs its own Building Department — separate from King County
      DPER. Plan review for a standard deck typically runs 4-8 weeks. Budget
      two inspections minimum: ledger flashing rough-in and final. Full
      project including permitting runs 10-16 weeks start to finish, with
      missed-deadline penalties written into the contract. Call (206) 591-1096
      to start the scope conversation."