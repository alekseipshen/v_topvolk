title: "Kirkland Deck Installation — Ledger to Post, No Rot"

intro: |
  Hillside lots above Juanita Bay rot from the inside out — failed ledger
  flashing against an unprotected rim joist is how most 1970s-80s decks in
  98034 end up unsalvageable. On shaded northwest slopes, Trex and TimberTech
  composite outlast cedar without annual sealing and hold up under a built-in
  Weber grill station without warping around the heat source. TopVolk
  Construction, WA Licensed Contractor — Vladislav Volkov pulls Kirkland
  Building Department permits and builds decks from post footing to guardrail,
  100+ projects across King County since 2017.

localContext: |
  Kirkland's 98033 zip — downtown through Norkirk — mixes 1950s cottages with
  1990s infill, most of them on sloped lots dropping toward Lake Washington.
  Those grades put upper deck platforms well above 30 inches, which triggers
  IRC guardrail requirements at the upper platform. Bridle Trails and Finn Hill
  (98034) skew newer, but even 2000s builds need ledger connections inspected
  during rough-in before decking goes down on any permitted project.

commonProblems:
  - title: "Cedar vs. Composite on North-Facing Kirkland Lots"
    description: "Cedar decking on a shaded hillside lot in 98034 mosses over within 18
      months without annual cleaning and sealing — most homeowners skip that
      step. TimberTech and Trex capped composite boards resist moisture
      absorption and don't support moss growth the way open-grain cedar does.
      On lots near Juanita Creek drainage, composite is the practical call,
      not the premium one."

  - title: "Ledger Flashing Failure — Rot Starts at the House Wall"
    description: "Deck ledgers nailed directly to rim joist framing without metal
      flashing create a moisture pocket that holds rainwater against the band
      joist for years. Kirkland's Building Department requires a ledger
      flashing inspection before decking goes down. On 1970s-80s builds common
      in the Totem Lake and North Kirkland area, that often means replacing
      the rim joist before any new frame can attach."

  - title: "Post Footings Too Shallow for Frost Line — Code and Structural Issue"
    description: "IRC requires post footings at 12-18 inches below grade for this
      climate zone. Older Kirkland decks — especially on 1960s ranchers near
      Lake Washington — often sit on undersized concrete pads with ground-
      contact PT lumber posts set with no proper footing depth. Kirkland's
      Building Department flags this at rough-in inspection, and it can add
      two to three weeks to a replacement project."

faq:
