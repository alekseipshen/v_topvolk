title: "Kirkland Kitchen Remodel — Open Layouts for Lake-View Homes"

intro: |
  Homes in Juanita and along the 98034 corridor were built when kitchens stayed
  separate — a wall here, a short hallway there, the dining room fully cut off.
  That layout made sense in 1968. It doesn't match how Kirkland households cook
  today. A Bosch induction range alone requires a dedicated 240V circuit, and
  original 100-amp panels in these neighborhoods routinely need upgrading before
  the appliance can even be connected. TopVolk Construction has handled this
  combination — structural, electrical, finish — across 100+ projects since 2023.

localContext: |
  The heaviest remodel volume in Kirkland runs through 98033 and 98034 — ramblers,
  split-levels, and two-story colonials built between 1960 and 1985. Juanita and
  Totem Lake neighborhoods carry some of the densest concentration of this stock.
  Galvanized supply lines appear in anything pre-1975. Load-bearing walls cut
  straight through the middle of most of these floor plans, which means every
  open-concept layout starts with an engineering question, not a design question.
  City of Kirkland has its own permit center — plan review for structural work
  typically runs 3-6 weeks.

commonProblems:
  - title: "Load-Bearing Walls Blocking the Open-Concept Layout"
    description: |
      Most 1960s-70s Kirkland ramblers have a load-bearing wall running between
      the kitchen and the main living area. Removing it requires a structural
      engineer's stamp, a correctly-sized LVL beam, new PSL posts to carry the
      load, and a City of Kirkland building permit with rough-in and final
      inspections. Skip the engineering step and you get floor deflection upstairs.
      Do it right and 300-400 square feet suddenly feel connected.

  - title: "Electrical Service Too Weak for Modern Appliances"
    description: |
      A Thermador induction cooktop draws 50 amps. Add a Bosch dishwasher,
      recessed lighting on dimmers, and a range hood pulling 600+ CFM and the
      math doesn't work on a 100-amp panel. Homes in 98034 with original service
      need a full upgrade to 200 amps — which means City of Kirkland electrical
      permit, an inspection, and coordination with Puget Sound Energy before
      rough-in can start. We handle that sequencing.

  - title: "Built-In Appliances That Don't Fit Standard Cabinet Dimensions"
    description: |
      Sub-Zero column refrigerators and Wolf ranges aren't 24-inch standard depth.
      IKEA and semi-custom cabinet lines are designed around that assumption.
      Built-in appliances need custom panels, modified upper cabinet heights, or
      full custom cabinetry to integrate without visible gaps. Getting the rough
      opening wrong during framing costs significantly more to fix during finish
      work than catching it on paper first.

faq:
  - q: "How fast can you get to Kirkland for a Kitchen Remodel consultation?"
    a: |
      Kirkland is a regular stop — we work in 98033 and 98034 consistently and
      can usually schedule an on-site walkthrough within 3-5 business days. Call
      (206) 591-1096 to set up a free consultation directly with Vladislav. No
      sales staff, no middleman. WA Licensed Contractor.

  - q: "Can you handle Sub-Zero, Wolf, and Thermador appliance integration?"
    a: |
      Yes. Built-in Sub-Zero columns, Wolf dual-fuel ranges, and Thermador
      cooktops all require precise rough openings, dedicated circuits, and custom
      cabinetry coordination. We handle the cabinet layout, electrical rough-in,
      and appliance delivery sequence together — so the panels align and the
      clearances are right before the appliances arrive.

  - q: "What does the permit process look like and how long does a full remodel take?"
    a: |
      For a full kitchen remodel in Kirkland involving structural work — say,
      an LVL beam for a wall removal — plan review at the City of Kirkland permit
      center typically runs 3-6 weeks. Construction itself runs 6-10 weeks once
      permits are in hand. Start-to-finish including permitting: expect 3-5 months.
      Deadline is written into the contract with penalty terms — not a verbal
      commitment.