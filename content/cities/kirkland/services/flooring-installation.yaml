  - q: "Do you work with Kahrs, Shaw, or other engineered hardwood brands common in this area?"
    a: "Yes — Kahrs, Shaw Floorté, and Mirage are products we specify regularly for Kirkland
      slab and crawlspace installs. Schluter transition strips for hardwood-to-tile thresholds.
      Product choice follows subfloor conditions and moisture readings, not distributor margins.
      For Bridle Trails slab installs specifically, we typically spec a glue-down engineered
      with a minimum 3mm wear layer — enough to sand and refinish once if needed years down
      the road."
