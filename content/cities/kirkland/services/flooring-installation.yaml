title: "Kirkland Flooring Installation — Moisture-Smart Hardwood & Subfloor Prep"

intro: |
  Lake Washington sits less than a mile from most of Kirkland's residential core, and
  from October through April the air off the water is persistently humid. Lay hardwood
  without a 4-7 day acclimation period in a home near Juanita Beach and you'll see
  cupping by spring. We test subfloor moisture with a Tramex meter before a single
  board goes down — a step that gets skipped more often than it should on rushed
  installs in 98033. Douglas-fir subfloor decking in the older Norkirk homes absorbs
  ambient humidity differently than OSB in newer construction. That difference matters
  when you're choosing between a nail-down and a floating install method. Getting it
  wrong shows up six months later, not the day of installation.

localContext: |
  Kirkland's housing stock splits three ways: 1970s split-levels and ranchers around
  Totem Lake (98034) with plywood subfloors over vented crawlspaces, 1990s colonials
  on slab in Bridle Trails, and a cluster of older Craftsman-era homes in the Norkirk
  and Houghton neighborhoods (98033) still wearing their original 2-1/4 inch oak strip
  flooring. Each era brings a different subfloor condition — and a different installation
  approach before you ever pick a finish product. The crawlspace homes near Totem Lake
  often need a vapor barrier upgrade before flooring goes in, especially on north-facing
  additions where moss growth on the exterior is a clue that moisture is also moving
  through the floor system. Bridle Trails slab homes built between 1988 and 1998 skipped
  the subfloor layer entirely in many cases — concrete-direct installs require a different
  adhesive spec and stricter moisture testing before any material order gets placed.

commonProblems:
  - title: "Engineered vs. solid hardwood on Bridle Trails slab foundations"
    description: "Solid hardwood on concrete is a moisture problem waiting to happen. In Kirkland's
      humid winters, concrete slabs off-gas enough moisture to cup and crack solid boards
      within a season. Engineered hardwood — a ply-core construction with a real veneer —
      handles the expansion cycle better. A 6-mil vapor barrier membrane goes down first,
      then the click-lock or glue-down layer. Skipping the membrane voids most manufacturer
      warranties on engineered product. We document moisture readings before and after the
      membrane install so there's a paper trail if a warranty claim ever comes up."
  - title: "Matching 2-1/4 inch oak strip in Norkirk and Houghton restoration projects"
    description: "Pre-1960s homes near downtown Kirkland were almost universally laid with 2-1/4 inch
      red oak strip. Sourcing matching stock is possible, but the real problem is finish
      matching — existing boards have decades of Bona or oil-based polyurethane built up.
      A partial replacement that isn't sanded and refinished room-wide will always show the
      seam. We sand to bare wood on the entire floor before applying a uniform finish coat.
      Typically that means starting at 36-grit to cut through the old finish, stepping up
      through 60 and 80, then finishing at 100 before the first seal coat. Rushing the
      sanding sequence to save a day is how you end up with visible swirl marks under
      natural light."
  - title: "Vinyl asbestos tile under 1960s kitchen floors in Totem Lake-area homes"
    description: "Homes built between 1955 and 1978 in Kirkland (especially zip 98034) commonly have
      vinyl asbestos tile under the current kitchen flooring. VAT is stable when intact —
      but cutting, sanding, or breaking it during subfloor prep releases fibers. We don't
      touch suspect tile without a lab sample. If testing returns positive, a certified
      abatement contractor completes clearance before we continue. No shortcuts on this one.
      Abatement timelines in King County typically run 5-10 business days from sample to
      clearance, so flagging it early keeps the overall project on schedule rather than
      stopping work mid-demo."

