  - q: "Do you install engineered hardwood and LVP in Kirkland condos?"
    a: |
      Both. Shaw, Anderson Tuftex, and Pergo are brands we spec and install regularly. On slab-on-grade substrates or in condos with HOA noise requirements, engineered hardwood handles humidity movement better than solid. LVP is the right call in entryways and any below-grade space where moisture is a recurring variable.

  - q: "How long does a Kirkland flooring project typically take?"
    a: |
      A 500-square-foot main floor hardwood install runs 3 to 5 days including acclimation time. Add a week or more if subfloor repairs or VAT abatement are needed — older Kirkland ranchers usually require at least one. 100+ projects completed since 2023. The finish date goes into the contract with a penalty clause if we miss it.

  - q: "Do you pull permits for flooring work in Kirkland?"
    a: |
      Straight flooring replacement typically does not require a permit from the City of Kirkland's building department. Subfloor structural repairs — sistering joists, replacing a rim joist, adding blocking — can trigger a permit depending on scope. King County DPER handles unincorporated parcels near the city limits. Vladislav walks through the permit question on the first site visit so there are no surprises mid-project. Reach him directly at (206) 591-1096.