title: "Kirkland Hvac — Heat Pumps, Mini-Splits & Duct Rebalancing"

intro: |
  Rows of 1960s split-levels line the hillside streets above Juanita Beach — zip 98034 — built around gas furnaces when energy costs barely registered on anyone's budget. That era is over. IRA federal rebates now cover up to 30% of heat pump conversion costs, Puget Sound Energy stacks its own incentives on top, and a Mitsubishi Hyper Heat system handles both heating and cooling in one outdoor unit. Kirkland gets roughly 37 inches of rain annually, and that sustained humidity accelerates duct liner deterioration faster than most homeowners expect. For Kirkland homeowners still running those original systems, the math has shifted significantly.

localContext: |
  Kirkland's housing stock splits into two distinct eras. The older core — Houghton, South Kirkland, and Juanita in 98033 — carries mid-century ranchers and split-levels with undersized duct runs and original gas forced-air equipment from the 1960s and 70s. Toward Totem Lake and into 98034 it shifts to 1980s-90s builder homes where 78% AFUE furnaces are still running but falling short of current Seattle Energy Code efficiency requirements. The north-facing rooflines in older Houghton neighborhoods accumulate moss every winter, and that same moisture drives into crawlspaces — vapor barriers in those homes are frequently degraded or missing entirely, which affects how mechanical equipment performs at the lowest level of the house. Both zones are prime candidates for system upgrades right now.

commonProblems:
  - title: "Gas Furnace to Heat Pump Conversion — IRA Rebate Eligible"
    description: |
      Most gas furnaces in Kirkland's older neighborhoods date to the late 1980s, running at 78-80% AFUE when 95%+ high-efficiency units are now the code standard for new installs. A cold-climate heat pump — Mitsubishi Hyper Heat or Bosch IDS — runs the compressor efficiently down to -13°F, covering heating and adding summer cooling in one swap. Federal IRA credits reach $2,000, with Puget Sound Energy rebates stacked on top. The line-set routing through a 1960s split-level exterior wall requires blocking and weatherproofing that holds up against Kirkland's wet November-through-April stretch — that's not optional work. Mechanical permits for full system replacements route through the City of Kirkland permit center, not SDCI.
  - title: "Ductless Mini-Splits for ADUs Under WA HB 1337"
    description: |
      WA HB 1337 lets Kirkland lots carry up to two ADUs now — backyard DADUs and garage apartments are going up across 98034. Extending existing ductwork into a new structure almost never works; static pressure drops too far over distance. A Daikin 9,000 BTU wall-mount head covers 400 sq ft and installs in a single day. Refrigerant line sets penetrate the exterior wall, and Seattle Energy Code requires a Manual J load calculation before mechanical permits are issued. Vladislav coordinates that calculation as part of the project scope — it's not an add-on you source separately. Call (206) 591-1096 to discuss your ADU mechanical plan before framing starts.
  - title: "Ductwork Imbalance in Split-Level Homes — Bridle Trails and Rose Hill"
    description: |
      Split-levels in 98034 — Bridle Trails, Rose Hill — almost always carry the same complaint: freezing lower level, stuffy upper floor. Original duct runs were installed without balancing dampers, making room-by-room control impossible. Adding motorized zone dampers and an ecobee SmartThermostat with room sensors corrects most imbalances without touching the existing duct system. A blower door test first reveals where conditioned air is actually escaping — important during Kirkland's wet November-through-March stretch. In homes with original flex duct from the 1970s, the inner liner often collapses at the takeoffs, cutting airflow by 30-40% before any damper work even makes sense. That gets checked first.

