title: "Kirkland Foundation Repair — Glacial Clay, High Water Table, Real Fixes"

intro: |
  Juanita Beach is two blocks from some of Kirkland's oldest residential streets, and the water
  table in 98033 runs shallow enough that post-and-pier crawlspaces flood after three consecutive
  weeks of November rain. That moisture doesn't just rot joists — it undermines the supports that
  keep your floor level. Homeowners installing a Sub-Zero column refrigerator in a Houghton-area
  ranch notice the problem fast: the unit rocks, the compressor runs off-level, and the
  manufacturer warranty gets complicated from there. A sagging floor in Kirkland is rarely just
  cosmetic. The framing underneath usually tells the real story.

localContext: |
  Kirkland's pre-1980 housing stock sits primarily in 98033 and 98034 — ranchers and split-levels
  built between 1955 and 1975 in Rose Hill, Norkirk, Houghton, and Bridle Trails. Post-and-pier
  construction was the standard approach; no continuous concrete perimeter wall, just individual
  piers supporting girder beams and floor joists. Glacially-deposited till beneath these lots
  compresses unevenly over decades, and hydrostatic pressure from the Lake Washington basin adds
  lateral load that original cedar posts weren't engineered to carry for fifty-plus years.
  In lower-elevation areas near Juanita Drive and the 98033 waterfront corridor, winter saturation
  is especially aggressive — crawlspace vapor barriers installed in the 1970s have often failed
  completely, letting ground moisture migrate directly into the rim joist and mudsill. Drainage
  improvements sometimes help, but if the piers themselves have shifted, that has to be addressed
  first. Adding a DriCore subfloor or new vapor barrier before fixing settled supports is wasted
  money.

commonProblems:
  - title: "Post-and-Pier Rot in Pre-1970 Ranchers"
    description: |
      Cedar posts set directly into damp soil — common in Kirkland homes built before 1970 — rot
      from the bottom up, often invisibly until floors begin to sag noticeably. Shimming and
      sistering new pressure-treated (PT) lumber alongside deteriorated members helps in mild
      cases, but if the concrete pier itself has settled or cracked, the repair requires a new
      cast-in-place footing. Kirkland's wet winters from October through April accelerate wood
      decay in unventilated crawlspaces. In some Norkirk and Rose Hill properties, the original
      piers were set without a proper gravel base, which means frost-heave and water absorption
      have been working against them every winter for fifty years. Replacing those requires
      temporary shoring, excavation around the existing pier, forming and pouring a new concrete
      base, and installing a steel adjustable column — all permit-required work through Kirkland's
      own permit center.

  - title: "Diagonal Cracking and Epoxy Injection on Perimeter Walls"
    description: |
      Diagonal cracks running from window corners down toward the footing in poured-concrete
      perimeter walls signal differential settling in glacial till — a pattern common across Rose
      Hill and Houghton. Epoxy injection re-bonds the crack faces under compression and stops
      active water infiltration. Left alone through January freeze-thaw cycles, each crack widens
      incrementally, and hydrostatic pressure from saturated soils does the rest.

  - title: "Seismic Retrofit: Mudsill Bolting and Shear Wall Plywood"
    description: |
      Homes built before 1994 in Kirkland rarely have mudsills mechanically anchored to the
      perimeter foundation wall. During a seismic event, the structure can slide laterally off its
      foundation entirely. WA seismic code requires mudsill bolting with anchor hardware and shear
      wall plywood panels — both permit-required through Kirkland's own permit center. Rinnai and
      Navien tankless water heaters and gas supply lines need re-anchoring and pressure-testing
      after any structural retrofit. LVL beam spans and existing blocking patterns also get
      documented during retrofit inspections, which often surfaces deferred framing issues the
      original builders left behind.

