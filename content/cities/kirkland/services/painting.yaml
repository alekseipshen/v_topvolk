title: "Kirkland Painting — Cedar, Lead Testing & Interior Repaint"

intro: |
  The homes along Juanita Drive and the hillside lots above the Google Kirkland campus are showing their paint age — cedar shake gone gray, Hardie panels with chalky residue from years of PNW rain and moss cycles. Kirkland's 98033 zip holds a dense pocket of pre-1978 construction where EPA RRP lead testing is required before any scraping can legally begin. After a kitchen remodel with Thermador appliances and new quartz counters, the trim and cabinet faces need to match that upgrade. Old paint doesn't.

localContext: |
  Zip codes 98033 and 98034 split Kirkland between the older lakeside neighborhoods and newer development on Finn Hill and in Totem Lake. Craftsman bungalows and mid-century ranchers in Houghton and Rose Hill — built between the 1940s and 1970s — carry real lead paint risk and have original wood trim that handles prep differently than modern fiber cement. The 1980s-90s homes in Bridle Trails and along the Sammamish River corridor lean toward Hardie cement-board cladding, which needs different primer chemistry and longer dry times than raw cedar.

commonProblems:
  - title: "Cedar Shake Degradation on Kirkland's Shaded North-Facing Walls"
    description: "Kirkland's north-facing siding — particularly on hillside homes above Juanita Beach Park — collects moss and surface moisture faster than most primer systems can compensate for indefinitely. Cedar shake needs a full repaint cycle every 5-7 years: pressure wash, mildewcide application, oil-based primer on exposed raw wood, then two full coats of 100% acrylic exterior. The primer step is the one most often skipped. It's also the main reason repaint jobs fail in three years instead of six. Scheduling exterior work during Kirkland's dry window — June through September — matters as much as product selection."
  - title: "EPA RRP Lead Paint Compliance in Pre-1978 Kirkland Homes"
    description: "Federal EPA RRP (Renovation, Repair and Painting) regulations require certified lead testing before any scraping, sanding, or heat-stripping on homes built before 1978. Houghton and Rose Hill both have high concentrations of housing from this era. Testing adds a lab day and a few hundred dollars to the overall project budget. Any painter who skips this step isn't doing you a favor — they're shifting legal and health liability onto you. TopVolk coordinates the certified test and handles containment protocol documentation from the start."
  - title: "Cabinet Refinishing After Kitchen Upgrades in Kirkland Homes"
    description: "After a kitchen remodel — Sub-Zero refrigerator panel integrated, Bosch dishwasher flush-mounted, quartz counters throughout — the cabinet boxes are usually structurally fine. The finish just doesn't match anymore. Full replacement runs $15K-$40K. Spray refinishing (strip, sand, prime, two-coat waterborne acrylic or lacquer finish) runs $3K-$8K and gets color-matched to a Benjamin Moore or Sherwin-Williams fan deck the same day you finalize countertops. That's a real cost difference most homeowners don't realize until they've already gotten a full cabinet bid."

