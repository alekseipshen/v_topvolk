answer: "Basement finishing in Kirkland, WA: a 600-900 sq ft finish with an egress bedroom and a bathroom typically budgets $50K-$95K, plus 4-8 weeks of City of Kirkland permit review. Free on-site estimate: (206) 591-1096."

title: "Kirkland Basement Finishing: Dry First, Then Livable"

intro: |
  Most Kirkland basements that people want to finish already have the square
  footage. What they are missing is a dry wall, a legal bedroom window and
  enough headroom once the ductwork is boxed in. Those three things decide
  the budget and the schedule far more than the finish level does, so a
  Kirkland basement remodel starts with them, in that order: water, then
  egress and mechanicals, then framing and finishes.

  If a quote starts with the floor plan and never mentions the condition of
  the walls, ask about it before you sign.

localContext: |
  Kirkland runs its own Planning and Building Department, so a basement
  finish is permitted by the City of Kirkland, not by King County or Seattle
  SDCI. Applications go in through MyBuildingPermit. Plan review for a
  basement finish that adds an egress bedroom typically takes 4-8 weeks;
  Kirkland also issues its own electrical permits.

  Neighbourhoods matter mostly because of drainage. Lots in Juanita, Houghton
  and South Kirkland (98033 and 98034) slope toward Lake Washington, and homes
  near Forbes Creek and Juanita Creek see more groundwater after a wet
  autumn. On those lots a sump crock with a battery-backup pump is cheaper to
  rough in during the first phase than to retrofit after the drywall is up,
  and it has to be inspected before it is buried.

commonProblems:
  - title: "Seepage through block and poured concrete walls"
    description: |
      Most of Kirkland's rain falls between October and April, and it keeps
      the soil against the foundation wet for months. Block walls wick water
      and poured walls leak at cracks and cold joints. Framing directly
      against a wall like that is how finished basements fail in the second
      winter. The fix comes first: a perimeter drain and sump where the water
      is active, then a vapor-control layer, then studs, and only after the
      drainage rough-in has passed inspection.
  - title: "Bedroom windows that are not legal egress"
    description: |
      A basement bedroom needs an emergency escape opening under the
      International Residential Code: for a below-grade opening, at least
      5 sq ft of net clear opening, 24 inches clear height, 20 inches clear
      width, and a sill no higher than 44 inches above the floor, plus a
      window well you can climb out of. Original basement windows rarely
      qualify. Enlarging the opening, forming a drained well and setting the
      new unit is its own permit item and is inspected before framing closes
      it in.
  - title: "Ducts and drain lines that eat the headroom"
    description: |
      An older basement often has a low rough ceiling with an HVAC trunk down
      the middle and a drain from the upstairs bathroom crossing it. Add a
      subfloor over the slab and the finished height can drop below what is
      comfortable. Moving duct runs to the perimeter, or heating the new space
      with a ductless mini-split, usually wins back several inches. That
      decision is made before layout is locked, because it changes where
      walls, soffits and the bathroom can go.
  - title: "Mechanical equipment that has to stay reachable"
    description: |
      Water heaters, furnaces, laundry and the electrical panel all stay in
      the basement after it is finished, and each keeps its own clearances:
      36 inches of clear working space in front of the panel, combustion air
      and clearance to combustibles for a gas furnace, and access for service.
      These dimensions are set before the floor plan, not worked around after.

faq:
  - q: "How much does a basement remodel cost in Kirkland?"
    a: |
      For 600-900 sq ft with an egress bedroom, a bathroom, mechanical
      rerouting, framing, drywall and finishes, budget roughly $50K-$95K. The
      spread comes from water control, whether the egress window needs a new
      opening, how much ductwork and plumbing has to move, and the finish
      level. The exact number follows a site visit; the estimate is free.
  - q: "How long does a Kirkland basement finish take?"
    a: |
      City of Kirkland plan review usually takes 4-8 weeks, and construction
      after the permit is issued runs about 4-6 weeks for a typical scope.
      The completion date is written into the contract, and TopVolk pays
      $100 for every day past the agreed deadline.
  - q: "Do I need a permit to finish my basement in Kirkland?"
    a: |
      Yes, for a finished living space, a new bedroom, a bathroom or new
      electrical circuits. Permits are issued by the City of Kirkland through
      MyBuildingPermit, and the rough-in inspections (drainage, framing,
      electrical, plumbing) have to pass before walls are closed. TopVolk
      handles the application and schedules the inspections.
  - q: "Who do I talk to when I call?"
    a: |
      Call (206) 591-1096 and you reach Vladislav Volkov, the owner, who
      does the estimate himself. On-site consultations in Kirkland are
      usually available within a few business days.
