title: "Kirkland Basement Finishing — Moisture-First, Then Livable"

intro: |
  Juanita and Houghton are packed with 1970s split-levels on lots that drain toward Lake Washington — and
  their basements reflect it. Last spring I walked one in 98033 where a Bosch heat pump water heater sat
  against a concrete block wall with efflorescence running two feet up from the floor. The square footage
  was already there. Getting it livable meant solving the water problem before a single stud went up. That
  sequence — moisture control, then framing, then finishes — is what separates a basement that stays dry
  from one that fails a year after move-in.

  The homeowner had already gotten two quotes. Both started with floor plan layout. Neither one mentioned
  the wall condition.

localContext: |
  Kirkland's residential stock splits cleanly between eras. Houghton and South Kirkland (98033) are mostly
  1960s–1985 poured concrete foundations with 7-foot rough ceilings and original galvanized drainage that's
  been patched over the decades. Juanita (98034) trends slightly newer but has plenty of concrete block
  walls that wick moisture aggressively after a wet October. Bridle Trails homes from the early 1990s have
  better ceiling clearance but tighter lot coverage for any exterior work.

  Kirkland runs its own Building Department — plan review for basement finish with a new egress bedroom
  typically takes 4–8 weeks. Electrical permits often come back faster. Homes near Forbes Creek and Juanita
  Creek tend to have the most active drainage problems; on those lots I always recommend roughing in a sump
  crock with a battery backup float during initial excavation rather than retrofitting six months later.
  That's a $600 decision at rough-in that can prevent a $15,000 remediation call after the first wet
  November. The permit sequence matters here — rough-in inspection before that sump is buried.

commonProblems:
  - title: "Hydrostatic Seepage Through Cracked Block and Poured Walls"
    description: |
      Kirkland averages over 37 inches of rain annually, most of it falling October through April in a
      sustained low-grade drench. Concrete block walls in Juanita develop lateral cracks; poured walls
      in Houghton split at cold joints. Either way, hydrostatic pressure pushes moisture through. A
      perimeter drain channel tied to a sump pump with battery backup handles the active water — that
      rough-in is always the first scope item, long before blocking or vapor barrier installation begins.
      Framing against an untreated wet wall is how basements fail in year two. The vapor barrier goes
      in after the drainage rough-in is inspected, not before.
  - title: "Egress Windows That Don't Meet IRC for Bedroom Use"
    description: |
      IRC requires 5.7 square feet of net clear opening for a basement bedroom egress window. Most
      original 1970s Kirkland windows are 14 inches wide — not remotely code-compliant. Cutting the
      opening larger, forming a window well with a perimeter drain, and installing a Milgard or Pella
      egress unit correctly requires a separate permit line item and a rough-in inspection before framing
      closes the opening in. Miss that inspection sequence and the AHJ can require demo.
  - title: "Duct Runs and Plumbing Drops That Kill Finished Headroom"
    description: |
      A 6'10" rough ceiling disappears fast once a 10-inch HVAC trunk runs down the center joist bay
      and a drain line from the upstairs bath drops through. Add DriCore subfloor panels on the slab
      and you're looking at 6'1" finished in the main zone. That's not livable for most people.

      Rerouting ductwork to the perimeter — or zoning that space to a Mitsubishi mini-split — typically
      recovers 6–8 inches of clearance. On a recent Bridle Trails project, rerouting two runs and swapping
      an inline fan for a high-static Fantech unit added $4,200 to scope but took finished ceiling height
      from 6'2" to 6'10". The homeowner made that call before framing started, not after drywall was hung.
      MEP coordination before layout is locked — that's the whole job on a tight-ceiling basement.

faq:
  - q: "How fast can you get to Kirkland for Basement Finishing?"
    a: |
      Kirkland is a regular stop — 98033 and 98034 are King County bread and butter. On-site consultations
      are available within 3–5 business days. Call (206) 591-1096 and you get Vladislav directly, not a
      sales rep filling out a lead form.
  - q: "Do you work around existing mechanical equipment in the basement — water heaters, HVAC units, laundry?"
    a: |
      Constantly. Bosch heat pump water heaters, LG washer-dryer pairs, forced-air furnaces — they all
      need to stay accessible and code-compliant after framing closes in. We map every piece of equipment
      before layout starts and build access panels, clearance zones, and MEP coordination into the scope.
      No surprises at final inspection.

      Kirkland's Building Department is specific about combustion air requirements and electrical panel
      clearances. A gas furnace needs clearance from combustibles based on BTU output — that affects
      framing layout before a single stud goes up. Electrical panels in finished basements require 36
      inches of clear working space minimum. These dimensions drive the floor plan. Drywall comes last.
  - q: "What does a Kirkland basement finish actually cost, and how long does the project run?"
    a: |
      For 600–900 sq ft with egress, a bathroom rough-in, MEP coordination, framing, drywall, and
      finishes — budget $50K–$95K depending on spec level. Kirkland Building permit review: 4–8 weeks.
      Active construction after permits clear: 4–6 weeks. Deadline penalties are written into the
      contract. TopVolk is WA Licensed Contractor — 100+ projects completed since 2023.