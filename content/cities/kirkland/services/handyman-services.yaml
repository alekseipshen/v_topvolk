title: "Kirkland Handyman Services — Punch Lists, No Callbacks"

intro: |
  Juanita Beach draws people in on summer days, but the homes behind it in 98034
  have their own quiet maintenance rhythm — worn weatherstripping on lake-facing
  patio doors, a Moen bathroom faucet dripping since before the last refinance,
  a Nest thermostat half-installed by the previous owner who didn't know about
  the missing C-wire. Bridle Trails homeowners keep the same notepad. Small
  repairs, no single trade covers all of them, and the list grows.

  The plumber won't touch the doorbell. The electrician won't re-hang a sagging
  slider. Kirkland's punch lists stack up fast because most repairs don't fit
  a single licensed trade's scope — and calling three contractors for a
  half-day's work doesn't make sense.

localContext: |
  The 98033 zip covers downtown Kirkland north through Norkirk and the older
  streets around Market Street — a lot of 1960s and 1970s ranchers with original
  interior doors, galvanized-to-copper plumbing transitions, and orange-peel
  drywall texture that doesn't match modern joint compound. Bridle Trails in
  98034 skews 1980s-1990s construction: builder-grade fixtures aging out, sliding
  doors sagging off their tracks, deck boards cupping after seasons of PNW rain.
  Both housing eras feed the same handyman punch list.

  Totem Lake and Kingsgate, also in 98034, have late-1990s tract homes where
  Milgard windows are finally losing their perimeter seal. Cedar trim on
  north-facing walls shows moss and checking after 25 wet winters — that's not
  a roofer call. It's a caulk gun, a wire brush, and a coat of primer on a
  Tuesday morning.

  Kirkland runs its own permit center separate from King County DPER. Handyman
  scope stays well below the permit threshold. Worth knowing where that line is.

commonProblems:
  - title: "Drywall Patches That Match the Existing Texture"
    description: "Kirkland's 1970s and 1980s homes have orange peel and knockdown
      texture throughout — and matching it after a patch is where most painters
      quit. A doorknob impact or cable-TV hole shows clearly in raking light.
      Proper repair means two to three passes of joint compound, feathered edges,
      then a hopper or hand-texture pass before prime and paint. Skipping any
      step leaves a visible ghost. The match has to be tested on scrap first,
      because every hopper gun shoots differently depending on air pressure and
      tip size — and 1978 orange-peel is a specific weight, not the same as
      what comes out of a modern spray can at the hardware store."

  - title: "Weatherstripping Failure on West-Facing Doors and Sliders"
    description: "Doors facing Lake Washington take the worst of the October-through-May
      rain season. The foam-and-vinyl perimeter seal on 1980s sliding patio doors
      compresses permanently after a few wet winters — daylight shows at the
      corners and heating bills climb. Replacing the door sweep and threshold seal
      on a standard 6-foot slider is a half-day task, but the fit has to be tight
      at the sill or it leaks again at the first hard rain. Bridle Trails homes
      routinely have two or three of these sliders. One morning handles them all,
      and the difference shows on the next utility bill."

  - title: "Smart Thermostat Installs That Actually Work"
    description: "A Nest Learning Thermostat or Ecobee SmartThermostat needs a
      C-wire that most Kirkland homes built before 1990 don't have — the existing
      HVAC runs on a four-wire setup, no common wire. Installing without it causes
      random reboots or battery drain within weeks. Ring Video Doorbells hit the
      same wall when the existing doorbell transformer is under 16VA; the device
      won't hold a charge through Seattle's short winter days. The fix is a
      C-wire adapter from Nest or a 24VAC transformer swap for the Ring — an
      hour of work, not a rewire. The device runs properly after that and stays
      running."

faq:
  - q: "How fast can you get to Kirkland for Handyman Services?"
    a: "Kirkland is a regular stop — 98033 and 98034 both get covered routinely.
      I-405 northbound or NE 85th off SR-520 keeps travel predictable. Most
      Kirkland visits book within the week; shorter punch lists sometimes fit
      sooner. Call (206) 591-1096 to check the current schedule."

  - q: "Do you install Ring, Nest, and Ecobee devices in older Kirkland homes?"
    a: "Yes — video doorbells, smart thermostats, and smart locks all fall in
      handyman scope. For Nest and Ecobee, we check your existing wiring first
      and add the C-wire adapter if the HVAC system needs it. Ring doorbell
      installs include a transformer check — if the existing chime transformer
      is under 16VA, we swap it during the same visit so the doorbell actually
      charges. Call (206) 591-1096 to describe your setup before booking."

  - q: "What does a handyman visit in Kirkland typically cost?"
    a: "Half-day labor runs $300-$500. A full punch list — drywall patches,
      weatherstripping, fixture swaps, caulk refresh — lands around $600-$900
      depending on materials. Vladislav (owner, WA Licensed Contractor, 100+
      projects since 2017) quotes line items in writing after an on-site look.
      Schedule the free walkthrough at (206) 591-1096."