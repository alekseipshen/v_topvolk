title: "Kirkland Plumbing — Repipe, Tankless & Drain Work Done Right"

intro: |
  The hillside subdivisions in Rose Hill filled in between 1986 and 1994 — polybutylene
  supply lines throughout, gray fittings now 30-plus years old and failing at the
  connections. Two miles west, Houghton's mid-century homes run original galvanized
  supply lines that choke flow to a trickle, and the crawlspaces under them collect
  moisture every October through May. TopVolk handles both: repiping in PEX-A or copper,
  tankless conversions with proper gas line sizing, and permits pulled through Kirkland's
  own permit center. Every plumbing job — repipe, tankless swap, or drain replacement —
  gets a line-item quote and a contract with deadline penalties written in.
  Call (206) 591-1096.

localContext: |
  The 98033 zip covers Houghton, downtown Kirkland, and the Lake Washington waterfront —
  a run of homes built 1955 to 1975, many still on original galvanized supply lines. North
  Kirkland's 98034 zip takes in Rose Hill and Bridle Trails, where late-1980s builder-grade
  construction means polybutylene pipe alongside original Moen and Kohler fixtures past
  their service window. Juanita, in the northeast corner of 98034, mixes older ranchers
  with 2000s infill — plumbing conditions vary lot to lot out there. Different eras,
  different failure modes — both require permits through Kirkland's permit center and a
  WA Licensed Contractor to pull them correctly. Kirkland processes plumbing permits
  in-house; typical plan review for a repipe runs 1-2 weeks, faster than Seattle SDCI's
  4-12 week window on comparable work.

commonProblems:
  - title: "Polybutylene Supply Lines Failing in Rose Hill and Bridle Trails"
    description: |
      Gray poly pipe — standard in tract construction from roughly 1982 to 1995 — degrades
      from chlorine in municipal water. The plastic fittings fail first, usually at the
      manifold connections behind walls. A full repipe to PEX-A using an Uponor manifold
      typically runs 3-4 days and requires a permit through Kirkland's permit center before
      any wall work begins. After rough-in, a plumbing inspection confirms the new lines
      before walls close — skipping that step means tearing into finished drywall later.
      Vladislav walks the house before quoting, traces the existing supply runs, and confirms
      the manifold location before scheduling. No surprises mid-job.

  - title: "Galvanized Supply Lines Throttling Pressure in Houghton-Area Homes"
    description: |
      Galvanized steel corrodes from the inside out. A 1963 ranch on the Houghton waterfront
      often has supply lines internally scaled to near quarter-inch bore where the pipe label
      says three-quarter. Repiping to copper or PEX-A restores full flow — add a pressure
      regulator if city water exceeds 80 psi, which is common on the lower-elevation lots
      near the lake. Crawlspace plumbing in these homes also tends to show mineral buildup
      at the shutoff valves; those get replaced during the repipe, not patched. The moisture
      that accumulates under Houghton crawlspaces from October through May accelerates
      corrosion — a vapor barrier is worth adding if it's not already there.

  - title: "Tankless Water Heater Conversion Requiring Gas Line Upsize"
    description: |
      Switching from a 40-gallon tank to a Rinnai RU199iN or Navien NPE-240A demands a
      three-quarter-inch gas line where most Kirkland homes have half-inch. A high-output
      tankless burner pulls 199,000 BTU — the existing line simply cannot keep up. That
      means tracing the gas run back to the meter, upsizing the line, and scheduling a
      Puget Sound Energy inspection before final permit sign-off. Condensate drainage for
      the NPE-240A also needs a proper drain stub — tankless plumbing installs that skip
      that step fail final inspection in Kirkland.

faq:
  - q: "How fast can you get to Kirkland for plumbing work?"
    a: |
      Kirkland is a regular stop — Rose Hill, Juanita, Houghton, and the downtown core are
      all within 20-30 minutes depending on 405 traffic. Call (206) 591-1096 to schedule a
      site visit. Same-week consultation slots are usually open.

  - q: "Do you work with Rinnai and Navien tankless water heater systems?"
    a: |
      Both are common in Kirkland remodels. The Rinnai RU and RL series and the Navien NPE
      are what we typically spec and install. Bosch and Bradford White units handled as well
      when replacing existing equipment. Gas line sizing and seismic strapping are included
      in every tankless install — WA code requires it.

  - q: "What does a full repipe cost in Kirkland, and what's the timeline?"
    a: |
      A full PEX-A or copper repipe in a 2,000 sq ft Kirkland home runs 3-5 days of labor
      plus permit review time. Vladislav walks the house with you first and delivers a
      line-item quote — no vague ranges, and deadline penalties are written into the contract.
      100-plus projects completed since 2023. Call (206) 591-1096 to set up a site visit.

  - q: "Do you handle drain work and sewer line issues in Kirkland?"
    a: |
      Yes — ABS and cast-iron drain replacement, P-trap reroutes for kitchen remodels, and
      main line cleanouts. Older Houghton homes with cast-iron drains sometimes need full
      section replacements; 98033 lots close to the lake can have root intrusion in older
      clay sewer laterals. A plumbing camera inspection before any drain work confirms
      what's actually there. For larger plumbing scopes tied to a kitchen or bathroom
      remodel, Vladislav coordinates the plumbing permit alongside finish permits — one
      contractor, one point of contact, 100+ projects completed since 2023.