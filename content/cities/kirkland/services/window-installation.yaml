title: "Kirkland Window Installation — Glazing for Lake Washington Homes"

intro: |
  Juanita Beach gets the headlines, but one block inland in 98033 — the split-levels and
  low-pitched ranchers built when Kirkland was still mostly unincorporated King County — you
  find aluminum single-pane sliders that are pushing 50 years old. Cold air bleeds through
  the frames all winter. Milgard Tuscany vinyl or Pella 250-series fiberglass both hit the
  Seattle Energy Code's U-0.27 threshold that those originals never came close to. The math
  on heating bills changes fast when you pull the old units.

localContext: |
  The 98033 and 98034 zip codes split into two distinct eras. Houghton and Rose Hill carry a
  lot of 1965-1978 construction — post-and-pier foundations, original galvanized supply lines
  in some cases, and aluminum sliding windows that were code-compliant then. Bridle Trails and
  the NE 116th corridor trend newer: 1990s-2000s builder track where vinyl double-pane IGUs
  are now showing seal failures, fogging between panes, and frames that have absorbed enough
  PNW moisture to go out of square. Different problems, different fix. Both show up regularly
  on projects we complete across the Kirkland area.

commonProblems:
  - title: "Fogged IGUs in 1990s Builder-Grade Units — Frame Still Serviceable or Not?"
    description: |
      The insulated glass unit in a 1990s double-pane window uses a metal or foam spacer bar
      packed with desiccant to absorb moisture inside the sealed cavity. After 25-30 years the
      desiccant saturates, the seal fails, and condensation forms between the panes. Milgard
      and Pella both offer direct-replacement sash options for fogged glass — but only if the
      vinyl frame itself is still plumb and square. Bridle Trails homes that had water intrusion
      near the sill plate often have frames that have racked slightly, and a sash swap won't
      fix that. Full-frame replacement runs more money upfront but it's the correct repair.
  - title: "Egress Windows in Kirkland's Finished Daylight Basements"
    description: |
      Split-levels in Rose Hill and Norkirk often have finished lower levels with bedrooms that
      were added without permits. IRC requires a minimum 44-square-inch net clear opening and a
      sill height no higher than 44 inches off the finish floor for egress compliance. Cutting a
      new opening through a concrete or CMU foundation wall means installing a lintel — typically
      an LVL beam across the rough opening to carry the load above — plus a window well and drain.
      That scope triggers a City of Kirkland building permit and a rough-in inspection before you
      close the wall. TopVolk handles the permit submittal. We've completed 100+ projects since
      2017, including egress cuts that started from scratch in unfinished masonry.
  - title: "Road Noise from I-405 Through Standard Double-Pane Glazing"
    description: |
      Homes on the Rose Hill ridge and along the NE 85th corridor sit close enough to I-405 that
      truck traffic is audible at 11pm through standard double-pane glass (STC 28-31 on most
      builder units). Laminated acoustic glass — Milgard's SoundProof series or Marvin Signature
      Ultimate with a laminated inner pane — pushes STC ratings to 38-42. That's a real,
      measurable reduction. You can also achieve similar results with a secondary interior storm
      panel if full replacement isn't in budget. We'll measure your existing frames and tell you
      which option actually makes sense for your opening sizes.

faq:
  - q: "How fast can you get to Kirkland for Window Installation?"
    a: |
      Kirkland sits squarely in our King County service area. From our usual staging point,
      98033 and 98034 are a 30-45 minute drive — longer if I-405 is doing its thing between
      Renton and Bellevue. Call (206) 591-1096 to schedule a free on-site consultation.
      Vladislav comes out personally, measures every opening, and delivers a line-item written
      quote — not a vague range.
  - q: "Do you install Milgard, Pella, and Marvin windows? What about matching Craftsman grilles?"
    a: |
      All three. Milgard Tuscany and Ultra series handle most vinyl and fiberglass budgets.
      Pella 250 and 350 work well for straightforward replacements. Marvin Elevate and
      Signature are what we specify for the older Houghton Craftsman homes where matching
      divided-light grille patterns matters for the character of the house. Simulated
      divided-light (SDL) with aluminum spacer bars between the panes is the standard approach
      — it holds up far better in PNW rain than exterior snap-in grilles.
  - q: "What does the permit process look like for window replacement in Kirkland?"
    a: |
      Straight like-for-like swaps in existing openings generally don't require a permit in
      Kirkland — you're not changing the structural opening. New openings, enlarged openings,
      or egress installs go through the City of Kirkland's permit center (not Seattle SDCI or
      King County DPER). Plan review for a basic egress cut typically runs 3-6 weeks. TopVolk
      is a WA Licensed Contractor. We handle permit submittals as part of the project scope,
      and our contracts include written deadline penalties — if we miss the agreed completion
      date, we pay. Call (206) 591-1096 to walk through your scope before anything is committed.