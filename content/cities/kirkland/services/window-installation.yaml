title: "Kirkland Window Installation — Lake Views, No Drafts"

intro: |
  Juanita's 1960s split-levels and the craftsman renovations clustered along Lake Washington Boulevard in 98033 share a common problem: windows that were never spec'd for PNW moisture loads. Condensation between panes, sill framing that's gone soft, aluminum frames conducting cold straight into the room every November. TopVolk Construction — WA Licensed Contractor, 100+ projects completed since 2023 — has replaced windows across Kirkland, the Bridle Trails corridor, and downtown lakefront homes. Owner Vladislav Volkov handles every estimate himself.

  Kirkland gets around 37 inches of rain a year. Most of it hits November through March, and it doesn't stop.

localContext: |
  The 98034 zip — Kingsgate, Totem Lake, north Juanita — runs heavy on 1970s and early 1980s tract construction: aluminum-frame single-pane or early double-pane units that have long since lost their seal. In 98033, mid-century ramblers sit shoulder-to-shoulder with newer lakefront builds. Older homes need flashing rebuilt from scratch during a window swap. Newer construction generally needs a unit upgrade to hit current Seattle Energy Code minimums for U-factor and solar heat gain coefficient.

  Bridle Trails is mostly 1980s and early 1990s builder-grade — casements with vinyl frames that have gone brittle from UV and temperature cycling. Replacement there usually means a full rough-opening inspection before new units go in, because the original framing used non-pressure-treated lumber at the sill plate in ground-contact zones. That's a code issue as much as a weathering problem. The foothills behind Kirkland also see harder freeze-thaw cycles than the lakefront — North Rose Hill and Kingsgate get ice in January that the waterfront neighborhoods miss.

commonProblems:
  - title: "Failed IGU seals on 1970s double-pane units in Kingsgate and Totem Lake"
    description: "The insulated glass units (IGUs) in homes from that era used desiccant spacer bars that degrade after 25-30 years. Fogging between panes is the tell — the unit can't be repaired, only replaced. Milgard's Tuscany and Ultra series drop into most existing rough openings without requiring a full frame-out, which keeps the scope manageable on a room-by-room basis. A single failed seal doesn't mean every window goes at once. We assess each opening individually and can phase the work across a budget cycle if that's what the project requires."
  - title: "Rotted sill framing behind north-facing windows"
    description: "North-facing walls in Kirkland's wooded neighborhoods — Bridle Trails, parts of Juanita — stay wet from October through April. Original installations without proper flashing or pressure-treated lumber at the sill plate rot from the inside before you can see it. We sister in new PT sill material and run a waterproof membrane (Schluter Kerdi strip or RedGard) before the new window sets. Skipping that step and dropping a new unit into compromised framing is exactly how callbacks happen two winters later. The new installation is only as good as what it's anchored to."
  - title: "Undersized egress windows in below-grade bedrooms"
    description: "Plenty of 98034 split-levels have basement bedrooms that were never properly permitted. An egress window requires a minimum 44 square inches of net clear opening per IRC — that often means a foundation cut, a window well, and a drain tie-in. King County DPER handles the permit for unincorporated parcels; Kirkland proper goes through the city's own permit center on Market Street. Pella and Marvin both make casement units that hit egress specs without looking out of place on a rancher. Plan review for an egress cut runs 2-4 weeks — longer than a standard swap, but it's required, and the inspection record protects you at resale."

faq:
  - q: "How fast can you get to Kirkland for a window installation estimate?"
    a: "Usually 1-2 business days. From our Seattle base, 98033 and 98034 are straightforward — NE 68th St or 132nd Ave NE, no toll crossings involved. Call (206) 591-1096 to schedule with Vladislav directly. Free on-site estimate, no commissioned sales rep. You get a line-item quote on-site, not a callback with a number three days later."
  - q: "Do you install Milgard, Pella, and Marvin — or just one brand?"
    a: "All three, plus Andersen when the project calls for it. Milgard fiberglass holds up in PNW humidity without the expansion issues vinyl gets — it's the right default for most Kirkland replacements. Pella and Marvin are the right call when matching divided-light grilles on a craftsman or Tudor home in 98033. Line-item quotes on each so you can compare installed cost, not just unit price. Milgard also backs its fiberglass line with a lifetime warranty that transfers to a new owner — relevant if you're thinking about selling."
  - q: "What does the permit process look like for window replacement in Kirkland?"
    a: "Direct same-opening replacements usually go over-the-counter at the City of Kirkland permit center — same day or next day approval. Structural changes or egress cuts need full plan review: 2-4 weeks typically. Permit submittal is included in the contract scope. Deadline penalties are written in — missed schedule dates cost us, not you. Vladislav walks through the permit requirements on the first site visit so there are no surprises about timeline or city fees before work starts."