title: "Kirkland Door Installation — Flashed Right, Set Square in 98033–98034"

intro: |
  Juanita Beach sits about two miles from the 98034 split-levels that take northwest
  wind off Lake Washington every fall — and door frames in that zone are almost always
  the first thing to show it. Mid-1970s homes near Bridle Trails were built when
  weatherstripping was an afterthought and threshold sealing wasn't in the code.
  Vladislav Volkov at TopVolk Construction installs Pella and Milgard entry doors
  with proper flashing and IRC-compliant air sealing — not builder-grade spec. That
  means checking the rough opening, the king studs, and the sill condition before
  anything else gets set.

localContext: |
  Kirkland's housing breaks into three rough eras: mid-century ranchers and
  split-levels from 1965–1975 in 98034 (Totem Lake, North Rose Hill), 1980s–90s
  tract builds along the eastern corridors near Kingsgate, and newer custom
  construction around Downtown Kirkland and the waterfront in 98033. Older homes
  here regularly show door frames racked off square — King County's clay-heavy soils
  shift shallow crawlspace foundations over time. A door that drags in winter and
  swings freely in July is almost always a frame problem, not a door problem.

  The waterfront parcels near Carillon Point run into a different issue. Constant
  lake-facing wind drives moisture into door jambs faster than inland sites, and
  standard steel thresholds corrode well ahead of schedule in that zone. City of
  Kirkland has its own building department — permit applications go there directly,
  not through King County DPER, which covers unincorporated parcels out toward
  Novelty Hill. Straightforward header swaps involving an LVL beam run 2–4 weeks
  through Kirkland's plan review queue on average.

commonProblems:
  - title: "Entry Door Flashing Failure on 1970s Split-Levels Near Bridle Trails"
    description: "Original builder flashing on 1970s homes near Bridle Trails is typically
      tar-paper lapped wrong — water tracks behind the casing into the rough framing
      before anyone notices. Replacing the door unit alone won't solve it. Proper
      installation means inspecting the king stud and jack stud assembly, probing
      the trimmer studs for soft spots, and installing self-adhered flashing membrane
      before setting a new Pella or Milgard unit. The membrane has to lap over the
      sill pan and run up behind the casing on both sides — that's the step most
      quick-swap installers skip, and it's where callbacks originate two winters later."

  - title: "Patio Slider Sill Rot — The Part Nobody Checks Until It's Too Late"
    description: "Sliding glass doors on west-facing exposures collect standing water at the
      sill track, and in older Kirkland homes that sill is often low-grade untreated
      lumber. By the time the door sticks hard, the subfloor directly below is usually
      compromised too. Upgrading to a multi-slide or French door system means replacing
      the rough sill with pressure-treated (PT) lumber before the new unit goes in.
      If the rim joist feels soft, that gets sistered before the threshold seats —
      skip that step and the new door settles out of plumb inside a season. PNW rain
      runs October through May in 98034; a sill installed without PT lumber in that
      climate has a short service life."

  - title: "Smart Lock Retrofit on Non-Standard Vintage Door Hardware"
    description: "August and Schlage Encode smart locks need a specific backset — 2-3/8\" or
      2-3/4\" — and a standard 2-1/8\" bore hole. Older homes near Downtown Kirkland
      in 98033 often have mortise-style hardware that won't accept a direct deadbolt
      swap. The fix is reaming the bore, shimming the strike plate, or replacing the
      door slab entirely if the door itself has shifted beyond adjustment. On a warped
      slab, a reamed bore doesn't hold alignment — the latch binds against the strike
      inside of six months. Full slab replacement with a pre-bored unit is usually
      the cleaner call, and it gives you a chance to upgrade the weatherstripping
      at the same time."

