  - q: "Do you install Pella and Milgard doors, or do I need to source them myself?"
    a: "Both Pella and Milgard entry and patio lines are in regular rotation at TopVolk,
      plus Marvin for premium custom work. You can source the unit or we handle
      procurement — either way, installation includes proper flashing, rough-in
      inspection prep, and a blue tape walkthrough at completion. Lead times on
      custom Milgard and Pella units currently run 3–6 weeks, so locking in the
      order early matters if you have a hard project deadline. Deadline commitments
      are written into the contract with penalties if we miss them — Vladislav
      carries that risk, not you."

  - q: "Does door installation in Kirkland require a building permit?"
    a: "Straight replacement of a same-size unit typically doesn't need a permit through
      Kirkland's building department. New openings, structural header changes involving
      an LVL beam or PSL post, and attached garage conversions do. TopVolk handles
      permit applications when required — City of Kirkland plan review runs 2–4 weeks
      on straightforward door projects. Deadline commitments are written into the
      contract, with penalties if we miss them. If scope expands mid-project — say,
      rot in the trimmer stud extends into the floor system — we document that in
      writing before adding work, not after."