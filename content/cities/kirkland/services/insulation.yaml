  - q: "Do you handle PSE rebate documentation for insulation upgrades?"
    a: |
      Kirkland sits in PSE's service territory for both gas and electric. TopVolk documents pre- and post-installation R-values, photographs the scope, and provides the contractor paperwork needed to file a PSE rebate claim. Attic and crawlspace upgrades can each qualify separately, so combining scopes on one project often makes financial sense. Current PSE rebate programs also stack with federal 25C tax credits — worth confirming the amounts at the time of your consultation since PSE adjusts rebate tiers periodically.

