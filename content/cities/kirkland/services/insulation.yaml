title: "Kirkland Insulation — R-49 Attic Upgrades & Crawl Space Work"

intro: |
  Juanita and Rose Hill homes from the late 1960s through mid-70s almost always have the same attic story — compressed R-19 fiberglass batts settled over 50 years, now performing closer to R-12. Getting to R-49, the Seattle Energy Code minimum for conditioned attic space, means blown-in cellulose on top of existing material or a full tear-out. A Mitsubishi mini-split running flat-out every January isn't a heating problem. It's an attic problem.

localContext: |
  Kirkland's 98033 zip — downtown through Moss Bay and the older lakefront blocks — is mostly 1960s to early-1970s construction with original wall batts and compressed attic insulation that underperforms significantly. North Kirkland and Finn Hill (98034) trend toward 1980s ranchers where R-30 was code-acceptable at build but falls 19 points short of today's standard. Crawl spaces in both zip codes hold moisture against bare earth from October through April — vapor barrier is the baseline minimum, but full encapsulation with rigid foam on the perimeter walls is the fix that actually holds.

commonProblems:
  - title: "Attic Insulation Below R-49 in Kirkland's Mid-Century Homes"
    description: "Homes in 98033 built between 1965 and 1975 typically have original R-19 fiberglass batt — already compressed by decades of HVAC maintenance foot traffic, dropping real performance to R-12 or less. Getting to R-49 means blown-in cellulose added on top of existing material: it fills irregular joist bays without full tear-out and qualifies for PSE rebates up to $0.40 per square foot. Kirkland's permit center requires energy compliance documentation when attic insulation is part of a larger remodel scope."
  - title: "Crawl Space Moisture and Inadequate Vapor Barrier"
    description: "Kirkland's climate delivers 37 inches of rain annually, and crawl spaces under pre-1980 homes hold standing moisture against bare earth from October through April. The IRC minimum is a 6-mil poly vapor barrier — adequate for code, not adequate for Kirkland's rainfall reality. Full encapsulation means rigid foam board on the perimeter foundation walls plus closed-cell spray foam on the rim joist, converting the crawl to semi-conditioned space and stopping moisture from wicking into the floor joists above."
  - title: "Rim Joist Air Leakage in Split-Levels and 1.5-Story Bungalows"
    description: "Rim joists in Kirkland's 1970s split-levels are almost never insulated from original construction — that framing sits directly between conditioned living space and the exterior wall assembly, bleeding heat year-round. Two inches of closed-cell spray foam on the interior rim joist face seals air infiltration and adds roughly R-12 to that framing bay. Knee walls in 1.5-story homes need the same attention — blocking at the top plate matters as much as the insulation fill itself."

