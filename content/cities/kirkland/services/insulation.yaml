title: "Kirkland Insulation — R-49 Attic & Crawlspace Upgrades"

intro: |
  Attic hatches in Juanita-area homes tell a consistent story: compressed fiberglass batt settled to R-9 or R-12, no air sealing at the rim joists, and sometimes only a torn 6-mil poly between conditioned space and the crawlspace below.

  That's the whole thermal envelope on a lot of 1960s and 70s Kirkland builds.

  If you've already put in a Mitsubishi mini-split or upgraded your forced air system, running it against that thermal envelope erases a lot of that efficiency investment every month. TopVolk has handled exactly this scope on 100+ projects across Kirkland and the broader King County area since 2023. Vladislav manages each project directly — no middlemen relaying specs back and forth between you and whoever shows up on-site.

localContext: |
  Kirkland's housing stock runs from 1960s split-levels in Kingsgate and Norkirk (zip 98034) to early-2000s builds near downtown (zip 98033). Both eras carry insulation problems — pre-1990 homes predate Washington's current energy code, and newer construction used minimum-spec fiberglass batt that qualified on paper but underperforms in the field.

  Crawlspaces in lower-elevation neighborhoods near Juanita Bay hold moisture from October through late spring. Vapor barrier failures compound over time into structural concerns, not just comfort problems.

  Insulation permits run through Kirkland's own permit center — plan review on a standard scope takes 2–4 weeks.

commonProblems:
  - title: "Attic R-value well below Washington's R-49 requirement"
    description: |
      Most Kirkland homes built before 1985 came in at R-11 to R-19 — Washington's current energy code requires R-49. Blown-in cellulose is typically the right retrofit: it fills gaps around blocking, covers electrical runs, and air-seals better than new batt laid over old. CertainTeed makes solid blown-in product for this scope.

      Qualifying attic upgrades may be eligible for PSE rebates that offset $300–$600 of material costs on a typical job. That rebate documentation requires pre- and post-installation R-value measurements, which TopVolk provides as part of standard project close-out — not something you have to chase down separately.

  - title: "Crawlspace moisture and vapor barrier failure"
    description: |
      North-facing crawlspaces near Juanita Bay stay damp from October through April.

      The 6-mil poly vapor barrier most 1960s–70s builders installed wrinkles, tears at seams, and doesn't stop vapor migration from the soil. Full encapsulation — rigid foam on foundation walls plus a sealed 20-mil barrier across the floor — brings humidity to livable levels and stops mildew from migrating up through DriCore subfloor seams into the living space above. The Douglas-fir floor framing in these older Kirkland homes is durable, but sustained crawlspace humidity will eventually work against it.

  - title: "Bare rim joists bleeding heat at the perimeter"
    description: |
      Two-inch closed-cell spray foam on rim joists is the highest-ROI air sealing move on a 1960s Kirkland split-level. The rim joist runs the full perimeter where framing meets the foundation — in pre-1990 homes, it's almost always bare.

      Stuffing Owens Corning batts in without sealing the edges does nearly nothing. Spray foam bonds to both wood and concrete and eliminates convective heat loss around the entire perimeter. On a 2,000 sq ft footprint, that's 180+ linear feet of previously uninsulated framing sitting right at grade level where cold air infiltrates hardest.

