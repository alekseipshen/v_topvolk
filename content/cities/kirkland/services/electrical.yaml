title: "Kirkland Electrical — Panel Upgrades, EV Chargers & Old Wiring"

intro: |
  Google's Kirkland campus off 116th Ave NE brought a wave of tech workers
  into 1960s split-levels throughout the 98034 zip — and the electrical service
  those homes came with isn't built for today's loads. A ChargePoint EVSE on a
  50-amp circuit, a Bosch induction range, a Mitsubishi mini-split heat pump —
  that's potentially 150 amps of new demand going into a panel rated for a
  fraction of that. The wiring doesn't adjust on its own.

localContext: |
  Most of Kirkland's housing north of 85th Street — Totem Lake, Kingsgate,
  North Rose Hill — dates from the mid-1960s through the late 1980s. That's
  exactly the window for original 100-amp service panels and, in the 1965-1973
  slice, aluminum branch circuit wiring on 15- and 20-amp runs. South Kirkland
  and Houghton near Lake Washington hold some Craftsman-era homes from the
  1940s and 1950s — different vintage, different problems, but the same need for
  a hard look at the electrical before any major remodel scope opens up the walls.

commonProblems:
  - title: "100-Amp Service Panels Overwhelmed by Modern Circuits"
    description: |
      A 100-amp panel from 1967 was sized for a 30-amp dryer, an electric range,
      and incandescent lighting. Add a Tesla Wall Connector on a 60-amp dedicated
      circuit, a heat pump, and a Bosch dishwasher, and that panel is done. Upgrading
      to 200-amp service means a new meter socket installation coordinated with
      Puget Sound Energy (PSE), a permit through the City of Kirkland's building
      department, and a full breaker panel swap. Plan review in Kirkland typically
      runs one to three weeks for this scope.

  - title: "Aluminum Branch Circuit Wiring in Bridle Trails and Kingsgate Builds"
    description: |
      Homes built in Kirkland between 1965 and 1973 — much of Bridle Trails, parts
      of Kingsgate, older sections of Juanita — may have aluminum on 15- and 20-amp
      branch circuits. It's not automatically a crisis, but every outlet, switch, and
      junction box needs AlumiConn connectors or CO/ALR-rated devices to handle the
      expansion mismatch between aluminum and copper. This is permit-required work,
      and in older homes it often means opening drywall to access junction boxes
      buried during a previous renovation.

  - title: "AFCI and GFCI Gaps That Surface During Remodel Permits"
    description: |
      Washington State has adopted current NEC, which requires AFCI breakers in
      bedrooms and GFCI protection in bathrooms, kitchens, garages, and exterior
      outlets. Kirkland homes from the 1970s have none of that. The issue isn't
      visible until you pull a permit for a kitchen or bathroom remodel — then the
      AHJ requires the existing circuits to come up to code before the inspector
      signs off. We build that compliance scope into the estimate upfront so the
      number doesn't change mid-project.

