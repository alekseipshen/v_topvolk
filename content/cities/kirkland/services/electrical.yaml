      since 2017.

  - q: "What does a 100A-to-200A panel upgrade cost in Kirkland, and how long does it take?"
    a: |
      Panel upgrades in this area typically run $4,000–$7,000 depending on panel
      location, PSE coordination requirements, and whether the meter socket needs
      replacement. Timeline: Kirkland permit review is usually 1-3 weeks; the
      physical work is 1-2 days. The project timeline goes into the contract —
      if we miss it, we pay a penalty. Call (206) 591-1096 for a line-item quote,
      not a vague range.