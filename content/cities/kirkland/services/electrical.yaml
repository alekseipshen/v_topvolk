  - q: "Do you handle EV charger circuit installations in Kirkland?"
    a: |
      Yes. We run 50-amp and 60-amp dedicated circuits for Tesla Wall Connector,
      ChargePoint Home Flex, and JuiceBox units. Every install is permitted through
      the City of Kirkland's building department and inspected. We've done these
      in Juanita, Houghton, Bridle Trails, and Totem Lake — most take one day
