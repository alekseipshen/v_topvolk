title: "Kirkland Tile Installation — Waterproofed for Juanita's Rain"

intro: |
  Juanita Beach's lakefront homes and the 1970s split-levels scattered through
  North Kirkland's 98034 zip code share one problem: original tile work that was
  never built for 37 inches of annual rainfall. A Schluter Kerdi membrane wasn't
  standard practice when most of these bathrooms were tiled. Now grout lines are
  dark, shower niches are soft to the touch, and the kitchen backsplash behind
  the KitchenAid range is pulling away at the counter.

  Downtown Kirkland is a different situation. The 98033 townhomes near Carillon
  Point and the condo buildings along Market Street sit on slab foundations —
  better substrate, but still turning up lippage and grout failures from
  installers who skipped laser-level prep. Tile can look fine for 18 months
  and then start chipping at corners.

  TopVolk Construction has handled tile installs across Kirkland since 2017 —
  100+ projects completed, WA Licensed Contractor.

localContext: |
  North Kirkland's 98034 corridor — Finn Hill, Juanita, Totem Lake — runs
  heavily toward 1960s and 1970s split-levels with 3/4-inch subfloors over
  post-and-pier foundations. Those floors flex. Large-format porcelain (24x48,
  32x32) cracks at the corners on a substrate that moves, which is why a
  decoupling membrane like Schluter Ditra is non-negotiable before layout.
  Flatness tolerance for 24x48 tile follows TCNA L/720 deflection limits —
  most Kirkland split-level subfloors require sistering joists or a cement board
  overlay to get there.

  Downtown Kirkland's 98033 townhomes and newer Bridle Trails builds sit on
  slab-on-grade. Better for large format. Still need laser-leveled prep before
  any tile goes down, especially in wet areas where slope-to-drain clearances apply.

  Kirkland runs its own permit center separate from King County DPER. Cosmetic
  bathroom tile — no structural changes — clears plan review in about 2–3 weeks.
  Touch framing behind a shower niche or relocate a drain and it triggers a
  different review track with a longer cycle. Worth scoping that before demo day.

commonProblems:
  - title: "Shower Niches Framed Without Waterproofing in North Kirkland Split-Levels"
    description: "Most 1970s Kirkland bathrooms have shower niches framed with standard
      studs and drywall backer — no Schluter Kerdi membrane, no RedGard coating
      behind the tile. PNW humidity works through every grout joint year-round.
      By the time discoloration appears on the niche floor, water has already
      wicked into framing. Full demo and a proper waterproofed rebuild is the
      only lasting fix."

  - title: "Subfloor Deflection Cracking Large-Format Porcelain in Older Homes"
    description: "24x48 and 32x32 porcelain tile reads cleaner, fewer grout lines, less
      maintenance — standard in Kirkland master bath remodels now. But 98034's
      older ranchers and split-levels have subfloors that flex too much for
      large format without a decoupling membrane. Schluter Ditra or a cement
      board overlay solves deflection. Skip that step and corner cracks show up
      before the second winter. We've pulled enough cracked large-format tile
      off Finn Hill bathroom floors to say this without hedging: no membrane,
      no warranty on the install."

  - title: "Heated Floor Wiring Conflicts During Bathroom Tile Rough-In"
    description: "Warmup and Schluter Ditra-Heat systems sell well in Kirkland — heated
      tile floors make sense in this climate. The conflict appears when 98033
      homes need panel capacity added for the heating element. A 120V mat draws
      around 12 amps; a 240V circuit halves the load. Coordinating electrical
      rough-in before substrate work avoids the nightmare of cutting through
      finished tile to pull wire. Kirkland's permit center requires a separate
      electrical permit for new circuits — rough-in inspection happens before
      the mat goes down, not after it."

faq:
  - q: "How fast can you get to Kirkland for a tile installation consultation?"
    a: "Kirkland is straightforward from our usual routes — Marina Park, Juanita Beach,
      Bridle Trails are all reachable without hitting 405 at peak hours if we
      schedule mornings. Call (206) 591-1096 and you'll talk directly to Vladislav,
      not a scheduler. On-site consultations are free. Most weeks same-week
      availability is possible."

  - q: "Do you work with natural stone tile — marble and travertine — in Kirkland bathrooms?"
    a: "Yes, and sealing matters more here than anywhere. Marble and travertine are
      porous; PNW moisture conditions demand a penetrating sealer before grouting
      and annually after. Honed travertine especially needs RedGard protection in
      wet shower applications. We've tiled Bridle Trails master baths in Calacatta
      marble and Kirkland kitchen backsplashes in tumbled travertine — the material
      works, the prep just has to be right."

  - q: "What does a full bathroom tile install cost in Kirkland, and how long does it take?"
    a: "A complete master bath — floor, shower walls, niche, bench, and transitions
      to hardwood — typically lands between $9,000 and $20,000 depending on tile
      selection and how much substrate correction is needed. Timeline runs 3–5
      weeks from demo to blue tape walkthrough. Kirkland has its own permit center
      for cosmetic bathroom work; plan review is usually 2–3 weeks, no structural
      review required. Deadline penalties are written into the contract — if we
      miss the agreed completion date, we pay. Call (206) 591-1096 for a line-item
      quote from Vladislav directly."