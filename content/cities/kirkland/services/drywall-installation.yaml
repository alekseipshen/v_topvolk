title: "Kirkland Drywall Installation — Level 5 Finish & Moisture Control"

intro: |
  Juanita and Bridle Trails have had a steady run of full-gut kitchen remodels — Bosch
  dishwashers, Samsung ranges, quartz counters, new recessed lighting throughout. After
  electrical and plumbing rough-in is done, the drywall hang and finish work either makes
  or breaks the result. Level 5 finish under LED lighting in a Kirkland kitchen is not
  optional if you want walls that hold under sidewall light. Anything short of that spec,
  and every tape joint and crown mark shows through flat paint within the first year.

localContext: |
  Kirkland's 98034 zip code mixes late-1970s split-levels near Totem Lake with 1990s
  colonials along Juanita Drive — two completely different drywall situations, sometimes
  on the same block. The older homes still have spray-textured ceilings and original
  half-inch gypsum board throughout. Newer construction near Norkirk and Downtown Kirkland
  (98033) is tighter on ADU separation requirements: projects permitted under WA HB 1337
  call for 5/8-inch Type-X firecode drywall at unit separation walls, and Kirkland's
  permit center reviews that at rough-in inspection, before any finish work starts.

commonProblems:
  - title: "Popcorn Ceiling Removal and Level 5 Skim in 1970s–80s Totem Lake Homes"
    description: |
      Spray-textured ceilings were on nearly every home built through the 98034 corridor
      in the late 1970s and early 1980s. Skim-coating directly over popcorn fails —
      the texture has to come off by wet-scraping first, then the surface gets primed
      and floated back to Level 4 or Level 5 depending on the lighting plan. With
      dimmer-compatible LED recessed fixtures at a low angle, anything under Level 5
      shows tape lines, fastener dimples, and joint edges in the finished paint. That
      is especially visible in kitchens with Samsung or LG undercabinet lighting at 2700K.

  - title: "5/8-inch Type-X Firecode for Garage Walls and ADU Separation Under IRC"
    description: |
      IRC requires 5/8-inch Type-X drywall on garage ceilings and the wall shared
      between a garage and living space. Kirkland ADU projects — detached and attached
      units permitted under WA HB 1337 — trigger the same separation wall spec at the
      unit boundary. The Kirkland permit center flags this at rough-in inspection, not
      at final. Running standard half-inch here means a failed rough-in review, a
      required tear-out, and days added to the schedule before finish work can restart.
      It is a common mistake when the GC does not specify board thickness in the scope.

  - title: "Purple Board and Schluter Kerdi in Below-Grade Bathrooms and Laundry Rooms"
    description: |
      Kirkland hillside homes near Lake Washington and Juanita Bay stay damp most of
      the year — 37-plus inches of annual rain keeps moisture pressing into crawlspaces
      and basement walls from October through May. Standard half-inch gypsum in a
      below-grade bathroom or laundry room is a mold problem inside a few years.
      Georgia-Pacific DensArmor Plus or National Gypsum purple board, with Schluter
      Kerdi membrane in the shower surround, is the right spec for below-grade wet
      areas. That is not an upgrade — it is what moisture control in a Pacific
      Northwest basement actually requires.

faq:
  - q: "How fast can you get to Kirkland for a drywall project?"
    a: |
      Kirkland (98033 and 98034) is a regular part of the King County schedule —
      roughly 20-30 minutes from most active Seattle Metro jobsites depending on
      I-405 traffic. Vladislav comes out for the site visit directly, not a salesperson.
      Call (206) 591-1096 to get something on the schedule this week.

  - q: "Do you install soundproofing drywall between bedrooms or shared walls in Kirkland homes?"
    a: |
      Yes — resilient channel assemblies and QuietRock 525 are both available depending
      on budget. QuietRock gives a higher STC rating in a single-layer assembly without
      the installation precision that resilient channel demands. Every contact break in
      a resilient channel assembly kills the decoupling effect entirely. Common request
      in Kirkland townhomes and split-levels near Juanita Drive and Market Street.

  - q: "What does a drywall scope cost on a Kirkland kitchen or bathroom remodel?"
    a: |
      Quotes are line-item — hang, tape, finish coats, and finish level each priced
      separately. Level 5 runs roughly $1–$2 per square foot above standard taping.
      TopVolk is a WA Licensed Contractor with 100+ projects completed across King and
      Snohomish counties since 2023. Deadline penalties are written into the contract.
      Call (206) 591-1096 for an on-site estimate — direct quote from Vladislav,
      no sales staff involved.