title: "Kirkland Fence Installation — Cedar, Sloped Lots, and Permit Reality"

intro: |
  Hillside streets off 6th Street S and the lakefront parcels in Juanita (98033) sit on
  grades that shift post-spacing math on every single run. Cedar is still the default in
  Kirkland, but north-facing fence lines between Rose Hill and Bridle Trails collect moss
  from October through April — untreated boards gray and split within a few seasons.
  Trex composite holds through Kirkland's wet winters without annual sealing or staining,
  which is why it's showing up on more replacement projects in 98034. Pressure-treated
  lumber is a middle ground — less expensive than composite, holds up better than bare
  cedar in damp soil contact, and works well on the graded runs that are common along
  Juanita Drive NE where lots slope toward the lake.

localContext: |
  The 1970s subdivisions in Kingsgate and Totem Lake were originally built with cedar
  fencing that's now rotten at grade. Post footings from that era rarely went deeper than
  20 inches, and Kirkland's clay-heavy soil doesn't forgive that. Property lines in these
  neighborhoods often shift from where the original fence actually sits — survey
  verification is standard before any post goes in. Rose Hill and the corridors east of
  I-405 mix 1970s ranchers with newer builds on tighter lots, so setback math and fence
  height rules need confirmation before work starts. Downtown Kirkland parcels near Market
  Street add another layer — street-side frontage rules differ from rear-yard rules, and
  any fence within 10 feet of a public right-of-way typically requires a pre-application
  conversation with Kirkland's permit center before design is finalized.

commonProblems:
  - title: "Cedar Weathering on North-Facing Fence Runs in Kirkland"
    description: |
      North-facing exposures in 98033 stay damp long enough that untreated cedar develops
      moss and surface cracking within 5–7 seasons. CertainTeed vinyl panels won't rot and
      hold color without refinishing — but they can crack during hard freezes in the
      foothills east of Kirkland. Horizontal slat cedar fences, common on newer builds
      near downtown, trap moisture between boards if gap spacing runs under 1/4 inch.
      Material choice depends heavily on which direction the fence faces and how much
      seasonal shade it collects. A back fence running east-west behind a Bridle Trails
      home stays dry enough for cedar; a north-facing side fence on the same property is
      a different calculation entirely.

  - title: "Post Footings in Kirkland's Clay Soil"
    description: |
      Clay-heavy lots in Kingsgate and Totem Lake retain water for weeks after rain stops.
      Posts set at 24 inches start heaving within two or three seasons as soil swells and
      contracts. Standard depth here is 30–36 inches with a poured concrete collar.
      Simpson Strong-Tie post bases go on every structural gate post and corner anchor —
      a daily-use gate swinging on a shallow footing develops lean fast, and the repair
      cost exceeds the savings from cutting corners on depth. On sloped lots, each post
      runs a different depth to keep the top rail level or stepped — that means individual
      footings calculated per post, not a uniform depth across the run.

  - title: "Kirkland Fence Height Limits and When a Permit Is Required"
    description: |
      Residential fences in Kirkland max at 6 feet on side and rear lines, 4 feet in the
      front yard setback zone. Any fence that also functions as a retaining wall over 4
      feet tall requires a permit through Kirkland's own permit center — separate from
      King County DPER, which handles unincorporated county parcels. Plan review in
      Kirkland typically adds 4–8 weeks to the project timeline. Shared property line
      installations require written neighbor agreement before the first post goes in.
      Fences adjacent to critical areas like streams or wetland buffers — not uncommon
      near the Juanita Creek drainage — can require a separate environmental review step
      that adds time regardless of fence height. Survey confirmation, AHJ verification,
      and permit pulling are part of the job wherever required.

faq:
  - q: "How fast can you get to Kirkland for Fence Installation?"
    a: |
      98033 and 98034 are regular service stops — we come over the 520 bridge or up I-405
      depending on the project location. Call (206) 591-1096 to schedule a free on-site
      walkthrough with Vladislav directly — not a salesperson, the actual contractor.

  - q: "What fence materials do you install in Kirkland — cedar, vinyl, or composite?"
    a: |
      Cedar, pressure-treated lumber, TimberTech and Trex composite, CertainTeed vinyl,
      and ornamental iron for decorative gates. Selection depends on sun exposure, soil
      conditions, and whether the project triggers permit review. Gate hardware ranges
      from standard self-closing hinges to soft-close systems rated for heavy daily-use
      gates. For lakefront parcels in Juanita that get salt-laden air off Lake Washington,
      composite or vinyl outlasts bare cedar by years.

  - q: "What does fence installation cost in Kirkland and how long does the project take?"
    a: |
      A standard 6-foot cedar privacy fence on a flat Kirkland lot runs $40–$60 per
      linear foot installed, depending on grade changes, gate count, and material.
      Flat lots take 2–3 days. Sloped lots or permit-required retaining wall fences add
      time — plan for 4–8 weeks of Kirkland permit review before a post goes in the
      ground. Vladislav is a WA Licensed Contractor, 100+ projects completed since 2023,
      and deadline penalty is written into every contract. Call (206) 591-1096 to get a
      line-item quote, not a range pulled from a brochure.