title: "Kirkland Fence Installation — Cedar, Vinyl & Custom Gates"

intro: |
  Lots in 98033 drop toward Lake Washington at grades that shift your post layout every 15 feet. A standard 100-foot privacy fence run along a Juanita property line can carry 14 inches of elevation change — and that math gets solved before the first hole goes in, not after three panels are set wrong. Kirkland homeowners who put Sub-Zero appliances in their kitchens and Trex decking on their patios apply the same long-view thinking to fencing: materials that survive 37 inches of annual rain without a spring maintenance weekend. TopVolk Construction LLC, WA Licensed Contractor, has handled cedar, composite, and custom gate installs across Kirkland since 2017 — 100+ projects across Seattle Metro, owner-led by Vladislav Volkov.

localContext: |
  Most lots in 98034 — Bridle Trails, Totem Lake, the Juanita corridor — were platted in the 1960s and 1970s. Survey stakes from that era shift. Forty years of Douglas-fir and big-leaf maple root growth reaches exactly where post footings need to go. Bridle Trails properties run large, with established tree canopy and buried debris from original construction that shows up mid-dig. Downtown Kirkland's older blocks in 98033 are tighter — smaller lots, front-yard setbacks that leave little margin, and shared property line agreements that need to be written out before anyone swings a shovel.

commonProblems:
  - title: "Cedar weathering on Kirkland's north-facing fence runs"
    description: "North-facing panels in Bridle Trails and Juanita stay damp from October through April. Untreated cedar on those exposures shows moss, surface gray, and minor checking within 3-4 years. Pressure-treated (PT) lumber posts are non-negotiable at ground contact — standard cedar stock rots at the collar in 6-8 years in this climate. For the boards themselves, a penetrating oil finish applied before the first winter adds years. TimberTech composite pickets cut that maintenance cycle out entirely, at higher upfront material cost."
  - title: "Post depth requirements in Kirkland's waterfront-area soil"
    description: "Lower-elevation lots near the Kirkland Marina sit on ground that stays saturated six months a year. Posts set at 20 inches in that soil lean — count on it within a few seasons. Six-foot privacy fence posts catching lake-effect wind at shallow depth are a one-winter problem. Correct footing depth in this climate is 36 inches, set in QUIKRETE fast-set concrete mixed dry in the hole and sloped at the collar to drain away from the post. Shallower than that and you're resetting posts in 3-5 years."
  - title: "Permit requirements when a fence sits on a retaining wall"
    description: "Kirkland's fence height limit is 6 feet on side and rear lines, 4 feet at the front yard setback. Standard. But a fence on top of a retaining wall is measured as a combined structure — if the combined height of wall plus fence exceeds 4 feet, a building permit is required through the City of Kirkland Community Development office. That's a separate process from King County DPER. Plan review adds 3-6 weeks and may require structural drawings for any engineered wall. Soft-close gate hardware on taller entry gate structures can also trigger a secondary review."

faq:
  - q: "How fast can you get to Kirkland for Fence Installation?"
    a: "Both 98033 and 98034 are regular service areas — Vladislav is in Kirkland regularly. On-site consultation is typically available within 3-5 business days. Call (206) 591-1096 to set it up. Free visit, no salesperson involved. Deadline penalties for missed start dates are written into every TopVolk contract."
  - q: "Cedar or Trex composite — which material is right for a Kirkland fence?"
    a: "Cedar runs $30-55 per linear foot installed with PT posts. Trex composite is $55-85 but maintenance-free for 25-30 years in PNW conditions. Kirkland homeowners who've already made premium long-haul calls — composite decking, Sub-Zero refrigerators — usually go Trex for visible areas and cedar for back-lot utility runs. The math depends on your maintenance tolerance and how long you plan to stay in the house."
  - q: "Do I need a property survey before TopVolk installs a fence in Kirkland?"
    a: "On any shared property line — yes. The 1960s-70s lots in 98034 have shifted stakes and missing pins. A licensed surveyor in King County typically costs $600-1,200 and schedules 1-2 weeks out. Skipping that and setting posts on an assumed line is how fence-removal disputes start. Vladislav flags this at every initial walkthrough — it's not an upsell, it's just the job done right."