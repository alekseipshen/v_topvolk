title: "Kirkland Bathroom Remodel — Juanita to Bridle Trails"

intro: |
  Juanita Beach draws people to Kirkland's 98034 zip for the waterfront —
  but the ranchers and split-levels along NE 132nd Street, built in the late
  1960s, have bathrooms that haven't changed since Carter was president.
  Original cast-iron drain stacks, 4×4 ceramic tile set over greenboard
  drywall, Kohler faucets leaking through two owners. TopVolk Construction
  (WA Licensed Contractor) handles bathroom remodels across Kirkland —
  Vladislav Volkov does the estimate himself.

localContext: |
  The 98033 zip covers Downtown Kirkland and Houghton — mid-century ranchers
  built between 1955 and 1978, many with bathrooms added once without permits.
  North Kirkland (98034) mixes those same ranchers with 1980s tract builds
  near Totem Lake. Both eras share one structural problem: no waterproofing
  membrane behind the tile, inadequate exhaust ventilation, and drain
  configurations that predate modern rough-in standards by a generation.

commonProblems:
  - title: "Greenboard Behind the Tile Instead of a Real Waterproofing Membrane"
    description: "Kirkland ranchers from the 1960s-70s — especially in Houghton
      and Juanita — were tiled straight over greenboard drywall. Greenboard
      absorbs moisture; it doesn't stop it. The fix is full demo to studs,
      then Schluter Kerdi membrane or RedGard liquid membrane before any
      new tile goes down. We open this exact situation in roughly half the
      bathrooms we gut in 98033."
  - title: "Cast-Iron Drain Stacks Corroded at the Closet Flange"
    description: "Older Kirkland homes near Juanita Beach and the Houghton
      waterfront still have cast-iron drain stacks from original construction.
      The closet flange — where the toilet connects to the drain — corrodes
      through and starts leaking at the subfloor. Rerouting to ABS or PVC
      requires a rough-in inspection through Kirkland Development Services,
      not Seattle SDCI."
  - title: "Walk-In Shower Conversions Running Into Undersized Floor Framing"
    description: "Removing a tub to build a curbless shower sounds straightforward
      until you open the floor. Homes from the 1960s-70s in Bridle Trails and
      North Kirkland frequently have 2×8 joists where a curbless drain
      relocation needs 2×10 — which means sistering the existing joists and
      reframing the blocking before waterproofing begins. Moen and Hansgrohe
      thermostatic valves go in last; the structural correction goes first."

faq:
  - q: "How fast can you get to Kirkland for a bathroom remodel consultation?"
    a: "Kirkland is a regular stop — we work frequently in Juanita, Bridle
      Trails, and Houghton. Travel runs 20-35 minutes depending on 405
      traffic. Call (206) 591-1096 and Vladislav schedules the on-site
      estimate directly — no coordinator in the middle."
  - q: "Do you work with Kohler and Hansgrohe fixtures for higher-end bathroom builds?"
    a: "Yes. Kirkland clients in the upper budget range often choose Kohler
      Veil wall-hung toilets, Hansgrohe thermostatic shower systems, and
      Schluter Kerdi-Board niches and benches. We source and install — you
      deal with Vladislav, not a subcontractor you've never met."
  - q: "What's the permit timeline and total project schedule for a full bathroom remodel in Kirkland?"
    a: "Kirkland has its own permit center, separate from King County DPER.
      Plan review for a bath with layout changes runs 4-8 weeks. Construction
      after permit approval: 6-10 weeks. We handle the filing. Call
      (206) 591-1096 — estimates are free and happen fast, usually within
      the week you call."