title: "Kirkland General Contracting — Split-Level & Whole-House Remodels"

intro: |
  Juanita's split-levels and the mid-century ranchers spreading up toward Rose
  Hill were built between 1962 and 1978 — good bones, but galvanized supply
  lines, undersized panels, and kitchens that were never designed around a
  Bosch column fridge and an induction range. Getting from "dated" to "done
  right" means permits, coordinated trades, and structural work that surprises
  nobody mid-demo. That's what a general contractor is actually for.

localContext: |
  Zip code 98034 covers most of the renovation action — Juanita, Kingsgate,
  and the Rose Hill plateau, where homes from the late 1960s and early 1970s
  still run original galvanized plumbing and aluminum wiring in some cases.
  Downtown Kirkland in 98033 has older Houghton bungalows from the 1940s-50s
  with post-and-pier foundations and tighter setback constraints. Both areas
  fall under the City of Kirkland Building Department — not King County DPER —
  with their own plan review queue and inspection scheduling.

commonProblems:
  - title: "Permit Filing and Plan Review Through Kirkland's Own Building Department"
    description: "Kirkland is an incorporated city, so permits go through the City
      of Kirkland — separate from King County DPER. A whole-house remodel needs
      a building permit plus separate mechanical and electrical permits, with
      scheduled rough-in inspections before any wall closure. Plan review on
      major work typically runs 6-10 weeks. Filing wrong or incomplete sets you
      back to the back of the queue."
  - title: "Structural Surprises During Demo on 1965-1978 Split-Levels"
    description: "Rose Hill split-levels regularly hide undersized headers — a doubled
      2x6 where the span calls for an LVL beam, or a load path that wasn't
      documented on the original drawings. Catching this after demo starts is
      expensive. A proper pre-construction structural review and conservative
      contingency budget keeps the schedule intact when the walls come down."
  - title: "MEP Coordination on High-End Kitchen Remodels"
    description: "A Juanita kitchen with a Sub-Zero refrigerator, Wolf range, and
      Thermador dishwasher needs a 240V circuit for each appliance, a plumber
      to relocate island drain and supply lines, and an HVAC sub for range hood
      CFM capacity. Without a GC sequencing rough-in so trades aren't blocking
      each other, these jobs stretch by weeks and fail inspection on the first
      walk-through."

