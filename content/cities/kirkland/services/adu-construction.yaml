answer: "Kirkland allows up to two ADUs per single-family lot, each up to 1,200 sq ft, with no owner-occupancy rule. TopVolk builds detached ADUs (DADUs), garage conversions and attached units in Kirkland, including on the City's pre-approved DADU plans. Free site assessment: (206) 591-1096."

title: "Kirkland ADU and DADU Builder: From Lot Check to Move-In"

intro: |
  Kirkland is one of the easier Eastside cities to add a backyard cottage
  or an in-law unit. The City allows up to two accessory dwelling units per
  single-family home, attached, detached or one of each, each up to 1,200
  sq ft of gross floor area, and it runs its own pre-approved DADU plan
  program. What decides whether your lot can take a DADU is not the rule
  book but the site: setbacks, lot coverage, floor area ratio, slope,
  trees, and where the water and sewer lines can run.

  TopVolk takes an ADU from the first lot check through permits,
  foundation, framing, utilities and finishes under one written agreement,
  with the completion date in the contract and $100 paid for every day
  past it.

localContext: |
  ADU permits in Kirkland go through the City of Kirkland Planning and
  Building Department, applied for on MyBuildingPermit, not through King
  County or Seattle SDCI. A detached ADU has to meet the same development
  standards as a single-family house in its zone: setbacks, lot coverage,
  height and floor area ratio. One useful Kirkland rule: part of a DADU's
  floor area (500-800 sq ft, depending on the case) does not count toward
  FAR when the unit sits at least 10 feet from and behind the main house
  (KZC 115.42). That is often what makes a real one-bedroom fit on a
  standard lot.

  Waterfront lots are different. In the Residential-L shoreline environment
  only one ADU is allowed, and on Residential-L and M/H shoreline lots a
  detached unit must sit landward of the main house. Older neighbourhoods
  such as Finn Hill, Kingsgate and Totem Lake also raise a utility question
  early: some lots are served by Kirkland utilities and some by Northshore
  Utility District, and whether the ADU shares the house's water and sewer
  or gets its own connection changes both cost and rental billing.

commonProblems:
  - title: "Custom design or a Kirkland pre-approved DADU plan"
    description: |
      Kirkland keeps a gallery of detached ADU plans already reviewed by the
      City for code compliance, including units under 600 sq ft, two-bedroom
      layouts and step-free plans. You license a plan from its designer for a
      royalty of up to $1,000, adapt it to your lot and submit it; the City
      says approval can take as little as a few weeks. The site plan,
      foundation, drainage and utilities are still reviewed for your lot. A
      custom design fits odd lots and specific needs better but takes longer
      to draw and review. We price both before you choose.
  - title: "Parking with two ADUs"
    description: |
      One ADU in Kirkland needs no extra parking space. With two ADUs, one
      additional off-street space is required unless there is available
      street parking within 600 feet or the property is within half a mile
      of frequent transit. It is a small rule that can move the whole site
      plan, so we check it before design starts.
  - title: "Utilities decide the budget"
    description: |
      A backyard unit needs water, sewer, power and often a new electrical
      service or panel upgrade at the main house. Trenching distance, slope
      to the sewer, and whether a separate meter is worth it for a rental are
      the biggest swing items in a Kirkland DADU budget after the building
      itself, so they are measured on site before a price is given.

faq:
  - q: "Can I build an ADU on my Kirkland lot?"
    a: |
      Most single-family lots in Kirkland can have up to two ADUs, attached,
      detached or one of each, each up to 1,200 sq ft. There is no
      owner-occupancy requirement, so both the house and the ADU can be
      rented. Whether a detached unit fits depends on your zone's setbacks,
      lot coverage, height and FAR, plus shoreline rules on waterfront lots.
      A free site assessment answers it for your address.
  - q: "How long does a DADU take in Kirkland?"
    a: |
      Plan on about 4-7 months from design to move-in with a pre-approved
      plan, and longer with a custom design. Permit review is the part that
      varies most; construction of a standard detached unit takes roughly
      3-4 months. The completion date is written into the contract, and
      TopVolk pays $100 for every day past it.
  - q: "Do you work with Kirkland's pre-approved ADU plans?"
    a: |
      Yes. You license the plan from its designer, and we adapt it to your
      lot, prepare the site-specific documents, pull the permit and build it.
      If none of the pre-approved plans fits your lot or your budget, we
      build from a custom design instead.
  - q: "How do I get a price?"
    a: |
      Call (206) 591-1096. Vladislav Volkov, the owner, visits the lot,
      checks setbacks, access and utilities, and gives a written estimate.
      The site assessment is free.
