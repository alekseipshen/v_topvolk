title: "Kirkland ADU Construction — DADU & Basement Builds, 98033"

intro: |
  Microsoft and Google employees own a significant share of Kirkland's housing stock — 98033
  and 98034 both sit well above $1M median home values, and rental income from a detached
  backyard ADU is how many of those homeowners are adding a second revenue stream without
  selling. WA HB 1337 (2024) changed the statewide equation, allowing up to two ADUs on
  most single-family lots. TopVolk Construction, WA Licensed Contractor, has completed 100+
  projects across King County since 2017. Vladislav Volkov handles every project personally —
  you talk to the person on the tools, not a salesperson. Standard finishes here run toward
  Bosch appliances and Milgard windows, not builder-grade spec.

localContext: |
  Finn Hill, Totem Lake, and Kingsgate in 98034 carry a lot of 1970s and early 1980s
  split-levels built on crawlspace foundations. Those crawlspaces require vapor barrier
  assessment before you commit to an attached ADU layout — floor framing sometimes needs
  sister joist reinforcement to carry new load properly. Homes closer to Juanita Beach Park
  occasionally have original galvanized plumbing that needs full replacement before a second
  dwelling unit can connect cleanly to the water main. Kirkland runs its own Building
  Department, separate from King County DPER — ADU permits go through the city's online
  portal, with plan review typically running 6-10 weeks depending on structural complexity.

commonProblems:
  - title: "Kirkland Permits Go to the City, Not King County DPER"
    description: "ADU permits in Kirkland run through the City of Kirkland Building Department —
      not King County DPER, not Seattle SDCI. A standard DADU application requires a site
      plan, floor plan, elevations, and setback calculations. Projects over 500 sq ft
      typically need engineer-stamped structural drawings that include LVL beam sizing, point
      load transfers, and roof framing details. Plan review runs 6-10 weeks. Kirkland also
      maintains pre-approved ADU plan sets for standard configurations, which can compress
      review to around 4 weeks for simpler builds."
  - title: "Utility Connections on 1970s Finn Hill and Totem Lake Lots"
    description: "Older homes in 98034 weren't designed with ADU utility separation in mind —
      it simply wasn't a code consideration in 1975. Adding a DADU forces a real choice:
      shared water/sewer connection tied to the main house, or a separate lateral with its
      own meter. Each path has different cost implications under Kirkland Utilities and
      Northshore Utility District tap fee schedules. The separate lateral costs more upfront
      but simplifies billing if you plan to rent independently. A site assessment before any
      design work starts determines which is physically feasible."
  - title: "Setback, Height Limits, and FAR in Kirkland's RS Zones"
    description: "Kirkland zoning sets rear yard setbacks at 5 feet for DADUs in most RS
      zones, with a 24-foot height limit. Lot coverage — the total percentage of your lot
      occupied by all structures — directly caps how large the ADU footprint can be. Parcels
      near Rose Hill and the Bridle Trails border sometimes carry steep slope overlays or
      tree canopy retention requirements that tighten FAR limits beyond the base zone numbers.
      Pulling the parcel zoning data before any design work begins prevents costly mid-project
      corrections."

faq:
  - q: "How fast can you get to Kirkland for ADU Construction?"
    a: "Kirkland is a regular stop — 98033 and 98034 are 20-30 minutes from the primary
      service area, depending on 405 traffic. Free on-site consultations include a preliminary
      zoning check and rough lot coverage calculation. Call (206) 591-1096 to schedule; most
      openings come within a week."
  - q: "What finish specs do Kirkland ADU builds typically include?"
    a: "Most Kirkland projects land on Bosch or LG appliances, Milgard or Pella windows, and
      quartz countertops throughout kitchen and bath. HVAC is almost always a Mitsubishi
      mini-split — no ductwork needed, quiet, independently zoned from the main house.
      Large-format porcelain tile and a curbless shower are standard bathroom finishes at
      this price point."
  - q: "How long does a DADU take from permit application to move-in in Kirkland?"
    a: "Budget 4-7 months end-to-end: 6-10 weeks for Kirkland permit plan review, then
      roughly 3-4 months of construction for a standard DADU. Larger builds with full
      basement conversions run longer. Deadline penalties are written into every TopVolk
      contract — an actual financial penalty clause, not a verbal commitment. Call
      (206) 591-1096 for a project-specific timeline."