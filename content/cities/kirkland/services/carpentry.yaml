title: "Kirkland Carpentry — Custom Built-ins & Period Trim"

intro: |
  Norkirk and Houghton (98033) carry a genuine mix — 1920s Craftsman cottages
  two blocks from post-war ranchers. All within a mile of Lake Washington. That
  waterfront proximity accelerates moisture damage on north-facing cedar trim
  faster than you'd see inland near Bellevue or Redmond.

  Vladislav has built custom pantry millwork and kitchen cabinetry surrounds
  around Sub-Zero refrigerator columns in Kirkland since 2017. The clearances
  have to land exactly. A cabinet face off by half an inch means the panel-ready
  door binds — or the gap shows from across the dining room.

localContext: |
  The 98034 zip — Totem Lake, Bridle Trails, Finn Hill — skews toward 1970s
  and '80s tract construction. Finger-jointed pine casings. Hollow-core interior
  doors. Builder-grade stair assemblies that have cycled through 50 PNW winters.

  Bridle Trails has larger parcels with formal dining rooms and home offices.
  Homeowners there are adding wainscoting, window seat benches, and custom
  closet systems — finishes the original builder never included.

  Closer to downtown Kirkland and the Marina, older homes still have original
  fir trim worth restoring rather than replacing. That changes the scope
  entirely. Matching a 1920s casing profile requires milling or sourcing custom
  stock — not pulling off-the-shelf colonial casing from a lumber yard.

commonProblems:
  - title: "Cedar Fascia Rot on Lake-Facing Elevations"
    description: |
      Homes on the waterfront-adjacent blocks of Norkirk and Houghton deal with
      persistent moisture on west and north elevations. Seattle averages 37
      inches of rainfall, most of it October through May. Cedar fascia checks —
      end-grain cracking that channels water behind the paint film — within
      8-10 years without proper back-priming at installation.

      Once rot establishes, it migrates to the rim joist and blocking fast. We
      cut back to solid wood. New blocking sisters in where needed. Deteriorated
      sections get replaced with pre-primed Hardie trim board, which holds paint
      and resists moisture far better than bare cedar on a north-facing wall.

  - title: "Stair Stringer Deflection in 1970s Tract Builds"
    description: |
      The '70s and early '80s tract builds across 98034 used single-ply 2×12
      stair stringers. Fine when the house was new. Five decades of load cycling
      and seasonal wood movement cause deflection that tread screws alone won't
      fix.

      Squeaky treads signal stringer flex. Loose risers mean the original
      fastener schedule has given out. A proper rebuild uses LVL — laminated
      veneer lumber — for dimensional stability. New oak treads glue and
      face-screw from below so the finished surface stays clean. The staircase
      stops moving. That's the goal.

  - title: "Millwork Clearances Around Panel-Ready Appliances"
    description: |
      Kirkland homeowners installing Sub-Zero or Bosch panel-ready refrigerator
      columns often find the existing cabinetry doesn't frame the appliance
      correctly. Gaps at the panel edge. Filler strips mismatched to door
      reveals. Hinge arms binding because the rough opening isn't plumb.

      Getting it right requires custom face-frame surrounds with miter-joined
      casing profiles aligned to existing cabinet reveals. We pull field
      measurements before ordering any material. Rough openings in 1970s and
      '80s Kirkland kitchens are rarely square or level — assuming they are costs
      a full rebuild.

faq:
  - q: "How fast can you get to Kirkland for a carpentry consultation?"
    a: |
      Kirkland is a regular part of our schedule. 98033 and 98034 are
      straightforward off I-405 or SR-520. Street parking near Juanita Beach
      Park on Lake Washington Blvd is manageable on weekdays.

      We can typically schedule an on-site walkthrough within the week.
      Vladislav does the visit himself — no commissioned salesperson, no
      estimator relaying notes to someone else. WA Licensed Contractor, 100+
      projects completed since 2017. Call (206) 591-1096.

  - q: "Do you build millwork around Sub-Zero, Bosch, or Thermador panel-ready appliances?"
    a: |
      Yes. Sub-Zero, Bosch, and Thermador panel-ready columns each have
      different reveal tolerances and hinge swing clearances. We pull the
      appliance installation spec before cutting any face-frame material.

      An assumption on reveal width costs a full rebuild. Custom millwork around
      panel-ready refrigerators, dishwashers, and range hoods is a standard
      request in Kirkland kitchens. The fit has to be exact or it shows from
      ten feet away.

  - q: "Do carpentry projects in Kirkland require permits, and how long do they take?"
    a: |
      Structural carpentry goes through the City of Kirkland's permit center —
      separate from King County DPER, which handles unincorporated county
      parcels. Stair stringer replacement and anything touching load-bearing
      elements needs a permit. Non-structural millwork like built-ins, interior
      trim, and wainscoting typically doesn't.

      We sort out permit requirements at the consultation. No surprises
      mid-project. Built-in projects run 2-5 weeks. Stair rebuilds take 4-8
      weeks after permits issue. Missed-deadline penalties are written into
      every contract. Schedule a free on-site walkthrough at (206) 591-1096.