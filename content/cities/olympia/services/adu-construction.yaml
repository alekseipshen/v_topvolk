title: "Olympia ADU Construction — Build Rental Space on Thurston County Lots"

intro: |
  State government employment keeps Olympia's rental market unusually stable. Legislative
  staffers, agency contractors, and state workers cycle through Thurston County on short-term
  assignments, and a well-built DADU in the South Capitol or Westside neighborhood rarely sits
  vacant for long. WA HB 1337, effective 2024, now allows up to two ADUs on most single-family
  lots statewide — including the 8,000-12,000 square-foot rancher lots that dominate zip codes
  98501 and 98502. A lot of those homes went up between 1950 and 1972, sit on crawlspace
  foundations, and have rear yards with genuine DADU potential. Others — particularly older
  Craftsman-era homes near the Capitol campus — have full basements that convert to attached
  ADUs without disturbing the main structure's footprint or adding impervious surface to the
  lot. TopVolk Construction has completed 100+ projects across the Puget Sound region since
  2017. Vladislav Volkov handles every consultation personally — no sales staff involved.

localContext: |
  Olympia's housing splits cleanly by era and geography. The 98501 zip — Downtown, Eastside,
  South Capitol — carries most of the pre-1960 inventory: Craftsman bungalows with post-and-
  pier foundations, galvanized plumbing, and knob-and-tube wiring that needs addressing before
  an ADU can pull new circuits. Over in 98502 (Westside) and 98506 near Priest Point Park,
  1960s and 1970s ranchers are the dominant type — slab-on-grade or crawlspace, attached
  garages that often convert to AADUs, larger flat lots with rear alley access. Olympia
  averages close to 50 inches of rain per year — wetter than Seattle — so vapor barrier
  installation under any ADU slab or within the crawlspace is not optional. Douglas-fir
  framing is standard throughout the region, but pressure-treated lumber is required at all
  ground-contact points and anywhere within 6 inches of finished grade. Permit jurisdiction
  depends on your parcel: in-city Olympia work goes through the City of Olympia Building
  Division, while unincorporated Thurston County parcels route through Thurston County
  Resource Stewardship — two separate plan review processes with different timelines and
  checklists.

commonProblems:
  - title: "DADU vs. Attached ADU — Figuring Out Which One Actually Fits Your Lot"
    description: |
      The DADU-vs-AADU question isn't just preference — it comes down to lot coverage math,
      foundation type, and what's already on the parcel. Olympia's medium-density residential
      zones generally cap total impervious surface at 50-55% of lot area depending on zoning
      classification. On a 7,500 sq ft lot where the main house, driveway, and existing patio
      already consume 40%, a DADU footprint is limited before setback lines even enter the
      picture. Rear setbacks for DADUs in Olympia run 5 feet — tighter than the main dwelling
      minimum — and side setbacks match. Homes in 98502 with rear alley access have a real
      advantage: alley-facing DADUs sidestep parking impact questions entirely, and separate
      utility runs are shorter. South Capitol homes with existing full basements skip the
      foundation cost altogether — a basement AADU conversion avoids new impervious surface,
      which keeps the lot coverage numbers clean. Vladislav reviews all of this at the free
      on-site visit before any quote goes on paper. Call (206) 591-1096 to schedule.

  - title: "Utility Separation Costs That Catch Olympia Homeowners Off Guard"
    description: |
      Shared water and sewer connections are permitted under most Olympia ADU configurations,
      but separate utility connections give the ADU independent billing — critical for long-
      term rentals and future resale value. For detached ADUs on deep lots in 98501 and 98506,
      running a new service line from the meter to the rear structure adds $8,000-$18,000
      depending on lot depth, existing infrastructure, and whether the trench hits tree roots
      or concrete flatwork. Older homes in these zip codes frequently have galvanized supply
      lines running to the main house — combining the ADU utility run with a partial copper
      replumb makes financial sense rather than touching the line twice. The City of Olympia
      requires a separate Public Works permit for utility connections, reviewed concurrently
      with the building permit but on its own approval track. Navien tankless water heaters
      are the standard spec for new ADU builds here — compact footprint, they meet current
      WA energy code, and they eliminate the tank space problem in a 450 sq ft unit.

  - title: "Plan Review Timelines at City of Olympia Building Division and Thurston County"
    description: |
      First submittal for a new DADU through City of Olympia Building Division typically gets
      a plan review response in 6-10 weeks on a clean package — longer if the submittal has
      missing documents or the structural drawings need correction. Thurston County Resource
      Stewardship runs its own review calendar for unincorporated parcels, with a separate
      submittal checklist. Both offices require a full site plan showing setbacks and lot
      coverage calculations, structural drawings with LVL beam and PSL post specifications
      where applicable, and MEP coordination documents for electrical, plumbing, and
      mechanical. WA HB 1337 limits what local jurisdictions can mandate — no owner-occupancy
      conditions, no aesthetic design review that adds cost without a legitimate land use
      basis — but structural and life-safety requirements still apply in full. TopVolk is a
      WA Licensed Contractor and handles the complete permit application package: drawing
      coordination, submittal tracking, and response to correction notices. End-to-end from
      permit application to final inspection runs 4-7 months for a new DADU.

  - title: "What an ADU Actually Costs to Build in Olympia — and What Moves the Number"
    description: |
      A straightforward 440-500 sq ft DADU on a flat Westside lot in 98502 — slab foundation,
      LVL ridge beam, Hardie cement-board siding, Mitsubishi mini-split for heating and
      cooling, Navien tankless water heater, Bosch range and dishwasher, mid-range interior
      finishes — typically lands in the $130,000-$175,000 range all-in with permits. That
      number shifts in identifiable ways. Sloped lots need a stem wall or post-and-pier
      foundation instead of a slab, adding $12,000-$25,000. Separate utility connections on
      deep lots push costs up another $10,000-$18,000. Interior finish choices move the
      budget significantly: large-format porcelain tile and quartz countertops versus LVT and
      laminate is a $15,000-$25,000 swing on a 500 sq ft unit. Basement AADU conversions run
      cheaper — $60,000-$110,000 is realistic for a one-bedroom if the foundation is sound and
      egress window cuts are viable. TopVolk provides line-item written quotes after the site
      visit. Deadline penalty terms are written into every contract — not a verbal promise.

  - title: "Height Limits, Setbacks, and the 24-Foot Rule on Olympia's Varied Terrain"
    description: |
      Olympia's DADU height limit follows the WA HB 1337 framework: 24 feet to peak,
      measured from average grade at the structure's base. That sounds like plenty until the
      lot slopes. Parcels in 98506 near Priest Point Park and parts of the Eastside have
      meaningful grade changes — a 3-foot rear-to-front slope can reduce usable interior
      height by the same amount, compressing the loft or second sleeping area that makes a
      DADU genuinely rentable. Rear setbacks for DADUs in Olympia's RM zones run 5 feet,
      side setbacks 5 feet. Existing structures — old detached garages, sheds, covered
      patios — count toward lot coverage and sometimes need to be demolished before the
      DADU fits within the coverage cap. During the rough-in inspection and blue tape
      walkthrough phases, the city inspector confirms the structure sits within the approved
      setback envelope. Getting the site plan dimensions right at initial submittal is the
      best way to avoid an expensive mid-build stop-work situation.

faq:
  - q: "How far does TopVolk travel to Olympia for ADU projects?"
    a: |
      Olympia is roughly 60 miles south of Seattle via I-5 — about an hour drive depending
      on Tacoma traffic. TopVolk serves projects throughout the Puget Sound region, and
      Thurston County ADU work falls within the normal project range for jobs at the $100,000+
      level that most DADUs represent. Vladislav makes the site visit himself — you're talking
      to the person who will actually run the project, not a commissioned closer. Estimate-to-
      signed-contract typically takes 1-2 weeks after the site visit. Call (206) 591-1096
      to set up the free on-site consultation in 98501, 98502, 98506, or anywhere in the
      Olympia metro.

  - q: "What does it cost to build an ADU in Olympia, Washington?"
    a: |
      A detached ADU in the 440-550 sq ft range — slab foundation, Hardie siding, Mitsubishi
      mini-split, Navien tankless water heater, Bosch appliances, mid-range interior finishes
      — typically runs $130,000-$175,000 in Olympia including permits. Basement conversions
      to attached ADUs run lower: $60,000-$110,000 for a functional one-bedroom if the
      existing foundation and framing are in good shape. What moves the price most is
      foundation type, lot slope, utility separation distance, and finish selections. TopVolk
      sends a written line-item quote after the free site visit — no vague per-square-foot
      estimates. Call (206) 591-1096 to schedule.

  - q: "What is the permit process for an ADU in Olympia or unincorporated Thurston County?"
    a: |
      Parcels within Olympia city limits go through the City of Olympia Building Division —
      plan review on a first submittal typically takes 6-10 weeks for a complete package.
      Unincorporated Thurston County uses Thurston County Resource Stewardship, with its own
      checklist and reviewer queue. Both require a full site plan, structural drawings with
      beam and header specifications, and MEP coordination documents. WA HB 1337 limits local
      mandates — no owner-occupancy requirements, no design review adding unjustified cost.
      TopVolk is a WA Licensed Contractor and manages the full permit package: drawing
      coordination, submittal, and correction-notice tracking. Total timeline from application
      to final inspection is typically 4-7 months.

  - q: "Can I build two ADUs on my Olympia lot under WA HB 1337?"
    a: |
      Yes. WA HB 1337, effective 2024, allows up to two ADUs on most single-family lots
      statewide — one attached or basement-conversion AADU and one detached DADU, for example.
      The practical constraint is lot coverage and setbacks: both units need to fit within the
      zoning envelope simultaneously. Olympia's 8,000-10,000 sq ft Westside lots in 98502
      often have the room; smaller 6,000 sq ft Eastside parcels may not. Two-ADU projects
      also require separate permit applications and coordinated MEP planning. Vladislav
      reviews the site constraints and zoning math at the consultation to determine whether
      a dual-ADU configuration is actually buildable on your specific parcel — before any
      money changes hands.

  - q: "How long does an ADU project take from start to finish in Olympia?"
    a: |
      For a new DADU, count on 4-7 months total from permit submittal to certificate of
      occupancy. The permit phase alone — plan review, corrections, approval — runs 6-10
      weeks at City of Olympia Building Division. Construction on a 440-500 sq ft detached
      unit takes 10-16 weeks once permits are in hand: foundation and framing, rough-in
      inspection for electrical and plumbing, insulation and vapor barrier, drywall
      hang/tape/mud, finish work, final inspection. Basement AADU conversions are faster —
      typically 3-4 months total because the foundation and structural frame already exist.
      Olympia's rainy season, October through May, can slow exterior framing and concrete
      pours. TopVolk builds realistic schedules, and missed deadline penalties are written
      into the contract.

  - q: "Does TopVolk also build ADUs in Lacey and Tumwater?"
    a: |
      Yes — Lacey and Tumwater are neighboring cities within Thurston County and within the
      project area. Lacey operates its own building permit office, as does Tumwater — each
      has a slightly different ADU checklist, though WA HB 1337 sets the minimum baseline all
      three must follow. Lacey's proximity to Saint Martin's University and Joint Base Lewis-
      McChord keeps rental demand consistent, which makes ADU investments there straightforward
      to underwrite. Tumwater's 1950s-70s housing stock along the Deschutes River corridor has
      rear-yard space well suited for DADUs on lots that rarely exceed 40% existing coverage.
      Call (206) 591-1096 for a free on-site visit anywhere in the Olympia-Lacey-Tumwater
      metro.