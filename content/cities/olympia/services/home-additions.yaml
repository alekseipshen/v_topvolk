title: "Olympia Home Additions — ADUs and Second Stories Done Right"

intro: |
  South Capitol's tree-lined blocks of 1910s and 1920s Craftsman bungalows are some of the most
  photographed streets in Thurston County — and among the tightest to actually live in. Those
  houses averaged around 1,100 square feet, built when one bathroom and a single-car garage felt
  sufficient. Buying up in today's Olympia market around 98501 is expensive; adding square footage
  to what you already own is frequently the more practical move. Out on the Westside near Mud Bay
  and Harrison Avenue, the housing profile shifts to 1960s split-levels on 7,000–10,000 square
  foot lots — more room to expand, but the same constraint: the original footprint doesn't match
  how people actually live now. WA HB 1337, signed in 2024, changed the ADU picture statewide,
  and Olympia homeowners are moving on it fast. Any new addition here needs to handle roughly
  50 inches of annual rainfall — correct flashing at every roof tie-in, vapor barriers in the
  crawlspace, and exterior cladding like Hardie fiber-cement that won't rot in five years.
  Call (206) 591-1096 to talk through what's actually feasible on your specific lot.

localContext: |
  Zip code 98501 — downtown Olympia, South Capitol, and the Bigelow neighborhood — carries the
  oldest housing stock in the city. Post-and-pier foundations are standard on these pre-war
  Craftsmans; Douglas-fir framing, original single-pane windows, and galvanized plumbing are
  common discoveries mid-project. Any second-story addition on this housing type needs a
  structural engineer's assessment of bearing capacity before a floor plan makes sense. Over in
  98502 (West Olympia, running toward the Tumwater border), the stock is predominantly 1970s
  and 1980s slab-on-grade construction — different structural dynamics, generally more forgiving
  for single-story bump-outs. The City of Olympia processes building permits through its
  Development Services counter; plan review for a full room addition or DADU is running roughly
  6–10 weeks right now. Projects in unincorporated Thurston County around Lacey or south of
  Tumwater route through Thurston County Resource Stewardship instead. Both jurisdictions require
  stamped structural drawings for any addition over 200 square feet.

commonProblems:
  - title: "Building a DADU or AADU Under WA HB 1337 on an Olympia Lot"
    description: |
      WA HB 1337, effective 2024, established two ADUs per single-family lot as the statewide
      baseline — one DADU in the backyard, one AADU carved from the main house, both permitted
      simultaneously. Olympia lots in 98502 and 98503 commonly run 7,000–11,000 square feet,
      which is workable for a 600–800 square foot detached unit without burning through lot
      coverage limits. The City of Olympia still enforces height limits — 24 feet for a DADU —
      and standard setback rules apply: 5 feet from side and rear property lines in most SF zones,
      though HB 1337 allows 4-foot rear setbacks for ADUs in many configurations. A 600 sq ft
      DADU in Olympia runs $140,000–$185,000 all-in, including permits, utility connections, and
      finish work. Vladislav at TopVolk handles the complete permit package from site plan to
      stamped structural drawings — no subbing out the paperwork. Call (206) 591-1096 to find
      out what your lot can support under the new law.

  - title: "Second-Story Additions Over Post-and-Pier Foundations in South Capitol"
    description: |
      Adding a second story to a 1920s Craftsman bungalow in the South Capitol neighborhood is
      a structural question before it's a design question. Post-and-pier foundations typical in
      98501 weren't engineered for the vertical loads a new upper level introduces. The process
      starts with a licensed structural engineer assessing bearing capacity, checking the
      mudsill-to-cripple-wall connection, and confirming the first-floor diaphragm can handle
      lateral loads from the new framing above. Fixes usually involve adding continuous perimeter
      foundation sections, sistering the first-floor joists, and sizing LVL beam headers at the
      new stair opening. These aren't optional steps — the AHJ will require stamped structural
      drawings at plan review, and the rough-in inspection will flag any gaps. A second-story
      addition on this housing type runs $180,000–$280,000 depending on finish level, with a
      permit-to-occupancy timeline of roughly 4–6 months.

  - title: "Matching Exterior Siding and Roofline on Historic and Mid-Century Olympia Homes"
    description: |
      Tying a new addition into a 1920s Craftsman or a 1965 ranch without it looking bolted-on
      is harder than most homeowners expect. Cedar shake and original wood lap siding in South
      Capitol and Bigelow have decades of weathering behind them; new wood siding won't match
      tone or texture right away. Hardie HZ10 fiber-cement siding — primed and site-painted to
      match — is the practical answer for Olympia's climate. It holds paint longer in sustained
      wet conditions, doesn't warp through the freeze-thaw cycles that hit Thurston County's
      foothills, and comes in wood-grain profiles that read close to original from the street.
      Roofline transitions are the technically harder part: a shed dormer or gable extension
      needs to tie into existing rafters cleanly and flash correctly at every step-down. Budget
      roughly $8,000–$14,000 for the exterior envelope on a mid-size addition. CertainTeed
      architectural shingles are a common match for mid-century rooflines across the area.

  - title: "HVAC Coordination — Mini-Splits vs. Extending Existing Ductwork"
    description: |
      Most 1970s ranchers in West Olympia (98502) run forced-air systems already working at
      capacity for the original square footage. Extending ductwork into a new 400–600 sq ft
      addition requires a Manual J load calculation to determine whether the existing air handler
      can support the added zones — in most cases it can't without an equipment upgrade. The
      faster path for additions under 600 square feet is a Mitsubishi mini-split: one
      wall-mounted head, one outdoor condenser, fully independent from the existing system. A
      Mitsubishi MSZ-GL series single-zone unit handles heating and cooling for that footprint
      efficiently and skips the cost of ductwork rough-in through finished ceilings. MEP
      coordination matters — mini-splits need a dedicated 240V circuit, which the electrical sub
      needs to rough in before drywall closes. Single-zone installed runs $2,500–$4,500; a
      two-zone setup for a full DADU is typically $5,500–$9,000.

  - title: "Setback Compliance and FAR Limits in City of Olympia SF Zones"
    description: |
      Floor Area Ratio limits in Olympia's single-family zones run 0.35–0.50 depending on the
      zone — meaning a 7,000 sq ft lot maxes out around 2,450–3,500 sq ft of total covered floor
      area. Homes in the denser blocks of 98501 and 98506 are sometimes already near that ceiling,
      and a full room addition might only work as a detached DADU if the main house FAR is tight.
      Standard Olympia SF setbacks are 5 feet on the sides, 20 feet in front, and 20 feet in the
      rear for principal structures. Detached ADUs under HB 1337 can go to 4-foot rear setbacks
      in many configurations, opening up lots that otherwise look too constrained. Before any
      design work starts, TopVolk pulls the actual parcel data and zoning overlay for your address
      — there's no point drawing plans around numbers that won't clear permit review. Call
      (206) 591-1096 to get a real zoning read on your property before spending money on
      drawings.

faq:
