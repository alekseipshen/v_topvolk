  - q: "What does a home addition in Olympia cost?"
    a: |
      Standard room additions in Olympia run roughly $150–$250 per square foot; second-story
      additions typically land at $180–$300 per square foot due to the structural scope involved.
      A full DADU under WA HB 1337 generally comes in at $140,000–$190,000 all-in, including
      permits, utility connection, and finish work. What moves the number: foundation type (a
      post-and-pier upgrade costs more than a slab pour), finish level (Bosch appliances and
      quartz countertops vs. builder-grade fixtures), and mechanical scope (new Mitsubishi
      mini-split vs. a ductwork extension). Permit fees through Olympia Development Services
      typically add $2,500–$6,000 on top. TopVolk provides line-item quotes — not estimates
      that shift later. Schedule a free on-site meeting to get exact numbers for your lot.

  - q: "What permits are required for a home addition or ADU in Olympia?"
    a: |
      The City of Olympia requires a building permit for any addition over 200 square feet, plus
      separate mechanical, electrical, and plumbing permits where those trades are involved.
      Applications go through Olympia's Development Services portal or counter; plan review for a
      full addition is currently running 6–10 weeks. ADU projects under WA HB 1337 follow the
      same general track. For projects in unincorporated Thurston County — areas around Lacey,
      Yelm, or south of Tumwater — permits route through Thurston County Resource Stewardship
      instead of the city. TopVolk prepares the complete permit package: site plan, architectural
      drawings, and stamped structural calculations from a licensed engineer. You don't chase
      paperwork. Call (206) 591-1096 to start the process.

  - q: "Can you add a second story to an existing Olympia home?"
    a: |
      Yes — but it starts with a structural assessment, not a floor plan. Post-and-pier
      foundations common in older South Capitol and Bigelow homes (98501) weren't designed for
      the vertical loads a new upper level adds. A licensed structural engineer evaluates bearing
      capacity, checks the mudsill and cripple wall connections, and determines whether the
      first-floor diaphragm is adequate for lateral loads before framing design begins. Typical
      scope includes perimeter foundation upgrades, LVL beam substitutions at major headers, and
      sistering the existing floor joists throughout. From permit submission through rough-in
      inspection, a second-story addition runs 4–6 months total. TopVolk coordinates the
      structural engineer directly and manages the full permit package. Call (206) 591-1096 for
      a site evaluation.

  - q: "What warranty covers an addition project built by TopVolk?"
    a: |
      TopVolk backs workmanship with a two-year written warranty post-completion; structural work
      carries WA state statutory warranty protections beyond that. Materials carry their own
      manufacturer coverage — Hardie siding comes with a 30-year limited product warranty, for
      instance. The durability story is really in execution: correct flashing at every roof and
      wall transition, proper vapor barrier in the crawlspace, and exterior cladding specified
      for Olympia's 50-inch annual rainfall. Every project closes with a blue tape walkthrough —
      Vladislav does it himself — and a punch list that gets cleared before the final inspection
      sign-off. Deadline penalties are also written into the contract, not just promised verbally.

  - q: "Do you work in Lacey, Tumwater, and other Thurston County cities?"
    a: |
      Yes. TopVolk serves Thurston County including Lacey (98503, 98513), Tumwater, and
      unincorporated areas along the I-5 corridor south of Olympia. Permits in Lacey go through
      the City of Lacey permit counter; projects in unincorporated areas near the Deschutes River
      corridor or east of Lacey route through Thurston County Resource Stewardship — same general
      timeline as Olympia, roughly 6–10 weeks for plan review on a full addition. The focus is
      on larger addition and ADU projects in the $80,000–$200,000+ range, not small repairs.
      Scheduling for South Sound consultations typically runs 2–3 weeks out depending on current
