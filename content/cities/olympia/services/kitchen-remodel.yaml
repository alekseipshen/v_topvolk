title: "Olympia Kitchen Remodel — Opening Up Capitol-Area Homes"

intro: |
  The state employee housing stock that filled in around the Capitol neighborhood and South Capitol district through the 1960s and 1970s came with one consistent feature: galley kitchens with walls on three sides and almost no natural light. Homes in the 98501 and 98502 zip codes — from the older Craftsman bungalows near Percival Landing to the mid-century ranchers off Harrison Avenue — share the same layout problems we fix every year. Vladislav has pulled permits on kitchen projects all across Thurston County, from the Eastside neighborhoods near Capital High School to the Westside subdivisions backing up to Eld Inlet. A Bosch 800 Series dishwasher and KitchenAid range aren't hard to fit in — the challenge is getting the space to work around them without a cramped peninsula blocking every traffic path. Call (206) 591-1096 to set up a free on-site visit and we'll walk through what your kitchen actually needs.

localContext: |
  Olympia's housing splits pretty clearly along era lines. The older homes in South Capitol (98501) — some dating to 1905-1930 — are post-and-pier Craftsman builds with original knob-and-tube wiring and cast iron drain lines that have to come out before any kitchen renovation starts. Farther east in the 98506 zip, the mid-century ranchers and split-levels from the 1960s-70s hit similar problems: underpowered 100A electrical panels that can't handle induction cooking, galvanized supply lines due for replacement, and closed layouts that made sense when builders weren't thinking about open-concept living. The Westside (98502) has more 1980s-90s tract housing where the bones are solid but the builder-grade cabinets are past their useful life. Thurston County pulls roughly 51 inches of rain per year — more than Seattle — which means crawlspace moisture and vapor barrier conditions directly affect subfloor integrity before new tile or engineered hardwood goes down.

commonProblems:
  - title: "Load-Bearing Walls in Olympia's 1960s-70s Ranchers — LVL Beam and Permit Required"
    description: "The ranchers off Martin Way and through the Eastside neighborhoods in 98506 were framed with load-bearing walls separating the kitchen from the living space. Removing that wall to open the layout isn't a weekend project — it requires a structural engineer's stamp, a permit through the City of Olympia Building Division, and installation of an engineered LVL beam sized to carry the roof load. The beam gets supported on PSL posts set into the existing foundation, and the rough-in inspection happens before any drywall closes up. We've worked through this structural sequence on dozens of similar footprints across the area. The structural phase alone typically runs 2-3 weeks before finish work begins, and budget $8,000-$15,000 for that scope depending on beam span and existing framing conditions."

  - title: "100A Panel Upgrades When Adding Induction Ranges to Older Olympia Kitchens"
    description: "Induction ranges — a KitchenAid 36-inch or Bosch 800 Series slide-in — need a dedicated 50A circuit. Most 1960s-70s Olympia homes were wired with a 100A service that has nothing left to give once you add a hood fan, dishwasher, and microwave. The fix is a 200A service upgrade, which in Olympia goes through the City of Olympia Building Division with a permit and rough-in inspection. PSE (Puget Sound Energy) has to disconnect and reconnect the service entrance on their own schedule — that adds 1-2 weeks to the project timeline. Budget $3,500-$6,000 for the service upgrade including new panel, runs to the kitchen, and permit fees. We coordinate directly with PSE so the scheduling doesn't fall on you."

  - title: "Cabinet Selection for Olympia Kitchens — IKEA, Semi-Custom, or Full Custom"
    description: "Most Olympia kitchens in the $50K-$90K renovation range land on semi-custom — brands like KraftMaid or Aristokraft give more size flexibility than IKEA without the lead time and cost of full custom. IKEA SEKTION works well in straightforward rectangular kitchens with standard dimensions. The price gap is real: IKEA runs $150-$300 per linear foot installed, semi-custom $400-$700, full custom $1,200+. For a 180-square-foot kitchen in a South Capitol Craftsman with irregular wall angles, we typically spec semi-custom because IKEA's fixed carcass sizes don't adapt cleanly to non-standard layouts. Thurston County doesn't require permits for cabinet replacement alone, but moving the sink or adding an island with electrical does trigger a permit through the City of Olympia Building Division. TopVolk is a WA Licensed Contractor and handles permit applications — you won't be tracking the paperwork."

  - title: "Quartz vs. Granite Countertops in a High-Moisture PNW Kitchen"
    description: "Granite shows up in a lot of Olympia kitchen proposals because it photographs well in showrooms. The honest trade-off: granite needs annual sealing in a high-moisture PNW kitchen, and heavy cooking with acidic ingredients etches the surface over time. Quartz — Cambria, Silestone, or Caesarstone — is non-porous and needs no sealing. For a 30-linear-foot countertop in a mid-sized Olympia kitchen, installed quartz runs $4,500-$9,000 depending on edge profile and 3cm thickness (standard spec). Granite typically runs $3,500-$7,500 for the same scope. Waterfall edges and bookmatched slabs add 20-35% to material cost. On a Westside Olympia kitchen with a peninsula and island, quartz holds up better over a 15-20 year horizon without ongoing maintenance — which matters on a middle-class household budget."

  - title: "Gas Line Modifications and Range Hood Venting — Permit Work in Olympia"
    description: "Moving a gas range from one wall to another — or swapping in a 36-inch gas range where a 30-inch electric used to sit — requires a gas line extension and a mechanical permit through the City of Olympia Building Division. That permit triggers a rough-in inspection before walls close. Range hood venting is the other piece: a 600 CFM or 900 CFM hood needs a dedicated duct run to the exterior wall or up through the ceiling — recirculating hoods don't work for heavy cooking. In older Olympia homes with tight attic clearance, the duct route takes real planning in the design phase rather than after framing is done. Budget $2,500-$5,000 for gas line extension, hood installation, and venting depending on run length and wall assembly type."

faq:
  - q: "How fast can TopVolk get to Olympia for a kitchen remodel estimate?"
    a: "Olympia is about 60 miles south of Seattle — usually 60-75 minutes down I-5 depending on traffic. Vladislav does the on-site estimates himself, not a salesperson. We typically schedule visits within 5-7 business days of first contact, and you'll get a line-item quote within 3-5 days after the visit — not a vague range. Call (206) 591-1096 to set up a time. Street parking in South Capitol and Eastside neighborhoods is straightforward and we handle it."

  - q: "What does a full kitchen remodel cost in Olympia?"
    a: "For a typical 150-200 square foot Olympia kitchen, budget $45,000-$90,000 for a full remodel covering cabinets, countertops, appliances, flooring, and electrical and plumbing updates. Structural work — load-bearing wall removal, LVL beam installation — adds $8,000-$15,000 on top. A higher-end appliance package with a Bosch dishwasher, KitchenAid range, and a 600 CFM Zephyr hood adds $8,000-$15,000 versus mid-range GE or Whirlpool. Contracts are fixed-price with line-item breakdowns. Call (206) 591-1096 for a free on-site consultation with exact pricing."

  - q: "Do I need a permit for a kitchen remodel in Olympia?"
    a: "Scope determines the permit requirement. Cabinet replacement and countertop swaps alone don't require a permit from the City of Olympia Building Division. Electrical work (new circuits, panel upgrade), plumbing modifications (moving the sink, adding a dishwasher circuit), gas line changes, or structural work all require permits. Plan review at the City of Olympia typically runs 3-6 weeks for kitchen remodels. TopVolk is a WA Licensed Contractor and handles permit applications and inspection coordination — rough-in and final both — so that process doesn't fall on you to manage."

  - q: "Can you remove a load-bearing wall to open up my Olympia kitchen?"
    a: "Yes — and we do this regularly on Olympia's 1960s-70s ranchers and split-levels. The process starts with a structural engineer's assessment to confirm load path and specify LVL beam size. We pull the permit through the City of Olympia Building Division, install temporary shoring, set the beam on PSL posts, and pass the rough-in inspection before any drywall goes up. Timeline from permit application to finished structural work runs 6-10 weeks depending on plan review queue. Full kitchen remodel with open-concept conversion: 8-14 weeks total. Deadline commitments are written into the contract — missed dates carry a financial penalty."

  - q: "How long does a kitchen remodel take in Olympia?"
    a: "A mid-range kitchen with no structural work — cabinet swap, new countertops, updated appliances, and flooring — typically runs 5-8 weeks from demo to blue tape walkthrough and punch list. Add structural work and you're at 8-14 weeks. Add a 200A panel upgrade and factor in 1-2 weeks for PSE scheduling on top of that. Permitting at the City of Olympia Building Division is the main variable — plan review can run 3-6 weeks. Trades get scheduled around the permit timeline so there's no dead time after inspection clears."

  - q: "Does TopVolk work in Lacey and Tumwater, or just Olympia proper?"
    a: "Coverage extends throughout the Olympia metro — Lacey (98503, 98516), Tumwater (98512), and unincorporated Thurston County. Lacey projects go through the City of Lacey permit center; Tumwater through the City of Tumwater permit office. Permit process and review timelines are similar across all three jurisdictions, and we know the local inspectors. Call (206) 591-1096 or schedule a free on-site estimate — Vladislav will come to you regardless of which part of the county you're in."