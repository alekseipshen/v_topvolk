title: "Olympia Garage Construction — ADU-Ready Builds for Thurston County Lots"

intro: |
  Capital-area neighborhoods like South Capitol and Cooper Point carry housing built mostly between
  1945 and 1975 — post-WWII ranch homes and split-levels where a detached garage was either skipped
  entirely or framed as a carport that's been collecting moss on its north-facing fascia ever since.
  With WA HB 1337 now allowing two ADUs per single-family lot statewide, a new detached garage with
  a finished unit above has become one of the more financially sound builds on a typical Olympia
  parcel. The math is straightforward: Olympia's rental vacancy rate stays low, state employees and
  JBLM-adjacent workers need housing, and a DADU above a two-car garage generates income without
  selling the property. TopVolk Construction has handled this exact build type — 4-inch
  fiber-reinforced concrete slab, LVL beam carrying the floor load above, Hardie cement-board siding
  matched to the existing house — across Thurston County and the broader Seattle metro since 2023.
  Vladislav Volkov pulls permits directly with the City of Olympia CPD office, coordinates
  rough-in inspections, and doesn't hand the project off to a salesperson. Call (206) 591-1096
  to set up a free on-site walkthrough.

localContext: |
  Olympia's 98502 zip code — the Westside — runs from Cooper Point Road south toward the Lacey
  border, with lot sizes typically ranging 7,000 to 12,000 square feet and enough rear-yard depth
  to place a detached structure without consuming the entire setback envelope. Over in 98501, which
  covers the Eastside and the South Capitol Hill blocks, parcels run narrower and older plat maps
  sometimes show recorded easements that complicate where a concrete slab can land. City of Olympia
  CPD applies a 5-foot rear and side setback for detached accessory structures in most residential
  zones — though alley-accessed lots can allow zero rear setback in some cases, and older
  neighborhoods like Bigelow have overlay conditions worth verifying before pouring anything. Lot
  coverage matters too: once you add a new two-car slab to an existing house footprint, you can
  approach the City's impervious surface limits faster than most homeowners expect. Olympia pulls
  roughly 50 inches of rain annually — well above Seattle's 37 — so slab drainage, PT lumber
  framing at all ground-contact points, and a vapor barrier under the concrete are baseline specs
  on every garage build here, not optional upgrades.

commonProblems:
  - title: "Structuring an ADU Above a Detached Garage Under WA HB 1337"
    description: |
      WA HB 1337 took effect statewide in 2024, allowing up to two ADUs per single-family lot —
      meaning an attached ADU and a detached garage-top DADU can both be permitted simultaneously
      in Olympia. The engineering load path is where this gets complicated fast. A DADU floor needs
      to carry 40 PSF live load, which means LVL beams spanning the garage bay, joist hangers at
      every tail joist, and blocking at all bearing points — not the dimensional lumber a standard
      garage framing package uses. The City of Olympia CPD requires engineered structural drawings
      for any garage with living space above, so a stamped structural set goes into the permit
      package from day one. Plan review at CPD typically runs 6-10 weeks for ADU-over-garage
      projects. TopVolk has completed this combination — two-car garage below, 400-500 sq ft DADU
      above with a separate utility connection — with end-to-end timelines of roughly 5-7 months
      from permit submission to final inspection.

  - title: "EV Charger Circuit Pre-Wire: Do It During Framing, Not After"
    description: |
      Olympia has a higher-than-average concentration of state government employees, and plug-in
      vehicles — Teslas, Chevy Bolts, Ford F-150 Lightnings — are common in Westside and South
      Capitol driveways. Running a 50A or 60A dedicated circuit from the main panel to a NEMA 14-50
      outlet or hardwired Level 2 charger during garage framing adds $200-$400 to the project. The
      same circuit installed after drywall and siding are complete runs $1,200-$2,000 because you're
      fishing wire through finished walls and possibly trenching conduit across a cured slab.
      TopVolk coordinates the electrical sub during rough-in so the 50A circuit, junction box
      location, and panel load calculations hit the permit drawings before the city signs off.
      A NEMA 14-50 outlet at rough-in handles most Level 2 chargers including the ChargePoint
      Home Flex and Tesla Wall Connector; hardwired options like the Wallbox Pulsar Plus are also
      spec'd during construction when the walls are open and conduit is already in the ground.

  - title: "Setback Calculations and Permit Submissions at City of Olympia CPD"
    description: |
      Getting a garage permit through the City of Olympia's Community Planning & Development office
      isn't complicated, but details that look minor on paper can slow an application by weeks. A
      detached garage in an R-1 zone needs to clear 5-foot side and rear setbacks; corner lots in
      98501 add a second street-side setback calculation that shrinks the buildable footprint
      significantly. Structural drawings, a site plan showing the garage footprint relative to
      property lines, and a completed SEPA checklist form the core of a CPD permit package for any
      garage with ADU components above. The AHJ will also confirm FAR compliance and lot coverage
      calculations before plan review proceeds. TopVolk, a WA Licensed Contractor, prepares the
      full permit package — site plan, structural drawings, mechanical layout — and tracks the
      application through CPD directly so the project doesn't stall waiting on correction letters.
      Plan review runs 4-6 weeks for a standalone garage and 6-10 weeks when an ADU is involved.

  - title: "Concrete Slab Specifications: What an Olympia Garage Floor Actually Needs"
    description: |
      A 4-inch minimum concrete slab is standard for residential garages, but Olympia's soil
      conditions include pockets of expansive clay and elevated water tables in low-lying areas
      near Capitol Lake and the Deschutes River corridor — conditions that call for more than the
      minimum. A 4-inch fiber-reinforced slab with a 6-mil vapor barrier underneath and 4 inches
      of compacted crushed rock base is the baseline on every TopVolk garage pour, not the upgrade
      tier. Polypropylene fiber reinforcement cuts crack propagation better than wire mesh in soils
      with seasonal shrink-swell movement. Planning a workshop with a vehicle lift? A 5- to 6-inch
      slab with rebar grid and thickened edges at the door header is the right spec. Skipping the
      vapor barrier in Olympia's wet climate leads to efflorescence and surface spalling within a
      few years — visible damage that signals a deeper moisture problem below. TopVolk specifies
      slab thickness, base prep, and concrete mix design in writing before any pour starts.

  - title: "Matching the Existing House: Siding, Roofline, and Overhead Door Selection"
    description: |
      A detached garage that looks like it was dropped on a property from a different decade is a
      resale problem. Most of Olympia's established neighborhoods — South Capitol, Bigelow, and
      Eastside near Jefferson Middle School — have housing from the 1950s and 1960s with horizontal
      lap siding, low-pitched rooflines, and painted wood trim details. The garage needs to match
      or at minimum complement that exterior vocabulary. Hardie HardiePlank lap siding is the
      standard match for mid-century lap profiles; it handles Olympia's 50-plus inches of annual
      rain without rotting, warping, or growing the moss that destroys cedar and wood-composite
      products on north-facing walls within a decade. Fascia profile, soffit depth, and trim board
      dimensions should align with the existing house — TopVolk typically orders from the same
      Hardie trim line to keep both structures visually coherent. Overhead door selection closes
      out the exterior: an insulated steel door from Clopay (R-16 or better) or Wayne Dalton in a
      raised-panel or carriage-house profile matches traditional and modern elevations equally well
      and delivers real workshop thermal performance through Olympia winters.

faq:
  - q: "How fast can TopVolk get to Olympia for a garage consultation?"
    a: |
      Olympia sits about 60-65 miles south of Seattle on I-5 — roughly an hour drive depending on
      traffic through Tacoma. TopVolk schedules site visits to Thurston County regularly and the
      drive time doesn't affect project pricing or availability. For a detached garage build, the
      typical sequence runs: free on-site consultation, written line-item quote within a week,
      permit submission to City of Olympia CPD, plan review (4-10 weeks depending on scope), then
      construction start. Total time from first call to breaking ground: usually 8-14 weeks.
      Call (206) 591-1096 to schedule a site visit — Vladislav handles all estimates directly,
      no sales staff involved.

  - q: "What does a detached garage build cost in Olympia?"
    a: |
      A single-car detached garage — roughly 12x22 ft, concrete slab, insulated overhead door,
      basic electrical — runs $45,000-$65,000 depending on site conditions. A standard two-car
      garage (24x24 ft) with insulated door, drywall, full electrical, and EV charger pre-wire
      lands in the $75,000-$110,000 range. Add an ADU above — LVL beam floor structure, full bath,
      kitchenette, separate utility connection — and the total project runs $150,000-$220,000.
      Sloped sites and tight setbacks add cost. TopVolk provides written line-item pricing after
      the on-site consultation, and a deadline penalty clause is written into every contract — if
      Vladislav misses a committed project milestone, that's on TopVolk, not on you. Call
      (206) 591-1096 for a free on-site estimate.

  - q: "Do you handle permits with the City of Olympia, or is that the homeowner's responsibility?"
    a: |
      TopVolk handles the full permit package — site plan, engineered structural drawings, SEPA
      checklist, and application submission to the City of Olympia Community Planning & Development
      office. For a standalone detached garage, CPD plan review typically runs 4-6 weeks. Add an
      ADU component under WA HB 1337 and plan review extends to 6-10 weeks, sometimes longer if
      correction letters come back. Vladislav responds to correction letters directly and tracks
      application status so you're not calling the permit counter every other week. TopVolk is a
      WA Licensed Contractor; the license appears on the permit application, and all rough-in and
      final inspections are coordinated through the contractor account — not managed by the
      homeowner.

  - q: "Can you pre-wire for an EV charger during garage construction?"
    a: |
      Yes — and this is almost always worth doing during framing, not afterward. Running a 50A or
      60A dedicated circuit during construction adds $200-$400 to the project; the same work after
      drywall is closed runs $1,200-$2,000 minimum. TopVolk coordinates with the electrical
      subcontractor to spec conduit size, outlet location, and panel load capacity before rough-in
      inspection. A NEMA 14-50 outlet supports most Level 2 chargers including the ChargePoint
      Home Flex and Tesla Wall Connector. For hardwired installs like the Wallbox Pulsar Plus, the
      conduit and wiring stub-out go in during framing when the walls are still open. All of this
      is documented on the electrical permit drawings submitted to CPD and inspected at rough-in —
      code-compliant from day one, not a retrofit added later.

  - q: "What warranties come with a garage build from TopVolk?"
    a: |
      Workmanship on structural components — framing, concrete slab, foundation — carries a
      one-year warranty. Manufacturer warranties run longer: Hardie siding products carry a 30-year
      limited warranty, and insulated steel overhead doors from Clopay carry a lifetime panel
      warranty against rust and denting. A concrete slab prepped with compacted rock base and a
      6-mil vapor barrier should perform for 30-40 years without significant cracking under normal
      Olympia soil and climate conditions. What voids coverage quickly: skipping the vapor barrier,
      insufficient base compaction, or using non-pressure-treated lumber at ground contact in this
      climate. TopVolk documents the slab prep process with photos before the pour and uses PT
      lumber at all ground-contact framing points. Warranty terms are written into the contract
      in plain language.

  - q: "Does TopVolk work in Lacey, Tumwater, and other nearby Thurston County areas?"
    a: |
      Olympia, Lacey, Tumwater, and unincorporated Thurston County are all within TopVolk's regular
      service area. Lacey and Tumwater each run their own permit centers separate from City of
      Olympia CPD, though the process and timelines are comparable. For unincorporated areas outside
      city limits, permits run through Thurston County Community Development instead. TopVolk has
      completed garage and ADU-above-garage projects across King, Snohomish, Pierce, and Thurston
      counties — 100+ projects completed since 2023. Scheduling a site visit to the Olympia area
      typically takes 3-7 business days from first contact. Call (206) 591-1096 or reach out
      through the website — Vladislav handles all estimate appointments personally.