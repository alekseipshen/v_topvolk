title: "Olympia Plumbing — Old Pipes, Heavy Rain, Real Fixes"

intro: |
  Capitol Lake sits at the edge of downtown, and the neighborhoods climbing
  the hillsides above it — the Eastside blocks around Legion Way and the older
  streets west of Plum Street in 98501 — hold some of the oldest housing stock
  in Thurston County. Many of those homes were built before 1960, which means
  galvanized steel supply lines that have been corroding since the Eisenhower
  administration. Olympia averages close to 50 inches of rain a year — more
  than Seattle — and that moisture finds its way into crawlspaces and wall
  cavities in ways that accelerate pipe deterioration you can't see until
  pressure drops or a line lets go. Out on the Westside, along Cooper Point
  Road and the subdivisions off Mud Bay Road in 98502, the problem shifts:
  polybutylene pipe installed during the 1980s building boom is hitting the end
  of its service life, and tankless conversions to Rinnai or Navien units are
  increasingly common as owners upgrade during full remodels. TopVolk
  Construction handles plumbing scope as part of kitchen and bathroom remodels,
  ADU builds, and whole-house renovations — not standalone repair calls. Call
  (206) 591-1096 to schedule a free on-site walkthrough with Vladislav directly.

localContext: |
  Zip code 98501 skews heavily toward pre-1960 construction — Craftsman
  bungalows on the Eastside, older two-story colonials near the South Capitol
  neighborhood, and blocks of 1940s houses still running original galvanized
  supply lines and cast-iron drain stacks. Cast iron corrodes from the inside
  out; by the time rust staining shows up at a cleanout, the pipe wall is often
  thin enough to crumble when you put a wrench on it. Over in 98502, the mix
  shifts to 1960s-70s ranchers on the Westside and newer construction out
  toward Cooper Point — the ranchers are the ones generating most of the
  drain-rerouting calls when owners want a kitchen island sink or a basement
  bathroom added. City of Olympia Building Division requires permits for water
  heater replacements, drain reroutes, and any new rough-in work. Inspectors
  check seismic strapping on every water heater as part of final inspection —
  that's a WA code requirement, not optional, and it affects how a water heater
  alcove gets framed and blocked before the unit goes in.

commonProblems:
  - title: "Galvanized Supply Lines in Pre-1960 Homes — Restricted Flow and Rust"
    description: |
      Galvanized steel pipe has an expected lifespan of 40-70 years before
      mineral scale builds up enough to choke water flow — and in Olympia's
      Eastside and South Capitol neighborhoods, plenty of those pipes are well
      past that range. Corrosion works from the inside out: scale deposits
      narrow the interior diameter year by year, dropping pressure at fixtures
      while the pipe exterior looks intact. By the time a shower loses pressure
      or a kitchen faucet runs rust-colored, the pipe wall is actively oxidizing
      and needs full replacement, not a spot repair. The standard fix is a full
      repipe from the meter to all fixtures using PEX-A tubing — Uponor
      AquaPEX is a proven choice — run through walls and floors with expansion
      fittings that won't corrode at the joints. In a typical 1,400-square-foot
      Eastside bungalow with two bathrooms and a kitchen, rough-in runs 5-7
      days and is scoped as part of a broader bathroom or kitchen remodel.
      Budget $8,000-$18,000 depending on access, fixture count, and whether the
      main shutoff also needs replacement.

  - title: "Polybutylene Pipe Failure in 1980s Westside Homes — Fittings Crack First"
    description: |
      Gray polybutylene pipe — installed in hundreds of Olympia-area homes built
      between 1978 and 1995 — doesn't usually fail at the pipe itself. It fails
      at the acetal plastic insert fittings and crimp rings that connect
      sections: chlorine in municipal water oxidizes the acetal over time until
      fittings crack or pull apart, sometimes behind finished drywall. The first
      sign is often a slow drip that only shows as a ceiling stain weeks after
      the fitting let go. Homes in the 98502 Westside subdivisions and ranchers
      built in the 1980s off Kaiser Road are among the most common places this
      turns up during remodel demo. Full replacement with PEX-B — Viega
      ProRadiant or similar — is the right call; partial repairs just push the
      failure to the next fitting in line. Access through finished ceilings and
      walls adds labor time. A whole-house repipe in a two-bath home typically
      runs $10,000-$20,000 depending on home size and how many walls need
      opening.

  - title: "Tankless Water Heater Conversion — Gas Line Sizing Is the Hard Part"
    description: |
      Switching from a 40- or 50-gallon tank to a Rinnai RU199iN or Navien
      NPE-240A2 sounds like a direct swap. It's not. Both units draw up to
      199,000 BTU at max firing rate, and most older Olympia homes were piped
      for a 40,000-BTU tank heater — the gas line from the meter to the water
      heater closet is typically ½-inch or ¾-inch black iron, which can't
      deliver enough flow. Upsizing to 1-inch or larger (depending on total BTU
      load from range, furnace, and water heater combined) requires a permit
      from the City of Olympia Building Division and a rough-in inspection
      before the wall closes. Venting changes too: tankless units use direct-vent
      concentric pipe through an exterior wall, not the existing flue. Total
      scope — gas line upsize, new venting, seismic strapping, permit fees —
      typically runs $4,500-$8,500, before any framing changes if the old tank
      sat in an awkward alcove. TopVolk pulls the permit and handles MEP
      coordination; you don't manage the paperwork separately.

  - title: "Pressure Regulator Installation — High PSI Kills Fixtures Early"
    description: |
      City of Olympia municipal water pressure tests above 80 PSI in parts of
      98501, particularly on lower-elevation streets near the waterfront. WA
      plumbing code, following IRC standards, caps maximum static pressure at
      80 PSI at the point of use. Running unregulated high-pressure water
      through Moen or Kohler valves, dishwasher solenoids, and washing machine
      hoses shortens their service life significantly — hose bib washers blow
      out faster, and supply stop valves at toilets and sinks start weeping at
      the stem over time. A pressure reducing valve (PRV) installed at the main
      shut-off — a Watts 25AUB or Zurn Wilkins 70XL are both reliable choices
      in this application — brings the whole house into range in one shot.
      Olympia Building Division requires a permit for the PRV swap; plan on
      one inspection and about a half-day of work. Parts and labor typically
      run $600-$1,200. If the existing main shutoff is original galvanized and
      hasn't been turned in 20 years, budget to replace that valve at the same
      time — they often fail when you try to close them after decades of
      sitting open.

  - title: "Drain Line Rerouting for Kitchen Islands and Basement Bathrooms"
    description: |
      Adding a sink to a kitchen island or roughing in a bathroom in an
      unfinished basement both require draining downhill to the main stack —
      and in many of Olympia's older ranchers and split-levels, that stack
      isn't positioned where you'd want it relative to the new fixture. Island
      sinks need a drain loop vented with an air admittance valve (AAV) or a
      dedicated vent tied into the existing stack; basement bathrooms usually
      need a sewage ejector pump if the slab sits below the sewer line
      elevation. The Zoeller M53 is the standard workhorse pump for residential
      basement bath applications. Both scenarios require cutting into existing
      cast iron or ABS drain lines and completing a full rough-in before any
      slab or subfloor goes back over the work. City of Olympia requires a
      permit for any new rough-in, and rough-in inspection happens before
      concrete is poured. Typical cost for a basement bathroom rough-in
      including ejector pump runs $3,500-$7,000; a kitchen island drain and
      vent runs $1,200-$2,500 depending on stack distance and vent routing.

faq:
  - q: "How fast can you get to Olympia for a plumbing consultation?"
    a: |
      Olympia is roughly 60 miles south of Seattle on I-5 — about an hour
      depending on traffic through Tacoma. TopVolk schedules on-site
      consultations for Thurston County projects; Vladislav comes out, walks
      the house, and leaves with enough information to produce a line-item
      quote. No sales staff, no follow-up call from someone who wasn't at the
      walkthrough. Turnaround from consultation to written estimate is 3-5
      business days. For a kitchen or bathroom remodel with full plumbing
      scope, construction typically starts 4-8 weeks after contract signing,
      depending on City of Olympia permit review timeline. Over 100 projects
      completed since 2023 across the Seattle metro and South Sound.
      Call (206) 591-1096 to set up a time.

  - q: "What does a whole-house repipe cost in Olympia?"
    a: |
      Whole-house repipe pricing in Olympia runs $8,000-$20,000 for most
      residential projects, depending on home size, pipe material chosen (PEX-A
      vs copper), fixture count, and crawlspace or wall access. A 1960s rancher
      with an accessible crawlspace and three bathrooms typically lands in the
      $10,000-$14,000 range using PEX-A. Copper runs 20-30% higher in
      materials and makes sense when local water chemistry is aggressive or an
      owner specifically prefers it for a high-end remodel. The on-site
      estimate includes a room-by-room fixture count and line-item breakdown —
      not a vague ballpark range. Deadline penalties for missed milestones are
      written directly into the contract. Call (206) 591-1096 for a free
      on-site quote.

  - q: "Do I need a permit for plumbing work in Olympia, and how long does it take?"
    a: |
      Most plumbing work inside the City of Olympia requires a permit from the
      Olympia Building Division — water heater replacements, new rough-in for
      drain, supply, or gas lines, and whole-house repipes all fall under that
      requirement. The City's online permit portal handles application
      submission; review for straightforward residential plumbing typically
      takes 1-3 weeks, and simple water heater replacements are sometimes
      processed over the counter in a day or two. TopVolk pulls all permits as
      part of the project scope — that's built into how the job is priced.
      Being a WA Licensed Contractor is a prerequisite to pulling permits in
      Olympia, and both rough-in and final inspections are scheduled directly
      with the City. For homes outside city limits, permits route through the
      Thurston County permit center on Lilly Road instead.

  - q: "Can you handle the gas line work a tankless water heater installation requires?"
    a: |
      Gas line upsizing is part of how TopVolk scopes tankless conversions —
      not a separate trade you coordinate yourself. High-output Rinnai and
      Navien units demand more BTU delivery than a standard tank heater gas
      line provides, and that usually means replacing ½-inch black iron with
      1-inch pipe from the meter or main manifold. That work requires a City
      of Olympia permit and a rough-in inspection before the wall closes.
      Vladislav coordinates directly with Puget Sound Energy (PSE) for meter
      connection confirmation and service pressure verification as part of the
      project. Gas line work, new concentric venting, seismic strapping, and
      permit fees are all included in the project quote — no surprise line
      items at rough-in inspection.

  - q: "What warranty covers the plumbing work TopVolk does in Olympia?"
    a: |
      Workmanship on plumbing rough-in and finish work carries a 2-year
      warranty through TopVolk — if a fitting leaks or a connection fails due
      to installation, it gets fixed at no charge. Manufacturer warranties run
      separately: Rinnai and Navien both carry 12-year heat exchanger
      warranties and 5-year parts warranties when installed by a licensed
      contractor. Moen and Kohler fixtures carry lifetime limited warranties
      on finish and mechanical function. Uponor PEX-A tubing carries a 25-year
      system warranty. Every permitted project in Olympia ends with a City
      Building Division final inspection sign-off — that's a third-party
      confirmation that the work meets code, which matters when you go to sell
      the house.

  - q: "Do you serve areas outside Olympia city limits in Thurston County?"
    a: |
      TopVolk takes on remodel and renovation projects throughout Thurston
      County — Lacey, Tumwater, Yelm, Rainier, and unincorporated areas in
      between. Lacey and Tumwater each have their own permit centers separate
      from the City of Olympia; unincorporated Thurston County work goes
      through the county permit office. Drive time from Seattle runs 55-75
      minutes depending on I-5 traffic through Tacoma; Vladislav typically
      groups South Sound site visits on the same day to keep scheduling
      practical. TopVolk also serves Pierce County — Tacoma, Puyallup, and
      surrounding areas — for larger renovation and ADU projects.
      Call (206) 591-1096 to check availability for your area and project type.