      near Hawks Prairie and the I-5/Marvin Road interchange tend toward Hardie-sided
      homes from the 2000s and 2010s — different surface prep than the older cedar-sided
      stock closer to Olympia proper. Tumwater has a mix of mid-century homes near the
      historic falls area and newer construction south of Highway 101. Scheduling for
      all three cities runs through the same calendar. Call (206) 591-1096 or request
      a free on-site estimate — Vladislav assesses every project in person, 100+ projects
