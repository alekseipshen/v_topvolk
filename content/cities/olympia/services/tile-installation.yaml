  - q: "Do tile installations in Olympia require a permit?"
    a: |
      Most standalone tile replacement — swapping old bathroom floor tile for new — doesn't
      require a permit from the City of Olympia Building Division. The threshold kicks in when
      the project includes electrical work (like a Schluter Ditra-Heat or Warmup thermostat
      circuit), plumbing changes, or structural modifications such as wall framing for a new
      niche. For those scopes, Olympia's Building Division typically runs a 3-6 week plan
      review. TopVolk is a WA Licensed Contractor and handles permit application, plan set
      submittal, and inspection scheduling — including rough-in inspections for heated floors
      before tile covers the system. You don't have to navigate the City's permit portal on
      your own.

  - q: "Can you install heated tile floors in an Olympia bathroom?"
    a: |
      Yes — and in Olympia's climate, it's a legitimate upgrade, not a luxury add-on. Cold
      wet floors from October through April are the baseline here. Both Schluter Ditra-Heat
      and Warmup systems work well in bathroom remodels; Ditra-Heat has the added benefit of
      functioning as an uncoupling membrane, which reduces crack transmission on older
      subfloors that have minor seasonal flex — common in 98503 ranchers with original
      Douglas-fir framing. The system adds roughly 1-2 days to the tile timeline and $8-$14
      per square foot to project cost. Schluter's 25-year warranty on the heating element
      is part of the package. Electrical permit from the City of Olympia is required when the
      thermostat is part of a larger remodel scope.

  - q: "How long should a properly installed tile job last in a PNW home?"
    a: |
      With the right substrate, waterproofing membrane, and mortar selection, a tile
      installation should hold 20-30 years without major issues. The failure point in most
      PNW tile jobs is the waterproofing layer — not the tile itself. Schluter Kerdi membrane,
      once installed correctly, doesn't need resealing. Grout in high-traffic areas benefits
      from resealing every 2-3 years. Natural stone like marble or travertine needs annual
      sealing in wet areas given Olympia's humidity levels. TopVolk's workmanship warranty
      covers installation defects — if tile lifts, grout cracks prematurely, or waterproofing
      fails within the warranty window, Vladislav comes back and fixes it. Substrate photos
      are documented before tile goes down, so there's a clear record of what was built.

