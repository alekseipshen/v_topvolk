title: "Olympia Tile Installation — Waterproofing Built for 51 Inches of Rain"

intro: |
  Capitol Lake sits less than a mile from most of Olympia's residential core, and the region
  averages 51 inches of rain annually — well above Seattle's 37. That moisture doesn't stay
  outside. In bathrooms and shower niches across South Capitol and the Eastside neighborhoods,
  improperly waterproofed tile installations fail quietly over years: greenboard stays wet behind
  the tile, mold takes hold behind the grout lines, and eventually the substrate delaminates.
  TopVolk Construction LLC has done tile work in Thurston County homes since 2023 — kitchens in
  Craftsman bungalows off Capitol Way, full bathroom remodels in mid-century ranchers on the
  Eastside, heated floor installations in newer construction near Percival Landing. The fix isn't
  complicated tile patterns or decorative choices. It's doing the substrate and waterproofing
  correctly before any tile goes down — Schluter Kerdi membrane in wet areas, proper thinset
  selection for large-format porcelain, laser-checked substrate flatness. Those details determine
  whether your tile holds up for 25 years or starts failing in five.

localContext: |
  Homes in 98501 — central Olympia, covering downtown and the South Capitol district — run heavily
  toward early 1900s and 1920s construction. Post-and-pier foundations, original old-growth
  Douglas-fir framing, and crawlspaces that trap humidity year-round. Tile set over those
  substrates without a proper vapor barrier or uncoupling membrane eventually moves as the
  structure flexes seasonally. Over in 98503, the Eastside grid is mostly 1960s and 1970s
  ranchers — slab-on-grade or short crawlspace, builder-grade 4×4 ceramic tile in bathrooms set
  directly over greenboard with no waterproofing membrane. By now, most of those original
  bathrooms are pushing 55 years old and failing. Kitchen backsplashes from that era used thinset
  over bare drywall with minimal prep, which means tile pops when cabinet replacement or
  electrical relocation puts even minor stress on the wall. The City of Olympia Building Division
  handles permits when tile is part of a larger remodel — plan on a 3-6 week review cycle for
  any project that includes electrical or plumbing changes alongside the tile scope.

commonProblems:
  - title: "Shower Waterproofing Failures Behind the Tile"
    description: |
      Most shower failures in South Capitol and Eastside homes aren't grout failures — they're
      substrate failures behind the grout. Greenboard (paper-faced water-resistant drywall) was
      standard bathroom backer before the mid-1990s. It absorbs moisture, grows mold, and
      eventually turns to mush behind the tile face. The correct fix requires full tile removal,
      demo of the degraded substrate, and a proper install sequence: cement board or foam backer,
      Schluter Kerdi sheet membrane bonded with unmodified thinset, and tile set with medium-bed
      mortar. In a standard 36×36-inch shower, Kerdi membrane materials alone run $150-$220.
      Full shower retile with proper waterproofing in a 98501 home typically runs $4,500-$8,000
      depending on tile selection and niche framing complexity. Skipping the membrane to save
      $300 typically means another full retile within 7-10 years — the math isn't hard.

  - title: "Large-Format Porcelain Tile Needs a Flat Substrate, Not Just a Clean One"
    description: |
      32×32 and 24×48 porcelain slabs fail more often than traditional 12×12 tile when the
      installer skips substrate prep. ANSI A108 requires flatness within 1/8 inch over 10 feet
      for large-format tile. In older Olympia homes with plaster walls or early drywall, that
      standard rarely exists without a skim coat or full backer replacement. Lippage — where
      tile edges don't align flush — is the most common callback complaint on large-format
      installs, and it's almost always a substrate problem, not a tile problem. Beyond flatness,
      large porcelain slabs need full back-buttering plus a 1/2-inch V-notch trowel bed using a
      medium-bed mortar like Custom Building Products 254 Platinum. A bathroom floor job using
      24×24 porcelain in 98503 runs $18-$28 per square foot installed, with substrate prep
      adding $3-$6 per square foot when skim coat or backer board replacement is required.

  - title: "Heated Floor Systems — Getting the Rough-In Right Before Tile Goes Down"
    description: |
      Schluter Ditra-Heat and Warmup heated floor systems are a common add-on during Olympia
      bathroom remodels — especially in older homes with minimal subfloor insulation and cold
      slab-on-grade floors. The install sequence is non-negotiable. Ditra-Heat mat goes down
      over a primed substrate, heating cables set into the fleece channels, thermostat rough-in
      completed before tile starts, then tile over the mat with proper thinset coverage over
      every cable run. Missing the thermostat rough-in step or leaving air gaps over cables
      creates hot spots that crack tile. The City of Olympia Building Division requires an
      electrical permit for thermostat installation when it's part of a larger remodel scope.
      Vladislav coordinates rough-in inspection scheduling so the inspector signs off on the
      heating system before tile covers it. Heated floor systems add $8-$14 per square foot
      to a bathroom tile project, including the mat, cables, and thermostat. Schluter covers
      the heating element for 25 years.

  - title: "Natural Stone in PNW Humidity Requires More Than a Tile Installer"
    description: |
      Marble and travertine show up in higher-end bathroom remodels in South Capitol bungalows
      and newer Westside construction near 98502. Both stones are porous — travertine especially
      — and Western Washington's humidity accelerates staining and efflorescence when the stone
      isn't sealed before grout and again after. The correct approach uses a penetrating
      silane-siloxane sealer (Miracle Sealants 511 Impregnator is the standard for travertine
      in wet environments) applied before grouting to prevent haze from bonding to the stone
      surface. Marble floors need polishing compound after installation to remove minor lippage
      and restore the finish. In Olympia's 51-inch-rain climate, natural stone in a shower
      needs resealing annually — that's just the maintenance schedule for porous stone in a
      consistently humid environment. A travertine shower install with sealing, niche, and
      bench runs $28-$42 per square foot installed depending on stone grade and layout
      complexity.

  - title: "Tile-to-Hardwood Transitions — The Detail That Shows Up a Year Later"
    description: |
      Tile-to-hardwood transitions are the detail most installers rush — and the one that
      fails within 12-18 months when it's done wrong. Wood flooring expands and contracts
      seasonally, and Olympia's wet winters amplify that movement significantly. If tile
      abuts hardwood without a proper expansion gap and Schluter Reno-T metal transition
      strip, the wood lifts and pushes the edge tile. The gap needs to be at least 1/4 inch
      and filled with flexible color-matched silicone, not grout — grout has no give and
      cracks under any wood movement. In mid-century 98503 ranchers with original oak
      hardwood, the previous installer almost always grouted directly to the wood edge.
      Pulling that joint, cutting the correct gap, setting a Schluter Reno-T strip, and
      backfilling with silicone adds 2-3 hours to an install but eliminates the callback.
      Transition strip materials run $15-$30 per linear foot depending on strip profile
      and finish.

