title: "Olympia Handyman Services — Small Repairs That Actually Get Done"

intro: |
  Capitol Hill and the South Capitol Historic District — about four blocks south of the
  Washington State Capitol dome — hold some of the oldest residential housing in Thurston
  County, Craftsman bungalows built between 1905 and 1930 that have been partially renovated
  a dozen times without ever getting a complete punch list cleared. Olympia pulls close to 50
  inches of rain annually, noticeably more than Seattle, and that constant wet-dry cycling
  works on door thresholds, exterior trim joints, and wood deck boards in ways that pile up
  fast. A Moen faucet that drips for eight months, a smart thermostat still in the box since
  last Christmas, three drywall patches from the plumber's visit in February — none of these
  justify calling a general contractor, but they don't fix themselves either. TopVolk
  Construction LLC handles this kind of work across Olympia and the surrounding Thurston
  County area. Owner Vladislav Volkov does the estimate himself — call (206) 591-1096 to
  set up a walkthrough near Percival Landing or anywhere else in the 98501 or 98502 zip codes.

localContext: |
  Homes in 98501 — covering the Eastside, South Capitol, and the streets near Priest Point
  Park — tend to be pre-war Craftsman stock with original trim details, plaster walls patched
  into drywall in segments, and post-and-pier foundations. Drywall texture matching in these
  houses gets complicated fast because 1930s hand-troweled plaster sits right next to drywall
  that got a skip-trowel finish in 1992. Over in 98502, the Westside neighborhoods shift to
  mid-century ranchers from the 1955–1972 era — wood-framed, builder-grade fixtures, and
  galvanized supply lines that have mostly been retrofitted by now, though not always
  completely. Deck boards in both neighborhoods take a beating from Olympia's rainfall and the
  mild but persistently humid summers; untreated Douglas-fir decking starts checking and
  cupping after 8–10 years here, and composite decking from Trex or TimberTech has become
  the practical replacement default. Out in Hawks Prairie (98516), newer HOA subdivisions from
  the 1990s and early 2000s see a different backlog — punch-list items left over from partial
  remodels: missing cabinet hardware, uncaulked backsplash gaps, unfinished weatherstripping,
  smart home devices waiting for installation. Most handyman-level tasks in Olympia — fixture
  swaps, patching, weatherstripping, deck board replacement — don't require permits through
  the City of Olympia's permit office, which keeps scheduling straightforward.

commonProblems:
  - title: "Rotted Exterior Trim on South Capitol Craftsman Bungalows"
    description: |
      Corner boards, window casings, and fascia on the older Craftsman homes in 98501 catch
      water at every butt joint and end-grain cut. Olympia's October-through-April rain keeps
      those joints wet for months at a stretch, and once the paint film fails, the rot runs 12
      to 18 inches in before it's visible from the sidewalk. The fix involves cutting back to
      solid wood, treating any exposed framing with a Borate wood preservative like Tim-bor,
      and replacing with pre-primed Hardie trim board — which holds up against Thurston County
      moisture far longer than cedar does. A single window casing on a ground-floor window
      takes about 3–4 hours. Two or three windows plus a corner board typically runs
      $450–$850 in labor, depending on height and access. Leaving it another season usually
      means the repair gets bigger and more expensive.

  - title: "Drywall Patch and Texture Mismatch After Trade Work"
    description: |
      Plumbers and electricians cut access holes and don't close them — that's standard. The
      problem in Westside ranchers (98502) built in the 1960s is that the existing texture is
      usually a light orange-peel rolled finish, while some rooms still have original plaster
      ceilings with a completely different hand-applied character. Patching without matching
      the texture leaves a flat island that catches raking light all day. The right process:
      feather the patch using Durabond 90 setting compound (it sets hard and doesn't shrink
      like all-purpose mud), prime, then match surrounding texture — hopper gun for
      orange-peel, hand application for skip-trowel. Adding a paint blend step is often
      necessary to hide the patch entirely. Small holes under 6 inches run $150–$300.
      Larger access cuts needing multiple coats and a full texture blend run $300–$600
      depending on ceiling vs. wall location.

  - title: "Weatherstripping and Threshold Seal Failure on Exterior Doors"
    description: |
      Many Olympia homes have exterior doors that were never properly weatherstripped from
      the factory, or had original kerf-in foam tape compress and split after 20 years of
      use. A door sweep dragging on a warped threshold combined with failed compression bulb
      seal on the doorstop can account for a real amount of heat loss — in a climate that
      stays cold and wet from October through March, that shows up on the utility bill.
      Replacement involves pulling out the old adhesive-back or kerf-in vinyl, cutting new
      compression bulb weatherstrip to length, and fitting an aluminum door sweep — a Pemko
      315CN works well on most residential wood doors. Threshold adjustment may be needed if
      the door has sagged. A full exterior door seal per door takes about 90 minutes. Three
      exterior doors, properly weatherstripped and adjusted, typically runs $250–$450
      depending on door count and how much threshold work is required. TopVolk is a WA
      Licensed Contractor, so when any related structural adjustment comes up, the scope is
      clear upfront.

  - title: "Deck Board Replacement on Aging Wood Decks"
    description: |
      Pressure-treated lumber rated for ground contact holds up in the structural framing —
      posts, beams, and joists — but deck boards, especially standard PT or bare Douglas-fir,
      start checking and cupping after 8–12 years in Thurston County's wet climate. Boards
      that have lifted around fasteners trap standing water and wick it into joist tops and
      the rim joist. Board-by-board replacement with TimberTech Terrain or Trex Enhance
      eliminates the stain-and-seal cycle and lasts 25 years without significant maintenance.
      The job involves pulling existing decking, inspecting joist tops for rot, sistering any
      compromised framing, and face-fastening or hidden-clipping new composite boards. A
      standard 200 sq ft deck re-board in composite runs $1,800–$3,200 depending on the
      condition of the framing underneath and whether any joist sistering is needed. If the
      rim joist is rotted through, that adds scope — but it's better to catch it during a
      planned re-board than after a board collapses underfoot.

  - title: "Fixture Replacement — Faucets, Toilets, and Light Fixtures"
    description: |
      Swapping a Kohler toilet, replacing a Moen kitchen faucet, or installing a new vanity
      light fixture is a straightforward job that sits in an awkward gap — too simple to
      justify a licensed plumber's trip charge (typically $150–$200 before any work starts),
      and more involved than most homeowners want to DIY when a shutoff valve and braided
      supply line are involved. In Hawks Prairie and Eastside Olympia homes (98516, 98501),
      the most common requests are a toilet flapper replacement that turned into a full toilet
      swap once the fill valve was also corroded, and builder-grade faucets with worn valve
      seats. A standard toilet swap — remove old unit, set new American Standard or Kohler
      with a fresh wax ring and supply line, test fill and flush — takes about 90 minutes.
      Bundling 2–3 fixture replacements in one visit cuts per-unit cost significantly.
      A three-fixture visit typically runs $350–$600 in labor total.

faq:
  - q: "How fast can you get to Olympia for handyman work?"
    a: |
      TopVolk is based in the Seattle metro — Olympia is about 60 miles south on I-5, roughly
      60 to 75 minutes depending on traffic. Vladislav handles scheduling directly, so there's
      no relay through a dispatcher. Call (206) 591-1096, describe the job list, and a
      walkthrough can usually be set up within 3–5 business days. For jobs with a clear scope,
      a written quote can sometimes be done from photos before scheduling. Most Olympia visits
      are blocked as half-day or full-day work sessions, so travel time gets absorbed into a
      productive trip rather than a short hop for a single item. Parking in South Capitol and
      the Eastside neighborhoods is typically unrestricted street parking — not usually
      a problem.

  - q: "What does handyman work in Olympia typically cost?"
    a: |
      Single fixture replacements — faucet, toilet, light fixture — run $150–$250 in labor
      per item. Drywall patches under 6 inches start at $150–$200 and go up with
      texture-matching complexity. Weatherstripping a set of exterior doors runs $250–$450.
      Deck board replacement on a 200 sq ft deck using Trex or TimberTech composite runs
      $1,800–$3,200 depending on framing condition. Vladislav gives a written quote after the
      walkthrough with line items per task — no vague ranges, no surprise additions. Job
      timelines are written into the contract, with penalties on our end if deadlines are
      missed. That's a hard commitment, not a verbal promise. The on-site estimate is free.
      Call (206) 591-1096 to get it scheduled.

  - q: "Does handyman work in Olympia require permits from the city?"
    a: |
      For most of what's on a typical handyman list, no. The City of Olympia doesn't require
      permits for like-for-like fixture replacements, drywall patching, weatherstripping, or
      deck board replacement when the structure isn't changing. Unincorporated Thurston County
      areas follow similar thresholds through the county permit center. If the work touches
      structure — replacing a ledger board, adding deck framing, modifying load-bearing walls
      — that changes the picture and a permit would be needed. TopVolk is a WA Licensed
      Contractor, so when permits are required, we pull them and coordinate the inspection
      process. For standard handyman tasks, there's no permit paperwork, which means jobs can
      start on a shorter lead time without a 4–8 week plan review window.

  - q: "Can you install smart home devices like a Nest thermostat or Ring doorbell?"
    a: |
      Smart home installs are a routine part of the handyman visit list. A Nest Learning
      Thermostat or ecobee SmartThermostat swap requires checking the existing wiring for a
      C-wire — many older Olympia homes on 98501 and 98502 don't have one routed to the
      thermostat location, which means adding an adapter module at the furnace or air handler,
      or running a new wire. Ring video doorbells are simpler when there's existing doorbell
      wiring; battery-powered versions bypass the wiring issue entirely. Smart thermostat
      installation with C-wire troubleshooting typically runs 1–2 hours. Bundling it with
      other fixture work on the same visit keeps the trip cost efficient. Vladislav can
      advise on compatibility and wiring requirements before the visit so the right hardware
      is on hand when the job starts.

  - q: "What kind of warranty covers the repairs?"
    a: |
      Labor on all handyman work carries a 1-year warranty — if something done during the
      visit fails or wasn't executed correctly, it gets fixed at no additional charge. Material
      warranties depend on what went in: Trex and TimberTech composite decking carries a
      25-year manufacturer warranty against fading and staining. Kohler and Moen fixtures
      carry 1-year to lifetime warranties depending on the product line. Hardie trim board has
      a 30-year limited warranty against rot and fiber-cement failure. What isn't covered:
      normal wear, water intrusion from unrelated sources not part of the original repair, or
      pre-existing conditions that were flagged during the walkthrough. TopVolk has completed
      100+ projects since 2023 across the Seattle metro and Thurston County — direct
      communication with Vladislav before, during, and after the job.

  - q: "Do you cover Tumwater, Lacey, and other cities near Olympia in Thurston County?"
    a: |
      Yes. Tumwater is essentially adjacent to south Olympia — 10 minutes from the Capitol
      neighborhood — and Lacey is a few miles east along Pacific Avenue. Both are part of the
      regular service area. Yelm and Tenino are doable for larger scopes. Centralia and
      Chehalis are at the edge of the range but possible depending on what's on the list.
      Scheduling for Thurston County visits typically runs Tuesday through Friday, with limited
      weekend availability. Call (206) 591-1096 directly — Vladislav handles the calendar
      himself, so you'll get a straight answer on timing rather than a callback from a
      scheduling team.