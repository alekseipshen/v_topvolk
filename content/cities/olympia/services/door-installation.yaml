  - q: "Do I need a building permit to replace a door in Olympia?"
    a: |
      It depends on scope. Swapping a door unit in an existing frame — same rough opening dimensions, no structural changes — is generally permit-exempt in the City of Olympia. Any work that modifies framing, widens the rough opening, or creates a new exterior opening requires a permit from the City of Olympia Building Division. Properties in unincorporated Thurston County go through Thurston County Resource Stewardship instead. Plan review runs roughly three to six weeks for standard door conversions. TopVolk Construction LLC — WA Licensed Contractor — handles the permit application as part of the project. Vladislav prepares the required drawings, submits to the AHJ, and coordinates the rough-in inspection before framing gets covered. You don't need to navigate the permit office; that's folded into the project scope from the start.

  - q: "Can you install a smart lock on my existing front door?"
    a: |
      Yes, but the door itself needs to be in reasonable condition first. Smart locks like the Schlage Encode Plus or August Wi-Fi Smart Lock require a solid mortise or cylindrical bore in a door that's hanging plumb and making full contact with the weatherstripping. A door that's racked, swollen, or failing at the threshold won't seal properly even with new hardware. If the door is in good shape, smart lock installation is straightforward — typically two to three hours including hardware prep and app configuration. If the door needs work first, folding the lock installation into a full entry door replacement is more cost-effective. The Schlage Encode Plus runs $250–$300 for the hardware; the August Wi-Fi model is slightly less at $180–$230. Both integrate with most home automation platforms.

  - q: "What warranty do installed doors carry in Olympia?"
    a: |
      Warranties come from the manufacturer on the door itself, and coverage varies significantly by product line. Therma-Tru fiberglass doors carry a limited lifetime warranty on the slab against warping, rotting, and delamination. Milgard covers their vinyl-frame patio and sliding door units with a full lifetime warranty transferable to a second owner — worth noting if you plan to sell. Masonite provides one year on painted finishes and longer structural coverage on the door unit itself. TopVolk's labor warranty covers the installation — flashing, framing, shimming, hardware installation — for one year on workmanship. For Olympia's climate specifically, fiberglass over steel is the consistent recommendation for exterior applications. Steel doors at typical mid-range price points dent, hold moisture at seams, and tend to fail at the threshold within eight to twelve years of Thurston County winters.

