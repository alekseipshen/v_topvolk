title: "Olympia Door Installation — Craftsman Entries & French Door Upgrades"

intro: |
  Entry doors in Olympia fail in a predictable sequence. Weatherstripping flattens first. Then the threshold loses contact with the door sweep, and moisture starts getting behind the brick mold and into the rough opening. Thurston County averages about 50 inches of rain annually, and the craftsman bungalows throughout the South Capitol neighborhood were built in the 1910s and 1920s with old-growth Douglas-fir frames that have been absorbing that moisture for over a century. Most of those doors are now either a repainted original with collapsed hardware or a 1990s steel replacement with a threshold that no longer seals. Up on Olympia's Westside in the 98502 zip code, 1960s ranch houses tell a different version of the same story: corroded aluminum patio door tracks, hollow-core interiors, and Z-flashing that was never properly installed behind the brick mold. Vladislav Volkov at TopVolk Construction — WA Licensed Contractor, 100+ projects since 2017 — has replaced doors in both scenarios. A fiberglass Therma-Tru door with proper self-adhering membrane flashing and a compressed foam threshold costs more upfront than a big-box steel unit. It's what actually lasts in a climate that rains from October through April without much of a break.

localContext: |
  The 98501 zip code covers Olympia's older core — downtown, the Capitol neighborhood, and the Eastside residential blocks near Capitol Lake. Construction here runs predominantly pre-1950: post-and-pier foundations, old-growth Douglas-fir framing, and door rough openings that have racked out of square over the decades. When a rough opening drifts more than 3/8 inch out of plumb, shimming alone won't fix it — you're looking at partial jamb replacement, and possibly header reinforcement with an LVL beam if the original framing was undersized for the span. Zip code 98512, covering south Olympia and the Tumwater-adjacent areas off Trosper Road and Capitol Boulevard, skews late-1970s through 1980s construction. Builder-grade hollow-core doors were standard throughout, casing splits around hinge screws after thirty-plus years of seasonal movement, and aluminum sliding patio doors have corroded tracks and lock strikes that no longer engage. The City of Olympia Building Division handles permits for work inside city limits; Thurston County Resource Stewardship covers unincorporated areas. Any door project involving framing changes — widening a rough opening, converting a window to a door, or adding a new exterior opening — requires a permit and a rough-in inspection before the wall gets closed up.

commonProblems:
  - title: "Entry Door Frame Rot in South Capitol Craftsman Homes"
    description: |
      The 1910s–1930s craftsman homes throughout the 98501 zip code — South Capitol, the Eastside, and the streets around Capitol Lake — have original Douglas-fir sills and bottom jambs that are often punky after a century of Thurston County moisture. It looks fine from the street. Poke the bottom of the door frame with a screwdriver and it goes in an inch or more. A new door unit installed into a rotted rough opening will fail within three to five years regardless of quality. The correct fix starts with removing the full door assembly, sistering any compromised structural framing, installing a new pressure-treated sub-sill and threshold pan, then flashing with self-adhering membrane before the door unit goes in. Therma-Tru Smooth-Star fiberglass handles Olympia's climate well — it doesn't absorb moisture, holds paint cleanly, and can be profiled to match craftsman trim details. Full entry replacement including frame-out and flashing runs $1,800–$3,200 depending on door size and hardware selection. Expect one to two days of work once materials arrive on site.

  - title: "Corroded Aluminum Patio Door Tracks on 1970s–1980s Ranch Homes"
    description: |
      Aluminum-frame sliding patio doors installed during the late 1970s and 1980s are a chronic problem in south Olympia and the Westside. After decades of condensation cycling in a 50-inch-annual-rainfall climate, the bottom track corrodes, fills with debris, and the door panel binds or jumps the track entirely. More critically, the lock strike and handle mechanism wear out — a door that doesn't latch is a security issue. Replacing a corroded sliding door unit requires careful measurement of the existing rough opening. Most 6-foot openings accept a Milgard Tuscany Series or Pella 250 Series vinyl-frame slider without structural modification. Converting to French doors or a multi-slide unit is a different scope — the header may need to be rebuilt with an LVL beam to handle the wider clear span. A straight patio door swap runs one to one-and-a-half days on site; a structural conversion adds a half day plus inspection time. The City of Olympia requires a building permit for any work involving framing modification, even on a patio door replacement.

  - title: "Navigating Permits for Door Work in Thurston County"
    description: |
      Swapping a door unit in an existing frame — same rough opening size, no framing changes — is generally permit-exempt in the City of Olympia. Once framing is involved, the rules change. Widening a rough opening, converting a window to a door, or installing an exterior door where none existed all require a building permit. Inside city limits, that goes to the City of Olympia Building Division. Unincorporated Thurston County falls under Thurston County Resource Stewardship. Plan review for a straightforward door conversion typically runs three to six weeks; projects with structural drawings or changes to the building envelope can take longer. TopVolk Construction LLC — WA Licensed Contractor — handles the full permit application as part of the project scope. Vladislav prepares the site plan, submits to the AHJ, and coordinates the rough-in inspection before the wall is closed. The person pulling the permit is the same person doing the work — no project coordinator relaying messages in between.

  - title: "What Door Installation Actually Costs in Olympia"
    description: |
      Scope drives price on door jobs. A basic interior door swap — new solid-core door, new casing on both sides, new hardware — runs $400–$900 per door depending on rough opening condition and door style. Exterior entry door replacement with frame-out, self-adhering flashing membrane, and a mid-range fiberglass door like a Masonite Belleville or Therma-Tru Pulse runs $1,500–$2,800. Converting a patio opening to French doors or a Marvin Elevate multi-slide system lands between $4,000 and $8,500 depending on structural work required and glass package. Smart lock integration — Schlage Encode Plus or August Wi-Fi Smart Lock — adds $200–$400 to any exterior door project. Materials typically account for 55–65% of total project cost; labor reflects the actual condition of the rough opening, not a flat rate. Older South Capitol homes with racked framing and rotted sub-sills cost more to do right than a clean 1990s tract home in 98503. TopVolk provides line-item quotes with no vague ranges. Call (206) 591-1096 to schedule a free on-site estimate.

  - title: "Weatherstripping Failure and Threshold Seal Breakdown"
    description: |
      Even a well-installed exterior door deteriorates in Olympia's climate if weatherstripping is neglected. Foam compression strips on the head jamb and side door stops typically last five to eight years before they lose their memory and stop sealing. The threshold seal — a vinyl sweep or interlocking aluminum threshold insert — wears faster on high-traffic entries. A door showing daylight around the frame or letting in a cold draft is adding meaningfully to heating costs each winter. The straightforward fix is new Pemko or Schlegel compression strip on the stops and head jamb, plus a replacement threshold with an adjustable vinyl insert. If the threshold itself has rotted or lifted off the sub-sill, the repair expands: pressure-treated blocking, new threshold pan flashing, and re-caulk at the brick mold. That full sill rebuild runs $350–$700 depending on extent of damage. If the door itself has racked more than 1/4 inch out of plumb due to foundation movement — a real pattern in older Eastside craftsman homes — ongoing weatherstripping maintenance stops being cost-effective. Replacement is the right call.

