title: "Olympia General Contracting — Thurston County Remodels"

intro: |
  The South Capitol Historic District in 98501 is some of the most rewarding and
  frustrating renovation territory in the state. Craftsman bungalows and Tudor revivals
  built between 1905 and 1935 sit on post-and-pier foundations, with original knob-and-tube
  wiring still running through walls and galvanized supply lines that have been quietly
  corroding for decades. Pull a wall on a kitchen remodel and you're suddenly coordinating
  an electrician, a plumber, and a structural engineer before the framing crew can close
  anything back up. That's general contracting — holding every thread together so the
  project doesn't unravel when a demo crew finds the first surprise. TopVolk Construction
  LLC has been doing exactly this across Olympia and Thurston County since 2023: 100+
  completed projects from full gut renovations to ADU additions, with Vladislav Volkov on
  every job site directly. Call (206) 591-1096 to start with a free on-site estimate.

localContext: |
  Housing in Olympia spans roughly a century of construction styles, and each era brings
  different renovation challenges. The blocks around Capitol Way and State Avenue in 98501
  lean heavily toward pre-war Craftsman and Colonial Revival homes — beautiful bones, but
  undersized floor joists, minimal wall insulation, and plumbing that predates copper by
  decades. Move east into 98503 near Lacey and the housing shifts to 1970s and 1980s
  ranchers and split-levels where the structures are sound but mechanical systems are
  original and well past their replacement window. Westside Olympia (98502) has a patchwork
  of mid-century construction along Mud Bay Road and Cooper Point Road, where lot sizes
  and setback requirements vary enough to complicate any addition or DADU application.
  Thurston County's permit center handles unincorporated parcels on the outskirts of the
  city, while the City of Olympia Development Services office processes permits for parcels
  inside city limits — two separate AHJs, two separate fee schedules, two different plan
  review timelines. Knowing which jurisdiction applies before pulling the first permit
  saves weeks, sometimes months.

commonProblems:
  - title: "Framing, Electrical, and Plumbing All Need the Same Wall at the Same Time"
    description: "On a full kitchen gut in Olympia's Westside, sequence matters more than
      almost anything else. The rough-in inspection has to happen before the drywall crew
      shows up — but the electrician can't finish rough-in until the plumber relocates the
      drain stack, and the plumber won't touch the stack until framing confirms the LVL
      beam header is in place over the new opening. One trade out of sequence and you're
      paying for three idle crews while a single problem gets resolved. On projects in the
      $80K–$150K range, poor MEP coordination routinely adds $6K–$12K in avoidable costs.
      TopVolk runs scheduling across all trades directly — no homeowner relaying messages
      between subs. Projects of this scope typically involve 6–10 inspections between
      rough-in and final. Call (206) 591-1096 to talk through how sequencing works on a
      project like yours."

  - title: "Demo Finds a Rotted Rim Joist — And the Budget Goes With It"
    description: "Olympia receives around 51 inches of rainfall a year, with moisture
      rolling in off Budd Inlet and sitting against north-facing foundations for months at
      a time. Rim joists on pre-war homes in the 98501 zip code are a consistent weak spot.
      Open a wall in a South Capitol bungalow and you may find the rim joist has been
      sitting damp against a foundation sill plate for thirty years. Replacing a compromised
      section with pressure-treated lumber, installing blocking between floor joists, and
      adding a proper vapor barrier is straightforward — but only if you've built a
      contingency into the budget. On homes built before 1960, a 10–15% structural
      contingency line is standard. Skipping it and hoping for clean demo is how projects
      go sideways fast. TopVolk writes structural contingency ranges into every contract
      for older houses, so the first demo surprise doesn't blow the whole job."

  - title: "City of Olympia Plan Review Delays Stall Projects for Weeks"
    description: "The City of Olympia Development Services office is the AHJ for all
      parcels inside city limits. Structural additions, ADUs, or any work that changes the
      building footprint requires a formal plan review — typically 4–8 weeks, sometimes
      longer during busy spring submission windows. Thurston County's permit center handles
      unincorporated parcels on the city's edges, running its own separate timeline.
      Submitting incomplete drawings — missing a site plan, omitting energy code
      documentation, or miscalculating FAR — is the fastest way to add 3–4 weeks to an
      already-long review cycle. TopVolk works with a licensed structural engineer and
      prepares permit documents that pass first-review consistently. As a WA Licensed
      Contractor, we pull permits directly, which means homeowners don't need a separate
      trip to the permit counter or a login to the online portal."

  - title: "Budget Overruns on $100K+ Projects from Disconnected Subcontractors"
    description: "Large-scope remodels — full kitchen overhauls, primary suite additions,
      whole-floor renovations — rarely go over budget because of expensive materials.
      They go over budget from coordination failures. A KitchenAid appliance package
      sitting in a garage for three weeks because the rough-in plumbing wasn't ready. A
      Mitsubishi mini-split head unit installed in the wrong location because HVAC and
      finish carpentry weren't talking to each other. Each delay costs real money: idle
      labor, storage fees, rebooking subs on shorter notice. On projects in the $100K–
      $200K range, avoidable coordination failures add $8K–$15K on average. TopVolk
      runs a single project ledger, tracks all sub schedules in one place, and takes
      financial accountability — deadline penalties are written into the contract, not
      just promised verbally at the kickoff meeting."

  - title: "ADU Additions Stall Over Setback and Lot Coverage Calculations"
    description: "WA HB 1337 (effective 2024) changed the statewide rules significantly —
      up to two ADUs per single-family lot, no owner-occupancy requirement, and parking
      exemptions near transit. But the bill didn't override local setback minimums, height
      limits (typically 24 ft for a DADU), or lot coverage maximums. Olympia city parcels
      near Priest Point Park or along the Deschutes waterfront in 98502 can have unusual
      setbacks from wetland buffers that shrink the buildable footprint considerably. FAR
      calculations, lot coverage, utility connection requirements, and whether a separate
      electrical service is needed all have to be worked out before a pre-application
      conference with the City. Getting this right on paper before breaking ground saves
      the cost of a redesign mid-build. TopVolk handles the pre-app conference and
      coordinates the permit package for ADU additions in the $90K–$175K range."

faq:
  - q: "How fast can TopVolk get to Olympia for a General Contracting consultation?"
    a: "Olympia is about 60 miles south of Seattle on I-5 — roughly an hour drive, give
      or take Tacoma Narrows traffic. TopVolk serves Olympia, Lacey, and Tumwater as
      regular service area. Scheduling a free on-site consultation typically takes 3–7
      days from your first call. Vladislav Volkov does the estimate himself — you're
      talking to the contractor, not a salesperson or a commissioned estimator. From
      site visit to written proposal with itemized line costs usually takes another
      5–7 business days. Call (206) 591-1096 to get on the schedule."

  - q: "What does a full renovation project cost in Olympia?"
    a: "For a complete kitchen and primary bath renovation — GE or Bosch appliance
      package, new cabinets, quartz countertops, full tile work — budget $80K–$140K
      depending on scope and finish level. Structural surprises in older 98501 homes
      (rim joist rot, undersized header openings, galvanized-to-copper plumbing
      retrofits) can add $10K–$25K on top of that. ADU additions typically run $90K–
      $175K all-in, depending on size, utility connection requirements, and whether
      the lot needs a grading permit. TopVolk provides direct quotes with itemized
      line costs — no vague ranges used to anchor a later change order. Call
      (206) 591-1096 for a free on-site estimate."

  - q: "What's the permit process for a remodel or ADU in Olympia?"
    a: "Projects inside Olympia city limits go through the City of Olympia Development
      Services office. For structural work or additions, plan review runs 4–8 weeks.
      Unincorporated Thurston County parcels use the county's permit center under a
      separate timeline and fee schedule. ADU projects under WA HB 1337 still require
      a building permit, electrical permit, and often a plumbing permit — three
      separate applications, three inspection tracks. TopVolk prepares and submits
      the full permit package, coordinates rough-in inspections, and manages final
      inspection sign-off. As a WA Licensed Contractor, we pull permits directly —
      homeowners don't have to navigate the portal or make a separate permit counter
      trip."

  - q: "Can you manage subcontractors, or do I need to find my own trades?"
    a: "TopVolk handles full subcontractor sourcing and management on every project.
      Electrical, plumbing, HVAC (including Mitsubishi mini-split and Rinnai tankless
      water heater installs), drywall hang/tape/mud, tile, and finish carpentry — all
      coordinated under one contract. There's no separate plumber interview, no chasing
      down three HVAC quotes. The blue tape walkthrough at project end happens with
      Vladislav present, not delegated to a site super. For projects in the $100K+
      range, having a single accountable general contractor rather than a patchwork of
      self-managed subs typically saves more than the GC markup — and eliminates the
      scheduling gaps between trades that quietly inflate timelines."

  - q: "What warranty does TopVolk provide on general contracting work in Olympia?"
    a: "Workmanship warranty is one year on all completed work. Manufacturer warranties
      pass directly to the homeowner — Hardie cement-board siding carries a 30-year
      limited warranty, Milgard windows come with a 10-year unit warranty, and
      structural lumber framing is covered per manufacturer spec. For moisture-sensitive
      work — crawlspace vapor barrier installation, Schluter Kerdi membrane in shower
      assemblies, flashing at roof-to-wall transitions — TopVolk uses materials rated
      for Pacific Northwest conditions. Olympia's wet season runs October through May
      and does real work on any improperly detailed joint or transition. If something
      fails within the first year due to installation error, it gets fixed. Response
      times are written into the contract, not just verbally committed."

  - q: "Do you work in Lacey and Tumwater, or only inside Olympia city limits?"
    a: "TopVolk covers Olympia, Lacey, and Tumwater, plus unincorporated Thurston County
      areas between them — including neighborhoods near Yelm Highway SE, Martin Way, and
      the Deschutes Parkway corridor. Lacey projects (98503, 98513) go through the City
      of Lacey permit center. Tumwater uses its own building department. All three are
      within easy range of each other, and the permit workflows are similar enough that
      the same project management approach carries across all three. For fall and winter
      project starts, early permit submission matters — pouring a foundation slab or
      framing an addition in the middle of Olympia's rainy season adds complexity.
      Call (206) 591-1096 to talk timing and scheduling for your project."