  - q: "What does power washing a deck or driveway cost in Olympia?"
    a: |
      Cedar deck washing with brightener runs $300–$600 for a standard
      400-square-foot deck. Concrete driveways are typically $200–$350 for
      a two-car pad with degreaser pre-treatment included. Cedar fence
      cleaning and brightening runs $350–$550 per 150 linear feet. Paver
      patio restoration starts around $250 for a small area and reaches
      $700–$900 for a larger multi-section project. What moves pricing is
      organic growth density, whether chemical pre-treatment steps are
      needed, surface material type, and whether the wash is standalone or
      part of a larger renovation scope. TopVolk provides exact line-item
      quotes after the on-site look — no vague ranges, no bait-and-switch
      add-ons. Call (206) 591-1096 to book a free estimate.

  - q: "Does power washing require permits in Olympia or Thurston County?"
    a: |
      The wash itself doesn't require a permit from the City of Olympia
      Permit Center or Thurston County Permit Assistance Center. If the
      power washing is part of a larger exterior renovation — deck
      replacement, re-siding, or ADU construction — those components go
      through the standard permit process with the City of Olympia
      (360-753-8314) or Thurston County for unincorporated parcels. One
      compliance issue that does apply: Thurston County's stormwater
      ordinance prohibits wash runoff containing detergents or bleach from
      entering storm drains. TopVolk, a WA Licensed Contractor, uses
      containment methods and is familiar with local runoff requirements
      before starting any chemical wash — this matters especially near
      drainage swales and paved surfaces connected to storm systems.

  - q: "What's the difference between soft washing and pressure washing for an Olympia home?"
    a: |
      Pressure washing runs 2,000–4,000 PSI and physically blasts
      contamination off hard surfaces — the right approach for concrete
      flatwork, brick, and composite material. Soft washing drops below 500
      PSI and relies on chemistry (sodium hypochlorite plus surfactant) to
      kill biologicals before a low-pressure rinse removes them. Cedar
      siding, T-111 panels, older composite decking, and painted surfaces
      cannot take high pressure — you end up with raised grain, blown fiber,
      and paint stripping that costs more to fix than the original cleaning
      job. For Olympia specifically, where moss and lichen penetrate deep
      into cedar grain, chemical kill via soft wash is more durable
      long-term than blasting alone. Most jobs on an Olympia property use
      both methods: soft wash on all wood and siding surfaces, surface
      cleaner attachment on concrete and pavers.

  - q: "How long before moss comes back after professional power washing in Olympia?"
    a: |
      On bare, unsealed surfaces in Olympia's climate, visible moss
      regrowth typically starts within one full wet season — 12 to 18
      months. Applying a post-wash preventive treatment like Wet & Forget
      Outdoor Concentrate to roof edges and north-facing siding extends that
      window to roughly three years. For cedar decks, applying Armstrong
      Clark Semi-Transparent or TWP 100 Series penetrating stain within two
      weeks of the wash and brightener step is the most effective long-term
      barrier — it fills open grain and reduces moisture absorption
      significantly. Booking the wash and stain as a single coordinated
      project is the right approach. Missing the window between wash and
      stain by more than two weeks in Olympia's fall or spring conditions
      means the wood begins re-oxidizing and the stain won't reach full
      penetration depth.

