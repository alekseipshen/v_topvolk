title: "Olympia Power Washing — Cedar, Concrete & Moss Prep"

intro: |
  By mid-October most years, the cedar decks in South Capitol are already
  growing moss on their north-facing boards. Olympia pulls in roughly 51
  inches of rain annually — more than Seattle's 37, more than most of the
  Puget Sound metro — and the short daylight hours from November through
  February mean shaded surfaces stay wet for days between rain events. Out
  on the Westside near Cooper Point Road, concrete driveways and paver
  patios develop a gray-green algae film by January that won't move with a
  consumer-grade Kärcher electric washer running 1,500 PSI. Getting moss
  and algae off cedar correctly requires soft-washing chemistry — typically
  a 1–2% sodium hypochlorite solution with surfactant, applied at low
  pressure, followed by an oxalic-acid brightener to open the grain before
  any stain coat will bond. TopVolk handles power washing as part of
  exterior renovation and prep work across Olympia and southern Thurston
  County. Call (206) 591-1096 to schedule a free on-site look with
  Vladislav directly.

localContext: |
  The craftsman and Foursquare homes along Legion Way SE and around Capitol
  Lake in the 98501 zip code were built with old-growth cedar siding and
  Douglas-fir trim — a lot of it still original. That wood has been
  absorbing Olympia's wet winters for 80 to 100 years. The grain is open,
  the oxidation deep, and hitting these surfaces with 2,500 PSI strips wood
  fiber and creates permanent furrows that trap moisture faster than the
  original moss ever did. Over on the Westside — zip code 98502, covering
  the Cooper Point Peninsula and the neighborhoods around Evergreen State
  College — most of the housing stock is late-1970s through early-1990s
  construction. That era brought T-111 plywood siding, early composite
  decks, and pressure-treated lumber decking with aging hardware that bleeds
  iron tannin into the deck boards in dark gray-black streaks. Plain
  pressure washing won't touch that staining — it needs a dedicated oxalic
  acid pre-treatment before any stain can bond. Thurston County's persistent
  fog and below-canopy moisture also accelerate lichen establishment on
  stone pavers and concrete flatwork, faster than most other counties in
  the Puget Sound basin.

commonProblems:
  - title: "Moss and Lichen on Cedar Decks in South Capitol and Eastside Neighborhoods"
    description: |
      Cedar decks under a Douglas-fir canopy in South Capitol and Olympia's
      Eastside neighborhoods face a compounded problem. The tree cover blocks
      sunlight from November through March, so deck surfaces never fully dry
      between rain events. Moss spores establish within a single wet season.
      Lichen — slower-growing but more damaging — physically roots into cedar
      grain and lifts surface fibers over time, creating channels where
      moisture infiltrates the framing below. Soft washing with a 1.5%
      sodium hypochlorite solution and downstream-injected Simple Green Oxy
      Solve kills the biologicals without pressurizing weathered cedar. After
      a 15-minute dwell, a 40-degree fan tip rinse at 800–1,000 PSI clears
      debris without grain damage. A 400-square-foot cedar deck runs
      $300–$600 for wash plus an oxalic acid brightener application — the
      brightener step is not optional if stain is going down afterward.

  - title: "Oil Stains and Efflorescence on Concrete Driveways in 98502 and 98503"
    description: |
      Concrete driveways across Olympia's Westside (98502) and East Olympia
      (98503) typically show two problems simultaneously: petroleum oil drips
      from older vehicles and efflorescence — white mineral salt deposits
      that leach through the slab when groundwater wicks up from below.
      Standard cold-water machines just redistribute oil contamination across
      the surface rather than lifting it. Purple Power industrial degreaser,
      applied undiluted with a 10-minute dwell, breaks the petroleum bond
      before we hit it with a 3,000 PSI hot-water unit and surface cleaner
      attachment. Efflorescence responds to a diluted muriatic acid
      application or a product like SealGreen Efflorescence Remover, run as
      a second step after the degreaser work. A standard two-car driveway
      runs $200–$350 depending on square footage and stain density — severe
      oil saturation with multiple drip zones adds about $75 for extended
      dwell time and re-treatment passes.

  - title: "Hardie Siding and Stucco Cleaning Before Exterior Repaint"
    description: |
      Hardie cement-board siding holds paint well on its own — but moss and
      algae on north-facing elevations act as a biological barrier that
      causes new paint to peel within two seasons in Olympia's climate. The
      correct prep sequence is a soft wash with a fan tip under 500 PSI and
      a bleach-surfactant solution, full rinse, then a minimum 48-hour
      drying window — often longer in Olympia's fall and spring conditions
      where ambient humidity stays above 80%. Stucco requires the same
      low-pressure approach but demands extra attention at control joints
      and cracks, where high-pressure water drives moisture into the
      substrate and causes spalling. TopVolk, a WA Licensed Contractor,
      coordinates the wash, dry time, and exterior paint schedule as a
      single project sequence rather than handing off between unrelated
      subs. A full exterior soft wash on a typical Olympia single-story runs
      $400–$700; two-story homes with multiple elevations run $600–$900
      depending on linear footage and access. Scheduling handoffs between
      wash and paint matter here — missing the dry window in fall costs
      weeks.

  - title: "Cedar Fence Cleaning Before Staining — the PNW Three-to-Five Year Cycle"
    description: |
      Cedar fences in Olympia go visibly gray within 18 months of
      installation if left unprotected, and most homeowners hit a restain
      cycle every three to five years. Before any penetrating stain goes on,
      the fence surface has to be fully cleaned and chemically brightened —
      stain applied over oxidized wood or lichen residue bonds blotchy and
      peels within one season. The cleaning process: a 2–3% sodium
      hypochlorite pre-soak with a 15-minute dwell, low-pressure rinse at
      1,200 PSI maximum with a 25-degree fan nozzle, then Defy Wood
      Brightener to neutralize bleach residue and open the grain for stain
      penetration. For the finish coat, Defy Extreme Wood Stain or Armstrong
      Clark Semi-Transparent both perform well on cedar in Thurston County's
      humidity levels. A 150-linear-foot fence runs $350–$550 to wash,
      brighten, and prep for staining, depending on board height and how
      deep the lichen has rooted into the grain.

  - title: "Paver and Concrete Patio Restoration — Organic Buildup in Shaded Olympia Yards"
    description: |
      Flagstone, concrete pavers, and brick patios in Olympia's tree-shaded
      residential yards accumulate moss, algae, and dark organic debris that
      create serious slip hazards and structurally undermine the joint
      material between stones. The main risk with aggressive pressure washing
      on pavers is joint displacement — polymeric sand blows out at high PSI,
      requiring reapplication and re-compaction afterward. Technique matters:
      a surface cleaner attachment at 2,500 PSI on concrete and denser
      pavers, dropping to 1,500 PSI with a 40-degree fan tip on brick and
      softer stone. A Wet & Forget or BioWash Organic Remover pre-treatment
      applied 24 hours before the main wash reduces the pressure needed to
      clear heavy organic buildup significantly. After cleaning, inspect and
      re-sand paver joints with polymeric sand, then seal with a penetrating
      paver sealer to slow biological re-establishment through the next wet
      season. Patio restoration runs $250 for a small courtyard up to
      $700–$900 for a larger multi-section project.

faq:
