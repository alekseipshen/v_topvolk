  - q: "How far is Olympia from your base, and how do consultations work?"
    a: |
      Olympia is roughly 65 miles south of Seattle via I-5. About an hour's drive under normal conditions — longer when traffic stacks through the JBLM corridor near Tacoma.

      TopVolk comes to Olympia regularly for active projects and new consultations. The sequence is simple: on-site walkthrough with Vladislav, then a written line-item quote within two to three business days, then permit application if needed, then project start. From first call to breaking ground takes two to six weeks depending on permit timing and your schedule. Call (206) 591-1096 to book a free on-site estimate. Vladislav does the consultation himself — not a sales rep.

  - q: "What does a bathroom remodel cost in Olympia?"
    a: |
      Scope drives the number more than anything else.

      A cosmetic refresh — new vanity, toilet, fixtures, and lighting on existing rough-in — typically runs $3,500–$6,500. A full gut-and-rebuild with tile, new shower, and waterproofing runs $12,000–$22,000. That's the common scope in Olympia's 1980s–90s homes. Master bath reconfigurations with a curbless walk-in shower, double vanity, radiant floor heat, and quartz surfaces can reach $28,000–$45,000 depending on fixture grade. The biggest cost variables: demo discoveries like subfloor rot or drain relocation, tile source, fixture brand, and whether rough plumbing changes are needed. The on-site estimate produces a written line-item quote — no vague ranges. Call (206) 591-1096 to schedule.

  - q: "Do I need a permit for a bathroom remodel in Olympia, and who handles it?"
    a: |
      Cosmetic work — swapping a vanity, replacing a toilet on the existing flange, new fixtures on existing supply lines — typically doesn't need a permit.

      Move a drain line, alter a wall, add an exhaust fan penetration through the roof, or change an electrical circuit and you're in permit territory. The City of Olympia Building Division handles permits inside city limits. Thurston County Building Division covers unincorporated areas around Lacey, Tumwater, and outlying neighborhoods. Plan review for a mid-scope remodel with drain relocation runs four to eight weeks through the city portal. TopVolk prepares drawings, submits the permit application, and schedules rough-in and final inspections as a WA Licensed Contractor. You don't track that process yourself.

  - q: "How do you make sure mold doesn't come back after the remodel?"
    a: |
      Three things: substrate waterproofing, correct ventilation, and proper caulk joints at all plane changes.

      No paper-faced drywall in wet zones. Cement board or equivalent behind tile, with RedGard liquid membrane or Schluter Kerdi over the shower pan and wet wall surfaces. Tile grout gets sealed after cure. Caulk — not grout — fills all floor-to-wall and wall-corner joints. Grout cracks at those joints. Caulk flexes. Exhaust fans sized at minimum 1 CFM per square foot of floor area, vented through the roof with a backdraft damper. Humidity-sensing Broan or Panasonic units run automatically when moisture spikes. That removes the human variable. Build those three elements in correctly from the start, and mold doesn't get the foothold it had before.

  - q: "How long does a bathroom remodel take from start to finish?"
    a: |
      A cosmetic refresh — vanity, toilet, fixtures, paint — runs two to three weeks of active work. Full gut-and-rebuild with tile, new shower, and plumbing rough-in changes takes five to eight weeks.

      Factor in permit timing if drain relocation or wall changes are involved. City of Olympia plan review adds four to eight weeks before work can start. Total calendar time for a permitted scope can reach three to four months from first call to final inspection. Complex master bath reconfigurations — moving walls, curbless shower, radiant floor — run eight to twelve weeks of active project time. Deadline commitments go into the contract with penalty clauses on TopVolk's side. If the project runs late without a valid reason, that's a cost TopVolk absorbs — not you.

  - q: "Do you work in Lacey, Tumwater, and other parts of Thurston County?"
    a: |
      Yes. Lacey, Tumwater, Yelm, and unincorporated Thurston County are all within the regular project area.

      Lacey and Tumwater each have their own building departments. Unincorporated areas go through Thurston County Building Division. TopVolk handles permit applications for all three jurisdictions as part of the project scope. Lacey's 98516 zip has a solid concentration of 1990s–2000s homes at the age where bathroom remodels make financial sense — original fixtures are failing and the layouts never worked well. Scheduling depends on current project load, but new consultations typically start within one to two weeks of first contact. Call (206) 591-1096 — Vladislav does all initial walkthroughs personally, so scope, timeline, and rough cost get answered in the first conversation.