title: "Olympia Bathroom Remodel — Fix What 50 Inches of Rain Does"

intro: |
  Olympia gets 50 inches of rain a year. That's more than Seattle. Bathroom walls absorb that moisture long before homeowners notice. Mid-century ranchers on the Eastside and old Craftsman homes in South Capitol trap decades of humidity inside wall cavities. Those walls were never sealed for modern bathroom use.

  By the time grout crumbles or a subfloor goes soft, water has been moving behind tile for a year or two. Modern waterproofing — Schluter Kerdi, RedGard — didn't exist when those bathrooms were first tiled. Ripping out a fiberglass surround in a 1960s split-level often uncovers OSB dark with mold. TopVolk Construction LLC has finished 100+ projects across Thurston and King counties since 2023. Moisture damage is the single most common issue found during on-site walkthroughs. Call (206) 591-1096 to schedule a free visit.

localContext: |
  The 98501 zip covers South Capitol and older blocks near the Capitol Campus. Many homes there date from 1910 to 1940. Cast-iron drain stacks. Post-and-pier foundations. Bathrooms retrofitted once or twice but never fully opened to the studs.

  Out in 98512, developments along Fones Road and Cooper Point Road date mostly to the 1980s and early 1990s. Builder-grade cultured marble. Fiberglass pan surrounds. Single-handle faucets that were never quality fixtures. The City of Olympia Building Division handles permits inside city limits. Thurston County Building Division covers unincorporated areas. Plan review for a full remodel with drain relocation runs four to eight weeks. Homes on the Westside with sloped lots often carry crawlspace humidity that surfaces as subfloor damage the moment grout cracks.

commonProblems:
  - title: "Waterproofing Failures Behind Original Tile in 1980s–90s Homes"
    description: |
      Fiberglass tub surrounds from the 1980s weren't built to last 40 years. The gel coat crazes. Seams open. Water gets behind the wall panel. In Olympia's climate, a failed surround doesn't just damage drywall — it damages framing.

      Opening a bathroom in a 1987 Eastside ranch typically means tile set in mastic directly on greenboard. That combination traps moisture instead of shedding it. The fix starts at the studs. Framing dries out first. Compromised wood gets treated. Then RedGard liquid membrane goes on the shower pan and lower wall. Schluter Kerdi goes over cement board for the main field. This adds two to three days to the timeline but stops the cycle from repeating. A full gut-and-waterproof on a standard 5x8 bathroom runs $9,000–$14,000 in Olympia, depending on demo discoveries and finish level.

  - title: "Outdated 1990s Fixtures and Layout Obsolescence in 98503"
    description: |
      Cultured marble vanity tops crack at the wall seam. The single-basin setup eats counter space. The chrome light bar above the mirror runs bulbs no longer made. Standard 1990s tract bathroom.

      The 98503 zip — Eastside Olympia, built mostly between 1985 and 1998 — has a high concentration of these layouts. Replacing the cultured marble top with quartz, swapping a builder-grade faucet for a Kohler or Moen Align, and installing recessed dimmer-compatible LED fixtures fixes both function and appearance at once. Vanity replacement with updated lighting and no tile work runs $3,500–$5,500 depending on vanity size and plumbing condition. If drain lines need moving for a wider vanity or double-sink setup, add $800–$1,400 for a licensed plumber rough-in. TopVolk coordinates the plumbing sub directly — one point of contact.

  - title: "Exhaust Fan Failures Driving Mold Into Ceiling Framing"
    description: |
      Olympia's mold problem usually starts with an exhaust fan venting into the attic. Builders in the 1970s and 1980s did this routinely. Moisture dumps into attic insulation, saturates it, and condenses on ceiling joists. By the time black spots appear on a bathroom ceiling, mold is already in the framing above.

      Fixing it means re-routing the exhaust duct to a roof penetration with a backdraft damper. The old fan goes too. A 50-CFM builder unit does almost nothing in a steam shower — 110 CFM minimum is the spec for full baths. Any mold in ceiling framing gets treated before closing back up. Broan and Panasonic both make quiet units with built-in humidity sensors that run automatically. Ventilation correction runs $450–$950 depending on duct routing distance and whether attic treatment is needed alongside the bathroom scope.

  - title: "Cast-Iron Drain Stack Rerouting in South Capitol Craftsman Homes"
    description: |
      South Capitol homes from the 1910s–1930s have cast-iron drain stacks running through interior walls. Heavy. Brittle with age. Not easy to reroute when a homeowner wants to move a toilet or convert a tub alcove to a curbless walk-in shower.

      Moving a toilet even 12 inches on a post-and-pier foundation means crawlspace work to re-stub the drain at the right slope. Cast iron also corrodes from the inside — scale narrows drain diameter over time, and old oakum joints fail and let moisture into the wall. A remodel in a 98501 Craftsman often includes partial drain replacement with ABS before any finish work starts. The City of Olympia requires a plumbing permit for drain line changes, with a rough-in inspection before walls close. Budget two to three extra weeks for the rough-in phase on homes with original cast-iron stacks, plus $1,500–$3,000 for open-wall discoveries.

  - title: "Walk-In Shower Conversions and Curbless Layout Reconfigurations"
    description: |
      Converting a tub-shower combo to a curbless walk-in shower is the most requested master bath job in Olympia right now.

      Getting the floor pitch right — 1/4 inch per foot minimum slope to the linear drain — means building up or cutting down the subfloor before tile goes down. Large-format porcelain (24x24 or 24x48) needs a flatter substrate than small mosaic. Schluter DITRA uncoupling membrane handles minor variation, but significant subfloor prep still takes a day or two. A recessed niche, tiled bench, and semi-frameless glass enclosure are the standard finish package. Full curbless conversion with large-format tile and semi-frameless glass runs $12,000–$19,000 depending on room size and fixture grade. ADA retrofits for aging-in-place add blocking in the wall framing for grab bars — under $200 during new work, $600–$900 to add after walls are closed.

