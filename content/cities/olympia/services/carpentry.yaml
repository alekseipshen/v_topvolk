title: "Olympia Carpentry — Craftsman Trim & Built-ins Done Right"

intro: |
  South Capitol's quiet blocks in 98501 — running south from the Washington State
  Capitol dome toward Boulevard Road — hold some of the most intact Craftsman
  bungalows in Thurston County. Built mostly between 1910 and 1935, these homes
  have original fir window seats, picture-rail molding, and built-in bookcases that
  are genuinely hard to replicate. Olympia averages around 50 inches of rain
  annually, and north-facing exterior trim pays the price first — cedar fascia goes
  soft from the inside out, moss works into the grain, and caulk at window casing
  joints fails long before anyone notices. Interior casework survives better, but
  damage happens fast when owners gut a room and strip the original trim without
  documenting the profile first, leaving mismatched casing around every door in the
  hallway. Vladislav Volkov at TopVolk Construction LLC has completed 100+ projects
  across the Seattle metro since 2023 and works Thurston County regularly for
  homeowners who want someone who actually understands miter profiles and period
  joinery — not just a nail gun and a tape measure.

localContext: |
  Olympia's housing stock splits pretty clearly by decade. The South Capitol Historic
  District in 98501 concentrates Craftsman and Colonial Revival homes built from
  1910 to 1940, where original Douglas-fir trim, plank-and-panel interior doors, and
  face-frame built-in cabinetry are the norm. Cross to the Westside in 98502 and the
  era shifts — mid-1950s through 1980s ramblers and split-levels with builder-grade
  hollow-core doors, delaminating oak-veneer baseboard, and no original built-ins
  whatsoever. Each era demands a completely different carpentry approach. In the
  historic district the work is about matching what's already there: same species,
  same profile, same backcut angle. In the post-war Westside stock, it's replacement
  and upgrade — pull the builder-grade trim and install something that actually fits
  the house. Thurston County's wet season runs October through May, and any exterior
  wood surface that wasn't back-primed on installation is working against the clock.
  Porch columns, rake trim, and fascia on north and west exposures are the first to
  show it.

commonProblems:
  - title: "Original Fir Trim Profiles Gone Soft or Damaged — South Capitol Bungalows"
    description: |
      Craftsman bungalows in the South Capitol neighborhood were almost universally
      trimmed with vertical-grain Douglas-fir — tight, paint-grade stock that held
      detail well. After 90 years and six coats of paint, soft spots hide under the
      surface where moisture wicked in through failed caulk at window casing joints.
      The fix isn't stripping paint — it's probing the substrate to see what's sound
      before pulling anything. Where the profile is complex (three-piece built-up
      window casing with back-band and bead detail), we run a matching profile on the
      router table using Freud carbide bit combinations to replicate the original
      geometry. Replacement stock is clear vertical-grain fir from a specialty lumber
      yard, not big-box finger-jointed pine that telegraphs grain movement through
      paint. A single window casing replacement in a South Capitol bungalow —
      including profile matching and paint-ready finish — runs $250–$450 per opening
      depending on size and whether the surrounding plaster needs patching.

  - title: "Stair Stringer Rot and Failing Treads on Pre-1960 Olympia Homes"
    description: |
      Exterior stairs on homes built before 1960 are a recurring issue across
      Thurston County — specifically the stringer, the diagonal structural member
      that carries the tread load to the ground. Original stringers were often solid
      Douglas-fir, and when the post or pier at the base settles or the stringer
      end-grain sits in a wet pocket against the foundation, rot works from the
      bottom up. By the time the tread surface feels spongy, the stringer may be
      40–60% compromised. Replacing just the treads without addressing the stringer
      is money wasted. Full stringer replacement means pulling the entire stair
      assembly, sistering or replacing the stringers with pressure-treated (PT)
      lumber, and installing new treads — 5/4 x 12 PT or cedar stock depending on
      the application and finish plan. A three-to-four-step entry stair rebuild with
      new stringers and treads runs $900–$1,500 depending on stringer count and
      whether the landing pad needs work.

  - title: "Built-In Window Seats and Bookcases — Restoration and New Installations"
    description: |
      A period-correct window seat with flanking bookcases is not something you buy
      from a catalog. The joinery involves face-frame construction, adjustable
      shelf-pin holes on consistent layout, a recessed toe-kick, and a seat box
      sized to the exact window rough opening and wall depth. For restoration in
      the 98501 zip code, matching existing casework means pulling a sample of the
      wood species, measuring existing door and drawer edge profiles, and sourcing
      hardware that reads period-appropriate. For new installations, semi-custom
      cabinet boxes — Aristokraft or similar — can be modified and face-framed to
      look truly built-in, or we fabricate the entire unit from birch plywood with
      solid-wood face frames. City of Olympia Development Services review is required
      if the installation touches any load-bearing wall. TopVolk is a WA Licensed
      Contractor and handles that coordination. Timeline for a full window-seat-and-
      bookcase installation: three to five days on site, plus two to three weeks for
      finish painting and hardware.

  - title: "Wainscoting and Beadboard Installation — The Details That Make or Break It"
    description: |
      Beadboard wainscoting looks simple until you're fitting panels against an
      out-of-plumb wall or a baseboard that's been through four remodels. Cap rail
      height is the first decision — typically 36 inches in dining rooms, 32 inches
      in hallways for period homes. Then comes the profile of the cap rail itself and
      whether the baseboard below gets replaced or the wainscot base shoe sits on
      top of it. In Olympia's 1920s plaster-over-lath walls, nothing is plumb or
      flat, so scribing each panel is required rather than cutting to a fixed
      dimension. MDF-based beadboard product like Metrie Classic is cheaper and
      dimensionally stable, but for historic homes we typically use solid poplar or
      paint-grade pine for the panels and solid hardwood for the cap rail — both
      hold a routed edge cleanly and paint without the edge-swell risk. Installed
      cost for wainscoting with cap rail in an average Olympia dining room runs
      $1,800–$3,200 depending on room perimeter and profile complexity.

  - title: "Cedar Fascia and Exterior Trim Replacement — Olympia's Rain Does the Work"
    description: |
      Fifty inches of annual rainfall and months of overcast humidity make exterior
      trim maintenance non-optional in Thurston County. Cedar fascia installed
      without a proper back-prime coat — paint on all six faces before the board
      goes up — typically starts checking and softening within 12 to 15 years.
      Once the fascia pulls away from the rafter tails or the trim behind the gutter
      backer separates, water gets behind the siding and into the wall cavity. The
      repair then becomes more than carpentry. Replacement means pulling gutters,
      cutting back compromised fascia, and installing new cedar or switching to
      Hardie cement-board trim board for a rot-proof solution. Hardie trim comes
      in 4/4 profiles that nail, cut, and paint like wood without the biological
      risk. Either way, every replacement piece gets back-primed before installation.
      Fascia replacement along a single roofline with gutter reinstall runs
      $15–$28 per linear foot depending on height, profile complexity, and material
      choice.

faq:
  - q: "How fast can you get to Olympia for a carpentry project?"
    a: |
      Olympia sits about 60 to 65 miles from the Seattle metro via I-5 — roughly
      an hour to 90 minutes depending on traffic south of Tacoma. For an initial
      site visit, Vladislav schedules Thurston County consultations on a rolling
      basis, typically within a week of first contact. Proposal turnaround after
      the visit is two to three business days. Actual project scheduling depends
      on scope: a stair stringer rebuild or wainscoting installation might start
      within three to four weeks; a custom built-in with specialty millwork runs
      six to eight weeks from signed contract to first day on site. Call
      (206) 591-1096 to discuss timing and get on the calendar.

  - q: "What does custom carpentry work cost in Olympia?"
    a: |
      Scope drives the number. A single window-seat box with hinged lid and simple
      face frame runs $1,200–$2,200. A full flanking-bookcase installation with
      adjustable shelves, crown, and paint-ready finish is more like $4,500–$9,000
      depending on width, height, and wood species. Stair stringer rebuilds start
      around $900 for a three-step entry stair. Wainscoting with cap rail in a
      standard dining room runs $1,800–$3,200 installed. These numbers come from
      completed Thurston County jobs, not national averages. Vladislav provides a
      line-item quote after seeing the space, and the contract includes a penalty
      clause if milestones are missed — so the timeline you sign is the one that
      gets honored. Free on-site estimate: call (206) 591-1096.

  - q: "Do I need a permit for carpentry work in Olympia?"
    a: |
      Most interior finish carpentry — trim replacement, built-ins, wainscoting,
      interior door swaps — falls below the permit threshold under City of Olympia
      Development Services guidelines. Work that touches structure is a different
      question. If a built-in installation requires wall modification, or a stair
      rebuild changes the stringer-to-rim-joist connection at the deck frame, a
      permit through City of Olympia Development Services is likely required. Homes
      in the South Capitol Historic District face an additional layer: exterior work
      visible from the street goes through design review, which can add four to
      eight weeks to the process. TopVolk is a WA Licensed Contractor and handles
      permit coordination with the city — we flag what's required during the site
      visit so nothing stalls the project mid-construction.

  - q: "Can you match existing trim profiles in a historic Olympia home?"
    a: |
      Yes — and it requires more than just buying the closest stock profile at a
      lumber yard. Original Craftsman trim was milled to patterns that no longer
      exist in standard production: 3/4-inch back-band, 1/4-inch bead, compound
      casing builds that used three or four individual pieces to achieve the final
      look. We document the existing profile before pulling any damaged sections,
      then either source matching stock from a specialty millwork shop or run the
      profile in-house using Freud router bit combinations on a router table.
      Replacement material is the same species as the original wherever possible —
      vertical-grain Douglas-fir or clear pine — so paint adhesion and grain
      movement match across old and new sections.

  - q: "How long does carpentry work last, and what's your warranty?"
    a: |
      Structural and load-bearing carpentry — stair stringers, framing-connected
      built-ins — carries a two-year workmanship warranty against defects in
      joinery and fastening. Finish carpentry longevity depends heavily on what
      goes on top of it. Raw or poorly primed wood in Olympia's climate will check
      and fail within a few seasons; properly back-primed and painted trim can
      hold 20 to 30 years without intervention. Exterior work like cedar fascia
      replacement is warranted two years on workmanship; Hardie cement-board trim
      carries a manufacturer 30-year limited product warranty separately. Interior
      built-ins done right are essentially indefinite — the original fir casework
      in South Capitol bungalows has held for over a century. The finish system
      and the quality of the joinery underneath it are what determine the lifespan.

  - q: "Do you cover Tumwater, Lacey, and other areas near Olympia?"
    a: |
      Thurston County is part of the regular service area for larger projects.
      That includes Tumwater, Lacey, and unincorporated Thurston County areas
      east toward Yelm and south toward Tenino. For projects in the $8,000-and-up
      range — full built-in installations, stair rebuilds, substantial exterior
      trim replacement — the drive from the Seattle metro is factored into the
      project scope and not billed as a separate travel charge. Smaller repair-only
      calls in Thurston County are evaluated individually. Scheduling typically
      mirrors King and Pierce County timelines. Call (206) 591-1096 or reach out
      through the website to talk through your project and set up a site visit.