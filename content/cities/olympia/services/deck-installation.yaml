title: "Olympia Deck Installation — Boards Built for 51 Inches of Rain"

intro: |
  Percival Landing's waterfront boardwalk gives you a look at what Olympia's climate does to
  exposed wood — gray, weathered, and moss-spotted within a few wet seasons. Thurston County
  pulls 51 inches of rain annually, more than Seattle, with the bulk of it arriving October
  through May. On the Eastside, around zip code 98501, mid-century ranchers from the 1960s
  and early 1970s often have original pressure-treated decks built without proper ledger
  flashing — water has been wicking into the rim joist for decades. Westside Olympia in 98502,
  near the Harrison Avenue corridor, has a heavy run of late-1980s and 1990s suburban builds
  where builder-grade PT decks are hitting the 25-30 year mark and need full replacement from
  the footings up. Vladislav Volkov has completed 100+ projects since 2023 across the Seattle
  Metro and south into Thurston County — call (206) 591-1096 to schedule an on-site assessment
  before another wet season lands on rotted framing.

localContext: |
  South Capitol, the blocks around 5th and 7th Avenues in 98501, runs heavy on Craftsman
  bungalows from 1910 through the early 1930s. Those homes sit on post-and-pier foundations
  with narrow rear lots — a deck addition there means a careful structural evaluation, because
  the original framing wasn't sized for a 350-400 square foot platform load. Lacey and
  Tumwater, both part of the same suburban sprawl pattern in the 98503 zip, pull more toward
  1980s tract builds where composite decking wasn't available and pressure-treated pine was the
  only option. The City of Olympia Development Services handles permits for properties within
  city limits; Thurston County Resource Stewardship covers unincorporated parcels. Deck
  projects over 200 square feet, attached to the house, or more than 30 inches above grade
  require a building permit either way. The Olympia plan review queue currently runs 3-6 weeks
  for a standard residential deck submission with framing drawings and a ledger detail.

commonProblems:
  - title: "Cedar vs. Composite — Making the Right Call for Olympia's Wet Climate"
    description: |
      Cedar decking looks sharp in September. By its third Olympia winter, the north-facing
      boards are splitting at the end grain, the surface is coated in black mildew, and the
      whole deck needs stripping and resealing to look presentable. Trex Transcend and
      TimberTech Azek capped composite boards cost more upfront — roughly $35-$55 per square
      foot installed versus $20-$30 for cedar — but both carry 25-year fade and stain
      warranties and shed moisture rather than absorbing it. The capped polymer surface on
      Azek boards resists mold growth specifically, which matters on north-facing Olympia
      lots with Douglas-fir canopy blocking afternoon sun from October through March. For
      heavily shaded Eastside lots in 98501 where the deck surface stays damp for weeks at a
      stretch, composite isn't a luxury upgrade — it's the practical choice that won't require
      annual maintenance calls by year five.

  - title: "Ledger Board Flashing and Rim Joist Rot — Where Old Decks Actually Fail"
    description: |
      The ledger board is the structural member that connects the deck frame to your house,
      and it's the most common failure point on Olympia's older decks. A ledger installed
      without proper flashing drives water straight into the rim joist, and with 51 inches of
      annual rain, that rim joist can be fully saturated and deteriorating while the deck
      surface above it looks fine. Westside homes in 98502 built before the 2006 IRC updates
      that formalized ledger flashing requirements are exactly where we find this. The repair
      means pulling the old ledger, assessing the rim joist for sister joist reinforcement,
      installing a continuous Vycor tape or Trex Protect flashing layer over the sheathing,
      and reattaching with LedgerLOK structural fasteners at 16 inches on center. Depending
      on how much rim joist framing needs sistering, that repair alone adds $800-$2,000 to
      a project — but skipping it means the new deck rots from the house side outward within
      a decade.

  - title: "Post Footings and Ground-Contact Lumber — Frost Depth and Decay Resistance"
    description: |
      Deck posts bear the full load of the platform above, and their footings need to bear on
      undisturbed soil below the frost line. Olympia's frost penetration is shallow — 12-18
      inches is the standard for Thurston County — but footings that sit in disturbed fill or
      don't reach bearing soil will shift and settle. Ground-contact pressure-treated lumber
      rated UC4B is required wherever wood contacts concrete or soil directly; standard PT
      2x10 joists are UC3B rated and should never be set in concrete. On Lacey and Tumwater
      lots in 98503 where the original builder used 4x4 PT posts set directly in tube form
      concrete without a standoff base, moisture traps at the post-footing interface and
      accelerates decay even in treated wood. Simpson Strong-Tie APSL adjustable post bases
      or surface-mount standoffs solve this — they keep the post end grain above the concrete
      surface. Thurston County inspectors check footing depth and post connection hardware
      at rough-in inspection before any framing proceeds.

  - title: "Deck Permits in Olympia — What the Application Actually Requires"
    description: |
      City of Olympia Development Services requires a building permit for any attached deck,
      any deck over 200 square feet, or any deck surface more than 30 inches above grade.
      Unincorporated Thurston County parcels go through the County Resource Stewardship
      building division instead. Either way, the application package needs a site plan showing
      setbacks from property lines, a framing plan referencing span tables for joist and beam
      sizing, and a ledger flashing detail drawing. Permit fees for a typical 300-400 square
      foot deck run $400-$750 in Olympia. What fails inspection most often: guardrail height
      under 36 inches, baluster spacing over 4 inches clear, stair rise outside the 4-7/8"
      to 7-3/4" IRC range, and ledger flashing installed differently than the approved
      drawings. TopVolk is a WA Licensed Contractor — we pull the permit, prepare all
      drawings, and attend every inspection. Call (206) 591-1096 to get the process started.

  - title: "Guardrails and Stair Stringers — Code Details That Fail Final Inspection"
    description: |
      Guardrail code catches more decks at final inspection than any other single item.
      IRC Section R507 requires guardrails on any deck surface 30 inches or above grade,
      minimum 36 inches high, with baluster spacing no greater than 4 inches clear — the
      "4-inch sphere rule." Stair stringers have their own requirements: rise between
      4 inches and 7-3/4 inches, run at least 10 inches, and handrails must be graspable
      with a round profile between 1-1/4" and 2" diameter. On steep South Capitol lots in
      98501 where grade drops sharply away from the house, stairs often require an
      intermediate landing to keep the rise-run ratio in code. Longer stair runs need
      stringer sizing reviewed against IRC span tables — a 3-stringer system on a 14-foot
      stair run is engineered differently than the standard 2-stringer on a 5-foot drop.
      Olympia inspectors measure guardrail height and baluster spacing at final inspection,
      and a failed inspection adds weeks to your timeline.

faq:
  - q: "How fast can you get to Olympia for a deck project?"
    a: |
      Olympia is about 60 miles south of Seattle on I-5 — roughly an hour in light traffic,
      closer to 90 minutes when Tacoma backs up. We schedule Thurston County site visits in
      batches to make the drive efficient, so most Olympia homeowners can get an on-site
      consultation within 1-2 weeks of first contact. After the estimate and contract,
      City of Olympia permit review adds 3-6 weeks, and Trex or TimberTech material
      procurement adds another 2-3 weeks depending on color and profile availability.
      Total timeline from first call to boards down: roughly 10-16 weeks for a standard
      attached deck. Call (206) 591-1096 to get on the schedule.

  - q: "What does deck installation cost in Olympia?"
    a: |
      A pressure-treated wood deck in the 200-300 square foot range, fully permitted and
      installed in Olympia, runs $18,000-$28,000. Composite decking with Trex Transcend
      or TimberTech Azek adds 30-50% to material cost but eliminates annual sealing and
      the moss cycle that hits cedar by year three. Second-story decks with structural
      ledger work and an under-deck drainage system land in the $38,000-$60,000 range.
      Pricing shifts based on deck height above grade, stair complexity, guardrail linear
      footage, and whether the rim joist needs sistering. Vladislav provides a written
      line-item quote after the on-site visit — no ranges, no allowances. Free on-site
      estimate: call (206) 591-1096.

  - q: "Who handles the permit for a deck project in Olympia, and what does it cost?"
    a: |
      TopVolk pulls the permit as the WA Licensed Contractor of record — you don't file
      anything yourself. Projects within Olympia city limits go through City of Olympia
      Development Services; unincorporated Thurston County parcels go through Thurston
      County Resource Stewardship. We prepare the site plan, framing drawings, and ledger
      detail. Permit fees typically run $400-$750 for a standard residential deck in
      Olympia, and that cost is included in the project quote. Plan review takes 3-6 weeks.
      We schedule and attend rough-in inspection (after footings and framing, before decking)
      and final inspection (after railings and stairs). You get the final sign-off paperwork
      when the job is complete.

  - q: "Cedar or composite — which actually holds up better in Olympia's rain?"
    a: |
      Composite wins for open, exposed decks in Olympia — full stop. Trex Transcend and
      TimberTech Azek both use a capped composite core that doesn't absorb moisture,
      resists mold growth, and holds its color under UV without periodic sealing. Cedar
      in Olympia's 51-inch annual rainfall starts checking and graying within two to three
      seasons on any surface that doesn't get regular afternoon sun. Shaded north-facing
      decks, or any deck under mature Douglas-fir canopy, will have visible moss by fall
      of year two if cedar is used. Cedar still makes sense for covered outdoor rooms where
      the boards stay significantly drier — the natural look is worth it in that context.
      For everything else in 98501 and 98502, composite is the maintenance-free decision.

  - q: "How long does the full deck project take from first call to final inspection?"
    a: |
      Here's the realistic breakdown for a standard 300 square foot attached deck in Olympia:
      1-2 weeks for on-site estimate and contract execution, 3-6 weeks for City of Olympia
      permit review, 2-3 weeks for composite material procurement (Trex and TimberTech lead
      times vary by color and season), and 7-12 days of active construction. That puts
      total timeline at 13-23 weeks depending on permit queue and material availability.
      Larger projects — second-story decks, multi-level platforms, custom under-deck
      drainage — add 2-4 weeks to construction. Milestone dates and penalties for missed
      deadlines are written directly into the TopVolk contract, not left as verbal
      commitments.

  - q: "Do you build second-story decks with under-deck drainage in Olympia?"
    a: |
      Yes. A deck built over living space needs a waterproofing system to keep the structure
      below dry — we install Trex RainEscape channel drainage, which runs between the
      joists and directs water to a gutter at the deck's edge rather than letting it drip
      through the board gaps. The structural requirements step up too: LVL beam sizing,
      PSL posts, joist hangers at every connection, and a full ledger flashing assembly
      with Vycor tape behind the ledger board. These projects typically run $40,000-$65,000
      for a 400-500 square foot platform with a single stair run and standard guardrail.
      We cover Olympia, Lacey, Tumwater, and surrounding Thurston County areas. Call
      (206) 591-1096 to set up an on-site consultation.