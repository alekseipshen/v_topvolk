title: "Olympia Flooring — Subfloor Moisture & Hardwood Done Right"

intro: |
  South Capitol's Craftsman bungalows sit on post-and-pier foundations and have been
  collecting moisture for over a century. Olympia pulls close to 50 inches of rain
  annually — significantly more than Seattle — and that humidity works into crawlspaces,
  rises through subfloor decking, and shows up as cupping or gapping in hardwood floors
  that went down without proper moisture testing first. The older blocks near Percival
  Landing and the Capitol Campus area are full of homes where someone has layered three
  or four different floor coverings over original Douglas-fir planks, each layer
  compounding the subfloor height problem. Before any hardwood goes down, we run a
  Tramex moisture meter across the subfloor at multiple points — targeting below 12% MC
  for solid hardwood, checking the slab separately if one's involved. TopVolk
  Construction LLC — WA Licensed Contractor, 100+ projects completed since 2023 —
  handles flooring work directly through owner Vladislav Volkov. Call (206) 591-1096
  to schedule a free on-site estimate with no sales staff in the middle.

localContext: |
  Olympia's residential housing spans a lot of eras compressed into a small footprint.
  Zip code 98501 covers downtown and South Capitol, where the oldest stock lives —
  homes built 1905 to 1935, original fir subfloors, galvanized plumbing, crawlspaces
  that stay damp from October through May. Over in 98502 (west Olympia), the housing
  shifts toward mid-century ranchers and split-levels from the 1960s and '70s — many
  with 9x9-inch vinyl tile in the kitchen that tests positive for chrysotile asbestos.
  That's not a flooring project you hand off to an unlicensed handyman. The Westside
  and Bigelow neighborhoods have a mix of 1990s and early-2000s construction where
  engineered hardwood or LVP is the right call — especially on any slab-on-grade
  section where solid hardwood would fail the moisture test inside a year. Thurston
  County's wet winters mean crawlspace vapor barriers are non-negotiable before any
  wood product goes down, and the acclimation window for solid hardwood is longer here
  than what most manufacturer installation guides assume.

commonProblems:
  - title: "Subfloor Moisture Failing the Hardwood Acclimation Window"
    description: |
      Hardwood acclimation in Olympia takes longer than the bag says. Most manufacturers
      require 4-7 days at 60-80°F and 35-55% relative humidity. In a South Capitol
      bungalow in November, interior RH can hit 70% before the heating system stabilizes.
      We use a Tramex moisture meter on every hardwood job — testing the subfloor at
      multiple points across the room, not just one corner near the door. For solid
      hardwood, subfloor MC needs to be below 12%. For engineered hardwood, some
      products allow up to 14%, but you have to check the specific manufacturer's
      installation spec, not assume. If numbers come in high, a dehumidifier runs for
      5-7 days before acclimation begins. Skipping this step voids the Mirage or Shaw
      manufacturer warranty and results in cupping within the first wet season —
      and neither brand will cover it without the pre-installation moisture documentation.

  - title: "Vinyl Asbestos Tile Hidden Under Kitchen and Utility Room Floors"
    description: |
      Mid-century homes in the 98503 zip — built roughly 1955 to 1975 — commonly have
      9x9 or 12x12 VAT in kitchens and utility rooms. The black mastic adhesive
      underneath is also suspect. Disturbing VAT without proper abatement is an EPA
      violation under NESHAP rules, not just a health risk. Before any flooring
      installation begins in homes of that era, samples go to a certified lab — 48 to
      72-hour turnaround. If abatement is required, cost runs $800 to $2,500 depending
      on square footage and how accessible the subfloor is. After clearance, we install
      DriCore subfloor panels over concrete slab areas to handle residual moisture, then
      the new LVP or engineered hardwood on top. This sequence adds 1-2 weeks to the
      schedule. Not optional. The alternative is a flooring failure and a hazmat
      situation layered on top.

  - title: "Matching Original 2-1/4 Inch Oak Strip Flooring in Restoration Projects"
    description: |
      Historic blocks near the Capitol Campus have homes with continuous 2-1/4-inch red
      or white oak strip flooring running through every room. Adding a space, widening a
      doorway, or finishing a hallway means the new section has to match — grain, width,
      and sheen. Standard strip widths at local lumber yards now run 3-1/4 inch or wider.
      Original 2-1/4-inch material requires a specialty supplier, sourced regionally and
      brought in unfinished. Custom-blending stain to match 80-year-old patina takes two
      or three test samples on scrap pieces before we commit to a formula for the actual
      floor. The City of Olympia's Community Planning and Development department doesn't
      require a permit for flooring replacement itself, but if the scope involves any
      structural subfloor work — sistering joists, replacing a rim joist section — that
      triggers a permit under IRC. TopVolk Construction LLC, WA Licensed Contractor,
      handles all required documentation and coordinates inspections when the project
      scope demands it.

  - title: "Choosing Engineered vs. Solid Hardwood on Slab-on-Grade in West Olympia"
    description: |
      A lot of 1990s and early-2000s construction in 98502 sits on slab foundations,
      not crawlspaces. Solid hardwood expands and contracts with moisture cycling and
      needs an elevated subfloor assembly to perform reliably on a slab — without one,
      cupping and gapping show up within a year in Olympia's climate. Engineered hardwood
      solves this with a cross-ply plywood core that's dimensionally stable. Boen and
      Lauzon 4mm-wear-layer products handle Thurston County's humidity cycling without
      the failure risk. Direct glue-down to concrete using Bostik's Best adhesive is one
      method; floating over 1/8-inch cork or Quiet Walk underlayment is another. Installed
      cost for engineered hardwood in west Olympia runs $8-$14 per square foot depending
      on species, grade, and subfloor prep. LVP runs $5-$9 installed — a reasonable
      alternative when the aesthetic matches the project and moisture risk is high.

  - title: "Underlayment Selection for Sound Control in Olympia Condos and Multi-Family"
    description: |
      Downtown Olympia and the Capitol Mall corridor have a growing number of condo
      conversions and multi-family units. Most HOA governing documents require IIC (Impact
      Insulation Class) ratings of 50 or above for any hard surface flooring — some
      buildings require IIC 60. Standard foam underlayment doesn't come close to those
      numbers. Cork-backed LVP or Schluter Ditra-Heat get closer, but serious sound
      control needs a product like QuietWalk Plus (rated IIC 66) or Acoustimat III under
      a floating floor assembly. HOA approval in Olympia-area condo associations typically
      runs 2-4 weeks — we prepare the product spec sheets and STC/IIC documentation for
      the review board so the homeowner isn't chasing down data sheets. Total installed
      cost for LVP over QuietWalk Plus runs $7-$11 per square foot. Deadline for the
      project is written into the contract with a penalty clause — if we miss the agreed
      completion date, that has financial consequences for us, not just an apology.

faq:
  - q: "How fast can TopVolk get to Olympia for a flooring estimate?"
    a: |
      Olympia sits about 60 miles south of Seattle — roughly an hour down I-5 depending
      on Tacoma traffic. Site visits for Thurston County projects get scheduled on
