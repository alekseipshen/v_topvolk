      showing up to measure. Call (206) 591-1096 to set up a free on-site consultation.

  - q: "What does hardwood flooring installation cost in Olympia?"
    a: |
      Solid hardwood installed in Olympia runs $9-$16 per square foot for material and
      labor, depending on species, grade, and subfloor prep required. Engineered hardwood
      runs $8-$14 installed. LVP comes in at $5-$9. Those ranges shift depending on
      whether demo is included, whether the subfloor needs sistering or leveling, and
      whether you're matching existing 2-1/4-inch strip flooring — which adds material
      sourcing time and cost. Subfloor moisture remediation, if the test numbers demand
      it, adds $300-$800 before installation begins. We quote exact line-item pricing
      after the site visit — no vague estimates, no surprise change orders mid-project.
      Call (206) 591-1096 to schedule.

  - q: "Does flooring installation in Olympia require a permit from the city?"
    a: |
      Standard flooring replacement — removing carpet, installing LVP or hardwood — does
      not require a permit from the City of Olympia's Community Planning and Development
      department. If the scope involves structural subfloor repairs like sistering joists
      or replacing rim joist sections, that work may trigger a building permit under IRC
      requirements. Condo units governed by HOA rules almost always require an HOA
      application with product specification sheets before work begins — separate from
      city permits. Homes in South Capitol's historic overlay zone may involve a design
      review if adjacent exterior elements are touched. TopVolk Construction LLC — WA
      Licensed Contractor — handles permit applications and HOA documentation when the
      project scope requires it. We've been through this process enough to know what
      actually needs paperwork and what doesn't.

  - q: "Do you coordinate asbestos tile removal before flooring installation?"
    a: |
      Testing comes first on any pre-1980 home in Olympia, especially in the 98501 and
      98503 zip codes where mid-century construction is common. Samples go to a certified
      lab with 48-72 hour turnaround. If abatement is required, a licensed abatement
      contractor handles that phase — TopVolk coordinates the sequence rather than leaving
      the homeowner to manage two separate contractors independently. After clearance, we
      pick up the flooring installation. Timeline impact is typically 1-2 added weeks
      depending on abatement scope. Call (206) 591-1096 and we'll walk through the full
      sequence before you commit to a start date.

  - q: "What warranty covers new flooring installed by TopVolk in Olympia?"
    a: |
      Warranty comes from two sources: the manufacturer and TopVolk's installation
      workmanship. Engineered hardwood brands like Boen and Lauzon carry 25-50 year
      structural warranties and 10-25 year finish warranties when installed to their
      spec — which is exactly why pre-installation moisture testing gets documented.
      COREtec LVP carries 15-30 year residential warranties depending on product line.
      Our workmanship warranty covers installation defects — subfloor prep, fastener
      pattern, transition strips, and seaming — for 2 years. More concretely: the
      project completion deadline is written into the contract with a penalty clause.
      Missed deadlines have financial consequences for us. That's in writing before
      work starts.

  - q: "Does TopVolk serve Lacey, Tumwater, and other Thurston County areas near Olympia?"
    a: |
      Yes. Lacey (98503, 98516), Tumwater (98512), and unincorporated Thurston County
      are all within our Olympia-area service range. Permit work in unincorporated
      Thurston County goes through the Thurston County Resource Stewardship department
      rather than the City of Olympia's permit center — different forms, same general
      review timeline. Site visits in Lacey and Tumwater get scheduled alongside Olympia
      visits on the same day to make the drive efficient. From South Olympia, both cities
