title: "Olympia Foundation Repair — Crawlspace & Seismic Retrofit"

intro: |
  The Washington State Capitol sits on engineered ground above tidal flats, and the residential
  blocks radiating outward from it — South Capitol, Bigelow, the Eastside — share some of that
  same complicated geology. Thurston County soils run heavy with marine clay and glacial till,
  and Olympia pulls in over 50 inches of rain per year, noticeably more than Seattle. That clay
  absorbs water and swells through the wet months, then dries and contracts by July — a seasonal
  cycle that works against post-and-pier foundations under 1920s bungalows near Percival Landing
  and against concrete stem walls in the 1960s ranchers on the Westside. By the time a homeowner
  notices a door frame racking or a floor feeling springy underfoot, the supports underneath may
  have been shifting for years. TopVolk Construction LLC — WA Licensed Contractor, 100+ projects
  completed since 2023 — handles foundation repair across Thurston, Pierce, and King counties.
  Vladislav Volkov does the site assessment himself. Call (206) 591-1096 to schedule a free
  on-site visit.

localContext: |
  Zip code 98501 covers downtown Olympia and the South Capitol neighborhood — blocks of
  Craftsman bungalows and simple two-stories built between 1910 and 1945, most of them on
  post-and-pier foundations with original Douglas-fir framing. Those piers were often set
  directly on concrete pads or cedar rounds, which have been absorbing crawlspace moisture for
  70 to 80 years. Move out toward the Westside in 98502 and the housing shifts to 1960s and
  1970s concrete stem wall construction — a sturdier setup, but those walls crack as the marine
  clay underneath cycles through wet and dry seasons. Both areas sit in a moderate-to-high
  seismic zone. Homes built before current IRC seismic provisions typically lack properly bolted
  mudsills and shear wall plywood panels on cripple walls, which is a real exposure in Thurston
  County's seismic risk profile. Crawlspace drainage is an issue throughout. The water table near
  Capitol Lake and the tidal flats stays elevated from October through May, and a crawlspace
  without a working vapor barrier and active drainage will show wood rot, fungal growth, and
  eventually compromised floor framing above.

commonProblems:
  - title: "Post-and-Pier Settlement in South Capitol's Pre-War Bungalows"
    description: |
      South Capitol bungalows built in the 1920s and 1930s rely on post-and-pier foundations
      that were never engineered for permanent stability — they were shimmed to level at
      construction and expected to be re-shimmed over time. After 80-plus years of Olympia's wet
      seasons, the original cedar or fir posts have often rotted at the base where they contact
      the concrete pier. The repair involves sistering new pressure-treated (PT) lumber posts
      alongside the originals, re-leveling the beam, and adding Simpson Strong-Tie adjustable
      post bases to keep new posts off the concrete surface. In worse cases, the concrete pier
      itself has settled and needs replacing with a poured pad set below the frost line. A typical
      crawlspace post-and-pier reinforcement job in a 1,500-square-foot South Capitol bungalow
      runs $8,000–$18,000 depending on access, failing pier count, and whether floor framing
      above needs sistering. Timeline: 3–6 days on-site once permits clear.

  - title: "Diagonal Stem Wall Cracking in 1960s Westside Ranchers"
    description: |
      Concrete stem walls crack in two ways that mean different things. Vertical hairline cracks
      from shrinkage are usually stable and can be sealed with Sika epoxy injection to stop
      moisture intrusion. Diagonal cracks — especially ones running from a window corner down
      toward the footing — indicate differential settlement, meaning one section of the
      foundation has moved more than the rest. On the Westside in 98502, this pattern turns up
      regularly in late-1960s ranchers where original soil prep was minimal and the marine clay
      underneath has compressed unevenly over decades. Depending on severity, the repair ranges
      from crack stitching and polyurethane injection ($1,500–$4,000 for stable cracking) to
      installing helical piers to stabilize the settling corner ($6,000–$14,000 for a two- to
      three-pier installation). Active settlement needs helical piers. Stable cracking that has
      not progressed in two or more years can usually be sealed and monitored.

  - title: "Seismic Retrofit — Mudsill Bolting and Cripple Wall Bracing"
    description: |
      Homes built in Olympia before roughly 1995 were often constructed without anchor bolts
      connecting the mudsill to the foundation, or with bolts spaced too far apart to meet
      current IRC seismic requirements. During a Cascadia Subduction Zone event — a realistic
      scenario for western Washington — an unbolted house can slide off its foundation while the
      foundation itself stays put. Seismic retrofit work in Thurston County requires a permit
      through the City of Olympia Building Division for properties within city limits, or the
      Thurston County Permit Assistance Center for unincorporated areas. The scope typically
      includes adding anchor bolts through the mudsill into the concrete, installing shear wall
      plywood panels on the cripple wall, and adding Simpson Strong-Tie mudsill hardware at
      code-specified spacing. A standard single-story rancher seismic retrofit runs $4,500–$9,000
      with permit. TopVolk Construction LLC — WA Licensed Contractor — handles the permit
      application and coordinates required inspections. Deadline milestones are written into the
      contract; we pay a penalty for missing them. Call (206) 591-1096.

  - title: "Sump Pump Installation for High Water Table Near Capitol Lake"
    description: |
      The tidal influence of Budd Inlet and the proximity to Capitol Lake keeps the water table
      elevated across a wide section of central Olympia. Crawlspaces in the 98501 zip code
      routinely show standing water from November through April. A perimeter French drain
      directing inflow to a sump pit, combined with a Zoeller M53 cast-iron sump pump on a float
      switch, handles most situations reliably. For crawlspaces with particularly high inflow, the
      managed perimeter channel makes a real difference — a single pump without directed drainage
      can be overwhelmed in heavy rain events. Full installation — pit excavation, perimeter
      channel, pump, discharge line, and 20-mil vapor barrier — typically runs $3,500–$7,500
      depending on crawlspace depth and access conditions. Battery backup is worth adding given
      Olympia's winter storm outage frequency. A pump without backup power in a flooded
      crawlspace during a windstorm is exactly the wrong time to find out the primary
      circuit tripped.

  - title: "Crawlspace Encapsulation and Vapor Barrier Replacement"
    description: |
      Many Olympia homes from the 1970s and 1980s were built with 6-mil poly sheeting on the
      crawlspace floor — technically compliant at the time, but that material tears, degrades,
      and leaves gaps that allow ground moisture to evaporate directly into the framing above.
      Over time, elevated crawlspace humidity promotes fungal growth on the rim joist and floor
      joists and accelerates rot in the floor system. Full encapsulation uses reinforced 20-mil
      barrier — products like CleanSpace or equivalent — sealed at the stem walls and taped at
      all seams, combined with rigid foam insulation against the foundation walls. Done right,
      crawlspace humidity drops from 80-plus percent down to manageable levels year-round.
      Cost for a 1,000-square-foot crawlspace runs roughly $4,000–$8,000 depending on prep work
      needed. If existing floor joists show soft spots or fungal staining, sistering is done
      concurrently — far easier to address framing before the new barrier goes down than to pull
      it up later.

faq:
  - q: "How fast can you get to Olympia for foundation repair?"
    a: |
      Olympia is about 60 miles south of Seattle via I-5 — typically an hour to an hour and
      fifteen depending on traffic. TopVolk schedules site consultations in Thurston County
      regularly; availability for an initial assessment is usually within a week. Vladislav
      handles the visit himself, not a salesperson, so the assessment you get on-site is the same
      perspective that drives the written estimate. For urgent situations — active water intrusion
      or a visibly compromised crawlspace after a heavy rain event — mention that when you call
      and we'll prioritize. Reach us at (206) 591-1096.

  - q: "What does foundation repair cost in Olympia?"
    a: |
      It depends on what's actually failing. Epoxy or polyurethane crack injection for stable
      stem wall cracks runs $1,500–$4,000. Post-and-pier reinforcement in a mid-size bungalow is
      typically $8,000–$18,000. Seismic retrofit with permitting runs $4,500–$9,000 for most
      single-story homes. Helical pier installation for active settlement starts around $6,000 for
      two to three piers and goes up with scope. Sump installation with vapor barrier runs
      $3,500–$7,500. TopVolk provides line-item written estimates — not vague ranges — after
      an on-site assessment. No charge for the consultation. Call (206) 591-1096.

  - q: "Do foundation repairs in Olympia require a permit?"
    a: |
      Structural foundation work almost always requires a permit. In Olympia city limits, that
      means the City of Olympia Building Division — they process residential structural permits
      with a typical plan review of 2–4 weeks for standard scope. Unincorporated Thurston County
      properties go through the Thurston County Permit Assistance Center. Seismic retrofit,
      helical pier installation, and any work modifying the foundation system are permit-required
      under the IRC. The AHJ will require rough-in and final inspections. TopVolk Construction
      LLC — WA Licensed Contractor — prepares permit application documentation, coordinates
      directly with the jurisdiction, and schedules required inspections. Project timeline
      milestones, including permit-dependent start dates, are written into the contract with a
      penalty clause for missed deadlines on our end.

  - q: "Do you install helical piers for severely settled foundations?"
    a: |
      Yes. Helical piers are the right fix when a section of foundation has active differential
      settlement that will not stabilize on its own — particularly in areas with soft or
      poorly-compacted fill soils, which turn up in parts of Olympia near the tidal zone and
      Capitol Lake. A helical pier is a steel shaft with helical plates hydraulically driven to
      stable bearing strata, then connected to the existing foundation with a bracket assembly.
      The system transfers structural load off the failing soil entirely. We size the pier
      installation to the load requirements of that section of the house — not a one-size
      application. Typical lead time from signed contract to installation start is 2–4 weeks,
      depending on permit review time from the City of Olympia or Thurston County.

  - q: "What warranty applies to foundation repair work in Olympia?"
    a: |
      Warranty scope depends on the repair type. Sika epoxy and polyurethane crack injection
      carries the manufacturer's warranty against re-cracking at the injection point — typically
      5 years on the material. Helical pier system components carry a structural warranty from
      the manufacturer on the steel and bracket hardware. Simpson Strong-Tie hardware used in
      post-and-pier and seismic work is backed by Simpson's product warranty. Labor terms are
      specified in TopVolk's written contract. One thing that affects long-term performance more
      than any product warranty: drainage. A repaired foundation that keeps accumulating water at
      the perimeter will redevelop problems. Every estimate includes a drainage assessment — if
      grading, downspouts, or soil compaction are feeding the original problem, that gets called
      out clearly and addressed as part of scope or flagged for separate action.

  - q: "Does TopVolk serve other parts of Thurston County beyond Olympia?"
    a: |
      Yes — coverage includes Tumwater (98512), Lacey (98503, 98516), Yelm, and unincorporated
      Thurston County. North of Thurston, the service area extends through Pierce County
      (Tacoma, Puyallup, Gig Harbor) and up through King County. Scheduling and travel work the
