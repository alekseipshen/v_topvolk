  - q: "What does ADU construction in Mill Creek cost?"
    a: "A 600–800 sq ft detached ADU in Mill Creek runs $130,000–$200,000 fully permitted and complete. Attached ADUs and basement conversions typically come in lower — $80,000–$140,000 depending on existing conditions and scope. What moves the price: foundation type, utility separation complexity, structural requirements from the engineer's plan, and finish level (KitchenAid or Bosch appliances versus builder-grade). Permit fees and engineering add roughly $8,000–$15,000 on top of construction costs in this jurisdiction. TopVolk provides a detailed line-item quote — you'll see each trade priced separately. Call (206) 591-1096 or schedule a free on-site consultation to get a number tied to your actual lot."

  - q: "Who handles permits for ADU construction in Mill Creek?"
    a: "Mill Creek is an incorporated city, so ADU applications go through the City of Mill Creek's building department — not Snohomish County PDS, which handles unincorporated parcels in the surrounding 98082 area. TopVolk prepares and submits the full permit package: site plan showing setbacks and lot coverage, structural drawings stamped by a WA-licensed engineer, MEP layouts, and Washington State Energy Code compliance documentation. Plan review for a detached ADU in Mill Creek typically takes 6–10 weeks after a complete submittal is accepted. Vladislav Volkov signs all permit applications as the WA Licensed Contractor of record and is present for every required inspection through final CO."

  - q: "Can I build two ADUs on my Mill Creek lot under WA HB 1337?"
    a: "Yes — WA HB 1337 (2024) allows up to two accessory dwelling units on most single-family lots statewide, Mill Creek included. That can mean a DADU in the rear yard plus an AADU above the garage on the same parcel simultaneously. Whether both are feasible depends on your lot size, existing structure footprint, and setback geometry on all four sides. Many 1980s-era lots in the 98012 zip are large enough to support both; others max out at one. The on-site consultation is where we run the FAR and lot coverage numbers to determine what's actually buildable before any design fees are spent."

  - q: "What warranty comes with ADU construction in Mill Creek?"
    a: "All labor and installations carry a one-year warranty from the date of final CO. Structural components — foundation, framing, LVL beams — are covered under that same one-year term. Manufacturer warranties on major mechanical components run separately: Navien tankless water heaters typically carry 15 years on the heat exchanger, Mitsubishi mini-split systems 12 years on the compressor, Bosch appliances 1–5 years depending on the unit. Washington State statutory implied warranties on new residential construction provide additional coverage beyond that. One more thing: the contract includes a written penalty clause for missed project milestones. If TopVolk misses a scheduled deadline, that penalty is enforceable — it's in the contract, not a verbal commitment."

  - q: "Do you cover nearby cities outside Mill Creek?"
    a: "TopVolk services all of King County, Snohomish County, Pierce County, and Kitsap County. For ADU work near Mill Creek, that includes Bothell, Kenmore, Mountlake Terrace, Lynnwood, Mukilteo, Edmonds, and Everett. Permit jurisdictions vary across that range — some projects go through individual city permit centers, others through Snohomish County PDS depending on whether the parcel is incorporated. Scheduling a consultation in the Mill Creek and north King/south Snohomish corridor typically runs within 1–2 weeks. Call (206) 591-1096 to check availability for your specific address and get a realistic timeline."