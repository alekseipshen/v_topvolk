title: "Mill Creek ADU Construction — Two ADUs on Your Lot, Start to CO"

answer: "TopVolk builds DADUs and attached ADUs in Mill Creek, WA — WA Licensed Contractor, 100+ projects since 2023, Vladislav Volkov leads every build."

intro: |
  TopVolk Construction builds DADUs and attached ADUs in Mill Creek — a WA Licensed Contractor with 100+ projects completed since 2023, handling everything from permit application through final CO, with Vladislav Volkov running each project directly. Roughly half the single-family lots in Mill Creek's 98012 zip were platted in the 1980s with enough rear yard to clear the 5-foot setback requirements for a detached ADU under current city code. WA HB 1337 (2024) now permits up to two accessory dwelling units on most single-family parcels statewide — which means many Mill Creek homeowners who thought they had one option actually have two.

  Near Mill Creek Town Center and along the Herons Park trail corridor, the pattern we see most often is a three-car garage conversion into a DADU with a Mitsubishi mini-split handling all the heating and conditioning. That setup makes the space genuinely rentable through the October-to-May wet season Mill Creek gets every year — not just a storage room with a bed in it. Call (206) 591-1096 to schedule a site walk with Vladislav.

localContext: |
  Mill Creek is an incorporated city, which matters for permitting: ADU applications here go through the City of Mill Creek's own building department, not Snohomish County PDS. That's the jurisdiction handling the 98012 zip, where most of incorporated Mill Creek sits. The 98082 zip, covering parcels along the northern edge near the Bothell city limits, sometimes falls under county jurisdiction depending on whether the parcel is incorporated — worth confirming before you start drawing plans.

  The housing stock in 98012 is predominantly 1980s and early 1990s construction. Larger lots, two- and three-car garages, setback geometry that usually works for a rear-yard DADU. These aren't the cramped 1940s bungalows on Capitol Hill — there's real square footage to work with. That said, the wet climate here demands proper attention to drainage grading around any new structure, vapor barrier installation in crawlspace foundations, and pressure-treated (PT) lumber at all ground-contact framing. Mill Creek averages around 37 inches of rainfall annually, and a poorly detailed DADU foundation will show moisture problems well before the ten-year mark.

commonProblems:
  - title: "Permit Application Gaps That Stall Mill Creek ADU Projects"
    description: "The City of Mill Creek's building department requires a complete submittal before plan review even starts — an incomplete package gets returned, not reviewed, which adds 4–6 weeks before the clock restarts. A complete DADU application here needs a to-scale site plan showing existing structure footprint, proposed ADU footprint, all setback dimensions from property lines, lot coverage calculation, and a full building plan set with foundation, framing, and MEP layouts. Structural drawings must be stamped by a WA-licensed engineer. Energy compliance documentation per the Washington State Energy Code is a separate required attachment. TopVolk prepares the full package in-house and submits as the WA Licensed Contractor of record. Plan review for a detached ADU in Mill Creek typically runs 6–10 weeks once a complete application is accepted. End-to-end project timeline — permit through final CO — is 5–7 months for a ground-up DADU."

  - title: "Choosing the Right ADU Type for Your Specific Lot"
    description: "WA HB 1337 (2024) allows up to two ADUs on a single-family parcel — one DADU in the rear yard and one AADU (attached or above-garage) on the same lot simultaneously. The right combination depends on your specific geometry. Lots along the Herons Park corridor with shallow rear yards sometimes can't clear the 5-foot rear setback for a full DADU, making a basement conversion or above-garage AADU the more buildable option. Ground-up DADUs in Mill Creek typically run $180–$280 per square foot for a turnkey unit. Basement conversions can come in at $90–$140 per square foot depending on egress window requirements, existing rough-in locations, and whether the slab needs breaking for drain relocation. A Navien tankless water heater is almost always the right call in a new ADU — compact enough to mount on a wall, no 40-gallon tank taking up floor space in a 600 sq ft unit."

  - title: "Utility Separation and MEP Coordination for New Mill Creek DADUs"
    description: "A common question upfront: does the new ADU need its own water and sewer connection, or can it share with the primary residence? In most cases a shared service connection is permitted, but you still need a dedicated sub-panel for the ADU's electrical, a separate water shutoff accessible to a tenant, and clear coordination with Snohomish County PUD if you want separate utility billing. Rough-in inspection scheduling is where projects lose time if not managed tightly. The City of Mill Creek requires inspections at foundation, framing, rough-in MEP, and insulation before walls can be closed — missing a scheduled inspection means opening walls back up. TopVolk coordinates all inspection scheduling directly. Vladislav Volkov, the WA Licensed Contractor of record, is on-site for every framing and rough-in inspection — not a crew lead who has to call someone to answer a question."

  - title: "What Actually Drives ADU Construction Costs in Mill Creek"
    description: "A 600–800 sq ft detached ADU in Mill Creek typically runs $130,000–$200,000 fully permitted and complete. That range isn't vague — it shifts based on identifiable variables. Foundation type moves the number significantly: slab-on-grade is less expensive than a crawlspace with a vapor barrier, drainage mat, and PT framing. Finish selections matter: a kitchen with Bosch appliances and quartz countertops costs more than one with builder-grade cabinets and laminate. Structural requirements add cost too — LVL beam headers over large window openings or PSL post columns are common in open-plan ADU layouts and get specified by the engineer to meet IRC load path requirements. Soft costs — permit fees, engineering stamp, energy compliance documentation — typically add $8,000–$15,000 on top of construction. TopVolk provides a line-item quote broken down by trade: concrete, framing, MEP, insulation, drywall hang and tape, finish work. No vague construction lump sum."

  - title: "Moisture Management and Insulation in a Mill Creek Detached ADU"
    description: "A DADU in Mill Creek takes 37 inches of annual rainfall on its envelope from October through May. Exterior cladding choice isn't cosmetic — it's a 20-year durability decision. Hardie cement-board siding holds paint through the Pacific Northwest's wet-dry cycles far better than wood lap, and it doesn't rot at the trim joints the way some engineered wood products can on north-facing walls. Under the floor, a vapor barrier in any crawlspace is required by Washington State code and non-negotiable on any project we build. Wall assemblies use R-21 batts in 2x6 framing to meet current energy code minimums, but upgrading the roof assembly to R-49 significantly reduces heating load in a small conditioned space. That matters when you're running a Mitsubishi mini-split as the primary HVAC — an undersized or poorly insulated box runs constantly and costs the tenant real money every month."

