  - q: "Do I need a permit for electrical work in Mill Creek, and who handles it?"
    a: "Yes — the City of Mill Creek requires permits for panel replacements, service upgrades, new circuits, and EV charger installations. Mill Creek runs its own building department and permit portal, separate from Snohomish County PDS, so submittals go directly to the City rather than the county. Typical plan review for a panel upgrade runs 1–3 weeks. TopVolk handles permit preparation and submittal as part of the project — you don't navigate the City's portal yourself. WA Licensed Contractor status means the work is inspected and documented, and the inspection record stays with your home's permit history — which matters when you sell."

  - q: "Can my existing 100A panel handle a Level 2 EV charger?"
    a: "Rarely, without a load calculation first. A 50A EV charger circuit draws 40A continuous under NEC 80% rules — that's 40% of a 100A service before accounting for the HVAC, water heater, dryer, and kitchen loads already running. NEC 220.87 allows a calculation based on actual recorded peak demand, and in most occupied Mill Creek homes, that math shows the 100A service is already running at 80–85% capacity. Some 125A panels with genuinely low actual usage can support a 32A Level 2 charger on a 40A dedicated circuit — the on-site load calculation determines which scenario applies. That assessment is included in the free consultation, not charged separately."

