title: "Mill Creek Deck Installation — Built for Snohomish Rain"

intro: |
  Cougar Park neighborhood sees standing water from November through
  March, and the 98012 homes around Mill Creek Town Center built between
  1988 and 2005 are showing ledger failures right at the rim joist — the
  exact spot where the deck frame meets the house wall. TopVolk has
  completed 100+ projects since 2023 across Snohomish and King counties.
  Vladislav does the site walk himself, reads the framing, and puts real
  numbers on paper before anything gets signed. Call (206) 591-1096.

localContext: |
  Mill Creek's grid — Sherwood Road corridor, subdivisions off 132nd
  Street SE, the neighborhoods west of Beverly Park Road — went up fast
  during the 1990s boom. Most original decks used builder-grade cedar or
  pressure-treated lumber with minimal ledger flashing detail. The 98012
  zip sits in unincorporated Snohomish County, so deck permits route
  through Snohomish County PDS — plan review, structural drawings, and
  inspections included — for any attached deck or guardrail replacement.

commonProblems:
  - title: "Ledger Rot at the Rim Joist Connection"
    description: "Without Vycor tape or proper Z-flashing at the ledger
      board-to-rim joist connection, water pools behind the siding all
      wet season. A decade of Snohomish County rain and the rim joist
      turns punky — sistering new lumber is required before any
      replacement ledger can attach. Nearly every 1990s-era deck in
      98012 we inspect shows some version of this failure."
  - title: "Footings That Don't Reach Frost Depth"
    description: "Snohomish County requires footings at 12–18 inches
      below grade for ground-contact PT lumber posts. Many original Mill
      Creek decks used 8-inch poured footings that heave over time.
      Replacement work goes through Snohomish County PDS plan review —
      footings sized to IRC frost-depth requirements before a shovel
      breaks ground."
  - title: "Cedar vs. Composite: The Real 10-Year Cost"
    description: "Cedar looks sharp at install. By year four in 98012,
      north-facing boards collect moss and need annual sealing. Trex
      Transcend and TimberTech Azek carry 25-year fade-and-stain
      warranties — no treatments, no annual recoat. On a 500–600 sq ft
      deck, the composite premium pays back through avoided maintenance
      within 6–8 wet Snohomish winters."

