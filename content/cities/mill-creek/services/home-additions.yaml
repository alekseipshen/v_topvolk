  - q: "What permits does a home addition in Mill Creek require?"
    a: |
      Additions inside City of Mill Creek limits (98012) go through the City of Mill Creek Building Department — not Snohomish County PDS. The permit submittal includes site plans, floor plans, elevations, and a structural engineering letter for any load-bearing work. Plan review takes roughly 4–8 weeks for residential additions; a DADU submittal under WA HB 1337 may move faster if the design aligns with the city's pre-approved DADU plan templates. Parcels in unincorporated areas with 98082 addresses use Snohomish County PDS instead, which has its own portal and timeline. TopVolk, as a WA Licensed Contractor, handles the full permit package — the homeowner doesn't navigate the system alone.

  - q: "Do I need a structural engineer for a second-story addition in Mill Creek?"
    a: |
      Yes. The City of Mill Creek requires a structural engineering letter as part of the plan review package for any second-story addition. The engineer evaluates existing foundation bearing capacity, confirms the first-floor wall framing can carry the added load, and specifies LVL beam sizing and PSL post placement for the new floor system. Truss-roof homes — which covers most of Mill Creek's 1988–2005 stock — require full roof removal before second-floor framing begins, and the engineer's letter addresses that sequence explicitly. TopVolk coordinates the structural engineer as part of the project scope; the engineering fee appears as a line item on the initial quote so there are no surprises mid-project.

  - q: "What warranty comes with a TopVolk home addition in Mill Creek?"
    a: |
      TopVolk's addition projects carry a 1-year workmanship warranty on all labor — framing, roofline tie-ins, windows, and finish work. Manufacturer warranties run longer: Hardie cement-board siding carries a 30-year finish warranty, and Milgard or Pella windows come with a limited lifetime warranty on the frame and glass seal. Mitsubishi mini-split systems include a 5-year parts and labor warranty when registered at installation. In Mill Creek's climate — wet from October through May with occasional freeze events in the Cascade foothills to the east — proper roof flashing and exterior waterproofing details are where long-term durability lives. Those details are reviewed at the rough-in inspection and confirmed at the final blue tape walkthrough before handoff.

