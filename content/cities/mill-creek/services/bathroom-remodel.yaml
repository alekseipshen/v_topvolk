title: "Mill Creek Bathroom Remodel — 1980s Planned-Build Upgrades"

intro: |
  Canyon Park and The Lakes subdivision filled in fast through the late 1980s and 1990s — planned construction, consistent floor plans, and bathrooms spec'd for cost, not longevity.

  Cultured marble tops. Fiberglass tub surrounds. Single-handle Delta pressure-balance valves that have never been swapped. TopVolk Construction (WA Licensed Contractor) has been working in 98012 and the broader Snohomish County corridor since 2017 — 100+ projects in.

  Mill Creek bathrooms follow a predictable pattern. The failures repeat.

localContext: |
  Most of 98012 was built between 1985 and 2002 under planned-community guidelines that prioritized layout efficiency over finish durability. Bathrooms in these homes typically have no waterproofing membrane behind shower tile, 4×4 ceramic floor tile laid over concrete board without a vapor barrier, and exhaust fans ducted into the attic cavity instead of a proper exterior termination. Walk the Canyon Park Estates section near 132nd Street SE or the two-stories off Bothell-Everett Highway — the master bath layout is nearly identical house to house, right down to the cultured marble vanity and the Broan fan that vents nowhere useful.

  Permit jurisdiction matters here. Mill Creek processes permits through its own Community Development office — but parcels in the Cathcart area and along the unincorporated Penny Creek corridor fall under Snohomish County PDS. East of McCollum Pioneer Park or in older sections near SR-527, confirm jurisdiction before submitting plans. Getting that wrong adds weeks.

  The climate does the rest.

  North-facing rooflines on Canyon Park ramblers and The Lakes two-stories accumulate moss and attic condensation faster than owners realize. Thirty-five-plus inches of annual rain hitting poorly vented bathroom exhaust is how you get structural mold in the framing above a second-floor bath. By the time it's visible, the damage is months old.

  Homes in the 98082 zip — newer sections north of Mill Creek Town Center toward Clearview — run into a slightly different problem set. Post-2000 builds there used better vapor barriers, but the builder-grade Moen cartridges are now 15–20 years old and failing quietly. Different era, same result: the bathroom needs a gut-and-rebuild, not a patch.

commonProblems:
  - title: "Shower Tile Failing — No Waterproofing Membrane Behind the Wall"
    description: |
      Tile set directly onto greenboard was standard practice in 1990s tract builds throughout Canyon Park and Penny Creek-area subdivisions.

      Moisture wicks through grout joints and degrades the substrate — by the time mold appears in the grout lines, the wallboard behind is already compromised. Rebuilding it correctly means a Schluter Kerdi membrane or a RedGard coating over cement board before any new large-format porcelain goes up. On a typical Mill Creek master bath, that substrate work is a $1,800–$3,500 line item on a full remodel estimate. The homes on the west side of Mill Creek near Penny Creek Road are especially consistent about this failure — it's in the original build specs.

      Can't be skipped.

  - title: "Bath Fan Ducted Into the Attic — Mold on the Insulation Above"
    description: |
      A large share of 1980s–90s Mill Creek homes vented the exhaust fan into the attic cavity rather than to the exterior. Warm, humid air from Pacific Northwest rainfall hits cold R-38 insulation and condenses — over 30-plus years, that's significant mold load in the roof framing above the bathroom.

      Fix involves pulling the old Broan or NuTone unit, running new 4-inch flex duct to a soffit cap, and replacing contaminated insulation.

      A Panasonic WhisperCeiling fan sized to the room's CFM requirement handles ventilation going forward. Simple job. Often delayed ten years too long.

  - title: "Curbless Shower Conversion Hitting the Subfloor and Drain Rough-In"
    description: |
      Converting a fiberglass tub combo to a curbless walk-in shower in a 1990s Mill Creek home means dropping the drain rough-in 3–4 inches to create the required slope — that's a subfloor cut and joist work.

      If the blocking and rim joist layout don't allow clearance, sister joists get added. Schluter Kerdi-Drain linear drains work well in these conversions because they allow more flexible slope geometry. Tile is typically 12×24 or larger format porcelain.

      Kohler or Moen pressure-balance valve gets replaced at the same time. The original 1990s valve is past its service life regardless of visible condition.

faq:
  - q: "How fast can you get to Mill Creek for a bathroom remodel consultation?"
    a: "Mill Creek is about 25 minutes from the primary work corridor via I-5 North and SR-527. Same-week on-site consultations are usually available. Call (206) 591-1096 — you're talking to Vladislav directly, not a scheduler. WA Licensed Contractor, free estimate, no sales staff."

  - q: "Do you install Kohler and Toto fixtures, or do homeowners supply them?"
    a: "Both work. Most Mill Creek clients source Kohler, Toto, or Moen fixtures through Ferguson Bath or directly from manufacturer showrooms — we install and warranty the labor. Toto washlet rough-ins and Kohler DTV+ digital shower systems require specific valve placement we build into the plan from the start. Bring specs to the consultation."

  - q: "What does a full master bath remodel cost and how long does the permit process take in Mill Creek?"
    a: "A gut-and-rebuild master bath in 98012 — curbless shower conversion, double vanity, Schluter membrane, new tile throughout — typically runs $28,000–$55,000 depending on fixture selections. Permit plan review through Mill Creek Community Development generally takes 3–6 weeks for a project at this scope. Construction runs 5–8 weeks after permit approval. Deadline commitments are written into the contract with a penalty clause — call (206) 591-1096 for a line-item quote."