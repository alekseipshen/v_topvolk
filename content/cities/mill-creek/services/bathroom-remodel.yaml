title: "Mill Creek Bathroom Remodel — Updating 80s-90s Builds Right"

intro: |
  The planned-community feel along Mill Creek's streets off 164th SE is great — until you open the master bath door.

  Builder-grade fiberglass surrounds, a single Moen pressure-balance valve, and a ventilation fan exhausting directly into the attic don't hold up after 30 PNW winters. Thirty years of October-May rain — around 37 inches annually — work into seams, caulk lines, and subfloors in ways that don't show until the surround is off the wall. The damage is usually bigger than it looks from the tile surface. Vladislav Volkov — WA Licensed Contractor, 100+ projects since 2017 — pulls the Snohomish County PDS permit and replaces that setup properly.

localContext: |
  Mill Creek's 98012 zip code is dense with late-1980s and early-1990s tract builds concentrated around the Trillium and Vintage Hills neighborhoods west of Mill Creek Town Center toward SR-527. Those homes were framed fast. Drainage on sloped lots near Penny Creek wasn't engineered for the long haul — and the plumbing rough-ins in those single-family builds reflected the same speed-over-detail mindset that shows up in every gut remodel we do in this zip.

  Bathroom walls got standard drywall backer instead of cement board. Vapor barriers were inconsistently installed — sometimes absent entirely at the slab-to-framing transition. Decades of PNW humidity have worked into every compromised seam and caulk joint. What looks like a tile refresh from the surface often turns into a full substrate rebuild once the surround comes off.

  That's not a surprise. It's just what 1991 construction looks like in 2026.

commonProblems:
  - title: "Fiberglass Surrounds Failing at the Tub Deck Seam"
    description: "Mill Creek's 1988-1998 tract homes came standard with fiberglass tub-surround combos. The caulk at the tub deck joint breaks down after 15-20 years. Water infiltrates behind the surround, soaks into paper-faced drywall backer, and produces soft spots and mold in the framing cavity. The fix is a full surround demo and a tile-over-Schluter Kerdi membrane rebuild — RedGard alone won't save compromised framing. That structure has to come out."
  - title: "50 CFM Exhaust Fans Vented Into the Attic"
    description: "A lot of 98012 homes have fans that were code-compliant in 1990 but terminate in the attic or at a blocked soffit. PNW humidity runs high from October through May — an undersized, poorly ducted fan accelerates mold growth in ceiling framing well before you see any staining on the drywall below. By the time the ceiling shows a discolored patch, the framing cavity above it has typically been wet for two or three seasons. Replacements go 80-110 CFM minimum, vented directly exterior through a roof cap or wall penetration, with proper blocking around the housing and an exterior damper to stop cold air infiltration in winter. Not a complex fix — but it needs to be done to code, with a penetration that actually clears the roof deck."
  - title: "Garden Tub Footprint Wasting a Third of the Master Bath"
    description: "Nobody is using that garden tub. Most Mill Creek homeowners want that square footage converted into a walk-in shower with a curbless entry, a bench, and a recessed niche — and that layout change requires drain relocation, new rough-in plumbing, and framing blocking for the niche and grab bars. Snohomish County PDS requires a permit and a rough-in inspection before the walls close. Plan for 3-6 weeks of permit review before construction starts."

faq:
  - q: "How fast can you get to Mill Creek for a bathroom remodel consultation?"
    a: "Mill Creek is about 25 minutes out. Vladislav comes to the site himself — not a project manager passing notes to a crew. Call (206) 591-1096 to schedule a free walkthrough any weekday, or most Saturdays."
  - q: "Do you work with Kohler and Rinnai, or do we need to source our own fixtures?"
    a: "Vladislav installs Kohler, Moen, Rinnai, and Navien products regularly in 98012 bathrooms. A Kohler DTV+ thermostatic shower valve, a Navien tankless water heater tied into the remodel, Bosch ventilation — all straightforward additions, provided specs are confirmed in scope before the permit is filed with Snohomish County PDS. Source fixtures yourself or through us; either works as long as the rough-in dimensions are locked before framing closes. Showing up on rough-in day with a different shower valve than what was spec'd creates rework nobody wants."
  - q: "What does a full bathroom remodel cost in Mill Creek, and how long does it take?"
    a: "A gut-remodel of a master bath in 98012 typically runs $28,000–$65,000 depending on tile selection, fixture grade, and whether the layout changes. Timeline is 4-6 weeks of construction after Snohomish County PDS permit approval — permit review for plumbing work runs 3-6 weeks. Deadline penalty is written into the contract. Call (206) 591-1096 for a line-item quote — no vague ranges, no ballpark estimates that double by demo day."