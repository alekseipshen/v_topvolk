  - q: "What does hardwood flooring installation cost per square foot in Mill Creek?"
    a: |
      LVP runs $6–$12/sq ft installed; engineered hardwood is $10–$18/sq ft; solid hardwood with nail-down and subfloor prep is $14–$25/sq ft. A 1,200 sq ft first-floor hardwood replacement in a Vintage Creek home with a sound OSB subfloor typically lands at $16,000–$24,000 fully installed. Discovery items — soft subfloor sections, out-of-level areas, old adhesive to remove — get identified and priced during the site visit, not after demo starts. Call (206) 591-1096 or book online for a free on-site estimate with exact line-item pricing broken out by material, labor, and subfloor prep.

  - q: "Does flooring installation in Snohomish County require a permit?"
    a: |
      A straight material swap — removing carpet or vinyl and installing new hardwood or LVP — doesn't require a Snohomish County PDS building permit. The threshold changes if the project involves sistering or replacing subfloor joists, which is structural framing work. That triggers a PDS permit application and at minimum one rough-in inspection before the new subfloor closes. TopVolk coordinates the permit application, manages the inspection schedule, and documents the framing work — no homeowner needs to navigate the PDS portal or parse permit language mid-project.

  - q: "Should I install engineered hardwood or LVP in a Mill Creek home with a crawlspace?"
    a: |
      Both products work over a wood-framed crawlspace floor, but they behave differently under PNW humidity. Kahrs and Shaw Floorté engineered hardwood handles humidity swings better than solid hardwood because of its cross-ply construction — but it still needs a vapor barrier below and 4–7 days of on-site acclimation. COREtec and LifeProof LVP are 100% waterproof at the plank level, install faster, and are more forgiving if crawlspace moisture control is marginal. Honest answer: LVP makes more sense when the subfloor reads above 10% MC, while engineered hardwood is the right call if you want a refinishable wood surface and the crawlspace is properly encapsulated.

  - q: "What warranty comes with flooring installation from TopVolk?"
    a: |
      TopVolk covers workmanship on every install — if a seam opens, a nail pops, or a transition strip fails due to installation error, it gets fixed at no charge. Material warranties come from the manufacturer: Kahrs engineered hardwood carries a 25-year residential warranty, COREtec LVP carries a lifetime residential wear-through warranty, and most Shaw products cover 25–50 years on wear. Those warranties are void if the subfloor wasn't prepped to spec or acclimation requirements weren't followed — which is exactly why TopVolk documents MC readings and subfloor condition in writing before the first board goes down. In PNW humidity, that documentation matters.

