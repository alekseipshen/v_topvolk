  - q: "Do I need a permit to finish my basement in Mill Creek?"
    a: |
      Yes — basement finishing requires building, electrical, and mechanical permits through the City of Mill Creek Community Development Department. That applies even if you're not adding a bathroom; any new electrical circuits, HVAC modifications, or structural framing triggers the permit requirement. Plan review is currently running 4–6 weeks. TopVolk handles the full permit application as WA Licensed Contractor of record, including plan preparation and inspection scheduling — you don't need to coordinate with the City yourself. Unpermitted basement finishing creates disclosure obligations at resale and can complicate homeowner's insurance claims if anything goes wrong.

  - q: "How do you handle moisture and water problems before finishing the basement?"
    a: |
      First step on every Mill Creek basement project is a moisture assessment: calcium chloride emission testing on the slab and a visual inspection of foundation walls for efflorescence, active seepage, and deteriorated existing vapor barrier. DriCore subfloor panels go down on any slab with elevated moisture readings before framing starts — the 3/4-inch air gap is the key detail. Foundation walls get RedGard elastomeric waterproofing membrane before insulation. If there's active perimeter water movement from the footing area, a perimeter drain tile system with a sump pump discharge gets installed first. That sequencing — moisture control before framing — is the difference between a basement that holds up and one that needs remediation in five years.

  - q: "What warranty do you offer on basement finishing work in Mill Creek?"
    a: |
      TopVolk backs the finished work with a three-year workmanship warranty covering framing, drywall, trim, and installation defects. Waterproofing systems — perimeter drain tile, sump pump installation, RedGard membrane — carry manufacturer warranties that typically run 5–10 years depending on the specific product. DriCore subfloor panels carry their own manufacturer warranty against panel failure. The PNW climate is hard on basements year-round; annual fall inspection of your sump pump and drain tile clean-out access is worth doing before the October rains start. Deadline penalties are also written into the contract — if TopVolk misses agreed milestones, there's a financial consequence on our end, not just a verbal apology.

