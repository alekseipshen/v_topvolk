  - q: "Do I need a permit for foundation repair work in Mill Creek?"
    a: |
      Structural foundation repair in the incorporated City of Mill Creek requires a building permit for most scopes — seismic retrofit (mudsill bolting, shear wall plywood), post-and-pier re-leveling that involves new poured footings, and any stem wall repair involving structural modification all fall under permit-required work. The City of Mill Creek Building Department handles applications; plan review for structural work typically runs 3–6 weeks, and both rough-in and final inspections are required. Cosmetic crack sealing — epoxy injection on hairline cracks with no structural modification — often falls below the permit threshold, but we confirm with the AHJ before proceeding without one. Unincorporated parcels in 98082 fall under Snohomish County PDS instead. TopVolk, as WA Licensed Contractor, pulls permits and manages all inspection scheduling.

  - q: "What's the difference between epoxy injection and polyurethane foam for stem wall cracks?"
    a: |
      Epoxy injection — Sika Injection-15 LV is the product we use most — cures rigid and bonds the crack structurally. It restores tensile strength to the concrete and is the right call for cracks in load-bearing stem walls where movement has stopped. Polyurethane foam injection expands to fill the crack and stays flexible after curing — it seals water intrusion effectively but does not restore structural capacity. For stem wall cracks under active lateral soil load, epoxy is the correct product. Polyurethane foam has legitimate uses in non-structural concrete like floor slabs or isolated partition footings, where some continued movement is expected and sealing is the only goal. Using foam in a structural stem wall crack is a common shortcut — it looks resolved on the surface but masks the actual failure mechanism.

  - q: "What warranty does TopVolk provide on foundation repair in Mill Creek?"
    a: |
      Workmanship warranty is project-specific and written into every contract — typically 5 years on post-and-pier re-leveling, epoxy injection, and seismic retrofit installations. Sika epoxy products carry separate manufacturer material warranties on top of that. What's covered: the repair as completed under the conditions documented at project closeout. What's not covered: new cracking or movement caused by soil changes, plumbing leaks, or drainage failures that weren't part of the original scope. The honest reality in Mill Creek's clay-heavy soils is that moisture management — vapor barrier, sump pump, exterior drainage — is what makes a foundation repair warranty actually mean something. A re-leveled crawlspace with no vapor barrier and no sump will settle again inside a decade. Fix the root cause and the repair holds.

