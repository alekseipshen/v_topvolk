  - q: "Does tile work in Mill Creek require a permit?"
    a: "Most tile replacement — pulling old tile and setting new tile in a shower or on a floor without changing plumbing, electrical, or structure — doesn't require a permit through the City of Mill Creek Building Division. The permit threshold gets crossed when MEP systems are involved: a heated floor thermostat needs an electrical permit, moving or adding a showerhead triggers a plumbing permit, and reframing a wall for a recessed niche or adjusting a window opening requires a building permit. Snohomish County PDS handles unincorporated areas just outside Mill Creek's city limits, but incorporated Mill Creek properties go through the city's own Building Division. As a WA Licensed Contractor, TopVolk handles permit applications when the scope requires it — homeowners don't have to navigate that process themselves."

  - q: "What's the difference between Schluter Kerdi and RedGard for shower waterproofing?"
    a: "Both function as waterproof membranes behind shower tile, but the installation method and failure modes differ. Schluter Kerdi is a sheet membrane — polyethylene with fabric facing — that gets troweled into unmodified thinset and bonds mechanically to the substrate. It sets in 24 hours, has no VOC concerns, and carries a tested system warranty when paired with Kerdi-Drain and Schluter profiles at penetrations. RedGard is a liquid-applied membrane that brushes or rolls onto cement board and dries to a rubber film — but getting 100% pinhole-free coverage is hard to verify without a flood test, and thin spots in corners or at penetrations are where failures start. For a full tear-out and rebuild in a Mill Creek shower that's already had one waterproofing failure, Kerdi is the more predictable system."

  - q: "How long does properly installed tile last in Mill Creek's climate?"
    a: "A correctly installed tile assembly — Schluter Kerdi membrane, 95%+ thinset coverage on large-format pieces, and polymer-modified grout — lasts 30–50 years in a Mill Creek bathroom without major intervention. PNW humidity cycling from October through May is hard on grout joints with micro-cracks or inadequate sealer, but it won't compromise a properly waterproofed assembly underneath. The membrane, grout joints, and silicone caulk at changes-of-plane age before the tile does. Recaulking shower corners with color-matched 100% silicone every five to seven years is the main maintenance item. TopVolk warranties tile installation workmanship for three years — membrane failures, lippage, and grout defects resulting from installation error are covered."

