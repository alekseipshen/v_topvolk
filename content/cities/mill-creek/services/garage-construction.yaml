title: "Mill Creek Garage Construction — ADU-Ready Builds, Slabs & Permits"

answer: "TopVolk builds detached and attached garages in Mill Creek, WA — 100+ projects completed, WA Licensed Contractor, owner-direct pricing and scheduling."

intro: |
  Building a two-car detached garage in Mill Creek (98012) runs $52,000–$78,000 for a finished structure — stack a DADU above it under WA HB 1337 and you're looking at $165,000–$215,000 depending on slab depth, utility separation, and interior finish level. TopVolk Construction has handled both straightforward garage builds and full ADU-over-garage projects across Mill Creek since 2023. The Settlers Village subdivisions and the neighborhoods clustered near Mill Creek Town Center are packed with 1985–2000 homes that came with attached single-car garages — undersized by today's standards and sitting on lots that often have room for a proper detached structure out back. Vladislav Volkov pulls the permit with the City of Mill Creek Building Department directly; no project manager passing messages between you and the trades. Pre-wiring for a 50A EV charger circuit during framing costs roughly $400 in rough-in labor — skip it now and you're cutting into finished drywall later for a job that should've taken two hours.

localContext: |
  Mill Creek's housing stock falls almost entirely in the 1985–2000 planned-subdivision window, built out along the SR-527 corridor and Bothell-Everett Highway. Zip code 98012 covers most of the incorporated city; lots along the eastern edge near Penny Creek Road can fall into 98082, where city limits blur into unincorporated Snohomish County — that matters because permits on those parcels may route through Snohomish County PDS rather than Mill Creek's own Building Department. Either way, setback requirements are a real constraint: a standard detached garage in 98012 typically needs 5 feet from the rear property line and 5 feet from the side. Smaller lots near the Mill Creek Country Club area push right up against FAR ceilings once you account for the existing house footprint and driveway apron. The Pacific Northwest rainfall — Mill Creek sees roughly 37 inches a year, most of it October through May — means a 6-mil vapor barrier under any concrete slab is non-negotiable, and Hardie cement-board siding on a detached garage will outlast painted T1-11 by two decades in this climate.

commonProblems:
  - title: "DADU Above a Detached Garage: Slab Load, Engineered Framing, and Utility Separation"
    description: |
      WA HB 1337 (effective 2024) allows up to two ADUs on most single-family lots statewide — that's opened the door to garage-plus-DADU projects all over Mill Creek. The structural reality shifts fast once a habitable floor enters the picture. A standard 4-inch fiber-reinforced slab is adequate for a plain garage; add a living unit above and the framing transitions to engineered lumber — LVL beams carrying floor joists, PSL posts at load transfer points, joist hangers at every connection. City of Mill Creek requires stamped structural drawings for any habitable second floor, and plan review for that scope runs 6–10 weeks. Separate utility metering is optional but worth the upfront cost if you plan to rent the unit. Total timeline from permit application to final inspection: 5–7 months. Projects with ADU scope go for $165,000–$215,000 finished.

  - title: "Setback Conflicts on Smaller 1990s Lots in Settlers Village and Penny Creek"
    description: |
      Lots platted in the late 1980s throughout Settlers Village and the Penny Creek neighborhoods left tight buildable envelopes. Once you account for the existing house, driveway apron, and any existing sheds or outbuildings, the math on setbacks gets tight fast. Mill Creek's R-7200 zones require 5-foot rear and side setbacks for accessory structures, and lot coverage limits hover around 35–40% of total lot area. Measuring from an assumed property corner rather than a surveyed one is the most common mistake — a site survey runs $900–$1,400 but is the difference between a clean permit approval and a stop-work order after framing is already up. Mill Creek Building Department flags setback violations early in plan review, so submitting accurate site plans from the start saves 4–6 weeks of revision cycles.

  - title: "EV Charger Pre-Wire During Framing — the Two-Hour Decision With Long-Term Consequences"
    description: |
      Mill Creek households in the 98012 zip skew toward dual-income families with newer vehicles, and EV registrations in Snohomish County have climbed steadily. Running a dedicated 50A or 60A circuit from the main panel to the garage during rough-in costs $350–$500 in wire, conduit, and licensed electrician time. Doing the same job after drywall is hung and painted runs $900–$1,500 — fishing wire through finished walls and cutting into ceilings adds hours. The circuit needs a dedicated 240V breaker with proper grounding, sized for Level 2 chargers like a hardwired Bosch EV280 or a plug-in ChargePoint Home Flex. TopVolk coordinates the electrical rough-in as part of MEP coordination on every garage build. This is a two-hour task during framing. It is not worth skipping.

  - title: "Concrete Slab Specs: Why the 1990s Builder-Grade Pour Won't Hold a Workshop"
    description: |
      A lot of Mill Creek's original attached garages were poured with 3.5-inch unreinforced slabs — fine for parking sedans, not adequate for a loaded woodworking setup, tool chest bank, or vehicle lift. New construction slab specifications call for 4-inch minimum thickness with polypropylene fiber reinforcement mixed into the concrete, a 6-mil vapor barrier underneath, and a compacted gravel base of at least 4 inches. For a standard two-car garage (24×24 footprint), that's $8,500–$12,000 for excavation, base prep, vapor barrier, and pour. Adding a floor drain runs another $600–$900 — worth doing now because cutting concrete later is expensive and messy. Minimum cure time before framing starts is 7 days; 28 days for full design strength. Rushing the slab is the single most common mistake on fast-tracked garage builds in this area.

  - title: "Matching Exterior Siding and Roofline to a 1985–2000 Mill Creek Home"
    description: |
      The tract homes throughout 98012 and 98082 came with vinyl siding in shades of beige, taupe, and grey, with 4:12 or 6:12 gable rooflines and simple fascia profiles. A detached garage that doesn't match reads like an afterthought — and in neighborhoods near Mill Creek Town Center where curb appeal drives resale, a mismatched structure costs real money at listing. HardiePlank lap siding is the standard match for most of these homes: it takes paint well, resists rot in heavy PNW rainfall, and can be factory-ordered to match existing reveal widths. Roofline matching means using the same pitch with similar truss spacing, finished with CertainTeed Landmark shingles in a coordinating colorway. Sourcing matching fascia profiles and aligning soffit vents adds 2–3 weeks to the planning phase, but the result looks like the garage was always there.

