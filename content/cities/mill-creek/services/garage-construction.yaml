  - q: "What permits are required for garage construction in Mill Creek, WA?"
    a: |
      Permits route through the City of Mill Creek Building Department for most parcels in 98012 — not Snohomish County PDS, which handles unincorporated areas nearby. A standard detached garage permit covers foundation, framing, electrical, and mechanical (if you're adding heat). Plan review typically takes 3–6 weeks for a single-story structure; add a habitable DADU above and structural review stretches to 6–10 weeks. TopVolk, as a WA Licensed Contractor, prepares the full permit application — site plan, framing drawings, elevation sheets — so the homeowner doesn't need to navigate the City's online portal or figure out which jurisdiction applies to their lot.

  - q: "Do I need engineered drawings for a garage in Mill Creek?"
    a: |
      A single-story detached garage under 1,000 square feet typically qualifies for prescriptive framing under the IRC (International Residential Code) — no stamped engineering required in most cases. Add a habitable second floor and the requirement kicks in: LVL beam sizing, PSL post specifications, joist hanger schedules, and shear wall calculations all need to be stamped by a WA-licensed structural engineer. That engineering package runs $1,800–$3,200 and is coordinated during TopVolk's project planning phase. Mill Creek's plan reviewers are thorough — submitting incomplete drawings is the fastest way to add 4–6 weeks to your permit timeline, so getting the structural package right the first time matters.

  - q: "How long will a new garage last in Mill Creek's climate, and what's covered?"
    a: |
      A properly built detached garage in Mill Creek — HardiePlank siding, pressure-treated (PT) mudsills at the slab edge, fiber-reinforced concrete, CertainTeed roofing — should hold up 40–60 years with routine upkeep. The weak points in PNW climates are roof-to-wall flashing and any untreated wood near grade; moss accumulates fast on north-facing surfaces with 37 inches of annual rainfall. Plan on cleaning gutters twice a year, recoating Hardie siding every 10–15 years, and replacing weatherstripping on insulated garage doors every 5–7 years. TopVolk's workmanship warranty covers structural and installation defects — specifics are written into the contract at project start, not handed over as fine-print boilerplate after the job closes.

