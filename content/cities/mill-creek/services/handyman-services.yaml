  - q: "Do handyman repairs in Mill Creek need permits or HOA approval?"
    a: |
      Routine handyman work — faucet and toilet replacements, light fixture swaps, drywall patches, weatherstripping, smart thermostat installs — doesn't require a City of Mill Creek building permit. Deck structural repairs are a different category: replacing joists, post bases, or the ledger board connection itself can trigger permit review through the City of Mill Creek Building Division, not Snohomish County PDS, since Mill Creek is an incorporated city. The Mill Creek Community Association governs exterior aesthetics in the original development areas — visible changes to railing style, trim color, or exterior hardware may need written HOA approval before handyman work starts, separate from the permit question. Vladislav flags permit and HOA considerations upfront for any scope that approaches those thresholds, so there are no surprises after materials are ordered.

  - q: "Can you match the existing drywall texture when patching?"
    a: |
      Most of Mill Creek's 1980s–90s homes have orange peel or light knockdown texture — sprayed with a hopper gun and knocked down before the material fully set. Rattle-can spray texture works on repairs under about 3 inches but doesn't replicate the bead size or pattern density of hopper-applied texture on larger patches. Vladislav carries a hopper setup and feathers new compound well past the patch perimeter to blend the transition properly. The step that causes most visible failures afterward is skipping the second prime coat applied after texture and before finish paint — that coat seals the mud and prevents a ghost ring from telegraphing through the color. Texture matching is included as standard on every drywall patch handyman job, not priced as a separate add-on.

  - q: "What warranty comes with handyman repair work in Mill Creek?"
    a: |
      Workmanship carries a 1-year warranty — if something Vladislav installed fails due to the installation itself, it gets fixed at no charge. Product warranties follow the manufacturer: Moen faucets carry a limited lifetime warranty on the valve body and cartridge; Kohler is similar on most fixtures. What's not covered: failures traced to pre-existing conditions found after the job (a corroded supply line behind the wall that held during the fixture swap but failed three weeks later) or damage caused by subsequent work from another contractor. In Mill Creek's climate — 37-plus inches of annual rainfall and a wet season running October through May — exterior repairs like weatherstripping and deck work get an honest lifespan estimate upfront, not a blanket guarantee that doesn't account for real exposure conditions.

