  - q: "Do I need a permit for door installation from the City of Mill Creek?"
    a: |
      Replacing a door in the same rough opening — same size, no framing changes — generally does
      not require a permit in Mill Creek. Widening the opening, adding sidelights, or converting
      a single entry to a double door triggers a building permit through the City of Mill Creek
      Community Development Department. Residential plan review typically takes two to four weeks.
      TopVolk is a WA Licensed Contractor and prepares the permit application and framing plan
      as part of the project — the rough-in inspection gets coordinated before drywall goes back.
      Homeowners don't need to manage the permit process separately.

  - q: "Fiberglass vs. steel vs. wood — which entry door works best in Mill Creek's climate?"
    a: |
      Fiberglass is the practical choice for most Mill Creek homes. Steel doors dent and the
      painted face is vulnerable to corrosion in a climate that runs wet from October through May
      with occasional freeze-thaw in the Snohomish County foothills. Solid wood looks excellent
      but needs repainting every three to five years or the top and bottom rails absorb moisture,
      swell, and bind against the stop. A Therma-Tru or Andersen fiberglass door holds its finish,
      doesn't swell seasonally, and can be factory-stained to pass for wood grain. Foam-core
      construction gives R-5 to R-6 insulation value — hollow steel can't come close to that.

  - q: "What warranty covers door installation work in Mill Creek?"
    a: |
      TopVolk's installation workmanship warranty is written into the contract — two years on
      labor covering flashing, casing, threshold, and door operation. The door unit carries the
      manufacturer warranty separately: Therma-Tru covers fiberglass door systems for the
      lifetime of the original purchaser, Milgard's Tuscany and Ultra Series carry a Full Lifetime
      Warranty, and Pella's coverage varies by product line. Manufacturer warranties don't cover
      installation-related water infiltration after our labor warranty expires — which is exactly
      why proper sill pan flashing detail matters from day one. Deadline commitments are also
      written into the contract, with penalties paid to the homeowner if the schedule slips.

