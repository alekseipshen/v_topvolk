title: "Mill Creek Kitchen Remodel — 80s Floor Plans, Opened Up"

intro: |
  The master-planned subdivisions off Bothell-Everett Highway filled in between 1982 and 1998, and nearly every floor plan put the kitchen in the interior of the house, walled off from the living room. That layout worked when everyone cooked separately. Now homeowners near Mill Creek Town Center are pulling out the dividing wall and fitting a 48-inch Thermador range where a 30-inch builder special used to sit. That's a structural conversation, an electrical conversation, and a permit conversation — all at once.

localContext: |
  Most of the 98012 zip was built by Quadrant Homes and similar regional builders during that 1980-2000 window. Similar square footage, similar framing, similar 100-amp electrical service. Opening up a closed kitchen today means analyzing whether that interior wall carries floor load from above — it often does in split-level plans — and spanning the new opening with an LVL beam. Permits go through the City of Mill Creek's own permit office, separate from Snohomish County PDS. Plan review for structural work runs 3-6 weeks.

commonProblems:
  - title: "Interior Walls That Actually Carry Load"
    description: "Split-level floor plans common in neighborhoods around Mill Creek Town Center frequently have kitchen walls carrying load from the floor above. Removing one without an engineered LVL beam or PSL post is a code violation and a structural risk. The load path analysis comes first — before demolition quotes, before cabinet orders. Seattle SDCI won't accept this work without stamped engineering drawings."
  - title: "100-Amp Panels and Modern Appliance Loads"
    description: "Builder-grade homes in the 98012 zip came with 100-amp service — workable for 1992 appliances, not workable for a Bosch induction cooktop, a Thermador steam oven, and a modern dishwasher running simultaneously. Upgrading to 200-amp service requires a permit and Puget Sound Energy coordination. That electrical rough-in gets inspected before drywall goes back up."
  - title: "Cabinet Dimensions That Don't Match Today's Appliance Specs"
    description: "Original builder cabinets were sized for 30-inch ranges and 33-inch refrigerators. A counter-depth Sub-Zero runs 36 inches wide and needs a specific surround built to its spec sheet. KitchenAid column refrigerators have their own clearance requirements. Reworking the cabinet run for modern appliance sizes means either semi-custom cabinetry measured to the space or full custom — standard IKEA base sizes rarely reconcile the math cleanly."

faq:
  - q: "How fast can you get to Mill Creek for a kitchen remodel estimate?"
    a: "Mill Creek is about 25 minutes from North Seattle via I-405 or Highway 527. Vladislav comes out for the initial walkthrough — no estimator, no sales call. Call (206) 591-1096 to schedule; most openings come up within a week."
  - q: "Do you work with Thermador, Sub-Zero, and Bosch appliances in Mill Creek kitchens?"
    a: "Yes. Each brand has specific rough-in tolerances — Thermador cooktops need exact cutout dimensions, Sub-Zero refrigerators need surround framing built to their published specs. We coordinate directly with the appliance dealer before cabinets are ordered so dimensions are locked before anything is cut."
  - q: "What does a full kitchen remodel in Mill Creek typically cost, and how long does it take?"
    a: "Most projects in the 98012 zip run $55,000–$130,000 depending on structural scope, cabinet tier, and appliance selection. Physical work takes 6-10 weeks after permits are in hand. City of Mill Creek plan review adds 3-6 weeks upfront for structural permits. Vladislav provides a line-item quote — no vague ranges. Deadline penalty is written into the contract. WA Licensed Contractor, 100+ projects completed since 2023."