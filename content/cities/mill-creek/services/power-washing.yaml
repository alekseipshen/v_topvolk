  - q: "Can you soft wash Trex or TimberTech composite decking without voiding the warranty?"
    a: |
      Yes, but the pressure limit matters. Both Trex and TimberTech publish maintenance guidelines capping pressure washing at 1,500 PSI with a fan tip — exceeding that risks surface pitting and a voided manufacturer warranty. The process on composite decking is a downstream injection soft wash: applying Simple Green Oxy Solve Deck and Fence Cleaner (a composite-safe formula) through a low-pressure nozzle, letting it sit for a 5-10 minute dwell time, then rinsing at 1,200-1,500 PSI with a 40-degree tip held 12 or more inches from the surface. Zero-degree tips and rotary surface cleaners should never be used on composite. Done correctly, the deck comes fully clean and the warranty stays intact.

  - q: "How long does a professional power wash last before moss and algae return in Mill Creek?"
    a: |
      On shaded north-facing surfaces — cedar fences under Douglas-fir canopy, for instance — biological regrowth starts in 12-18 months without a post-treatment inhibitor. A sodium hypochlorite soft wash kills the root structure of moss and algae rather than just removing visible growth, which buys considerably more time than pressure-only cleaning. Applying a post-wash preventive treatment like Spray & Forget or Wet & Forget extends clean surface time to 2-3 years on most wood and concrete surfaces. On pavers and concrete sealed with a penetrating sealer after washing, 3-5 years is a realistic expectation. The 37-plus inches of annual rainfall this region gets means biological regrowth is a certainty — the maintenance cycle just determines how long between cleanings.

