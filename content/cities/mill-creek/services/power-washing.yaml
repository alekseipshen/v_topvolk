localContext: |
  Mill Creek's housing stock splits into two distinct generations that show up differently on a power washing job. The older 1980s and early-1990s subdivisions concentrated east of Bothell-Everett Highway in the 98012 zip carry cedar-clad privacy fences, original poured concrete driveways, and wood decks that have been through three or four stain cycles — all of which accumulate biological film and surface contamination faster under the mature Douglas-fir and big-leaf maple canopy common to those streets. The newer construction near Mill Creek Town Center and the neighborhoods pushing toward the 98082 boundary tends toward Hardie cement-board siding, stamped concrete flatwork, and HOA covenants with explicit exterior appearance schedules. Composite decking shows up heavily in those builds too, which requires a completely different PSI and detergent protocol than cedar or concrete. Paver patios in both eras develop efflorescence and biological crust that needs controlled pressure to clean without blasting polymeric sand out of the joints. Power washing doesn't require a building permit in Mill Creek, but stormwater discharge rules do require biodegradable, phosphate-free cleaning agents — a detail that matters on every job.

commonProblems:
  - title: "Moss and Black Algae Colonizing Cedar Decks and Fences"
    description: |
      Cedar's grain structure holds moisture well — which is why it resists rot but also why it feeds Gloeocapsa magma (black algae) and moss so effectively. In the shaded backyards common throughout Mill Creek's 98012 neighborhoods, visible biological crust appears in 18-24 months on north-facing surfaces even after a thorough cleaning. The correct approach is a soft wash: a downstream injector delivers a 1.5-3% sodium hypochlorite solution through a low-pressure nozzle, the cleaner sits for a 10-15 minute dwell time to kill the root structure, then the surface rinses at 800-1,200 PSI. Products like 30 Seconds Outdoor Cleaner handle light homeowner maintenance between cycles, but deep-set moss requires a full professional soft wash to kill it rather than just knock it back visually. Expect $150-$350 for a cedar deck depending on square footage and biological load, with additional cost if staining or sealing follows the wash.

  - title: "Hardie Cement-Board Siding Showing Chalk and Mildew Before Repaint"
    description: |
      James Hardie cement-board panels handle Snohomish County's wet climate better than most siding options, but the paint film oxidizes and chalks over 5-7 years, and mildew streaks settle into the texture on shaded wall sections. Running high pressure on Hardie is a mistake — 3,000 PSI close-range contact blows out caulk joints at windows and corner trim, and can crack panel edges. The correct technique is 600-1,200 PSI with a 25- or 40-degree fan tip, combined with downstream injection of Simple Green or a low-VOC house wash concentrate, working top to bottom in overlapping passes. Dwell time of 5-10 minutes pulls chalk and biological contamination off the substrate. Skipping this step before a repaint means the new topcoat bonds to chalk rather than the substrate itself — you'll see peeling within 2-3 years instead of the 7-10 a proper paint job should deliver. Exterior washing before a full repaint typically runs $400-$700 for a two-story Mill Creek home.

  - title: "HOA Compliance and Stormwater Rules — What Actually Applies in Mill Creek"
    description: |
      No building permit is required through the City of Mill Creek or Snohomish County PDS for residential power washing — it's a maintenance activity. What does create a paper trail is HOA enforcement. Communities in Beckett Ridge and Mill Creek Country Club commonly include CC&R language requiring removal of visible moss, algae, and biological staining on a fixed schedule, sometimes with photographic documentation submitted to the HOA board. TopVolk is a WA Licensed Contractor, and documentation for HOA compliance review is part of every job. The second regulatory piece is stormwater: Snohomish County and City of Mill Creek stormwater ordinances require that wash water runoff not carry phosphates or harsh surfactants into storm drains, which flow to North Creek and ultimately Puget Sound tributaries. Using biodegradable, phosphate-free products — Simple Green, Zep House Wash, Wet & Forget — keeps the job compliant without any special containment plan for standard residential work.

  - title: "Concrete Driveways and Paver Patios — Oil, Efflorescence, and Eroded Joints"
    description: |
      Concrete driveways in Mill Creek's 1980s-90s subdivisions have absorbed oil drips, tire rubber deposits, and years of mineral migration. Efflorescence — the white crystalline calcium carbonate that appears as water moves through concrete — shows up heavily on exposed flatwork and on paver joints. Each contamination type needs a different product: F9 BARC (Efflorescence, Rust, and Calcium Remover) handles mineral deposits with a controlled acid wash; oil stains need enzyme or degreaser pre-treatment with dwell time before the main rinse. A spinning surface cleaner attachment at 3,000-3,500 PSI covers flat concrete efficiently and prevents the tiger-stripe pattern a wand leaves. Paver patios need lower pressure — 2,000-2,500 PSI maximum — to avoid blasting polymeric sand from the joints; after cleaning, joint sand replacement and a penetrating sealer extend the surface another 3-5 years. Concrete driveway cleaning runs $0.20-$0.40 per square foot; paver patio restoration with joint sand replacement typically lands at $300-$600 depending on size and condition.

  - title: "Cedar Fence Prep Before Staining — the 3-to-5-Year PNW Maintenance Cycle"
    description: |
      Cedar privacy fences in Mill Creek run through a staining cycle every 3-5 years in the Pacific Northwest — closer to 3 years on fence sections shaded by Douglas-fir or along the north property line near North Creek Trail, and closer to 5 years for south-facing runs in full sun. Cleaning has to happen before staining, and the fence needs 48-72 hours of dry time after washing before any stain product goes on. The cleaning process uses a soft wash at 500-800 PSI with a wood-specific cleaner like Defy Wood Cleaner or Armstrong Clark Wood Wash to strip gray surface fibers and biological buildup, followed optionally by an oxalic acid wood brightener to restore surface pH and open the grain for better stain penetration. Rushing the stain onto wet or dirty wood is the most common fence refinishing mistake — the product sits on the surface rather than penetrating, and it peels off within one rain season. Fence washing runs $1-$2 per linear foot, depending on height and contamination level.

