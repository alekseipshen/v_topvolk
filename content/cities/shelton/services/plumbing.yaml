  - q: "What does a repipe cost in Shelton?"
    a: "A full galvanized-to-PEX repipe on an older Shelton home typically runs $4,500-$9,000 depending on square footage, number of fixtures, and whether drywall needs patching afterward. Partial repipes limited to one bathroom or the kitchen supply lines cost less, often $1,500-$3,000, and a single water heater swap with strapping and an expansion tank usually lands around $1,800-$3,200 depending on tank size and gas versus electric. Every quote is line-item and written after the on-site visit — no phone estimates, since crawlspace and wall access vary a lot between Shelton's mill-era homes and the newer builds out toward Arcadia. A free consultation gets you the exact number before any work starts."
  - q: "Do I need a permit for a water heater or repipe in Shelton?"
    a: "Yes — Washington plumbing code requires a permit and seismic strapping on every water heater replacement, and repipes involving new supply lines or new drain runs need one too. City-limit Shelton addresses pull permits through the City of Shelton building department; unincorporated Mason County parcels route through Mason County Community Development, and any work near a septic tank or drain field also needs Mason County Environmental Health sign-off before digging starts. TopVolk is a WA Licensed Contractor and handles the permit filing, plan review coordination, and inspection scheduling as part of the job, so the homeowner isn't the one chasing down paperwork or waiting on hold with the county."
  - q: "Should I go tankless or stick with a standard tank water heater?"
    a: "Depends on the gas line and the household's hot water demand — a Rinnai or Navien tankless unit needs a larger gas line than most older Shelton homes currently have, so that upsize adds cost and roughly a day of extra work plus a new condensate drain. A standard 40-50 gallon tank (GE, Whirlpool, Amana, or Kenmore are common budget-friendly picks in this price range) is a same-day-ish swap and costs less upfront, though it typically lasts 10-12 years versus 15-20 for a well-maintained tankless unit. TopVolk walks through both options with real numbers during the consultation instead of pushing the more expensive unit by default, since a bigger household with two bathrooms running at once changes the math."
  - q: "What's the warranty on plumbing work in Shelton?"
    a: "Fixture warranties follow the manufacturer — Moen and Kohler typically cover cartridges and finishes for a decade or more, and water heater tanks usually carry 6-12 year manufacturer coverage depending on the model and whether it's gas or electric. TopVolk's labor on installs and repipes is covered separately in the written contract, and any callback for a workmanship issue gets handled directly by Vladislav, not routed through a call center or a subcontractor who's moved on to another job. Hard water and pressure spikes above 80 psi shorten fixture and tank life fastest in this area, which is why a PRV check gets bundled into most water heater jobs at no extra charge."
