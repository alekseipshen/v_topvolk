title: "Shelton ADU Construction — DADUs Built for Mason County Lots"

answer: "TopVolk builds permitted DADUs and basement-conversion ADUs in Shelton in 4-7 months, with GE and Whirlpool units sized for local rental budgets."

intro: |
  Permits for a detached ADU in Shelton typically clear Mason County Community Development review in six to ten weeks. Framing-to-final-inspection on the unit itself takes another three to five months. The timeline depends on the unit type. A DADU, an attached addition, and a basement conversion under an existing roofline all move at different speeds. Vladislav Volkov has walked lots near Oakland Bay and out toward Lake Nahwatzel where the math is the same. WA HB 1337 cleared the way for two ADUs on most single-family parcels in town. Median household income here runs around $46,481. A rented DADU with a GE range and a stacked Whirlpool washer-dryer can cover a mortgage payment fast. Shelton's housing stock runs from 1940s timber-worker cottages near downtown to newer manufactured and stick-built homes out by Sanderson Field. Each type hits different problems once you start digging footings or tying into an existing electrical panel. Kneeland Park neighbors have asked about parking exemptions and setbacks more than once this year. None of it is theoretical. TopVolk has pulled permits, poured footings, and handed over keys on ADUs across Mason County since 2017.

localContext: |
  Shelton addresses mostly fall under 98584. Rural pockets toward Agate and Kamilche run 98548 or unincorporated county routes. Either way, Mason County Community Development handles ADU plan review, not a city planning desk. Shelton's small footprint means most surrounding parcels are unincorporated county land. Older lots near downtown and along Railroad Avenue often carry 1940s-50s timber-industry cottages sitting on post-and-pier foundations. A basement conversion ADU on one of these usually needs new footings and a vapor barrier. Sometimes it needs a sistered joist or two before it satisfies current IRC bearing requirements. Newer parcels out toward Lake Isabella and the Highway 3 corridor tend to be manufactured or 1990s stick-built homes with more straightforward crawlspaces. Those lots are better suited to a slab-on-grade DADU. Mason County's rain pushes 60 inches a year once you're inland toward the foothills. Any DADU roof, siding, and crawlspace vapor barrier has to be detailed correctly the first time. Skip that and moss and rot show up on the north wall within two winters. Height limits for a detached unit run to 24 feet here. Utility separation matters too. Reviewers usually ask first whether the unit gets a dedicated water and sewer or septic tap, or a shared line off the main house.

commonProblems:
  - title: "Septic Capacity, Not Sewer Hookup, Decides Whether Your ADU Gets Approved"
    description: "Half of the ADU inquiries TopVolk gets in Shelton aren't in the city sewer service area. They're on a septic tank and drain field. Mason County Environmental Health has to sign off before Community Development will issue an ADU permit. An undersized drain field built for a three-bedroom house in 1978 usually can't absorb a second kitchen and bathroom without an upgrade. The fix starts with a septic evaluation, roughly $1,500-$2,500. If the system needs more capacity, that means a drain field expansion or an Orenco effluent pump system for tighter lots. Figure $15,000-$25,000 on top of the build. Skip this step and the county will bounce your application at intake — that costs three to four weeks."
  - title: "DADU, AADU, or Basement Conversion — the Framing Decision Changes the Bid"
    description: "A detached ADU in the backyard means new footings, a full stud wall, and roof framing from scratch. That's straightforward, but it's new construction pricing. An attached addition ties into the existing house with a ledger board bolted to the rim joist. That cuts framing cost, but it adds structural review — the county checks how load transfers into the original foundation. A basement conversion is usually cheapest per square foot. It often needs an LVL beam swapped in for a sagging center beam. Add a joist hanger upgrade and a code-compliant egress window cut into the foundation wall. That egress window alone runs $4,000-$7,000 with excavation."
  - title: "Mason County Plan Review Isn't Seattle SDCI — and That Changes Your Timeline"
    description: "Shelton doesn't run its own building department for most ADU work outside city limits. Plans go to Mason County Community Development instead, and reviewers there move on a different clock than Seattle's online MAP system. Pre-approved plan sets speed things up when the lot allows one. A custom DADU still needs a full plan review — typically six to ten weeks before a permit is issued. Setback requirements, lot coverage limits, and the 24-foot height cap all get checked at that stage. So does the question of parking exemption eligibility near the Mason Transit corridor downtown. TopVolk is a WA Licensed Contractor and handles the application packet directly with Vladislav. No third-party permit runner in the loop."
  - title: "What a Shelton DADU Actually Costs, Line by Line"
    description: "Most detached ADUs TopVolk builds in Mason County land between $130,000 and $190,000. The final number depends on square footage, foundation type, and finish level. A basement conversion can come in lower, often $70,000-$110,000, since the roof and exterior walls already exist. Given the area's median household income of $46,481, most clients furnish the unit with Whirlpool, Frigidaire, or Amana appliances rather than premium brands. That choice alone can shift a kitchenette budget by $2,000-$4,000. Line-item quotes list every one of these choices before signing — not a lump-sum guess. Miss the completion date in the contract and TopVolk pays a penalty. That's written in, not implied."
  - title: "Rain, Rot, and R-49 — Building an ADU That Survives Mason County Winters"
    description: "A DADU built with cedar shake siding looks right for the area. But it needs re-staining every 3-5 years, or it weathers gray and starts absorbing moisture on north-facing walls. Hardie cement-board siding costs more upfront, but it shrugs off Mason County's wet stretch from October through May with just a repaint cycle. Attic and wall assemblies get R-49 insulation with a proper vapor barrier on the crawlspace floor. That matters more here than in drier climates — trapped moisture under the unit leads to mold within a season. For heat, a Mitsubishi mini-split runs efficiently in the mild-but-humid summers and holds up through freeze-thaw swings if you're closer to the foothills. PT lumber is standard for any ground-contact framing or deck ledger."

