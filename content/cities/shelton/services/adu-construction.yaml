  - q: "Do I need a permit for an ADU in Shelton, and who handles it?"
    a: "Yes. Mason County Community Development reviews ADU plans for most Shelton-area parcels, since the city itself doesn't run a separate building department for this. Plan review generally takes six to ten weeks. TopVolk prepares the full packet: site plan, structural details, septic or utility documentation, and setback verification. As a WA Licensed Contractor, TopVolk pulls the permit directly, with Vladislav handling the county correspondence. No runner, no middleman."
  - q: "Can I put an ADU on a lot that's on septic instead of city sewer?"
    a: "In most cases, yes. But Mason County Environmental Health has to confirm the existing septic tank and drain field can handle the added load. That approval comes before the ADU permit gets issued. If the system's undersized, options include a drain field expansion or a pump-assisted system like an Orenco unit for tighter lots. This gets checked early in the process to avoid a mid-project surprise. TopVolk coordinates the septic evaluation alongside the building permit application."
  - q: "What's the warranty on an ADU build, and how does it hold up in Mason County weather?"
    a: "TopVolk backs structural and workmanship items with a written warranty. The contract also includes a deadline penalty clause if the completion date slips — that's a real cost to TopVolk, not a marketing line. A Hardie-sided DADU with R-49 insulation and a proper vapor barrier typically needs only routine caulking and gutter maintenance for 15-20 years in this climate. Cedar siding and a Mitsubishi mini-split have shorter maintenance cycles: re-staining every few years for the siding, filter cleaning for the mini-split. That gets covered in the walkthrough before handoff."
