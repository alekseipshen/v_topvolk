title: "Shelton Home Additions — DADUs, 2nd Stories & Suites"

answer: "TopVolk Construction builds permitted home additions and DADUs in Shelton, WA — owner-led, 100+ projects completed, deadline penalty in the contract."

intro: |
  TopVolk Construction builds permitted home additions, second-story expansions, and detached ADUs for homeowners in Shelton, Washington, with Vladislav Volkov running the job from first sketch to final inspection — no sales rep, no project manager handing you off. Most calls start the same way: a family near Kneeland Park has outgrown a three-bedroom rambler, or a homeowner off Mountain View Drive wants a mother-in-law suite with its own kitchen instead of turning the dining room into a bedroom. Shelton's housing stock skews older than a lot of people expect for a town this size — plenty of 1960s and 70s ranch homes from Simpson Timber's boom years, sitting on crawlspaces that need a hard look before anyone frames a second floor on top. A compact ADU kitchenette might mean a Frigidaire range and an Amana fridge instead of full-size appliances, sized to the square footage and the budget. Out toward Oakland Bay, waterfront lots bring their own headaches — tideland setbacks and shoreline permitting stack on top of the usual building code review, so timelines run longer than a standard in-town addition. TopVolk has completed 100+ projects across King, Snohomish, Pierce, and Kitsap counties since 2023, and now takes on addition work in Mason County too, with the same written deadline penalty in every contract. Call (206) 591-1096 for a free on-site consultation.

localContext: |
  Zip code 98584 covers most of Shelton proper, from downtown out toward Arcadia, while addresses past Kamilche and Agate often fall under 98548 and unincorporated Mason County. That split matters for permitting. Additions inside city limits go through the City of Shelton Building Department, but a DADU on five acres off Highway 101 near Kamilche gets reviewed by Mason County Community Development instead, with its own setback and lot coverage rules. A lot of the housing stock here dates to the 1960s-80s timber-era boom — post-and-pier foundations, single-wall crawlspaces, galvanized plumbing that needs attention before we tie in a new bathroom. Downtown, along Railroad Avenue and Cota Street, a handful of older homes still have narrow crawlspace access that makes running new plumbing or electrical lines slower than a modern slab-on-grade build allows. Mason County gets the same wet fall-through-spring stretch as the rest of the Puget Sound lowlands, so any addition needs a real vapor barrier in the crawlspace and R-49 insulation overhead, or the new square footage feels like a cold add-on room by December. Older Shelton ranch homes also tend to have low rooflines near Kneeland Park and the fairgrounds area, which limits how much second-story or dormer work is physically possible without re-engineering the roof structure first.

commonProblems:
  - title: "Fitting a DADU onto a Shelton lot under the new state ADU law"
    description: "WA HB 1337 opened the door in 2024 for two ADUs on a single-family lot statewide, and it's changed the math for Shelton homeowners on the bigger county parcels off Agate Road or out near Arcadia. A detached ADU tops out around 24 feet in height and needs its own utility connection — separate electrical panel, its own water tap or shared meter split with the main house. Compact units often run a stackable GE or Whirlpool washer-dryer to save floor space. Some lots closer to downtown may also qualify for a parking exemption under the state ADU law if they sit within a half-mile of frequent transit service, though that's rare once you're out past Kamilche. Plan review through Mason County Community Development or the City of Shelton runs roughly 4-8 weeks, and a full DADU project — foundation to final inspection — typically takes 4-7 months end to end. Costs generally start around $90K."
  - title: "Adding a second story where the foundation wasn't built for it"
    description: "A lot of Shelton ranch homes from the 1960s and 70s sit on post-and-pier foundations that were never sized to carry a second floor. Before framing starts, an engineer has to run the numbers on footing capacity, and TopVolk usually specs an LVL beam or PSL post at load points to transfer weight down cleanly instead of relying on the original mudsill. Floor joists downstairs often need sistering or added blocking once new loads shift the framing math. Skip this step and you get bouncy floors or cracked drywall within a year. Structural work like this adds $15K-$40K to a second-story addition depending on span and footing depth."
  - title: "Setback and lot coverage limits catching Shelton additions off guard"
    description: "Every addition eats into buildable area, and Shelton's zoning has real limits on lot coverage and setback distance from property lines, especially on the smaller in-town lots near downtown versus the larger county parcels toward Kamilche. A current survey usually has to go in with the permit packet, and FAR (Floor Area Ratio) can cap how big an addition gets before triggering a variance request. TopVolk pulls permits as a WA Licensed Contractor and handles the City of Shelton Building Department or Mason County Community Development paperwork directly — Vladislav walks the site with a tape measure before anything gets drawn up. Plan review generally runs 4-8 weeks depending on scope and the jurisdiction's current backlog."
  - title: "What actually drives the price on a Shelton home addition"
    description: "Addition costs here range from roughly $30K for a small bump-out or bedroom extension up to $200K+ for a two-story addition or a full DADU with its own kitchen and bath. Foundation type moves the number the most — a post-and-pier home costs more to build off of than a poured slab. Plumbing runs matter too: a kitchenette addition needs new supply and drain lines, not just a patch job. Appliance package plays a role as well — a Kenmore or Frigidaire suite runs less than a Samsung package with smart features. Every quote from TopVolk is line-item, not a vague range, and the deadline penalty is written into the contract, not just promised over the phone."
  - title: "Making the addition weatherproof and matching, not bolted-on"
    description: "Matching new exterior to a 40-year-old Shelton ranch means sourcing siding that reads right next to weathered cedar or aluminum lap siding, and Hardie fiber-cement holds up better against the county's wet fall-through-spring stretch than raw wood does, especially on north-facing walls where moss builds up fastest. For heating the new space, running new ductwork off an old forced-air system is often more expensive than just adding a Mitsubishi mini-split zone dedicated to the addition. Roofing has to tie into the existing roofline cleanly at the ridge and valleys, not just butt up against it. Expect a 15-20 year service life on Hardie siding here with basic upkeep, and a workmanship warranty on the addition itself from TopVolk."

faq:
  - q: "How fast can you get to Shelton for Home Additions?"
    a: "Shelton sits about 1.5-2 hours from Seattle via I-5 and Highway 3, and TopVolk schedules site visits in Mason County on set days to keep travel efficient. On-site consultations usually book within a week or two of your call, and rural county lots with long driveways or septic systems just mean a bit more time on the initial walk. Once a contract is signed, small additions start framing within 2-3 weeks of permit approval. Call (206) 591-1096 to get a visit on the calendar."
  - q: "What does a home addition in Shelton cost?"
    a: "Most Shelton addition projects run $30K to $200K+ — a simple bedroom bump-out lands near the low end, while a full DADU with its own kitchen and bathroom pushes toward the top. Foundation type, plumbing runs, and finish level (semi-custom cabinets versus builder-grade, Frigidaire versus Samsung appliances) all move the number. TopVolk provides a free on-site consultation with an exact, line-item quote — not a rough estimate over the phone. Ask about the written deadline penalty when you call."
  - q: "Do I need a permit for a home addition in Shelton?"
    a: "Yes — additions inside city limits go through the City of Shelton Building Department, while county parcels near Kamilche, Agate, or Arcadia fall under Mason County Community Development. Plan review for a mid-size addition typically takes 4-8 weeks before framing can start, longer for a DADU with new utility connections. TopVolk is a WA Licensed Contractor and prepares the full permit packet — site plan, structural details, energy code compliance — as part of the project, so you're not chasing paperwork on your own."
  - q: "Can I add a second story on my rambler's existing foundation?"
    a: "Sometimes, but it depends on what's under the house. Post-and-pier foundations common in Shelton's older ranch homes often need footing upgrades or added PSL posts before they can carry new roof and floor loads. TopVolk brings in a structural engineer to run the calculations first, before any design work locks in, so you know the real cost before committing. That assessment is part of the free on-site consultation."
  - q: "What's the warranty on a TopVolk addition in Shelton's climate?"
    a: "TopVolk backs the workmanship on every addition, and materials carry their own manufacturer warranties — Hardie siding, for example, typically runs 15-30 years depending on the product line. Appliances run on separate manufacturer coverage too — GE and Whirlpool units typically carry a one-year parts warranty out of the box — and TopVolk keeps that paperwork separate from the workmanship warranty on the addition structure itself. Mason County's wet season is hard on exteriors, so proper flashing and vapor barrier detailing at the addition tie-in point matters more than the siding brand itself. Roofing and structural work get inspected at rough-in and again at final walkthrough before punch list sign-off."
  - q: "Do you serve areas outside Shelton like Kamilche or Allyn?"
    a: "Yes — TopVolk covers Mason County broadly, including Kamilche, Agate, Arcadia, and out toward Allyn, alongside the core King, Snohomish, Pierce, and Kitsap county service area. Scheduling windows run a few weeks out for consultations and vary by project backlog. Direct communication stays with Vladislav throughout, no dispatched crew you've never met. Call (206) 591-1096 to check current availability for your area."