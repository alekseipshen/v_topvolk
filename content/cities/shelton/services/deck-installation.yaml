title: "Shelton Deck Installation — Built for Mason County Rain"

answer: "TopVolk Construction installs permitted decks in Shelton, WA — cedar or Trex composite, ground-contact PT footings, 100+ projects completed since 2017."

intro: |
  Rot at the ledger board is the number one reason older Shelton decks fail inspection before they fail structurally — and it's usually hidden behind the siding until someone pulls a board to look. TopVolk Construction installs permitted decks across Mason County, from waterfront platforms on pilings near Oakland Bay to ground-level cedar decks off Northcliff Drive, using ground-contact PT lumber and properly flashed ledger connections so the framing doesn't rot from the house outward. A lot of the older mill-town homes near downtown Shelton still have decks lag-bolted straight to the rim joist with no flashing at all, which is exactly how you end up with soft, spongy framing five years later. TopVolk builds new installations to current IRC deck standards, whether that's a cedar deck at a Lake Limerick property or a Trex composite deck for a rental near Railroad Avenue that needs to survive without much upkeep. Vladislav Volkov runs every project directly — no sales team, no subcontracted project managers — across more than 100 projects completed since 2017.

localContext: |
  Housing in 98584 runs the gamut from early-1900s mill-worker cottages near downtown Shelton to 1970s ranch homes out toward Timberlakes and manufactured homes on larger rural lots reachable through the 98585 PO box zip. A good share of these properties sit on Hood Canal or Oakland Bay frontage, where decks get built over pilings or steep grade changes instead of a simple ground-level footing — that changes the engineering for post footings and beam sizing fast. Homes inside Shelton city limits need a permit through the City of Shelton Building Department; anything in unincorporated Mason County, including Lake Limerick and the Kamilche area, routes through Mason County Community Development's Permit Assistance Center instead, and the two offices don't always want the same paperwork. Mason County gets close to 60 inches of rain a year in the foothills toward Lake Nahwatzel, more than Seattle proper sees, so ledger flashing and end-grain sealing on PT lumber matter more here than in drier parts of the state. Freeze-thaw cycles stay mild near town but sharpen out toward higher elevations, which affects how deep post footings need to go below the frost line.

commonProblems:
  - title: "Cedar Looks Right for Shelton, But Composite Might Outlast It"
    description: "Cedar decking sells well here because it matches the mill-town history and it's usually the cheaper material up front. The problem shows up around year four or five: Mason County's damp, shaded lots — especially anything backed up to timber near Timberlakes — grow moss on the north-facing boards faster than the deck can dry between storms. That moss holds moisture against the wood and speeds up rot at the board ends and around fastener heads. TopVolk usually walks Shelton clients through both options on the same visit: cedar with a breathable, semi-transparent stain like Behr's deck line reapplied every two to three years, or a Trex or TimberTech composite board that skips staining altogether. Composite costs more per square foot installed, but on a shaded lot it often pencils out cheaper over 15 years once you count labor for re-staining."
  - title: "Guardrail Height on a Waterfront Bluff Deck Isn't Optional"
    description: "Plenty of Shelton properties step down toward Oakland Bay or Hood Canal, and that grade change means a deck reading as single-story from the house can sit five or six feet above the yard on the water side. Once any part of the deck surface is more than 30 inches above grade, the IRC and the local AHJ require a guardrail at least 36 inches high, with balusters spaced so a 4-inch sphere can't pass through. Stairs need their own graspable handrail, and rise and run on the stringers has to stay within code tolerance — inspectors reject uneven stringer cuts more than almost anything else on a deck job. TopVolk through-bolts guardrail posts to the rim joist or blocking instead of toe-screwing them to the decking, because that's the connection an inspector actually tests at final inspection."
  - title: "Ledger Flashing Is Where Mason County Decks Actually Fail"
    description: "Most deck failures TopVolk gets called out on start at the ledger board, not the posts. A ledger bolted to the rim joist without step flashing and a drip cap lets water track behind the siding every time it rains, and Mason County averages close to 55-60 inches a year — enough to rot a joist from the inside before anyone spots a soft spot. Permitting depends on where the lot sits: inside Shelton city limits, the City of Shelton Building Department handles plan review and the ledger inspection; out in unincorporated areas like Kamilche or Lake Limerick, it's Mason County Community Development's Permit Assistance Center instead. TopVolk Construction is a WA Licensed Contractor and pulls the permit either way, schedules the required rough-in inspection before decking goes down, and details the flashing with self-adhered membrane and a Z-flashing cap so the connection sheds water instead of collecting it."
  - title: "What a New Deck Actually Costs in Shelton"
    description: "Ground-level PT lumber decks in the Shelton area typically land between $8,000 and $18,000 depending on size and framing complexity, while a raised composite deck with a Trex or TimberTech surface, guardrails, and a stair run usually runs $18,000 to $35,000-plus. Post footings drive cost more here than in flatter parts of the county — anything built on a slope toward the water needs footings dug to the frost line, generally 12 to 18 inches locally, and sometimes engineered beam sizing if the grade is steep. Material choice moves the number too: PT lumber costs less per board but needs re-sealing, while composite costs more upfront and needs almost none. Every TopVolk quote is line-item — footings, framing, decking, railing — not a lump-sum guess, and the contract includes a penalty if the completion date slips on our end."
  - title: "How Long a Shelton Deck Actually Lasts Before It Needs Work"
    description: "A properly flashed, code-built deck in this climate should get 25-plus years out of the framing if the ledger and joist hangers stay dry. Older Shelton decks — plenty from the 1980s and 90s are still standing on undersized posts — usually need work at the joist hanger connections first, since galvanized hardware corrodes faster than people expect in ground-contact conditions; TopVolk swaps those for stainless or triple-coated Simpson Strong-Tie hangers rated for PT lumber contact. Sistering a weak joist is often cheaper than a full rebuild if the ledger and posts are still sound. Cedar surfaces need a fresh coat of stain roughly every two to three years to keep water out of the grain; composite boards from Trex or TimberTech mainly need a wash-down twice a year to keep moss from getting a foothold on the shaded side of the house."

