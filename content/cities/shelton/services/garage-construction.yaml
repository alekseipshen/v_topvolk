title: "Shelton Garage Construction — Detached, DADU & Conversions"

answer: "TopVolk Construction builds and permits detached garages, garage-DADUs, and conversions in Shelton, WA — 100+ projects since 2023, owner-led."

intro: |
  Detached garages, garage-to-DADU builds under WA HB 1337, and garage-to-living-space conversions in Shelton get designed, permitted, and built by TopVolk Construction — owner Vladislav Volkov runs the job from the first site visit through final inspection, and most detached garage projects close out in 6-10 weeks once the permit is issued. Shelton's older housing stock, a lot of it dating back to the Simpson Timber company-town era near downtown and Fairmount, means plenty of single-car garages that no longer fit two vehicles or a work truck. Out toward Arcadia and Agate, larger lots make room for a 24x36 shop with an EV charger pre-wire and a Mitsubishi mini-split for year-round use. A homeowner near Kneeland Park recently swapped a rotted single-bay garage for a slab-on-grade two-car build with a Clopay insulated door and a LiftMaster opener. Sanderson Field and the Highway 101/3 junction keep the whole county within reach for a same-day estimate.

localContext: |
  Shelton's building stock splits pretty cleanly by era. In the 98584 core near downtown and Oakland Bay, you'll find 1940s-1950s company houses built for Simpson mill workers, many still sitting on post-and-pier foundations with garages framed in undersized Douglas-fir that won't carry a second-floor DADU without added LVL beam support. Out past the city limits toward Kamilche and Johns Prairie Road — still mailing to 98584 but under Mason County jurisdiction rather than the City of Shelton — lots run bigger, septic and well systems are common, and setback rules run through Mason County PDS instead of the city building department. Rain is the constant factor: Shelton sits close to the Olympics and sees over 60 inches a year in wetter stretches, so any slab pour needs a real vapor barrier and the roofline needs to shed water away from the house, not toward it. Older single-bay garages near Fairmount rarely meet current IRC framing or insulation code, which is usually the first thing that comes up at plan review.

commonProblems:
  - title: "Building a DADU Above the Garage Under WA HB 1337"
    description: "State law now allows up to two ADUs on a single-family lot, and a garage with a DADU on top is one of the more common requests we get in Shelton, especially on the bigger parcels out near Agate and Kamilche. The floor above the bays needs an LVL beam or PSL post system sized for live load plus snow load, not standard garage framing, and the whole structure has to stay under the 24-foot height limit and clear setback lines set by Mason County PDS or the City of Shelton, depending on the parcel. Siding and roofline need to match the primary house — usually Hardie board over the original cedar or T1-11 — so the addition doesn't look bolted on. Separate utility connection, plan review, and permit issuance typically add 6-8 weeks before framing starts. Full DADU-over-garage projects run $180K-$260K depending on finish level."
  - title: "Converting an Attached Garage to Living Space Without Foundation Cracks"
    description: "A lot of the 1950s Simpson-era houses near downtown Shelton sit on post-and-pier foundations, and converting the attached garage to a bedroom or family room means pouring a proper footing below frost depth and tying the new slab into the existing rim joist correctly. Skip the vapor barrier under that slab and you'll see cupped flooring or musty smell within a year — Shelton's soil holds moisture most of the wet season. If the conversion adds floor load, we sister joists in the adjacent framing and bump ceiling insulation to R-49 to match code for conditioned space. Electrical and mechanical (HVAC or a Mitsubishi mini-split) both need separate rough-in inspections before drywall goes up. Timeline runs 5-7 weeks for a straightforward conversion, longer if the existing slab has to come out."
  - title: "Getting Setbacks and Permits Right the First Time in Mason County"
    description: "Where the permit gets pulled depends entirely on the parcel. Lots inside city limits — most of downtown, Fairmount, and the area around Kneeland Park — go through the City of Shelton building department; unincorporated parcels out toward Arcadia, Pine Lake, and Kamilche fall under Mason County PDS, and the two offices don't always apply setbacks the same way. Typical side and rear setbacks run 5-10 feet for detached structures, and lot coverage limits can catch homeowners off guard on smaller in-city lots. TopVolk pulls the permit, handles the plan review submittal, and schedules the rough-in and final inspections directly with the AHJ — Vladislav walks the blue tape list with you before the inspector shows up. TopVolk Construction is a WA Licensed Contractor, and permit lead time in Mason County usually runs 4-8 weeks."
  - title: "What a New Garage Actually Costs in Shelton"
    description: "A standard detached two-car garage on a 4-inch fiber-reinforced slab runs $45K-$75K in Shelton, moving to $90K-$120K if you add a workshop bay, insulated Clopay door, or a heated space with a Mitsubishi mini-split. Adding a 50A or 60A EV charger circuit during framing costs a fraction of what it costs to trench and retrofit later — worth deciding on before the slab pour. Milgard windows, upgraded R-49 ceiling insulation, and PT lumber sill plates for ground contact all move the number too. Every quote from TopVolk is line-item, not a range guess, and the contract includes a penalty clause if we miss the agreed deadline. Call (206) 591-1096 for a free on-site consultation with Vladislav, not a sales rep."
  - title: "Garage Doors, Insulation, and Workshop Wiring That Hold Up to PNW Winters"
    description: "Shelton's wet season runs October through May, and an uninsulated garage door with worn weatherstripping lets in enough moisture to fog windows and rust tools by January. A Clopay insulated door paired with a LiftMaster opener and fresh bottom seal solves most of that, and R-49 ceiling insulation with a proper vapor barrier keeps a workshop usable through winter. North-facing garages near Oakland Bay tend to grow moss on the roof edge faster than south-facing lots — a wider drip edge and gutter extension helps. For a garage freezer or fridge (GE or Whirlpool chest units are common here), we run a dedicated 20A circuit so it's not sharing a breaker with the door opener and shop lights. Expect 15-20 years out of a quality insulated door before hardware replacement."

faq:
  - q: "How fast can you get to Shelton for Garage Construction?"
    a: "Shelton sits at the junction of Highway 101 and Highway 3, so it's an easy run from the rest of Mason and south Kitsap County. Site visits and free consultations typically get scheduled within a few days of your call. Access on most Shelton lots — downtown, Fairmount, or the bigger parcels toward Agate — is straightforward for a concrete truck and framing crew. Call (206) 591-1096 to get on the schedule; Vladislav does the walkthrough himself, not a scheduler."
  - q: "What does a detached garage build in Shelton cost?"
    a: "A standard two-car detached garage on a 4-inch fiber-reinforced slab runs $45K-$75K in Shelton, with workshop upgrades, insulation, or a DADU on top pushing that into the $120K-$260K range. Concrete slab thickness, EV charger pre-wire, siding type, and window package all move the price. Every job gets a line-item quote, not a ballpark range. Call (206) 591-1096 for a free on-site estimate with exact numbers."
  - q: "Do I need a permit for a garage in Shelton, and who issues it?"
    a: "Yes — garages, DADUs, and garage-to-living conversions all require permits, either through the City of Shelton building department for in-city lots or Mason County PDS for unincorporated parcels near Arcadia, Kamilche, and Pine Lake. Plan review typically takes 4-8 weeks depending on scope and whether a DADU is involved. TopVolk Construction, a WA Licensed Contractor, handles the full submittal, rough-in inspection, and final inspection so you're not chasing paperwork."
  - q: "Can you pre-wire the garage for an EV charger during construction?"
    a: "Yes, and it's cheaper to do it during framing than to retrofit later. We run a dedicated 50A or 60A circuit from the panel to the garage during rough-in electrical, sized for a Level 2 charger whether you're running Tesla, ChargePoint, or another brand. This gets inspected alongside the rest of the electrical rough-in before drywall goes up. If your panel doesn't have capacity, we'll flag that during the estimate, not after the slab is poured."
  - q: "How long does an insulated garage door and the framing around it actually last in Shelton's climate?"
    a: "A quality insulated door — Clopay is what we install most — runs 15-20 years before hardware needs replacing, assuming the weatherstripping gets swapped every few years given Shelton's wet season. Framing and slab work carries a workmanship warranty from TopVolk separate from manufacturer warranties on doors, openers, and windows. Rot and moss are the real long-term risks here, not structural failure, so drainage and drip edge detailing matter as much as the materials themselves."
  - q: "Do you cover areas outside Shelton proper, like Kamilche or Hoodsport?"
    a: "TopVolk Construction covers all of Mason County along with King, Snohomish, Pierce, and Kitsap — Kamilche, Agate, Arcadia, and the Hoodsport corridor are all within normal driving range. Scheduling windows run similar to in-city Shelton jobs, usually a few days out for the initial site visit. Call (206) 591-1096 and Vladislav will confirm timing based on where your lot sits and which jurisdiction the permit runs through."