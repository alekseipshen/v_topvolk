  - q: "Do I need a permit for electrical work in Shelton?"
    a: "Yes — any panel upgrade, new circuit, or rewiring inside Shelton's city limits needs a permit through the City of Shelton building department, and properties out toward Kamilche or Skokomish Valley go through Mason County's permit center instead. Plan review on a straightforward panel swap usually takes 1-2 weeks; a full rewire with multiple inspections can run 3-4 weeks end to end. TopVolk pulls the permit, schedules the rough-in inspection before walls close up, and handles the final inspection — all included in the quote. As a WA Licensed Contractor, Vladislav handles that paperwork directly instead of leaving it on the homeowner."
  - q: "Do I need AFCI and GFCI breakers if I'm just replacing a panel?"
    a: "If a permit is pulled for the panel, current NEC code generally requires AFCI protection on bedroom circuits and GFCI protection in kitchens, bathrooms, and garages — inspectors will hold up final sign-off without it. TopVolk installs combination AFCI/GFCI breakers, Square D or Eaton matched to the panel brand, rather than retrofitting older breaker styles that don't meet current listing requirements. This usually adds a few hundred dollars to a panel swap but avoids a failed inspection and a second site visit. Worth doing right the first time, especially on older Shelton homes where the existing panel predates these requirements entirely."
  - q: "How long does new panel or wiring work last in Shelton?"
    a: "A properly installed 200A panel with copper wiring should last 30-40 years with normal use, and GFCI/AFCI breakers are typically good for about a decade before the trip mechanism needs testing or replacement. Humidity off Oakland Bay and Puget Sound can corrode outdoor panel components faster than inland areas, so TopVolk uses weatherproof, in-use covers on any exterior disconnect or meter base. Workmanship on electrical work done as part of a TopVolk project is backed by the contract terms set at quote time, including the deadline penalty clause if the job runs past the agreed date. Materials carry standard manufacturer warranties from GE, Square D, or Eaton."
