title: "Shelton HVAC — Heat Pump & Mini-Split Conversions"

answer: "TopVolk converts propane furnaces and forced-air systems to heat pumps and ductless mini-splits in Shelton, Washington — owner-run, 100+ jobs completed to date."

intro: |
  TopVolk handles HVAC conversions in Shelton as part of larger remodel and ADU work — heat pump swaps, ductless mini-split installs, and propane furnace replacements — with Vladislav Volkov running the job from first walkthrough to final inspection, not a dispatcher. Sanderson Field isn't the only thing in town still burning propane; the gas main from Olympia never stretched out this far, so most houses off Johns Prairie Road and Cloquallum Road run on propane, oil, or straight electric baseboard. That matters when a 20-year-old propane furnace finally quits in February and the homeowner wants options instead of a same-brand replacement. An Amana furnace swap is the common budget move, and for additions or a detached ADU behind the house, a Samsung or Mitsubishi ductless mini-split usually costs less than extending ductwork through a crawlspace that was never sized for it. TopVolk isn't a repair-and-run outfit — this is project-based work, usually bundled with a remodel, addition, or ADU build, quoted line by line before the first permit gets pulled. Call (206) 591-1096 to talk through what's actually feasible on your lot.

localContext: |
  Shelton housing runs older and plainer than King County — a lot of 1960s-70s ranch homes near downtown (98584), single- and double-wide manufactured homes scattered through unincorporated Mason County (98588), and newer stick-built construction going in around Shelton Valley and Kamilche. Plenty of these houses were built before heat pumps were standard, so the ductwork is undersized 6-inch flex running to rooms that were added later — that's why the back bedroom is always ten degrees off from the living room. Homes inside Shelton city limits need a mechanical permit through the City of Shelton Building Department; anything out past the city line — Johns Prairie, Agate, Arcadia — falls under Mason County Community Development instead, and that changes which inspector shows up for the rough-in and final. Crawlspaces here run damp most of the year off Oakland Bay humidity, so vapor barrier condition and duct insulation (R-8 minimum) get checked before TopVolk quotes any heat pump or furnace swap. Winter lows in the teens aren't rare, which matters for heat pump sizing and backup heat strip decisions.

commonProblems:
  - title: "Propane Furnace Swapped for a Heat Pump — and the Rebate Math Homeowners Get Wrong"
    description: "A 20-year-old propane furnace dying in the crawlspace is the most common call TopVolk gets from Shelton homeowners near Johns Prairie. The fix is usually a heat pump conversion — new outdoor condenser, indoor air handler, refrigerant line set, and a reversing valve so the same system heats in January and cools in August. Amana and Mitsubishi both make units common on tighter budgets, and because Shelton's median household income sits under $47K, plenty of homes here qualify for the higher-tier Inflation Reduction Act HEEHRA rebate — sometimes covering most of the equipment cost, not just a tax credit next April. Installs run 2-3 days once the propane tank is disconnected and backup heat strips are wired in for the cold snaps. TopVolk handles the paperwork alongside the install so the rebate doesn't get lost."
  - title: "Adding a Room or a DADU Behind the House Without Tearing Into Existing Ductwork"
    description: "Plenty of Shelton lots are big enough for a detached ADU under WA's 2024 statewide law, and running new ductwork from the main house to a DADU out back almost never makes sense. A ductless mini-split — outdoor compressor, wall-mounted head unit, and a refrigerant line set through a 3-inch wall penetration — heats and cools the new space on its own circuit. Samsung and Daikin units are the common budget-to-mid picks for a single-zone setup; Mitsubishi runs a step up for multi-zone jobs covering an addition plus a bonus room. A single-zone mini-split for a DADU or addition typically runs $4,500-$7,500 installed, depending on line set length and electrical panel capacity. Most panels in older Shelton homes are 100-amp, so that gets checked before quoting."
  - title: "Hot Living Room, Cold Back Bedroom — Ductwork That Was Never Sealed Right"
    description: "Ranch homes built in the 60s and 70s around downtown Shelton usually have a metal plenum with branch ducts that were never sealed with mastic — just spun on with sheet metal screws and duct tape that gave out years ago. Rebalancing means new dampers at the branch takeoffs, sealing the plenum and rim joist penetrations, and adding R-8 insulation where the trunk line runs through an unheated crawlspace. Any time a furnace or heat pump gets replaced, a mechanical permit is required — City of Shelton Building Department if the house sits inside city limits, Mason County Community Development for Johns Prairie, Agate, or Arcadia addresses. TopVolk pulls the permit before work starts and schedules the rough-in and final inspection around the AHJ's calendar, which usually adds a few days to the timeline, not weeks. A duct sealing and rebalance job typically takes 1-2 days."
  - title: "What a Furnace or Heat Pump Swap Actually Costs in Shelton"
    description: "A straight furnace replacement in Shelton usually lands between $5,500 and $9,000 installed, depending on AFUE rating, ductwork condition, and whether venting needs to change from a metal flue to PVC intake/exhaust for a 95%+ AFUE unit. A full heat pump conversion runs higher — typically $9,000-$16,000 — because it includes the outdoor unit, line set, electrical work for the new circuit, and sometimes a panel upgrade if the house is still on 100-amp service. Amana and GE both back their residential units with 10-year parts warranties when installed by a licensed contractor and registered within 60 days. TopVolk gives a line-item quote before any deposit changes hands, not a ballpark range, and if the completion date in the contract slips, that penalty is written in — not a verbal promise. Call (206) 591-1096 for an on-site quote."
  - title: "How Long These Systems Actually Last in Mason County's Wet Winters"
    description: "A gas or propane furnace generally lasts 15-20 years in this climate if the condensate line and heat exchanger get checked yearly; a heat pump's outdoor unit takes more of a beating from Shelton's wet winters and typically runs 12-15 years before the compressor starts struggling. Ductless mini-split coils need a rinse every year or two — the humidity off Oakland Bay pushes mildew into the wall cassette faster than it would in a drier climate. Smart thermostats like a Nest or ecobee pay off here more than people expect, mostly because they catch a mini-split running nonstop when a filter's clogged or a zone damper's stuck open. Annual maintenance runs $150-$250 per system and catches most of what would otherwise turn into a mid-winter no-heat call. TopVolk sets up zoning during install so upstairs and downstairs aren't fighting the same thermostat."

faq:
  - q: "How fast can you get to Shelton for Hvac?"
    a: "TopVolk runs most of its remodel and ADU work out of the Seattle Metro area, but Shelton HVAC jobs tied to a bigger project get scheduled directly — usually a 60-75 minute drive down US-101 or Highway 3 from the Tacoma side. On-site consultations get booked within a few days of a call, and once a contract's signed, a straight furnace or mini-split install typically starts within 2-3 weeks depending on equipment lead time. Most Shelton properties have driveway or gravel-pad parking, so access isn't usually the holdup — permitting and equipment ordering are. Call (206) 591-1096 to get on the schedule."
  - q: "What does a ductless mini-split installation cost in Shelton?"
    a: "A single-zone ductless mini-split for an addition or DADU in Shelton typically runs $4,500-$7,500 installed, while a whole-house heat pump conversion lands between $9,000 and $16,000 depending on line set length, electrical panel capacity, and whether backup heat strips are needed for cold snaps. Multi-zone Mitsubishi setups covering more than one room cost more per zone but less than running new ductwork. Pricing depends on crawlspace access, existing panel amperage, and how far the outdoor unit sits from the indoor head. TopVolk gives a free on-site estimate with exact line-item pricing — no ballpark number over the phone."
  - q: "Do I need a permit for HVAC work in Shelton?"
    a: "Yes — any furnace, heat pump, or ductless mini-split installation needs a mechanical permit, and which office issues it depends on the address. Inside Shelton city limits it's the City of Shelton Building Department; out in unincorporated Mason County — Johns Prairie, Agate, Arcadia, Kamilche — it's Mason County Community Development instead. Plan review on a straightforward equipment swap usually takes 1-2 weeks, longer if it's bundled into a larger addition or ADU permit set. TopVolk is a WA Licensed Contractor and pulls the permit, schedules the rough-in inspection, and handles the final sign-off as part of the job — homeowners don't deal with the AHJ directly."
  - q: "Can a heat pump actually keep up when it's freezing outside?"
    a: "Cold-climate heat pumps from Mitsubishi and Daikin are rated to keep producing heat well below 5°F, which covers Shelton's occasional teens-and-single-digit nights without much trouble. TopVolk sizes the backup heat strip or keeps the propane furnace as a secondary source for the coldest stretches, so the system isn't undersized for a rare cold snap. Ductless setups also get a zoning plan built in — a Nest or ecobee thermostat can favor the mini-split most of the year and only bring backup heat online when the outdoor temperature drops past the unit's efficiency curve. That balance gets set during commissioning, not guessed at."
  - q: "What's the warranty on a new furnace or heat pump in Shelton?"
    a: "Amana and GE equipment installed by TopVolk carries a manufacturer parts warranty of 10 years when registered within 60 days of install, plus a 1-year labor warranty on the installation itself. Given Shelton's wet winters and the humidity coming off Oakland Bay, outdoor heat pump units typically run 12-15 years before major components need attention, and furnaces last closer to 15-20 years with annual maintenance. Corrosion on outdoor coils is the most common early-failure cause here, which is why unit placement and a basic maintenance schedule matter more in Mason County than in a drier climate."
  - q: "Do you cover areas near Shelton, and how far out is scheduling?"
    a: "TopVolk covers HVAC work tied to remodels and ADUs from the Seattle Metro area down through Olympia, Shelton, and the rest of Mason County — including Belfair, Union, and Allyn. Scheduling in Shelton usually runs 2-4 weeks out for a straightforward equipment swap, sooner if it's an emergency furnace failure in the middle of winter. Vladislav Volkov handles every quote directly, so there's no sales rep in the loop and no middleman marking up the estimate. Call (206) 591-1096 or ask for a free on-site consultation to get a date locked in."