title: "Shelton Kitchen Remodel — Timber-Town Homes, Real Numbers"

answer: "TopVolk Construction handles full kitchen remodels in Shelton, WA — owner-led, 100+ projects since 2023, line-item free estimates."

intro: |
  Tear out the wall between a cramped galley kitchen and the dining room in one of Shelton's old Simpson Timber worker cottages, and the first question is what's holding the roof up — that's the job TopVolk Construction runs start to finish in Shelton, with owner Vladislav Volkov on-site instead of a rotating cast of subs and sales reps. Plenty of the ramblers off Wallace Kneeland Boulevard and the smaller houses near Railroad Avenue still run on a 100-amp panel and a Frigidaire range that's outlasted three roofs. Shelton grew up around the mill, and a lot of that housing stock got built fast and cheap in the 1950s and 60s — narrow kitchens, load-bearing walls in the wrong spot, cabinets nobody expected to last seventy years. TopVolk has completed 100+ projects since 2023 across the Puget Sound region, and every contract includes a deadline penalty, not just a verbal promise. Call (206) 591-1096 for a free on-site estimate before anyone touches the drywall.

localContext: |
  Building stock in Shelton splits between in-city lots around zip 98584 and unincorporated Mason County parcels stretching toward Kamilche and Arcadia, where kitchen remodel permits route through Mason County Community Development instead of the City of Shelton Building Department. The Railroad Avenue core and the streets around Kneeland Park still hold Simpson Timber-era cottages from the 1940s and 50s — narrow footprints, galvanized supply lines, and fuse panels nobody's touched since Eisenhower was president. Head out past city limits toward the 98589 rural routes off Agate Road and Shelton Matlock Road, and you'll find more 1970s-80s manufactured homes and stick-built ranchers running 100-amp service that can't handle an electric range and a Mitsubishi mini-split running at the same time. Hood Canal keeps the air damp most of the year, so any remodel that opens up a subfloor near an exterior wall needs a proper vapor barrier and sometimes a sistered joist where moisture softened the original framing. Permit turnaround through Mason County averages 3-6 weeks for a kitchen remodel touching electrical and plumbing, longer if a gas line gets rerouted.

commonProblems:
  - title: "Load-Bearing Walls Behind Simpson Timber Cottage Galley Kitchens"
    description: "Open up a 1950s Simpson Timber cottage kitchen and the wall between the kitchen and dining room is almost always load-bearing — these houses were framed with 2x4 Douglas-fir studs and minimal engineering, no drawings to check against. Vladislav uses a stud finder and a peek in the attic first, then sizes an LVL beam or PSL post to carry the load before any wall comes down, with temporary shoring holding the ceiling in the meantime. Skip this step and you get sagging drywall or a cracked ceiling six months later. Structural work like this runs $4,000-$7,500 depending on span length and whether a new post needs a footing, and it typically adds 3-5 days to a 6-10 week kitchen remodel timeline."
  - title: "Choosing Between IKEA, Semi-Custom, and Full Custom Cabinets on a Shelton Budget"
    description: "Mason County's median household income sits well under the state average, so most Shelton kitchen remodels lean toward IKEA or semi-custom face-frame cabinets instead of full custom boxes that can run double the price. IKEA cabinet systems work fine for a straightforward layout, but they're built to metric dimensions, which sometimes means custom filler panels where they meet an out-of-square 1960s wall. Semi-custom cabinets from a regional supplier add 2-4 weeks to the timeline but fit odd angles and taller ceilings without shimming everything by hand. A full cabinet package — boxes, hardware, install — typically runs $8,000-$18,000 for an average Shelton kitchen, paired with GE or Whirlpool appliances that fit standard 30-inch and 36-inch openings without a special-order surcharge."
  - title: "Bumping a 100-Amp Panel to 200A for an Induction Range"
    description: "A Whirlpool or GE induction range needs a dedicated 40-amp, 240-volt circuit, and a lot of Shelton houses built before 1975 are still running the original 100-amp service — not enough headroom once you add a range, a dishwasher, and maybe a Mitsubishi mini-split down the line. The fix is a panel upgrade to 200A, coordinated with Mason PUD 3 for the service drop and permitted through the City of Shelton Building Department or Mason County, depending on the address. That permit needs an electrical plan review, a rough-in inspection before drywall goes back up, and a final inspection before the AHJ signs off. Panel upgrades run $3,200-$5,500 and typically add 2-3 weeks to the schedule once you factor in utility coordination and inspection scheduling."
  - title: "Quartz Holds Up Better Than Granite in a Damp Kitchen"
    description: "Granite needs sealing every 12-18 months to stay stain-resistant, and in a Hood Canal climate where the kitchen window stays cracked open most of the summer, homeowners tend to forget. Quartz doesn't need sealing at all — it's an engineered slab, non-porous, and it handles the acidic splashes from canning and crabbing season a lot better than natural stone. Large-format porcelain is another option for a backsplash that won't grout-stain the way subway tile does over a gas range. Quartz runs $55-$95 per square foot installed depending on the slab tier, versus $45-$85 for granite, but the quartz manufacturer warranty usually runs 10-15 years against staining and cracking, where granite sealant is on the homeowner to maintain."
  - title: "Old Appliance Cutouts and Gas Line Changes Slow the Schedule"
    description: "Swap a 20-year-old Kenmore or Amana range for a new GE or Frigidaire slide-in, and the cabinet cutout is rarely the right size — older Shelton kitchens were often built around whatever appliance was on sale in the 1990s, not a standard opening. A gas range swap can also trigger a venting change, since code now calls for a range hood rated at 400+ CFM for gas cooking, and any gas line modification needs a permit and a pressure test before the gas company will reconnect service. Skipping the permit step is the fastest way to fail a final inspection and delay move-in by weeks. Budget an extra $800-$1,500 for cabinet modification or filler panels when appliance sizes don't match, and expect the gas permit and inspection to add 1-2 weeks if the line needs rerouting."

