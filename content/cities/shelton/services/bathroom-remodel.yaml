title: "Shelton Bathroom Remodel — Fixing Mill-Town Bathrooms"

answer: "Full bathroom remodels in Shelton, WA run $16,000-$38,000, take 3-5 weeks, and are run on-site by owner Vladislav Volkov, a WA Licensed Contractor."

intro: |
  A gutted 5x8 bathroom in a 1970s mill-worker rancher off Cota Street usually runs $16,000 to $38,000. It takes three to five weeks from demo to final inspection. Vladislav Volkov runs the job himself — no sales rep in between. Shelton's housing stock leans heavily on Simpson Timber-era ranch homes and 1970s-80s manufactured units. Most of the tubs and vanities in those houses have never been touched since the original build. Near Kneeland Park and out toward Oakland Bay, crews still open walls and find pink four-piece tub/shower units bolted straight to the studs. Cast-iron drains flake rust. A GE bath fan that quit venting years ago sits behind the wall, doing nothing. Swapping that old tub for a curbless shower with a Schluter Kerdi membrane underneath solves the moisture problem for good — no more caulk tubes papering over the crack. Mason County's damp winters don't forgive shortcuts on waterproofing.

localContext: |
  Most of Shelton sits in 98584. Rural stretches out toward Skokomish and Potlatch carry a 98588 mailing address. Both zones share the same building stock: single-story ranch and split-level homes built by Simpson Timber Company crews between 1955 and 1980, plus a wave of manufactured and modular homes from the 80s and 90s scattered through Arcadia and out Agate Road. Bathrooms in these houses are almost always original. Pink or avocado tile. Galvanized supply lines. A single sheet of vinyl flooring laid straight over particleboard subfloor that's gone soft by the tub. Permits for a full gut remodel go through Mason County Community Development. If plumbing or electrical moves, expect a mechanical and plumbing permit alongside the building permit, plus a rough-in inspection before any drywall goes up. Mason County gets over 60 inches of rain a year in spots near the Olympic foothills. A bathroom without real exhaust ventilation is fighting mold before the paint even cures. Homes closer to downtown, near Railroad Avenue and the courthouse, tend to have cast-iron drain stacks. Those need rerouting to PVC when a shower gets relocated.

commonProblems:
  - title: "Builder-Grade Tub/Shower Combos From the 1970s-80s Mill Housing Boom"
    description: "Walk into most Shelton ranch homes built during the Simpson Timber housing push and you'll find the same one-piece fiberglass tub/shower surround. It's usually cracked at the corner seams and caulked over three or four times already. Behind it, the greenboard is often soft. Decades of moisture work through gaps around the spout and shower arm. We tear the unit out, check the wall framing for rot, and install a walk-in shower instead. A Schluter Kerdi waterproofing membrane goes under large-format porcelain tile — no more surround that'll crack again in fifteen years. A straight tub-to-shower conversion in a home like this runs $7,500 to $14,000, depending on tile and glass. It takes about a week once demo starts. Homeowners near Kneeland Park and along Cota Street have been dealing with this same setup since the houses went up."
  - title: "Moisture Damage From Mason County's Wet Winters"
    description: "Sixty-plus inches of rain a year and long stretches of humid air off Oakland Bay mean a bathroom without proper ventilation grows mold fast. This happens even faster in homes where the exhaust duct just dumps into the attic instead of routing outside. It shows up constantly in manufactured homes out toward Kamilche and older stick-built ranches near downtown — a GE or Broan fan that sounds like it's working but isn't actually moving air past the roofline. The fix is a properly ducted fan sized to the room's square footage. Run it through R-49 insulated ducting to a roof or wall cap, paired with a RedGard liquid membrane behind any tile that touches water. Skipping this step costs homeowners twice — once in remodel dollars, again a few years later when the drywall behind the tile turns black and has to be cut out and redone."
  - title: "Cast-Iron Drain Stacks and Permit Timing for a Full Layout Change"
    description: "Homes built before 1980 near downtown Shelton and along Railroad Avenue often still run on cast-iron drain stacks. Moving a toilet or shower more than a few feet means cutting into that stack and tying in new PVC with proper slope and venting. That work triggers a plumbing permit through Mason County Community Development on top of the building permit. Inspectors want a rough-in inspection before any wall gets closed up. Plan on four to six weeks for permit review and inspections if the layout is changing, versus a couple weeks for a like-for-like swap. TopVolk Construction is a WA Licensed Contractor with 100+ projects completed since 2017. Vladislav pulls the permits himself — no waiting on a subcontractor to get around to it. Call (206) 591-1096 and we'll walk through what your layout change actually requires."
  - title: "What a Full Bathroom Remodel Actually Costs in Shelton"
    description: "A full gut-and-rebuild bathroom in a Shelton home typically runs $16,000 to $38,000. The spread comes down to tile choice, whether the layout changes, and what's hiding behind the old surround once demo starts. Median household income here sits around $46,000, so most jobs we quote lean toward semi-custom cabinets instead of full-custom. We spec a Kohler or Moen fixture package instead of designer brands. A Whirlpool or GE water heater upgrade only gets added when the existing unit can't keep up with a new shower head's flow rate. Every quote is a line-item breakdown — tile, labor, plumbing rough-in — not a range pulled out of the air. Deadline penalties are written into the contract itself. If the job runs past the agreed date without a documented reason, TopVolk pays for it, not you."
  - title: "When to Repair vs. Replace a Vanity, Fan, or Shower Valve"
    description: "A laminate vanity swelling at the base from years of splashed water is done. No amount of resealing saves particleboard once it's swollen. It gets replaced with a moisture-resistant cabinet box and a quartz or cultured marble top. A shower valve is a different story — it can often be rebuilt. If it's a Moen or Delta cartridge-style valve less than 20 years old, swapping the cartridge and trim kit is a $400-$800 fix instead of a full wall demo. Exhaust fans have about a 10-15 year lifespan before the bearings wear out and airflow drops. A new GE or Panasonic fan with a humidity sensor solves the mold problem for good in Shelton's damp climate. Finish work carries a one-year workmanship warranty. Fixtures carry whatever the manufacturer offers on top of that."

