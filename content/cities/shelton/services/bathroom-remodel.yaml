  - q: "Do I need a permit for a bathroom remodel in Shelton?"
    a: "Yes, if you're moving plumbing fixtures, changing the electrical, or altering the layout. Mason County Community Development requires a building permit along with plumbing and electrical permits as needed. A like-for-like fixture swap with no layout change usually doesn't need one. Anything touching the drain stack or adding a curbless shower pan does. TopVolk pulls permits directly as a WA Licensed Contractor. Typical review takes two to four weeks before permitted work can start. Expect a rough-in inspection after plumbing and electrical are roughed in, and a final inspection before trim goes in."
  - q: "Is a curbless shower worth it for an aging-in-place remodel?"
    a: "For homeowners planning to stay in their Shelton home long-term, a curbless shower removes the trip hazard a standard curb creates. It uses a linear drain and a Schluter Kerdi-Line waterproofing system, and pairs well with grab bars and a built-in bench. The floor gets sloped to the drain during framing, not just at the tile layer. That means it holds up under daily use instead of pooling water at the threshold. It's usually $1,500-$3,000 more than a standard curb shower. But it holds up in a market where more buyers want single-level living."
  - q: "What's the warranty on a Shelton bathroom remodel?"
    a: "TopVolk backs all workmanship — tile setting, waterproofing, cabinet installation — with a one-year warranty. Fixture brands like Moen, Kohler, and GE carry their own manufacturer warranties on top of that, typically 5-10 years on cartridges and fan motors. In Shelton's humid climate, the waterproofing membrane behind tile matters more than the tile itself for long-term durability. A properly installed Schluter or RedGard system should outlast the tile job by decades if the fan is sized and vented correctly. What's covered and what's normal wear gets spelled out upfront, not buried in an addendum."
