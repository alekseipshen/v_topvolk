title: "Shelton Handyman Services — Oakland Bay Area Repairs"

answer: "TopVolk Construction handles handyman punch lists, fixture swaps, and deck repairs in Shelton, Washington — owner-led, most jobs scheduled within a week."

intro: |
  TopVolk Construction fields handyman calls in Shelton for the jobs too small for a full remodel contract and too specific for a big-box repair service — a wobbly deck rail off Oakland Bay, a punch list left over from a bathroom job, a Whirlpool dishwasher that needs its supply line swapped before the old one floods a crawlspace. Vladislav Volkov runs these jobs directly, no dispatcher relay, no subcontractor roulette. Shelton's older homes near Kneeland Park and the ones scattered along Johns Prairie tend to need the same handful of fixes: rotted trim under the eaves, drafty single-pane windows that never got weatherstripped right, and light fixtures wired decades before anyone thought about dimmer compatibility. Mason County's rain — most of it falling between October and May — doesn't help any of that stay fixed for long. TopVolk has handled 100+ projects since 2017 across the Puget Sound region, and Shelton punch-list and repair calls get folded into that same schedule, with a real price quote before anyone picks up a drill.

localContext: |
  Housing in 98584 runs old to newer-built, with a good chunk of stock from the 1950s-70s scattered between downtown Shelton and the Arcadia/Agate area, plus manufactured and stick-built homes further out toward 98588 and the Skokomish Valley. A lot of the older stock still has original trim carpentry and single-pane aluminum windows that were never upgraded when vinyl replacement became standard — that means weatherstripping and door sweep work comes up constantly. Mason County doesn't require a permit for most handyman-scale work (fixture swaps, deck board replacement, drywall patching), but anything touching structural framing on a deck ledger or adding a new electrical circuit needs a look from Mason County Community Development before work starts. Homes near Oakland Bay and along the water get more moisture exposure — moss on north-facing roof lines, soffit rot, gutters packed with fir needles by November. Median household income here runs under $47K, so most jobs lean toward practical repair over upgrade: fixing what's there with a GE or Frigidaire replacement part rather than a full remodel.

commonProblems:
  - title: "Punch Lists That Outlive the Remodel Crew"
    description: "A kitchen or bath remodel crew finishes the big stuff — cabinets, counters, flooring — and leaves behind a list of small stuff nobody circles back for: a Moen faucet handle that's loose because the mounting nut never got torqued, a bead of silicone caulk missing where the tub surround meets the wall, cabinet pulls sitting in a drawer instead of screwed into the door. Those callbacks matter because TopVolk's remodel contracts carry a penalty clause for missed deadlines, and closing out the punch list fast is part of keeping that promise. Most Shelton punch lists — five to fifteen items — get knocked out in a single four-to-six hour visit, running $250 to $600 depending on touch-up paint matching and hardware installation. Call (206) 591-1096 to get one scheduled before it sits for another six months."
  - title: "Drywall Patches That Show Up Under Bad Light"
    description: "Small holes left after a wall-mounted heater comes out, a shelf bracket gets moved, or a smart thermostat swap leaves old wire holes wider than the new unit covers — patching them well is about matching the texture, not just filling the hole. A lot of Shelton homes built through the 70s and 80s have knockdown or orange-peel texture that's hard to blend without the right hopper gun setup and a fast-setting compound like CertainTeed EasySand. Get the mud right but skip the texture match, and the patch shows up like a scar every time the light hits it sideways. A mesh patch works fine for holes under six inches; anything bigger usually means cutting back to the nearest stud and hanging a new piece of drywall. Most patch-and-texture jobs in the 98584 area run $150-$450 and finish in one visit, paint included if the can's still around."
  - title: "Fixture Swaps That Turn Into Bigger Jobs"
    description: "Swapping a kitchen faucet, a toilet, or a light fixture sounds simple until the old shutoff valve won't turn, the wax ring under the toilet has been compressed for twenty years, or the electrical box behind an old fixture isn't rated for the new one's weight. TopVolk replaces these fixture-by-fixture — Kohler or Moen faucets, comfort-height toilets, GE or Samsung range hoods — without opening a full plumbing or electrical permit, since the scope stays inside Mason County's like-for-like replacement rules. Anything that changes a circuit, like a new GFCI outlet or a ceiling fan where there wasn't one before, gets pulled through the proper permit path, and TopVolk is a WA Licensed Contractor so that paperwork isn't a scramble. A toilet or faucet swap runs about $200-$450 in parts and labor; a light fixture with existing wiring is usually under two hours."
  - title: "Deck Boards and Railings That Never Get Fixed Right"
    description: "Deck boards on the shady side of a house near Oakland Bay, or under fir trees off Johns Prairie Road, rot from the underside first, where moisture sits against the joist and never fully dries between October and May. TopVolk sisters in new joists where the old ones have gone soft, replaces board-by-board with pressure-treated lumber or Trex composite decking, and rebuilds loose railing posts to code — 36-inch height minimum, balusters spaced so a 4-inch sphere can't pass through. Composite costs roughly double PT lumber per board upfront but skips the yearly re-staining and lasts 25+ years against the 10-15 you'll get from PT in this climate. A full board-and-rail repair on an average 200 sq ft deck runs $2,500-$6,500 depending on how much framing underneath needs replacing, with a written quote before any board comes up."
  - title: "Weatherstripping and Smart Home Add-Ons That Don't Hold Up"
    description: "Weatherstripping breaks down faster in Mason County than on the dry side of the state — foam and vinyl gaskets around older doors and windows compress, crack, and stop sealing after 5-8 years of damp winters, and that's when heating bills start climbing before anyone notices why. TopVolk replaces door sweeps, window gaskets, and threshold seals as a standalone job or bundles it with a smart thermostat install (Nest, Ecobee) that finally has accurate data to work with once the drafts are gone. Doorbell cameras — Ring, Google Nest — get mounted with proper low-voltage wiring or battery placement that keeps them charged through a Pacific Northwest winter instead of dying every three weeks. Weatherstripping a standard house runs $300-$700; a smart thermostat or doorbell add-on is usually $150-$300 including the device if TopVolk supplies it."

