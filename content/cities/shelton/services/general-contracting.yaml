title: "Shelton General Contracting — One Contractor, Full Remodel"

answer: "TopVolk Construction LLC handles full remodels, additions, and ADUs in Shelton, WA — owner-led, 100+ projects completed, deadline penalties in the contract."

intro: |
  Vladislav Volkov personally runs every full remodel, addition, and ADU build TopVolk Construction LLC takes on in Shelton, Washington — 100+ projects completed since 2017, no sales rep, deadline penalties written into the contract instead of promised over the phone. Pull the cabinets in a kitchen near Railroad Avenue and it's common to find a decades-old GE range hood wired straight into knob-and-tube that nobody disclosed at closing. Near Kneeland Park and the flood-prone stretch along Goldsborough Creek, older mill-town homes sitting on post-and-pier foundations need framing, electrical, plumbing, and HVAC sequenced by one person — not four separate schedules that never line up. That coordination is the whole job here, direct from the owner, with no dispatcher or middleman slowing things down. A cabinet swap that turns into a full electrical panel upgrade isn't rare in a town built around the old Simpson Timber mill, and pricing that kind of job by line item — not a vague range — is how TopVolk avoids the change-order surprises that stall projects for weeks.

localContext: |
  Most of Shelton falls under zip code 98584, with rural pockets toward Tahuya and the Kitsap Peninsula side sitting in 98588 — TopVolk covers both. Housing here splits a few ways: modest single-family homes from the 1950s-60s mill-worker era near downtown and Wallace Kneeland Boulevard, newer stick-built construction out toward the Highway 3 corridor, and a fair number of manufactured and mobile homes on larger lots, typical for Mason County's price point. Older stock still running galvanized supply lines and post-and-pier foundations needs different structural planning than a 1990s tract home on a slab — sistering a rim joist or swapping in an LVL beam for a load-bearing wall isn't the same job twice. Permits for work inside city limits go through the City of Shelton Community & Economic Development Department; addresses outside the boundary — and plenty of Mason County parcels carry a Shelton mailing address without being inside it — route through Mason County Community Development instead. Heavy rain off Hood Canal means crawlspace vapor barriers and proper drainage around any addition aren't optional.

commonProblems:
  - title: "Framing, Plumbing, and Electrical Crews That Never Talk to Each Other"
    description: "Hire the framer through one ad and the electrician through another, and nobody's checking whether the electrical rough-in lines up with where the framer put blocking for a future range hood mount. TopVolk runs MEP coordination as one job, not three: the framing crew sets joist hangers and blocking exactly where the plumber needs a wet wall and the electrician needs a panel run, all before drywall goes up. On a typical Shelton kitchen remodel — pulling a dated GE range and adding 220V for an induction unit — that coordination alone saves two to three weeks versus homeowners scheduling trades themselves. Skip it, and you're paying to reopen finished drywall. A full kitchen gut here runs 6-10 weeks start to finish when trades are sequenced correctly."
  - title: "Demo Day Finds Rot Nobody Budgeted For"
    description: "Pull the subfloor in a 1960s Shelton rancher near Kneeland Park and it's common to find a rim joist gone soft from decades of moisture working up through a post-and-pier foundation with no vapor barrier underneath. That's close to routine in Mason County's older housing stock, especially anything within a few blocks of Goldsborough Creek. TopVolk prices a structural contingency into the contract up front instead of hitting homeowners with a change order mid-project: sistering a joist, replacing a section of rim joist with pressure-treated lumber, or swapping a rotted PSL post typically adds $2,000-$6,000 depending on how much has to come out. Homeowners know the range before demo starts, not after the wall's already open."
  - title: "Permit Delays Between City of Shelton and Mason County"
    description: "Permits for work in Shelton run through one of two offices depending on which side of the city boundary the lot sits on — plenty of addresses with a Shelton mailing label are technically unincorporated Mason County. Plan review for a full remodel or addition typically takes 3-6 weeks with either the City of Shelton Community & Economic Development Department or Mason County Community Development, longer if the project touches a load-bearing wall or adds square footage. TopVolk is a WA Licensed Contractor and handles the permit application, plan review submittal, and inspection scheduling — rough-in inspection before drywall goes up, final inspection at the end — as part of the contract, not a separate line item. Skipping that step to save time is how homeowners end up with a punch list they can't close out because the AHJ won't sign off."
  - title: "What a Real Remodel Costs in Shelton vs. a Lowball Quote"
    description: "A kitchen remodel in Shelton typically runs $35,000-$65,000 depending on layout changes, cabinet grade, and whether the electrical panel needs an upgrade to support new appliances. Additions and DADU builds start closer to $120,000 once a new foundation, mechanical rough-in, and utility hookups are factored in. Given the median household income here sits under $47,000, a lot of homeowners are working with semi-custom or IKEA cabinets and mid-range appliances like Whirlpool, Frigidaire, or Amana rather than high-end brands — a reasonable call, not a downgrade in the quality of work. TopVolk gives line-item quotes with actual numbers, not a range that balloons once demo starts, and every contract includes a penalty clause if the finish date slips past what's written down."
  - title: "Hood Canal Humidity Wears Out Additions Built the Wrong Way"
    description: "Wood siding on the north side of a house near Oakland Bay grows moss within two or three years if it's not detailed right, which is why TopVolk specs Hardie cement-board siding on most additions and DADUs instead of cedar that needs repainting every 5-7 years. Crawlspaces get a sealed vapor barrier as standard, not an upsell, because Mason County's damp ground and a post-and-pier foundation are a bad combination without one. New additions get R-49 insulation in the ceiling and a Mitsubishi mini-split for heating and cooling instead of an old wall furnace, which cuts utility bills noticeably through a wet Pacific Northwest winter. Expect 15-20 years before Hardie siding needs attention versus repainting cedar every few years — the upfront cost difference pays for itself."

faq:
  - q: "How fast can you get to Shelton for General Contracting?"
    a: "Shelton sits about 25 minutes off Highway 101 from Olympia, and TopVolk covers Mason County as part of its regular Seattle Metro-area service radius — most on-site consultations get scheduled within a week of a call. Parking and equipment staging usually aren't an issue on Shelton lots, which tend to run bigger than in-city Seattle parcels. Vladislav does the walkthrough himself, not a scheduler reading off a script, and a full remodel typically breaks ground 4-6 weeks after signing once permits are submitted. Call (206) 591-1096 to get a free consultation on the calendar."
  - q: "What does a whole-house remodel in Shelton cost?"
    a: "A whole-house remodel in Shelton generally lands between $80,000 and $180,000+ depending on square footage, whether the electrical panel and plumbing get fully replaced, and how much of the existing structure — foundation, framing, roof — needs work versus staying as-is. Older homes near downtown with post-and-pier foundations and galvanized plumbing tend to run higher because more gets replaced before finish work even starts. Cabinet grade, countertop material (quartz vs. laminate), and appliance tier move the number up or down significantly too. TopVolk provides a free on-site estimate with actual line-item pricing, not a ballpark range — call (206) 591-1096 to schedule one."
  - q: "Do I need a permit for a home addition in Shelton?"
    a: "Yes — any addition, structural remodel, or DADU build needs a permit, and which office handles it depends on whether the lot is inside Shelton city limits or unincorporated Mason County. Projects inside city limits go through the City of Shelton Community & Economic Development Department; addresses outside the boundary route through Mason County Community Development instead, both applying the IRC as the base code. Plan review usually takes 3-6 weeks, with rough-in and final inspections scheduled once framing and MEP work are in. TopVolk is a WA Licensed Contractor and handles the entire permit application and inspection process as part of the job."
  - q: "Can you add a DADU or ADU on my Shelton property?"
    a: "Washington's 2024 statewide ADU law (HB 1337) allows up to two ADUs per single-family lot in most zones, including a detached ADU (DADU) up to the standard 24-ft height limit, subject to lot coverage and setback rules the local jurisdiction still enforces. Most Shelton lots have enough room for a DADU given the larger parcel sizes typical of the area compared to in-city Seattle lots. A DADU project needs its own utility connection — sometimes shared, sometimes separate depending on the county's requirements — plus a full mechanical rough-in for HVAC and plumbing. End-to-end, including permitting through Mason County or the city, a DADU build usually takes 4-7 months."
  - q: "What's the warranty on a TopVolk remodel or addition?"
    a: "Workmanship on framing, electrical, plumbing, and finish work is covered, and material warranties — Hardie siding, Milgard or Pella windows, Moen or Kohler fixtures — pass through from the manufacturer on top of that. Given Mason County's wet winters and the moisture exposure near Oakland Bay and Goldsborough Creek, TopVolk specs materials rated for that climate rather than the cheapest option that looks fine on day one. Every contract also includes a deadline penalty, so the commitment isn't just a warranty promise sitting in a drawer — it's a financial term. Expect Hardie siding and pressure-treated structural work to hold up 20+ years with normal maintenance."
  - q: "Do you work outside Shelton too?"
    a: "TopVolk's core service area covers King, Snohomish, Pierce, and Kitsap counties, and Shelton falls within reach of that footprint along with nearby Belfair, Allyn, and Union. Scheduling for Mason County projects typically runs on the same timeline as anywhere else — an on-site estimate within a week, contract signed, permits submitted, and a start date locked before crews mobilize. Vladislav handles scheduling directly, so what he quotes during the walkthrough is what ends up on the calendar, with same-day response on calls and texts since there's no dispatcher in between. Call (206) 591-1096 to check availability for your project."