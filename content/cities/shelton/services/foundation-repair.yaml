title: "Shelton Foundation Repair — Post-and-Pier & Drainage Fixes"

answer: "TopVolk repairs settling post-and-pier foundations and cracked stem walls in Shelton, WA — most jobs finish in 2-4 weeks, owner-run and WA Licensed."

intro: |
  Floors that dip near the kitchen sink, doors that stick every spring, cracks fanning out from the back corner of the crawlspace — those are foundation problems, not framing complaints, and TopVolk Construction handles them across Shelton with epoxy-injected crack repair, post-and-pier releveling, and sump pump drainage systems tied into a Zoeller basin. Most jobs close out in two to four weeks depending on crawlspace access and how many piers need new footings. Shelton sits low near Oakland Bay and Goldsborough Creek, and the water table around Kneeland Park and the neighborhoods off Railroad Avenue climbs fast every winter, which is exactly the kind of ground that pushes moisture under older post-and-pier homes near downtown. A lot of the housing stock dates back to the Simpson Timber Company era, built on cedar mudsills that were never bolted to the footings the way current WA seismic code requires. TopVolk Construction is a WA Licensed Contractor with 100+ projects completed since 2023, and Vladislav Volkov runs every job himself — no sales rep, no rotating subcontractor crew — with a penalty clause written into the contract if the deadline slips.

localContext: |
  Turn-of-the-century timber cottages near downtown Shelton (98584) sit alongside 1970s-80s ranch homes and manufactured housing scattered out toward Kamilche and Arcadia along Highway 101. Waterfront parcels along Oakland Bay and Hammersley Inlet sit on saturated clay and fill, so post-and-pier footings there settle unevenly within a decade if the original posts were never swapped for pressure-treated (PT) posts on concrete piers. Older homes closer to the Mason County Courthouse and the Mason County Historical Museum still run on original post-and-pier crawlspaces with dirt floors and no vapor barrier, which invites wood rot at the mudsill and rim joist. Out toward Belfair (98528) and the rest of the Hood Canal side of the county, the same water table problems show up even in newer construction. Mason County gets roughly 55-60 inches of rain a year — more than Seattle proper — and most of it falls between October and April, so drainage redirection and sump pump backup matter here as much as the structural repair itself. Any structural foundation work — mudsill bolting, shear wall retrofit, underpinning — needs a permit through Mason County Community Development, whose office sits in downtown Shelton near the courthouse.

commonProblems:
  - title: "Post-and-Pier Settling Under Pre-1950 Timber Cottages"
    description: "Homes built during the Simpson Timber Company boom near downtown Shelton were framed on cedar posts sitting directly on dirt or unreinforced concrete blocks, and eighty years of Mason County rain has rotted a good number of them out from under the mudsill. The fix starts with hydraulic jacks releveling the floor joists a quarter-inch at a time, then swapping the old posts for pressure-treated (PT) posts on poured concrete piers, tied off with Simpson Strong-Tie post caps so the connection meets current code. Where the rim joist has soft spots, we sister a new joist alongside it instead of replacing the whole run. Most single-room sag jobs run $1,800 to $4,500 and finish in three to five days once crawlspace access is clear. Bigger jobs touching six or more piers stretch closer to two weeks."
  - title: "Cracked Stem Walls From Clay Soil Movement"
    description: "Clay-heavy soil around Oakland Bay expands when it's saturated all winter and shrinks hard come July, and that swing opens horizontal cracks in poured concrete stem walls, usually right below grade. A hairline crack in October can widen to a quarter-inch by spring if it isn't sealed before the rains start. TopVolk injects Sikadur epoxy under low pressure to fill the crack from the inside, then regrades the soil outside to pull water away from the footing instead of into it. Cracks wider than a half-inch or showing lateral offset usually mean the footing itself has shifted, which calls for underpinning rather than injection. Epoxy injection jobs run $600-$1,500 per crack run depending on length and typically wrap in a single day, weather permitting."
  - title: "Mudsill Bolting and Shear Wall Retrofits Under WA Seismic Code"
    description: "A lot of Shelton's older post-and-pier homes were framed before anchor bolts connecting the mudsill to the foundation were required, which is a real problem given Washington sits on the Cascadia subduction zone. A seismic retrofit adds Simpson Strong-Tie mudsill anchors every four to six feet along the sill plate and nails shear wall plywood to the crawlspace cripple walls so the house can't rack off its foundation in an earthquake. Structural work like this needs a permit through Mason County Community Development, and plan review on a straightforward retrofit usually takes one to two weeks — faster than the backlog you'd hit in King County. TopVolk pulls the permit, schedules the rough-in and final inspection with the county inspector, and handles the paperwork so the homeowner isn't the one on hold with the permit desk. Retrofits on a typical 1,200 sq ft crawlspace run $3,500-$7,000."
  - title: "Sump Pump and Drainage Costs for High Water Table Lots"
    description: "Lots near Hammersley Inlet and low-lying parcels off Highway 101 sit close enough to the water table that crawlspaces flood every heavy rain event, and standing water is what rots mudsills and rusts joist hangers over time. A basic setup means digging a sump basin at the low point of the crawlspace, installing a Zoeller pump with a check valve, and running discharge piping at least ten feet from the foundation so it doesn't just recirculate back in. Add drainage redirection — a perimeter french drain tied into the sump basin — and the whole system runs $2,800-$6,000 depending on crawlspace size and how much old drain tile has to be dug out. TopVolk backs the pump installation with a one-year labor warranty on top of the manufacturer coverage, and the basin lid stays accessible for future float switch service without repouring concrete."
  - title: "When to Repair vs. Replace a Failing Crawlspace Foundation"
    description: "Post-and-pier foundations with rotted posts and no vapor barrier usually still make sense to repair rather than replace outright — full foundation replacement on a 1,000 sq ft footprint runs well into six figures, while releveling, post replacement, and a new 6-mil vapor barrier typically stay under $10,000. A sealed crawlspace with vapor barrier and DryLok waterproofing on the stem wall interior cuts humidity enough to stop new wood rot from starting, and pairing that with R-49 insulation in the floor joist bays keeps the upstairs from feeling cold all winter. Expect a properly releveled and reinforced post-and-pier system to last another 30-40 years before it needs attention again, same as new construction. Full replacement only makes sense when the perimeter footing itself has failed or settled more than a couple inches out of level across the whole house."

