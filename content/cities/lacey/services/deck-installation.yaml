title: "Lacey Deck Installation — Built for Thurston County Rain"

intro: |
  Military families rotating through the Hawks Prairie area of Lacey ask this more often than you'd think: is the existing deck worth saving, or does it need a full rebuild? The pressure-treated pine decks common in Lacey's 1990s and early 2000s housing stock — especially in subdivisions east of Martin Way in the 98516 zip code — have absorbed 50+ inches of annual rainfall and spent six months a year cycling between wet and damp. By year 15, the ledger flashing is typically failing, post bases are rotting at grade, and deck boards have checked and splintered enough that bare feet in August are a splinter hazard. Composite decking — Trex Transcend or TimberTech Azek — carries a 25-year fade and stain warranty and needs only an annual hose-down. Saint Martin's University sits a few miles from Woodland Creek neighborhoods where Vladislav has rebuilt eight decks over the past two years. Call (206) 591-1096 to schedule a site visit — you'll talk to the person doing the work, not a salesperson.

localContext: |
  Lacey's housing stock splits into two distinct generations. The 98503 zip code — covering neighborhoods along Pacific Avenue and older sections near the Tumwater border — has mid-1980s ranch homes where original pressure-treated decks were built with 4x4 posts set directly in concrete with no post base hardware and no standoff clearance. Those posts are long past their useful service life. In the 98516 zip code, Hawks Prairie subdivisions were built out heavily through the 1990s and 2000s; those decks are hitting the 20-25 year mark where decking boards fail while the framing may still have years left. City of Lacey requires a building permit for any deck over 200 square feet or more than 30 inches above grade — a threshold that nearly every split-level and raised ranch in the area hits immediately. Thurston County soil, particularly in the flatter sections of Lacey, runs to clay-heavy profiles that hold moisture and drain slowly, which accelerates post base decay and makes proper UC4B-rated ground-contact lumber non-negotiable for anything touching soil or concrete.

commonProblems:
  - title: "Cedar vs. Composite: The Real Cost Math for 50 Inches of Annual Rain"
    description: |
      Cedar looks sharp at installation. After two or three wet seasons in Lacey — 50+ inches of annual rainfall, October through May — the north-facing boards go gray, the surface checks, and moss establishes between deck boards where water ponds. Refinishing cedar requires sanding, cleaning, and re-staining every 2-3 years; miss a cycle and the wood accelerates its deterioration. Trex Transcend composite runs $12-18 per linear foot in material versus $6-9 for quality cedar — a real premium upfront. The 25-year fade and stain warranty on capped composite, combined with elimination of annual staining labor, closes most of that gap within 8-10 years on a 300 square foot deck. Vladislav prices both options side-by-side on every estimate so the long-term numbers are transparent before a decision is made, not buried in fine print.

  - title: "Ledger Flashing Failure: Where Most Deck Rot Actually Starts"
    description: |
      The ledger board connection to the house's rim joist is the highest-risk water intrusion point on any attached deck. Improper or missing flashing at the ledger allows water to wick behind the board, soaking the rim joist and band joist through repeated wet cycles. Douglas-fir rim joists in Lacey's 1990s homes weren't built with continuous exterior water exposure in mind. Within 10-15 years, the rot can compromise the structural connection enough to be a genuine safety issue. City of Lacey's rough-in inspection specifically checks that through-bolts or lag screws penetrate sound framing and that a proper Vycor-type membrane flashing is correctly installed over the ledger before decking goes down. Vladislav scopes the rim joist condition before any framing begins — if rot is present, we sister-joist the damaged section first. Skipping that step is how decks fail ten years after installation.

  - title: "Post Footings and Frost Line: Getting the Foundation Right in Thurston County Soil"
    description: |
      Lacey's frost line sits around 12 inches — milder than the Cascade foothills east toward North Bend, but flat terrain and clay-heavy soils mean standing water and slow drainage create conditions where shallow footings can move. City of Lacey requires concrete footings sized to the deck load, typically 12-18 inches deep with diameter calculated from the tributary area each post carries. Ground-contact posts require UC4B-rated pressure-treated lumber — not the UC3B "above ground" PT stocked at most home improvement stores. Simpson Strong-Tie ABA post bases are standard on every TopVolk build; they elevate the post end off the concrete and eliminate the bottom-rot cycle that kills posts set directly in slabs. As a WA Licensed Contractor, Vladislav handles the permit application and coordinates rough-in and final inspections with the City of Lacey — plan review for a standard residential deck typically takes 2-4 weeks. Call (206) 591-1096 to start the process.

  - title: "Guardrail Height, Baluster Spacing, and Stair Code: What Lacey Inspectors Actually Check"
    description: |
      Decks more than 30 inches above grade require guardrails — 36 inches minimum height under both the IRC and City of Lacey residential code. Baluster spacing can't exceed 4 inches (a 4-inch sphere must not pass through). Stair handrails have a separate requirement: they must be graspable, meaning a round or shaped profile a hand can fully wrap around — a flat 2x6 top cap doesn't meet the standard regardless of how finished it looks. Stair stringers have their own rise/run limits: maximum 7¾-inch rise, minimum 10-inch run per tread. Lacey's final inspection will flag non-compliant rail heights and stair geometry; corrections at that stage add both cost and timeline delay. Guardrail posts are through-bolted to the rim joist or structural frame on every TopVolk build — not surface-mounted with post-mount brackets, which flex and work loose over time under lateral load.

  - title: "Under-Deck Drainage: When Your Deck Sits Over Living Space or a Covered Patio"
    description: |
      Second-story decks built over a garage, finished basement entry, or covered patio need active drainage — composite decking alone doesn't waterproof the space below, since water runs through the board gaps between courses. Trex RainEscape is a trough-and-downspout system installed between joists before decking goes down; it channels water to a gutter at the deck perimeter and routes it away from the foundation. On a 200 square foot deck, RainEscape adds roughly $1,500-2,500 in materials and labor. For an alternative requiring a fully waterproof surface, Duradek vinyl membrane sits on a solid plywood substrate and is spec'd for the entire deck plane. Drainage routing is planned during the framing phase — retrofitting under an existing finished deck costs two to three times more. Vladislav walks every second-story site to assess drainage slope and downspout routing before pricing the project.

faq:
  - q: "How fast can you get to Lacey for a deck estimate?"
    a: |
      Lacey sits about 60 miles south of Seattle via I-5 — roughly an hour each way depending on Tacoma-corridor traffic. Vladislav schedules site visits in the Lacey-Olympia corridor on dedicated South Sound days to keep travel efficient and avoid wasted time for everyone. From first call to on-site estimate, typical availability is 3-7 business days. Once scope and permit are agreed, material lead times for Trex or TimberTech composite run 1-2 weeks; dimensional lumber is typically available same week. A standard 300-400 sq ft deck build runs 5-8 working days on-site after materials arrive and permit is issued. Call (206) 591-1096 to get on the schedule — Vladislav answers directly.

  - q: "What does deck installation cost in Lacey?"
    a: |
      A basic 200 sq ft pressure-treated deck with straightforward stairs runs $12,000-$18,000 installed, including permit fees. The same footprint in Trex Transcend composite with cable rail runs $22,000-$32,000. What drives cost up quickly: second-story height requiring taller posts and larger footings, wraparound stair configurations, integrated lighting, or under-deck drainage like Trex RainEscape. Projects with rim joist rot requiring sister-joisting add $500-$1,500 in structural repair before decking begins — that's why scoping the ledger area matters before any pricing is done. Vladislav provides a line-item quote with materials and labor broken out separately. Free on-site estimate in Lacey; call (206) 591-1096.

  - q: "Do I need a permit to build a deck in Lacey, WA?"
    a: |
      City of Lacey requires a building permit for any deck over 200 square feet or more than 30 inches above grade — and any ledger-attached deck, even a small one, triggers a permit because of the structural connection to the house framing. Applications go through the City of Lacey Community and Economic Development department. Plan review for a standard residential deck typically takes 2-4 weeks. The permit process includes at minimum a rough-in inspection (framing and ledger flashing before decking installs) and a final inspection after completion. As a WA Licensed Contractor, Vladislav pulls the permit on your behalf and coordinates both inspections — you don't have to navigate the permit portal yourself or figure out what drawings the city needs.

  - q: "Cedar or composite — which performs better in Thurston County's climate?"
    a: |
      Cedar in Thurston County's climate has a realistic lifespan of 15-25 years with consistent maintenance — staining every 2-3 years, annual cleaning, and replacing individual boards as they check or splinter. Composite like Trex Transcend or TimberTech Azek carries a 25-year manufacturer warranty against fading and staining, and the PVC-capped surface doesn't absorb water or support the moss growth that open-grain cedar invites. The structural framing — joists, beams, posts — uses pressure-treated Douglas-fir regardless of which decking surface you choose. In Hawks Prairie, we've replaced several cedar decks from the mid-2000s where the subframe was structurally sound but the decking was long past safe use. Replacing only the decking with composite while keeping the existing frame is often the most cost-effective path when the framing checks out.

  - q: "What warranty does TopVolk provide on a deck build?"
    a: |
      TopVolk provides a 2-year workmanship warranty covering structural connections, ledger attachment, post footings, stair assembly, and all framing work. Manufacturer warranties on composite decking run 25 years on fade and stain for Trex and TimberTech capped composite products. Pressure-treated lumber carries a manufacturer treatment warranty — typically 20-25 years against rot and insect damage when installed per the treatment grade requirements. Simpson Strong-Tie hardware is spec'd to the manufacturer's published load tables for the application. Workmanship defects — a ledger that loosens, a post footing that heaves, a stair stringer that cracks — are corrected at no charge within the warranty period. Vladislav also writes a deadline penalty clause into every contract: missed completion dates carry a financial consequence written into the agreement, not a vague promise to try harder.

  - q: "Do you build decks in Olympia, Tumwater, and surrounding Thurston County areas?"
    a: |
      Olympia, Tumwater, Lacey, Yelm, and unincorporated Thurston County are all part of TopVolk's South Sound service area for deck installation. Each jurisdiction has its own permit center — City of Olympia uses its own building department, while unincorporated Thurston County goes through the Thurston County Resource Stewardship department. Vladislav is familiar with each jurisdiction's review timelines and submittal requirements, so the permit process doesn't stall because of a paperwork gap. Scheduling in the Lacey-Olympia corridor typically has 1-3 week availability for an on-site estimate. Call (206) 591-1096 — Vladislav responds directly, not through a call center or dispatch service. TopVolk has completed 100+ projects across King, Snohomish, Pierce, and Thurston counties since 2017.