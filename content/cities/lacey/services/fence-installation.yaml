  - q: "What does fence installation cost per linear foot in Lacey?"
    a: |
      Cedar privacy fence runs $28-$45 per linear foot installed, and vinyl runs $35-$55 —
      those ranges shift based on slope, gate count, post spacing, and material grade. A single
      walk gate adds $400-$750 depending on hardware spec; a double drive gate with D&D
      Technologies self-closing hardware adds $900-$1,800. On a flat lot, a 150-foot cedar
      fence with one walk gate typically comes in at $5,000-$7,500 all-in. Sloped lots with
      stepped panels add 15-25% to labor cost. TopVolk provides a written line-item quote
      after a free on-site estimate — actual numbers per material and per gate, not a range
      that shifts after the contract is signed. Call (206) 591-1096 to get on the estimate
      calendar.

  - q: "Do I need a permit for a fence in Lacey, and does my HOA need to approve it first?"
    a: |
      For a standard 6-foot privacy fence on side or rear property lines, the City of Lacey
      generally doesn't require a building permit — unless the fence retains soil with a 4-foot
      or greater grade differential, exceeds 6 feet in height, or falls within a critical area
      buffer. HOA approval runs on a separate track and its own timeline — Woodland Creek and
      similar Lacey associations typically take 2-4 weeks for architectural review board
      decisions. Both processes can run simultaneously. TopVolk is a WA Licensed Contractor
      and prepares permit applications and HOA submittal packages as part of the project.
      Vladislav identifies any permit or HOA trigger during the free on-site estimate — before
      you've committed to anything.

  - q: "Do you install horizontal slat cedar fences in Lacey?"
    a: |
      Horizontal slat cedar is one of the most-requested fence styles in Lacey's newer
      subdivisions right now, and TopVolk installs them regularly across the 98516 area.
      The installation details matter more than with vertical pickets: boards need to be
      back-primed with a penetrating oil finish — Cabot Australian Timber Oil works well as
      a back coat — before installation to prevent moisture wicking on the hidden face, and
      all rail brackets and fasteners should be hot-dipped galvanized or stainless steel to
      prevent rust staining in Thurston County's wet climate. Post spacing for horizontal
      slat should stay at 6 feet on center maximum — not the 8-foot spacing common in
      standard vertical picket installs — to prevent mid-span sag on longer boards. Vladislav
      can walk you through completed horizontal slat jobs from Lacey and Tumwater during the
      free on-site consultation.

  - q: "How long will a cedar or vinyl fence last in Lacey's climate?"
    a: |
      Western Red Cedar fence with PT lumber posts set at 36-inch depth in concrete will last
      20-30 years in Thurston County with consistent maintenance — sealing or staining every
      4-5 years keeps the wood from checking and slows rot at the board edges. Skip two
      maintenance cycles and you're looking at 12-15 years before significant picket and
      rail replacement. CertainTeed Bufftech vinyl systems carry limited lifetime warranties
      on the material itself — UV yellowing and chalking are the typical long-term failure
      modes, not rot. Gate hardware is the weak link on both material types: self-closing
      hinges and latches need adjustment or replacement every 8-12 years depending on gate
      weight and use frequency. TopVolk installs cedar fences with back-primed pickets and
      hot-dipped galvanized hardware as standard — not the builder-grade box-store hardware
      that fails within 3-4 years of a Lacey winter.

