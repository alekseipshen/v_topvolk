title: "Lacey Fence Installation — Cedar, Vinyl & PNW Post Depth"

intro: |
  The Hawks Prairie corridor in northwest Lacey (98516) added several hundred homes over the past
  decade, and those subdivision lots come with HOA-mandated fence styles, tight setbacks, and
  clay-heavy soil that makes post setting depth more consequential than it looks on paper. A few
  miles east near Chambers Lake (98503), the housing stock shifts — 1980s ranchers on larger lots,
  original cedar fencing that's been absorbing Thurston County's roughly 50 inches of annual rain
  for 30-plus years. Cedar weathers. After that first decade, without back-priming and proper
  drainage at the post base, a 4x4 cedar post sitting in saturated clay starts rotting from the
  bottom up — the pickets look fine until you grab the fence and it moves. TopVolk Construction has
  replaced dozens of those post-and-panel runs across Lacey; Vladislav Volkov will tell you
  on-site whether the existing rails and pickets are worth keeping or whether you're looking at a
  full pull-and-replace. Call (206) 591-1096 to schedule a free on-site estimate.

localContext: |
  Most of Lacey's residential fence work falls into two categories: new installations in planned
  developments like Woodland Creek and Meridian (zip 98516), where HOA covenants specify fence
  height, material, and sometimes color; and replacement work in the older rancher neighborhoods
  near Martin Way E and College Street SE (zip 98503), where original cedar or chain-link from
  the mid-1980s has reached end of life. Lacey HOAs typically allow 6-foot privacy fences on
  side and rear property lines, with a 4-foot maximum in the front yard — consistent with City
  of Lacey development standards. Any fence exceeding 6 feet, or functioning as a retaining wall
  where the grade differential on either side exceeds 4 feet, requires a permit through the City's
  Community and Economic Development office. Horizontal slat cedar fences are increasingly popular
  in Lacey's newer neighborhoods — they look clean and modern, but horizontal boards collect
  standing water at the rail brackets faster than vertical pickets do, which accelerates rot in
  this climate if the boards aren't back-primed before installation.

commonProblems:
  - title: "Cedar Post Rot at Grade — The Failure You Can't See Until It's Too Late"
    description: |
      The fence looks fine from 20 feet away. Walk up and push it, and it moves — that's almost
      always a cedar 4x4 post that's rotted at or just below grade. In Lacey's clay soils, water
      drains slowly away from the post base, and untreated cedar in ground contact typically fails
      in the critical zone between 2 and 8 inches below the surface after 10-15 years. A Simpson
      Strong-Tie ABA post base set in fresh concrete with a pressure-treated (PT) 4x4 replacement
      post can extend an otherwise solid cedar fence another 15-20 years without replacing the
      whole run. Single post repair materials run $80-$150 in hardware, with 2-4 hours of labor
      for a straightforward swap. If more than a third of the posts are compromised, full
      replacement typically pencils out better than piecemeal work — budget $600-$900 per post
      all-in for individual repairs at that point.

  - title: "HOA Approval Delays — Getting the Submittal Package Right the First Time"
    description: |
      Woodland Creek, Meridian, and most planned communities in Lacey 98516 have active HOAs with
      architectural review boards that meet on set schedules — typically monthly. Submit the wrong
      fence style (horizontal cedar slats when the CC&Rs specify vertical board-on-board), and
      you're waiting 4-6 weeks for a rejection and starting the process over. Getting it right
      means reading the CC&Rs carefully, confirming fence height and material restrictions before
      drawing anything up, and including a plat map showing the fence line relative to the
      recorded property line. Thurston County Assessor plat records are public and free — a quick
      pull before any install prevents the most common dispute: a fence accidentally installed
      6 inches into a neighbor's lot. TopVolk prepares HOA submittal packages for Lacey projects
      — materials spec sheet, plot plan, and reference photos of comparable approved fences — so
      the review board has everything they need on the first pass.

  - title: "City of Lacey Permits — Which Fences Need One and What the Process Looks Like"
    description: |
      Standard residential privacy fences under 6 feet on side and rear property lines generally
      don't require a building permit in Lacey. The threshold changes when a fence exceeds 6 feet
      in height, or when it retains soil with a grade differential of 4 feet or more on either
      side — at that point, the City of Lacey Community and Economic Development office requires
      a building permit application, a site plan, and potentially a geotechnical memo if the
      retained soil sits on a slope. Permit review for a standard fence application typically
      runs 2-4 weeks. TopVolk Construction is a WA Licensed Contractor and handles City of Lacey
      permit applications directly as part of the project scope — Vladislav flags any permit
      trigger during the free on-site estimate, not after you've already signed a contract.
      Call (206) 591-1096 to schedule that estimate.

  - title: "Cedar vs. Vinyl — Real Cost Comparison for a Lacey Lot"
    description: |
      Cedar privacy fencing in Lacey runs roughly $28-$45 per linear foot installed — standard
      board-on-board and dog-ear at the lower end, horizontal slat at the higher end. Vinyl fence
      systems such as CertainTeed Bufftech or comparable PVC run $35-$55 per linear foot
      installed. Cedar costs less upfront but needs sealing or staining every 4-5 years in
      Thurston County's wet climate; skip two maintenance cycles and you're replacing pickets
      within 12 years. Vinyl needs almost no maintenance but yellows and chalks after 15-20 years
      of UV exposure and doesn't take direct impact well. On a flat 150-linear-foot lot with one
      walk gate, total installed cost typically lands between $5,000-$7,500 for cedar or
      $6,500-$10,000 for vinyl. Sloped lots requiring stepped panels instead of racked panels
      add 15-25% to labor. TopVolk gives you a written line-item quote on-site — no "call for
      pricing" ranges that triple once the crew shows up.

  - title: "Gate Hardware Failure — Why the Gate Always Goes Before the Fence"
    description: |
      Gate hardware is where most residential fences fail first. A heavy cedar double gate on
      Lacey's 98503 rancher lots — common for backyard or RV pad access — puts serious cantilever
      load on the hinge-side post. Builder-grade hinges aren't rated for that load; the post
      leans, the gate drags, and within a year the latch won't catch. D&D Technologies TruClose
      self-closing hinges are rated for gates up to 90 lbs per pair and adjust for closing speed
      — critical if you need reliable self-latching with kids around a pool or yard. For the
      post itself, a 6x6 PT lumber corner post set at 36-inch depth in concrete handles the
      cantilever load a heavy gate produces; a standard 4x4 post at 24 inches won't hold long
      term. Gate alignment drifts in Lacey's clay soils as seasonal saturation shifts the post
      base — plan on a recalibration check 6-12 months after install and replacement of worn
      hardware every 8-12 years depending on use.

