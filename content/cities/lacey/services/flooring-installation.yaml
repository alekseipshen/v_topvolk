    a: |
      Yes — Olympia, Tumwater, and Yelm are all within regular rotation for Thurston
      County projects. TopVolk's primary service area covers King, Snohomish, Pierce,
      and Kitsap counties across the Seattle Metro, and Thurston County work gets
