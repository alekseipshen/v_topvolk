  - q: "What does a 200A panel upgrade cost in Lacey?"
    a: |
      A full 100A-to-200A service upgrade in Lacey typically runs $2,500-$4,500. What moves
      the price is panel location (basement versus garage versus exterior wall), service entrance
      run length, and whether the meter base or weatherhead needs replacement at the same time.
      Homes where the main panel is in a detached garage add conduit and labor for the longer
      service run. PSE utility coordination and the City of Lacey permit are included in
      TopVolk's scope — there's no separate line item for those. Call (206) 591-1096 or request
      a free on-site consultation to get a real number based on your specific house.

  - q: "Do I need a permit for electrical work in Lacey, WA?"
    a: |
      Yes — the City of Lacey building department requires permits for panel replacements,
      service upgrades, new circuit additions (including EV charger circuits), and most rewiring
      work. Applications go through the City of Lacey Community and Economic Development office,
      and plan review for a standard panel swap or single circuit addition typically runs 5-10
      business days. For properties outside city limits along Yelm Highway SE or Rainier Road,
      permits route through Thurston County Resource Stewardship. TopVolk is a WA Licensed
      Contractor and files the permit, schedules rough-in and final inspections, and handles
      PSE coordination — there's nothing the homeowner needs to chase down separately.

  - q: "Can you install a Tesla Wall Connector or JuiceBox at my Lacey home?"
    a: |
      Yes. The Tesla Wall Connector requires a hardwired 60-amp dedicated circuit; the JuiceBox
      48 can run either hardwired or plug-in on a NEMA 14-50 outlet. Both installations require
      a City of Lacey permit. The first step is confirming your existing panel has the capacity —
      a 100A panel already carrying a heat pump, electric dryer, and water heater may not have
      room for a 60-amp EV circuit without a service upgrade first. Vladislav looks at the full
      load picture during the site visit before quoting, so there are no surprises after the
      work starts. If the panel is adequate, most EV charger installs in Lacey go from permit
      approval to final in 1-2 weeks.

  - q: "What warranty covers TopVolk's electrical work in Lacey?"
    a: |
      All installation work carries a three-year workmanship warranty against defects. Equipment
      carries its own manufacturer coverage — Square D and Eaton panels typically come with
      10-year warranties; Leviton AFCI/GFCI breakers are warranted for the life of the product.
      The City of Lacey final inspection sign-off documents that the work passed code at
      completion, which matters when you sell the home. What falls outside the warranty is
      normal equipment wear, PSE utility-side issues, and damage caused by work done
      subsequently by others. Any concerns after project completion go directly to Vladislav —
      same contact, same person, no runaround.

