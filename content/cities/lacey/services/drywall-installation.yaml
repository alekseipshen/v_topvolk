title: "Lacey Drywall Installation — Level 5 Finish, Popcorn Removal, Code-Ready Walls"

intro: |
  Thurston County pulls around 51 inches of rain per year — notably wetter than Seattle's
  37 — and that moisture load shows up inside walls when remodels skip the right board
  selection or skip the vapor barrier entirely. The ranchers and split-levels running
  through the Tanglewilde area and the older blocks near Chambers Lake were built mostly
  between 1965 and 1985, and a lot of them are finally getting the interior work they've
  been putting off: popcorn ceilings skim-coated down to Level 5, bathrooms rebuilt from
  the studs with Georgia-Pacific DensArmor Plus purple board in the wet zones, and kitchens
  opened up with new drywall tied into the existing assembly. TopVolk Construction LLC has
  completed 100+ projects across the South Sound and Puget Sound since 2023. Vladislav
  Volkov — the owner — handles every estimate personally. You talk to the person doing the
  work, not someone passing a clipboard to a crew you've never met.

localContext: |
  The Hawks Prairie area northeast of town (98516) is newer stock — late 1990s and early
  2000s tract construction with builder-grade 1/2-inch drywall and orange-peel texture
  throughout. Homeowners there are mostly upgrading kitchens and primary baths, replacing
  that texture with smooth Level 5 finish now that recessed lighting and dimmer-compatible
  LED fixtures expose every surface ridge. The 98503 zip code, closer to Martin Way and the
  older St. Martin's University neighborhood, has more 1970s inventory with actual popcorn
  ceilings — and asbestos testing is required before any scraping or skim work starts on
  those. City of Lacey Building Division handles permit review for interior structural work;
  ADU separation walls under WA HB 1337 (2024, allowing up to 2 ADUs per single-family lot)
  require 5/8-inch Type-X firecode drywall at the dividing wall per IRC requirements — that's
  not optional and doesn't vary by project size. Thurston County's crawlspace moisture makes
  vapor barriers and mold-resistant board the baseline in any below-grade or ground-adjacent
  application, not an upgrade.

commonProblems:
  - title: "Popcorn Ceiling Removal and Level 5 Skim-Coat in 1970s Lacey Homes"
    description: |
      Homes built before 1979 in the 98503 corridor frequently have popcorn ceilings that
      contain chrysotile asbestos — you cannot scrape and skim without a certified sample
      test first. If the test comes back positive, abatement runs $1,500–$4,500 depending
      on square footage before any drywall work begins. Once the ceiling is clear, a Level 5
      skim coat means a full coat of USG Sheetrock All-Purpose compound across the entire
      surface, block-sanded, then primed with a high-build primer before paint. Level 5
      matters most in kitchens and living areas where recessed lighting grazes the ceiling
      at a low angle — Level 4 in those rooms will show every ridge and tape joint the
      second the dimmer goes up. Budget roughly $1.50–$2.50 per square foot for the skim
      work alone, plus asbestos testing if the home predates 1980.

  - title: "Mold-Resistant Purple Board in Bathrooms, Laundry Rooms, and Basements"
    description: |
      Standard greenboard absorbs moisture at the paper facing and creates conditions for
      mold growth behind tile — a real problem in Lacey's climate where interior humidity
      stays elevated for eight or nine months of the year. Purple board, specifically
      Georgia-Pacific DensArmor Plus or National Gypsum Gold Bond e2 XP, uses fiberglass
      facing instead of paper and resists moisture absorption where standard board fails.
      In basements common to older 98503 homes near Chambers Lake, pairing purple board with
      a vapor barrier and a DriCore subfloor panel system addresses ground moisture coming
      up through the slab before it reaches the wall assembly. Purple board runs roughly
      15–20% more per sheet than standard drywall — not a meaningful upcharge relative to
      a full bathroom remodel. Skipping it on a $15,000 bathroom because the board costs
      $40 more is the wrong trade.

  - title: "5/8-Inch Type-X Firecode Drywall for Garage Separations and ADU Walls"
    description: |
      Washington's 2021 IRC adoption, enforced by the City of Lacey Building Division,
      mandates 5/8-inch Type-X gypsum on the garage-to-living-space separation wall — not
      1/2-inch, and not the original drywall that went in when the home was built in 1978.
      A lot of Lacey ranchers were finished with standard board in the garage, and when
      owners convert that space or add an attached ADU under WA HB 1337, the entire
      separation assembly has to be brought up to firecode: correct board thickness, fire-rated
      mesh tape, and Type-S screws at proper spacing. Permit review through the City of Lacey
      Building Division typically runs 3–6 weeks for ADU work. TopVolk is a WA Licensed
      Contractor — Vladislav pulls the permit and coordinates rough-in and final inspections
      so the work doesn't sit in a red-tag hold waiting for a call back from the building
      department.

  - title: "Level 5 Finish for Remodeled Kitchens With Recessed Lighting"
    description: |
      Recessed lighting and under-cabinet LED strips in a remodeled kitchen expose every
      surface flaw when light hits the wall at a shallow angle. Level 3 or Level 4 — what
      most drywall subs default to — will show tape lines, ridges, and trowel marks the
      moment the dimmer-compatible LED fixtures go in. Level 5 requires a full skim coat
      over all taped surfaces, sanded after prime coat. It adds one to two days of labor
      on a standard kitchen gut, but there's no reasonable alternative if the room has
      sidewall lighting. Total drywall scope for a 200–300 sq ft kitchen remodel in Lacey
      typically runs $1,800–$3,500 depending on ceiling height, number of transitions, and
      whether popcorn removal is in scope. That number comes with line-item pricing from
      Vladislav — not a range pulled from a national estimating guide.

  - title: "Soundproofing Between Bedrooms and Shared Walls in Multi-Unit Conversions"
    description: |
      Lacey has a significant military population tied to JBLM, and property owners
      converting homes to multi-unit layouts or adding ADU units under HB 1337 frequently
      need meaningful sound separation between sleeping areas. Standard 1/2-inch drywall
      over wood studs provides essentially no useful sound isolation — STC ratings in the
      low 30s. Resilient channel (RC-1 or RC-2 profile) decoupled from the stud framing,
      combined with 5/8-inch drywall and acoustic mineral wool batt insulation in the
      cavity, brings a shared wall to STC 50–55. QuietRock 510 panels are the right call
      when floor-to-floor height limits a double-layer or staggered-stud assembly. Adding
      sound isolation to a single shared wall — roughly 12–16 linear feet of partition —
      typically runs $800–$1,600 in materials and labor depending on the assembly type and
      ceiling height. Resilient channel is the baseline; QuietRock is the faster install.

faq:
  - q: "How fast can you get to Lacey for a drywall estimate?"
    a: |
      Lacey is about 60 miles south of Seattle on I-5, so Vladislav typically batches
      Thurston County consultations on Tuesday or Thursday to cover the South Sound in one
      run. From first call to on-site estimate is usually 3–7 days depending on the week.
      The estimate is a full line-item breakdown — board type, square footage, labor by
      phase, permit fees if applicable — plus a project timeline with a deadline penalty
      clause written into the contract. Call (206) 591-1096 to get on the calendar.

  - q: "What does drywall installation cost in Lacey?"
    a: |
      Standard 1/2-inch drywall hang, tape, and Level 4 finish runs roughly $2.50–$4.00
      per square foot in this market. Level 5 finish adds $0.75–$1.25 per square foot on
      top of that. Firecode 5/8-inch Type-X for a garage separation wall — around 200–250
      sq ft on a typical Lacey rancher — runs $600–$1,200 including fire-rated tape and
      blocking. Mold-resistant purple board in a bathroom adds about 15–20% to material
      cost but doesn't change labor meaningfully. Vladislav gives exact pricing on-site,
      not a ballpark. Call (206) 591-1096 to schedule a free consultation.

  - q: "Does drywall work in Lacey require a permit from the City?"
    a: |
      Cosmetic work — patching, skim-coating, popcorn removal — typically doesn't require
      a permit in Lacey. Structural changes, wall removals, or any drywall tied to an ADU
      addition or garage conversion go through the City of Lacey Building Division and
      require a full building permit. ADU firecode walls are part of the ADU permit package,
      not a separate pull. Unincorporated Thurston County properties (outside Lacey city
      limits) route through Thurston County DRS instead. TopVolk is a WA Licensed
      Contractor — permit applications, plan review coordination, and inspection scheduling
      are handled by Vladislav, not handed off to the homeowner.

  - q: "Can you match existing texture on a patch after plumbing or electrical rough-in?"
    a: |
      Texture matching after rough-in is genuinely difficult. Orange-peel and knockdown
      patterns vary by original applicator, air pressure, and compound consistency — a
      patch that dries even slightly differently holds paint at a different sheen. For
      small patches, hopper-applied orange-peel can get close. For larger areas after
      electrical or plumbing rough-in during a whole-house remodel, the cleaner approach
      is skim-coating the full surface and finishing at Level 5 — it eliminates the
      matching problem entirely. USG Sheetrock All-Purpose compound and a quality
      high-build primer are the baseline for either approach. Vladislav will tell you
      upfront which method makes sense for the specific scope, not default to the more
      expensive path.

  - q: "What warranty comes with the drywall work?"
    a: |
      Workmanship — tape joints, finish quality, Level 5 skim consistency — carries a
      2-year warranty. Hairline settlement cracks in new addition work can appear as
      framing dries during the first heating season; those are addressed under the same
      warranty. Materials carry manufacturer warranties from USG, National Gypsum, and
      Georgia-Pacific. Beyond the standard warranty language, the contract includes a
      deadline penalty clause: if TopVolk misses the agreed completion date, a financial
      penalty applies — it's written in, not a verbal assurance. That's been the standard
      on 100+ projects completed since 2023 across King, Pierce, Snohomish, and
      Thurston counties.

  - q: "Do you cover Tumwater, Olympia, and other areas near Lacey?"
    a: |
      Yes — TopVolk works throughout the South Sound corridor, including Tumwater, Olympia,
      and unincorporated Thurston County. Permit jurisdiction outside Lacey city limits
      shifts to Thurston County DRS, which runs its own plan review queue and timeline;
      Vladislav handles the application regardless. North toward DuPont and Lakewood, the
      authority switches to Pierce County PALS. Response time for Thurston County is
      typically within 48 hours of first contact. Call (206) 591-1096 or request a free
      on-site consultation — you'll get actual project pricing, not a range from a
      scheduling assistant.