title: "Lacey Garage Construction — ADU Builds & Thurston Permits"

intro: |
  Hawks Prairie (zip 98516) and Woodland Creek represent most of Lacey's residential buildout
  from the 1990s onward — large-lot subdivisions where a detached garage was frequently left off
  the original construction to hit a lower sale price. Twenty years later, those same homeowners
  want a proper two-car structure, or they're looking at WA HB 1337 ADU provisions and thinking
  about habitable space above the garage. The city of Lacey runs permits through its Community
  and Economic Development Department, and any new structure over 200 square feet goes through a
  full plan review. In standard R-1 zones, side and rear setbacks for accessory structures run
  5 feet, though corner lots near Chambers Lake Road eat into buildable area faster than owners
  expect. For concrete slabs, the Lacey building department requires a minimum 4-inch
  fiber-reinforced pour with a thickened edge footing — something a lot of homeowners pricing
  their own builds forget to spec. A Clopay insulated garage door, proper vapor barrier under
  the slab, and a subpanel sized for an EV circuit are three things worth planning from the
  start, not adding as afterthoughts.

localContext: |
  The housing stock in 98503 — the older Lacey zip covering areas south of Martin Way and near
  Saint Martin's University — includes 1970s and 1980s ranchers and split-levels that sometimes
  came with a single-car attached garage tucked under the living space. Those attached units are
  frequent targets for conversion to conditioned living space, which requires foundation upgrades,
  a new vapor barrier system, and sometimes a LVL beam to carry the load where the garage door
  opening used to be. In 98516, the Hawks Prairie and Meridian Campus developments have more lot
  room, making detached two-car garage builds more practical — but HOA covenants in several of
  those subdivisions restrict roofline height and require exterior materials to match the primary
  residence. Lacey's wet winters — the South Sound averages close to 50 inches of rain annually —
  mean moisture management matters throughout construction: vapor barriers under slabs, proper
  grading away from the structure, and Hardie cement-board siding instead of OSB-based panels
  that absorb water over time. Garage builds with ADU potential above trigger a full DADU review
  under WA HB 1337 in addition to the standard structural permit, so budget extra time on the
  front end if that's part of the plan.

commonProblems:
  - title: "Adding ADU Living Space Above a New Detached Garage"
    description: |
      WA HB 1337 allows up to two ADUs per single-family lot statewide, and Lacey homeowners in
      98516 are increasingly asking about a garage-below, living-space-above build. That
      configuration changes the permit from a simple garage application to a full DADU review —
      the city of Lacey's Community and Economic Development office runs both concurrently, but
      plan review alone adds 8–12 weeks to the front end. Structurally, adding a habitable floor
      above means upgrading to a LVL ridge beam, moving to 2x6 exterior wall framing for
      insulation depth, and sizing the perimeter footing for two-story loads rather than a slab-on-
      grade accessory structure. Mechanical rough-in for a Mitsubishi mini-split system and any
      plumbing must happen before the upper-level subfloor goes down. Budget for a
      garage-over-DADU build in Lacey typically runs $140K–$200K depending on finish level and
      site conditions. Call (206) 591-1096 to walk through the site specifics with Vladislav
      before committing to a design.

  - title: "Attached Garage Conversion to Conditioned Living Space"
    description: |
      Ranchers and split-levels in the 98503 zip — particularly older blocks near Martin Way E —
      often have a single-car attached garage that owners want to convert to a bedroom or home
      office. The structural challenge: existing concrete slabs are usually pitched for drainage
      toward the garage door, which means the floor either needs a DriCore subfloor system raised
      above it or a partial slab grind followed by self-leveling compound before any finish
      flooring can go in. The garage door opening needs to be framed out and filled — a LVL header
      carries the load where the door used to be — and the exterior has to match the existing
      Hardie siding or board-and-batten to satisfy Lacey's residential code. Foundation vents in
      the perimeter wall need to be relocated or properly sealed with a vapor barrier detail. A
      straightforward attached garage conversion runs 6–9 weeks from permit to blue tape
      walkthrough, typically costing $35K–$65K depending on finish level.

  - title: "Setback and Lot Coverage Calculations That Derail Garage Permits"
    description: |
      Setback requirements catch a lot of Lacey garage projects off guard — especially on narrower
      lots in 98503 near South Lacey and the residential blocks south of Yelm Highway. Standard
      R-1 zones require 5-foot side and rear setbacks for accessory structures, but parcels near
      the Woodland Creek greenway sometimes carry lot coverage limits around 40% of total lot area
      that leave less buildable room than owners anticipate. Before any design work starts, a site
      plan has to show the primary structure footprint, proposed garage footprint, driveway, and
      any existing sheds or covered patios — all of it counts against FAR and lot coverage.
      Lacey's permit center flags these issues during the initial plan review, and redesigns add
      4–6 weeks if the footprint needs scaling back. TopVolk, WA Licensed Contractor, prepares
      and submits the full permit package — site plan, structural drawings, and energy code
      compliance documentation — so homeowners don't navigate that paperwork on their own.

  - title: "EV Charger Pre-Wire and Electrical Subpanel Sizing During Construction"
    description: |
      Running a 50-amp or 60-amp EV charger circuit during garage construction costs far less than
      trenching back to the main panel after the concrete slab is poured. A detached garage in
      Lacey needs a subpanel regardless — to support lighting, outlets, and a door opener circuit
      — so upsizing from a standard 60-amp to a 100-amp unit to accommodate a Level 2 charger
      (Bosch EV220 or a ChargePoint CT4000 are practical choices for this area) is a marginal
      cost difference at the rough-in stage. The electrical rough-in inspection from the city of
      Lacey happens after wiring is pulled but before insulation or drywall closes the walls —
      scheduling that inspection correctly keeps the project on track. Missing the window means
      opening walls back up, which adds cost and time. Full electrical in a standard two-car
      garage — subpanel, EV conduit, LED lighting circuit, and general-purpose outlets — runs
      $4,000–$8,000 depending on distance from the main panel and trench length across the lot.

  - title: "Concrete Slab Spec and Moisture Management on Lacey Lots"
    description: |
      Lacey's climate — close to 50 inches of annual rainfall and a water table that rises
      seasonally in lower-lying areas near Chambers Lake and the Woodland Creek corridor — means
      concrete slab specifications matter more than in drier parts of the state. The city of Lacey
      requires a minimum 4-inch fiber-reinforced slab with a thickened edge footing (typically
      12 inches deep and 12 inches wide) for a detached garage. Vapor barrier under the slab is
      code-required, and it's worth upgrading from standard 6-mil poly to a 15-mil product — the
      thinner material gets punctured during the pour and ends up doing almost nothing. Grading
      around the garage perimeter needs to slope away at 6 inches over 10 feet minimum; some
      Hawks Prairie lots that weren't properly finish-graded after original home construction need
      fill brought in before a slab can be poured without drainage problems. A correctly done slab
      pour for a 24x24 garage runs $6,000–$10,000 in materials and labor, depending on site prep
      complexity.

