  - q: "What does a new detached garage cost to build in Lacey?"
    a: |
      A standard two-car detached garage (24x24, basic finish) in Lacey runs roughly $60,000–
      $95,000 fully permitted — that includes the fiber-reinforced slab, framing, roofing, Hardie
      cement-board siding, one insulated garage door, and an electrical subpanel with EV conduit
      pre-wire. What pushes the number up: garage-over-DADU builds, custom rooflines to match the
      primary residence, an upgrade to a Clopay 4-Star insulated door, or a long electrical trench
      run from the main panel. Sloped lots in 98516 near Hawks Prairie sometimes require a stem
      wall foundation instead of a monolithic slab, adding $4,000–$8,000. TopVolk's on-site
      estimates include a written line-item quote — no vague ranges. Call (206) 591-1096
      to schedule a site visit.

  - q: "Does the city of Lacey require a permit for a new garage, and how long does it take?"
    a: |
      Any new detached structure over 200 square feet requires a building permit through Lacey's
      Community and Economic Development Department. The application needs a site plan, floor plan,
      foundation plan, and elevation drawings for all four sides. Plan review for a standard
      detached garage runs 4–8 weeks; a garage-over-ADU configuration adds a concurrent DADU
      review track and can push that to 10–14 weeks. TopVolk, WA Licensed Contractor, prepares
      and submits the complete permit package. Construction contracts include milestone deadlines
      for permit submission, slab pour, framing, rough-in inspection, and final inspection — and
      if TopVolk misses a scheduled date, the contract includes financial penalties paid directly
      to the homeowner. That commitment is in writing before work begins.

  - q: "Can you build an insulated workshop garage for year-round use in Lacey?"
    a: |
      Workshop insulation decisions have to happen during framing — not as an afterthought after
      drywall is ordered. An insulated workshop garage in Lacey's climate needs R-21 batts in
      2x6 walls, R-38 in the ceiling, and a vapor barrier on the warm side of the insulation.
      For power tools, a 100-amp subpanel handles a table saw, dust collector, and air compressor
      running simultaneously — a standard 60-amp unit cannot. Weatherstripping on a Wayne Dalton
      8000 Series or similar insulated garage door needs to seal completely to maintain the thermal
      envelope through Lacey's five-month rain season. A Mitsubishi Mr. Slim mini-split handles
      year-round temperature control without the combustion air requirements of a gas unit heater.
      Properly done, a conditioned workshop garage stays dry, comfortable, and usable twelve
      months a year.

  - q: "What warranty does TopVolk provide on a garage construction project?"
    a: |
      Material warranties depend on the products used. A Clopay or Wayne Dalton insulated garage
      door carries the manufacturer's limited lifetime warranty on panels and sections. Hardie
      cement-board siding carries a 30-year manufacturer warranty on the product itself.
      Washington State contractor warranty law covers workmanship for three years, mechanical systems
      for 2 years, and structural defects for 6 years. Beyond the legal baseline, the practical
      guarantee is construction quality: properly flashed window and door openings, correctly
      lapped Hardie siding, and a 15-mil vapor barrier under the slab. TopVolk has completed
      100+ projects since 2023 — those builds are still standing, and the owners reach Vladislav
      directly if something needs attention. No middleman, no call center.

