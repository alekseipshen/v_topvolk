title: "Lacey Bathroom Remodel — Replacing 90s Tract Baths in Thurston County"

intro: |
  Lacey grew fast in the 1990s. Hawks Prairie, Woodland Creek, and the subdivisions stacked along Marvin Road packed in thousands of tract homes over roughly fifteen years — and most shipped with the same bathroom: off-white 4×4 wall tile, a particle-board vanity base, fiberglass tub surround, and a single exhaust fan rated maybe 50 CFM that hasn't spun freely in a decade. Thurston County pulls around 51 inches of rain annually. That moisture works into every weak point those builder-grade installs left behind. Grout cracks, shower pan failures, particle-board swelling under the sink — these aren't cosmetic problems. They're structural rot in progress. TopVolk Construction LLC has completed over 100 bathroom remodels across the Seattle metro since 2017, including waterproofing retrofits using Schluter Kerdi membrane in shower enclosures and full layout reconfigurations on 98503 ranchers. Vladislav Volkov visits every job site personally before a number goes on paper — not an estimator, not a closer.

localContext: |
  Lacey's residential stock breaks into two distinct eras. The 98503 zip — central Lacey, Tanglewilde, and the older blocks near Pacific Avenue — carries mid-1970s to late-1980s builds: split-levels and ranchers with original galvanized drain stacks and crawlspace vapor barriers that have either degraded or were never correctly installed. The 98516 zip, covering Hawks Prairie and newer growth north of the city core, has post-2000 builds with code-compliant framing but original fixtures — Pfister or Delta hardware from the early 2000s that now drips or stains. Both eras share one problem: ventilation undersized for PNW humidity. Thurston County winters run wet October through April, and bathrooms in both zip codes show it — mildew on grout joints, ceiling paint bubbling, and in worse cases, subfloor OSB softening below the toilet flange. Permit applications for bathroom work in Lacey route through City of Lacey Development Services; plumbing relocations and structural changes require plan review before demo starts.

commonProblems:
  - title: "Failed Fiberglass Tub Surrounds and Shower Pan Rot on 1990s Lacey Builds"
    description: |
      The fiberglass tub-shower combos standard in 1990s Lacey construction had roughly a twenty-year design life. They're past it. Caulk lines at the surround seam crack open, water migrates behind the unit, and the subfloor OSB takes on moisture through the drain flange collar. By the time a homeowner notices soft tile or floor flex near the base, there's usually rot extending into the rim joist area below the subfloor. TopVolk removes the failed assembly, cuts back affected subfloor, and installs a new mud-bed shower pan or a Schluter Kerdi membrane system over cement board, then tiles to spec. A full tub-to-shower conversion with Kerdi waterproofing, large-format porcelain tile, and a recessed niche typically runs $8,000–$14,000 depending on footprint and fixture grade. Rough-in inspection is required before tile goes up — that scheduling window is built into the timeline, not added on afterward.

  - title: "Undersized Exhaust Fans Routing Moisture Into Attic Framing"
    description: |
      A 50 CFM builder-grade fan isn't adequate for a standard master bath in Thurston County's climate. ASHRAE recommends a minimum of 1 CFM per square foot of bathroom area, and continuous low-CFM ventilation outperforms intermittent high-CFM every time for actual moisture management. Worse, Lacey homes from the 1990s frequently have exhaust ducts terminating inside the attic cavity rather than penetrating to an exterior wall cap — a code violation that routes humid air directly into the insulation and framing. TopVolk reroutes the duct to a proper exterior termination, upgrades the fan to a Broan or Panasonic unit with an integrated humidity sensor, and ties the switch to a timer circuit. If mold has developed in ceiling joists or wall framing by the time the fan gets inspected, remediation has to happen before any finish scope begins — and that affects both timeline and budget from the start.

  - title: "Walk-In Shower Conversions Requiring Permits Through City of Lacey Development Services"
    description: |
      Converting a tub-shower combo to a curbless walk-in shower almost always involves relocating the drain, moving at least one supply line, and potentially reframing a knee wall or threshold. That's a plumbing and structural permit in Lacey — filed with City of Lacey Development Services, not Thurston County, since Lacey is incorporated. Plan review for a bathroom remodel with no exterior structural work typically takes 2–4 weeks. TopVolk prepares the permit package and coordinates the rough-in inspection after plumbing and framing are repositioned. The final inspection follows after tile, fixtures, and ventilation are complete. Vladislav manages the permit documentation directly — you're not relying on a subcontractor to relay information back to the city. A curbless shower with a linear drain, RedGard waterproofing at the transition zone, and a built-in bench runs 10–20% more than a curbed conversion due to additional waterproofing scope and drain relocation labor. TopVolk is a WA Licensed Contractor and pulls permits as part of the project scope.

  - title: "Vanity Swaps That Open Into Galvanized Plumbing Problems — Cost Reality"
    description: |
      Replacing a vanity in a Lacey 98503 rancher sounds simple until the wall comes open. Pre-1990 builds in Tanglewilde and surrounding blocks often still run galvanized supply lines that have restricted to a fraction of their original interior diameter, with visible corrosion at the angle stop valves. A straight vanity swap becomes a galvanized-to-PEX-A reroute for the supply lines, plus drain relocation if the new vanity footprint differs from the old. Fixture-wise, mid-range Moen or Kohler single-handle hardware runs $150–$350 per fixture at retail — solid warranty coverage for the price point. TopVolk provides line-item written estimates before anything gets ordered, so there are no discovered costs after demo. A vanity replacement with supply line upgrades, new Kohler undermount sink, and updated lighting typically runs $2,500–$5,500. Add 15–20% contingency on pre-1990 homes once walls are open.

  - title: "Crawlspace Moisture Compromising Bathroom Subfloors in Central Lacey"
    description: |
      Homes in older Lacey blocks — particularly around Tanglewilde and the 98503 corridor — sit on continuous perimeter or post-and-pier foundations with crawlspaces. Thurston County's wet winters mean that without an adequate vapor barrier and proper ventilation below, ground moisture migrates up into the floor framing. Bathroom subfloors directly above take the worst of it: OSB softens, toilet flanges shift, and tile grout cracks in patterns that trace the joist layout underneath. Before any finish scope in a bathroom over a crawlspace, TopVolk assesses subfloor thickness, checks for joist compromise, and where warranted, installs sistered joists to restore structural capacity before laying DriCore or a new plywood layer. A crawlspace vapor barrier upgrade is often recommended in parallel — that's a separate scope but frequently caught during the initial walkthrough. Call (206) 591-1096 to get Vladislav on-site for that assessment before anything else gets priced.

faq:
  - q: "How far is Lacey from your base, and how does that affect scheduling?"
    a: |
      Lacey sits about 60 miles south of Seattle via I-5 — typically 60–90 minutes depending on Tacoma traffic. TopVolk works on project-based scopes, not service calls, so travel is factored into the project plan rather than billed per visit. The first step is a free on-site walkthrough with Vladislav. Call (206) 591-1096 to schedule it. From initial estimate to demo start, expect 2–5 weeks depending on permit review timeline and material procurement. City of Lacey Development Services plan review for plumbing-involved remodels runs roughly 2–4 weeks — that window goes into the project schedule from day one, not added on as a surprise.

  - q: "What does a full bathroom remodel cost in Lacey?"
    a: |
      A mid-range full bathroom remodel in Lacey — new tile, curbless walk-in shower conversion, updated vanity, Moen or Kohler fixtures, and a ventilation upgrade — typically runs $14,000–$28,000. That range moves based on the condition of existing subfloor and walls, complexity of plumbing relocations, and material choices. Tile selection alone can swing cost by $3–8 per square foot between standard ceramic and large-format porcelain. TopVolk provides a written, line-item estimate after the on-site walkthrough — not a vague range over the phone. Schedule a free consultation at (206) 591-1096. Budget an additional 15–20% contingency on pre-1990 homes once walls come open.

  - q: "Do I need a permit for a bathroom remodel in Lacey, and who handles it?"
    a: |
      Moving plumbing, rerouting ventilation ducts, or making any structural framing changes in Lacey requires a permit through City of Lacey Development Services. Cosmetic work — swapping fixtures at the same location, retiling over sound backer board — typically doesn't trigger permit review. TopVolk prepares the permit application, project drawings, and scope description for submission. Rough-in inspection happens after plumbing and framing are repositioned but before backer board and tile go up. Final inspection closes the permit at project completion. Plan review in Lacey runs 2–4 weeks — that's built into the project schedule from the start. TopVolk is a WA Licensed Contractor and manages the full permit process as part of the job.

  - q: "Do you handle ADA accessibility retrofits in Lacey bathrooms?"
    a: |
      Yes. Grab bar blocking, curbless shower conversions, wider door rough openings (IRC minimum 32 inches clear width), and comfort-height toilet installations are common on Lacey projects — especially for homeowners planning to age in place. A curbless shower requires a linear drain, proper slope across the entire floor pan to the drain, and a continuous Schluter Kerdi or RedGard waterproofing membrane with no curb transition. Widening a doorway involves a framing permit and AHJ inspection through Lacey Development Services. TopVolk has completed ADA-oriented bathroom retrofits on ranchers in the 98503 area where the original layout had a tub-only configuration. Call (206) 591-1096 if you want to talk through what's feasible in your specific floor plan before committing to anything.

  - q: "How long does a bathroom remodel take start to finish in Lacey?"
    a: |
      Scope determines timeline. A standard hall bath — tile replacement, vanity swap, fixture updates, no plumbing relocation — runs 2–3 weeks of active construction after permit approval. A full master bath reconfiguration with curbless shower conversion, plumbing reroute, and subfloor repair typically takes 4–6 weeks on-site. Add 2–4 weeks of permit review in Lacey before demo starts. End-to-end from signed contract to final inspection: 6–12 weeks is realistic for a full remodel. TopVolk builds a project schedule at kickoff with specific milestone dates. The deadline penalty clause in the contract is real — if TopVolk misses agreed milestones without cause, penalties apply. That's in writing before any deposit changes hands.

  - q: "Do you cover other areas in Thurston County besides Lacey?"
    a: |
      TopVolk covers Tumwater, Olympia, Yelm, and unincorporated Thurston County under the same project process. Unincorporated areas route permit applications through Thurston County Resource Stewardship rather than a city-level Development Services office — slightly different review structure, same plan review and inspection sequence. Yelm and Rainier tend to have older rural housing stock with crawlspace foundations that need assessment before bathroom work starts. Tumwater and Olympia homes built in the 1960s and 70s often have cast-iron drain stacks still in service — those get evaluated during the on-site walkthrough. Reach Vladislav directly at (206) 591-1096 to discuss your project location and what the permit process looks like for your specific address.