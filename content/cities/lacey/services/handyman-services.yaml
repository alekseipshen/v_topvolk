title: "Lacey Handyman Services — Punch Lists, Patches & Fixture Swaps"

intro: |
  Hawks Prairie subdivisions in 98516 were built fast — mid-1990s through the early
  2000s, production homes with builder-grade everything. Those homes are hitting their
  25-to-30-year mark now, and the list of small repairs that never got done is catching
  up with homeowners. A dripping Moen kitchen faucet. A drywall patch from a plumber's
  access cut that still doesn't match the orange-peel texture in the hallway. Deck
  boards going soft from Lacey's seven-month rainy season. These aren't full remodel
  jobs, and that's exactly the problem — most contractors in Thurston County won't
  schedule a half-day of fix-it work when they could book a $60,000 kitchen instead.
  TopVolk Construction LLC, WA Licensed Contractor, has completed 100+ projects since
  2023 across Lacey, Olympia, and the wider region — including the kind of punch list
  and finish work that piles up for months because nobody wants to touch a short scope.
  Vladislav Volkov does. Call (206) 591-1096 and talk to the person who'll actually
  show up.

localContext: |
  Central Lacey in zip code 98503 holds a mix of 1970s and 1980s tract development —
  ranchers and split-levels built when Lacey was first growing out from Olympia's edge.
  Woodland Creek and the neighborhoods east of Lacey Boulevard carry a lot of that era's
  housing: galvanized plumbing being replaced in pieces, original single-pane windows
  getting swapped for Milgard double-pane, and dated popcorn ceilings getting slowly
  skim-coated room by room. Farther north in 98513, the Hawks Prairie corridor shifted
  to 1990s and early 2000s construction — vinyl-sided colonials and ramblers that were
  solidly built but are now showing weatherstripping failure, loose deck railings, and
  fixture wear. Lacey gets roughly 50 inches of rain annually, and that moisture shows
  up in rotted exterior trim, soft deck framing, and crawlspace vapor barrier issues
  that weren't caught at rough-in inspection. Many homes near Joint Base Lewis-McChord
  also see above-average turnover, which means deferred maintenance lists pile up
  between owners — and the next buyer inherits them all at once.

commonProblems:
  - title: "Punch List Completion After a Big Remodel — the 40 Small Things Nobody Finishes"
    description: |
      General contractors wrapping up a kitchen or bathroom remodel hand off the project
      with a punch list: a dozen or more small tasks that didn't make it to final
      inspection but still need doing. Door hardware ordered late. A Schluter Kerdi tile
      edge strip needing caulk at the floor transition. Three outlet covers missing because
      the electrician ran out. Cabinet pulls not yet installed. This scope falls into a
      gap — the GC considers the project done, the homeowner is still living in a
      half-finished space. TopVolk handles punch list completion as a standalone service.
      A typical blue tape walkthrough takes 30 minutes; most punch lists in Lacey wrap up
      in one to two days of work. Vladislav scopes it on-site, quotes it line by line,
      and gets it done — no subcontracting the punchout to an apprentice who's never
      seen the job before.

  - title: "Drywall Patches That Don't Match the Existing Wall Texture"
    description: |
      Older homes in the 98503 corridor — especially the 1970s and 1980s ranchers around
      Woodland Creek — typically have orange-peel or skip-trowel texture on their walls.
      Matching that texture after a repair is harder than it looks. A contractor who
      patches the drywall cleanly but doesn't feather the texture to blend with the
      surrounding 40-year-old finish leaves a patch that's obvious under any raking light.
      The fix requires proper drywall hang, tape, and mud sequencing, light sanding after
      dry, texture matching with a hopper gun or hand trowel, primer, and finish coat. For
      larger repairs — say, after a plumber opened a wall to replace galvanized supply
      pipe — the visible area can span four to five feet, and texture feathering needs to
      extend further than the actual patch boundary. TopVolk handles this regularly,
      including post-plumbing repairs and post-HVAC-install patches throughout Lacey.

  - title: "Fixture Replacement — Faucets, Toilets, and Light Fixtures Without Full Trade Scopes"
    description: |
      A Kohler toilet that runs constantly, a bathroom vanity light from 2003 that nobody
      likes anymore, a kitchen faucet leaking at the base — these are one-to-two-hour
      swaps that still require knowing what's behind the wall. In older Lacey homes, a
      faucet replacement sometimes turns into a shutoff valve swap when the original
      valves won't close fully — common with galvanized supply lines still in service.
      A toilet swap in a 1980s bathroom may reveal a flange sitting below finished floor
      level, requiring a flange extender before the new unit seats correctly. TopVolk
      handles this as handyman-scope work: fixture-only replacement where no new rough-in
      is required, no permit needed, and the scope stays limited to removing the old unit
      and installing the new one right. Homeowners supply the fixture or TopVolk sources
      Moen, Kohler, or equivalent from the local supply house — no markup games.

  - title: "Deck Board Replacement and Railing Repair in Lacey's Wet Climate"
    description: |
      Lacey's rain season runs October through May — seven months of moisture sitting in
      wood end grain, under deck boards, and around post bases. Pressure-treated lumber
      on decks from the 1990s used older CCA treatment, which degrades faster than
      today's ACQ-treated stock, especially on north-facing decks with poor drainage.
      Individual board replacement is straightforward: pull the soft boards, inspect the
      rim joist and blocking underneath for rot, sister any compromised joists, and replace
      with new PT or Trex composite depending on what the homeowner wants. Composite —
      Trex or TimberTech — makes more sense on Lacey decks that don't get enough sun to
      dry out between storms. Railing repairs, including loose post bases and failed rail
      brackets, are common after a few wet-dry seasons. A typical four-board swap plus
      railing tighten runs two to four hours of labor.

  - title: "Weatherstripping and Door Sealing for Lacey's Seven-Month Rainy Season"
    description: |
      Homes built in the 1980s and early 1990s in central Lacey often still have their
      original weatherstripping on exterior doors — foam or vinyl compression strips that
      compressed flat a decade ago. A door with failed weatherstripping in a Lacey winter
      doesn't just let cold air in; it lets moisture vapor into the wall cavity, which
      matters more in this climate than in a dry region. The fix: strip the old material,
      clean the door stop surface, and install new compression weatherstripping — typically
      a Q-lon bulb-seal or equivalent product rated for Pacific Northwest exposure. Sliding
      glass doors usually wear out at the bottom pile seal first. For older Milgard or
      builder-grade windows showing fogging between panes, glazing tape and sill pan
      flashing are worth checking at the same visit. TopVolk typically combines
      weatherstripping replacement with a door adjustment — planing the edge and resetting
      the strike plate — so the door actually seals when it closes. One to two hours per
      door.

