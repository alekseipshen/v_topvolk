  - q: "What does handyman work in Lacey typically cost?"
    a: |
      Scope drives the number. A single fixture swap — toilet, faucet, or light fixture —
      typically runs $150 to $350 in labor depending on what's found behind the old unit.
      A full punch list after a remodel can run $800 to $2,500 depending on line item
      count and whether any items involve trim carpentry or texture matching. Deck board
      replacement with joist inspection runs roughly $200 to $600 for a typical section,
      not counting materials. TopVolk provides line-item quotes after an on-site visit —
      no vague ranges over the phone, no add-ons at the end. Call (206) 591-1096 or
      schedule a free on-site consultation to get a number you can actually budget around.

  - q: "Do I need a permit for handyman repairs in Lacey?"
    a: |
      Most handyman-scope work — fixture replacement, drywall patching, deck board swaps,
      weatherstripping — does not require a permit from the City of Lacey's Community
      Development Department. Structural deck repairs involving post replacement or
      ledger board connections do require a permit, and Lacey runs its own permit process
      separate from Thurston County. If a job crosses into permitted territory, TopVolk
      handles the paperwork as a WA Licensed Contractor — including site plan, scope
      description, and coordination with Lacey's plan review queue, which typically runs
      two to four weeks for minor residential work. You don't have to navigate the permit
      portal yourself.

  - q: "Can you install smart home devices — doorbell cameras, thermostats, smart locks?"
    a: |
      Yes — this is one of the more common requests in Lacey, especially in newer Hawks
      Prairie homes where the wiring is clean and accessible. A Nest or Ecobee smart
      thermostat swap takes about an hour, including wiring verification and app
      configuration. Ring or Arlo doorbell cameras require confirming existing doorbell
      transformer voltage — most 1990s and 2000s homes have one, some don't — and may
      need a transformer upgrade if the existing one is undersized. Smart locks like
      Schlage Encode or Yale Assure are straightforward installs on standard door prep.
      TopVolk charges flat-rate labor for device installs: $95 to $175 per device
      depending on complexity. No upselling, no subscription pitch.

  - q: "What warranty do you offer on handyman work?"
    a: |
      Workmanship is warranted for one year on all labor — if something fails because of
      how it was installed, TopVolk comes back and fixes it at no charge. Materials sourced
      by TopVolk carry whatever manufacturer warranty applies: Trex and TimberTech composite
      decking, for example, carries a 25-year fade and stain warranty. Moen and Kohler
      fixtures typically include lifetime limited warranties on finish and internal
      components. Drywall texture and paint work is warranted against seam cracking or
      peeling for one year. Vladislav puts the warranty terms in writing in the contract —
      no fine print, no call center between you and the person who actually did the work.

