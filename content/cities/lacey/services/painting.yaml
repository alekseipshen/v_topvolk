title: "Lacey Painting — Cedar Siding, Lead Testing & Interior Repaints"

intro: |
  Fifty-plus inches of rain a year hits Thurston County, and exterior paint on cedar-trimmed homes
  in the 98503 zip — particularly the ranchers and split-levels near Lacey Community Park — starts
  failing faster than the can ever suggested. North-facing walls in the Tanglewilde-Thompson Place
  area mildew between seasons; by year four on a south-exposure cedar lap, the paint is chalking and
  the lap joints are lifting. Hawks Prairie (98516) runs newer — mostly 1990s and 2000s tract
  construction with Hardie cement-board siding — but those homes still need a proper two-coat
  exterior acrylic system to hold through the wet season. Vladislav Volkov at TopVolk Construction
  handles painting projects from Lacey south through Olympia and north into Pierce County — 100+
  projects completed since 2023, including pre-1978 homes requiring EPA RRP lead-safe protocols
  before a single scraper touched the surface. Call (206) 591-1096 to schedule a free on-site
  estimate — Vladislav shows up, not a sales rep.

localContext: |
  The 98503 zip covers Lacey's older residential core: 1960s and early 1970s ranchers along
  Rainier Road and the streets east of Pacific Avenue, many with original wood siding or 1990s
  Hardie retrofits over cedar sheathing. Pre-1978 homes in this zip trigger EPA Renovation, Repair,
  and Painting (RRP) requirements whenever a contractor disturbs more than six square feet of
  painted interior surface or twenty square feet outside — that's not optional, and it affects
  prep costs. Out in 98516, Hawks Prairie and Horizon Pointe are predominantly 2000s construction:
  Hardie panel and Hardie plank on fiber-cement sheathing, which holds paint well but still needs
  recoating on a seven-year schedule to stay within James Hardie's warranty spec. Thurston County's
  rainfall sits considerably higher than Seattle's annual average, and the basin's humidity keeps
  substrates from fully drying between October and May. Tanglewilde-area cedar siding on north
  exposures is particularly aggressive — we've seen full biological growth reappear within twenty
  months when the prep work skipped a proper mildewcide wash.

commonProblems:
  - title: "Cedar Siding Repaint Cycles Shortened by Thurston County Moisture Load"
    description: |
      Cedar bevel and cedar shake on the older 98503 ranchers typically fails its top coat in
      five to six years on north and west exposures — not the seven the paint manufacturer prints
      on the label. The failure sequence is predictable: lap joints hold moisture, the wood grain
      opens, and the acrylic film begins lifting in sections rather than chalking uniformly.
      Proper prep is the only fix that actually sticks. That means a 2,500 PSI minimum power wash,
      hand-scraping all loose material, spot-priming bare wood sections with an oil-based primer
      like Zinsser Cover Stain, then two full finish coats of Sherwin-Williams Emerald Exterior.
      Budget $3.50 to $5.50 per square foot on a standard 1,800 sq ft Lacey rancher depending
      on surface condition and story count. Skipping the spot-prime on bare cedar — which a lot
      of one-day painting crews do — cuts the lifespan of even premium paint by two to three
      years on the first repaint cycle.

  - title: "Lead Paint Compliance on Pre-1978 Lacey Homes"
    description: |
      A substantial share of the older housing near Lacey Community Park was built before 1978 —
      the regulatory cutoff for lead-based paint in residential construction. EPA RRP rules require
      certified lead-safe work practices on any painting or prep work disturbing lead paint above
      the de minimis thresholds. That means full containment sheeting, HEPA-rated vacuum equipment,
      documented waste disposal, and written recordkeeping — not a dust mask and a window open.
      Before any exterior repaint on a pre-1978 home, TopVolk coordinates XRF testing or EPA-
      approved swab testing to establish what's present and where. Compliance steps add roughly
      $600 to $1,400 to a typical exterior repaint scope, depending on the surface area and results.
      EPA fines for RRP violations run up to $37,500 per violation per day. That math makes the
      cost of doing it right straightforward. Vladislav Volkov — WA Licensed Contractor, direct
      line (206) 591-1096 — handles the documentation as part of the project close-out package.

  - title: "Moisture-Resistant Paint Failures in Bathrooms and Laundry Rooms"
    description: |
      Flat latex on a bathroom wall is almost a guarantee of peeling within eighteen months in a
      Lacey home — yet it's what we find in a majority of the houses we inspect. The problem is
      vapor saturation. A standard household shower produces enough humidity to migrate into a
      poorly sealed wall cavity, and if the paint film can't handle that vapor cycle, bubbling
      starts behind the surface layer before it's visible. The correct specification: mold-
      resistant drywall, Zinsser Mold Killing Primer as a base coat, and a high-humidity-rated
      finish like Sherwin-Williams Emerald Interior in a satin or semi-gloss sheen. Laundry rooms
      running front-load machines — LG or Bosch units are common in the Hawks Prairie builds —
      need the same treatment on all surfaces behind and beside the unit; condensation cycling
      on cold walls is aggressive from November through March. Bathroom repaint scope in a
      standard Lacey home runs $450 to $950 per room depending on size and existing surface
      condition.

  - title: "Cabinet Repainting as an Alternative to Full Kitchen Replacement"
    description: |
      Mid-range kitchen cabinetry in good structural condition — solid wood, plywood-box
      construction, or MDF faces — is a legitimate candidate for repainting rather than
      replacement. The key is surface prep: every door and drawer front comes off, all surfaces
      get sanded and de-glossed, and a shellac-based bonding primer like Zinsser BIN goes down
      before any finish coat. Finish coats are sprayed flat (not brushed), using Benjamin Moore
      Advance waterborne alkyd — a product that cures to a hard, scrubbable surface comparable
      to traditional oil-based cabinet paint without the long dry time or solvent fumes.
      For a standard Lacey kitchen with 20-25 cabinet doors and drawer fronts, budget $2,500
      to $4,500 depending on piece count and condition. Semi-custom cabinet replacement in
      the same kitchen typically runs $8,000 to $18,000 installed — and that's before
      countertop or tile work. The repaint route makes sense when the box construction is
      solid and the layout is staying the same.

  - title: "Exterior Color Selection Under Pacific Northwest Gray Light"
    description: |
      Paint colors behave differently under the flat, diffused light that dominates Lacey from
      October through April. Warm greige samples that look neutral in a showroom can read
      actively purple on a north-facing Hardie plank panel at noon on an overcast February day.
      This is a real budget risk — repainting because the color is wrong costs as much as the
      original job. Standard practice on any exterior repaint TopVolk handles: large-format
      sample boards (minimum 2'x2') applied to the actual substrate on site, reviewed over two
      to three days across different light conditions before any full commitment. For Hardie
      cement-board on Hawks Prairie homes, the Benjamin Moore Affinity collection and
      Sherwin-Williams Emerald Designer Edition both perform reliably under gray-spectrum PNW
      light. Color consultation — sample boards, light-condition review, substrate assessment —
      is included in every exterior repaint estimate at no extra charge.

faq:
  - q: "How fast can you get to Lacey for a painting estimate?"
    a: |
      Lacey is roughly 65 miles south of Seattle on I-5 — about an hour under normal conditions,
      longer during afternoon commute windows. Vladislav schedules Thurston County estimates on
      Tuesdays and Wednesdays to keep drive time efficient. Call (206) 591-1096 to get on the
      calendar. For interior painting projects, estimate-to-start typically runs two to three
      weeks. Exterior repaints depend on weather window — Lacey's wet season runs October through
      May, so exterior scheduling fills quickly in June through September. You talk directly to
      Vladislav, not a scheduler working from a script.

  - q: "What does an exterior house repaint cost in Lacey?"
    a: |
      For a standard 1,500 to 2,000 sq ft single-story rancher in 98503 or 98516 — full scope
      including power wash, hand-scraping, spot-prime on bare sections, and two finish coats —
      budget $4,500 to $9,000. Multi-story homes or those with significant peeling and wood
      deterioration run higher; well-maintained Hardie siding with light prep work runs lower.
      If lead testing and RRP compliance are required on a pre-1978 home, add $600 to $1,400
      to the base scope. Pricing is line-item specific — no ranges handed over at the door.
      Call (206) 591-1096 or schedule a free on-site estimate to get exact per-surface numbers.

  - q: "Does Lacey require permits for exterior painting?"
    a: |
      Standard exterior repaints — wash, prep, prime, and paint on existing siding — do not
      require a building permit in Lacey. However, if the project involves replacing damaged
      siding sections, adding or altering any structural element, or disturbing lead paint in
      a pre-1978 home, additional regulatory steps apply. Lead-disturbing work triggers EPA
      RRP compliance documentation regardless of permit status. TopVolk is a WA Licensed
      Contractor and handles all required documentation — EPA lead-safe certification records,
      waste disposal logs — as part of the project package. Nothing gets signed off without
      the paperwork being in order. Vladislav walks through this at the estimate stage so
      there are no surprises mid-project.

  - q: "Do you do cabinet repainting, or just walls and exterior?"
    a: |
      Cabinet repainting is a significant part of what we do, particularly in Lacey kitchens
      where homeowners have remodeled countertops and tile but want to avoid the cost of new
      cabinets. The process matters more than people expect: doors and drawer fronts come off
      the boxes, all surfaces are sanded and de-glossed, Zinsser BIN shellac-based bonding
      primer goes down, and finish coats of Benjamin Moore Advance waterborne alkyd are sprayed
      flat in a controlled environment. Brushed cabinet paint — even good paint — leaves texture
      that reads as amateur in kitchen lighting. For 20-25 cabinet pieces in a standard Lacey
      kitchen, typical project timeline is four to six days total including cure time before
      rehinging doors. Call (206) 591-1096 to discuss your cabinet condition and get a
      line-item quote.

  - q: "How long does exterior paint last on Lacey homes?"
    a: |
      On properly prepped cedar or Hardie siding with a quality two-coat exterior acrylic —
      Sherwin-Williams Emerald or Benjamin Moore Aura Exterior — expect five to seven years
      on south and west exposures, four to six years on north-facing surfaces where mildew
      load is higher. Thurston County averages over 50 inches of rain annually, and shaded
      north-facing walls stay damp long enough between late fall and spring to support
      biological growth. An annual soft wash with diluted bleach solution — 1 part bleach,
      4 parts water — extends a repaint cycle by one to two years. Every project TopVolk
      completes includes a written maintenance schedule specific to the home's exposures
      and substrate — not generic advice. Deadline commitments are written into the contract:
      if we miss the agreed completion date, the contract specifies a financial penalty paid
      to you.

