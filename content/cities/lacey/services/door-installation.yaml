title: "Lacey Door Installation — 25 Years Later, Builder Doors Fail"

intro: |
  Hawks Prairie and the Woodland Creek neighborhoods account for a large share of Lacey's housing stock — mostly 1995-2010 builds where the original entry door was a 32-inch steel prehung unit the builder spec'd for under $200. Those doors are now hitting 20-25 years. The polyurethane foam cores have delaminated, bottom rails are rusting from the inside out, and door sweeps stopped contacting the threshold years ago. Thurston County pulls over 50 inches of rain annually, and a failed door sweep means moisture wicking into the subfloor sheathing long before a homeowner notices soft spots underfoot or staining at the baseboard. TopVolk Construction — 100+ projects completed since 2017 across the Seattle Metro and South Sound — handles entry door replacements, French door conversions, patio sliding door upgrades, and interior door packages during full remodels. Fiberglass units from Therma-Tru or Pella, properly flashed with a sloped sill pan, are what we typically spec for Lacey's sustained rain exposure. Call (206) 591-1096 to schedule a free on-site estimate with Vladislav directly — no sales staff, no middleman.

localContext: |
  Lacey splits into two pretty distinct housing eras. The older sections along Martin Way E and Pacific Avenue — zip code 98503 — carry 1970s and early 1980s ranchers, some with original solid-core wood entry doors painted so many times the hardware barely latches. Those doors can often still be refinished, but the jamb extension and brick mold at the bottom corners are usually rotted through. The Hawks Prairie corridor — zip code 98516 — is almost entirely 1990s-2000s tract construction: steel entry doors, builder-grade fiberglass brickmold that UV-chalks and separates from the frame, and hollow-core interior 6-panel doors on every bedroom and closet. Sliding glass patio doors in both areas were frequently installed without proper pan flashing, which shows up as soft rim joist framing and stained subfloor sheathing after years of Lacey's sustained October-through-May rain loads. Energy code under the current Washington State Energy Code also sets U-factor and air leakage thresholds for exterior doors — standards that most builder-era steel doors fail by a notable margin.

commonProblems:
  - title: "Rusted Bottom Rail and Failed Threshold Seal on 1990s Steel Entry Doors"
    description: |
      Steel entry doors in Hawks Prairie homes corrode from the bottom rail up — the factory primer and topcoat fail at the door sweep contact zone, moisture gets behind the coating, and rust bleeds through within 10-15 years. By now, most of those doors are well past that point. Once the bottom rail corrodes, the door sweep loses its mounting surface and gaps open between the door bottom and the threshold plate. Replacing correctly means pulling the full prehung unit, checking the king studs and sheathing for moisture damage, installing a sloped sill pan with Protecto Wrap or Schluter Kerdi membrane flashing, and setting a new fiberglass door in sealant. Therma-Tru Smooth-Star is the standard spec — factory-primed, rot-proof, and available in standard and custom sizes. Installed cost for a single 3/0 fiberglass prehung with new exterior casing runs $1,800–$3,200. One day of work once the door unit is in stock.

  - title: "Patio Slider Leaks at the Sill — Missing Pan Flashing in Woodland Creek"
    description: |
      Sliding glass doors in Lacey's Woodland Creek homes were typically installed without a proper pan flashing assembly — the door unit sat directly on the subfloor deck with a caulk bead as the only water stop. That caulk fails in 5-7 years. After two decades of Thurston County rain, the rim joist below the rough opening is frequently soft, and the subfloor sheathing at the sill is dark with moisture intrusion. Replacing the door correctly means sistering the rim joist with pressure-treated lumber if rot is isolated to that member, installing a sloped sill pan before the new unit goes in, and setting the door assembly in properly lapped flashing tape. Milgard Trinsic series sliding doors handle this application well — thermally broken aluminum frames, available in 6- and 8-foot widths, compatible with standard replacement rough opening dimensions. Budget $1,500–$4,500 depending on door size and whether rim joist sistering is needed. Typically 2 days on site.

  - title: "Interior Door Casing Failures and Solid-Core Upgrades During Remodels"
    description: |
      Interior doors in Lacey's 1990s-2000s tract homes are almost universally hollow-core 6-panel units — they swing fine at move-in, but after 25 years the finger-jointed pine casing has cracked at every miter, the slab dents on contact, and sound transmission through bedrooms is poor. Upgrading to solid-core MDF doors during a kitchen or hall remodel changes how the finished space feels immediately. The technical part that trips up a lot of DIY installs is shimming the jamb plumb in a house where the floor has settled unevenly — you need a consistent reveal on all three jamb faces before casing goes on, otherwise the miters pull open at the top corner. City of Lacey Community Development doesn't require a permit for interior door replacement, but the execution still matters. Vladislav does a blue tape walkthrough before finish work is called complete — anything not right gets addressed before final payment, not after. Solid-core interior doors run $350–$700 installed per opening depending on jamb condition. WA Licensed Contractor.

  - title: "French Door Conversion — Reframing and Header Work in Load-Bearing Walls"
    description: |
      Converting a 6-foot patio slider opening to a French door set is one of the more requested projects in Lacey's Hawks Prairie homes. The rough opening dimensions differ between a slider and a swing door pair — a 6068 slider RO is typically 72-1/4" x 80-1/4" while French door pairs often need a 74" or wider RO depending on door width and jamb thickness. More critically, if the wall above is load-bearing, the header needs to be properly sized: a 3-1/2" x 9-1/4" LVL beam spanning 7 feet is the typical spec for a residential exterior wall opening of this width. Pella 250 series French doors are the standard mid-range spec; Marvin Elevate wood-clad units are worth the premium on south- or west-facing walls where sustained rain exposure degrades finishes faster. City of Lacey requires a permit when structural framing changes are involved — TopVolk handles the permit application and plan review submittal. Budget $3,500–$7,500 depending on structural scope and door spec.

  - title: "Smart Lock Integration and Threshold Tuneup on New and Existing Doors"
    description: |
      Smart lock integration is a common add-on when Lacey homeowners are already replacing an entry door. Schlage Encode Plus drops into a standard 2-1/8" bore hole — if the existing door has a mortise lock or a smaller bore from an older installation on Martin Way, boring the new hole and patching the old cutout is straightforward. August Wi-Fi Smart Lock retrofits over an existing thumb-turn if the door slab is staying. The piece most people skip is threshold sealing: a Pemko 271AV adjustable threshold properly set so the door sweep compresses across the full door width — not just at the center — stops the water infiltration that drives rot at the sill. North- and west-facing entries in Lacey see direct driving rain from November through March, and a gap at the sweep corners admits measurable water over a single storm event. Smart lock installation adds $200–$450 to a door project depending on hardware. Deadline for project completion is written into every TopVolk contract — if the schedule slips on our end, there's a financial penalty, not just an apology.

faq:
  - q: "How fast can you get to Lacey for door installation?"
    a: |
      Lacey is roughly 65 miles south of Seattle via I-5 — we can typically schedule a free on-site estimate within 5-7 business days. The visit runs 30-45 minutes: Vladislav measures the rough opening, checks framing and sill pan condition, and hands you a line-item quote before leaving. No commissioned closer, no vague ranges — you get the actual number broken out by material and labor. Once a door unit is ordered and in, installation is scheduled within 2-3 weeks from that point. Call (206) 591-1096 to get on the calendar.

  - q: "What does entry door replacement cost in Lacey?"
    a: |
      A fiberglass prehung entry door replacement — Therma-Tru or Pella unit, Protecto Wrap sill pan flashing, new exterior casing — runs $1,800–$3,200 installed for a standard 3/0 door. Add $400–$800 if the brick mold or sheathing behind it has moisture damage that needs to be cut back and patched. French door conversions with LVL header work start around $3,500 and reach $7,500+ for wider openings or premium door specs. Patio sliding door replacement is $1,500–$4,500 depending on door size and rim joist condition. Every quote is line-item — material, labor, and any identified contingency are broken out separately. Schedule a free on-site estimate by calling (206) 591-1096.

  - q: "Does door installation in Lacey require a city permit?"
    a: |
      Straight door-in-kind replacement — same opening, no structural changes — is typically permit-exempt through City of Lacey Community Development. Interior door swaps don't require a permit. Structural work is a different story: widening a rough opening, replacing a header, or converting a slider opening to a French door set will need a building permit submitted to Lacey's permit center on College Street SE. Plan review for residential structural work in Lacey generally runs 3-6 weeks. TopVolk is a WA Licensed Contractor and handles the permit application, drawings, and submittals — you don't have to figure out what the city's plan reviewer needs from you.

  - q: "Can you convert a sliding glass door to French doors in a Lacey home?"
    a: |
      Yes — French door conversions are a regular part of the work we do in Hawks Prairie and Woodland Creek homes. The process involves verifying the load path above the opening, adjusting the rough framing to the correct width for the door unit, installing a sloped sill pan with properly lapped flashing tape, and setting the prehung French door assembly. Pella 250 series is the standard mid-range spec; Marvin Elevate wood-clad units are worth the step-up on rain-exposed elevations. Multi-point locking hardware is also worth adding on west-facing doors — sustained wind-driven rain from November through March puts real stress on single-point latch assemblies. Framing changes require a City of Lacey permit. Budget 2-3 days on site plus door lead time.

  - q: "How long does a new entry door last in Thurston County's wet climate?"
    a: |
      A properly installed fiberglass door — Therma-Tru Smooth-Star carries a limited lifetime warranty — will realistically last 30-40 years in Lacey's climate if the flashing and threshold seal are maintained. The limiting factor isn't the door slab: it's the installation details. A fiberglass door without a sill pan, set in failing caulk with no Pemko weatherstripping, will show moisture intrusion into the sheathing within a decade given 50-plus inches of annual rainfall. Solid wood doors on south or west exposures need refinishing every 3-5 years. Steel doors rust at the bottom rail if any coating damage goes untreated. Every exterior door TopVolk installs gets Protecto Wrap sill pan flashing and Pemko adjustable threshold — the details that keep the door performing and the warranty valid.

  - q: "Do you cover Tumwater, Olympia, and other nearby Thurston County areas?"
    a: |
      Lacey, Tumwater, and Olympia are all in the same scheduling window — if we're driving I-5 south to Lacey, adjacent Thurston County cities fit into the same trip without adding meaningful time. Yelm and Rainier are further out and depend on project scope and the week's schedule. For a larger door scope — multiple exterior doors, a French door conversion, or a full interior door package during a remodel — travel time is a non-factor at that project size. Call (206) 591-1096 or visit topvolkconstruction.com to check current availability and book your free estimate.