title: "Lacey General Contracting — South Sound Remodels, Permits Handled"

intro: |
  Roughly half the homes in Lacey's 98503 zip code were built between 1988 and 2004 —
  subdivisions graded fast and framed to the minimum when the region expanded with state
  government workers and JBLM-adjacent families rotating through. Those houses are 20 to
  35 years old now. Builder-grade everything: laminate floors buckling from Thurston County
  humidity, original double-pane Milgard windows that lost their argon seal a decade ago,
  master baths that haven't been touched since the first owner closed escrow. TopVolk
  Construction LLC has run whole-house remodels and room additions in the South Sound since
  2017 — 100+ projects completed across King, Pierce, and Thurston counties. Vladislav Volkov
  owns and operates the company, which means when you call (206) 591-1096 to schedule a
  walkthrough, you're talking to the contractor who will pull your City of Lacey Building
  Division permits and show up at your rough-in inspection. Hawks Prairie and the Woodland
  Creek neighborhoods are both areas we've worked in recently — 1990s tract homes, Thurston
  County jurisdiction, and the occasional structural surprise once you open a wall.

localContext: |
  Lacey's housing stock breaks into two clear eras. The older core — College Heights and the
  neighborhoods near Saint Martin's University in 98503 — holds late-1970s and 1980s split-
  levels with galvanized supply lines, undersized drain stacks, and original aluminum service
  panels that have to be replaced before an electrician can legally add circuits for a modern
  kitchen. The newer growth — Hawks Prairie, Horizon Pointe, and the subdivisions along
  Mullen Road in 98516 — is 2000s to 2010s construction: energy-code framing but builder-
  grade fixtures throughout, and homeowners are now ready to invest in finishes that actually
  match what they paid for the house. Work inside Lacey city limits goes through City of Lacey
  Building Division, not Thurston County Resource Stewardship — and the distinction matters,
  because each AHJ has its own plan review timeline and correction cycle. Complex remodels
  affecting structure, FAR, or setbacks run 4 to 8 weeks in plan review at Lacey Building.
  Parcels near the Olympia border sometimes fall under a different AHJ entirely — confirming
  jurisdiction before submitting a permit application is a step that saves weeks.

commonProblems:
  - title: "Hidden Load-Bearing Walls in 1980s–90s Split-Levels"
    description: |
      Split-level and two-story homes in Lacey's 98503 corridor were framed without
      structural drawings that transfer with the property. A wall that looks non-structural
      on a kitchen demo can turn out to be carrying a ridge load — meaning an LVL beam and
      PSL post installation, not a $200 drywall patch. On a recent College Heights project,
      demo exposed a doubled 2x10 header mid-span that wasn't on any as-built. A structural
      engineer was on site within four days, stamped plans were ready in a week, and a
      revised permit was submitted to City of Lacey Building Division before the demo debris
      was hauled. Structural surprises on 1980s–90s homes add $4,000–$12,000 to a remodel
      depending on span and load path. Getting that number on paper before framing starts —
      not after — is what keeps a $75K kitchen from becoming a $95K kitchen at the finish
      line.

  - title: "Multi-Trade Scheduling Breakdown on Self-Managed Renovations"
    description: |
      Homeowners in Hawks Prairie try to manage their own remodels sometimes — hire a plumber
      independently, find an electrician on Craigslist, call a framer. The schedule breaks down
      at the first hiccup. City of Lacey requires rough-in inspection before drywall hang. If
      the plumber finishes a week late, the drywaller moves to another job. Getting them back
      costs three weeks minimum and sometimes a crew change mid-project, which means new
      hands finishing someone else's tape and mud. A general contractor carries the permit,
      owns the MEP coordination timeline, and is contractually responsible for keeping trades
      on sequence. TopVolk builds a phased schedule into every contract — framing, rough-in
      electrical, rough-in plumbing, mechanical rough-in, inspection, insulation, drywall.
      Vladislav is reachable during every phase, not delegated to a project manager who
      has never touched a joist hanger. The deadline penalty is written into the contract —
      not a verbal promise.

  - title: "Plan Review Delays at City of Lacey Building Division"
    description: |
      City of Lacey Building Division handles all permits within city limits — separate from
      Thurston County Resource Stewardship, which covers unincorporated parcels east and south
      of the city boundary. A full kitchen remodel with structural changes requires a building
      permit plus separate MEP permits for mechanical and electrical rough-in. Plan review on
      complex projects runs 4 to 8 weeks. Anything affecting FAR, setbacks, or requiring
      structural engineering goes to a full review cycle and can take longer if the first
      submission has errors. TopVolk submits complete permit packages — site plan, floor plan,
      framing details, and stamped structural drawings when required — which cuts correction
      cycles down. As a WA Licensed Contractor, Vladislav Volkov pulls all permits directly
      and is the responsible party on every inspection: rough-in framing, MEP rough-in,
      insulation, and final. Homeowners attempting to pull GC-scope permits themselves routinely
      hit correction notices on the first submission; we handle those without billing extra.

  - title: "Budget Overruns from Deferred Maintenance in 1990s Builder-Grade Homes"
    description: |
      Volume-built homes in Lacey's 98503 and 98516 zip codes were built to code minimums —
      functional at the time, not built to last 30 years without intervention. Open a kitchen
      wall on a 1994 rancher and you'll routinely find galvanized supply lines with mineral
      restriction, drain stacks undersized for current IRC requirements, and vapor barriers
      installed backward or skipped entirely. Replacing galvanized with PEX-A runs $3,500–
      $8,000 on a kitchen project depending on how far the lines chase back to the manifold.
      Swapping an original Federal Pacific 100-amp panel before the electrician can add
      circuits costs $2,500–$4,500. TopVolk gives line-item quotes after an on-site
      walkthrough — not a ballpark range pulled from national data. If demo reveals scope
      changes, you get a written change order with cost and timeline impact before any
      additional work starts. No invoice surprises at the blue tape walkthrough.

  - title: "Crawlspace Moisture and Subfloor Rot Under Older Lacey Split-Levels"
    description: |
      Thurston County gets close to 50 inches of rain annually, with ground saturation running
      October through April. Crawlspaces under 1970s and 1980s split-levels near College
      Heights and the Lacey Square area are routinely wet — inadequate vapor barriers,
      standing water after heavy rains, and soft rot working through rim joists and sister
      joists over decades. A kitchen or living room remodel that ignores the crawlspace puts
      finished flooring at risk within five years. Before any major floor-level renovation,
      the crawlspace gets scoped: vapor barrier condition, subfloor probe for soft spots, rim
      joist integrity check. Installing a sealed 10-mil poly vapor barrier with proper perimeter
      drainage runs $2,000–$5,000 depending on square footage and access. For lower levels
      being converted from unfinished rec room to finished space — common in the older 98503
      split-levels — DriCore subfloor panels over an existing slab provide thermal break and
      moisture management that standard OSB subfloor can't. Addressing moisture before finish
      work is what separates a renovation that holds from one that fails.

faq:
  - q: "How far is Lacey from your Seattle base, and how does that affect project scheduling?"
    a: |
      Lacey is about 65 to 70 miles south of Seattle via I-5 — roughly an hour to an hour
      and 15 minutes depending on Tacoma Narrows traffic. For full project work, that distance
      doesn't change site coverage: Vladislav is on site during critical phases, and we use
      South Sound subcontractors to keep trade coordination local. The initial consultation is
      a free on-site walkthrough — call (206) 591-1096 and we can usually schedule within a
      week. For projects in the $50K–$200K range, travel is built into project planning, not
      billed as a line item. First step is always the walkthrough, where you'll get a read on
      what the project actually involves before any numbers are on paper.

  - q: "What does a whole-house renovation in Lacey typically cost?"
    a: |
      A full gut renovation on a 1,800–2,200 square foot 1990s home in Lacey — new kitchen,
      two baths, updated flooring, electrical and plumbing upgrades — typically runs
      $120,000–$185,000 depending on finish level and what demo uncovers structurally. A
      single kitchen remodel with mid-range finishes (Bosch or KitchenAid appliances,
      semi-custom cabinets, quartz counters) runs $45,000–$75,000. A master bath remodel or
      addition runs $25,000–$45,000. Those are real numbers from South Sound projects —
      not national averages adjusted for zip code. Call (206) 591-1096 to schedule an
      on-site walkthrough. You'll get a line-item quote based on your actual house and
      actual scope, not a vague range that balloons after demo.

  - q: "How do permits work for a major remodel in Lacey — is it City or County?"
    a: |
      Work inside Lacey city limits goes through City of Lacey Building Division — not
      Thurston County Resource Stewardship, which handles unincorporated parcels outside
      city boundaries. A structural remodel or addition requires a building permit plus
      separate MEP permits for mechanical, electrical, and plumbing rough-in. Plan review
      for complex projects runs 4 to 8 weeks. TopVolk pulls all permits directly as the
      WA Licensed Contractor on record — we prepare the full application package including
      site plans, floor plans, and structural drawings when required. All inspections are
      coordinated through us: rough-in framing, MEP rough-in, insulation, and final.
      Homeowners don't need to track the permit portal or respond to correction notices —
      that coordination is part of what a GC does on a project at this scale.

  - q: "Do you handle ADUs in Lacey under Washington's HB 1337?"
    a: |
      Washington HB 1337 (2024) allows up to two ADUs per single-family lot statewide —
      a DADU (Detached ADU) plus an AADU (Attached ADU) simultaneously, with parking
      exemptions near transit. City of Lacey has its own ADU ordinance that aligns with
      HB 1337 but enforces local setback, lot coverage, and height limit rules — typically
      a 24-foot height cap for detached units. Larger lots in Hawks Prairie and the Meridian
      Campus area in 98516 are well-suited for a DADU addition. A 600–900 square foot
      detached unit with a separate utility connection typically runs $150,000–$220,000
      end-to-end. Full timeline including City of Lacey plan review, permit, and construction
      is 5 to 7 months. Call (206) 591-1096 to discuss your specific lot — setbacks and
      lot coverage numbers vary enough that a site visit is the only way to give an honest
      feasibility read.

  - q: "What warranty do you provide on completed renovation work?"
    a: |
      Washington State mandates a 1-year workmanship warranty on construction under
      RCW 64.50. TopVolk extends that to a 2-year labor warranty on renovation work —
      covering defects in framing, waterproofing, tile installation, and finish carpentry
      that trace back to our work specifically. Materials carry their own manufacturer
      warranties: Schluter Kerdi waterproofing membrane is warranted for 10 years, and
      most tile and plumbing fixture manufacturers offer 1 to 5 years. Structural work
      involving engineered lumber — LVL beams, PSL posts, engineered joists — is covered
      by the manufacturer for structural performance over the life of the member. The blue
      tape walkthrough at project completion creates a written punchlist before final
      payment is released, so every open item is documented and resolved before the project
      closes. Nothing gets disputed after handoff.

  - q: "Do you work in Olympia, Tumwater, and other nearby Thurston County cities?"
    a: |
      Olympia and Tumwater share borders with Lacey and are part of the same project
      corridor for TopVolk. Each city runs its own permit office — Olympia Building
      Division, Tumwater Building and Safety, and unincorporated Thurston County parcels
      through Thurston County Resource Stewardship. Yelm and Rainier fall under Thurston
      County jurisdiction as well. Plan review timelines and correction processes vary
      between these AHJs, which matters when you're scheduling trades around an inspection
      sequence. For projects anywhere in the Lacey–Olympia–Tumwater area, call (206) 591-1096
      — we'll confirm jurisdiction for your address, pull any permit history if available,
      and give you an honest read on timeline and scope before you commit to a start date.
      100+ projects completed since 2017 across the Seattle metro and South Sound.