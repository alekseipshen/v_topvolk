title: "Lacey ADU Construction — Two Units on One Lot, Done Right"

intro: |
  Hawks Prairie has added more housing permits over the last five years than most
  Thurston County cities combined — and a large share of those lots in 98516 already
  qualify for a second or even third unit under WA HB 1337 (2024). That statewide law
  lets most single-family homeowners add up to two ADUs on one lot: a freestanding DADU
  in the backyard, an attached unit above the garage, a basement conversion. With JBLM
  roughly 25 miles north on I-5 rotating military families through Lacey on orders, and
  St. Martin's University right here in 98503 generating steady rental demand, the case
  for building an ADU is stronger here than people realize. TopVolk Construction LLC has
  completed ADU projects across King, Snohomish, Pierce, and Thurston counties since 2023.
  Owner Vladislav Volkov handles the consultation directly — not a coordinator, not a
  closer. Call (206) 591-1096 to talk through your specific lot.

localContext: |
  Most of the housing stock in Lacey's 98503 zip was built between 1985 and 2005 —
  mid-size ranchers and two-story colonials on lots ranging from 6,000 to 10,000 square
  feet. That's enough lot area for a freestanding DADU in most cases, provided FAR
  limits and rear setback requirements are met. The City of Lacey processes ADU permits
  through its own Community Development department, separate from Thurston County's
  permit system, which covers unincorporated parcels east of city limits. Over in the
  Woodland Creek and Briggs Village neighborhoods of 98516, newer developments sometimes
  carry HOA covenants that restrict exterior structures — checking the recorded CC&Rs
  before commissioning any design work saves weeks of rework. Lacey's lot coverage
  maximum typically caps at 40-50% depending on zoning designation, and the DADU height
  limit is 24 feet — both figures shape the structural design well before a permit
  application is submitted.

commonProblems:
  - title: "Deciding Between DADU, AADU, or Basement Conversion Before Spending on Design"
    description: |
      The choice between a detached ADU (DADU), an attached ADU (AADU), and a basement
      conversion isn't just preference — it's about what your lot and existing foundation
      actually allow. A standard 7,500 sq ft lot in 98503 with a 1,800 sq ft house may
      have 55-60% of allowable lot coverage already consumed by the house and existing
      impervious surfaces. A DADU adds footprint; a basement conversion doesn't. If the
      existing foundation is poured slab rather than crawlspace or full basement, that
      conversion option disappears entirely. Vladislav walks through lot coverage
      calculations, setback measurements, and utility routing during the free on-site
      consultation — before any design fee is paid. Knowing which ADU type fits your
      parcel prevents the expensive pivot of redesigning architectural drawings mid-permit
      review, which resets the clock at the City of Lacey.

  - title: "Utility Separation: Shared vs. Independent Water, Sewer, and Electric"
    description: |
      The City of Lacey requires a separate utility connection for most DADUs — a
      dedicated water meter, a separate sewer lateral tied into the main, and independent
      electrical service (typically a 200A panel fed from the street transformer). For an
      AADU, shared connections are sometimes permitted, but the existing service must be
      sized to support both units without a voltage drop problem. In older Lacey
      neighborhoods built in the late 1980s, the original ¾-inch copper water service
      line often isn't adequate for two full units — a service upgrade to 1-inch runs
      $3,000-$6,000 depending on distance from the meter pit to the structure. MEP
      coordination (mechanical, electrical, plumbing) has to be detailed in the permit
      drawings. The AHJ here is the City of Lacey Building Division — rough-in
      inspections happen before drywall, and a failed rough-in inspection means pulling
      it again, which adds 1-2 weeks minimum.

  - title: "Navigating the City of Lacey Permit Process Without Losing Six Weeks"
    description: |
      A complete ADU permit submittal to the City of Lacey requires a site plan drawn
      to scale with setbacks dimensioned, floor plans, elevation drawings, a foundation
      plan with structural details (including LVL beam spans if applicable), and a
      Washington State Energy Code compliance checklist for new construction. An
      incomplete submittal gets returned, resetting the 6-10 week plan review clock.
      Most homeowners underestimate what "complete" means at the permit counter.
      TopVolk prepares the full permit package in-house and pulls the permit as WA
      Licensed Contractor — Vladislav submits directly. For parcels in unincorporated
      Thurston County east of Lacey city limits, the Thurston County Permit Assistance
      Center handles permitting under a separate process with different submittal
      requirements. Knowing your parcel's jurisdiction before building anything is step
      one — and it's something that gets confirmed in the first site visit.

  - title: "What ADU Construction Actually Costs in Lacey — and What Moves That Number"
    description: |
      A straightforward 400 sq ft DADU on a flat Lacey lot — concrete slab foundation,
      standard 8-ft ceiling height, LVL ridge beam, Hardie cement-board siding, and a
      Mitsubishi mini-split for heating and cooling — typically lands between $130,000
      and $175,000 finished. A larger 800 sq ft two-story unit with a separate utility
      connection, engineered floor system, and kitchen outfitted with Bosch appliances
      and quartz countertops runs closer to $200,000-$280,000. Slope is a major cost
      driver: every foot of grade change on a Hawks Prairie lot typically requires either
      helical pier footings or a stem wall foundation, adding $8,000-$20,000 depending
      on soil conditions. Interior finish level — IKEA cabinets vs. semi-custom, LVL
      header spans vs. standard lumber, large-format porcelain tile vs. vinyl plank —
      moves the number meaningfully. TopVolk provides line-item quotes with actual
      numbers, not vague ranges.

  - title: "PNW Rain and Moisture Details That Determine Whether Your ADU Lasts 30 Years"
    description: |
      Lacey and the surrounding Thurston County lowlands receive roughly 50 inches of
      rain per year — more than Seattle's 37, because the Olympic rain shadow doesn't
      extend this far south. A DADU crawlspace without a proper vapor barrier will
      develop moisture issues within two seasons. That means a 6-mil poly vapor barrier
      on the ground, cross-ventilation or a mechanical crawlspace ventilation system,
      and pressure-treated (PT) lumber for any sill plates at the foundation. Hardie
      siding is standard for new ADU construction in this climate — fiber cement holds
      up against sustained wet winters without the rot vulnerability of wood siding.
      Composite decking like Trex or TimberTech outlasts PT lumber decking here
      significantly. R-49 insulation is required in the roof assembly under the
      Washington State Energy Code for new residential construction, and Lacey inspectors
      verify insulation depth before drywall sign-off. These aren't optional details —
      they show up on the final inspection checklist.

faq:
  - q: "How far does TopVolk travel for ADU projects in Lacey?"
    a: |
      Lacey sits about 65 miles south of Seattle on I-5 — roughly an hour from TopVolk's
