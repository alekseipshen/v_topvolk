      (206) 591-1096 to schedule it.

  - q: "What does ADU construction cost in Lacey, and what affects the price?"
    a: |
      A 400 sq ft DADU on a flat Lacey lot — slab foundation, Hardie siding, Mitsubishi
      mini-split, standard kitchen and bath — typically runs $130,000-$175,000 finished.
      An 800 sq ft two-story unit with separate utility connection and mid-range finishes
      (Bosch appliances, quartz countertop, LVL engineered floor system) is more commonly
      $200,000-$280,000. The main variables: lot slope, soil type, utility distance, and
      interior finish level. TopVolk provides a written line-item quote — you can see
      exactly where every dollar goes. Call (206) 591-1096 or schedule a free on-site
      estimate to get actual numbers for your specific lot.

  - q: "Does the City of Lacey require a permit for an ADU, and how long does review take?"
    a: |
      Yes, the City of Lacey issues ADU building permits through its Community Development
      department. A complete application — site plan, architectural drawings, structural
      calculations for any LVL beam spans or engineered elements, and a Washington State
      Energy Code compliance document — takes 6-10 weeks for plan review. Incomplete
      submittals get returned, which resets that timeline. TopVolk prepares the entire
      permit package and pulls the permit as WA Licensed Contractor, so homeowners don't
      have to figure out the submittal format. Parcels in unincorporated Thurston County
      east of Lacey city limits go through the Thurston County Permit Assistance Center
      instead — a different process with different forms.

  - q: "Can the ADU be rented out as soon as the final inspection passes?"
    a: |
      Yes — once the City of Lacey issues the final inspection approval and a Certificate
      of Occupancy, the unit is legally rentable with no additional waiting period. The
      final inspection covers framing, MEP systems, insulation verification (R-49 in the
      roof assembly), drywall, and all finish work. One detail that catches new ADU owners
      off guard: utility accounts for a separately metered unit — Puget Sound Energy for
      electric, City of Lacey utilities for water and sewer — need to be established
      before the inspector arrives, since active service may be verified. Vladislav runs
      a blue tape walkthrough with clients before scheduling the final inspection so the
      punch list is clear.

  - q: "What warranties apply to a TopVolk ADU build in Lacey?"
    a: |
      Manufacturer warranties on major materials transfer to the homeowner at project
      close: Hardie siding carries a 30-year limited warranty, Mitsubishi mini-split
      systems have a 12-year compressor warranty when registered, and Trex composite
      decking includes a 25-year fade and stain warranty. TopVolk's workmanship warranty
      covers installation defects for one year post-completion. Beyond that, Washington
      State's implied warranty for new residential construction applies to structural
      elements — foundation, framing, LVL beams — for longer periods under RCW 64.50.
      Missed construction milestones carry a written penalty in the contract. If
      something fails during the warranty period, you call (206) 591-1096 and reach
      Vladislav directly.

  - q: "Does TopVolk handle ADU projects in cities near Lacey?"
    a: |
      Yes — TopVolk Construction LLC covers the broader south Puget Sound area, including
      Olympia, Tumwater, Yelm, and unincorporated Thurston County parcels. Olympia ADU
      permits go through the City of Olympia's permit office; Tumwater has its own
      building department with different submittal checklists. Each jurisdiction's permit
      package gets prepared specifically for that AHJ — there's no one-size template that
      works across all of them. Vladislav manages every project directly, from permit
      submittal through final inspection. With 100+ projects completed since 2023 across
      Seattle Metro and south Puget Sound, the permit workflows in this region aren't
      new territory. Call (206) 591-1096 to talk through your location and lot.