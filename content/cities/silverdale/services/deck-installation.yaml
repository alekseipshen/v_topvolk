title: "Silverdale Deck Installation — Built for Kitsap Weather"

intro: |
  Salt air off Dyes Inlet and 40+ inches of annual rainfall make Kitsap County one of the harder
  environments for wood decking in Western Washington. The hillside neighborhoods above Old Town
  Silverdale and the waterfront lots near Silverdale Waterfront Park both see sustained north-facing
  shade from October through May — conditions that turn untreated cedar into a moss platform inside
  three years. TopVolk Construction, WA Licensed Contractor with 100+ projects completed since 2017,
  has built decks throughout 98383 and can spec the right material and connection detail before
  you break ground.

localContext: |
  Most of the housing in 98383 dates from 1985 to 2000 — two-story colonials and ranchers built
  during Kitsap County's Navy-driven growth years, often with sliding glass doors opening onto a
  concrete pad or an aging pressure-treated deck that never had a proper ledger flashing detail.
  The sloped terrain near Clear Creek and the Ridgetop Drive NW corridor creates drainage problems
  that flat-lot construction further east in Kent or Auburn doesn't produce. Pier foundations are
  also common here, and the crawlspace moisture environment affects how we treat ground-contact
  PT lumber at post bases.

commonProblems:
  - title: "Ledger Rot Behind the Band Board — Silverdale's Most Common Deck Failure"
    description: |
      Late-80s and 90s construction in 98383 rarely included metal Z-flashing at the ledger-to-rim
      joist connection. After 25 years of Kitsap rainfall, that band board is usually punky or fully
      rotted. We open the wall, install Trex-compatible aluminum Z-flashing per IRC Section R507,
      sister in new blocking where the rim joist is compromised, and rebuild the ledger before any
      decking goes down. Kitsap County's building inspectors require a ledger flashing inspection —
      skipping it fails the permit.

  - title: "Post Footings Above Frost Line — Common on DIY and Budget Decks"
    description: |
      Kitsap County's frost depth runs 12 to 18 inches. Older decks throughout Silverdale regularly
      have 4-inch poured pads sitting on disturbed fill — enough to heave after a hard freeze cycle
      in the Newberry Hill area. We dig proper tube footings, pour to the required depth per Kitsap
      County building standards, and set 6x6 PT posts in galvanized post bases rather than direct
      burial into soil. Ground-contact rated lumber is specified for everything below the framing.

  - title: "Cedar vs. Composite on North-Facing Hillside Lots"
    description: |
      The shaded slopes off Ridgetop Drive NW stay damp from October through March. Cedar checks
      and splits on those exposures by year five, and moss colonizes the surface within two seasons.
      TimberTech Vintage Collection and Trex Transcend are the two composites we spec most on
      Silverdale hillside builds — both carry 25-year fade and stain warranties and don't require
      annual sealing. On second-story decks over living space, we add a TimberTech DrySpace drainage
      system below the joists to route water away from the structure.

faq:
  - q: "How fast can you get to Silverdale for Deck Installation?"
    a: |
      Silverdale is roughly 45 minutes from the Eastside via the Bainbridge Island ferry or about
      an hour via SR-16 through Tacoma. We schedule on-site consultations within a week — Vladislav
      comes to the site, not a salesperson. Call (206) 591-1096 to set a time.

  - q: "Which composite decking brands do you install in Silverdale?"
    a: |
      We install Trex, TimberTech, and Fiberon most often — all three have board lines rated for
      high-moisture coastal climates. Trex Transcend and TimberTech Legacy hold color well on
      shaded Kitsap lots. We bring physical samples to every consultation so you can see thickness
      and finish before committing to a material.

  - q: "Do I need a permit for a deck in Kitsap County, and how long does the process take?"
    a: |
      Yes. Kitsap County requires a building permit for any deck over 200 square feet or sitting
      more than 30 inches above grade — submitted through Kitsap County's Permits Plus portal.
      Plan review for a standard residential deck typically runs 4-8 weeks. We handle the submittal,
      attend the rough-in inspection for ledger flashing, and close out the final sign-off.
      End-to-end on a 400-square-foot deck: roughly 10-14 weeks including permit time.
      Deadline penalties are written into our contract — if we miss the agreed completion date,
      you get paid. Call (206) 591-1096 or schedule a free on-site consultation.