  - q: "Does power washing in Silverdale require a Kitsap County permit?"
    a: |
      Straight surface cleaning — driveways, siding, decks, fences, patios — doesn't require a permit from Kitsap County Department of Community Development (DCD). Power washing becomes permit-adjacent when it's prep work for a structural project: deck replacement, siding replacement, or an exterior addition where a DCD building permit is already active. Silverdale is unincorporated Kitsap County, so there's no separate city permit office — everything runs through the county DCD office in Port Orchard. If a wash job connects to a larger remodel, TopVolk coordinates the DCD application and inspection scheduling. WA Licensed Contractor on file.

  - q: "What PSI do you use on cedar decks versus concrete in Silverdale?"
    a: |
      Cedar decking requires a light touch — 1,200 to 1,500 PSI maximum with a 25-degree nozzle, and always a soft wash pre-treatment using sodium hypochlorite via downstream injection to kill moss and algae before the pressure rinse. Going above 1,500 PSI on cedar raises the wood grain and creates surface fuzzing that absorbs stain unevenly — you'll see blotchy results even with a quality product like TWP. Concrete driveways and flatwork handle 3,000–3,500 PSI run through a surface cleaner attachment; the rotating bar keeps pressure even across the slab and prevents the stripe marks a direct wand leaves. Hardie fiber cement siding stays under 1,500 PSI with a 40-degree nozzle and soft-wash technique only — wrong PSI on Hardie can fracture the panel face.

  - q: "How long do power washing results last in Silverdale's climate?"
    a: |
      On a cedar deck that's sealed after washing, moss and algae typically stay off for 2–3 years before the next cleaning cycle is needed — Silverdale's wet season runs October through May with roughly 50 inches of annual rainfall, so biological regrowth is a when, not an if. Concrete driveways stay cleaner for 3–4 years if a penetrating sealer is applied post-wash. Hardie siding that's freshly painted after a wash can go 8–10 years before the next full paint-and-clean cycle. Cedar fences without a stain reapplication gray and start growing moss again within 18–24 months. TopVolk guarantees the quality of the wash work itself — missed spots get corrected at no charge — but biological regrowth timelines are controlled by weather and canopy cover, not the cleaning method.

