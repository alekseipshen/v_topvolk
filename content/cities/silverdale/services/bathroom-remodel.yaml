title: "Silverdale Bathroom Remodel — Kitsap County, Permits Pulled"

intro: |
  The 1980s construction wave that filled subdivisions around Bucklin Hill Road left most Silverdale (98383) homes with builder-grade bathrooms: 4×4 ceramic tile, single-piece fiberglass surrounds, and vanities dated before the decade ended. Kitsap County averages 40 inches of rain a year. That moisture finds every gap in a 35-year-old caulk joint. A Kohler or Toto fixture upgrade matters — but only after the Schluter Kerdi membrane behind the tile is installed correctly. Homeowners near Ridgetop Boulevard and Bucklin Hill Road are increasingly specifying Grohe thermostatic shower systems, large-format porcelain, and curbless walk-in showers — upgrades that require full demo, proper waterproofing, and a Kitsap County DCD permit, not a weekend tile patch.

localContext: |
  Most of the residential stock in 98383 is tract construction from 1982 to 1997 — the era when Silverdale's population nearly doubled alongside Naval Base Kitsap's expansion. Homes near Clear Creek Trail, Ridgetop Boulevard, and the Silverdale Beach area were built fast to meet demand: original ABS drain stacks, galvanized supply lines in older sections, bathrooms sized to builder minimums. Some of the newer construction along Newberry Hill Road runs into setback and FAR constraints that affect addition-style bathroom expansions. Kitsap County Department of Community Development handles permits here — not Seattle SDCI or King County DPER — with plan review typically running 2–4 weeks for standard bathroom scope.

commonProblems:
  - title: "Fiberglass Tub Surrounds Failing After Three Decades of PNW Humidity"
    description: |
      Single-piece fiberglass surrounds in 1980s Silverdale tract homes weren't built for 30 years of Kitsap County moisture. Caulk joints open, water migrates behind the unit, subfloor and framing rot before any surface damage is visible. Demo to the studs, RedGard or Schluter Kerdi waterproofing membrane on cement board substrate, then large-format porcelain tile — that's the actual fix, not re-caulking. Clients upgrading to a Grohe or Hansgrohe thermostatic valve need the rough-in framing confirmed before ordering fixtures — the valve body sets your tile layout, not the other way around.
  - title: "Drain Line Rerouting Required for Walk-In Shower Conversions"
    description: |
      Converting a tub/shower combo to a curbless walk-in shower means relocating the drain. Most 1980s Silverdale homes ran 2-inch ABS drain lines — current IRC code requires 3-inch for shower stalls, and the P-trap branch needs rerouting through floor framing. Kitsap County DCD issues a plumbing permit for this scope; Vladislav pulls it as part of the project estimate. DriCore subfloor panels are worth considering during this phase if there's any history of crawlspace moisture — Kitsap's winter water table is not forgiving. Call (206) 591-1096 to walk through the drain reroute scope before committing to a layout.
  - title: "Exhaust Fans Venting Into Attic Cavities — Mold Growing Behind Walls"
    description: |
      Original 50 CFM exhaust fans in 1990s Silverdale builds often terminate inside the attic, not the exterior. From October through May, that trapped humidity feeds mold inside the wall assembly — invisible until demo day. Replacing with 110+ CFM units ducted properly through the roof or soffit, plus vapor barrier upgrades in the floor framing, stops the cycle at the source. This is a rough-in inspection item in Kitsap County DCD — the inspector checks duct termination before drywall goes up.

faq:
  - q: "How fast can you get to Silverdale for a Bathroom Remodel consultation?"
    a: |
      Kitsap County is a regular part of the service area. From Seattle, that's 50–65 minutes via the Bainbridge Island ferry or the Tacoma Narrows Bridge depending on Silverdale traffic on Bucklin Hill Road. Call (206) 591-1096 to schedule a free on-site consultation with Vladislav directly — WA Licensed Contractor, 100+ projects completed since 2023. You're talking to the person who will build the project, not a commissioned closer.
  - q: "What fixture brands do you work with on Silverdale bathroom remodels?"
    a: |
      Kohler and Moen are the most common brands in Silverdale's 1980s–90s tract homes. Clients in 98383 upgrading primary baths regularly move to Grohe or Hansgrohe thermostatic shower systems, Toto toilets (the Drake II or Nexus for wall-hung), and Robern medicine cabinets. Brizo (Delta's premium line) is another option that fits the Ridgetop Boulevard and Newberry Hill price point. Vladislav specs fixtures before the quote — rough-in inspection fails when a Grohe valve rough-in doesn't match the trim plate on file. No surprises at permit stage.
  - q: "How long does a full bathroom remodel take in Kitsap County, permits included?"
    a: |
      Plan review at Kitsap County DCD for standard bathroom scope runs 2–4 weeks. Total project timeline after permit approval: 3–5 weeks for a secondary bath, 6–10 weeks for a master bath reconfiguration with layout changes and drain rerouting. A curbless walk-in shower conversion with new drain line, Schluter Kerdi waterproofing, and large-format porcelain lands toward the longer end of that range — the tile work alone is 5–7 days after the rough-in inspection clears. Vladislav pulls all permits directly; deadline penalties are written into the contract. Call (206) 591-1096 for a project-specific estimate.
  - q: "Do older Silverdale homes need electrical upgrades before a bathroom remodel?"
    a: |
      Homes built before 1993 in the 98383 zip code often lack GFCI protection on bathroom circuits — that's a code correction Kitsap County DCD flags at rough-in inspection regardless of whether you requested electrical work. Some 1982–1990 builds in the Clear Creek and Ridgetop subdivisions still have 15-amp bathroom circuits, which won't support a 20-amp dedicated outlet requirement under current IRC. Vladislav includes an electrical assessment in the on-site walkthrough — it's easier to address at rough-in than after tile is set.