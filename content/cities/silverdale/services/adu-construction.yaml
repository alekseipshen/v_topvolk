  - q: "Does Silverdale require a building permit for an ADU, and how does the process work?"
    a: |
      Yes — Silverdale is unincorporated Kitsap County, so ADU building permits run through Kitsap County DCD (Department of Community Development), not a city permit office. A complete DADU submittal requires a site plan, floor plans, exterior elevations, energy code worksheet, and utility plan. Plan review currently takes 6–10 weeks from a complete application. Some Silverdale subdivisions carry CC&Rs that restrict ADUs regardless of county zoning — those need to be verified before applying. TopVolk files the permit as WA Licensed Contractor of record and manages all DCD correspondence from submittal through permit issuance and inspections.

  - q: "Can my Silverdale lot legally fit a detached ADU under current Kitsap County rules?"
    a: |
      Most standard lots in zip 98383 can accommodate a DADU under Kitsap County's current setback requirements — typically 5 feet from rear and side property lines — and the 24-foot height maximum. WA HB 1337 (2024) removed statewide parking minimums near transit corridors and eliminated most local ADU bans, so the main constraints now are physical lot size and existing lot coverage. Sloped parcels on Ridgetop or the Newberry Hill area need an engineered foundation detail but are buildable. A site visit confirms what fits — bring your property survey if you have one, or TopVolk can pull the parcel data from the Kitsap County assessor.

  - q: "What warranty comes with an ADU TopVolk builds in Silverdale?"
