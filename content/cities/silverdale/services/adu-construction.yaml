title: "Silverdale ADU Construction — DADU Builds & Kitsap County Permits"

answer: "TopVolk Construction builds DADUs, attached ADUs, and basement conversions in Silverdale, WA — WA Licensed Contractor, 100+ projects completed since 2017."

intro: |
  Picking the wrong ADU type for your Silverdale lot wastes months — a DADU that won't fit the setbacks, a basement conversion with only 6'8" of headroom, or an attached ADU that requires a full structural teardown of the existing wall line. TopVolk Construction builds all three ADU types in Silverdale under Kitsap County DCD permits, with Vladislav Volkov running every project from permit drawings through final inspection. Under WA HB 1337 (2024), most single-family lots in zip 98383 now qualify for up to two ADUs — detached, attached, or both — which opens up real options on the larger parcels along Newberry Hill Road and out near the Ridgetop neighborhood. Military rental demand from Naval Base Kitsap Bangor keeps Silverdale's vacancy rates low enough that a finished 576 sq ft DADU can realistically generate $1,700–$2,100/month. One recent Silverdale project added a detached ADU with a Mitsubishi mini-split for heat and cooling, a Navien tankless water heater, and a separate utility connection pulled from the street — it passed Kitsap County rough-in inspection and final inspection without a correction notice.

localContext: |
  Two distinct eras define Silverdale's housing stock and what each ADU project runs into structurally. Older properties in zip 98383 — particularly along Bucklin Hill Road and Central Silverdale — were built between 1965 and 1985. Those homes often have crawlspaces with failed vapor barriers and original galvanized plumbing that Kitsap County DCD flags during the utility review portion of an ADU application. Newer subdivisions in zip 98315 and the Newberry Hill corridor run 1990s to early 2000s construction with tighter floor plans but larger rear yards — exactly the layout where a detached DADU fits within Kitsap County's standard setback requirements (typically 5-foot rear and side). Kitsap County doesn't apply FAR restrictions the way Seattle SDCI does, but lot coverage limits and the 24-foot DADU height maximum still govern what's buildable on any given parcel. Rainfall in Silverdale exceeds 37 inches annually, which means DADU foundation details matter: pressure-treated (PT) lumber at the mudsill, a continuous vapor barrier in the crawlspace, and Hardie cement-board siding on exterior walls hold up through PNW winters far better than wood alternatives on north-facing exposures.

commonProblems:
  - title: "Choosing the Right ADU Type When Your Silverdale Lot Has Constraints"
    description: |
      The right ADU form depends on your actual parcel, not a preference. A detached ADU (DADU) offers the cleanest rental separation but demands enough rear yard to clear Kitsap County's 5-foot setback on three sides while staying under the 24-foot height limit — on a standard 7,500 sq ft Silverdale lot, that typically leaves a 400–600 sq ft buildable footprint. Attached ADUs (AADUs) work on narrower lots since you're extending the existing structure, but MEP coordination with the main house gets more involved. Basement conversions are the fastest path to a rentable unit if there's already 7-foot ceiling clearance and a code-compliant egress window location. Each type follows a different permit pathway through Kitsap County DCD and carries a different construction budget — DADUs run $180,000–$280,000, basement conversions $60,000–$110,000. Vladislav walks through all three options on the free site visit before any number goes on paper.

  - title: "Utility Separation Requirements for a Kitsap County ADU"
    description: |
      Kitsap County DCD requires ADU permit applications to address water and sewer service at submittal — either a separate meter pulled from the street or a documented shared-connection arrangement with the main house. Separate utility connections run $10,000–$18,000 depending on trench length and whether the existing water service has sufficient pressure for a second connection. Shared connections cost less upfront but limit future flexibility, particularly if a homeowner wants independent billing for a military tenant near Naval Base Kitsap. The rough-in inspection is where Kitsap County inspectors look hardest at MEP work — undersized drain lines, missing cleanouts on branch runs, and improper venting are the most common correction items. Getting the utility plan correctly drafted before plan review submission avoids a 3–5 week round-trip on a plan correction that could have been caught at the drawing stage.

  - title: "Getting Through Kitsap County DCD Plan Review Without a Correction Loop"
    description: |
      Silverdale falls inside unincorporated Kitsap County, so ADU permits run through Kitsap County's Department of Community Development — a different process than Seattle SDCI's online portal or Bellevue's permit center. A complete DADU application requires a dimensioned site plan, floor plan with room labels, exterior elevations showing compliance with the 24-foot height limit, a Washington State Energy Code compliance worksheet, and a utility plan. Missing any one of those items generates a correction notice and restarts the review clock. Plan review for a new DADU currently runs 6–10 weeks from a complete submittal. TopVolk prepares and files the permit drawings as WA Licensed Contractor of record — DCD corrections come directly to Vladislav, not through a homeowner trying to decode engineer comments. End-to-end timeline from contract signing to final inspection typically runs 5–7 months.

  - title: "What ADU Construction Actually Costs in Silverdale and What Moves the Number"
    description: |
      A finished DADU in Silverdale runs $180,000–$280,000 depending on size, site, and finish level. The cost drivers are real and specific: utility separation adds $10,000–$18,000, a sloped lot on Ridgetop or Newberry Hill requires an engineered foundation and retaining detail, and appliance selections — a Bosch dishwasher, LG range, and Pella casement windows — add $8,000–$15,000 over builder-grade. Attached ADUs and basement conversions come in lower, typically $90,000–$160,000, depending on how much structural work the existing framing requires. At $1,700–$2,100/month in Silverdale rental income, a $230,000 DADU hits payback in roughly 9–11 years before any appreciation. TopVolk provides a line-item quote after the site visit — actual numbers for your specific lot, not a starting-at range. Call (206) 591-1096 to schedule the free consultation.

  - title: "Building a Silverdale ADU That Holds Up Through Kitsap's Wet Seasons"
    description: |
      Silverdale logs 37+ inches of annual rainfall, mostly October through May, and a DADU built without proper water management will show deterioration within two or three wet seasons. Moss accumulates fast on north-facing siding if the surface isn't Hardie cement-board or a composite product — raw cedar weathers unevenly and holds moisture. Any DADU with an attached deck needs a proper ledger board connection with flashing, not just caulk, or water finds the rim joist within a season. For DADU bathroom wet areas, Schluter Kerdi membrane behind large-format porcelain tile eliminates the failure point that standard sheet membrane misses at corners and pipe penetrations. A Mitsubishi mini-split handles heat and cooling in a small ADU footprint without the duct runs that a forced-air system would require in a new structure. The blue tape walkthrough before final inspection catches finish-level issues before the unit goes to a tenant.

