  - q: "Do I need a permit to repaint my house in Silverdale, and what about HOA approval?"
    a: "Standard exterior and interior repaints in unincorporated Silverdale don't require a permit through Kitsap County Department of Community Development — painting is considered maintenance, not construction. What does apply on pre-1978 homes is EPA RRP documentation when a paid contractor disturbs lead-based paint; that's a federal requirement handled at the job level, not a county permit. HOAs in some Silverdale subdivisions — particularly in the Newberry Hill and Ridgetop areas — require written color approval before exterior repaints, a process that typically takes a few days to two weeks. TopVolk handles the submission paperwork as part of project prep so there are no delays once the paint schedule starts."

  - q: "How do I know if my Silverdale home has lead paint, and what does the testing process involve?"
    a: "Homes built before 1978 have meaningful lead paint risk, particularly on window sashes, exterior trim, doors, and porch surfaces. Testing uses 3M LeadCheck swabs directly on painted surfaces — results in about 30 seconds. A positive result means any scraping, sanding, or paint disturbance by a paid contractor requires EPA RRP containment: plastic sheeting over work areas, HEPA vacuum for dust, and proper waste disposal with documentation kept in the job file. The testing and setup typically adds $300–$600 to a project and a half-day of extra labor. It's included in the pre-job walkthrough for any Silverdale home built before 1978 — not an optional add-on."

  - q: "How long does exterior paint last in Silverdale's climate, and what warranty applies?"
    a: "A properly prepped and painted exterior in Silverdale should hold 7–10 years on Hardie cement-board siding and 5–8 years on cedar shake. North-facing walls and surfaces near Dyes Inlet reach that threshold faster due to persistent moisture exposure through the October–May rainy season. Quality products like Sherwin-Williams Duration and Benjamin Moore Aura Exterior carry manufacturer warranties of 15–25 years on paint film integrity — but real-world longevity depends entirely on prep quality and application. TopVolk's exterior work comes with a workmanship warranty, and project completion deadlines are written into the contract with penalty clauses for missed dates — that's a concrete commitment, not a verbal promise."

