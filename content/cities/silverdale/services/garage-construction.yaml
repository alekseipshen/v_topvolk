  - q: "What does garage construction in Silverdale cost?"
    a: |
      A detached two-car garage shell in Silverdale — concrete slab, framing, roofing, garage door rough opening, and exterior siding to match the house — runs $40,000–$65,000. Add insulation, drywall, electrical panel, lighting, and EV charger pre-wire and the finished number lands at $62,000–$82,000. A DADU-above-garage build under WA HB 1337 with a fully finished 600 sq ft living unit runs $150,000–$190,000 depending on kitchen and bath finishes. Primary cost drivers: lot drainage conditions affecting slab prep depth, panel upgrade requirements, exterior siding complexity, and Kitsap County DCD plan review fees. Call (206) 591-1096 — we provide a written line-item quote, not a vague estimate range.

  - q: "What permits does garage construction require in Silverdale, Kitsap County?"
    a: |
      Silverdale is unincorporated Kitsap County, so all permits go through Kitsap County Department of Community Development (DCD) via the Energov online portal. A standard detached garage requires a building permit with a site plan, foundation plan, and framing plan — plan review typically takes 4–8 weeks. A DADU-above-garage project under WA HB 1337 requires engineered structural drawings and runs 6–10 weeks for plan review. Electrical and mechanical work require separate trade permits pulled during construction, with a rough-in inspection and final inspection required for each. TopVolk Construction LLC (WA Licensed Contractor) handles all permit applications and coordinates every inspection milestone — you don't manage the Kitsap County DCD process yourself.

  - q: "Do I need a vapor barrier and drainage under the garage slab in Silverdale?"
    a: |
      Yes on both counts. Kitsap County building code, following IRC requirements, mandates a vapor barrier under any conditioned slab, and it's sound practice even for an unheated garage given Silverdale's rainfall levels. We install a 10-mil poly vapor barrier over compacted gravel before every pour. For drainage, a trench drain at the apron prevents the heavy October–May rain from sheeting back into the garage interior — it has to be set before the pour, not cut in afterward. If you're planning an epoxy floor coating or DriCore subfloor panels for a finished workshop, the vapor barrier is especially critical: ground moisture migration will delaminate both products within 2–3 years without it.

  - q: "What warranty does TopVolk provide on garage construction in Silverdale?"
    a: |
