title: "Silverdale Plumbing — Pipe Replacement & Remodel Work in 98383"

answer: "TopVolk Construction does plumbing remodels and pipe replacement in Silverdale, WA — WA Licensed Contractor, owner-led, 100+ projects since 2023."

intro: |
  Polybutylene supply lines — the gray plastic pipe installed in thousands of Kitsap County homes between 1978 and 1995 — don't give much warning before they fail. Silverdale's 98383 zip has a dense concentration of those homes, especially in the Clear Creek and Ridgetop neighborhoods where 1980s-era tract construction is the dominant housing type. TopVolk Construction, a WA Licensed Contractor owner-operated by Vladislav Volkov, handles full PEX-A repiping, Navien or Rinnai tankless water heater conversions, fixture upgrades with Moen and Kohler hardware, and drain line rerouting for kitchen islands and basement bathrooms throughout Silverdale and central Kitsap County. Permit-required work — water heaters, gas line upsizes, whole-house repiping — runs through Kitsap County DCD since Silverdale is unincorporated. Vladislav quotes every job with a line-item written estimate before work starts; call (206) 591-1096 to schedule a free on-site walkthrough with the actual contractor doing the work, not a salesperson.

localContext: |
  Silverdale's housing stock runs heavily 1970s through 1990s — two decades of construction that produced a lot of polybutylene and galvanized supply lines now at or past their service life. The 98383 zip code covers most of the residential neighborhoods west of Kitsap Mall, including Ridgetop and the homes stretching along Newberry Hill Road; the 98311 zip (Central Kitsap, just east of Silverdale proper) carries similar vintage housing with the same pipe problems and the same permit jurisdiction. Kitsap County DCD handles all building permits for unincorporated Silverdale — water heater replacements, gas line work, and any drain line modifications require a permit and rough-in inspection before walls close, not just a hardware swap. Pacific Northwest moisture matters here too: Silverdale averages over 50 inches of rain annually, and crawlspaces in older ranchers near Clear Creek Road tend to accumulate groundwater that accelerates corrosion on exposed supply lines and cast-iron drain sections. Homes served by Kitsap PUD in the lower-elevation blocks near Dyes Inlet sometimes see static water pressure above 80 psi, which hammers fixture valves and supply connections well ahead of their rated lifespan if a PRV isn't correctly set.

commonProblems:
  - title: "Polybutylene Pipe Failure in Silverdale's 1980s and 1990s Homes"
    description: "Quest pipe — the brand name most installers used for polybutylene in the Pacific Northwest — was roughed into a large percentage of Silverdale homes built between 1980 and 1995. The material degrades from the inside out when it contacts chlorinated municipal water, and the fittings fail at the crimp rings rather than along the pipe body itself. By the time a homeowner notices a wet spot in drywall or ceiling material, the damage usually extends through multiple wall cavities. Full replacement with cross-linked PEX-A using Uponor AquaPEX and expansion fittings — not crimp — eliminates the failure mode at the connection point. A typical Silverdale rancher repipe runs 3-5 days and requires a Kitsap County DCD permit plus rough-in inspection before walls close. Budget $9,000–$16,000 depending on square footage and fixture count."

  - title: "Tankless Water Heater Conversion Requiring Gas Line Upsize"
    description: "Switching from a 40-gallon tank unit to a Navien NPE-240A2 or Rinnai RU199iN in a Silverdale home almost always means upsizing the gas supply line. A standard half-inch gas run feeding a 40,000 BTU tank heater can't support a 199,000 BTU condensing tankless unit at full draw. The line from the meter to the unit location often needs to step up to three-quarter-inch or one-inch black iron or CSST flex line depending on the total BTU load in the house. Kitsap County DCD requires a mechanical permit for gas appliance replacements, and WA code mandates seismic strapping for any new water heating equipment — wall-mounted tankless units typically satisfy this through the bracket mounting. Condensing units also need a condensate neutralizer and a properly pitched drain. Total conversion cost including gas line work and permit: $4,500–$7,500."

  - title: "Pressure Regulator Failure on Kitsap PUD Supply in Lower Silverdale"
    description: "Supply pressure in parts of Silverdale — particularly the lower-elevation blocks near Dyes Inlet and neighborhoods below the Ridgetop plateau — can run 90–110 psi at the meter. That's well above the 80 psi residential maximum the IRC recommends. A failing or undersized PRV (pressure reducing valve) lets that pressure hammer through shower valves, dishwasher solenoids, ice maker lines, and the supply stub-outs behind toilets. Moen Posi-Temp cartridges and Kohler ceramic disc valves hold up better than contractor-grade alternatives, but even those wear out faster under chronic high pressure. PRV replacement is a straightforward job — Kitsap County DCD can often turn around a minor plumbing permit same-day or next-day online. New Watts or Wilkins PRV set to 60–65 psi, plus a thermal expansion tank on the water heater cold-side supply: figure $650–$1,300 total depending on access."

  - title: "Drain Line Rerouting for Kitchen Islands and Basement Bathrooms"
    description: "Adding a sink to a kitchen island, or finishing a basement bathroom in a Silverdale split-level, always circles back to the drain line. Island sinks need a running trap (also called an island loop vent) or an AAV (air admittance valve) where the jurisdiction allows — Kitsap County does permit AAVs in most residential applications. Basement bathrooms in 1980s homes typically require cutting the concrete floor to tie into the existing 4-inch ABS or cast-iron main. If the main is cast iron, that's a separate conversation about partial or full drain line replacement before the new stub-out goes in. Schedule-40 PVC is the standard for new residential drain work in this jurisdiction. A typical basement bathroom rough-in runs $3,500–$6,500 depending on how far the wet wall sits from the existing stack and whether the main needs modification at the tie-in. Permit required; rough-in inspection before the concrete pour."

  - title: "Fixture Upgrades and Rough-In Adjustments During Bathroom Remodels"
    description: "Older Silverdale bathrooms — particularly in 1970s ranchers and 1980s colonials throughout the 98383 zip — were roughed in for 3-piece fiberglass units with tub-fill valves centered at 4 inches off the floor. Moving to a curbless shower with a center drain, or a walk-in shower with a niche and bench, usually means relocating the drain and reworking the supply rough-in to match the new valve height. Schluter Kerdi membrane or RedGard liquid waterproofing over cement board is non-negotiable for tiled shower assemblies — neither is optional in the PNW's wet climate if you want to keep moisture out of the framing long-term. Delta's MultiChoice Universal valve body is worth specifying when a client hasn't finalized the trim kit, since the rough-in stays constant regardless of trim selection. Budget $1,800–$3,500 for rough-in adjustment, blocking, and waterproofing before tile work begins."

