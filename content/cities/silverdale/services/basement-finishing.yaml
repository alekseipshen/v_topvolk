  - q: "Does basement finishing in Silverdale require a permit from Kitsap County?"
    a: |
      Yes. Any basement finish involving framing, electrical, plumbing rough-in, egress window enlargement, or mechanical work requires a building permit through Kitsap County Department of Community Development. Silverdale is unincorporated Kitsap County — there is no separate city building department. Kitsap County DCD typically takes 3-6 weeks for plan review on a standard basement finish, depending on scope and current queue volume. Inspections are required at framing rough-in before drywall, electrical rough-in, and at final completion. TopVolk handles the full permit application, plan set preparation, and inspection coordination as part of every project — you do not navigate DCD alone. Washington State requires WA Licensed Contractor status to pull residential permits above $1,000, and TopVolk operates under that license.

  - q: "Do I need a sump pump if my Silverdale basement has never flooded?"
    a: |
      Active flooding is not the only moisture problem worth planning for. Silverdale's clay-heavy, glacially deposited soils hold hydrostatic pressure against foundation walls year-round — the result often shows up as efflorescence (white mineral deposits) on concrete surfaces, damp spots after heavy November rain events, or a persistent musty smell through fall and winter. Installing an interior perimeter drain tile system with a sump crock and a submersible pump — Zoeller and Wayne both make reliable residential units — provides a pressure-relief pathway before moisture migrates into finished materials. If DriCore subfloor, drywall, and insulation are going in, the drainage system needs to be in place first. Remediation and rebuild after a wet-season moisture event costs several times what the prevention does.

  - q: "What warranty does TopVolk offer on basement finishing work in Silverdale?"
    a: |
      Workmanship carries a one-year warranty on all finish work — drywall, flooring, trim, paint, and finish carpentry. Structural elements including LVL headers over egress windows, blocking, and framing are covered for the life of the structure. Waterproofing system components carry the manufacturer's warranty on materials, typically 5-10 years depending on the product specified. What is not covered: damage from exterior grading changes that redirect surface water toward the foundation, foundation movement outside normal settlement, or maintenance failures like a sump pump float switch that was never tested. Silverdale's wet climate makes annual sump pump testing non-negotiable — check the float, test any battery backup, and clear the discharge line before October every year. The contract also includes a deadline penalty provision: if the agreed completion date is missed, that cost falls on TopVolk, not on you.

