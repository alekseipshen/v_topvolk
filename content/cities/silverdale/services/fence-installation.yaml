  - q: "Do I need a permit to install a fence in Silverdale?"
    a: |
      Silverdale is unincorporated Kitsap County. Permits go through Kitsap County DCD — not a city permit office. Most residential fences under 7 feet on a single-family lot don't require a building permit here.

      The exception: any fence incorporating or sitting atop a retaining wall over 4 feet triggers a structural review submittal. If your neighborhood has an HOA, written HOA approval must come before the county permit application is submitted — that adds 2-4 weeks to the front end of the project.

      TopVolk handles the site plan, HOA packet, and DCD permit application as part of the project scope. The permit is submitted under our WA Licensed Contractor credentials. Homeowners don't need a separate contractor registration to pull the permit.

  - q: "How deep should fence posts be set in Silverdale's soil?"
    a: |
      In Kitsap County's clay-heavy soil, set posts a minimum of 36 inches deep. That's significantly deeper than the 24-inch minimum common in drier inland climates. Clay retains moisture and shifts seasonally. Shallow-set posts lose plumb within two to three years under Silverdale's wet conditions.

      Standard process is a 10-inch diameter hole, 6 inches of crushed gravel at the bottom for drainage, then the UC4B-rated PT lumber post set and backfilled with concrete to 2 inches below grade. Fast-set Quikrete works well for standard residential jobs. Above-grade Simpson Strong-Tie post base brackets are an alternative for deck-adjacent fencing where soil contact is unavoidable but post rot is a primary concern.

  - q: "How long will a cedar fence last in Kitsap County's climate?"
    a: |
      A properly installed cedar fence with UC4B PT lumber posts lasts 15-20 years in Silverdale's climate. Western Red Cedar has natural oils that resist moisture and rot. The panels still need a penetrating stain or oil-based sealer applied every 4-6 years to prevent graying, checking, and moisture absorption.

      Untreated cedar weathers to silver-gray within 2-3 seasons. Some homeowners like the look. Without a sealant, though, the wood becomes progressively brittle and prone to splitting. Vinyl fencing from manufacturers like Bufftech carries a lifetime limited warranty on the material and requires almost no maintenance beyond occasional cleaning.

      TopVolk's installation labor carries a 2-year warranty. Structural issues with posts or framing that develop within that window are corrected at no charge.

