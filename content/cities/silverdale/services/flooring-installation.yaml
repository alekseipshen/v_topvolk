  - q: "Do I need a permit for flooring replacement in Silverdale?"
    a: |
      Straight flooring replacement — pulling carpet, installing LVP or hardwood — does not require a permit in unincorporated Kitsap County. No city building department is involved here; the authority is the Kitsap County Department of Community Development, and they don't require permits for cosmetic finish work. Structural subfloor repairs change that. Sistering joists, replacing rot-damaged framing, or repairing structural members triggers a permit through Kitsap County DCD. Bathroom tile work connected to a larger remodel may also require a permit depending on scope. TopVolk handles permit applications when they're needed — you don't have to navigate the DCD process yourself. WA Licensed Contractor.

  - q: "Should I use LVP or engineered hardwood in a Silverdale crawlspace home?"
    a: |
      The answer comes after moisture testing, not before. If the OSB subfloor reads above 10% moisture content on a pin-type meter, LVP is the right choice — it's fully waterproof and tolerates that range where engineered hardwood will eventually show movement. If moisture readings are below 10% and stable, Shaw Floorté or Pergo TimberCraft engineered hardwood performs well long-term in Silverdale's climate and adds more resale value than LVP in most Kitsap County markets. The Ridgetop homes with crawlspace foundations more often land in LVP territory. The Clear Creek Trail slab-on-grade homes are better candidates for engineered hardwood. Testing first prevents an expensive replacement down the road.

  - q: "What warranty comes with flooring installation in Silverdale?"
    a: |
      TopVolk provides a workmanship warranty on all installations — if a transition strip lifts, a joint gaps, or a board pops within the warranty period due to installation error, it gets fixed at no charge. Product warranties vary by manufacturer: Shaw Floorté carries a 25-year residential wear warranty, and mid-range LVP products typically run 10–25 years on the wear layer. What voids those warranties matters as much as what they cover — moisture intrusion, subfloor deflection beyond spec, and skipped acclimation all give manufacturers grounds to deny claims. TopVolk documents subfloor moisture readings, acclimation dates, and installation conditions on every project. A penalty for missed completion deadlines is written into every contract — 100+ projects completed since 2017 across Kitsap and King counties.

