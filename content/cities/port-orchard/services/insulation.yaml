title: "Port Orchard Insulation — R-49 Attic & Crawl Fixes"

answer: "R-49 attic insulation, crawl space encapsulation, and rim joist spray foam sealing, done in Port Orchard, WA — owner-led, 100+ projects since 2017."

intro: |
  Most Port Orchard homeowners ask one thing first: does my attic actually have enough insulation? Short answer — probably not. Most homes built before 2010 sit at R-19 to R-30 in the attic. That's well under the R-49 target for this climate zone. Crawl spaces near Mile Hill Drive and around McCormick Woods often still have bare dirt floors, with no vapor barrier at all.

  TopVolk handles insulation as part of larger remodel and addition work. Rim joist spray foam during a kitchen bump-out. R-49 blown-in cellulose during an attic conversion. Crawl space encapsulation ahead of a new backyard ADU. On a job off Bethel Avenue last year, we swapped flattened fiberglass batts for dense-pack CertainTeed cellulose. The homeowner went from running two space heaters to one Mitsubishi mini-split, all winter. Vladislav Volkov prices and runs these jobs himself. No subcontracted sales rep walking your attic with a clipboard. Call (206) 591-1096 for a real number, not a phone-quote guess.

localContext: |
  Port Orchard splits pretty cleanly by era. Down near the waterfront and the Sidney historic district (98366), you'll find cottages and bungalows from the early 1900s through the 1950s. Several still run single-wall construction with zero cavity insulation. Knob-and-tube wiring is still threaded through some attic joists.

  Head up the hill toward 98367 and McCormick Woods and it's mostly 1990s-2010s construction. Better bones. R-38 batts already sit in most attics. But crawl spaces were never encapsulated — the builder figured a stapled poly sheet was good enough.

  Kitsap sits on a peninsula. The water table runs high near Sinclair Inlet and Blackjack Creek. Crawl spaces in low spots off Tremont Street collect standing water most winters, once the vapor barrier develops gaps. Insulation-only work usually doesn't trigger a Kitsap County DCD permit. But bundle it into a remodel, addition, or new electrical run, and it falls under the same plan review as everything else on the job.

commonProblems:
  - title: "Attic Batts Sagging Below Code Near Sidney"
    description: "Pull back the insulation in a 1940s Sidney-area attic and you'll usually find R-11 or R-13 fiberglass batts, flattened between the joist bays. That's nowhere close to the R-49 this climate zone calls for now. Old batts compact over decades and lose most of their R-value. Gaps around the attic hatch and can lights make it worse. The fix is a blown-in top-up. CertainTeed InsulSafe SP cellulose settles into joist bays and around obstructions better than batts ever will. A typical 1,400 sq ft attic runs about $1,800-$2,800 and gets done in a single day. No permit needed, unless it's tied to a bigger remodel."
  - title: "Crawl Space Flooding Rots the Vapor Barrier"
    description: "Low-lying lots off Tremont Street and near Blackjack Creek sit close to the water table. Crawl spaces take on moisture every rainy season, and a torn 6-mil poly liner does nothing to stop it. Once the vapor barrier fails, floor joists and the rim joist start showing mildew. Fiberglass batts stapled under the subfloor turn into wet insulation with an R-value near zero. The real fix is full encapsulation — a 10-mil reinforced vapor barrier sealed up the foundation wall, plus rigid foam board on the perimeter instead of batts between the joists. Full encapsulation on an average Port Orchard crawl space runs $4,500-$9,000, depending on square footage and whether a sump pump gets added."
  - title: "Spray Foam on Rim Joists — Getting the Air Sealing (and the Permit) Right"
    description: "The rim joist and sill plate are the leakiest spot in most Port Orchard homes. That's the thin band between the foundation and the floor framing where outside air pours straight into the crawl space or basement. Closed-cell spray foam at 2 lb density seals and insulates that band in one pass. A fiberglass batt jammed in by hand just can't do that. Standalone, this work needs no permit. Bundled into an addition or ADU, it falls under Kitsap County DCD plan review and gets checked at rough-in inspection alongside the framing. TopVolk carries WA Licensed Contractor status and handles that paperwork as part of the project, not as an add-on fee."
  - title: "What Insulation Actually Costs Here (and the PSE Rebate)"
    description: "Pricing varies by scope. Attic blown-in cellulose typically runs $1,800-$3,500. Crawl space encapsulation runs $4,500-$9,000. Rim joist spray foam runs $1,200-$2,500, depending on linear footage. Puget Sound Energy offers rebates on qualifying attic and floor insulation upgrades, often $500-$1,200 back depending on the measure. That matters in a market where median household income sits around $71,719, and most homeowners weigh mid-range brands like CertainTeed or Owens Corning over premium options. Every quote from TopVolk is line-item — insulation type, R-value, square footage, labor. Not a vague range guessed over the phone. Call (206) 591-1096 and Vladislav will walk the attic or crawl space in person before pricing anything."
  - title: "Knee Walls and Floor Noise During a Remodel"
    description: "1.5-story homes around Port Orchard's older neighborhoods often have knee wall cavities. They were framed but never insulated, so upstairs bedrooms run cold in January and hot by August. When a bathroom or bedroom remodel opens those walls up, it's the cheapest time to pack them with mineral wool. Roxul ComfortBatt holds its shape and R-value for 30-plus years. Fiberglass batts compress and lose loft within 15-20 years. Mineral wool also cuts sound transfer between floors — that matters when a remodel adds a laundry room or second bathroom above a living space. It's a small add during framing, usually a few hundred dollars in material. Not worth doing after drywall is hung."

