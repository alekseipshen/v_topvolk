  - q: "What does crawl space encapsulation cost in Port Orchard?"
    a: "Most Port Orchard crawl spaces run $4,500-$9,000 for full encapsulation. The final number depends on square footage, existing moisture damage, and whether rigid foam board goes up the foundation walls or just the vapor barrier gets replaced. Homes near Blackjack Creek or other low-lying lots sometimes need a sump pump added, which raises the cost. Pricing is quoted line-item after Vladislav actually gets under the house and checks the joists and rim joist condition. A free on-site estimate is standard — call (206) 591-1096 before assuming a number off a website."
  - q: "Do I need a permit for attic or crawl space insulation in Port Orchard?"
    a: "Standalone insulation work — topping off an attic or encapsulating a crawl space — usually doesn't require a permit from Kitsap County DCD. Once insulation becomes part of a larger remodel, addition, or ADU project, it falls under the same plan review and inspection process as the rest of the job. It gets checked at rough-in alongside framing and mechanical. TopVolk is a WA Licensed Contractor and prepares that paperwork as part of the project scope, not as a separate line item you have to chase down yourself."
  - q: "Should I use blown-in cellulose or fiberglass batts in my attic?"
    a: "For open attic floors with irregular joist spacing, blown-in cellulose like CertainTeed InsulSafe SP fills gaps better than batts. It settles around wiring and can lights and reaches R-49 with less total depth than fiberglass. Batts still make sense in knee walls, rim joists, and spots where blown-in isn't practical to contain. Most Port Orchard attics get a hybrid approach — existing batts left in place, with cellulose blown on top to hit code. Vladislav will tell you which makes sense for your specific attic, not a one-size answer."
  - q: "How long does insulation actually last in this climate?"
    a: "Cellulose and mineral wool hold their R-value for 25-30+ years if moisture stays out. Standard fiberglass batts start compressing and losing loft within 15-20 years, faster in a humid crawl space. Closed-cell spray foam on rim joists doesn't sag or settle, and it typically outlasts the building envelope around it. The bigger threat in Kitsap County isn't age — it's water. A failed vapor barrier or a roof leak ruins insulation faster than time ever will. TopVolk's work is covered under the project warranty, with deadline penalties written into the contract if a job runs late."
