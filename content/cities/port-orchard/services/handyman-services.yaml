  - q: "What does a handyman punch list visit cost in Port Orchard?"
    a: "Punch list and single-item jobs typically run $250-$450 for a half-day visit, while multi-item lists of six or more small repairs run closer to $500-$800 depending on materials. Pricing depends on item count, whether parts need to be sourced — a specific Kohler or Moen model, a matching trim profile — and access, since a second-story window repair takes longer than a ground-floor fixture swap. TopVolk gives a line-item quote after a free on-site walkthrough, itemized by task, so the number on the invoice matches what was discussed before work starts. Call (206) 591-1096 to schedule that walkthrough."
  - q: "Do I need a permit for a deck repair or fixture swap in Port Orchard?"
    a: "Like-for-like fixture swaps — faucet, toilet, light fixture — don't need a permit through Kitsap County DCD or the City of Port Orchard permit desk, since nothing structural or electrical is being added. Deck repairs that replace boards or railing on existing framing usually don't either, but a full deck rebuild or any change to footprint or height requires plan review, typically 2-4 weeks depending on the jurisdiction. McCormick Woods and similar HOA communities may also require an architectural review for visible exterior changes like railing material or color. TopVolk is a WA Licensed Contractor and pulls permits when the scope requires it, handling the paperwork directly."
  - q: "Can you match my existing drywall texture and paint sheen when patching a wall?"
    a: "Yes — most South Kitsap homes built in the 1970s-90s have orange peel or knockdown texture, and matching it takes a hopper gun and the right mud consistency, not just a putty knife and a guess. TopVolk feathers the patch past the repair edge, primes with a stain-blocking primer so old paint colors don't bleed through, then matches the sheen — flat, eggshell, or satin — so the repair doesn't flash under window light. If the original paint code isn't known, a small color-match sample gets pulled and tested before painting the full patch. Most patches finish in a single visit."
  - q: "How long does weatherstripping or a deck repair actually last out here?"
    a: "Quality weatherstripping — compression seals and door sweeps rated for Pacific Northwest humidity — typically holds up 8-10 years, longer than the cheap foam strips that compress and crack within a couple winters. Deck board repairs using pressure-treated lumber last 10-15 years with basic maintenance like a re-stain every 2-3 years; composite decking such as Trex holds up longer with less upkeep but costs more upfront. TopVolk backs workmanship on every job, and deadline penalties are written into the contract for larger repairs so a multi-day job doesn't stretch into the next rainy stretch."
