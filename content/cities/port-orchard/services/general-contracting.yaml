title: "Port Orchard General Contracting — Kitsap Permits, Real Coordination"

intro: |
  Vapor barriers in the 1970s ranchers off Bethel Road — 98367 zip, South Kitsap — have been failing quietly under 37 inches of annual rainfall. Demo starts and the crawlspace tells the real story. Kitchens in these homes were built around a GE range and whatever fit cheapest at the time. Pulling a whole-house remodel permit means Kitsap County DCD or City of Port Orchard Community Development, depending on parcel location. Vladislav Volkov, WA Licensed Contractor — 100+ projects since 2023. Call (206) 591-1096.

localContext: |
  The 98366 zip covers downtown Port Orchard and the Bay Street waterfront — housing from the 1940s through 1960s, some post-and-pier foundations, galvanized supply lines still showing up during bath demo. South Kitsap's 98367 zip runs differently: 1970s-90s ranchers built fast on flat suburban lots, Douglas-fir framing that holds up but plumbing, electrical, and HVAC systems that haven't.

  Military families stationed at PSNS in Bremerton shaped a lot of this build cycle. Demand was high and finish quality reflects that. These homes are worth remodeling — the bones are there — but the systems underneath need a contractor who's seen enough of them to price the surprises in advance.

commonProblems:
  - title: "Kitsap County DCD vs. City of Port Orchard — Wrong AHJ, Full Restart"
    description: "Parcels inside Port Orchard city limits go to the City of Port Orchard Community Development Department. Unincorporated South Kitsap goes to Kitsap County DCD. Submit to the wrong office and the application comes back. Plan review on structural work runs 6-10 weeks from a clean submission — a jurisdiction error resets the clock entirely. FAR calculations and setback compliance need to be right on the first set, not after a revision cycle adds another full review period."
  - title: "Undersized Headers and Missing Blocking Behind 1970s-Era Drywall"
    description: "Open walls on a South Kitsap rancher and you find undersized door headers, missing blocking between floor joists, and rim joist damage from crawlspace moisture that never had a functioning vapor barrier. Replacing a header with an LVL beam mid-project requires a structural engineer's stamp and a revised permit set. Budget a 10-15% contingency on homes in 98367 or you're making panicked cut decisions in the middle of construction."
  - title: "MEP Scheduling Gaps When Trades Are Running Their Own Timelines"
    description: "Framing rough-in has to pass inspection before electrical can start. The Mitsubishi mini-split install needs duct paths decided before walls close. Plumbing drain lines need the kitchen layout locked before they're set. Without a GC holding the sequence, Bosch dishwasher rough-ins end up misplaced and KitchenAid range circuits get spec'd to the wrong amperage. Each slip adds time and cost."

faq:
  - q: "How fast can you get to Port Orchard for a General Contracting consultation?"
    a: "Port Orchard is about 45-50 minutes from Seattle via SR-16 through Tacoma, or roughly the same time via the Southworth-Fauntleroy ferry from West Seattle depending on the sailing schedule. Free on-site consultation with Vladislav directly — no sales staff. Call (206) 591-1096 to book a time."
  - q: "What appliance brands do you typically spec for Port Orchard kitchen remodels?"
    a: "South Kitsap kitchens at the mid-range budget tier land on KitchenAid or Samsung ranges, Bosch dishwashers needing a dedicated 15-amp circuit, and LG refrigerators. Appliance specs get locked before cabinet orders are placed — swap brands after rough-in and you're re-pulling permits for circuit changes. That conversation happens in the planning phase, not during construction."
  - q: "How long does a whole-house remodel in Port Orchard take, including permits?"
    a: "Kitsap County DCD or City of Port Orchard plan review adds 6-10 weeks before construction starts on major structural work. Kitchen remodel runs 6-10 build weeks after permit issuance. Bathrooms 3-5 weeks. DADU additions under WA HB 1337 — which allows up to two ADUs per single-family lot statewide — run 4-7 months end-to-end. Deadline commitments are written into every contract. TopVolk pays penalties for missed milestones. Call (206) 591-1096."