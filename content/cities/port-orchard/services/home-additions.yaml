title: "Port Orchard Home Additions — DADUs & Second Stories"

answer: "TopVolk Construction builds home additions, DADUs, and second-story additions in Port Orchard, WA — 100+ projects since 2017, owner-led by Vladislav Volkov."

intro: |
  A home addition in Port Orchard runs somewhere between $120 and $260 a square foot, depending on whether you're pouring a new foundation for a detached ADU or tying a second story into a foundation the house already has — and TopVolk Construction has priced and built both across South Kitsap since 2017. The math changes block by block here. A rancher near Tremont sitting on a crawlspace needs different footing work than a McCormick Woods home built on a slab in the 2000s. Down near Bay Street and Waterfront Park, older lots come with tighter setbacks and slopes that limit where a detached unit can even sit. One client off Sedgwick Road wanted a mother-in-law suite with its own kitchenette — we ran a dedicated Mitsubishi mini-split for heat instead of trenching new ductwork sixty feet back to the main house. Vladislav Volkov handles design, permitting, and framing himself, and the contract includes a penalty clause if the deadline slips.

localContext: |
  Port Orchard splits into a few distinct pockets, and each one changes what an addition permit looks like. In 98366, homes near downtown and Bay Street date back to the 1900s through the 1950s, many resting on post-and-pier or crawlspace foundations that need sistering and extra blocking before they'll carry a second story safely. Out in 98367, McCormick Woods and the newer streets off Sedgwick Road were mostly built from the 1990s through the 2010s on poured slabs, which simplifies foundation work but often means lot coverage and FAR numbers are already close to the limit before you add a square foot. Parcels inside city limits route through the City of Port Orchard Development Division; unincorporated lots further out toward Glenwood Road or South Kitsap go through Kitsap County DCD instead, and the two offices don't always read setback rules the same way. Rain is the constant across both — Kitsap sees close to 50 inches a year on the water side, so any addition needs a vapor barrier under the crawlspace and proper flashing where the new roofline ties into the old one, or you're dealing with moss and soft sheathing within a couple winters.

commonProblems:
  - title: "Building a DADU or AADU Under WA HB 1337"
    description: "State law now allows up to two ADUs on a single-family lot, and that's opened up a lot of Port Orchard backyards that used to sit empty. The hang-up is usually utilities — a detached unit needs its own sewer lateral or a shared line sized correctly, plus a separate electrical panel feed, not a shared circuit. We size the water heater as a compact Rinnai tankless unit instead of a standard tank to save closet space in a 600-square-foot DADU. Lot coverage and the 24-foot height limit matter more on the smaller in-town lots near downtown than out in McCormick Woods. A DADU typically runs 4-7 months from design through final inspection, permits included."
  - title: "Second-Story Additions and What the Existing Foundation Can Actually Carry"
    description: "Adding a second floor means checking what the first floor was built to hold, and a lot of Port Orchard ranchers from the 1970s and 80s were framed for roof load only, not a full second story. That means an LVL beam or PSL post gets added at key bearing points, existing joists get sistered, and the rim joist often needs reinforcing with new blocking before framing starts. On post-and-pier homes near Bay Street, we sometimes have to pour additional footings under the crawlspace first. Skipping this step is how you end up with bouncy floors or cracked drywall two years later. Structural work like this adds roughly $15,000-$35,000 to a second-story project depending on span."
  - title: "Two Permit Desks, One County: City of Port Orchard vs Kitsap County DCD"
    description: "Homeowners inside Port Orchard city limits submit through the City's Development Division, while lots in unincorporated South Kitsap — plenty of them right off Sedgwick or toward Glenwood — go through Kitsap County DCD instead, with its own plan review queue and inspection schedule. Plan review typically takes 4-8 weeks for an addition, longer if the parcel needs a critical areas or shoreline check near the water. TopVolk is a WA Licensed Contractor and handles the permit application, site plan, and structural drawings directly with whichever office has jurisdiction, so the homeowner isn't the one shuttling paperwork between two counters. Rough-in and final inspections get scheduled around framing and MEP milestones, not guessed at."
  - title: "What Home Additions in Port Orchard Actually Cost"
    description: "Pricing swings on three things: foundation type, whether utilities need to extend, and finish level. A single-story addition or bump-out on an existing slab runs closer to $120-$160 per square foot; a full second story with new structural steel or LVL framing pushes toward $200-$260. A detached ADU with its own kitchen and bath, appliances like a Bosch dishwasher and a standard range, lands in the $180,000-$260,000 range depending on size and finishes. Quotes from TopVolk are line-item, not a rough range pulled from a phone call — every LVL beam, every fixture, every permit fee is priced before a contract gets signed. Call (206) 591-1096 for a walk-through and a written number, not a guess."
  - title: "Matching Siding and Roofline After Decades of PNW Weather"
    description: "An addition on a house built before 1980 almost always means matching old cedar shake or lap siding that's weathered gray for thirty years, and new material never sits right next to it without some blending work. Hardie cement-board siding is what we use on the new section in most cases — it resists the rot that cedar picks up on north-facing walls near the water, and it takes paint evenly next to the older material. Roofline tie-ins need step flashing and ice-and-water shield at the new valley, since Kitsap's wet season runs October through May and a bad tie-in shows up as a ceiling stain within a year. Expect the exterior shell portion of an addition to run $18-$30 per square foot depending on siding choice."

faq:
  - q: "How fast can you get to Port Orchard for Home Additions?"
    a: "Port Orchard sits about 15-20 minutes from our usual Kitsap job sites off Highway 16 or the Sedgwick Road exit, so scheduling a first walk-through usually happens within a few days of the call. Parking and site access get scoped during that visit — tighter lots downtown near Bay Street sometimes need a plan for material staging. Full additions run 8-16 weeks for framing and finish work after permits clear, longer for a DADU once you count the county review. Call (206) 591-1096 to get on the schedule."
  - q: "What does a home addition in Port Orchard cost?"
    a: "Most additions land between $120 and $260 per square foot depending on foundation type, structural work, and finish level, with a full DADU running $180,000-$260,000 complete. A simple bump-out on an existing slab costs less than a second story requiring new LVL beams and PSL posts. Kitchenette appliances, whether Samsung, LG, or Bosch, add a modest line item compared to the structural cost. TopVolk provides a free on-site estimate with itemized pricing, not a phone-quote range — call (206) 591-1096 to set one up."
  - q: "Does my Port Orchard addition go through the city or Kitsap County?"
    a: "It depends on the parcel — inside city limits it's the City of Port Orchard Development Division, while unincorporated South Kitsap addresses, common off Sedgwick and Glenwood, go through Kitsap County DCD. Plan review generally takes 4-8 weeks, and DADUs under HB 1337 need a separate utility review on top of the standard building permit. TopVolk is a WA Licensed Contractor and prepares the site plan, structural drawings, and permit application directly with whichever office applies, then coordinates rough-in and final inspections around the build schedule."
  - q: "Can you tie a new addition into my existing HVAC, or do I need a mini-split?"
    a: "It depends on your existing ductwork's capacity — older forced-air systems in 1970s-80s ranchers usually can't handle another zone without a bigger blower, so we often run a dedicated Mitsubishi mini-split for the new space instead of extending old ducts. Detached ADUs almost always get their own mini-split plus a compact Rinnai tankless water heater rather than sharing utilities with the main house. Both routes get sized during design, before framing starts, so there's no surprise MEP change order mid-project."
  - q: "How long will the new addition hold up in Kitsap's weather?"
    a: "Framed correctly with R-49 attic insulation, a proper vapor barrier at the crawlspace, and Hardie siding on the exterior, an addition should perform as long as the original structure — 40-plus years with normal upkeep. The weak points are always flashing details at rooflines and any spot where old siding meets new; those get inspected and re-caulked every few years just like the rest of the house. Windows we typically spec are Milgard, which hold up well against the wet-side humidity without the seal failures cheaper vinyl units show after a decade."
  - q: "Do you cover areas near Port Orchard, and how far out do you schedule?"
    a: "Yes — alongside Port Orchard we regularly work Bremerton, Gig Harbor, Silverdale, and the rest of Kitsap County, plus King, Snohomish, and Pierce counties. Scheduling windows run 2-4 weeks out for a first consultation depending on season, sooner if the project's ready to move. Vladislav Volkov handles every consultation directly — no sales rep, no middleman. Call (206) 591-1096 or schedule a free consultation to get a date on the calendar."