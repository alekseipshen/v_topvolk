    a: "Yes — coverage runs across Kitsap County plus King, Snohomish, and Pierce, so Gorst, Manchester, and the South Kitsap unincorporated areas near Mullenix are all in the normal service radius. Scheduling windows run similar to in-city jobs, usually within a week for smaller patch and repair work. Larger remodels or ADU builds get scheduled around permit approval. Call (206) 591-1096 or ask about a free consultation to get a specific date."