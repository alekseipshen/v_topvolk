title: "Port Orchard Power Washing — Sinclair Inlet Moisture Fix"

answer: "TopVolk soft-washes roofs, decks, and siding in Port Orchard, Washington — most jobs booked within 3-5 days, free on-site quotes with line-item pricing."

intro: |
  A cedar shake roof two blocks off Bay Street can go from clean to green in under two years — that's how fast moss takes hold once Sinclair Inlet fog starts rolling in every morning between October and May. TopVolk gets calls about it constantly, usually after someone spots the black streaking from the driveway or a neighbor mentions it. The fix isn't a garden hose and a Saturday afternoon. It's a low-pressure soft-wash rig, the right surfactant blend, and enough dwell time to actually kill the spores instead of just knocking off the visible growth. Homes near McCormick Woods and the older Tremont Street neighborhoods both deal with this, just for different reasons — McCormick Woods has mature Douglas-fir canopy dumping shade and needles onto Hardie siding and Trex decking, while the older Bay Street-adjacent homes have original cedar siding that's never been treated with anything beyond a coat of Cabot stain a decade ago. Either way, algae and moss don't go away on their own here.

localContext: |
  Port Orchard's housing stock splits pretty cleanly by area. Downtown and the Bay Street waterfront, closer to zip 98366, still has a good number of homes built between 1900 and the 1950s — original cedar siding, some with lead paint layers underneath that changes how aggressive we can get with pressure. Out toward McCormick Woods and Sedgwick Road, in the 98367 zip, construction runs newer — 1990s and 2000s builds with Hardie fiber-cement siding, composite decking, and stucco accents that need a different chemical approach than bare wood. McCormick Woods is also an HOA community, and the CC&Rs there do reference exterior maintenance standards, so a soft-wash before a repaint or a listing photo shoot isn't just cosmetic — it's often required to stay compliant. Salt air off Sinclair Inlet adds a corrosion factor too, especially on garage door hardware and deck fasteners near Annapolis and the Southworth ferry corridor.

commonProblems:
  - title: "Moss colonizing north-facing roofs and cedar decks"
    description: "Moss doesn't just sit on a roof surface — it roots into the shingle mat or between cedar deck boards, holding moisture against the wood and accelerating rot at the joist hangers underneath. We see this constantly on homes shaded by fir trees around McCormick Woods and along Tremont Street. A pressure washer alone can lift shingles or blast grit into the wood grain, so we run a soft-wash system with a potassium-salt based moss treatment, then a follow-up rinse. Full roof and deck combo typically runs $450-$900 depending on pitch and square footage, and we recommend a zinc strip install afterward to slow regrowth for 2-3 years."
  - title: "Cedar deck graying and splintering before staining season"
    description: "Untreated cedar in Port Orchard's climate — about 50+ inches of rain a year, most of it October through May — grays out and starts splintering within 18-24 months if it's never sealed. Before any Cabot or Sikkens stain goes on, the deck needs a wood-brightener wash to open the grain and strip out tannin buildup, not just a rinse. We use an oxalic-acid based brightener after the initial soft-wash, which resets the wood to a near-new color. Deck prep runs $2-$4 per square foot depending on board spacing and how much sanding the joints need."
  - title: "Hardie siding and stucco cleaning before repaint, McCormick Woods HOA compliance"
    description: "McCormick Woods' HOA CC&Rs list exterior cleanliness as part of the maintenance standard, and Hardie fiber-cement siding builds up a chalky mildew film in the shaded lots faster than most homeowners expect. Standard garden-hose cleaning leaves streaking in the control joints and around window flashing. We soft-wash with a mildewcide-treated solution safe for fiber cement and stucco, keeping pressure under 500 PSI to avoid driving water behind the weep screed. Most HOA-triggered cleanings get scheduled within a week, and we provide a dated photo report if the homeowner needs to show compliance to the board."
  - title: "Driveway, walkway, and paver oil staining near Bay Street and Retsil"
    description: "Concrete driveways and paver walkways collect tire marks, oil drips, and organic staining from tree sap and moss runoff, especially on older Bay Street and Retsil properties with mature landscaping overhead. Surface-level pressure washing alone won't pull oil out of porous concrete — it needs a degreaser pre-treatment, usually a citrus-based solvent, followed by hot-water extraction at higher PSI (2500-3000) than we'd ever use on siding. Driveway and walkway cleaning runs $150-$350 for a standard residential lot, with paver restoration and joint sand refill adding $100-$200 depending on square footage."
  - title: "Fence and gate cleaning on a 3-5 year staining cycle"
    description: "PNW fence lines — cedar picket, board-on-board, or PT lumber — need a wash and re-stain roughly every 3-5 years, and skipping the wash step is the most common reason stain fails early. Dirt and algae film block penetration, so a fresh coat of Sherwin-Williams or Ready Seal ends up peeling within a season instead of lasting the full cycle. We soft-wash fence sections before staining, checking post bases and any ground-contact PT lumber for early rot while we're at it. A standard 150-foot fence wash runs $250-$450, and catching rot at the post base early saves a full section replacement later."

