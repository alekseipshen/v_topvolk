  - q: "What's the difference between pressure washing and soft washing, and which do I need?"
    a: "Pressure washing uses high PSI (2000-3000+) mechanical force, good for concrete, pavers, and driveways where the surface can take it. Soft washing uses low pressure (under 500 PSI) with a chemical solution — usually a diluted sodium hypochlorite or surfactant blend — to kill moss and algae roots on roofs, siding, and stained wood without stripping paint or driving water behind flashing. Cedar shake, Hardie siding, and stucco should always get soft-washed, never blasted. We decide the method on-site based on the surface, not a one-size-fits-all approach."
  - q: "How long does a power wash last before moss and algae come back?"
    a: "A roof soft-wash paired with a zinc or copper strip install typically holds off regrowth for 2-3 years in this climate; without the strips, expect visible moss return within 12-18 months given the fog and rain off Sinclair Inlet. Siding and deck washes generally need a refresh every 1-2 years, faster on north-facing or heavily shaded surfaces. There's no product that stops regrowth permanently here — the goal is stretching the cycle, not eliminating it. Ask about the zinc strip add-on when you book."
