title: "Port Orchard Deck Installation — Built for Kitsap Rain"

intro: |
  Bay Street along Sinclair Inlet is walking distance from streets full of
  1970s and 80s split-levels where south-facing backyards sit idle because
  there's no usable outdoor space. Up in the Bethel Avenue corridor, 98367
  homeowners adding outdoor kitchen setups — gas line, Weber grill, maybe a
  GE outdoor-rated fridge — keep running into the same issue: the original
  rim joist wasn't built to carry a ledger board. That's where deck projects
  in Port Orchard tend to start: structural assessment before any board
  gets ordered.

localContext: |
  The 98366 zip covers downtown and the waterfront neighborhoods — homes
  from the 1940s through 60s with post-and-pier foundations and Douglas-fir
  framing that's absorbed decades of Kitsap rain. Rim joists in this stock
  regularly need sistering before a ledger board attachment is code-safe.
  South Port Orchard in 98367 runs newer, mostly 1980s and 90s
  builder-grade ranchers where the original pressure-treated deck posts have
  25-30 years of ground contact and often show rot at the footing line.
  Kitsap County Building Department issues permits here — plan review on a
  standard attached deck typically runs 3-6 weeks.

commonProblems:
  - title: "Rotted Rim Joists on Older 98366 Homes Near the Waterfront"
    description: "Ledger boards bolt directly through the rim joist into the house
      band framing — if that rim joist has softened from years of moisture
      intrusion, the deck attachment point fails under load. On Port Orchard's
      older Craftsman and ranch stock near Bay Street, we regularly find
      Douglas-fir rim joists that need full sistering with new dimensional
      lumber and proper ledger flashing before a single joist hanger goes in."

  - title: "Post Footings Above Frost Line in South Kitsap Hillside Lots"
    description: "Kitsap County's frost depth runs 12-18 inches, and hillside lots
      off Bethel Road and in the Sunnyslope area see enough freeze-thaw movement
      to heave shallow footings over a few winters. Code requires tube-form
      concrete footings poured below frost line with ground-contact PT lumber
      rated UC4B for direct burial. Decks built on undersized footings shift
      and pull away from the house — ledger flashing tears and moisture gets in."

  - title: "Cedar vs. Composite on North-Facing Port Orchard Lots"
    description: "Port Orchard averages 45-50 inches of rain a year, and cedar
      decking on a north-facing slope starts growing moss within two seasons
      without regular treatment and sealing. Trex Transcend and TimberTech AZEK
      composite boards resist moss and mildew far better, but board spacing at
      install matters — composite expands more than wood in summer heat.
      For lots with direct Puget Sound wind exposure, composite is the
      lower-maintenance call by a wide margin."

faq:
  - q: "How fast can you get to Port Orchard for a deck consultation?"
    a: "Port Orchard is about 40 minutes from Seattle via the Southworth ferry,
      or roughly 50 minutes down SR-16 from Tacoma. Vladislav handles site
      visits directly — call (206) 591-1096 to schedule a free on-site
      consultation. No sales staff, just the contractor who'll run the build."

  - q: "Do you work with Trex and TimberTech decking, or only wood?"
    a: "Both composite and natural wood. Trex Transcend and TimberTech AZEK are
      the two composite lines we spec most often — both carry solid fade and
      stain warranties for PNW conditions. Cedar is still viable if you prefer
      natural wood and are willing to seal it every 2-3 years. We bring samples
      to the site visit so you can compare against your siding."

  - q: "What does a deck permit cost and how long does it take in Kitsap County?"
    a: "Kitsap County Building Department processes residential deck permits.
      Plan review runs 3-6 weeks for a standard attached deck; permit fees
      typically land between $300-$900 depending on project valuation. Full
      build timeline from signed contract to final inspection is usually 4-8
      weeks. TopVolk is a WA Licensed Contractor — 100+ projects completed
      since 2017, with deadline penalties written into every contract. Call
      (206) 591-1096 to walk through your scope."