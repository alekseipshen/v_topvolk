intro: |
  Forced-air ductwork run through a vented crawlspace under a 1975 rancher off Sedgwick Road explains why one bedroom bakes and the other stays cold every summer — that kind of duct sealing and rebalancing work gets folded into a lot of the additions and remodels TopVolk runs in Port Orchard, alongside full heat pump conversions and ductless mini-split installs. McCormick Woods homes built through the late '90s and 2000s are hitting the age where their original heat pumps need more than another refrigerant top-off, and a Daikin or Mitsubishi replacement usually solves it for good. Downtown near the DeKalb Street Pier and the passenger ferry dock, older cottages on tight lots are swapping electric baseboard for LG or Samsung ductless systems instead of forcing new ductwork into a house that was never built for it. Vladislav Volkov scopes every HVAC piece of a project personally and coordinates the licensed mechanical sub directly — no sales rep in the middle. TopVolk has completed 100+ projects since 2017 across King, Snohomish, Pierce, and Kitsap counties. Call (206) 591-1096 for a free on-site quote.

localContext: |
  Housing near Sinclair Inlet splits into two eras that matter for HVAC sizing: pre-1950s cottages downtown near the DeKalb Street Pier ferry dock, and the ranch-style and split-level homes built through the 60s and 70s out toward Sedgwick Road and Sidney Glen (98366). McCormick Woods (98367) went in from the late 1980s through the 2000s around the golf course, and those homes came with builder-grade heat pumps sized off a quick estimate rather than a full Manual J load calculation — a lot of them short-cycle and can't hold setpoint on a 28°F morning. Older downtown homes still running electric baseboard or an aging oil furnace in the basement are strong candidates for a ductless conversion instead of snaking new ductwork through tight joist bays and old wiring. Kitsap County's marine climate keeps summers mild, but humidity off the inlet feeds moss and mildew on north-facing siding and pushes moisture into vented crawlspaces, so any HVAC scope touching ductwork there needs a vapor barrier check too. Permits for HVAC work inside Port Orchard city limits run through the City of Port Orchard building division; unincorporated South Kitsap goes through Kitsap County DCD instead.

commonProblems:
  - title: "Gas Furnaces Aging Out in South Kitsap Ranch Homes"
    description: "A forced-air furnace installed when a Sedgwick Road rancher was built in the 70s or 80s is likely running on a cracked heat exchanger by now, and carbon monoxide safety is the real reason to stop repairing it rather than efficiency alone. Converting to a heat pump — Mitsubishi Hyper-Heat or an LG cold-climate unit — qualifies for federal Inflation Reduction Act rebates that can cut $2,000 or more off the installed cost depending on household income and existing electrical panel capacity. Most single-family conversions in Port Orchard run $9,000 to $16,000 installed, covering the outdoor condenser, indoor air handler, refrigerant line set, and a new condenser pad. A panel upgrade adds cost if the house is still on 100-amp service. Install takes one to two days once the mechanical permit clears."
  - title: "Ductless Mini-Splits for McCormick Woods Additions and Backyard ADUs"
    description: "WA HB 1337 lets a South Kitsap lot carry up to two ADUs now, and a detached ADU or a bonus room addition off a McCormick Woods great room almost never pencils out with new ductwork tied into the existing trunk line. A Daikin or Samsung ductless system with one outdoor condenser and one or two wall-mounted heads covers the load without touching the main house's duct capacity, and the line set runs through a small wall penetration instead of a full mechanical chase. Per-zone pricing runs $4,500 to $7,500 installed, including the condenser pad and disconnect. A DADU under the 24-foot height limit typically needs its own dedicated electrical circuit for the unit, coordinated with the electrician during rough-in. Budget two to three weeks from permit to final inspection."
  - title: "Adding AC to an Old Forced-Air System Without Overloading the Ducts"
    description: "Bolting a condenser onto a furnace that was only ever sized for heat is a common ask in Port Orchard once summer hits a stretch of 85°F days, but existing duct capacity and return air sizing decide whether it works or backfires. A proper Manual J load calculation checks the trunk and branch runs before equipment gets ordered — undersized returns choke a new AC coil and spike static pressure past what the blower motor can handle. Inside city limits, the mechanical permit runs through the City of Port Orchard building division; out toward unincorporated South Kitsap it's Kitsap County DCD, and both follow IRC mechanical code for equipment clearances and condensate drainage. Plan review typically takes one to two weeks for a straightforward AC add-on. TopVolk is a WA Licensed Contractor and pulls the mechanical permit as part of the project scope, not as an afterthought."
  - title: "What a 95% AFUE Furnace Replacement Runs in Port Orchard"
    description: "A high-efficiency condensing furnace at 95% AFUE or better needs PVC intake and exhaust venting instead of the old metal flue, plus a condensate line to a floor drain or condensate pump — that's the part homeowners forget to budget for when comparing quotes. Installed cost for a single-family home in Port Orchard typically lands between $6,500 and $11,000, with the spread driven by venting complexity, ductwork modifications, and whether the existing plenum needs rebuilding to match the new unit's airflow. Manufacturer warranties on the heat exchanger usually run 10 to 20 years depending on brand, and TopVolk writes labor warranty terms and a deadline penalty directly into the contract — if the install runs past the agreed date, that cost lands on the contractor. Line-item pricing comes with the quote, not a ballpark range."
  - title: "Duct Leaks, Salt Air, and the Hot-Cold Room Problem"
    description: "Uninsulated flex duct running through a vented crawlspace under a downtown Port Orchard cottage loses conditioned air at every seam, which is why the back bedroom stays 10 degrees colder than the living room all winter. A duct blaster test finds the leakage, and sealing with mastic — not tape — at the joist boots and takeoffs, plus swapping in R-8 insulated flex where runs cross unconditioned space, usually solves it for $1,200 to $3,000 depending on how much duct needs replacing. Homes closer to Sinclair Inlet also see faster corrosion on outdoor heat pump and mini-split coils from the salt air, so a coated condenser coil is worth the upcharge over a standard unit. Nest or ecobee thermostats with room sensors help catch the imbalance early. Expect 12 to 15 years out of a heat pump in this climate with annual coil cleaning."

