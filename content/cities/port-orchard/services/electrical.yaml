    a: "Port Orchard sits inside TopVolk's regular Kitsap County coverage, along with Bremerton, Gig Harbor, Silverdale, and Poulsbo — no travel surcharge for any of those. Scheduling for a standard estimate runs 2-3 business days out; panel upgrades and larger rewiring jobs typically start within two to three weeks once permits are filed, faster if the scope is a single circuit or breaker swap. TopVolk has completed 100+ projects across King, Snohomish, Pierce, and Kitsap counties since 2023, all owner-led. Call (206) 591-1096 or ask for a free consultation to get an exact start date."