  - q: "What does a panel upgrade in Port Orchard cost?"
    a: "A 100A-to-200A service panel upgrade typically runs $3,200 to $5,200 in Port Orchard, depending on meter base condition, panel location, and whether PSE needs to run a new service drop. Adding an EV charger circuit or heat pump circuit at the same time usually saves money versus doing it as a separate job later, since the panel's already open. Older homes with fuse boxes or knob-and-tube sometimes need extra work bringing the service entrance up to code, which shows up as a separate line item, not a surprise on the final bill. Every quote from TopVolk is line-item — schedule a free on-site consultation for exact pricing."
  - q: "Do I need a permit for electrical work in Port Orchard, and does my HOA matter?"
    a: "Yes — panel upgrades, sub-panels, and new circuits all require a permit, pulled through the City of Port Orchard building department for in-city addresses or Kitsap County DCD for unincorporated parcels like some McCormick Woods sections. TopVolk handles the application, plan review, and inspection scheduling as part of the quoted price. McCormick Woods and a few other developments also have HOA architectural review for anything visible from the street, like an exterior EV charger enclosure or a relocated meter base — TopVolk provides the spec sheet homeowners need for that submission. TopVolk is a WA Licensed Contractor, and typical permit turnaround for a residential panel job is one to two weeks."
  - q: "What's the difference between a 50A and 60A EV charger circuit, and which do I need?"
    a: "A 50A circuit covers most Level 2 chargers — Tesla Wall Connector, ChargePoint Home Flex, JuiceBox 40 — running at their standard output, while a 60A circuit is for chargers pushing higher amperage or future-proofing for a second EV. TopVolk sizes the circuit based on the actual charger model, not a generic recommendation, and installs either a NEMA 14-50 outlet or a hardwired connection depending on what the manufacturer specifies. Wire gauge and breaker size get matched to the run length, since a long run from the panel to a detached garage needs heavier copper to avoid voltage drop. Most installs finish in a single day once the panel has room."
  - q: "How long do panel upgrades and rewiring hold up in Kitsap County's climate?"
    a: "A properly installed Square D or Eaton panel with a corrosion-rated outdoor enclosure holds up 25-30 years even with the marine air and damp winters Port Orchard gets from October through May. Copper pigtail connections on aluminum wiring fixes don't degrade the way the original aluminum-to-steel terminations did, so that repair is effectively permanent once it's done right. Outdoor GFCI outlets and exterior fixtures near the water take the most wear and are the first thing to check every couple of years. TopVolk's work carries workmanship warranty coverage, and panel components carry manufacturer warranties on top of that, spelled out in the written quote."
