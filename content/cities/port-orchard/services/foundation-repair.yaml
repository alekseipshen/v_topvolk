  - q: "Do I need a permit for foundation repair in Port Orchard?"
    a: "Structural foundation work inside Port Orchard city limits requires a permit through the City of Port Orchard Building Division; homes in unincorporated South Kitsap, like parts of Manchester or Long Lake, go through Kitsap County DCD instead. Plan review typically takes 2-4 weeks for straightforward reinforcement work, longer if piering or a full seismic retrofit is involved. TopVolk is a WA Licensed Contractor and handles the permit application, drawings, and inspection scheduling as part of the job. We coordinate the rough-in and final inspection directly with the AHJ so you don't have to."
  - q: "What's the difference between shimming and full post replacement?"
    a: "Shimming adds a steel or hardwood shim under an existing post to level a floor that's sagged slightly — a cheaper, faster fix when the post itself is still solid. Full replacement is needed once the post base has rotted or the concrete pier has cracked, which is common in Port Orchard homes with damp, poorly ventilated crawlspaces. We use Simpson Strong-Tie post bases set above grade on new replacements so the wood never touches soil directly again. A crawlspace inspection tells us which situation you're actually dealing with before any work starts."
  - q: "How long does a foundation repair last in this climate?"
    a: "Post-and-pier replacement with proper post bases and pressure-treated lumber should last 30-40 years if the crawlspace stays dry and ventilated. Epoxy-injected cracks are a permanent structural fix as long as the underlying settlement has stabilized. The weak link in Kitsap County is moisture — 37 inches of rain a year means a vapor barrier and working drainage matter as much as the structural repair itself. We warranty our structural work and recommend a crawlspace check every few years, especially after a hard winter."
