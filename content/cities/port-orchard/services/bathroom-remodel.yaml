title: "Port Orchard Bathroom Remodel — Kitsap Moisture Done Right"

intro: |
  Sinclair Inlet keeps Port Orchard wet from October through May, and that salt-air
  humidity pushes into bathroom walls faster than most homeowners expect. The 1980s-90s
  tract builds along Bethel Road and around Mile Hill Drive weren't waterproofed with
  Schluter Kerdi — they got paper-faced drywall and basic caulk. A Moen shower cartridge
  seeping behind the valve plate, or grout that's been damp for three years, stops being
  a cosmetic issue at some point.

localContext: |
  Most of the housing stock in 98366 and 98367 was framed between 1975 and 2000 —
  builder-grade fixtures, original drain stacks, the works. Neighborhoods off Lund Avenue
  and out toward South Kitsap sit on lots with crawlspace foundations; ground moisture
  wicks up into bathroom subfloors over time. Older homes in Orchard Heights sometimes
  still have galvanized steel drain lines that have narrowed from decades of scale buildup
  — a full bath remodel is the right time to repipe to ABS before you tile over it.

commonProblems:
  - title: "Moisture damage behind builder-grade tile in 1980s South Kitsap tract builds"
    description: |
      Paper-faced drywall was standard substrate in tract bathrooms built through the
      early 1990s. Once the caulk fails at the tub surround, water migrates behind the
      tile and saturates the backer. By the time the grout cracks are visible from the
      outside, there's often black mold two inches into the wall cavity. RedGard membrane
      or Schluter Kerdi goes in before any new tile — no exceptions.

  - title: "Galvanized drain stack corrosion accelerated by Kitsap's salt-air climate"
    description: |
      Homes built before 1985 in Port Orchard frequently have original galvanized steel
      drain lines. Salt air off Sinclair Inlet speeds interior corrosion. Pipes narrow
      from scale buildup until slow drains become a standing-water problem. A master bath
      reconfiguration — moving the shower, adding a double vanity — is the practical time
      to reroute those lines to ABS and finish the rough-in inspection once, cleanly.

  - title: "Inadequate bathroom ventilation causing repeat mold cycles"
    description: |
      A 50 CFM exhaust fan installed in 1991 isn't moving enough air for Port Orchard's
      damp winters. Bathrooms without 80-110 CFM of vented exhaust stay humid between
      showers — mold comes back faster than homeowners can scrub it. Panasonic WhisperCeiling
      and Broan multi-speed fans are standard upgrades: vented to the exterior, not dumped
      into the attic, which is a common mistake in older builds here.

faq:
  - q: "How fast can you get to Port Orchard for a bathroom remodel consultation?"
    a: |
      Vladislav covers Port Orchard regularly — WA-16 from the Tacoma side or the
      Bremerton ferry route both route directly here. Call (206) 591-1096 to book a
      free on-site consultation. First visit typically within a week. TopVolk is WA
      Licensed Contractor, 100+ projects completed since 2023.

  - q: "Do you work with Moen and Kohler fixtures common in South Kitsap bathrooms?"
    a: |
      Both are standard throughout 98366 and 98367. Moen pressure-balance cartridge
      replacements, Kohler one-piece toilet swaps, Delta tub/shower valve upgrades —
      all part of most remodel scopes. For finishes, brushed nickel and matte black
      hold up better long-term in humid Kitsap bathrooms than polished chrome.

  - q: "What does a bathroom remodel cost in Port Orchard and how long does it take?"
    a: |
      A mid-range master bath gut-to-studs — new tile, curbless shower, vanity, plumbing
      rough-in — typically runs $30K-$55K and takes 6-9 weeks. Permits pull through the
      City of Port Orchard building department; plan review adds 2-4 weeks up front.
      Vladislav provides line-item quotes, no vague ranges. Deadline penalty is written
      into the contract. Call (206) 591-1096 to schedule.