title: "Port Orchard Kitchen Remodel — From Galley to Open Plan"

intro: |
  Homes on Pottery Avenue and the streets climbing above Sinclair Inlet were mostly built
  in the 1960s and early 1970s — solid Douglas-fir framing, but kitchens sized for one
  person and a 24-inch Whirlpool range. Those closed-off galley layouts don't work for
  how most families actually cook.

  TopVolk has completed 100+ remodel projects since 2023 across Kitsap County.

  The first question on every kitchen job in 98366 is the same: is that wall between the
  kitchen and the living room load-bearing? That answer determines whether your remodel
  budget includes an LVL beam and structural engineering, or whether you're just swapping
  cabinets and running new circuits.

localContext: |
  Port Orchard's older residential blocks in 98366 — Pottery Avenue, Sidney Avenue, and
  the streets stepping down toward the Bay Street waterfront and Sinclair Inlet marina —
  were platted and built largely between 1955 and 1975. Post-and-pier foundations, Douglas-
  fir framing, original galvanized supply lines in a lot of these houses. Kitchens average
  90 to 110 square feet: enough for the appliances of 1968, not enough for a modern layout
  with a center island and a 36-inch KitchenAid range.

  Moisture is the constant.

  Kitsap County averages over 50 inches of rain annually, and Port Orchard's hillside lots
  above the marina have north-facing crawlspaces that accumulate ground moisture year-round.
  Vapor barriers in these older homes are frequently missing or deteriorated, which shows up
  as soft subfloor and rot behind lower cabinet runs — a demo surprise that changes your
  budget mid-project.

  Zip code 98367 covers the South Kitsap developments built between 1985 and 2000 —
  subdivisions around McCormick Woods and Bethel Road where floor plans are bigger but
  electrical panels are still the original 100-amp service, and builder-grade cabinets were
  never designed for semi-custom replacements. Those panels can't handle a Bosch dishwasher
  and an induction range running simultaneously. Permitting routes also differ by location:
  the City of Port Orchard Building Department handles incorporated areas in 98366, while
  Kitsap County DCD (Department of Community Development) handles unincorporated South
  Kitsap in 98367. Plan review at either AHJ runs 3–5 weeks for a full kitchen remodel
  with structural or electrical scope — and submittal requirements aren't identical between
  the two, so knowing which jurisdiction you're in before the project starts matters.

commonProblems:
  - title: "Load-Bearing Wall Removal and LVL Beam Sizing"
    description: "Opening a 1970s Port Orchard kitchen to the living room almost always
      hits a load-bearing wall. Proper removal requires engineering the right LVL beam
      span and installing post-to-foundation support before anything comes down. A typical
      opening in these homes needs a 3.5\" x 9.5\" LVL minimum — sometimes deeper
      depending on the load path. City of Port Orchard permits require a rough-in
      inspection before drywall goes back up.

      Get the beam sizing wrong and you're dealing with sagging ceilings two years later.
      That's not a warranty item — it's a structural failure."

  - title: "Electrical Panel Upgrades for Modern Kitchen Loads"
    description: "Many 98366 homes still have 100-amp service — adequate in 1972, not
      adequate today. KitchenAid induction ranges and Bosch dishwashers pull significantly
      more current, especially running together.

      Upgrading to 200-amp service is permit-required through the City of Port Orchard
      Building Department. Best scheduled as part of the kitchen rough-in so walls open
      only once. Coordinate the panel upgrade with your electrician before cabinet
      installation starts, not after — the sequencing matters."

  - title: "Cabinet Layout in Homes With Irregular Soffits"
    description: "IKEA cabinet systems work well in kitchens with clean, standard soffits.
      A lot of Port Orchard's 1960s-70s stock has low irregular soffits that require
      scribing and blocking to make upper cabinets sit flush.

      Semi-custom cabinets with adjustable heights handle this better than flat-pack.

      Skip that step and you get visible gaps at the ceiling line — something that shows
      up immediately in photos and at resale. It's also the kind of thing a home inspector
      flags on a pre-sale walkthrough."

faq:
  - q: "How fast can you get to Port Orchard for a kitchen remodel consultation?"
    a: "Port Orchard is typically 45-60 minutes depending on the Fauntleroy-Southworth
      ferry schedule or SR-16 through Gig Harbor. Free on-site consultations are available
      Tuesday through Saturday — call (206) 591-1096 to schedule directly with Vladislav,
      not a sales rep."

  - q: "Do you work with KitchenAid, Bosch, and Samsung appliances during a remodel?"
    a: "Yes — fitment and rough-in for KitchenAid ranges, Bosch dishwashers, and Samsung
      refrigerators come up regularly. Appliance specs need to be locked in early so the
      electrical and plumbing rough-in matches the actual units before cabinets get
      installed.

      Switching appliances after rough-in means reopening walls. Lock specs first."

  - q: "What does a full kitchen remodel cost in Port Orchard, and how long does it take?"
    a: "A mid-range remodel — semi-custom cabinets, quartz countertops, appliance swap,
      and electrical upgrade — typically runs $45,000–$85,000. Plan review at the City
      of Port Orchard Building Department takes 3–5 weeks; construction runs 6–10 weeks
      after permits clear.

      Vladislav is a WA Licensed Contractor. Every contract includes line-item pricing
      and a deadline penalty clause — if TopVolk misses the schedule, there's a financial
      consequence written into the agreement, not just a verbal apology.

      Call (206) 591-1096."