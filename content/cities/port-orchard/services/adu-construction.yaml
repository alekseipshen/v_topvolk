title: "Port Orchard ADU Construction — Ferry-Commute Rental Units"

answer: "TopVolk builds DADUs, AADUs, and basement-conversion ADUs in Port Orchard, WA for $130K-$220K, with permits running 4-7 months through the city or county."

intro: |
  TopVolk Construction builds detached and attached ADUs in Port Orchard for $130,000 to $220,000 depending on size and finish level, with permitting through the City of Port Orchard or Kitsap County DCD running four to seven months end to end. Vladislav Volkov has pulled permits on both sides of that line — inside city limits near Bay Street and out in unincorporated South Kitsap near McCormick Woods — and the paperwork isn't identical between the two. A lot of Port Orchard homeowners are looking at a second unit for rental income tied to the Southworth ferry commute into West Seattle, or a place for aging parents near Waterfront Park. One recent build off Tremont Street used a Mitsubishi mini-split for heat instead of running new gas line, which cut the mechanical permit down to a single trade inspection. Under WA HB 1337, most single-family lots here qualify for two ADUs — but lot coverage and the 24-foot height limit still decide what actually fits on the parcel.

localContext: |
  Port Orchard splits mostly across 98366 and 98367, and the housing stock swings hard depending on which side of Highway 16 you're on. Near downtown and the Bay Street waterfront, houses often date to the 1940s-60s with post-and-pier foundations and galvanized supply lines — a basement conversion ADU there usually means new copper or PEX before anything else gets touched. Out toward McCormick Woods and the Sedgwick Road corridor, homes run newer, 1990s-2010s construction with better insulation and forced-air systems already in place, which makes a DADU or garage conversion simpler since the electrical panel usually has room for a subpanel. Setbacks matter more in the older Retsil and Tremont neighborhoods, where lots run narrower and a detached unit has to clear both the side setback and the septic reserve area if the property isn't on city sewer. Kitsap gets roughly the same soaking as the rest of the Sound, 35-plus inches a year, so any DADU here gets a vapor barrier under the slab and PT lumber for the ledger board or any framing within 18 inches of grade.

commonProblems:
  - title: "Septic Systems Cap What You Can Build Out Past McCormick Woods"
    description: "Many South Kitsap properties run on-site septic instead of city sewer, and Kitsap Public Health requires proof the drainfield and reserve area can absorb the added bedroom load before a DADU permit moves forward. A three-bedroom house adding a one-bedroom ADU often needs a septic evaluation showing the reserve area holds, or a repair designed by a licensed septic designer — that alone can run $3,000-$8,000 before framing starts. Lots near Sedgwick Road often have systems sized tight back in the 1980s that can't absorb another bedroom without an engineered fix. If the property fronts a street with city sewer, tying in a new lateral is usually cheaper than expanding a drainfield. Either way, this question gets answered before the DADU design does."
  - title: "Sharing a Water Meter Isn't Automatic for a Second Unit"
    description: "WA HB 1337 lets you build up to two ADUs on most lots, but utility separation is still a real decision, not an afterthought. Some situations call for a separate water meter and sewer lateral for a detached rental unit; others allow a shared meter with a sub-meter and shutoff valve installed at the ADU for billing purposes. We typically run a dedicated shutoff and pressure-reducing valve near the DADU's mechanical room, tie into Moen or Kohler fixtures inside, and label everything for the final inspection. Adding a second meter through the water district can add $2,500-$6,000 and six to ten weeks to the timeline, so we check with the utility before finalizing the site plan — not after concrete is poured."
  - title: "DADU, AADU, or Basement Conversion — the Right Call Depends on the Lot"
    description: "Downtown lots near Bay Street tend to be narrow and shallow, so a basement conversion or an attached ADU (AADU) built over the garage often pencils out better than a detached unit fighting setbacks on both sides. Out in McCormick Woods and unincorporated South Kitsap, half-acre-plus lots usually have room for a full DADU up to the 24-foot height limit, as long as lot coverage and FAR stay under the zone's max. Plan review runs through City of Port Orchard Development Services if you're inside city limits, or Kitsap County DCD if you're not — the two departments don't measure setbacks quite the same way, which is why we confirm jurisdiction with a parcel lookup first. As a WA Licensed Contractor, Vladislav pulls the permits directly and sits through plan review comments himself. Expect 6-10 weeks for review on a detached unit."
  - title: "What Actually Drives ADU Cost in Port Orchard"
    description: "A detached ADU here typically runs $130,000-$220,000, and the swing has less to do with square footage than with what's under the lot. A flat McCormick Woods pad with an existing power stub costs a lot less to build than a sloped South Kitsap lot near Sinclair Inlet needing retaining work and a longer utility trench. Foundation choice matters too — a slab-on-grade DADU costs less than one on a crawlspace with a full vapor barrier and R-49 floor insulation. Finish level swings the number as well: a rental-grade build with Whirlpool or GE appliances runs leaner than one with a Bosch induction range and quartz counters for a family member. Every quote is line-item, not a range pulled from thin air, and the contract includes a penalty if we miss the completion date."
  - title: "Cedar, Hardie, or Trex — Picking Materials That Survive Kitsap Winters"
    description: "Kitsap sees the same 35-plus inches of rain a year as the rest of the Sound, and anything facing north toward Sinclair Inlet grows moss and mildew faster than a south-facing wall. Cedar siding looks right on a lot of Port Orchard ADUs but needs re-staining every 3-5 years if it's shaded; Hardie cement-board siding costs more upfront but holds paint 12-15 years and doesn't rot at the ledger board or window trim. For decks, Trex or TimberTech composite outlasts pressure-treated lumber by a decade and skips the yearly sealing. Inside, a Mitsubishi mini-split heat pump handles heating and cooling for a one-bedroom ADU on a fraction of the power a baseboard system uses, needing a filter clean twice a year. A clogged gutter over a DADU roof backs water into the fascia within a season out here."

faq:
  - q: "How fast can you get to Port Orchard for ADU Construction?"
    a: "Port Orchard sits about 15 minutes off Highway 16 from Bremerton, or a short Southworth ferry ride from West Seattle, and Vladislav handles consultations on both sides of that commute without extra trip charges. A free on-site consultation for an ADU usually happens within a week of the call, since site conditions — slope, septic versus sewer, existing panel capacity — decide the whole design before anything gets drawn. Once permits are in hand, a detached ADU build typically takes 10-14 weeks of active construction. Call (206) 591-1096 to get a date on the calendar."
  - q: "What does ADU construction cost in Port Orchard?"
    a: "A detached ADU in Port Orchard generally runs $130,000-$220,000 depending on size, foundation type, and finish level, while a basement or garage conversion (AADU) often lands lower, $70,000-$140,000, since the shell already exists. Site work — slope, septic capacity, utility trenching — moves the number more than finishes do on most lots. Appliance and fixture choices, a Whirlpool package versus a Bosch one for example, typically shift the total by $5,000-$15,000. Every estimate is a line-item quote from Vladislav directly, and it's free — call (206) 591-1096."
  - q: "Does my ADU go through the City of Port Orchard or Kitsap County?"
    a: "It depends on the parcel — inside city limits, permits run through City of Port Orchard Development Services; just outside, in unincorporated South Kitsap or near McCormick Woods, it's Kitsap County DCD. Both offices review under the same IRC base code, but setback measurement and septic sign-off differ enough that we confirm jurisdiction with a parcel lookup before designing anything. As a WA Licensed Contractor, Vladislav prepares the site plan, structural drawings, and energy code documents and submits directly — plan review typically takes 6-10 weeks for a detached ADU. Call (206) 591-1096 and we'll check your parcel's jurisdiction on the first call."
  - q: "Can a Port Orchard ADU have its own kitchen, and how is it heated?"
    a: "Yes — under WA HB 1337 a DADU can be a full independent unit with its own kitchen and bathroom, as long as it has separate smoke and CO detection and its own mechanical system. Most of our Port Orchard ADUs run a Mitsubishi mini-split for heating and cooling and a Rinnai tankless water heater instead of a standalone tank, which saves closet space in a small unit. Kitchens typically get a Bosch or GE range, semi-custom cabinets, and a Moen faucet; bathrooms get Kohler fixtures and a Schluter Kerdi waterproofing system under the tile instead of a fiberglass pan."
  - q: "How does a new ADU hold up in Kitsap's rain, and what's covered?"
    a: "Every ADU we build uses Hardie siding or well-detailed cedar, a full vapor barrier under the slab or in the crawlspace, and PT lumber anywhere framing sits within 18 inches of grade — that's what actually survives 35-plus inches of rain a year here. Workmanship issues get fixed directly by Vladislav, no subcontractor hand-off, and manufacturer warranties on windows, siding, and the mini-split carry through separately from us. The one thing we don't leave vague is scheduling — missed deadlines carry a contract penalty, so the crew doesn't sit on a punch list. Call (206) 591-1096 with questions on any specific product."
  - q: "Do you build ADUs outside Port Orchard too?"
    a: "Yes — we cover Bremerton, Gig Harbor, Silverdale, and Poulsbo along with the rest of Kitsap County, plus King, Snohomish, and Pierce counties across the Sound. Port Orchard jobs typically get scheduled within 2-3 weeks of a signed contract, faster during the winter off-season. Vladislav runs every consultation and every build personally, with 100+ projects completed since 2017 — no sales staff, no subcontracted project manager. Schedule a free consultation or call (206) 591-1096 to get on the calendar."