  - q: "Do I need a permit for a fence in Snohomish?"
    a: "Standard residential fences up to 6 feet in rear and side yards and 4 feet in front yards don't require a permit through the city, but any fence built as a retaining wall over 4 feet does need engineered plans and city plan review. TopVolk handles that submittal directly as a WA Licensed Contractor and schedules the required inspection so the job passes on the first visit. Jobs near unincorporated pockets close to Maltby may fall under Snohomish County PDS instead of the city, and TopVolk confirms which jurisdiction applies before permitting starts. Typical plan review for a retaining fence adds 2-4 weeks to the timeline."
  - q: "What's the difference between cedar, vinyl, and Trex for a Snohomish fence?"
    a: "Cedar (western red) is the traditional look and the cheapest upfront, but it needs restaining every 2-3 years and will rot at the base rail without proper drainage gravel behind the post. CertainTeed vinyl skips staining entirely and holds its color through PNW winters, though it costs more per foot and can crack in a hard impact. Trex Seclusions composite panels are popular for the horizontal slat look showing up near the Centennial Trail — no staining, better impact resistance than vinyl, and a heavier price tag than either. TopVolk brings samples of all three to the consultation so the choice isn't made off a catalog photo."
  - q: "How long does a fence actually last in Snohomish's climate?"
    a: "A cedar fence with regular staining and a solid gravel-backed footing typically lasts 15-20 years before pickets need replacing; skip the staining and rot at grade can show up in under 10. Vinyl and Trex composite fencing generally run 25-plus years with minimal upkeep, since neither absorbs the standing water that damages wood posts through the wet season. TopVolk sets every post below the frost line with a Simpson Strong-Tie base bracket regardless of material, because a failed footing takes the whole fence down with it. Workmanship issues get fixed at no charge — that's part of every contract, not a separate warranty upsell."
