title: "Snohomish Bathroom Remodel — Cast-Iron Drains to Curbless Showers"

intro: |
  First Street antiques aren't the only thing in Snohomish dating back a century. The
  residential blocks north of downtown 98290 hold early Craftsman builds with cast-iron
  drain stacks, galvanized supply lines, and single-vanity bathrooms fitted with 40-year-old
  Kohler fixtures nobody has replaced. Add 37 inches of annual rainfall and those
  north-facing tile walls develop mildew faster than grout sealer can stop it. TopVolk
  has been taking these apart and rebuilding them properly since 2023.

localContext: |
  Most of the older housing in 98290 sits within a mile of the Snohomish River —
  Douglas-fir framing, post-and-pier foundations, and wall cavities that collect moisture
  for decades without visible signs. Subdivisions off Bickford Avenue and out toward
  Cathcart run 1980s–2000s ranchers where builder-grade fixtures have finally reached
  end-of-life. Both eras need waterproofing done correctly before a single tile goes in,
  and both pull permits through either the City of Snohomish or Snohomish County PDS
  depending on the lot.

commonProblems:
  - title: "Cast-iron drain stacks and galvanized supply lines in pre-1960 Craftsman homes"
    description: |
      Downtown-adjacent 98290 homes built before 1960 typically still have cast-iron drain
      stacks corroding from the inside out. Converting a cramped tub alcove into a walk-in
      shower means cutting the subfloor, resizing the p-trap, and scheduling a rough-in
      inspection with the AHJ before any Schluter Kerdi membrane or tile can go in. Moen
      pressure-balance rough-in valves are the right fit for these conversions — they handle
      the older supply line sizing without adapter gymnastics.
  - title: "Waterproofing failures behind original tile in PNW moisture conditions"
    description: |
      Many 1950s–1970s Snohomish bathrooms were tiled directly over drywall — no vapor
      barrier, no waterproofing membrane. PNW humidity works through grout lines and into
      the wall cavity quietly for years. Tearing out the old tile and applying RedGard or
      Schluter Kerdi over cement board before the new large-format porcelain goes in breaks
      that cycle. Skip this step and the mold returns in three to five years regardless of
      how nice the new tile looks.
  - title: "Low-CFM bath fans venting into attic — a code violation common in Bickford-area ranchers"
    description: |
      Tract builds off Bickford Avenue and Maple Avenue share a consistent detail: bath fans
      exhausting directly into the attic rather than through the roof. Snohomish County PDS
      flags this on permit inspections, and it causes real mold problems in a climate with
      months of consecutive wet weather. Replacing the fan with a properly ducted Broan or
      Panasonic unit and adding blocking at the rim joist fixes both the code issue and the
      ventilation problem in one scope of work.

faq:
  - q: "How fast can you get to Snohomish for a bathroom remodel estimate?"
    a: |
      Snohomish sits about 35 minutes northeast of Seattle via US-2 — straightforward from
      our usual King and Snohomish County work zone. Call (206) 591-1096 to schedule a free
      on-site walkthrough with Vladislav directly. Most initial estimates happen within a
      week of first contact.
  - q: "Do you work with Kohler and Moen fixtures, or does the homeowner source their own?"
    a: |
      Both approaches work. TopVolk installs Kohler, Moen, and Delta fixtures regularly and
      can source them. If you have a specific product in mind — a Kohler curbless shower
      system, a Moen thermostatic valve, a Delta widespread vanity faucet — bring the model
      number and we build the estimate around it. No markup games on materials.
  - q: "What does the permit process look like for a bathroom remodel in Snohomish, and how long does the project take?"
    a: |
      Plumbing changes or structural work require a permit through the City of Snohomish
      permit center or Snohomish County PDS for unincorporated lots. Plan review typically
      runs 3–6 weeks for a bathroom scope. Construction time after permits clear: a
      single-bathroom remodel with layout reconfiguration runs 5–8 weeks. A full master
      bath conversion with a curbless shower, new vanity, and tile runs 7–10 weeks. Call
      (206) 591-1096 to walk through your specific scope — Vladislav gives line-item quotes,
      not ranges.