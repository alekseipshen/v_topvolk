title: "Snohomish Plumbing — Galvanized & Polybutylene Repipe Experts"

answer: "TopVolk Construction repipes galvanized and polybutylene lines and installs tankless water heaters in Snohomish, WA — owner-led, 100+ projects since 2017."

intro: |
  A pinhole leak under the kitchen sink in a house near Bickford Park usually means one thing: the galvanized steel pipe feeding that fixture has corroded down to paper-thin walls after sixty-plus years of mineral buildup. Snohomish's older housing stock — a lot of it clustered around Historic Downtown Snohomish and dating back toward the early 1900s — still runs original galvanized supply lines, while newer builds pushed out toward Maltby in the 1980s often have polybutylene piping that fails at the fittings without much warning. TopVolk Construction repipes both types with PEX or copper, converts aging tank water heaters to Rinnai or Navien tankless units, and handles fixture swaps — Moen, Kohler — during bathroom and kitchen remodels near the Snohomish River. Vladislav Volkov walks every job site personally; there's no sales rep quoting a range over the phone and no dispatcher juggling three trucks. Call (206) 591-1096 and get a line-item quote based on what's actually behind the wall, not a guess.

localContext: |
  Snohomish splits pretty clearly into two building eras. Around 98290, near downtown and Bickford Park, houses built before 1960 typically still have galvanized steel supply lines and some original cast iron drain runs — both due for replacement or already leaking at the threads. Out toward 98296 and the Maltby corridor, homes from the 1980s and 90s often used polybutylene pipe with gray plastic fittings, a material that cracks internally and rarely gives visible warning before a wall or ceiling leak shows up. Snohomish County PDS issues permits for water heater replacements and any repiping that touches structural framing, and WA state code requires seismic strapping on tank water heaters — a step some older installs never got. Add in the Pacific Northwest's wet season, October through May, and any slow drain leak under a crawlspace floor turns into mold and rot fast if it isn't caught early.

commonProblems:
  - title: "Galvanized Pipe Corrosion Reducing Water Pressure"
    description: "Homes built before 1960 near Historic Downtown Snohomish often still run original galvanized steel supply lines, and mineral scale builds up on the inside diameter until a 3/4-inch pipe is functioning like 3/8-inch. Residents usually notice it as weak shower pressure or rust-colored water after the city flushes hydrants nearby. The fix is a full repipe with PEX-A tubing run through the existing stud bays, or copper where it's exposed in a basement or crawlspace. A whole-house repipe on a 1,500 sq ft home typically runs $6,500-$11,000 depending on how many fixtures and how much drywall patching it takes, and most jobs finish in 3-5 working days."
  - title: "Polybutylene Pipe Failure in 1980s Homes"
    description: "Gray polybutylene pipe with plastic or crimped-copper fittings shows up in a lot of houses built in the Maltby area and other 1980s-90s Snohomish subdivisions. Chlorine in city water breaks the material down from the inside over decades, and failures usually happen at the fitting, not along the pipe run, which makes them hard to spot during a routine inspection. A leak behind a wall during our wet season — heavy rain October through May — can sit undetected in a crawlspace for weeks before anyone smells mildew. Full replacement with PEX and SharkBite or crimp-ring fittings runs roughly $5,500-$9,000 for an average 3-bed, 2-bath layout, and insurance sometimes covers part of it if there's documented water damage."
  - title: "Water Heater Replacement Without Seismic Strapping"
    description: "Washington state plumbing code requires seismic strapping on every tank-style water heater, and a surprising number of older Snohomish homes still have units installed without it, or with strapping that's rusted through. Swapping to a Rinnai or Navien tankless unit means resizing the gas line too, since tankless units pull more BTUs on demand than a standard 40-gallon tank. Snohomish County PDS requires a permit for water heater replacement, and TopVolk pulls that permit, schedules the rough-in inspection, and handles the final sign-off so the homeowner isn't the one on the phone with the county. Most water heater swaps, tank or tankless, get scheduled and completed within a week of the initial site visit."
  - title: "Drain Line Rerouting for Remodeled Kitchens and Basements"
    description: "Adding a kitchen island or finishing a basement bathroom means moving drain lines, and that's where cost varies the most — it depends on how far the new fixture sits from the existing stack and whether a sewage ejector pump is needed for a below-grade bathroom. A basement bathroom drain reroute in Snohomish typically runs $3,000-$7,000 including the ejector pit and check valve; a kitchen island sink move, cutting through a slab or subfloor, runs $1,800-$3,500. TopVolk quotes these with exact line items — pipe, fittings, labor, patching — not a vague range. Every job includes a workmanship warranty, and missed deadlines come with a penalty written into the contract."
  - title: "High Water Pressure Wearing Out Fixtures Early"
    description: "Some Snohomish properties on city water run above 80 psi at the meter, which shortens the life of everything downstream — supply lines, toilet fill valves, and especially Moen or Kohler shower cartridges that aren't rated for sustained high pressure. A pressure-reducing valve installed at the main, usually a Watts or Wilkins model, brings that down to the 50-60 psi range plumbing fixtures are built for. It's a half-day install in most homes and runs $450-$750 installed. Skipping this step tends to show up two or three years later as a failed cartridge or a burst supply line — a cheap fix now versus water damage later."

