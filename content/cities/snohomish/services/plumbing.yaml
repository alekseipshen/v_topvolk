  - q: "Should I switch to a tankless water heater?"
    a: "If your current tank unit is past 10-12 years old or you're constantly running out of hot water, a tankless conversion — Rinnai or Navien are the two most common brands installed in Snohomish homes — solves both problems and takes up a fraction of the closet space. The catch is gas line sizing: most tankless units need a larger gas line than what feeds an old 40-gallon tank, so that gets upsized during install. Electric tankless options exist for homes without gas service. A straight conversion typically takes one full day including the permit inspection."
