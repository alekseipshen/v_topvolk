title: "Snohomish Home Additions — ADUs & Second-Story Builds"

answer: "TopVolk Construction designs and builds permitted additions, DADUs, and second stories in Snohomish, Washington — 100+ projects completed since 2017."

intro: |
  Adding a second story or a backyard DADU almost always pencils out cheaper than buying a bigger house in Snohomish's resale market, and TopVolk Construction has permitted and framed additions like these across the city since 2017, with Vladislav Volkov running each job personally. A lot of the calls come from the older farmhouse lots near downtown's First Street historic core, where a 1910 bungalow might have a detached garage sitting on a footprint that's perfect for a DADU conversion. Others come from families near Averill Park who've outgrown a three-bedroom rancher and need a second story instead of a bigger lot they can't find. One recent job off Maple Avenue involved framing a mother-in-law suite with its own Rinnai tankless water heater and a separate entrance, so the parent moving in wasn't sharing a kitchen with the rest of the house. TopVolk handles the structural engineering, the permit set, and the framing crew coordination directly — call (206) 591-1096 for a walkthrough before you commit to a design.

localContext: |
  Housing stock in Snohomish splits pretty cleanly by era. Down in the 98290 core near First Street and the Blackman House Museum, you'll find early-1900s farmhouses and Craftsman-style homes with post-and-pier foundations that need sistered joists and new footings before they can carry a second story's point loads. Out toward 98296 and the Maltby/Clearview edge, it's newer split-levels and 1980s-90s tract homes with standard 2x6 Douglas-fir framing — easier to tie a DADU's electrical panel into, but often sitting on smaller lots where setback and lot coverage limits cap how big an addition can get. Additions inside city limits go through the City of Snohomish's Community & Economic Development Department for plan review; anything just outside city limits, toward the county pockets near the Snohomish River, falls under Snohomish County PDS instead, and floodplain maps along the river add an extra layer of review for DADUs near grade. Winters here mean a lot of rain hitting a partially-framed addition, so TopVolk sequences dry-in — sheathing, house wrap, roofing — before rough-in ever starts.

commonProblems:
  - title: "DADU Foundations on Old Farmhouse Lots Need New Footings"
    description: "Farmhouses built before 1920 near downtown Snohomish usually sit on post-and-pier foundations — cedar or fir posts resting on concrete pads, no continuous footing. That works for a single story, but a DADU or an addition tied into the main house needs a proper stem wall or spread footings sized for the new point loads. TopVolk has pulled permits on Maple Avenue and Pine Avenue lots where the existing piers had rotted below grade from decades of PNW rain wicking up through untreated wood. The fix is a new perimeter footing poured to frost depth, PT lumber mudsills, and joist hangers rated for the actual span — not whatever got nailed in during the 1950s. Foundation work like this typically adds $12,000-$25,000 to a DADU budget depending on soil conditions and site access."
  - title: "Second-Story Additions and Existing Foundation Capacity"
    description: "A second-story addition puts new loads straight down through walls that were never designed to carry them. Most Snohomish ranchers and split-levels built in the 60s through the 80s used 2x6 or 2x8 floor joists sized for one story of live load, nothing more. Before framing starts, TopVolk brings in an engineer to run the numbers and usually specifies an LVL beam or PSL post at key bearing points to carry the new roof and floor loads down to the foundation. Sometimes that means sistering joists in the crawlspace; sometimes it means a new footing under an existing pier. Skipping this step is how additions end up with bouncy floors or cracked drywall two winters later. Structural engineering and permit-ready calcs typically run $2,500-$4,500 as part of the addition package, and it's non-negotiable for anything load-bearing."
  - title: "Permit Timelines Through City of Snohomish vs. County PDS"
    description: "Permit review inside Snohomish city limits goes through the Community & Economic Development Department, and plan review on a second-story addition or DADU usually runs 6-10 weeks depending on the backlog. Projects just outside city limits route through Snohomish County PDS instead, which has its own queue and sometimes an extra SEPA checklist if the lot backs up to a critical area near the river. TopVolk prepares the full plan set, structural calcs, and site plan showing setbacks and lot coverage before submitting, so the AHJ isn't kicking the application back for missing documents. Under WA HB 1337, most single-family lots in Snohomish qualify for up to two ADUs — a DADU and an AADU, or two DADUs on larger parcels — which opens up options that weren't legal here before 2024. TopVolk is a WA Licensed Contractor and handles the permit runner work directly, no separate expediter fee."
  - title: "What Drives the Cost of a Snohomish Home Addition"
    description: "Home additions in Snohomish typically run $180-$300 per square foot depending on foundation type, roofline complexity, and whether utilities need to be extended. A flat-roof DADU with a simple stem wall foundation comes in on the low end; a second-story addition matching a steep Craftsman roofline with cedar shake or Hardie siding to blend with the original house runs higher because of the tie-in framing and finish carpentry. Kitchen and bath rough-ins inside a mother-in-law suite — a Kohler or Moen fixture package, a Bosch or KitchenAid appliance suite sized for a smaller unit — add another $15,000-$30,000 depending on finish level. TopVolk gives line-item quotes, not a lump number, so homeowners can see what the framing, MEP rough-in, and finish work each cost. Every contract includes a deadline penalty clause — if a phase runs past the agreed date without a documented reason, TopVolk pays out of pocket."
  - title: "Matching Old Siding and Rooflines When You Add a Story"
    description: "Additions built onto older Snohomish homes need to survive the same freeze-thaw and rain cycles as the original structure, so material choices matter more than they would somewhere drier. TopVolk specs Hardie cement-board siding over the addition instead of cedar lap siding on north-facing walls, since cedar picks up moss and needs re-staining every 3-4 years out here while Hardie holds paint for 12-15. For HVAC, tying a new zone into an old forced-air system usually means undersized ductwork, so most additions get a Mitsubishi mini-split instead — one head in the new bedroom or in-law suite, no ductwork modification needed. R-49 insulation in the new roof assembly and a proper vapor barrier in any crawlspace addition keep energy bills close to what the original house ran before the footprint doubled."

faq:
  - q: "How fast can you get to Snohomish for Home Additions?"
    a: "Snohomish sits just off US-2 and SR 9, roughly 25-30 minutes from TopVolk's usual service radius depending on traffic through Monroe or Everett. Vladislav handles the free on-site walkthrough himself, usually within a few days of a call, and most jobs get a written estimate within a week of that visit. Once permits clear, framing crews are typically on-site within 2-3 weeks of mobilization, weather and material lead times permitting. Call (206) 591-1096 to get a walkthrough scheduled — there's no sales rep, so you're talking directly to the person running the job."
  - q: "What does a home addition in Snohomish cost?"
    a: "Most additions here land between $180 and $300 per square foot, so a 600 square-foot DADU runs roughly $130,000-$180,000 all-in, while a second-story addition on an existing footprint can come in lower per square foot since the foundation's already there. Site access, soil conditions for new footings, and finish level — semi-custom cabinets versus IKEA cabinets in a mother-in-law suite kitchen — move the number up or down. TopVolk provides a line-item quote after the on-site walkthrough, not a rough range over the phone. Ask for the free estimate when you call (206) 591-1096."
  - q: "What's the permit process like for an addition in Snohomish?"
    a: "Inside city limits, plans go through the City of Snohomish's Community & Economic Development Department, with review typically taking 6-10 weeks for a second-story addition or DADU once the full set — architectural, structural, site plan — is submitted. Lots outside city limits route through Snohomish County PDS instead, and river-adjacent parcels sometimes need an extra floodplain review. TopVolk prepares and submits the complete package, including structural calcs for any LVL beam or PSL post work, and tracks the application through plan review, rough-in inspection, and final inspection. TopVolk is a WA Licensed Contractor, so the paperwork is filed under that license, not a subcontractor's."
  - q: "Can I add a second ADU under the new Washington law?"
    a: "Yes — WA HB 1337, effective 2024, allows up to two ADUs on most single-family lots in Snohomish, whether that's a DADU plus an AADU or two detached units on a larger parcel. Height limits for a DADU typically max out around 24 feet, and lot coverage limits still apply, so TopVolk checks the specific zoning on your parcel before drawing anything up. Each ADU needs its own utility connection or a properly sized shared service, plus a separate meter in most cases. TopVolk has used pre-approved plan sets on some Snohomish lots to shave weeks off the design phase."
  - q: "How long do these additions last, and what's covered?"
    a: "Framing built to current IRC code with Douglas-fir lumber and proper flashing detail should outlast the original house's remaining service life, easily 50+ years with normal maintenance. Hardie siding on the addition carries a 30-year manufacturer warranty against rot and cracking, and TopVolk backs the workmanship on framing, roofing tie-ins, and MEP rough-in for a set period after final inspection — ask Vladislav for the specifics on your contract. What's not covered is damage from skipped maintenance, like clogged gutters backing water up under new roofing. Regular gutter cleaning and re-caulking window flashing every few years keeps the addition performing the way it was built."
  - q: "Do you cover areas near Snohomish, and how far out do you schedule?"
    a: "TopVolk covers Snohomish alongside Monroe, Lake Stevens, Everett, Mill Creek, and the rest of Snohomish County, plus King, Pierce, and Kitsap counties. Scheduling for a full addition — from the first walkthrough to a signed contract — usually takes 2-4 weeks, and that's before permit review starts, so plan on 4-7 months end-to-end for a DADU including permitting and construction. Smaller in-law suite conversions inside an existing garage move faster. Call (206) 591-1096 to get on the schedule or ask about current lead times."