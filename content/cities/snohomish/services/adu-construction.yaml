title: "Snohomish ADU Construction — DADUs for River-Lot Homes"

answer: "TopVolk Construction builds permitted DADUs and AADUs in Snohomish, WA — owner-led, 100+ projects since 2017, deadline penalties written into the contract."

intro: |
  Two accessory dwelling units per single-family lot became legal almost everywhere in Washington the moment HB 1337 took effect, and Snohomish homeowners in zip codes 98290 and 98296 have been calling about backyard rentals and mother-in-law units ever since. TopVolk Construction, run directly by Vladislav Volkov, has built more than 100 projects across the Puget Sound area since 2017, including detached ADUs on flood-zone lots near the Snohomish River where a standard slab foundation isn't an option. A lot near the Blackman Historic District might need a pier-and-beam foundation with pressure-treated posts to clear the base flood elevation, while a newer subdivision off the Hill has plenty of room for a slab-on-grade DADU with a Mitsubishi mini-split for heat. Homeowners near Jackson Park and the Centennial Trail ask the same question first: detached unit, attached addition, or basement conversion? The right answer depends on your lot, your foundation, and what the City of Snohomish permit desk will actually approve.

localContext: |
  Snohomish's housing stock splits pretty cleanly into two eras: Victorian and Craftsman homes built between 1890 and 1915 in the historic downtown core near Blackman House Museum, and mid-century to 1980s ranch and split-level homes further out toward 98296. The older homes on post-and-pier foundations with crawlspaces make basement conversions tough — ceiling height rarely clears code, and knob-and-tube wiring still turns up in houses that haven't been touched since the 1950s. Lots that back up to the Snohomish River floodplain fall under FEMA flood zone rules, which means an elevation certificate, flood vents in the crawlspace, and sometimes a pier foundation instead of a standard footing for any new DADU. Property inside city limits goes through the City of Snohomish Building Division, while a handful of unincorporated pockets near the edges of town fall under Snohomish County PDS instead — two different permit counters, two different timelines. Setbacks matter here too: HB 1337 caps how much a city can restrict DADU placement, but Snohomish still enforces its own height limit (24 feet) and lot coverage rules on top of that.

  Rain is the other constant. Snohomish gets well over 35 inches a year, and moss builds up fast on north-facing roofs and siding near the river bottom, so drainage detailing around a new DADU foundation matters as much as the framing itself. Homes near the Hill and out toward 98296 tend to sit on better-draining soil than the flat lots down near downtown, which affects whether we recommend a full perimeter drain or just standard footing drains. Either way, the goal is the same: keep water moving away from the crawlspace and off the ledger board where the new structure ties into an existing deck or porch.

commonProblems:
  - title: "Building on a floodplain lot near the Snohomish River"
    description: "A chunk of Snohomish sits inside FEMA-mapped flood zones along the river, and that changes the whole foundation plan for a DADU. Instead of a standard slab, we're often building on a pier-and-beam system with pressure-treated (PT) 6x6 posts, PT rim joist, and joist hangers rated for wet-service conditions, with the finished floor set above base flood elevation. That adds elevation certificate costs ($800-$1,500) and usually a few extra plan review weeks. Skip this step and the county won't sign off on final inspection — we've had homeowners come to us after another contractor's permit got rejected for exactly this reason."
  - title: "Deciding between a DADU, an AADU, and a basement conversion"
    description: "Craftsman homes near the Blackman Historic District often have crawlspaces, not full basements, which rules out a basement conversion before we even look at square footage. An attached ADU (AADU) works better on a lot with an existing bump-out or garage that can be reframed with an LVL beam to open up the space, while a detached ADU (DADU) makes sense on the larger lots common further from downtown. We walk the lot, check setbacks and FAR against City of Snohomish zoning, and give you a real number for each option instead of guessing. Most homeowners are surprised a DADU pencils out cheaper per square foot than converting a cramped crawlspace."
  - title: "Getting through the City of Snohomish permit process without delays"
    description: "Snohomish's Building Division runs its own plan review separate from Snohomish County PDS, and DADU submittals need a site plan, structural drawings stamped by an engineer, and a separate utility plan showing water/sewer connection. Plan review typically runs 6-10 weeks here, longer if the lot touches the flood zone and needs a floodplain development permit on top of the building permit. We handle the submittal, respond to plan review comments, and schedule the rough-in and final inspections — Vladislav manages this directly, so there's no middleman relaying corrections back and forth. TopVolk is a WA Licensed Contractor and puts deadline penalties in writing in the contract."
  - title: "Understanding what actually drives ADU cost in Snohomish"
    description: "A detached ADU here typically runs $180,000-$240,000 depending on size, finish level, and foundation type — a pier foundation on a flood-zone lot costs more than a standard slab. Utility separation is another line item: a shared water meter with a sub-meter is cheaper upfront than trenching a new sewer lateral to the street. Finish choices swing the number too — semi-custom cabinets and quartz counters cost more than IKEA cabinets with laminate, and a Rinnai tankless water heater plus a Mitsubishi mini-split for heat/AC adds a few thousand over baseboard heat. We give line-item quotes, not a range, so you know what you're paying for before signing."
  - title: "Picking materials that hold up through Snohomish winters"
    description: "The Snohomish Valley gets fog and standing moisture off the river on top of the usual 35+ inches of rain a year, so siding choice matters more here than in drier parts of the county. Hardie fiber-cement siding resists rot and moss better than cedar on north-facing walls, and Trex composite decking on a DADU porch skips the yearly re-staining a wood deck needs. Inside, we run R-49 insulation in the attic and a proper vapor barrier in any crawlspace to keep humidity from creeping into the framing. Expect Hardie siding to last 30+ years with minimal upkeep; a cedar-sided unit needs restaining every 3-5 years to keep the moss off."

faq:
  - q: "How fast can you get to Snohomish for ADU construction?"
    a: "Snohomish sits just off Highway 9 and Highway 522, about 30-40 minutes from our other job sites around Everett and Lake Stevens, so scheduling a site visit usually happens within a few days of your call. Once a project starts, crews and subs are on-site consistently rather than bouncing between far-flung jobs. Call (206) 591-1096 and Vladislav will set up a free on-site consultation to walk your lot and talk through DADU vs AADU options before you commit to anything."
  - q: "What does a detached ADU cost in Snohomish?"
    a: "Most DADUs here run $180,000-$240,000 depending on square footage, foundation type, and finish level — a pier foundation for a flood-zone lot costs more than a standard slab-on-grade build. Kitchen appliances, cabinet grade (IKEA vs semi-custom), and whether you add a Rinnai tankless water heater or a Navien combi unit all move the number. We provide a line-item quote after the site visit, not a vague range, so you can see exactly where the money goes. Call (206) 591-1096 for a free estimate specific to your lot."
  - q: "How does the City of Snohomish permit process work for ADUs?"
    a: "Property inside city limits goes through the City of Snohomish Building Division, which requires a site plan, engineer-stamped structural drawings, and a utility plan; plan review typically takes 6-10 weeks. A handful of unincorporated lots near the edge of town fall under Snohomish County PDS instead, with a similar but separate process. If your lot touches the river floodplain, add a floodplain development permit and an elevation certificate to the stack. TopVolk is a WA Licensed Contractor and handles the full submittal and inspection scheduling directly with Vladislav."
  - q: "Do we need a separate water and sewer connection for the ADU?"
    a: "Not always — WA HB 1337 allows shared utility connections for DADUs in many cases, which saves the cost of trenching a new sewer lateral to the street. We typically install a sub-meter off the existing water line and route sewer to tie into the main house's lateral where the slope allows it. If the lot layout or Snohomish's local rules require a separate connection, we scope that cost upfront in the quote rather than as a change order later. Either way, it's decided during the site visit, not after permits are pulled."
  - q: "What's the expected lifespan of the materials used in a Snohomish ADU build?"
    a: "Hardie fiber-cement siding is rated for 30+ years and handles the river valley's fog and moisture better than cedar, which needs restaining every few years to keep moss from taking hold on north-facing walls. Trex composite decking skips the yearly maintenance a wood deck needs and holds up well through freeze-thaw swings in colder months. Mechanical equipment like a Mitsubishi mini-split or Rinnai tankless water heater typically carries a 10-12 year manufacturer warranty, and our workmanship is backed by the contract terms Vladislav signs directly with you."
  - q: "Do you build ADUs outside Snohomish too?"
    a: "Yes — TopVolk covers Snohomish County along with King, Pierce, and Kitsap counties, including Monroe, Lake Stevens, Marysville, and Everett. Scheduling windows run 4-7 months end-to-end for a full DADU once permits are in, and site visits are usually booked within a week of your call. Call (206) 591-1096 to get on the schedule or ask about a free consultation for a lot in any of these areas."