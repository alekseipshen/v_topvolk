title: "Snohomish General Contracting — Historic Stock, Real Permits"

intro: |
  Historic First Street in 98290 sits three blocks from the Snohomish River, and the houses nearby — many framed between the 1890s and 1920s — are some of the most structurally complex renovation work in Snohomish County. Pull one wall in a house like that and you find post-and-pier foundations, galvanized supply lines, and original knob-and-tube wiring sitting behind a KitchenAid-equipped kitchen that was updated in the 1990s but never touched the structure underneath. General contracting here means planning around what's already there, not just what the drawings show.

localContext: |
  The residential mix in 98290 runs from Victorian and Craftsman homes concentrated near downtown Snohomish to mid-century ranchers built through the 1960s and 70s spreading east toward Cathcart. Most pre-1930 stock uses Douglas-fir framing that holds up well — but galvanized-to-copper plumbing retrofits, panel upgrades, and foundation reinforcement are common discoveries once demo starts. City of Snohomish runs its own permit center for addresses inside city limits; unincorporated parcels nearby go through Snohomish County PDS, each with its own plan review queue and inspection scheduling.

commonProblems:
  - title: "Load-Bearing Surprises Inside Pre-War Walls"
    description: "Homes built before 1930 near Snohomish's downtown core typically have no structural drawings. Opening a wall to reconfigure a kitchen or relocate a Bosch range hood often reveals a load-bearing member right where you planned the opening. Installing an LVL beam mid-project is a $4K-$8K line item that wasn't in the original budget. We scope structural conditions before demo, not during."
  - title: "Multi-Trade Scheduling Breaking Down Mid-Project"
    description: "Framing, electrical rough-in, plumbing rough-in, and HVAC ductwork have to sequence correctly or crews are waiting on each other. City of Snohomish rough-in inspections currently run 3-5 business days for scheduling. Without a GC actively managing the AHJ inspection calendar and subcontractor availability, a planned 10-week remodel drifts to 15 weeks and costs more in carrying time."
  - title: "Permit Submittals That Stop at Plan Review"
    description: "An addition or DADU in 98290 submitted with missing setback dimensions, incomplete FAR calculations, or IRC egress violations goes straight to a correction letter — adding weeks to an already 4-8 week review cycle. Most delays we've seen came from incomplete drawings submitted without a contractor's review. Catching those gaps before the submittal is faster and cheaper than responding to corrections after."

faq:
  - q: "How far is TopVolk from Snohomish, and do you serve 98290?"
    a: "Snohomish is a regular service area — roughly 35-40 minutes from our King County base via US-2 or Highway 9. Vladislav does the initial site walkthrough himself. Call (206) 591-1096 to schedule a free on-site consultation."
  - q: "Do you handle appliance coordination during a kitchen renovation?"
    a: "Yes. We schedule GE, KitchenAid, Bosch, or Samsung appliance delivery to land after the rough-in inspection clears — not before. Delivery timing and utility hook-up get written into the project schedule so units aren't sitting in your garage for three weeks."
  - q: "What does a full remodel cost in Snohomish, and how long does it take?"
    a: "Scope drives both numbers. A kitchen and two-bath gut remodel in a 1960s Snohomish rancher typically runs $120K-$180K and takes 10-16 weeks after permits clear. We provide line-item bids, not ranges. Call (206) 591-1096 or schedule a free walkthrough — Vladislav comes out, not a salesperson."