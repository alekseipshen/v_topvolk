title: "Snohomish Deck Installation — Built for the River Valley"

intro: |
  Victorian homes along First Street in 98290 sit on lots where the Snohomish River valley
  channels fog and rain from October through May — longer exposure than elevated sites further
  east toward Monroe. Composite boards like Trex hold up in that kind of sustained moisture far
  better than cedar, but the framing underneath still needs proper ledger flashing and
  ground-contact PT lumber or rot follows regardless. Lord Hill Regional Park draws outdoor-
  minded families to this part of the county; those lots have the space for a deck that's
  actually built for the climate.

localContext: |
  The 98290 zip takes in most of Snohomish's older residential stock — Craftsman bungalows
  and Victorian two-stories built between 1890 and 1920, concentrated on the blocks near
  Avenue B and the First Street historic district. Post-and-pier foundations on those older
  homes shift more than a modern slab, which changes how ledger boards attach to the existing
  rim joist. Newer subdivisions east of downtown toward the Highway 2 corridor run mid-1990s
  to early-2000s construction — better structural baseline, but City of Snohomish building
  department plan review still applies before any deck framing starts.

commonProblems:
  - title: "Cedar Turning Gray and Mossy in the River Valley Climate"
    description: >
      Untreated cedar on a north-facing deck in Snohomish grays and collects moss within two
      to three wet seasons. The river valley traps humidity longer than higher-elevation sites
      in the county. TimberTech composite cap boards cut out the annual seal-and-stain cycle —
      and the cap composite surface resists the UV and sustained moisture that destroys bare
      wood grain on 98290 properties.

  - title: "Post Footings Undersized for Saturated Soil and Frost Depth"
    description: >
      Footings need to clear the frost line — 12 to 18 inches in Snohomish County — and bear
      on undisturbed soil, not the saturated top layer common near the river corridor.
      Ground-contact PT lumber rated UC4B handles wet-soil conditions at grade, but footing
      diameter and depth still need to be specced for the actual load. AHJ inspection confirms
      depth before concrete is placed.

  - title: "Ledger-to-Rim-Joist Rot on Homes Near the Historic Downtown"
    description: >
      The ledger board connecting a deck to the house is the most common rot point on 1890s–
      1920s homes near Snohomish's First Street district. Without Z-flashing and Vycor tape
      over the rim joist, water tracks behind the ledger and stays wet for months. On houses
      this old, the rim joist itself is sometimes already compromised before the deck project
      even starts.

faq:
  - q: "How fast can you get to Snohomish for Deck Installation?"
    a: >
      Snohomish sits about 35 miles northeast of Seattle via US-2 — on-site estimate typically
      scheduled within 2–3 business days. Vladislav handles the visit directly, no salesperson.
      Call (206) 591-1096 to set a time.

  - q: "What deck material holds up best in Snohomish — Trex, TimberTech, or cedar?"
    a: >
      Both Trex and TimberTech composite outlast cedar here for moisture and moss resistance.
      Cedar still works with annual maintenance — seal every year or expect to replace boards
      in 8–10 years. The framing below needs ground-contact PT lumber and proper rim joist
      flashing regardless of which decking material goes on top.

  - q: "How long does a deck permit take in Snohomish and what does the process involve?"
    a: >
      City of Snohomish building department handles permits inside city limits — plan review
      typically runs 3–6 weeks for a standard attached deck. Ledger attachment and footing
      inspections are required milestones before framing continues. TopVolk handles permit
      submittal as part of the project scope. WA Licensed Contractor, 100+ projects completed
      since 2017. Deadline penalties are written into the contract — not a verbal promise.