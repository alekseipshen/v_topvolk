title: "Snohomish Kitchen Remodel — Craftsman to Open-Concept"

intro: |
  Down the streets behind Snohomish's 1st Street antique district, most kitchens haven't
  changed since the homes were built. Craftsman bungalows from 1910-1925 and 1960s
  ranch-style builds came with closed, narrow layouts — functional for that era, awkward
  for how families cook together now. Dropping in a new KitchenAid range is simple.
  Getting to an open layout behind it takes a permit through the City of Snohomish,
  structural work, and usually an LVL beam where a bearing wall used to stand.

localContext: |
  Zip code 98290 covers most of the city, and the older residential streets between
  Avenue D and the Snohomish River run heavily pre-war and mid-century. Craftsman houses
  near downtown have original Douglas-fir framing, galvanized plumbing, and kitchens
  sized for a 1920s household. The 1960s-70s ranch-style homes are single-story with
  load-bearing partitions between kitchen and living area, plus original 100-amp panels
  that can't carry a modern induction range without a service upgrade.

commonProblems:
  - title: "Load-bearing walls blocking open-concept layouts in 1960s ranch homes"
    description: >
      Most ranch-style homes built in Snohomish between 1958 and 1975 have a bearing wall
      between the kitchen and living area. Removing it requires a City of Snohomish permit,
      a structural assessment, and an LVL beam sized for the span — typically 4–6 inches wide
      depending on load. Joist hangers, flush beam installation, and rough-in inspection
      before close-in are required steps, not optional ones.

  - title: "Undersized electrical panels blocking induction and modern appliance installs"
    description: >
      A KitchenAid or GE induction range needs a dedicated 40–50 amp, 240V circuit. Original
      100-amp panels in 98290 ranch homes have no room for that breaker once you account for
      HVAC, water heater, and laundry loads. A 200-amp service upgrade is usually necessary
      before rough-in on the kitchen circuits — that's a separate electrical permit and
      inspection from the City of Snohomish, and typically adds $2,000–$3,500 to the budget.

  - title: "Subfloor moisture damage under Craftsman-era post-and-pier foundations"
    description: >
      Pre-war Craftsman homes near downtown Snohomish sit on post-and-pier foundations with
      crawlspaces that collect moisture through the wet season — October through May.
      Pull up original linoleum and the subfloor is often soft, requiring sistered joists and
      a DriCore panel layer before new tile or hardwood can go down. A Bosch dishwasher also
      needs a level, solid subfloor for its leveling feet and door seal to work correctly.

faq:
  - q: "How fast can you get to Snohomish for a kitchen remodel consultation?"
    a: >
      About 35–40 minutes from the Eastside via Highway 522, or north from Monroe. Vladislav
      comes out personally — not a sales rep. Free on-site visit, no obligation.
      Call (206) 591-1096 to schedule.

  - q: "What cabinet lines do you typically use for Snohomish kitchen remodels?"
    a: >
      Most homeowners in 98290 land on semi-custom cabinets from KraftMaid or Merillat, or
      IKEA boxes with custom fronts for tighter budgets. Full custom is available for the right
      scope. At the consultation, Vladislav walks through cost, lead time, and what each option
      looks like with a Bosch dishwasher panel-front integration.

  - q: "How long does a kitchen remodel take in Snohomish, including permits?"
    a: >
      City of Snohomish plan review for work with structural changes typically runs 3–5 weeks.
      Build time after permit approval: 6–9 weeks for a full gut remodel — demo, rough-in
      inspection, cabinet install, countertops, finish work, punch list. WA Licensed Contractor.
      100+ projects completed since 2023. Call (206) 591-1096 for a realistic scope review.