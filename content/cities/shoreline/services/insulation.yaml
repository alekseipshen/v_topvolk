title: "Shoreline Insulation — Upgrading Mid-Century Homes to R-49 Code"

intro: |
  Richmond Beach's post-war ranch homes and split-levels — most of them built between 1952 and 1972
  along the bluff above Puget Sound and inland toward Echo Lake — were insulated with whatever
  fiberglass batt the builder had on the truck. R-11 in the attic, maybe R-19 if you were lucky,
  and a crawl space sealed with 6-mil poly that's been disintegrating for thirty years. Washington
  State Energy Code now requires R-49 in attics, and Shoreline's climate makes under-insulated
  envelopes genuinely costly — 37 inches of rain annually, ground moisture pushing up through
  unencapsulated crawl spaces, and sustained humidity from October through May that turns damp
  insulation into a mold-growth problem. Innis Arden's larger homes have the same issues at bigger
  scale: more crawl space, more attic square footage, more rim joist linear footage going unaddressed.
  TopVolk Construction LLC handles insulation upgrades throughout Shoreline — 100+ projects completed
  since 2023 across King County, owner-led by Vladislav Volkov. Call (206) 591-1096 to schedule a
  free on-site estimate.

localContext: |
  Shoreline divides into two distinct zones for insulation work. The 98133 corridor — Meridian Park,
  Briarcrest, the Richmond Highlands area along Aurora Ave — runs dense with 1960s and early-1970s
  tract ranchers. Low-slope roofs, shallow attic depth, compressed R-11 batts that have been settling
  since the Carter administration. A lot of these homes also have knob-and-tube remnants in the attic
  that complicate blown-in installs — you can't bury active knob-and-tube under cellulose without
  addressing the wiring first. North into 98155 — Richmond Beach, Innis Arden, Ronald (near Ronald
  Bog Park) — you hit slightly older stock mixed with larger mid-century homes. The Craftsman and
  postwar bungalows here often have 1.5-story layouts with knee walls: unconditioned triangular attic
  spaces flanking the upper finished room that almost never got properly insulated or air-sealed at
  construction. Shoreline Building Services processes insulation permits within city limits; most
  attic and crawl work is permit-exempt, but spray foam on structural framing or work tied to a
  remodel typically needs a plan review submittal.

commonProblems:
  - title: "Compressed R-11 Attic Batts in 98133 Ranchers — Too Far Below Current Code to Ignore"
    description: |
      Most Meridian Park and Briarcrest ranchers were built with kraft-faced fiberglass batts that
      have been compressing for fifty years. Compressed fiberglass loses R-value — what was R-11 at
      install might be performing closer to R-7 today. Washington State Energy Code requires R-49 for
      attic assemblies in Climate Zone 4C, which covers all of Shoreline. The standard fix: air-seal
      every top-plate gap, recessed light penetration, and HVAC chase with closed-cell spray foam
      first, then install blown-in cellulose on top of existing batts. TopVolk typically uses
      CertainTeed InsulSafe SP or GreenFiber for blown-in applications — both hold R-value well in
      humid attic conditions. For a 1,200–1,500 sq ft ranch attic, the upgrade runs $1,800–$3,200.
      Seattle City Light and PSE both offer rebates on attic insulation — often $300–$600 back
      depending on starting R-value — and the rebate application must be submitted before work starts.

  - title: "Crawl Space Vapor Barrier Failure — What Thirty-Year-Old Poly Actually Looks Like"
    description: |
      Pull the crawl hatch on a 1965 Shoreline rancher and you'll typically find shredded 6-mil poly,
      rodent tunnels punched through it, and floor joists cycling wet and dry every rainy season.
      Replacing the poly alone doesn't solve the problem. Full encapsulation means 20-mil reinforced
      vapor barrier across the floor, 2 inches of XPS rigid foam board on the perimeter foundation
      walls (R-10), and closed-cell spray foam on the rim joists to cut the primary air infiltration
      path. A properly encapsulated crawl should read like a semi-conditioned space — controlled
      humidity, no standing moisture, mechanically vented or dehumidified. Cost for a standard
      Shoreline crawl (1,000–1,400 sq ft floor area) runs $4,500–$8,500 depending on access
      clearance, existing moisture damage, and rim joist linear footage. Spaces under 18 inches
      clearance push labor costs up significantly. PSE whole-home rebates sometimes apply when crawl
      encapsulation is combined with attic work.

  - title: "Knee Wall Air Sealing in 98155 Bungalows — Where the Heat Actually Goes"
    description: |
      Innis Arden and the older sections of Richmond Beach have a meaningful number of 1.5-story
      homes — postwar bungalows where the upper half-story has knee walls flanking a finished center
      room. Those knee wall cavities are almost always connected to the unconditioned attic space
      above, meaning warm air from the living space is constantly migrating into the cold attic through
      every gap in the knee wall framing. The fix has two parts: insulate the knee wall itself with
      mineral wool batts (Rockwool Comfortbatt holds shape in vertical cavities far better than
      fiberglass, which slumps over time), then install rigid blocking and air-sealing at every floor
      and ceiling transition. The sloped ceiling sections adjacent to knee walls need either spray foam
      between rafters or rigid foam above the sheathing if rafter bays are too shallow for adequate
      blown-in depth. Standalone knee wall work on a typical Echo Lake bungalow runs $1,200–$2,800
      depending on linear footage and attic access.

  - title: "Rim Joist Spray Foam — Small Square Footage, Largest Air Infiltration Path"
    description: |
      The rim joist — the vertical band of framing that runs around the perimeter of your foundation
      at floor level — is consistently one of the highest-loss zones in any pre-1990 Shoreline home.
      On the outside face it's exposed to ambient air; on the inside face it often has a single batt
      of fiberglass stuffed in loosely, no air barrier, and gaps at every joist bay. Two inches of
      closed-cell spray foam applied directly to the rim joist cuts air infiltration sharply and
      delivers R-13 in a space where you can't fit much else. Spray foam also handles the irregular
      framing geometry — sill plate gaps, utility penetrations, irregular joist spacing — that batts
      can't conform to. For a typical Shoreline rancher, full rim joist treatment runs $900–$2,000
      depending on linear footage and crawl access. PSE's rebate program sometimes covers rim joist
      work as part of a whole-home envelope package — the application has to be filed before work
      starts, and TopVolk handles that coordination as part of the project scope.

  - title: "Mineral Wool Floor Insulation During Remodels — Adding Sound Control While Walls Are Open"
    description: |
      Shoreline homeowners doing full gut remodels on two-story homes frequently ask about
      floor-to-ceiling sound transfer after the fact — but once drywall is closed up, the options
      get expensive fast. During a remodel, after MEP rough-in and before drywall hang, adding
      Rockwool Safe'n'Sound in every floor joist bay is low incremental cost relative to the
      livability improvement. At 3.5 inches it's R-15, but the real value is the acoustic density —
      the material is about three times the mass of fiberglass at the same thickness, which cuts
      airborne sound transmission substantially. It's not acoustic decoupling (that requires resilient
      channel and additional drywall mass), but for most residential applications it's the right
      call. Timing is everything: mineral wool goes in during rough-in, before any MEP inspection or
      drywall. If you're already opening ceilings for a kitchen or primary bath remodel in Shoreline,
      adding floor insulation typically adds $2–$5 per square foot of floor area to the project cost.

