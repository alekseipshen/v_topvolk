  - q: "What does attic insulation to R-49 cost in Shoreline?"
    a: |
      For a 1,200–1,600 sq ft Shoreline ranch attic — upgrading from R-11 to R-49 with blown-in
      cellulose after air-sealing penetrations — expect $1,800–$3,500. Larger homes, complex attic
      geometry (multiple valleys, HVAC equipment in the attic space, pull-down stair penetrations),
      or attics with active electrical issues push costs higher. Seattle City Light and PSE rebates
      can offset $300–$600 of that depending on the R-value jump and program timing. TopVolk provides
      a free on-site estimate with exact line-item pricing — no vague ranges that change after you
      sign. Call (206) 591-1096 to schedule.

  - q: "Do I need a permit for insulation work in Shoreline?"
    a: |
      Most attic and crawl space insulation work in Shoreline is permit-exempt under Shoreline
      Building Services guidelines — adding blown-in cellulose or replacing a vapor barrier doesn't
      require a permit in most cases. Spray foam applied to structural framing (rim joists, foundation
      walls) can trigger a permit requirement depending on scope and project context; TopVolk confirms
      that before starting. If your insulation is part of a larger remodel — kitchen gut, ADU
      conversion, bathroom addition — it typically rolls under the main permit pulled through Shoreline
      Building Services. TopVolk is a WA Licensed Contractor and handles permit coordination on your
      behalf; you don't need to navigate the city portal yourself.

  - q: "Can attic insulation and crawl space encapsulation be done as one project?"
    a: |
      Yes — and doing both at once makes practical sense. A sealed, moisture-controlled crawl reduces
      the humidity load throughout the whole house, which keeps attic insulation drier and performing
      closer to its rated R-value over time. TopVolk scopes these as a single project: one
      mobilization, one contract, one point of contact throughout. Combined attic upgrade plus full
      crawl encapsulation for a mid-size Shoreline rancher typically runs $6,000–$12,000 depending on
      attic square footage, crawl conditions, and rim joist linear footage. PSE whole-home envelope
      rebates may apply when multiple systems are improved together — worth confirming before you
      schedule since rebate applications must be submitted first.

  - q: "How long does attic insulation last in Shoreline's climate?"
    a: |
      Blown-in cellulose and fiberglass both last 25–35 years under normal conditions, but "normal"
      in Shoreline means managing moisture actively. If the attic has any roof leak history, bathroom
      exhaust fans venting into the attic space instead of outside, or inadequate soffit-to-ridge
      ventilation, the insulation degrades faster — and can harbor mold. Mineral wool (Rockwool
      Comfortbatt) handles moisture better than fiberglass; it doesn't lose R-value when damp, which
      is why TopVolk specifies it in problem attics. A properly ventilated, air-sealed attic at R-49
      shouldn't need replacement for a generation. The crawl space vapor barrier is the more
      maintenance-sensitive component — worth inspecting every 3–5 years for tears or displacement,
      especially after rodent activity.

