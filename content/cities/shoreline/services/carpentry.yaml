title: "Shoreline Carpentry — Trim, Built-Ins & Millwork Done Right"

intro: |
  Richmond Beach's block edges along 20th Ave NW hold some of the most intact mid-century
  ramblers in the Seattle metro. Original fir trim, narrow window casings, hollow-core doors
  swapped once in the 1980s and left alone since. That gap between "original character" and
  "deferred maintenance" gets hard to ignore when a room gets repainted and the trim suddenly
  looks like an afterthought.

  Hamlin Park neighborhoods in 98155 show the same pattern. Living rooms with mismatched
  baseboard heights. Kitchens without pantry cabinetry. Closets that are just a rod over
  bare drywall.

  Carpentry work in Shoreline means one of two things. Either matching what was there —
  reading profiles off original casing stock and replicating them in paint-grade MDF or clear
  pine — or building something new that actually fits the house's bones. Many older Shoreline
  homes still have Andersen wood-frame windows where the sill and apron trim has rotted or
  been painted into oblivion. Matching that detail correctly is invisible work when done right.
  It's conspicuous when done wrong.

  TopVolk Construction has handled carpentry across Shoreline since 2017. Vladislav Volkov
  runs every job personally — no sales staff, no project managers who've never held a router.

localContext: |
  Shoreline's housing stock skews heavily mid-century. The 98155 zip covers most of the
  city's interior — Ronald, Ballinger, Echo Lake — where most homes were built between 1950
  and 1972. Those ranchers and split-levels came with minimal millwork: flat ranch-style
  casings, thin base profiles, no built-in storage to speak of.

  Over in 98177, the Richmond Beach corridor mixes older Craftsman bungalows from the 1930s
  and 1940s alongside postwar construction. Those older homes often have original old-growth
  Douglas-fir window seats and built-in bookcases that need careful repair rather than
  outright replacement.

  PNW climate complicates exterior carpentry across both zip codes. Cedar fascia on
  north-facing rooflines collects moss and holds moisture against the substrate. Without
  proper back-priming before installation, even quality cedar starts checking within eight
  to ten years of Seattle's 37-inch annual rainfall. Interior carpentry gets affected too —
  humid crawlspace air migrating upward through older post-and-pier foundations causes
  subfloor movement that cracks paint at door casing joints and base shoe molding with
  frustrating regularity.

  The fix isn't always more caulk. Sometimes it's addressing the vapor barrier situation
  in the crawlspace first.

commonProblems:
  - title: "Built-In Bookcases and Window Seats That Read as Original to the House"
    description: |
      Shoreline's mid-century ranchers were built without the storage modern families need.
      The standard workaround — freestanding shelving or big-box closet kits — looks grafted
      on rather than designed in.

      A real built-in requires reading the room's existing trim profiles, matching the base
      cap and casing detail, and building face frames that integrate flush with the wall
      finish. Homes along the Echo Lake corridor typically have 2¼-inch ranch-style casings —
      very different from the 3½-inch Colonial profiles popular in 1980s construction.
      Fabricating built-in bookcases that blend in means milling or sourcing matching profiles,
      often in finger-jointed pine or paint-grade MDF, then routing dadoes for adjustable
      shelf pins with a Bosch 1617 router.

      Timeline for a single-wall library unit with crown and base integration runs three to
      five days on site. Materials for a 12-foot-wide floor-to-ceiling unit with face-frame
      detail and adjustable shelving typically land between $2,800 and $4,500 depending on
      wood species and hardware selection.

  - title: "Trim and Molding Restoration in Pre-War Richmond Beach Bungalows"
    description: |
      Older homes on the Richmond Beach side of Shoreline — particularly west of 1st Ave NW
      near the bluff — were built in the late 1930s and early 1940s with old-growth
      Douglas-fir trim. That wood is dense, tight-grained, and still structurally sound in
      many cases.

      The damage shows up as moisture-split window casings, base molding kicked loose during
      flooring work, and picture rail missing from two walls of three. Matching original
      profiles requires a shaper or router table. The stock profile library at a local millwork
      supplier covers maybe 60 percent of pre-war Seattle-area profiles. The rest get ground
      custom.

      TopVolk has done trim restoration in bungalows across the Richmond Beach and Briarcrest
      areas — pulling a sample piece, recreating the profile on a router table, and running
      new material in clear vertical-grain fir or paint-grade pine to match. Expect four to
      seven labor days for a full-room trim restore depending on scope. Fir profiles sourced
      through Dunn Lumber or a regional millwork house run $3–$6 per linear foot before
      finishing.

  - title: "Wainscoting and Beadboard Installation with Proper Miter Detail"
    description: |
      Wainscoting looks simple from across the room. Holding a consistent 36-inch cap rail
      height around door casings and electrical outlets is where it gets complicated.

      Getting miter returns tight at inside and outside corners, and making beadboard panels
      lie flat on walls that haven't seen a level since the Truman administration — that's
      where builder-grade shortcuts become obvious. Homes in Shoreline's 98155 zip built
      during the 1960s commonly run out of plumb by ¼ to ½ inch over a standard 8-foot wall.
      That means scribe work on every single panel edge.

      Cap rail detail typically uses a 1×4 flat with a routed ogee or thumbnail profile on
      the top edge, then a separate bed molding below and a base shoe at the floor. Panel
      adhesive matters: Loctite PL Premium bonds beadboard to painted drywall without
      fastener blowthrough on thin 3/16-inch panels.

      Installation runs roughly $18–$28 per linear foot for a standard 36-inch-height
      wainscoting package, labor and material combined. A typical dining room comes in at
      $1,400–$2,600 total. Permits aren't required for this scope in Shoreline city limits,
      so work can often start within two to three weeks of approval.

  - title: "Interior Door Replacement When the Existing Casing Has to Stay"
    description: |
      Swapping doors in a home where the original casing profiles are intact sounds simple.
      It isn't.

      Shoreline's mid-century ranchers often have non-standard rough opening heights. Current
      standard is 6'8", but 1960s builders sometimes framed 6'6" openings — particularly in
      hallways and secondary bedrooms. Pre-hung door units from Masonite or Pella won't drop
      into those openings without recutting the head jamb or adding a filler at the floor.

      More often the right fix is a slab-only swap. Remove the old hollow-core, hang a new
      solid-core slab on the existing jamb, and re-mortise for updated hardware. Schlage
      B-series deadbolts and passage sets mortise cleanly into a solid-core door and outlast
      the builder-grade brass hardware from the 1980s by a wide margin.

      Cost for a slab swap with hardware runs $350–$550 per door installed. A pre-hung
      replacement where the rough opening needs adjustment adds $150–$300 in framing and
      shimming labor on top of that.

  - title: "Stair Stringer Damage and Tread Replacement in Shoreline Split-Levels"
    description: |
      Stair work in Shoreline's split-level homes — a footprint common throughout Ronald and
      Ballinger — gets complicated by how these stairs were originally built.

      Open-riser pine treads over plywood decking, with carriages that were never properly
      blocked at the wall stringer. Bounce in the treads, squeaking at the riser-to-tread
      joint, and a stringer pulled away from the wall framing are the three signs deferred
      maintenance has caught up with the stair.

      The structural fix involves sister joist reinforcement at the stringers in most cases,
      construction adhesive and screws driven from below at every riser-to-tread joint, and
      replacement treads in 1-inch red oak or maple if the originals are worn below refinishing
      depth. Treads run $85–$140 each installed depending on species and profile.

      A full 14-step stair rebuild with new oak treads, risers, and reinstalled balusters
      typically runs $3,500–$6,000. Stringer repair without full tread replacement usually
      lands between $800 and $1,800 depending on access and extent of carriage damage.

