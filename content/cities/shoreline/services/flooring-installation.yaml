  - q: "What does hardwood flooring installation cost per square foot in Shoreline?"
    a: |
      Solid 3/4-inch nail-down hardwood runs $8–$14 per square foot installed in Shoreline, covering
      material, installation, and site-finishing with Bona Traffic HD. Engineered hardwood is $7–$12
      installed. LVP with cork underlayment for sound control lands at $5–$9. Subfloor repairs,
      VAT abatement coordination, and Schluter transition strips are line-itemed separately — not
      buried in a per-square-foot estimate. A 900 sq ft mid-century rancher main floor typically
      comes out to $9,500–$13,500 all-in depending on subfloor condition. The on-site estimate is
