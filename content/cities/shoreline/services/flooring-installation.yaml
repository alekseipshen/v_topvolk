      subfloor findings. No vague ranges. Call (206) 591-1096 or schedule online.

  - q: "Do I need a building permit for flooring installation in Shoreline?"
    a: |
      Cosmetic replacement — pulling carpet and installing hardwood or LVP on an existing subfloor —
      does not require a building permit in Shoreline. Structural work does: if your subfloor needs
      sistered joists, blocking, or replacement OSB panels over a significant area, that triggers a
      permit requirement under the IRC through Shoreline Development Services at City Hall on N 175th
      St. Their online permit portal handles straightforward applications, with review typically
      running 1–2 weeks for minor structural scope. TopVolk is a WA Licensed Contractor — we pull
      permits on anything that requires them, coordinate the rough-in inspection and final inspection
      with the city, and handle the documentation. You don't need to navigate that process yourself.

  - q: "Should I use engineered hardwood or solid hardwood in my Shoreline home?"
    a: |
      Foundation type and subfloor moisture readings make that call. Solid 3/4-inch hardwood is
      nail-down only and appropriate for crawlspace homes in 98155 where subfloor MC stays below
      11% consistently — common in well-maintained ranchers with good vapor barrier coverage and
      active crawlspace ventilation. Slab-on-grade foundations in parts of 98133 need engineered
      hardwood (cross-ply construction tolerates seasonal moisture movement better) or LVP, which
      is fully waterproof and can float directly over concrete with a moisture-blocking underlayment.
      Engineered products from Mirage or Shaw can be glued or floated with an appropriate adhesive
      system. We run a moisture meter on every subfloor before recommending a product — that 20-
      minute step prevents a $10,000–$15,000 failure if the wrong material goes down.

  - q: "What warranty covers TopVolk's flooring installation work in Shoreline?"
    a: |
      Material warranties vary by manufacturer: Mirage engineered hardwood carries a 35-year finish
      warranty on residential installations; Shaw LVP lines run 15–25 years depending on the product
      tier. Both warranties are voided by improper site conditions at installation — specifically,
      subfloor MC out of spec or vapor barrier gaps not addressed before the floor goes down. TopVolk
      warrants workmanship for 2 years from project completion: nail pops, joint gapping beyond
      seasonal norms, and Schluter transition strips that fail are covered. Every job starts with
      documented moisture readings and a crawlspace or slab condition assessment — that paper trail
      protects both parties if a manufacturer warranty claim comes up later. Vladislav handles those
      conversations directly; no call centers.

