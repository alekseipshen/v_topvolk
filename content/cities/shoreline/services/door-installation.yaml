title: "Shoreline Door Installation — Weathertight Upgrades for Ranch-Era Homes"

intro: |
  Richmond Beach homes along 20th Avenue NW tell you a lot about what happens
  to entry doors in 98177. The 1958-era ranch houses up here were built with
  solid-core wood doors that have been reglazed, repainted, and patched so many
  times the original framing is barely recognizable — and after 60-plus years of
  Seattle's 37 inches of annual rainfall hitting a west-facing threshold, the
  aluminum Z-flashing above the door has either lifted, corroded, or been painted
  over entirely. Down around Echo Lake in 98155, the picture shifts: 1990s tract
  homes where the builder-grade fiberglass door still stands but the Schlage
  deadbolt has been rekeyed four times and the compression weatherstrip is
  completely flat. Both situations need more than a new door slab. Getting a door
  installation right in Shoreline means flashing the rough opening properly,
  framing to IRC tolerances, and coordinating with City of Shoreline Building
  Division if structural work is involved. Call (206) 591-1096 to set up a free
  walkthrough with Vladislav — no sales staff, no call center.

localContext: |
  Shoreline's housing stock splits pretty cleanly by decade and location. The
  98177 corridor — Richmond Beach, Blue Ridge — runs largely 1940s-1960s
  construction on post-and-pier foundations with original fir frames, and door
  openings that have settled a quarter-inch to three-quarters out of square over
  the decades. Dropping a pre-hung Pella or Therma-Tru unit into a racked
  opening without correcting it first produces a door that swings open on its own
  or won't latch without lifting the knob. In 98133, which covers Parkwood and
  Ridgecrest closer to the Aurora corridor, you get more 1970s-1980s split-levels
  where the aluminum sliding patio door has been leaking at the sill plate for
  years. Converting those to a French door or Milgard multi-slide system requires
  pulling the old frame entirely, adding a LVL header if the opening widens, and
  applying self-adhered flashing membrane before the new unit sets. City of
  Shoreline requires permits for any structural opening modification — plan on
  2-4 weeks for review on a standard residential project. TopVolk Construction
  LLC has completed 100+ projects since 2017 across King and Snohomish counties,
  including many homes exactly like these.

commonProblems:
  - title: "Flashing Failure on Pre-1970 Entry Doors in Richmond Beach"
    description: |
      The original aluminum Z-flashing above entry doors on Richmond Beach's
      mid-century ranchers was a single bent piece tucked under the wood siding —
      no waterproofing membrane, no sill pan, nothing between the sheathing and
      the weather. After 60 years of driven rain, that flashing has lifted or
      corroded through. Water tracks down the king studs inside the wall cavity,
      invisible until the drywall bubbles or the threshold sill plate starts to
      soften. A proper fix means removing the door unit entirely, stripping the
      rough opening to bare sheathing, and applying a self-adhered membrane —
      Huber ZIP System tape or Henry Blueskin VP100 — across the full sill and up
      both jambs before the new door sets. Therma-Tru Pulse fiberglass units with
      factory brickmold are a common choice here because the material doesn't
      absorb moisture the way old-growth fir does. Budget $1,800–$3,200 for a
      standard 3-0 x 6-8 entry door replacement with full flashing, new threshold,
      and hardware in 98177. Installation typically runs one to two days on site.

  - title: "Out-of-Square Rough Openings in Settled Post-and-Pier Foundations"
    description: |
      Post-and-pier foundations shift. Not dramatically — but enough that a door
      opening plumb in 1962 might be 1/2 inch out of square today, especially on
      north-facing walls where moisture accumulates and freeze-thaw cycles during
      colder winters accelerate wood movement. Drop a pre-hung unit into an
      out-of-square opening without correcting it and you get a door that swings
      open on its own or won't latch without lifting the knob. Minor variance
      under 3/8 inch gets corrected with a shim pack at the hinge jamb and strike
      side during installation. Larger variance means pulling the jack studs,
      resetting them plumb, and potentially adding a sister joist to the header if
      the king stud has twisted. Pella 150-series fiberglass handles small
      out-of-square tolerances better than solid wood because the frame doesn't
      respond to humidity swings the way Douglas-fir does. Vladislav does a
      rough-opening inspection before any door goes on order — so there are no
      surprises on install day.

  - title: "Patio Sliding Door to French Door Conversion — Permits and Headers"
    description: |
      Replacing a 1980s aluminum sliding patio door with a French door or a
      Milgard multi-slide system sounds simple until you look at the header.
      Most 1970s-80s patio openings in Shoreline's 98133 split-levels were framed
      with a doubled 2x10 — adequate for the original 6-foot slider, undersized if
      the new opening widens to 8 or 10 feet. Any structural header change requires
      a City of Shoreline Building Division permit. Applications go through
      Shoreline's ePlans online portal; plan review for a standard residential
      structural alteration runs 2-4 weeks. A WA Licensed Contractor pulls the
      permit, schedules the rough-in inspection, and coordinates the final
      inspection before project closeout. The new header — typically a 3.5 x 9.25
      LVL beam for a load-bearing exterior wall — needs an engineer stamp if the
      span exceeds what prescriptive IRC tables cover. Call (206) 591-1096 early
      in the planning process; permit lead time affects your schedule by weeks,
      not days, and ordering the door unit before permit approval is a common
      mistake that delays projects.

  - title: "Fiberglass vs. Solid Wood Entry Doors — Cost and Long-Term Value"
    description: |
      Solid wood entry doors look right on Shoreline's older colonial and
      craftsman-influenced homes, and some homeowners in the 98177 Richmond Beach
      corridor specifically want that aesthetic. The maintenance reality is harder.
      A solid mahogany or fir door in a west-facing exposure needs refinishing
      every 3-5 years in this climate — skip a cycle and the grain checks, moisture
      gets in, and the door swells in its frame every November. Fiberglass units
      like the Therma-Tru Pulse or Masonite Belleville series run $900–$2,500 for
      the slab before installation labor and hardware, hold their finish
      significantly longer, and carry foam-core R-values of 5-6 per inch compared
      to roughly R-2 for solid wood. For an upper-middle-income area like Shoreline
      where resale value matters, an entry door replacement with a Schlage Encode
      smart lock and matching handleset typically returns 60-70% of cost on resale.
      Total installed cost for a mid-grade fiberglass unit with smart lock,
      sidelights, and a proper sill pan runs $2,800–$4,500 depending on finish
      and glass package.

  - title: "Weatherstripping and Threshold Degradation — When a Tune-Up Isn't Enough"
    description: |
      The gap between "good enough" and actually sealed is easy to feel on a
      35°F January morning in 98155 — cold air at your feet, a visible gap at
      the top corner of the door frame, and a heating bill that climbs every
      winter. Compression weatherstripping on doors installed before 2000 is
      almost certainly compressed flat; it was rated for roughly 50,000 operating
      cycles, not 25 years of daily use. Replacing it means pulling the door stop,
      stripping old adhesive-backed foam, and installing a Q-Lon pile insert or
      compression bulb weatherstrip that seats against the door face properly.
      The threshold is usually the bigger issue: original aluminum saddle
      thresholds on mid-century doors have no thermal break. A Pemko 2003 AV
      adjustable threshold with an interlocking sill seal is a meaningful
      upgrade. For a full perimeter weatherstrip and threshold replacement on a
      standard 3-0 entry door, budget $350–$600 in parts and labor. No permit
      required for weatherstrip work alone — and it's one of the better
      dollar-for-dollar improvements on a drafty 1960s ranch.

faq:
  - q: "How fast can you get to Shoreline for a door installation consultation?"
    a: |
      Shoreline is 20-30 minutes from our base depending on I-5 traffic — the
      175th Street or 145th Street exits put us directly into the residential
      grid, and Aurora (SR 99) works as a backup when the freeway backs up
      in the afternoon. Parking on Shoreline's residential streets is generally
      not an issue. Free on-site consultations typically happen within 3-5
      business days of your call. Most installations are booked 2-4 weeks from
      signed contract — add 2-4 weeks if a structural permit is required, which
      affects projects involving header changes or new exterior openings. For
      weatherstrip-only or direct slab-swap jobs, scheduling can move faster.
      Call (206) 591-1096 and you'll reach Vladislav directly, not a dispatcher
      or a sales rep.

  - q: "What does entry door replacement in Shoreline typically cost?"
    a: |
      Cost depends on what the opening needs before the door goes in. A
      straightforward entry door swap — same rough opening size, no structural
      changes, standard 3-0 x 6-8 pre-hung fiberglass unit — runs $1,800–$3,200
      installed, including flashing, threshold, hardware, and haul-away of the old
      unit. Add sidelights and the range shifts to $3,500–$5,500. French door or
      multi-slide patio conversions requiring a new LVL header run $4,500–$9,000+
      depending on span, finish work, and permit fees. Interior door replacements
      during a remodel run $400–$800 per door for a pre-hung slab with casing.
      Vladislav provides a line-item written quote on-site — no vague "starting
      at" ranges that balloon later. Call (206) 591-1096 to schedule a free
      estimate at your Shoreline address.

  - q: "Does door installation in Shoreline require a building permit?"
    a: |
      A direct slab replacement in the same rough opening — no structural changes,
      no widening — generally doesn't require a permit under City of Shoreline
      Building Division rules. But if you're widening the opening, installing a
      new LVL header, converting a window to a door, or adding an exterior opening
      that didn't previously exist, a building permit is required. Shoreline uses
      an ePlans online portal for residential applications; plan review on a
      standard structural alteration typically runs 2-4 weeks. TopVolk
      Construction LLC, WA Licensed Contractor, handles the permit application,
      prepares the plan set, and schedules all required inspections — rough-in and
      final — so you're not navigating the building department alone. Permit fees
      in Shoreline for a single residential opening modification typically run
      $200–$450 depending on valuation.

  - q: "Can you integrate a smart lock or keypad into my existing or new entry door?"
    a: |
      Smart lock integration is straightforward on most pre-hung doors with a
      standard 2-3/8 or 2-3/4 inch backset. August Wi-Fi Smart Lock Pro and
      Schlage Encode Plus are the two units installed most often in Shoreline —
      both support Apple Home Key and don't require a separate hub or bridge
      device. The Schlage Encode fits a standard 2-1/8 inch bore; if the door
      has a non-standard bore from a previous retrofit, we bore it to spec as
      part of installation. Older Richmond Beach homes with pre-1965 mortise
      locksets need a new bore and a backset conversion plate before a
      cylindrical smart lock will seat correctly. Budget $150–$300 for hardware
      plus 1-2 hours of labor on a standard swap, or we can spec the lock
      into a new door order from the start to ensure the backset and bore match.

  - q: "What warranty comes with a new door installation from TopVolk?"
    a: |
      Therma-Tru and Pella carry limited lifetime warranties on fiberglass door
      slabs against material and manufacturing defects — that covers the slab
      itself, not the finish on south-facing unprotected openings or hardware wear.
      Milgard backs their sliding and multi-slide systems with a full lifetime
      warranty transferable to subsequent owners, which matters for resale in a
      neighborhood like Shoreline where buyers do their due diligence. TopVolk's
      installation labor carries a 2-year warranty covering hinge adjustment,
      strike plate alignment, and threshold sealing. If flashing or weatherstrip
      fails within two years of installation, we return at no charge. Vladislav
      goes through the warranty specifics at the blue tape walkthrough before the
      project closes out — what's covered, what isn't, and what routine
      maintenance keeps the warranty valid.

  - q: "Do you serve cities near Shoreline, or only Shoreline proper?"
    a: |
      TopVolk works across King and Snohomish counties, so Shoreline's neighbors
      are all in range: Kenmore, Lake Forest Park, and Mountlake Terrace
      immediately adjacent; Lynnwood, Edmonds, and Bothell a bit further north;
      and north Seattle neighborhoods like Bitter Lake, Broadview, and Crown Hill
      to the south. Vladislav leads the work directly — no subcontracting the
      install to whoever's available that week. Scheduling typically opens 2-4
      weeks out, with more runway needed for permit-dependent structural projects.
      The full Shoreline service area includes 98133, 98155, and 98177. If you're
      comparing bids from larger outfits, ask specifically who will be on-site
      on install day — it's rarely the person who wrote the quote. Call
      (206) 591-1096 or schedule a free on-site consultation to get started.