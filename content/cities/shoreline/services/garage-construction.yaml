title: "Shoreline Garage Construction — ADU-Ready Builds for Mid-Century Lots"

intro: |
  Richmond Beach and Echo Lake sit on some of the most practical lots in King
  County for a detached garage build — flat to gently sloped terrain, lot widths
  running 50 to 70 feet, and housing stock that dates mostly 1955 to 1972. The
  problem? Those original attached garages were built for a Ford Falcon, not a
  Tesla Model Y and a 20-amp shop circuit. WA HB 1337, which took full effect in
  2024, changed the math on detached builds in Shoreline: up to two ADUs are now
  permitted on a single-family lot, which means a new detached garage with a
  DADU above is a buildable project on most R-6 zoned parcels here. TopVolk
  Construction has pulled permits through the City of Shoreline Development
  Services for exactly this build type — full slab-on-grade garage with a
  finished studio above, pre-wired for a 50A EV charger at the parking bay.
  Vladislav Volkov walks every site before a single number goes on paper. Call
  (206) 591-1096 to set up a free on-site look.

localContext: |
  Most of Shoreline's residential grid was platted in the 1950s and early
  1960s — you see it in the street layout around zip codes 98155 and 98177. The
  homes in Ridgecrest and Parkwood are predominantly single-story ranchers and
  split-levels with attached one-car garages that measure 10 feet wide inside
  the drywall, tight enough that a modern pickup sits with six inches of
  clearance on each side. Older ranchers in this era often have post-and-pier
  foundations rather than a full perimeter concrete wall, which matters when
  you're tying a new attached addition into the existing structure. Detached
  builds on these lots must clear the City of Shoreline's setback minimums —
  5 feet from the rear property line and 3 feet from the side, though corner
  lots and alley-adjacent parcels carry different rules. Shoreline's wet season
  runs October through May, and fiber-reinforced slabs need sustained temps
  above 40°F to cure properly; that window closes earlier in November than most
  homeowners expect.

commonProblems:
  - title: "Undersized Attached Garages With No Room for Modern Vehicles or a 240V Circuit"
    description: |
      The 1960s-era attached garages in Ridgecrest and Parkwood were built to a
      10-by-20-foot interior standard — workable in 1965, a daily frustration
      now. A standard full-size SUV won't clear the side walls without drywall
      contact. The electrical panels in these homes typically run 100-amp mains
      with no spare 240V breaker positions, so adding a 50A EV charger circuit
      means either a panel upgrade or a sub-panel in the garage. TopVolk handles
      both: a new 6-gauge copper circuit from an upgraded 200A main to a
      flush-mounted 50A NEMA 14-50 outlet, coordinated with a licensed
      electrician under a single combined permit. A garage extension that adds
      8 feet of depth and rewires the bay runs $45,000–$75,000 depending on how
      much of the existing framing needs to be opened. Plan review through the
      City of Shoreline Development Services adds 6–10 weeks for attached work
      before a shovel touches ground.

  - title: "Detached Garage-Over-DADU Builds Stalling on FAR and Height Calculations"
    description: |
      WA HB 1337 opens the door, but the zoning math still has to work. FAR
      limits and the 24-foot height cap for DADUs mean a two-story structure
      needs to be designed before any architect drawings are paid for — not
      after. On a typical 7,000-square-foot Shoreline lot in zip code 98155,
      400–600 square feet of DADU floor area is often what's left after
      accounting for the existing house footprint and lot coverage. TopVolk
      runs the setback and FAR check during the site visit so homeowners don't
      spend $4,000 on plans that can't be permitted. The concrete slab for the
      garage bay requires a minimum 4-inch fiber-reinforced pour with a 6-mil
      vapor barrier underneath; the AHJ requires a rough-in inspection before
      the slab is poured. A detached two-car garage with a 400 SF studio DADU
      above typically runs $160,000–$210,000 complete, permits included, over a
      4–7 month end-to-end timeline.

  - title: "Matching Hardie Siding and Roofline to a 1960s Rancher"
    description: |
      Detached builds that look tacked-on hurt resale. The challenge with
      Shoreline's mid-century ranchers is original siding that's usually T1-11
      plywood or horizontal cedar lap — materials you can't replicate with
      modern Hardie cement-board panels without careful profile selection.
      TopVolk uses 5/16-inch Hardie lap siding in a 6-inch exposure to match
      the visual rhythm of the existing house, with matching corner trim painted
      to the same Benjamin Moore formula as the main structure. Roofline
      coordination is the harder part: most Shoreline ranchers run a 4:12 or
      5:12 pitch, and matching that with the same 30-year architectural
      shingle profile is what keeps the garage from looking like an afterthought.
      Cedar shake roofs, still present in Richmond Beach, require a different
      underlayment spec and a separate re-roof permit if the new structure is
      matching shake. The exterior coordination adds $8,000–$14,000 versus a
      generic box structure — that delta is the difference between a garage
      that reads as original and one that reads as a storage unit.

  - title: "Concrete Slab Failures From Inadequate Sub-Base Prep and Drainage"
    description: |
      A 4-inch slab poured over poorly compacted soil will crack and settle in
      Shoreline's conditions — particularly on west-facing slopes near Richmond
      Beach where surface water runs hard from October through April. More
      concrete isn't the fix; proper sub-base prep is. TopVolk specs 4 inches
      of compacted crushed rock base, a 6-mil polyethylene vapor barrier, and
      fiber reinforcement throughout the pour rather than rebar only at the
      perimeter. Control joints are cut within 24 hours of pour to direct future
      cracking away from the slab field. For workshop builds where the owner
      plans heavy equipment, we add a thickened 6-inch perimeter footing and
      an anchor bolt layout for wall-mounted lift systems or heavy shelving.
      A properly spec'd two-car garage slab in Shoreline runs $8,000–$14,000
      for the concrete scope alone, depending on excavation depth and whether
      existing soil requires haul-off.

  - title: "EV Pre-Wire and R-15 Insulation for a Garage That Works Year-Round"
    description: |
      A new garage build is the cheapest time to run EV infrastructure — conduit
      through open framing costs a fraction of what a retrofit costs post-drywall.
      TopVolk pre-wires every new build with at minimum a 1-inch conduit stub
      from the main panel to the bay, sized for a future 60A circuit. Homeowners
      who want a Level 2 charger at completion get a dedicated 50A circuit
      terminated at a NEMA 14-50 outlet; those adding a Bosch EV250 or Wallbox
      Pulsar Plus hardwired unit get a 60A dedicated circuit with a separate
      disconnect. For workshop-grade comfort, we use R-15 batt in 2x4 walls
      and R-49 blown-in at the ceiling — an uninsulated garage in Shoreline
      sits around 42°F in January, which kills lithium battery range and makes
      any extended time in the space miserable. Insulation and EV pre-wire
      together add $4,500–$7,500 to a new build. A retrofit after drywall is
      up costs two to three times that.

faq:
  - q: "How fast can you get to Shoreline for a garage construction estimate?"
    a: |
      Shoreline is a direct run up I-5 from Seattle — TopVolk reaches any
      address in the 98133, 98155, or 98177 zip codes in under 30 minutes from
      most active project sites in King County. Vladislav Volkov does the site
      visit personally, not a salesperson. You get eyes on the lot, a setback
      check, and a rough project scope on that first visit. From estimate to
      signed contract typically runs 1–2 weeks; permit submission to the City of
      Shoreline Development Services follows immediately after. Call
      (206) 591-1096 to set up a free on-site consultation — 100+ projects
      completed across King County since 2017, and every one started with that
      same first visit.

  - q: "What does a detached garage build cost in Shoreline, WA?"
    a: |
      A single-car detached garage — slab, framing, Hardie siding, insulated
      door, and basic electrical — runs $65,000–$95,000 in Shoreline. A two-car
      garage with EV pre-wire, R-15 wall insulation, and a finished interior
      lands at $100,000–$145,000. Add a DADU studio above and the total
      typically falls between $160,000 and $210,000, permits and utility
      connection included. Lot slope, existing soil conditions, and the
      complexity of matching the original house exterior all move the final
      number. TopVolk provides a line-item quote after the site visit — not a
      range — and every contract includes a written deadline penalty clause,
      not a vague promise.

  - q: "What permits does a new garage require in Shoreline?"
    a: |
      Shoreline is an incorporated city with its own Development Services
      department — permits here do not go through King County DPER, which only
      covers unincorporated areas. A detached garage over 200 square feet
      requires a building permit, a site plan showing setbacks, and structural
      drawings stamped by a Washington State engineer. If a DADU is included,
      ADU review adds a layer: the City checks lot coverage, FAR, and utility
      capacity. First-submittal plan review currently runs 6–10 weeks. TopVolk
      prepares the full permit package — site plan, floor plans, elevations,
      slab and foundation details — as part of the project scope. WA Licensed
      Contractor, owner-led from permit application through final inspection.

  - q: "Can you pre-wire a new garage for a Level 2 EV charger during construction?"
    a: |
      Yes — and doing it during the build is always the right call. Open framing
      means the electrician can run a 6-gauge copper circuit from the main panel
      to the garage bay cleanly, without cutting through finished drywall. The
      EV circuit is included in the permit package under the electrical
      sub-permit, so there's no separate inspection trip. If you already know
      the charger model, TopVolk specs the circuit to match: a Bosch EV250
      needs a 40A dedicated circuit, while a Wallbox Pulsar Plus or ChargePoint
      Home Flex runs on 50A. A 60A conduit stub with a junction box at rough-in
      costs almost nothing and future-proofs the bay for whatever vehicle comes
      next.

  - q: "How long does a garage construction project take from start to finish in Shoreline?"
    a: |
      A detached two-car garage without a DADU takes 8–12 weeks from permit
      approval to final inspection — roughly 3–4 weeks of active construction
      once permits clear. Add a DADU above and the construction phase extends
      to 10–16 weeks; the full project end-to-end, counting permit submittal and
      review, typically runs 5–7 months. Attached garage additions that tie into
      the existing foundation take longer depending on how much structural work
      is needed at the connection point. Every TopVolk contract includes a
      project schedule with milestone dates and a written penalty clause for
      missed completion — an actual dollar amount, not a vague commitment.

  - q: "Do you work in nearby cities like Lake Forest Park, Kenmore, or Mountlake Terrace?"
    a: |
      Yes — TopVolk covers the full north King County corridor and into southern
      Snohomish County. Lake Forest Park and Kenmore border Shoreline directly
      and carry similar mid-century housing stock with comparable City permit
      timelines. Mountlake Terrace and Lynnwood sit just north of the county
      line, where permits route through Snohomish County PDS or the respective
      city office. Most sites in this band are within 20–30 minutes of each
      other. Call (206) 591-1096 — Vladislav picks up directly, not an
      answering service. If your lot is anywhere in the 98133–98177 range or
      just north, a site visit can typically be scheduled within a week.