title: "Shoreline Plumbing — Galvanized Repipe & Fixture Upgrades"

intro: |
  The post-WWII subdivisions north of 145th Street hold a lot of Shoreline's
  housing stock — ramblers and split-levels built between 1948 and 1968, still
  running their original galvanized steel supply lines. Galvanized corrodes from
  the inside out. By the time pressure drops noticeably at a Moen kitchen faucet
  or rust tints the bathtub fill, those pipes have usually been narrowing for
  decades. Echo Lake and Innis Arden both have substantial concentrations of that
  era, and the crawlspaces underneath get wet — Shoreline averages close to 37
  inches of rain per year, and vapor barrier condition directly affects how fast
  exposed galvanized deteriorates in unconditioned spaces. Homes closer to Aurora
  Avenue from the 1980s add a second problem: polybutylene supply lines that have
  been failing quietly at compression fittings across the Seattle Metro for years.
  TopVolk Construction handles full repipes, tankless conversions, drain reroutes,
  and fixture work as part of kitchen and bathroom remodels across Shoreline and
  north King County — call (206) 591-1096 to schedule a free on-site walkthrough
  with Vladislav directly.

localContext: |
  Zip code 98155 covers central and eastern Shoreline — the residential blocks
  around Shoreline Community College, the streets heading toward Lake Forest Park,
  and much of the I-5 corridor through the city. Most of that housing went up
  between 1950 and 1972. Zip code 98177 picks up Richmond Beach and the Innis
  Arden neighborhood, where some homes date to the early 1940s and original cast
  iron drain stacks are still in service alongside galvanized supply lines. Richmond
  Beach properties on the slope also deal with elevated static water pressure —
  lower-elevation addresses regularly see 90-100 psi incoming from the city main,
  well above the 80 psi threshold where a pressure regulator valve (PRV) becomes
  both code-required and necessary to protect fixture fittings and appliance supply
  connections. The 1980s construction scattered through 98155 near the Highway 99
  corridor introduces a different issue: polybutylene pipe stamped PB2110, which
  builders used extensively during the suburban expansion of that decade and which
  has been degrading at acetal plastic compression fittings ever since. Shoreline
  plumbing permits run through the City of Shoreline's own permit center — not King
  County DPER — which matters for project scheduling.

commonProblems:
  - title: "Galvanized Supply Line Failure in 1950s–1960s Shoreline Ramblers"
    description: |
      Homes built in 98155 between 1950 and 1968 typically have ¾-inch galvanized
      steel supply lines from the meter through every fixture branch. The effective
      bore of those pipes has been shrinking for decades as iron oxide and mineral
      scale build up on the interior wall. When pressure drops at the Kohler shower
      valve or tub fill slows noticeably, the pipe interior is often down to pencil
      width or narrower. Replacing galvanized with PEX-A expansion-style tubing —
      Uponor AquaPEX is the standard specification here — gives the system a 25-year
      material warranty and handles Puget Sound-area water chemistry and crawlspace
      freeze-thaw conditions far better than copper at comparable cost. A full repipe
      in a typical Shoreline 1,800 sq ft rambler runs $8,000–$14,000 depending on
      fixture count and crawlspace access. City of Shoreline permit required; rough-in
      and final inspections apply.

  - title: "Polybutylene Pipe Replacement in 1980s Homes Near the Aurora Corridor"
    description: |
      The gray plastic supply piping stamped PB2110 — polybutylene — appears in
      Shoreline homes built roughly between 1978 and 1994, concentrated in denser
      residential pockets near Aurora Avenue and along the 185th Street area. Poly-B
      was fast and cheap to rough-in, which made it popular with tract builders
      across the Seattle Metro during that decade. The failure point is the acetal
      plastic compression fitting at every joint, manifold, and fixture stub-out.
      Chloramines in Seattle Public Utilities treated water accelerate that plastic's
      degradation, and fittings can crack without warning — usually behind a cabinet
      or inside a wall cavity. There is no reliable repair patch for aged poly-B;
      full replacement with PEX or copper is the fix. Budget $9,000–$16,000 for a
      complete repipe on a 1980s two-story Shoreline home, including permit fees and
      scheduled inspections through the city.

  - title: "Tankless Water Heater Conversion Requiring Gas Line Upsize"
    description: |
      Replacing a 50-gallon tank water heater with a Navien NPE-240A2 or Rinnai
      RU199iN is not a straight appliance swap — it's a BTU load increase that the
      existing gas supply line usually cannot support. Navien's top residential unit
      pulls around 199,000 BTU/hr at peak demand; most pre-1990 Shoreline homes
      have ½-inch or ¾-inch gas runs originally sized for a 40,000 BTU tank heater.
      The fix requires running 1-inch corrugated stainless steel tubing (CSST) from
      the meter to the new unit, plus a dedicated shutoff, proper seismic bonding per
      WA code, and Category III stainless exhaust venting. The City of Shoreline
      requires separate permits for the water heater and the gas line modification,
      and seismic strapping of the new unit is mandatory under IRC Section P2801.7.
      TopVolk — WA Licensed Contractor — handles the full scope: gas line, venting,
      condensate drain, and permit coordination. Budget $3,500–$6,500 installed
      depending on the run length for the new gas line.

  - title: "Drain Rerouting for Curbless Showers and Kitchen Islands in Remodels"
    description: |
      Converting a 1960s standard tub-shower alcove to a curbless walk-in shower
      with a Schluter Kerdi linear drain and large-format porcelain tile almost
      always requires moving the drain line. The original 2-inch drain in a
      mid-century Shoreline home was sized and positioned for a tub, not a
      32-square-foot curbless shower pan. Rerouting to proper slope — ¼-inch per
      foot minimum per IRC — means opening the subfloor. While that subfloor is
      open, it makes sense to sister joist any compromised framing and, if there is
      crawlspace moisture, install a DriCore subfloor panel system before closing
      up. Kitchen island drains follow the same logic: adding an island sink requires
      a drain run back to the stack with adequate fall, venting per code, and often
      an air admittance valve where a full vent stack isn't practical. Budget
      $1,200–$2,800 for the drain reroute component alone, separate from tile and
      fixture costs.

  - title: "Pressure Regulator Installation for High-PSI City Supply in Richmond Beach"
    description: |
      Lower-elevation addresses in Richmond Beach and parts of 98177 sit at grades
      where incoming city water pressure runs 90–100 psi. Above 80 psi, braided
      stainless flex connectors under sinks, toilet fill valves, and appliance
      supply hoses are under constant stress — those fittings are rated for 80 psi
      in normal cycling, not sustained high pressure. A Watts 25AUB or Wilkins 600
      series pressure regulator valve (PRV) installed at the main reduces line
      pressure to a steady 60–65 psi and protects every downstream fitting in the
      house. The work itself is typically a half-day job, but it does require a City
      of Shoreline permit and a main shutoff. While the main is off, the existing
      main shutoff valve itself is worth inspecting — ball valves in homes over 30
      years old can seize when operated for the first time in decades, which turns a
      PRV install into an emergency. Budget $450–$850 installed. Call (206) 591-1096
      to schedule an assessment as part of a broader project scope.

faq:
  - q: "How fast can you get to Shoreline for plumbing work?"
    a: |
      Shoreline is a straightforward 20–30 minute drive from central Seattle via
      I-5 north — exits at 145th Street or 175th Street depending on which part of
      the city. For most projects, Vladislav can schedule a free on-site walkthrough
      within 2–3 business days of your call. A straightforward PRV install or
      permit-required water heater replacement can typically happen within a week of
      the estimate. Full galvanized repipes take 3–5 active working days plus permit
      lead time through the City of Shoreline's permit center. Call (206) 591-1096
      — owner-operated means you're talking directly to the contractor, not a
      scheduler or sales rep.

  - q: "What does a full repipe cost in a Shoreline home?"
    a: |
      For a typical Shoreline rambler or two-story built before 1975, a full PEX-A
      repipe using Uponor AquaPEX runs $8,000–$16,000 depending on square footage,
      fixture count, and crawlspace access. Homes with finished basements or tight
      crawl clearance add labor time and cost. Polybutylene replacements on 1980s
      two-stories generally fall in the $9,000–$16,000 range. The estimate from
      TopVolk is a line-item quote — materials, labor, permit fees, inspection
      scheduling, and patch work itemized separately — not a vague ballpark. Free
      on-site estimate, direct from Vladislav. Call (206) 591-1096 to set it up.

  - q: "Do plumbing projects in Shoreline require a city permit?"
    a: |
      Yes, and permits in Shoreline run through the City of Shoreline's own permit
      center — not King County DPER, which handles unincorporated parcels. Work
      requiring permits includes water heater replacements (with mandatory seismic
      strapping per WA code), full repipes, gas line modifications, and drain
      alterations. Residential plan review typically takes 2–4 weeks. TopVolk is a
      WA Licensed Contractor and manages permit submission, required rough-in
      inspection scheduling, and final inspection sign-off as part of every project
      scope. Homeowners do not need to track the permit process — that's handled on
      our end.

  - q: "Can you convert our tank water heater to a Navien or Rinnai tankless unit?"
    a: |
      That's one of the more common scopes in Shoreline. Both the Navien NPE-240A2
      and Rinnai RU199iN perform well given the Pacific Northwest's cold incoming
      groundwater temperatures — you need the full input BTU capacity to maintain
      flow rate in January. Both require a gas line upsize to 1-inch CSST from the
      meter, Category III or IV stainless exhaust venting, and a condensate drain to
      an approved receptor. The City of Shoreline requires permits for both the
      appliance and the gas line work. TopVolk coordinates the full scope — gas,
      venting, condensate, permit — not just the appliance drop-in. Budget
      $3,500–$6,500 installed.

  - q: "What warranty covers the plumbing work TopVolk does?"
    a: |
      Labor carries a 2-year warranty on all plumbing work performed. Material
      warranties vary by product: Uponor AquaPEX supply lines carry a 25-year
      limited warranty; Navien and Rinnai heat exchangers are warranted 12–15 years
      depending on model and registration; Watts and Wilkins PRV units typically
      carry 5-year coverage. Schluter Kerdi waterproofing membrane, used on
      curbless shower assemblies, is warranted for the life of the installation when
      installed per spec. If something fails within the warranty period, you contact
      Vladislav directly. The project contract also includes a deadline clause —
      missed completion dates carry financial penalties written into the agreement,
      not just a vague apology.

  - q: "Do you cover Lake Forest Park and other areas near Shoreline?"
    a: |
      TopVolk serves Shoreline, Lake Forest Park, Kenmore, Mountlake Terrace,
      Lynnwood, Edmonds, and the broader north King County and south Snohomish
      County area. Most of those cities share the same housing era — 1950s through
