title: "Shoreline General Contracting — Whole-House Remodels, Permits Handled"

intro: |
  Crawlspace moisture under a Parkwood split-level doesn't announce itself until demo day — the rim joist pulls out soft, and a 6-week kitchen timeline just grew by two weeks, with a Bosch appliance package already staged in the garage. That's the exact moment homeowners in 98155 regret managing subs themselves. Vladislav Volkov, WA Licensed Contractor, has handled 100+ projects like this across the Seattle Metro since 2017. Deadline penalties are written into the contract. Line-item quotes before any wall opens.

localContext: |
  The Richmond Beach and Ridgecrest corridors are dense with 1960s-70s split-levels and ranchers — Douglas-fir framing that's held up through 60 years of Puget Sound rain, but original cast-iron drain lines, undersized electrical panels, and galvanized supply lines that fail mid-remodel. Over in 98133 near Shoreline Community College, a mix of 1970s ranch-styles and 1980s infill is finally getting first full gut renovations. Each era brings its own structural and mechanical surprises.

commonProblems:
  - title: "City of Shoreline Permits vs. What Homeowners Expect"
    description: "Shoreline runs its own building department — not Seattle SDCI, not King County DPER. Plan review for a major kitchen-bath remodel or addition typically runs 4-8 weeks. Miss a rough-in inspection on MEP work and the inspector won't sign off without re-exposing the framing. Budget the schedule around AHJ timelines, not the cabinet delivery date."
  - title: "Structural Surprises Behind Mid-Century Walls"
    description: "Demo in a 1965 Shoreline rancher and you'll find non-bearing walls carrying real load, deteriorated blocking, headers that should be LVL beams, and sister joists from a 1990s patch job no one documented. Each find reshuffles the sub schedule. On a $130K project, a two-day structural delay compounds fast."
  - title: "Multi-Trade Sequencing on Full Kitchen Gut-Remodels"
    description: "A 98155 kitchen gut means rough-in plumbing, a dedicated 240V circuit for the induction range, a Bosch dishwasher circuit, range hood CFM duct run, insulation, then drywall hang, tape, and mud — all in sequence, each sub waiting on the last. One delay cascades through the whole job. Coordinating that schedule is what a general contractor actually does."

faq:
  - q: "How fast can you get to Shoreline for General Contracting?"
    a: "Shoreline sits 20-25 minutes from central Seattle — Aurora Ave or I-5 depending on traffic. Vladislav can usually schedule a site walk within 48 hours of your call. Reach out at (206) 591-1096 to set up a free on-site consultation."
  - q: "Do you work with Bosch, Sub-Zero, or Thermador appliances during kitchen remodels?"
    a: "Yes. Bosch and KitchenAid are the most common in Shoreline renovations at this price point. Sub-Zero and Thermador show up on larger $150K+ projects. We coordinate the rough-in — dedicated circuits, correct panel amperage, proper cabinet cutouts — so appliance installers aren't working around errors."
  - q: "What's the realistic timeline for a whole-house renovation in Shoreline?"
    a: "City of Shoreline plan review adds 4-8 weeks before we break ground on a major remodel. Construction on a full kitchen plus two baths typically runs 10-16 weeks depending on structural finds during demo. Deadline commitments are written into the contract — missed schedule means we pay a penalty. Call (206) 591-1096 to discuss your scope."

