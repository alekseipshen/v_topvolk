title: "Shoreline Kitchen Remodel — From Galley to Open Concept"

intro: |
  Richmond Beach and the blocks around Echo Lake hold some of the densest
  concentration of 1960s ramblers in King County — kitchens where a Bosch
  dishwasher barely fits because the original layout assumed a freestanding
  apartment-size unit. Pulling that galley wall between the kitchen and living
  room is the most-requested job we do in 98155. Vladislav has run 100+ projects
  since 2023 across this part of the metro; he's seen what's inside those walls
  before they're opened.

localContext: |
  Shoreline's residential streets — especially in the 98133 and 98177 zip codes
  around Innis Arden and the Briarcrest neighborhood — run heavily 1955–1975.
  Ranch-style homes, split-levels, and the occasional craftsman infill. Original
  kitchens were 8x10 at best, built for appliances a fraction of the size a
  modern Thermador column refrigerator needs. The City of Shoreline (incorporated
  1995) runs its own permit center; structural and MEP work all goes through
  their Community Development department, not King County DPER.

commonProblems:
  - title: "Load-bearing walls blocking open-concept kitchen plans"
    description: "Most 1960s Shoreline ramblers have a structural wall exactly where
      homeowners want the pass-through. Opening it up means engineering a proper
      LVL beam — typically a 3.5x9.25 or 3.5x11.25 — carried by PSL posts tied
      down to the foundation. City of Shoreline plan review for residential
      structural work runs 4–6 weeks. This is not a weekend demo job; skip the
      engineering and the inspector will flag it on rough-in inspection."

  - title: "100-amp panels too small for induction or double ovens"
    description: "Homes in 98133 running original 100A service hit the wall fast when
      a homeowner wants a Bosch induction cooktop and a KitchenAid double wall
      oven on the same panel. Upgrading to 200A service requires coordinating a
      Puget Sound Energy meter pull, a City of Shoreline electrical permit, and
      new dedicated 240V circuits for each appliance. Budget for this before you
      order the appliances."

  - title: "Range hood venting in tight exterior-wall kitchens"
    description: "Older Shoreline ramblers often have the range on an interior wall —
      meaning a duct run of 12–20 feet to reach the exterior. A Thermador or
      KitchenAid hood rated at 600+ CFM needs properly sized ductwork (minimum
      6-inch round) to perform as rated. Undersized duct turns a 600 CFM hood
      into a 300 CFM unit and pushes grease into the ceiling cavity. This gets
      spec'd and permitted alongside the gas line rough-in modifications."

faq:
  - q: "How fast can you get to Shoreline for a kitchen remodel consultation?"
    a: "Shoreline is about 20 minutes from downtown Seattle — I-5 north to 145th
      St or Aurora Ave N, both get us there fast. We schedule free on-site
      consultations typically within the week. Call (206) 591-1096 and you'll
      reach Vladislav directly, not a sales rep."

  - q: "What appliance brands do you work with in Shoreline kitchen remodels?"
    a: "Mostly Bosch and KitchenAid in Shoreline's income range — Thermador
      column fridge/freezer pairs show up on higher-budget jobs, occasionally
      Sub-Zero in Innis Arden. We handle cabinet opening dimensions, range hood
      CFM and duct sizing, and gas line rough-in or 240V circuit rough-in
      depending on whether it's gas or induction."

  - q: "Do I need permits for a full kitchen remodel in Shoreline, and how long does it take?"
    a: "Yes — structural, electrical, plumbing, and gas work all require City of
      Shoreline permits. Plan review typically 4–6 weeks for residential. Build
      time: 6–10 weeks depending on scope. Deadline is written into our contract
      with a penalty clause. WA Licensed Contractor. Call (206) 591-1096 to
      walk through timeline before you commit to anything."