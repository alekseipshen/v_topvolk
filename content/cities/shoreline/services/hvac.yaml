      (206) 591-1096 to book directly. No call center, no sales rep, just a
      direct conversation about what your HVAC system actually needs.

  - q: "What does a heat pump installation cost in Shoreline?"
    a: |
      A single-zone ductless mini-split (Mitsubishi or Daikin) for an ADU or
      bonus room typically runs $4,500-$7,500 installed. A whole-home ducted
      heat pump conversion — pulling out a gas furnace and installing a
      cold-climate heat pump with the existing duct system — usually lands
      between $9,000 and $16,000 depending on electrical panel capacity and
      duct modifications needed. IRA federal tax credits (up to $2,000) and PSE
      utility rebates can meaningfully reduce out-of-pocket cost. TopVolk's
      on-site quote gives you a firm line-item price, not an estimate range
      that balloons after demo. Call (206) 591-1096 or schedule a free
      on-site consultation to get a real number.

  - q: "Do HVAC replacements in Shoreline require a city permit?"
    a: |
      Yes. The City of Shoreline requires a mechanical permit for furnace
      replacements, heat pump installations, and significant ductwork
      modifications. Shoreline has its own building department — this is not
      a Seattle SDCI permit and not a King County DPER application. Plan review
      for a mechanical permit typically takes 1-3 weeks. As a WA Licensed
      Contractor, TopVolk handles the permit application, submits required
      equipment specifications, schedules the rough-in inspection, and closes
      out the final inspection. Homeowners don't need to navigate the city
      portal or track inspection windows — that's built into project
      management from day one.

  - q: "Can you add central air conditioning to my existing Shoreline furnace?"
    a: |
      Usually yes — if the furnace is under 15 years old and the blower motor
      is sized adequately. Adding split-system AC means installing an evaporator
      coil in the supply plenum, a condensing unit outside, and refrigerant
      line sets connecting the two. The limiting factor in older Shoreline homes
      is duct static pressure: a system moving 800 CFM for heating may not
      distribute cooling effectively across the whole house without duct
      modifications. Vladislav checks existing duct capacity on-site before
      recommending an add-on cooling system — an undersized duct system paired
      with a new AC unit is a recipe for short-cycling and poor comfort. A
      properly matched AC addition to an existing furnace typically runs
      $4,000-$7,000 installed, mechanical permit included.

  - q: "How long does HVAC equipment last in the Seattle-area climate?"
    a: |
      Gas furnaces in the Puget Sound region typically run 18-25 years with
      annual maintenance — the mild, humid climate is less punishing on heat
      exchangers than extreme-cold markets. Heat pumps generally see 15-20
      years; Mitsubishi and Daikin ductless systems often reach 20+ years with
      regular filter cleaning and annual refrigerant checks. The bigger
      durability variable in Shoreline is ductwork: original 1960s-70s flex
      duct with deteriorated inner liner can outlast two furnace replacements
      while leaking a third of conditioned air. Most major equipment brands
      (Mitsubishi, Bosch, Carrier) carry 10-year parts warranties when
      registered by a licensed contractor at installation. Vladislav registers
      the equipment warranty at project closeout — it's on the punch list, not
      an afterthought.

