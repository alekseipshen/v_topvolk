title: "Shoreline HVAC — Heat Pumps, Mini-Splits & Duct Sealing"

intro: |
  Shoreline's post-war ranchers and 1960s split-levels — the kind filling the
  blocks between Aurora Ave N and 15th Ave NE in Meridian Park — shipped with
  gas furnaces that are now pushing 25 to 30 years old. Heat pump conversions
  have become the dominant call here since the Inflation Reduction Act rebates
  kicked in: up to $2,000 back on qualifying cold-climate heat pumps, stacked
  with Puget Sound Energy utility rebates that can pull another $1,000-$1,500
  off the top. A Mitsubishi Hyper-Heat unit handles Shoreline's damp winters —
  rain running hard from October through April, with occasional January freezes
  — without the efficiency drop standard heat pumps hit at 35°F. TopVolk
  Construction LLC has completed 100+ projects across King County since 2017,
  and Vladislav Volkov handles estimates directly. The quote reflects actual
  site conditions at your house in Richmond Beach or Echo Lake — not a
  templated number from a sales rep who's never seen your ductwork.

localContext: |
  The 98133 zip code — Meridian Park, Parkwood, and the stretch up toward
  Shoreline Community College — runs almost entirely on 1950s-70s construction.
  Much of that housing has original galvanized sheet-metal ductwork, undersized
  by today's Manual J load calculations, leaking 20-30% of conditioned air
  before it reaches the registers. Over in 98155 (Briarcrest, Echo Lake,
  Hillcrest Terrace), split-level floor plans create the classic HVAC headache:
  lower-level rooms finished in the 1980s without proper duct extension run
  8-12°F colder in January than the main floor. Crawlspace moisture adds to the
  load — Puget Sound's 37+ inches of annual rainfall migrates up through
  unprotected crawl floors, forcing heating systems to condition humid air and
  accelerating duct lining deterioration. HVAC permits in Shoreline run through
  the City of Shoreline building department on 175th St NE — not Seattle SDCI,
  not King County DPER — so permit timelines and submittal requirements differ
  from what Seattle homeowners are used to.

commonProblems:
  - title: "Aging Gas Furnace Replacement with Heat Pump Conversion in 98133"
    description: |
      Most of the original 80% AFUE gas furnaces in Meridian Park and Parkwood
      are at or past 20 years. Replacing one with a Mitsubishi Hyper-Heat or
      Bosch IDS Premium heat pump qualifies for the IRA's $2,000 heat pump tax
      credit plus PSE rebates — the combined incentive stack can offset
      $3,000-$5,000 of total project cost. Before swapping equipment, the
      existing duct system needs a static pressure check: trunk-and-branch
      ductwork sized for an 80,000 BTU furnace may not move air efficiently
      under the lower static pressure a heat pump requires. Budget
      $9,000-$16,000 for a full ducted heat pump conversion, including any
      electrical panel upgrade (many 1960s Shoreline panels need a 200-amp
      service to support a heat pump). The City of Shoreline mechanical permit
      typically takes 2-3 weeks for review. Vladislav pulls the permit,
      schedules the rough-in inspection, and closes out the final inspection —
      that's all included in the project scope.

  - title: "Ductless Mini-Split Installation for ADUs and Finished Bonus Rooms"
    description: |
      Under WA HB 1337 (2024), Shoreline homeowners can build up to two ADUs on
      a single-family lot — a detached DADU in the backyard or an attached AADU
      in the basement. Neither space typically has ductwork, and running new
      ducts through an existing 1960s-70s house is often more disruptive and
      expensive than a ductless system. A Mitsubishi MXZ multi-zone or Daikin
      Aurora mini-split handles a 400-600 sq ft ADU efficiently and qualifies
      for PSE heat pump rebates. Installation runs 1-2 days once equipment
      arrives: refrigerant line sets through the rim joist or exterior wall,
      wall-mounted air handler inside, condenser on a concrete pad or wall
      bracket outside. A single-zone ductless system typically costs
      $4,500-$7,500 installed depending on line set length and the electrical
      work required. Multi-zone setups serving two or three rooms add
      $2,000-$3,500 per additional indoor head unit.

  - title: "Ductwork Sealing and Rebalancing — Hot and Cold Rooms in 98155"
    description: |
      Echo Lake and Briarcrest split-levels are notorious for uneven
      temperatures: the main floor runs fine while the bonus room above the
      garage sits 10°F colder in January. The cause is usually a combination of
      undersized branch ducts, failed mastic seals at trunk connections, and
      missing balancing dampers. Aeroseal duct sealing — a pressurized aerosol
      process that seals leaks from inside the duct without opening walls — can
      cut duct leakage by 90% and typically costs $1,500-$2,500 for a
      single-story or split-level home. For rooms that are genuinely undersized
      on airflow, adding a jump duct or upsizing the branch duct diameter gets
      more CFM where it's needed. This is diagnostic work first: a duct blaster
      test before and after quantifies actual leakage reduction, not estimates.
      TopVolk is a WA Licensed Contractor — duct sealing projects over certain
      scope thresholds require a mechanical permit through Shoreline's building
      department, which Vladislav handles.

  - title: "High-Efficiency Furnace Replacement (95%+ AFUE) with New Venting"
    description: |
      Swapping an older 80% AFUE furnace for a 95%+ AFUE condensing unit
      changes the venting entirely: high-efficiency units exhaust through
      Schedule 40 PVC pipe because the flue gas is cool enough to condense,
      not through the existing B-vent or metal flue liner. That means new
      penetrations through the rim joist or an exterior wall — worth planning
      before the old unit comes out so rough-in work doesn't become an
      afterthought. Carrier, Lennox, and Trane all make solid 96-98% AFUE
      two-stage furnaces in the $4,500-$8,000 installed range for a typical
      Shoreline ranch or split-level. The City of Shoreline requires a
      mechanical permit for furnace replacement; plan 1-2 weeks for permit
      issuance. Missed project milestones cost TopVolk money — deadline penalty
      terms are written into the contract, so the timeline commitment is
      tangible, not a verbal promise.

  - title: "Smart Thermostat Upgrades and Zoning in Older Forced-Air Systems"
    description: |
      Fitting a Nest Learning Thermostat or ecobee SmartThermostat Premium onto
      a 1970s forced-air system is usually straightforward — unless the existing
      thermostat wiring is two-wire (no common wire). Older Shoreline homes
      frequently have this setup, which means either installing a C-wire adapter
      or running new thermostat wire through finished walls. True zoning goes
      further: zone dampers installed in the duct trunk lines, a zone control
      board, and separate thermostat wiring to each zone. A two-zone conversion
      typically runs $1,800-$3,200 depending on duct layout and access. Done
      right on a Shoreline split-level where the upper floor sits empty during
      work hours, ecobee occupancy sensing with zoning can cut heating costs
      15-25% annually. Vladislav walks through the existing duct layout and
      wiring on-site before quoting — no assumptions about what a 1968 rancher
      actually has in its walls.

faq:
  - q: "How fast can you get to Shoreline for an HVAC estimate?"
    a: |
      Shoreline is a straightforward run — up I-5 or Aurora Ave N depending on
      time of day, typically 20-30 minutes from central King County. Vladislav
      schedules on-site estimates within 3-5 business days of your call. The
