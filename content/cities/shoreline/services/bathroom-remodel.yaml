title: "Shoreline Bathroom Remodel — Mid-Century Baths Rebuilt Right"

intro: |
  The split-levels and ranchers along 185th St NE in 98155 were built mostly between 1958 and 1972. Their bathrooms show it. Kohler fixtures from the early 90s. Four-inch ceramic tile set over gypsum board with zero waterproofing. Subfloor rot nobody flagged at closing. Vladislav Volkov has opened enough of these walls near Richmond Beach Saltwater Park to know the vanity swap is the easy part — it's what's underneath that determines whether the remodel holds.

localContext: |
  Shoreline splits into two clear housing eras. Mid-century ranchers and split-levels from 1955 to 1975 cluster near Echo Lake and along Aurora Ave N in 98155 — post-and-pier foundations, cast-iron drain stacks, and original 3-fixture baths with almost no clearance. East toward 15th Ave NE into 98133, 1980s-90s tract builds take over, where builder-grade fiberglass tub surrounds have started delaminating at the corners. Both eras need real substrate and waterproofing work — not just new tile laid over old problems.

commonProblems:
  - title: "No Waterproofing Membrane Behind Original 1960s Tile Surrounds"
    description: |
      Before 1980, virtually every tub surround in Shoreline was set over standard gypsum board — no waterproofing layer between the wet zone and the framing. Cracked grout lets moisture in, and PNW humidity means it never fully dries. Full fix: demo to studs, apply Schluter Kerdi or RedGard membrane, then new cement board and large-format porcelain. Skipping the membrane and retiling over the existing backer is a five-year fix at best.
  - title: "Cast-Iron Drain Stacks Blocking Master Bath Layout Changes"
    description: |
      Mid-century ranchers in 98155 typically run 3-inch cast-iron drain stacks through interior walls rather than down through the floor. Moving a toilet or repositioning the shower requires cutting that stack, adding a cleanout, and re-roughing the drain to new locations. City of Shoreline Development Services requires a rough-in inspection before subfloor closes — budget 3-4 weeks for permit plan review before demo begins.
  - title: "Subfloor Rot from Crawlspace Moisture in Post-and-Pier Homes"
    description: |
      Post-and-pier foundations near Echo Lake and the Richmond Beach corridor create persistent humidity in first-floor bathrooms. A failed wax ring or years of splash at the tub curb compounds the problem fast. Scope typically includes replacing damaged OSB or plywood, installing DriCore subfloor panels in high-moisture zones, and correcting the vapor barrier in the crawl before any new floor tile goes down.

faq:
  - q: "How fast can you get to Shoreline for Bathroom Remodel?"
    a: |
      Shoreline is 20-25 minutes north of Seattle on I-5 or straight up Aurora Ave N — no major logistics issues. Vladislav schedules free on-site consultations, usually within a week of first contact. Missed deadlines carry a penalty written into the contract. Call (206) 591-1096 to check current availability.
  - q: "Do you work with Kohler, Toto, and Moen fixtures in older Shoreline homes?"
    a: |
      Yes — Kohler, Toto, and Moen cover the majority of fixtures in Shoreline remodels. Older rough-in dimensions don't always match current product specs, so confirming supply line placement and drain rough-in location happens before fixtures are ordered. Grohe pressure-balance valves come up often in higher-end 98155 homes as well.
  - q: "How long does a bathroom remodel take in Shoreline, and what permits are involved?"
    a: |
      City of Shoreline Development Services handles all permits within city limits — plan review for a full bath remodel typically runs 3-5 weeks. After permit, a standard master bath takes 5-7 weeks: rough-in inspection, tile, finish work, blue tape walkthrough, punch list. Total from signed contract to done: 8-12 weeks. TopVolk is a WA Licensed Contractor with 100+ remodels completed since 2017. Call (206) 591-1096 — you'll talk directly to Vladislav, not a sales rep.