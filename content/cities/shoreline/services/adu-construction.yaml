title: "Shoreline ADU Construction — Turning 1960s Lots Into Rental Income"

intro: |
  Shoreline Community College enrolls roughly 10,000 students annually, and that enrollment —
  combined with the tech corridor running up SR-99 and I-5 — keeps rental vacancy rates in 98133
  and 98155 consistently low. That's the practical reason homeowners in Echo Lake and Richmond
  Highlands are calling about DADUs right now. WA HB 1337, which took effect in 2024, lets you
  build up to two ADUs on a standard single-family lot statewide — no King County DPER process
  required here, since Shoreline is an incorporated city with its own permit center. A
  640-square-foot detached ADU with a Navien tankless water heater and a Mitsubishi mini-split for
  heating and cooling is a realistic, permitted structure on most Shoreline lots — and at current
  market rents near Shoreline Community College, it pencils out faster than most homeowners expect.
  Vladislav Volkov has completed ADU builds across King County since 2023 — call (206) 591-1096 to
  schedule a free on-site walkthrough of your specific lot.

localContext: |
  Most of Shoreline's residential lots were platted in the 1950s and 1960s, during the same
  post-war buildout that shaped Kenmore, Mountlake Terrace, and Lake Forest Park. That era
  produced a lot of 7,000–9,000 square-foot parcels — enough room for a rear DADU if you clear
  setback lines (typically 5 feet from side and rear property lines under Shoreline's municipal
  code) and stay under the 24-foot height limit. In Richmond Highlands, zip code 98155, lots tend
  to run slightly larger and flatter, which simplifies foundation decisions and grading costs for a
  new detached unit. Down in the 98133 corridor near Echo Lake and the Aurora Ave N business
  district, you'll find more sloped terrain — that affects crawlspace vs. slab choices and can add
  $15,000–$25,000 in site prep. Shoreline processes ADU permits through its own Permit Center on N
  175th St., not King County DPER, which matters because submittal requirements and correction
  cycles differ between jurisdictions. First-pass plan review for a complete ADU submittal in
  Shoreline currently runs 6–10 weeks.

commonProblems:
  - title: "DADU vs. Attached ADU: Which One Actually Fits Your Shoreline Lot"
    description: |
      Most homeowners arrive thinking DADU — separate structure out back, private entrance, better
      rental appeal. That works cleanly on the larger, flatter lots in Richmond Highlands (98155),
      but on narrower 50-foot-wide parcels near Echo Lake, a detached unit can run into setback
      problems before you even reach 400 square feet of usable floor area. Shoreline's lot coverage
      limits cap total impervious surface, and an existing driveway plus the primary house can
      already consume most of the allowance. An attached ADU — converted garage or ground-floor
      addition — is often the more viable path on tighter parcels. Structurally, those two routes
      diverge significantly: an AADU requires integrating a new load path through the existing LVL
      beam or header system, while a DADU starts from scratch with its own foundation, PT lumber
      framing, and separate utility rough-ins. Vladislav pulls lot dimensions and coverage math
      before the first design meeting — no guessing at feasibility.

  - title: "Utility Separation: Shared vs. Independent Connections Under Shoreline Code"
    description: |
      Shoreline allows shared utility connections between the primary house and an ADU in most
      cases — but shared doesn't always mean smarter. A shared sewer lateral works fine for a
      basement AADU where the owner lives on-site, but a long-term rental DADU with independent
      tenants is easier to manage with separate water metering and billing. The City of Shoreline
      requires a separate electrical service panel for any ADU — that means a new 100A or 200A
      sub-panel, a dedicated meter socket, and a Puget Sound Energy service connection request that
      can take 6–10 weeks on its own. Plumbing rough-in for a standalone unit also needs its own
      cleanout access point, something that becomes expensive to retrofit after the slab is poured.
      Getting MEP coordination locked in during the design phase prevents the most common
      mid-construction cost surprises. A Navien NPE-240A tankless unit handles domestic hot water
      for a 600-square-foot DADU without requiring a dedicated water heater closet.

  - title: "Shoreline's ADU Permit Process — What to Submit and How Long It Actually Takes"
    description: |
      ADU permit submittals in Shoreline go to the City's Permit Center on N 175th St. A complete
      package needs a site plan showing setbacks and lot coverage calculations, architectural floor
      plans and elevations, a foundation plan, and a Washington State Energy Code compliance
      worksheet. Shoreline reviews zoning, structural, mechanical, and energy code simultaneously
      on a complete submittal — which is faster than sequential review, but only if the drawings
      are right the first time. First-pass plan review runs roughly 6–10 weeks. Resubmittals after
      correction comments can add another 4–6 weeks if the redlines require significant drawing
      revisions. TopVolk manages the permit process start to finish — Vladislav coordinates with
      the AHJ directly on correction responses and tracks review status without routing
      communication through a project manager you've never spoken to. WA Licensed Contractor, 100+
      projects completed since 2023. Call (206) 591-1096 to talk through what a realistic permit
      timeline looks like for your specific address.

  - title: "ADU Construction Costs in Shoreline — What Moves the Number Up or Down"
    description: |
      A 600-square-foot DADU in Shoreline built on a standard slab foundation runs roughly
      $185,000–$265,000 all-in — that figure includes design fees, permit fees, all trade work, PSE
      service connection, and finish work. Slope is the biggest variable on the cost side: a graded
      lot in the 98133 corridor can add $15,000–$30,000 in excavation and foundation work before
      framing even starts. Finish level matters too — an open-plan layout requiring a long LVL beam
      span costs more than simple load-bearing stick-frame rooms, and appliance selections (Bosch
      800-series induction range vs. builder-grade) move the number. An attached ADU converting an
      existing garage or basement typically lands in the $90,000–$150,000 range, since the
      structure is already there. The Puget Sound Energy electrical service connection alone runs
      $8,000–$15,000 depending on transformer distance. Shoreline's rental market — with
      Shoreline Community College pulling student demand and SR-99 drawing service-sector workers
      — means most DADUs recover construction costs within 8–12 years at current rents.

  - title: "Building an ADU That Holds Up to Shoreline's Climate and Mid-Century Site Conditions"
    description: |
      Shoreline gets roughly 37 inches of rain annually, and a north-facing DADU exterior wall
      will start growing moss by year three if the siding spec is wrong. Hardie cement-board
      siding (HardiePlank lap profile) is the standard choice here — rot-resistant, low
      maintenance, and compatible with Shoreline's rainy season that runs October through May.
      Cedar shake looks better but demands repainting or re-staining on a 5–7 year cycle in this
      climate. R-49 insulation in the ceiling cavity and a code-compliant vapor barrier in the
      crawlspace (if you skip the slab) aren't optional — they're required under the IRC and
      Washington State Energy Code for this climate zone. A Mitsubishi MXZ multi-zone mini-split
      handles heating and cooling without extending a gas line to the new structure. Before final
      inspection, the blue tape walkthrough covers finish items — grout joints on large-format
      porcelain tile in the bathroom, the Schluter Kerdi transition at the curbless shower
      threshold, trim gaps at window jambs — so the punch list is clear before the inspector
      arrives.

faq:
  - q: "How fast can TopVolk get out to Shoreline for an ADU consultation?"
    a: |
      Shoreline is a straightforward run up I-5 from Seattle — 20 to 35 minutes depending on
      traffic, with good highway access from both the N 145th St. and N 175th St. exits. TopVolk
      schedules on-site consultations in Shoreline within a few business days of first contact.
      The visit is free and done by Vladislav directly — you're talking to the person who runs
      the project, not a salesperson who disappears after the contract is signed. From initial
      consultation to permit submittal typically runs 3–5 weeks once design drawings are
      finalized. Call (206) 591-1096 to set up a time.

  - q: "What does ADU construction cost per square foot in Shoreline?"
    a: |
      A DADU in Shoreline typically runs $280–$420 per square foot for a complete permitted build
      — design, permits, all trades, and finish work included. At 600 square feet, that puts a
      full build in the $168,000–$252,000 range before the Puget Sound Energy service connection
      cost. Slope, retaining walls, and finish grade push the number higher; a simple slab-on-
      grade lot on the flatter sections of 98155 comes in at the lower end. An attached ADU
      converting existing structure runs $150–$220 per square foot. Exact pricing requires an
      on-site visit — Vladislav provides line-item quotes after seeing the lot, not ballpark
      ranges. Call (206) 591-1096 to schedule a free estimate.

  - q: "Does Shoreline use King County DPER for ADU permits, or does the city have its own process?"
    a: |
      Shoreline is a fully incorporated city, so ADU permits go through the City of Shoreline
      Permit Center on N 175th St. — not King County DPER. The submittal package requires site
      plans, full architectural drawings, energy code compliance documentation, and structural
      calculations if the design includes non-standard spans or LVL beam work. WA HB 1337 (2024)
      eliminated most of the owner-occupancy restrictions that previously blocked ADU projects
      statewide, so most Shoreline homeowners on standard single-family lots can now build up to
      two ADUs. TopVolk is a WA Licensed Contractor and manages the full permit cycle: submittal,
      correction responses, rough-in inspections, and final inspection sign-off.

  - q: "Can you build a curbless shower and open-plan layout inside a 600-square-foot DADU?"
    a: |
      Both are standard on a TopVolk ADU build. A curbless shower with Schluter Kerdi
      waterproofing membrane and 24x24 large-format porcelain tile makes a compact bathroom feel
      larger and drains properly without a curb transition. For the living area, a single LVL beam
      spanning the unit's width eliminates interior load-bearing walls and opens the floor plan.
      Recessed lighting on dimmer-compatible LED circuits, a Bosch 300-series dishwasher, and an
      induction range paired with a range hood rated at 400 CFM or better make a 380–420 square-
      foot kitchen and living zone genuinely functional for a long-term tenant — not a vacation
      rental afterthought.

  - q: "What warranty does TopVolk provide on ADU construction in Shoreline?"
    a: |
      Workmanship warranty covers defects in labor and installation for three years from the
      certificate of occupancy — standard for licensed general contracting in Washington State.
      Material warranties pass through from manufacturers: James Hardie siding carries a 30-year
      limited warranty, Mitsubishi mini-split compressors are covered for 12 years with
      registration, and Navien tankless water heaters carry a 15-year heat exchanger warranty.
      Structural work falls under Washington's construction defect statute (RCW 64.50), which
      extends the liability period for latent defects beyond the workmanship term. One more thing:
      deadline penalties are written into the contract — if TopVolk misses agreed milestones,
      there's a financial consequence built into the agreement, not just a verbal commitment.

  - q: "Does TopVolk build ADUs in cities near Shoreline, like Kenmore or Mountlake Terrace?"
    a: |
      The full service area covers King County and Snohomish County — Kenmore (98028), Mountlake
      Terrace (98043), Lake Forest Park, Bothell, Lynnwood, and Edmonds are all active project
      areas. Each city runs its own permit center with slightly different ADU requirements: Kenmore
      has its own building department, while unincorporated Snohomish County areas route through
      Snohomish County PDS. Being owner-operated means Vladislav tracks which jurisdiction's code
      applies to your specific address — that consistency tends to slip when large GCs rotate
      project managers between jobs. Call (206) 591-1096 or schedule a consultation online to get
      started.