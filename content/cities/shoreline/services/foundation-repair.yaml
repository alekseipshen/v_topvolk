title: "Shoreline Foundation Repair — Pier & Seismic Retrofit Work"

intro: |
  Sagging floors in a 1963 rancher near Echo Lake Park aren't a sign the house
  is "just old." They're a sign that the post-and-pier foundation underneath has
  been losing ground — literally — through sixty-plus years of wet PNW winters.
  Shoreline's housing stock runs heavy on mid-century construction: single-story
  ramblers and split-levels built between 1952 and 1975, most of them on
  crawlspace foundations using 4x4 or 6x6 cedar posts set on concrete pads.
  That cedar doesn't last forever, especially with Shoreline's 37-inch annual
  rainfall soaking into crawlspaces that weren't built with drainage in mind.
  Over in Richmond Beach, slope drainage off the bluff pushes surface water
  directly under homes and compounds the problem fast. We've replaced pier posts,
  injected cracked stem walls with Sika epoxy, and done full seismic retrofits on
  homes across Briarcrest and Ronald — the same types of issues, just different
  degrees of urgency depending on how long the original warning signs got ignored.

localContext: |
  The 98155 zip code — covering Ronald, Briarcrest, and central Shoreline — is
  dense with 1955–1970 construction where original post-and-pier foundations used
  Douglas-fir or cedar posts that are now well past their service life. Homeowners
  here deal with floor bounce, drifting interior doors, and drywall cracks at
  ceiling corners that trace back to the crawlspace, not the walls. Over in
  98177, the Richmond Beach and Innis Arden bluff neighborhoods deal with a
  compounding factor: slope drainage channels water downhill fast during the
  October-through-May rainy season, and that water finds the path of least
  resistance directly under older foundations. Structural foundation work in
  Shoreline — new pier installation, stem wall reinforcement, seismic retrofits —
  requires permits through the City of Shoreline Planning & Community Development
  Department. Their plan review runs 3–6 weeks for residential foundation projects
  with engineering drawings. Smaller repairs — shimming existing posts, sealing
  non-structural cracks — generally don't trigger a permit requirement, though
  we confirm scope with the city before starting anything.

commonProblems:
  - title: "Rotted Cedar and Douglas-Fir Pier Posts Under Mid-Century Crawlspaces"
    description: >-
      Original pier posts in Shoreline's mid-century homes weren't
      pressure-treated. Cedar and Douglas-fir hold up reasonably well for a
      few decades, but crawlspace humidity in a high-rainfall climate degrades
      the post base from the concrete pad upward. Once the bottom 4–6 inches of
      a post goes soft, the post compresses under load and the floor above drops.
      You feel it as a bounce near the center of a room or a noticeable slope
      toward an exterior wall. The fix involves temporary shoring with hydraulic
      jacks, removing the deteriorated post, and installing a new
      pressure-treated (PT) 6x6 on a poured concrete pad with a Simpson
      Strong-Tie ABU66 adjustable post base set in structural epoxy. For
      widespread rot across 10-plus posts, we stage the crawlspace work in
      sections to maintain safe floor support throughout. Per-post replacement
      runs $300–$600 depending on access and whether new concrete pads are
      needed. Most jobs complete in 1–3 days.

  - title: "Diagonal and Horizontal Stem Wall Cracks from Seasonal Soil Pressure"
    description: >-
      Poured concrete stem walls on 1970s–80s Shoreline homes develop two
      distinct crack patterns. Diagonal stair-step cracks at corners happen when
      differential soil settlement causes the wall to rotate. Horizontal
      mid-wall cracks are more serious — they indicate lateral earth pressure
      exceeding the wall's design capacity, which happens when clay-heavy soils
      in lower-elevation Shoreline lots absorb moisture and expand inward
      through the wet season. Hairline cracks under 1/4 inch get cleaned and
      sealed with low-viscosity Sika CrackFix or Simpson SET-XP epoxy injection
      — product choice depends on crack moisture content at time of repair.
      Active horizontal cracks showing measurable inward deflection need carbon
      fiber strap reinforcement anchored from footing to top plate, using
      Fortress Stabilization carbon fiber staples. We photograph and measure
      cracks before work begins to document the baseline. Epoxy injection runs
      $400–$800 per linear foot; carbon fiber straps run $1,200–$2,500 per
      strap installed.

  - title: "Seismic Retrofit: Mudsill Bolting and Cripple Wall Sheathing"
    description: >-
      Homes built in Shoreline before 1980 — the bulk of 98155 and much of
      98177 — were constructed before anchor bolt requirements became standard.
      The mudsill sits on the foundation stem wall but isn't mechanically
      connected to it. In a Cascadia Subduction Zone event, that unbolted sill
      plate is the first thing that slides. The prescriptive fix follows the
      FEMA P-1100 methodology: drill through the mudsill into the stem wall, set
      Simpson Strong-Tie UFP10 anchor bolts in structural epoxy at code-required
      spacing, then sheathe cripple walls with 3/8-inch structural plywood to
      create a proper shear wall. This scope requires a structural permit from
      the City of Shoreline Planning & Community Development Department; plan
      review with a complete engineering package typically takes 3–5 weeks.
      TopVolk Construction LLC (WA Licensed Contractor) handles permit
      preparation, engineer coordination, and all required rough-in and final
      inspections. A full mudsill and cripple wall retrofit on a 1,400 sq ft
      rancher runs $8,000–$14,000 and takes 3–5 days on site.

  - title: "Crawlspace Flooding and Drainage System Failures"
    description: >-
      Echo Lake basin properties in 98155 and low-lying lots along SR-99 deal
      with seasonal high water tables that push groundwater under the crawlspace
      floor from November through March. Standing water accelerates post rot,
      grows mold on subfloor sheathing, and softens the bearing soil under
      concrete pier pads. A Zoeller M53 submersible sump pump in a properly
      sized basin handles active water intrusion, but sump alone doesn't solve
      the problem if the perimeter drainage isn't moving water away first. We
      install 4-inch perforated drain tile around the crawlspace perimeter,
      sloped to the sump basin, and lay a 20-mil polyethylene vapor barrier
      across the entire crawlspace floor — taped at seams, lapped up foundation
      walls. Exterior grading and downspout extension work typically run
      alongside, since a missing downspout extension can dump 300–500 gallons
      per storm within 18 inches of your foundation. Full crawlspace drainage
      system with sump: $4,500–$9,000 depending on square footage and soil
      conditions.

  - title: "Sagging Mid-Span Floors and LVL Beam Replacement"
    description: >-
      Post-and-pier foundations can have solid piers while the beams spanning
      between them have deflected significantly at mid-span. On Shoreline's
      1960s split-levels and ramblers, the original carrying beam is typically a
      built-up 3-ply 2x10 or 2x12 — adequate when new, but 50–60 years of load
      cycling and moisture exposure cause measurable mid-span creep that
      shimming at the pier post can't fix. The correct repair replaces the
      sagging span with a properly engineered LVL (laminated veneer lumber) beam
      sized by a structural engineer, supported on new PT posts or PSL post
      columns with solid bearing to the crawlspace floor. We start every floor
      leveling job with a laser level survey across the crawlspace to map actual
      deflection before touching anything — that gives you a documented
      before-and-after measurement. Floor leveling with LVL beam replacement on
      a 1,200–1,800 sq ft home runs $4,000–$9,000 and typically takes 2–4 days
      depending on beam span and crawlspace access.

faq:
  - q: "How fast can you get to Shoreline for Foundation Repair?"
    a: >-
      Shoreline is a straightforward drive from Seattle — I-5 north to 145th or
      175th Street, or SR-99 straight through the city, typically 20–35 minutes
      depending on traffic. For most projects, I can schedule a free on-site
      consultation within 3–5 business days of your call. The estimate is
      line-item specific, not a vague range padded for negotiation. Non-permit
      repairs like pier post replacement or epoxy crack injection can start
      within 2–3 weeks of a signed contract. Permit-required work — seismic
      retrofits, structural beam replacement — depends on City of Shoreline plan
      review, typically 3–6 weeks from a complete submittal. Call
      (206) 591-1096 to get on the calendar.

  - q: "What does foundation repair cost in Shoreline?"
    a: >-
      Scope drives price. Epoxy injection runs $400–$800 per linear foot of
      crack. Pier post replacement runs $300–$600 per post. A full seismic
      retrofit on an average Shoreline rancher runs $8,000–$14,000. Crawlspace
      drainage with sump installation runs $4,500–$9,000. Those are real numbers
      drawn from 100+ projects completed across King County since 2017 — not
      placeholder estimates padded for negotiation. You speak directly with
      Vladislav Volkov, the owner, not a salesperson. The on-site consultation
      produces a written, line-item quote before any commitment is made.
      Deadline penalties for missed project milestones are written into the
      contract. Call (206) 591-1096 to schedule.

  - q: "Does foundation work in Shoreline require a permit?"
    a: >-
      Structural foundation work goes through the City of Shoreline Planning &
      Community Development Department at 17500 Midvale Ave N. Mudsill bolting,
      pier replacement involving new concrete, stem wall reinforcement with
      carbon fiber or epoxy anchors, and seismic retrofits all require a
      structural permit with engineering drawings. Plan review on residential
      foundation projects typically runs 3–6 weeks from a complete submittal.
      Non-structural crack sealing and minor shimming of existing posts generally
      doesn't trigger a permit requirement, though we confirm with the city
      before starting work. TopVolk Construction LLC (WA Licensed Contractor)
      handles permit preparation, engineer-of-record coordination, and all
      required inspections — you don't need to manage the permit office yourself.

  - q: "Can you handle seismic retrofits specifically, not just crack repair?"
    a: >-
      Yes — seismic retrofit is a separate scope and often the more urgent
      investment for pre-1980 Shoreline homes. The standard prescriptive
      retrofit per FEMA P-1100 covers mudsill anchor bolts (Simpson Strong-Tie
      UFP10 installed in structural epoxy), cripple wall sheathing with 3/8-inch
      structural plywood, and blocking between joists at the mudsill line. For
      Richmond Beach homes on sloped lots in 98177, we also assess whether the
      uphill foundation wall needs supplemental hold-down hardware to resist
      differential lateral load. The work happens entirely in the crawlspace and
      typically takes 3–5 days. We prepare the full engineering package, submit
      to the City of Shoreline Planning & Community Development, and schedule
      rough-in and final inspections. Day-to-day life in the house isn't
      disrupted during construction.

  - q: "How long does foundation repair last in a wet Pacific Northwest climate?"
    a: >-
      Pressure-treated pier posts on poured concrete pads with proper crawlspace
      drainage should last 40-plus years in Shoreline's high-humidity
      environment — significantly longer than the untreated cedar they replace.
      Sika and Simpson SET-XP epoxy-injected cracks cure to higher compressive
      strength than the surrounding concrete and don't re-open under normal
      conditions. Carbon fiber strap systems from Fortress Stabilization carry a
      25-year product warranty from the manufacturer. Our labor warranty is
      2 years on all foundation work. What shortens that lifespan: deferred
      crawlspace drainage maintenance, exterior grading changes that route water
      back toward the foundation, or a damaged vapor barrier that lets ground
      moisture back in. We document baseline conditions with photos at project
      close so you have a reference point for future inspections.

  - q: "Do you work in cities near Shoreline — like Kenmore or Mountlake Terrace?"
    a: >-
      Service area covers King County and Snohomish County broadly. Kenmore,
      Lake Forest Park, Mountlake Terrace, Bothell, Lynnwood, and Edmonds are
      all on the regular schedule. Snohomish County foundation work in
      unincorporated areas goes through Snohomish County PDS; incorporated
      cities like Mountlake Terrace and Edmonds have their own permit centers
      with separate review timelines. Scheduling for an on-site estimate is
      typically 3–5 business days out. Non-permit repairs can start within 2–3
      weeks of signing; permit-required projects follow the applicable plan
      review timeline. Call (206) 591-1096 to discuss your project and get a
      realistic start date.