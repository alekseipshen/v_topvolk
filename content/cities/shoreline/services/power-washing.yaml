title: "Shoreline Power Washing — Moss, Algae & Cedar Deck Prep"

intro: |
  Ridgecrest homes with mature Douglas-fir canopy overhead get maybe six weeks of real drying
  time on their concrete and cedar decks between October and May. By the time spring arrives,
  the organic film on north-facing surfaces has been building uninterrupted since the previous
  fall. Shoreline's 98155 zip code channels enough Puget Sound moisture inland that shaded
  surfaces stay damp well into June — moss doesn't need much encouragement to establish on
  concrete or between fence boards under those conditions. Echo Lake-area properties in 98133
  deal with the same pattern: Hardie siding panels, brick pathways, and cedar decks all pick
  up the same green-black film season after season. Power washing here is prep work first,
  cosmetic improvement second. You can't stain a deck or repaint siding on a surface that
  spent nine months wet and is still holding mold in the grain. TopVolk handles these
  assessments on-site — Vladislav Volkov evaluates surface conditions himself before any
  equipment gets quoted. 100+ projects completed since 2017 across King County. Call
  (206) 591-1096 to schedule a free on-site walkthrough.

localContext: |
  Shoreline's housing stock skews heavily mid-century — the 1950s and 1960s ranchers and
  split-levels concentrated across the 98155 neighborhoods west of 15th Ave NE, and the
  slightly later 1970s construction filling in 98133 around the Ridgecrest and Ronald areas.
  Concrete from that era is porous and has absorbed decades of organic staining into the
  surface layer. Cedar fencing is the default choice on lots from that period, and most of
  it runs a three-to-five-year maintenance cycle before cleaning and re-staining becomes
  unavoidable — let it go longer and the oxidation goes deep enough that washing alone won't
  recover it. The Richmond Beach corridor in 98177 adds a salt-mist layer from Puget Sound
  on top of the standard rainfall pattern, depositing minerals on brick and masonry that
  require different chemistry than straight organic buildup removal. North-facing rooflines
  across 98133 and 98155 develop aggressive moss infestations that migrate down to fascia
  boards and adjacent concrete within a season or two. Hardie cement-board siding — common
  on Shoreline homes updated through the 2000s — holds mildew in the paint layer in ways
  vinyl doesn't, making proper surface prep before any exterior repaint a genuine requirement,
  not a suggestion the painter added to pad the scope.

commonProblems:
  - title: "Moss Bonded to Concrete Driveways and Walkways Near Echo Lake"
    description: |
      Concrete driveways on north-facing lots in the 98155 zone establish live moss within two
      or three wet seasons. By March in Shoreline, the rhizoids are embedded into the slab's
      pore structure — a consumer-grade electric pressure washer won't pull them without the
      right machine capacity and technique. Commercial equipment running a surface cleaner
      attachment at 3,000-3,500 PSI strips the moss and the organic base layer it grows from.
      For heavy infestations, downstream injection of sodium hypochlorite at 1.5% dilution
      before the pressure rinse kills the root structure so it doesn't re-establish within a
      single season. EaCo-Chem NMD 80 handles concrete that has mineral staining layered
      beneath the organic buildup. Typical pricing for a 500 sq ft concrete driveway in
      Shoreline runs $125-$175, with additional cost for oil-saturated sections that need
      degreaser pre-treatment before the pressure pass goes through.

  - title: "Cedar Deck Surface Failing to Accept Stain After a PNW Winter"
    description: |
      Cedar deck boards that spent nine months wet and shaded won't take stain correctly until
      the oxidized gray surface layer is removed — the stain sits on top of that oxidized
      layer instead of penetrating the wood fiber. A wide-fan nozzle at 25 to 40 degrees,
      running at 1,200-1,500 PSI, strips that layer without raising the wood grain enough to
      cause fiber damage. After pressure washing, an oxalic acid brightener neutralizes tannin
      bleed and brings the wood's surface pH back to neutral before any finish goes on.
      Armstrong Clark and TWP 1500 series stains both specify this prep step in their
      application instructions — skipping it voids manufacturer warranty on most finish
      products. A typical 300-400 sq ft Shoreline cedar deck takes four hours for wash and
      brightener application, then needs 24-48 hours of dry time. That reliable weather window
      opens May through September; plan the stain appointment before fall rain returns.

  - title: "Mildew and Organic Film on Hardie Siding Before Exterior Repaint"
    description: |
      Sherwin-Williams Duration and Benjamin Moore Aura Exterior both specify the substrate
      must be cleaned within 30 days before paint application — that's product spec language,
      not a painter's upsell. Hardie cement-board collects mildew in the paint layer itself,
      not just on the surface, so a standard rinse won't clear it. Soft washing — lower
      pressure, higher flow volume, downstream chemical injection of diluted sodium
      hypochlorite — kills the mildew without forcing water behind panel joints or into the
      building envelope. Running high-pressure equipment directly at Hardie panel seams can
      compromise the joint sealant. A 1,500-2,000 sq ft two-story in Shoreline's 98133
      typically takes 3-4 hours to soft-wash properly. Budget 48-72 hours of dry time in
      spring conditions before the paint crew starts. Vladislav coordinates the timing
      directly with your painting contractor so the prep and paint sequence doesn't fall apart
      mid-project. TopVolk is a WA Licensed Contractor — call (206) 591-1096 to schedule.

  - title: "Oil and Tire Staining on Shoreline's Aging Post-War Concrete"
    description: |
      Post-war concrete driveways in Shoreline's 98133 and 98155 neighborhoods have absorbed
      decades of motor oil drips, tire rubber deposits, and runoff. Surface cleaner attachment
      work at 3,000+ PSI removes the contaminated top layer effectively on the first pass.
      Deep oil penetration requires degreaser pre-treatment — Simple Green Pro HD or Zep
      Heavy-Duty Degreaser applied and left to dwell 10-15 minutes before the pressure rinse
      cycles through. Even aggressive cleaning won't return heavily saturated concrete to
      original color; the goal is removing active surface contamination and the slip hazard
      it creates on wet days. Pricing runs $0.25-$0.40 per sq ft for degreaser-treated
      concrete. A 600 sq ft driveway with moderate oil staining comes in around $150-$240.
      For context, a new concrete pour in King County runs $8-$15 per sq ft installed —
      cleaning extends what you have without a permit pull or demolition.

  - title: "Cedar Fence Cleaning on the 3-5 Year PNW Maintenance Cycle"
    description: |
      Cedar fencing in Shoreline's rainfall environment needs cleaning and re-staining roughly
      every three to five years. Push that to seven or eight and the oxidation penetrates deep
      enough that pressure washing won't recover the wood — replacement becomes the next
      conversation. A low-pressure fan tip pass under 1,500 PSI strips the oxidized surface
      without raising the grain badly enough to create splintering problems for whoever applies
      the stain afterward. Most fence staining contractors working in the Seattle area require
      the fence washed and dry before they'll price or schedule the stain work — they won't
      start on a contaminated surface. A 150-linear-foot fence run — typical for a standard
      Shoreline residential lot in 98155 — takes 2-3 hours to wash. Pricing runs $1.50-$2.50
      per linear foot, or $225-$375 for that 150-foot run. Timing the wash and stain visits
      back-to-back eliminates a second mobilization charge and keeps the project on one
      scheduling window.

