  - q: "Does power washing in Shoreline require permits or HOA approval?"
    a: |
      Surface cleaning work requires no permit from the City of Shoreline. No plan review,
      no AHJ sign-off, no King County DPER involvement for a standard power washing scope.
      If the cleaning connects to a larger exterior renovation — new Hardie siding
      installation, deck construction, or a covered patio addition — permit pulls go through
      the City of Shoreline's permit center, which operates independently from Seattle SDCI.
      Unincorporated King County parcels just outside the Shoreline city boundary route
      through King County DPER instead. HOA communities in Shoreline sometimes require
      written notice before exterior work on shared fencing or common-area hardscaping,
      with typical review windows running 2-3 weeks. Vladislav handles permit coordination
      on any exterior construction that follows the cleaning phase. TopVolk is a WA Licensed
      Contractor.

  - q: "What is the difference between soft washing and high-pressure washing?"
    a: |
      High-pressure washing — typically 2,500-4,000 PSI — removes moss, staining, and
      buildup from hard surfaces through mechanical force. Right tool for concrete driveways,
      brick walkways, and stone pavers. Soft washing uses lower pressure, sometimes under
      500 PSI, with higher flow volume and downstream chemical injection of diluted sodium
      hypochlorite to kill organic growth on surfaces that can't handle mechanical force:
      painted Hardie panels, cedar fence boards, and cedar shake roof surfaces. Running
      high-pressure equipment on cedar raises the grain permanently and causes fiber damage
      that shows up in the finished stain job. Running soft wash chemistry on concrete with
      heavy oil contamination won't clean it. Knowing which method fits which surface is the
      actual skill — that call gets made on-site, not over the phone.

  - q: "How long does a power washing job last in Shoreline's wet climate?"
    a: |
      The cleaning removes accumulated buildup so protective coatings can adhere and perform
      — it doesn't create protection on its own. On north-facing concrete in Shoreline, moss
      can re-establish within 12-18 months without a post-treatment application of sodium
      hypochlorite or a no-rinse preventative like Wet & Forget applied after the pressure
      rinse. Cedar decks cleaned and properly stained typically hold a three-year interval
      before the next cleaning cycle. Hardie siding stays cleaner longer because the painted
      surface doesn't absorb organics the way cedar does, but north-facing panels in shaded
      98155 yards will show mildew again within 2-3 years. The actual maintenance interval
      depends on sun exposure, tree canopy density, and what's draining onto the surface
      from upslope.

