title: "Shoreline Fence Installation — Cedar, Vinyl & Gate Work"

intro: |
  Richmond Beach Road cuts through one of Shoreline's most tightly platted residential grids — lots from
  the 1950s and 1960s, houses sitting close together, and property lines that often haven't been
  re-surveyed in 40 years. That's the setup for the most common fence call we get in Shoreline: a
  homeowner wants a new cedar fence, assumes the rotted old posts mark the actual boundary, and discovers
  mid-installation that the assumed line sits 10 to 15 inches off the recorded lot boundary. Pouring
  concrete in the wrong location is expensive to undo. Echo Lake sees the same pattern — post-war
  ranchers, established cedar and fir trees, and root systems that turn what should be a standard
  30-inch post setting into a serious excavation project.

  Gates are the other recurring issue. D&D Technologies TruClose self-closing hinges — the right
  hardware for a wet climate — start binding and corroding within two PNW seasons when lesser zinc-plated
  versions are used instead. On Ridgecrest fences, we've rebuilt gate frames where the original hardware
  gave out before the cedar did, typically around the 3-year mark. Getting both the boundary and the
  hardware right from the start is the whole job.

localContext: |
  Most of Shoreline's residential stock went up between 1950 and 1972. Original fence posts — where
  they're still standing — were set without gravel drainage beds, often without concrete, and almost
  always with untreated lumber. In 98133, from Aurora Avenue North east toward I-5, the soil profile
  tends toward clay with poor surface drainage. Clay holds moisture against wood post bases year-round,
  accelerating rot even in pressure-treated (PT) lumber below grade.

  The Parkwood and Briarcrest neighborhoods in 98155 add another complication: mature tree canopy keeps
  north-facing fence sections in shade all winter, creating ideal conditions for moss and mildew to
  establish on cedar boards within two to three seasons. Ronald Bog Park sits in the middle of 98155,
  and the surrounding residential blocks illustrate what original 1960s post-and-soil installations look
  like today — leaning, split at the post base, and overdue for replacement. Shoreline's municipal code
  caps front-yard fences at 4 feet and side and rear fences at 6 feet. Anything taller, or any retaining
  wall fence exceeding 4 feet, requires a permit through the City of Shoreline's permit center.

commonProblems:
  - title: "Cedar Post Rot in Clay Soil — Why 8-Year-Old Fences Fail in 98133"
    description: |
      Shoreline's clay-heavy soil stays saturated from October through April, and cedar posts set without
      a proper drainage base rot from the bottom up — typically within 8 to 12 years. Correct installation
      requires 30 to 36 inches of post depth, 6 inches of crushed gravel at the base of each hole,
      pressure-treated (PT) 4x4 or 6x6 posts below grade, and concrete poured in a crown shape at the
      surface to direct water away from the wood. Simpson Strong-Tie ABA post bases add protection by
      lifting the post bottom off direct concrete contact and allowing drainage underneath. Skipping any
      of those steps cuts expected post life by half. Replacing individual rotted posts in a standing
      fence runs $175 to $325 per post, depending on how much rail and picket work needs to come down
      and go back up. Full cedar fence replacement on a 100-linear-foot run — new posts, rails, and
      pickets — typically costs $6,500 to $9,500 in Shoreline.

  - title: "4-Foot Front Yard Limit — Code Enforcement Catches This Regularly in Shoreline"
    description: |
      Shoreline enforces a 4-foot height maximum on all fences within the front yard setback, and it's
      enforced actively. On lots along 15th Avenue NE and in the Richmond Beach area, homeowners
      installing 5- or 6-foot cedar picket fences in front yards receive notices of violation within
      60 days. The front setback boundary varies by lot but is typically 20 feet back from the
      right-of-way. Side-yard fence sections that fall within the front setback zone are also limited to
      4 feet — not the 6-foot limit that applies further back on the property. Before setting any post
      near the front of a property, we pull the parcel boundary and setback line from King County's GIS
      parcel data and mark the transition point on-site. Getting this wrong means removing and rebuilding
      a fence section — typically $900 to $1,500 for a 40-foot corrected run. Fifteen minutes of parcel
      research prevents that expense entirely.

  - title: "Installing on an Unverified Property Line — What Goes Wrong and How to Prevent It"
    description: |
      A large share of Shoreline fence projects start with the homeowner pointing to the old fence and
      saying "that's the property line." Across the Echo Lake and Ridgecrest neighborhoods — especially
      on corner lots near Ronald Bog Park — we've found discrepancies of 10 to 18 inches between the
      assumed line and the recorded lot boundary. King County Assessor parcel maps give a useful rough
      picture but aren't survey-accurate. For any shared-line fence where the boundary is uncertain, a
      boundary survey through a licensed WA land surveyor before committing to post locations is the
      right call — that typically costs $700 to $1,200 for a standard Shoreline residential lot. TopVolk
      Construction is a WA Licensed Contractor — permit applications run through the City of Shoreline's
      online permit portal for projects that require one, and we draft the written neighbor cost-sharing
      agreement before any work begins.

  - title: "Cedar vs. Vinyl Over 15 Years — What the Real Cost Difference Looks Like"
    description: |
      Cedar costs less upfront — a 100-linear-foot board-on-board cedar fence in Shoreline typically
      runs $5,800 to $8,500 installed, depending on post size, slope, and gate count. Vinyl panel
      systems from manufacturers like CertainTeed or Bufftech run $7,800 to $11,500 for the same scope.
      That gap narrows over time. Cedar needs cleaning and re-staining or sealing every 3 to 5 years in
      Shoreline's rain-heavy climate — budget $500 to $900 per treatment on a 100-foot run. Vinyl needs
      an occasional wash, nothing else, and carries a 30-year manufacturer warranty against material
      defects. Homeowners in Parkwood who plan to stay long-term often find that vinyl's no-maintenance
      cost structure makes more financial sense than cedar's recurring upkeep. Horizontal slat vinyl
      panels — popular in Shoreline's newer infill construction — add $12 to $20 per linear foot over
      standard picket pricing, reflecting additional framing labor and panel alignment requirements.

  - title: "Gate Hardware Failure — What Corrodes in Two PNW Seasons and What Holds Up"
    description: |
      The most common post-installation callback in Shoreline is a gate that won't latch or swing closed
      properly. Zinc-plated hinges and standard barrel bolts corrode fast — typically within 2 to 3
      seasons in Shoreline's wet climate. The correct hardware is stainless steel throughout. D&D
      Technologies TruClose self-closing hinges and Snug Cottage Hardware gate latches are the standard
      for residential wood and vinyl gates in this climate; TruClose hinges run $40 to $70 each versus
      $8 to $15 for zinc-plated versions, but they don't need replacing every other year. Gate post
      sizing matters as much as hardware selection: a 6-foot cedar gate on a 4x4 post racks and twists
      within 3 to 4 years in PNW soil conditions. Gate posts should be 6x6 minimum, set in concrete at
      36-inch depth with a gravel drainage bed. Complete gate installation — post, frame, hardware,
      pickets, and latch — typically runs $900 to $1,900 depending on gate width and material.

