  - q: "What does fence installation cost per linear foot in Shoreline?"
    a: |
      Cedar board-on-board and cedar picket fences run $48 to $85 per linear foot installed in Shoreline,
      including posts, concrete footings, rails, and one standard gate. Vinyl fence pricing runs $65 to
      $110 per linear foot installed. Slope is the biggest variable — lots near Echo Lake and along
      Richmond Beach Road often require step-framing or racked panels, which adds $10 to $15 per linear
      foot. Number of gates, post size (4x4 vs. 6x6), and material grade also affect the final number.
      After the on-site visit, we provide a line-item written quote with specific quantities and unit
      costs — not a vague range. Call (206) 591-1096 to schedule a free on-site estimate with an actual
      contractor, not a sales rep.

  - q: "Do you need a permit for a fence in Shoreline, and do you handle that paperwork?"
    a: |
      Most standard residential fences in Shoreline don't require a permit — 6-foot side and rear fences
      and 4-foot front fences go in without one under current City of Shoreline municipal code. Permits
      are required for fences over 6 feet, retaining wall fences exceeding 4 feet, and any fence within
      a mapped critical area buffer; Shoreline has several creek corridors and wetland setback zones where
      additional AHJ review applies. Permit applications run through the City of Shoreline's online
      permit portal — plan review for a standard fence permit typically takes 2 to 4 weeks. Shoreline
      has also seen an uptick in fence work tied to new ADU construction since WA HB 1337 (2024) opened
      up two-ADU-per-lot builds statewide. TopVolk Construction is a WA Licensed Contractor with 100+
      projects completed since 2017; we handle the permit application, site plan prep, and AHJ
      coordination for any project that needs it.

  - q: "Do you install horizontal slat fences in Shoreline?"
    a: |
      Yes — horizontal slat fences are the most-requested modern style on Shoreline's newer infill lots,
      and we install them in both cedar and vinyl. The structural detail that most contractors miss is
      the gate: horizontal slat gates need a diagonal wood brace or a tension anti-sag cable system to
      prevent racking, since horizontal boards don't provide the same triangulation as vertical picket
      framing. Cedar for horizontal applications should be kiln-dried — green lumber cups and warps
      across the width within one PNW wet season. Consistent spacing between boards allows drainage and
      airflow, which slows mildew growth on north-facing sections. Horizontal slat fencing runs $12 to
      $22 per linear foot more than standard vertical picket due to additional framing precision and
      material selection. Gate framing for horizontal styles typically adds $200 to $400 over a standard
      gate build.

  - q: "What warranty comes with a fence installation from TopVolk?"
    a: |
      Cedar fence materials carry no manufacturer warranty — longevity depends on installation quality
      and the maintenance schedule the homeowner keeps. A properly installed cedar fence in Shoreline,
      with correct post depth, concrete footings, and gravel drainage beds, should last 15 to 20 years
      before major replacement is needed. Vinyl panel systems from manufacturers like CertainTeed carry
      30-year transferable warranties covering material defects — that transfers to a future buyer if
      the home sells. TopVolk's installation workmanship warranty covers post setting, hardware, and
      framing for 2 years from completion. Every contract includes a deadline penalty clause — if the
      agreed completion date is missed, you get compensated. That's in writing. Vladislav Volkov manages
      every project directly, with no handoff to a project manager or crew lead after signing. Call
      (206) 591-1096 with questions about your specific scope.

