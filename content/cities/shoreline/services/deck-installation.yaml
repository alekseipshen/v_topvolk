title: "Shoreline Deck Installation — Built for Rain, View, and Code"

intro: |
  Richmond Beach in 98177 sits close enough to the Sound that saltwater air accelerates cedar weathering faster than most of Shoreline's inland lots. Add 37 inches of annual rain and north-facing deck boards grow moss by year three — sometimes two. Composite boards — Trex Transcend or TimberTech AZEK — are what most homeowners here settle on once they've stood next to a five-year-old wood deck and compared it to a composite one. Vladislav works with homeowners in Ridgecrest and Ballinger who've already invested in Sub-Zero refrigerators and Bosch appliances — they're not interested in replacing deck boards every few years, either.

localContext: |
  Most of Shoreline's residential stock went up between 1955 and 1975 — split-levels and low ranchers on modest lots. Around 98155 in the Meridian Park area, rear yards often slope toward the back, which means post footings have to step down grade and the deck frame has to account for actual soil depth and bearing capacity. City of Shoreline issues building permits directly — not King County DPER — and ledger attachment to the original rim joist on these homes requires a flashing inspection before any framing gets covered.

commonProblems:
  - title: "Rotted ledger boards — typical on 1960s Shoreline homes without flashing"
    description: "Ledger boards on mid-century homes in 98133 were often nailed flat to the band joist with no Vycor or step flashing behind them. Water sits in that gap for decades. By the time rot appears at the surface, the rim joist behind it is gone. The fix is full ledger replacement with proper through-flashing, joist hangers torqued to IRC table values, and new lag screws — not a surface patch."
  - title: "Post footings above frost line — posts shift, guardrails loosen"
    description: "A lot of older decks in Shoreline went in with footings at 8-10 inches. King County frost depth runs 12-18 inches in most residential areas. Posts move over time, the frame rakes, and the guardrail at the top starts to rock. Code requires guardrails at 36 inches minimum for decks over 30 inches off grade — a wobbly rail at 4 feet of height is a liability issue, not a cosmetic one."
  - title: "Composite boards buckling — improper gap spacing at installation"
    description: "Trex and TimberTech both publish specific field-joint and end-joint gap requirements. Crews coming from wood-deck backgrounds sometimes skip the spacing because wood behaves differently. Composite boards expand with heat — in Shoreline summers, butt-joined boards buckle across the frame by August. Correct field spacing is 3/16-inch minimum; end joints need 1/4 inch. Getting this wrong voids the manufacturer warranty."

faq:
  - q: "How fast can you get to Shoreline for Deck Installation?"
    a: "Shoreline is a regular part of the service area — 98133 and 98155 are 20-30 minutes from base, I-5 traffic depending. Call (206) 591-1096 to book a free on-site consultation. Vladislav comes out personally, not a sales rep."
  - q: "Do you build with Trex or TimberTech, and which holds up better in Shoreline's weather?"
    a: "Both are solid choices. Trex Transcend uses a capped polymer shell that resists moss and moisture well. TimberTech AZEK is full PVC — zero moisture absorption, better for decks with limited airflow underneath. For shaded or north-facing decks in Shoreline, AZEK is usually the recommendation. Samples available on-site during the consult."
  - q: "How long does a deck permit take in Shoreline, and what does the project cost?"
    a: "City of Shoreline permit review typically runs 3-6 weeks for a standard attached deck. Build time after permit: 1-2 weeks for most projects. Pricing runs $30K-$80K depending on size, material, and site grade. TopVolk is a WA Licensed Contractor — Vladislav provides a line-item quote with deadline penalties written into the contract. 100+ projects completed since 2023 across King and Snohomish counties."