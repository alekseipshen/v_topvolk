title: "Hoquiam HVAC: Heat Pump & Furnace Installs for Older Homes"

answer: "TopVolk installs heat pumps, furnaces, and ductless mini-splits in Hoquiam, WA — free on-site quotes, owner-run, 100+ projects since 2017."

intro: |
  A wall furnace wheezing through its fourth decade near Lake Hoquiam usually means one thing: it's cheaper to replace than to keep patching the heat exchanger. TopVolk installs and swaps out heat pumps, high-efficiency furnaces, and ductless mini-splits for homeowners across Hoquiam, working directly with owner Vladislav Volkov instead of a call center booking a random tech. Old logging-town houses near downtown Simpson Avenue and out toward West Hoquiam were built for wood stoves and wall heaters, not central air, so a lot of the work here is adding ductwork or going ductless from scratch. An Amana 95% AFUE furnace or a Mitsubishi ductless head usually ends up doing the job, depending on whether there's existing duct to reuse or plaster walls nobody wants to open up. Grays Harbor's damp, salt-tinged air off the water eats through cheap outdoor units fast, so equipment choice matters more here than it does further inland. A house running a Kenmore window unit in July and a space heater in January is usually a good candidate for one heat pump that handles both jobs on a single electric bill. Call (206) 591-1096 for a free on-site quote before the winter heating rush fills the schedule.

localContext: |
  Most of the housing stock in 98550 dates back to the lumber boom — Craftsman foursquares and simple bungalows built between 1900 and 1935 for mill workers, plenty of them still running knob-and-tube wiring or an old oil furnace in the basement. West Hoquiam and the blocks around Karshner Elementary have a lot of these older homes, while the area near Bowerman Airfield on the north end leans more toward 1950s-60s ranch houses on slab foundations with no basement to route ductwork through. That difference changes the job: a ranch with a crawlspace can usually take a conventional forced-air heat pump, but a two-story foursquare near Simpson Avenue often needs a ductless system room by room instead of tearing open plaster for new trunk lines. Coverage runs into Aberdeen's 98520 zip too, since the two cities share the same harbor climate and roughly the same housing ages. Any furnace or heat pump swap needs a mechanical permit through the City of Hoquiam Building Department, and equipment has to clear Washington State Energy Code minimums for AFUE and HSPF. Salt air off Grays Harbor and rain most of the year mean outdoor condenser units need a corrosion-resistant coil and a raised pad, or they rust out in five years instead of fifteen. Homeowners in the older rentals and starter homes around 98550 tend to run Whirlpool or Frigidaire window units for cooling and a baseboard heater for winter, which is exactly the setup a single heat pump replaces at a lower monthly cost.

commonProblems:
  - title: "Wall Furnaces and Oil Tanks Giving Way to Heat Pumps"
    description: "A lot of Hoquiam homes still heat with an electric wall furnace or an aging oil unit in the crawlspace, and both get expensive to run once the equipment starts short-cycling. TopVolk converts these to a heat pump — usually an Amana or Mitsubishi outdoor condenser paired with an indoor air handler, with the reversing valve and line set sized to the square footage, not guessed at. Federal tax credits under the Inflation Reduction Act can knock $2,000 or more off a qualifying heat pump, and we help homeowners get the paperwork right. Installed cost runs $6,500-$11,000 depending on ductwork condition, with most jobs done in one to two days including the old oil tank decommission."
  - title: "Ductless Mini-Splits for Additions and Bonus Rooms"
    description: "A converted garage, a bonus room over the carport, or a small ADU out back rarely has ductwork to tap into, and that's where a Mitsubishi or Daikin ductless head earns its keep. The line set and condensate drain route through a 3-inch wall sleeve, so there's no drywall demo beyond one clean core hole. For homeowners watching the budget, a Frigidaire ductless unit covers a single room just as well without the premium price tag. Per-zone installed cost typically runs $3,800-$5,500, and most single-head jobs are done in a day, condensate drain tested and all."
  - title: "Furnace Replacement, Direct Vent, and the City of Hoquiam Permit"
    description: "Swapping a 20-year-old 80% furnace for a 95%+ AFUE model isn't a straight box-for-box replacement — the higher-efficiency unit needs PVC intake and exhaust venting instead of a metal flue, and often a condensate neutralizer before the drain hits the sewer line. That change requires a mechanical permit through the City of Hoquiam Building Department, and the new furnace has to meet Washington State Energy Code minimums before it passes final inspection. TopVolk pulls the permit, handles the rough-in and venting, and schedules the inspection so nobody's stuck heating with a space heater in the gap. An Amana furnace swap with re-venting typically runs $5,800-$8,900 and takes 4-8 hours on-site, with inspection scheduled within a week or two."
  - title: "What Drives HVAC Cost in a Hoquiam House"
    description: "Adding AC to an existing forced-air system sounds simple until the ductwork can't handle the extra static pressure — undersized trunk lines or a choked return duct will bottleneck a new condenser no matter how good the equipment is. Pricing depends on whether the existing plenum needs modification, whether a damper gets added for balancing, and how far the line set has to run to the outdoor unit. A straightforward AC add-on with existing ductwork usually lands $4,000-$6,000; jobs needing plenum work or duct upsizing run closer to $7,500-$9,500. Every quote from TopVolk is line-item, not a vague range, and equipment carries a 10-year parts warranty when registered."
  - title: "Duct Sealing, Zoning, and Getting More Life Out of Old Systems"
    description: "Hot upstairs bedrooms and a cold living room usually trace back to leaky duct joints and missing blocking around the plenum, not a failing furnace. Sealing the trunk lines with duct mastic and adding a damper for zoning can fix the imbalance for a few hundred dollars instead of a full system replacement. Pairing that with a Nest or ecobee thermostat lets a homeowner run two zones off one system without rebuilding the ductwork. A well-maintained furnace or heat pump lasts 15-20 years out here; once repair costs climb past half of a replacement's price, or the heat exchanger cracks, it's time to swap the unit instead of chasing another repair."

