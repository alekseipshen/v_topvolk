  - q: "What does a heat pump conversion cost in Hoquiam?"
    a: "A full heat pump conversion from an old wall furnace or oil unit typically runs $6,500-$11,000 installed, depending on whether existing ductwork can be reused or new line sets and an air handler need to go in from scratch. Homes needing electrical panel upgrades for the new circuit run higher. IRA tax credits can offset $2,000 or more on qualifying equipment. TopVolk provides a free on-site estimate with exact line-item pricing before any contract gets signed — no vague range quoted over the phone."
  - q: "Do I need a permit to replace my furnace in Hoquiam?"
    a: "Yes — any furnace, heat pump, or ductless install requires a mechanical permit through the City of Hoquiam Building Department, and the new equipment has to meet Washington State Energy Code minimums for AFUE and HSPF ratings. TopVolk is a WA Licensed Contractor and pulls the permit, schedules the rough-in and final inspection, and keeps the paperwork on file for the homeowner. Typical turnaround from permit application to final sign-off runs one to two weeks depending on the city's inspection queue."
  - q: "Can a ductless mini-split handle a whole Hoquiam house, not just one room?"
    a: "It can, with a multi-zone Mitsubishi or Daikin outdoor condenser feeding two to four indoor heads, which works well in the older foursquares and bungalows near downtown that never had ductwork installed. Each indoor unit gets its own line set and condensate drain, and a homeowner can run bedrooms cooler than the living room without any duct zoning involved. Budget-conscious homeowners sometimes mix a Frigidaire single-zone unit in an addition with a larger multi-zone system for the main house. Free on-site consultations cover exactly which layout fits the floor plan."
  - q: "How long does a new furnace or heat pump last on the coast?"
    a: "Expect 15-20 years from a properly installed furnace or heat pump, though the salt air rolling off Grays Harbor shortens outdoor condenser life if the coil isn't corrosion-resistant or the unit sits low to standing water. TopVolk sets outdoor units on a raised composite pad and specs coated coils for anything within a few miles of the harbor. Manufacturer warranties on Amana and Mitsubishi equipment run 10-12 years on parts when registered within 60 days of install. Compressor or heat exchanger failure outside that window usually points to a repair-versus-replace conversation."
