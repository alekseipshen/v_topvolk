  - q: "What does a panel upgrade in Hoquiam cost?"
    a: "A straightforward 100A-to-200A panel upgrade runs $3,500 to $7,000 depending on whether the meter base, service mast, or underground lateral need replacing, and whether a subpanel gets added for a shop or garage. Full rewires on pre-1950 cottages with knob-and-tube run higher, typically $9,000-$15,000 for an average-size house. Pricing is quoted line by line — panel, breakers, permit fee, inspection — not as one lump estimate. Schedule a free on-site consultation for exact numbers instead of a phone guess; call (206) 591-1096."
  - q: "Who pulls the electrical permit for work in Hoquiam?"
    a: "Electrical permits in Hoquiam go through Washington State Department of Labor & Industries, not a city building counter — L&I covers electrical inspection for most of the state outside cities like Seattle and Tacoma that run their own program. TopVolk pulls the permit as the WA Licensed Contractor of record, schedules the rough-in inspection once wiring is in and before drywall closes up, and handles the final inspection before the panel gets energized. Typical L&I scheduling in Grays Harbor County runs about a week. Paperwork — load calculation, panel schedule, permit application — gets prepared before the crew shows up so the inspection doesn't stall the project."
  - q: "Can aluminum wiring just be pigtailed instead of a full rewire?"
    a: "In most cases, yes — pigtailing with AlumiConn connectors at every device (outlets, switches, panel lugs) meets current code and costs far less than tearing out plaster for a full copper rewire. It stops making sense when the aluminum wire itself is damaged, undersized for the circuit, or feeding a panel that needs replacing anyway. Knob-and-tube is different — no ground path means pigtailing doesn't fix the underlying problem, so that usually calls for a full rewire with copper NM-B. Volkov checks conductor condition at the panel and a sample of devices during the free walkthrough before recommending one approach over the other."
  - q: "How long does a panel or rewire last in Hoquiam's climate?"
    a: "A quality 200A panel — Square D or Eaton — typically runs 25-40 years before lugs or bus bars need attention, though salt air and humidity off Grays Harbor can shorten that if the meter base isn't sealed well. Copper rewiring essentially lasts the life of the house when installed to code. TopVolk's electrical work carries workmanship warranty coverage, and any manufacturer warranty on the panel or breakers (Square D, Eaton) passes through directly. What's not covered is damage from something unrelated — a tree branch on the service mast, a lightning strike — same as any electrical contractor's warranty terms."
