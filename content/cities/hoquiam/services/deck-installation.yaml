title: "Hoquiam Deck Installation — Built for Grays Harbor Rain"

answer: "TopVolk Construction builds code-compliant decks in Hoquiam, WA — PT posts to frost depth, 36-inch guardrails, owner Vladislav Volkov pulls the permit."

intro: |
  A deck that looks fine in August can be slick with moss by November if it wasn't built with drainage and material choice in mind — and few places in Washington test that faster than Hoquiam, sitting near one of the wettest corners of the state. Homeowners near downtown Hoquiam and out toward the Riverside neighborhood along the Hoquiam River deal with north-facing decks that stay damp for days after a storm off Grays Harbor. TopVolk Construction handles deck installation here as a full build: footings dug to frost depth, ledger board flashed correctly against the rim joist, and a material call between pressure-treated Douglas-fir and composite decking like Trex or TimberTech based on your budget and how much shade the site gets. Vladislav Volkov runs every project himself, from the first site visit near Hoquiam's Castle up on the hill to the final walkthrough. Call (206) 591-1096 for a free on-site estimate with actual line-item pricing, not a phone quote.

localContext: |
  Hoquiam's housing stock, mostly in the 98550 zip code, runs older — a lot of 1920s-40s worker cottages near the mill district and post-war ranch homes further out toward West Hoquiam and the Lytle area. Many of these lots have original concrete piers or wood posts set shallow, not to the 12-18 inch frost depth current code requires, so a deck rebuild often means starting the footings over rather than reusing what's there. Grays Harbor County handles permitting for unincorporated areas nearby, but Hoquiam itself runs its own permit desk out of city hall, and any deck attached to the house needs a ledger flashing detail inspected before decking goes down. Rainfall here runs heavier than Seattle — Hoquiam sits close to 80 inches a year in a wet winter — so ground-contact PT lumber and proper drainage gaps between boards matter more than they would across the mountains. Older homes near the Hoquiam River floodplain also need extra attention to post footing placement and joist hanger corrosion resistance.

  Median household income around Hoquiam sits near $44,000, and that shapes almost every material conversation TopVolk has on-site here. Most homeowners want a straightforward, code-compliant deck, not upgrades they don't need — so the estimate usually walks through PT lumber against composite side by side, with real numbers instead of a sales pitch. Lots near downtown and the various residential streets off Emerson and Simpson Avenue tend to be narrow, which sometimes limits equipment access and adds a little labor time for hand-digging footings. A short walk from Hoquiam's Castle, you'll see decks from every decade — some framed with true full-dimension Douglas-fir from the mill era, others slapped together with undersized joists that don't meet current span tables. TopVolk pulls the tape measure and the code book on day one, not after the deck is half built.

commonProblems:
  - title: "Cedar looks good for two years, then starts going gray and mossy"
    description: "Cedar decking weathers fast under Hoquiam's rain load, especially on north or east-facing builds shaded by mature fir trees near the Riverside area. Without regular oiling, boards cup, splinter, and grow moss in the joints within a couple seasons. Composite decking like TimberTech or Trex costs more up front — typically $8-14 more per square foot installed than cedar — but skips the yearly maintenance and won't rot at the fastener line. For homeowners on a tighter budget, PT Douglas-fir with a solid stain schedule is still a reasonable call if you're willing to reseal every 1-2 years. TopVolk walks through both options with real pricing at the estimate, not a sales pitch."
  - title: "Ledger board attached without flashing, water gets behind the siding"
    description: "This is the most common failure point on older decks we tear out around Hoquiam — a ledger board lag-bolted straight to the rim joist with no flashing kicked out over the top edge. Water runs down the house siding, behind the ledger, and rots the rim joist and floor framing from the inside, sometimes for years before anyone notices soft decking near the door. Correct install uses Z-flashing or a membrane like Grace Vycor under the ledger, lapped over the siding, with structural lag screws or through-bolts rated for the load. On a second-story deck over living space, we also slope the ledger flashing to shed water away from the wall entirely. Catching this during a rebuild usually adds a half-day of labor, cheap insurance against a much bigger repair later."
  - title: "Guardrail height and stair stringers built to the old code, not current IRC"
    description: "A lot of decks in Hoquiam built in the 80s and 90s have 32-inch guardrails or stair rails that don't pass a current inspection — code now requires 36 inches minimum on any deck surface over 30 inches above grade, with baluster spacing under 4 inches. Stair stringers also get flagged for uneven rise and run, which is a trip hazard as much as a code issue. TopVolk pulls the permit through the city, frames stringers to consistent 7-inch rise / 10-inch run tolerances, and builds graspable handrails that meet current grip diameter requirements. Plan review and inspection scheduling typically adds 1-2 weeks to a project timeline here, and that's built into the schedule from day one, not sprung on you halfway through."
  - title: "Deck quotes that balloon once footings hit bad soil or old concrete"
    description: "Given Hoquiam's median household income, most homeowners are working with a firm budget, and the biggest swing factor on price is what's underground. A straightforward ground-level deck with PT lumber framing runs in the $30-45 per square foot range installed; a second-story deck with stairs, guardrails, and composite decking can push $55-75 per square foot once you add footings dug through old fill or buried debris near older mill-era lots. TopVolk quotes with line-item pricing after digging a test footing or two, so surprises don't show up mid-project. Deadline penalties are written into every contract — if the job runs past the agreed date for reasons on our end, that's on us, not you."
  - title: "10-year-old deck with soft joists and rusted hardware"
    description: "Galvanized joist hangers and fasteners from builds before the mid-2000s often weren't rated for ACQ-treated lumber, which corrodes standard hardware faster — a real issue on decks built near the harbor where salt air and constant moisture combine. Simpson Strong-Tie now makes hot-dip galvanized and stainless hardware rated for ground-contact PT lumber, and that's the standard we use on every rebuild. A well-built PT deck with proper blocking and sistered joists where needed should run 25-30 years; composite decking on a solid frame can outlast that. If your deck is bouncy underfoot or the ledger area feels soft, that's worth a look before it becomes a structural repair instead of a rebuild."

