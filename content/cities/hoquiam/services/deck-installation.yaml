  - q: "What does a new deck cost in Hoquiam?"
    a: "A basic ground-level PT lumber deck runs roughly $30-45 per square foot installed, while a raised composite deck with stairs and guardrails runs $55-75 per square foot once footings and railing systems are factored in. Site conditions drive most of the cost swing — old concrete piers, sloped lots near the river, and how many stairs you need. TopVolk provides a free on-site estimate with exact line-item pricing, not a ballpark range you have to guess at later."
  - q: "Do I need a permit for a deck in Hoquiam?"
    a: "Yes — any deck attached to the house or built more than about 30 inches above grade needs a permit through the City of Hoquiam, including a ledger flashing detail and footing inspection before decking goes on. TopVolk handles the permit application, drawings, and inspection scheduling as part of the project, and we're a WA Licensed Contractor so the paperwork side is straightforward. Plan review typically takes 1-2 weeks for a standard residential deck. Vladislav Volkov coordinates directly with the inspector, no middlemen involved."
  - q: "Should I go with cedar, PT lumber, or composite decking?"
    a: "It depends on budget and how much upkeep you want to do — PT Douglas-fir is the cheapest option and holds up fine with annual staining, cedar looks better initially but weathers fast in Grays Harbor's rain, and composite decking like Trex or TimberTech costs more upfront but needs no staining and resists moss buildup. For a rental property or a budget-conscious rebuild, PT lumber with proper ground-contact treatment is usually the right call. We'll walk through actual material samples and pricing at the estimate."
  - q: "How long will my deck last and what's covered under warranty?"
    a: "A properly built PT lumber deck with correct flashing and hardware typically lasts 25-30 years in this climate; composite decking on a solid frame can run longer with less maintenance. TopVolk stands behind the structural work and workmanship, and any missed deadline has a penalty written directly into the contract — that's a commitment on paper, not just a promise. Normal wear like fading or surface scratches on composite boards falls under the manufacturer's warranty from Trex or TimberTech directly. Ask about specifics for your material choice during the estimate."
