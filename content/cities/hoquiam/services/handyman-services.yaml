title: "Hoquiam Handyman Services — Punch Lists to Deck Repairs"

answer: "A local handyman handles punch-list touchups, fixture swaps, and deck repairs in Hoquiam, Washington — flat quotes, most jobs booked within a week."

intro: |
  A local handyman covers punch-list touchups, fixture swaps, and deck repairs in Hoquiam with flat-rate pricing and most jobs booked inside a week. Grays Harbor's marine air chews through untreated deck boards and door trim faster than folks expect, and that shows up in calls from West Hoquiam out past Hoquiam's Castle. A GE range that won't ignite, a Kenmore water heater dripping at the fitting, a smart doorbell camera that won't hold a charge through a rainy week off the water — these fill a Tuesday schedule easily. Older foursquare homes near downtown Hoquiam, built during the timber-mill boom, still carry original single-pane windows and trim overdue for weatherstripping. A punch list left by a bigger remodeling crew — missing cabinet hardware, a caulk line skipped around the tub — gets closed out in one visit instead of a second scheduled project.

localContext: |
  Hoquiam's housing stock splits between early-1900s timber-boom foursquares and Craftsman cottages near downtown (98550) and scattered rancher-style infill built through the 1960s and 70s toward the Aberdeen line (98520 covers parts of west-county work too). Homes in the Bel Aire area and along Riverside tend to carry original wiring and galvanized supply lines swapped piecemeal over the decades, so a simple faucet replacement sometimes turns up a shutoff valve that hasn't moved since the Nixon administration. Grays Harbor gets well over 70 inches of rain some years, more than Seattle sees, and it's brutal on unpainted trim, deck ledger boards, and anything facing west off the water. Siding and deck repairs near the river's low-lying stretches sometimes need a quick check against City of Hoquiam floodplain rules before new penetrations go in near grade. None of that requires a big permit for handyman-scope work, but a fixture swap or drywall patch on a home built before 1978 does mean lead-safe work practices once trim or plaster gets disturbed.

commonProblems:
  - title: "Remodel Punch Lists That Never Get Closed Out"
    description: "A bigger remodel crew finishes the big-ticket stuff — cabinets hung, a Moen faucet plumbed in, tile set — then leaves before the small stuff gets done. Missing cabinet pulls, a scribe strip that never got caulked, a baseboard return left short by a quarter inch — that's a punch list, and most GCs don't come back for it once the invoice clears. In Hoquiam this call usually comes from a homeowner who hired an outside crew for a kitchen or bath job and got left with loose trim and unfinished caulk lines around the tub surround. A visit closes it out in two to four hours: hardware installed, silicone caulk tooled properly, touch-up paint matched with a fan deck sample. Flat rate usually runs $150-$350 depending on list length, done the same visit."
  - title: "Drywall Patches That Don't Match the Existing Texture"
    description: "Older Hoquiam homes near downtown still carry hand-applied knockdown or orange-peel texture from repairs done decades apart, and a fresh drywall patch sticks out like a scar if the texture isn't matched. The usual failure point is around a removed TV bracket or an old thermostat location, where the patch gets taped and sanded flat but nobody matches the spray texture around it. A proper fix means cutting back to the nearest stud, screwing in a scrap of half-inch board (USG or CertainTeed), taping the seams in three coats of joint compound, and hand-matching texture with a hopper gun before priming. Most patches run $125-$300 depending on size and whether ceiling texture is involved, usually a half-day job, paint included if color's on hand."
  - title: "Swapping a Toilet or Light Fixture Without Opening a Full Permit"
    description: "Swapping a toilet, a kitchen faucet, or a light fixture is handyman-scope work in Washington as long as the water or electrical line isn't being relocated — no permit needed through the City of Hoquiam building department for a straight swap. The job itself: shutting off the angle stop, pulling the old toilet, setting a new wax ring, and resetting a Kohler or American Standard unit level on the flange bolts. Light fixture swaps mean confirming the existing electrical box is fixture-rated and properly grounded before hanging anything heavier than the original. It changes if a fixture gets moved to a new wall location or a circuit gets added — that crosses into licensed electrical work and a separate permit. Most straight swaps take under two hours and run $95-$225 per fixture, part included."
  - title: "Deck Boards and Railings Rotting Faster Than Expected"
    description: "Grays Harbor's wet season is hard on deck framing, and the first sign of trouble is usually a railing post that flexes or a board gone soft underfoot near the stairs. Pressure-treated joists often hold up fine while the ledger board at the house connection quietly rots behind flashing that was never installed right — common on decks built before code required lag-bolted connections and proper flashing instead of nails. Pricing depends on scope: swapping a handful of PT deck boards runs $200-$500, while rebuilding a rotted ledger with new joist hangers and blocking runs $800-$1,500 depending on deck size. Composite decking like Trex or TimberTech costs more upfront than PT lumber but skips the yearly re-staining and resists the moss buildup common on north-facing decks here. Either way, a rotted ledger is structural, not cosmetic."
  - title: "Drafty Doors and Windows Losing Heat All Winter"
    description: "A lot of Hoquiam's older single-pane windows and exterior doors were never fitted with real weatherstripping, just paint buildup holding the sash shut. That gap around a door sweep or a loose window stop lets cold, wet air in all winter and makes whatever heating system is in the house — a Mitsubishi mini-split, an older Amana furnace — work harder than it should. The fix: new adhesive-backed foam or V-strip weatherstripping at the door jamb, a fresh sweep at the threshold, and caulk at window trim where the old bead has cracked and pulled loose. Most homes need this redone every 5-8 years since the material compresses and hardens, faster on south and west-facing walls catching direct sun and rain. A full-house pass runs $300-$600 and pairs well with a fall gutter cleaning before the rains back up under the fascia."

faq:
  - q: "How fast can you get to Hoquiam for Handyman Services?"
    a: "Hoquiam sits right off US Route 101 where it splits from Highway 12, so calls from Aberdeen, Cosmopolis, or out toward Ocean Shores work into the same route without extra trip charges. Most jobs get scheduled within 3-5 business days, sooner for a single fixture swap or an urgent leak. Street parking in most Hoquiam neighborhoods is easy, no permit zones to deal with, so setup starts fast once the truck's on site. Call (206) 591-1096 for an actual day and time, not a vague window."
  - q: "What does a handyman visit in Hoquiam cost?"
    a: "Most visits run on a flat per-job quote instead of a mystery hourly rate — small jobs like a fixture swap or punch list run $95-$350, while bigger half-day work like deck board replacement or a full weatherstripping pass lands between $300-$800. What moves the number is mostly parts and access: a toilet swap with a mid-grade Kohler unit costs less than a ledger rebuild needing new joist hangers and PT lumber. A free estimate gets scheduled before work starts, price locked in writing. Call (206) 591-1096 for a same-week quote."
  - q: "Do handyman repairs in Hoquiam need a city permit?"
    a: "Most handyman-scope repairs — fixture swaps, drywall patches, deck board replacement — don't need a permit through the City of Hoquiam building department since nothing structural or code-regulated changes. That flips if a deck ledger needs a full structural rebuild, or electrical work goes past a straight fixture swap; those get flagged before the quote so paperwork gets pulled ahead of time. Homes built before 1978 also trigger lead-safe work practices anytime trim or drywall gets disturbed, standard practice regardless of city rules. There's no HOA to navigate in most Hoquiam neighborhoods, which keeps scheduling simple."
  - q: "Will a drywall patch actually match the existing wall texture?"
    a: "Texture matching is part of any drywall patch, not an upsell. After the patch is taped and mudded in three coats, the existing knockdown or orange-peel texture gets matched with a hopper gun or texture spray can before priming, so the repair disappears instead of showing as a flat rectangle. Paint match works the same way, using a fan deck sample or a chip cut from an inconspicuous spot to get sheen and color right. This applies whether the patch came from a removed thermostat, an old TV mount, or water damage near a window, and it's included in the quoted price."
  - q: "How long does handyman work hold up in Hoquiam's climate?"
    a: "Workmanship is guaranteed for one year — if a fixture starts leaking again or a patch cracks along the seam, that's a callback, not a new invoice. Materials carry whatever the manufacturer offers: a Kohler toilet or Moen faucet typically comes with a limited lifetime warranty on the part itself. Deck work holds up differently by material — PT lumber needs re-staining every 2-3 years in this climate to hit full lifespan, while composite decking like Trex needs almost no upkeep but costs more upfront. Weatherstripping and caulk joints wear out fastest here given the rain, usually needing a refresh every 5-8 years."
  - q: "Do you cover areas near Hoquiam, and how far out is scheduling?"
    a: "Service covers Hoquiam along with Aberdeen, Cosmopolis, Montesano, and out toward Ocean Shores, all a short drive on Route 101 or Highway 12. Most jobs get scheduled within 3-5 business days of the first call, sooner for a single fixture or urgent repair. One person handles both the estimate and the work, so there's no dispatcher shuffle or extra trip to get a straight answer, and the price quoted on-site is the price on the invoice. Call (206) 591-1096 to check open scheduling for the coming week."