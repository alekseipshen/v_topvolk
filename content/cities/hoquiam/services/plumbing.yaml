  - q: "What does a whole-house repipe cost in Hoquiam?"
    a: "A 2-bathroom home typically runs $6,500-$9,500 for a full PEX repipe, and a larger 3-bath-plus house runs $10,500-$13,000, depending on linear footage of pipe, number of fixtures, and how much drywall needs to be cut and patched. Homes with crawlspace access instead of slab foundations usually price lower since less wall-opening is needed, and manufactured homes with a simple crossover swap price well under that range. Every quote is a flat number written out line by line, not a ballpark and not a per-hour guess. Call (206) 591-1096 for a free on-site walkthrough and an exact number before anything is scheduled."
  - q: "Do I need a permit to replace a water heater in Hoquiam?"
    a: "Yes — any water heater replacement or gas line change goes through the City of Hoquiam Building Department, and Washington code requires two-point seismic strapping and a properly routed T&P discharge line regardless of tank size. TopVolk pulls the permit, schedules the final inspection, and handles the paperwork as part of the quoted price — it's not an add-on charge tacked on later. Typical turnaround from permit submission to final sign-off runs 1-2 weeks for a straightforward tank swap, longer if a tankless conversion needs a gas line upsize inspected separately. WA Licensed Contractor, so the permit goes on file under a legitimate license number, not a handshake."
  - q: "Is PEX or copper better for a repipe in an older Hoquiam house?"
    a: "PEX-A is the call for most Hoquiam repipes — it handles freeze expansion better than rigid copper, which matters in unheated crawlspaces during a hard freeze, and it costs less in labor since fewer joints and no torch work are needed near old wood framing. Copper still gets used for the exposed stub-outs at the water heater and any run within a few inches of a flue or heat source, since local code doesn't allow PEX that close to sustained heat. Both outperform the original galvanized steel by decades. Ask about the specific run-by-run plan during the on-site quote."
  - q: "How long do a repipe and a new water heater last in this climate?"
    a: "PEX-A is rated for 40-50 years and doesn't pit or scale the way copper does in Grays Harbor's mineral-heavy water, and it holds up better through a hard freeze than rigid copper in an unheated crawlspace. A standard GE, Whirlpool, or Kenmore tank water heater runs 8-12 years before the anode rod is spent and the tank starts rusting from inside; a Rinnai or Navien tankless unit typically runs 18-20 years since there's no tank to corrode, though it needs an annual descale in hard water areas. TopVolk backs installation labor with a workmanship warranty, separate from the manufacturer's parts warranty on the unit itself — ask for the specifics in writing on the quote."
