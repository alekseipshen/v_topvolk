  - q: "Do I need a permit to replace flooring in Hoquiam?"
    a: "A straight flooring replacement — pulling up old material and laying new LVP, hardwood, or tile — doesn't typically require a permit through Grays Harbor County or the City of Hoquiam. Where it changes is subfloor structural repair or any work uncovering asbestos-containing VAT, which needs to be documented and handled under state abatement rules before the new floor goes down. TopVolk is a WA Licensed Contractor and handles that paperwork as part of the job when it applies. Most straightforward jobs move from signed quote to finished floor in 1-3 weeks."

  - q: "Can you match my existing 2-1/4 inch oak strip flooring?"
    a: "Matching old 2-1/4 inch oak strip flooring in a Hoquiam Craftsman restoration means finding a close species and stain match, then blending the sand and finish so the seam between old and new isn't obvious. TopVolk sources unfinished red or white oak in the matching width, sands the transition zone across both old and new boards together, and applies stain and a polyurethane finish as one continuous pass. This works best when at least some of the original flooring is salvageable rather than fully rotted. Full-room replacement with pre-finished flooring is the fallback when the existing boards are too far gone to blend."

  - q: "How long does new flooring last in Hoquiam's climate?"
    a: "LVP holds up 15-20 years in Hoquiam's damp climate with minimal maintenance, and engineered hardwood runs 20-30 years with a refinish or two along the way. Solid oak, properly acclimated and finished, can outlast the house it's in if it's kept dry and refinished every 10-15 years. Tile is largely climate-proof but grout lines need resealing every 2-3 years to keep moisture from working into the subfloor below. TopVolk backs installation work with a workmanship warranty and puts deadline penalties in writing in the contract, not as a verbal promise."

