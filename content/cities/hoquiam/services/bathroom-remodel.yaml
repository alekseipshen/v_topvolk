title: "Hoquiam Bathroom Remodel — Grays Harbor Humidity, Handled"

answer: "TopVolk Construction handles full bathroom remodels in Hoquiam, Washington — owner-led, WA Licensed Contractor, 100+ projects since 2023, deadline penalty in every contract."

intro: |
  TopVolk Construction handles full bathroom remodels in Hoquiam, from small hall bath refreshes near Lytle Park to full gut-and-reconfigure jobs on the west side toward Bel Aire, with most projects running three to seven weeks from demo to final inspection. Grays Harbor's marine air sits hard on this house stock — a lot of the tract housing built here through the 60s, 70s, and 80s still has its original exhaust fan, or none at all, and that's usually the first thing failing when we open a wall near Riverside or out past Hoquiam's Castle. One recent job off Emerson had a GE electric water heater from the original build feeding a corroded galvanized supply line — the vanity faucet had been dripping into the subfloor for years before anyone caught the soft spot underfoot. Vladislav Volkov runs every project directly, so the person quoting the job is the same person on site pulling permits, not a salesperson handing it off to a crew. Call (206) 591-1096 for a free on-site walkthrough and a line-item quote before any demo starts.

localContext: |
  Most of Hoquiam's housing stock sits in two buckets: modest 1940s-60s single-story homes near downtown and the 8th Street corridor (98550), and slightly newer split-levels and ranchers built through the 70s and 80s out toward Bel Aire and the hillside above the harbor. A good share of the older stock still runs original cast-iron drain stacks and galvanized supply lines, which means a bathroom remodel here often turns into a plumbing project the minute we open the wall behind the tub. We also pull permits in neighboring Aberdeen (98520) on combined lots and rental duplexes, where the same builder crews worked both towns in the same era. The City of Hoquiam Building Department handles permit review for anything touching plumbing, electrical, or a wall reconfiguration — plan review typically runs 1-3 weeks for a straightforward bath remodel, longer if we're moving a waste line. Grays Harbor sees over 80 inches of rain some years, and that coastal humidity means any bathroom without real exhaust ventilation is fighting mold within a season.

commonProblems:
  - title: "Builder-Grade Everything From the Original Construction"
    description: "1970s-80s Hoquiam ranch bathrooms still running original pink or mint tile, a molded fiberglass tub/shower unit, and a Kenmore-brand exhaust fan that hasn't pulled real air in a decade are the norm, not the exception. The vanity is often a hollow particleboard box with a Moen or Delta faucet corroded solid from Grays Harbor's mineral-heavy well water in outlying areas. We gut down to the studs, set a walk-in shower with a curb (curbless where the subfloor allows), and lay large-format porcelain over Schluter Kerdi waterproofing instead of a traditional mud pan. Budget for tile and waterproofing alone: $4,500-$7,500 depending on shower footprint. Full re-tile and vanity swap on a job like this usually runs 3-4 weeks once demo starts."
  - title: "Subfloor Rot Behind the Tub Surround"
    description: "Pull a tub surround in a Hoquiam bathroom that's 25+ years old and there's a decent chance the particleboard or OSB subfloor underneath is soft, discolored, or crumbling near the drain. The old thin-set-over-drywall installation never had a real vapor barrier, so years of shower steam worked into the framing behind it — worse near the harbor where humidity sits higher than inland King County. We cut back to solid Douglas-fir framing, sister in new floor joists where needed, and rebuild with DriCore subfloor topped with RedGard liquid membrane before any tile goes down. Catching this early keeps the job on schedule; catching it late, once rot reaches the rim joist, adds $1,500-$3,000 and a few extra days. It's the main reason our quotes carry a contingency line instead of a flat surprise-free number."
  - title: "Reconfiguring the Layout Means Pulling Real Permits"
    description: "Converting a cramped tub-shower combo into a curbless walk-in, or moving a toilet flange to open up floor space, isn't a swap-the-fixtures job — it's a plumbing, and sometimes structural, permit through the City of Hoquiam Building Department. Moving a drain line means new PEX or PVC routing, a properly sloped waste line, and a rough-in inspection before we close up any wall. If the wall we're moving is load-bearing — common in these older stick-framed ranches — we're adding blocking or a header, reviewed under IRC structural provisions before framing inspection. TopVolk is a WA Licensed Contractor, and Vladislav pulls and manages every permit personally, no runner or third-party expediter involved. Typical review timeline on a straightforward reconfig here: 1-2 weeks, longer if the AHJ asks for revised plans. That timeline gets written into the contract, backed by a deadline penalty."
  - title: "What Actually Drives the Price on a Hoquiam Bathroom Job"
    description: "Grays Harbor pricing runs lower than Seattle-metro pricing for the same scope of work — full bathroom remodels here typically land between $14,000 and $28,000, mostly because labor and permit fees are lower out here, even though material costs like tile, Kohler or Moen fixtures, and waterproofing stay about the same across Washington. The biggest swing factor is plumbing relocation: keeping the toilet, tub, and vanity in their existing footprint keeps a job near the low end, while moving a drain stack or rerouting a cast-iron line pushes it toward $25K+. Given median household income here sits around $44,000, we quote with line-item pricing up front — tile, fixtures, labor, and permits broken out separately — so homeowners see exactly where the money goes. Every quote includes a written deadline penalty clause, and every job wraps with a punch list walkthrough before final payment."
  - title: "Ventilation Is the Difference Between a Remodel That Lasts and One That Doesn't"
    description: "A new shower with fresh grout doesn't mean much if the exhaust fan pushing 50 CFM into an open attic can't keep up with Grays Harbor humidity. We spec Broan or Panasonic fans sized to the actual room — typically 80-110 CFM for a standard hall bath — ducted straight to a roof or soffit vent, not dumped into the attic where it just feeds mold on the sheathing. Grout and caulk in a well-ventilated shower should last 8-10 years before needing attention; in a bathroom with weak ventilation, we've seen mildew creep back within 18 months. Large-format porcelain over Schluter Kerdi holds up better long-term than a traditional mud-set shower, especially in homes where the original 1970s ductwork was never sized right. Ask about fan sizing during your free walkthrough — it's often a $400-$600 add that saves the whole remodel."

