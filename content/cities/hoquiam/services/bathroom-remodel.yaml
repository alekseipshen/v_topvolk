  - q: "What does a full bathroom remodel in Hoquiam cost?"
    a: "Most full remodels here land between $14,000 and $28,000, with a simple fixture-and-tile refresh on the low end and a full layout reconfiguration with moved plumbing on the high end. Material choices swing it too — a builder-grade tub/shower insert costs a fraction of a curbless shower with large-format porcelain and Schluter Kerdi waterproofing. We don't quote in vague ranges; the estimate breaks out demo, plumbing, tile, fixtures, and permit fees as separate line items. Free on-site consultations come with that exact written quote, not a ballpark guess."
  - q: "Do I need a permit for a bathroom remodel in Hoquiam?"
    a: "Any job touching plumbing, electrical, or a wall goes through the City of Hoquiam Building Department — a straightforward fixture-and-tile refresh with no layout change sometimes skips that step, but moving a drain or removing a wall doesn't. Plan review typically takes 1-3 weeks for a residential remodel this size, and TopVolk handles the application, plan set, and inspection scheduling as a WA Licensed Contractor. We build the permit timeline into your project schedule up front, including rough-in and final inspection dates. Miss a deadline we committed to, and the penalty clause written into your contract kicks in."
  - q: "Can you convert my tub to a curbless walk-in shower?"
    a: "Usually, yes — it depends on subfloor depth and where the drain line sits relative to the joists below. A curbless shower needs the floor framing dropped or built up around a linear drain, more straightforward on a slab-on-grade or crawlspace home than one with finished ceiling below. We waterproof with Schluter Kerdi membrane and a pre-sloped pan, use large-format porcelain, and add a recessed niche and built-in bench where the layout allows. Most curbless conversions add $2,000-$4,000 over a standard curbed shower once framing and drain relocation are factored in."
  - q: "What's the warranty on the remodel work?"
    a: "Workmanship is covered for one year after final inspection, and manufacturer warranties on fixtures — Kohler, Moen, Broan fans — pass through separately per their terms. In Grays Harbor's humid coastal climate, grout and caulk lines typically need a refresh around year 8-10 if the exhaust fan is sized right; undersized ventilation cuts that timeline in half. Hidden rot from waterproofing failure is the main thing we design against with Schluter Kerdi and RedGard instead of a traditional mud-set shower. Call (206) 591-1096 if anything about the workmanship isn't right within that first year — Vladislav handles callbacks directly."
  - q: "Do you cover other towns near Hoquiam?"
    a: "Yes — Aberdeen, Cosmopolis, and Elma are all within the same project radius, and we'll often schedule two Grays Harbor jobs back to back to make the drive out from Seattle worth it. Scheduling windows run 4-8 weeks out depending on season, with spring and early summer booking fastest since that's when most homeowners tackle a full remodel before fall rains set back in. Free on-site consultations get booked directly with Vladislav, not a scheduler. Reach out at (206) 591-1096 to check current availability for your part of Grays Harbor County."