title: "Hoquiam ADU Construction — DADU, AADU & Basement Builds"

answer: "TopVolk Construction builds detached and attached ADUs in Hoquiam, Washington — WA Licensed Contractor, 100+ projects completed since 2017."

intro: |
  A 50-by-100 lot was the standard plat size when Hoquiam's sawmills ran three shifts a day, and that footprint is still what most homeowners here are working with when they call about a backyard rental unit. TopVolk Construction builds detached ADUs (DADUs), attached ADUs (AADUs), and basement conversions across Hoquiam, from the older housing stock near Bishop Park to the newer infill lots stretching toward Lake Swano. Since WA HB 1337 took effect, most single-family lots statewide qualify for up to two ADUs, and that's opened up real rental income potential in a town where median household income sits around $44,000 a year. A lot of these projects start small — a studio DADU with a compact GE range, a Frigidaire or Kenmore refrigerator, and a stackable Whirlpool washer/dryer, sized for a tenant or a family member, not a short-term rental. Budget matters more here than in a Seattle Metro build, so appliance packages get specced around what actually holds up in a rental unit long-term — Amana and Samsung dishwashers show up in a lot of our Hoquiam kitchens too, since parts and repair techs for those brands are easy to find around Grays Harbor County if something needs warranty work down the road. Vladislav Volkov runs these builds directly, from the first site walk to the final inspection, no sales staff in between. WA Licensed Contractor, 100+ projects completed since 2017. Call (206) 591-1096 for a free consultation.

localContext: |
  Hoquiam's housing stock skews old — a lot of the homes in the 98550 zip code date back to the 1900s-1920s timber boom, built on post-and-pier foundations with crawlspaces that were never designed to handle a basement conversion. Down near Levee Street and the 8th Street Bridge, the water table sits high enough that a basement ADU usually isn't worth the sump pump and vapor barrier work it would take to keep it dry through the winter. Move up the hill toward Central Park (98526) and you'll find more 1950s-60s ranch-style homes on flatter, drier lots — better candidates for a DADU with a standard footing and slab. Either way, ADU permits inside city limits run through the City of Hoquiam's building department, not Grays Harbor County PDS, which only covers unincorporated pockets like parts of Central Park and Emerson. Rain here averages around 80 inches a year, well above Seattle's 37 — that changes how we detail roof overhangs, gutters, and siding transitions on every unit we build.

  Closer to downtown, near Simpson Avenue and the Grays Harbor waterfront, lots tend to be narrower and older, and some already have a detached garage sitting where a DADU would go — those garage conversion jobs move faster since the slab and roof structure are already there. Out toward the Hoquiam River and the tide flats, soil borings have come back saturated within two feet of grade on more than one job, which rules out a full basement and pushes the design toward a raised DADU on standard footings instead. Homeowners near Hoquiam High School and the newer streets off Aberdeen-Hoquiam Road tend to have more buildable yard space, since those lots were platted later and aren't squeezed the way the original mill-town grid is. Wherever the lot sits, we walk it before quoting — soil, tree roots, and existing utility stubs all change the number.

commonProblems:
  - title: "Post-and-pier foundations make basement ADUs a bad bet near the river"
    description: "A lot of Hoquiam's original mill-era homes sit on post-and-pier foundations with 18-24 inches of crawlspace clearance and no real vapor barrier underneath. Converting that space into a legal basement ADU means a new egress window, a sump pump, and often a full foundation upgrade before the City of Hoquiam will sign off on rough-in inspection. For most lots near the river flats, we steer clients toward a detached DADU on a PT lumber sill plate and standard concrete footing instead — it's usually $15K-$25K cheaper than fighting a wet crawlspace, and it clears final inspection faster. Homes near Bishop Park and the lower Levee Street blocks are the ones we flag first for this conversation, before a homeowner spends money on drawings for a basement plan that a wet crawlspace will kill anyway."
  - title: "Separate water and sewer taps add cost fast if you don't plan for them"
    description: "Hoquiam Public Works allows a shared water and sewer connection between the main house and a DADU under certain conditions, but a separate sewer lateral tap runs $6K-$12K depending on distance to the main and whether the crew hits old cast iron or root-clogged clay pipe along the way. We test the existing lateral with a camera before quoting so there's no surprise change order mid-project. A shared meter keeps costs down but limits future utility billing flexibility if you rent the unit long-term. We lay this out with line-item pricing at the first walkthrough, not after the trench is dug — and on older Hoquiam lots with clay pipe still in the ground, that camera inspection has saved more than one client a bad surprise at rough-in."
  - title: "HB 1337 opened the door, but City of Hoquiam permitting still has its own rules"
    description: "WA HB 1337 lets most single-family lots in Hoquiam build up to two ADUs, but the City's building department still checks height limit (24 feet for a DADU), rear and side setbacks, and lot coverage before issuing a permit. Plan review on a straightforward DADU using a pre-approved plan set typically runs 3-5 weeks here — faster than Seattle SDCI, since the queue is shorter. Parking minimums are waived for most ADU applications under the current code, which matters on Hoquiam's narrower mill-town lots. TopVolk is a WA Licensed Contractor and handles the full permit packet, from site plan to plan review, direct with the City — Vladislav sits in on the counter review himself instead of sending it through a permit runner."
  - title: "What a Hoquiam DADU actually costs, and why the range is wide"
    description: "A detached ADU here typically runs $120K-$180K depending on size, foundation type, and how far utilities have to run from the street. Wet soils near the tide flats mean extra site prep and sometimes a French drain around the footing — that alone can add $8K-$15K versus a dry, flat lot up toward Central Park. An attached ADU or garage conversion runs cheaper, often $70K-$110K, since it uses existing framing and roof. Every quote is line-item, not a range, and every contract includes a written deadline with a penalty if TopVolk misses it. Given a median household income around $44,000 in Hoquiam, most clients treat this as a multi-year decision, and we're glad to phase a project — foundation and shell one year, finish work the next — if that fits the budget better."
  - title: "80 inches of rain a year is hard on siding, roofing, and heat pumps alike"
    description: "North-facing walls on Hoquiam DADUs collect moss and mildew fast in a climate this wet, which is why most of our builds use Hardie cement-board siding over cedar — it holds paint longer and doesn't need re-staining every few years. A Mitsubishi mini-split handles heating and cooling for most 400-600 sq ft units efficiently, but the outdoor condenser needs a clear gutter line above it so runoff doesn't freeze the coil in a hard winter. R-49 attic insulation and a properly lapped vapor barrier in the crawlspace keep utility bills down. Expect a roof recoat or gutter clean every 2-3 years given the rainfall here, and budget for a wider roof overhang than you'd see on a Seattle build — the extra foot of eave keeps wind-driven rain off the Hardie siding seams."
  - title: "Budget-friendly appliance packages that still hold up in a rental unit"
    description: "Most Hoquiam ADU clients aren't chasing a Sub-Zero and Wolf kitchen — they want something that works for a tenant or an aging parent and doesn't need a service call every year. We spec GE and Frigidaire ranges most often, Whirlpool or Kenmore for the washer/dryer stack, and Amana or Samsung for the dishwasher and fridge, since parts and local repair techs for those brands are easy to find in Grays Harbor County if something goes out under warranty. A 400-600 sq ft unit doesn't need a full-size range — a 24-inch GE or Frigidaire slide-in fits a galley kitchen without eating into livable square footage. We price the appliance package as its own line item on the quote, so you can upgrade or downgrade brands without renegotiating the whole contract."

faq:
  - q: "How fast can you get to Hoquiam for ADU construction?"
    a: "Hoquiam sits about two hours from the Seattle metro via US-12 and SR-8, so we schedule site visits in blocks rather than same-day drop-ins. Most consultations get booked within 5-7 business days of a call. Access on older mill-town lots can be tight, especially the narrower parcels near Simpson Avenue, so we walk the site first to confirm equipment access before quoting excavation. Call (206) 591-1096 to get on the schedule."
  - q: "What does a DADU cost in Hoquiam?"
    a: "A detached ADU typically runs $120,000-$180,000 depending on size, foundation type, and utility distance from the street, with attached conversions running $70,000-$110,000. Wet-soil lots near the tide flats usually cost more upfront for site prep and drainage, while flatter lots up toward Central Park tend to run at the lower end of the range. We provide a free on-site consultation and a line-item quote — not a ballpark range — before any contract is signed."
  - q: "Do I need a permit from Grays Harbor County or the City of Hoquiam for my ADU?"
    a: "If the lot sits inside Hoquiam city limits, permits go through the City of Hoquiam building department, not Grays Harbor County PDS — county PDS only handles unincorporated areas nearby, like pockets of Central Park and Emerson. Plan review on a straightforward DADU runs about 3-5 weeks here, and a full build including permitting, foundation, framing, and finish work typically lands in the 4-7 month range end-to-end. TopVolk is a WA Licensed Contractor and prepares the full site plan, setback documentation, and application packet as part of the project."
  - q: "Can my ADU share a water meter with the main house, or does it need its own?"
    a: "Hoquiam allows a shared water and sewer connection for a DADU under certain conditions, which saves on tap fees but means one combined utility bill. A separate connection costs more upfront but gives cleaner billing if you plan to rent the unit long-term. Either setup can run a Rinnai tankless water heater for the ADU without taxing the main house's hot water supply."
  - q: "How long will a DADU built for Hoquiam's climate last?"
    a: "Hardie siding and a properly detailed roof overhang should hold up 30-plus years against 80 inches of annual rain with minimal repainting. A Mitsubishi mini-split typically runs 12-15 years with basic filter maintenance, and budget-tier appliances like GE, Whirlpool, and Frigidaire generally run 10-15 years with normal use. Framing, foundation, and rough-in work carry standard workmanship coverage, and any deadline written into the contract carries a real penalty if we miss it — that's not boilerplate."
  - q: "Do you cover areas near Hoquiam, and how does scheduling work?"
    a: "We build ADUs throughout Grays Harbor County, including Aberdeen, Cosmopolis, and Elma, alongside our regular work across King, Snohomish, Pierce, and Kitsap counties. Grays Harbor projects get grouped to keep travel efficient, so scheduling windows run a bit longer than in-metro jobs — typically 2-3 weeks out for a first site visit. Call (206) 591-1096 to check current availability."
  - q: "What appliances come standard in a Hoquiam ADU?"
    a: "Standard packages run GE or Frigidaire for the range, Whirlpool or Kenmore for the washer/dryer, and Amana or Samsung for the dishwasher and refrigerator — brands with parts and repair techs available locally in Grays Harbor County. Everything gets sized to fit a 400-600 sq ft unit, so that's usually a 24-inch range and a stackable laundry setup instead of full-size residential appliances. Appliance brand and tier are a line item on the quote, so swapping to a different brand doesn't require rewriting the whole contract. Call (206) 591-1096 if you want to talk through options before we draft the quote."