  - q: "What permits does a kitchen remodel need in Hoquiam?"
    a: "Any kitchen remodel touching plumbing, electrical, gas lines, or a load-bearing wall needs a permit through the City of Hoquiam Building Department, separate from Grays Harbor County's process for unincorporated areas like Central Park or Copalis Beach. Plan review on a standard remodel usually takes two to four weeks, with a rough-in inspection before walls close and a final inspection before the kitchen is signed off. TopVolk Construction is a WA Licensed Contractor and handles the permit filing directly, so homeowners aren't stuck chasing down paperwork or waiting on a sub to submit drawings. Structural changes involving an LVL beam typically require an engineer's letter as part of the submittal, which adds a few days to the review but keeps the inspector from red-tagging the job."
  - q: "Can an older Hoquiam house handle an induction range without a full rewire?"
    a: "Usually not without some electrical work — most kitchens here are still on a 100-amp panel, and an induction range from GE or Whirlpool needs its own 40-amp circuit. Rather than rewiring the whole house, the usual fix is a panel upgrade to 200 amps, which also covers GFCI-protected countertop outlets required under current code. That upgrade typically runs $3,000 to $4,800 and gets scheduled early in the project so drywall and cabinet work aren't held up waiting on the electrician. It's a common enough scenario in Hoquiam's older housing stock that we plan for it during the initial walkthrough."
  - q: "How long do the cabinets and countertops last after a remodel?"
    a: "Semi-custom cabinets with moisture-resistant plywood boxes typically last 20-plus years in this climate, compared to 8-10 years for the original builder-grade particleboard common in Hoquiam's ranch-style homes. Quartz countertops hold up better than granite or laminate against the humidity coming off Grays Harbor since they don't require sealing and resist staining. Workmanship on the installation itself is covered, and appliance warranties run through the manufacturer — GE, Whirlpool, and Frigidaire all offer standard one-year coverage on new units. Proper ventilation and a working range hood go a long way toward keeping moisture damage from coming back."
