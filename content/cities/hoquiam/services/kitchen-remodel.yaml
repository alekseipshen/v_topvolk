title: "Hoquiam Kitchen Remodel — Grays Harbor Timber-Town Kitchens"

answer: "Vladislav Volkov of TopVolk Construction remodels Hoquiam kitchens in 6-10 weeks with line-item quotes and no sales staff involved."

intro: |
  TopVolk Construction remodels kitchens in Hoquiam, Washington in six to ten weeks, from demo to final inspection, with Vladislav Volkov running the job himself instead of handing it off to a sales rep and a rotating crew. Most calls here come out of West Hoquiam and the blocks around Lytle Park, where the housing stock skews older and the kitchens haven't been touched since the mills were still floating logs down the Hoquiam River. A good share of these houses went up during the early-1900s timber boom, so the kitchens are small, closed-off rooms built around one window and a wall that shouldn't come down without an LVL beam doing the work first. Swap in a new GE or Frigidaire range and you'll often find the outlet behind the old stove wired off a 100-amp panel that can't spare a second 20-amp circuit for a dishwasher. Near Hoquiam's Castle and the older streets off Emerson, that's the rule, not the exception.

localContext: |
  Hoquiam's housing stock splits pretty cleanly into two eras. Down near downtown, inside the 98550 zip code, you'll find foursquares and craftsman bungalows built between 1900 and 1930, many still running galvanized supply lines and knob-and-tube wiring somewhere behind the plaster. Head toward the edges of town, into the pocket shared with Aberdeen around 98520, and the kitchens are more likely 1950s-70s ranch infill — Formica counters, painted particleboard cabinet boxes, maybe a Kenmore range original to the house. Grays Harbor pulls close to 80 inches of rain a year, wetter than Seattle, so crawlspace moisture and subfloor rot under the sink base cabinet turn up more often here than on the east side of the state. Kitchen work that touches plumbing, electrical, or a load-bearing wall gets permitted through the City of Hoquiam Building Department rather than a county office, and plan review on a modest remodel usually runs two to four weeks before the permit gets issued.

commonProblems:
  - title: "Closed-Off 1920s Galley Kitchens and the Load-Bearing Wall Problem"
    description: "A lot of the craftsman bungalows near West Hoquiam were built with a narrow galley kitchen boxed off from the dining room by a load-bearing wall — standard framing for the era, but it kills any open-concept layout homeowners want now. Opening that wall means sizing an LVL beam and often a PSL post to carry the load down to the foundation, plus a permit and an engineer's stamp on anything spanning more than about 8 feet. TopVolk has run this exact scope on several West Hoquiam remodels, most recently landing a GE range and hood on the new peninsula once the wall was gone. Budget $4,000 to $7,000 for the structural piece alone, on top of the rest of the remodel, and expect a rough-in inspection before drywall goes back up."
  - title: "100-Amp Panels Can't Run an Induction Range and a Dishwasher Together"
    description: "Most houses built before 1970 in Hoquiam are still sitting on a 100-amp panel, and that's fine until someone wants a Whirlpool or Frigidaire induction range, which needs its own 40-amp circuit plus a dedicated 20-amp circuit for the dishwasher and disposal. Trip breakers enough times and the answer is usually a panel upgrade to 200 amps, run through the City of Hoquiam Building Department with an electrical permit and a final inspection before the meter gets re-energized. GFCI protection on every countertop outlet is required under current code, no exceptions for older kitchens being remodeled. Panel upgrades run roughly $3,000 to $4,800 depending on the service entrance and meter location, and we schedule that work early so the rest of the kitchen isn't waiting on an electrician."
  - title: "Gas Line and Vent Modifications Need a Permit — Even in an Older House"
    description: "Homeowners moving a range or adding a hood over a Samsung or Amana gas range assume it's a simple swap, but any gas line relocation or new vent penetration through an exterior wall requires a mechanical permit from the City of Hoquiam Building Department, not just an electrical or building permit. Range hood venting has to hit a minimum CFM for the burner output, and the duct run can't just dead-end in the attic — it needs to terminate outside with a proper cap. TopVolk Construction is a WA Licensed Contractor and pulls these permits directly, no waiting on a sub to file paperwork. Rough-in inspection happens before the wall closes up, final inspection happens once appliances are hooked up and tested."
  - title: "What Actually Drives the Price on a Hoquiam Kitchen Remodel"
    description: "A full kitchen remodel here typically runs $28,000 to $55,000, with bigger jobs pushing past $65,000 once a load-bearing wall, panel upgrade, and gas line relocation are all involved. Cabinet choice moves the number more than anything — IKEA boxes with semi-custom doors keep costs down, while full custom cabinetry can double that line item alone. Appliances matter too: a GE or Whirlpool package runs a fraction of what upscale brands cost, which fits the budget most Hoquiam homeowners are working with. Every quote from TopVolk is line-item, not a vague range, and there's a deadline penalty written into the contract if the job runs past the agreed schedule. Call (206) 591-1096 for a free on-site estimate."
  - title: "Laminate and Particleboard Don't Hold Up in Grays Harbor's Damp Climate"
    description: "Original Formica countertops and painted particleboard cabinet boxes are common in Hoquiam's older ranch-style kitchens, and both take a beating from the humidity coming off Grays Harbor. Laminate seams lift, particleboard swells under the sink where a slow leak goes unnoticed for months, and a curling countertop edge is usually the first sign it's time to replace rather than patch. Quartz holds up better than granite for most PNW cooking habits since it doesn't need sealing and resists staining from the moisture that granite can absorb over time. Semi-custom cabinets with a moisture-resistant plywood box last 20-plus years compared to 8-10 for builder-grade particleboard. TopVolk Construction has handled well over 100 of these kitchen and cabinet swaps since 2017 across the Seattle Metro area and now into Grays Harbor County."

