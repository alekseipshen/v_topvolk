  - q: "Can you install large-format tile over an old subfloor?"
    a: "Yes, but not without prep — large-format porcelain like 24x48 sheets needs a flat substrate within 1/8 inch over 10 feet, so TopVolk checks the subfloor with a laser level and adds self-leveling compound or DriCore subfloor panels where the original tongue-and-groove has settled. Skipping that step is why large-format tile cracks or shows lippage within the first year on a lot of budget installs. On slab or concrete floors, a Ditra uncoupling membrane goes down first to isolate the tile from minor slab movement. This adds a day or two to the schedule but prevents callbacks."
