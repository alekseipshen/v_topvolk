  - q: "How does the City of Hoquiam permit process work for a remodel?"
    a: "Structural work, additions, and new electrical or plumbing service require permits through the City of Hoquiam building department, with plan review typically taking a few weeks depending on project scope and whether the lot falls near flood-plain review zones along the river. TopVolk prepares and submits the permit package as part of the contract and schedules rough-in and final inspections directly with the city. As a WA Licensed Contractor, TopVolk handles IRC compliance items — egress, setbacks, load calculations — so plans move through review without repeated rejections."
  - q: "Do you replace old wiring and galvanized plumbing during a remodel?"
    a: "Yes — in pre-1930s Hoquiam housing stock, it's common to find knob-and-tube wiring and galvanized supply lines still in service, and both get flagged during the initial walkthrough before any wall opens. Electrical gets brought up to current code with a proper panel and circuit count for modern appliances like a GE or Frigidaire range. Galvanized lines typically get repiped in copper or PEX during the same demo phase, since opening the walls twice costs more than doing it once."
  - q: "What's the warranty on general contracting work, and how does the coastal climate affect it?"
    a: "Workmanship is covered under the project contract, with manufacturer warranties passed through on appliances, siding, and mechanical systems like a Rinnai water heater or mini-split. Grays Harbor's roughly 80 inches of annual rainfall means anything touching the exterior envelope — Hardie siding, flashing, crawlspace vapor barrier — gets detailed for moisture management, not just code minimum. That's the difference between trim rotting in five years versus lasting twenty. Ask about specific coverage during the walkthrough."
  - q: "Do you cover areas near Hoquiam, and how does scheduling work?"
    a: "Aberdeen, Cosmopolis, and other Grays Harbor communities are covered alongside Hoquiam, often on the same trip for homeowners managing properties across both cities. Scheduling runs owner-led — Vladislav Volkov handles the walkthrough, the quote, and the project directly, with no sales staff in between. Typical lead time from first call to signed contract is one to two weeks depending on permit prep. Call (206) 591-1096 to check current availability."