title: "Hoquiam General Contracting — One Contractor, One Timeline"

answer: "TopVolk Construction, owner-led by Vladislav Volkov, general-contracts remodels, additions, and ADUs in Hoquiam, Washington — 100+ projects completed since 2023."

intro: |
  A 1911 mill-worker's cottage off Simpson Avenue doesn't get remodeled the same way a 1978 rancher near Bel-Aire does — different framing, different wiring, different problems waiting behind the drywall. That's the core issue with general contracting in a town like Hoquiam: half the housing stock predates the plywood era, and the other half was built fast during the postwar timber boom with whatever materials were on hand. TopVolk Construction runs the whole job as one scope — permits, framing, MEP coordination, finish work — so a homeowner near Hoquiam's Castle or out toward the 7th Street Theatre isn't fielding three separate phone calls from three separate subs. Kitchens here still run mostly on Whirlpool and GE ranges, and when a remodel calls for a new range hood or a Frigidaire replacement, that gets specified up front instead of guessed at during finish week. Vladislav Volkov runs point on every job personally — no sales rep, no project coordinator relaying messages secondhand.

localContext: |
  Hoquiam's housing stock splits into three rough eras: pre-1930 mill-worker cottages near downtown and the Hoquiam River (zip 98550), 1950s-70s infill further out toward West Hoquiam and Bel-Aire, and a smaller batch of newer construction scattered on higher ground away from the flood plain. The older stock often still has knob-and-tube wiring behind the plaster, galvanized supply lines that have been rusting shut for decades, and post-and-pier foundations that have settled unevenly over 90-plus years. Grays Harbor County sits under roughly 80 inches of rain a year, more than double what Seattle gets, so anything touching the building envelope — siding, roofing, crawlspace vapor barrier — has to account for near-constant moisture and the wood rot that comes with it. Permits for work inside city limits route through the City of Hoquiam building department, not Grays Harbor County, which matters for scheduling since a project pulling from the wrong jurisdiction stalls fast. Coverage extends into Aberdeen (98520) for households working across both cities on the same property or family compound.

commonProblems:
  - title: "Old-growth framing hides rot until demo starts"
    description: "Pull the plaster off a Simpson Avenue cottage and it's common to find a rim joist or sill plate soft from decades of harbor moisture wicking up through a post-and-pier foundation with no vapor barrier underneath. That's a structural fix, not a cosmetic one — usually a PT lumber sill replacement, sistered joists where the original Douglas-fir has punky sections, and sometimes an LVL beam swapped in where a load-bearing wall comes out for an open-concept kitchen. Skipping this and just re-drywalling over it is how houses end up with soft floors five years later. On a typical whole-house remodel this kind of structural repair adds $3,000-$8,000 depending on how much of the framing is affected, and it gets caught during the initial walkthrough, not mid-project."
  - title: "Framing, electrical, plumbing, and HVAC showing up out of order"
    description: "A general contractor's real job on a $100K+ remodel is sequencing — rough-in electrical and plumbing have to clear inspection before insulation goes in, and HVAC ductwork or a Mitsubishi mini-split line set needs to route before drywall gets hung. When homeowners try to manage this themselves, it's common for a plumber to show up before the framer has closed in a wall, or an electrician to rough-in before the HVAC sub has claimed his chase space. TopVolk builds the schedule in advance with each trade committed to a date, and MEP coordination happens before anyone touches a stud, not after someone gets to the site and finds the wall already closed."
  - title: "City of Hoquiam permits and plan review timing"
    description: "Any structural change, addition, or new electrical service in Hoquiam needs a permit through the city building department, and plan review can run several weeks depending on scope — longer if the plans show work near the flood-prone areas along the river that trigger additional review. TopVolk pulls permits as part of the contract, not as a homeowner task, and schedules rough-in and final inspections around the AHJ's actual calendar instead of guessing. As a WA Licensed Contractor, TopVolk handles the IRC code compliance side directly — setback questions, egress requirements on bedroom additions, that kind of thing — so the plans don't bounce back from the reviewer twice."
  - title: "What a full remodel actually costs here versus a quote that changes later"
    description: "Given the median income in Hoquiam sits around $44,000, most remodels here run leaner than the Seattle-metro range — kitchen and bath work typically lands in the $30K-$70K band rather than six figures, with additions and ADUs pushing higher depending on square footage. What actually moves the number: whether the existing electrical panel needs upgrading to handle a new range or mini-split, how much of the foundation needs structural repair, and whether cabinets are semi-custom or IKEA-based boxes. TopVolk gives a line-item quote up front — not a range — and if the finish date slips past the contract date, a penalty is written into the agreement, not just promised verbally."
  - title: "When to renovate versus rebuild a section of the house"
    description: "A lot of Hoquiam homes are at the point where a single-system fix doesn't make sense anymore — replacing a Kenmore water heater in a house that still has galvanized supply lines just delays the real plumbing repipe by a year or two. The general rule: if the electrical panel, plumbing, and structural framing all need attention within the same five-year window, it's cheaper to open the walls once and handle it in one project than pay for access three separate times. TopVolk evaluates this during the free on-site walkthrough and gives a straight answer on whether a targeted repair or a fuller renovation makes more financial sense, factoring in what's already failing versus what's just old."

