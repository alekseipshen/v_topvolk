  - q: "How fast can you get to Hoquiam for Door Installation?"
    a: "Hoquiam sits about a 20-minute drive from Aberdeen along Highway 101 and 12, and it's within TopVolk's regular Grays Harbor service loop, so scheduling isn't a problem. Most single-door jobs — entry, interior, or garage — get booked within a week or two of the estimate call, and we work around driveway access and street parking on the narrower blocks near downtown without trouble. A straightforward entry door replacement is usually done in one day; a patio slider or French door upgrade can run two to three days if the opening needs reframing. Call (206) 591-1096 to get on the schedule or ask about a free on-site estimate."
  - q: "What does entry door replacement in Hoquiam cost?"
    a: "A standard entry door swap in the existing opening typically runs $1,800 to $3,200 installed, depending on whether you go with a fiberglass slab like Therma-Tru, a solid wood door, or add sidelights and glass. Garage doors run separately, usually $1,200 to $2,800 depending on size and insulation rating, and interior doors run $450 to $900 per opening. Pricing depends on hardware grade, whether the jamb and casing need to be rebuilt, and how much trim carpentry is involved. We give a line-item quote on-site, not a phone estimate, so the number holds once work starts — call (206) 591-1096 for a free consultation."
  - q: "Do I need a permit to replace a door in Hoquiam?"
    a: "Straight swap-outs in the same rough opening — like replacing a worn entry door or garage door with a same-size unit — usually don't require a permit through the City of Hoquiam Building Department. Widening an opening for a patio slider or French doors, or any change that touches a load-bearing wall, does need a permit and inspection. TopVolk is a WA Licensed Contractor and we handle the application, schedule the rough-in and final inspection, and keep the paperwork on file so there's no gap if the house sells later. Typical turnaround for a permit on a straightforward opening change runs one to two weeks in Grays Harbor County."
  - q: "Can I get a smart lock installed with my new entry door?"
    a: "Yes — most entry door installs in Hoquiam now include a request for keyless entry, and Schlage Encode and August locks both mount on a standard door prep without extra machining. We set the strike plate and bore the deadbolt hole to match the lock manufacturer's template during install, so it's not an add-on step later. Schlage Encode works well for rental or second-home doors near the harbor since it doesn't need a separate hub, while August fits better if you already run a smart home system. Either option adds roughly $250 to $400 to the install depending on the lock model."
  - q: "How long should a new door last in Hoquiam's climate?"
    a: "A properly flashed and installed fiberglass or steel entry door should hold up 20 to 30 years out here, even with the wind and rain coming off Grays Harbor most of the year. Weatherstripping, sweeps, and thresholds wear faster in this climate and typically need replacing every 5 to 10 years to keep the seal tight. Manufacturer warranties on doors like Therma-Tru or Clopay garage doors cover the material and finish, and we back our installation work with a deadline penalty written into every contract — if we miss the date we committed to, it costs us, not you."
