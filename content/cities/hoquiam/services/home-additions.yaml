title: "Hoquiam Home Additions — ADU & Addition Builds"

answer: "TopVolk Construction builds home additions and ADUs in Hoquiam, WA — owner-led by Vladislav Volkov, with line-item quotes and deadline penalties."

intro: |
  Ask what a home addition costs in Hoquiam, and the honest answer starts with the foundation type, not the square footage. Vladislav Volkov hears that question on nearly every site visit. Maybe it's a detached ADU planned for a rental lot near West Hoquiam. Maybe it's a second story going on top of a 1920s foursquare off 8th Street. TopVolk Construction LLC has completed 100+ projects since 2017 around Seattle Metro, and now takes on Grays Harbor County work too, including ADU builds within a few blocks of Hoquiam's Castle. A lot of these lots sit on older post-and-pier foundations. They were never engineered to carry a second floor, so the structural math gets worked out before any drawings go to the city. One recent quote for a rental ADU near Emerson Park spec'd a Frigidaire range and a stacked Amana laundry pair, sized for the smaller kitchenette footprint typical of these builds. Real line items, pulled from actual drawings — not a ballpark guess over the phone.

localContext: |
  Most of Hoquiam's buildable lots sit inside zip code 98550, though plenty of TopVolk's Grays Harbor clients live just across the river in Aberdeen's 98520. Both jobs often get scheduled in the same week to save on drive time. West Hoquiam and the blocks around downtown still carry a lot of timber-boom housing stock — foursquares and Craftsman bungalows built between 1900 and 1925. Many rest on post-and-pier foundations, with crawlspaces that never got a proper vapor barrier installed. Newer infill near Riverside and the east side of town tends to be single-story rancher construction from the 1950s and 60s. That's simpler to add onto structurally, but it's often short on electrical panel capacity for a second kitchen or an added HVAC zone. Permits for lots inside city limits run through the City of Hoquiam building department. Anything just outside, like parts of the Central Park area, falls under Grays Harbor County Community Development instead, and the setback and lot coverage numbers change accordingly. Grays Harbor sees over 80 inches of rain some years, more than double what Seattle gets. So any addition tying into an existing roofline needs real step flashing, not a bead of caulk and a hope.

commonProblems:
  - title: "Building a DADU for Rental Income Under WA HB 1337"
    description: "Median household income in Hoquiam runs around $44,000, and a lot of addition requests aren't about extra bedrooms. They're about a detached ADU that can bring in rent. WA HB 1337 opened the door statewide to two ADUs per single-family lot. But the parcel still has to clear the setback and lot coverage limits the City of Hoquiam sets, plus get a separate utility connection for water and sewer. TopVolk frames these on PT lumber sill plates over a standard perimeter footing and insulates the roof to R-49 for Grays Harbor winters. A dedicated electrical panel gets run for the new unit instead of piggybacking off the main house. A 500-600 sq ft DADU with a Frigidaire appliance package typically runs $95K-$140K. The final number depends on how far utilities have to travel from the street. Plan review through the city usually takes 4-8 weeks before framing starts."
  - title: "Old Foundations Weren't Built for a Second Story"
    description: "Plenty of Hoquiam's Craftsman and foursquare homes near downtown were built on post-and-pier foundations in the 1900s and 1910s. Those were sized for one floor of load, not two. Before framing a second story, Vladislav pulls the crawlspace measurements first. Then he runs the numbers on an LVL beam or PSL post to carry the new point loads down to a reinforced footing. Existing floor joists usually need sistering with new lumber, plus additional blocking at the bearing walls. The rim joist often needs full replacement too, where decades of moisture worked into the wood. Skip that step, and the addition ends up with bouncy floors within five years. A second-story addition on an older foundation costs more than a simple ranch tie-in. Expect engineering and foundation reinforcement alone to add $15K-$25K before framing even starts."
  - title: "Mother-in-Law Suites Need Their Own Kitchen and Entrance"
    description: "An attached ADU has to function like a separate home — its own entrance, its own kitchen, sometimes its own laundry — while still sharing walls and a roofline with the main house. That means a second gas or electric line for a compact range, usually a Whirlpool or GE unit sized for the smaller footprint. It also often means a Rinnai tankless unit if the main water heater can't handle the extra draw. Framing has to route new plumbing without cutting into load-bearing walls. On a lot of Hoquiam's older homes, that means opening the wall cavity first to check for original galvanized pipe before running PEX. Layout gets sketched out at the free on-site consultation, entrance and kitchen placement included, before a permit set goes anywhere near the city. Call (206) 591-1096 to walk through the layout with Vladislav directly."
  - title: "Matching Old Siding Drives Addition Costs Up"
    description: "Tying new framing into a 1910s foursquare's original cedar siding is rarely a clean material match. That siding has weathered a century of Grays Harbor rain, and fresh cedar shake next to it reads obviously new for years. Most Hoquiam clients end up switching the whole elevation to Hardie cement-board siding instead. It resists the moss and mildew that build up fast on north-facing walls here, and the full side gets repainted instead of just patching a corner. Same story with rooflines. Matching a 25-year-old comp shingle to new material usually means replacing the whole slope, not just the new section, so the color reads consistent. That siding and roof tie-in work adds roughly $8K-$18K on top of the addition itself, depending on how much of the existing elevation has to come down. It's the line item that surprises homeowners who only priced the square footage."
  - title: "New Square Footage Needs Its Own Heat Source"
    description: "Most of Hoquiam's older homes heat with an aging forced-air furnace or baseboard electric that was never sized for an extra 400-600 sq ft. Tying new ductwork into a furnace that's already maxed out usually just shuffles the comfort problem around the house. It doesn't fix it. TopVolk typically specs a Mitsubishi mini-split head for the addition instead. One outdoor condenser, one or two indoor heads, no ductwork tear-out required. It handles both winter heat and the muggy stretch of Grays Harbor summer. Mini-splits run efficiently for 12-15 years with an annual filter cleaning. Skipping that maintenance is the main reason units lose efficiency early. For additions over 600 sq ft, a second zone sometimes pencils out better than one oversized head. That gets priced separately at the walkthrough."

faq:
  - q: "How fast can you get to Hoquiam for Home Additions?"
    a: "Hoquiam runs about two hours from TopVolk's usual King and Snohomish County job sites via US-12 and SR-8. Site visits typically get grouped with other Grays Harbor County work to keep drive time reasonable. Parking on most Hoquiam residential lots is straightforward — no permit zones to navigate like some Seattle neighborhoods. A home addition or ADU typically runs 4-7 months end-to-end once permits are pulled, including plan review through the City of Hoquiam. Call (206) 591-1096 to schedule a free on-site consultation with Vladislav directly, not a sales rep."
  - q: "What does a home addition or ADU cost in Hoquiam?"
    a: "Most additions TopVolk builds in Hoquiam run $30K-$60K for a modest bump-out or bedroom addition. A full detached ADU with a kitchen and bathroom runs $95K-$140K. Pricing depends on the foundation type, whether the roofline needs full replacement to match, and how far utilities have to run from the street. Every quote is a line-item breakdown tied to the actual drawings, not a range pulled off a phone call. Call (206) 591-1096 for a free estimate with real numbers before any contract gets signed."
  - q: "What's the permit process for a home addition in Hoquiam?"
    a: "Additions inside Hoquiam city limits go through the City of Hoquiam building department. That office handles plan review, rough-in inspection, and final inspection before sign-off. Lots just outside city limits, like parts of the Central Park area, fall under Grays Harbor County Community Development instead, with different setback rules. TopVolk is a WA Licensed Contractor and prepares the full permit set — site plan, structural drawings, and the ADU paperwork required under WA HB 1337 — before submitting anything. Plan review usually takes 4-8 weeks depending on the AHJ's workload that season."
  - q: "Can an addition tie into my existing furnace, or do I need a mini-split?"
    a: "It depends on the furnace's remaining capacity. TopVolk checks the existing HVAC tonnage against the new square footage before recommending anything. Older Hoquiam homes with a furnace already near its limit usually get a Mitsubishi mini-split head instead, since running new ductwork through a finished ceiling adds cost and mess for little gain. Homes with newer, oversized furnaces can sometimes extend a duct run with a new register and damper instead. Either way, it gets sized and quoted during the walkthrough, not guessed at over the phone."
  - q: "What's the warranty on a home addition in Hoquiam?"
    a: "Workmanship is covered for one year after final inspection. Manufacturer warranties on the Mitsubishi mini-split, Hardie siding, or the appliance package carry their own separate terms, usually 10-25 years depending on the product. Grays Harbor's rain and coastal humidity are hard on exterior work, so flashing details and siding transitions get extra attention during the build, not just at the punch list walkthrough. Missed completion deadlines come with a penalty written into the contract — a real clause, not a sales pitch. Call (206) 591-1096 to go over the contract terms before signing anything."
  - q: "Do you work outside Hoquiam too?"
    a: "TopVolk also takes on additions and ADUs in Aberdeen, Cosmopolis, Elma, and Montesano, plus Ocean Shores for clients rebuilding closer to the beach. Grays Harbor projects usually get scheduled in blocks, so site visits and inspections happen efficiently instead of one-off trips out from Seattle Metro. Typical response time for a consultation request is 1-2 business days. Schedule a free consultation or call (206) 591-1096 to get on the calendar."