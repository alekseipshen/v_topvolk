  - q: "What does replacing windows in Hoquiam cost per window?"
    a: "Retrofit replacements typically run $500-$900 per window, and full-frame replacement where the rough opening or sheathing needs work runs $900-$1,600 per window installed. Frame material (vinyl versus fiberglass), glass package, and whether trim needs to be rebuilt all move that number. A free on-site estimate gets an exact line-item quote, not a range — Vladislav measures every opening himself before pricing it out. Call (206) 591-1096 to set up a walkthrough."
  - q: "Do window replacements in Hoquiam need a building permit?"
    a: "Standard like-for-like window swaps — same size opening, same location — generally don't require a permit from the City of Hoquiam, but enlarging an opening, converting a basement window to egress, or any structural header change does. TopVolk Construction is a WA Licensed Contractor and files that paperwork directly rather than leaving it to the homeowner. Typical plan review for an egress conversion runs one to three weeks before work can start. Straightforward retrofit jobs can often be scheduled without waiting on a permit at all."
  - q: "Should I match the original divided-light grilles on my Craftsman-era home?"
    a: "Most of the older homes near downtown Hoquiam have divided-light or simulated-divided-light sash, and matching that pattern on replacements keeps the house looking original instead of looking retrofitted. Milgard and Pella both offer grille patterns between the glass panes that replicate the look without the extra cleaning surfaces of true divided lights. It costs more than a plain sash but matters for resale and for keeping the historic character of the Simpson Avenue and Hoquiam's Castle-area blocks intact. Bring a photo of the original window pattern to the consultation and it gets matched during the quote."
  - q: "What's the warranty on replacement windows installed in Hoquiam?"
    a: "Milgard backs its vinyl windows with a lifetime warranty on the frame and glass seal for the original owner, and Pella and Marvin fiberglass units typically carry 10-20 year coverage depending on the product line. Installation work itself is warrantied separately by TopVolk Construction, and any deadline missed on the job has a penalty written into the contract up front. Given the rain exposure off Grays Harbor, the glass seal failing (fogging between panes) is the most common warranty claim after year eight or nine. Manufacturer warranties don't cover rot in the surrounding wood trim, so that gets inspected and flagged separately during install."
