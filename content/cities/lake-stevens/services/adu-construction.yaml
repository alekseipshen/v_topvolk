title: "Lake Stevens ADU Construction — WA HB 1337 Unlocks a Second Unit on Your Lot"

intro: |
  Residential lots in Long Bay and South Lake Stevens are bigger than most people realize once
  you pull the site plan — and WA HB 1337, signed into law in 2024, means those extra square
  feet in the backyard can now legally become a rentable DADU. The law allows up to two ADUs
  on most single-family lots statewide, which reshapes what a standard 98258 parcel can do for
  your household income. TopVolk Construction LLC has been building ADUs across Snohomish County
  since 2023 — 100+ projects completed, and Vladislav Volkov handles every estimate and permit
  conversation directly. No sales staff, no hand-off. Most of our ADU builds in this market
  spec a Mitsubishi MXZ mini-split for heating and cooling — it fits the 500-800 sq ft footprint
  without oversizing the mechanical, and Snohomish County inspectors see it constantly so there
  are no surprises at rough-in. Call (206) 591-1096 to run your lot through a free on-site review.

localContext: |
  The bulk of Lake Stevens's housing went up between 1990 and 2015 — ranchers, two-story
  colonials, and builder-grade split-levels on standard residential lots, most of them 7,500
  to 12,000 sq ft. That's the sweet spot for a detached ADU: enough backyard depth to hit
  600-800 sq ft of livable space while still clearing the required setbacks (typically 5 feet
  side and rear within city limits) and staying under maximum lot coverage. Parcels in the
  core 98258 zip code are what we see most — city sewer and water within reach, SR-9 access
  for subcontractors, and the City of Lake Stevens Permit Center handling plan review. Out
  toward Lochsloy, lots can run a half-acre or more, which opens up a larger DADU footprint
  but adds excavation cost and utility run length fast. Unincorporated parcels on the fringe
  near the Snohomish (98290) corridor shift permit jurisdiction to Snohomish County PDS
  (Planning and Development Services), which runs on a different review timeline than the city.
  Either way, plan review for an ADU permit in this area runs 8-12 weeks minimum before a
  shovel goes in the ground.

commonProblems:
  - title: "Setback and Lot Coverage Math That Kills the DADU Before Design Starts"
    description: "The most common mistake on a Lake Stevens DADU project is commissioning
      architectural drawings before anyone has verified that the proposed footprint actually
      fits on the lot. City of Lake Stevens zoning sets maximum lot coverage — typically
      40-50% of total lot area — and that ceiling includes the primary structure, garage,
      covered patio, and the new DADU. A 9,000 sq ft lot with a 2,000 sq ft house, attached
      two-car garage, and existing deck can leave less than 700 sq ft of theoretical DADU
      space before coverage is exceeded. Setback violations are the second trap: a DADU
      placed 3 feet from the rear property line instead of 5 feet will fail plan review and
      require a redesign. TopVolk runs the lot survey and zoning math before any design work
      starts. On tighter parcels, an attached ADU (AADU) over the garage is often the better
      answer — same living space, different permitting path, no lot coverage hit from a
      separate structure footprint."

  - title: "Utility Separation Decisions That Affect Long-Term Rental Income"
    description: "Hooking a DADU to a shared water and sewer service is cheaper upfront — saves
      $8,000-$18,000 compared to a full separate lateral — but it creates billing headaches for
      any long-term rental. The utility account stays in the primary homeowner's name, which
      means disputes over consumption and liability when a tenant's water use spikes. Snohomish
      County PUD and the City of Lake Stevens both allow shared connections on ADU permits, but
      the AHJ requires a proper cleanout and backflow prevention at the property line regardless.
      For most rental-income ADU builds in 98258, we recommend budgeting for a separate service
      from the start. A Navien NPE-240A2 tankless water heater handles domestic hot water in the
      ADU without requiring a 40-gallon tank — compact, wall-mounted, and it can run on a
      dedicated gas line with its own shutoff, which simplifies the utility separation further."

  - title: "City of Lake Stevens Permit Timeline and What the Process Actually Involves"
    description: "ADU permits in Lake Stevens go through the city's own Permit Center, not
      Snohomish County PDS — that distinction matters for timeline. A full DADU submittal
      requires architectural drawings, a site plan showing setbacks and lot coverage compliance,
      structural calculations (especially if there's an LVL beam spanning an open floor plan or
      a point load landing on an existing foundation), and a Washington State Energy Code
      compliance report. First-review turnaround runs 8-12 weeks. One correction cycle is
      common — figure another 3-4 weeks for the AHJ response and resubmittal. TopVolk prepares
      the full permit package as a WA Licensed Contractor and manages all comment responses
      through to approval. You don't deal with the building counter. Realistic end-to-end
      timeline from signed contract to certificate of occupancy — accounting for plan review,
      rough-in inspection, and final inspection — is 4-7 months."

  - title: "What a DADU Actually Costs to Build in Lake Stevens and What Drives the Number"
    description: "A fully permitted and finished 500-600 sq ft DADU in the 98258 area runs
      $180,000-$260,000 in current market conditions. Push to 750-800 sq ft with a vaulted
      ceiling or two-bedroom layout and you're looking at $260,000-$340,000+, depending on
      finish level. The variables that move the number: sloped lots requiring a stem wall or
      daylight basement foundation, LVL beam spans over open living areas, Hardie cement-board
      siding (standard in this climate for rot resistance), and mechanical spec. R-49 insulation
      in the ceiling assembly, a vapor barrier in any crawlspace, and a Mitsubishi mini-split
      system are code expectations here — not upgrades. Bosch dishwasher and LG kitchen package
      fit the Lake Stevens buyer profile without pushing appliance costs into luxury territory.
      TopVolk provides full line-item quotes after the on-site visit. No vague ranges that
      change after you sign — every cost itemized."

  - title: "Crawlspace Moisture and Vapor Control on PNW ADU Foundations"
    description: "Lake Stevens gets roughly 37 inches of rain per year, concentrated October
      through May. A DADU built on a crawlspace foundation — common on sloped lots in Lochsloy
      and South Lake Stevens — needs a 6-mil vapor barrier across the entire crawlspace floor,
      insulated and air-sealed rim joists, and either adequate cross-ventilation or a fully
      sealed unvented crawlspace assembly per IRC section R408. Skip proper vapor control and
      the subfloor joists develop mold within three to five years of occupancy. On slab-on-grade
      ADU builds where the owner wants finished flooring with thermal break from the concrete,
      we install DriCore subfloor panels before the finish floor goes down. Pressure-treated
      (PT) lumber is mandatory for all sill plates and any framing within 6 inches of grade —
      Snohomish County inspectors flag this at rough-in, and we spec it on every job regardless.
      Douglas-fir framing throughout, same as every other house built in this region."

faq:
  - q: "How fast can you get to Lake Stevens for an ADU consultation?"
    a: "TopVolk covers all of Snohomish County — Lake Stevens is a direct run north on I-5
      to Everett, then east on US-2 to SR-204 into the city, typically 35-50 minutes from our
      base depending on I-5 conditions. On-site consultations run Tuesday through Saturday.
      Vladislav Volkov does the walkthrough personally — you get the contractor on your lot,
      not a commissioned estimator. Most consultations are scheduled within the same week of
      initial contact. Call (206) 591-1096 to set up a time."

  - q: "What does a DADU cost to build in Lake Stevens right now?"
    a: "Current pricing for a permitted, finished DADU in the 98258 area: $180,000-$260,000
      for 500-600 sq ft, $260,000-$340,000+ for 750-800 sq ft depending on foundation type,
      roof form, and finish spec. Attached ADU conversions over an existing garage run less —
      $90,000-$160,000 — because the foundation and roof structure are already there. Basement
      conversion cost depends heavily on how much structural work is needed for egress windows
      and ceiling height compliance. Every quote from TopVolk is a full line-item breakdown
      after the on-site visit. Call (206) 591-1096 or schedule a free consultation."

  - q: "Does the City of Lake Stevens require a permit for ADU construction, and how does the process work?"
    a: "Yes — any DADU or attached ADU requires a building permit through the City of Lake
      Stevens Permit Center (Planning and Community Development Department). The submittal
      package includes architectural drawings, a site plan showing setback and lot coverage
      compliance, structural calculations, and a WA State Energy Code report. For unincorporated
      parcels near the city fringe, jurisdiction may shift to Snohomish County PDS instead —
      the permit path changes, but the documentation requirements are similar. TopVolk prepares
      the full package as a WA Licensed Contractor and handles all city communications and
      correction responses. Plan review runs 8-12 weeks; budget one correction cycle on top
      of that."

  - q: "Can I get a separate utility account and mailing address for a rental DADU in Lake Stevens?"
    a: "Separate mailing addresses for DADUs are handled during the permit process — the City
      of Lake Stevens assigns a secondary address at permit issuance. Separate utility accounts
      require a dedicated water service lateral and meter, which Snohomish County PUD allows
      on ADU projects. That separate lateral typically adds $8,000-$15,000 to project cost
      depending on run length and what's underground between the structure and the main.
      For any ADU intended as a long-term rental, the separate utility account simplifies
      tenancy agreements and improves the property's sale value — especially relevant if you
      later pursue a lot split under WA HB 1337. TopVolk coordinates the PUD application and
      utility trench work as part of the overall project scope."

  - q: "How long will a DADU last in the Lake Stevens climate, and what's the workmanship warranty?"
    a: "A properly built DADU in Snohomish County carries a 40-50 year structural lifespan
      with normal maintenance. The main vulnerabilities in this climate are the roofing
      membrane, exterior siding, and crawlspace moisture control — all addressed in the
      build spec. Hardie cement-board siding holds up significantly better than cedar in
      west-facing rain exposure; it won't rot or delaminate the way wood siding does after
      ten years of PNW winters. The Mitsubishi mini-split system carries a 12-year compressor
      warranty. TopVolk's workmanship warranty covers defects for three years post-completion,
      and missed project deadlines carry a financial penalty written into the contract —
      not a verbal promise."

