title: "Lake Stevens Garage Construction — ADU-Ready Builds for 98258"

intro: |
  Growth along the east shore of Lake Stevens has been relentless since 2015 — new subdivisions pushing up the hills off Highway 9 and SR-92, tract homes going up fast, and now a wave of homeowners realizing their lots can legally hold a second structure. WA HB 1337, passed in 2024, allows up to two ADUs on a single-family lot statewide, which fundamentally changes the economics of a detached garage build. A 24×24 slab-on-grade garage with a finished studio above it is not just extra storage — it's rental income or a space for extended family. The Getchell Road corridor and the neighborhoods ringing the south end of the lake are seeing more combined garage-plus-DADU projects than almost anywhere else in Snohomish County right now. TopVolk Construction LLC has been pulling permits through Snohomish County PDS and coordinating MEP rough-ins on structures like these since 2017 — 100+ projects across King, Snohomish, Pierce, and Kitsap counties. Vladislav Volkov handles the estimate himself. No sales staff, no middlemen.

localContext: |
  Nearly all of Lake Stevens falls within the 98258 zip code, and the permit authority for most new construction is Snohomish County PDS — not the City of Lake Stevens directly, for parcels outside city limits. That distinction matters on a garage build, because setback requirements, FAR calculations, and height limits differ depending on whether your parcel is incorporated or not. The newer subdivisions off Soper Hill Road and the Cavalero Hill area were built primarily in the 2000s and 2010s, meaning most homes already have two-car attached garages — but lots are large enough to accommodate a DADU above a new detached structure. Older neighborhoods closer to the lake itself, with homes from the 1970s and early 1980s, often have single-car garages or basic carports that no longer meet current household needs. Plan review at Snohomish County PDS for a garage-plus-ADU typically runs 6–10 weeks, so locking in your permit submission early is the first real milestone on these projects. Snohomish County also gets close to 45 inches of rain annually — vapor barrier under the slab is not optional here.

commonProblems:
  - title: "ADU-Over-Garage Builds: Structural Load and WA HB 1337 Compliance"
    description: |
      Building a living space above a garage is not just a framing question — it is a structural one. The floor system between the garage slab and the upper unit must carry residential live loads, which means engineered lumber: LVL beams spanning the garage opening, LVL rim joists, and joist hangers rated for the calculated load. Under WA HB 1337, Snohomish County allows up to two ADUs per single-family lot, and a garage-top unit counts as the DADU. The county's height limit for DADUs is typically 24 feet to the ridge, so garage plate height and roof pitch need to be calculated early to stay compliant. Snohomish County PDS requires stamped engineered drawings for any structure with a habitable floor above. TopVolk coordinates with a licensed structural engineer on those drawings before PDS submission. Budget $85,000–$140,000 for a 24×24 garage with a 500–600 sq ft studio above, depending on finish level and site conditions.

  - title: "Concrete Slab Problems: Cracking, Drainage, and PNW Soil Conditions"
    description: |
      Lake Stevens sits on glacially deposited soils — silty loam and clay-heavy fill in some areas — that move seasonally with the wet-dry cycle. A garage slab poured without proper sub-base prep will crack and settle within a few winters. The minimum spec here is 4-inch fiber-reinforced concrete (IRC minimum for garage slabs), but on soft or expansive soils, 5-inch thickness with 6-mil vapor barrier underneath and a compacted 4-inch gravel base is the right call. Drainage slope matters too: the slab needs a minimum 1/8-inch-per-foot pitch toward the door so water drains out rather than pooling at the back wall. Control joints cut at 10-foot intervals direct any cracking predictably. TopVolk specifies fiber-reinforced 3,000 PSI minimum mix and coordinates pours with local ready-mix suppliers. Slab work typically runs $8–$14 per square foot installed, depending on site access and sub-base conditions.

  - title: "Permit Setbacks and Lot Coverage: Getting the Numbers Right Before You Build"
    description: |
      Snohomish County has specific setback requirements for accessory structures: typically 5 feet from the rear property line and 5 feet from the side property line in residential zones, though some zones require more. Lot coverage — how much of your lot is covered by impervious structures — is equally important, and adding a new garage eats into that allowance. Before designing a footprint, TopVolk pulls the parcel's zoning data from Snohomish County PDS and calculates existing lot coverage against the proposed structure. Many parcels in the newer 98258 subdivisions are already close to their lot coverage limit from driveways, patios, and the primary structure. Snohomish County PDS uses an online portal for permit submissions; plan review for a new detached garage runs 6–10 weeks depending on project complexity. Vladislav Volkov, WA Licensed Contractor, handles the permit application as part of the project scope. Permit fees for a garage in Snohomish County typically run $800–$2,500 depending on valuation.

  - title: "EV Charger Circuit Pre-Wire: Do It During Rough-In, Not After Drywall"
    description: |
      Running a 50A or 60A circuit for an EV charger after a garage is drywalled and finished costs three times what it costs during rough-in. The conduit goes in before the slab is poured, the wire runs while the walls are open, and the subpanel or circuit breaker is sized during the electrical design phase — not as an afterthought. Most Lake Stevens homeowners planning garage builds in 2025 and 2026 are accounting for at least one EV, and many are planning for two. A 60A circuit handles Level 2 charging for any current EV on the market; a Bosch EV800 or ChargePoint Home Flex hardwired at the end of that circuit covers both. If the garage includes an ADU above, the electrical plan also needs a sub-metered panel for the ADU tenant. Adding an EV circuit pre-wire during construction adds roughly $400–$900 to the project cost — a small line item compared to retrofitting it later.

  - title: "Matching Exterior Siding and Roofline: Why It Matters Beyond Curb Appeal"
    description: |
      A detached garage that looks like it belongs to a different house is one of the most common complaints after a build wraps up. Getting the roofline pitch to match, using the same siding profile, and aligning the eave height all take deliberate planning during design — not improvisation during framing. Most homes in Lake Stevens built in the 2000s and 2010s use LP SmartSide or Hardie cement-board siding, both of which come in profiles that can be matched closely. For roofing, CertainTeed Landmark in a matching color is straightforward to spec and holds up well against the moss and mildew pressure that north-facing surfaces collect here. The roofline pitch is also a structural decision — it affects rafter spans, snow load calculations, and DADU height compliance — so it needs to be locked in before framing begins. A mismatched garage can affect resale value and, in some Snohomish County zones, raise compatibility questions during plan review.

