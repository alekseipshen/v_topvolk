title: "Lake Stevens Door Installation — Done Right for the Rain"

intro: |
  The lake that gives this city its name pulls steady marine moisture off the Cascade foothills from October through April, and if you own a home near it in the 98258 zip, you already know what that does to an exterior door that wasn't flashed correctly. Most of the residential builds along Lundeen Parkway and the SR-92 corridor went up between 1995 and 2008 with standard steel entry doors — adequate at install, drafty and rusted at the bottom rail by year twelve. Fiberglass holds up better in Snohomish County winters: no rust, minimal swelling, and it takes stain or paint without the upkeep wood demands. Therma-Tru makes a solid mid-range fiberglass unit we've installed on multiple projects in Lake Stevens; the door lasts, but only if the rough opening is properly flashed before it goes in. Vladislav Volkov of TopVolk Construction LLC — WA Licensed Contractor, 100+ projects completed since 2023 — handles door work throughout Snohomish County. Call (206) 591-1096 for a free on-site consultation.

localContext: |
  Lake Stevens grew fast between 1990 and 2010, and the majority of single-family housing in the 98258 zip reflects that pace — builder-grade stick-frame construction with entry and patio doors spec'd for cost, not longevity. Homes closer to the lake itself, particularly in the area surrounding Lake Stevens Community Park on the south end of town, skew older — some 1970s and early 1980s builds with original wood entry doors and aluminum single-pane sliding glass doors still in place. Both create distinct problems. The older units have failed weatherstripping and frames that have racked over decades of the PNW wet-dry cycle. Newer developments that pushed north and east toward the 98270 boundary with Marysville are more likely to have vinyl or fiberglass patio doors in better condition, but even those have compressed thresholds and failed sill seals by now. Snohomish County PDS (Permit and Development Services) handles permits for most residential door work in Lake Stevens — relevant any time you're widening a rough opening, converting a window to a door, or modifying a load-bearing header.

commonProblems:
  - title: "Rotted Sill Plates Under 1990s Steel Entry Doors"
    description: |
      Steel entry doors from the late 1990s follow a predictable failure path. The threshold sits on a wood sill plate. If the original installer skipped a self-adhered sill pan flashing membrane — and most did in that era — rain infiltration works its way under the door and into the subfloor framing. By the time you feel the soft spot underfoot, the rim joist below may already need sistering with pressure-treated (PT) lumber. The repair sequence: remove the door unit, assess framing, sister with PT lumber and blocking as needed, install a Protecto Wrap sill pan or equivalent membrane, then set the new pre-hung unit in the properly prepared opening. A Therma-Tru Smooth-Star fiberglass door runs $900-$2,400 depending on size and configuration; framing repairs add $400-$1,000 on top. Total job time is typically one to two days. Deferring it means the moisture damage spreads laterally — a $1,400 door replacement becomes a $4,500 repair once floor structure is involved.

  - title: "Converting a 1990s Aluminum Slider to a French Door or Multi-Slide System"
    description: |
      Aluminum sliding glass doors on most Lake Stevens homes built between 1988 and 2006 are single-pane, thermally inefficient, and often derailed from their rollers. The most common upgrade is a 6-foot French door — a Milgard Tuscany or Pella 250 Series vinyl or fiberglass unit fits within most existing rough openings without touching the framing. Going wider changes everything. A 9-foot or 12-foot multi-slide system means removing the existing header and installing an LVL beam properly sized for the new span — structural work that requires a building permit through Snohomish County PDS, with plan review typically running 4-8 weeks. A straight 6/0 French door conversion runs $3,200-$5,500 installed; a multi-slide with structural header work runs $9,000-$18,000 depending on span and finish level. Milgard and Marvin multi-slide units carry 4-6 week lead times from regional distributors, so planning ahead matters.

  - title: "Interior Door Replacement When Remodels Change Door Swing Requirements"
    description: |
      Kitchen and bathroom remodels in Lake Stevens homes almost always surface an interior door conflict. A new cabinet run blocks an existing swing; a toilet rough-in relocates and suddenly the door hits it on open. Changing swing direction is a rough carpentry task — relocate the door stop, re-shim the jamb, sometimes shift the latch-side trimmer stud if the opening needs to widen. Casing replacement follows using 2-1/4-inch craftsman or colonial MDF profile, which holds paint through Snohomish County's humid winters without the shrink-cracking that finger-jointed pine delivers. Single interior door replacement installed runs $280-$550; replacing six to ten doors during a full remodel drops that per-door cost significantly. One code item: the International Residential Code (IRC) requires a 20-minute fire-rated door with a self-closing hinge between the garage and living space — Snohomish County PDS expects that documented at rough-in inspection. TopVolk Construction LLC is a WA Licensed Contractor and handles permit applications and inspections directly.

  - title: "Smart Lock Retrofit and Weatherstripping Overhaul on Existing Entry Doors"
    description: |
      Schlage Encode and August Wi-Fi Smart Lock upgrades are increasingly common in Lake Stevens — both require a 2-3/4-inch deadbolt backset, and older steel doors in this area were typically prepped for a 2-3/8-inch backset. The bore location needs to move, which is a straightforward 20-minute task. The bigger issue is that homeowners calling about a lock retrofit often have weatherstripping that has been failing for years without anyone noticing. Compression bulb weatherstrip on the head and hinge-side jamb goes flat within five to eight years in this climate. A proper overhaul means new compression bulb on all three sides, an automatic door bottom with a drop seal, and a new aluminum threshold with EPDM gasket. Done correctly, this eliminates the drafts and brings the door assembly up to reasonable energy performance. A full weatherstripping overhaul plus smart lock install runs $350-$700 in labor and materials combined.

  - title: "Garage Door Upgrade to Insulated Panels for PNW Energy Performance"
    description: |
      Attached garages in Lake Stevens that share a wall or ceiling with a finished living space bleed heat through the door faster than almost anywhere else in the building envelope. Builder-grade garage doors in the 98258 zip typically came with R-6 to R-9 insulated panels — adequate for a detached garage, undersized for one adjacent to conditioned space. Replacing with a Clopay Gallery Steel or Wayne Dalton 9100 series polyurethane-core panel at R-12 to R-18 makes a real difference through the November-March stretch, especially for homes on the eastern edge of Lake Stevens where the foothills toward Granite Falls drop temperatures several degrees lower than the lakefront. Before ordering, the rough opening dimensions, header clearance, and torsion spring wind all need to be confirmed — a door ordered even a quarter inch too wide won't seal at the floor. Single-car insulated steel doors run $750-$1,400; two-car doors with R-12 panels run $1,200-$2,800, plus $200-$400 for installation.

