title: "Lake Stevens General Contracting — Snohomish County Permits Done Right"

intro: |
  Zip 98258 covers everything from old lakefront cottages converted to year-round homes in the
  1980s to the 2010s subdivisions filling the hillsides east of town. Both types land on us with
  the same problem: a remodel that started as "just the kitchen" went sideways after demo —
  original framing not spec'd for a Thermador range hood, or structural loads that don't match
  what the plan shows. Snohomish County PDS handles all permits here, and coordinating that
  process with your trades is what general contracting actually means.

localContext: |
  Most of the older housing in Lake Stevens sits within a half-mile of the lake itself —
  post-war cottages and 1960s ranchers in zip 98258, many on lots that were never intended for
  the additions and detached garages they've accumulated over the decades. Lot coverage and
  setback rules under Snohomish County's zoning catch homeowners off guard more often than not.
  The subdivisions east of Highway 9 — built 2005 through 2020 — are more structurally
  predictable, but they're hitting the age where everything builder-grade is due for replacement.

commonProblems:
  - title: "Snohomish County PDS Plan Review Delays Stalling Your Project"
    description: "Snohomish County PDS plan review for additions or full remodels runs 8-14 weeks,
      and submitting incomplete drawings resets the clock entirely. We handle all permit drawings,
      engineering coordination, and AHJ communication — rough-in and final inspections included.
      Projects in Lake Stevens typically require structural calculations for any load-bearing
      changes, meaning an engineer stamp before PDS will accept the set."
  - title: "Hidden Structural Problems After Demo in Older Lakeside Ranchers"
    description: "Post-demo surprises in 1960s-1970s ranchers here follow a predictable pattern:
      framing undersized for modern loads, galvanized plumbing near failure, and panels that
      won't support a Thermador or Sub-Zero appliance package. A 100-amp service upgrade plus
      new sub-panel is typically required before closing walls. Finding that in week three of a
      $120K remodel is how budgets blow."
  - title: "Crawlspace Moisture and Rim Joist Rot Through the Wet Season"
    description: "Lake Stevens gets 37+ inches of rain annually, and north-facing crawlspaces
      in the older lakeside homes collect moisture from October through May. Failing vapor
      barriers let ground moisture rot out the rim joist and blocking — by the time you smell
      it upstairs, you're looking at sister joists, new PT sill plates, and a mold remediation
      crew before the remodel can start."

faq:
  - q: "How fast can you get to Lake Stevens for General Contracting?"
    a: "Lake Stevens is roughly 35-40 minutes from our Seattle Metro base depending on US-2
      traffic. Scheduling a site walk for addresses in 98258 typically happens within the week.
      Call Vladislav directly at (206) 591-1096 — you're talking to the contractor, not a
      scheduler."
  - q: "Do you coordinate kitchen remodels with Thermador or Bosch appliances?"
    a: "Yes. Thermador, Bosch, and KitchenAid all have specific rough-in requirements — gas
      line sizing, dedicated circuits, ventilation CFM — that need to be spec'd before the
      framing is finalized. We've coordinated appliance packages with all three brands and know
      where the install complications typically show up."
  - q: "What does a full general contracting project cost in Lake Stevens?"
    a: "Most whole-house remodels we manage in Lake Stevens run $80K-$200K+ depending on scope.
      Line-item quotes after the site visit — no vague ranges. WA Licensed Contractor, 100+
      projects completed since 2017. Deadline penalties are written into every contract."