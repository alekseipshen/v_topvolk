title: "Lake Stevens Deck Installation — Built for Snohomish Rain and 98258 Code"

intro: |
  The lake itself draws people here — the views, the lots with room to breathe, the outdoor living potential that's wasted on a 10x10 slab of concrete. Most homeowners in the 98258 zip code want a deck that captures that, not one that turns green with moss by October and spends two winters warping before anyone replaces a board. Composite decking from Trex or TimberTech holds up to Snohomish County rain without the annual cleaning cycle cedar demands. TopVolk has handled deck builds across Lake Stevens since 2023 — WA Licensed Contractor, 100+ projects completed.

localContext: |
  A significant share of Lake Stevens housing went up between 1995 and 2015 — two-story colonials and craftsman-style builds where the back door opens to a grade change that makes a deck almost necessary. Many of those original decks used cedar with undersized footings that never reached frost line. Neighborhoods east of Lake Stevens Road in the 98258 corridor, toward Cavalero Hill, see enough freeze-thaw cycles to shift posts and pull ledger boards away from the rim joist within a decade.

commonProblems:
  - title: "Ledger Flashing Failures on 1990s-2000s Lake Stevens Homes"
    description: "Homes built before 2005 in Lake Stevens rarely have proper ledger flashing — water gets behind the ledger board, sits against the rim joist, and rots the framing from inside. Snohomish County PDS requires a ledger flashing inspection before decking goes down. We use Vycor tape and stainless standoffs behind every ledger, not the Z-flashing builders used to staple in."
  - title: "Post Footings That Don't Reach Frost Line"
    description: "The frost line in Snohomish County runs 12-18 inches depending on elevation and soil. Many older decks in Lake Stevens have footings poured at 8 inches — fine until a wet winter with a hard freeze pushes the post up and the whole frame shifts. Proper 18-inch formed footings with ground-contact PT lumber and Simpson Strong-Tie post bases fix this without embedded wood rotting in the ground."
  - title: "North-Facing Cedar Decks and Moss in Lake Stevens"
    description: "North-facing decks here get almost no direct sun from October through April — moss establishes in the cedar grain within two seasons. Stripping and sealing every 2-3 years is the cedar reality in PNW conditions. Trex Transcend and TimberTech Azek board products have no open grain for moss to colonize and carry 25-year fade warranties that hold up under real Snohomish County weather."

