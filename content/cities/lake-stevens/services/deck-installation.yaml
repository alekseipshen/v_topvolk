  - q: "Do you work with Trex and TimberTech decking in Lake Stevens?"
    a: "Both are standard for our Snohomish County builds. Trex Transcend runs slightly warmer in color; TimberTech Azek boards have a stiffer feel underfoot. We bring samples on-site and walk through the differences before anything gets ordered."
  - q: "What does the deck permit process look like in Lake Stevens and what does it cost?"
    a: "Decks over 200 square feet or more than 30 inches above grade require a permit through Snohomish County PDS or the City of Lake Stevens building department. Plan review typically runs 3-6 weeks. We handle the application and schedule the ledger flashing and rough-in inspections — that timeline is built into the project scope. TopVolk writes deadline penalties into every contract. WA Licensed Contractor, owner-operated since 2023."