  - q: "What does a 200A panel upgrade cost in Lake Stevens?"
    a: |
      A straight 200A panel replacement in Lake Stevens — new main panel, updated
      service entrance conductors, permit through Snohomish County PDS, and PSE
      disconnect coordination — typically runs $3,500 to $6,500. That range increases
      if the meter base is corroded or non-standard (common in homes from the 1980s),
      if the main disconnect is located at the weatherhead, or if underground service
      entrance conductors need replacement. Homes where the electrical room is finished
      or in a tight utility closet add labor time. TopVolk provides line-item quotes
      after the on-site walk — the actual condition of the existing equipment drives
      the number. Schedule a free consultation at (206) 591-1096.

  - q: "Do you pull electrical permits through Snohomish County PDS for Lake Stevens projects?"
    a: |
      Yes — Snohomish County PDS handles permits for Lake Stevens, and a panel
      replacement or new service work requires a permit, a rough-in inspection, and
      a final inspection before PSE will reconnect. TopVolk submits all permit
      applications and coordinates the inspection schedule with PDS directly — that's
      included in the project scope, not billed as a separate service. Homeowners
      don't need to track down the right department or manage the paperwork. TopVolk
      Construction LLC is a WA Licensed Contractor. Typical plan review for a residential
      panel swap runs two to four weeks through Snohomish County PDS, though volume
      at the permit counter affects that window seasonally.

  - q: "Can you install a Tesla Wall Connector or JuiceBox EV charger at my Lake Stevens home?"
    a: |
      Yes — EV charger installations are some of the most frequent electrical calls
      in Lake Stevens right now. Tesla Wall Connector installs require a dedicated
      60-amp circuit; the JuiceBox Pro 40 and ChargePoint Home Flex both run on
      50-amp circuits at minimum. Circuit design depends entirely on what the existing
      panel can support — if you're near capacity on a 100A panel, a load calculation
      comes first. Sometimes a small garage subpanel handles it cleanly. Sometimes
      a full 200A service upgrade is the right move before the charger circuit goes
      in. Vladislav scopes both options at the on-site consultation so the total cost
      is clear before any work starts. Snohomish County PDS permit is required for
      any 240V branch circuit addition.

  - q: "What warranty comes with electrical work in Lake Stevens?"
    a: |
      All electrical work includes a three-year workmanship warranty covering connections,
      breaker operation, and installed fixtures. Equipment warranties are
      manufacturer-specific — Square D and Siemens panels carry limited lifetime
      warranties on the enclosure and breakers; LED retrofit kits typically carry
      three to five year manufacturer coverage. In the PNW's wet crawlspace environment,
      junction box corrosion in uninsulated spaces is a real long-term concern —
      Vladislav flags those during the on-site walk if they're present. The deadline
      penalty clause written into every TopVolk contract applies here too: if a
      project finish date is missed without prior notice, there's a financial consequence
      on TopVolk's side. That's not standard in most contractor agreements.

