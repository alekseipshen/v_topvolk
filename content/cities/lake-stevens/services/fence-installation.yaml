  - q: "Do I need a permit for a fence in Lake Stevens?"
    a: |
      Standard residential fences under 6 feet on side and rear property lines generally don't require a permit in Lake Stevens — but exceptions exist. A fence integrated with a retaining wall, or one that exceeds height limits at the front yard, requires a permit through the City of Lake Stevens Community Development Department. Unincorporated lots east of town near the Granite Falls corridor go through Snohomish County PDS instead, and the process is slightly different. TopVolk prepares the site plan and submits the application as part of the project. TopVolk Construction is a WA Licensed Contractor with permit submissions handled in both jurisdictions. The homeowner doesn't need to set foot in the permit office — we track the approval and flag any review questions.

  - q: "Do you install horizontal slat fences in Lake Stevens?"
    a: |
      Yes — horizontal cedar slat fences are one of the most common requests in Lake Stevens, especially on newer builds in the Cavalero Hill and east-side subdivisions where homeowners want a cleaner look than standard dog-ear picket. Correct installation starts with post spacing at 8 feet maximum, structural screws into solid blocking (not nails), and a 3/8-inch minimum gap between boards for airflow. Tighter than that and the fence traps moisture against every board face. On sloped lots, horizontal panels require step-fitting each section because the boards don't rack the same way standard picket sections can. Cedar is the most common material for this style; vinyl horizontal slat panels are available and require considerably less maintenance, but cost more upfront and offer less flexibility on irregular grades.

  - q: "How long will a cedar fence last in Lake Stevens's climate?"
    a: |
      Unstained cedar in the Lake Stevens area starts graying and surface-checking within 2-3 years. A quality penetrating oil stain — Cabot Australian Timber Oil is a common recommendation in the PNW — applied every 3-4 years extends board life to 15-20 years. Posts set in concrete with proper grade clearance last longer; it's the boards contacting soil or leaf debris that fail first. Vinyl fencing carries manufacturer warranties of 20-25 years with essentially no maintenance beyond an occasional wash. Gate hardware is typically the first component to need replacement regardless of fence material, usually at the 5-7 year mark on daily-use gates. TopVolk's installation work includes a 2-year workmanship warranty covering post setting, rail attachment, and gate hardware function.

