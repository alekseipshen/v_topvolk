title: "Lake Stevens Bathroom Remodel — 98258 Moisture & Layout Upgrades"

intro: |
  Subdivisions east of Lake Stevens filled in fast during the 1990s and early 2000s —
  and the bathrooms built then weren't designed to handle three decades of Washington
  moisture. Original Moen single-handle pressure-balance valves are at end of life.
  Fiberglass surrounds caulked to drywall instead of a proper Schluter Kerdi membrane
  are failing behind walls homeowners haven't looked at in years. Vladislav Volkov, WA
  Licensed Contractor, has completed 100+ remodels across Snohomish County since 2023 —
  owner on-site, no sales staff in between.

localContext: |
  Most of 98258 developed between 1988 and 2006, when Lake Stevens grew from a rural
  lake community into one of Snohomish County's fastest-expanding cities. Neighborhoods
  along 20th Street NE and the south shore corridors are typical: 1,800–2,400 sq ft
  two-stories with builder-standard bathrooms — 50 CFM exhaust fans, 4-inch ceramic
  tile set over greenboard, and cast-iron drain stacks that haven't been touched since
  installation. The lake proximity and foothills humidity hit these houses harder than
  anywhere in the county.

commonProblems:
  - title: "Greenboard Failure Behind 1990s Tub Surrounds"
    description: "Greenboard — paper-faced gypsum with water-resistant coating — was the
      standard backer for tub surrounds through the mid-2000s. It wasn't waterproof. In
      98258 homes, 30 years of condensation and minor splash exposure have compromised
      the paper facing. The fix is demo to studs, RedGard or Schluter Kerdi applied to
      cement board, then large-format porcelain set in modified thinset. Anything less
      repeats the same failure cycle in another decade."
  - title: "50 CFM Fans Recirculating Moisture Into Ceiling Joists"
    description: "Panasonic and Broan now make 110 CFM humidity-sensing units that actually
      respond to steam instead of running on a timer. Builder fans from the 1990s were
      marginally code-compliant at 50 CFM — fine for a quick shower in Arizona, not for
      a Lake Stevens winter. Mold in ceiling cavities above bathrooms is a recurring
      finding in 98258 homes during remodel demo. Proper duct routing to an exterior
      soffit vent is as important as the fan spec itself."
  - title: "Master Bath Layouts That Waste the Available Square Footage"
    description: "A common floor plan in Lake Stevens two-stories puts the master bath
      toilet on the exterior wall, vanity cramped into a 36-inch run, and a tub-shower
      combo where a walk-in shower would serve the household better. Moving plumbing
      rough-in locations — rerouting the drain stack and repositioning supply lines —
      opens layouts significantly. Curbless walk-in shower conversions with a Kohler
      shower system and niche work well in these floor plans once the rough-in is right."

faq:
  - q: "How fast can you get to Lake Stevens for a bathroom remodel consultation?"
    a: "Lake Stevens is about 30 minutes from Everett — north on US-2 or up Highway 9
      depending on traffic. Free on-site consultations, no charge for the visit. Call
      (206) 591-1096 to book a time with Vladislav directly."
  - q: "Do you work with Kohler and Moen fixtures, or do we have to use what you supply?"
    a: "Either way. We install Kohler, Moen, and Delta fixtures regularly — shower valves,
      pressure-balance cartridges, diverters, faucets. Plenty of homeowners source
      fixtures themselves from a showroom or online; we work with what you've selected
      and verify it's spec'd correctly before rough-in."
  - q: "What does the permit process look like for a bathroom remodel in Lake Stevens?"
    a: "Cosmetic swaps — tile, vanity, fixtures — don't require a permit. Moving
      plumbing rough-in, adding a window, or any structural work goes through the City
      of Lake Stevens permit office; unincorporated parcels nearby use Snohomish County
      PDS. Plan review runs roughly 3–6 weeks for a standard bath remodel submittal.
      We handle the paperwork and inspections — rough-in inspection through final.
      Deadline commitments are written into the contract; if we miss the agreed
      milestone, we pay the penalty."