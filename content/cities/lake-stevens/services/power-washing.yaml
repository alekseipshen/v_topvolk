title: "Lake Stevens Power Washing — Moss, Algae & Cedar Prep Done Right"

intro: |
  The lake itself is part of the problem. Homes within a few blocks of the waterfront — especially along the north-facing slopes near Lundeen Park and the hillside lots in the Cavalero area — build up green and black biological growth on concrete, cedar, and Hardie siding faster than almost anywhere else in Snohomish County. You've got lake moisture meeting 40+ inches of annual rain from October through May, and surfaces that haven't been cleaned in two or three seasons end up looking like they've been growing things intentionally. That's not cosmetic — it's surface degradation that accelerates repainting timelines and wood replacement cycles.

  TopVolk Construction LLC has handled exterior cleaning and surface prep across Lake Stevens since 2023, 100+ projects completed across Snohomish County. Owner-operated by Vladislav Volkov, WA Licensed Contractor — you schedule a consultation, Vladislav shows up, not a salesperson. Call (206) 591-1096 to set up a free on-site estimate.

localContext: |
  Lake Stevens's housing stock breaks into two pretty distinct groups. Closer to downtown and the 98258 lakeshore, you've got 1970s–1990s ranchers and split-levels — cedar siding that's been through decades of PNW rain cycles, post-and-pier foundation areas with vapor barrier issues, and concrete flatwork with 30+ years of moss working into expansion joints. Soft washing is often the right call on those older cedar surfaces; high-pressure cleaning opens up weathered grain and causes more damage than the algae did.

  The second group is the 2000s–2010s buildout east of SR-9 and along 20th Street NE — also 98258, but different materials. Hardie cement-board siding, brushed or stamped concrete driveways, pressure-treated wood fences. Some addresses in the northwest corner of the Lake Stevens area near the Getchell Road corridor shade into 98270 postal routing (Marysville boundary), and Snohomish County PDS handles permits for those unincorporated parcels. Power washing itself doesn't trigger a permit, but if cleaning is part of a broader exterior scope — Hardie repair, deck structural work, exterior repaint — that's where the permit question comes up.

commonProblems:
  - title: "Roof and Deck Moss on North-Facing Surfaces Near the Waterfront"
    description: |
      North-facing roofs in the Cavalero Hill area can go from clean to moss-carpeted in two wet seasons. Lake moisture compounds what's already a classic PNW problem — low-slope asphalt shingles hold water long enough for moss rhizoids to anchor deep into the granule layer. High-pressure cleaning on a roof does more damage than the moss: it strips granules off shingles and voids manufacturer warranties. The right method is soft washing — a sodium hypochlorite solution at 3–5% concentration, applied downstream through a low-pressure injector at under 500 PSI, dwell time 15–20 minutes, then a thorough rinse. For cedar shake roofs, keep pressure under 1,000 PSI and avoid any turbo nozzle — it blows out wood fiber. A post-clean application of Wet & Forget concentrate extends the moss-free window by 1–2 years between full washes. Roof soft wash on a typical Lake Stevens home runs $350–$650 depending on pitch and square footage.

  - title: "Cedar Deck Surface Prep Before Staining or Sealing"
    description: |
      Cedar decks in Lake Stevens turn gray-green inside one wet season without maintenance. Before any stain goes down — TWP 1500 Series, Defy Extreme, Armstrong Clark — the surface has to be clean and open-grained, not just rinsed. That means power washing at 1,200–1,500 PSI with a 25-degree or 40-degree fan tip, working with the grain, never across it. After washing, a deck brightener (oxalic acid-based) brings the wood pH back to neutral and re-opens fibers compressed by weathering and gray oxidation. Skip the brightener step and you're applying stain over a dead surface layer — it sits on top instead of penetrating, and you'll be stripping and redoing it in 12 months instead of three to four years. For a 400–500 sq ft deck near the Lundeen Park neighborhood, cleaning and brightening before stain runs $250–$400. That's separate from stain labor and materials.

  - title: "Hardie Siding Cleaning Before Exterior Repaint"
    description: |
      A large portion of the 2000s-era builds east of SR-9 use Hardie cement-board siding. It doesn't rot, but it collects algae, oxidized paint chalk, and airborne debris on its surface. Painting directly over dirty Hardie is one of the fastest ways to fail a paint job — primer won't bond to biological growth or chalk residue, and peeling starts within two years. Proper prep is low-to-medium pressure wash (800–1,200 PSI, 25-degree tip), a diluted sodium hypochlorite pass on any green growth, then a clean water rinse followed by 24–48 hours of dry time before priming. On a two-story Lake Stevens home, house washing runs $350–$550. TopVolk is a WA Licensed Contractor — Vladislav coordinates the cleaning scope, surface condition assessment, and handoff to the paint crew so the sequencing doesn't get missed between trades. Call (206) 591-1096 if your project is painting plus cleaning combined.

  - title: "Concrete Driveway and Walkway Cleaning — Oil, Tire Marks, Efflorescence"
    description: |
      Concrete driveways in the 98258 subdivisions around Frontier Road get a triple hit: motor oil from parked vehicles soaks into the surface, rubber tire marks leave deposits at the apron and turnaround, and efflorescence — the white mineral salt deposits that leach out of concrete in wet climates — shows up in joints and low spots every winter. Cleaning flatwork correctly means a surface cleaner attachment (the dual-bar spinning head), not an open wand, which leaves zebra stripe lines in the concrete. Oil spots need a citrus-based or alkaline concrete degreaser pre-treatment with 10–15 minutes dwell time before the pressure wash pass. Efflorescence responds to a diluted muriatic acid wash applied after pressure cleaning, then rinsed thoroughly. A standard two-car driveway runs $150–$250. Larger areas with heavy oil staining or stamped concrete with deep buildup run higher — it depends on square footage and pre-treatment time needed.

  - title: "Wood Fence Cleaning Before Staining — The 3–5 Year PNW Maintenance Cycle"
    description: |
      Pressure-treated pine and cedar fences in Lake Stevens follow a predictable cycle: good color when new, gray by year two, green algae by year three, then splitting and fiber degradation by year four or five. Cleaning before stain isn't optional — it's what decides whether your product lasts two years or five. Board-on-board fence sections (6-foot height, typical HOA style in the Cavalero area) need 1,200–1,500 PSI with a 25-degree tip, working top to bottom, keeping the nozzle moving continuously. Let the fence dry 48–72 hours in summer — longer during October through April when ambient humidity stays high — before applying a semi-transparent oil-based stain like TWP 1500 or Armstrong Clark in a natural or cedar tone. Fence cleaning on a 150–200 linear foot section runs $200–$350. Book fence and deck cleaning in the same visit and you share the mobilization cost across both surfaces.

