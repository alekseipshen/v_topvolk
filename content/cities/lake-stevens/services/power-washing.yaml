  - q: "Do I need a permit for power washing in Lake Stevens or Snohomish County?"
    a: |
      Power washing alone doesn't require a permit — in the City of Lake Stevens or in unincorporated Snohomish County. Permits come into play when cleaning is part of a larger scope: Hardie siding repair, deck structural work, or a full exterior repaint that involves trim replacement. Unincorporated parcels in the Machias and Cavalero Road corridors fall under Snohomish County PDS jurisdiction. Work within city limits goes through the Lake Stevens permit center. TopVolk is a WA Licensed Contractor — if your cleaning project connects to a broader exterior renovation, Vladislav will walk you through exactly what triggers a permit review and what doesn't before any work starts.

  - q: "What's the difference between pressure washing and soft washing, and which does my home need?"
    a: |
      Pressure washing relies on high PSI — typically 1,500–4,000+ — to cut through surface grime with water force. That's the right tool for concrete driveways, brick pavers, and bare CMU block. Soft washing runs under 500 PSI at the tip and uses a sodium hypochlorite and surfactant solution to kill and release biological growth — moss, algae, mildew. Roofs, painted Hardie siding, cedar shake, and wood fencing all need soft washing. High-pressure cleaning on an asphalt shingle roof strips granules; on cedar it blows out wood fibers. Most Lake Stevens homes need both methods depending on the surface — soft wash the roof and siding, pressure wash the driveway and walkways. Using the wrong method on the wrong material causes damage that shows up 6–12 months later.

  - q: "How long does power washing last, and how often should I schedule it in Lake Stevens?"
    a: |
      North-facing surfaces near the lake regenerate moss and algae faster than most Snohomish County locations — plan on roof soft washing every 2–3 years, or use Wet & Forget applied annually to extend between full cleans. South-exposed or sun-hit concrete can go 3–5 years. Cedar decks and PT fences should be cleaned and restained every 3–4 years in this climate — the October-through-May rain season compresses that timeline on shaded lots. Hardie siding washing ties to your repaint cycle, roughly every 7–10 years. After Vladislav looks at your surfaces, he'll give you a realistic maintenance estimate based on exposure, tree coverage, and current condition — not an upsell toward annual contracts.

