title: "Lake Stevens Drywall — Type X, Level 5 Finish & Purple Board"

intro: |
  Subdivisions along Cavalero Road and the hillside neighborhoods tucked east of
  Lake Stevens (the lake itself) built out fast between 2000 and 2015 — tract
  construction that's now old enough for real remodels but young enough to have
  missed the popcorn-ceiling era that plagued homes built further west in the 1970s.
  That said, plenty of 1980s and early-1990s ranchers still exist in 98258, and
  those are exactly the homes showing up with failing spray texture, garage walls
  that were never upgraded to 5/8-inch Type X firecode drywall, and bathrooms where
  standard half-inch drywall was installed behind tile with no moisture protection
  whatsoever. TopVolk Construction has completed 100+ projects across Snohomish
  County since 2023 — kitchen gut-remodels, ADU build-outs under WA HB 1337, and
  whole-house remodels where drywall scope runs from demo through Level 5 finish.
  Vladislav Volkov handles the estimate himself, on-site, with a line-item quote —
  not a ballpark range delivered by a salesperson who hasn't touched a mud pan in
  years.

localContext: |
  Most of the housing stock in zip code 98258 splits into two clear groups: late-1980s
  to mid-1990s builder-grade homes on the older streets near the lake waterfront, and
  the 2003-2015 subdivisions that pushed out toward the Getchell Road corridor and
  Cavalero Hill. Homes in the first group typically have original half-inch drywall
  throughout, no moisture-rated backer in wet areas, original spray texture on every
  ceiling, and garage walls that don't meet current IRC fire-separation requirements.
  Homes in the second group are better constructed but increasingly problematic for
  owners upgrading lighting — open-concept great rooms with recessed LED arrays on
  dimmers show every imperfection in a standard knockdown texture, which is driving
  demand for Level 5 skim-coat finishes before paint. ADU activity is picking up
  fast in Lake Stevens under WA HB 1337; Snohomish County PDS processes those permits,
  and separation walls between an AADU and the primary dwelling require 5/8-inch Type X
  drywall per IRC Section R302. The foothills east of the lake see real freeze-thaw
  cycling October through March, and crawlspace moisture migrating into below-grade
  framing makes mold-resistant purple board the correct spec for basement and laundry
  drywall — not standard gypsum.

commonProblems:
  - title: "Popcorn and Spray Texture Removal in 1980s-90s Lake Stevens Ranchers"
    description: |
      Older homes near the lakefront streets in 98258 frequently have original hopper-sprayed
      ceilings, and anything applied before 1978 requires an asbestos test from a certified
      lab before any scraping starts — that's not optional, it's a liability issue.
      Once clearance comes back, the skim-coat sequence involves wetting and scraping the
      existing texture, applying two to three coats of all-purpose joint compound, blocking
      with a USG PVA primer, and sanding to the target level. Ceilings with recessed
      lighting or flush-mounted LED panels need Level 5 — a full skim of compound over
      primed drywall — because anything less will telegraph in raking light from a
      dimmer-controlled fixture. Budget roughly $2.50–$4.50 per square foot for
      skim-coating existing ceilings, depending on ceiling height and original texture
      thickness. TopVolk handles ceiling finish as part of kitchen and bathroom remodels,
      sequenced after rough-in inspection so the work isn't double-handled.

  - title: "Moisture-Damaged Drywall Behind Tubs, Showers, and Laundry Rooms"
    description: |
      Standard half-inch drywall behind tile will absorb moisture through grout joints and
      around fixture penetrations over 10–15 years — it softens, the paper face grows
      mold, and by the time a homeowner notices a soft spot near the tub surround, the
      framing behind it is often stained or beginning to decay. The fix is full demo back
      to studs, treating any affected framing with a borate-based solution like Concrobium,
      and installing the correct backer for the location: mold-resistant purple board in
      damp areas like laundry rooms, or Schluter Kerdi board directly behind tile in wet
      zones. Kerdi board is a foam-core waterproof panel that bonds directly to tile
      with unmodified thinset — no RedGard membrane coat needed on top, which simplifies
      the installation and eliminates a step where applicator error typically happens.
      For Lake Stevens homes sitting above a crawlspace, pairing a DriCore subfloor panel
      with mold-resistant drywall on lower wall sections is standard practice. This scope
      typically runs $3,500–$8,000 depending on room size and framing condition.

  - title: "5/8-Inch Type X Firecode Drywall for Garage Walls and ADU Separation"
    description: |
      IRC Section R302.6 requires 5/8-inch Type X drywall on the wall and ceiling between
      an attached garage and living space — but a large share of Lake Stevens homes built
      before 2000 were finished with standard half-inch, either because the original builder
      skipped it or a previous owner converted space without a permit. Installing an ADU
      under WA HB 1337 triggers the same requirement: separation walls between the ADU
      unit and the primary dwelling must be Type X, and Snohomish County PDS inspectors
      will flag it at rough-in if the wrong board is up. TopVolk manages the full permit
      process — digital plan submittal to Snohomish County PDS, plan review coordination,
      and Vladislav walks the job before the rough-in inspection so nothing gets flagged
      at the wrong time. WA Licensed Contractor, 100+ projects completed since 2023.
      Call (206) 591-1096 to schedule an on-site estimate.

  - title: "Level 5 Finish for Kitchens and Great Rooms Getting New Lighting"
    description: |
      Knockdown and skip-trowel textures were standard on sidewalls through the 1990s
      and 2000s — they hide minor framing imperfections, which is exactly why builders
      specified them. Homeowners putting in undercabinet LED strips, recessed arrays on
      dimmers, or large pendants over islands quickly discover that raking light reads
      every swirl and peak in the existing texture through even two coats of paint.
      A Level 5 finish requires skim-coating the entire wall surface with joint compound
      after taping, sanding to a true flat plane, and finishing with a high-build primer
      before any topcoat. It adds roughly $1.50–$2.50 per square foot over a standard
      Level 4 finish — for a 400-square-foot kitchen in Lake Stevens, that's $600–$1,000
      in additional drywall labor. On a $70,000–$130,000 full kitchen remodel, that
      delta is almost always worth paying. The Level 5 scope has to follow rough-in
      inspection and mechanical install, so sequencing with the overall project timeline
      is part of what TopVolk coordinates from the start.

  - title: "Soundproofing Between Bedrooms and AADU Shared Walls"
    description: |
      Converting a bonus room or building an attached ADU creates a noise transfer problem
      that standard half-inch drywall will not solve — a single layer over wood framing
      transmits conversation clearly enough to make a rental unit feel like shared student
      housing. The solution depends on budget and wall configuration. Resilient channel
      decoupled from the studs with a single layer of 5/8-inch drywall gets wall
      assemblies to roughly STC 45–50, which is a meaningful improvement. QuietRock 530
      damped panels installed directly to studs reach similar STC ratings without the
      channel, which removes the risk of a short-circuit — where the channel inadvertently
      contacts framing and transfers vibration anyway, negating the decoupling. Either
      approach pairs with Rockwool Safe'n'Sound mineral wool batts in the cavity.
      For a typical shared wall between a Lake Stevens AADU and an adjacent primary
      bedroom, QuietRock 530 plus Rockwool runs approximately $1,800–$3,500 installed
      depending on wall area. Vladislav reviews the wall assembly at the estimate
      stage and specifies what will actually work for the specific framing layout.

faq:
  - q: "How fast can you get to Lake Stevens for a drywall estimate?"
    a: |
      Lake Stevens sits roughly 35–45 minutes northeast of Seattle via US-2 and Highway 9,
      depending on afternoon traffic through Everett. TopVolk schedules on-site estimates
      within 5–7 business days for most Lake Stevens projects, and Vladislav does the
      site visit himself — you're meeting the person running the job, not a sales rep
      collecting information for someone else. After the estimate, permit turnaround at
      Snohomish County PDS runs 3–6 weeks for ADU and addition work; standalone drywall
      finish scopes within an already-permitted remodel move considerably faster.
      Call (206) 591-1096 to get on the schedule.

  - q: "What does drywall installation cost for a kitchen or bathroom remodel in Lake Stevens?"
    a: |
      Hang, tape, mud, and a Level 4 finish on a standard bathroom runs $1,800–$3,500
      depending on square footage and ceiling height. Upgrading to a Level 5 skim-coat
      finish adds $1.50–$2.50 per square foot on top of that. Mold-resistant purple board
      adds roughly $0.30–$0.50 per sheet over standard gypsum. A full kitchen drywall
      scope — demo, patching after electrical and plumbing rough-in, hang, tape, Level 5
      finish — typically runs $3,500–$7,500 as part of a whole-room remodel in a
      300–400 square foot kitchen. TopVolk provides a line-item quote after the on-site
      visit. Schedule a free consultation at (206) 591-1096.

  - q: "Does drywall work in Lake Stevens require a permit from Snohomish County?"
    a: |
      Standalone drywall repairs and finish work generally don't require a permit in Lake
      Stevens. If the drywall is part of a larger remodel scope — kitchen gut, bathroom
      demo-and-rebuild, ADU build-out, garage conversion — then yes, a building permit
      is required and the drywall spec (board type, thickness, fire rating) gets reviewed
      as part of the plan set submitted to Snohomish County PDS. Their online portal
      accepts digital submittals, and plan review for ADU projects under WA HB 1337
      typically runs 4–8 weeks. The separation wall assembly — Type X thickness,
      fastening schedule, resilient channel detail if specified — will be called out in
      the plans. TopVolk prepares that documentation and manages the permit process as
      part of the project, not as an add-on service.

  - q: "Can you match existing wall texture in an older Lake Stevens home?"
    a: |
      Texture matching is genuinely difficult, especially on homes from the 1980s and
      1990s where the original was hopper-sprayed at a specific air pressure and aggregate
      size that nobody documented. Knockdown, skip-trowel, and orange peel all behave
      differently when patched. For small areas after electrical or plumbing rough-in,
      a skilled finisher can get within 85–90% visually; lighting angle and paint sheen
      will still affect visibility. For larger patches — say, after opening a wall between
      a kitchen and great room in a Cavalero Hill home — feathering the new texture into
      the adjacent surface over a wide transition reads better than trying to stop at a
      hard edge. TopVolk's finish work is part of complete remodel scopes, not isolated
      patch calls, so the blending strategy gets planned before demo rather than improvised
      after.

  - q: "What warranty does TopVolk provide on drywall work?"
    a: |
      TopVolk warranties drywall workmanship for three years from project completion —
      covering seam cracking, nail pops, and finish defects that appear within the normal
      post-construction settlement window. Most drywall failures that show up after a year
      trace back to structural movement or a moisture source, neither of which is a
      workmanship defect. The materials themselves — gypsum board, setting compound,
      fiberglass tape — carry manufacturer defect coverage that's essentially open-ended
      on properly installed assemblies. Real-world drywall life is measured in decades if
      the framing is stable and moisture is managed. Every TopVolk contract also includes
      deadline commitments with penalties for missed milestones — that's written into
      the agreement, not stated verbally.

