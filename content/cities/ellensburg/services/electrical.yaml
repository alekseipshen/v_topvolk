  - q: "Does electrical work in Ellensburg require a city permit, and how long does that take?"
    a: |
      Panel upgrades, EV charger circuits, rewiring, and any new circuit additions all require a permit inside Ellensburg city limits. File through the City of Ellensburg Building Department. For properties in unincorporated Kittitas County, permits go through Kittitas County Community Development Services instead. The City of Ellensburg's municipal electric utility also requires permit sign-off before it will reconnect service after a panel swap. That coordination adds a day or two to the project schedule. Straightforward electrical permits typically issue in 5–10 business days. TopVolk handles the permit application and schedules all required inspections as part of every project. No paperwork falls on the homeowner.

  - q: "Can you replace knob-and-tube wiring without opening all the walls?"
    a: |
      Partial rewiring without full wall demolition is possible in some Ellensburg homes. It depends on the framing layout and what's already in the wall cavities. Pre-1940 balloon-frame construction — common in the downtown and university-area bungalows — makes fishing wire harder than platform framing. Wall cavities run the full height of the structure in balloon-frame homes. Accessible runs in unfinished basements and attics are done open. Finished wall sections are fished with flexible drill bits and fish tape where the layout allows. Some drywall patching is almost always needed. Wiremold surface raceways are an option in utility areas and garages where opening walls isn't practical. Homeowners insurance carriers are increasingly rejecting active knob-and-tube outright. Remediation has become essentially mandatory in most situations.

  - q: "What warranty comes with electrical work in Ellensburg?"
    a: |
      All electrical work from TopVolk carries a 1-year labor warranty. Materials carry their own manufacturer coverage separately — Square D offers a limited lifetime warranty on QO load centers; Eaton BR panels carry similar terms. New copper wiring with properly torqued terminations, correct breaker sizing, and functioning AFCI/GFCI protection will outlast the structure in most cases. Ellensburg's climate — cold winters with big seasonal temperature swings — does stress exterior components. Weatherheads, service entrance conduit, and outdoor outlet covers should be inspected every 5–7 years for seal integrity and frost-related movement. Interior panel and wiring work, done correctly the first time, requires no routine maintenance.

