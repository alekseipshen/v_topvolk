  - q: "What does a home addition cost in Ellensburg?"
    a: "Attached in-law suites in the 98926 zip code typically run $75,000 to $130,000 depending on size and structural requirements. Detached ADUs range from $120,000 to $185,000 when permit fees, utility connections, and finish work are all included. Second-story additions start around $100,000 and can reach $200,000 or more when foundation work is required. The biggest variables: electrical panel capacity, foundation condition, and HVAC approach. Schedule a free on-site consultation — TopVolk provides exact line-item pricing after seeing the existing structure. Missed project deadlines trigger a financial penalty written into every contract."

  - q: "What permits are required for a home addition in Ellensburg or Kittitas County?"
    a: "City lots in 98926 go through the City of Ellensburg Building Department — plan review typically runs 4-8 weeks for a standard addition when stamped structural drawings are included in the initial submittal. Unincorporated Kittitas County parcels go through Kittitas County Community Development Services on a similar timeline. ADUs built under WA HB 1337 require full building permits regardless of square footage. TopVolk, as a WA Licensed Contractor, prepares and submits the full permit package — site plan, floor plans, and structural engineer drawings — as part of the project. You do not manage the permit process separately."

  - q: "Can I build an ADU on my Ellensburg property under the 2024 state law?"
    a: "WA HB 1337, effective 2024, applies statewide — including Ellensburg and unincorporated Kittitas County. Single-family lots can now accommodate up to two ADUs: one attached (AADU) and one detached (DADU), or two detached units. For a 98926 city lot, a DADU must clear R-1 setback requirements (typically 5 feet rear and side) and stay within lot coverage limits. Height limits for a DADU cap out at 24 feet at the ridge. A 400-500 square foot DADU with a Frigidaire appliance package and Mitsubishi mini-split is realistic for most standard Ellensburg lots — call (206) 591-1096 to find out if your specific parcel qualifies."

  - q: "What warranty does TopVolk provide on addition work in Ellensburg?"
    a: "Workmanship on structural, framing, and finish work is warrantied for three years from the date of final inspection — that covers drywall, trim, roofing tie-ins, and window installation. Manufacturer warranties run independently: Milgard windows carry a limited lifetime warranty, and Mitsubishi mini-splits are typically 5-12 years depending on model registration. Ellensburg's temperature extremes — sub-zero winters and near-100°F summers — are harder on caulk joints, exterior flashing, and paint than western Washington conditions. Hardie cement-board siding and back-primed trim are used on all exterior addition work specifically because they hold up in a continental climate. If something fails due to our installation within the warranty period, we fix it at no charge."

  - q: "Do you serve areas near Ellensburg, like Cle Elum or the broader Kittitas Valley?"
    a: "TopVolk's primary service territory is the Seattle Metro — King, Snohomish, Pierce, and Kitsap counties. Ellensburg-area projects are evaluated individually based on scope and schedule. Larger projects at $75,000 and up in Kittitas County make the drive worthwhile — especially ADU builds and second-story additions that run multiple months. Cle Elum is about 25 miles west on I-90 and falls in the same category. Call (206) 591-1096 and describe the project — Vladislav will tell you straight if it fits our schedule, not give you a sales pitch."