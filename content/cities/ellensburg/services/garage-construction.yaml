title: "Ellensburg Garage Construction — Built for Wind, Frost, HB 1337"

answer: "A detached garage in Ellensburg costs $28,000–$65,000, built directly by owner Vladislav Volkov — WA Licensed Contractor, 100+ projects since 2023."

intro: |
  A detached garage in Ellensburg runs $28,000 to $65,000 depending on size, slab work, and whether you stack a DADU above it under WA HB 1337 — and TopVolk Construction's owner, Vladislav Volkov, quotes and builds it himself, no sales rep in between. Ellensburg's wind is the first thing that separates a garage build here from anything on the west side of the pass — gusts off the Stuart Range funnel through the Ellensburg Gap and put real lateral load on a roof structure, which changes how trusses and shear walls get framed near CWU and out toward Irene Rinehart Riverfront Park. A lot of calls come from homeowners with an aging single-car garage who want a two-car shop with 220V service for a welder or a Frigidaire chest freezer. Others want the EV charger pre-wire roughed in now, since a lot of Ellensburg households commute over Snoqualmie Pass for work and don't want to retrofit a 50A circuit later. TopVolk handles the design-to-permit-to-framing sequence as one project, with the deadline penalty written into the contract.

localContext: |
  Ellensburg's housing stock splits pretty cleanly: century-old farmhouses near downtown and the 98926 core, university-area rentals around CWU, mid-century ranches on the east side, and acreage properties out along Reecer Creek Road and toward Thorp (98946) where a garage often doubles as a shop or hay barn conversion. The farmhouses near downtown frequently sit on post-and-pier foundations with no real footing depth, which matters once you're tying a new attached garage slab into an old rim joist. Out past the city limits, Kittitas County Community Development Services (CDS) is the AHJ for permitting, not the City of Ellensburg Building Division — setback rules, lot coverage, and FAR calculations differ between the two. Eastern Washington's freeze-thaw cycle is harder on concrete than anything west of the mountains; frost-depth footings and fiber-reinforced slabs aren't optional here, they're code minimum. Snow load on garage roof framing also gets checked harder than a typical Seattle-area plan review.

commonProblems:
  - title: "Stacking a DADU above a new detached garage under HB 1337"
    description: "WA HB 1337 lets an Ellensburg lot carry a detached garage with a DADU on top, but the framing has to carry that second-floor load — that means an LVL beam over the garage door opening instead of a standard header, plus engineered joist hangers tying the floor system to the perimeter walls. R-49 insulation in the DADU ceiling and a proper vapor barrier in the crawlspace below the slab are both checked at rough-in inspection. We've quoted these around $145,000–$190,000 total for garage-plus-DADU near CWU, where rental demand makes the math work. Matching Hardie siding and the roofline pitch to the existing house keeps it from looking bolted on, and keeps neighbors from complaining to the county."
  - title: "Attached garage conversion into living space on an old foundation"
    description: "Converting an attached garage to a bedroom or office on one of Ellensburg's older farmhouse lots almost always uncovers a foundation that's too shallow for living-space load. We end up adding sistered joists to the existing floor framing, blocking between joists for stiffness, and sometimes a new footing poured below frost depth before framing starts. The slab-on-grade garages from the 1960s-70s ranch era rarely have a vapor barrier under them, so moisture migration into new drywall is a real issue if you skip RedGard or a proper sub-slab membrane. Plan on 5-7 weeks for a straightforward conversion, longer if structural work pushes a second plan review cycle."
  - title: "Setback and permit confusion between city limits and Kittitas County CDS"
    description: "A lot of Ellensburg garage projects stall because the homeowner assumes one permitting path and it's actually the other — inside city limits it's the City of Ellensburg Building Division, outside it's Kittitas County CDS, and the setback and lot coverage numbers aren't identical between them. IRC governs the structural minimums either way, but the AHJ reviewing your plans differs, and so does the FAR calculation if you're adding a DADU. Plan review typically runs 3-6 weeks for a standard detached garage, longer with an ADU attached. TopVolk pulls the permit set, handles the blue tape walkthrough, and carries the project through rough-in and final inspection as a WA Licensed Contractor — no permit runner fees passed on to you."
  - title: "What actually drives garage construction cost up or down"
    description: "Site prep and the slab are usually the biggest swing factors — a 4-inch fiber-reinforced slab on a flat, already-graded lot near downtown costs a lot less than the same slab on a sloped acreage lot off Reecer Creek Road needing retaining work first. Siding match (Hardie versus cheaper vinyl), an insulated garage door versus a basic steel panel, and whether you want a 60A EV charger circuit roughed in all move the number. A bare two-car detached shell lands around $28,000-$38,000; a finished, insulated, wired two-car runs $45,000-$65,000. Every quote from TopVolk is line-item, not a range, and the deadline penalty clause is standard in the contract — that's the actual guarantee, not a slogan."
  - title: "Garage doors, weatherstripping, and heating for year-round shop use"
    description: "An uninsulated steel garage door loses heat fast once Ellensburg's winter temps drop into the teens, which matters if the garage is a working shop and not just storage. We typically spec an insulated door with updated weatherstripping at the threshold and jambs, paired with a LiftMaster opener with battery backup since power blips happen during windstorms. For year-round comfort, a Mitsubishi mini-split heats a detached shop far cheaper than baseboard electric. Most Ellensburg garages we build also end up running a second fridge or chest freezer — GE, Kenmore, and Whirlpool units are the ones we see most in this area — so we size the panel and run a dedicated 20A circuit instead of daisy-chaining it off a shared outlet. Expect a properly built insulated garage door and frame to last 15-20 years; weatherstripping should get checked every couple winters since wind-driven debris wears it down faster here than on the west side."

