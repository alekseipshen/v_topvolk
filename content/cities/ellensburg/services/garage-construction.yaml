  - q: "What does building a garage in Ellensburg cost?"
    a: "A bare-bones two-car detached garage runs $28,000-$38,000; add insulation, finished interior, an insulated door, and electrical for shop use and you're at $45,000-$65,000. Stacking a DADU above it under HB 1337 pushes total project cost to $145,000-$190,000 depending on finish level. Site conditions — slope, soil, existing slab removal — move the number more than almost anything else. Every TopVolk quote is itemized by trade and material, not a vague range, and the first on-site visit is free."
  - q: "Do I need a permit to build a garage in Ellensburg, and who handles it?"
    a: "Yes — inside city limits it's the City of Ellensburg Building Division, and on unincorporated county land it's Kittitas County Community Development Services (CDS), and the setback and FAR numbers differ between them. Plan review generally takes 3-6 weeks for a standard detached garage, longer with a DADU attached. TopVolk prepares the full plan set, submits it, and carries the project through rough-in and final inspection as a WA Licensed Contractor. You don't deal with the AHJ directly unless you want to."
  - q: "Can I add an EV charger circuit or a heated workshop during the build?"
    a: "Yes, and it's far cheaper to rough it in during framing than to retrofit later. We typically pre-wire a 50A or 60A circuit to the garage panel location for EV charging and coordinate the electrical sub on MEP layout before drywall goes up. For heat, a Mitsubishi mini-split is the most efficient option for a detached shop versus electric baseboard. Tell us during the consultation and it's priced into the original quote, not added as a change order later."
  - q: "What's the warranty on a new garage build, and how does it hold up to Ellensburg winters?"
    a: "Workmanship is covered for one year, with manufacturer warranties on the garage door, siding, and any installed mini-split passing through separately. The bigger durability question here is freeze-thaw on the slab — that's why we spec 4-inch minimum fiber-reinforced concrete with footings poured below frost depth, not the bare minimum some builders use. Hardie siding holds up to wind-driven debris better than vinyl over a 20+ year span. The deadline penalty clause in the contract is the real backstop if the schedule slips."
  - q: "Do you cover areas near Ellensburg, and how far out do you schedule?"
    a: "Yes — Thorp, Kittitas, and Cle Elum are all within the same trip from Seattle Metro, so projects there get scheduled the same way. Because garage builds and ADU additions are multi-week jobs, we typically book consultations 1-3 weeks out and start construction once permits clear. Vladislav handles every consultation directly, so there's no commissioned closer pushing you toward a bigger scope than you asked for. Call (206) 591-1096 to get on the schedule."