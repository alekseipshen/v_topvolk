title: "Ellensburg Deck Installation — Built for Kittitas Wind and Hard Winters"

intro: |
  Kittitas Valley wind is what contractors talk about first when planning a deck in
  98926 — not rain. Ellensburg sits in one of the windiest corridors in Washington
  State, and a deck that isn't properly anchored at the ledger board and post-to-beam
  connections will show structural stress within a few seasons. The older rancher
  neighborhoods clustered around the Central Washington University campus near 15th
  Avenue feel it differently than the newer subdivisions east of downtown toward the
  Ellensburg Airport Road area — but both locations need lateral load engineering, not
  just vertical load calculations. Temperature swings compound the problem. A Trex
  composite deck that handles rain cycles on the west side also has to handle 100°F
  July afternoons and hard freezes in February out here. That combination — wind load,
  UV exposure, and genuine freeze-thaw cycling — changes the material and structural
  decisions. TopVolk Construction LLC has built decks across the Seattle Metro and east-
  side communities alike, and the Ellensburg build spec looks genuinely different from a
  Bellevue deck for exactly these reasons.

localContext: |
  Ellensburg's housing stock in the 98926 zip code breaks into two main categories.
  The 1950s through 1970s ranchers and split-levels near the CWU campus — particularly
  the blocks south of University Way and east along 8th Avenue — have original Douglas-
  fir rim joist framing with no ledger flashing installed. Expanding a covered porch
  into a full deck platform on these homes means tying into that original framing
  carefully. Any ledger attachment without proper self-adhering membrane and metal cap
  flashing will fail at the band board within a decade of freeze-thaw cycling. The
  1980s and 1990s builder-grade homes in the residential tracts north toward Brick Road
  and east past the fairgrounds are second-deck candidates, but post footing depth
  matters more here than in Seattle — frost line in Kittitas County runs 18 inches
  minimum, sometimes deeper on elevated or north-facing lots. Cle Elum (98922) has
  similar footing requirements. Kittitas County Community Development Services handles
  permits for unincorporated parcels; the City of Ellensburg runs its own permit center
  at City Hall. Either way, a deck surface above 30 inches triggers IRC guardrail
  requirements at 36 inches minimum.

commonProblems:
  - title: "Wind Load and Ledger Attachment Failures on CWU-Area Ranch Homes"
    description: |
      Ranch homes from the 1960s near the CWU campus weren't designed for deck
      additions. The original rim joist is typically nominal 2x8 Douglas-fir — structurally
      adequate, but the ledger-to-rim connection requires through-bolting or structural
      screws on a specific spacing pattern per IRC Table R507.9.1.3. Without proper
      flashing at the ledger — typically a self-adhering membrane behind a metal cap
      flashing — water infiltrates behind the band board and begins rotting the rim joist.
      In Ellensburg's freeze-thaw climate, that rot cycle accelerates compared to milder
      western Washington. Simpson Strong-Tie LUS210 joist hangers at every joist-to-ledger
      connection are the correct spec here — not toe-nails. Budget $900-$1,300 for ledger
      board installation with correct flashing on a 16-foot deck run. Skipping that detail
      to save $400 upfront creates a $4,000 rim joist repair in year eight.

  - title: "Post Footing Depth and Frost Heave at Ellensburg's Elevation"
    description: |
      At roughly 1,500 feet in the Kittitas Valley, frost depth is not the 12 inches
      you'd spec in Tacoma. Plan on 18 inches minimum for post footings in Ellensburg,
      and on north-facing or shaded lots that number pushes to 24 inches. Footings poured
      at 12 inches will heave over three to five winters, pushing posts out of plumb and
      racking the deck frame — guardrails go out of level, decking gaps open unevenly,
      and stair stringers crack at the notch points. Code-compliant footings in Kittitas
      County require concrete piers to frost depth with a minimum 10-inch diameter for
      standard post loads. Pressure-treated 6x6 posts rated for ground contact — UC4B
      treatment level — are the correct spec for any post near or at grade. A 300 sq ft
      deck typically needs six to eight footings. Budget $160-$260 per footing for
      excavation, form, and concrete pour in this area.

  - title: "Guardrail Height and Stair Stringer Code in Kittitas County Permit Review"
    description: |
      Both Kittitas County Community Development Services and the City of Ellensburg
      enforce IRC structural requirements on deck permits. Any deck surface more than 30
      inches above grade requires 36-inch guardrails minimum — that gets verified at rough-
      in inspection, not just on paper. Stair stringers must meet 7-3/4 inch maximum rise
      and 10-inch minimum run, with a graspable handrail on at least one side for runs of
      four or more risers. Permit applications for decks over 200 sq ft generally require
      a site plan and framing detail drawings. City of Ellensburg permit review for a
      standard residential deck runs two to four weeks. TopVolk Construction LLC — WA
      Licensed Contractor, 100+ projects completed since 2017 — handles the permit drawings
      and application as part of the project scope. Call (206) 591-1096 to get a permit-
      ready scope of work drafted before you start material shopping.

  - title: "Cedar vs. Composite Decking — The Thermal Cycling Problem in 98926"
    description: |
      Cedar decking performs well in western Washington's mild, wet climate. Ellensburg
      swings from 100°F in July to single digits in January — that thermal range causes
      cedar to check, split, and cup faster than it would on the coast. Annual sealing
      slows it but doesn't stop it. Trex Enhance Naturals or TimberTech Azek composite
      decking handle those temperature cycles predictably without splitting, and they resist
      the UV bleaching that hits exposed wood fast at Ellensburg's elevation and low annual
      cloud cover. For a 300 sq ft deck, Trex Enhance composite runs $19-$25 per sq ft
      installed including framing, versus $13-$17 for pressure-treated pine decking. The
      composite won't need annual sealing and is unlikely to need board replacement in year
      seven the way PT pine often does. Over a 15-year window, the cost difference narrows
      significantly in composite's favor.

  - title: "Drainage Planning for Second-Story Decks Over Living Space"
    description: |
      Ellensburg averages around 10 inches of rain annually — far less than Seattle —
      but spring snowmelt and summer thunderstorms drop water fast. A second-story deck
      over a garage or living space without a drainage system pools water at the joist
      level, leading to rot at the blocking and rim joist connections. Trex RainEscape or
      Deckorators drainage membrane systems channel water away from the framing through a
      collector channel and downspout — but they install between joists before decking goes
      down, not as a retrofit. Joists under a drainage system also need a 1/8-inch-per-foot
      slope toward the collector, which affects the framing layout from the start. Plan for
      this at the design stage, not after water damage shows up in the ceiling below.
      Second-story deck projects with drainage systems typically run $26-$36 per sq ft
      installed all-in. That's a significant line item, but far less than a structural
      repair three years later.

faq:
  - q: "How fast can you get to Ellensburg for a deck consultation?"
    a: |
      Ellensburg is roughly 110 miles east of Seattle on I-90 — about 1.5 to 2 hours
      depending on Snoqualmie Pass conditions and traffic through the gorge. TopVolk
      Construction schedules site visits to Ellensburg and the Kittitas County area
      regularly; Vladislav comes out personally for the estimate, not a salesperson or a
      subcontractor doing a pre-screening. From initial call to on-site consultation is
      typically within one week. Permit submittal to construction start on a standard deck
