      Call (206) 591-1096 to schedule a free on-site visit — you'll get a line-item quote,
      not a vague range.

  - q: "What does deck installation in Ellensburg typically cost?"
    a: |
      A ground-level pressure-treated deck in the 200-300 sq ft range runs $14,000-$23,000
      installed in the Ellensburg area, covering permit fees, concrete footings, PT framing,
      decking surface, and a basic stair run. Composite decking — Trex or TimberTech — adds
      $4,000-$8,000 to that range depending on the product line selected. What pushes the
      number up: second-story decks requiring longer posts and larger beam spans, guardrail
      systems with balusters, and sloped lots where footing depths vary significantly across
      the layout. Pricing for Kittitas County projects accounts for drive time and materials
      logistics. TopVolk provides free on-site estimates with itemized line-item pricing —
      call (206) 591-1096 to schedule.

  - q: "Do I need a permit for a deck in Ellensburg or unincorporated Kittitas County?"
    a: |
      Almost certainly yes. The City of Ellensburg requires a building permit for any
      deck over 200 sq ft or attached to the house structure. Kittitas County Community
      Development Services applies similar thresholds for unincorporated county parcels.
      An attached deck — one using a ledger board connection to the house — typically
      requires a permit regardless of square footage because that ledger attachment affects
      the structure of the home itself. TopVolk Construction LLC, WA Licensed Contractor,
      prepares the site plan, framing detail drawings, and permit application as part of
      the project. City of Ellensburg permit review runs two to four weeks for a standard
      residential deck. Build that window into your project timeline from the start.

  - q: "Can you engineer a deck that handles Ellensburg's wind and temperature swings?"
    a: |
      Wind bracing is the piece most residential deck builders skip in calmer climates,
      but it's standard on a Kittitas Valley build. Simpson Strong-Tie post caps with full
      hardware — not just a friction-fit — add lateral resistance at the post-to-beam
      connection. Knee bracing between posts and beams on taller decks adds additional
      rigidity. For decking material, Trex and TimberTech composite boards handle freeze-
      thaw cycling and UV degradation far better than cedar or pine under Ellensburg's
      temperature range. Post footings go to 18-24 inch depth here, not 12 inches.
      Vladislav works through those structural details at the estimate stage, not as a
      change-order surprise mid-project — and missed-deadline penalties are written into
      the contract.

  - q: "How long will a new deck last in Ellensburg's climate?"
    a: |
      Composite decking — Trex Enhance, TimberTech Azek — carries a 25-year fade and
      stain warranty and realistically lasts 30 or more years in Ellensburg's climate with
      minimal maintenance. Pressure-treated framing specified correctly — UC4B ground-
      contact rating at post bases, UC3B for above-grade framing members — lasts 30 to
      40 years structurally. Cedar decking in Ellensburg's thermal swings typically needs
      board replacement within 8-12 years without consistent sealing, shorter than the same
      installation in Seattle's milder climate because of UV exposure and harder freeze
      cycles. The structural frame — ledger, joists, beams, blocking — outlasts the
      decking surface in most cases. TopVolk builds with the expectation that the frame
      lasts 30-plus years and the first decking surface goes at least 25.

