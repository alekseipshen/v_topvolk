  - q: "What does tile installation in Ellensburg typically cost?"
    a: "Bathroom floor tile with Ditra membrane and full substrate prep runs $1,800–$3,200 for a typical 40–60 sq ft bathroom. A full shower rebuild — tear-out, Kerdi waterproofing, new tile set — runs $4,500–$8,500 depending on size and tile selection. Kitchen backsplash in a standard 30–40 sq ft run is $1,200–$2,200. Heated floor systems using Ditra-Heat or Warmup add $800–$1,500 to a bathroom floor project. All quotes from TopVolk are line-item: materials listed separately from labor, no bundled estimates that obscure what you're paying for. Call (206) 591-1096 for a free on-site quote with specific numbers."

  - q: "Do I need a permit for tile work in Ellensburg?"
    a: "Straight tile replacement — new tile in the same footprint over an existing substrate — typically does not require a permit from the City of Ellensburg Building Department. A full shower rebuild that relocates or replaces plumbing does require a plumbing permit. Adding a heated floor with a new thermostat circuit requires an electrical permit. For parcels in unincorporated Kittitas County (zip 98934 and rural areas outside city limits), permits go through Kittitas County rather than the city building department. TopVolk is a WA Licensed Contractor and pulls all required permits on your behalf — the homeowner does not have to navigate the application process."

  - q: "What's the difference between Schluter Kerdi and RedGard for a tile shower?"
    a: "Kerdi is a sheet membrane — polyethylene bonded to fleece — that installs as a continuous surface over cement board or drywall and is waterproof from the moment it goes up. RedGard is a liquid-applied membrane brushed on in two coats; it performs well on floors and horizontal surfaces where thickness is controllable, but on vertical walls it's harder to get consistent coverage at inside corners and around niches. For full shower enclosures, Kerdi is more reliable because it doesn't depend on application consistency. RedGard is a reasonable choice for a shower floor pan or spot waterproofing. In Ellensburg bathrooms where the substrate is cement board, Kerdi bonds with unmodified thinset and covers the full enclosure including niche boxes and the curb."

  - q: "How long does tile installation last in Ellensburg's climate, and what's covered?"
    a: "Properly installed tile — correct substrate, appropriate thinset, Ditra or Kerdi where needed — lasts 20–30 years without issues. Grout joints in high-traffic areas benefit from resealing every 3–5 years; Ellensburg's low-humidity summers actually help grout last longer than in coastal Washington. Natural stone like travertine needs sealing at installation and every 1–2 years after given its porosity. TopVolk warranties tile installation workmanship for 2 years — if grout cracks, tiles loosen, or waterproofing fails due to installation error, it gets corrected at no charge. Schluter's Ditra-Heat cable carries a 25-year manufacturer warranty. Material defects outside of installation error fall under the manufacturer's coverage, not the installer's."

