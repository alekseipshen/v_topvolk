title: "Ellensburg Kitchen Remodel — Opening Up Kittitas Ranchers"

intro: |
  Kittitas Valley winters drop into the single digits by January, and summers
  regularly hit 95°F with the dry wind that Ellensburg is genuinely famous for.
  The 1950s and 60s ranchers filling streets around Central Washington University
  and east of Downtown Ellensburg were built tight and compartmentalized — separate
  dining rooms, closed-off galley kitchens, partition walls that made sense when
  heating oil was cheap but now just make the whole house feel smaller than it is.
  Most of these kitchens run 80-100 square feet, with original Kenmore or GE ranges
  sitting on linoleum that hasn't changed since the Ford administration. The layout
  itself is the real problem — not always the appliances, not always the cabinets.
  Removing a load-bearing wall, installing an LVL beam to carry the load above, and
  opening the kitchen to the living space is the move that transforms these homes.
  That work requires permits through the City of Ellensburg Building Division and a
  WA Licensed Contractor who knows how to read a floor plan for bearing points before
  swinging a hammer.

localContext: |
  Most of the housing stock in zip code 98926 falls into two categories: pre-1970
  ranchers and modest two-stories near the CWU campus, built simultaneously as
  student rentals and family homes, and 1980s-90s tract development that pushed
  toward North Ellensburg and the edges of town near I-90. The older homes — on
  streets like University Way and the blocks between Chestnut and Elm — have kitchens
  designed around a very different lifestyle: narrow galley layouts, galvanized
  plumbing stubbed into 1960s cabinet bases, and 100-amp electrical panels that
  can't support a modern induction range without an upgrade. Out in the rural Kittitas
  area (zip code 98934), older farmhouses present even more dated configurations.
  The dry climate east of the Cascades means less chronic moisture damage than
  Seattle sees, but the freeze-thaw cycles running November through March still stress
  older tile grout, caulk joints, and any subfloor that's absorbed a decade of
  dishwasher leaks. Subfloor replacement — sistering damaged joists or replacing
  sections outright — turns up in nearly every full kitchen remodel we do here.

commonProblems:
  - title: "Load-Bearing Walls in 1960s Ranchers Near the CWU Campus"
    description: |
      The most common request in Ellensburg's older neighborhoods is opening the
      kitchen to the living room or dining area. That wall in a typical 1960s rancher
      is almost always load-bearing — carrying roof load, and sometimes a portion of
      upper-floor joist load as well. Cutting it without proper engineering and a
      correctly sized LVL beam is how floors sag and doors stop latching. A structural
      assessment comes first: check joist direction, trace the wall's position relative
      to the ridge line, identify point loads above. A single-span LVL beam replacement
      in a standard rancher runs $3,500-$7,000 installed, depending on span length and
      whether the temporary support wall can come out in one phase or needs to stay up
      through the rough-in inspection. The City of Ellensburg requires a structural
      permit for this scope of work. Plan review on residential structural projects
      typically takes 2-4 weeks before demo can start.

  - title: "100-Amp Panels Can't Carry a Modern Kitchen's Electrical Load"
    description: |
      A significant portion of the 1950s and 60s homes near Downtown Ellensburg still
      run 100-amp service — which was adequate then, but not now. A single induction
      range pulls 40-50 amps on its own. Add a dedicated circuit for the refrigerator,
      a dishwasher circuit, recessed lighting on dimmer-compatible LED fixtures, and
      a ducted range hood with a 400+ CFM motor, and you've got a panel tripping
      breakers or, worse, running undersized wiring at sustained high load. The fix is
      a 200-amp service upgrade coordinated with Puget Sound Energy before kitchen
      rough-in begins. That work runs $1,800-$3,500 depending on meter location and
      panel position. A Samsung or GE induction range requires its own 240V/50A
      dedicated circuit — not shared with any other load. We schedule the electrical
      subcontractor before demo starts so the new panel is energized before cabinet
      installation begins.

  - title: "Pulling Permits for Kitchen Remodels Through City of Ellensburg Building Division"
    description: |
      Any kitchen remodel touching structural work, electrical, plumbing, or mechanical
      systems requires permits through the City of Ellensburg Building Division. Removing
      a wall, relocating a sink drain, moving a gas stub-out, upgrading the panel, or
      adding circuits for recessed lighting — all of that triggers a permit requirement,
      not optional. Applications go through the city's permit office on 5th Avenue;
      plan review for a standard residential kitchen with structural work typically
      runs 2-4 weeks. You'll need a rough-in inspection before drywall goes up, and a
      final inspection before the kitchen is considered code-compliant for occupancy.
      TopVolk handles permit prep, application, and inspection scheduling directly —
      Vladislav Volkov is a WA Licensed Contractor, so subcontractors brought in for
      electrical and plumbing work are coordinated under one licensed umbrella.
      Unpermitted structural kitchen work gets flagged at re-sale in Kittitas County.
      Better to have documentation in order from the start.

  - title: "Cabinet and Countertop Selection on a Kittitas County Budget"
    description: |
      With a median household income around $43,500, most Ellensburg homeowners aren't
      shopping full custom cabinetry — and they don't need to. IKEA SEKTION boxes with
      aftermarket door fronts, or mid-range semi-custom lines like KraftMaid, get the
      job done at $4,000-$9,000 for a typical 10x12 kitchen layout, plus installation.
      IKEA works well in straightforward rectangular kitchens where the layout doesn't
      fight the modular sizing. Semi-custom makes more sense when you're dealing with
      odd corner configurations, vaulted soffits above the upper cabinets, or a
      peninsula that needs non-standard depth. Quartz countertops at $55-$85 per square
      foot installed hold up better than laminate long-term and don't require annual
      sealing the way granite does — meaningful in a kitchen that gets daily use. Every
      quote from TopVolk separates cabinet cost, countertop cost, and installation
      labor as individual line items so you know exactly where the money goes.

  - title: "Appliance Fitment Problems in Pre-1970 Ellensburg Kitchens"
    description: |
      Standard appliance fitment sounds simple but creates real problems in older homes.
      Pre-1970 cabinet runs were built to non-standard depths and heights — a modern
      Whirlpool or Frigidaire refrigerator at 35.75 inches wide will not slide into a
      33-inch cabinet opening without modification. Dishwashers need a dedicated hot
      water supply line, a drain loop to prevent backflow, and a circuit that isn't
      shared — something most original kitchens in the 98926 zip code never had.
      During demo, soft subfloor under the old dishwasher bay turns up regularly —
      minor leaks over years that need sistered joists or full subfloor panel replacement
      before the new unit goes in. Budget $400-$800 for subfloor work if your current
      dishwasher has shown any signs of leaking. A Whirlpool WDT750SAKZ fits a standard
      24-inch opening and runs around $700 at retail — but the rough-in work behind it
      is where the real cost sits.

faq:
  - q: "How far does TopVolk travel to Ellensburg for a kitchen remodel?"
    a: |
      Ellensburg sits about 100 miles east of Seattle via I-90 — roughly 1.5 hours
      depending on Snoqualmie Pass conditions. Projects in Kittitas County are
      evaluated individually based on scope and timeline fit. For kitchen remodels in
      the $30,000 and up range, we schedule the site visit, handle permits locally,
      and maintain a regular presence throughout construction. The initial consultation
      is free and on-site — Vladislav comes out, looks at the actual space, and
      delivers a line-item quote, not a ballpark range over the phone. Call
      (206) 591-1096 to schedule. Travel logistics and project feasibility are
      discussed openly before any agreement is signed.

  - q: "What does a kitchen remodel in Ellensburg typically cost?"
    a: |
      A functional kitchen remodel in Ellensburg — new cabinets, countertops,
      appliances, and updated electrical — runs $28,000-$55,000 for most mid-size
      kitchens in the 98926 zip code. Add load-bearing wall removal with LVL beam
      work and a panel upgrade, and the range shifts to $35,000-$70,000 depending on
      span, permit scope, and subfloor condition. Full gut-and-rebuild projects with
      plumbing relocation push past $80,000. Phone quotes with vague ranges aren't
      how this works — the on-site estimate produces a written line-item breakdown
      separating cabinets, countertops, structural, rough-in labor, and permit fees.
      Call (206) 591-1096 to schedule a free on-site estimate with Vladislav directly.

  - q: "Do kitchen remodels in Ellensburg need permits, and how long does review take?"
    a: |
      Yes — any scope touching structural, electrical, plumbing, or mechanical requires
      permits through the City of Ellensburg Building Division. Wall removal, panel
      upgrades, sink relocation, gas line modification, and new circuit rough-ins all
      trigger permit requirements. Applications are filed with the permit office at
      City Hall on 5th Avenue; plan review on a standard residential kitchen with
      structural elements typically takes 2-4 weeks. TopVolk handles all permit
      applications, drawing prep, and inspection scheduling — Vladislav Volkov is a
      WA Licensed Contractor, so permitted work carries proper licensure documentation
      throughout. Unpermitted structural work creates title issues at re-sale, which
      is an avoidable problem.

  - q: "Can you handle gas line modifications for a new range or range hood?"
    a: |
      Gas line work — moving an existing stub-out for a new range position, adding a
      connection where none existed, or capping off a line during a switch to induction
      — requires a licensed plumbing or gas contractor and a separate mechanical permit
      through the City of Ellensburg. That subcontractor is coordinated directly under
      the project scope, not left to the homeowner to find separately. Switching from
      gas to a Samsung or GE induction range means both a gas cap-off and a new
      240V/50A electrical rough-in for the dedicated circuit. Ducted range hood
      installations — any hood exhausting through an exterior wall — also need a
      penetration detail on the permit drawings. Properly sized residential hoods for
      standard cooktops run 300-600 CFM; spec depends on the BTU load of the range.

  - q: "How long does a full kitchen remodel take in Ellensburg?"
    a: |
      Timeline depends on what's changing. A cosmetic refresh — cabinets, countertops,
      and appliances with no structural or plumbing moves — runs 4-6 weeks from permit
      approval to final walkthrough. Add load-bearing wall removal with LVL beam work
      and you're at 6-9 weeks for construction, plus the 2-4 week permit review window
      before demo starts. Full gut remodels with plumbing relocation and panel upgrades
      run 8-12 weeks. Milestone dates go into the contract, and there's a penalty clause
      for missed deadlines — written into the agreement, not a verbal promise. Vladislav
      manages the project directly, so if a subcontractor creates a scheduling problem,
      you're talking to the person responsible, not a coordinator relaying messages.

