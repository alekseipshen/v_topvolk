commonProblems:
  - title: "Weatherstripping and Threshold Seal Failure from Freeze-Thaw Cycling"
    description: "The freeze-thaw cycle in Ellensburg is aggressive — temperatures can drop to single digits overnight and climb above freezing the next afternoon, repeating dozens of times from November through March. Foam and pile weatherstripping compresses and cracks under that cycling faster than it would in a milder coastal climate. On 1950s and 1960s homes near the CWU campus, door jambs are frequently out of plumb from decades of frost heave in shallow foundations, which means the door drags on one side and the weatherstripping wears unevenly. The fix is a full pre-hung unit replacement: a Therma-Tru Smooth-Star fiberglass door, properly shimmed in the rough opening, with a new adjustable aluminum threshold and compression weatherstripping rated for temperature extremes. A standard 3/0 x 6/8 entry door replacement runs $1,100-$1,500 installed, including new threshold and basic deadbolt hardware. Timeline is typically one day on-site."

  - title: "Wood Door Warping and Frame Splitting in Ellensburg's Climate"
    description: "Solid wood entry doors look right at home on Ellensburg's Craftsman-era homes near downtown, but the Kittitas Valley's temperature range pushes wood past what it handles well. A wood door that fits perfectly in September will swell in spring snowmelt and stick shut, then shrink and gap in August when summer heat pulls moisture out of the fibers. The door stop trim pulls away, hinge mortises split, and the door racks in the frame. Solid wood replacement is possible with proper sealing, but for most Ellensburg homeowners a fiberglass door skin — Masonite's Belleville series or JELD-WEN's Premium fiberglass line — delivers the same visual character with none of the seasonal movement. Fiberglass holds exterior paint better in UV-intense eastern Washington summers and won't swell. Installation runs one to two days for a standard entry replacement; add a day if rough opening adjustment or new casing is needed."

  - title: "Sill Pan Flashing Failure and Subfloor Damage on 1990s Tract Homes"
    description: "East Ellensburg subdivisions from the 1990s — neighborhoods built along Canyon Road and toward the city's eastern edge — used builder-grade pre-hung steel doors that are now 25-35 years old. Sill pan flashing on those units is typically thin aluminum or vinyl that cracks and separates from the OSB subfloor over time. Even at Ellensburg's modest 8-9 inches of annual precipitation, spring snowmelt and rain tracks along that failed flashing. By the time a homeowner notices a soft spot at the entry, the damage is often into the rim joist. Replacing the door is the straightforward part — a new JELD-WEN or Therma-Tru pre-hung unit with self-adhering membrane flashing at the sill. Subfloor and joist repair adds time and cost to the overall project scope. A like-for-like replacement inside Ellensburg city limits typically needs no permit from the City of Ellensburg Building Division; structural repair work is a different matter. Call (206) 591-1096 to assess the scope before next winter."

  - title: "What Door Installation Actually Costs in Ellensburg"
    description: "Cost for a standard exterior door replacement in Ellensburg runs $1,100-$1,800 complete — that covers the fiberglass or insulated steel pre-hung unit, installation labor, threshold, and basic hardware. That range moves up if the rough opening is out of square from frost heave (add $150-$300 for shimming and adjustment) or if sill pan damage has reached the subfloor. Smart lock integration — Schlage Encode or August Wi-Fi Smart Lock — adds $150-$250 to the hardware line. Patio sliding door or French door replacements run $1,200-$2,500 installed for a standard 6-foot opening; multi-slide systems are higher. Interior door replacement — hollow-core or solid-core pre-hung with new casing — typically lands at $350-$600 per door installed. All quotes are line-item and provided in writing before work starts. Vladislav is both the person who assesses the project and the person who does the work — no estimating team, no mark-up layer."

  - title: "Garage Door Replacement and Insulation for Kittitas Valley Cold"
    description: "A single-layer uninsulated steel garage door is essentially a metal panel standing between your car and temperatures that regularly drop below 10°F in Ellensburg. Clopay's Gallery or Coachman series with polyurethane foam core (R-18 insulation value) makes a real difference in an attached garage — and it keeps the bottom rubber seal from hardening and cracking against the concrete apron in the cold, which is the first failure point on uninsulated units. Replacing just the bottom seal runs $80-$150; a full 16x7 two-car door replacement with an R-18 insulated panel unit lands at $1,200-$2,200 installed. Screw-drive openers don't handle temperature extremes well — a Chamberlain belt-drive unit performs more reliably across Kittitas Valley's seasonal range. Budget 4-6 hours for a full door-and-opener swap. Insulated doors also carry better long-term manufacturer warranties than single-layer steel."

