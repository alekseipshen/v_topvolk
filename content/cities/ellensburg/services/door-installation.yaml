  - q: "Fiberglass or steel — which holds up better in Ellensburg's temperature swings?"
    a: "Fiberglass performs better in Ellensburg's specific climate. The Kittitas Valley's 100-degree seasonal range — summer highs above 100°F, winter lows near -10°F — causes steel door skins to expand and contract enough to stress the weatherstripping and threshold seal over repeated cycles. Fiberglass has a lower thermal expansion coefficient, holds paint better in intense eastern Washington UV, and doesn't dent from minor impact. Steel costs less upfront (Masonite steel pre-hung units run $350-$550 vs. $500-$900 for mid-grade fiberglass), but fiberglass outperforms on long-term seal integrity and paint adhesion. Therma-Tru's Smooth-Star and JELD-WEN's Premium fiberglass lines are solid mid-range choices for these conditions."

  - q: "What warranty comes with a new door installation in Ellensburg?"
    a: "Manufacturer warranties vary by product: Therma-Tru covers the door slab for the lifetime of the original purchaser, with a 10-year limited warranty on components. JELD-WEN's fiberglass doors carry a 15-year limited warranty on the slab. The installation warranty — covering rough opening work, sill pan flashing, threshold adjustment, and casing — is separate from the manufacturer's warranty and is backed by TopVolk Construction in writing. Sill pan flashing and threshold fit are the two things that determine long-term performance in Kittitas Valley freeze-thaw conditions; both are addressed on every exterior door replacement. Frost heave gradually shifting a frame out of square over years is a site condition, not an installation defect — but we'll walk you through what to watch for at the final walkthrough."

