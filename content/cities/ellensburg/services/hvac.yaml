title: "Ellensburg HVAC — Installs Built for Kittitas Valley Extremes"

answer: "TopVolk Construction LLC installs, replaces, and services HVAC systems in Ellensburg, WA — WA Licensed Contractor, 100+ projects completed, owner does every consultation."

intro: |
  Ellensburg runs hotter in July and colder in January than most Washington homeowners expect, and the HVAC systems in this town reflect that hard reality. Summers regularly hit 95–100°F in the Kittitas Valley, and January nights can drop to single digits — the kind of temperature swing that exposes every weakness in an undersized system or a leaky duct run. Homes along University Way near Central Washington University and older bungalows in the Pearl Street historic district were built in eras when nobody was sizing equipment to handle both extremes well. Vladislav Volkov, owner of TopVolk Construction LLC, has completed 100+ projects across the region and does every walk-through himself. A Mitsubishi mini-split installed in a CWU-area addition, for example, handles both the August heat and the February cold without overloading an aging duct system that was never built for cooling. That ground-level knowledge of local housing stock drives every recommendation made.

localContext: |
  Most of Ellensburg's residential housing falls into a few recognizable categories, and each one presents its own HVAC challenges. The 1940s–1965 bungalows in the 98926 zip code — particularly near Pearl Street and the University Way corridor — were built without central air and with gravity-fed duct layouts that fight modern forced-air systems at every turn. The 1965–1980 ranch-style slab-on-grade homes on Ellensburg's outer residential streets have ductwork buried in or near the slab, where condensation and leakage go undetected for years. Out in the 98934 zip code covering the Kittitas city area and rural parcels toward Thrall Road, permit jurisdiction shifts from the City of Ellensburg Building Department to Kittitas County Building Department — a distinction that changes the inspection process and timeline for any permitted HVAC work. Agricultural dust from Kittitas Valley fields and cottonwood seed in May accelerate filter clogging and coil fouling faster than homeowners typically expect. Dry continental climate at roughly 10 inches of rain per year also means static pressure issues in ductwork show up differently here than in western Washington homes.

commonProblems:
  - title: "No Cooling in Pre-1970 CWU-Area Bungalows — Undersized Evaporator Coils"
    description: |
      Older homes near Central Washington University were built with furnaces only, and adding central air to them almost always exposes the same problem: the evaporator coil and air handler are sized to what fits in the existing plenum, not what the Manual J load calculation actually calls for. An undersized A-coil starves the system of heat exchange capacity, and the compressor runs longer while delivering less cooling — especially when outdoor temps hit 98°F in July. Vladislav measures actual duct static pressure and performs a proper Manual J before specifying any equipment. In most of these homes, a Goodman 3-ton system with a correctly sized TXV-equipped coil resolves the issue without requiring a full duct replacement. Budget roughly $4,500–$7,000 installed depending on lineset length and electrical panel work needed.

  - title: "Hot and Cold Rooms in 1970s Ranch Homes — Duct Leakage at Register Boots"
    description: |
      Ranch-style slab-on-grade homes built between 1965 and 1980 in Ellensburg frequently have duct systems where the register boots have separated from the subfloor or drywall over decades of thermal expansion and contraction. Air escapes into wall cavities instead of reaching the room, so one bedroom runs 10 degrees warmer than the living room. Mastic sealant and metal-backed tape applied at every boot joint and trunk connection is the correct fix — not simply adding a larger furnace to compensate. Kittitas Valley temperature swings of 90°F between winter lows and summer highs stress these connections more than milder climates do. Rebalancing dampers in the plenum after sealing typically brings rooms within 2–3 degrees of each other. This work usually runs $800–$1,800 depending on duct accessibility and how many boots need attention.

  - title: "Permit Requirements for HVAC Replacement in Ellensburg and Kittitas County"
    description: |
      Any permitted HVAC installation or replacement in Ellensburg city limits goes through the City of Ellensburg Building Department. Properties outside city limits — rural parcels on roads like Thrall Road, canyon routes, and unincorporated areas in the 98934 zip — fall under Kittitas County Building Department jurisdiction, which uses a separate application process and inspection schedule. Both jurisdictions require mechanical permits for equipment replacement and a separate electrical permit for any 240V disconnect or panel work. Seattle Energy Code requirements apply to all permitted HVAC work, including duct sealing verification and equipment efficiency minimums. TopVolk Construction LLC is a WA Licensed Contractor and handles all permit applications, coordination with both building departments, and inspection scheduling as part of the project. Homeowners do not need to navigate the permit process independently.

  - title: "High-Efficiency Furnace Replacement — Amana and Goodman 95%+ AFUE Options"
    description: |
      Replacing a furnace running at 78–80% AFUE with a 95%+ AFUE unit cuts fuel waste significantly in a climate where heating runs from October through April. Proper high-efficiency installation requires rerouting the flue from a B-vent chimney chase to PVC condensate venting through an exterior wall — a step that some contractors skip, creating dangerous backdraft conditions. Amana and Goodman manufacture reliable 95%+ AFUE units at price points that make sense for Ellensburg's working-class and college-town income profile. Typical installed cost for a furnace-only replacement runs $3,800–$6,500 depending on BTU output needed, venting complexity, and whether a new heat exchanger or air handler is also being addressed. Amana's 10-year parts warranty and limited lifetime heat exchanger warranty on qualifying units adds long-term value that justifies the upfront cost difference over builder-grade equipment.

  - title: "Mini-Split Maintenance in Ellensburg's Dusty, Hot-Summer Climate"
    description: |
      Mitsubishi and Daikin ductless mini-splits installed in Ellensburg accumulate agricultural dust and cottonwood fiber faster than units in western Washington. The indoor air handler's blower wheel and evaporator coil should be cleaned every 12 months in this environment — not the 24-month interval sometimes listed in generic maintenance guides. A neglected blower wheel loses airflow efficiency and forces the compressor to work harder, shortening equipment life. Mitsubishi's Hyper-Heating units are rated to -13°F for the compressor, but that rating assumes clean coils and properly charged refrigerant. A system running low on refrigerant during a 100°F Ellensburg summer will fail the compressor before it should. Mitsubishi's 12-year compressor warranty requires registered installation by a qualified contractor. Expect 15–20 years of service life with annual maintenance; neglected units in this climate often fail at 8–10 years.

