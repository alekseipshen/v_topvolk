  - q: "What does a heat pump installation cost in Ellensburg?"
    a: |
      A single-zone ductless mini-split installation in Ellensburg typically runs $3,500–$6,500 installed, depending on lineset length and electrical work required. A whole-home heat pump system replacing a gas furnace on existing ductwork generally falls between $8,000 and $16,000 depending on equipment size and duct condition. Inflation Reduction Act rebates can offset $2,000–$8,000 of that cost for qualifying households — Vladislav walks through eligibility during the free consultation. Call (206) 591-1096 to schedule a walk-through and get an actual number for your specific house.

  - q: "Do I need a permit for HVAC work in Ellensburg?"
    a: |
      Most HVAC replacements and new installations require a mechanical permit, and any work involving a 240V disconnect or electrical panel upgrade adds an electrical permit to the stack. Inside Ellensburg city limits, permits go through the City of Ellensburg Building Department. Properties in unincorporated Kittitas County — including rural addresses in the 98934 zip — use the Kittitas County Building Department instead. TopVolk Construction LLC is a WA Licensed Contractor and files all permit applications, coordinates inspections, and closes out the permit as part of the project cost. Homeowners are not left managing that process on their own.

  - q: "Will a heat pump actually work in Ellensburg winters?"
    a: |
      Standard heat pumps lose efficiency sharply below 25–30°F, which makes them a poor fit for Kittitas Valley winters on their own. Cold-climate units rated with an H2i designation operate down to -13°F — Mitsubishi's Hyper-Heating line is the most commonly specified product for this application in inland Washington climates. Ellensburg sees single-digit January nights regularly enough that H2i-rated equipment is the minimum specification for any heat pump install here, not an upgrade. Vladislav verifies the correct cold-climate rating before specifying any heat pump for an Ellensburg home, and he will tell you directly if a hybrid system with a backup furnace is the more practical choice for a given house.

  - q: "What warranty comes with a new HVAC install in Ellensburg?"
    a: |
      Amana and Goodman furnaces and air handlers carry a 10-year parts warranty on registered equipment, with a limited lifetime warranty on the heat exchanger on qualifying Amana units. Mitsubishi mini-splits include a 12-year compressor warranty when installed by a registered contractor and registered within 90 days of installation. Ellensburg's dry, dusty climate and extreme temperature range puts more annual stress on compressors, heat exchangers, and coils than milder climates do — which is why proper sizing and clean installation matter more than the paperwork. TopVolk also provides a written labor warranty on installation work. Vladislav goes over warranty terms during the consultation so there are no surprises later.

