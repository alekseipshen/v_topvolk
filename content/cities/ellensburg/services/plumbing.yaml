title: "Ellensburg Plumbing — Repipes for Pre-1960 Homes & Freeze"

answer: "TopVolk Construction repipes galvanized and polybutylene plumbing in Ellensburg, Washington — WA Licensed Contractor, owner-led since 2017."

intro: |
  Galvanized supply lines rust shut from the inside before they ever spring a visible leak, and in Ellensburg's older housing stock that's the plumbing failure TopVolk gets called out for most. Water pressure drops to a trickle in an upstairs bath near the downtown core off Pearl Street, the homeowner assumes it's the city main, and the real culprit turns out to be forty-year-old pipe choked down to a fraction of its original bore. Kittitas County's cold, dry winters add a second failure mode: exposed hose bibs and crawlspace lines split when temperatures drop hard, which happens most years between the Fairgrounds and the Yakima River bottomland near Central Washington University. TopVolk Construction LLC handles this kind of plumbing as part of larger remodel work — pulling galvanized or polybutylene and running PEX or copper, swapping in a Rinnai tankless unit, or rerouting a drain line for a new basement bathroom. Vladislav Volkov runs every job himself, no sales rep, no subcontracted project manager — call (206) 591-1096 and you're talking to the person doing the plan review and the rough-in.

localContext: |
  Most of Ellensburg falls inside zip code 98926, which covers the downtown core, the residential blocks around Central Washington University, and the older farmhouses scattered toward the edge of town — galvanized steel supply lines and original cast-iron drain stacks are standard in homes built before 1960, not the exception. West of downtown, off the Dolarway Road corridor and out toward Kittitas (98934) just up I-90, you'll find 1970s-90s tract housing and a fair number of manufactured homes, where polybutylene and thin-wall PEX from cut-rate remodels causes its own set of callbacks. Kittitas County's permit office requires a mechanical permit and an inspection for water heater swaps, and Washington code calls for seismic strapping on every tank, two straps minimum, upper and lower third of the unit. Winters here run colder and drier than the Seattle side of the pass — frost depth matters, and crawlspace lines without a proper vapor barrier or heat tape split open by February most years. TopVolk crosses Snoqualmie Pass on I-90 for Ellensburg projects and batches them to keep drive time reasonable; call (206) 591-1096 to get on the schedule.

commonProblems:
  - title: "Galvanized pipe choking off water pressure in pre-1960 homes"
    description: "Steel pipe corrodes from the inside through a process called tuberculation — mineral scale builds up on the pipe wall until a 3/4-inch line is functionally a 1/4-inch line. It shows up as weak pressure at the upstairs shower, rust-colored water after the house sits empty for a few days, or a water heater that takes forever to fill. The fix is a full repipe: out with the galvanized, in with PEX-A run to a central manifold or copper if the home is on a well with iron content. TopVolk ties this into bathroom or kitchen remodels and sets new Moen or Kohler fixtures at the same time. A single-bath home runs roughly $6,500-$11,000 depending on wall access and stack height; full-house repipes on two-bath homes run higher. Plan on 3-5 days of work."
  - title: "Frozen and split lines from Kittitas County's cold winters"
    description: "Ellensburg sits in a colder pocket than the I-5 corridor, and exterior hose bibs, crawlspace lines, and pipe runs in uninsulated rim joist cavities are the first to fail when temperatures drop below freezing for several nights running. A standard sillcock with no frost-free design holds water right up to the exterior wall, where it freezes, expands, and splits the copper a foot inside the house — you don't find out until spring thaw, behind drywall. The fix is a frost-free sillcock with the shut-off valve set well inside the heated envelope, plus heat tape and a proper vapor barrier on exposed crawlspace runs. TopVolk uses SharkBite push-fit connections for tight tie-ins where soldering near old framing is a fire risk. Expect $350-$900 per fixed run depending on access."
  - title: "Water heater replacement and the Kittitas County permit step"
    description: "Swapping a failed tank yourself, or letting an unlicensed handyman do it, skips a step Washington code doesn't skip: a mechanical permit and inspection, plus seismic strapping rated for the unit's weight. Kittitas County's permit office processes residential mechanical permits in roughly 1-2 weeks for straightforward swaps; tankless conversions that require a gas line upsize for a Rinnai or Navien unit take longer because the plan review covers the gas piping too. TopVolk is a WA Licensed Contractor and pulls the permit, schedules the inspection, and straps the tank to code before final sign-off — no shortcuts that show up as a problem at resale. Deadline penalties are written into every contract, so a permit delay on our end costs us, not you. Call (206) 591-1096 for a free on-site estimate."
  - title: "What plumbing actually costs as part of a remodel here"
    description: "Plumbing rough-in for a full bathroom remodel in Ellensburg typically runs $4,500-$9,000 on top of fixtures — that covers moving the drain line, setting a new P-trap and vent, and tying into the existing stack. Rerouting a drain line for a basement bathroom often needs an ejector pump since gravity drainage isn't an option below the main line, which adds $1,800-$3,200. Cost drivers are wall and slab access, how far the new fixture sits from the existing stack, and whether the supply lines need to come up to PEX standard anyway. TopVolk quotes line-item pricing — no vague ranges — and that's part of the package on every project from $30K up, with 100+ projects completed since 2017 across the Seattle Metro counties and now into Kittitas County."
  - title: "Water heater lifespan and when a repair isn't worth it"
    description: "A standard 40-50 gallon tank water heater — GE, Whirlpool, and Kenmore units are common in this price range and sold through most big-box stores serving Ellensburg — lasts 8-12 years before the anode rod is spent and the tank itself starts to rust through from the inside. A leaking tank is not a repair job; once the steel shell goes, it's a replacement. A failing pressure regulator (PRV) is a separate issue and shows up as banging pipes or a relief valve that won't stop dripping, especially in homes on city water where supply pressure runs above 80 psi. TopVolk checks PRV function and expansion tank pressure anytime we're already in the mechanical room for a water heater swap, since both fail around the same age and both are cheap to address together rather than separately."

