  - q: "Do I need a permit for plumbing or water heater work in Kittitas County?"
    a: "Yes — Kittitas County's permit office requires a mechanical permit and inspection for water heater replacement, gas line upsizing, and most repipe work tied to a remodel. Plan review for straightforward swaps runs about 1-2 weeks; tankless gas conversions take longer because the gas piping gets reviewed separately. TopVolk Construction LLC is a WA Licensed Contractor and handles the permit application, the inspection scheduling, and the seismic strapping sign-off as part of the job — homeowners don't deal with the county office directly."
  - q: "Should I replace polybutylene pipe with PEX or copper?"
    a: "PEX-A run to a central manifold is the standard fix for most Ellensburg homes — it handles freeze cycles better than rigid copper because it has some give, and it's faster to run through existing wall cavities without major demolition. Copper still makes sense on well water with high iron content, since some well chemistry degrades certain PEX fittings faster over time. Either way, the polybutylene and its gray plastic fittings need to come out — they were never rated for long-term use under municipal water pressure. We make the call on-site based on your water source."
  - q: "What's the warranty on repipe and water heater work?"
    a: "TopVolk backs plumbing labor with a workmanship warranty, and PEX-A and copper repipes are rated for 50 years under normal conditions — well past anything you'll see from us in writing, but it tells you the material won't be the weak point. Tank water heaters from GE or Whirlpool typically carry a 6-12 year manufacturer warranty on the tank itself, separate from our installation warranty. Kittitas County's freeze-thaw winters are harder on exposed and crawlspace lines than coastal areas, so anything we run through unconditioned space gets heat tape and insulation as standard, not an upsell."
