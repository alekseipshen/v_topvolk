title: "Ellensburg ADU Construction — Rental Income Near CWU"

answer: "TopVolk Construction builds DADUs and attached ADUs in Ellensburg, WA — WA Licensed Contractor, 100+ projects completed, owner-led from permit to final CO."

intro: |
  Central Washington University puts roughly 12,000 students and over 1,000 faculty into Ellensburg's rental market year-round — and a DADU or attached ADU on your 98926 lot can pull $900–$1,400/month from tenants who need housing within a reasonable commute of campus. WA HB 1337 (2024) now allows up to two ADUs on most single-family lots statewide, including properties in Kittitas County, which rewrote the math for homeowners sitting on undersized lots near the downtown 5th Avenue corridor and the residential blocks east of CWU's Samuelson Hall. TopVolk Construction is a WA Licensed Contractor with 100+ projects completed since 2023 — Vladislav Volkov runs every project directly, so the person you talk to at the consultation is the same person managing your build. Full timeline from permit application to final CO runs 4–7 months. A 400–600 sq ft detached ADU with GE appliances and standard finishes typically comes in at $90K–$140K, depending on site conditions and whether you're running a shared or separate utility connection.

localContext: |
  Most of the older residential stock in the 98926 zip — particularly the blocks north and east of the CWU campus, and along the established streets near Ellensburg's downtown core — dates from the 1950s through early 1970s. Ranch-style and split-level homes on those lots frequently have adequate rear yard depth for a DADU within City of Ellensburg setback requirements, but lot coverage calculations under the current zoning code need to be verified before any floor plan gets drawn. Properties on the rural eastern fringe of Kittitas County, including parcels near the town of Kittitas in the 98934 zip, fall under Kittitas County Community Development Services (KCCDS) jurisdiction rather than the City of Ellensburg Building Division — a different permit process with different ADU standards and timeline. Climate matters here too. Ellensburg winters run colder and drier than western Washington, with hard freezes from November through March, and frost depths for footings run 18–24 inches under Kittitas County standards. Every ADU we build here gets a full crawlspace vapor barrier, PT lumber at all ground-contact framing, and R-49 insulation in the ceiling — not optional, and not something to negotiate down to save $800 on materials.

commonProblems:
  - title: "WA HB 1337 Applies Here, but Lot Coverage Math Often Doesn't Work Out"
    description: |
      WA HB 1337 (2024) removed most local ADU restrictions statewide, but it did not override lot coverage limits or FAR (Floor Area Ratio) calculations — and Ellensburg's single-family zones typically cap total lot coverage at 35–40% of the parcel area, counting the main house, any attached garage, and accessory structures. On a standard 6,000 sq ft lot with a 1,400 sq ft house and a two-car garage, you may have only 750–900 sq ft of remaining coverage, which limits a DADU to roughly 400–450 sq ft. The fix starts before a single drawing is done: a site survey and coverage calculation pulled from City of Ellensburg records at the pre-application meeting. TopVolk pulls lot dimensions and existing footprint data at that stage so you know what you're actually working with before spending money on architectural plans. Call (206) 591-1096 to run preliminary numbers on your specific lot before committing to anything.

  - title: "Shared vs. Separate Utility Connection: Ellensburg ADUs"
    description: |
      The first real cost decision on any Ellensburg DADU is whether to run a separate water and sewer service from the street or share the existing connection from the primary house. A shared connection typically saves $8K–$15K upfront but ties rental billing and utility metering to the main residence, which creates friction with long-term tenants and complicates resale. A separate service connection in Ellensburg runs $20K–$35K depending on trench depth, distance to the main, and whether City Public Works requires upsizing the street-side tap. The building permit and utility connection permit are reviewed on separate tracks by separate city departments, and those timelines rarely sync without active coordination. TopVolk submits both applications simultaneously to prevent a scenario where the building permit clears but the utility review holds construction for 8–10 weeks. Navien tankless water heaters work well for Ellensburg DADU units — compact, efficient, and no storage tank to freeze in a cold mechanical closet.

  - title: "Frost Depth and Foundation Requirements East of the Cascades"
    description: |
      Ellensburg sits at roughly 1,500 feet elevation with sustained cold from November through March — and new footing depths for ADU construction run 18–24 inches under Kittitas County and City of Ellensburg standards, compared to the 12-inch typical in western Washington. A DADU framed on undersized or shallow footings will fail the rough-in inspection and require redesign, which adds cost and delays the project by weeks. On sites with poor drainage or expansive soils — more common on the east side of town near the Yakima River floodplain — a concrete slab-on-grade with a properly specified vapor barrier and DriCore subfloor system is often the better structural call than a conventional perimeter foundation with crawlspace. TopVolk is a WA Licensed Contractor and prepares the full permit submittal including the foundation plan review through the City of Ellensburg Building Division. Plan review on a standard DADU there runs 6–10 weeks — faster than King County DPER, but slower than owners expect if they've only worked in smaller jurisdictions.

  - title: "What a DADU Actually Costs to Build in Ellensburg"
    description: |
      A detached ADU in Ellensburg runs $85K–$165K depending on size (400–800 sq ft), finish level, utility hookup scope, and site conditions. The low end covers a 400 sq ft studio with budget finishes, Samsung or GE appliances, and a shared utility connection on a flat lot with clean access. The high end covers a 700–800 sq ft two-bedroom unit with separate utilities, insulated slab foundation, an LVL beam header over the main entry, mid-grade Moen plumbing fixtures, and a Mitsubishi mini-split for year-round heating and cooling. Attached ADU conversions of existing garages or basements run $55K–$95K because the structure already exists. The biggest cost drivers specific to Ellensburg are the utility work, the longer material haul from Seattle or Yakima, and any lot grading needed on sloped parcels near the foothills. TopVolk provides line-item quotes broken down by phase — not a range, an actual number you can plan against.

  - title: "Garage Conversion vs. Detached Build: Which Makes Sense on Your Lot"
    description: |
      Attached garage conversion is often the first thing homeowners propose — no new foundation, lower sticker price, faster permit timeline. That holds true until you price out the insulation and mechanical work. An Ellensburg garage that's been unheated for 30 years needs R-21 wall insulation, R-49 ceiling insulation, a full vapor barrier, and either a Mitsubishi mini-split or a Rinnai-powered forced-air unit to meet IRC energy code for habitable space. Total MEP rough-in plus insulation, drywall hang/tape/mud, and finish work on a 400–500 sq ft attached garage runs $55K–$80K — not cheap, and you lose the parking. For homeowners who need parking or have a rear yard large enough to fit a standalone unit, a DADU typically rents for $75–$150/month more than a comparable garage conversion and holds value better at resale. Either way, the blue tape walkthrough and punch list process at the end is the same — every outstanding item gets resolved before the final inspection is scheduled.

