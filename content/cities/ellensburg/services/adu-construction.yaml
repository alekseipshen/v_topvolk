  - q: "What does ADU construction cost in Ellensburg?"
    a: |
      Detached ADU construction in Ellensburg runs $85K–$165K depending on square footage, utility hookup type, and finish level. Attached ADU conversions (garage or basement) run $55K–$95K because you're not building a new structure from the ground up. City of Ellensburg permit fees typically add $3K–$7K to total project cost. TopVolk provides a full line-item quote after the on-site consultation — a real number broken out by phase, not a wide ballpark range. Call (206) 591-1096 or schedule a free consultation to get pricing specific to your lot and the ADU type you're considering.

  - q: "What's the permit process for ADU construction in Ellensburg, and how long does it take?"
    a: |
      ADU permits for properties inside city limits go through the City of Ellensburg Building Division. Properties in unincorporated Kittitas County — including parcels in the 98934 zip near the Kittitas town boundary — go through Kittitas County Community Development Services (KCCDS), which has a separate application process and fee schedule. Both require a site plan with setback dimensions, foundation plan, floor plan, and utility connection details. Plan review runs 6–10 weeks in Ellensburg under normal queue conditions. WA HB 1337 (2024) prevents the city from denying a code-compliant ADU application, but incomplete submittals still get kicked back for revision, adding weeks. TopVolk prepares the full permit package as a WA Licensed Contractor and tracks the review through to final CO.

  - q: "DADU or attached ADU — which type makes more sense on an Ellensburg lot?"
    a: |
      It depends on lot size, existing structures, and how you plan to use the unit. For 98926-zip lots near CWU with a rear yard of 1,500+ sq ft, a DADU typically commands $75–$150/month more in rent than a comparable attached unit because tenants value the separation and privacy. Garage conversions are cheaper and faster to permit, but Ellensburg's cold winters mean insulation and mechanical costs close the gap significantly compared to western Washington conversions. Basement conversions work well in the 1960s–70s split-level stock common near downtown, but IRC egress window requirements add cost and complexity. The honest answer requires a site walkthrough — both options get evaluated at the free consultation before any design budget is committed.

  - q: "What warranty does TopVolk provide on ADU construction in Ellensburg?"
    a: |
      TopVolk provides a three-year workmanship warranty on all ADU builds — any defect in our work gets fixed at no charge. Structural components including the framing, foundation, and any LVL beam work carry longer coverage under Washington State construction defect law. Appliances from GE or Samsung carry their own manufacturer warranties, typically 1 year parts and labor. Mitsubishi mini-split systems carry a 12-year compressor warranty when registered. One more thing: deadline commitments are written into the contract with a financial penalty if we miss an agreed milestone — that's not a verbal assurance, it's a clause.

