  - q: "What does a full exterior wash cost in Ellensburg?"
    a: "A single driveway or fence wash typically runs $150-$300, while a full house package covering siding, walkways, and a deck or patio lands around $450-$650. Surface type drives most of the variation — pavers and stucco take longer than flat concrete or vinyl siding. Square footage, shade exposure near mature trees, and how long it's been since the last wash all factor into the final number. TopVolk quotes a line-item price on-site after walking the property, not a ballpark over the phone, and that number doesn't change once the contract is signed."
  - q: "Does power washing my house need a permit in Kittitas County?"
    a: "No permit is required for exterior pressure washing anywhere in Kittitas County or inside Ellensburg city limits — it's not a structural change, so there's nothing to file with the county. HOA rules are a different story in newer developments like Ironhorse and Brooklane, where covenants sometimes dictate wash frequency or approved cleaners, so checking that paperwork first avoids a dispute later. If a wash job uncovers rotten deck boards, damaged siding, or a ledger board connection that needs rebuilding, that follow-up work falls under WA Licensed Contractor scope and may need a building permit depending on the repair. TopVolk handles that transition without bringing in a separate company."
  - q: "What's the difference between soft washing and pressure washing for siding?"
    a: "High PSI is what makes pressure washing effective on concrete, but that same force can drive water behind Hardie panels or vinyl siding and crack caulk at the seams when it's used in the wrong place. Soft washing uses low pressure with a cleaning solution — usually a diluted bleach mix or a product like Wet & Forget — that breaks down algae and grime chemically before a gentle rinse. Siding, stucco, and painted surfaces get the soft-wash treatment here; driveways, walkways, and bare concrete get full pressure. Choosing wrong on an older farmhouse near downtown can push water into the wall cavity behind original siding."
  - q: "How long does a power wash last before it needs to be redone?"
    a: "A house wash in Ellensburg's dry climate typically holds up 18-24 months before noticeable buildup returns, longer than the annual cycle common on the wetter west side of the state. Fences and decks need rewashing whenever they're due for a fresh coat of stain, usually on that same 3-5 year cycle. TopVolk doesn't offer a fixed-term warranty on washing alone since regrowth depends on shade, irrigation overspray, and wind exposure unique to each lot, but the workmanship on the wash itself is guaranteed — streaking or missed spots get fixed at no charge within a few days of the job."
