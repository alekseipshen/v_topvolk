title: "Ellensburg Bathroom Remodel — Freeze-Thaw Tile Repairs & Shower Conversions"

intro: |
  Kittitas Valley winters hit bathroom tile harder than most homeowners expect. The freeze-thaw
  cycles from November through March crack grout joints, push wall tiles off substrate, and gap
  the caulk around tub surrounds — leaving water a direct path into the framing behind. Homes near
  Central Washington University and along the older streets of the Barge-Lincoln neighborhood were
  built in the 1940s through 1970s, and the original tile work has had decades of thermal stress
  with minimal updates. A Moen pressure-balance valve swap or a basic caulk re-do rarely addresses
  what's actually happening behind the wall. TopVolk Construction has completed 100+ remodels
  across the Seattle metro since 2017, and the east-of-Cascades pattern is consistent: the finishes
  look tired, but the substrate behind them is often compromised well before the surface shows it.
  Vladislav Volkov handles each consultation directly — call (206) 591-1096 to set up an on-site
  walkthrough before we talk numbers.

localContext: |
  Ellensburg's residential stock splits into two distinct eras. Older homes in zip code 98926 —
  particularly the blocks within walking distance of the CWU campus and the historic downtown
  district — date from 1910 through the 1950s. That means original cast-iron drain stacks, floor
  plumbing rough-ins that haven't moved in seventy years, and bathrooms designed around a claw-foot
  tub and a single fixture. Out toward the Canyon Road corridor and the subdivisions east of town,
  you're in 1980s-90s builder-grade territory — fiberglass tub surrounds, 4-inch wall tile set in
  organic mastic, and exhaust fans ducted straight into the attic. Rural properties around Kittitas
  (zip code 98934) share similar patterns with more variation in foundation type and crawlspace
  access. Ellensburg city limits fall under the City of Ellensburg Building Division for permits;
  work outside city limits goes through Kittitas County. Either way, plumbing relocation or
  structural changes require plan review and a rough-in inspection before walls close up.

commonProblems:
  - title: "Freeze-Thaw Grout and Tile Failure in Pre-1970s Bathrooms"
    description: |
      Mud-set tile work from the 1940s and 1950s — common in the older homes near downtown
      Ellensburg — holds reasonably well until freeze-thaw cycles start working on the grout joints
      from the inside. Water infiltrates, freezes overnight in an unheated bathroom, and pries tile
      off the mortar bed incrementally each winter. By the time a homeowner notices a loose tile
      near the tub lip, there's usually soft substrate behind the surrounding four or five tiles as
      well. The correct fix is a full demo of the affected field — not tile-over-tile — followed by
      cement board and a Schluter Kerdi waterproofing membrane before large-format porcelain goes
      up. Patching individual tiles in a compromised mud bed just relocates the failure point. For
      a typical Ellensburg bathroom with 40-50 sq ft of tile field, budget $6,000-$10,000 depending
      on tile selection and whether the existing drain rough-in needs to move.

  - title: "Cast-Iron Drain Stack Rerouting in Near-Campus and Downtown Homes"
    description: |
      Craftsman-era and early ranch homes in the 98926 zip — particularly west of Pine Street where
      post-and-pier foundations are common — frequently have cast-iron drain stacks that have been
      patched repeatedly or simply left alone since the 1950s. Cast iron corrodes from the interior
      wall. The drain flows until it doesn't, and by then there's a sewage leak inside a wall or
      subfloor. Rerouting a stack to accommodate a new walk-in shower layout or a relocated toilet
      requires scheduling the plumber during rough-in phase, before any cement board or RedGard
      waterproofing membrane goes up. On post-and-pier foundations, crawlspace access makes P-trap
      and horizontal drain work more manageable than on slab construction. Rough-in inspection
      through the City of Ellensburg Building Division happens before walls close — that sequencing
      protects both the homeowner and the permit record. Plumbing rough-in alone typically runs
      $1,500-$3,500 before tile work begins.

  - title: "Undersized Ventilation and Mold in 1980s-90s Canyon Road Subdivisions"
    description: |
      Ellensburg's climate is drier than Seattle's, but a bathroom generates steam regardless of
      what's outside. The exhaust fans installed in 1980s-90s construction along the Canyon Road
      corridor were frequently sized at 50 CFM in bathrooms that need 80-100 CFM, and most were
      ducted to terminate in the attic rather than through an exterior wall or roof cap. Trapped
      moisture grows mold on ceiling drywall and inside the exhaust housing within a few years.
      Before closing any ceiling in a remodel, we verify the duct run, upsize the fan if the CFM
      rating is inadequate, and terminate through a properly flashed exterior penetration. On shower
      walls, RedGard liquid waterproofing membrane applied over cement board — rather than a plastic
      vapor barrier stapled to studs — gives real substrate protection. The City of Ellensburg
      Building Division requires a mechanical permit for exhaust fan changes when they're part of a
      larger remodel scope; TopVolk, a WA Licensed Contractor, handles that permit application as
      part of the project package.

  - title: "Walk-In Shower Conversions in Tight Older Bathrooms"
    description: |
      Converting a tub-only bathroom to a curbless walk-in shower is the most common request we
      get on 98926 homes, especially from homeowners 55 and older planning for ADA accessibility.
      The constraint in older Ellensburg houses is that the original plumbing rough-in was designed
      around a tub drain positioned close to the wall — shifting to a linear drain or center drain
      requires relocating the drain point and confirming the floor joists can accommodate blocking
      for a new mud bed. A Schluter Kerdi shower system with a Kerdi-Line linear drain handles the
      slope geometry cleanly in these tight layouts. Niche and bench framing gets roughed in before
      tile selection so dimensions are fixed early, not retrofitted around finished work. Total
      project cost for a full tub-to-shower conversion in an Ellensburg home typically runs
      $8,500-$15,000 depending on tile grade, fixture package, and whether any load-bearing wall
      coordination is required.

  - title: "Builder-Grade Vanity and Fixture Replacement in 1980s-90s Homes"
    description: |
      The subdivisions east of downtown Ellensburg built in the 1980s and 1990s shipped with
      fixtures now 30-40 years past their design life — Whirlpool or builder-grade toilets running
      constantly due to worn flappers, 48-inch vanities with particleboard boxes swollen from
      humidity, and hollow-core cabinet doors that won't close square. A quartz vanity top with a
      Kohler undermount sink and a Moen single-hole faucet is a meaningful cosmetic upgrade that
      holds up far better than the laminate countertop it replaces. Full vanity replacement with a
      semi-custom cabinet box, quartz top, undermount sink, and new supply lines runs $2,500-$5,500
      installed when the rough-in locations stay put. No structural permit is required in Ellensburg
      for like-for-like fixture swaps with no plumbing relocation — it's a building permit or
      sometimes no permit at all for purely cosmetic scope. Vladislav walks through the exact permit
      requirement during the on-site assessment so there are no surprises later.

faq:
  - q: "How fast can you get to Ellensburg for a bathroom remodel consultation?"
    a: |
      Ellensburg sits roughly 100 miles east of Seattle on I-90 — about 1.5 hours in normal
      conditions, longer when Snoqualmie Pass has weather. Site visits to Kittitas County are
      scheduled by appointment, typically within one to two weeks of first contact. The on-site
      walkthrough covers substrate condition, drain locations, ventilation, and a realistic scope
      and budget range before any commitment is made. Call (206) 591-1096 to get on the calendar.
      For larger projects — full gut remodels or walk-in shower conversions — we plan Kittitas
      County visits in clusters to keep logistics efficient.

  - q: "What does a bathroom remodel in Ellensburg cost?"
    a: |
      A cosmetic refresh — new vanity, toilet, tile surround, and fixtures with no plumbing
      relocation — typically runs $6,000-$12,000. A full gut remodel with shower conversion, new
      tile throughout, and ventilation upgrade is more commonly $12,000-$25,000. Projects involving
      structural wall removal, drain relocation, or ADA layout reconfiguration go higher from there.
      Pricing depends on tile grade, fixture selection, and whether the existing drain rough-in can
      stay in place. TopVolk provides line-item quotes — not vague ranges — after the on-site
      assessment. Call (206) 591-1096 or schedule a free on-site consultation to get an actual
      number attached to your specific bathroom.

  - q: "Do you pull permits for bathroom remodels through the City of Ellensburg?"
    a: |
      Yes. Remodels involving plumbing relocation, structural changes, or exhaust fan upgrades
      require permits through the City of Ellensburg Building Division for in-city work, or Kittitas
      County for properties outside city limits. TopVolk is a WA Licensed Contractor and handles
      the permit application, required drawings, and inspection scheduling through the appropriate
      AHJ — homeowners don't manage that paperwork themselves. Plan review for a standard bathroom
      remodel in Ellensburg typically takes 2-4 weeks, which gets built into the project timeline
      upfront so the schedule accounts for it from day one.

  - q: "What waterproofing system do you use in walk-in showers?"
    a: |
      For walk-in showers, Schluter Kerdi membrane bonded to cement board is standard — not a
      plastic vapor barrier stapled to studs, which fails within a few years under real shower
      conditions. In bathrooms where existing framing shows any moisture history, a RedGard liquid
      waterproofing membrane goes on as a secondary layer at the curb or curbless threshold and
      at the floor-to-wall transition. Shower niches and bench surfaces get full Kerdi wrap before
      tile goes up. Curbless configurations — common in ADA retrofits — use a Schluter Kerdi-Line
      linear drain to handle the floor slope cleanly. The substrate work determines whether a
      remodel holds for 20 years or starts leaking in five.

  - q: "How long does a bathroom remodel take from start to finish in Ellensburg?"
    a: |
      A vanity-and-tile refresh with no plumbing moves takes 2-3 weeks on-site. A full shower
      conversion with new tile throughout typically runs 4-6 weeks once materials are staged and
      on-site. Add 2-4 weeks before demo starts if the project requires permit plan review. That
      permit lead time gets built into the schedule upfront — not discovered mid-project. The blue
      tape walkthrough happens before final cleanup: Vladislav walks through with you, you mark
      anything on the punch list, and those items are completed before the final inspection is
      requested. Deadline penalties are written into the contract — missed completion dates have
      a real cost to us, not just an apology.

  - q: "Do you serve areas outside Ellensburg in Kittitas County?"
    a: |
      Kittitas Valley coverage extends to Cle Elum, Kittitas, Thorp, and rural properties along
      the I-90 corridor — all handled by appointment. For larger remodel scopes starting at
      $15,000 or more, travel logistics fold into the project cost cleanly. TopVolk has completed
      100+ projects since 2017 across the greater Seattle metro, and the same approach applies
      regardless of county: owner-led work, direct communication with Vladislav, and written
      commitments on timeline. Call (206) 591-1096 to discuss your project location and get
      a consultation scheduled.