title: "Marysville Door Installation — Entry, Patio & Interior Doors"

intro: |
  Smokey Point subdivisions built through the late 1990s packed Marysville with
  builder-grade steel entry doors — thin polystyrene cores, no pan flashing, frames
  that fail after a decade of Snohomish County rain. Homeowners who just upgraded
  to a Bosch induction range or Sub-Zero fridge tend to notice the front door next.
  Most replacements we handle in 98270 swap in a Therma-Tru fiberglass unit with
  a sill pan membrane, new exterior casing, and a threshold assembly that actually
  seals.

localContext: |
  The streets off 4th Street in downtown Marysville have 1960s and 70s ramblers
  with original wood-frame door openings — frames that absorbed forty years of
  moisture and often need the rough opening rebuilt before a new unit goes in.
  Comeford Park sits a few blocks east of where several of those older homes are
  clustered, and the condition of the original door framing on that side of town
  reflects decades of north-facing exposure to Snohomish County's annual 38 inches
  of rain. Smokey Point and the newer subdivisions along 88th Street NE in 98271
  are mostly 1995-2010 builds with aluminum-clad sliders and basic steel entry
  doors. Soper Hill Road corridor developments from the early 2000s fall in that
  same category — builder-grade everything, just newer builder-grade. Both eras
  share the same root problem: inadequate flashing at the door-to-wall junction
  and weatherstripping that compressed flat years ago.

commonProblems:
  - title: "Builder-Grade Steel Doors Losing Seal After 15+ Years"
    description: "Most late-90s tract builds in Marysville used steel doors with polystyrene
      cores — R-4 to R-5 at best, and that degrades as the skin separates at the
      corner welds. Threshold sealing fails first, letting moisture under the door
      and onto the subfloor. A Therma-Tru Smooth-Star fiberglass unit, flashed with
      a proper sill pan membrane and drip cap, runs R-6 to R-8 and handles Snohomish
      County's 38-inch annual rainfall without rotting the framing below."

  - title: "Patio Sliders With Failed Roller Assemblies and Cold Aluminum Frames"
    description: "Aluminum-framed sliding doors common in 1980s Marysville homes — especially
      near the older Cedarcrest area — use nylon roller assemblies that wear down
      and cause the panel to drag or derail off the track. Beyond the mechanical
      failure, aluminum frames conduct cold directly into the room. Upgrading to a
      Milgard Thermally Improved or Pella 350 Series multi-slide system requires
      a structural header check first to confirm the opening can carry the new unit's
      span and weight."

  - title: "Door Swing Conflicts and Undersized Headers in ADU Conversions"
    description: "Marysville homeowners converting garages or basement spaces under WA HB 1337
      — the 2024 statewide ADU law allowing up to two ADUs per single-family lot —
      regularly hit door swing conflicts and undersized headers. Adding a new exterior
      opening means confirming the AHJ (Snohomish County PDS) permit requirement,
      sizing an LVL beam for the header, and scheduling a rough-in inspection before
      closing up the framing. Skipping that step fails final inspection."

