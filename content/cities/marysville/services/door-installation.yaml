  - q: "What entry door brands do you install, and is fiberglass worth the cost over steel?"
    a: "Therma-Tru, Pella, and Milgard are the brands we install most often in Marysville.
      Fiberglass is almost always worth it here — it doesn't dent, doesn't rust at
      the edges, and holds its R-value over time. Steel is cheaper upfront but
      typically shows weather damage within 10-15 years in Snohomish County. TopVolk
      is WA Licensed Contractor, 100+ projects completed since 2017."

  - q: "Do door installations in Marysville require a Snohomish County permit?"
    a: "Straight replacement in an existing opening — same size, same location —
      typically doesn't require a permit under Snohomish County PDS rules. Enlarging
      the rough opening, adding a new exterior door, or modifying a load-bearing
      header does. PDS plan review for structural work runs 4-8 weeks. Call
      (206) 591-1096 and we'll confirm what your project requires before work starts.
      Deadline penalty terms are written into every contract."