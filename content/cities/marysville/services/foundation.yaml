title: "Marysville Foundation Repair — Stillaguamish Lowland Soils"

intro: |
  Stillaguamish River delta soils run beneath the 98270 zip code in ways that make
  foundation work here different from hillside neighborhoods in Everett or Mukilteo.
  Homes near Jennings Memorial Park and the older blocks off Grove Street sit on soft,
  saturated lowland fill — the kind that shifts unevenly through wet winters. A Zoeller
  sump pump in the crawlspace buys time, but if the posts and piers are already racked
  or rotting, the pump isn't solving the actual problem.

localContext: |
  Downtown Marysville's older grid — zip code 98270 — holds a mix of 1920s-1940s
  Craftsman homes and postwar ranchers built on post-and-pier foundations before modern
  seismic standards were codified. The 98271 zip code pushes into 1980s-2000s suburban
  tracts, but properties along low-lying drainage corridors still deal with saturated
  soils and crawlspace moisture year-round. Foundation work in Marysville city limits
  goes through the city's own building department; unincorporated parcels nearby fall
  under Snohomish County PDS — different permit portals, different plan review timelines.

commonProblems:
  - title: "Post-and-Pier Settlement on Waterlogged Crawlspace Soils"
    description: |
      Homes in 98270 near the Stillaguamish lowlands often have wood posts sitting on
      concrete pads — or worse, on pressure-treated lumber pads set in saturated soil
      that's been moving for decades. As the ground shifts seasonally, those posts rack
      and tilt, pulling the rim joist off level and leaving floors that roll underfoot.
      Fixing it means shimming or replacing posts, installing adjustable steel columns,
      and correcting the drainage issue that caused the settlement. You can't just shim
      and walk away if the water problem is still there.

  - title: "Seismic Retrofit on Pre-1975 Foundation Mudsills"
    description: |
      Marysville's Craftsman bungalows and mid-century ranchers built before Washington
      codified seismic provisions often have mudsills sitting loose on concrete stem walls
      — no anchor bolts, nothing holding the house down laterally. A seismic event slides
      the structure right off its foundation. Mudsill bolting with Simpson Strong-Tie
      anchor hardware plus shear wall plywood panels per current IRC seismic provisions
      is permit-required work. Marysville's building department requires plan review and
      rough-in inspection before any of that work gets covered up.

  - title: "Concrete Crack Propagation and Epoxy Injection Failures"
    description: |
      Poured concrete foundation walls in 98271's 1980s-90s tract neighborhoods develop
      hairline cracks as soils move through the freeze-thaw cycles that hit the foothills
      east of town — Granite Falls, Lake Stevens — and the drainage effects travel back
      west into flatter ground. Left alone, those cracks channel water into the crawlspace
      or slab. Epoxy injection seals active cracks structurally, but step cracking at
      mortar joints or bowing walls means the crack is a symptom, not the cause — and
      a single injection won't hold long-term without addressing the lateral soil pressure.

