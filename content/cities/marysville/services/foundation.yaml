  - q: "Do you use helical piers or push piers for underpinning in Marysville's soft soils?"
    a: |
      Both methods are on the table depending on soil profile and structural load. Helical
      piers — essentially large screws driven into stable soil below the saturated deltaic
      layer — work well under Stillaguamish lowland conditions. Push piers suit heavier
      loads on more rigid structures. Vladislav does a soil and load assessment on-site
      before recommending either; no method gets specified until the foundation is
      physically inspected. Call (206) 591-1096 to schedule that visit.

