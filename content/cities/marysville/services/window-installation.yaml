title: "Marysville Window Installation — Rain, Noise & Energy Code"

intro: |
  Along the 98270 corridor between downtown Marysville and Soper Hill Road, two completely
  different housing eras sit side by side. The post-war bungalows near Grove Street are running
  original aluminum single-panes — condensation tracks down the frames every October. Newer
  Lakewood-area builds from the early 2000s have builder-grade vinyl that's reached end-of-life.
  Milgard's Tuscany and Style Line series handle both scenarios, and we've installed them on
  projects across both sides of the city.

  Marysville's position in the Snohomish lowlands matters. Annual rainfall here edges past
  Seattle's 37 inches — and prevailing moisture hits north-facing elevations hard from October
  through April. Window flashing details aren't optional in that climate. They're the difference
  between a 20-year installation and a rot call five years out.

localContext: |
  Snohomish County PDS handles permitting for Marysville — straightforward over-the-counter
  approval for direct replacements, longer review if you're adding a new opening or expanding
  egress in a basement bedroom. Structural modifications typically take 3-6 weeks through PDS
  plan review. Zip codes 98270 and 98271 span properties from 1950s ranch-styles near downtown
  to late-1990s tract homes off SR-528. Wood rot at window rough openings is common here.

  Some of the 1960s ranchers near 4th Street still have original aluminum frames set in brick
  mold with no sill pan flashing at all — just caulk over building paper. When that caulk
  cracks, water tracks directly into the OSB sheathing and sits there through the wet season.
  You don't see it until interior drywall bubbles or trim pulls away from the wall. By that
  point the king studs need sistering, and the rough opening has to be rebuilt before any new
  unit goes in. That's true for 98270 and 98271 alike — the soil saturation near the Ebey
  Slough watershed keeps moisture levels elevated year-round.

  Marysville sits close enough to the Puget Sound lowlands that annual rainfall exceeds
  Seattle's average. Frames without proper sill pan flashing fail faster than most homeowners
  expect. That's not a scare line — it's a pattern we've seen repeatedly on projects across
  the north end of the county.

commonProblems:
  - title: "I-5 Road Noise Through Standard Double-Pane Units"
    description: "Homes within a half-mile of I-5 in 98270 get significant highway noise through
      standard double-pane IGU windows. Acoustic laminated glazing cuts transmission by 5-8
      additional STC points over a conventional unit. Milgard and Pella both offer laminated
      glass upgrades in their Essence and Encompass lines — worth speccing for anything near
      the SR-528 interchange or the I-5 ramp corridors through town. One project near State
      Avenue went from constant road hum to quiet bedrooms after swapping to acoustic lites —
      same rough opening, different glass spec. The acoustic upgrade adds cost, but it's
      measurable the day you close the new unit for the first time."

  - title: "Egress Window Compliance in Older Basement Bedrooms"
    description: "IRC Section R310 requires a minimum 44-inch clear opening height and 5.7
      square feet net clear area for sleeping-room egress windows. Older 1960s ranchers near
      Grove Street commonly have small hopper or casement units in basement bedrooms — code
      violations if the space is permitted as living. Expanding the rough opening means new
      king studs, a properly sized header (LVL beam for anything over 4 feet of span), and a
      Snohomish County PDS permit before work starts. The AHJ will call for a rough-in
      inspection before drywall goes back up. Skipping the permit creates a disclosure
      problem at resale and can void homeowner's insurance coverage for that space."

  - title: "Flashing Failures and Hidden Rot at the Rough Opening"
    description: "Seattle Energy Code requires a continuous air barrier at window perimeters,
      but the bigger failure mode in Marysville is water intrusion from missing sill pan
      flashing. When the original installer skipped self-adhered membrane at the sill, OSB
      sheathing and king studs rot from the inside — invisible until you pull the trim. Proper
      retrofit laps peel-and-stick membrane over the housewrap before any Pella or Marvin unit
      drops in. On Hardie-sided homes in 98271, we also check head flashing termination at the
      Z-flashing lap — a common miss on mid-2000s tract construction that lets water bypass the
      drainage plane entirely and pool behind the cladding."

