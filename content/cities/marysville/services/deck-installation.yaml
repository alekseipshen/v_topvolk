title: "Marysville Deck Installation — Snohomish County, Done Right"

intro: |
  Homes off 67th Ave NE near Jennings Park (98270) were built 1995-2010, and original builder-grade PT lumber decks are hitting end of life. Snohomish County averages 40+ inches of rain annually — flat lots near Ebey Slough hold moisture that hillside yards shed naturally. Deck posts rot from the bottom when footings miss frost line. TopVolk Construction (WA Licensed Contractor) has completed 100+ projects since 2023. Vladislav Volkov leads every job directly — no middlemen.

localContext: |
  Marysville's 98271 zip leans toward 1980s-2000s ranchers and two-story colonials in planned subdivisions — the Grove neighborhood, corridors off Smokey Point Blvd. These homes typically have 10x12 or 12x16 builder decks: inadequate ledger flashing, no joist blocking, posts set without proper footings. Permit applications in the City of Marysville go to the city's own permit center, not Snohomish County PDS — a detail that trips up contractors unfamiliar with this area.

commonProblems:
  - title: "Ledger rot from missing flashing — the most common deck failure in 98270"
    description: "The ledger board attaches the deck to the house rim joist. Without a proper flashing membrane and weep screed at the top edge, water migrates behind the ledger through every rain season. On Marysville homes with Hardie siding or wood lap siding from the late 1990s, this goes unnoticed until the rim joist and band joist inside the wall cavity are already compromised."
  - title: "Post footings that miss frost depth in Snohomish County"
    description: "Frost line in this part of Snohomish County runs 12-18 inches. Contractor-poured tube footings from the 1990s often stop at 8-10 inches — frost heave shifts the post base, tilts the beam, stresses the joist hangers. Simpson Strong-Tie post bases require solid, stable bearing to perform as rated. A moving footing defeats the hardware entirely."
  - title: "Cedar vs. composite: getting the material call right for Marysville's exposure"
    description: "Cedar decking grays and mosses out fast on north-facing exposures — common on lots in Marysville's east-west oriented subdivisions. Trex Transcend and TimberTech Azek hold color without annual sealing and resist the mold cedar absorbs over time. The material cost gap closes when you factor in two re-seal cycles and a cedar replacement at year 15."

