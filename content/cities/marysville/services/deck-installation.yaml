  - q: "Trex or TimberTech — which composite holds up better on a Marysville deck?"
    a: "Both perform well in PNW conditions. Trex Transcend runs slightly less expensive; TimberTech Azek is denser and more resistant to surface scuffing. The bigger variable is your deck's sun exposure. Vladislav walks through both options with samples on-site — no pressure, just the actual tradeoffs."
  - q: "What does a deck permit cost and how long does it take in Marysville?"
    a: "City of Marysville permit fees vary by project valuation — typically $800-$1,800 for a standard deck. Plan review runs 3-6 weeks. We handle the application, ledger flashing inspection, and final inspection. Full project timeline: 2-3 weeks of construction once permits clear. Deadline written into the contract."