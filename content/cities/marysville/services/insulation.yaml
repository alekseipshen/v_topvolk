title: "Marysville Insulation — R-49 Attic Upgrades & Crawl Space Encapsulation"

intro: |
  Attic access panels in Marysville's older ranch homes near downtown reveal the same
  picture — original kraft-faced R-11 or R-19 batts, partially sagging from the
  rafters, some missing entirely where a plumber ran pipe two decades ago and never
  patched back. That's before the crawl space. Homes in 98270 built before 1980
  rarely have a vapor barrier worth keeping, and Snohomish County's wet season turns
  a damp, unencapsulated crawl into a mold incubator by February. A Mitsubishi
  mini-split conditioning a leaky envelope loses a third of its efficiency advantage
  before it even hits the living room. TopVolk — WA Licensed Contractor, 100+ projects
  since 2023 — handles full insulation scopes from attic to crawl space as part of
  renovation work across Marysville and north Snohomish County.

localContext: |
  The 98270 zip covers Marysville's older downtown core — 1950s and 60s ranchers, the
  occasional 1940s two-story within walking distance of Jennings Park — alongside the
  80s and 90s tract subdivisions that pushed east toward I-5. Both eras share the same
  gap: insulation spec'd to the code year it was built, never revisited. The 98271 zip
  extends into newer construction east of Alder Avenue where energy code compliance is
  current, but poorly air-sealed rim joists and knee walls still show up routinely in
  pre-remodel walkthroughs. Snohomish County PDS handles permits for this area — plan
  review for crawl space encapsulation with structural scope typically runs 3-6 weeks.

commonProblems:
  - title: "Compressed attic batts performing at R-12 in 1960s Marysville ranchers"
    description: "Fiberglass batts from the 1960s and 70s lose R-value as they compress —
      a home near Jennings Park with original R-19 installation is realistically
      delivering R-12 or lower after 50 years of moisture cycling and settling. Blown-in
      cellulose over the existing layer brings attic depth to R-49, which meets current
      Washington State Energy Code minimums. Owens Corning blown-in holds density better
      in attic applications than loose-fill fiberglass. PSE rebates on qualifying attic
      upgrades run up to $0.30 per square foot and apply to most Marysville properties
      on Puget Sound Energy service."

  - title: "Crawl space moisture with no vapor barrier — standard in 98270 pre-1980 builds"
    description: "Marysville receives roughly 33 inches of rain annually, and
      unencapsulated crawl spaces under older homes show active condensation on joists,
      degraded blocking, and kraft-faced batts pulling away from the subfloor. Full
      encapsulation means 20-mil polyethylene vapor barrier sealed to the stem walls,
      rigid foam on foundation walls, and closed-cell spray foam on the rim joist for
      continuous air sealing around the perimeter. That combination stops the moisture
      pathway at the foundation rather than managing symptoms above it."

  - title: "Rim joist air leakage in 1980s-90s tract construction east toward I-5"
    description: "Tract homes built in Marysville through the 80s and 90s typically have
      rim joists stuffed with a loose fiberglass batt — which does nothing for air
      infiltration at that location. Two inches of closed-cell spray foam on the rim
      joist delivers R-13 plus a continuous air barrier in spaces too tight for batted
      alternatives. CertainTeed mineral wool is a valid option where fire separation is
      required between floors during a remodel scope. Either way, rim joist air sealing
      returns more energy savings per dollar than almost any other single insulation
      upgrade in a crawl space envelope."

