title: "Marysville Fence Installation — Cedar, Vinyl, Posts Done Right"

intro: |
  Subdivisions off Soper Hill Road and along the 88th Street NE corridor in 98270
  have expanded fast — and a lot of the builder-grade wood fences installed between
  2003 and 2012 are already leaning or rotting at the base. One homeowner near
  Jennings Memorial Park had us build a cedar privacy fence to frame a backyard she'd
  upgraded with a Trex composite deck and a Bosch outdoor kitchen station. That project
  started with a survey review — three posts needed repositioning on a grade change nobody
  had marked. Post-setting depth in Snohomish County's clay-heavy soil is what separates
  a fence that holds 20 years from one you'll pull out in eight.

localContext: |
  Most of 98270 and 98271 is 1990s through 2010s residential — two-story tract homes
  and split-levels on standard lots, with older farmhouse parcels north toward Tulalip
  and newer construction along the 156th Street NE corridor. Property lines aren't always
  where homeowners assume, especially on corner lots where original survey stakes are
  long gone. Snohomish County PDS requires a building permit whenever fencing ties into
  a retaining wall over 4 feet — that threshold catches people off guard on the sloped
  lots east of I-5. Confirming the property survey before installation is how every
  TopVolk fence project starts.

commonProblems:
  - title: "Post Rot from Clay Soil and Year-Round Moisture"
    description: |
      Cedar and fir posts set in Marysville's clay-heavy ground without UC4B-rated
      pressure-treated (PT) lumber will rot from the base within 5-8 years. Rain runs
      October through May, and clay retains moisture long after the weather breaks.
      PT 4x4 posts set 30-36 inches deep with compacted gravel for drainage hold through
      Snohomish winters — the same spec we use under Trex and TimberTech composite panel
      installations. Skip this step and you're looking at leaning posts within a decade.

  - title: "Permit Traps on Sloped Lots in 98270"
    description: |
      Snohomish County PDS requires a building permit whenever fencing attaches to or
      functions as a retaining wall over 4 feet. That threshold comes up constantly on
      the sloped lots east of I-5 in Marysville — more lots than people expect sit on
      grade transitions. Missing the permit can mean a stop-work order and forced removal.
      Vladislav pulls all required Snohomish County PDS permits before the first post goes
      in; plan review on fence-and-wall combinations typically runs 2-4 weeks.

  - title: "Cedar Weathering vs. Vinyl Durability in 35-Inch Annual Rainfall"
    description: |
      Cedar looks natural and holds fasteners cleanly, but north-facing runs in Marysville
      go gray-black within two seasons without annual sealing. CertainTeed vinyl fencing
      won't rot or discolor regardless of exposure, but it flexes in wind differently
      than wood and reads as a different aesthetic. Lot orientation, sun exposure, shared
      property line agreements, and how much maintenance you want all factor into which
      material is actually the right fit here.

faq:
  - q: "How fast can you get to Marysville for fence installation?"
    a: |
      Travel from South Snohomish to 98270 typically runs 30-40 minutes — TopVolk works
      Snohomish County regularly and is often already in Everett or Lynnwood for other
      projects. Call (206) 591-1096 to schedule a site visit; fence consultations usually
      land within a week.

  - q: "Do you install composite fencing like Trex or TimberTech, not just cedar?"
    a: |
      Yes. Trex Seclusions and TimberTech composite panel systems work well for homeowners
      who want zero maintenance or who want fencing that matches an existing composite deck.
      Both hold up in PNW rain without annual sealing or staining. Vladislav walks through
      cost comparisons vs. cedar on-site so you can see the real difference.

  - q: "What does fence installation typically cost in Marysville, and how does pricing work?"
    a: |
      A 100-linear-foot cedar privacy fence with PT posts, 6-ft panels, and one self-closing
      gate runs roughly $4,000-$6,500 installed in 98270. Grade changes and additional gates
      add to that. Vladislav provides a line-item quote after the on-site visit — no vague
      ranges, no add-ons that surface later. TopVolk is a WA Licensed Contractor with
      100+ projects completed since 2017, and deadline penalties are written into every
      contract.