title: "Marysville Bathroom Remodel — Permits, No Surprises"

intro: |
  Jennings Park sits a few blocks from downtown Marysville, and the
  subdivisions spreading east toward SR 9 in the 98271 zip tell a consistent
  story: late-1990s and early-2000s builder-grade bathrooms, Moen fixtures,
  4x4 ceramic tile, fiberglass surrounds. At 25 years old, those materials
  are at the end of their lifecycle. Grout cracks, water migrates behind the
  wall, and Snohomish County's 37-plus inches of annual rain makes the damage
  compound faster than you'd expect.

localContext: |
  Most of Marysville's 98270 and 98271 housing stock went up between 1995 and
  2010 — tract development that prioritized square footage over finish quality.
  The older blocks near downtown still have some 1960s and 1970s ranchers with
  original cast-iron drain stacks and galvanized supply lines. Both eras have
  problems. Newer builds need complete waterproofing overhauls; older homes
  often need plumbing rerouting before any tile work can start.

commonProblems:
  - title: "Failed Fiberglass Surrounds and Delaminating Tile in 98271 Tract Homes"
    description: |
      Builder-grade fiberglass surrounds from the late 1990s weren't designed
      to last 25 years in PNW humidity. When they flex and crack at the seams,
      water gets behind them — straight into the framing. The fix isn't a new
      surround. It's demo to the studs, Schluter Kerdi waterproofing membrane
      over cement board, then a proper tile install with Schluter strip
      transitions at curbs and shower niches.
  - title: "Undersized Exhaust Fans Feeding Mold Regrowth After Remodel"
    description: |
      A lot of Marysville bathrooms run 50 CFM exhaust fans — undersized for
      anything beyond a small half-bath. Mold pressure from October through May
      in Snohomish County is constant. After a remodel, we spec 110 CFM fans
      with integrated humidity sensors and verify the exhaust duct terminates
      at the exterior wall, not into the attic where moisture just
      redistributes into the framing.
  - title: "Cast-Iron Drain Stack Rerouting in Older Downtown-Area Homes"
    description: |
      Homes built in the 1960s near downtown Marysville often have cast-iron
      drain stacks corroded at the joints. Converting a tub-only bathroom to a
      curbless walk-in shower means relocating the drain. That cast-iron-to-PVC
      transition has to be done right — a bad joint at that connection causes a
      slow leak inside the floor for months before it surfaces downstairs.
      Kohler linear drains tie into PVC cleanly once the old stack is cut back
      to solid material.

faq:
  - q: "How fast can you get to Marysville for a bathroom remodel consultation?"
    a: |
      Marysville is about 35 minutes via I-5 north. Free on-site consultations
      run Tuesday through Saturday — Vladislav comes out, not a salesperson.
      100+ projects completed across Seattle Metro since 2017. Typically
      available within 5-7 business days. Call (206) 591-1096 to schedule.
  - q: "What tile and fixture brands do you work with for Marysville bathroom remodels?"
    a: |
      Commonly spec Kohler and Moen plumbing fixtures, Schluter Kerdi and
      DITRA waterproofing membranes, and large-format porcelain from local
      suppliers. For quieter exhaust ventilation, Bosch units perform well in
      PNW humidity. Frameless glass enclosures come from Snohomish County-area
      glazing subs we've coordinated with on multiple projects.
  - q: "What does the permit process and timeline look like for a Marysville bathroom remodel?"
    a: |
      Structural changes, plumbing reroutes, and electrical work require a
      permit through the City of Marysville — not Snohomish County PDS, since
      Marysville is incorporated. Plan review typically runs 2-4 weeks. As a
      WA Licensed Contractor, TopVolk pulls all permits, schedules rough-in and
      final inspections, and builds the calendar around that. Missed milestones
      trigger a penalty paid by us — written into the contract. Full bath
      remodels run 4-6 weeks from permit approval to punch list completion.