title: "Marysville Painting — Cedar & Hardie Repaint, Lead-Safe Prep"

intro: |
  Ranch homes along the older blocks off State Avenue and around Comeford Park are
  hitting their repaint cycle — cedar shake weathered gray, Hardie cement-board showing
  chalky residue after years of Snohomish County rain. Many of these houses in 98270
  were built before 1978, which means EPA RRP lead-paint testing comes before any
  sanding or power washing. Homeowners who just installed Bosch or KitchenAid
  appliances during a kitchen remodel often find the surrounding cabinetry looks
  a decade behind — we handle that side too. Vladislav schedules on-site estimates
  directly; no sales rep, no call center relay. Call (206) 591-1096 to get on the calendar.

localContext: |
  Marysville's housing splits clearly: older ranch-style homes from the 1960s-70s in
  the downtown core (98270), and newer subdivisions pushing east toward the 98271 zip.
  The older stock is the complicated part — pre-1978 construction makes lead paint
  a realistic concern, and cedar siding from that era has survived 40+ Pacific
  Northwest winters. Most interior and exterior painting doesn't require a permit
  through the City of Marysville's building department, but EPA RRP compliance
  is mandatory on any pre-1978 surface disturbance, no exceptions.

  The 98271 side tells a different story. Subdivisions built through the 1990s and
  early 2000s off 64th Street NE and around Quilceda Creek used builder-grade flat
  latex on interior walls — paint that scuffs, won't wipe clean, and starts yellowing
  on south-facing trim within 10-15 years. Repainting with a quality eggshell or
  satin sheen is a straightforward upgrade. It changes how a room feels without
  touching a single cabinet or floor.

commonProblems:
  - title: "Pre-1978 Lead Paint on Cedar and Hardie Siding in the Downtown Core"
    description: |
      EPA RRP rules apply any time you disturb painted surfaces on homes built before
      1978. Marysville's older blocks near State Avenue and along Ebey Slough carry
      multiple layers of lead-containing paint on original siding. We test before any
      prep work begins. Dust containment, certified disposal, and negative-air-pressure
      work zones where required follow federal RRP protocols through the full job.
      Cutting corners on containment isn't just an EPA violation — it's a liability
      that follows the homeowner on resale disclosure. The testing and protocol add
      days to the schedule, but they're non-negotiable on pre-1978 surfaces.

  - title: "Cedar Shake Moss and Mildew Between Repaint Cycles"
    description: |
      Cedar shake handles Pacific Northwest weather — until north-facing walls don't.
      Marysville gets roughly 35 inches of rain annually; that moisture drives mildew
      into paint film on shaded elevations faster than most homeowners expect. Repaint
      cycles run 5-7 years on north and west sides. Correct sequence: power wash with
      mildewcide, dry fully, oil-penetrating primer, then two coats exterior acrylic
      latex. Skipping prime is how early failures happen. On bare or raw cedar,
      back-priming any replacement shakes before they go up prevents tannin bleed
      that discolors the topcoat within a season. It's an extra step most painters
      skip. We don't.

  - title: "Cabinet Refinishing After Kitchen Remodels"
    description: |
      After a kitchen remodel — new counters, a Bosch or KitchenAid range, fresh
      backsplash tile — the original cabinet faces look out of place. Full replacement
      runs $15K-$45K. Sprayed waterborne alkyd or conversion varnish costs a fraction
      of that and holds up to daily use. Sand, de-gloss, prime, and spray — no brush
      marks, no roller texture, just a clean factory-smooth surface coat. Door boxes
      get removed, sprayed flat in a controlled environment, and rehung after cure.
      In-place spray masking works for face frames. Either way, the kitchen doesn't
      get shut down for weeks.

faq:
  - q: "How fast can you get to Marysville for a painting estimate?"
    a: |
      TopVolk serves Marysville regularly — up I-5 from Seattle, roughly 40 minutes
      from Northgate. On-site estimates usually schedule within 3-5 business days.
      WA Licensed Contractor, 100+ projects completed since 2017. Call (206) 591-1096
      and you'll talk directly with Vladislav, not a sales rep.

  - q: "Do you work on both Hardie cement-board and cedar shake exteriors?"
    a: |
      Yes. Hardie takes a 100% acrylic latex primer system; cedar often needs an
      oil-based penetrating primer first to seal tannins before topcoating with
      CertainTeed or equivalent acrylic finish coats. Different siding, different prep
      spec — we follow manufacturer warranty requirements on both. Mixing up the
      systems is what causes adhesion failures within two years. If the existing
      Hardie paint is chalking badly, a bonding primer goes on before any topcoat.
      Skipping that step and painting over chalk is a common shortcut that fails by
      the second winter.

  - q: "What's a realistic timeline and cost for an exterior repaint in Marysville?"
    a: |
      A 2,000 sq ft ranch — power wash, prime, two acrylic coats — runs 5-8 work
      days on the exterior. Interior whole-house repaint on a similar footprint is
      typically 4-6 days depending on ceiling height and trim complexity. Snohomish
      County spring rain fills scheduling fast; booking 3-4 weeks out is realistic
      April through June. Deadline penalties are written into the contract.
      Vladislav provides a line-item quote on-site, not a vague range. Call
      (206) 591-1096 to get on the calendar.