title: "Marysville Basement Finishing — Waterproof Before Drywall"

intro: |
  Soper Hill and the Smokey Point corridor in 98270 are loaded with 1990s and early-2000s homes that have full unfinished basements — mostly poured concrete, sitting on flat Snohomish River delta terrain where the water table sits just a few feet down. Walked one in Jennings Park last fall where the homeowners had already set a Bosch heat pump water heater in the corner but left 850 square feet of raw slab untouched. Getting that space livable starts with a perimeter drain and vapor barrier, not framing walls.

  Vladislav Volkov has completed 100+ projects across Snohomish and King counties since 2017. WA Licensed Contractor. Direct line: (206) 591-1096.

localContext: |
  Marysville's biggest residential build-out happened 1985 through 2005 — ranch-style homes and two-story colonials spread across 98271 neighborhoods like Marshall and Alderview, most with poured concrete foundations on relatively flat lots that don't drain fast. The older downtown stock near Grove Street runs 1960s to early-1970s: partial basements, low headroom, single-pane windows that haven't been touched since Carter was president. Either vintage comes with the same PNW reality — 37-plus inches of annual rainfall and a shallow water table that makes itself known every October.

  Flat lot drainage isn't theoretical here. These Marysville basements stay damp nine months a year unless you address subslab moisture before touching drywall or flooring.

commonProblems:
  - title: "Perimeter Moisture Before Any Framing Starts"
    description: |
      On flat Marysville lots near the Snohomish River plain, subslab moisture wicks through poured concrete even without visible water. Framing directly against a wet foundation wall is a mold problem waiting to happen.

      The fix is a perimeter drain channel tied to a sump pump, DriCore subfloor panels over the slab to create an air gap, and RedGard membrane on any wall that shows efflorescence. That work happens before a single stud goes up — no exceptions. Skipping it and finishing anyway is the fastest way to spend your renovation budget twice. Every Marysville basement job we take starts with this sequence, regardless of how dry things look in July.

  - title: "Ceiling Height Below the 7-Foot IRC Minimum"
    description: |
      The 1960s and 1970s homes near downtown Marysville regularly come in at 6'8" or 6'10" from slab to underside of joist — below the 7-foot finished-ceiling minimum under IRC Section R305 for habitable rooms. Getting legal headroom means rerouting HVAC supply ducts and sometimes relocating a drain line, which triggers a mechanical permit alongside the main basement permit. Tight coordination between framing and MEP rough-in keeps the inspection sequence on track.

      Adding a Mitsubishi mini-split for the finished basement often solves the duct rerouting problem entirely and gives you independent climate control for the space — worth running the numbers on before you commit to relocating trunk lines.

  - title: "Egress Windows That Fail Code for Bedroom Use"
    description: |
      A basement bedroom in Marysville requires a compliant egress opening — minimum 5.7 square feet net clear, minimum 24-inch height, minimum 20-inch width per IRC R310. The original jalousie or single-pane slider windows in 1970s-era basements don't come close. New egress units from Milgard or Pella get spec'd with proper window well dimensions and are submitted as part of the permit package to the Marysville Building Department during plan review.

faq:
  - q: "How fast can you get to Marysville for a basement finishing consultation?"
    a: |
      Marysville is a regular Snohomish County stop — I-5 north from Everett puts us in 98270 or 98271 in under 20 minutes. Vladislav does the walkthrough himself, not a sales rep. Call (206) 591-1096 to set up a free on-site visit. Usually available within a week.

  - q: "What materials do you use for basement finishing in a wet PNW climate?"
    a: |
      DriCore subfloor over slab, Schluter Kerdi or RedGard in any wet-area framing, mold-resistant drywall throughout the below-grade portion. For egress openings we typically spec Milgard or Pella vinyl units sized to IRC minimums. Vinyl plank flooring over DriCore panels outperforms hardwood in the humidity swings you get in a Snohomish County basement.

      The project deadline is written into the contract with a financial penalty if we miss it. Not a verbal commitment — an actual clause.

  - q: "How long does basement finishing take in Marysville, including permits?"
    a: |
      Plan review at Marysville Building Department runs roughly 4–8 weeks for a standard basement conversion. Construction on a 700–900 sq ft finish — one bedroom, a bathroom rough-in, and open living area — runs 8–12 weeks once permitted.

      Vladislav pulls all permits, manages the rough-in and final inspections, and is on-site for the blue tape walkthrough and punch list. WA Licensed Contractor, 100+ projects completed since 2017. Call (206) 591-1096 to get started.