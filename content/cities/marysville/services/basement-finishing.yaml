title: "Marysville Basement Finishing — Wet Slab to Finished Room, 98270"

intro: |
  Quilceda Creek drains through the 98270 zip, and the neighborhoods clustered near Comeford Park sit on some of the most moisture-prone ground in Snohomish County. Walked a 1985 two-story off 67th Street NE last year where a Samsung front-load washer-dryer pair was running in four inches of standing water — the perimeter drain had failed completely, and efflorescence had been creeping up the concrete block for years. Finishing that basement meant solving the waterproofing problem before touching a single stud. That sequence — waterproofing first, framing second — is non-negotiable on Marysville's older slabs.

localContext: |
  Marysville's housing stock splits between 1970s-80s tract homes near the older neighborhoods off State Route 529 and newer 2000s-era subdivisions pushing east toward Grove Street and 64th Street NE. The 98271 zip has a higher share of newer builds — better foundations, code-compliant framing — but still dealing with Snohomish County's 37 inches of annual rainfall hitting unfinished slabs year after year. Pre-1990 homes in 98270 frequently have narrow window wells that won't meet current IRC egress minimums if a finished bedroom is the goal.

  Slab conditions vary block to block. Homes off 51st Drive NE near the Cedarcrest area tend to sit on clay-heavy fill that holds moisture against the foundation longer than sandy glacial soils further east. That matters when sizing a sump pump crock — an undersized unit cycling every 20 minutes in a wet spring will fail within two seasons. Snohomish County PDS reviews these projects separately from City of Marysville when the parcel is in unincorporated territory, so confirming jurisdiction before pulling permits saves weeks.

commonProblems:
  - title: "Failing Perimeter Drains on Pre-1985 Slabs"
    description: |
      Homes poured before 1985 in 98270 were rarely built with interior perimeter drains — that standard didn't take hold here until later. Standing water migrates in during the Oct-April rain window and pools at low points, often around LG heat pump water heaters or floor-level washer drains. Installing a full perimeter drain system with a sump pump crock and sealed lid addresses the source instead of mopping the floor on repeat. The crock needs a battery backup on Marysville's older lots — power outages during heavy rain events are common enough that a primary pump alone isn't sufficient protection.

  - title: "Egress Windows That Don't Meet IRC Minimums"
    description: |
      The IRC requires at least 5.7 sq ft of clear opening for any basement bedroom window, and most pre-1990 Marysville homes have narrow glass-block panels or undersized sliders nowhere near that threshold. City of Marysville permit reviewers flag this during plan review — drawings need window well dimensions and finished grade elevation marked before approval. Cutting a proper egress opening into the foundation wall and installing an oversized well adds 2-3 days to the schedule but makes the bedroom legal. A DriCore subfloor panel system running wall-to-wall after the egress work is done keeps the finished floor thermally separated from the cold concrete beneath.

  - title: "Mold Behind Existing Walls Before Framing Starts"
    description: |
      Found significant mold behind OSB sheathing on a 1992 rancher near Grove Street NE — framed directly against concrete block with zero drainage mat or vapor barrier, and a Bosch condensate drain had been dripping at the wall base for years. Full mold remediation, RedGard membrane applied to the concrete, and DriCore subfloor panels throughout brought the space back to a clean baseline before any finish framing started. Skipping that step and framing over contaminated concrete is how a finished basement ends up back to bare slab two years later. The remediation cost is real, but it's not optional.

