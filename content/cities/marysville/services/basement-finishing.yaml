  - q: "Can you build around our existing Navien or Rinnai tankless water heater in the utility corner?"
    a: |
      Navien and Rinnai units need combustion air clearances that can't be boxed solid. We build an access panel and chase frame around exposed vent pipes so the utility corner stays functional and inspectable after drywall hang. Bosch heat pump water heaters have different clearance minimums — same framing approach, dimensioned to the unit. The mechanical chase gets framed before rough-in inspection so the inspector can verify clearances before drywall goes up.

  - q: "What does a basement finish permit involve in Marysville, and what's the typical timeline?"
    a: |
      City of Marysville handles its own permits, separate from Snohomish County PDS. Plan review on a full basement finish with egress and a bathroom rough-in typically runs 4-8 weeks. Drawings need to show framing layout, egress window dimensions, electrical panel location, and any plumbing rough-in for a wet bar or bathroom. Total project timeline end-to-end: 10-16 weeks from permit submission to blue tape walkthrough and punch list sign-off. Missed deadline on our end triggers a penalty clause written into the contract. Call (206) 591-1096 for a free on-site walkthrough with Vladislav.