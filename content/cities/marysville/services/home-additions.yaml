title: "Marysville Home Additions — Build Out, Stay Put in 98270"

intro: |
  Permit applications for room additions and DADUs in Marysville go through Snohomish County PDS — not the city, not Seattle SDCI.

  Most housing in 98270 and 98271 was built between the mid-1990s and mid-2000s during Marysville's growth surge. Those homes are hitting their limits — three bedrooms, one bath, no dedicated home office, no real space for a multigenerational household. Plenty of those lots qualify for a detached ADU under WA HB 1337, which statewide now allows two ADUs per single-family lot. Getting the site plan right on first submission matters because a bounce-back from Snohomish County PDS resets the plan review clock entirely, adding weeks before framing even starts.

  A Mitsubishi mini-split handles heating and cooling in a new addition without extending ductwork through finished walls.

localContext: |
  The older blocks around Comeford Park and the State Avenue downtown corridor hold housing from the 1940s through the 1960s — post-and-pier foundations, smaller lots, some original galvanized plumbing still in service. Those homes need a structural and foundation assessment before any second-story addition reaches the drawing stage. Vertical loads change everything when the original framing was spec'd for single-story living, and a structural engineer needs to sign off on supplemental footing pads and LVL beam sizing before Snohomish County PDS opens a plan review file.

  East Marysville in 98271 is a different story.

  Out there, housing shifts to 1990s and 2000s ramblers on larger parcels: slab-on-grade construction, builder-grade framing, more room on the lot for a DADU footprint. Setback and FAR calculations still apply — PDS enforces those regardless of HB 1337 — but the structural approach is simpler when you're adding horizontal square footage rather than going vertical on a foundation that was never designed for it.

commonProblems:
  - title: "Foundation Capacity for Second-Story Additions"
    description: "Most 1990s ramblers in east Marysville sit on slab-on-grade foundations not engineered for vertical loads. Adding a second story means a structural engineer calculates bearing capacity at each column and header, designs supplemental footing pads, and specifies LVL beams at every load transfer point. All of it must appear in stamped structural drawings before Snohomish County PDS accepts a plan review application. Submit incomplete documentation and the review clock resets entirely — weeks lost before a single piece of framing goes up."
  - title: "ADU Setback and FAR Compliance Under WA HB 1337"
    description: "WA HB 1337 (2024) allows two ADUs per single-family lot statewide — Marysville included. Snohomish County still enforces its own setback requirements: typically 5 ft side yard and 15 ft rear for a DADU, with FAR limits layered on top. A 700 sq ft DADU on a 7,500 sq ft lot can push against lot coverage thresholds once the primary structure, new ADU footprint, garage, and impervious surface are all modeled together in the site plan — and impervious surface math catches people off guard more often than the FAR limits do. Getting that calculation right on first submission is what avoids a six-week review reset from PDS. Call (206) 591-1096 to schedule a free on-site consultation; Vladislav reviews the lot dimensions and zoning envelope before a single drawing gets started."
  - title: "Matching Siding and Rooflines on Older Marysville Homes"
    description: "Cedar lap siding near the State Avenue corridor has been weathering PNW rain since the 1940s. A new addition needs siding that matches not just in color, but in profile — Hardie cement-board cut to match original lap dimensions holds paint significantly longer than cedar on north-facing exposures where moisture builds season after season. Roofline integration matters equally: tying a bump-out into an existing 4:12 pitch requires matching the framing angles precisely, or the addition reads as bolt-on from the street."

faq:
  - q: "How far is Marysville from your primary service area?"
    a: "Marysville is about 35 miles north of Seattle on I-5 — within our Snohomish County coverage. Travel runs 45-60 minutes through Lynnwood and Everett. Vladislav does the walkthrough himself — 100+ projects since 2023, WA Licensed Contractor. Call (206) 591-1096."
  - q: "What heating system works best for home additions in the Marysville area?"
    a: "Separate HVAC zones are almost always the right call. Mitsubishi and Bosch mini-split heat pumps work well here — no new ductwork through finished walls, and they handle PNW's mix of humid winters and mild summers efficiently. A 12,000 BTU single-zone unit covers most primary suite or bonus room additions without oversizing the system. Where a new addition spans multiple rooms, a ducted mini-split with concealed air handling roughed in during framing gives better distribution and avoids wall penetrations after drywall is hung."
  - q: "How long does a home addition take from permit to final inspection in Marysville?"
    a: "Snohomish County PDS plan review for a major addition runs 6-10 weeks. A room addition or primary suite typically takes 3-5 months from permit submission to final inspection. A detached ADU under WA HB 1337 is 5-7 months end-to-end. Deadline compliance is written into the contract — penalties apply if we miss the agreed schedule. Call (206) 591-1096 for a free on-site estimate with actual line-item pricing."