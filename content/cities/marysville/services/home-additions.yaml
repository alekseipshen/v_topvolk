title: "Marysville Home Additions — Adding On to the 90s Build-Out"

intro: |
  Soper Hill and the subdivisions fanning east of I-5 — Marysville's 1990s-2000s buildout
  put solid lots under homes that no longer match the households using them. Aging parents who
  need to be close but not too close. Teenagers who should have real walls. Remote work that's
  outgrown a kitchen table.

  A detached ADU under WA HB 1337 or a second-story addition solves that without selling.
  Kitchen expansions here often involve planning around Bosch integrated appliance packages —
  something we coordinate from framing forward, not as an afterthought. Vladislav Volkov
  handles these projects directly. Call (206) 591-1096 to schedule an on-site walk-through.

localContext: |
  The 98270 zip code runs from downtown Marysville east toward Getchell — 1940s-1960s homes
  near the Ebey Slough waterfront alongside 1990s-2000s suburban tracts further inland. Older
  downtown houses often carry post-and-pier foundations that need evaluation before any
  second-story work. That evaluation isn't optional — it's part of the structural engineer's
  scope before the permit application even opens.

  The 98271 zip, covering Smokey Point and the corridor north toward Arlington, skews toward
  mid-2000s platform-frame construction — structurally more predictable, but load-bearing wall
  removal still requires LVL beam sizing and an engineer's stamp. City of Marysville plan
  review for major additions typically runs 8-12 weeks. Snohomish County PDS handles
  unincorporated parcels outside city limits — different portal, different reviewer, similar
  timeline. Factor that into your project schedule before you pick a move-in date.

  Marysville's climate adds another layer. Roughly 34 inches of rain annually, concentrated
  October through May, means vapor barriers in crawlspaces aren't a suggestion — they're code.
  Any addition that touches the building envelope needs a continuous air barrier detail and
  proper flashing at the rim joist connection. North-facing walls accumulate mildew fast
  without the right assembly.

commonProblems:
  - title: "ADU Permitting Under WA HB 1337 Through City of Marysville"
    description: |
      WA HB 1337 allows up to two ADUs per single-family lot statewide, but City of Marysville
      runs its own plan review — separate from Snohomish County PDS. A DADU in 98270 or 98271
      still needs setback verification, FAR calculation, lot coverage review, and utility
      connection drawings before the application opens.

      Most 7,000-8,000 sq ft lots here can support a 600-700 sq ft detached unit. Height limit
      for a DADU is typically 24 ft. Separate utility connection adds cost but also gives the
      unit independent metering — useful if the plan is rental income. Plan review runs 8-12
      weeks once the application is complete.

  - title: "Second-Story Engineering on 1990s-Era Platform-Frame Foundations"
    description: |
      Standard platform framing in Marysville's 1990s tract homes handles single-story loads
      fine — but a second story triggers a structural engineer's full assessment of foundation
      capacity, rim joist integrity, and bearing wall sizing. LVL beam replacements at header
      locations are common. Joist hanger upgrades and blocking additions often show up on the
      engineer's redlines too.

      On older 1950s-era homes near downtown, post-and-pier foundations sometimes need
      reinforcement before upper-floor loads apply. That work happens before framing starts.
      Rough-in inspection must clear before insulation or drywall hang begins — no shortcuts
      through that sequence.

  - title: "HVAC Zoning for New Additions in Marysville's Wet Climate"
    description: |
      Pushing a 1990s forced-air system to cover a new 400-600 sq ft addition frequently
      exceeds its static pressure design limits — the original system was sized for the original
      floor plan, nothing more.

      Marysville's wet winters and cool shoulder seasons make a dedicated Mitsubishi mini-split
      the better answer: independent zoning, no ductwork penetrations through existing framing,
      better year-round efficiency. MEP coordination for the electrical circuit and refrigerant
      line happens at rough-in, before drywall. R-49 insulation in the ceiling assembly and a
      proper vapor barrier on the crawlspace floor complete the thermal envelope — skipping
      either creates moisture problems within a couple of winters.

faq:
  - q: "How fast can you get to Marysville for a home addition consultation?"
    a: |
      Marysville is 35-40 minutes north of Seattle via I-5 — we schedule site visits across
      98270 and 98271 without travel fees. Vladislav comes out for the walk-through personally,
      not a salesperson. Consultation is free and includes a rough scope discussion on-site.
      Call (206) 591-1096 to book.

  - q: "Do you build kitchen additions around Bosch or Thermador appliance layouts?"
    a: |
      Yes. Kitchen additions in Marysville regularly include Bosch dishwashers and integrated
      refrigerators, KitchenAid or Thermador ranges, and occasionally Sub-Zero units. Electrical
      circuits, cabinet depths, and rough-in dimensions are all coordinated to the actual
      appliance specs before cabinets are ordered — prevents costly rework from roughing-in to
      generic assumptions. Range hood CFM requirements also factor into the mechanical drawings
      early, especially for high-output gas ranges that need makeup air.

  - q: "What does a home addition cost in Marysville, and how long does it take?"
    a: |
      A 400-600 sq ft main-floor addition runs $80K-$160K depending on finish level and
      structural complexity. DADU projects under WA HB 1337 typically run $130K-$200K+ with
      City of Marysville plan review adding 8-12 weeks. End-to-end from permit submission to
      final inspection: 4-7 months.

      Vladislav Volkov is a WA Licensed Contractor with 100+ projects completed since 2017.
      Missed deadlines are penalized — written into every contract. You get a line-item quote,
      not a range, after the on-site consultation.