title: "Marysville Power Washing — Moss Removal & Surface Prep"

intro: |
  Jennings Memorial Park sits right at the center of Marysville, and the homes fanning out
  from Allen Creek through the 98270 zip code show what three wet seasons do to untreated
  cedar. Moss colonizes north-facing deck boards and roof overhangs fast up here. Before
  TopVolk restains any cedar surface or preps Hardie cement-board siding for a repaint, the
  wash comes first. Skip that step and your new finish bonds to algae instead of wood — you
  are redoing it inside 18 months.

  Marysville sits in the Snohomish County PDS jurisdiction, which means exterior work on
  certain structures does require a permit review before you touch it. Most surface washing
  does not trigger a permit. But if the wash is part of a larger prep sequence — say,
  cedar siding removal and re-cladding with Hardie lap — that project flows through
  Snohomish County PDS for a building permit. Worth knowing before you plan the scope.

localContext: |
  Marysville's housing splits between older downtown blocks near the Ebey Waterfront — some
  homes dating to the 1940s-1960s with original cedar siding — and the 1990s-2000s tract
  development that spread through Smokey Point and Getchell Hill. The 98271 zip covers most
  of that newer growth: builder-grade cedar fencing, Hardie lap siding, poured concrete
  driveways.

  Those cedar fences are 25-30 years old now, hitting their first serious refinishing cycle.
  Concrete driveways from the same era show deep oil staining and aggregate pitting that a
  surface cleaner attachment handles better than a standard fan tip. A lot of that Getchell
  Hill construction used PT lumber for fence posts set directly in soil — the above-grade
  cedar boards are what suffer, not the posts. By the time moss is visible from the
  street, it has already been embedded in the grain for two or three seasons.

  Homes near the Ebey Waterfront face a different situation. Saltwater influence from Port
  Susan Bay accelerates mildew on north and west elevations faster than inland Marysville
  neighborhoods. Cedar clapboard siding on those older houses needs careful low-PSI
  treatment — original siding from the 1950s is not the same thickness as modern cedar, and
  aggressive pressure splits the grain.

commonProblems:
  - title: "Moss and Algae Lock Into Cedar Surfaces, Blocking Stain Penetration"
    description: "Cedar fence boards and deck surfaces in the 98270 zip stay damp under
      canopy from October through April. Moss and lichen embed into the wood grain at the
      surface layer. A pressure wash at 1,500–2,000 PSI with correct dwell time strips that
      organic layer and opens grain for stain penetration. Skipping this step is why most
      DIY restain jobs peel before the second winter.

      Dwell time matters as much as PSI. Sodium hypochlorite solution at 2–3% concentration
      applied and left for 10–15 minutes before rinsing kills the root structure, not just
      the visible surface. Rinse too early and the moss regrows from spores left in the grain.
      That is the part most homeowners miss when they rent a machine and go at it themselves."

  - title: "Hardie Siding Needs Soft-Wash Before Any Exterior Repaint"
    description: "Hardie cement-board siding on Marysville homes accumulates mildew and
      algae at the lap joints — especially on north and west-facing elevations. High-pressure
      spray forces water behind the laps and damages the factory primer coat. Soft-wash
      technique uses low PSI with a sodium hypochlorite solution and longer dwell time,
      pulling biological growth off clean without disturbing caulk at window and door trim.

      James Hardie's own installation guidelines specify a maximum of 1,500 PSI for cleaning.
      Exceed that on older Hardie lap and you can crack the factory finish, which creates an
      entry point for moisture. On the Smokey Point tract homes, the original caulk at window
      returns is already 25 years old — one pass with a tight-stream tip at 2,500 PSI blows
      it out. Soft-wash preserves it."

  - title: "Concrete Driveways and Paver Patios With Oil Staining and Organic Buildup"
    description: "Smokey Point–area tract homes from the 1990s are showing two problems:
      engine oil staining near the garage apron and black streaking from PNW mildew cycles.
      A surface cleaner attachment running at 3,000 PSI addresses both without leaving wand
      marks across the slab. Paver patios need lower pressure and targeted sodium
      hypochlorite to avoid joint-sand displacement and paver face damage."

