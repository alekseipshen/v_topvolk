  - q: "Can you wash Trex or TimberTech composite decking without voiding the warranty?"
    a: "Yes. Composite decking like Trex and TimberTech requires lower PSI than cedar —
      typically 1,200–1,500 PSI with a 40-degree fan tip. High pressure strips the
      protective cap layer and voids manufacturer coverage. We confirm the product before
      starting and adjust accordingly. WA Licensed Contractor, 100+ projects since 2017."

