  - q: "What appliance packages do you spec for ADU kitchens in Marysville?"
    a: |
      LG and Samsung are the most practical choices for Marysville ADU kitchens — renter-friendly and stocked locally at Pacific Sales in Everett. Bosch dishwashers come up often on owner-occupied rentals where noise reduction matters. For owner-use units where the homeowner plans to live in the DADU and rent the main house, KitchenAid or Thermador induction ranges fit the budget profile of this area. We build to your spec or help you select based on rental target and finish level.
  - q: "What does a DADU cost in Marysville, and what's the full timeline?"
    a: |
      A 400-600 sq ft DADU in Marysville runs $180,000-$280,000 fully permitted — foundation, framing, MEP rough-in, insulation, drywall, and all finish work included. Utility connection costs ($10,000-$18,000) are on top of that number and depend on your lot's proximity to city mains. End-to-end with city permitting: 4-6 months. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023, and deadline penalties are written into every contract — we miss a milestone, we pay. Vladislav handles the project directly; there's no project manager layer between you and the person responsible for the build.