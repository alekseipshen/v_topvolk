title: "Marysville ADU Construction — Add a Unit to Your 98270 Lot"

intro: |
  Marysville grew from 25,000 to nearly 70,000 residents in under 25 years — a lot of those 1990s homes near Jennings Memorial Park now have adult kids moving back or aging parents who need their own space close by. WA HB 1337 (2024) lets you add up to two ADUs on a single-family lot statewide, no special variance required. A finished DADU with an LG kitchen suite and separate entrance rents for $1,800-$2,200 per month in the 98270 zip — income from land you already own. The Snohomish County PDS handles permitting for unincorporated parcels on the edges of the city; Marysville city limits use their own building department. Knowing which jurisdiction owns your parcel changes the submittal process entirely.

localContext: |
  Most Marysville homes were built between 1990 and 2010 — standard stick-frame on 7,500-10,000 sq ft lots with poured concrete foundations. The older blocks near downtown along State Avenue (98270) include some 1960s and 70s ranchers with generous rear yards, often deep enough for a DADU under the 24-foot height limit with full setback clearance. Newer subdivisions in east Marysville (98271) run tighter lot lines, so setback and lot coverage calculations need to happen before a single drawing gets started. FAR limits and rear setback minimums vary by zoning designation — R-4 and R-6 zones handle ADU placement differently. Confirming your lot's zoning classification at the counter before ordering structural drawings saves weeks of rework.

commonProblems:
  - title: "Marysville's Permit Review Adds 6-10 Weeks Before Construction Can Start"
    description: |
      Marysville's building department processes ADU applications on their own review track — plan review typically runs 6-10 weeks before a start date is possible. Unlike Seattle SDCI's pre-approved ADU plan catalog, Marysville still requires full custom drawings for each project. LVL beam sizing, Milgard window schedules, vapor barrier specifications, and setback compliance all have to be correct on the first submittal. One correction round from the plan reviewer pushes your groundbreaking back another 4-6 weeks. Structural sheets, energy compliance forms (COMcheck or equivalent), and site plans showing lot coverage all go in together. Missing one sheet restarts the clock. TopVolk coordinates the full submittal package — drawings, energy calcs, site plan — so the first review cycle is the only one.
  - title: "Separate DADU Utility Connections Run $10,000-$18,000 in Marysville"
    description: |
      Most Marysville DADUs require a separate water meter under city utility standards. Running a new service lateral from the main, rough-in for a Navien tankless water heater, and sewer connection adds up fast — $10,000-$18,000 depending on distance from existing mains and street depth. Some lots qualify for shared connections with a properly sized manifold, but that eligibility needs a utility department review before you finalize the floor plan and plumbing layout. The utility coordination step happens during design, not after permits are issued. Getting confirmation early keeps the budget estimate from moving sideways at rough-in.
  - title: "1990s Garages and Basements Usually Fall Short of Current IRC Insulation Standards"
    description: |
      Converting a 1990s Marysville garage or basement into an AADU typically turns up R-11 batts in 2x4 exterior walls — current IRC energy code for climate zone 4C wants R-20 minimum. Reframing to 2x6 or adding continuous rigid foam sheathing fixes the thermal envelope. Hardie cement-board siding replacement usually makes sense at the same time: original T1-11 from that era has absorbed 30-plus years of PNW rain and is typically ready to come off anyway. Vapor barrier work in the crawlspace or slab perimeter insulation may also be flagged at rough-in inspection depending on the AHJ's plan check notes.

