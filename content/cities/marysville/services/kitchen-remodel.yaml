title: "Marysville Kitchen Remodel — Open Layouts for 90s Tract Homes"

intro: |
  Along the 98270 corridor near Soper Hill Road, most kitchens were built in
  the early 1990s when contractors kept cooking and living fully walled off.
  Those layouts feel cramped now. Dropping in a Bosch induction range and an
  island means taking down that partition — which requires load-path analysis
  first. Vladislav Volkov runs every project personally. Call (206) 591-1096
  to schedule a site visit with a WA Licensed Contractor who'll give you a
  line-item quote, not a vague ballpark.

localContext: |
  Zip codes 98270 and 98271 cover mostly 1988-2005 builder-grade construction —
  particle-board cabinets, laminate counters, and 100-amp panels that weren't
  sized for modern cooking loads. Some blocks near downtown Marysville date to
  the 1950s-60s with older galvanized plumbing still in service. Permits pull
  through the City of Marysville for incorporated parcels; unincorporated
  Snohomish County sections route through Snohomish County PDS, which runs
  its own plan review timeline — typically 4-8 weeks depending on scope.

commonProblems:
  - title: "Load-Bearing Walls Blocking Open-Concept Kitchen Layouts"
    description: "In Marysville's 1990s tract homes, the wall between kitchen and
      dining room often carries roof load or upper-floor framing. Removing it
      without an engineered LVL beam and proper PSL post point loads causes
      structural problems down the road. Header sizing depends on span and load
      path. We pull the permit through Marysville's building department and
      schedule the rough-in inspection before any drywall closes back up."
  - title: "100-Amp Panels Can't Handle Modern Kitchen Loads"
    description: "A KitchenAid double wall oven, Bosch dishwasher, and induction
      cooktop on a 1993 panel is a guaranteed breaker situation. Upgrading from
      100A to 200A service is permit-required work in Snohomish County. We
      coordinate the electrical sub, manage the panel swap, and make sure the
      rough-in inspection doesn't bottleneck the cabinet and countertop schedule."
  - title: "Moisture-Damaged Cabinet Bases from Years of PNW Rain-Season Humidity"
    description: "Marysville pulls heavy rain from October through May. Particle-board
      sink cabinet bases absorb that moisture for years before anyone notices.
      By demo day, the subfloor underneath is often soft. We flag soft spots
      during the pre-bid walkthrough, price substrate repair upfront, and specify
      cement board or DriCore subfloor wherever moisture exposure is a real factor."

faq:
  - q: "How quickly can TopVolk schedule a kitchen consultation in Marysville?"
    a: "Marysville is roughly 40 minutes north of Seattle via I-5. Vladislav can
      typically get on-site within a week. Call (206) 591-1096 — you'll talk
      directly to the person running the project, not a salesperson. 100+
      projects completed since 2017 across King and Snohomish counties."
  - q: "Do you work with Bosch, KitchenAid, and Thermador appliances during a remodel?"
    a: "Yes. Cutout sizing, ventilation clearances, and range hood CFM requirements
      for Bosch, KitchenAid, and Thermador are part of rough-in planning — before
      cabinets go in. Counter-depth refrigerator cabinet depths, dedicated circuits,
      gas line connections — all factored into the drawings from the start."
  - q: "What does the permit process look like for a Marysville kitchen remodel?"
    a: "Wall removal, electrical upgrades, or gas line work all require a permit
      through the City of Marysville. Plan review runs 3-6 weeks depending on
      scope. Once approved, expect 6-10 weeks from demo to final inspection.
      Deadline is written into the contract — we pay penalties if we miss it."