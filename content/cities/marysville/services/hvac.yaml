title: "Marysville Hvac — Heat Pumps & Mini-Splits, Snohomish County"

intro: |
  Soper Hill Road subdivisions and the newer streets off 88th Street NE filled Marysville's 98270 zip with builder-grade gas furnaces installed between 1998 and 2006. Those units are hitting end of life right as IRA federal rebates make heat pump conversions financially practical for households at Marysville's income level. A Mitsubishi cold-climate heat pump runs at full efficiency through a Snohomish County winter without burning emergency heat every time temperatures drop. Snohomish County PDS requires a mechanical permit for any full system replacement — plan review runs 2-4 weeks, so building that into the project timeline from the start avoids delays.

localContext: |
  Zip 98270 covers most of Marysville's residential grid — 1990s ranch-style and two-story tract homes in Grove, newer construction in Soper Hill, and 1960s-era houses near downtown around Jennings Memorial Park. Original ductwork in the 1990s-2000s tract housing was sized for gas furnace static pressure, and those numbers often don't match what a heat pump requires without a full rebalancing pass. The 1960s homes near 3rd Street frequently carry galvanized steel trunk lines — still functional, but a full duct replacement makes more sense than adapting aging sheet metal to a modern system with different airflow demands.

commonProblems:
  - title: "Gas Furnaces from 1998-2006 Aging Out — Heat Pump Conversion Window"
    description: |
      Grove and Soper Hill both carry large pockets of builder-grade gas furnaces from the late-1990s and early-2000s construction wave, many now at or past expected service life. Converting to a cold-climate Daikin or Mitsubishi heat pump qualifies for the IRA federal rebate up to $2,000, plus Puget Sound Energy incentives layered on top. Duct static pressure testing before sizing is critical — an undersized return drops delivered airflow, overloads the compressor, and degrades the system's SEER rating noticeably by year two.

  - title: "Ductless Mini-Splits for New DADUs and Room Additions Under WA HB 1337"
    description: |
      WA HB 1337 (2024) allows up to two ADUs per single-family lot in Marysville, but a detached DADU can't borrow heat from the main house's forced-air system without duct losses that erase the efficiency gains. A Mitsubishi M-Series or Daikin Aurora mini-split handles it without touching existing ductwork. Snohomish County PDS requires both a mechanical permit and an electrical permit for the refrigerant line-set and disconnect — refrigerant work done without permits surfaces on inspection when the property eventually sells.

  - title: "Unsealed Ductwork in Older Homes Driving Hot and Cold Rooms"
    description: |
      Homes near downtown Marysville built in the 1960s commonly have original sheet metal ductwork with no mastic sealing at boot connections or trunk-line joints — standard for the era, but a significant efficiency drain today. Supply air leaking into unconditioned crawlspaces reduces delivered heat by 20-30% before it reaches any register. A duct blower test before and after sealing documents the improvement. Snohomish County energy code requires that test as part of any new HVAC mechanical permit — it is not optional on a full system replacement.

