title: "Tacoma General Contracting — Full Remodels, Real Permits"

intro: |
  Stadium District bungalows, Proctor District craftsmans from the 1920s, and
  the postwar ranchers lining South 72nd Street — Tacoma's housing stock runs
  old and complicated. A kitchen gut-remodel in a 98406 home regularly turns
  up galvanized pipe, undersized panels, and framing that needs sistering before
  a new KitchenAid range can even go in. General contracting means coordinating
  all of that under one permit and one responsible party. That's the actual job.

localContext: |
  Proctor District and North End homes (98406, 98407) are Craftsman and
  Foursquare construction from 1910–1935 — post-and-pier foundations, original
  Douglas-fir framing, and plumbing that hasn't been touched since Eisenhower.
  East Tacoma and South End (98404, 98409) shifted to mid-century builds:
  1950s ranchers with galvanized supply lines and aluminum branch wiring from
  the 1965–1973 window. Both eras hit structural surprises fast once demo
  starts. Projects inside City of Tacoma limits permit through the City's own
  department; unincorporated Lakewood and South Hill route through Pierce
  County PALS — a different application, different timeline, different AHJ.

commonProblems:
  - title: "LVL Beam Surprises Inside Pre-1940 Stadium District and North End Homes"
    description: "Bungalows in 98403 and 98406 were framed before current IRC
      standards. Demo regularly exposes water-damaged rim joists, notched
      load-bearing studs, and missing blocking at beam pockets. An LVL beam
      replacement mid-project adds two to three weeks and $8K–$15K to the
      budget if it wasn't caught and scoped before work started."
  - title: "Rough-In Inspection Delays When Trades Have No Sequence"
    description: "A full kitchen or bath remodel needs framing, electrical
      rough-in, plumbing rough-in, and mechanical in strict order — all before
      drywall hang. Without one GC managing that sequence, subs step on each
      other. A single missed rough-in inspection through Tacoma's permit office
      can push a 6-week remodel past 12 weeks with no recourse."
  - title: "Crawlspace Vapor Barrier Failures Destroying First-Floor Framing"
    description: "Tacoma averages over 37 inches of rain annually. North End
      and Hilltop homes (98405) with failed vapor barriers let moisture wick
      up into sister joists and PT lumber blocking. Floors go soft. By the time
      a homeowner notices, crawlspace remediation runs $5K–$12K before the
      planned renovation budget gets touched at all."

