title: "Tacoma Fence Installation — Cedar, Vinyl & Post Depth in Pierce County"

intro: |
  Point Defiance Park borders some of Tacoma's densest residential streets, where 1920s lots
  in the 98407 zip carry vague property lines from original plats. Installing a fence without
  verifying the survey first is a reliable path to a property dispute — and to paying for
  removal of a finished fence. Clay-heavy soil and Tacoma's 38 inches of annual rain make
  post depth a real structural decision. Thirty to thirty-six inches in concrete is the
  floor, not a suggestion, or you're resetting posts after the first wet winter.

localContext: |
  North End and the Proctor District (98407) run dense with 1910s-1930s Craftsman bungalows
  on 50-foot lots. The cedar fencing that was standard during those decades is now rotting
  at the post line on half the blocks. South End and Hilltop (98404, 98405) carry more
  post-WWII ranch housing with larger yards but the same clay-loam drainage problem.
  North-facing exposures across Tacoma's hillside neighborhoods accumulate moss on stained
  cedar within three to four seasons — no amount of sealer fully stops it.

commonProblems:
  - title: "North-facing cedar deteriorates fast on Tacoma's hillside lots"
    description: "Proctor District and Stadium District lots sit on north-facing slopes where cedar
      boards stay damp from October through May — roughly half the year. Moss colonizes the
      grain within two to three seasons without aggressive annual maintenance. CertainTeed's
      Bufftech vinyl panels are a direct material swap: UV stabilizers hold color through
      Tacoma winters and there's no staining cycle. The structural failure point is always
      ground contact — PT lumber rated for in-ground use is mandatory in Pierce County's
      saturated clay, not optional."

  - title: "Post heave in clay-loam soil catches DIY projects in the second winter"
    description: "Most of Tacoma's residential soil is clay-loam that stays saturated five to six
      months straight. A post set at 18 to 20 inches — the depth standard for boxed DIY kits
      — heaves or racks noticeably by the second winter as the ground cycles through wet and
      dry. Concrete footings at 30 to 36 inches are the baseline for any fence exposed to
      wind off Commencement Bay. Pierce County PALS inspectors have flagged shallower footings
      repeatedly on permit-required retaining wall projects."

  - title: "Permit requirements trip up fence projects that hold grade or push past 6 feet"
    description: "Tacoma allows 6-foot fences on side and rear property lines, 4 feet in front yard
      setback zones. Any fence retaining grade over 4 feet triggers a Pierce County PALS
      permit review under IRC Section R404 — structural drawings, plan review fees, and
      a scheduled inspection. Trex horizontal slat panels are popular for North End privacy
      fences and look right on the 1920s bungalow streetscape, but the moment a fence holds
      soil or crosses 6 feet, a permit is required before the first post is set."

