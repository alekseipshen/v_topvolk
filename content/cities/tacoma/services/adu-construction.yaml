title: "Tacoma ADU Construction — Turn Your Lot Into Rental Income"

intro: |
  North End Tacoma's bungalows — built mostly between 1910 and 1935 — sit on lots that now legally support two separate dwelling units under WA HB 1337. Rental demand near Point Defiance Park and Stadium District is real. A properly permitted DADU with a compact Bosch or Samsung kitchen suite can generate $1,400–$1,900/month in this market.

  TopVolk Construction has been building ADUs across King, Snohomish, and Pierce counties since 2017 — WA Licensed Contractor, 100+ projects completed. Call (206) 591-1096 and Vladislav walks the lot personally.

localContext: |
  Zip codes 98404 and 98405 carry a dense mix of pre-war Craftsman bungalows and 1950s–60s ranchers, many with full crawlspaces and detached garages — exactly the housing stock that converts cleanly into DADUs. Hilltop and McKinley Park neighborhoods sit on 50×100 ft lots.

  That sounds generous until Tacoma's R-2 setback requirements and lot coverage caps are applied — the buildable DADU footprint shrinks fast. Older homes in the 98406 zip, especially along North 26th Street and around McCarver Elementary, often have existing detached garages already on dedicated concrete pads — a head start that can cut framing costs significantly. ADU permits in incorporated Tacoma go through Tacoma's own permit office, not Pierce County PALS, which handles unincorporated county land only. Two different processes. Easy to confuse.

commonProblems:
  - title: "Crawlspace Moisture on Pre-War Tacoma Lots"
    description: |
      Tacoma averages 37 inches of rain annually, and crawlspaces under 1910s–1930s homes in Hilltop and North End stay wet October through May. Before framing any DADU foundation wall or floor assembly, site drainage gets assessed and a 6-mil poly vapor barrier with cross-ventilation blocking goes in.

      Skip this on a Tacoma lot and PT lumber sill plates show rot within five years. That's a problem that surfaces at final inspection and costs more to remediate than to prevent. DriCore subfloor panels over a vapor barrier add another layer of moisture management for slab-on-grade ADU floors — worth speccing on any lot with documented drainage history.

  - title: "Lot Coverage and FAR Limits Cut Your DADU Smaller Than Expected"
    description: |
      City of Tacoma R-2 zones typically cap lot coverage at 35–40%. On a 5,000 sq ft lot carrying a 1,200 sq ft house plus an attached garage, the realistic DADU footprint lands around 600–700 sq ft — nowhere near the 1,000 sq ft WA HB 1337 permits as a maximum.

      Running FAR and setback calculations before commissioning drawings saves weeks of plan review and avoids redesign fees. That math happens at the first site visit. No drawings purchased yet, no money spent — just a site walk and honest numbers.

  - title: "Utility Separation Costs Most ADU Budgets Never Account For"
    description: |
      Running a dedicated sewer lateral and water service from the street to a new DADU in the 98405 or 98406 area adds $8,000–$18,000 to project cost depending on distance and whether a Tacoma Public Utilities street cut permit is required.

      Shared connections are legal under WA HB 1337 but require a recorded easement — a title issue that needs to be resolved before construction starts, not after. For mechanical, a Mitsubishi mini-split handles a 600–800 sq ft ADU without a dedicated mechanical room. Easier to permit. Quieter than forced air. And the heat pump function cuts winter operating costs compared to electric baseboard, which matters to a tenant writing a monthly rent check.

faq:
  - q: "How fast can you get to Tacoma for ADU construction?"
    a: "Tacoma is 35–40 minutes from Seattle via I-5 South. Free on-site consultations are scheduled within 3–5 business days — Vladislav does the site visit himself, not a sales rep. Call (206) 591-1096 to book. First visit covers rough lot assessment and permit feasibility at no charge."

  - q: "What kitchen and bath fixtures do you spec for a Tacoma ADU rental unit?"
    a: "For rental-grade builds, Moen or Kohler plumbing fixtures are the standard spec, paired with a Samsung or Bosch appliance package — durable, locally available, easy to service. A curbless shower with large-format porcelain tile and a recessed niche costs slightly more upfront but holds up better over tenant turnover than a prefab insert. Higher-end finishes like KitchenAid or a Kohler Statement series are available if the target rent supports the premium."

  - q: "How long does an ADU project take start to finish in Tacoma?"
    a: "A detached DADU typically runs 4–7 months end-to-end: 4–8 weeks for City of Tacoma plan review, then 10–16 weeks of construction including rough-in inspections and final inspection sign-off. Basement or garage conversions usually run 3–5 months. Deadline penalties are written into every TopVolk contract — not a verbal promise, an actual contract clause. That clause covers both parties and keeps the schedule honest from day one."