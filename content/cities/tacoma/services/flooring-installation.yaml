title: "Tacoma Flooring Installation — Subfloor Moisture Testing Before Every Install"

intro: |
  Commencement Bay keeps Tacoma humid from October through May, and that dampness works into crawlspaces beneath the Craftsman bungalows in the North End and Stadium District long before it reaches your subfloor. A leaking Bosch dishwasher, a decade without a vapor barrier, one unchecked wet winter — the subfloor damage looks the same either way. TopVolk starts every flooring project in 98406 and 98407 with moisture meter readings. Wrong numbers mean the floor waits. Solid hardwood won't survive a wet subfloor no matter how good the finish is, and LVP installed over soft OSB telegraphs every soft spot within a year.

localContext: |
  Tacoma's housing stock is older than most of the Seattle Metro. Craftsman bungalows along North 30th in the Proctor District, post-war ranchers in South Tacoma (98444), mid-century two-stories in the Lincoln District (98404) — all built before moisture control was a code concern. Many 1960s kitchens have vinyl asbestos tile buried under layers of sheet vinyl. Point Defiance Park–area homes in 98407 are especially prone to subfloor rot from decades of unchecked crawlspace vapor. Post-war ranchers in 98444 often have original tongue-and-groove subfloor planks — structurally fine until moisture infiltration causes edge-swell and bounce. Identifying which generation of subfloor is under your feet changes the prep work entirely.

commonProblems:
  - title: "Hardwood cupping from crawlspace moisture in post-and-pier homes"
    description: |
      Tacoma's pre-1960 homes in 98406 and 98407 mostly sit on post-and-pier foundations with vented crawlspaces that hold moisture well into summer. Solid hardwood installed over a damp subfloor cups within one wet season — sometimes less. Pin-type and pinless moisture meters catch what you can't see with your eyes. Readings above 12% mean dehumidification runs first, sometimes 48-72 hours continuous, before a single board gets nailed down.
  - title: "Vinyl asbestos tile (VAT) hidden under 1960s kitchen floors"
    description: |
      Homes built before 1981 across Hilltop (98405) and the Lincoln District (98404) commonly have VAT under multiple layers of sheet vinyl. Cutting or sanding VAT without abatement violates EPA NESHAP regulations — no exceptions. TopVolk brings in a Pierce County–licensed abatement contractor before any demo begins. Budget $800–$2,000 depending on square footage. It adds 1-2 weeks, but it's the only legal path forward and the only safe one.
  - title: "Matching 2-1/4-inch oak strip flooring in Craftsman-era restorations"
    description: |
      Proctor District bungalows were built with 2-1/4-inch #2 common red oak — narrower than today's standard 3-inch and 5-inch widths. Shaw Hardwoods and Armstrong both stock this width, but matching existing grain character and finish sheen requires real sample fitting. TopVolk dry-fits planks in the room before ordering in volume. A visible mismatch on a 1920s floor is obvious from 10 feet away, and refinishing the whole room to compensate costs more than getting it right the first time. In Stadium District homes where the original Douglas-fir strip flooring has darkened with age, stain matching takes 2-3 sample passes on scrap before touching the field.

faq:
  - q: "How fast can you get to Tacoma for a flooring consultation?"
    a: |
      TopVolk covers all of Pierce County — Tacoma, Lakewood, Puyallup, and unincorporated areas under Pierce County PALS jurisdiction. Drive from the Eastside runs 45-60 minutes depending on I-5 traffic near JBLM. Call (206) 591-1096 to book a free on-site walk-through. Vladislav comes out himself — not a commissioned closer or a subcontractor sent to measure.
  - q: "Do you install Shaw, Pergo, or Mohawk flooring in Tacoma homes?"
    a: |
      Yes — Shaw, Armstrong, Mohawk/Pergo, and Schluter systems for tile-to-hardwood transitions are all in regular rotation. Customer-supplied material works fine, but solid hardwood needs to acclimate in the space for 4-7 days before install begins. LVP and engineered hardwood need 24-48 hours minimum. Bring it to the job site before demo day, not after the subfloor is already prepped and open. Acclimation in an unheated garage or outside storage doesn't count — the material needs to stabilize at the actual room temperature and humidity of the install location.
  - q: "Does flooring installation in Tacoma require a Pierce County permit?"
    a: |
      Standard replacement — hardwood, LVP, engineered, tile — typically doesn't trigger Pierce County PALS review. Structural subfloor repairs or raising floor height more than an inch in a finished area can. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023. Permit questions get flagged during the free consultation, not discovered after demo starts. Deadline commitments go into the contract in writing — missed dates come with penalties paid by us, not excuses.