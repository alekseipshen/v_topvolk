title: "Tacoma Bathroom Remodel — Gut It Right the First Time"

intro: |
  Ranch-style homes near Point Defiance and split-levels through Tacoma's North End (98406) were built without real waterproofing behind the tile — just green drywall and good intentions. Kohler fixtures from the original build look serviceable until demo day exposes soft subfloor and black mold going three studs deep. TopVolk Construction is a WA Licensed Contractor with 100+ remodels completed across Pierce County since 2023. We know what's behind those walls before the first tile comes off.

localContext: |
  Tacoma housing splits between pre-war Craftsman bungalows in the Proctor District and Stadium District (98402, 98403), postwar ranchers through the North End (98404), and 1980s–90s tract construction in Parkland and South Hill (98444, 98446). Each era has its own failure mode. Old cast-iron drain stacks corrode at the elbow joints. Rancher bathrooms have shower surrounds with no waterproofing membrane behind the tile. Tract-era adhesive is now dried out, grout cracking, subfloor shifting under every step.

commonProblems:
  - title: "No Waterproofing Membrane Behind Old Tile"
    description: "Builder-grade ceramic in 1970s–80s Tacoma bathrooms went straight onto drywall backer — no Schluter Kerdi, no RedGard. Moisture migrates through grout lines and saturates wall framing. By the time homeowners in 98408 or 98409 call us, blocking and rim joist behind the shower are soft. Full demo, cement backer board, and a properly installed waterproofing membrane are required before any new tile goes up."
  - title: "Cast-Iron Drain Stack Corrosion in Older Homes"
    description: "Pre-war bungalows in Proctor and the Stadium District have original cast-iron drain stacks — 80 to 100 years old. The elbow joints pit and scale from the inside, slowing drainage and eventually leaking. Rerouting to PVC during a bathroom remodel adds cost but cannot be skipped. Pierce County PALS requires a rough-in inspection before walls close, so the plumbing gets inspected while it is still accessible."
  - title: "Ventilation Failure and Mold Regrowth"
    description: "Tacoma averages over 37 inches of rain annually. Older bath fans in North End ranchers vent into attic cavities — or quit working entirely — letting moisture build behind Moen and American Standard fixture installations. We upgrade to properly CFM-rated fans vented through the exterior wall, and apply RedGard to shower niches and bench areas before tile sets. Mold does not come back when moisture has nowhere to go."

faq:
  - q: "How fast can you get to Tacoma for a bathroom remodel estimate?"
    a: "Tacoma is about 35 miles south of Seattle — 40 to 50 minutes via I-5. We cover all of Pierce County including 98402 through 98409, Parkland, and South Hill. Call (206) 591-1096 to schedule a free on-site walkthrough with Vladislav directly, not a salesperson."
  - q: "Which fixture brands do you install in Tacoma bathroom remodels?"
    a: "Kohler and Moen are most common in Pierce County homes, and we install both regularly. American Standard shows up often in older rancher bathrooms in 98404 and 98406. We also source Schluter trim profiles and Schluter Kerdi waterproofing membranes locally, which keeps lead times short and the schedule on track."
  - q: "What does a Tacoma bathroom remodel cost, and how long does it take?"
    a: "Full gut remodels in Pierce County run $25,000–$65,000 depending on size, layout changes, and fixture grade. A curbless shower conversion with large-format porcelain and a new vanity typically lands $30,000–$45,000. Timeline from permit to punch list runs 6–10 weeks. Pierce County PALS handles permitting; plan review typically takes 3–6 weeks. Deadline penalties are written into our contracts — if we miss the agreed date, we pay."