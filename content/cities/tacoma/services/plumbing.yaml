title: "Tacoma Plumbing — Repiping, Tankless & Fixture Work"

intro: |
  North End bungalows along N 30th Street — most built before 1940 — still run on
  original galvanized supply lines that have been narrowing for eight decades. By the
  time pressure at a Moen shower valve drops to a trickle, the galvanized main is often
  corroded to a fraction of its original bore. Tacoma's older housing stock, concentrated
  near Point Defiance Park and the Proctor District in zip 98407, makes PEX repiping one
  of the most common plumbing scopes we see on full renovations. The same homes frequently
  have cast-iron drain lines sitting under crawlspaces that have never seen a vapor barrier
  — decade after decade of condensation accelerates joint failure from the outside in.

localContext: |
  Zip 98405 (Hilltop, South End) and 98407 (Proctor District, North End) hold some of
  Tacoma's oldest residential housing — post-and-pier foundations, cast-iron drain lines,
  and galvanized supply piping installed in the 1920s through 1950s. Tacoma's 37-plus
  inches of annual rainfall accelerates corrosion in unconditioned crawlspaces, especially
  on homes where vapor barriers were never installed or have degraded. Branch lines in
  these homes often run 1/2-inch galvanized to multiple fixtures simultaneously — pressure
  collapses the moment two people run water at once. City of Tacoma remodel permits go
  through Building & Land Use Services, not Pierce County PALS, which applies to
  unincorporated areas only. Zip 98444 and 98446 in the Parkland and Spanaway corridors
  fall under Pierce County PALS jurisdiction — a separate permit center with its own
  plan review queue, typically running 3-6 weeks for plumbing submittals.

commonProblems:
  - title: "Galvanized Supply Lines Killing Pressure Throughout the House"
    description: "Pre-1960 homes in Hilltop and the North End commonly have galvanized iron supply
      lines that corrode inward for decades, sometimes narrowing a nominal 3/4-inch pipe
      down to a 1/4-inch opening. Replacing with cross-linked PEX-A tubing restores full
      flow and stops the orange-tinted water that signals heavy rust flaking off old pipe
      walls. A whole-house repipe on a 1,400 sq ft Craftsman typically takes 3-4 days of
      rough-in work plus a permit inspection through Tacoma's Building & Land Use Services.
      Rough-in inspection has to pass before walls close — plan for that sequencing in any
      remodel timeline."
  - title: "Polybutylene Pipe Failures in South Tacoma Tract Homes"
    description: "Subdivisions in Spanaway and south Tacoma built between 1978 and 1995 frequently
      used polybutylene supply pipe — a gray plastic that chlorinated municipal water
      degrades over time, causing hairline cracks at crimp fittings. Poly-B fails without
      obvious warning signs. Full replacement with PEX eliminates every supply line before a
      pinhole leak soaks a finished basement or subfloor. Pierce County PALS requires a
      permit for whole-house repiping in unincorporated areas of the county."
  - title: "Tankless Water Heater Conversion — Gas Line Upsize Is Non-Negotiable"
    description: "Swapping a 40-gallon storage tank for a Rinnai RU199 or Navien NPE-240A demands
      a gas supply capable of flowing 199,000+ BTU at full load. Most existing 1/2-inch
      black iron gas runs feeding a storage water heater can't handle it. Upsizing to
      3/4-inch or 1-inch gas pipe is part of every tankless conversion we scope. WA code
      also requires seismic strapping on all new water heater installations — a permit from
      Tacoma Building & Land Use Services is mandatory, not optional."

faq:
  - q: "How fast can you get to Tacoma for plumbing work?"
    a: "Tacoma, University Place, Fircrest, and Lakewood are all on regular rotation.
      Plumbing scoped as part of a remodel gets a free on-site visit directly with
      Vladislav — no sales staff, no call center. Call (206) 591-1096 to get on the
      calendar and get a line-item quote."
  - q: "Do you install Rinnai and Navien tankless units?"
    a: "Both are installed regularly in Pierce County homes. Rinnai and Navien require gas
      line upsizing, Category III or IV venting through the exterior wall, and a permit
      before final inspection. Fixture-level plumbing — Moen, Kohler, Delta — is handled
      as part of bathroom and kitchen remodel scopes."
  - q: "What does a plumbing scope cost in a Tacoma renovation?"
    a: "Scope drives the number entirely. A bathroom repipe with new Kohler fixtures is a
      different job than converting galvanized to PEX throughout a 1,500 sq ft house.
      TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023 —
      Vladislav quotes line-item pricing after a free on-site walk. Deadline commitments
      go into the contract with penalty clauses, not verbal assurances. Call (206) 591-1096
      or schedule online."