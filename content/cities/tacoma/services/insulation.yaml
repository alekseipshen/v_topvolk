title: "Tacoma Insulation — Fix the Envelope Before Heating Bills Win"

intro: |
  Stadium District homes and North End Craftsmans — a lot of them built between 1910
  and 1935 — sit over unencapsulated crawl spaces with 37-plus inches of annual
  rainfall pressing moisture up through the floor system every winter. A Mitsubishi
  mini-split or a Navien tankless water heater doesn't stand a chance against a
  building envelope that's leaking conditioned air through the rim joists and an
  attic with four inches of compressed original batt. The equipment runs. The house
  stays cold. The bill arrives anyway.

localContext: |
  Zip code 98406 — Proctor, North Slope, and the upper North End — has dense
  concentrations of 1920s and 1930s Craftsman bungalows with post-and-pier
  foundations and no vapor barrier in the crawl space. The 98405 corridor through
  Hilltop and Central Tacoma carries a lot of 1940s-1960s housing stock where
  attic insulation was last touched during the 1970s energy crisis retrofits —
  R-11 fiberglass batts in cavities that now need R-49 under Washington State
  Energy Code. Pierce County PALS handles permit review for most of the
  unincorporated fringe, and Tacoma's own building department covers city limits.

commonProblems:
  - title: "Open Crawl Space With No Vapor Barrier or Encapsulation"
    description: |
      Tacoma soil moisture in winter is relentless. An unencapsulated crawl space
      under a 98409 home means ground moisture migrates up into the floor joists,
      subfloor sheathing, and eventually the living space above. The fix is a
      continuous 6-mil poly vapor barrier across the floor, sealed at the piers and
      foundation walls — or a full rigid foam encapsulation for better performance.
      Homes built before 1950 in the South End and Hilltop almost universally need
      this work done. Mold remediation costs more than vapor barrier installation.

  - title: "Attic R-Value That Hasn't Been Touched Since the 1970s"
    description: |
      Washington State Energy Code requires R-49 in attic assemblies. Most Tacoma
      Craftsmans and mid-century ranchers in 98406 and 98408 have original R-11
      to R-19 fiberglass batt that's compressed and settled over 40-plus years.
      Blown-in cellulose fills irregular joist bays more completely than new batt —
      especially in the knee wall cavities of 1.5-story homes where the geometry
      makes batt installation sloppy. PSE and Puget Sound Energy both offer rebates
      on qualifying insulation upgrades. Worth running those numbers before writing
      the check for materials.

  - title: "Rim Joist Air Sealing — The Forgotten Leak Point"
    description: |
      The rim joist runs the full perimeter of the foundation and connects the
      mudsill to the floor framing. In most pre-1960 Tacoma homes, it's uninsulated
      and full of gaps where cold air infiltrates at floor level. Closed-cell spray
      foam applied directly to the rim joist seals air and adds R-13 to R-21 in
      a 2-inch pass — in one step, not two. CertainTeed batt stuffed in there as a
      retrofit performs poorly because it doesn't air-seal. Spray foam does both.
      It's one of the highest-ROI insulation improvements in an older home.

faq:
  - q: "How fast can you get to Tacoma for an insulation consultation?"
    a: |
      Tacoma is a regular part of our Pierce County work. Most free on-site
      consultations can be scheduled within a week. Vladislav comes out, walks
      the crawl space and attic, and gives you actual numbers — not a range.
      Call (206) 591-1096 to set up a time.

  - q: "What insulation products do you typically use for Tacoma projects?"
    a: |
      Blown-in cellulose (loose-fill) for attic retrofits in Craftsman joist bays.
      CertainTeed fiberglass batt for open wall cavities during a full remodel.
      Owens Corning rigid foam board for crawl space encapsulation. Closed-cell
      spray foam on rim joists and band joists. Application drives the choice —
      not brand preference.

  - q: "Does attic insulation work in Tacoma require a building permit?"
    a: |
      Straight blown-in insulation added to an existing attic — no structural
      changes — typically doesn't trigger a permit through Tacoma's building
      department. If the insulation is part of a larger remodel scope, Pierce
      County PALS or Tacoma's permit center will include it in plan review.
      TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017.
      Vladislav can tell you on the consultation call exactly what requires a
      permit pull for your specific job. Call (206) 591-1096.