title: "Tacoma Deck Installation — Built for PNW Rain and Pierce County Code"

intro: |
  Point Defiance Park sits a few blocks from some of Tacoma's most
  established residential streets — North End homes in 98407 with big
  backyards, tall firs casting north-facing shade, and decks that soak
  up 40 inches of annual rain. Cedar boards installed a decade ago in
  the Proctor District are showing every year of that moisture. Trex
  Transcend and TimberTech Azek composite exist for exactly this climate.
  Vladislav Volkov has completed 100+ projects across Pierce and King
  counties since 2023. WA Licensed Contractor. Call (206) 591-1096.

localContext: |
  Tacoma's housing stock runs from 1910s Craftsman bungalows in the
  Stadium District and North End (98403, 98406) to 1970s-80s ranchers
  across the South End (98444, 98445). The older homes — post-and-pier
  foundations, original exterior walls — were built before modern ledger
  flashing requirements existed. Many decks on those properties were
  attached directly to the rim joist with no flashing at all. Down in
  Fircrest and University Place, the framing is newer, but Pierce County
  PALS permit requirements apply across all unincorporated areas the same.

commonProblems:
  - title: "Ledger rot from missing flashing — the silent failure on 1930s-60s Tacoma homes"
    description: |
      The ledger board is what connects your deck structure to the house
      rim joist. On North End and Stadium District homes built before 1970,
      that connection was often made with no flashing — or tar paper that
      failed years ago. Water intrudes, the rim joist rots behind the
      Hardie or wood siding, and the structural attachment fails quietly.
      Pierce County PALS requires a ledger flashing inspection at rough-in
      before framing can proceed to the next stage.

  - title: "Post footings too shallow — freeze-thaw heaving in South Hill and Graham"
    description: |
      Tacoma's frost line sits around 12 inches. Out toward South Hill and
      Graham, freeze-thaw cycles hit harder. Deck footings poured at 6-8
      inches — common on 1980s South End builds — heave over time and rack
      the entire frame. Code now requires footings to undisturbed soil depth
      with ground-contact pressure-treated (PT) lumber from the footing
      connection up. Anything less and the structure moves every winter.

  - title: "Guardrail height and stair stringer compliance flagged at sale"
    description: |
      IRC requires 36-inch guardrails on decks more than 30 inches above
      grade. Plenty of Tacoma decks built in the 1980s and 90s don't meet
      this — and stair stringers on those same decks often have non-code
      rise/run ratios and no graspable handrail. Pierce County PALS won't
      retroactively approve unpermitted work without corrections. A flagged
      deck at inspection kills sale timelines fast. Fiberon and Trex railing
      systems are both code-compliant and retrofit onto existing framing
      when the decking itself is still sound.

faq:
  - q: "How fast can you get to Tacoma for a deck consultation?"
    a: |
      Vladislav covers Tacoma regularly — North End, Hilltop, South End,
      Proctor, and University Place. From Seattle it is 35-45 minutes via
      I-5 depending on time of day. Call (206) 591-1096 to schedule a free
      on-site consultation. No sales staff — you talk to the contractor.

  - q: "Cedar or composite decking — which actually holds up in Tacoma's rain?"
    a: |
      Cedar grays and grows moss within 2-3 years on north-facing decks in
      98407 without annual sealing. Trex Transcend and TimberTech Azek
      need none of that maintenance. For covered decks or south-facing
      exposure with good drainage, cedar is still a reasonable choice. For
      everything else in Tacoma's climate — composite is the practical call.

  - q: "What does the Pierce County deck permit process look like and how long does it take?"
    a: |
      Decks over 200 square feet or 30 inches above grade require a building
      permit through Pierce County PALS. Plan review typically runs 2-4
      weeks for a standard attached deck. Two inspections follow: rough-in
      (ledger flashing and joist framing) and final. Construction itself
      takes 2-4 weeks once permits are approved. Deadline penalties are
      written into the contract — not a promise, a clause.