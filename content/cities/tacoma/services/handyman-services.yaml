  - q: "Do small repairs in Tacoma require Pierce County permits?"
    a: "Most punch list items — fixture replacements, drywall patches, weatherstripping, deck board swaps — fall below Pierce County PALS permit thresholds. Structural work, electrical panel upgrades, or anything that changes the building envelope is a different category. The on-site estimate clarifies exactly what needs a permit application before any work starts. Vladislav pulls permits directly — no third-party filing services, no delays waiting on paperwork handoffs. Call (206) 591-1096 to schedule the free on-site walkthrough. WA Licensed Contractor, 100+ projects completed since 2017."