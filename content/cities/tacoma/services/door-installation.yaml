title: "Tacoma Door Installation — Frames, Thresholds, Real Hardware"

intro: |
  Point Defiance Park anchors Tacoma's North End, and the craftsman bungalows along North 30th in 98407 look solid from the street. Pull the exterior casing on any of them and you often find decades of Commencement Bay moisture behind it — Z-bar flashing never installed, sill rot, jambs that shifted enough to rack the whole pre-hung unit out of square. Vladislav Volkov has replaced and reframed entry systems across the Proctor and Stadium Districts since 2017: fiberglass Therma-Tru units, properly shimmed doors, Schlage Encode deadbolts set into new jamb stock.

localContext: |
  Tacoma's housing breaks into clear eras by neighborhood. The North End and Stadium District (98403, 98406) hold Craftsman bungalows built 1905-1930 with original Douglas-fir door frames — most show rot at the sill or head casing where Z-bar flashing was never installed or failed long ago. South Tacoma and 98409 run 1960s-70s ranch homes originally fitted with hollow-core interior slabs in framing that wasn't built for modern pre-hung units. Both situations need different approaches to framing, and both may require Pierce County PALS review if the rough opening changes size.

commonProblems:
  - title: "Rotted Fir Jambs on Pre-1940 North End and Stadium District Entry Doors"
    description: |
      Original Douglas-fir door frames on these craftsman homes absorb moisture through failed Z-bar flashing at the head casing — a problem that compounds every wet season. Once the jamb softens, the pre-hung unit racks in the opening, the Schlage deadbolt strike plate stops aligning, and the threshold seal collapses. Full replacement — new king studs, jack studs, and a properly flashed sill pan with self-adhesive membrane — is the actual fix. Swapping just the door slab puts you back in the same situation within five years.
  - title: "Patio Sliding Door Frame Separation on South Tacoma 1970s-80s Homes"
    description: |
      Builder-grade aluminum sliding doors in 98444 and 98445 show frame separation at the head jamb after 30+ years of PNW rain cycling. The frame pulls away from the siding, breaks the air seal, and lets condensation track down the wall cavity to the subfloor rim joist — a moisture path that invites rot and mold. Upgrading to a Milgard or Pella multi-slide system requires stripping the casing back to the sheathing and reflashing the entire rough opening before the new frame drops in.
  - title: "Smart Lock Fitment Issues on Thick Craftsman-Era Door Stiles"
    description: |
      August and Schlage Encode smart locks are dimensioned for modern 1-3/4-inch door slabs. Craftsman-era entry doors in the Stadium District and Proctor area often run 1-7/8 inch or thicker, and the standard backset distance doesn't line up with the hardware bore layout. Getting it right means a new bore, a mortised latch pocket, and an updated strike plate recessed into the jamb. Sometimes a full slab replacement is the cleaner path — Vladislav measures on site before recommending anything.

faq:
  - q: "How fast can you get to Tacoma for door installation?"
    a: |
      Tacoma is a 30-40 minute drive depending on I-5 and SR-16 traffic. Most consultations schedule within a week of first contact. Rough installation timelines run 1-2 days for a single entry system, longer if framing repair is involved. Call (206) 591-1096 to get a date on the calendar.
  - q: "What door brands do you install in Tacoma?"
    a: |
      Therma-Tru and Milgard are the two brands we specify most for Tacoma entry and patio door work. Both handle PNW moisture cycling well and carry solid manufacturer warranties on the frame and glass. We also install Pella sliding systems, JELD-WEN interior pre-hung units, and August or Schlage Encode smart lock hardware on any entry door we frame.
  - q: "Does a Tacoma door replacement require a permit, and how long does it take?"
    a: |
      Door-for-door swaps in the same rough opening generally don't need a Pierce County PALS permit. Structural changes — widening the opening, replacing a load-bearing header, or adding a new opening — do trigger plan review, typically adding 3-6 weeks. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017. Vladislav walks you through the permit picture at the free on-site consultation.