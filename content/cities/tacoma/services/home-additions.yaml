title: "Tacoma Home Additions — Space Built for How You Actually Live"

intro: |
  Stadium District bungalows and postwar ranchers in the North End weren't designed for multigenerational households. Tacoma's tight housing market has pushed homeowners toward ADUs and in-law suites — a detached unit out back with a KitchenAid range and separate entrance, or a second story near Point Defiance Park instead of moving further out. Vladislav has completed 100+ projects across King, Pierce, and Snohomish counties since 2017. Penalties for missed deadlines are written into the contract — you talk to the WA Licensed Contractor directly, not a sales coordinator.

localContext: |
  Tacoma's residential housing splits between pre-war Craftsman stock in the Stadium District and North End (zip codes 98402, 98403) and mid-century ranchers in South Tacoma and the 98444 corridor toward Parkland. The older homes — post-and-pier foundations, original Douglas-fir framing — require structural calculations before any second-story addition goes on the permit drawings. The 1960s–70s ranchers typically carry additions better on their poured perimeter foundations, but their original subpanels are almost always undersized once you add livable square footage with full MEP requirements.

commonProblems:
  - title: "ADU Setbacks and FAR Compliance Under Pierce County PALS"
    description: |
      WA HB 1337 (2024) allows two ADUs per single-family lot statewide, but Pierce County PALS still enforces specific setback and lot coverage rules — typically 5-foot side and rear setbacks for a DADU, with a 24-foot height cap. Smaller lots in the 98404 and 98408 zip codes frequently bump up against FAR limits before the footprint reaches a livable size. Unincorporated areas near 98444 and 98446 route through Pierce County PALS too — not the City of Tacoma — so jurisdiction matters before drawings get submitted. A pre-application meeting catches these constraints before redesign costs money.
  - title: "Structural Load Before a Second Story Goes on Plans"
    description: |
      Craftsman homes in the Stadium District and North End were built on post-and-pier foundations — not engineered for second-story loads. A licensed structural engineer has to review the existing framing before permit submittal. That review often surfaces the need for LVL beam replacements, PSL post upgrades, or new perimeter footings. Finding this at rough-in inspection instead of up front pushes a project two months past the original schedule. A Mitsubishi mini-split for the new HVAC zone avoids rerouting ductwork through finished walls entirely.
  - title: "Matching Siding and Roofline on a 1910s–1930s Bungalow"
    description: |
      Connecting an addition to a century-old Tacoma bungalow means matching exterior siding that's weathered through 100 Pacific Northwest winters. Original cedar shake and lap siding doesn't hold paint the way Hardie cement-board does. Hardie can be profiled to echo the original detailing and won't rot in PNW rain. The roofline connection requires proper ledger board flashing and a continuous vapor barrier — miss either and moisture intrusion shows up within a couple of wet seasons.

faq:
  - q: "How quickly can TopVolk start on an addition project in Tacoma?"
    a: |
      Consultations are usually scheduled within a week. Vladislav comes to the site directly — no estimating staff between you and the contractor. For projects in Tacoma or unincorporated Pierce County, call (206) 591-1096 to set up a free on-site visit. The consultation covers the existing structure, setback measurements, a realistic permit timeline, and a line-item quote before any contract is signed.
  - q: "Which window and siding brands do you spec for Tacoma additions?"
    a: |
      Milgard is the standard window choice for most Pierce County projects — local distributor, solid warranty, and profiles that fit both Craftsman and ranch-style openings. Hardie handles the marine climate better than vinyl or wood for new siding on an addition. Exterior doors are typically Pella or Milgard. For HVAC in the new space, a Mitsubishi mini-split is usually cleaner than extending existing ductwork — especially in Tacoma's older homes where duct runs are already at capacity.
  - q: "What does a home addition in Tacoma cost and how long does permitting take?"
    a: |
      A detached ADU runs $150K–$250K in today's Tacoma market. A ground-floor in-law suite or room addition lands between $60K–$140K depending on scope and finishes. Pierce County PALS plan review adds 6–10 weeks upfront — build that into the schedule from day one. Drawings that need revisions push that window further. End-to-end for an ADU: 5–8 months. Smaller additions: 3–5 months. Deadline penalties are written into the contract.