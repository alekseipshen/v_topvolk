title: "Tacoma HVAC — Heat Pump Conversions & Mini-Split Installs"

intro: |
  Stadium District and North End homes — zip 98403 — were built in the 1920s and 30s with coal-fired gravity furnaces that got retrofitted to gas. Original ductwork, where it exists, was sized for a different era. Point Defiance Park sits two miles from houses still running 80% AFUE furnaces. Mitsubishi Electric heat pumps now qualify for $2,000 federal tax credits under the IRA — and Pierce County PALS processes HVAC permits faster than Seattle SDCI. Vladislav Volkov handles these projects directly. 100+ projects completed since 2017 across King, Pierce, Snohomish, and Kitsap counties — not a franchise, not a call center.

localContext: |
  Tacoma's housing stock runs the full range. The North End (98407) has Craftsman bungalows and 1920s four-squares with original galvanized ducts snaking through uninsulated crawlspaces — moisture intrusion guaranteed after every wet season. Seattle gets the headlines, but Tacoma absorbs the same 37 inches of annual rainfall, and north-facing crawlspaces here grow mildew the same way.

  South Tacoma (98444) and the Eastside (98404) have 1960s ranchers and split-levels with builder-grade forced-air systems 20 or more years past their design life. Most have no cooling at all — gas heat and a box fan in August. Hilltop (98405) sits a zip code away from homes that have never had ductwork of any kind.

  TopVolk is a WA Licensed Contractor operating out of the Seattle Metro. Tacoma is 35 minutes south via I-5 — not a stretch market, a regular one.

commonProblems:
  - title: "Aging gas furnaces running at 65-75% AFUE in Stadium District and Hilltop homes"
    description: "Pre-1990 furnaces in older Tacoma neighborhoods burn 25-35 cents of every gas dollar out the flue. The heat exchanger cracks first — sometimes visible as soot tracking near the burner box — then the inducer motor follows. A Trane or Carrier high-efficiency replacement (96%+ AFUE) with sealed combustion and PVC venting cuts that waste and qualifies for IRA rebates. TopVolk handles the Pierce County PALS permit and installation under one contract, with a deadline penalty written in. If we miss the agreed completion date, we pay — not vague promises, actual contract language."

  - title: "No cooling in homes never wired or ducted for AC"
    description: "Ranchers in zip 98405 and 98408 were built heat-only. Adding central AC onto existing ductwork requires a Manual J load calculation — undersized ducts cause the evaporator coil to ice over and the compressor to short-cycle inside a season. Ductless Daikin or Mitsubishi mini-splits sidestep that problem entirely. They work in ADUs, room additions, and older homes where cutting new duct chases through finished floors isn't realistic. WA HB 1337 now allows two ADUs per single-family lot statewide, which has doubled mini-split demand across Pierce County. Separate utility meter, separate HVAC zone — the mini-split handles both without touching the main system. Call (206) 591-1096 to schedule an on-site load assessment."

  - title: "Duct leakage causing hot and cold zones throughout the house"
    description: "1970s-80s homes in South Tacoma (98444) and around the Lincoln District have flex duct runs taped with standard foil tape that's been separating for decades. Conditioned air leaks into unconditioned attic space — effectively heating or cooling your roof deck. Duct sealing with Aeroseal or hand-applied mastic mesh, followed by damper rebalancing and a blower-door test before and after, fixes the hot-bedroom-cold-hallway pattern most homeowners have accepted as normal. It's not normal. It's a 20-year-old installation that was marginal when new."

