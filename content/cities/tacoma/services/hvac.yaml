  - q: "Do you install Mitsubishi and Daikin systems in Tacoma?"
    a: "Yes — Mitsubishi Electric and Daikin are the two mini-split lines we install most often for additions and ADUs in Pierce County. Both qualify for IRA tax credits. Trane and Carrier for forced-air replacements. Sizing per Manual J, permit filing with Pierce County PALS, equipment supply, and full installation are handled under one contract. 100+ projects completed since 2017 means we've seen the duct configurations in North End four-squares and the crawlspace moisture issues in South Tacoma ranchers — not guessing at what the job will find."

  - q: "What does an HVAC permit cost in Pierce County and how long does it take?"
    a: "Pierce County PALS typically turns residential HVAC permits in 1-3 weeks — noticeably faster than Seattle SDCI's queue. Permit fees run $150-$400 depending on scope. Full heat pump replacement with ductwork usually takes 2-4 days of install after permit approval. Rough-in inspection and final inspection are scheduled through PALS — we coordinate both. TopVolk is a WA Licensed Contractor; permit applications go under our license, not subbed out. Call (206) 591-1096 for a line-item quote and a realistic project timeline."

  - q: "Is there a penalty if the project runs late?"
    a: "Yes. Deadline penalty is written into the contract — if TopVolk misses the agreed completion date, we pay a daily penalty. That's not a marketing line; it's enforceable contract language. Vladislav has personal accountability on every job because he's the one on-site, not a project manager two layers removed from the work. Schedule a free consultation at (206) 591-1096 to discuss scope and timeline before signing anything."