title: "Tacoma Painting — Pre-1978 Lead Paint, Cedar & Hardie Repaint"

intro: |
  Stadium District and North End Tacoma (98403) are loaded with Craftsman and
  four-square homes from the 1910s and 1920s — original fir trim, cedar shake
  siding, and paint that's been layered on for a century. Tacoma gets 37+ inches
  of rain annually, and those north-facing walls collect moss and moisture fast.
  After a kitchen remodel where you've installed new KitchenAid cabinetry or
  reconfigured the layout, the adjacent trim and walls almost always need a full
  repaint to match. TopVolk is a WA Licensed Contractor — 100+ projects completed
  since 2017 across King, Pierce, and Snohomish counties.

localContext: |
  Tacoma's housing stock skews older. Proctor District (98406) and Hilltop (98405)
  are dense with pre-1978 construction — Craftsman bungalows, brick four-squares,
  mid-century ranchers near South Tacoma Way (98409). Every single one of those
  homes requires EPA RRP lead-paint testing before any sanding or surface prep.
  That's a hard legal requirement, not a upsell. Exterior repaint cycles here run
  5–7 years minimum; cedar shake on north-facing walls often needs attention at
  year 4 given the Puget Sound marine climate and the shade coverage around
  Point Defiance Park's neighboring residential blocks.

commonProblems:
  - title: "Pre-1978 Lead Paint — EPA RRP Protocol Required Before Any Surface Prep"
    description: "Pierce County has a high concentration of pre-1978 homes, and Tacoma's
      older neighborhoods are full of them. EPA RRP compliance means certified lead
      testing, HEPA vacuum work, plastic sheeting containment, and documented
      disposal — before a single pass with a sander. Sherwin-Williams Duration topcoat
      is an excellent finish coat, but it won't fix a skipped RRP protocol. Federal
      non-compliance fines start at $37,500 per violation."

  - title: "Cedar Shake Blister and Cup — North-Facing Gables in Tacoma's Rain Shadow"
    description: "North-facing cedar shake on older Tacoma homes — Stadium District,
      Hilltop, Old Town — blisters and cups within 4–5 years without proper primer
      adhesion. The fix isn't just another coat of paint. It's a full power-wash,
      spot-prime on any bare wood, and a two-coat acrylic application with adequate
      dry time between coats. James Hardie fiber-cement siding holds a repaint 10–15
      years when prepped correctly, but skipping the prime coat causes peeling within
      two wet seasons."

  - title: "Interior Trim Repaint After Remodel — Color Match and Finish Consistency"
    description: "After a bathroom gut or kitchen remodel, matching existing wall color
      is rarely plug-and-play. New recessed lighting shifts how paint reads at different
      times of day; Pacific Northwest diffuse winter light flattens warm tones; Benjamin
      Moore Aura's LRV (light reflectance value) matters more here than in sun-heavy
      markets. Rooms facing west toward Commencement Bay need a different color strategy
      than south-facing rooms. We document existing finishes before demo and coordinate
      a color pass before the first brush touches the wall."

faq:
  - q: "How fast can you get to Tacoma for a painting consultation?"
    a: "Tacoma is a core service area — most zip codes from 98402 to 98409 can get a
      same-week on-site visit. Vladislav does all consultations personally, no sales
      staff. Call (206) 591-1096 or schedule online. Parking in Stadium District and
      Old Town is straightforward; North End is easy too."

  - q: "What paint brands do you use on Tacoma homes?"
    a: "Sherwin-Williams Duration Exterior and Benjamin Moore Aura Interior are the
      defaults — both hold up through Tacoma's wet winters. On Hardie cement-board
      siding, we spec a Sherwin-Williams Loxon primer before the topcoat. Prep is
      what determines longevity, not brand loyalty."

  - q: "What's the typical timeline for an exterior repaint in Tacoma?"
    a: "Pre-1978 homes need EPA RRP lead testing first — plan 2–3 business days for
      that result. Then: power-wash and dry time (2–3 days minimum in Tacoma's climate),
      spot-prime bare wood or Hardie seams, two finish coats with cure time between.
      Full exterior on a standard Craftsman or rancher runs 6–10 business days. No
      Pierce County PALS permit required for painting alone — only when structural
      repairs are bundled in scope. Book before September; Tacoma's fall rain season
      closes the exterior painting window fast."