title: "Tacoma Drywall Installation — Popcorn Removal to Level 5 Finish"

intro: |
  Stadium District bungalows and the 1940s Cape Cods near Wright Park (98403) were built on wood lath and horsehair plaster — not drywall. Crack one open for a Bosch dishwasher rough-in or a bathroom vent relocation, and you're dealing with a plaster-to-drywall transition that telegraphs every flaw under sidewall lighting. Tacoma averages 37 inches of rain per year. That moisture finds wall cavity gaps fast, especially in older homes with no vapor barrier protecting crawlspace framing.

localContext: |
  South Tacoma zip codes 98444 and 98445 run dense with 1955-1975 ranchers and split-levels — builder-grade texture ceilings, single-layer drywall over studs, no insulation in interior partition walls. The Hilltop neighborhood (98405) adds a layer of 1930s-1940s two-stories with original plaster still intact in places. Converting a garage, finishing a basement, or adding a second bathroom in either area means cutting new openings, running MEP rough-in through existing framing, and patching back to match existing surfaces. Pierce County PALS requires permits for structural changes, and inspectors check the drywall scope against the approved plans.

commonProblems:
  - title: "Skim-Coating Popcorn and Skip-Trowel Ceilings in 1970s Ranchers"
    description: |
      Skip-trowel and popcorn ceiling textures were standard on South Tacoma builds from the 1960s through the early 1980s. Any pre-1980 popcorn requires asbestos testing before mechanical removal — that step is not optional under Pierce County code. After abatement, a proper Level 5 skim coat means two to three passes of USG all-purpose joint compound, sanded between each coat, then primed before paint. Recessed lighting in a remodeled kitchen or bath will expose every flaw in a rushed finish.
  - title: "Mold-Resistant Purple Board in Bathrooms, Laundry Rooms, and Basements"
    description: |
      Tacoma crawlspaces stay damp from October through May without a polyethylene vapor barrier laid on the ground. Standard paper-faced drywall in a bathroom, laundry room, or below-grade space will fail within two to four years under those conditions. National Gypsum purple board or USG Mold Tough is the correct spec for high-humidity zones. Pierce County inspectors look for moisture-rated board on the finish inspection walkthrough — standard greenboard no longer satisfies the requirement in most wet areas.
  - title: "5/8-Inch Type-X Firecode Drywall for Garage and ADU Separation Walls"
    description: |
      WA HB 1337 (2024) allows two ADUs per single-family lot statewide, and garage conversions are among the most common DADU projects in Tacoma. The wall and ceiling separating any garage from living space require 5/8-inch Type-X firecode drywall — mandatory under IRC, and verified at rough-in inspection by Pierce County PALS. Standard 1/2-inch drywall fails the fire rating. Miss it on the rough-in, and you're tearing out finished work before the project can move forward.

faq:
  - q: "How fast can you get to Tacoma for a drywall project?"
    a: |
      Tacoma is 35-45 minutes from Seattle on I-5 — closer from the South King County side. Vladislav comes out for a free on-site consultation to scope the work before any permit is pulled. No commissioned closer, no back-and-forth with a scheduler. Call (206) 591-1096 to set it up. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017.
  - q: "What drywall materials do you use for Tacoma bathrooms and kitchens?"
    a: |
      High-humidity areas — bathrooms, laundry rooms, basement ceilings — get National Gypsum or USG Mold Tough purple board, not greenboard. Kitchen areas near KitchenAid or Samsung appliance installs use standard 1/2-inch or 5/8-inch depending on fire separation requirements between adjacent spaces. Wet tile surrounds in showers get Schluter Kerdi waterproofing membrane instead of drywall backing entirely.
  - q: "What does drywall installation cost for a remodel in Tacoma, and are permits required?"
    a: |
      A single bathroom typically runs $1,200–$2,800 for hang, tape, mud, and finish — the gap comes down to Level 4 vs. Level 5 finish and whether moisture-rated board is needed. ADU separation walls and new structural openings require a Pierce County PALS permit. Vladislav provides a line-item quote, not a ballpark range, and missed deadlines carry a financial penalty written into the contract. Call (206) 591-1096.