  - q: "Can you build a garage with an ADU apartment above it in Tacoma?"
    a: |
      Yes — WA HB 1337 (2024) made this straightforward statewide, and most Tacoma lots can support the footprint. The structural package requires LVL headers, engineered joist hangers, and a separate subpanel for the ADU unit. Pierce County PALS handles the permit application. End-to-end timeline including plan review and construction typically runs 5-7 months. Deadline penalties are written into the contract — not a verbal promise.
  - q: "What does a detached garage build cost in Tacoma, and what's included?"
    a: |
      A straightforward 2-car detached garage in Tacoma runs $55,000-$90,000 depending on slab thickness, finishes, EV pre-wire, and structural requirements. Add $60,000-$120,000 for a finished ADU above. Scope includes foundation, framing, Hardie or cedar siding, roofing, and electrical rough-in to panel. Vladislav provides a direct quote with line items — no vague ranges, no commissioned salesperson. Call (206) 591-1096 or schedule a free on-site visit.