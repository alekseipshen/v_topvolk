title: "Tacoma Garage Construction — Wet Winters, ADU Ready"

intro: |
  North End blocks between Proctor and the Stadium District hold some of Tacoma's oldest housing stock — 1920s Craftsman bungalows on tight lots, most without a usable garage. Heavy rain from October through April makes proper drainage and a fiber-reinforced concrete slab non-negotiable, not a nice-to-have. One recent build in 98407 paired a 24x24 detached garage with a Mitsubishi mini-split rough-in so the homeowner could run a heated workshop through the wet season. Vladislav Volkov handles every consultation personally — call (206) 591-1096 to schedule.

localContext: |
  Most permits for new garage builds in Tacoma route through Pierce County PALS, though city-annexed parcels may also require review through Tacoma's own building department. Lots in zip 98406 and 98405 — especially near Point Defiance — often carry utility easements and setback restrictions that shrink the buildable envelope more than homeowners expect. Pre-war lots run 40-50 feet wide in many blocks, which affects FAR calculations and whether a DADU above the garage is code-compliant. An older Craftsman on a standard-depth Tacoma lot may only support a 20x22 footprint before triggering variance review.

commonProblems:
  - title: "Adding a Rentable ADU Above the Garage Under WA HB 1337"
    description: |
      Washington's 2024 ADU law allows two accessory dwelling units per single-family lot — and a DADU with living space above a new garage is one of the most efficient uses of that allowance. The structural load from a second floor requires an LVL beam at the main garage header and engineered joist hangers throughout, not standard framing lumber. Homeowners planning a studio unit up top also need a subpanel or 200A main upgrade. An LG or GE range in a small kitchenette adds another 40A circuit to the electrical scope. All of this goes through Pierce County PALS plan review, which currently runs 8-14 weeks for projects with ADUs.
  - title: "Setback Conflicts and Irregular Lot Lines in Older Tacoma Neighborhoods"
    description: |
      Lots in 98405 and 98409 were platted long before modern setback rules — rear-yard detached garages often hit the required five-foot side setback or 20-foot rear setback before the footprint is large enough to be useful. Tacoma also has alley-loaded lots where the garage placement has to account for fire access and easement widths. A site visit is the only way to confirm actual buildable area before committing to design drawings. Getting a licensed contractor on-site early — before you pay a designer — saves real money when setbacks eliminate the original concept entirely.
  - title: "Concrete Slab Specs, EV Pre-Wire, and Matching the Existing Exterior"
    description: |
      Code minimum is a 4-inch fiber-reinforced concrete slab, but workshop-grade use calls for 5-6 inches with control joints and a pressure-treated sill plate at the perimeter. Pre-wiring a 50A or 60A circuit for an EV charger during the pour runs $400-700 in conduit and wire — doing it after the slab cures means cutting concrete and core-drilling the foundation wall. Exterior siding matters too: Hardie cement-board on the new structure matches reasonably well to original wood Craftsman siding and handles Tacoma's wet winters and north-facing moss growth far better than painted OSB.

