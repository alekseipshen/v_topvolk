title: "Tacoma Carpentry — Craftsman Trim & Built-ins Done Right"

intro: |
  The Proctor District (98407) holds Tacoma's densest concentration of 1910s-1930s
  Craftsman bungalows — original fir casings, built-in window seats, beadboard
  wainscoting that most contractors either butcher or ignore entirely. Pacific rain
  does steady damage to exterior cedar trim, especially on north-facing elevations.
  Half the calls from Stadium District (98403) start with a KitchenAid refrigerator
  swap that revealed particle-board cabinet boxes soaked through behind the toe kick.
  Worth fixing properly. Old-growth fir trim in these houses is irreplaceable — the
  grain density doesn't exist in new-growth lumber. Matching it takes templating, not
  a trip to Home Depot.

localContext: |
  Tacoma's North End zip codes — 98407 and 98406 — are where the original-era Craftsman
  stock concentrates, houses built 1910-1935 with Douglas-fir framing and clear-grain
  fir trim throughout. Many of these homes still have their original built-in buffets,
  box beam ceilings, and interior window seats with under-seat storage — all in fir that's
  darkened to a deep amber over a century. The Eastside and South End (98404, 98408) lean
  toward 1950s-1960s ranchers with hollow-core doors and builder-grade casings. Lincoln
  District (98404) has a mix of mid-century duplexes where flat-sawn pine casing got
  painted over so many times the profile is nearly unreadable until you strip it. City
  of Tacoma permits run through the permit center on Fawcett Avenue; structural carpentry
  that touches framing or load-bearing elements requires a building permit and inspection
  before drywall closes. Pierce County PALS handles anything in unincorporated Pierce
  County just outside city limits — areas like Fircrest, University Place, and the
  South Hill fringe. Plan review at the city runs 2-4 weeks for straightforward
  carpentry-related structural work; PALS is similar.

commonProblems:
  - title: "Rotted Cedar Fascia on North-Facing Rooflines"
    description: >
      North End homes in 98407 average 37+ inches of rain per year hitting the same
      fascia boards since the 1920s. Cedar rots from behind where you can't see it —
      probe first with an awl, not just by looking. If more than 30% of the board depth
      is soft, full replacement is the call. Options are Hardie trim board (cement-fiber,
      zero rot, paintable) or new clear vertical-grain cedar if matching original profile
      matters. Either way, re-flash the drip edge and replace any deteriorated backer
      before primer goes on, or the rot cycle restarts in five years. Blocking between
      rafters at the eave also needs inspection — that cavity traps moisture too.
  - title: "Undersized Stair Stringers in Pre-War Tacoma Homes"
    description: >
      Original 1920s-1930s stringers in older Stadium District homes often lack the
      3.5-inch net depth required under current IRC load tables. A bouncy or cracking
      stair is structural, not cosmetic. Fix means sistering a new LVL stringer alongside
      the original, resetting treads with construction adhesive and screws (not finish
      nails), and refinishing to match existing risers and the handrail profile. If the
      handrail post anchors directly to a bad stringer, that gets rebuilt too — the whole
      assembly has to transfer load properly. Pierce County PALS requires a permit and
      rough-in inspection before the stair gets enclosed on structural stringer repairs.
  - title: "Casing Profile Mismatch After Pella or Milgard Door Swaps"
    description: >
      Craftsman casings in Stadium District (98403) use a flat 3.5-inch board with
      back band and a 5/4 plinth block — profiles home-center lumber no longer carries.
      Installing a new Milgard or Pella prehung unit without matching the existing trim
      leaves a visible splice at every opening. We template the existing profile and
      source or mill matching stock before the door goes in, not after. Sometimes the
      original plinth blocks are intact but the leg casing is damaged; salvaging and
      reintegrating original material is faster than trying to replicate a century of
      patina on new wood.

faq:
  - q: "How fast can you get to Tacoma for carpentry work?"
    a: >
      Tacoma runs regularly alongside King County jobs — Stadium District (98403) is
      about 35 minutes from South Seattle on I-5. Proctor and the North End are another
      10 minutes past downtown. Call (206) 591-1096 to check current availability and
      book a free on-site walk-through with Vladislav. No sales staff, no middlemen —
      you talk directly to the person who will be on-site doing the work.
  - q: "Do you work on Craftsman built-ins and original trim in older Tacoma homes?"
    a: >
      Yes — original fir casings, window seats, beadboard wainscoting with miter
      returns, box beam ceilings, built-in buffets. All of it requires templating and
      careful profile matching, not off-the-shelf stock from a lumber yard. Sourcing
      matching clear-grain fir sometimes means salvage yards; that's part of the scoping
      conversation upfront. Structural trim work that touches framing or stairs goes
      through the City of Tacoma permit center or Pierce County PALS depending on
      jurisdiction. TopVolk is a WA Licensed Contractor and handles the permit process
      start to finish — pulling permits, scheduling inspections, getting signoff.
  - q: "What does a Tacoma carpentry project typically cost and how long does it take?"
    a: >
      Scope sets both numbers. A trim restoration or built-in window seat runs 1-2
      weeks on-site; a full custom pantry or stair stringer rebuild with permits is
      closer to 3-5 weeks including inspection holds. Vladislav provides a line-item
      quote after the walk-through — no vague ranges, no change orders sprung mid-job.
      Deadline penalties are written into every contract. 100+ projects completed
      since 2023 across King, Pierce, Snohomish, and Kitsap counties.