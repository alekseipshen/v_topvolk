title: "Tacoma Power Washing — Moss, Algae & Stain Removal"

intro: |
  Commencement Bay moisture rolls into Tacoma year-round, but October through April
  is when it really stacks up. North-facing surfaces in neighborhoods like Proctor
  and North End — especially the craftsman bungalows around 98406 — start showing
  green by mid-November on cedar, concrete, and Hardie siding alike. Washing isn't
  just cosmetic.

  It determines whether a fresh coat of Cabot stain or exterior primer lasts three
  years or ten. The damp air off the Sound gives surfaces almost no drying window
  between rain events, and organic growth embeds faster here than in drier climates
  east of the Cascades. Address it before painting, staining, or sealing — or the
  prep work is wasted.

localContext: |
  Tacoma's housing stock runs from early-1900s craftsmen in the Stadium District
  (98403) to mid-century ranchers across the South End (98408, 98409) to 1980s and
  90s tract builds in Fircrest and Lakewood. Older properties near 6th Avenue and
  the Hilltop neighborhood often have original concrete that hasn't been cleaned
  since it was poured.

  North- and west-facing surfaces throughout the city collect moss and algae faster
  than most homeowners expect. The damp air off Puget Sound doesn't give surfaces
  time to fully dry between rain events, especially under overhanging tree canopy.

  Point Defiance area homes — particularly the larger lots along N 51st St — deal
  with a double load of canopy shade and proximity to the water. That combination
  keeps wood and concrete surfaces perpetually at the threshold humidity where moss
  and black algae thrive. Stadium High School sits half a mile from some of the most
  heavily colonized cedar fencing in 98403. The homes are beautiful. The maintenance
  load is real.

commonProblems:
  - title: "Moss and Black Algae Colonizing Cedar Decks and Fences"
    description: "Cedar on the north or west face of a house in Tacoma stays wet
      from October through May. Moss works into the wood grain, raises surface
      fibers, and traps moisture — accelerating rot from underneath. Before any
      Cabot or Olympic stain application, the wood needs a soft wash with
      downstream-injected sodium hypochlorite at 1-2% dilution, followed by a
      pressure rinse at 1,200-1,500 PSI. Exceeding 1,500 PSI on cedar raises the
      grain and creates a fuzzy surface that resists stain penetration.

      A lot of Tacoma cedar was installed in the 1990s during the tract build-out
      in South Hill and Parkland. That wood is 25-30 years old now. Some of it
      is still solid. Some of it has punky spots where moisture got trapped under
      moss for a full season. Part of the walkthrough is checking which is which
      before the hose comes out."

  - title: "Efflorescence and Oil Staining on Concrete Driveways"
    description: "Driveways across South End zip codes — 98408 in particular —
      collect two distinct problems: tire marks and oil near the garage apron, and
      white efflorescence where mineral salts migrate up through the slab. A rotary
      surface cleaner attachment running at 3,000 PSI and 3.5-4 GPM throughput
      removes both without leaving the stripe marks a standard wand produces on
      exposed aggregate. The spinning head keeps dwell pressure uniform across the
      full slab.

      Efflorescence is common in slabs poured against uncompacted fill — which
      describes a large portion of Tacoma's older residential lots in 98409 and the
      Lincoln District. It won't hurt the concrete structurally, but it tells you
      water is moving up through the slab. Worth noting if the driveway is also
      showing cracks along the expansion joints."

  - title: "Hardie Siding and Stucco Before Exterior Repaint"
    description: "Hardie cement-board siding is standard on Tacoma's 2000s and 2010s
      builds throughout Lincoln District and much of North End. Chalk oxidation and
      mold on the panel surface cause primer adhesion failure if left in place before
      painting. Soft wash — PSI under 800 with a 5-10 minute surfactant dwell —
      cleans without damaging the factory baked finish. Stucco gets the same
      treatment. Direct high-pressure wanding on stucco pops the surface and creates
      repair costs that dwarf the washing bill."

faq:
  - q: "How fast can you get to Tacoma for Power Washing?"
    a: "Tacoma sits about 35 minutes from Seattle via I-5 South — we're in Pierce
      County regularly. Scheduling within the week is typical. If you have painters
      arriving and need exterior prep locked in before they show up, call
      (206) 591-1096 and we'll coordinate the sequence around your project timeline."

  - q: "Can you clean Trex and TimberTech composite decking without damaging it?"
    a: "Yes. Composite decking — Trex, TimberTech, and similar — runs at 1,200-1,500
      PSI maximum, no turbo nozzle. Mold and algae on composite is mostly a chemistry
      problem, not a pressure problem. We check the manufacturer spec before setup.
      Wrong pressure on composite decking can void the warranty outright, so this
      isn't a detail worth skipping."

  - q: "What does power washing cost in Tacoma, and how long does a job take?"
    a: "A 400-600 sq ft cedar deck runs 2-3 hours on site. Full exterior prep — siding
      wash plus deck plus driveway — typically runs $400-$700 for a single-family
      home in Pierce County. Vladislav does the on-site walkthrough himself. No
      sales staff, no subbed-out estimator. WA Licensed Contractor, 100+ projects
      completed since 2017. Call (206) 591-1096 to schedule — pricing comes back
      as a line-item quote, not a vague range."

  - q: "Do you handle prep washing before a full exterior repaint in Tacoma?"
    a: "That's a common sequence. Painter quotes the job, puts a start date on the
      calendar, and we come in 48-72 hours ahead to wash and let surfaces dry
      completely before primer goes on. For Hardie siding jobs in the Stadium
      District or North End — especially on houses that sat through a wet winter
      without cleaning — that drying window matters. Call (206) 591-1096 early in
      the planning process so the schedule doesn't compress at the last minute."