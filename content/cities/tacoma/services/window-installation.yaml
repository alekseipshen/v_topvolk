title: "Tacoma Window Installation — Craftsman Frames to Egress Cuts"

intro: |
  Point Defiance Park sits two miles from some of the densest Craftsman housing stock
  in the region — North End streets where original wood-frame windows have been
  nursed along for 80-plus years with aluminum storm layers and crumbling glazing
  compound. Tacoma's marine air rolling off Commencement Bay accelerates rot faster
  than any inland city sees. That's where Milgard's fiberglass series starts making
  more financial sense than a fourth coat of paint on a failing sash. Vladislav
  Volkov, WA Licensed Contractor, has completed 100+ projects across Pierce and King
  counties since 2017 — window replacement included.

localContext: |
  The 98407 zip — Proctor District and upper North Tacoma — runs heavily Craftsman
  and Dutch Colonial, built mostly 1910–1935. Single-pane double-hung wood windows in
  these houses carry glazing compound that's been cracked for decades, and
  north-facing walls collect moss that migrates under casings every wet season.
  A lot of those original frames are Douglas-fir — durable when dry, but once
  the exterior paint seal breaks on a west- or north-facing wall, moisture wicks
  straight into the sill horn and bottom rail. By the time the rot is visible from
  inside, the rough-opening framing often needs attention too.
  Further south in 98408, the housing shifts to 1950s–60s ranchers where aluminum
  sliders were the builder-grade choice — most are now fogged from failed IGU seals,
  a direct result of marine humidity cycling through those frames every October
  through April. Down in the Lincoln District and South Tacoma around 98409, you see
  the same era of construction plus some early-80s infill — a mix of vinyl single-pane
  slider replacements that are now 30-plus years old and starting to show corner seal
  failures. The whole corridor from Pacific Avenue west to the Nalley Valley sits
  within earshot of I-5 interchange noise, which makes acoustic glass upgrades a
  practical conversation on almost every job in that stretch.

commonProblems:
  - title: "Egress Window Cuts in Pre-War Tacoma Basements"
    description: "Basement bedrooms in Tacoma's older housing frequently fail the IRC egress
      requirement — a minimum 44-square-inch net clear opening. Pierce County PALS
      requires a permit for any new rough opening cut into a foundation wall, and the
      structural work around the buck framing and window well is not cosmetic. The
      concrete or CMU block cut itself needs a core drill or saw, followed by proper
      header framing — often a doubled 2x10 or LVL beam depending on span — before
      the new frame ever goes in. Milgard makes a dedicated egress casement sized to
      hit code without excavating an oversized well from scratch. PALS plan review for
      this type of structural opening typically runs 3–5 weeks; budget for that lead
      time before scheduling demo."
  - title: "Failed IGU Seals in 1980s–90s Builder-Grade Frames"
    description: "Argon gas migrates out of double-pane insulating glass unit seals after
      15–20 years — the fogging you see means the thermal break is gone, not just the
      view. South Tacoma ranchers from that era are loaded with builder-grade aluminum
      frames where the spacer bar seal has long since collapsed. Replacing the IGU
      insert without touching the frame is often the cost-effective call if the frame
      is still square and the sill is dry."
  - title: "Traffic Noise from I-5 and SR-16 Bleeding Through Old Glass"
    description: "I-5 runs straight through central Tacoma, and SR-16 cuts the west side near
      the Narrows. Houses in the Stadium District and along Pacific Avenue sit within
      half a mile of major interchange traffic. Pella and Marvin both offer acoustic
      laminated glass rated STC 35–40, but compromised rough-opening flashing lets
      sound bypass the glass at the frame perimeter — making the upgrade useless if
      installation detail is sloppy."

faq:
  - q: "How fast can you get to Tacoma for window installation?"
    a: "Tacoma is a regular stop — about 35–45 minutes from South King County on I-5,
      less from Federal Way. North End and Proctor District residential street parking
      works fine. Call (206) 591-1096 to schedule; Vladislav can usually do an on-site
      assessment within the week, not a commissioned closer."
  - q: "Which window brands do you install in Tacoma homes?"
    a: "Milgard is the most common brand we see in Pierce County — Tuscany and Style Line
      vinyl series are standard here. Pella 250 Series and Marvin Elevate show up in
      higher-end North End remodels. Vladislav quotes new installation or IGU-only
      replacement on all three, with line-item pricing on the first visit — no vague
      ranges."
  - q: "Do window replacements in Tacoma require a Pierce County permit?"
    a: "Same-size, same-location retrofit swaps are typically exempt from Pierce County
      PALS review. New rough openings, egress cuts, or structural bay additions require
      permits — PALS plan review usually runs 2–6 weeks. Full window replacement on a
      3-bedroom house takes 2–4 install days once materials arrive; egress cuts with
      structural header work add a few days. Scheduling a free on-site consultation
      with Vladislav at the start pins down which category your project falls into
      before any money changes hands. Missed deadlines have a penalty written into
      the contract — call (206) 591-1096 to get a firm quote and timeline."