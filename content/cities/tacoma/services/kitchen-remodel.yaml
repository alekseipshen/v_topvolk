title: "Tacoma Kitchen Remodel — Load-Bearing Walls & Permit Reality"

intro: |
  Older homes near Tacoma's Stadium High School and through the North End were
  built when kitchens stayed walled off from everything else. A 1918 Craftsman
  on N Yakima doesn't come with counter space for a KitchenAid mixer or room
  for an island — it comes with a 9x10 galley and a wall that may be
  load-bearing. Removing that wall means sizing an LVL beam, pulling a permit
  from Tacoma Development Services, and actually understanding structural load
  paths before swinging a hammer.

localContext: |
  Remodel work in Tacoma splits pretty cleanly between two eras: Stadium
  District and North End Craftsmans from 1900-1925, and South/East Tacoma
  ramblers from the 1950s-70s. Zip code 98405 (Hilltop, South End) has a
  dense concentration of pre-1960s kitchens untouched since original
  construction — galvanized supply lines still feeding the sink, 100-amp
  panels that can't handle induction cooking. The 98407 corridor (North End,
  Proctor District) runs more Foursquare and Craftsman stock with plaster walls
  and old-growth fir floors that require extra care during demo.

commonProblems:
  - title: "Load-Bearing Wall Removal for Open-Concept Layouts"
    description: |
      Many Tacoma kitchens from the 1910s-1950s have a kitchen-to-dining wall
      that carries roof or floor load from above. The bearing point needs
      identifying, the span calculated, and the LVL beam sized correctly before
      any demo begins — undersized beams sag over time. A missed permit from
      Tacoma Development Services can surface on a title report when the home
      eventually sells.
  - title: "Electrical Upgrades for Modern Appliances"
    description: |
      Swapping a gas range for a Bosch or GE Profile induction cooktop requires
      a dedicated 240V circuit. Older 100-amp panels in Tacoma's mid-century
      homes can't support that load without a sub-panel upgrade first. We
      sequence the rough-in inspection before any cabinet installation begins
      so the trades don't step on each other.
  - title: "Galvanized Supply Lines Under the Kitchen Sink"
    description: |
      In zip codes 98405 and 98408, galvanized supply lines under kitchen sinks
      are common in pre-1960 homes. Tacoma's wet winters push moisture through
      crawlspace assemblies, which accelerates corrosion in uninsulated cabinet
      areas. Transitioning that section to copper or PEX adds a day of labor
      but avoids a much bigger problem after the new Samsung or KitchenAid
      refrigerator is installed.

faq:
  - q: "How fast can you get to Tacoma for a kitchen remodel consultation?"
    a: |
      Tacoma is a straight shot south on I-5 from Seattle — typically 30-45
      minutes. Vladislav (owner, WA Licensed Contractor) does the consultation
      himself, not a commissioned closer. Call (206) 591-1096 to book a free
      on-site visit.
  - q: "Do you work with mid-range brands like Bosch, GE, or Samsung in Tacoma kitchens?"
    a: |
      Yes. Most Tacoma remodels we do involve Bosch dishwashers, GE or
      KitchenAid ranges, and Samsung or LG refrigerators. Cabinet fitment,
      rough-in, and appliance installation are coordinated so everything clears
      final inspection without rework.
  - q: "What does a full kitchen remodel cost and how long does it take in Tacoma?"
    a: |
      Full kitchen remodels typically run $40K-$100K depending on scope, with
      6-10 weeks from demo to punch list walkthrough. Tacoma city projects
      permit through Tacoma Development Services; unincorporated Pierce County
      (Lakewood, University Place) goes through Pierce County PALS. Plan review
      adds 2-4 weeks up front — we handle all submissions. Deadline penalties
      are written into every contract. TopVolk has completed 100+ projects
      since 2023 across the Seattle Metro.