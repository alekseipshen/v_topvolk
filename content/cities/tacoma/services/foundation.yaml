title: "Tacoma Foundation Repair — Seismic Risk & Clay Soils"

intro: |
  The Tacoma Fault runs directly under the city — your North End Craftsman or South End rancher sits on ground that seismologists take seriously. Foundation problems here rarely show up as one dramatic crack. More often it's floors slowly going out of level, doors that used to latch now sticking at the strike plate, a Whirlpool washer rocking on a subfloor that's shifted incrementally over five wet seasons. Commencement Bay-area homes built before 1940 are especially vulnerable to this kind of slow drift.

localContext: |
  Most of Tacoma's older housing stock — particularly the 1910s-1930s Craftsmans concentrated in zip codes 98406 and 98407 around the Proctor District and North End — sits on post-and-pier foundations over unventilated crawlspaces. Mid-century ranchers in the 98444 corridor near the Lakewood edge rest on continuous perimeter foundations that crack predictably as clay-heavy soils expand and contract through wet seasons. Structural foundation work in either case triggers a permit review through Pierce County PALS or the City of Tacoma's permit office, depending on your parcel.

commonProblems:
  - title: "Seismic Retrofit on Pre-War Post-and-Pier Foundations"
    description: |
      Tacoma sits within the Cascadia Subduction Zone risk area and has the Tacoma Fault running directly underneath it. Post-and-pier foundations in 98403 and 98405 — Stadium District, Hilltop — have no mudsill anchor bolts holding the framing to the foundation sill. The structure can shift laterally during ground movement. Seismic retrofit means adding mudsill bolting and shear wall plywood panels per current IRC seismic provisions, with Pierce County PALS plan review required before work starts.

  - title: "Perimeter Wall Cracks from Expanding Clay Soils"
    description: |
      Pierce County's glacially-deposited clay soils expand when saturated — that's October through April, every year without exception. Perimeter foundation walls on 1950s-1970s ranchers in 98444 and 98408 develop diagonal cracks at corners and near window openings as the soil cycles. Epoxy injection stops water infiltration on stable, non-moving cracks. If the crack is still active, Atlas resistance piers or Rhino Carbon Fiber wall straps are the permanent fix, not a patch.

  - title: "Crawlspace Post Rot and Sagging Floor Framing"
    description: |
      Unventilated crawlspaces under North End and Proctor District homes accumulate moisture from October through May. Original Douglas-fir posts rot at the base where they contact soil with no vapor barrier underneath. Once the post softens, the beam it carries sags — floors go springy, you feel a low spot walking from the living room toward the kitchen. Repair means replacing deteriorated posts with concrete piers and pressure-treated lumber, then installing a vapor barrier across the crawlspace floor to stop the cycle.

faq:
  - q: "How fast can you get to Tacoma for a foundation assessment?"
    a: |
      Tacoma is a regular service run — I-5 south, roughly 35-45 minutes from Seattle depending on traffic through JBLM corridor. Vladislav Volkov, the WA Licensed Contractor doing the actual site work, typically schedules on-site consultations within a few days. Call (206) 591-1096 to lock in a time. No sales staff, no callback queue.

  - q: "What foundation repair systems do you work with — helical piers, carbon fiber straps, epoxy injection?"
    a: |
      The method depends on the failure mode, not what's easiest to sell. Settling foundations in Tacoma's clay soils often need Chance helical piers or Atlas resistance piers driven to bearing soil. Active wall cracks get Rhino Carbon Fiber reinforcement. Stable, non-moving cracks get epoxy injection. Crawlspace post replacement gets pressure-treated lumber on concrete footings. I'll tell you which one the problem actually calls for.

  - q: "Does foundation work in Tacoma require a permit, and how long does the process take?"
    a: |
      Anything structural — mudsill bolting, pier installation, shear wall additions — requires a permit through Pierce County PALS or the City of Tacoma permit office, depending on your address. Plan review for residential structural work typically runs 3-6 weeks. Cosmetic crack sealing usually doesn't trigger a permit, but anything touching the mudsill or load-bearing framing does. TopVolk has handled 100+ projects across King, Pierce, and Snohomish counties since 2023 — permit coordination is part of the project scope, and missed deadlines cost us money. That's written into every contract.