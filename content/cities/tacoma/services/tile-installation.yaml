title: "Tacoma Tile Installation — Waterproof Showers, Level Floors"

intro: |
  Proctor District homes in 98406 look solid from Ruston Way — Craftsman stock, good bones, a short walk from Point Defiance Park. Most of them are also 90-year-old pier-and-beam structures where the subfloor has shifted, absorbed moisture, and been patched more than once. A Bosch dishwasher leak at a kitchen remodel here last spring quietly destroyed a tile floor. Nobody noticed until grout lines started lifting. Getting tile right in Tacoma means solving what is underneath first, before porcelain gets involved.

localContext: |
  The Stadium District (98403) and North End carry pre-war construction — floor systems that have moved for a century, original plumbing patched across generations. Homes in 98444, on the South Tacoma edge near Lakewood, tend to be 1950s-70s ranchers on concrete slab. Both types need different substrate prep before any tile work starts. Slab houses rarely need full waterproofing membranes under bathroom floors. Pier-and-beam homes almost always do, especially given Tacoma's persistent marine air coming off Commencement Bay most months of the year.

commonProblems:
  - title: "Shower tile failure from inadequate waterproofing membrane"
    description: |
      Tacoma averages close to 38 inches of rain annually, and the marine humidity off the Sound does not let up much in summer. Schluter Kerdi membrane over cement board is the correct build for a tiled walk-in shower — curbless or with a curb. Painting RedGard over standard greenboard is not sufficient. North End homes frequently have tile set over an unsealed vapor barrier with no membrane at the niche edges or curb flashing, and the framing behind it rots for years before the damage surfaces.
  - title: "Large-format porcelain cracking on unlevel subfloor"
    description: |
      32x32 and 24x48 porcelain tiles are popular on Tacoma remodels right now. They also crack fast on a substrate that is not flat. IRC requires flatness within 1/8 inch over 10 feet — pier-and-beam houses in 98405 move seasonally and rarely hit that tolerance without prep work. Self-leveling underlayment and laser-leveled reference lines are required before the first tile goes down. Skip the substrate step and hairline grout cracks show up before the first full year is out.
  - title: "Heated floor mat failures under bathroom tile"
    description: |
      Schluter Ditra-Heat and Warmup heated mat systems are common add-ons on Tacoma bathroom remodels — reasonable when October mornings are cold and damp. The failure mode is almost always the same: mat embedded in thinset over a flexing subfloor with no uncoupling layer between them. Skipping the Ditra membrane on a wood-framed floor is not an option. It isolates the heating element from seasonal subfloor movement and prevents the cracked grout joints that come with thermal cycling over the first winter.

