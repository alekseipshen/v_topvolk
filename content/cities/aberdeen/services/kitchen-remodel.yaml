  - q: "What does a kitchen remodel in Aberdeen typically cost?"
    a: |
      A mid-range Aberdeen remodel — semi-custom cabinets, quartz countertops, GE or
      Samsung appliances, updated lighting, and new flooring — typically runs
      $35,000–$65,000 depending on square footage and whether structural work is
      involved. Full galley-to-open-concept reconfiguration with a load-bearing wall
      removal and LVL beam adds $6,000–$12,000 to that range. IKEA-based builds with
      Frigidaire appliances can land closer to $22,000–$35,000 for smaller kitchens.
      A 200-amp electrical service upgrade, if needed, is a separate line item at
      $2,500–$4,500. TopVolk provides a free on-site estimate with a written, itemized
      quote — call (206) 591-1096 to get on the schedule. No allowance-based pricing
      that expands mid-project.

  - q: "Do you pull permits for kitchen remodels in Aberdeen, and how long does that take?"
    a: |
      Yes — every Aberdeen kitchen remodel that involves electrical circuit changes,
      plumbing relocation, gas line work, or structural modifications requires a
      building permit from the City of Aberdeen Building Division. TopVolk handles the
      application, prepares the required drawings and scope documentation, and
      coordinates all required inspections: rough-in inspection before walls close,
      final inspection at project completion. Plan review for a standard kitchen
      remodel here typically takes 2-4 weeks. Structural scope adds time. TopVolk is
      a WA Licensed Contractor carrying the insurance required to pull permits in Grays
      Harbor County jurisdictions. Skipping permits on this scope creates title
      problems and can void homeowner's insurance coverage — it's not worth the
      shortcut.

  - q: "Can you open up a galley kitchen into an open-concept layout in an older Aberdeen home?"
    a: |
      Yes, and it's the most common structural request in Aberdeen's pre-1960 housing
      stock. The process starts with determining whether the wall between kitchen and
      adjacent living or dining space is load-bearing — in most homes of that era, it
      is. A correctly sized LVL beam and post assembly has to replace the wall's
      structural function before anything else proceeds. TopVolk specifies the beam,
      pulls the structural permit, frames the opening, and coordinates the rough-in
      inspection. After the beam is inspected and cleared, cabinet layout, countertops,
      and appliance placement get designed around the new open footprint. Framing work
      for a standard opening typically takes 3-5 days. The full kitchen remodel
      from demo to final punch list runs 6-10 weeks.

  - q: "How long does a kitchen remodel take from start to finish in Aberdeen?"
    a: |
      A straightforward remodel — existing footprint, no structural changes, cabinet
      replacement and new countertops — runs 4-6 weeks from demo to the blue tape
      walkthrough and punch list. Add a load-bearing wall removal with LVL beam work
      and the schedule extends to 6-10 weeks. The permit review period at the City of
      Aberdeen Building Division adds 2-4 weeks before physical work starts. TopVolk
      sequences semi-custom cabinet orders during permit review to eliminate the most
      common schedule gap in kitchen projects. The contract includes a deadline penalty
      provision — if agreed milestones are missed, there is a financial consequence in
      writing, not a verbal assurance.

