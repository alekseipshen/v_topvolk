title: "Aberdeen Kitchen Remodel — Opening Up Old Harbor-Town Kitchens"

intro: |
  Squeeze past the refrigerator to reach the stove, bump the cabinet door into the
  dishwasher — that's the daily routine in a lot of Aberdeen's older homes. The
  residential blocks south of the Chehalis River and up the hillside toward Sam Benn
  Park are packed with 1930s and 1940s bungalows where the kitchen was designed as
  a utility closet: small, closed off, built when refrigerators were icebox-sized and
  households cooked on wood stoves. Those layouts don't work for a modern family.
  TopVolk Construction handles kitchen remodels across Aberdeen and the surrounding
  Grays Harbor area — structural changes like removing load-bearing walls and
  installing LVL beams for open-concept layouts, full cabinet replacements using
  IKEA SEKTION or semi-custom lines, countertop upgrades, and appliance fitment for
  GE and Samsung ranges. Vladislav Volkov leads every project directly — 100+ projects
  completed since 2017, no sales rep or project coordinator standing between you and
  the contractor doing the actual work. Call (206) 591-1096 to schedule a free
  on-site consultation.

localContext: |
  Aberdeen's residential housing stock is concentrated in the 98520 zip code, with
  most homes dating from 1920 to 1960 — built in waves tied to the timber industry
  and the working waterfront along Grays Harbor. The hillside neighborhoods off
  Simpson Avenue and the flatland blocks near the Wishkah River tend to be two-story
  foursquares and Craftsman bungalows: solid Douglas-fir framing, but kitchens that
  run 8 by 10 feet with a single overhead bulb and barely enough counter space for a
  cutting board. Aberdeen pulls over 80 inches of rain annually — that sustained
  humidity has quietly destroyed the cabinet boxes, particleboard shelving, and
  linoleum floors in countless original kitchens. Nearby Hoquiam (98550) shares the
  same housing profile and the same problems. Many homes in both cities still run
  100-amp or even 60-amp electrical panels that simply cannot support a modern
  induction range or a full appliance load. Permits for kitchen work go through the
  City of Aberdeen Building Division; plan review for a standard remodel typically
  takes 2-4 weeks, longer when the scope includes structural changes or gas line work.

commonProblems:
  - title: "Load-Bearing Walls Blocking Open Layouts in Pre-1955 Aberdeen Bungalows"
    description: |
      The wall between the kitchen and dining room in most Aberdeen homes built before
      1955 is not a simple partition — it's structural, carrying floor or roof loads
      from above. Removing it without a correctly sized LVL beam and post assembly
      causes immediate deflection and long-term structural failure. TopVolk performs a
      load path analysis before anything comes down, determines the right beam
      specification (typically a 3-ply 1¾" × 9¼" LVL or larger depending on span),
      pulls the structural permit from the City of Aberdeen Building Division, and
      coordinates the rough-in inspection before drywall closes the opening. Structural
      beam work of this type adds $4,000–$8,000 to the project depending on span,
      temporary shoring requirements, and whether post footings need to be added or
      reinforced in the basement. Budget 6-10 weeks total for a full kitchen remodel
      that includes structural modifications — plan review and framing inspection add
      time that a cosmetic remodel avoids.

  - title: "Undersized Electrical Panels Limiting Modern Appliance Choices"
    description: |
      A lot of Aberdeen homes on the hillside streets — particularly those built in
      the 1940s and 1950s — still run 100-amp or 60-amp service panels. That's not
      enough capacity for a modern kitchen. A GE Profile induction range pulls 40-50
      amps on its own. Add a Whirlpool dishwasher, a refrigerator, and a microwave
      running simultaneously, and the math stops working. An electrical service upgrade
      from 100A to 200A typically runs $2,500–$4,500 depending on the distance from
      the utility meter and whether the panel location has to move. This requires a
      separate electrical permit and a Grays Harbor PUD service upgrade request, which
      can add 2-4 weeks to the schedule. Vladislav sequences this with the licensed
      electrical sub so the panel upgrade happens before cabinet rough-in — preventing
      the most common mid-project scheduling bottleneck in older Aberdeen homes.

  - title: "Cabinet Replacement: Matching Product Choice to a Real Aberdeen Budget"
    description: |
      Aberdeen kitchen remodels usually land in the $25,000–$55,000 total range,
      which means cabinet selection is the single biggest cost lever. IKEA SEKTION
      cabinets are a legitimate option for kitchens under 150 square feet — the box
      construction is solid, lead times are predictable (typically 2-3 weeks for
      in-stock configurations), and the savings over semi-custom can run $4,000–$8,000.
      Semi-custom lines like Fabuwood or Aristokraft hit the middle ground: better
      finish options than IKEA, stronger box construction for a kitchen that sees heavy
      daily use, and shorter lead times than full custom (usually 4-6 weeks). Any
      cabinet work that involves moving plumbing or adding electrical circuits requires
      a permit from the City of Aberdeen Building Division — even relocating a sink
      triggers plan review. TopVolk is a WA Licensed Contractor and prepares the permit
      drawings and handles submittal, so the homeowner doesn't navigate that process
      on their own.

  - title: "Moisture Damage and Insufficient Ventilation in Aberdeen's Rain-Heavy Climate"
    description: |
      Aberdeen's 80-plus inches of annual rainfall drives indoor humidity levels that
      are genuinely punishing on original kitchen finishes. Most pre-1970 homes here
      have either no exhaust ventilation or a recirculating fan that does nothing for
      airborne moisture or cooking grease. A properly sized range hood venting to the
      exterior needs at least 300 CFM for a standard 30-inch gas range — more for a
      larger Frigidaire Gallery or Samsung range in an open-concept layout. Duct path
      matters: every 90-degree elbow cuts effective CFM, and a long horizontal run
      through a cabinet soffit can choke airflow significantly. Before any new cabinet
      box goes in, TopVolk checks original cabinet substrate for moisture intrusion.
      Particleboard that has swelled and delaminated from years of condensation needs
      full removal — trying to keep original boxes in an Aberdeen kitchen that has
      absorbed three decades of humidity costs more in future callbacks than it saves
      in demo time.

  - title: "Countertop Selection for a High-Use PNW Kitchen"
    description: |
      Quartz and granite perform differently in a Pacific Northwest household.
      Engineered quartz — Silestone and MSI Q Premium are two solid mid-range options
      — is non-porous, handles cooking oils and moisture without annual sealing, and
      holds up in a kitchen that gets real daily use. Granite requires sealing every
      12-18 months and can absorb stains from acidic foods if left to sit. For
      Aberdeen's typical remodel budget, installed quartz countertops run $65–$95 per
      square foot depending on slab thickness and edge profile. Laminate is a
      legitimate choice for homeowners who want to prioritize appliance upgrades over
      stone surfaces — Wilsonart HD and Formica 180fx have improved significantly in
      durability and visual quality and run $20–$35 per installed square foot. TopVolk
      delivers a line-item quote covering each option so the trade-off between
      material cost and appliance budget is clear before any orders are placed.

