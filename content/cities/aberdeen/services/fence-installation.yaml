  - q: "Do I need a permit for a fence in Aberdeen?"
    a: "Fences under 6 feet generally don't need a permit inside Aberdeen city limits. Anything taller, or a retaining wall over 4 feet built into the fence line, goes through the City of Aberdeen Building Department. Outside city limits — toward Central Park or unincorporated county lots — the same threshold work routes through Grays Harbor County Community Development instead. Both typically take 1-3 weeks for a straightforward residential review. TopVolk is a WA Licensed Contractor and handles the paperwork and property line verification as part of the quote."
  - q: "How deep do fence posts need to be set in Aberdeen's soil?"
    a: "Standard 24-inch post holes aren't deep enough in the silty, high-water-table ground near the Chehalis and Wishkah Rivers. TopVolk sets posts 30-36 inches deep with a compacted gravel base under the concrete footing. For pressure-treated wood posts, a Simpson Strong-Tie post base bracket keeps the wood off direct ground contact. That slows rot at the point where fences usually fail first. Corner and gate posts get set deeper than line posts since they carry more load. This adds modest cost upfront but avoids a re-set in 3-4 years."
  - q: "How long will my new fence last in Aberdeen's climate?"
    a: "Vinyl and Trex composite fencing typically run 20-plus years with almost no maintenance, even with the salt air off Grays Harbor. Cedar lasts 12-18 years but needs restaining every 18-24 months to slow graying and moss growth, especially on shaded, north-facing lines. Galvanized chain link generally holds up 10-15 years before rust sets in at ground contact. TopVolk covers workmanship on every install. Material warranties come directly from the manufacturer — CertainTeed, Trex, or the lumber supplier, depending on what you choose."
