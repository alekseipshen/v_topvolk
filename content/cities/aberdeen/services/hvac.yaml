title: "Aberdeen HVAC — Heat Pumps & Mini-Splits for Grays Harbor Homes"

answer: "TopVolk Construction handles heat pump, mini-split, and furnace installs in Aberdeen, Washington — owner-operated, 100+ projects completed since 2023."

intro: |
  Half the furnace calls we get out of Aberdeen aren't really furnace calls — they're crawlspace calls. A house near Sam Benn Park with a 20-year-old Amana gas furnace can run fine on paper and still leave the back bedroom ten degrees colder than the kitchen, because the real problem is a crushed flex duct under the floor, not the equipment. Grays Harbor's damp climate doesn't help — rain off the Wishkah and Chehalis rivers keeps crawlspace humidity high most of the year, and that moisture works on ductwork, condensate lines, and vapor barriers long before it works on the furnace itself. TopVolk Construction is owner-operated by Vladislav Volkov — you talk directly to the person doing the estimate and the install, not a sales rep reading a script. We're WA Licensed Contractors with 100+ projects completed since 2023 across the South Sound and coastal counties, and every contract we write has a deadline penalty built in, not just a promise. If your West Aberdeen rental needs a heat pump conversion or your Central Park addition needs a ductless mini-split, that's the kind of project-based work we take on — not a same-day repair truck roll.

localContext: |
  Aberdeen's housing stock skews old and working-class — plenty of early-1900s foursquares and timber-era Craftsman bungalows around downtown and the 98520 zip, plus post-war ranch infill further out toward Central Park and the county-line edges near 98550 (Hoquiam). A lot of these homes still run galvanized ductwork or undersized flex duct from a 1970s retrofit, sized for a furnace half the tonnage of what's actually installed now. Median income here sits around $42,000, so we see a lot of GE, Frigidaire, Kenmore, and Amana equipment already in place — solid, repairable units, not throwaway builder-grade junk, and worth fixing rather than replacing when the compressor or heat exchanger still has life left. Permits inside city limits go through the City of Aberdeen Building Department; unincorporated pockets near Central Park and toward Cosmopolis fall under Grays Harbor County Community Development instead, and the two offices don't always want the same paperwork. Coastal humidity off Grays Harbor also means crawlspace vapor barriers and duct insulation take a beating faster than they would fifty miles inland.

commonProblems:
  - title: "Gas Furnace Swapped for a Heat Pump — and the Rebate Paperwork Nobody Mentioned"
    description: "Aberdeen homeowners are pulling 80% AFUE Kenmore and Amana gas furnaces for cold-climate heat pumps to catch Inflation Reduction Act rebates, and the swap is more than a unit change. The old flue venting has to be capped and the gas line properly terminated, the electrical panel usually needs a dedicated 30-amp circuit for the outdoor condenser, and the condensate line needs a new gravity or pump-assisted route since heat pumps produce more runoff in our humidity than a gas furnace ever did. We spec Mitsubishi or Daikin cold-climate units rated to hold capacity below 5°F, which matters more here than the marketing brochures let on. Full conversions with electrical work typically run $9,000-$16,000 before rebates, and we handle the rebate paperwork as part of the job, not as an afterthought."
  - title: "Ductless Mini-Splits for the DADU Out Back"
    description: "Since WA HB 1337 opened the door to two ADUs per lot statewide, we're getting steady calls for detached ADU builds behind existing Aberdeen homes near Broadway and South Aberdeen, and almost none of them pencil out for extending old forced-air ductwork that far. A Mitsubishi or Daikin ductless mini-split with its own outdoor condenser and a line set run through the rim joist or an exterior wall penetration solves it cleaner — no ducting, no shared zoning with the main house. Multi-zone systems let you condition the DADU's living area and bedroom separately off one outdoor unit. Installed cost usually lands $6,000-$11,000 depending on zones and line set length, and it needs its own utility connection and disconnect per code, same as the rest of the DADU."
  - title: "Permit Review for HVAC Work — City Hall vs. the County"
    description: "Inside Aberdeen city limits, HVAC permits route through the City of Aberdeen Building Department, and they want a Manual J load calculation on anything beyond a straight equipment swap — not just a nameplate match. Cross into unincorporated Central Park or toward Cosmopolis and it's Grays Harbor County Community Development instead, with its own plan review queue and inspection scheduling. Both jurisdictions require rough-in inspection on new refrigerant line sets and electrical, plus a final inspection before the system gets signed off. We pull the permit, prep the load calc, and stand for both inspections ourselves — it's built into the price, not billed as an add-on."
  - title: "What a Real Aberdeen HVAC Job Actually Costs"
    description: "Pricing here runs lower than King County averages but the cost drivers are the same: equipment tonnage, ductwork condition, and electrical capacity. A straight 95% AFUE furnace swap runs $5,500-$8,500; a full heat pump conversion with new ductwork or duct sealing climbs to $12,000-$18,000; a single-zone mini-split for a bonus room or ADU lands $4,500-$7,000 installed. Older Aberdeen homes with galvanized duct or an undersized electrical panel add cost because that work has to happen before the new equipment goes in, not after. We quote line-item, not a range — you see labor, equipment, and permit fees broken out before signing, and warranty terms (typically 10-year parts on Daikin and Mitsubishi equipment) are spelled out in the contract."
  - title: "Hot Bedroom, Cold Kitchen — Fixing Duct Imbalance Before You Replace Anything"
    description: "A lot of the 'my furnace is dying' calls we get on Craftsman-era Aberdeen homes are actually static pressure and duct-sealing problems, not equipment failure. Disconnected boots, missing blocking around a rerouted trunk line, and unsealed plenum joints let conditioned air dump into the crawlspace instead of the room it's supposed to reach. We seal joints with mastic (not tape, which fails in this humidity within a couple years), add R-8 insulation on exposed runs, and rebalance dampers zone by zone. Half the time this fixes the hot/cold complaint for under $1,500 — a fraction of a full replacement — and it should happen every 10-15 years regardless, since duct systems this old were never sealed to today's standard in the first place."

faq:
  - q: "How fast can you get to Aberdeen for HVAC?"
    a: "We run out of the South Sound and typically schedule Aberdeen consultations within a week, driving in via US 12 or SR 8 depending on where the job sits. Street parking is straightforward in most Aberdeen neighborhoods, and crawlspace or attic access is usually the bigger scheduling factor than travel time. Project-based jobs — heat pump conversions, mini-split installs, ADU HVAC — typically run 1-3 weeks once permits clear. Call (206) 591-1096 to get an on-site date on the calendar."
  - q: "What does a heat pump conversion cost in Aberdeen?"
    a: "A full gas-to-heat-pump conversion, including electrical upgrades and condensate routing, generally runs $9,000-$16,000 before IRA rebates, which can knock several thousand off depending on income tier and equipment efficiency. Ductwork condition is the biggest wildcard — if the existing duct is undersized or leaking, sealing or replacement gets added to the quote upfront, not discovered mid-job. We do a free on-site estimate with Vladislav directly and give you a line-item number, not a phone quote."
  - q: "Do I need a permit for a furnace or heat pump swap in Aberdeen?"
    a: "Yes — inside city limits it goes through the City of Aberdeen Building Department, and unincorporated areas near Central Park or Cosmopolis go through Grays Harbor County Community Development instead. Both require a Manual J load calc for anything beyond an identical equipment swap, plus rough-in and final inspections. As a WA Licensed Contractor, we pull the permit and prep the paperwork as part of the contract price — you're not chasing city hall yourself."
  - q: "Will a ductless mini-split actually keep up during a cold snap off Grays Harbor?"
    a: "Cold-climate rated Mitsubishi and Daikin units hold rated heating capacity down to around 5°F, which covers what Grays Harbor sees even in a hard January freeze. The key is correct sizing — undersized single-zone units in an open floor plan are the usual complaint we inherit from other installers. We size off actual square footage, window count, and insulation level, not a rule-of-thumb tonnage guess."
  - q: "How long does new HVAC equipment last in this climate, and what's covered under warranty?"
    a: "Heat pumps and mini-splits typically run 12-15 years here, a bit shorter than inland installs because of the sustained humidity off the harbor corroding outdoor coils faster. Manufacturer warranties (usually 10-year parts on Daikin and Mitsubishi equipment) cover compressor and component failure but not corrosion from lack of maintenance or coil cleaning. We recommend annual condenser cleaning given the coastal air, and our installs come with a workmanship guarantee separate from the manufacturer's warranty."
  - q: "Do you cover Hoquiam, Cosmopolis, or Montesano too?"
    a: "Yes — we run the same crew and pricing through Hoquiam, Cosmopolis, Montesano, and Elma, since most of these jobs come from the same handful of homeowners in the Grays Harbor area comparing notes. Scheduling windows are the same as Aberdeen, usually booked within a week for consultations. Call (206) 591-1096 or ask about a free on-site estimate — Vladislav does the walkthrough himself, no commissioned sales rep involved."