  - q: "What does drywall repair or a full room hang cost in Aberdeen?"
    a: "A single-room patch after a plumbing or electrical repair typically runs $300-$800, depending on how much wall needs to come out. A full bathroom or bedroom hang-tape-finish job usually falls between $900 and $2,200. Garage or ADU firecode walls run higher because of the 5/8-inch Type-X material and extra labor. Popcorn ceiling removal with a skim coat runs $2-$5 per square foot. Every quote comes as a direct, line-item estimate — call (206) 591-1096 for exact pricing on your project, not a vague range."
  - q: "Do I need a permit for drywall work in Aberdeen?"
    a: "Cosmetic drywall repair, patching, and standard remodel finishing don't typically require a separate permit in Aberdeen. Structural changes, room additions, or new walls for an ADU go through the city's building department for plan review and inspection instead. TopVolk Construction is a WA Licensed Contractor and handles the paperwork and inspection scheduling as part of the project scope when permits are needed. Fire-rated garage separation walls specifically get checked during rough framing inspection before drywall gets closed up. Expect plan review to add a few weeks to project timelines on anything requiring a permit."
  - q: "What's the difference between purple board and regular drywall?"
    a: "Purple board — like National Gypsum's Purple XP or Georgia-Pacific's mold-resistant line — has a treated core and paper facing designed to resist moisture absorption. That matters in Aberdeen's humid climate near the harbor. Standard 1/2-inch drywall works fine in dry living spaces, but bathrooms, laundry rooms, and any wall near a crawlspace vapor barrier should get purple board instead. It costs maybe 10-15% more per sheet than standard board, but it avoids the soft-spot and mold problems that show up within a year or two otherwise. For showers or tiled walls, cement board or Schluter Kerdi systems get used instead of drywall entirely."
  - q: "How long does drywall installation last in Aberdeen's climate?"
    a: "Properly installed drywall, with the right vapor barrier and moisture-resistant board where needed, should last the life of the home — decades, not years — as long as leaks get caught early. The workmanship itself is warrantied. Any settling cracks or nail pops from normal house movement are covered for a defined period after project completion. What isn't covered is new water damage from a roof leak or plumbing failure introduced after the job wraps, though those situations get repaired at standard rates. Grays Harbor's humidity makes annual inspection of bathroom and laundry room walls a smart habit."
