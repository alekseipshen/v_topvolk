title: "Aberdeen ADU Construction — DADUs & Basement Conversions"

answer: "TopVolk Construction builds DADUs, attached ADUs, and basement conversions in Aberdeen, WA under HB 1337 — 100+ projects completed since 2017, owner-led by Vladislav Volkov."

intro: |
  A converted basement or a new backyard cottage in Aberdeen can add $900 to $1,400 a month in rental income, which matters in a city where median household income sits around $42,000. TopVolk Construction builds detached ADUs (DADUs), attached ADUs, and basement conversion units for homeowners here, working under WA HB 1337, the 2024 state law that allows up to two accessory units on most single-family lots. Vladislav Volkov handles the project directly — no sales rep, no hand-off to a project manager you've never met. We've worked lots near Zelasko Park and out toward the Bel-Aire area, where older timber-town housing stock means foundations and framing need a closer look before anyone pulls a permit. One recent build paired a Mitsubishi mini-split with a Rinnai tankless water heater to keep utility costs manageable for the tenant, which matters when you're trying to make the rental math pencil out on a modest Grays Harbor lot. Call (206) 591-1096 for a free on-site walkthrough before you commit to a design.

localContext: |
  Aberdeen's housing stock runs older than most Puget Sound suburbs — a lot of 1900s-1940s timber-era single-family homes in the 98520 zip, with post-war infill scattered through South Aberdeen and the Central Park area. Lots here tend to be narrow with shallow setbacks, which limits DADU placement more than people expect once you factor in the 24-foot height limit and side-yard clearance. We also cover the adjacent 98550 zip around Hoquiam, since a lot of Grays Harbor rental demand crosses that line anyway. Older post-and-pier foundations near the Wishkah and Chehalis River floodplain areas often need a foundation assessment before a basement conversion gets anywhere near a permit application — galvanized plumbing and undersized electrical panels are common in homes from that era and usually get flagged during plan review. Rain here isn't quite Seattle's 37 inches a year — it's more, and it hits harder in the winter months, so drainage and vapor barrier detailing at the foundation line get extra attention on every ADU we frame.

commonProblems:
  - title: "Narrow Lots Make DADU vs Basement Conversion a Real Trade-Off"
    description: "Plenty of Aberdeen lots in the Bel-Aire and South Aberdeen areas run 50 feet wide or less, which eats into the buildable footprint once you apply required setbacks. A detached ADU (DADU) needs its own foundation, rim joist, and roof structure — often $140K-$180K all-in — while a basement conversion reuses the existing foundation and can land closer to $70K-$110K if the ceiling height and egress window sizing already work. We've had homeowners assume a DADU pencils out better for rental income, then find out a basement unit with a Schluter Kerdi shower pan and a stacked GE washer/dryer gets them to market three months faster. The right call depends on lot coverage math and what's already sitting in the crawlspace."
  - title: "HB 1337 Doesn't Mean the City Rubber-Stamps Your Plan"
    description: "WA HB 1337 opened the door to two ADUs per lot statewide, but the City of Aberdeen Building Department still runs its own plan review, and that process checks FAR, lot coverage, and parking exemptions independently of the state law. We've seen homeowners in the North Aberdeen area assume pre-approved plans from another jurisdiction would transfer directly — they don't, since local snow load and floodplain overlays near the Chehalis River differ from King County templates. Plan review here typically runs 4-8 weeks depending on backlog, with a rough-in inspection and final inspection required before occupancy. TopVolk prepares the full permit package — site plan, structural calcs for any LVL beam or PSL post, energy code compliance — so nothing bounces back for a second review cycle."
  - title: "Utility Separation Gets Expensive Fast if You Don't Plan for It"
    description: "A legal rental ADU generally needs its own metered utility connection, or documented shared-service agreement, before the county will sign off on occupancy. Running a new water and sewer lateral to a detached unit near Sam Benn Park can add $8,000-$15,000 depending on trench length and whether you're crossing existing landscaping or a driveway slab. Some homeowners split the difference with a shared water meter and a separate electrical sub-panel instead, which is usually cheaper and still meets code for a DADU. We size the sub-panel for a Rinnai tankless unit and an Amana or Frigidaire range up front, so there's no surprise when the electrician shows up mid-project."
  - title: "What an ADU Actually Costs in Aberdeen"
    description: "Basement conversions here typically run $70K-$130K, attached ADUs $110K-$160K, and detached units $150K-$220K, depending on finish level and how much structural work the existing framing needs. Cost drivers include foundation condition, whether you're adding a new ledger board and joist hanger system for a deck tie-in, and appliance grade — a Whirlpool or Kenmore package runs leaner than a Samsung suite, which matters on a project built for rental income rather than personal use. Every quote from TopVolk is line-item, not a range, and includes a written deadline with a penalty clause if we miss it. Call (206) 591-1096 for a free consultation and an actual number, not a ballpark."
  - title: "Framing and Insulation Decisions That Actually Matter in Grays Harbor Weather"
    description: "Grays Harbor gets wetter and windier than the Seattle side of the Sound, so R-49 attic insulation and a properly lapped vapor barrier at the crawlspace aren't optional upgrades — they're the difference between a unit that's comfortable in February and one with a mildew problem by spring. Douglas-fir framing is standard, but any rim joist or sister joist work on an older foundation gets pressure-treated (PT) lumber where it contacts concrete or soil. We use Hardie siding on most DADU exteriors out here instead of cedar, since it holds up against the north-facing moss and mildew that cedar picks up fast in this climate. Expect a 25-30 year service life on the siding and roofing before major maintenance is needed."

faq:
  - q: "How fast can you get to Aberdeen for ADU construction?"
    a: "We run out to Grays Harbor County via US-12 and SR 8 on a scheduled basis, usually coordinating two or three site visits in one trip to keep costs down. A free on-site consultation with Vladislav can typically be set within 1-2 weeks of your call. Once a design is approved, expect 4-7 months end-to-end for a DADU including permitting, or 3-4 months for a basement conversion. Call (206) 591-1096 to get on the schedule."
  - q: "What does an ADU cost in Aberdeen?"
    a: "Basement conversions run roughly $70K-$130K, attached ADUs $110K-$160K, and detached backyard units $150K-$220K, depending on finish level, foundation condition, and utility separation needs. Appliance package (Frigidaire or Amana versus Samsung) and finish grade move the number more than most homeowners expect. We provide a free on-site estimate with line-item pricing, not a vague range, before you sign anything."
  - q: "How does ADU permitting work with the City of Aberdeen?"
    a: "The City of Aberdeen Building Department reviews ADU applications under WA HB 1337, checking lot coverage, setbacks, and the 24-foot DADU height limit before issuing a permit. Plan review generally takes 4-8 weeks, followed by rough-in and final inspections during construction. TopVolk is a WA Licensed Contractor and prepares the full submittal package — site plan, structural calculations, energy code forms — so the application moves through without repeat rejections."
  - q: "Do I need a separate water and sewer connection for my ADU?"
    a: "It depends on the unit type — a detached ADU near a floodplain-adjacent lot may need its own metered water and sewer lateral, while an attached ADU or basement conversion can often share the main connection with a documented agreement. We typically pair a Rinnai tankless water heater with the new unit to reduce shared-load demand on the existing system. Cost and code requirements get confirmed during the site walkthrough, before permit submittal."
  - q: "What's the warranty on an ADU built by TopVolk?"
    a: "Structural and workmanship items carry a standard warranty period, and manufacturer warranties apply separately to appliances like GE, Whirlpool, or Kenmore units installed in the kitchen and laundry. Hardie siding and asphalt roofing are rated for 25-30 years in this climate if installed and flashed correctly, which matters given Grays Harbor's rainfall. Anything covered under the contract's deadline penalty clause is documented in writing before construction starts, not verbally promised."
  - q: "Do you cover areas near Aberdeen, like Hoquiam or Cosmopolis?"
    a: "Yes — we regularly work the 98520 and 98550 zips, covering Aberdeen, Hoquiam, and Cosmopolis on the same service trips through Grays Harbor County. Scheduling windows run 1-2 weeks out for consultations, longer during peak summer construction season. Call (206) 591-1096 or ask about a free consultation directly with Vladislav Volkov, not a subcontracted estimator."