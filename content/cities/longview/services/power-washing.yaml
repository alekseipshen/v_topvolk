title: "Longview Power Washing — Moss, Concrete & Deck Surface Cleaning"

intro: |
  Lake Sacajawea sits at the geographic center of Longview, and the Douglas-fir canopy
  surrounding it keeps nearby driveways and sidewalks shaded enough that concrete turns
  biological green by November. Homes across the Highlands and along Kessler Boulevard —
  most built between the 1940s and 1960s — carry decades of embedded moss and algae on
  north-facing concrete, wood decks, and stucco exteriors that a garden hose will not
  touch. Pressure washing at the correct PSI with a downstream sodium hypochlorite
  injection kills the root structure rather than redistributing it across the surface.
  Longview averages over 45 inches of rain annually, so if the surface is not treated
  with a moss inhibitor after cleaning, regrowth restarts before the concrete fully dries.
  Cedar decks prepped for a Cabot Australian Timber Oil application need a clean,
  open-pored surface before any stain bonds correctly — and driveways on properties near
  the Columbia River waterfront collect tire marks and oil stains year-round from vehicles
  sitting in persistent moisture.

localContext: |
  The bulk of Longview's residential housing in zip code 98632 dates to the post-war
  decades when the city's planned grid expanded outward from its Long-Bell Lumber Company
  origins. Those older concrete walkways and driveways are highly porous — biological
  growth penetrates the surface layer rather than sitting on top of it. The West Side
  residential corridor near the Cowlitz River sees some of the worst moss colonization
  in the city, with north-facing surfaces staying wet well into late spring. Stucco
  exteriors on mid-century homes near the Olympic Way area trap mildew in texture
  pockets; soft-wash low-pressure chemical application reaches those recesses better than
  direct high-pressure spray, which can drive moisture behind J-channel and window trim
  on older construction. Cedar fence panels and shake siding on wooded lots in the Mint
  Valley neighborhood follow a three-to-four-year staining cycle — and cleaning before
  applying TWP 100 Series penetrating oil is what makes that stain bond and hold through
  multiple wet seasons instead of peeling at year two. Kelso-area properties in the
  98626 corridor share the same moss and mildew patterns given the identical Cowlitz
  County rainfall exposure.

commonProblems:
  - title: "Concrete Driveways Stained with Oil, Tire Marks, and Organic Buildup"
    description: |
      Post-war concrete in Longview's 98632 zip is dense but unsealed, meaning oil from
      vehicles parked year-round in wet conditions soaks into the surface rather than
      beading off. A standard cold-water pressure wash at 3,000 PSI moves surface debris
      but leaves oil and embedded tire rubber behind. Hot water pressure washing — running
      at 180°F or higher — combined with a Zep Commercial Heavy-Duty Citrus Degreaser
      pre-treatment breaks the hydrocarbon bond so the rinse actually removes it. A
      surface cleaner attachment (spinning bar nozzle) distributes pressure evenly across
      flat concrete, preventing the streaking a single turbo nozzle leaves behind. Driveway
      cleaning for a standard two-car driveway in this area typically runs $150–$250
      depending on total square footage and stain severity — and any concrete that will be
      sealed afterward needs to dry 48–72 hours before product application.

  - title: "Moss and Algae on Cedar Decks Before Staining"
    description: |
      Cedar decks on shaded Longview residential lots — especially properties backing up
      to tree lines in the Mint Valley area — accumulate a layer of moss and grey
      oxidation that makes the wood look spent even when the structural members are solid.
      Applying Cabot Australian Timber Oil or TWP 100 over that layer produces a finish
      that peels within one season. The correct sequence: pressure wash at 1,200–1,500 PSI
      with a downstream injection of sodium percarbonate solution, which lifts oxidation
      and kills moss spores without raising the wood grain the way sodium hypochlorite does
      on cedar. Let the wood dry a minimum of 72 hours before staining — in Longview's
      climate, that means watching the forecast window between October and April carefully.
      Cedar deck cleaning typically runs $200–$400 for an average 400-square-foot deck,
      which is money recovered immediately in stain product that actually penetrates instead
      of sitting on the surface.

  - title: "Hardie Siding and Stucco Cleaning Before Exterior Repaint"
    description: |
      James Hardie cement-board siding holds up well in Cowlitz County's wet climate, but
      the surface accumulates mildew in the texture channels between panels — visible as
      grey-green streaking that starts on the north elevation and works around the building
      by late fall. Painting over that film produces adhesion failure within two years.
      Soft washing — low-pressure application of a sodium hypochlorite and surfactant
      solution — is the correct approach for Hardie panels; anything above 1,500 PSI risks
      driving water into panel joints, behind fascia boards, and into the wall assembly.
      Stucco on mid-century homes near the Olympic Way corridor requires the same soft-wash
      method because high pressure opens hairline surface cracks. Siding wash on a typical
      1,500-square-foot Longview home runs $300–$500 and is usually scheduled a week before
      the paint crew arrives to give surfaces time to fully dry. Licensed contractor
       provides the written scope of work specifying PSI and chemical concentrations
      that most painters require before they begin.

  - title: "Moss Removal from Roofs and North-Facing Deck Surfaces"
    description: |
      North-facing roofs in Longview — especially on mature-tree lots around Lake
      Sacajawea — develop thick moss colonies that retain moisture against shingles and
      accelerate granule loss. A roof treated every three to four years with a soft-wash
      sodium hypochlorite application and a follow-up Wet & Forget post-treatment can
      extend shingle life meaningfully. Direct high-pressure washing on asphalt shingles
      voids most manufacturer warranties and blasts off granules — the soft-wash method
      stays under 500 PSI at the surface. Roof soft washing on a typical Longview
      single-story runs $300–$600 depending on pitch and square footage; steeper pitches
      above 6:12 require safety rigging that adds to the price. Concrete patios and
      north-facing deck boards get the same biological treatment — a surface cleaner pass
      followed by Wet & Forget applied to the cleaned surface slows regrowth through the
      next wet season significantly.

  - title: "Fence Cleaning Before Staining — Cedar Panels on a 3–5 Year Cycle"
    description: |
      Cedar fence panels in Longview's residential neighborhoods follow a predictable
      cycle: grey oxidation starts within a year of installation, moss patches appear on
      north-facing sections by year two, and by year three the wood is ready for a full
      clean-and-stain cycle. Skipping the clean step and applying Armstrong Clark or TWP
      100 stain directly to a weathered, mossy surface wastes product and produces a
      blotchy, uneven finish. Pressure washing fence panels at 1,200–1,500 PSI with a
      sodium percarbonate pre-soak lifts the oxidation layer and opens the wood pores
      without raising grain the way higher pressure would. A 150-linear-foot cedar fence
      typically runs $175–$350 to clean — roughly $1.20 to $2.25 per linear foot depending
      on panel height and moss density. Scheduling the clean job a few days ahead of the
      stain crew is standard practice; trying to stain wet wood in Longview's climate is a
      reliable way to get a finish that peels by the following spring.

faq:
  - q: "How fast can you get to Longview for Power Washing?"
    a: |
      Longview is a direct shot from the greater southwest Washington service area via
      I-5 — typically 15–20 minutes from Kelso and under 30 minutes from Castle Rock.
      Scheduling usually runs 3–7 days out depending on current backlog; urgent pre-paint
      surface cleans can often be moved up on short notice. Parking access matters on
      some of the narrower residential streets in the Highlands and West Side areas —
      a quick conversation before arrival confirms equipment can get within 100 feet of
      the target surface without blocking traffic. Call (660) 999-9960 to check current
      availability and get on the schedule.

  - q: "What does power washing a house or driveway in Longview cost?"
    a: |
      House wash (full exterior siding) on a standard Longview single-story runs
      $300–$500; a two-story adds $100–$200 depending on square footage. Driveway and
      walkway cleaning typically runs $150–$300 depending on total area and stain
      severity — oil-heavy driveways requiring hot-water treatment and degreaser pre-soak
      run toward the top of that range. Deck and fence cleaning is priced by square
      footage or linear foot: expect $1.20–$2.50 per linear foot for fencing and
      $0.40–$0.70 per square foot for deck surfaces. Exact pricing comes from an on-site
      estimate — contractor provides a written quote before any work starts so
      there are no surprises on invoice day.

  - q: "Do HOAs in Longview regulate power washing methods or scheduling?"
    a: |
      Most residential HOAs in Longview and unincorporated Cowlitz County do not regulate
      power washing directly, but some require prior approval for any visible exterior
      changes — including fence or siding cleaning that noticeably alters appearance.
      Checking your CC&Rs before scheduling is worth five minutes. For homes near the
      Lake Sacajawea area with shared fencing or common-area patios, some HOAs specify
      approved methods (soft-wash only) or restricted service hours to limit noise. A
      written scope of work describing the method, PSI levels, and cleaning agents used
      satisfies most HOA approval requests — that documentation is standard with every
      estimate. Call (660) 999-9960 to discuss what your specific HOA requires before
      booking.

  - q: "What is the difference between soft washing and pressure washing, and which does my Longview home need?"
    a: |
      Pressure washing uses high PSI — typically 2,000–4,000 at the gun — to cut through
      surface deposits mechanically. That is correct for concrete driveways, walkways, and
      brick hardscaping. Soft washing stays under 500 PSI at the surface and relies on a
      sodium hypochlorite or sodium percarbonate solution to do the biological kill work —
      correct for roofs, Hardie siding, stucco, and painted wood where high pressure
      causes damage. Most Longview homes need both methods in the same visit: soft wash
      the siding and roof, pressure wash the driveway and walkways. Using a turbo nozzle
      at full pressure on Hardie panels blows open panel joints and drives moisture into
      the wall assembly — that is how an exterior cleaning job becomes a rot repair job.
      Licensed contractor specifies the correct method for each surface in the
      written estimate before work begins.

  - q: "How long does a professional power washing job stay clean in Longview's climate?"
    a: |
      Concrete driveways and walkways cleaned in spring stay visually clean through fall —
      biological regrowth restarts in earnest by November when the heavy rain returns.
      Applying a penetrating concrete sealer after cleaning extends that window by 12–18
      months. Siding and roof soft washing holds well for 2–3 years if a Wet & Forget
      post-treatment is applied after the clean; without a residual inhibitor, moss spore
      recolonization begins within a season on north-facing Longview surfaces. Cedar
      fencing and decking cleaned before staining does not need annual cleaning — the
      stain itself acts as a barrier until the next stain cycle, typically 3–5 years for
      TWP 100 in western Washington conditions. Post-cleaning maintenance products can be
      supplied at cost; ask about it when scheduling your service.

  - q: "What other cities near Longview do you service for power washing?"
    a: |
      The primary coverage zone runs Longview and Kelso, plus Woodland, Castle Rock, and
      Rainier to the north. Kalama and the unincorporated Cowlitz County areas along the
      Columbia River corridor are covered on a case-by-case basis depending on scheduling.
      Larger clusters — a few homes in the same Longview neighborhood booking in the same
      week — tend to get priority scheduling because it keeps travel efficient for everyone.
      Response time for a standard estimate is typically 24–48 hours after initial contact.
      Call (660) 999-9960 or request an estimate online to check current availability for
      your specific address.