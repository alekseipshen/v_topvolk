title: "Longview Door Installation — 1920s Planned City Homes Need Proper Sealing"

intro: |
  Lake Sacajawea sits at the center of Longview like a spine — the homes
  circling it in the 98632 zip were built in the 1920s when Long-Bell Lumber
  Company had unlimited old-growth Douglas-fir and zero concept of modern
  weatherstripping. Those original entry doors are now approaching a century
  old, and Cowlitz County averages over 45 inches of rain annually, most of
  it arriving sideways during fall and winter storms rolling off the Columbia
  River. A homeowner in the Highlands neighborhood recently replaced a 1940s
  fir door that had swelled so badly the deadbolt wouldn't throw — the door
  jamb had rotted through from the bottom up, a textbook failure when original
  sill pan flashing was never installed. TopVolk Construction switched her to
  a Therma-Tru Fiber-Classic fiberglass unit with proper drip cap and sill
  pan detail, and the rough opening needed reframing before the new door
  could even be hung. That combination — rain exposure plus century-old
  framing — is the defining door problem in Longview.

localContext: |
  Longview's housing stock splits into two main eras. The 1920s–1940s
  planned-city homes near Lake Sacajawea and downtown (zip 98632) have
  original fir doors with hardware that hasn't been updated in decades.
  West Longview and the newer tracts in the 98633 zip run 1970s–1990s
  builder-grade: hollow-core interior doors, aluminum-framed sliding patio
  doors that leak at the sill track, and entry doors with delaminating
  factory fiberglass. Cowlitz County's climate is wetter than Seattle.
  Moisture accumulates on north-facing door frames, growing moss on threshold
  surrounds and wicking into door casings through cracked paint. Garage doors
  take a particular beating — steel panels on older units rust from the bottom
  rail up, especially in homes within half a mile of the Cowlitz River
  floodplain where ground humidity stays elevated year-round. Both housing
  eras have real door problems; they just present differently.

commonProblems:
  - title: "Entry Door Rot in 1920s-Era Longview Homes Near Lake Sacajawea"
    description: |
      Fir entry doors in Highlands-area homes built between 1920 and 1945 were
      installed without sill pan flashing or a drip cap above the head jamb.
      Over decades, water tracks down the face of the door, behind the exterior
      casing, and pools at the rough opening sill. By the time a homeowner
      notices staining on the interior threshold, the king studs flanking the
      door are often compromised. TopVolk replaces these with Therma-Tru
      Fiber-Classic fiberglass doors — they won't swell, won't rot, and come
      factory-primed to match historic trim profiles common to Longview's
      Craftsman-era stock. Reframing the rough opening adds labor but typically
      brings the full replacement to $2,800–$4,500 installed, depending on rot
      extent and whether the sill plate needs sistering with pressure-treated
      lumber.

  - title: "Sliding Patio Door Sill Track Failure in West Longview's 1970s–90s Homes"
    description: |
      Aluminum-framed sliding doors from the 1970s and 80s in West Longview
      (98633) share a common failure point: the sill track corrodes and the
      door panel drops, binding against the frame. Replacing the weatherstrip
      doesn't fix a bent or corroded aluminum track — the whole unit needs to
      go. Most of these openings are sized for a 6/0 × 6/8 or 8/0 × 6/8 rough
      opening, which accommodates a Milgard Tuscany Series vinyl sliding door
      or, for homeowners wanting more light, a Pella 250 Series French door
      conversion. The French door swap requires adding a center mullion within
      the existing rough opening, which adds a day of framing work. Budget
      $3,200–$5,500 for the full swap depending on door width and glass package
      selected.

  - title: "Garage Door Panel Rust and Missing Insulation Near the Cowlitz River"
    description: |
      Non-insulated steel garage door panels in lower-elevation Longview — homes
      near the Cowlitz River floodplain especially — rust from the bottom
      sections up. The bottom roller bracket corrodes first, then the bottom
      panel itself warps. Replacing just the bottom section is possible if that
      panel profile is still manufactured, but matching a 20-year-old door is
      rarely worth the effort. A full 16×7 steel garage door replacement with
      insulated panels (R-12 or R-16 polyurethane core) runs $1,400–$2,200
      installed. Clopay Gallery Series and Wayne Dalton 9100 Series fit most
      standard two-car openings in Longview. The added insulation matters during
      Cowlitz County winters — an uninsulated panel is effectively a steel wall
      transferring cold into the garage and into any living space above it.
      City of Longview building permits are not typically required for garage
      door replacement-in-kind. TopVolk is a WA Licensed Contractor and handles
      any permit questions upfront.

  - title: "Interior Door Replacement During Longview Kitchen and Bath Remodels"
    description: |
      Hollow-core interior doors show up in nearly every 1980s and 90s Longview
      home TopVolk has worked in during remodels. They're acceptable for
      closets. For bathrooms, bedrooms, and especially the passage between
      garage and living space — where the IRC requires a solid-core, self-closing
      fire door — hollow-core doors don't meet code. A standard 2/8 × 6/8
      solid-core pre-hung door runs $280–$450 per door installed, including new
      casing on both sides. Swapping eight doors during a whole-home remodel
      means the casing detail is where real labor accumulates: mitering outside
      corners, fitting door stops, nailing and filling. Budget $3,500–$5,500 to
      replace all interior doors in an average Longview rancher, more if the
      door schedule includes a fire-rated unit at the garage.

  - title: "Weatherstripping Failure and Smart Lock Upgrades on Existing Entry Doors"
    description: |
      A lot of Longview homeowners don't need a full door replacement — they
      need the existing door sealed and fitted with a current smart lock. A
      Schlage Encode Plus deadbolt installs in about 90 minutes on any standard
      door prep (2-1/8-inch bore, 2-3/4-inch backset). What takes longer is
      the weatherstripping: most entry doors in 98632 homes from the 1960s
      forward have compression strip that's compressed flat and doing nothing.
      Door sweeps on older thresholds are similarly worn out. A full
      weatherstripping and threshold replacement — using a Pemko or Reese
      heavy-duty threshold seal — costs $180–$320 in labor and materials and
      makes a measurable difference when November rain starts driving in under
      the door. Add the Schlage Encode and you're looking at $420–$580 total
      for a tightened, keypad-accessible door without touching the slab or
      frame.

