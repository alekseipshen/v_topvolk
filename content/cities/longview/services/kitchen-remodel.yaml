title: "Longview Kitchen Remodel — Opening Up Homes From a Different Era"

intro: |
  Long-Bell Lumber Company platted this city from scratch in 1923 — wide boulevards, tidy bungalows, and kitchens sized for a different kind of cooking. A lot of those homes are still standing. The ones near Lake Sacajawea and along the older Highlands streets are solid, well-built houses from the 1940s and 1950s, but the kitchens inside them were designed for a housewife with a Frigidaire icebox and a small gas range, not a family running two full-time jobs with a Samsung range-top and a 24-inch dishwasher looking for counter space that doesn't exist.

  Opening up a closed galley or removing a load-bearing wall to create a real kitchen layout takes more than demolition. It takes load path analysis, an LVL beam sized correctly for the span, and a permit pulled through the City of Longview Building Division. TopVolk Construction handles that whole sequence. Vladislav Volkov has completed 100+ projects since 2023, including kitchens in Cowlitz County homes where the bones are good but the layout needs a complete rethink. Call (206) 591-1096 to schedule a free on-site visit.

localContext: |
  Most of the residential construction in the 98632 zip code dates from 1923 through the mid-1970s. The original planned-city blocks near downtown Longview have Craftsman bungalows and Colonial Revival houses with post-and-pier foundations — built to last, but with kitchens that were designed as working rooms, not gathering spaces. Cabinet boxes from that era are often solid fir, which holds up well, but the layouts themselves are cramped by modern standards.

  By the 1960s and into the early 1970s, development pushed south toward the industrial flats and east toward the Cascade Park neighborhood. Those ranch-style homes sit on slab or raised foundations, and most of them still have the original 100-amp electrical panel from the year they were built. Running a modern induction cooktop on that panel is asking for trouble. Homes in the 98626 zip — the Kelso side of the county line — follow similar patterns: Douglas-fir framing throughout, often original galvanized supply lines, and kitchens sealed off from the dining room as a design choice that nobody questions anymore. Longview's wet winters, close to 50 inches of annual rainfall, do real work on cabinets near exterior walls — moisture damage along the sink wall is present on nearly every pre-1980 project we touch.

commonProblems:
  - title: "Load-bearing walls blocking open-concept layouts in pre-1975 homes"
    description: |
      The wall between the kitchen and dining room in most Longview homes built before 1975 is load-bearing. That's not an assumption — it's how those floor plans were drawn, and it's confirmed once we pull the ceiling drywall and trace the load path. Removing it without proper analysis causes real structural problems. Before any demolition starts, we verify the load path from the roof ridge down to the foundation. If the span requires it, an LVL beam (laminated veneer lumber) gets installed to carry what that wall was holding — on a 12-foot kitchen opening, that's typically a 3-1/2 by 9-1/2 LVL minimum, sometimes deeper depending on what's above.

      The City of Longview Building Division requires a structural permit for this work. Plan review on residential projects typically runs 2-4 weeks. Once approved, the beam installation itself is a one-day framing job. Budget roughly $2,500-$4,500 for the structural work alone, separate from finish work or cabinets.

  - title: "Cabinet replacement in homes with 1960s-era builder-grade layouts"
    description: |
      Original cabinets in Longview's stock housing are almost always particleboard frames with laminate doors — repainted twice, reglued along the bottom row, and slowly delaminating near the dishwasher. At some point, refacing stops making financial sense, and the question becomes whether to go IKEA, semi-custom, or full custom.

      For a standard 10x12 kitchen, IKEA SEKTION cabinets with solid wood doors run $3,000-$6,000 in materials. Semi-custom brands like Kraftmaid or Fabuwood come in at $6,000-$12,000 depending on door style and finish. Full custom from a local shop adds another 40-60% over semi-custom. In a working-class home where resale is a real consideration, semi-custom usually hits the right balance of durability and return on investment. Longview's humidity — especially in kitchens on crawlspace foundations near exterior walls — means plywood box construction and moisture-resistant finishes matter more here than in a drier climate. Plywood outlasts particleboard by years in these conditions.

  - title: "Undersized electrical panels that can't carry modern kitchen loads"
    description: |
      A significant share of the 1960s ranch homes in Longview's Cascade Park area and along the older R Street grid came with 60-amp or 100-amp electrical panels. That was adequate for the appliances of 1968 — a gas range, a small refrigerator, maybe a toaster oven. Add a Whirlpool dishwasher, a Samsung refrigerator with an ice maker, a microwave, and any electric cooking surface, and you're looking at a panel upgrade before the kitchen remodel can proceed.

      An electrical service upgrade from 100A to 200A typically runs $1,500-$3,000 depending on the distance from the utility connection and whether the main disconnect needs relocation. This work requires a separate electrical permit through the City of Longview. The rough-in inspection happens before drywall closes, and the final inspection clears the panel for use. We coordinate the electrical sub directly — homeowners don't manage two separate contractors, and the permit timeline gets folded into the overall kitchen schedule.

  - title: "Countertop replacement: weighing laminate, quartz, and granite on a realistic budget"
    description: |
      Laminate countertops from the 1980s and 1990s are still holding up in a lot of Longview kitchens — barely. The edge banding separates, the surface shows knife marks, and the substrate swells around the sink where water has worked in over the years. Replacing them is straightforward, but the material choice swings the budget by $2,000-$6,000 on a standard counter run.

      Quartz — engineered stone from brands like Silestone or MSI — runs $50-$90 per square foot installed and holds up well in a kitchen that sees heavy daily use. Granite sits in a similar price band but requires annual sealing and is more susceptible to staining from acidic foods. For a 40-square-foot counter run, typical for a 10x12 kitchen, quartz lands at $2,000-$3,600 installed. Laminate from Wilsonart or Formica is still a legitimate choice at $15-$25 per square foot when budget is the primary driver. Both options get shown at the consultation — no pressure toward either.

  - title: "Moisture damage behind cabinets and inadequate range ventilation in older kitchens"
    description: |
      Longview gets close to 50 inches of rain per year. Kitchens on exterior walls — especially those with single-pane windows above the sink — deal with condensation problems that gradually destroy cabinet boxes and the drywall behind them. On most pre-1990 remodel projects here, pulling the base cabinets reveals a wet or stained bottom plate, sometimes with visible mold on the drywall cavity behind.

      The repair isn't complicated, but it's easy to skip if you don't look. We treat affected framing, install a vapor barrier where appropriate, and replace damaged substrate before new cabinets go in. Range ventilation is the other chronic problem — most original hoods in Longview kitchens recirculate rather than vent to the outside. A properly ducted range hood needs at least 300 CFM for a standard 30-inch range. Upgrading to a Broan or Zephyr unit vented through the exterior wall is part of nearly every kitchen remodel we do here, and it's included in the permit scope when exterior penetrations are involved.

faq:
  - q: "How far do you travel to Longview for kitchen remodel work?"
    a: |
      TopVolk Construction serves the full Seattle Metro region and Southwest Washington, including Cowlitz County. Longview sits about 50 miles south of Tacoma on I-5 — drive time from our King County base is typically 60-75 minutes depending on traffic. For kitchen consultations, we schedule a free on-site visit so Vladislav can see the actual layout, measure the space, and identify anything that affects scope: load-bearing walls, panel location, plumbing rough-in positions. Most consultation requests get a site visit within 5-7 business days. Call (206) 591-1096 to set one up. After the visit, you receive a detailed line-item quote — not a range — within a few days.

  - q: "What does a kitchen remodel cost in Longview, WA?"
    a: |
      Scope drives the number more than location does. A cosmetic update — new cabinets, countertops, and appliances without moving walls or plumbing — typically runs $18,000-$35,000 for a standard 10x12 layout. Add a load-bearing wall removal with LVL beam and the range shifts to $28,000-$50,000. Full gut remodels with layout changes, electrical service upgrades, and mid-range finishes run $45,000-$75,000 in this market. What pushes the cost up: load path complexity, panel upgrades from 100A to 200A, plumbing relocations, and cabinet grade. For Longview's typical housing stock, most projects land in the $25,000-$55,000 range. Vladislav provides a free on-site estimate with exact line-item pricing after seeing the space. Call (206) 591-1096 to schedule.

  - q: "Do I need a permit for a kitchen remodel in Longview?"
    a: |
      It depends on what's changing. Replacing cabinets, countertops, and appliances in their existing locations typically doesn't require a permit in Longview. Move a wall, relocate a gas line, upgrade the electrical panel, or shift drain lines, and you're into permit territory. The City of Longview Building Division processes residential construction permits; plan review for kitchen work involving structural changes typically takes 2-4 weeks. For homes outside city limits in unincorporated Cowlitz County, permits go through Cowlitz County Community Development instead. TopVolk handles permit drawings and submittal as part of the project scope — homeowners don't navigate that process alone. All permitted work gets inspected at rough-in and final stages. TopVolk is a WA Licensed Contractor, and we carry the required documentation for every job.

  - q: "Can you work around the existing plumbing layout to keep costs down?"
    a: |
      Yes — and it's one of the first things we look at during the on-site visit. Moving the sink to a new location means relocating drain lines, vent stack tie-ins, and supply runs. That adds $1,500-$3,500 to a project depending on how far the drain needs to travel and the foundation type — crawlspace access makes the work significantly more approachable than cutting into slab concrete. Most Longview homes sit on crawlspaces, which makes plumbing relocations more accessible than on a slab — good news for budget management. If the existing drain position works with the new layout, we design around it. On galvanized supply lines — standard in homes built before 1975 — we typically recommend replacing them during the remodel while the walls are already open. Converting to PEX while you have access is significantly cheaper than reopening walls later.

  - q: "What appliance brands do you work with on Longview kitchen projects?"
    a: |
      For Longview's housing stock and typical budget range, we spec and install GE, Whirlpool, Samsung, Frigidaire, and Amana most frequently. These brands have solid local retail and service networks in the area, and their standard dimensions fit the cabinet openings in 1960s-1970s kitchens without significant modification. For a 30-inch range slot or a standard 36-inch refrigerator opening, most of these manufacturers offer appliances that fit existing layouts with minor filler panel adjustments. We provide appliance fitment guidance as part of the design phase — including confirming that the range hood has adequate CFM for the cooking setup and that the dishwasher opening clears base cabinet specs. If you've already selected appliances, bring the spec sheets to the consultation and the layout gets designed around them.

  - q: "What other areas near Longview do you serve?"
    a: |
      TopVolk serves the full Southwest Washington corridor along I-5, including Kelso, Woodland, Castle Rock, and Kalama in Cowlitz County. Clark County — Vancouver, Camas, Battle Ground — falls within our regular service area as well. For kitchen remodels specifically, the project timeline from contract signing to completion typically runs 6-12 weeks depending on permit lead time, structural complexity, and material availability. That timeline includes the City of Longview plan review period for any structural or mechanical work. Every project in this area gets direct communication with Vladislav — not a project manager or sales rep. Call (206) 591-1096 or request a free on-site consultation to get a line-item quote within a week of the visit.