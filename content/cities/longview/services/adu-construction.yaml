title: "Longview ADU Construction — Cowlitz County Rental Income Starts Here"

intro: |
  Lake Sacajawea anchors the center of Longview, and the craftsman bungalows and mid-century
  ranchers fanning out from its shoreline sit on exactly the kind of single-family lots that
  WA HB 1337 (2024) was written for — one parcel, up to two ADUs, legal anywhere in the state
  on any qualifying residential lot. For Longview homeowners earning around the area's median
  household income, a finished detached backyard cottage or a converted garage unit that brings
  in $900-$1,200 per month in rent changes the financial picture considerably. Vladislav Volkov,
  owner of TopVolk Construction LLC, has completed 100+ ADU and remodel projects across the
  Pacific Northwest since 2023 — he's the one who answers the phone, walks your site, and runs
  the project, not a salesperson. A Mitsubishi mini-split for heat and cooling, a Navien tankless
  water heater in a compact utility closet, a Whirlpool appliance package — a Longview ADU
  doesn't need to be elaborate, it needs to be code-compliant, durable, and ready for a tenant
  the day the certificate of occupancy lands. Call (206) 591-1096 to schedule a free on-site
  consultation.

localContext: |
  The bulk of Longview's residential lots fall inside zip code 98632, with the densest
  concentration of older housing stock running along the Lake Sacajawea corridor and out
  toward the R.A. Long High School neighborhood — homes built between 1923 and the late 1940s,
  post-and-pier foundations, original galvanized plumbing in many cases, and electrical panels
  that often need upgrading before the city will issue an ADU permit. Across the Cowlitz River,
  Kelso at 98626 shares similar housing ages and patterns; unincorporated parcels there run
  through Cowlitz County's building department rather than the City of Longview Building
  Division, which means a different permit counter and a slightly different submittal checklist.
  Southwest Washington pulls in roughly 45 inches of rain per year — more than Seattle — so
  vapor barrier installation under any slab or inside any crawlspace is mandatory, not optional,
  and pressure-treated (PT) lumber is required for all framing within 6 inches of grade on a
  new DADU. Hardie cement-board siding outperforms wood lap siding on a detached backyard
  structure in this climate by a significant margin; cedar weathers fast on north-facing walls
  in Cowlitz County's persistent overcast seasons.

commonProblems:
  - title: "Getting a DADU Permit Through the City of Longview Building Division"
    description: |
      WA HB 1337 cleared away most local barriers to ADU construction across Washington state,
      but the City of Longview still requires a full plan review before issuing a DADU building
      permit — and that review typically runs 6-10 weeks for a new detached structure. The
      submittal package needs a site plan with dimensioned setbacks (generally 5 feet from rear
      and side property lines for a DADU), lot coverage calculations, architectural floor plans
      and elevations, and a structural engineering stamp if the design involves anything beyond
      a straightforward single-story box. Unincorporated Cowlitz County parcels go through the
      county building department instead, with its own checklist and fee schedule. TopVolk
      prepares the complete permit package — site plan, energy code compliance documentation,
      construction drawings — so you're not navigating permit software alone. Budget 4-7 months
      from initial permit application to final inspection and certificate of occupancy for a
      DADU in Longview.

  - title: "Undersized Electrical Panels in Pre-1950s Longview Homes"
    description: |
      A significant share of the craftsman-era homes near Lake Sacajawea are still running
      100-amp electrical service, and the City of Longview requires a separate electrical meter
      for most DADU configurations — which means coordinating a new service drop with Pacific
      Power, the local utility, before the project can close. That utility coordination alone
      adds 4-6 weeks in some cases. Upgrading the main house panel to 200-amp service while
      running a subpanel or independent meter to the new ADU structure typically costs
      $4,000-$8,000 for the electrical scope by itself, depending on the distance from the main
      house to the DADU. It's one of the most consistently underestimated line items in ADU
      project budgets. Every TopVolk quote scopes the electrical work explicitly, with a
      line-item number — not absorbed into a vague "site work" category.

  - title: "Foundation Decisions on Clay-Heavy Cowlitz Valley Soils"
    description: |
      The soils in lower-lying parts of Longview — south of Lake Sacajawea, in areas near the
      Cowlitz River floodplain fringe — retain water and compress under load in ways that
      affect foundation design for a new DADU. A slab-on-grade foundation is the most common
      approach for detached ADUs here and generally more reliable in clay-heavy ground than a
      crawlspace, but it requires proper compaction, a 6-mil poly vapor barrier over the
      sub-base, and drainage provisions that satisfy Cowlitz County stormwater requirements.
      Basement conversions inside the existing house call for DriCore subfloor panels before
      any finish flooring goes down, to manage moisture vapor coming up through the concrete
      slab. On some west Longview lots near industrial zones, fill soil conditions require a
      geotechnical review before the city will issue a foundation permit at all. Vladislav
      walks every site before scoping the foundation approach — lot conditions in this part of
      Southwest Washington vary too much to price remotely.

  - title: "What an ADU Actually Costs to Build in Longview in 2025-2026"
    description: |
      A finished detached ADU in the 400-600 square foot range — one bedroom, one bath,
      kitchenette, GE or Whirlpool appliance package — typically runs $120,000-$175,000 in the
      Longview and Cowlitz County market, covering permits, foundation, framing, all MEP
      rough-in, insulation, drywall, and finishes. Attached ADU conversions, whether a garage
      or basement, generally land between $60,000-$110,000 because at least one wall and an
      existing foundation are already in place. What pushes the number up: significant
      electrical service upgrades, separate utility connections, retaining walls on sloped lots,
      engineered foundations on problematic soils, and Hardie siding versus vinyl. Permit fees,
      engineering stamps, and city impact fees typically add $5,000-$12,000 to the total.
      TopVolk provides written line-item quotes — not ranges — and includes a deadline penalty
      clause in every contract. 100+ projects completed since 2023.

  - title: "Utility Separation: Water, Sewer, and Mechanical for a Longview DADU"
    description: |
      The utility setup question comes up on nearly every ADU project: does the new unit need
      its own water and sewer lateral, or can it share the main house connection? The City of
      Longview generally allows shared water and sewer service for an ADU, but the existing
      lateral has to be sized adequately — a 3/4-inch water service line may need to upsize to
      1-inch if combined flow demand increases enough to trigger a capacity concern. A Rinnai
      or Navien tankless water heater solves the storage-tank problem in a tight ADU utility
      closet and qualifies for Washington state energy code without a separate water heater
      permit fight. For heating and cooling, a Mitsubishi mini-split handles both functions in
      a 400-500 SF ADU without ductwork — straightforward for the rough-in inspection and
      efficient for the tenant paying the electric bill. Sewer lateral inspection by the city
      is typically required before the ADU permit closes, so scheduling that inspection early
      avoids last-minute project holds.

faq:
  - q: "How fast can TopVolk get to Longview for an ADU consultation?"
    a: |
      Longview is roughly 2.5 hours south of Seattle on I-5 — Vladislav makes the drive for
      ADU and remodel projects in the right scope range, generally $80,000 and up. Initial
      phone calls happen within 24-48 hours; site visits are typically scheduled within
      1-2 weeks of that first conversation, depending on the project calendar. The on-site
      visit is necessary for ADU work — soil conditions, utility access points, lot geometry,
      and existing foundation conditions can't be assessed from a satellite photo. Call
      (206) 591-1096 to talk through your project before committing to anything.

  - q: "What does a detached ADU cost to build in Longview?"
    a: |
      A 400-600 SF detached ADU in Longview — one bed, one bath, small kitchen, GE or
      Whirlpool appliances — typically runs $120,000-$175,000 all-in, including permits,
      engineering, foundation, framing, MEP, and finishes. Attached garage or basement
      conversions usually land between $60,000-$110,000. Site-specific factors that shift the
      number: slope, Cowlitz Valley clay soil conditions, utility line distances, and whether
      Pacific Power requires a new service drop. TopVolk provides a written line-item quote
      after the site visit — a real number, not a range. Call (206) 591-1096 to schedule the
      free consultation.

  - q: "What permits does a Longview ADU require, and who handles the permit process?"
    a: |
      In-city Longview lots go through the City of Longview Building Division; unincorporated
      Cowlitz County parcels use the county's own building department — two different counters,
      slightly different timelines and fee schedules. Either way, a DADU permit requires a
      site plan, architectural drawings with dimensioned setbacks, energy code compliance
      documentation, and typically a structural engineering stamp. Plan review in Longview
      runs approximately 6-10 weeks for a new structure. After permit issuance, budget for
      framing inspection, rough-in inspection, insulation inspection, and final inspection
      milestones before the certificate of occupancy issues. TopVolk is a WA Licensed
      Contractor and prepares the complete permit submittal package for every ADU project —
      you don't have to learn the portal.

  - q: "Can you convert my existing garage or basement into an ADU in Longview?"
    a: |
      Yes — and in Longview's 1920s-1940s housing stock, the detached garages behind Lake
      Sacajawea-area craftsman homes are often the most practical and cost-effective ADU path.
      The existing foundation and roof structure eliminate a significant portion of new
      construction cost. Basement conversions require egress window installation per IRC
      minimum opening requirements, moisture management with DriCore subfloor panels, and a
      headroom assessment — some older Longview basements run under 7 feet, which affects both
      livability and permit compliance. Every garage and basement conversion is scoped with a
      full MEP (mechanical, electrical, plumbing) plan, not just framing and drywall.

  - q: "How long does the actual ADU construction take in Longview once permits are approved?"
    a: |
      A DADU shell — framing, sheathing, roofing, windows, and Hardie siding — typically goes
      up in 6-8 weeks after permits are in hand. MEP rough-in follows, then the rough-in
      inspection, insulation, and drywall hang, tape, and mud. A 400-500 SF detached ADU
      generally reaches substantial completion in 12-16 weeks of active construction. Attached
      conversions run shorter, usually 8-12 weeks depending on the scope of structural work.
      TopVolk writes specific construction milestone dates into the contract, with financial
      penalties for missed deadlines paid to you — that's a binding commitment, not a
      general assurance about how seriously the schedule is taken.

