title: "Longview HVAC — Heat Pumps & High-Efficiency Heating for Cowlitz County Homes"

intro: |
  Longview was planned from scratch in 1923 as a company town for Long-Bell Lumber. The residential grid went up fast. Heating systems in those original Highlands bungalows and Olympic neighborhood Capes have been improvised ever since — fuel-oil-to-gas conversions in the 1970s, builder-grade furnaces dropped in during the 80s and 90s, window AC units duct-taped into the seasonal rotation. None of it was designed as a system.

  The lower Cowlitz River valley adds its own pressure. Roughly 40 inches of rain a year. December lows drop into the low 30s. Weeks of cold fog roll through from October to March. A leaky or undersized HVAC system just runs constantly and never catches up. Across the 98632 zip, a lot of those 1980s Amana and Rheem furnaces are at or past the 20-year mark. IRA rebates have made heat pump conversion a real conversation for Longview homeowners. Vladislav at TopVolk Construction can run the numbers on what an HVAC upgrade actually costs versus your current monthly gas bill before you commit to anything. Call (206) 591-1096 to schedule a free on-site assessment.

localContext: |
  The 98632 zip covers all of Longview's residential core. That includes the 1920s–1930s bungalows in the Highlands and St. Helens areas, Cape Cod and ranch-style homes from the 40s and 50s in Olympic East and West, and the 70s–80s tract development along the Columbia Heights corridor. Kelso (98626) runs the same housing vintage along the Cowlitz River frontage and sees identical HVAC problems.

  Homes built before 1970 here frequently have undersized return plenums. That single issue is the biggest reason a new high-efficiency furnace or heat pump underperforms after installation. Crawlspace moisture is also chronic in the river valley. Without a proper vapor barrier and insulation underneath, your heating and cooling system works harder all winter fighting ground-level cold.

  Longview's Community Development Division at 1525 Broadway handles mechanical permits for HVAC replacements and new installations. Online submission goes through the PermitTrax portal. Straightforward residential mechanical permits typically clear in 3–7 business days.

commonProblems:
  - title: "Aging Gas Furnaces in Longview's Pre-1970 Housing Stock"
    description: |
      The 1940s–1960s Cape and ranch homes in Olympic East and the St. Helens neighborhood were built with single-speed gas furnaces and minimal ductwork. Duct runs were sized for that era's equipment — not for a modern variable-speed blower. Furnaces installed between 1975 and 1995 are running at roughly 78–80% AFUE on a good day. Cracked heat exchangers and failing blower motors push that number lower.

      Replacing with a high-efficiency 95%+ AFUE unit — Amana makes a solid variable-speed gas furnace at a price point that works for Longview's median income — requires updating the combustion venting to PVC sealed-combustion pipe. That's non-negotiable under current IRC. Budget $4,500–$7,500 installed for a direct furnace swap on a single-story home, depending on whether the existing flue chase can be reused. Longview Community Development mechanical permits for HVAC furnace replacements run $150–$300. Inspections are typically scheduled within a week.

  - title: "Hot and Cold Rooms — Duct Leakage and Air Balancing in Older Homes"
    description: |
      One bedroom freezes. Another bakes. Nobody agrees on the thermostat. In pre-1970 homes throughout the Highlands and Columbia Heights areas, the root cause is almost always supply and return plenum leakage. Conditioned air bleeds into unconditioned crawlspaces through gaps in sheet metal seams. Or the return pathways are so undersized that the air handler starves for airflow on cold days.

      Mastic compound sealing — not duct tape, which fails within a few seasons — plus manual damper balancing at each branch run can recover 15–25% of HVAC capacity without touching any equipment. A Nest Learning Thermostat or ecobee SmartThermostat Premium added at the same time gives you real data on temperature swings by zone. Duct sealing on a typical 1,500–2,000 sq ft Longview house runs $1,200–$2,500 depending on crawlspace access. No permit is required for sealing alone. Plenum modifications trigger a mechanical permit through Community Development.

  - title: "Ductless Mini-Split Installation for ADUs and Finished Additions"
    description: |
      Under WA HB 1337 (2024), Longview homeowners can now permit up to two ADUs on a single-family lot — attached or detached. Running new ductwork to a converted garage or a DADU in the backyard almost never pencils out. The existing furnace duct system isn't sized for the additional square footage. Cutting through finished ceilings to add trunk lines is disruptive and expensive.

      A single-zone Mitsubishi MSZ-GL ductless mini-split is the clean HVAC answer — one refrigerant line set through the wall, an outdoor condenser, a wall-mount air handler sized via Manual J calculation to the actual room load. Single-zone installation runs $3,500–$5,500 depending on line set length and mounting conditions. Longview Community Development requires a mechanical permit for mini-split installation at any BTU rating. TopVolk, as a WA Licensed Contractor, handles the permit application and inspection scheduling so you don't have to navigate the PermitTrax portal yourself.

  - title: "Heat Pump Conversion From Gas: IRA Rebates and Real Project Costs"
    description: |
      The Inflation Reduction Act's 25C Energy Efficient Home Improvement Credit covers 30% of qualifying heat pump installation costs up to $2,000 per tax year. Washington State's HEEHRA rebate program adds point-of-sale incentives for households at or below 150% of area median income — relevant for a lot of Longview families at the county's $48K median.

      The practical complication: many 98632 homes still run 100-amp electrical service panels. A central heat pump with electric-resistance backup typically needs 200-amp service. A Rheem or Carrier ducted heat pump rated at 17+ SEER2 with an HSPF2 above 9.0 qualifies for the tax credit. Panel upgrade cost adds $2,500–$4,500 to the total project. Full central heat pump conversion on an existing forced-air HVAC system runs $9,000–$15,000 installed before incentives. Get the panel assessment done first — it changes everything about the budget.

  - title: "AC Addition on Existing Forced-Air Systems"
    description: |
      Longview's summers are mild. Highs rarely crack 85°F for more than a week or two. But that humid river valley air makes an 82-degree day feel heavier than the number suggests. Adding central air conditioning to a working gas furnace is a real option when the ductwork is adequately sized.

      An evaporator coil mounts in the supply plenum directly above the furnace. Refrigerant lines run to a new outdoor condenser unit. The existing furnace blower motor handles air distribution. A Rheem or Amana 2.5- to 3-ton AC unit sized via Manual J for a typical 1,800 sq ft Longview ranch runs $4,500–$7,000 installed. The critical check before quoting: blower motor capacity. Older single-speed furnace blowers often can't move air against the added static pressure of an evaporator coil. If the blower is undersized, factor in $400–$800 to replace it. Longview Community Development requires a mechanical permit for any new refrigerant system — that's true for add-on AC, mini-splits, and full heat pump installs alike.

