title: "Longview Insulation — Stop Losing Heat Through 1920s Attics"

intro: |
  Built as a planned company town in 1923 for Long-Bell Lumber workers, the residential
  grid surrounding Lake Sacajawea Park holds some of the oldest housing stock in Cowlitz
  County — and most of those homes have never had a meaningful insulation upgrade. Three
  inches of compressed fiberglass batt in the attic and bare Douglas-fir framing at the
  rim joists is still the reality in much of 98632. The Columbia River valley doesn't
  deliver mountain cold the way North Bend or Snoqualmie does, but Longview still pulls
  around 50 inches of rain per year, and the Cowlitz Valley funnels cold, damp air from
  November through February. That combination wrecks whatever original insulation exists —
  cellulose settles, fiberglass batts absorb moisture and lose R-value fast. TopVolk
  Construction, owner-operated by Vladislav Volkov with 100+ projects completed since 2017,
  handles insulation retrofits across Southwest Washington and the Seattle metro. An on-site
  assessment in Longview starts with a call to (206) 591-1096 — no phone quotes, no
  estimates based on guessing.

localContext: |
  The housing in 98632 and the 98633 corridor splits clearly between two eras. Pre-war
  homes — anything built before 1950 in the original planned neighborhood grid near Olympic
  Way — sit on post-and-pier or concrete perimeter foundations with unencapsulated crawl
  spaces and attics that were never designed to hold R-49. Post-1970 construction in Mint
  Valley and the west-side residential areas is better but still frequently below Washington
  State Energy Code (WSEC 2021) minimums. Crawl spaces here are particularly problematic:
  the water table near the Columbia and Cowlitz confluence rises seasonally, and without a
  proper vapor barrier and perimeter drainage, moisture migrates up through the subfloor
  framing into living spaces year-round. Older bungalows throughout 98632 also have knee
  walls on the upper floor with zero insulation behind them. For permits, the City of
  Longview Building Department handles in-city work, while unincorporated Cowlitz County
  properties route through Cowlitz County Community Development — different offices, but
  both manageable with the right documentation.

commonProblems:
  - title: "Attic Insulation Below R-49 in Pre-War Homes Near Lake Sacajawea"
    description: |
      The Washington State Energy Code requires R-49 in attics for Climate Zone 4, which
      covers Cowlitz County. In the pre-war homes nearest Lake Sacajawea Park, what's
      typically up there is 3–4 inches of original fiberglass batt compressed down to maybe
      R-10 effective — a massive gap. The fix is blown-in insulation added on top after
      air-sealing the attic floor: CertainTeed InsulSafe blown fiberglass or Greenfiber
      blown cellulose, brought up to 15–16 inches for R-49. Before blowing anything in,
      you foam the top plates, seal around all penetrations, and install proper baffles at
      the eaves to keep the ventilation channels open. Skipping air-seal and just dumping
      insulation on top is the most common mistake — you hit R-value on paper and still
      lose heat through gaps. A full attic retrofit on a 1,200–1,800 sq ft Longview home
      typically runs $2,500–$5,000, with Pacific Power rebates potentially offsetting
      $400–$700 of that on qualifying scopes.

  - title: "Crawl Space Moisture and Failed Vapor Barriers Near the Cowlitz River"
    description: |
      The 1930s and 1940s homes on Longview's west side — especially anything within a
      few blocks of the Cowlitz River — have open vented crawl spaces that were never built
      for this valley's moisture load. Fifty inches of annual rainfall plus seasonal
      groundwater elevation means chronic dampness under the floor is the default, not the
      exception. A proper encapsulation involves a 20-mil polyethylene vapor barrier across
      the entire crawl floor, lapped up the foundation walls, sealed at every seam and
      penetration, with perimeter drainage added where water intrusion is active. Rigid foam
      insulation on the foundation walls — typically R-10 minimum — replaces the old
      batt-under-joist approach that traps moisture against the framing. Knauf EcoBatt
      mineral wool works better than standard fiberglass in high-humidity crawl spaces.
      Full encapsulation on a typical Longview crawl space runs $4,000–$9,000 depending
      on square footage, existing drainage, and access.

  - title: "Rim Joist Air Sealing — Bare Framing Where Cold Air Enters Every Night"
    description: |
      The rim joist — the band of framing sitting on top of the foundation wall around the
      first-floor perimeter — is one of the highest heat-loss points in older Longview homes,
      and it's almost never addressed in attic-only insulation jobs. In a 1920s or 1930s
      home in 98632, those joists are bare Douglas-fir exposed directly to cold foundation
      air. Cut-and-cobble fiberglass batt in the rim joist cavity improves R-value on paper
      but doesn't air-seal — cold air still moves through gaps around the batt perimeter.
      Closed-cell spray foam is the right fix: two-component products like Demilec Heatlok
      applied in 2-inch lifts deliver roughly R-13 and create a complete air barrier in a
      single pass. This isn't DIY territory — spray foam requires proper PPE, controlled
      ambient temperature, and consistent lift thickness to cure correctly. TopVolk is a WA
      Licensed Contractor; rim joist work on a typical Longview home adds $800–$2,000 to
      a project depending on foundation perimeter and access.

  - title: "Knee Wall Insulation in 1.5-Story Bungalows — Missing in Almost Every Case"
    description: |
      Longview's original Cape Cod and bungalow-style homes in the core neighborhood grid
      have finished second-floor space tucked under the roof slope — a 1.5-story
      configuration. The knee walls in those spaces (the short vertical walls between the
      floor level and the roof pitch) are almost universally uninsulated. The fix is R-21
      fiberglass batt or Rockwool Safe'n'Sound mineral wool in the knee wall cavities, with
      air-sealing at the top plate. The part that gets missed constantly is the attic floor
      behind the knee wall — the unconditioned triangular space needs insulation at the joist
      level too, or the second floor stays cold regardless of what's in the walls. Mineral
      wool is worth the extra cost here: it handles the humidity behind knee walls better
      than standard fiberglass and adds meaningful sound attenuation if there are bedrooms
      involved. Full knee wall and floor joist scope on a 1.5-story Longview home runs
      $1,500–$3,500 depending on floor area and access conditions.

  - title: "Pacific Power and Cascade Natural Gas Rebates — Real Money, But Coordination Required"
    description: |
      Pacific Power offers energy efficiency rebates for qualified insulation upgrades —
      attic, wall, and crawl space — for residential customers in Longview. Cascade Natural
      Gas runs parallel programs on the heating side. On a $5,000 attic job, a $400–$700
      rebate is meaningful. To qualify, work needs to meet or exceed WSEC 2021 minimums
      (R-49 attic, R-10 crawl foundation walls), and many programs require pre-approval
      before work starts — utility rebates typically can't be claimed retroactively on
      completed work. That coordination step matters and needs to be built into the project
      schedule upfront, not figured out after the fact. Vladislav tracks current Pacific
      Power and Cascade program requirements, confirms eligibility before the scope is
      finalized, and accounts for rebate timing in the project plan. Combined insulation
      projects covering attic, rim joists, and crawl space on a typical Longview home run
      $7,000–$18,000 total, with rebates often reducing effective cost by $500–$1,500 on
      qualifying scopes.

faq:
  - q: "How fast can you get to Longview for an insulation assessment?"
    a: |
      TopVolk Construction is Seattle-based, and Longview is roughly 2 hours south via
      I-5 through the Cowlitz Valley — a straightforward drive. Vladislav schedules Longview
      consultations on days when the travel makes logistical sense, so lead time to get eyes
      on a project is typically 5–10 days out. From that consultation to a signed written
      scope usually takes another week depending on project complexity. Once scheduled and
      materials staged, most attic and crawl space jobs run 1–3 days on site. Call
      (206) 591-1096 to get on the schedule — you talk directly to Vladislav, not a
      dispatcher or sales rep.

  - q: "What does a full insulation upgrade cost for a Longview home?"
    a: |
      Attic insulation to R-49 runs $2,500–$5,000 for a 1,200–2,000 sq ft home depending
      on existing depth, attic access, and air-sealing scope. Rim joist closed-cell spray
      foam is typically quoted separately at $800–$2,000 based on foundation perimeter.
      Crawl space encapsulation adds $4,000–$9,000 depending on size and drainage needs.
      Pacific Power rebates can offset $400–$1,000 of qualifying work. Combining all three
      scopes on a typical pre-war Longview home lands in the $7,000–$16,000 range.
      Vladislav provides line-item written quotes after a free on-site assessment — not
      ballpark ranges over the phone. Call (206) 591-1096 to schedule.

  - q: "Do I need a permit for insulation work in Longview or Cowlitz County?"
    a: |
      Most standalone residential insulation work — attic blown-in, crawl space encapsulation,
      rim joist foam — does not require a permit from the City of Longview Building Department.
      If the insulation scope is tied to a broader remodel involving framing changes or
      ventilation alterations, it gets pulled into the permit package for that project.
      Unincorporated Cowlitz County properties route through Cowlitz County Community
      Development rather than city building services. TopVolk is a WA Licensed Contractor
      and handles permit coordination when a permit is required — including documentation
      prep and inspection scheduling. Vladislav confirms the permit requirement for your
      specific property during the on-site walk.

  - q: "Is blown-in insulation better than fiberglass batt for older Longview homes?"
    a: |
      For attic retrofits in Longview's older housing stock, blown-in almost always
      outperforms batt. CertainTeed InsulSafe blown fiberglass or Greenfiber blown cellulose
      fills around existing framing, pipe penetrations, and irregular joist spacing in ways
      that cut-and-fit batt can't replicate — gaps in batt installation account for a
      significant share of real heat loss even when R-value looks adequate on paper. Cellulose
      has slightly better air resistance and uses recycled content. For wall cavities and
      knee wall spaces, Rockwool Safe'n'Sound mineral wool batts are the better call in
      high-humidity Pacific Northwest conditions — they don't lose R-value when damp and
      provide real sound attenuation between floors. Vladislav recommends material per
      application based on access, conditions, and what's already up there.

  - q: "What warranty do you offer on insulation work in Longview?"
    a: |
      The insulation materials carry manufacturer warranties — CertainTeed, Rockwool, and
      Demilec (spray foam) all warrant their products against significant R-value loss for
      the life of the install under normal conditions. Vladislav warranties the labor
      separately: if a crawl space vapor barrier fails at a seam or a spray foam lift didn't
      cure to spec, TopVolk returns and makes it right. Installation defects show up the
      first heating season, not years later — that's when any issues get caught and fixed.
      The written project scope specifies materials, thickness, and coverage area for every
      component, so there's no ambiguity after the fact about what was installed or where.
      Deadline penalties are also written into the contract — if the project runs late on
      TopVolk's end, there are consequences.

  - q: "Do you cover Kelso and other areas near Longview?"
    a: |
      Kelso (98626), Castle Rock, Woodland, and unincorporated Cowlitz County are all within
      the project area. TopVolk has worked on homes along the I-5 corridor from the Seattle
      metro south to the Columbia River and coordinates Cowlitz County work on dedicated
      travel days to make scheduling efficient. Larger scopes — a full home insulation
      retrofit combined with crawl space work — are exactly the type of project where the
      drive makes sense for both sides. Smaller patch jobs or single-room work are harder
      to justify given travel time, so those typically aren't a fit. Call (206) 591-1096
      to talk through your project and figure out if the scope and timing work for a
      Cowlitz County visit.