title: "Longview Plumbing — Old Pipes, Permits & Remodel Rough-Ins"

intro: |
  Built from scratch in 1923 by the Long-Bell Lumber Company, Longview is one
  of the few American cities that came out of the ground as a fully planned town —
  grid streets, a central park system anchored by Lake Sacajawea, and worker
  housing constructed all at once for mill employees. A hundred years later, a
  meaningful slice of that original housing stock is still occupied, and the
  plumbing inside it is showing its age. Homes along the streets west of R.A.
  Long High School and throughout the older neighborhoods near Kessler Boulevard
  frequently still carry their original galvanized steel supply lines — pipes that
  have been narrowing from the inside with rust and mineral scale for six or seven
  decades. Water pressure drops. Fixtures fail early. A Moen single-handle
  cartridge shouldn't burn out in two years, but it will if the supply pressure is
  swinging between 90 psi and a trickle. Plumbing work in Longview means
  understanding what era the house is from, what's actually in the walls, and
  what the City of Longview Building Department requires before you touch it.

localContext: |
  Longview's 98632 zip covers almost the entire city, but the housing inside that
  boundary spans nearly a century of construction. The oldest stock — 1920s
  bungalows and worker cottages within a half-mile of downtown and Lake Sacajawea
  — is where you find galvanized supply lines, cast-iron drain stacks, and city
  water connections that haven't been touched since Truman was president. Out
  toward Mint Valley and the subdivisions off Ocean Beach Highway, the housing
  shifts to 1960s–1980s ranch and split-level construction: copper supply in
  generally better shape, but gray polybutylene pipe shows up in homes built
  between about 1978 and 1995 — and poly-b is a ticking clock. Cowlitz County
  averages close to 48 inches of rain annually, and crawlspaces under Longview's
  older homes stay damp from October through May without exception. That sustained
  moisture corrodes cast-iron drain connections faster than in drier climates and
  keeps vapor barriers wet against unprotected framing. Homes near the Columbia
  River floodplain edge — particularly in lower-lying areas on the west side —
  also sit on clay-heavy soils that shift seasonally, which puts stress on rigid
  cast-iron drain lines and older slab penetrations.

commonProblems:
  - title: "Galvanized Supply Lines Killing Water Pressure in Pre-1960 Homes"
    description: |
      A Longview bungalow built in 1934 near the Lake Sacajawea corridor will
      often have its original ¾-inch galvanized steel supply lines — and after
      90 years of mineral deposit buildup, the effective interior diameter is
      closer to ⅜ inch. You replace the showerhead, you install a new Kohler
      valve body, pressure still drops the moment two fixtures run at once. The
      lines themselves are the restriction. The fix is a full repipe in PEX-A
      (Uponor AquaPEX or Viega PEX are the two reliable choices — not
      commodity PEX-B from the home center) or Type L copper. In a 1,100–1,500
      square foot Longview home, a PEX-A repipe runs 3–5 days of work and
      requires a permit through the City of Longview Building Department. A
      rough-in inspection is required before drywall closes over any new lines.
      Total project cost typically runs $5,500–$9,500 for PEX-A, higher for
      copper. 100+ projects completed since 2023 — we've done this scope many
      times and can give you a line-item number after one on-site visit.

  - title: "Polybutylene Pipe Failure in 1980s Ranch Homes"
    description: |
      Gray polybutylene pipe — installed in a significant share of Pacific
      Northwest homes built between 1978 and 1995 — doesn't fail the way
      galvanized does. There's no slow narrowing. The pipe degrades from the
      inside, then splits — sometimes as a sudden burst, sometimes as a seep
      behind drywall you don't notice until the subfloor buckles. Ranch homes
      in Mint Valley and subdivisions off Allen Street from that era are worth
      checking. Look for gray flexible lines at the water heater connection and
      under vanity sinks. Some insurers now exclude poly-b systems from coverage
      or require replacement at policy renewal. Repipe cost for a 1,400-square-
      foot ranch typically runs $4,800–$8,500 depending on crawlspace access,
      fixture count, and whether the main shutoff valve needs replacement at the
      same time. City of Longview permits and a final inspection are required
      for a full repipe — we pull the permit and coordinate the inspector visit
      so the homeowner doesn't have to manage the paperwork.

  - title: "Water Heater Replacement — Seismic Strapping and Permit Requirements"
    description: |
      Washington State code requires seismic strapping on every water heater
      installation — two straps, upper and lower third of the tank, anchored to
      wall framing, not drywall. A lot of existing water heaters in Longview
      have single-strap installs or straps screwed into hollow drywall that
      would pull out in any real lateral movement. The City of Longview Building
      Department requires a permit for new water heater installations, which
      triggers an inspection. As a WA Licensed Contractor, we pull the permit,
      strap to current IRC seismic provisions, and schedule the inspector — the
      homeowner doesn't manage any of that. Converting from a tank unit to a
      Rinnai RU199iN or Navien NPE-240A2 tankless? Gas line upsizing from
      ½-inch to ¾-inch is almost always required, which is a separate permit
      and a second inspection. Standard tank swap: 1–2 days. Full tankless
      conversion with gas line upsize and venting: 3–4 days. Deadline for
      project completion is written into the contract — if we miss it, there's
      a financial penalty on our end.

  - title: "High Water Pressure Damaging Fixtures — PRV Replacement"
    description: |
      City water pressure at some Longview addresses runs 85–95 psi — well above
      the 80 psi maximum in the IRC. That excess pressure hammers valve seats,
      blows out supply hose connections at the toilet and washing machine, and
      causes water hammer loud enough to rattle pipes in the wall when the
      dishwasher shuts off. Washing machine hoses rated for 150 psi will still
      fail early when they're cycling at 90 psi daily. A pressure reducing
      valve (PRV) from Watts or Zurn installed at the main supply entry brings
      pressure to 60–65 psi and protects everything downstream — fixtures,
      appliances, ice maker lines, all of it. PRV installation in a Longview
      crawlspace or utility room typically costs $380–$650, depending on pipe
      access and whether the main shutoff also needs replacement (it often does
      on older ball valves). No permit required in most cases for a straight PRV
      swap — but jurisdiction requirements get confirmed before any work starts.

  - title: "Drain Line Rough-Ins for Kitchen Islands and Basement Bathrooms"
    description: |
      Adding an island sink to a kitchen or roughing in a basement bathroom means
      moving drain lines — and in Longview's older homes, those drain lines are
      cast iron embedded in slab or snaking through a low-clearance crawlspace.
      Cast iron doesn't flex. Cutting a slab for a new island drain involves a
      concrete saw, jackhammer work, setting a new ABS stub-out at ¼-inch-per-
      foot slope per IRC minimum, and a repour after inspection. Basement
      bathrooms that can't gravity-drain to the main sewer stack need an ejector
      pump — Zoeller makes the M53 and M267 units we install most often; both
      are reliable and serviceable. City of Longview requires a plumbing permit
      for any new drain rough-in, and an inspector needs to see the open trench
      or exposed lines before backfill or concrete pour. Budget $2,800–$6,500
      for a basement bathroom drain rough-in depending on distance to the stack,
      whether the slab needs cutting, and the ejector pump requirement.

faq:
  - q: "How fast can TopVolk get to Longview for a plumbing project?"
    a: |
      Longview is about 2.5 hours from Seattle on I-5 — roughly the same drive
      as Olympia but headed southwest. For project-based plumbing work (repiping,
      tankless conversion, drain rough-ins), we schedule Cowlitz County trips in
      dedicated blocks rather than mixing them with same-day King County jobs.
      On-site consultations typically get scheduled within 1–2 weeks of first
      contact. Vladislav does the site visit himself — you're talking to the
      person who will run the project, not a sales rep. Call (206) 591-1096 to
      describe the scope and get on the calendar. We provide a written quote with
      line-item pricing after the visit — not a range over the phone.

  - q: "What does a full repipe cost in Longview?"
    a: |
      For a typical Longview home in the 1,000–1,600 square foot range with two
      bathrooms and one kitchen, a PEX-A repipe (Uponor material, permit
      included) runs $5,500–$9,500. Type L copper runs $8,500–$14,000 for the
      same scope and takes longer due to soldering time. What moves the price:
      crawlspace clearance (under 18 inches adds significant labor hours),
      fixture count, whether the main water service line from the street also
      needs replacement, and drywall patching scope after access holes are cut.
      Free on-site consultation with an actual contractor — call (206) 591-1096
      and we'll schedule a visit and deliver a written quote with real numbers.

  - q: "Does Longview require permits for plumbing work?"
    a: |
      Yes. The City of Longview Building Department requires permits for water
      heater replacements, full repiping, new drain rough-ins, gas line
      modifications, and any work that opens walls to modify supply or drain
      lines. Properties outside Longview and Kelso city limits — unincorporated
      Cowlitz County parcels — go through the Cowlitz County Community
      Development office instead. As a WA Licensed Contractor, we pull every
      permit that's required, coordinate rough-in and final inspections, and
      carry liability through the whole scope. Permit fees in Longview for a
      standard repipe or water heater installation typically run $150–$350
      depending on project scope.

  - q: "Can you convert a tank water heater to a tankless Rinnai or Navien unit?"
    a: |
      Yes, and it's one of the more common plumbing scopes we handle in older
      Longview homes where utility space is tight. The critical variable is
      the gas supply line: most homes have ½-inch gas at the water heater
      location, and both Rinnai and Navien high-efficiency condensing units
      require ¾-inch supply at minimum. That gas line upsize requires its own
      permit and a separate inspection through the City of Longview. Direct-vent
      PVC concentric pipe through an exterior wall handles venting on most
      installations. Total project — unit, gas line upsize, venting, permits —
      typically runs $3,800–$6,500. A Navien NPE-240A2 in a two-bathroom home
      consistently shows 20–30% reduction in gas bills compared to a standing
      40-gallon tank.

  - q: "How disruptive is a repipe, and how long does the project take?"
    a: |
      In a typical 1,200-square-foot Longview bungalow, a PEX-A repipe runs
      2–4 days from first cut to pressure test. Water shuts off during active
      work hours but gets restored each evening — the house stays livable
      throughout. The City of Longview schedules rough-in inspections within a
      few business days of request; we time the permit pull so inspection doesn't
      delay the project. Drywall patching over access holes can be handled as
      part of the scope or left for a separate trade — your call. Copper takes
      an extra day or two. The project completion date goes in the contract, and
      if we miss it, the penalty comes out of our fee — not your pocket.

  - q: "Do you also cover Kelso and other nearby Cowlitz County areas?"
    a: |
      Kelso (98626) sits right next to Longview and is treated as the same
      service area — same drive, same permit jurisdiction awareness, same
      scheduling. Castle Rock, Woodland near the Clark County line, and
      unincorporated Cowlitz County parcels are also within range for project-
      based plumbing work. Permit applications for properties outside Longview
      and Kelso city limits route through Cowlitz County Community Development —
      we handle that paperwork directly. To get on the schedule, call
      (206) 591-1096. Vladislav handles on-site visits personally across the
      full service area — 100+ projects completed since 2023, and the same
      owner who answers the phone runs the job.