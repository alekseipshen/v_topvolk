title: "Longview Painting — Columbia Rain, Cedar, and Real Prep"

intro: |
  The planned grid running south of Lake Sacajawea holds some of Longview's oldest
  housing — 1920s and 1930s bungalows built when Weyerhaeuser laid this city out
  from nothing. Cedar trim on those homes has been repainted a dozen times. Columbia
  River basin air keeps surfaces damp from October through May, and north-facing walls
  in the West Side neighborhoods collect moss and mildew faster than most homeowners
  expect. Drive along Olympic Way or through the older blocks near downtown and paint
  failures read clearly: chalking surfaces, dark staining at fascias, siding that's
  faded from its original color to a flat, uniform gray.

  TopVolk Construction handles exterior repaints start-to-finish — 2,500 PSI power
  wash, alkyd penetrating primer, two finish coats of Sherwin-Williams Duration or
  Benjamin Moore Aura depending on substrate condition. Vladislav Volkov runs every
  project directly. No sales staff, no middlemen — you talk to the person doing the
  work. Call (206) 591-1096 to set up a free on-site estimate.

localContext: |
  Longview's zip codes 98632 and 98633 span noticeably different housing eras. The
  98632 side — older streets close to downtown and the Lake Sacajawea park corridor —
  carries heavy pre-1940 construction: wood lap siding, original wood windows, plaster
  walls inside. A large share of those homes were built before 1978, which means
  lead-based paint testing under EPA RRP rules is a live concern before any scraping or
  sanding begins.

  The 98633 side and areas stretching toward Kelso shift to more mid-century stock —
  1960s and 1970s ranch homes where cedar shake or early composite siding has weathered
  decades of Cowlitz County rainfall. That rainfall averages over 50 inches annually,
  heavier than Seattle, and it shows up in paint cycles. Exterior coatings on west- and
  north-facing surfaces typically start failing at 5–6 years when prep was skipped.
  Interior repaints after kitchen and bathroom remodels are common too — walls that
  absorbed steam and grease for 20 years need a solid KILZ Original prime coat before
  any latex topcoat will adhere properly.

commonProblems:
  - title: "Cedar Trim Cycling on 5-Year Intervals Along the Columbia Basin"
    description: |
      Longview's rainfall exceeds 50 inches annually, and cedar trim takes the worst of
      it. Wood grain opens with seasonal moisture cycles, and paint that wasn't
      back-primed on all four sides before installation starts peeling at the 5-year
      mark — sometimes earlier on north-facing exposures. The fix isn't brushing a
      fresh coat over chalky old paint. Failed areas need scraping to bare wood,
      spot-priming with an alkyd penetrating primer like Zinsser Bulls Eye 1-2-3, then
      two full finish coats applied in sequence. Sherwin-Williams Duration Exterior in a
      satin sheen performs well on cedar in wet climates — it's marketed as
      self-priming on intact surfaces, but bare wood still needs that alkyd base coat
      first or adhesion fails within a season. A full exterior repaint on a 1,500 sq ft
      Longview bungalow — trim, fascia, and soffits included — typically runs
      $3,000–$5,500 depending on story height and how much surface prep the existing
      paint demands.

  - title: "Lead Paint Testing Is Not Optional in Longview's Pre-1940 Homes"
    description: |
      A large portion of homes in the 98632 zip code were built before 1940, and most
      pre-1978 construction in Cowlitz County carries lead-based paint somewhere in the
      system — often under layers of later coats. EPA RRP (Renovation, Repair, and
      Painting) rules require any contractor disturbing that paint through scraping,
      sanding, or dry cutting to follow strict containment and cleanup protocols. An XRF
      test or certified swab test confirms lead presence before any prep work starts.
      If lead is found, containment plastic, HEPA vacuuming, and certified disposal of
      paint debris are all required — these aren't optional line items. TopVolk
      Construction is a WA Licensed Contractor and follows RRP protocols on every
      applicable pre-1978 project. Budget an additional $300–$600 for proper RRP
      containment setup on an older Longview exterior. Skipping this process creates
      real federal liability and genuine health risk, particularly in homes with young
      children.

  - title: "Bathroom and Laundry Room Walls Peel When the Finish Doesn't Match the Environment"
    description: |
      Steam from showers in Longview's older homes — many still without functional
      exhaust fans — saturates drywall or plaster quickly. Standard flat latex paint
      doesn't hold up to repeated moisture exposure. The correct approach is a satin or
      semi-gloss finish on walls, eggshell minimum on ceilings, applied over a coat of
      Zinsser BIN shellac primer wherever moisture staining has already appeared. New
      drywall from a recent bathroom remodel needs priming too — unprimed paper-faced
      drywall drinks topcoat unevenly and leaves a patchy, uneven finish. Rough patches
      around Moen or Kohler fixture penetrations that were skipped during install get
      addressed at this stage. Benjamin Moore Aura Bath & Spa is formulated
      specifically for high-humidity rooms and holds up to regular cleaning without
      burnishing the sheen flat. A single bathroom interior repaint in Longview
      typically runs $350–$650 depending on room size and existing surface condition.

  - title: "Cabinet Repainting at $1,200–$2,800 Versus Full Replacement at $8,000–$20,000"
    description: |
      Full kitchen cabinet replacement in Longview's market runs $8,000–$20,000 once
      you price out semi-custom boxes, installation labor, countertop cutouts, and
      hardware. Cabinet repainting delivers most of the visual transformation at
      $1,200–$2,800 depending on door count and whether the frames are included in
      scope. The process requires doors to come off, be sanded, primed with a bonding
      primer like Zinsser BIN, and finish-coated with a waterborne alkyd — Benjamin
      Moore Advance levels well and cures hard enough for daily cabinet use. Frames get
      brushed and rolled; doors and drawer fronts go through a sprayer for a smooth,
      factory-quality finish. Deglossing is mandatory on any factory lacquer coat —
      skip it and adhesion fails within a year. A properly executed cabinet repaint
      holds up 8–12 years under normal kitchen use, making it a sound investment before
      committing to a full replacement project.

  - title: "Skipping Prep Is Why Longview Exteriors Fail Before the Warranty Period Ends"
    description: |
      The leading cause of early exterior paint failure in the Pacific Northwest isn't
      the paint brand — it's inadequate surface preparation. Coating over chalky,
      mildewed, or dirty surfaces locks the failure mode in and guarantees early
      peeling. Every exterior repaint starts with a 2,500–3,000 PSI power wash,
      followed by mildewcide treatment on any north-facing surfaces. After drying,
      failed paint gets scraped and spot-sanded. Bare wood areas receive a penetrating
      alkyd spot-prime before the full prime coat goes down. Two finish coats of a
      100% acrylic exterior — Sherwin-Williams Duration or PPG Timeless are both worth
      the price premium over builder-grade product — go on last, back-rolled for even
      mil thickness across the surface. Skipping to a single finish coat shaves about
      $400 off the job and costs roughly 2 years of service life. On Longview's
      rainfall schedule, that tradeoff rarely makes sense. A properly prepped two-coat
      exterior repaint on an average home takes 3–5 days to complete.

faq:
  - q: "How fast can you get to Longview for painting work?"
    a: |
      Longview sits about 140 miles south of Seattle on I-5 — roughly 2 hours
      depending on traffic through Tacoma and past Chehalis. Travel isn't billed
      separately on project work; it's built into the scope. Estimates are done in
      person: Vladislav comes to the house, examines the actual surface condition, and
      delivers a line-item quote before anything is scheduled. Call (206) 591-1096 to
      set up a time. Most exterior and interior painting projects in Longview can be
      scheduled 2–4 weeks after contract signing — exterior work depends on weather
      windows, so spring and early summer bookings fill faster than fall slots.

  - q: "What does exterior house painting cost in Longview?"
    a: |
      A typical single-story Longview home — 1,200–1,800 sq ft — runs $2,500–$6,000
      for a full exterior repaint including pressure wash, prime coat, and two finish
      coats. Two-story homes or projects with significant prep work — heavy peeling,
      EPA RRP lead containment, rotted fascia repair before painting — push toward
      $6,000–$9,000. Interior room repaints run $300–$700 per room depending on ceiling
      height and trim detail. Cabinet repainting starts around $1,200 for a basic
      kitchen layout. Every quote is fully line-itemized after the site visit — no
      vague ranges once Vladislav has seen the job. Free on-site estimates; call
      (206) 591-1096 to schedule.

  - q: "Does painting in Longview require a permit, and what about lead paint regulations?"
    a: |
      Standard interior or exterior repainting in Longview doesn't trigger a building
      permit from Cowlitz County — it falls under routine maintenance, not construction.
      Lead paint is a separate issue entirely. Pre-1978 homes fall under federal EPA RRP
      regulations, which require certified contractors to follow containment and cleanup
      protocols before scraping or sanding begins. These aren't local permits, but
      non-compliance carries real federal fines regardless. TopVolk Construction is a
      WA Licensed Contractor and handles full RRP protocol on all applicable pre-1978
      projects. XRF or swab testing gets done upfront, before any prep work. If you're
      unsure whether your home has lead paint, that's the first thing to confirm —
      not something to sort out after stripping has started.

  - q: "Is cabinet repainting actually durable enough, or should I just replace them?"
    a: |
      Repainting holds up when the cabinet box structure is sound — no delaminating
      plywood, no water damage to the base cabinet floors, doors that still hang level.
      If the carcasses are failing, repainting solves the visual problem without
      touching the structural one. When the bones are solid, a waterborne alkyd finish
      like Benjamin Moore Advance cures hard enough for daily kitchen use and resists
      chipping far better than standard latex. Doors are sprayed for a factory-smooth
      finish; frames are brushed and rolled. The full process takes 2–4 days depending
      on door count. For most Longview kitchens working within a realistic budget,
      cabinet repainting is usually the right call before pricing out a full
      replacement project.

  - q: "What warranty do you offer on painting work in Longview?"
    a: |
      Labor warranty on exterior projects runs 2 years, covering peeling, adhesion
      failure, or application defects. Interior work carries a 1-year labor warranty.
      Sherwin-Williams Duration and Benjamin Moore Aura both carry lifetime limited
      product warranties on the paint material itself — those cover manufacturing
      defects, not damage from physical impact or moisture intrusion through
      pre-existing failed caulking or flashing. Surface conditions that existed before
      the project are documented in writing before work starts so there's no ambiguity
      later. Deadline penalties are written into every contract — if the project runs
      past the agreed schedule for reasons other than weather delays or supply issues,
      TopVolk pays a penalty per day. 100+ projects completed since 2017 across the
      Seattle metro and southwest Washington.

  - q: "Do you cover Kelso and other Cowlitz County areas besides Longview?"
    a: |
      Kelso is 10 minutes from most Longview addresses — same trip, effectively.
      TopVolk works throughout Cowlitz County, and Castle Rock, Woodland, and Kalama
      are all within reasonable project range. Scheduling in this area works by
      clustering projects, so Vladislav isn't making a solo drive from the Seattle
      metro for a single-day touch-up; project minimums apply. Full exterior repaints,
      interior repaints after kitchen or bathroom remodels, and cabinet refinishing all
