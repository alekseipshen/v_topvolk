title: "Longview Drywall Installation — Moisture, Old Plaster & Level 5 Finishes"

intro: |
  Longview was purpose-built starting in 1923, and many of the original homes near Lake
  Sacajawea still have lath-and-plaster walls from that founding era — they crack, they
  shift, and when a remodel opens them up, you face a real choice between patching plaster
  or converting to drywall. Cowlitz County sits in one of the rainiest lowland corridors
  in southwest Washington, pulling close to 47 inches of precipitation annually, and that
  moisture shows up in basements, laundry rooms, and bathrooms as mold staining on standard
  paper-faced gypsum board within a few years. USG Sheetrock Mold Tough — what most
  contractors call purple board — uses a fiberglass-mat facing instead of paper, and it's
  the right call for any wet area in a Longview home. From the 1960s-70s ranchers filling
  in the Mint Valley side of 98632 to the older post-war blocks off Nichols Boulevard,
  the drywall problems here are consistent: popcorn ceilings that need full skim-coating,
  garage-conversion walls that need 5/8" Type-X firecode board, and bathrooms that need
  proper waterproofing membrane behind tile. TopVolk Construction LLC handles drywall as
  part of full remodel and addition scopes — owner Vladislav Volkov has completed 100+
  projects since 2017 across the Seattle metro and SW Washington.

localContext: |
  The 98632 zip code covers most of Longview's core residential grid — the original
  planned-city blocks near Lake Sacajawea, the post-war bungalows along Washington Way,
  and the 1960s-70s ranch-style homes that fill in south Longview toward Kessler Boulevard.
  A lot of those ranchers got sprayed acoustic (popcorn) texture as a standard ceiling
  finish; they also have single-layer 1/2" drywall that was installed when energy codes
  were loose and vapor barriers were optional. The 98633 zip picks up some of the
  industrial fringe and a stretch of residential streets near the Cowlitz River confluence,
  where crawlspace humidity migrates upward and standard gypsum board gets soft in under
  a decade without a proper vapor barrier behind it. Homes built before 1978 in the
  Columbia Heights area carry a real probability of asbestos in existing joint compound
  and ceiling texture — that needs to be tested and abated before any drywall scope
  starts scraping. The City of Longview Building Division handles all residential permits
  here — not King County DPER, not SDCI — and their plan review for remodel scopes
  with structural or ADU work runs approximately three to six weeks. Factor that timeline
  into any project schedule before demo starts.

commonProblems:
  - title: "Mold-Damaged Drywall in Basements and Bathrooms"
    description: |
      Standard paper-faced 1/2" gypsum board in a Longview basement or bathroom typically
      shows black mold staining within two to three years — the paper facing is essentially
      a food source for mold spores in a climate averaging 47 inches of annual rain. Replacing
      it with USG Sheetrock Mold Tough (purple board) or GP DensArmor Plus eliminates
      that food source entirely because both products use fiberglass-mat facing instead of
      paper. For shower surrounds specifically, the right assembly pairs purple board with
      a Schluter Kerdi waterproofing membrane bonded directly to the board surface before
      large-format porcelain tile goes up — that combination has held up through Seattle
      metro and SW Washington bathrooms without moisture failures. Purple board runs about
      $2.50 to $3.50 per square foot installed versus $1.80 to $2.20 for standard board,
      a modest premium compared to the cost of mold remediation 18 months later. Budget
      an additional $1.50 to $2.00 per square foot if Schluter Kerdi membrane is included
      in a shower scope.

  - title: "Popcorn Ceiling Removal and Level 5 Skim-Coat Finish"
    description: |
      The 1960s and early-1970s ranch homes throughout south Longview and along Kessler
      Boulevard got sprayed acoustic texture as a fast, cheap ceiling finish that hid
      framing irregularities. Scraping it off is only the beginning. Once popcorn is removed,
      the underlying drywall surface is almost never in good enough condition to accept paint
      directly — sidewall lighting, recessed LED cans, or any angled natural light will
      expose the residual roller texture. Level 5 finish means a full skim coat of joint
      compound across the entire ceiling plane, sanded flat, then a thin finish skim — it
      is a distinct trade skill from basic hang-and-tape, and it takes two to three passes
      to get right. Pre-1978 homes require asbestos testing on the existing texture before
      any mechanical scraping starts; Longview Building Division documentation of abatement
      clearance is required before permit final on those projects. A standard 1,500 sq ft
      single-story ceiling scope typically runs four to six days including drying time
      between coats.

  - title: "5/8\" Type-X Firecode Drywall for Garage and ADU Separation Walls"
    description: |
      WA HB 1337 (effective 2024) allows up to two ADUs per single-family lot statewide,
      and Longview has been seeing more garage conversions and detached ADU projects as a
      result. The IRC mandates 5/8" Type-X gypsum board on garage walls and ceilings
      adjacent to living space — that assembly provides the 1-hour fire-resistance rating
      that gives occupants time to exit before a garage fire flashes into the house. Using
      standard 1/2" board to cut material costs creates a code violation that gets flagged
      at rough-in inspection and requires tear-out. The City of Longview Building Division
      plan review for a garage conversion or DADU separation wall typically runs three to
      six weeks; the permit drawings need to specify the full wall assembly, not just
      drywall thickness. TopVolk Construction LLC is a WA Licensed Contractor — permits
      are pulled under our license, the Type-X assembly is documented correctly from the
      start, and you don't get a failed inspection because someone swapped in the wrong
      board to save $80 on materials.

  - title: "Cost Range for Drywall Scopes in Longview Remodels"
    description: |
      Drywall pricing in Longview remodel projects depends on ceiling height, finish level
      required, and whether existing material needs demo and haul-off first. Hanging and
      taping standard 1/2" drywall in a room addition or remodeled space typically runs
      $2.50 to $4.00 per square foot installed, covering material, hanging, taping, and
      a Level 4 finish ready for paint. Level 5 skim coat — the right spec for kitchens
      and baths with recessed lighting or dimmer-compatible LED fixtures on sidewalls —
      adds $1.50 to $2.50 per square foot on top of that. Whole-house remodels where
      patching follows electrical and plumbing rough-in work tend to run $8,000 to $18,000
      for the full drywall and finishing scope, depending on square footage and how many
      MEP penetrations need to be closed. TopVolk works on project-based remodels in the
      $30,000 to $200,000 range; drywall is priced as a line item in a detailed quote
      after on-site measurement — not a vague range.

  - title: "Soundproofing Between Bedrooms and ADU Shared Walls"
    description: |
      Standard 1/2" drywall on 2x4 framing gives you an STC rating of roughly 33 to 35 —
      that's barely above minimum code and thin enough that normal conversation carries
      clearly between rooms. For primary bedrooms sharing a wall with a living area, or
      for AADU separation walls where a tenant keeps different hours than the owner,
      resilient channel (RC-1 profile) decouples the drywall plane from the stud framing
      so vibration doesn't transfer directly through the structure. An alternative with
      less installation complexity is QuietRock 530 — a 5/8" Type-X panel with a
      viscoelastic damping layer bonded inside — which hits STC 52 in a standard stud
      cavity. For Longview ADU conversion projects, QuietRock on the shared wall paired
      with acoustic sealant at all MEP penetrations is the typical spec. That upgrade
      adds roughly $4 to $7 per square foot over standard drywall — meaningful in a
      rental unit where noise complaints directly affect tenancy and lease renewals.

faq:
  - q: "How fast can you get to Longview for a drywall project?"
    a: |
      Longview is roughly two and a half to three hours south of Seattle on I-5, depending
      on traffic through the Tacoma corridor. TopVolk factors travel and mobilization into
      the project estimate upfront — there are no surprise trip charges after the contract
      is signed. For a whole-house remodel or ADU drywall scope, on-site consultation
      typically happens within one to two weeks of initial contact, with mobilization
      scheduled three to six weeks after permit approval from the City of Longview Building
      Division. Call (206) 591-1096 to talk through scope and timing directly with Vladislav
      — no sales staff, no phone tree.

  - q: "What does drywall installation cost per square foot in Longview?"
    a: |
      Standard 1/2" drywall hung, taped, and finished to Level 4 runs $2.50 to $4.00
      per square foot installed in this market, covering material, labor, and a paint-ready
      surface. Level 5 skim coat for kitchens or bathrooms with directional lighting adds
      $1.50 to $2.50 per square foot on top of that. Mold-resistant purple board in
      wet areas costs about $0.50 to $0.80 more per square foot in materials. TopVolk
      provides line-item quotes based on actual field measurements after the on-site visit —
      no vague ranges in the contract. Schedule a free consultation or call (206) 591-1096
      for exact pricing on your specific scope.

  - q: "Does drywall work in Longview require a building permit?"
    a: |
      Standalone drywall replacement in an existing room generally does not require a permit
      in Longview. Drywall work tied to structural changes, garage conversions, ADU
      separation walls, or whole-house remodels does require one, and the City of Longview
      Building Division is the AHJ (authority having jurisdiction) for all residential
      permits within city limits. Plan review for a remodel scope with drywall assembly
      changes typically takes three to six weeks. TopVolk Construction LLC is a WA Licensed
      Contractor and handles permit application and submittal as part of the project — you
      do not have to navigate the Building Division counter on your own.

  - q: "Can you handle asbestos in old popcorn ceilings before drywall work starts?"
    a: |
      Pre-1978 homes in Longview frequently have asbestos-containing material in spray
      texture and joint compound — it was a common additive before EPA restrictions took
      effect. TopVolk coordinates with a licensed Cowlitz County abatement contractor for
      bulk sample testing and removal before any drywall scope starts scraping or demoing
      existing ceilings. That step is built into the project schedule so it does not stall
      the overall timeline unexpectedly. After abatement clearance documentation is issued,
      the skim-coat or new drywall scope proceeds on the planned schedule. Scraping
      asbestos-containing texture without testing first is both an OSHA violation and a
      genuine health risk — it is not a step we skip.

  - q: "What warranty does TopVolk provide on drywall finishing work?"
    a: |
      Drywall finishing defects — seam cracking, corner bead separation, nail pops —
      are covered under the project warranty for one year from completion. Most of those
      issues show up in the first heating season as framing lumber dries and moves slightly;
      when they do, we come back and address them at no additional charge. Every TopVolk
      contract also includes a deadline penalty clause — if the drywall scope runs past
      the agreed completion date due to our scheduling, there are financial penalties
      against us, not just an apology. Material warranties from USG, National Gypsum,
      and PABCO Gypsum are separate and run with the product itself.

  - q: "Do you serve other parts of Cowlitz County beyond Longview?"
    a: |
      Kelso is essentially adjacent to Longview and adds no meaningful mobilization time.
      Castle Rock, Woodland, and Kalama are all within straightforward drive range for
      projects with sufficient scope. TopVolk's primary service area covers King, Snohomish,
      Pierce, and Kitsap counties in the greater Seattle metro, but SW Washington remodels
      in the $30,000-and-up range are worth a direct conversation about scheduling. Call
      (206) 591-1096 or request a free on-site consultation — Vladislav can give you
      a straight answer on whether the project fits the current schedule.