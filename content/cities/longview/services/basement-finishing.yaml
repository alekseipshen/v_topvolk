  - q: "What does basement finishing in Longview cost?"
    a: |
      A straightforward Longview basement finish — framing, vapor barrier,
      DriCore subfloor, mold-resistant drywall, basic electrical, and
      flooring — typically runs $35,000-$55,000 for 800-1,000 square feet.
      Adding a legal egress bedroom pushes that to $45,000-$70,000 depending
      on foundation cut complexity and finish level. Active waterproofing work
      before framing (perimeter drain, sump installation, wall treatment) adds
      $5,000-$12,000 for homes with moisture issues — and lower-elevation lots
      near the Cowlitz River floodplain frequently land in that category.
      Vladislav puts together a line-item quote after the site visit, so you
      have a concrete number to budget against before committing to anything.

  - q: "What permits are required for basement finishing in Longview, WA?"
    a: |
      City of Longview addresses require a building permit through the Longview
      Community Development Department. Electrical and plumbing work triggers
      separate trade permits with their own rough-in inspections before drywall
      hang, then a final inspection at project close. Egress window openings
      typically require a separate foundation permit. Plan review in Longview
      runs 3-5 weeks for residential scope at this scale — unincorporated
      Cowlitz County addresses route to the county building department and
      timelines vary. TopVolk Construction is a WA Licensed Contractor and
      handles permit prep, plan submission, and inspection scheduling as part
      of the project — the homeowner doesn't need to track that paperwork.
      Inspection milestones get written into the project schedule with deadline
      accountability built in.

  - q: "My basement already has a sump pump. Does that change the project scope?"
    a: |
      A working sump pump is a good starting point — it means the previous
      owner recognized the drainage problem. The pump stays in place and gets
      integrated into the finished basement properly. The sump pit gets a
      sealed lid to contain odors and block radon from migrating into living
      space, and the discharge line gets verified to terminate at an approved
      daylight outlet or storm connection rather than just dumping near the
      foundation. Before framing begins, we test float-switch activation and
      pump output — Zoeller M53 and Wayne CDU800 are the most common units in
      Longview homes, both with readily available service parts. Perimeter
      framing goes in 1-2 inches off the foundation wall to preserve the
      drainage plane behind the stud wall, keeping the system functional after
      the space is finished.

  - q: "How long does a basement finishing project take from start to finish?"
    a: |
      Scope drives timeline. A clean finish with no major waterproofing or
      egress work — framing, insulation, drywall, electrical, and flooring
      — typically runs 6-10 weeks from permit approval to blue-tape walkthrough
      and punch list. Add an egress window opening and expect 1-2 weeks more
      for excavation and foundation framing. Significant waterproofing
      remediation has to cure fully before framing begins, adding another 2-3
      weeks. Factoring in Longview's 3-5 week permit review at the front end,
      a realistic start-to-finish timeline for a full basement conversion is
      12-18 weeks. The contract includes financial penalties for missed phase
      milestones — if TopVolk is late, there's a real consequence written into
      the agreement, not just an apology.

  - q: "Do you serve Kelso and other Cowlitz County areas besides Longview?"
    a: |
      Kelso (98626), directly across the Cowlitz River, is the same service
      area — similar 1950s-60s housing stock, and we navigate both Kelso's
      city permit center and Cowlitz County's building department depending on
      the property address. Castle Rock and Woodland are also reachable for
      projects in the $40,000+ range. For Longview and Kelso specifically,
      initial site visits are usually schedulable within one week. Call
      (206) 591-1096 or fill out the contact form on the website — include
      your address so we can confirm jurisdiction before the visit and come
      prepared with the right plan-review forms.