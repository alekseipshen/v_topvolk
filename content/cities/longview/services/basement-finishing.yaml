title: "Longview Basement Finishing — Waterproofing the Columbia Lowlands"

intro: |
  Built in 1923 as one of the first fully planned industrial cities in the
  United States, Longview has a housing stock that reflects its age — blocks
  of 1920s and 1930s craftsman homes near Lake Sacajawea Park, plus a wave
  of post-WWII ranchers and split-levels that filled in through the 1950s and
  60s. A large percentage of those homes have full unfinished basements that
  have spent decades as storage, utility space, and not much else. The
  obstacle isn't always motivation — it's that sitting at the confluence of
  the Cowlitz and Columbia Rivers means the water table here runs genuinely
  high, and finishing a basement without addressing that first is how you get
  mold behind drywall within three years. One project off Oregon Way involved
  a 900-square-foot space with efflorescence on the block walls and a DriCore
  subfloor installation that finally broke the moisture cycle before any
  framing went in. That basement ended up with a legal egress bedroom, a home
  office, and a utility room — real livable square footage where there used
  to be a concrete floor and exposed joists.

localContext: |
  Most basement work in Longview falls under zip code 98632, covering the
  original platted neighborhoods near Lake Sacajawea, the Columbia Heights
  area east of Ocean Beach Highway, and the post-WWII residential blocks
  toward Mint Farm Industrial Park. Adjacent Kelso (98626), just across the
  Cowlitz River, has nearly identical housing patterns — 1950s and 60s
  split-levels where the basement ceiling height lands right at 6'10" to
  7'0", forcing a conversation about duct and plumbing rerouting before
  framing makes any sense. Cowlitz County averages 45-50 inches of rain per
  year, and lower-elevation lots near the river floodplain absorb hydrostatic
  pressure through foundation walls differently than properties on the
  surrounding hills. Homes in the 98632 core built before 1950 typically have
  poured concrete or unreinforced CMU block walls with no original
  waterproofing membrane — the first step on those projects is always a
  moisture assessment, not a flooring selection. Permit work for city
  addresses routes through the Longview Community Development Department;
  unincorporated Cowlitz County properties go to the county building
  department, and the two have different plan-review timelines.

commonProblems:
  - title: "Hydrostatic Pressure Pushing Through CMU Block Walls"
    description: |
      Longview's older homes — particularly the 1920s through 1940s craftsman
      stock near Lake Sacajawea — were built with unreinforced CMU block or
      poured concrete basement walls and zero waterproofing membrane. Decades
      of Cowlitz Valley rainfall saturating the surrounding soil creates
      hydrostatic pressure that eventually works through the mortar joints.
      The telltale signs are efflorescence (white mineral deposits) along the
      block courses, seasonal damp patches, and in lower lots, actual seepage
      after heavy October through December rains. The fix starts with applying
      a crystalline waterproofing compound — Xypex Concentrate or Drylok
      Extreme — to the interior wall face, followed by a perimeter drain
      channel (WaterGuard or similar) cut into the slab edge and routed to a
      sump pit with a Zoeller M53 submersible pump. Materials and labor for
      active-seepage remediation on an 800-1,000 sq ft basement typically run
      $5,000-$10,000 before any finishing work begins.

  - title: "Egress Windows Required for Legal Basement Bedrooms"
    description: |
      Adding a bedroom in a Longview basement means meeting IRC Section R310
      egress requirements: 5.7 square feet of net clear opening, minimum 24
      inches of clear height, and 20 inches of clear width. Original hopper
      windows in 1950s-60s Longview homes don't come close. The process
      involves cutting the foundation wall, installing a properly sized window
      well — typically 36" x 36" minimum, deeper when exterior grade is high
      — and backfilling the well base with 6 inches of drainage gravel. We
      typically spec Milgard or Jeld-Wen egress-rated casement windows and
      use Bilco or Rockwell well covers to keep debris out. On lower-elevation
      lots near the river plain, the well needs an independent drain line to
      prevent pooling during heavy rain events, which adds excavation scope.
      Budget $2,800-$4,800 per opening including the foundation cut, framing,
      and window installation — and expect the permit to treat this as a
      separate foundation scope item in Longview's review process.

  - title: "Vapor Barrier and Mold Remediation Before Any Framing Starts"
    description: |
      Framing stud walls directly against damp concrete in a Cowlitz County
      basement is a predictable failure — mold develops behind the drywall
      within two to three years, often before the homeowner notices. The
      correct sequence is moisture assessment first, remediation second,
      framing third. Any existing mold on block or concrete gets treated with
      Concrobium Mold Control or RMR-86, followed by a HEPA vacuum pass and
      a hold until the inspector signs off on the remediated surface. A 6-mil
      polyethylene vapor barrier goes against the foundation walls — all seams
      overlapped and taped, bottom edge lapped onto the slab — before a single
      stud is set. Mold-resistant drywall (GP DensArmor Plus or USG Sheetrock
      Mold Tough) is standard throughout, not a premium upgrade. The Longview
      Community Development Department requires insulation and moisture-control
      measures to be inspected at rough-in before drywall hang — TopVolk
      Construction, WA Licensed Contractor, coordinates that inspection
      sequence as part of the project schedule so nothing backs up at the
      permit stage.

  - title: "DriCore Subfloor vs. Slab — Getting the Floor Right First"
    description: |
      A cold concrete slab in a Longview basement creates a thermal bridge
      and a condensation risk under any flooring installed directly on top.
      DriCore subfloor panels — 7/16" OSB laminated to a dimple-mat
      polypropylene base — lift the floor surface off the slab by roughly
      3/4 inch, creating a drainage plane that allows residual moisture vapor
      to move laterally rather than accumulating under LVP or carpet. For
      most 800-1,000 sq ft Longview basements with relatively flat slabs, the
      DriCore plus flooring installation runs $3,500-$6,500 installed. Slabs
      with more than 1/4 inch of variation get a self-leveling underlayment
      pass first — Mapei Ultraplan is the go-to product — adding $900-$1,600
      depending on how much material the pour requires. Skipping this step
      and installing floating LVP directly on an uneven slab is how you end
      up with clicking joints and gaps showing up by year two. The extra
      prep work is cheaper than a flooring redo.

  - title: "Low Ceilings and Duct/Plumbing Rerouting in Pre-1950 Homes"
    description: |
      Longview homes built in the 1920s and 1930s weren't designed with
      finished basements in mind. Ceiling height between the slab and the
      floor joists often lands at 6'10" to 7'0" — right at or below the 7'0"
      minimum IRC R305 requires for habitable space. Then you add ductwork.
      Original trunk-and-branch forced-air systems in these homes frequently
      run the main supply trunk across the center of the basement ceiling,
      dropping usable height another 10-14 inches. Rerouting supply duct runs
      to travel between joists rather than below them — and in some cases
      transitioning to a Mitsubishi mini-split to eliminate ductwork in the
      basement entirely — recovers that headroom and makes the space legally
      habitable. Cast-iron drain stacks and original galvanized water supply
      lines sometimes need relocation as well. MEP coordination (mechanical,
      electrical, plumbing) adds $2,500-$6,500 to a basement project in these
      older homes, but it determines whether the finished ceiling clears code
      when inspections happen.

faq:
