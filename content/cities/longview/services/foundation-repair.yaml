title: "Longview Foundation Repair — River Soils, Old Piers, Lasting Fixes"

intro: |
  Robert Long's lumber company built this city in 1923 on land sitting right at the confluence
  of the Cowlitz and Columbia Rivers — prime industrial location, challenging ground for foundations.
  The homes platted around Lake Sacajawea Park and through the West Side district were mostly
  post-and-pier construction on alluvial river soils: fine silt and clay that compact unevenly,
  retain moisture through Cowlitz County's 45-plus inches of annual rain, and shift just enough
  each wet season to slowly tilt a pier block or crack a stem wall. After 80 or 90 years, those
  cedar mudsills are rotting, original concrete piers are out of plumb, and floors in the 1920s
  bungalows have a noticeable slope that no flooring material can hide. TopVolk Construction has
  done foundation work across the region — crawlspace reinforcement with Simpson Strong-Tie post
  hardware, seismic retrofit, epoxy crack injection — on homes ranging from the original
  Long-Bell-era bungalows near the civic center to 1960s ranchers out in Longview Heights.
  WA Licensed Contractor. 100+ projects completed since 2023. Call (206) 591-1096 to schedule
  a free on-site look.

localContext: |
  The 98632 zip code covers virtually all of Longview proper — the historic residential blocks
  radiating from the Lake Sacajawea corridor, the denser postwar streets east toward Beacon Hill,
  and the Longview Heights subdivisions from the 1950s and 1960s. Just across the city line,
  Kelso (98626) shares the same Cowlitz River floodplain geology and the same foundation
  problems. Homes built in the 1920s through 1940s near the park and the original civic center
  grid are post-and-pier construction — Douglas-fir framing, cedar mudsills set on concrete
  piers with no anchor hardware, crawlspaces with little to no vapor barrier. The 1960s ranchers
  in Longview Heights and the south-side streets shifted to concrete slab construction, which
  brings different problems: hairline cracks from seasonal soil compression and inadequate
  perimeter drainage that allows water intrusion into garages and utility rooms. Cowlitz County
  runs wetter than most of the Seattle metro — closer to 44-50 inches per year, with the bulk
  falling October through April. That sustained moisture has been working on wood framing in
  older crawlspaces for decades. Rim joists, floor joists, and mudsills that were borderline
  damp in 1945 are actively deteriorating now.

commonProblems:
  - title: "Rotted Cedar Posts and Unlevel Piers in Pre-1950 Longview Crawlspaces"
    description: |
      Original post-and-pier foundations throughout the Lake Sacajawea neighborhood and the West
      Side district were built with untreated cedar posts set directly on concrete pier blocks —
      no metal hardware, no standoff from the concrete. After 70-plus years of crawlspace humidity,
      cedar posts rot from the base up, often while looking fine from above. The fix involves
      installing new pressure-treated 4x6 posts alongside the failing originals, shimming the
      carrying beam to restore level, and anchoring each post with a Simpson Strong-Tie CB66 or
      ABA66 post base to keep wood off the concrete surface and stop future moisture wicking.
      Where pier blocks themselves have settled or tilted, we either reset them on compacted gravel
      or pour new concrete pad footings. A 6-mil poly vapor barrier goes down over the crawlspace
      floor as part of the same project. Post replacement runs $250-$450 per post depending on
      crawlspace height and access. Full crawlspace reinforcement on a 1,200-square-foot Longview
      bungalow typically falls between $4,000 and $8,000.

  - title: "Concrete Slab Crack Repair and Epoxy Injection in 1960s Ranch-Style Homes"
    description: |
      Hairline cracks in a concrete slab are expected. Cracks wider than 1/8 inch, cracks showing
      vertical displacement between edges, or cracks that have grown since the last time someone
      measured them — those need attention. Longview Heights ranchers from the 1960s sit on slab
      foundations that were poured over marginal gravel base in some cases, and the silty
      Cowlitz-area soils compress unevenly under the slab as moisture cycles in and out each season.
      Structural epoxy injection stops that movement. Low-viscosity Sika Injection-201 epoxy gets
      injected under pressure through ports spaced every 6-8 inches along the crack, bonding the
      slab back into a single monolithic unit. The process doesn't raise the slab — that's a
      separate mudjacking scope — but it stops water intrusion and prevents crack propagation.
      A 10-linear-foot crack repair runs $700-$1,300 depending on crack depth and accessibility.
      Most jobs complete in a single day.

  - title: "Seismic Retrofit — Mudsill Bolting and Cripple Wall Shear Panels"
    description: |
      The Cascadia Subduction Zone runs offshore from northern California to British Columbia.
      Geologists put the probability of a major rupture event in the next 50 years at roughly
      one in three. For Longview homes built before 1975, there is typically no structural
      connection between the wood framing and the concrete foundation — the house just sits on
      it. Seismic retrofit adds that connection: anchor bolts or Simpson Strong-Tie URFP strap
      hardware through the mudsill into the stem wall, plus 15/32-inch structural plywood shear
      panels nailed to the cripple wall framing inside the crawlspace per IRC seismic provisions.
      The City of Longview Building Department requires a permit for this scope — plan on 2-4
      weeks for plan review. TopVolk handles the permit application, coordinates the rough-in
      inspection and final inspection with the city, and provides stamped drawings where required.
      WA Licensed Contractor. A typical seismic retrofit on a 1,400-square-foot Longview home
      runs $4,500-$9,500 depending on foundation perimeter length and cripple wall height.
      Call (206) 591-1096 to get a written line-item quote.

  - title: "Sump Pump Installation and French Drain Systems Near the Cowlitz Floodplain"
    description: |
      Lower-elevation streets in Longview — particularly those east of Industrial Way and in
      the blocks closest to the Cowlitz River — carry a seasonally high water table that makes
      crawlspace flooding a near-annual event. A submersible sump pump (Zoeller M53 or M98 for
      higher-volume situations) handles active water intrusion from the crock. But the pump alone
      doesn't fix the source. Surface drainage redirection is almost always part of the same
      project: ADS corrugated drain pipe buried in crushed gravel, daylighting at least 10 feet
      from the foundation, captures roof runoff and grade-level water before it reaches the stem
      wall. Interior perimeter drain channel feeding the sump crock handles groundwater infiltration
      through the foundation. Combined sump and drainage installation for a typical Longview
      crawlspace runs $5,000-$10,000 depending on linear footage of drain channel and whether the
      surrounding grade needs significant regrading. A City of Longview building permit is required
      for the drainage scope.

  - title: "Full Foundation Evaluation: Knowing Repair from Rebuild Before You Spend"
    description: |
      A home inspection report that says "settlement observed — recommend further evaluation" can
      mean a $3,000 fix or a $60,000 project, and telling the difference requires someone in the
      crawlspace with a laser level, not a phone estimate. Shimming and leveling a few posts runs
      $2,000-$4,500 on most Longview homes. Full perimeter mudsill replacement on a 1920s
      bungalow where the original Douglas-fir sill has rotted back to the anchor points runs
      $15,000-$35,000 depending on access and stem wall condition. Complete foundation replacement
      — shoring the house, demo'ing the existing foundation, and pouring a new continuous concrete
      perimeter — is a $50,000-$90,000+ scope and relatively rare. Most Longview homes need
      targeted post reinforcement, drainage correction, and a seismic upgrade. Getting a contractor
      on-site to actually look before committing to a scope saves homeowners from both under-fixing
      and over-spending. TopVolk provides free on-site evaluations with written, line-item pricing
      after the crawlspace inspection — no vague ballpark ranges and no commissioned closer.
      Deadline commitments are written into every contract with penalty terms if we miss them.

faq:
  - q: "How fast can you get to Longview for a foundation repair estimate?"
    a: |
      Longview sits about 50 miles north of Portland and roughly 110 miles south of Seattle via
