      the drive. Call (206) 591-1096 to check current availability.

  - q: "What does foundation repair typically cost in Longview, WA?"
    a: |
      Scope drives price almost entirely. Post leveling and shimming in a crawlspace: $2,000-$4,500.
      Full seismic retrofit with mudsill anchor bolts and cripple wall shear panels: $4,500-$9,500.
      Sump pump installation with interior perimeter drain: $5,000-$10,000. Epoxy injection on a
      concrete slab crack: $700-$1,300 for a standard 10-foot repair. Mudsill replacement on a
      badly rotted 1920s foundation perimeter: $15,000-$35,000. These are real ranges, not
      low-ball teaser numbers. Actual pricing comes from the on-site inspection — crawlspace height,
      soil drainage, access difficulty, and permit fees all affect the final number. Call
      (206) 591-1096 to schedule a free on-site estimate with written line-item pricing.

  - q: "Does foundation repair in Longview require a building permit from the city?"
    a: |
      It depends on the scope. Shimming a few posts to level a sagging floor — typically no permit
      needed. Replacing mudsills, adding seismic anchor bolts, installing shear wall panels, or
      putting in a sump system with interior drain channel — those require a City of Longview
      Building Department permit. Plan review for residential foundation work usually takes 2-4
      weeks in Longview. TopVolk prepares the permit application, draws the required plan set, and
      coordinates both the rough-in inspection and the final inspection sign-off with the city.
      WA Licensed Contractor. For homes in unincorporated Cowlitz County outside Longview city
      limits, permits go through Cowlitz County Community Development instead.

  - q: "Can you do seismic retrofits on Longview's original post-and-pier homes?"
    a: |
      Yes — and it is one of the more common projects on pre-1950 homes in the Lake Sacajawea
      and West Side neighborhoods. Original post-and-pier construction has no structural connection
      between the house framing and the piers. In a significant seismic event, the structure can
      slide laterally off the piers entirely. The retrofit adds Simpson Strong-Tie URFP tension
      straps or anchor bolts connecting the mudsill to each pier, plus 15/32-inch structural
      plywood nailed at 3-inch edge spacing on the cripple wall per IRC seismic requirements.
      On homes near the Cowlitz River floodplain where piers are set in softer silty soil, we
      sometimes add intermediate concrete pad footings at mid-span bearing points before installing
      the shear panels. City of Longview permit required; rough-in and final inspections included
      in our scope.

  - q: "How long does foundation repair work actually last?"
    a: |
      Epoxy-injected concrete cracks are permanent when done correctly — the bonded joint tests
      stronger than the surrounding concrete. Pressure-treated lumber posts with Simpson post-base
      hardware and a proper vapor barrier should last 40-50 years minimum, assuming drainage is
      also resolved. Zoeller M53 sump pumps typically run 10-15 years before the motor needs
      replacement. ADS French drain systems, properly installed with filtered sock pipe and gravel
      surround, are essentially indefinite if the outlet stays clear of debris. TopVolk warranties
      all labor for 2 years on foundation projects. Simpson structural hardware carries a lifetime
      warranty. The single biggest factor in longevity is water management — fix the drainage
      first and the structural repairs hold. Skip the drainage fix and nothing lasts.

  - q: "Do you cover Kelso and other nearby Cowlitz County cities?"
    a: |
      Yes. Kelso (98626) is 5 minutes up the road and shares the same river-influenced soils
      and older housing stock as Longview — the foundation problems are nearly identical.
      Woodland to the south along I-5, Castle Rock to the north on SR-411, and Kalama in between
      all fall within the project range for work at the $10,000-plus level. Unincorporated
      Cowlitz County areas, including properties along the Cowlitz River valley, are also in scope.
      Scheduling windows are currently 3-5 weeks out for new foundation projects in this area.
