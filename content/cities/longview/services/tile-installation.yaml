  - q: "What does tile installation cost for a bathroom in Longview?"
    a: |
      Bathroom floor tile runs $12–$20 per square foot installed, depending on tile
      format, substrate prep required, and whether a heated floor system is included.
      A full shower retile — demo, waterproofing membrane, cement board, tile, and
      grout — runs $4,500–$8,500 for a standard 36x36 or 36x48 shower. Kitchen
      backsplash installation during a remodel lands at $800–$1,800 depending on
      linear footage and electrical relocation complexity. Large-format porcelain
      (24x48 and up) costs more because substrate prep is more involved. On-site
      estimates from TopVolk include a line-item quote with actual numbers — not
      vague ranges. Call (206) 591-1096 or schedule a free consultation to get
      pricing specific to your home and scope.

  - q: "Do I need a permit for tile work in Longview, WA?"
    a: |
      Straight tile replacement — same footprint, no plumbing changes — typically
      doesn't require a permit from the City of Longview Building Department. Once
      you move a drain, relocate a showerhead, or change the shower footprint, you're
      into plumbing permit territory and will need a rough-in inspection before tile
      goes up. Full bathroom additions or layout changes also trigger building permits.
      TopVolk Construction is a WA Licensed Contractor and handles permit applications
      as part of the project scope — you don't navigate the city portal yourself.
      Getting the inspection sequence right the first time prevents the kind of
      rework that adds weeks to a project timeline.

  - q: "Can you install heated tile floors in a Longview home?"
    a: |
      Schluter Ditra-Heat is the system used on most heated floor installations in
      bathroom remodels — the cables embed into the mat, which also acts as an
      uncoupling membrane protecting tile from wood subfloor movement (critical in
      Longview's older homes). A dedicated 15- or 20-amp circuit with a GFCI-protected
      thermostat is required, so electrical rough-in has to be coordinated before
      the mat goes down. Warmup is a solid alternative with programmable WiFi
      thermostats for homeowners who want remote scheduling. For an 80–120 sq ft
      bathroom floor, material and installation for a heated system runs $1,600–$2,800
      depending on system choice and electrical complexity. Vladislav coordinates
      directly with licensed electrical subs to keep the sequencing tight.

  - q: "How long does tile installation hold up in Cowlitz County's wet climate?"
    a: |
      Tile installed with a continuous waterproofing membrane — Schluter Kerdi sheet
      or RedGard liquid-applied — and quality grout will hold 20–30 years in a
      PNW bathroom with normal maintenance. The failure point is almost never the
      tile itself; it's the waterproofing layer, or the lack of one. Grout in a
      high-use shower should be resealed every 1–2 years. Natural stone needs an
      impregnating sealer on a 12–18 month schedule to stay protected in Longview's
      humidity. Tile installed over greenboard without a membrane — common in 1970s–90s
      bathrooms throughout Cowlitz County — will eventually fail. The only real fix
      at that point is full demo and rebuild. Partial patching over compromised
      waterproofing does not hold.

