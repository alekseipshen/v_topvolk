title: "Longview Tile Installation — Waterproofing Cowlitz County's Oldest Homes"

intro: |
  Long-Bell Lumber Company built Longview from scratch in the early 1920s, and the
  bathrooms in those original homes near Lake Sacajawea (98632) are now over a century
  old — ceramic tile set into mortar beds over wood lath, with no waterproofing membrane
  underneath and no uncoupling layer to handle seasonal subfloor movement. Cowlitz County
  averages close to 50 inches of rain annually, well above Seattle's numbers, and that
  sustained moisture finds every gap in a compromised tile installation. The West Side
  neighborhood and the streets running south through Mint Valley still have dozens of
  these homes, and their shower walls are telling the story — soft spots behind the tile,
  grout that keeps cracking no matter how many times it gets patched, a faint smell that
  won't go away. Vladislav Volkov at TopVolk Construction has walked into that situation
  in similar PNW homes across the region and knows what to look for before demo starts —
  including how far the rot has typically spread by the time a homeowner calls.

localContext: |
  Homes in the 98632 zip — especially around the Lake Sacajawea park grid and the older
  planned-city blocks west of downtown — run Craftsman and Colonial Revival construction
  from the 1920s through 1940s, built on post-and-pier foundations with wood subfloors
  that move a measurable amount seasonally. That movement causes grout cracking and hollow
  spots in tile installations that weren't set on a proper uncoupling membrane or
  self-leveling substrate. Move south into Mint Valley or into the residential streets
  of the 98633 zip, and you're in 1970s–80s tract ranchers where the original bathrooms
  got single-layer greenboard and no waterproofing membrane — standard for that era, but
  a ticking clock in Cowlitz County's rain-heavy climate. Interior tile work involving
  plumbing changes or drain relocation goes through the City of Longview Building
  Department. A rough-in inspection is required before tile covers any plumbing or
  framing — skipping that step and tiling over it first causes real rework if the
  inspector flags it on final.

commonProblems:
  - title: "Rotted Framing Behind Failed Shower Tile in 1920s–1940s Bungalows"
    description: |
      The original shower installations in older homes near Lake Sacajawea used mortar-bed
      construction — heavy and initially durable, but completely reliant on the mortar
      staying crack-free. Once seasonal movement in a post-and-pier foundation cracks
      that bed, water infiltrates behind the tile and into the framing. By the time a
      homeowner notices soft spots underfoot or a musty smell that won't clear, the
      blocking and sometimes the rim joist behind the shower wall are rotted through.
      Full demo is the only real fix — pulling tile, removing compromised framing,
      treating or replacing the affected studs — then rebuilding with Schluter Kerdi
      sheet membrane bonded to cement board, with Kerdi-Band wrapped over every seam
      and corner. Budget $4,500–$7,500 for a full shower retile in a home like this,
      depending on framing damage extent discovered during demo. Patching over a
      failed mortar bed doesn't hold in a climate like Longview's.

  - title: "Hollow Spots and Tenting on Large-Format Porcelain Over Wood Subfloors"
    description: |
      Large-format porcelain — 24x48 or 32x32 panels — looks clean because it
      minimizes grout lines. The installation requirement is a near-perfectly flat
      substrate: within 1/8 inch over 10 feet per ANSI A108 standards. Wood subfloors
      in Mint Valley's 1970s tract ranchers flex enough season-to-season that a standard
      mortar bed won't keep large-format tile flat. Edges tent up, hollow spots form
      underneath, and within a year or two grout starts cracking at the joints. Proper
      installation means floating Laticrete NXT Level self-leveling compound, confirming
      flatness with a laser level before any tile goes down, and using a large-format
      mortar with adequate open time. That prep adds $300–$600 to the job scope. It's
      the difference between a floor that lasts 20 years and one that starts failing
      in three — and in Cowlitz County's humidity, a failed floor tile joint is also
      a water infiltration point.

  - title: "Shower Niche Waterproofing — The Most Common Leak Point Inspectors Miss"
    description: |
      A recessed shower niche looks simple to frame: cut between studs, tile it, done.
      In practice it's one of the most reliable leak sources in any tiled shower. The
      niche opening punches through the waterproofing plane, and if the Schluter Kerdi
      membrane or RedGard liquid application doesn't wrap continuously into the niche —
      floor, back panel, and all four sides — water gets behind the tile on every shower.
      In wood-framed homes across West Side Longview, that moisture has nowhere to go
      except into the stud bay. The niche floor also needs a slight forward slope (minimum
      1/8 inch per foot) so water doesn't pond at the back. City of Longview Building
      Department doesn't require a permit for niche framing alone, but if the shower
      remodel involves any plumbing relocation, that triggers a rough-in inspection —
      which is useful, because an inspector catching a waterproofing gap before tile
      goes up is far cheaper than a callback six months later. TopVolk Construction is
      a WA Licensed Contractor and handles the permit application as part of the project.

  - title: "Schluter Ditra-Heat Installation: Electrical Sequencing and Real Costs"
    description: |
      Electric radiant heat under bathroom tile is a practical upgrade in Longview —
      the heating season runs October through April and cold tile floors are a consistent
      complaint in these older homes. Schluter Ditra-Heat works well in a tile remodel
      because the heating cables embed directly into the mat, and the mat itself acts
      as an uncoupling layer that protects tile from subfloor movement. Full system
      installation — mat, cables, GFCI-protected programmable thermostat, and tile —
      runs roughly $18–$25 per square foot in a standard bathroom. That puts a 100 sq ft
      floor at $1,800–$2,500 installed. A dedicated 15-amp or 20-amp circuit is required,
      so electrical rough-in has to happen before the mat goes down. Sequence is rigid:
      electrical rough-in, City of Longview inspection if required by scope, then mat
      placement and tile. Tiling over the cables before the circuit passes inspection
      means tearing back out. Warmup is another solid option with WiFi thermostat
      integration for homeowners who want scheduling control from a phone.

  - title: "Natural Stone and Marble in High-Humidity Bathrooms — Sealing Requirements"
    description: |
      Marble and travertine absorb moisture in a wet Cowlitz County bathroom — once
      water gets in, the stone pits, stains, or develops white efflorescence on the
      surface. A properly installed marble shower needs an impregnating sealer applied
      before grout goes in, again after, and then on a 12–18 month maintenance cycle.
      Grout selection matters alongside sealing: unsanded grout for joints under 1/8
      inch, epoxy grout for maximum stain resistance in wet zones. For shower floors,
      2x2 marble mosaic tiles are a smarter choice than large-format marble slabs —
      more grout lines means better slip resistance and more expansion joints to
      accommodate subfloor movement. If a full bathroom remodel involving marble pulls
      a permit through the City of Longview Building Department, the inspector checks
      slope-to-drain at rough-in: 1/4 inch per foot minimum toward the drain before
      any tile goes down. That inspection step protects both the homeowner and the
      installation long-term.

