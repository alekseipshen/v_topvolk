title: "Longview Garage Construction — Slabs, ADUs, Rain-Ready"

intro: |
  The streets running east from Lake Sacajawea through Longview's original planned grid — laid out in 1923 by Long-Bell Lumber — are packed with Craftsman bungalows and Colonial Revivals built before the two-car garage became standard. Many of those homes, especially around the Highlands neighborhood and along Kessler Boulevard, sit on 6,000–8,000 sq ft lots in the 98632 zip code with plenty of backyard space for a proper detached build — but most owners have never pulled the permit. Longview averages close to 50 inches of rain per year, and moisture intrusion through a poorly detailed concrete slab or unsealed rim joist adds up fast in Cowlitz County's climate. A Clopay 4-Star insulated garage door handles temperature swings better than a basic builder-grade panel, but none of that matters if the slab and framing underneath are not spec'd correctly from day one. TopVolk Construction LLC has completed 100+ projects across the Seattle metro and southwest Washington since 2023 — owner Vladislav Volkov handles estimates, permits, and sub coordination directly; call (206) 591-1096 for a free on-site consult.

localContext: |
  Longview's residential core divides fairly clearly between the historic districts near downtown — the Highlands area and the blocks around Kessler Boulevard — where homes were built 1920s through 1940s, and the post-war expansion south and west where 1950s through 1970s ranchers line the streets off California Way and Ocean Beach Highway. Neither era was generous with garage square footage. A lot of the older 98632 properties carry a detached single-car structure that is undersized, rotting at the sill plate from decades of ground moisture, and not worth saving. The surrounding unincorporated Cowlitz County parcels — served by Cowlitz County Community Development rather than the City of Longview Building Division — have their own setback rules that sometimes allow more flexibility on accessory structure placement. For new construction within city limits, a 4-inch fiber-reinforced concrete slab with a 3,000 PSI mix and a 6-mil vapor barrier underneath is non-negotiable given the local water table and rainfall. Any garage framing in this climate should use pressure-treated (PT) lumber at all ground-contact points, and the bottom plate on the mudsill needs to be fully isolated from the concrete with a sill gasket — skipping that detail is how you get rot inside of ten years.

commonProblems:
  - title: "Detached Garage with ADU Above — Getting the Structure and Permits Right"
    description: |
      WA HB 1337, passed in 2024, allows up to two ADUs on any single-family lot statewide — including lots in Longview's 98632 zip code. That means a homeowner can legally build a detached garage with a finished living unit above it (a DADU), and in most cases retain the existing attached garage or basement unit as a second ADU. The structural load changes substantially when livable space goes above a garage: LVL beams replace dimensional lumber for the floor system, joist hangers at every connection point, and the rough-in for electrical, plumbing, and mechanical has to be fully designed before framing closes. Getting that plan review approved at the City of Longview Building Division — including the FAR calculation and height limit verification — is where most self-managed projects stall for weeks. TopVolk has handled this permit workflow on multiple garage-over-DADU builds; the conversation starts with a free site visit from Vladislav. Call (206) 591-1096.

  - title: "Matching the New Garage Exterior to a 1920s or 1940s Longview Home"
    description: |
      One of the most consistent complaints after a garage is built by a different contractor is that it looks like it was dropped onto the property from a catalog. On the Craftsman homes near Kessler Boulevard and the Highlands, original siding is often cedar bevel or cedar shingle — materials that weather gray and split under Cowlitz County's persistent rain. A new build can match the profile using Hardie lap siding primed and painted to the same color; Hardie cement board holds paint far better than cedar in this climate and will not rot at the corners after a few wet winters. The roofline pitch needs to match the existing house within a degree or two, and the fascia and soffit detail matters on homes with exposed rafter tails. All of that gets drawn into the permit plans before submittal — so the building inspector and the homeowner are looking at the same drawing from the first plan review cycle.

  - title: "Setback Violations and Lot Coverage Math in Longview's R-1 Zone"
    description: |
      Longview's zoning code in the R-1 single-family zone requires accessory structure setbacks of 5 feet from rear and side property lines — but that number changes on corner lots, lots adjacent to alleys, and structures taller than 15 feet. An ADU-over-garage build pushing 20–24 feet in height triggers additional review at the City of Longview Building Division. Lot coverage limits (typically 40–45% in R-1) become a real constraint on smaller lots when you add the existing house footprint, any outbuildings, and the proposed garage. The permit package requires a site plan drawn to scale showing all existing and proposed structures with dimensions to each property line — that documentation is part of what TopVolk prepares. As a WA Licensed Contractor, Vladislav pulls the permit directly and responds to plan review comments without the homeowner navigating the Building Division counter alone. Getting setbacks right upfront avoids the worst outcome: a stop-work order after framing is already up.

  - title: "What a New Garage Build Actually Costs in the Longview Market"
    description: |
      A permitted, framed, and finished 24x24 two-car detached garage in Longview — standard 8-foot walls, a single 16-foot Clopay 4-Star insulated garage door, OSB sheathing, Hardie lap siding, and a 4-inch fiber-reinforced concrete slab — typically runs $55,000–$75,000 fully permitted, including basic electrical service and an exterior circuit. Adding a 200 sq ft dedicated workshop area with a separate sub-panel runs $8,000–$12,000 more. A DADU-over-garage build with full kitchen rough-in, a bathroom, egress windows, and exterior stairs starts around $120,000 and scales with finish selections. Those ranges reflect Longview's 2025 material and labor market — framing lumber has come down from 2021 peaks but has not returned to pre-pandemic pricing. TopVolk provides a line-item quote after the site visit. No vague ranges, no "call for pricing" — Vladislav walks the lot and hands you an actual number.

  - title: "EV Charger Pre-Wire and Workshop Electrical During Garage Framing"
    description: |
      Roughing in a 50A or 60A dedicated circuit for a Level 2 EV charger during garage framing costs roughly $400–$700 in added wire and breaker capacity. Cutting open a finished drywalled wall to run the same circuit later costs $1,200–$2,000 or more depending on panel distance. The same principle applies to workshop circuits — a 20A/240V line for an air compressor, a 30A line for a welder — plan them during rough-in and they cost almost nothing extra. For insulation, R-15 batts in 2x6 walls and R-38 in the ceiling provide a comfortable workshop environment through Longview's wet winters without significantly inflating the build cost. A LiftMaster 84501 belt-drive opener with battery backup handles the door reliably in power outages; pair it with a rubber bulb weatherstrip seal on a pressure-treated threshold — standard aluminum seals typically fail within 3–4 seasons in Cowlitz County's rain-heavy climate.

faq:
  - q: "How fast can you get to Longview for Garage Construction?"
    a: |
      Longview sits about 90 miles south of Seattle via I-5 — roughly a 90-minute drive from TopVolk's base in the Seattle metro, depending on traffic through Chehalis and Centralia. Scheduling a free on-site consultation with Vladislav typically takes 3–7 days from first contact. Permit submittal to the City of Longview Building Division runs 3–6 weeks for a standard detached garage, and longer for projects with an ADU component requiring full residential plan review. Construction follows permit issuance. Call (206) 591-1096 to get on the schedule and discuss scope before committing to anything.

  - q: "What does a new garage build cost in Longview?"
    a: |
      A fully permitted 24x24 two-car detached garage in Longview typically runs $55,000–$75,000 depending on door grade, siding choice, and electrical scope. A DADU-over-garage build with a finished living unit above starts around $120,000 and can reach $180,000 or more with full kitchen and bath finish. Lot slope, soil conditions, and whether a full perimeter concrete foundation is required all affect the final number. Vladislav walks the property and delivers a detailed line-item estimate — not a ballpark pulled from a pricing sheet. Call (206) 591-1096 or reach out online to schedule a free site visit.

  - q: "What permits does a new garage in Longview require?"
    a: |
      Any new detached garage in Longview requires a building permit from the City of Longview Building Division, covering structural, electrical, and mechanical scope. The submittal package needs a to-scale site plan showing all setbacks, a foundation plan, and framing drawings that comply with the IRC as adopted by Washington State. Projects that include a DADU above the garage trigger a full residential unit review, which adds time to the plan review cycle. Permit fees are based on project valuation — typically $1,500–$3,500 for a standard garage build. As a WA Licensed Contractor, TopVolk handles the full permit submittal, responds to plan review comments, and coordinates all required inspections including rough-in and final inspection.

  - q: "Can you pre-wire an EV charger during garage construction?"
    a: |
      Yes — and it is far cheaper to do during framing than after finish work is complete. A 50A or 60A dedicated circuit for a Level 2 EV charger roughed in during construction adds roughly $400–$700 to the electrical scope. That same circuit can terminate at a 240V outlet for a plug-in charger or be left in conduit for a future hardwired unit. If a LiftMaster or Chamberlain smart opener is on the plan, the electrical layout accounts for that circuit placement from day one. All electrical rough-in is coordinated with a WA-licensed electrician and goes through the City of Longview Building Division inspection — not bypassed, not self-certified.

  - q: "How long does garage construction take in Longview?"
    a: |
      A standard 24x24 detached garage — permit in hand, slab poured and cured, framed, and finished — takes 4–6 weeks of active construction. Factor in 3–6 weeks upfront for permit review at the City of Longview Building Division, and the full timeline from first site visit to move-in runs roughly 2–4 months for a straightforward build. A DADU-over-garage project runs 4–6 months end-to-end, including permits, framing, MEP coordination, inspections, and finish work. Vladislav coordinates all subs directly, and the deadline penalty clause written into every TopVolk contract means missed milestones have a real financial cost — not just a verbal reassurance.

  - q: "Do you serve other Cowlitz County areas besides Longview?"
    a: |
      Cowlitz County work includes Kelso, Castle Rock, and Woodland, plus the broader Seattle metro across King, Snohomish, Pierce, and Kitsap counties. Properties inside Longview city limits fall under the City of Longview Building Division; unincorporated Cowlitz County parcels go through Cowlitz County Community Development — different submittal requirements, same general permit process logic. Scheduling in the Longview area typically runs 2–4 weeks from initial consultation to permit submittal, depending on project scope and plan complexity. Call (206) 591-1096 — Vladislav answers directly, not a receptionist or a call-routing service.