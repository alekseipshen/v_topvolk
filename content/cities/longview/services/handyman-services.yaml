title: "Longview Handyman Services — Old-City Repairs Done Right in 98632"

intro: |
  Longview was built all at once starting in 1923, when Long-Bell Lumber Company
  laid out a planned city on a grid along the Cowlitz River. That means a significant
  portion of the housing stock near Lake Sacajawea and through the Highlands
  neighborhood dates to the same compressed era — and a century of Pacific Northwest
  rain has had time to work on every door frame, deck board, and window seal. Older
  homes in this city rarely need a full remodel. They need a punch list knocked out:
  a Moen faucet swap in the hall bath, two drywall patches where a TV mount came down
  wrong, new weatherstripping on a back door that's been drafty since 2019, a toilet
  flapper replacement that should have happened six months ago. Those jobs don't justify
  hiring a plumber or a drywall crew for a single day. TopVolk Construction handles
  exactly this type of work — owner-operated by Vladislav Volkov, WA Licensed
  Contractor, with 100+ projects completed since 2023 across the region.

localContext: |
  The handyman calls in 98632 split pretty clearly between two housing eras. Closest
  to downtown and Lake Sacajawea, the 1920s–1940s homes are solidly built but show a
  century of deferred maintenance — plaster walls that have been patched with
  mismatched drywall mud, wood sill plates that have softened from years of
  condensation, and door frames that have racked enough to need a strike plate
  adjustment just to latch. Out west toward Mint Valley and into the newer
  subdivisions near Three Rivers Mall, the housing stock is mostly 1970s–1990s
  builder-grade — functional but aging into its first round of fixture replacements
  and exterior repairs. Longview sits in the lower Cowlitz River valley and pulls in
  roughly 45 inches of rain annually, more than Seattle sees most years. That moisture
  accelerates rot at deck ledger boards, bubbles drywall tape near window corners, and
  destroys weatherstripping on any exterior door that faces north or west. Work in
  nearby 98626 (Kelso) follows the same pattern — similar housing ages, same climate
  exposure, same deferred-maintenance backlog.

commonProblems:
  - title: "Unfinished Punch Lists After Kitchen and Bath Remodels"
    description: |
      A contractor finishes the big work — cabinets, tile, plumbing rough-in — and
      disappears before the detail pass. What's left is a blue tape walkthrough's
      worth of items: cabinet door hinges that won't close flush, a missing toilet
      paper holder, caulk gaps at the tub surround, and a bathroom exhaust fan that
      was never connected to the duct. These jobs are too small for a GC to schedule
      back out, and too specific for a homeowner to do cleanly in a weekend. In a
      1930s Highlands bungalow, texture matching on a drywall patch is particularly
      tricky — the original finish is often skip-trowel or orange peel applied over
      plaster, and matching it with standard joint compound requires feathering out at
      least 18 inches. TopVolk schedules a dedicated punch list day, works through the
      list item by item, and does a second walkthrough before closing out. Most punch
      list visits run $400–$850 depending on item count and complexity.

  - title: "Weatherstripping Failure on Exterior Doors and Aluminum Windows"
    description: |
      Longview's rain season runs October through May, and it doesn't ease up. Exterior
      doors on north-facing and west-facing walls take the worst of it — the compression
      weatherstripping along the door stop flattens out over five to eight years, and
      the door sweep underneath gets torn by threshold contact before that. A drafty
      back door in a 98632 home isn't just uncomfortable; it inflates the heating bill
      every single month through winter. The fix is straightforward: worn peel-and-stick
      foam strips come out, Schlegel Q-Lon bulb seal goes in along the door stop, and
      the sweep gets replaced with an automatic drop-down model that lifts when the door
      opens. Window weatherstripping on older aluminum single-pane frames in Columbia
      Heights often needs foam backer rod seated in the channel before the new V-seal
      strip can compress correctly. Most door weatherstripping jobs run one to two hours
      and cost $120–$250 including materials.

  - title: "Fixture Replacement Without a Full Plumbing or Electrical Call"
    description: |
      A running toilet wastes roughly 200 gallons per day. A dripping faucet under a
      vanity cabinet often goes unnoticed until the cabinet floor starts showing water
      damage. Neither situation justifies calling a plumber for a half-day minimum
      service call. The catch in older Mint Valley homes is that supply valve shutoffs
      from the 1960s and 1970s are often so corroded they won't close fully — which
      turns a simple Kohler toilet fill valve swap into a supply line replacement as
      well. TopVolk handles fixture replacement as a standalone service: Moen or Kohler
      faucets, standard toilet fill valve and flapper kits, and vanity light fixture
      swaps where an existing junction box is already rated and in place. A single
      fixture replacement typically runs one to three hours; a bathroom fixture refresh
      covering faucet, toilet hardware, and a towel bar set usually lands in the
      $350–$600 range including parts at standard grade. As a WA Licensed Contractor,
      the scope stays within handyman work — anything requiring new rough-in gets
      flagged and referred appropriately.

  - title: "Deck Board Replacement and Railing Post Repair"
    description: |
      Decks built in Longview through the 1980s and 1990s used pressure-treated (PT)
      lumber that met the standards of that era — but wood from before the 2004 ACQ
      treatment switch is getting soft, especially at ground contact and ledger board
      connections. Individual rotted boards don't mean a full deck rebuild. Boards can
      be pulled and replaced one at a time with current ACQ or CA-B pressure-treated
      lumber, as long as the joists and ledger board underneath are still structurally
      sound. The ledger board connection to the house rim joist is where hidden rot
      usually lives — water infiltrates behind the ledger flashing, soaks the rim joist,
      and the decay can be six inches deep before the surface shows it. Railing post
      failures are the other common call: a loose post on an older PT deck usually means
      the Simpson Strong-Tie post base bracket has rusted through, or the post has
      rotted at the footing. Deck board replacement runs roughly $12–$18 per linear
      foot in materials; a full railing post replacement with new hardware runs
      $150–$300 per post depending on deck height and access.

  - title: "Smart Home Device Installation and Transformer Upgrades"
    description: |
      Ring Video Doorbell Pro 2, Google Nest thermostats, Lutron Caseta dimmer
      switches — these devices show up in Longview homes regularly, and they get
      installed wrong nearly as often. The Ring Pro 2 requires a 16–24V AC
      transformer; older homes in 98632 frequently have an original 10V or 12V
      doorbell transformer that causes the device to cycle and reboot constantly.
      Lutron Caseta dimmers require a neutral wire at the switch box, which pre-1990
      wiring sometimes skips entirely. These are not complicated fixes if you
      understand rough-in electrical basics — but they're genuinely frustrating if
      you don't. TopVolk handles smart device installation, transformer swaps, and
      dimmer-compatible LED conversions as part of a standard handyman visit. A Nest
      thermostat install with wiring verification runs about 90 minutes. Bundling a
      doorbell camera install, thermostat swap, and two dimmer conversions into one
      visit typically lands in the $300–$500 labor range — well below what an
      electrician would charge for the same scope.

faq:
  - q: "How fast can you get to Longview for handyman work?"
    a: |
      Longview is roughly 2 to 2.5 hours south of the Seattle area via I-5, so
      TopVolk schedules Cowlitz County work on dedicated travel days — typically
      Tuesday through Thursday — to make the drive worth it for both sides. For most
      punch list visits and small repair scopes, the estimate happens over a phone
