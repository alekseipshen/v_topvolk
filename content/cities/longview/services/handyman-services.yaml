      contact. Call (206) 591-1096 to go over your list and confirm availability
      before committing to a visit date.

  - q: "What does handyman work typically cost in Longview?"
    a: |
      Most handyman tasks in Longview are priced by the job rather than straight
      hourly. A punch list visit covering six to eight items — caulking, hardware
      install, a drywall patch, weatherstripping, a fixture swap — typically runs
      $450–$900 depending on complexity and parts. Individual fixture replacements
      (Moen faucet, Kohler toilet hardware, vanity light) run $150–$350 per fixture
      including standard-grade parts. Deck board replacement starts around $12 per
      linear foot in materials plus labor. Every job gets a written, line-item quote
      before any work starts — no vague ranges, no surprise invoices. Call
      (206) 591-1096 or schedule a free on-site consultation to get exact numbers.

  - q: "Do handyman tasks in Longview require permits from the city?"
    a: |
      Most standard handyman work — fixture replacement, weatherstripping,
      smart device installation, drywall patching, individual deck board swaps —
      falls below the City of Longview Building Division's permit thresholds. The
      main exception is structural deck repair: if the ledger board needs replacement
      or more than 50% of the decking surface is being replaced, Longview may
      classify it as a repair requiring a building permit. TopVolk reviews the project
      scope before scheduling and flags anything that crosses that line. As a WA
      Licensed Contractor, the permit application process for flagged items is handled
      directly — homeowners don't need to navigate the city portal themselves.

  - q: "Can you match the existing drywall texture in my older Longview home?"
    a: |
      Texture matching is one of the most underestimated parts of drywall repair.
      In the 1920s–1940s craftsman and colonial revival homes near Lake Sacajawea,
      original plaster walls were often skim-coated and repainted through multiple
      decades, creating a finish that looks flat but has real depth and variation.
      Patching into that surface with standard joint compound and a basic spray
      texture rarely looks right from across the room. The correct approach is
      feathering the joint compound out 18–24 inches from the patch edge, applying
      a light skim coat, letting it dry fully, and then matching the surrounding
      texture — skip-trowel, knockdown, or orange peel — with test passes on a
      low-visibility wall section first. TopVolk does that test patch before touching
      the primary repair area.

  - q: "What does TopVolk's workmanship warranty cover?"
    a: |
      All handyman work is warranted for one year from the completion date. That
      covers installation quality: if a faucet supply line connection drips from the
      fitting work, or a deck board pops a fastener due to an improper nailing
      pattern, it gets corrected at no charge. Material warranties are separate —
      Moen carries a lifetime limited warranty on the valve cartridge, Kohler covers
      toilet parts for one year, and smart devices carry their manufacturer warranty.
      The three-year workmanship warranty doesn't cover normal wear, damage from
      subsequent trades, or issues caused by pre-existing conditions. Any pre-existing
      problems TopVolk identifies during the visit are documented in writing before
      work starts, so there's no dispute later about what was already there.

  - q: "Does TopVolk cover Kelso and other towns near Longview?"
    a: |
      Kelso (98626) gets covered on the same scheduled visit days as Longview —
