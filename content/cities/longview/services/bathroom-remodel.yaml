title: "Longview Bathroom Remodel — Cowlitz County Moisture and Tile"

intro: |
  Cowlitz County gets over 50 inches of rain per year. More than most of Western Washington. The original 1920s homes near Lake Sacajawea show it first in the bathroom.

  Longview was platted in 1923 as a planned industrial city. Bathrooms in Oak Park and along Olympia Way often haven't seen real work since the 1950s. Cast-iron drain stacks corroding inside. Galvanized supply lines narrowed to half their original bore. Tile set directly over greenboard with no waterproofing membrane behind it — that's what we find when we open walls in 98632.

  Vladislav Volkov has completed 100+ remodels across King, Pierce, and Snohomish counties since 2017. The damage patterns in Longview's Craftsman-era housing stock repeat: failed caulk lines, missing vapor barriers, exhaust that vents nowhere. Call (206) 591-1096 to schedule a free walk-through with Vladislav directly — no salesperson involved.

localContext: |
  The 98632 zip covers the original planned-city core. Oak Park. The streets around Lake Sacajawea. Blocks built for Long-Bell Lumber workers in the 1920s through 1940s. These Craftsman bungalows have 5-foot bathroom footprints, original cast-iron tubs, galvanized supply runs, and zero mechanical exhaust.

  The 98633 zip picks up the Highlands and newer subdivisions from the 1970s through 1990s. Builder-grade fixtures. Subway tile set with organic mastic adhesive. Underpowered 50-CFM fans. The damage accumulates slower — grout goes dark first, then the subfloor turns soft.

  City of Longview Building Services handles permits inside city limits — not Seattle SDCI. Plan review for a bathroom with plumbing work runs 3–6 weeks. Vladislav files applications as part of every project. Homeowners don't manage that paperwork separately.

commonProblems:
  - title: "Corroded Galvanized Supply Lines in 1920s Homes"
    description: |
      The blocks around Lake Sacajawea were built when galvanized steel supply lines were standard. Galvanized corrodes from the inside out. The bore narrows, pressure drops, fixtures run slow or discolored.

      When we open walls on these 98632 bathrooms, the galvanized is often scaled to half its original interior diameter. Rerouting to copper or PEX requires opening walls and sometimes the subfloor. TopVolk coordinates the rough-in, schedules the City of Longview rough-in inspection, and replaces any affected blocking or rim joist before drywall closes.

      Budget $4,000–$8,000 for full supply and drain rerouting in a standard 1920s bathroom.

  - title: "Waterproofing Failures — Mastic Over Greenboard Behind Tile"
    description: |
      A large share of Cowlitz County's 1970s and 1980s bathrooms were tiled with organic mastic over moisture-resistant drywall — greenboard. Greenboard resists splashing. It is not waterproof.

      Water works through every grout joint. Over time the mastic loses bond, tiles loosen, and the substrate turns soft. The correct fix is full demolition to studs, then Schluter Kerdi membrane or RedGard liquid waterproofing over cement board, then fresh tile with polymer-modified thin-set.

      Retiling over a compromised substrate delays the same failure by a few years. Expect 10–14 days for a full shower surround rebuild.

  - title: "Inadequate Exhaust — Mold Returns After Every Recaulk"
    description: |
      The Columbia River bottomland keeps ambient moisture elevated all year. Many original 98632 homes were designed for window-only bathroom ventilation. That worked in 1925.

      It doesn't work now. Modern showers saturate ceiling drywall and rust out junction boxes inside light fixtures. Adding an 80–110 CFM exhaust fan requires new electrical to the housing and an exterior wall penetration. TopVolk handles MEP coordination — no split trade packages where you're managing a separate electrician.

      A ventilation upgrade in Northside or Oak Park typically adds $800–$1,500 to a project. It breaks the mold-recaulk-repaint cycle for good.

  - title: "Walk-In Shower Conversion — Drain Relocation and Structural Prep"
    description: |
      Converting a 60-inch tub-and-shower combo to a walk-in is the most-requested layout change in Longview, especially in the Highlands off 98633.

      The drain relocates to a centered or linear position. A concrete mud bed slopes at 1/4-inch per foot. The entire floor field plus 6 inches up every wall gets Schluter Kerdi waterproofing. Curbless entry for ADA accessibility requires the subfloor to drop — that usually means sistering a floor joist or modifying the rim joist.

      Full walk-in shower conversion: $8,000–$15,000 depending on tile selection, frameless glass hardware, and subfloor work.

  - title: "Outdated Fixtures in 1980s–90s Tract Homes"
    description: |
      The subdivisions on Longview's eastern edge were mostly built 1978 through 1995. Builder-grade vanities, cultured marble surrounds, single-handle faucets. Cultured marble cracks at the drain collar and chips at the edge — it can't be cleanly repaired, only replaced.

      A typical update means a 36- or 48-inch semi-custom vanity with dovetail boxes, a Moen or Kohler faucet in the $150–$350 range, an undermount sink, and tile or one-piece acrylic panels for the shower. American Standard toilets fit standard 12-inch rough-in without modification.

      Fixture-and-vanity update in a 1980s tract bathroom: $5,000–$10,000 depending on tile scope.

