  - q: "What does a bathroom remodel cost in Longview, WA?"
    a: |
      Scope drives price more than location. A fixture-and-vanity update in a 1980s Highlands home runs $5,000–$10,000. A full gut remodel with new plumbing rough-in, Schluter waterproofing, large-format porcelain, and frameless shower glass runs $18,000–$35,000 for a standard master bath. Rerouting galvanized supply lines or relocating a cast-iron drain stack adds $4,000–$8,000.

      TopVolk writes fixed-price contracts with line items and penalty provisions for milestones we miss. Call (206) 591-1096 for an exact number based on your actual bathroom.

  - q: "What permits does a bathroom remodel need in Longview?"
    a: |
      City of Longview Building Services handles permits inside city limits. A purely cosmetic update — tile swap, vanity replacement, no plumbing moves — typically doesn't require a permit. Confirm with the city for your specific scope.

      Any drain relocation, new exhaust fan circuit, or shower footprint change needs a building permit plus a separate plumbing permit and sometimes an electrical permit. Plan review runs 3–6 weeks. Vladislav files all applications as a WA Licensed Contractor and pulls permits under his own license.

  - q: "Do you handle ADA accessibility retrofits — curbless showers, grab bars?"
    a: |
      Yes. Curbless shower conversion requires structural prep at the subfloor to recess the drain assembly — not just a tile swap. Grab bar blocking — 2x8 or 2x10 backing behind cement board — goes in during rough-in, before the walls close.

      Kohler and Moen both make ADA-compliant grab bar systems with residential aesthetics rather than institutional hardware. Blocking, curbless drain, waterproofing, and finish work for an accessibility remodel in Longview runs $10,000–$20,000. Call (206) 591-1096 to discuss what your layout can structurally handle.

  - q: "How long does a bathroom remodel take from signed contract to finished?"
    a: |
      Permit review takes the longest. City of Longview plan review runs 3–6 weeks after submission — that window happens before construction starts. Once permits are in hand, a standard master bath gut remodel with tile, new plumbing rough-in, and electrical runs 3–5 weeks in the field. A smaller hall bath with no structural work takes 2–3 weeks.

      Plan for roughly 2–3 months total from contract signing to move-back-in. TopVolk writes a project schedule into every contract with penalty provisions for milestones missed on our end.

