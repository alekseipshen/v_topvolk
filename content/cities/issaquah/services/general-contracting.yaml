title: "Issaquah General Contracting — Permits, Trades, Done Right"

intro: |
  The split-levels and ranchers near Gilman Boulevard in zip 98027 date to the 1960s and 70s.

  Open a wall in one of those homes and you find galvanized supply lines, a 100-amp panel that hasn't seen an electrician in 40 years, and post-and-pier footings that shift every wet season. General contracting in that inventory means budgeting for what you cannot see until demo day. Up in Issaquah Highlands (98029), the 2000s-era houses present a different problem: homeowners want Wolf ranges and Sub-Zero columns, which means gas line rerouting and structural framing before a single cabinet gets installed.

  Vladislav Volkov has run both types of general contracting projects in Issaquah since 2017 — 100+ projects completed across King County.

localContext: |
  Most of 98029 was built between 1999 and 2015 — energy-code compliant, but running on original builder-grade finishes that are finally being replaced. The general contractor scope in these newer Highlands homes typically runs $80K–$180K once you account for MEP coordination, plan review, and finish selections.

  Older inventory along Front Street and the hillside streets in 98027 is a different calculation entirely. Post-and-pier foundations, sister joists added by previous owners without permits, undersized LVL beam spans in load-bearing walls — structural surprises are the rule, not the exception.

  Both zones permit through the City of Issaquah Development Services. Not King County DPER. That single fact changes your timeline and inspection sequencing compared to unincorporated King County projects.

commonProblems:
  - title: "MEP Trade Coordination on Issaquah Highlands Kitchen Gut-Outs"
    description: "A full kitchen remodel in a 2005 Highlands home means framing, panel upgrade, gas line rerouting, plumbing rough-in, and HVAC duct modification — all sequenced before cabinet installation begins. One missed rough-in inspection at City of Issaquah delays your Wolf range install by two to four weeks. General contracting on high-end appliance kitchens requires a locked MEP schedule before demo day, not after. Getting that in writing is non-negotiable."
  - title: "Structural Surprises in Downtown Issaquah's Older Homes"
    description: "Demo in a 1960s home near Gilman Village or the hillside streets off Newport Way routinely surfaces undersized LVL beams, unpermitted sister joists, and galvanized drain lines ready to fail. Each discovery adds scope. Change orders happen — the question is whether your general contractor defines the change-order process in the contract before demolition starts, not after the wall is open. On pre-1980 Issaquah homes, budget a 15–20% contingency."
  - title: "HOA Approval Stacked on Top of City Plan Review"
    description: "Issaquah Highlands HOA requires architectural committee sign-off on exterior changes — additions, DADU structures, roofline modifications — before the City of Issaquah Development Services will open a permit application. Skip that step and you restart from zero, losing six to eight weeks. Projects permitted under WA HB 1337 still trigger both review tracks. Your general contractor needs to know this sequence before the first drawing goes out."

faq:
  - q: "How fast can you get to Issaquah for a consultation?"
    a: "Vladislav drives out from the Eastside directly — Issaquah Highlands or downtown, 98027 or 98029. Bellevue to Issaquah via I-90 is about 20 minutes. WA Licensed Contractor, 100+ projects completed since 2017, owner on every job. Call (206) 591-1096 to book a site visit with the person who will actually run your general contracting project."
  - q: "Do you handle kitchen projects involving Wolf, Sub-Zero, or Thermador appliances?"
    a: "Yes. High-end appliance installs in Issaquah Highlands kitchens almost always require structural modifications, new gas lines, or upgraded electrical circuits. Wolf and Thermador ranges need properly sized CFM range hood venting. Sub-Zero column units require custom cabinet framing — not a standard rough-in. These are full general contractor scopes with plan review and permits included, not simple appliance swap-outs. Deadline penalties are written into the contract."
  - q: "How long does a full kitchen remodel take in Issaquah, permits included?"
    a: "City of Issaquah plan review runs four to eight weeks for structural work. Rough-in inspections add two to three weeks on top of that. On-site construction typically runs six to ten weeks after permit approval. Total end-to-end: four to six months is realistic for a full gut-out. Call (206) 591-1096 — Vladislav reviews your specific scope and puts a written schedule in front of you at the site visit, not over email."