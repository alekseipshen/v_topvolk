  - q: "Do Issaquah Highlands HOA rules complicate door replacement?"
    a: |
      They add time, but they're manageable with the right prep. The Issaquah Highlands Community
      Association requires an Architectural Review Committee submittal for exterior door changes —
      color, style, glass configuration. Approval typically takes 2–4 weeks. Separately, the City
      of Issaquah Building Division requires a permit for any opening modifications; like-for-like
      replacements under the IRC are generally exempt, but framing changes trigger plan review,
      adding another 2–4 weeks. TopVolk is a WA Licensed Contractor and prepares both the ARC
