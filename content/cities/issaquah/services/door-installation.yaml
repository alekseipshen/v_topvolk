      need to navigate either process solo — it's built into how the project is managed, not
      billed as an add-on.

  - q: "Can you install smart locks and keypad deadbolts during a door replacement?"
    a: |
      Yes, and it's cleaner to integrate during a new door install than to retrofit afterward.
      Most modern entry doors in Issaquah are pre-bored for a standard 2-1/8" deadbolt, which
      means August Wi-Fi Smart Lock, Schlage Encode Plus, or Yale Assure 2 drops straight in
      with no drilling. Older doors with non-standard lever prep need a new bore and a reinforced
      strike plate — roughly a half-day add-on. For full door replacements, TopVolk can rough-in
      a low-voltage line behind the door frame for smart locks that support hardwired power. Both
      Schlage Encode Plus and the August lineup handle HomeKit and Z-Wave integration, which
      pairs well with the smart home systems common in Issaquah Highlands. Hardware runs
      $200–$450 depending on brand; installation adds $150–$300.

  - q: "How long do new entry doors last in Issaquah's climate?"
    a: |
      A quality fiberglass entry door — Therma-Tru Fiber-Classic, Pella 310 Series, or Marvin
      Elevate — holds up 30–40 years in Issaquah's climate with basic maintenance. The Cougar
      Mountain foothills push annual precipitation well past 40 inches, so finish condition
      matters: fiberglass doors need exterior-grade paint or stain refreshed every 5–7 years,
      and the bottom sweep seal should be inspected each fall before the rainy season. Solid wood
      doors can match that lifespan but demand more attention — refinishing every 2–3 years and
      monitoring the bottom rail each spring for moisture absorption. Therma-Tru and Pella offer
      10-year limited warranties on fiberglass slabs; glass seal coverage runs 20 years on most
      Marvin units. TopVolk's installation labor carries a three-year workmanship warranty, and
      Vladislav handles callbacks directly.

