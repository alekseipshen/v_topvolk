title: "Issaquah Door Installation — Built for Cougar Mountain Rain"

intro: |
  The Issaquah Alps squeeze extra precipitation out of Pacific storm systems that have already soaked
  the lowlands — Cougar Mountain and the surrounding foothills commonly see 45–50 inches of rain
  annually, measurably more than Seattle proper. Homes in 98027 around downtown and Gilman Village
  have been absorbing that rainfall since the 1970s and 1980s, and original wood entry doors from
  that era now show rot at the bottom rail, frames that swell shut every October, and threshold
  flashings that simply don't exist. Up in Issaquah Highlands (98029), the problem shifts: Marvin
  and Pella units installed during the 2000s-era build-out are aging past their compression bulb
  seals and multi-point locking hardware is beginning to bind. A door replacement sounds
  straightforward, but done wrong — no pan flashing at the sill, no membrane over the king stud —
  water gets into the rough opening and you're facing structural repair before the new door ever
  goes in. TopVolk Construction has handled door work across Issaquah since 2023, 100+ projects
  completed. Vladislav walks every opening himself before a quote goes out.

localContext: |
  The two zip codes split Issaquah fairly cleanly by construction era. In 98027 — the older downtown
  core and neighborhoods climbing toward Squak Mountain — you're mostly working with 1970s through
  1990s tract construction: hollow-core interior doors, builder-grade exterior slabs with no
  insulated foam core, and aluminum threshold systems corroded flat after three decades of wet
  winters. The original rough openings on these homes rarely include proper head flashing, so
  replacement work almost always means pulling the casing back to install a self-adhering membrane
  over the king stud before the new unit sets. Over in 98029 — Issaquah Highlands, Grand Ridge,
  Talus — HOA covenants under the Issaquah Highlands Community Association govern door color,
  hardware finish, and sometimes glass panel configuration. Planned communities built post-2000
  already carry better rough opening details under Washington energy code, but homeowners upgrading
  to larger multi-slide patio systems frequently need a structural header check — and often an LVL
  beam replacement — before the new opening can be correctly sized.

commonProblems:
  - title: "Rotted Bottom Rails on 1970s–1990s Wood Entry Doors in Downtown Issaquah"
    description: |
      The bottom rail of a solid wood entry door is the first component to fail in Issaquah's wet
      winters. Water pools at the threshold, wicks into the end grain, and by the time you notice
      soft spots under the paint, the stile is already compromised two inches up. On older homes
      in 98027, these doors also lack a sill pan flashing — meaning the rough opening framing,
      including king studs and jack studs, often shows moisture staining once the unit is pulled.
      A fiberglass entry door — Therma-Tru's Fiber-Classic Series or a Pella 310 Series — handles
      standing water at the sill far better: the skin doesn't absorb moisture, and the polyurethane
      foam core delivers around R-5 thermal performance. Replacing a single entry door including
      new head flashing, sill pan membrane, and painted casing typically runs $2,800–$4,500
      installed, depending on door size and whether the rough opening framing needs repair before
      the new unit seats.

  - title: "Sliding Patio Door Upgrades — From Builder-Grade Aluminum to Multi-Slide or French Door Systems"
    description: |
      The 8-foot aluminum-frame sliding door standard in 1990s Issaquah homes — single-pane glass,
      worn vinyl pile weatherstrip, a latch that barely catches — is both a thermal liability and
      a functional limitation. Upgrading to a Marvin Elevate multi-slide or a Pella Architect
      Series French door changes how the space operates and eliminates the cold-wall effect on
      January mornings near Cougar Mountain. The structural detail most contractors skip: a wider
      opening requires a properly sized LVL beam header — typically 3.5"×11.25" for a 10–12 foot
      span — with solid bearing at each king stud. Skip it and the wall racks over time. Marvin
      4-panel multi-slide material costs run $6,000–$10,000; total installed cost in Issaquah
      including structural header work typically lands $12,000–$18,000 depending on span width
      and whether a new exterior sill pan and casing are included in scope.

  - title: "HOA Approval and City of Issaquah Permits — What the Process Actually Looks Like"
    description: |
      Door replacement in Issaquah Highlands involves two separate approval tracks before
      installation starts. The Issaquah Highlands Community Association requires an Architectural
      Review Committee (ARC) submittal for any exterior door change — new color, new style, new
      glass layout. Plan on 2–4 weeks for ARC review; you'll need a product spec sheet, color
      sample, and photos of the existing door. Separately, the City of Issaquah Building Division
      requires a permit for any structural work: a like-for-like door swap in the same rough
      opening is generally IRC-exempt, but any opening enlargement triggers a building permit
      with plan review — typically another 2–4 weeks. TopVolk is a WA Licensed Contractor and
      handles both the ARC submittal and city permit application as part of the project scope.
      Budget 4–6 weeks from signed contract to install start on HOA-governed projects in 98029.

  - title: "What Door Installation Actually Costs in Issaquah — Entry, Patio, and Interior Scopes"
    description: |
      Costs span a wide range because the scope varies dramatically by project type. A single
      interior door swap — new slab, Schlage passage hardware, painted casing — runs $600–$1,200
      installed. An exterior entry door replacement with proper head flashing, sill pan, and a
      new Therma-Tru or Marvin fiberglass unit runs $3,000–$5,500 depending on sidelite and
      transom configuration. A patio system upgrade involving multi-slide installation and a new
      LVL header lands $12,000–$20,000 or more. What moves the number: existing rot in the rough
      opening, whether an LVL header replacement is needed, which brand tier the HOA requires,
      and whether electrical rough-in for a hardwired smart lock is in scope. Issaquah Highlands
      HOA guidelines sometimes restrict product choices to specific lines, which can push material
      costs up noticeably. TopVolk provides a line-item quote after the site visit — not a vague
      range over the phone.

  - title: "Weatherstrip Failure and Smart Lock Retrofits — The Maintenance Most Issaquah Homeowners Miss"
    description: |
      The most-overlooked failure point on a 10-year-old entry door isn't the door itself — it's
      the weatherstrip. The bottom sweep wears flat against the threshold, the compression bulb
      seal on the door jamb loses its memory, and a $4,000 Pella door starts leaking cold air and
      noise like it was never installed correctly. Replacing the full perimeter weatherstrip and
      threshold seal on a standard 3/0×6/8 entry door runs $200–$400 and restores most of the
      original thermal performance. Smart lock retrofits — August Wi-Fi Smart Lock 4th Gen or
      Schlage Encode Plus — install in about an hour on standard 2-1/8" deadbolt prep. Older
      Issaquah homes with non-standard lever sets occasionally need a new deadbolt bore and
      reinforced strike plate, adding 2–3 hours to the job. If the door predates 2000 and
      weatherstrip repairs are becoming annual, a full entry replacement typically pencils out
      better over a 10-year horizon than continued patches.

