  - q: "Do you need a permit for flooring installation in Issaquah?"
    a: |
      Standard flooring replacement — hardwood, LVP, tile — does not require a permit
      through the City of Issaquah Building Department. Permits come into play when the
      scope includes structural subfloor repairs: replacing joists, cutting into the
      floor framing system, or modifying anything structural in a crawlspace. In those
      cases, we apply through the City of Issaquah's permit center and coordinate the
      rough-in inspection before closing up the floor. TopVolk is WA Licensed
      Contractor, so we handle all permit applications directly. Projects in
      unincorporated King County areas near Issaquah route through King County DPER
      instead — same process, different forms, and we know both.

  - q: "Engineered vs. solid hardwood — which is right for an Issaquah home?"
    a: |
      Solid hardwood is milled from a single 3/4-inch piece of wood, requires nailing
      or stapling to a wood subfloor, and is sensitive to the moisture swings Issaquah
      sees October through April. It cannot go directly over concrete without a
      significant vapor barrier system. Engineered hardwood has a real wood veneer over
      a plywood core, making it dimensionally stable through humidity cycles. In 98029
      — newer slab-on-grade homes, some with radiant heat — engineered is almost always
      the correct specification. Kahrs and Mirage make engineered products with 4–6mm
      wear layers thick enough to sand and refinish two or three times. Solid hardwood
      is the right call for the older 98027 homes with wood subfloors and more
      predictable interior humidity.

