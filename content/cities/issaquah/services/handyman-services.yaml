title: "Issaquah Handyman Services — Punch Lists, Fixtures & Smart Installs"

intro: |
  Gilman Boulevard splits old Issaquah from the newer developments climbing toward Tiger
  Mountain, and the two halves of this city have very different handyman needs. Down in
  98027, you find homes built in the 1970s and 80s with original fixtures finally hitting
  replacement age — galvanized supply lines, builder-grade faucets, hollow-core doors that
  won't seal properly come November. Up in the Highlands (98029), it's different: large
  homes that just finished major kitchen or bathroom remodels, and the GC handed over keys
  with a punch list nobody completed. A Kohler faucet still in the box. Three cabinet pulls
  missing. Caulk lines at the tub surround that need redoing before mildew takes hold.
  TopVolk Construction, owner-operated by Vladislav Volkov since 2017, handles both ends of
  that — small repairs in older Issaquah homes and finish-out work on Highlands remodels
  that are 95% done but sitting unfinished. WA Licensed Contractor, 100+ projects completed
  across King County since 2017.

localContext: |
  The housing split in Issaquah creates two distinct categories of handyman work. In 98027 —
  the older core around Gilman Village and the neighborhoods near Lake Sammamish State Park —
  expect mid-century and 1970s-80s construction: original wood windows painted shut over
  decades of repaints, decks built in the early 2000s with pressure-treated lumber now
  splitting and checking, and bath fixtures that are simply worn out. In 98029, the Issaquah
  Highlands Community Association maintains architectural guidelines covering exterior colors,
  material specs, and what requires pre-approval — meaning even minor exterior repairs like
  replacing a section of Hardie siding need to match the approved palette before work begins.
  Seattle averages about 37 inches of rain annually; Issaquah, tucked against the Cascade
  foothills, runs higher. North-facing soffits, trim boards, and deck surfaces accumulate moss
  and mildew faster than most of the metro, making exterior caulk, weatherstripping, and
  surface maintenance genuinely recurring work rather than optional.

commonProblems:
  - title: "Punch List Completion on Issaquah Highlands Remodels"
    description: |
      Remodels wrapping up in Issaquah Highlands regularly end with the same unfinished list:
      missing cabinet hardware, uncaulked tile transitions, touch-up paint, and light fixtures
      still in boxes. The GC moved on; subcontractors are gone. A typical punch list at a
      $120K-$180K kitchen remodel includes 15-25 line items — most under two hours each, but
      collectively a full day or two of focused work. Schluter Kerdi-Band transitions at shower
      niches get skipped. Dimmer-compatible LED trims go uninstalled because the electrician's
      final rough-in didn't include fixture hang. Vladislav does a blue tape walkthrough with
      the homeowner first, photographs every open item, and works through the list in one or
      two visits. Most Highlands punch lists run $800-$1,800 depending on scope. Call
      (206) 591-1096 to schedule a walkthrough within the week.

  - title: "Drywall Patches That Actually Match the Existing Texture"
    description: |
      Small drywall patches sound simple until the texture doesn't match. Issaquah homes from
      the 1980s and 90s — particularly in the Talus neighborhood and areas near Gibson Ek High
      School — commonly have orange-peel or knockdown texture applied with a hopper spray that
      most handymen don't carry. Patching a 6-inch hole where a doorknob punched through
      requires cutting a clean opening, installing blocking behind the drywall for solid backing,
      then taping, mudding, and feathering the texture to blend across a 2-3 foot area so the
      patch doesn't read as a circle under raking light. Materials are inexpensive; a quality
      patch runs $150-$350 including texture match and finish paint. The variable is skill — a
      bad knockdown texture match on a living room wall in a $900K Highlands home looks worse
      than the original hole.

  - title: "Smart Home Device Installation in Wired-Ready Issaquah Homes"
    description: |
      Issaquah Highlands homes built in the 2000s and 2010s have structured wiring panels,
      CAT6 runs, and dedicated circuits — but installation of Ring video doorbells, Ecobee
      smart thermostats, and Lutron Caseta dimmer switches still requires someone who
      understands low-voltage wiring and load calculations. A Lutron Caseta switch on a circuit
      without a neutral wire needs a different device than a standard smart switch. Ecobee
      thermostats require correctly identifying the C-wire, which in homes with a Mitsubishi
      mini-split or multi-zone HVAC system sometimes means tracing wiring back to the air
      handler in the mechanical room. Miswiring a thermostat can short a control board that
      costs $400-$600 to replace. TopVolk handles smart home installs as standalone jobs —
      no minimum scope required. Typical installation runs $200-$450 depending on device count
      and wiring complexity.

  - title: "Deck Board Replacement and Weatherstripping on Aging PT Decks"
    description: |
      Composite decking holds up better in PNW rain than pressure-treated lumber, but Issaquah
      homes built in the late 1990s and early 2000s often have original PT wood decks now 20-plus
      years into their service life. Boards check and split, joist hangers corrode, and rim joists
      show rot where the ledger board meets the house. Replacing individual deck boards means
      pulling them up and inspecting the rim joist and joist hangers first — if those are
      compromised, board replacement alone doesn't address the structural issue. Trex Transcend
      or TimberTech Azek boards run $4-$7 per linear foot installed for a straightforward swap
      on a sound frame. Exterior door weatherstripping in 98027 is a separate common call —
      standard V-strip foam compresses after 5-7 years in PNW conditions and needs replacement
      with EPDM bulb seal to actually stop drafts and heating loss.

  - title: "Rotted Exterior Trim and Recurrent Moisture Damage"
    description: |
      North-facing soffits and trim boards on Issaquah homes accumulate moisture from October
      through May — seven-plus months of near-continuous wet conditions. Cedar trim, even when
      painted, checks along the grain and allows water intrusion behind the paint film. Once the
      wood is soft, caulk alone won't fix it. The standard repair is cutting out the rotted
      section, sistering in a pressure-treated or cellular PVC trim board (Azek and Versatex
      both perform well here), priming all four sides before install, and recaulking with
      paintable polyurethane. Hardie cement-board trim is the better call where rot keeps
      recurring — it doesn't rot, holds paint longer, and stands up to the freeze-thaw cycles
      that hit Issaquah in November and again in March. Individual trim repairs typically run
      $200-$600 per section depending on linear footage and access.

faq:
  - q: "How fast can you get to Issaquah for handyman work?"
    a: |
      Issaquah is about 17 miles east of Seattle via I-90, typically 25-40 minutes depending
      on traffic through the Mercer Island interchange. The Issaquah Highlands adds another
      5-10 minutes up the hill from Exit 18. Parking is generally straightforward at residential
      addresses in both the Highlands and the older neighborhoods near downtown Issaquah. Most
      handyman jobs get scheduled within 3-7 business days of the initial call; same-week
      appointments are often available for smaller items. Call (206) 591-1096 — Vladislav
      answers directly, not a call center or answering service.

  - q: "What does a typical handyman visit cost in Issaquah?"
    a: |
      Job cost depends on what's actually involved. Simple fixture swaps — a Moen kitchen
      faucet, a Kohler toilet, a ceiling light fixture — typically run $150-$350 per fixture
      including labor (you supply the fixture, or we source it). Punch list visits for
      post-remodel finish work are usually quoted as a half-day block ($450-$600) or full-day
      block ($800-$950). Larger scopes like deck board replacement or multiple drywall patches
      get itemized line by line. The free on-site consultation produces a written quote with
      actual line items — no vague "starting from" ranges. Call (206) 591-1096 or schedule
      a site visit online.

  - q: "Do small repairs in Issaquah require a permit?"
    a: |
      Most handyman work — fixture swaps, drywall patches, weatherstripping, smart home device
      installs — falls below the City of Issaquah's permit threshold. Permits are required when
      work involves structural changes, electrical panel modifications, or new plumbing runs.
      Issaquah has its own permit center, separate from King County DPER, which handles
      unincorporated county areas. If a job does cross into permit territory, TopVolk is a
      WA Licensed Contractor and can pull the permit and coordinate plan review with the city
      directly. Minor residential permit reviews in Issaquah typically take 2-4 weeks for
      over-the-counter or electronic submittal.

  - q: "Can you install smart home devices as a standalone job, not part of a larger remodel?"
    a: |
      Yes — smart home installs are booked as standalone visits, no minimum scope required.
      Ring doorbells, Ecobee or Nest thermostats, Lutron Caseta dimmer systems, and smart lock
      installs (Schlage Encode, Yale Assure) are regular requests in Issaquah Highlands. Each
      device gets tested before the visit ends — including app connectivity confirmation and
      thermostat staging verification. Homes with older HVAC systems sometimes need a C-wire
      adapter installed before a smart thermostat will function reliably long-term. Budget
      roughly $150-$300 per device for labor; multi-device visits are quoted as a package and
      cost less per unit than separate trips.

  - q: "What warranty do you provide on handyman work?"
    a: |
      Labor is warranted for 12 months on all handyman work — if a fixture we installed fails
      due to an installation error within that window, we come back and fix it at no charge.
      Material defects fall under the manufacturer's warranty: Moen and Kohler both carry
      limited lifetime warranties on fixtures; Trex offers a 25-year fade and stain warranty
      on composite decking. What's not covered: pre-existing conditions discovered after work
      begins, or damage from deferred maintenance on adjacent components. Every job gets a
      written scope before work starts, so there's no ambiguity later about what was included.
      On larger handyman scopes, deadline commitments are written into the contract with a
      penalty clause — we pay if we miss the agreed completion date.

  - q: "Do you cover Sammamish, Bellevue, and other areas near Issaquah?"
    a: |
      TopVolk regularly works in Sammamish, Bellevue, Redmond, Kirkland, and Renton — all
      within 20-30 minutes of the I-90/SR-900 corridor. Snoqualmie and North Bend (98065,
      98045) are also in the service area for larger scoped projects. Scheduling runs Tuesday
      through Saturday; weekend availability depends on current project load. The full service
      area spans King, Snohomish, Pierce, and Kitsap counties — 100+ projects completed across
      the Seattle metro since 2017. Call (206) 591-1096 to confirm availability and talk
      through your specific job with Vladislav directly.