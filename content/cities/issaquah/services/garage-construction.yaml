  - q: "What does a new detached garage build cost in Issaquah?"
    a: |
      A standard detached two-car garage (24x24 feet) in Issaquah typically
      runs $65,000-$110,000 depending on finish level, slab thickness, EV
      circuit inclusion, and whether the structure requires ADU fire-separation
      compliance for a DADU above. Adding a habitable ADU above the garage
      brings the total to roughly $130,000-$200,000+, depending on finish
      level and whether a separate utility connection is included. Site prep,
      structural engineering, City of Issaquah permit fees, and HOA submittal
      costs all affect the final number. TopVolk provides a line-item quote
      after the on-site consultation — no vague allowances that balloon later.
      Free consultation at (206) 591-1096.

  - q: "What does the City of Issaquah permit process look like for a garage build?"
    a: |
      For a standard detached garage within Issaquah city limits, the City of
      Issaquah Building Division handles plan review — typically 4-8 weeks for
      a straightforward accessory structure with no habitable space. A DADU
      above the garage, which requires fire separation details, structural
      engineering stamps, and mechanical design, pushes plan review to 8-12
      weeks in most cases. If the property sits in an Issaquah Highlands HOA,
      the Issaquah Highlands Community Association architectural review comes
      first — budget 2-4 weeks for that board process before city submittal.
      TopVolk prepares the complete permit package: site plan, structural
      drawings, energy code compliance documentation. WA Licensed Contractor.
      All inspections — foundation, rough-in framing, rough-in mechanical, and
      final — are coordinated through the city's online inspection portal.

  - q: "Can you pre-wire a new garage for EV charging and a future workshop setup?"
    a: |
      Yes, and construction is the right time to do it. Trenching conduit and
      pulling wire before the slab is poured and the walls are insulated costs
      a small fraction of what it runs as a retrofit. A 60-amp dedicated circuit
      with a NEMA 14-50 outlet handles most Level 2 chargers — Grizzl-E,
      ChargePoint Home Flex, Tesla Wall Connector — without oversizing. For a
      two-vehicle household or a shop setup that also needs 240V equipment
      circuits, a 100-amp subpanel in the garage is the cleaner answer. Many
      1980s-90s homes in 98027 are running 150-amp main service, so subpanel
      load sizing needs to be verified against existing panel capacity during
      design. Conduit stub-outs for a second future charger position are cheap
      to add during framing. All electrical work is permitted with the City of
      Issaquah and inspected at rough-in before the walls close.

  - q: "How long does a full garage build take in Issaquah from contract to final inspection?"
    a: |
      A standard detached two-car garage with no ADU component typically runs
      4-6 months from signed contract to final inspection — permit application
      and plan review account for most of that timeline, not construction time.
      The physical build, once permits are issued, runs 6-10 weeks depending on
      weather windows and subcontractor scheduling. Adding a DADU above the
      garage extends the overall timeline to 6-8 months. Issaquah gets
      significant rainfall from October through April, and concrete pours and
      exterior framing get scheduled around those windows. Deadline commitments
      are written into TopVolk's contracts with penalty provisions for missed
      milestones — not a vague promise. Call (206) 591-1096 to discuss timing
      for your specific scope.

