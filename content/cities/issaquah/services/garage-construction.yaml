title: "Issaquah Garage Construction — ADU, EV-Ready & Permit-Filed"

intro: |
  Grand Ridge Road homeowners in 98029 have been calling more than any other
  Issaquah area this past year — not for repairs, but for new detached garage
  builds they've been putting off since the Highlands plateau's housing boom
  cooled. Most of these lots have the square footage. The holdup is usually the
  King County DPER permit package and figuring out whether a DADU above the
  garage pencils out under WA HB 1337's statewide ADU rules. Central Issaquah
  properties in 98027, meanwhile, sit closer to Gilman Village on tighter lots
  with existing drainage patterns to work around — and those homeowners want
  the new structure's roofline and Hardie cement-board siding to match the
  house, not announce itself as an add-on. TopVolk Construction has handled
  both scenarios across Issaquah since 2023, with Vladislav Volkov managing
  permit applications and site coordination personally. Call (206) 591-1096 to
  schedule a free on-site consultation — with the contractor, not a salesperson.

localContext: |
  The 98029 zip code covers Issaquah Highlands, Grand Ridge, and Talus —
  neighborhoods built largely between 2000 and 2015 on lots ranging from
  5,000 to 12,000 square feet. Garage construction here often involves HOA
  architectural review by the Issaquah Highlands Community Association before
  the City of Issaquah permit application even gets submitted, and detached
  garage footprints get scrutinized for lot coverage and FAR (Floor Area Ratio)
  compliance before a single drawing goes to plan review. In the 98027 zip —
  central Issaquah, the older blocks near Lake Sammamish State Park, and the
  hillside streets climbing toward Cougar Mountain Regional Wildland Park —
  homes from the late 1970s through early 1990s frequently have slab-on-grade
  or post-and-pier foundations that affect how an attached garage addition ties
  in structurally. Issaquah also sits in a topographic bowl that catches more
  rainfall than Seattle proper, closer to 55 inches annually, which means vapor
  barriers under concrete slabs aren't optional — they're the difference between
  a dry workshop and a wet one by November.

commonProblems:
  - title: "Building a Detached Garage with a DADU Above Under WA HB 1337"
    description: |
      WA HB 1337 (2024) lets Issaquah homeowners build up to two ADUs on a
      single-family lot — including a DADU stacked above a detached garage.
      That's a real option on many 98029 lots with enough rear yard depth, but
      the structural requirements are meaningfully different from a standard
      garage build. The floor-ceiling assembly between the garage and the living
      space above has to meet IRC fire separation requirements — typically
      5/8-inch Type X drywall on the garage ceiling — and the LVL beam sizing
      for the garage span has to account for the load of a habitable floor above.
      Framing, MEP coordination, R-49 roof insulation, and a 6-mil poly vapor
      barrier at the slab all go into the permitted drawings. City of Issaquah
      plan review for this scope typically runs 6-10 weeks; the full build from
      permit application through final inspection runs 4-6 months. TopVolk
      handles the permit package start to finish — 100+ projects completed since
      2023 across the King County service area.

  - title: "EV Charger Circuit Pre-Wire During Garage Framing"
    description: |
      Most Issaquah homeowners building a new garage in 2025 drive at least one
      EV or plan to within a few years. Installing a 60-amp dedicated circuit
      during rough-in costs a fraction of what it runs to cut into finished walls
      later, and the conduit is trivial to add before the slab cures. The panel
      situation matters too: a lot of 98027 homes carry original 100-amp or
      150-amp service that won't comfortably support a Level 2 charger without
      a service upgrade. On new detached garage builds in 98029, a subpanel in
      the garage — 60-amp minimum, 100-amp preferred for a workshop setup —
      feeds the EV circuit and any 240V equipment without stressing the house
      panel. Conduit stub-outs for a second future charger cost almost nothing
      during framing. Charger options like Grizzl-E and ChargePoint Home Flex
      are solid Level 2 units, but the circuit, subpanel, and permitted
      electrical rough-in are what require a licensed contractor and a City of
      Issaquah inspection before the walls close.

  - title: "Setback and Lot Coverage Calculations Before Anything Gets Designed"
    description: |
      The City of Issaquah sets rear-yard setbacks for accessory structures at
      5 feet from the property line, with side-yard setbacks varying by
      residential zone — usually 5 feet as well, but narrower lots in the 98027
      core can tighten this. FAR limits cap total building coverage, and a
      larger existing home may already eat into what's buildable for a detached
      garage. Properties in Issaquah Highlands (98029) carry an additional
      layer: the Issaquah Highlands Community Association requires architectural
      review before city permit submittal, and that package needs elevation
      drawings, material specs, and a site plan documenting setback compliance.
      King County DPER governs parcels in nearby unincorporated territory —
      parts of the Snoqualmie Valley foothills — but within Issaquah city
      limits, the City of Issaquah Building Division runs plan review. TopVolk
      prepares the full permit package, including structural drawings and energy
      code documentation, and tracks the application through every review cycle.
      WA Licensed Contractor.

  - title: "Matching a New Garage's Siding and Roofline to the Existing House"
    description: |
      A garage that doesn't match the house reads as an add-on, no matter how
      well it's built. Issaquah's late 1980s and early 1990s homes in 98027
      commonly have T1-11 panel siding or cedar lap — neither of which ages
      gracefully under 55-plus inches of annual rainfall. When framing a new
      garage, the stronger move is Hardie cement-board lap siding in a profile
      and color matched to the existing house, or replacing deteriorating house
      siding simultaneously if it's already showing rot. Roofline pitch is the
      other dead giveaway: matching the existing pitch, fascia depth, and soffit
      overhang extension requires one extra step in the framing plan but shows
      immediately on the finished structure. Architectural shingles — CertainTeed
      Landmark Pro or an equivalent 30-year product — hold up better in
      Issaquah's climate than three-tab, and the Issaquah Highlands Community
      Association's design guidelines for 98029 properties typically require
      architectural-grade roofing as a minimum spec anyway. Budget $4,000-$9,000
      for exterior siding and roofing on a standard two-car garage, depending on
      material selection and whether house siding is being addressed at the
      same time.

  - title: "Concrete Slab Specifications That Hold Up in Issaquah's Climate"
    description: |
      A standard residential garage slab poured at 4 inches minimum works for
      typical vehicle storage; 5 or 6 inches is the call for a workshop with
      heavy equipment, a vehicle lift, or significant point loads. Fiber
      reinforcement — polypropylene or steel fiber mixed into the concrete —
      controls cracking more reliably than wire mesh, which routinely ends up
      resting on the subgrade during pours instead of positioned mid-slab where
      it does something useful. A 6-mil poly vapor barrier under the slab is
      standard practice in Issaquah; without it, ground moisture migrates
      upward and creates condensation in any heated or finished space. Control
      joints scored every 10-12 feet guide cracking away from random locations.
      For clients finishing part of the garage as a workshop or gym, DriCore
      subfloor panels over the slab create a thermal break between cold concrete
      and finished flooring. For a standard 24x24-foot two-car garage slab in
      Issaquah, expect concrete work alone — including excavation, vapor barrier,
      fiber reinforcement, and control joints — to run $8,000-$14,000 depending
      on site conditions and thickness spec.

