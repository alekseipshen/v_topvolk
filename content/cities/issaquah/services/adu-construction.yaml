title: "Issaquah ADU Construction — Build Equity on Your Existing Lot"

intro: |
  Since WA HB 1337 took effect in 2024, every single-family lot in Issaquah can legally host up
  to two ADUs — an attached unit, a detached backyard cottage, or a basement conversion. That
  shift matters most in neighborhoods like Issaquah Highlands (98029), where Pacific Northwest-style
  homes built after 2000 often sit on lots with 4,000–6,000 square feet of usable rear yard and
  already-roughed mechanical chases. The rental market near downtown Issaquah stays tight year-round,
  driven largely by tech workers commuting via I-90 to Redmond and Bellevue. A well-designed 600–800
  sq ft DADU with a Bosch appliance package and in-floor radiant heating can realistically rent for
  $1,800–$2,400 per month in this zip code — and that income is on your existing parcel, not a
  second property purchase. TopVolk Construction has permitted and built ADUs across King County
  since 2023; Vladislav Volkov handles each project directly, from the first site walk-through to
  the City of Issaquah final inspection sign-off.

localContext: |
  Central Issaquah (98027) brings different challenges than the Highlands. Homes built in the late
  1980s through mid-1990s along Front Street and the Sunset Way corridor often carry original
  Douglas-fir framing, aging electrical panels under 150 amps, and crawlspace vapor barriers that
  need full replacement before an attached ADU conversion makes sense. Issaquah Highlands (98029),
  developed mostly post-2000, has cleaner bones — modern energy-code framing, better insulation
  continuity, and in many cases a basement or bonus room already roughed in for future conversion.
  For a DADU on a standard Highlands lot, setback requirements run 5 feet from side and rear
  property lines, and the City of Issaquah caps DADU height at 24 feet at peak ridge. Lot coverage
  and FAR calculations are site-specific, and Issaquah runs its own permit center — King County DPER
  handles unincorporated parcels, but most Issaquah addresses fall under the City's jurisdiction.
  Plan review runs 6–10 weeks on a first submittal. The 37-plus inches of annual rainfall here, heavy
  October through May, means vapor barriers, proper crawlspace drainage, and Hardie cement-board
  siding are standard spec on every detached unit we build.

commonProblems:
  - title: "DADU vs. Attached ADU — Choosing the Right Structure for Your 98029 Lot"
    description: |
      Most Issaquah Highlands homeowners assume a detached backyard cottage is always the better
      option, but lot geometry often makes a basement AADU more practical and significantly less
      expensive. A DADU requires its own foundation, full MEP coordination (mechanical, electrical,
      plumbing rough-in), and typically a separate utility connection — adding $15,000–$25,000 to
      project cost compared to a basement conversion. The 24-foot DADU height limit in Issaquah
      also eliminates two-story options on sloped lots near Cougar Mountain Regional Wildland Park.
      For a 98029 lot under 6,000 square feet, a basement AADU with a Schluter Kerdi waterproofing
      membrane, egress window installation, and DriCore subfloor panels typically comes in at
      $80,000–$120,000 fully permitted — versus $140,000–$185,000 for a freestanding DADU with its
      own water and sewer tap. The right call depends on your lot dimensions, existing foundation
      conditions, and whether you want the unit to function as a fully independent rental. Vladislav
      walks through both scenarios with drawings at the initial site visit.

  - title: "Utility Separation Costs That Catch Issaquah Homeowners Off Guard"
    description: |
      The City of Issaquah requires a permit for any new utility connection, and the choice between
      a shared water/sewer line versus a separate connection has a real impact on both upfront cost
      and long-term rental flexibility. A separately metered DADU qualifies for its own utility
      account and typically appraises higher when resale time comes. Trenching a new 1-inch water
      service and 4-inch sewer lateral from the street on a 98027 lot with established landscaping
      typically runs $8,000–$14,000 in labor and materials, using pressure-treated sleeves and
      Schedule 40 PVC for the underground runs. Electrical separation — a standalone 200-amp panel
      fed from the main service — adds another $4,500–$6,500. These numbers are site-specific; a
      lot close to the street connection point costs less than one 200 feet back. TopVolk maps the
      utility routing at the initial walk-through so the line items are in the quote, not discovered
      mid-project.

  - title: "Plan Review at the City of Issaquah — What the Permit Process Actually Looks Like"
    description: |
      Issaquah operates its own permit center independent of King County DPER. A new DADU requires
      a full building permit package: site plan showing setbacks and lot coverage, floor plan,
      elevations, and energy-code compliance documentation meeting current IRC requirements. Standard
      first-submittal plan review runs 6–10 weeks; correction cycles can add 2–4 weeks depending
      on plan reviewer comments. Lots near Tiger Mountain or Squak Mountain with slopes over 15%
      may also require a geotechnical report — that's another 3–4 weeks and $3,000–$5,000 before
      you even submit to the City. The rough-in inspection and framing inspection are separate
      milestones, both required before insulation. The AHJ issues final inspection sign-off before
      any occupancy is legal. TopVolk prepares the complete permit package and manages all
      submittals as a WA Licensed Contractor — homeowners don't need to navigate the City's portal
      or track correction notices themselves.

  - title: "What a Permitted ADU Realistically Costs in Issaquah — and What Moves the Number"
    description: |
      A straightforward 500–600 sq ft DADU on a flat 98029 lot with a concrete slab foundation,
      Hardie cement-board siding, and standard MEP rough-ins runs $140,000–$165,000 fully permitted
      and finished. A sloped lot requiring a stem wall or pier foundation pushes that up by
      $15,000–$25,000. Finish-level choices move the number significantly: Kohler plumbing fixtures
      versus Moen, IKEA flat-panel cabinets versus semi-custom, standard LVL beam spans versus a
      more complex engineered framing layout. An Issaquah Highlands homeowner wanting Sub-Zero
      refrigeration and Wolf cooking in a 750 sq ft rental unit should budget $185,000–$220,000
      all-in. TopVolk provides a fixed line-item quote after the site visit — not a vague range that
      expands at contract signing. Deadline penalties are written into every contract: if a project
      milestone is missed on our end, there is a financial consequence. Call (206) 591-1096 to set
      up the free on-site consultation and get actual numbers for your property.

  - title: "Moisture Control on a PNW Detached Build — Details That Fail in Year Three"
    description: |
      Issaquah averages 37 inches of rain annually, concentrated October through May. A north-facing
      DADU wall without Hardie cement-board cladding and a proper rainscreen gap behind it will show
      moss and mildew within two or three wet seasons — not a cosmetic issue but a rot risk for the
      sheathing and framing behind. Vapor barriers in crawlspaces aren't optional: they're
      IRC-required, and the City inspector checks them at rough-in. For any DADU with a conditioned
      crawlspace, 6-mil poly vapor barrier overlapped 12 inches at seams is the minimum; TopVolk
      specs 10-mil in wetter microclimates near the Issaquah Creek drainage corridor. A Mitsubishi
      mini-split heat pump handles both heating and cooling in Issaquah's mild but humid summers
      without the ductwork a forced-air system requires — it's standard spec on every ADU we build.
      Roof overhangs of 18–24 inches protect the siding and significantly extend the repaint cycle
      on a detached unit.

faq:
  - q: "How fast can you get to Issaquah for an ADU consultation?"
    a: |
      Issaquah sits roughly 17 miles east of Seattle via I-90, and TopVolk works regularly
      throughout King County from Seattle to North Bend. Scheduling a site visit in 98027 or 98029
      typically runs 3–7 days from first contact. The consultation is free, on-site, and conducted
      by Vladislav Volkov directly — not a salesperson handing off to a project manager. He walks
      the lot, notes setback and height constraints, flags any utility separation issues, and gives
      a realistic budget range before you spend anything. Call (206) 591-1096 to set it up.

  - q: "What does building an ADU in Issaquah typically cost?"
    a: |
      A permitted DADU in Issaquah ranges from roughly $140,000 (small footprint, slab foundation,
      standard finishes) to $220,000-plus for a larger unit with premium appliances and a
      sloped-lot foundation. Basement AADU conversions in 98027 homes with existing rough-in
      infrastructure can come in at $80,000–$120,000. What moves the number: lot slope, utility
      separation versus shared connection, finish level, and whether the City's plan review triggers
      a geotech report. TopVolk provides a fixed line-item quote after the site visit. Call
      (206) 591-1096 or schedule a free on-site consultation to get real numbers for your specific
      address.

  - q: "Does Issaquah require a permit to build a DADU, and how long does approval take?"
    a: |
      Yes — the City of Issaquah runs its own permit center, separate from King County DPER. A new
      DADU requires a full building permit package including site plan, floor plan, elevations, and
      energy-code documentation. First-submittal plan review typically takes 6–10 weeks; correction
      cycles add 2–4 weeks. Lots near Squak Mountain or Tiger Mountain with slopes over 15% often
      require a geotechnical report, adding 3–4 weeks and $3,000–$5,000 upfront. TopVolk manages
      the entire permit package as a WA Licensed Contractor — all documents, submittals, and
      correction-notice responses. Homeowners don't need to navigate the City's portal themselves.

  - q: "Can my Issaquah DADU have a fully separate kitchen, entrance, and utility meter?"
    a: |
      A properly permitted DADU is an independent dwelling unit — separate entrance, full kitchen
      with range, refrigerator, sink, and dishwasher, its own bathroom, and ideally its own
      electrical panel. The City of Issaquah allows separate utility connections for water, sewer,
      and electrical; a shared connection is also permitted and lowers upfront cost. For rental
      income purposes, a separately metered unit is simpler: the tenant pays their own utilities.
      A typical mid-range finish package on a completed Issaquah ADU includes a Bosch induction
      range with a 400 CFM range hood, Moen plumbing fixtures, semi-custom cabinetry, and a
      Mitsubishi mini-split — functional, durable, and appropriate for the rental market here.

  - q: "How long does the full ADU build take from permit approval to move-in?"
    a: |
      Once the City of Issaquah issues the permit, a 500–600 sq ft DADU typically takes 3–4 months
      to construct: foundation and framing run 3–4 weeks, MEP rough-ins and inspections take
      2–3 weeks, insulation and drywall hang/tape/mud adds 2 weeks, and finish work through the
      blue-tape walkthrough and punch list runs 3–4 weeks. Add the 6–10 week permit review period
      and a realistic end-to-end timeline is 5–7 months from initial consultation to final
      inspection sign-off. Basement AADU conversions move faster — typically 2–3 months of
      construction after permit. Milestone deadlines with financial penalties for delays on
      TopVolk's end are written into every contract.

  - q: "Do you build ADUs in nearby cities like Sammamish, Bellevue, or North Bend?"
    a: |
      TopVolk covers the full King County area including Sammamish, Bellevue, Redmond, Kirkland,
      and North Bend alongside Issaquah. Each jurisdiction runs its own permit process — Bellevue
      has its own permit center with design review requirements; Sammamish and most of the
      Snoqualmie Valley fall under King County DPER for unincorporated parcels; North Bend
      properties occasionally require additional engineering for freeze-thaw soil conditions common
      in the foothills. Scheduling across all these areas is coordinated directly with Vladislav.
      Call (206) 591-1096 or use the contact form to check availability in your specific city and
      get a free on-site estimate.