  - q: "Do I need HOA approval before scheduling exterior washing in Issaquah Highlands?"
    a: |
      Issaquah Highlands and Talus HOA communities — both in the 98029 zip — typically require advance notice before exterior contractor work involving chemical application. Most review boards want 14 days' notice and a written description of what cleaning solutions will be used, particularly for soft wash roof moss treatments that involve sodium hypochlorite. A service description document covering the chemistry and application method is something we prepare as part of the scheduling process; it satisfies most HOA management requirements in these communities. Central Issaquah neighborhoods in the 98027 zip are largely non-HOA, so no approval process applies there. TopVolk Construction LLC carries liability insurance documentation that some HOA management companies require before approving exterior contractor access — that paperwork is ready to submit when you book.

  - q: "What's the difference between soft washing and pressure washing, and which method does my surface need?"
    a: |
      Pressure washing uses water volume and PSI to physically remove contaminants — effective on concrete, brick, and composite materials that handle 2,000-3,500 PSI without damage. Soft washing uses lower pressure (under 500 PSI) combined with sodium hypochlorite and surfactant solution that kills biological growth at the root rather than just blasting off the surface layer. Cedar siding, wood decks, painted surfaces, Hardie board, and roofing all require soft wash — high pressure on those materials causes grain damage, paint stripping, or lap seam cracking. For most Issaquah Highlands homes with Hardie siding and paver driveways, the right combination is soft wash on all vertical surfaces and a high-PSI surface cleaner attachment on flatwork. Pressure damage to fiber cement or cedar doesn't just look bad — it creates moisture entry points behind the cladding that lead to framing rot.

  - q: "How long do power washing results last on homes in Issaquah?"
    a: |
      Results depend on surface type and sun exposure. A shaded concrete driveway in Issaquah Highlands will show moss and algae recolonization within 12-18 months without a post-treatment preventive application. A cedar deck cleaned and properly stained with Armstrong Clark holds up 3-4 years before the next cleaning and restain cycle is needed. Hardie siding stays cleaner longer after a wash than cedar — typically 2-3 years on north-facing elevations before algae staining returns visibly. Roof moss treatments using sodium hypochlorite soft wash, or a post-treatment application of Wet & Forget Roof, extend results by killing the root system; treated roofs in Issaquah realistically need retreatment every 2-3 years given the canopy density and roughly 37 inches of annual rainfall. Scheduling an annual spring walkthrough lets us flag early recolonization before it becomes a full restoration scope.

