title: "Issaquah Bathroom Remodel — Past the 2000s Builder Spec"

intro: |
  Issaquah Highlands (98029) filled in fast between 2000 and 2010 — planned
  community, consistent street layouts, and builder bathrooms that made
  financial sense at the time. Kohler Wellworth toilets, one-piece acrylic
  tub surrounds, 12-inch ceramic tile on the floor. Those materials are
  hitting 15-25 years now, and Pacific Northwest humidity has been working
  on the grout joints the entire time. Vladislav Volkov has completed 100+
  bath remodels across the Highlands and older downtown Issaquah since 2017.

localContext: |
  Homes along the 98027 corridor — downtown Issaquah, the Tibbetts Valley
  neighborhoods — date from the 1960s through 1980s. Cast-iron drain stacks,
  galvanized supply lines, and tile set over drywall backer are the standard
  starting point. Across town in Blakely Ridge and Talus (98029), it's a
  different problem: 2000s construction that used builder-spec cement board
  but skipped the waterproofing membrane entirely, leaving acrylic surrounds
  peeling at the flange. Both ZIP codes need work — just different kinds.

commonProblems:
  - title: "Acrylic Surround Flanges Failing in 98029 Builder Homes"
    description: |
      One-piece acrylic tub/shower units installed in Issaquah Highlands
      homes between 2000 and 2010 are past their reliable lifespan. The
      flange seal at the wall joint cracks, water migrates behind the unit,
      and OSB framing absorbs it quietly for years. Pulling the surround
      almost always reveals soft framing or mold. Proper replacement means
      cement board backer, Schluter Kerdi waterproofing membrane, and tile —
      not another acrylic drop-in.
  - title: "Drywall Backer Behind 1970s Tile in Downtown Issaquah Bathrooms"
    description: |
      Older homes in the Tibbetts Valley area (98027) used moisture-resistant
      drywall as the tile substrate — standard practice then, poor performance
      over decades of PNW rain cycles. Once grout cracks, drywall swells and
      crumbles. Fixing it right means demo to the studs, new cement board,
      and RedGard or Schluter Kerdi over the floor pan before any tile goes
      down. Retiling over failed substrate is a short-term patch, not a fix.
  - title: "Walk-In Shower Conversions — Master Bath Layout Overhauls"
    description: |
      Highlands master baths from the early 2000s typically arrived with a
      soaking tub no one uses and a 36-inch shower that everyone does. Most
      clients want the tub out — build a curbless walk-in with a niche,
      bench, and a Moen or Grohe pressure-balance thermostatic valve. That
      scope means moving the drain, coordinating a rough-in inspection, and
      pulling a permit through the City of Issaquah Community Development
      Department. Budget $20K-$38K for a full master bath conversion.

faq:
  - q: "How fast can you get to Issaquah for a bathroom remodel consultation?"
    a: |
      Issaquah is about 30 minutes from most of our active job sites via
      I-90 east. Free on-site walkthroughs with Vladislav can usually be
      scheduled within a week. Call (206) 591-1096 directly — you talk to
      the contractor, not a scheduler or sales rep.
  - q: "What fixture and waterproofing brands do you use for Issaquah remodels?"
    a: |
      Kohler, Moen, and Grohe cover most fixture scopes. For walk-in showers
      in higher-end Highlands builds, Brizo or Hansgrohe thermostatic systems
      are a common upgrade. Waterproofing is Schluter Kerdi or RedGard over
      cement board on every project — no exceptions regardless of budget.
  - q: "What does the permit process look like and how long does an Issaquah bathroom remodel take?"
    a: |
      Structural or plumbing changes require a permit through the City of
      Issaquah Community Development Department — plan review typically runs
      2-4 weeks. After permit: a tile-and-fixture refresh is 4-6 weeks; a
      full master bath gut with layout changes is 8-12 weeks. TopVolk is a
      WA Licensed Contractor. Deadline is written into the contract with a
      penalty clause — if we miss it, we pay. Schedule at (206) 591-1096.