title: "Issaquah Deck Installation — Sloped Lots, Full Permits, No Rot"

intro: |
  Tiger Mountain backs right up to Issaquah's west side, and the hillside lots
  in the 98027 zip code come with a real engineering problem: steep grade,
  heavy runoff October through May, and soil movement that undercuts footings
  if they're not dug below the 12-18 inch frost line. Grand Ridge homes in
  98029 deal with the same moisture, just with newer framing behind the walls.
  Composite decking — Trex Transcend or TimberTech Terrain — outlasts cedar on
  these north-facing, heavily shaded lots by a decade or more.

  Vladislav Volkov (WA Licensed Contractor) has completed 100+ projects across
  King County since 2023 — decks included. Permits handled directly, deadline
  penalty written into every contract, and you talk to the person running the
  job from first call to blue tape walkthrough.

localContext: |
  Central Issaquah (98027) is mostly 1978–1995 construction — builder-grade
  rim joists that weren't engineered for ledger board attachment loads or
  modern flashing requirements. The Talus neighborhood and homes along the
  Gilman Boulevard corridor date similarly, many backing to Cougar Mountain
  Regional Wildland Park where slope drainage saturates ground-contact framing
  year after year.

  Issaquah Highlands (98029) skews newer — 2000 to 2015, engineered lumber
  framing, steeper topography. Second-story decks over living space are common
  up there, which triggers a drainage layer requirement at inspection. Near
  Lake Sammamish State Park and the Tibbetts Valley basin, lots are flatter but
  the water table runs high in spring, which changes footing design calculations
  entirely.

  The Gilman Village area and Front Street parcels often have tight FAR and
  setback constraints — deck footprint has to clear those limits before
  materials get ordered. City of Issaquah parcels use the city's own permit
  center; unincorporated lots route through King County DPER. Plan review runs
  4–8 weeks on standard attached decks. Call (206) 591-1096 to schedule an
  on-site visit — Vladislav comes out personally to assess grade, soil
  conditions, and permit path before any numbers are put on paper.

commonProblems:
  - title: "Ledger Rot Where the Deck Meets the Rim Joist"
    description: "Water infiltrates behind the ledger board, saturates the rim joist,
      and by the time you see soft wood it's structural. Issaquah's rainfall totals —
      close to 40 inches annually in the foothills — accelerate this on any deck
      built before 2010 without proper through-wall flashing and Z-flashing above the
      ledger. King County DPER requires ledger flashing inspection before framing
      proceeds. Skipping it voids your permit and rots your house."
  - title: "Post Footings That Move on Sloped or Variable Soil"
    description: "Squak Mountain and Tiger Mountain lots have variable soil density — fill,
      hardpan, glacial till mixed together. Undersized footings let posts shift
      seasonally, which stresses joist hangers and loosens guardrail connections over
      time. Ground-contact PT lumber rated UC4B minimum, footings poured below frost
      line, is what King County inspectors look for. Guessing on footing depth is how
      decks fail in year seven."
  - title: "Composite vs Cedar Material Decision for Issaquah's North-Facing Lots"
    description: "Cedar boards on a north-facing Issaquah Highlands deck grow moss by
      year two and split at the grain by year six without annual sealing. Trex
      Transcend and TimberTech Azek composites cost 30–40% more upfront and need no
      sealing, no staining, and hold color through PNW winters. For a $30K-plus deck
      on a $1.2M Highlands lot, the maintenance math isn't close — most owners here
      go composite."

