    a: "Issaquah is regular territory — 30–40 minutes out depending on I-90 traffic.
      Call (206) 591-1096 and Vladislav comes out personally for the consultation.
      WA Licensed Contractor, 100+ projects completed since 2023 across King County."
  - q: "Trex vs cedar — which deck material makes sense for Issaquah homes?"
    a: "Cedar looks sharp on day one but Issaquah's shaded, wet lots punish it fast.
      Trex Transcend and TimberTech Terrain composites require zero annual sealing
      and resist the moss that colonizes cedar north-facing boards by season two.
      Most Issaquah Highlands homeowners we work with go composite without much debate."
  - q: "What's the permit timeline for a deck in Issaquah, and do you handle it?"
    a: "City of Issaquah parcels go through their own permit center; county lots use
      King County DPER. Plan review runs 4–8 weeks for a standard attached deck.
      Budget 3–5 months total: permit application through rough-in inspection, final
      inspection, and completed build. We handle the permit application. Missed
      deadline? Penalty clause is written into the contract — not a vague promise."