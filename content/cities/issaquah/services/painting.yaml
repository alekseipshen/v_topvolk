title: "Issaquah Painting — Cedar, Hardie & Interior Repaint for PNW Homes"

intro: |
  Tiger Mountain catches weather rolling off the Cascades, and homes perched up in
  Issaquah Highlands — some sitting at 900 feet — see more freeze-thaw cycles than
  anything down in the valley near Lake Sammamish. That elevation difference matters
  for exterior paint. Cedar shake siding at that altitude loses protective oils faster,
  tannin bleeding sets in early, and once moisture works under the paint film, you're
  dealing with checking and eventual rot rather than a simple repaint cycle. Down in
  central Issaquah near the Gilman District (98027), the housing stock skews older —
  pre-1978 construction where lead-based paint testing under EPA RRP protocols becomes
  part of any interior repaint scope before a single piece of sandpaper touches the
  trim. TopVolk Construction has handled both ends of this: Sherwin-Williams Duration
  two-coat exterior applications on Highlands colonials and lead-safe interior trim work
  on older Gilman-area homes. Vladislav Volkov does the site walks himself — he's the
  one who spots the failed caulk joints at window flashings and the north-facing walls
  that never fully dried last winter.

localContext: |
  The 98029 zip code covers most of Issaquah Highlands, where early-2000s construction
  used Hardie cement-board siding on a large share of the housing stock. That product
  holds paint well structurally, but the factory finish chalks after 8-10 years —
  especially on north-facing elevations that barely see direct sun between October and
  April, keeping moisture dwell time high. The 98027 zip code includes older
  neighborhoods like Talus and the streets ringing Lake Sammamish State Park, where
  cedar-clad ranchers and split-levels from the late 1970s are common. Some of those
  cedar surfaces have had four or five repaint cycles applied without proper spot-priming,
  and now you're peeling back layers rather than doing a clean repaint. Issaquah
  Highlands Community Association requires architectural review board approval before any
  exterior color change — plan 2-4 weeks for that submittal. King County DPER doesn't
  issue permits for standard painting, but disturbing painted surfaces in pre-1978 homes
  triggers federal EPA RRP requirements regardless of local permit status — certified
  renovator on-site, containment, and full documentation at project close.

commonProblems:
  - title: "Cedar Shake Paint Failing in 5 Years Instead of 7-Plus"
    description: |
      Cedar shake siding on north-facing walls in Issaquah — particularly in Talus and
      older Gilman-area neighborhoods (98027) — is notorious for short repaint cycles.
      The root cause usually isn't the topcoat; it's what's underneath. Cedar produces
      tannins that bleed through standard latex primers within a season, causing
      yellowing and adhesion failure. The fix is an oil-based or shellac-based primer
      like Zinsser BIN applied directly to bare wood before any water-based topcoat goes
      on. After proper spot-priming, a two-coat application of Sherwin-Williams
      Woodscapes exterior acrylic holds five to seven years on west-facing surfaces and
      closer to ten on southern exposures with good drainage. Budget $4,500-$9,000 for a
      full cedar shake repaint on a 2,000-square-foot Issaquah home, depending on surface
      prep time, number of coats to strip, and ladder accessibility on steep-slope sites.
      Skipping the tannin-blocking primer and going straight to topcoat is the single
      most common reason repaints fail early here.

  - title: "Lead Paint Testing Required Before Interior Repaint on Pre-1978 Homes"
    description: |
      A significant portion of homes in central Issaquah (98027) around the Gilman
      District were built before 1978 — the federal cutoff for lead-based paint in
      residential construction. EPA RRP rules require a certified renovator to perform
      lead testing before any sanding, scraping, or paint disturbance in those homes.
      Positive test results trigger containment protocols: poly sheeting over floors and
      furnishings, HEPA vacuum cleanup, and specific waste disposal procedures. This
      applies to exterior trim work too, not just interiors. Testing itself runs
      $200-$400 for a standard scope. Full RRP-compliant prep adds $500-$1,500 to a
      typical interior repaint, depending on how many rooms are involved and how much
      surface prep is needed. TopVolk carries current EPA RRP certification — Vladislav
      walks every pre-1978 project through the testing and documentation process before
      any brush hits the wall. Call (206) 591-1096 to schedule a site visit and discuss
      the testing sequence.

  - title: "Cabinet Repainting After Kitchen Remodels — Getting a Finish That Holds"
    description: |
      After a kitchen remodel in Issaquah Highlands (98029), homeowners often repaint
      existing cabinet boxes rather than replacing them — solid choice when the boxes
      are structurally sound. The problem is standard wall paint applied to cabinet
      faces. It chips within months. Proper cabinet-grade finish work starts with
      deglossing the existing surface, filling any dents with a two-part wood filler,
      sanding to 220 grit, then applying a bonding primer before any topcoat. Benjamin
      Moore Advance waterborne alkyd is the go-to product for cabinet doors — it levels
      like oil-based paint and cures to a hard, scrubbable finish without the weeks-long
      cure time of traditional alkyd. Spraying cabinet doors off-site in a controlled
      environment produces cleaner results than brushing them in place. A full cabinet
      repaint on a standard 40-door Issaquah kitchen typically runs $3,500-$6,500,
      depending on door profile complexity, number of drawer fronts, and how much wood
      filler or surface repair is needed before primer goes on.

  - title: "Hardie Siding Repaint: Surface Prep Matters More Than the Paint Brand"
    description: |
      HardiePlank cement-board siding across Issaquah Highlands (98029) is still
      structurally sound on homes from 2004-2012, but the paint is a different story.
      Early James Hardie factory finishes were primer-grade coatings — not the
      through-color finish the product ships with today. Power washing alone won't
      prepare that chalked surface for a new topcoat. The correct sequence: pressure
      wash at 1,500-2,000 PSI to remove mildew and chalk (north-facing walls in the
      Highlands grow moss aggressively through the rainy season), let the siding dry a
      minimum of 72 hours, spot-prime any bare fiber cement with exterior masonry
      primer, then apply two coats of 100% acrylic — Sherwin-Williams Duration or PPG
      Timeless both perform well here. Back-rolling after spray application pushes paint
      into the fiber cement texture and eliminates lap marks. Expect $6,000-$14,000 for
      a full Hardie repaint on a 2,500-square-foot two-story home, with pricing driven
      by linear footage of trim, number of paint colors, and site access constraints.

  - title: "Bathroom and Laundry Moisture Causing Interior Paint to Bubble and Peel"
    description: |
      Issaquah's consistently humid climate — combined with undersized exhaust fans
      common in 1990s construction — causes standard flat or eggshell paint to bubble
      and peel off drywall in bathrooms within two to three years. This isn't a paint
      quality problem; it's a moisture management problem made worse by the wrong sheen
      level and missing primer. Start by verifying the exhaust fan CFM rating matches
      the bathroom volume — a 50 CFM fan in a 120-square-foot bathroom will always lose.
      Once airflow is confirmed adequate, the repainting sequence is: skim-coat any
      damaged drywall paper, seal with a moisture-blocking primer like KILZ Premium,
      then apply two coats of a satin or semi-gloss moisture-resistant finish. Benjamin
      Moore Aura Bath & Spa is formulated specifically for high-humidity interior spaces
      and resists mildew without requiring a separate mildewcide additive. Budget
      $800-$2,000 for a single bathroom repaint with proper prep, depending on ceiling
      height, surface condition, and whether any drywall replacement is needed first.

