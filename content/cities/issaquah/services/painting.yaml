  - q: "What does exterior house painting cost in Issaquah?"
    a: |
      Exterior painting costs in Issaquah vary based on siding type, surface condition,
      and number of coats. A straightforward two-coat repaint on a 1,800-square-foot
      Hardie-sided Highlands home — power wash, spot-prime bare areas, two coats of
      Sherwin-Williams Duration — typically runs $7,000-$12,000. Cedar shake is more
      labor-intensive due to tannin-blocking primer requirements and greater surface area
      per square foot, generally adding 20-30% over flat siding for the same footprint.
      Multi-story homes add scaffold or lift rental cost. What actually moves the price:
      number of colors, linear feet of trim, existing paint condition, and whether EPA
      RRP lead testing is required on pre-1978 properties. Free on-site estimate with
      exact line-item pricing — call (206) 591-1096 or schedule a consultation.

  - q: "Does Issaquah require permits for exterior painting, and how does the Issaquah Highlands HOA process work?"
    a: |
      Standard exterior painting doesn't require a building permit in Issaquah — King
      County DPER and the City of Issaquah both exempt routine paint work from permit
      requirements. The exception is pre-1978 homes where paint disturbance triggers
      federal EPA RRP rules, which apply regardless of local permit status. HOA rules in
      Issaquah Highlands are a separate process. The Issaquah Highlands Community
      Association requires homeowners to submit an architectural modification request
      before changing exterior colors — review board turnaround is typically 2-4 weeks.
      TopVolk assists with that submittal documentation before scheduling any exterior
      work. WA Licensed Contractor with 100+ projects completed since 2017 — Vladislav
      reviews HOA paperwork with homeowners at the estimate stage to avoid color-approval
      surprises once work is underway.

  - q: "Do you handle lead paint testing and EPA RRP compliance for older Issaquah homes?"
    a: |
      TopVolk carries current EPA RRP certification, which is required before disturbing
      painted surfaces in homes built before 1978. That covers sanding, scraping, and
      any prep work that generates painted dust or chips. The process starts with XRF
      testing or swab testing of the surfaces to be disturbed. If lead is confirmed,
      full containment protocol applies — poly sheeting, HEPA vacuum cleanup, and
      designated waste disposal with documentation provided to the homeowner at project
      close. Central Issaquah neighborhoods near the Gilman District have a solid
      concentration of pre-1978 homes where this requirement comes up regularly. Testing
      typically runs $200-$400. RRP-compliant prep adds $500-$1,500 to project cost
      depending on scope. Vladislav walks every pre-1978 repaint through this process
      from test to final documentation.

  - q: "How long does exterior paint last on a house in Issaquah's climate?"
    a: |
      On a properly prepped surface with a quality two-coat application of 100% acrylic
      — Sherwin-Williams Duration or Benjamin Moore Aura Exterior — expect 8-12 years
      on south and west exposures in Issaquah. North-facing walls in the Highlands, which
      get minimal direct sun and stay damp through the rainy season from roughly October
      to May, run closer to 6-8 years before the paint starts chalking and losing
      adhesion. Cedar shake tightens that window further — 5-7 years is realistic even
      with proper tannin-blocking primer, given the natural expansion and contraction of
      the wood. Annual inspection of caulk joints at window flashings and trim-to-siding
      transitions extends paint life significantly. A failed caulk joint caught early is
      a $50 repair; missing it for two seasons can mean rot repair and thousands more in
      work before the repaint even starts.

