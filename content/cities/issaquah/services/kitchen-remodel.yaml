title: "Issaquah Kitchen Remodel — Open Walls, Custom Cabinets, Permits Done"

intro: |
  The 1990s tract homes lining SE 56th Street and surrounding Tibbetts Valley Park were built
  with builder-spec kitchens — 30-inch slide-in ranges, one shared 20-amp circuit, galley
  layout closed off from the living room. None of that was designed to fit a Wolf 36-inch
  professional range or a Sub-Zero refrigerator column. Vladislav has remodeled kitchens across
  98027 and 98029, opening load-bearing walls, running dedicated circuits, and pulling permits
  through City of Issaquah.

localContext: |
  Homes in 98027 — especially around Old Town Issaquah and along Issaquah-Hobart Road — date
  from the 1980s to early 1990s. Galvanized supply lines, 100-amp panels, and builder-grade
  cabinets that have absorbed 30 years of PNW humidity. Up in 98029, the Issaquah Highlands
  builds from 2001-2010 span neighborhoods like Grand Ridge, Talus, and Pinecrest — better
  structural bones, but kitchens that routinely need full layout expansion and semi-custom
  cabinetry to fit the area's profile. Homes near Highlands Drive NE and the trails leading
  toward Tiger Mountain State Forest represent the newer end of the spectrum. Down the hill,
  the 98027 corridor near Lake Sammamish State Park skews older and often surfaces galvanized
  supply lines and undersized panels the moment walls open. Different eras, same result:
  kitchens that weren't built for how people actually cook.

commonProblems:
  - title: "Load-bearing wall removal without proper LVL beam sizing"
    description: |
      Removing the wall between kitchen and living room in a 1990s Issaquah tract home almost
      always hits load-bearing structure. An undersized LVL beam or missing PSL post creates a
      structural liability that shows up at final inspection — not sooner. City of Issaquah
      requires engineered drawings for any wall removal; plan review runs 4-8 weeks. Vladislav
      coordinates structural engineering and permit submission directly, so nothing sits waiting
      on a third party.
  - title: "100-amp electrical panel maxed out by modern appliance loads"
    description: |
      Many 98027 homes still run 100-amp service. An induction range needs a dedicated 50-amp
      240V circuit; a Sub-Zero refrigerator column pulls another 15-20 amps. That combination
      can max a 100A panel before the dishwasher runs. Upgrading to 200A service is
      permit-required through City of Issaquah and adds 3-5 days to the electrical rough-in
      inspection timeline. The panel upgrade gets scheduled before cabinet installation starts.
  - title: "Range hood CFM undersized for high-BTU professional ranges"
    description: |
      A Wolf 36-inch range produces up to 60,000 BTU. Clearing that heat load requires
      600-900 CFM of exhaust airflow. Most Issaquah Highlands builder kitchens were ducted for
      300 CFM — undersized by half. Reframing the soffit and running new duct through the
      exterior wall is rough-in work, completed before cabinets are set. Getting that duct
      path approved is part of the permit drawings, not an afterthought.

faq:
  - q: "How fast can you get to Issaquah for a kitchen remodel consultation?"
    a: |
      Vladislav runs jobs across King County and can schedule an on-site visit within a week.
      Most homes in 98027 and 98029 are 20-25 minutes from east Seattle via I-90 — no long
      lead time. Call (206) 591-1096 to set a time. No sales staff, no commissioned closer;
      you talk directly to the contractor who will run the job.
  - q: "Do you install Wolf, Sub-Zero, and Thermador in Issaquah kitchens?"
    a: |
      Yes. Issaquah Highlands homes regularly spec Wolf ranges, Sub-Zero refrigerator columns,
      and Thermador or Bosch dishwashers. Installation involves electrical circuit planning,
      cabinet depth verification, and panel-ready modification where needed. Miele appliances
      come up in higher-end 98029 remodels too. Vladislav coordinates appliance delivery timing
      with cabinet set and electrical rough-in so nothing arrives before the rough-in
      inspection clears.
  - q: "What does a full kitchen remodel cost in Issaquah, and what's the timeline?"
    a: |
      A full gut-to-finish kitchen remodel in Issaquah typically runs $60K-$120K depending on
      cabinet spec, appliance grade, and whether walls move. Timeline: 8-12 weeks of active
      construction after permit approval. City of Issaquah plan review adds 4-6 weeks up
      front — factor that into your project start date. TopVolk is a WA Licensed Contractor,
      100+ projects completed since 2017. Call (206) 591-1096 for a line-item quote.
      Missed deadlines carry a financial penalty written into the contract.