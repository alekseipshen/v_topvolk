  - q: "Do handyman repairs in Bonney Lake need a Pierce County permit?"
    a: |
      Most handyman-scope work — fixture replacements, drywall patches, weatherstripping, hardware installation, deck board swaps on an existing structure — falls below the permit threshold under Pierce County PALS guidelines and the IRC. Structural deck work like replacing a ledger board, adding a beam, or changing the deck footprint does require a Pierce County PALS permit and shifts the project scope significantly. Smart home device installation (Nest thermostats, Ring doorbells, smart switches on existing wiring) is generally permit-exempt for like-for-like replacements. TopVolk is a WA Licensed Contractor — if a repair unexpectedly requires a permit, that gets communicated before work starts, not after the fact.

  - q: "Can you match the existing drywall texture in a 1990s Bonney Lake home?"
    a: |
      Yes, and texture matching is where most DIY patches fail. Bonney Lake's late-1990s builder homes most commonly have orange-peel texture (hopper-sprayed at low pressure) or light knockdown (skip-troweled after a base coat). Matching it means testing the spray pattern on scrap drywall first, adjusting compressor PSI and mud viscosity until the droplet size matches, then feathering the texture 8-10 inches past the patch perimeter so there's no hard edge. PVA primer goes on before the texture coat to prevent the patch from flashing differently through paint. Paint matching for the touch-up is handled with a chip or spectrophotometer match at a local supply house.

  - q: "How long do handyman repairs hold up in Bonney Lake's wet climate?"
    a: |
      Quality V-strip bronze or high-density foam weatherstripping holds 10-15 years in PNW conditions. Composite deck boards — Trex and TimberTech both carry 25-30 year manufacturer warranties — won't moss up the way untreated wood does on north-facing exposures here. Drywall patches done correctly (taped, two-coat mud, texture-matched over PVA primer) are permanent and won't re-crack unless there's structural movement in the framing behind them. Caulking at wet areas like shower surrounds and exterior window frames is the shortest-lived item: siliconized latex runs 5-8 years before needing a refresh in high-humidity spaces. All workmanship on handyman jobs carries a 1-year warranty against defects in the repair itself.

