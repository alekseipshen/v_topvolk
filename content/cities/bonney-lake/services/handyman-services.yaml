title: "Bonney Lake Handyman Services — Fixture Swaps, Decks & Punch Lists"

answer: "TopVolk handles handyman repairs in Bonney Lake, WA — punch lists, fixture swaps, drywall patches, WA Licensed Contractor, 100+ projects completed."

intro: |
  Builder-grade fixtures installed in Bonney Lake's 1990s and early-2000s tract neighborhoods are hitting the end of their service life — Moen cartridges failing, recessed light trims yellowing, drywall seams telegraphing through flat paint. Vladislav Volkov at TopVolk Construction (WA Licensed Contractor) handles exactly this kind of work across the 98391 zip, from the newer homes in Tehaleh to older streets backing up to Allan Yorke Park. None of these are full remodels — they're the repairs and upgrades that fall between a plumber's minimum service call and a general contractor's minimum project threshold. A curbless shower left without final caulking after a remodel, a Ring doorbell that needs blocking added before it'll mount flush, a deck board that cupped and cracked over two wet winters near the Lake Tapps shoreline — that's the actual scope. Direct line to Vladislav. No dispatcher, no sales call, no one reading you a script.

localContext: |
  Most of Bonney Lake's residential stock in zip code 98391 was built between 1995 and 2012 — an era when builders used lighter-gauge fixtures, hollow-core doors, and vinyl compression weatherstripping that fails within 10-15 years under PNW conditions. Tehaleh, the master-planned community on the south end of town, skews newer (2012-2022), but even those homes hit punch-list age fast given Pierce County's roughly 37 inches of annual rain and freeze-thaw cycles that run November through February near the Cascade foothills. Homes in older sections along the 98390 border toward Sumner sometimes have original 1980s fixtures that were never touched during the first ownership cycle. Exterior surfaces on north-facing walls and deck surfaces collect moss and mildew by November — composite decking and Hardie cement-board trim hold up significantly better than wood in these conditions. Pierce County PALS handles permits for Bonney Lake; most handyman-scope jobs (fixture swaps, drywall patches, weatherstripping) fall below the permit threshold under IRC guidelines, so work can start quickly.

commonProblems:
  - title: "Open Punch-List Items After a Kitchen or Bath Remodel"
    description: |
      A remodel wraps, the general contractor moves on, and a list of small items sits open for months — missing cabinet hardware, unpainted drywall patches, caulk gaps at the tile-to-wall transition, outlet covers that don't sit flush against the drywall. In Tehaleh homes where owners put $60K-$120K into kitchen upgrades with Bosch dishwashers and semi-custom cabinetry, these open items are especially visible against the finished work. The fix is a focused blue tape walkthrough followed by systematic punch-list completion: texture matching on drywall patches (skip trowel or orange peel depending on the original wall finish), hardware installation with provided templates, final caulking with paintable siliconized latex. Most full punch-list sessions run 4-8 hours depending on item count. Call (206) 591-1096 to schedule a walkthrough before the list grows any longer.

  - title: "Drywall Patches That Show in Raking Light"
    description: |
      A drywall patch reads fine until late-afternoon sun hits the wall at an angle — then the repair stands out like a billboard. Bonney Lake's builder-grade homes from the late 1990s typically have orange-peel texture sprayed with a hopper gun, and matching it requires the right compressor PSI, correct mud viscosity, and feathering the spray pattern well past the patch perimeter. A 6-inch patch done wrong looks like a repair for the life of the wall. Correct process: cut back to clean edges, install backing or a California patch depending on size, hang new drywall, tape, two-coat mud, apply PVA primer to equalize porosity, texture-match, then paint. Patches in the 4-12 inch range typically run $150-$300 each including texture match and paint touch-up. Larger multi-patch jobs in the same room can bring the per-patch cost down.

  - title: "Weatherstripping Failure on Exterior Doors"
    description: |
      Exterior doors in homes built before 2005 commonly use compression-bulb weatherstripping stapled into a kerf cut along the door stop — it permanently compresses within 10-15 years and stops sealing. In Bonney Lake, where October-through-May rain drives sideways off the foothills, a failed door seal means water infiltration at the sill, cold drafts at the top corners, and visible daylight around the frame. The right fix depends on door type: V-strip bronze or reinforced foam for door stops, neoprene door sweeps for the bottom gap, threshold replacement if the aluminum saddle has warped. Sliding glass doors common in the area's 1990s split-level layouts take pile weatherstripping in the track channel for the lateral seals. No Pierce County PALS permit required for this scope. Most full exterior door weatherstripping jobs run 1.5-3 hours and $120-$280 in labor plus materials, depending on door count.

  - title: "Fixture Replacement — Faucets, Toilets, and Light Fixtures"
    description: |
      Swapping a Moen kitchen faucet, replacing a toilet with a Kohler Cimarron, or upgrading recessed lighting to dimmer-compatible LED trim kits are jobs that don't require a licensed plumber or electrician for the swap itself — but they do require someone who knows which shutoff valves are corroded, how to deal with supply line thread mismatch on older rough-in, and whether the existing junction box can handle the new fixture load. In homes built in the late 1990s, toilet rough-in dimensions sometimes land at 10 inches instead of the modern 12-inch standard, which requires an offset flange or a specific model selection. Fixture swaps in Bonney Lake run $95-$175 per fixture in labor, with Moen and Kohler parts available same-day at supply houses in the Sumner-to-Puyallup corridor. Line-item pricing is provided before any work starts.

  - title: "Deck Board Replacement and Railing Repair"
    description: |
      Bonney Lake decks built with untreated or under-treated lumber in the 1990s are showing their age — board cupping, end-checking, nail pop, and rot at rim joist contact points where water pools after rain. Replacing individual boards is feasible when the substructure (joists, ledger board, post bases) is still sound. If the joist hanger connections show surface rust but the metal is still structural, a wire brush and cold-galvanizing compound can buy several more years. For north-facing decks where moss builds up on wood every fall, composite decking — Trex or TimberTech — is the smarter long-term move. Railing repair (loose balusters, corroded post bases, wobbly handrail sections) is typically separate from board work and faster. Deck board replacement runs $8-$14 per linear foot in labor depending on fastener pattern, composite material billed additionally. A full 10x12 deck resurfacing runs roughly $800-$1,400 in labor.

