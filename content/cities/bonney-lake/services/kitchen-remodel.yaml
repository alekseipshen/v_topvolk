title: "Bonney Lake Kitchen Remodel — Open Layouts for 98391 Homes"

intro: |
  SR-410 runs right through Bonney Lake's core, and the subdivisions filling in the 98391 zip went up fast between 1995 and 2008. Those builder kitchens are now 15-25 years old — closed off from the living room, laminate counters, undersized appliance cutouts that won't fit a modern 36-inch Bosch or KitchenAid range without cabinet modification. Moisture is a factor too. PNW rainfall hits 37+ inches a year, heavy October through May, and that water finds its way under sinks in kitchens that were never properly sealed during original construction. Vladislav handles these projects directly: wall removal, LVL beam installation, appliance fitment, and a Pierce County PALS permit filed before demo starts. No middlemen, no sales staff — you're talking to the contractor from the first call.

localContext: |
  Most of the 98391 zip built out between the mid-'90s and 2008, with tract subdivisions concentrated around Allan Yorke Park and along Tehaleh Boulevard. Builder-grade flat-panel cabinets and laminate counters from that era are consistent across Bonney Lake neighborhoods. Electrical panels from that period frequently top out at 100 amps.

commonProblems:
  - title: "Load-bearing wall blocking the open-concept layout"
    description: "The wall between kitchen and dining room in Bonney Lake's 1990s-2000s tract homes is load-bearing more often than not. Removing it requires a structural engineer to specify the LVL beam size. Spans typically run 10-12 feet in these floor plans, and Pierce County PALS requires stamped engineering drawings before issuing the permit — not after. Plan review alone runs 3-5 weeks. During that window, Vladislav coordinates the structural engineer, lines up the rough-in inspection schedule, and locks in appliance specs so cabinet layout isn't frozen before the beam size is confirmed. Getting that sequence right prevents the most common mid-project delay in open-concept conversions across Pierce County."

  - title: "100-amp panels that can't support induction cooking"
    description: "A Bosch or KitchenAid induction range pulls a dedicated 40-50 amp 240V circuit. Panels maxed out at 100A need a service upgrade before cabinet work starts — that's a separate Pierce County PALS permit and a rough-in inspection before a single cabinet goes in."

  - title: "Appliance cutouts built for 1990s appliance dimensions"
    description: "Standard builder cabinets from that era assumed 30-inch ranges and 24-inch-deep refrigerators. A Thermador 36-inch range or Sub-Zero column fridge needs a different rough opening, more ceiling clearance, and sometimes a reconfigured soffit. Range hood CFM rating has to match the appliance — undersized ventilation is a code issue under IRC, not just a performance complaint. Cabinet choice — IKEA flat-packs, semi-custom, or full custom — affects lead time and how upper cabinet blocking gets framed in. That decision locks before any order goes out."

