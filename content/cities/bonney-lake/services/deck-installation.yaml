title: "Bonney Lake Deck Installation — Built for Frost and Rain"

intro: |
  Elevation makes a difference out here. Bonney Lake sits higher than
  Puyallup or Auburn — freeze-thaw cycles in 98391 hit harder than most
  of Pierce County, especially near Allan Yorke Park and the SR-410
  corridor. Post footings that barely clear the frost line in the coastal
  lowlands can heave here after a few winters. Most of the housing stock
  is 1995–2015 builder construction, and those original treated-pine
  decks are overdue. Trex and TimberTech composite now outsell cedar two
  to one on replacement projects in this zip.

localContext: |
  The bulk of Bonney Lake's residential grid fills in subdivisions built
  between 1998 and 2012 — two-story craftsman-style homes on 6,000–8,500
  sq ft lots throughout the Lake Tapps corridor and the neighborhoods
  flanking SR-410 in 98391. Builder decks from that era used standard
  pressure-treated pine for posts and decking boards. Twenty years of
  Pacific Northwest rain without consistent sealing means boards are
  checking, fasteners are backing out, and ledger connections are overdue
  for a hard look.

commonProblems:
  - title: "Post Footing Heave from Frost Depth"
    description: |
      Bonney Lake's elevation means colder winters than the coastal
      Pierce County lowlands. Footings poured at 8 inches — common in
      early-2000s tract construction — can shift through repeated
      freeze-thaw cycles. IRC requires footings to reach below the local
      frost depth: typically 12–18 inches on undisturbed soil, not
      compacted fill. Lots east of SR-410 sometimes need deeper pours
      depending on soil bearing capacity and the deck's design load.

  - title: "Ledger Rot Behind Builder-Era Deck Connections"
    description: |
      Early-2000s decks were attached without continuous flashing — lag
      screws into the rim joist, no weather-resistant barrier behind the
      ledger. Rain soaks behind the ledger board and softens the
      Douglas-fir rim joist from inside the wall cavity. Standard fix:
      sister pressure-treated lumber to the rot section, install
      Z-flashing, then re-attach with a code-compliant lag pattern and
      Simpson Strong-Tie joist hangers before any decking goes down.

  - title: "Guardrail Height and Baluster Spacing Below Current Code"
    description: |
      Pre-2010 decks in 98391 commonly have 32-inch guardrails and
      baluster gaps wider than 4 inches — both fail current IRC. Any
      deck over 30 inches above grade requires a 36-inch minimum
      guardrail; baluster spacing must reject a 4-inch sphere. Bonney
      Lake's building inspector flags this at final inspection.
      Guardrail replacement needs to be permitted and inspected —
      a common add-on we include as part of full deck replacement
      projects.

faq:
  - q: "How fast can you get to Bonney Lake for Deck Installation?"
    a: |
      About 50 minutes south of Seattle via SR-167 and SR-410. Vladislav
      schedules consultations personally — no sales rep between you and
      the person doing the work. On-site availability usually opens
      within 5–7 days. Call (206) 591-1096 to set a time.

  - q: "Is Trex or TimberTech a better fit for Bonney Lake's climate?"
    a: |
      Both perform well here. Trex Enhance covers most residential
      budgets and handles the moss problem cedar can't — no annual
      sealing cycle. TimberTech AZEK is stiffer for longer spans or
      second-story decks built over conditioned space. We bring samples
      on-site; picking composite from a website photo and picking from
      a real board in hand are two different decisions.

  - q: "What's the permit process and timeline for a deck in Bonney Lake?"
    a: |
      Bonney Lake is an incorporated city — permits run through the
      City's own building department, not Pierce County PALS. Plan
      review on a standard attached deck takes 3–6 weeks. The ledger
      flashing connection gets a rough-in inspection before decking
      goes down; final inspection at completion. We handle the permit
      application and coordinate all inspections. Missed deadline means
      a penalty on our end — written into the contract, not just said.
      WA Licensed Contractor. 100+ projects since 2023.
      Call (206) 591-1096.