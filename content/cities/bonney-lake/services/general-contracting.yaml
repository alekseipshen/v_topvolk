title: "Bonney Lake General Contracting — Lake Tapps Area Remodels"

intro: |
  Tract homes built on the plateau above Lake Tapps in the 1990s and early
  2000s are hitting the renovation wall. Builder-grade kitchens, cramped
  layouts, and 25-plus years of PNW rain cycling through cedar trim and aging
  vapor barriers — the problems stack up faster than owners expect. Getting a
  Bosch 800-series range and a real open kitchen into one of these homes in
  98391 means permits through Pierce County PALS, MEP rough-in coordination,
  and a contractor who actually shows up to manage it.

localContext: |
  Most of Bonney Lake's housing stock — ranchers and two-stories scattered
  across the plateau between SR-410 and 214th Ave E — was built between 1992
  and 2008. Zip code 98391 runs from 1990s builder tract near Allan Yorke Park
  to newer custom construction toward the Fennel Creek trail corridors.
  Crawlspaces in homes from this era tend to collect moisture; vapor barrier
  failures are common by the time owners are finally ready for a full remodel.

commonProblems:
  - title: "Pierce County PALS Plan Review: The Permit Timeline No One Warns You About"
    description: |
      Pierce County PALS handles permits for Bonney Lake, and plan review on a
      full kitchen remodel or addition runs 4-8 weeks. Submit drawings with
      incorrect FAR calculations or missing setback notes and the application
      kicks back — adding another 3-4 weeks minimum. Getting the structural
      callouts, MEP rough-in layout, and site plan right on the first submission
      is the only way to keep a project on schedule.
  - title: "Demo in a 1992 Rancher Finds Problems the Original Permit Never Showed"
    description: |
      Pull drywall in a 1990s Bonney Lake two-story and notched LVL beams,
      missing blocking, or galvanized supply lines running under the slab can
      stop the project cold. None of that appears on original drawings. A
      contingency budget of 10-15% on $100K+ remodels is not optional.
      Vladislav scopes these surprises during the site walkthrough, not after
      demo has already started.
  - title: "Multi-Trade Scheduling: Getting Framing, Electrical, and Plumbing Right"
    description: |
      A full kitchen gut in Bonney Lake means framing rough-in, electrical
      rough-in, and plumbing rough-in in the correct sequence before drywall
      goes up. Swap the order and you're cutting into cement board to reroute a
      drain. A KitchenAid 36" range with a 600 CFM range hood also needs a
      dedicated 40-amp circuit and makeup air — details that disappear when
      trades aren't coordinated through one person.

faq:
  - q: "How fast can you get to Bonney Lake for General Contracting?"
    a: |
      Bonney Lake is roughly 45 minutes from Seattle via SR-167 south to SR-410.
      Free on-site consultations run weekdays and most Saturdays. Call
      (206) 591-1096 — Vladislav will meet you at the property, not a showroom.
  - q: "Do you work with Sub-Zero, KitchenAid, or Bosch appliances in kitchen remodels?"
    a: |
      Yes — and cabinet layout depends on the specific model. A Sub-Zero 36"
      column refrigerator needs different framing depth and panel spacing than a
      standard KitchenAid French door. Bosch dishwashers often require a
      dedicated circuit addition. Vladislav reviews appliance spec sheets before
      permit drawings go in, not during rough-in.
  - q: "What does a full remodel cost in Bonney Lake, and how is the contract structured?"
    a: |
      Full kitchen or primary bath remodels in 98391 typically run $60K-$130K
      depending on scope and finish level. Quotes are line-item — no vague
      ranges. Deadline penalties are written into the contract. TopVolk is a WA
      Licensed Contractor with 100+ projects completed since 2017. Call
      (206) 591-1096 for a free on-site quote.