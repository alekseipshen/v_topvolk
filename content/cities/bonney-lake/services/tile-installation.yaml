  - q: "Do I need a permit for tile work in Bonney Lake?"
    a: |
      Straight tile replacement — swapping out old wall tile in an existing shower without touching waterproofing, structure, or utilities — does not require a permit in Bonney Lake. Add a heated floor system, relocate a drain, convert a tub to a curbless shower, or move any electrical outlet for a backsplash, and permits are required through the City of Bonney Lake Community Development department. Since Bonney Lake is an incorporated city, those permits go through city building services, not Pierce County PALS. Electrical sub-permits for heated floor circuits are pulled separately. TopVolk handles permit applications as WA Licensed Contractor and coordinates rough-in inspections so nothing gets tiled over before it passes inspection.

  - q: "What's the difference between a curbless shower and a standard curbed shower for tile work?"
    a: |
      A curbless (zero-threshold) shower requires a sloped mortar bed or foam pre-slope panel that directs water to a linear drain without a physical curb to contain it. The waterproofing is more complex — Schluter Kerdi-SHOWER-LS sloped panels or a site-built mortar slope, plus full Kerdi membrane on all surfaces — and the floor tile needs to hit a 1/4-inch-per-foot drain pitch to move water without pooling. A standard curbed shower with a center drain uses a simpler pre-slope under a sheet liner. Curbless builds typically add $800–$1,500 to shower cost and take an extra day of labor for the sloped floor work. They're a common upgrade request in Tehaleh and Lake Tapps custom homes, where aging-in-place accessibility matters to the homeowner.

  - q: "How long does tile work last in Bonney Lake, and what's your warranty?"
    a: |
      Properly waterproofed and installed tile should last 20–30 years in this climate. Bonney Lake doesn't see the hard freeze-thaw cycles that hit Enumclaw or North Bend, but the persistent fall and winter moisture is hard on grout that was mixed thin or never sealed. TopVolk warrants installation workmanship for 2 years — if grout cracks, a niche leaks, or a tile debonds within that window, it gets fixed at no charge. That warranty period is written into the contract, alongside a deadline penalty clause: if the project runs past the agreed completion date due to scheduling on TopVolk's end, penalties are paid out. Materials warranties — Kerdi membrane, Warmup mat, Schluter profiles — follow manufacturer terms, typically running 10–25 years.

