  - q: "What does exterior painting cost in Bonney Lake?"
    a: |
      Exterior painting on a typical Bonney Lake two-story — 1,800–2,600 sq ft of Hardie or cedar shake siding — runs $4,500–$9,000. Story count, siding type, trim complexity, and how much prep work the surface needs are the main cost drivers. Cedar shake with heavy peeling or large bare-wood sections requires more spot priming and caulk work than Hardie that was recently painted. Homes with dormers, raked trim, or multi-color schemes push toward the higher end of that range. Lead-paint testing adds $300–$600 if the home predates 1978. Every estimate is a free on-site visit with a line-item quote — not a range that expands after work starts. Call (206) 591-1096 to book.

  - q: "Does painting in Bonney Lake require a permit through Pierce County PALS?"
    a: |
      Standard residential repainting — interior or exterior — does not require a building permit in Bonney Lake or unincorporated Pierce County. Pierce County PALS handles permits for renovation work in unincorporated areas adjacent to the city, and the City of Bonney Lake runs its own permit center for work within city limits. If a paint project includes siding replacement, window flashing repair, or structural rot repair tied to the exterior prep, that scope typically triggers a permit application. Vladislav can identify what crosses from straight repainting into permitted work on the first site visit. TopVolk is a WA Licensed Contractor and handles both scenarios — straight paint jobs and combination paint-plus-repair projects where permits are involved.

  - q: "Should I use oil-based or acrylic primer on my cedar siding before repainting?"
    a: |
      Oil-based primer penetrates bare cedar and Douglas-fir more deeply than water-based acrylic — it's the right choice for weathered, absorbent, or raw wood. The trade-off: oil-based products take 8–24 hours to dry versus 1–4 hours for acrylic, carry higher VOC levels, and require mineral spirits for cleanup. For Hardie cement-board siding or previously-painted surfaces, a bonding acrylic primer like Zinsser Bulls Eye 1-2-3 works well and speeds the schedule. Most exterior jobs in Bonney Lake use a combination: oil prime on bare or weathered wood, acrylic prime on patched or recently-painted areas, then two coats of Sherwin-Williams Duration as the topcoat. That sequence maximizes adhesion without adding unnecessary dry time between coats.

  - q: "How long does exterior paint last in Bonney Lake, and what's the workmanship warranty?"
    a: |
      Exterior paint life in Bonney Lake depends heavily on exposure. South- and west-facing walls see fading and film degradation around 6–8 years. North-facing walls with consistent moisture and moss accumulation can show adhesion failure in 4–5 years without correct prep. With proper power wash, spot prime, caulk pass, and two-coat acrylic application, 7–10 years is realistic for south and west exposures on Hardie or primed cedar shake. Vladislav writes a three-year workmanship warranty into every contract — peeling, cracking, or adhesion failure from prep or application errors is repaired at no charge. Sherwin-Williams Duration carries a separate lifetime limited product warranty. Climate-related wear, moss regrowth, and substrate movement fall outside workmanship warranty coverage and into normal maintenance.

