commonProblems:
  - title: "Cedar Shake and Hardie Siding Peeling on North-Facing Exposures Near Lake Tapps"
    description: |
      North-facing walls above Lake Tapps sit in shade and rain from October through April — that combination drives moisture into any micro-crack in the paint film, and once water gets behind the coating, peeling follows within one freeze cycle. Cedar shake is the higher-risk substrate: the wood moves seasonally, and if the last painter applied one coat over chalky old paint without an oil-based primer, adhesion failure is already built in. Hardie lap siding holds up better chemically, but caulk joints at windows, corners, and butt joints degrade in 5–7 years and need to be cut out and replaced before repainting — rolling paint over cracked caulk just seals in the failure point. The fix: pressure wash at 1,500–2,000 PSI, spot prime bare wood with Zinsser Bulls Eye 1-2-3, recaulk all penetrations with paintable siliconized acrylic, then two coats of Sherwin-Williams Duration. Budget $4,500–$9,000 for a typical 2,000 sq ft two-story exterior depending on siding type, story count, and trim complexity.

  - title: "Lead-Based Paint in Pre-1978 Homes Along Veterans Memorial Drive"
    description: |
      Older residential pockets in Bonney Lake — particularly around Veterans Memorial Drive and blocks closer to the Sumner 98390 border — include homes built before 1978 that may have lead-based paint on interior trim, window sills, soffits, and exterior siding. Federal EPA RRP rules require a certified renovator to test for lead before any dry scraping, heat-gun stripping, or power sanding begins on a pre-1978 surface. Skipping that step carries fines up to $37,500 per violation per day — and plenty of small painting crews operating in Pierce County skip it routinely. Testing takes about an hour using 3M LeadCheck swabs or an XRF analyzer. Confirmed lead requires plastic sheeting containment, HEPA vacuum cleanup, and regulated waste disposal. Add roughly $300–$600 to a project budget for certified testing and containment setup; Vladislav is familiar with the full EPA RRP compliance workflow for Pierce County jobs.

  - title: "Bathroom and Laundry Room Paint Failure from Chronic Moisture"
    description: |
      Bathrooms and laundry rooms in Bonney Lake's 1990s and 2000s tract homes are frequently painted with standard flat latex — a product that traps moisture and blisters within 2–3 years in rooms with undersized or non-functional exhaust fans. Drywall paper gets saturated, the paint film blisters, and mold develops behind the surface long before the homeowner sees visible damage. Fixing it requires more than a repaint: strip peeling areas back to bare drywall, replace any mold-compromised panels, seal with Zinsser Mold Killing Primer, then apply two coats of a mold-resistant satin. Benjamin Moore Aura Bath & Spa and Sherwin-Williams Emerald are both rated for high-humidity exposure and hold up measurably better than standard interior paint in damp rooms. Exhaust fan CFM should match room square footage — minimum 50 CFM for under 100 sq ft — because undersized ventilation defeats even the best moisture-resistant coating in under two seasons.

  - title: "Cabinet Repainting vs. Full Replacement: What the Numbers Look Like in Bonney Lake"
    description: |
      Full cabinet replacement in a Bonney Lake kitchen runs $15,000–$40,000 depending on box count, semi-custom versus custom, and whether the layout needs to accommodate Bosch or KitchenAid appliance specs. Repainting existing cabinet boxes and doors runs $2,500–$6,500 for a typical kitchen — same color change, a fraction of the cost, and a finish that holds well when done correctly. The process is specific: doors come off hinges, surfaces are deglossed and scuff-sanded with 220-grit, a bonding primer goes on, then two coats of Benjamin Moore Advance or Sherwin-Williams Emerald Urethane Trim for a hard, washable surface. Spray-applied finish leaves no brush marks and dries harder than brushed — a difference that matters on cabinet doors seeing daily contact. Cabinet repainting makes the most sense when box structures are sound and the goal is a color update or eliminating an outdated wood stain.

  - title: "Exterior Color Selection for Pacific Northwest Light and HOA Pre-Approval"
    description: |
      Pacific Northwest light flattens paint colors differently than store swatches suggest. Overcast sky — the default from October through April in Bonney Lake — shifts warm tones gray-blue and reduces contrast between adjacent colors. A chip that reads "warm greige" under store fluorescent lighting can look "cold gray" on a rainy November morning on the actual house. Color selection should always be tested as a 2×2 ft sample patch on the real surface, viewed in both morning and afternoon light, before committing to gallons. HOA communities in Tapps Highland and Bonney Vista typically maintain an approved color list with 3–5 options per architectural element, and some prohibit high-gloss finishes on field surfaces. Vladislav does the color consultation on-site, documents the proposed scheme and sheen level for HOA submission, and flags conflicts with the approved palette before any paint is purchased. Call (206) 591-1096 to schedule.

