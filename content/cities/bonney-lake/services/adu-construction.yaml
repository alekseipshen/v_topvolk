  - q: "What does the ADU permit process look like in Bonney Lake specifically?"
    a: |
      ADU permits in Bonney Lake go through the City of Bonney Lake Building Division —
      not Pierce County PALS, which handles unincorporated county parcels. The permit
      package for a DADU requires a site plan, architectural drawings, structural
      calculations (including LVL beam and PSL post specs if applicable), energy
      compliance documentation, and MEP plans for rough-in layout. Current plan review
      is running 8–12 weeks, with additional time for any correction cycles. Budget
      3–4 months to permit issuance, and 4–7 months total end-to-end for a finished
      DADU. TopVolk prepares and submits the full permit package as the WA Licensed
      Contractor of record — you don't have to navigate the city portal yourself.

  - q: "Should I build a DADU or an attached ADU on my Bonney Lake property?"
    a: |
      Lots near the Lake Tapps corridor with larger rear yards — 8,000 square feet or
      more — often have room for a DADU that provides genuine rental separation: separate
      entry, separate address, easier to finance or sell later. Smaller lots in the older
      neighborhoods near Veterans Memorial Drive frequently hit lot coverage limits before
      reaching a viable DADU footprint, making an AADU the better path. Most 2000s-era
      Bonney Lake homes are slab-on-grade with no basement, which removes the basement
      conversion option from the table entirely. Vladislav walks every lot before
      recommending a direction — the initial site visit is free and covers all three
      options with actual numbers.

  - q: "What warranty comes with a new ADU build from TopVolk?"
    a: |
      Structural framing, foundation, and waterproofing — including vapor barrier, Schluter
      Kerdi in any tiled shower, and RedGard membrane on wet walls — are backed by a
      one-year workmanship warranty on labor and installation. Major structural components
      like LVL beams, PSL posts, joist hangers, and blocking carry the manufacturer's
      structural warranty in addition to that. Appliances — whether a Bosch dishwasher
      or a KitchenAid range — carry their respective manufacturer warranties. Any
      deadline written into the TopVolk contract that isn't met results in a penalty paid
      to you — that's contract language, not a verbal commitment. Hardie cement-board
      siding and composite decking are specified on exterior surfaces because they outlast
      painted wood by 15–20 years in Bonney Lake's wet October-through-May climate.

