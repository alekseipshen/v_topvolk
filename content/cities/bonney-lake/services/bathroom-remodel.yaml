title: "Bonney Lake Bathroom Remodel — Lake Tapps Gut Rehabs"

intro: |
  North-facing walls in the Lake Tapps corridor take a beating — moss, mildew, 37 inches of
  annual rain. That same moisture gets into bathrooms through failed caulk lines and missing
  vapor barriers, and 98391 has a lot of late-1990s builder bathrooms where waterproofing was
  never done right. Moen faucets corroding at the base, cracked grout letting water reach the
  greenboard — these aren't cosmetic problems. They're structural, and they compound quietly.

localContext: |
  Most of Bonney Lake's housing stock went up between 1995 and 2010 — the suburban expansion
  that filled the plateau east of Puyallup with nearly identical floor plans and builder-grade
  finishes. Standard 5×8 baths, fiberglass surrounds, low-flow toilets. Zip code 98391 falls
  under the City of Bonney Lake's own building department — not Pierce County PALS — so bathroom
  permits pull through Bonney Lake Community Development. Plan review on a straightforward remodel
  typically takes 2–4 weeks before rough-in inspection can be scheduled.

commonProblems:
  - title: "Greenboard Behind Late-1990s Tile — Silent Moisture Damage"
    description: |
      Builder-grade greenboard was standard in 98391 bathrooms built between 1995 and 2008.
      It's moisture-resistant paper facing over drywall — not a waterproof membrane. Water
      works behind grout lines for years before tile starts to crack loose, and by then the
      substrate is already compromised. Proper repair means opening to studs and installing
      Schluter Kerdi or RedGard before any new tile goes on.

  - title: "Curbless Shower Conversions Require Slab Work"
    description: |
      Most Bonney Lake master baths were built with a flat concrete slab and a standard
      tub-shower combo. Converting to a curbless walk-in means reforming the floor pitch
      toward a linear drain — usually by cutting and repouring the slab — then tiling with
      large-format porcelain that handles the slope without visible lippage. It's a full
      structural and finish scope, not a cosmetic swap.

  - title: "Undersized Bath Fans and Recurring Mold on Exterior Walls"
    description: |
      Many 2000s-era bath fans in this area were spec'd at 50 CFM for a master bath that
      needs 110 or more. The duct often dumps into the attic void instead of terminating
      outside. Mold on north-facing exterior walls follows. Fix means a Broan or Panasonic
      unit with the right CFM rating, a proper exterior termination, and — sometimes — a
      Schluter vapor barrier retrofit on the shower wall.

faq:
  - q: "How fast can you get to Bonney Lake for Bathroom Remodel?"
    a: |
      Bonney Lake is a straight shot up SR-410 east from Puyallup — about 20 minutes from
      most of our active jobsites. Call (206) 591-1096 and Vladislav will schedule a
      on-site walkthrough directly. No sales staff, no call center.

  - q: "Do you work with Kohler and Toto fixtures on bathroom remodels in this area?"
    a: |
      Both regularly. Kohler Archer soaking tubs and Memoirs toilets show up often in the
      higher-end builds near Lake Tapps. Toto Drake and Nexus units are common in newer
      custom homes. Moen and Delta are solid mid-range choices when the budget is going
      toward tile or a walk-in shower conversion instead of plumbing fixtures.

  - q: "What does a full bathroom gut rehab in Bonney Lake actually cost, and how long does it take?"
    a: |
      A standard full bath remodel in 98391 — tile, waterproofing membrane, new vanity,
      fixtures, lighting — runs $18,000–$35,000 depending on tile selection and whether
      any layout changes are involved. Timeline from permit pull through final inspection
      is typically 5–8 weeks. Master baths with slab work or layout reconfigurations run
      longer. TopVolk Construction is a WA Licensed Contractor with 100+ projects completed
      since 2023 — Vladislav provides line-item quotes, not ballpark ranges, and deadline
      penalties are written into the contract. Call (206) 591-1096.