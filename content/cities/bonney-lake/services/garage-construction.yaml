  - q: "What concrete specifications should a Bonney Lake garage slab meet?"
    a: "At minimum, a residential garage slab should be 4 inches thick, poured with 3,000–3,500 PSI fiber-reinforced concrete over a compacted gravel base of 4 inches or more. In Bonney Lake's glacial till and sandy loam soils, subgrade prep is as critical as the pour itself — soft spots need to be excavated and replaced before forming. A vapor barrier goes under the slab for any conditioned or workshop-use garage. Rigid foam insulation (R-10) under the slab adds meaningful thermal performance if you plan to heat the space. Polypropylene or steel fiber reinforcement reduces cracking more reliably than wire mesh in residential applications. LVL beam sizing for the garage door header and point load design get coordinated with the structural engineer on all permitted projects."

