  - q: "What does entry door replacement cost in Bonney Lake?"
    a: |
      A standard fiberglass pre-hung entry door — same rough opening, no framing changes — runs
      $1,800–$3,200 installed, including new casing, threshold, and weatherstripping. Add
      $400–$900 if the jamb shows rot that requires framing repair. A full patio door conversion
      from slider to French doors, including a new LVL header and City of Bonney Lake permit,
      lands in the $7,000–$14,000 range depending on door width and glass package. Garage door
      replacement with a new LiftMaster opener typically runs $1,500–$3,500. Every TopVolk quote
      is line-item — you see exactly what each piece costs. Free on-site estimates available;
      call (206) 591-1096 to schedule.

  - q: "Do I need a permit to replace a door in Bonney Lake?"
    a: |
      Straight cosmetic replacements — same-size pre-hung unit into an existing rough opening,
      no structural changes — generally don't require a permit through the City of Bonney Lake's
      building department. Widening an opening, converting a window to a door, or installing a
      multi-panel system that requires a new LVL header does require a permit, with plan review
      typically running two to four weeks. TopVolk, as a WA Licensed Contractor, handles permit
      applications and inspector coordination for any structural work — homeowners don't have to
      navigate the process themselves. Tehaleh HOA requires a separate architectural review for
      any exterior door change; that review typically runs one to two weeks and happens in parallel
      with permitting.

  - q: "Fiberglass, steel, or wood — which entry door holds up best in the Bonney Lake foothills?"
    a: |
      For this climate — heavy rain from October through May and real freeze-thaw cycles at
      foothills elevation — fiberglass is the practical choice for most Bonney Lake homes. It
      won't rot, doesn't warp with seasonal moisture cycling the way Douglas-fir or mahogany does,
      and holds finish paint significantly longer than steel (which dents and can develop surface
      rust at the threshold). Therma-Tru's Smooth-Star and Pella's Impervia both perform well
      here; the Smooth-Star can be stained to mimic wood grain, which matters for Tehaleh homes
      where HOA guidelines sometimes specify a natural-wood-look finish. Solid wood is a
      reasonable choice if the overhang provides adequate protection and refinishing every three
      to five years is acceptable. Steel suits garage entries and secondary doors where budget
      matters more than finish longevity.

  - q: "What warranty applies to door installation in Bonney Lake?"
    a: |
      Manufacturer warranties vary by product — Therma-Tru's Smooth-Star carries a limited
      lifetime warranty on the door slab and ten years on the insulated glass seal; Pella's
      Impervia offers comparable coverage. TopVolk's installation workmanship is warranted for
      one year: flashing failures, threshold gaps, or casing separations that trace back to
      installation get corrected at no charge. What the installation warranty doesn't cover:
      foundation settling that pulls the frame out of square after the fact, or finish wear on
      wood doors that weren't maintained on schedule. In the PNW, a quality fiberglass door with
      a factory-applied finish should hold up fifteen to twenty years without refinishing;
      solid wood in this climate typically needs attention every three to five years depending
      on sun exposure and overhang depth.

