  - q: "Does Bonney Lake require a permit for a new fence?"
    a: "Most residential fences don't require a permit in Bonney Lake — the thresholds are 6 feet maximum on side and rear property lines, 4 feet maximum in the front yard setback. A fence that retains a grade change of 4 feet or more triggers a permit through Bonney Lake's Building Division. Properties near unincorporated pockets at the city boundary may fall under Pierce County PALS jurisdiction instead — the parcel's address determines which desk gets the application. TopVolk confirms the correct AHJ before filing anything, so the paperwork goes to the right place on the first submission. Permit review for a fence and retaining wall combination typically runs 3–6 weeks in Pierce County. WA Licensed Contractor on all submitted documentation."

  - q: "How deep should fence posts be set in Bonney Lake's soil?"
    a: "The standard rule is one-third of total post length in the ground — a fence with 6 feet above grade uses an 8-foot post set 24–30 inches deep at minimum. In Bonney Lake's clay-heavy, high-moisture soil, 30–36 inches is the practical standard. Clay soil holds water against the post base longer than sandy or loam soils, accelerating decay on any untreated wood and increasing heave risk during the rare hard freezes that hit the foothills east of town. TopVolk sets posts in 80-lb Quikrete Fast-Setting Concrete, domes the pour at grade to direct surface water away from the post, and uses PT 4x4 or 4x6 posts exclusively for ground contact — no untreated wood below grade regardless of species or grade."

  - q: "How long will a cedar fence last in Bonney Lake, and what's the warranty?"
    a: "A properly built cedar fence — PT posts in concrete, quality cedar boards, correctly spaced rails — will last 15–20 years in western Washington with consistent maintenance (staining or sealing every 3–5 years). Without maintenance, visible graying and checking begin within 5–7 years, and post base decay typically appears around the 10–12 year mark in wet soil. Vinyl fencing (Bufftech carries a limited lifetime warranty against manufacturer defects) typically runs 25–30 years with minimal upkeep. TopVolk warranties all fence installation workmanship for three years — if a post heaves, a rail pulls free, or a gate goes out of square due to installation error, it gets corrected at no charge. Material warranties follow manufacturer terms and are passed through directly to the homeowner."

