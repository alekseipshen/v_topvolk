title: "Puyallup Painting — Cedar, Lead Paint & PNW Exterior Cycles"

intro: |
  The blocks closest to Pioneer Park in downtown Puyallup (98371) have craftsman bungalows from the 1910s and 1920s sitting next to mid-century ranchers that went up during the daffodil boom years. Those older homes share a consistent set of problems: cedar-trimmed exteriors that weather fast in Pierce County's October-through-April rain cycle, original paint that may test positive for lead, and north- and west-facing walls that stay wet long enough to grow moss between repaints. That combination — cedar needing prep every 5-7 years plus potential lead-based paint requiring EPA RRP-compliant containment and cleanup — changes how a painting job gets scoped and priced. Sherwin-Williams Duration or a similar 100% acrylic formula applied over a Zinsser Bulls Eye 1-2-3 primer is a fundamentally different job than rolling another coat over chalking, lead-containing paint without testing first. South Hill, a few miles southeast near the 98374 zip, has its own angle — 1970s and 1980s ranchers with T1-11 or wood lap siding that has been through multiple repaints and is ready for a full strip-and-prime cycle. TopVolk Construction has completed exterior and interior painting as part of remodels across both areas since 2017.

localContext: |
  Puyallup's housing stock splits pretty clearly by zip code. The 98371 area — downtown and the blocks around the Ezra Meeker Historic Site — holds the oldest construction, with post-and-pier Craftsman bungalows and turn-of-century homes where original cedar shake or wood lap siding is still common. Many of those homes have been repainted three, four, five times over the decades, and prep conditions can be rough: layers of oil-based paint over lead primer, soft spots in the wood where moisture crept under a previous coat, glazing compound dried out on original single-pane windows. The 98374 zip covers South Hill, where the bulk of construction happened between 1970 and 1995. Those ranchers typically have T1-11 panel siding or wood lap, and the paint on north-facing elevations often shows mildew and chalk within a few years of a repaint because the walls do not get enough drying sun. Hardie cement-board siding started showing up in Puyallup remodels in the early 2000s and holds paint considerably better — but it still needs two full coats over a quality primer on a 7-10 year cycle. Pierce County gets about 38 inches of rain per year, mostly concentrated fall through early spring.

commonProblems:
  - title: "Cedar Shake and Wood Lap Siding Repaints on Older 98371 Homes"
    description: |
      Cedar shake siding on houses in Puyallup's older downtown core starts showing checking, splitting, and paint peel within 5-7 years of the last coat, especially on north and west elevations where sun exposure is limited and moisture lingers. Prep is the majority of the labor cost — power washing at 1,500-2,000 PSI to remove mold and loose paint, hand scraping tight spots, sanding back peeling edges, and spot-priming bare wood before finish coats go on. A penetrating oil-based primer like Cabot Problem-Solver applied to bare cedar gives the finish coat something to mechanically grip rather than just sitting on the surface. Two coats of Sherwin-Williams Resilience or Duration 100% acrylic follow. Budget $3.00-$5.50 per square foot for a full exterior repaint on cedar shake, depending on prep intensity. On a typical 1,800 sq ft single-story Puyallup bungalow, that works out to $5,400-$9,900 and 5-8 working days start to finish.

  - title: "Lead Paint Testing and EPA RRP Compliance on Pre-1978 Puyallup Homes"
    description: |
      Any Puyallup home built before 1978 — and the downtown 98371 core has a significant concentration of them — can contain lead-based paint, particularly on window sashes, door casings, and exterior trim boards. Federal EPA RRP (Renovation, Repair and Painting) rules require certified renovators to use plastic sheeting containment, HEPA vacuuming, wet wipe-down of all work surfaces, and sealed disposal when disturbing more than six square feet of painted surface in those homes. A lead swab or XRF test on the trim before work starts takes about ten minutes and either confirms or rules out the issue — skipping that step is not a minor oversight, since fines under the EPA RRP rule can run into the thousands per violation. Vladislav Volkov at TopVolk handles lead-paint situations correctly: test first, contain if needed, clean to protocol, document the results. That documentation matters if the home changes hands later.

  - title: "Exterior Paint Failure at Window Trim and Sill Joints on South Hill Ranchers"
    description: |
      Window trim on South Hill ranchers in 98374 — especially homes built between 1965 and 1985 — shows paint failure at the glazing compound joints and at the top sill edge where water sits after rain. Once the paint film cracks at those joints, water wicks into the Douglas-fir or pine trim, raises the grain, and any new coat applied over it peels within two years. The correct fix starts with scraping back to bare wood, treating any gray or softened fiber with a Borate wood preservative, re-glazing single-pane sashes with Sarco glazing compound or DAP 33 Glazing, priming bare wood with an oil-based primer, then applying two finish coats. Straight paint work in Puyallup generally does not require a permit from the City of Puyallup's building department, but if deteriorated trim boards need replacement rather than just repainting, that can change the scope. TopVolk is a WA Licensed Contractor and coordinates permit research when a project requires it.

  - title: "Cabinet Repainting vs. Full Replacement — What the Numbers Actually Look Like"
    description: |
      A full kitchen cabinet replacement in a 1990s South Hill kitchen typically runs $15,000-$45,000 depending on cabinet line and layout complexity. Cabinet repainting — when the box structure and hinge hardware are still solid — runs $1,800-$4,500 for most kitchens and produces a current look without demolition, dust, and a three-week disruption. The process matters more than the paint brand: TSP degreaser wash, light scuff sand on all surfaces, shellac-based primer like Zinsser BIN on any stain-prone areas near the range or under the sink, then two coats of Sherwin-Williams Emerald Urethane Trim Enamel in satin or semi-gloss. That product cures hard enough to handle the cleaning cycles a kitchen sees. Color matching to Benjamin Moore or Sherwin-Williams fan decks keeps the palette cohesive with the room. Timeline for a full kitchen cabinet repaint is 3-5 working days including mandatory dry time between coats.

  - title: "Moisture-Resistant Interior Paint for Puyallup Bathrooms After Remodels"
    description: |
      Bathrooms in older Puyallup homes — particularly the Craftsman stock in 98371 — were often painted with standard flat or low-sheen latex, which holds moisture against the drywall and grows mildew on the ceiling and above the tub surround within a few years. After a bathroom remodel with new tile, a new vanity, and updated fixtures, the paint choice on remaining walls and the ceiling matters more than it looks like it does. Zinsser Mold Killing Primer as a base coat, followed by two coats of Sherwin-Williams Bath Paint or Benjamin Moore Aura Bath & Spa, significantly extends the repaint cycle compared to standard interior latex. Sheen selection matters as well — satin or semi-gloss wipes clean and sheds moisture better than flat or eggshell. Laundry rooms with Bosch or LG front-load machines that exhaust humidity into the space get the same moisture-resistant primer-and-paint spec.

