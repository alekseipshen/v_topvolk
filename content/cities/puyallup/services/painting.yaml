      Puyallup sits right off SR-512, about 25-30 minutes from most of our other Pierce and King County project locations. A free on-site estimate typically schedules within 3-5 business days from first contact. Vladislav comes out in person — not a salesperson running a close — walks the exterior or interior with you, notes prep conditions and any lead-paint concerns, and delivers a written line-item quote with no vague ranges. For exterior jobs that need to get done before the fall rain season sets in, call (206) 591-1096 directly to check current availability and get on the schedule.

  - q: "What does an exterior repaint cost on a Puyallup home?"
    a: |
      Pricing depends heavily on surface condition and siding material. A clean Hardie-sided house needing minimal prep typically runs $2.50-$3.50 per square foot. Cedar shake with real weathering, moss growth, and peeling paint runs $3.50-$5.50 per square foot once power washing, hand scraping, Cabot oil-based primer, and two coats of Sherwin-Williams Duration are factored in. On a typical 1,800 sq ft Puyallup rancher that math works out to roughly $4,500-$10,000 for a complete exterior package. Exact pricing comes from a free on-site estimate — exterior paint jobs do not quote accurately over the phone because prep conditions vary too much from house to house, and a quote without seeing the surface is just a guess.

  - q: "Does the City of Puyallup require a permit for exterior or interior painting?"
    a: |
      Straight painting — no siding removal, no structural changes — generally does not require a permit from the City of Puyallup's building department. If the scope grows to include replacing rotted trim boards, window replacement, or siding repairs beyond simple patching, a permit may be required under the City's building code. Work in adjacent unincorporated Pierce County areas goes through Pierce County PALS (Permit and Land Use Services), which has its own application and review process. TopVolk Construction is a WA Licensed Contractor and handles permit research and application coordination when the project scope calls for it. Call (206) 591-1096 if you are not sure whether your specific project triggers a permit requirement.

  - q: "Do you handle lead paint testing before starting work on older Puyallup homes?"
    a: |
      Yes. Pre-1978 homes in the 98371 downtown core — and a number of the earlier South Hill houses in 98374 — get a lead swab or XRF test before any scraping or sanding begins. If lead is present above regulatory thresholds, EPA RRP protocols apply: poly containment sheeting around the entire work area, HEPA vacuuming of all surfaces, wet wipe-down cleanup after scraping, and sealed disposal of sanding debris and paint chips. This is a federal requirement, not an optional upgrade. Vladislav handles the process correctly and documents the test results and cleanup steps in writing. That documentation matters if the home is sold or refinanced in the future, and it protects both the homeowner and the contractor from liability.

  - q: "How long should exterior paint last on a Puyallup home, and what shortens the lifespan?"
    a: |
      A properly prepped and painted exterior in Pierce County should hold 7-10 years on Hardie cement-board siding and 5-7 years on cedar shake, given two finish coats of 100% acrylic over a quality primer. North- and west-facing walls fail first because of sustained moisture exposure and limited drying sun between October and April. Painting over dirty, chalking surfaces — or skipping the primer coat to save a day of labor — cuts that lifespan to 3-4 years, sometimes less. Sherwin-Williams Duration and Benjamin Moore Aura Exterior both carry manufacturer warranties, but those require documented proper application to be valid. TopVolk's contracts include a written deadline with penalties paid if the project runs late — not just an apology and a vague reschedule.

