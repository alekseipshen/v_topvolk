title: "Puyallup Window Installation — Built for PNW Rain"

intro: |
  Historic bungalows along 4th Avenue NW in downtown Puyallup carry original
  wood-sash windows that have been absorbing Pacific Northwest rain for 80-plus
  years — failed glazing compound, painted-shut sashes, and frames wicking
  moisture straight into the rough opening framing. The Puyallup River valley
  averages close to 40 inches of rain annually, and that load runs October
  through May without much of a break. South Hill, out in the 98374 zip code,
  has a different failure: the builder-grade double-pane vinyl units from the
  late-1990s subdivisions off Canyon Road are hitting 25-30 years old with
  visible seal failure. Fogged glass between the panes is a dead IGU (insulated
  glass unit), not a cleaning problem. Milgard's Tuscany Series drops into most
  of those South Hill rough openings without structural modification and carries
  a lifetime limited warranty for Washington homeowners. Getting the flashing
  and sill pan detail right at installation is what separates a 30-year window
  from one that quietly rots king studs before you ever see staining on the
  inside wall.

localContext: |
  Downtown Puyallup and the blocks around Pioneer Park (98371) carry a dense
  mix of pre-war Craftsman bungalows from 1910-1940 and post-war ranchers that
  got aluminum replacement windows sometime in the 1970s. Both present the same
  challenge: non-standard rough opening dimensions and, in the Craftsman homes,
  divided-light grille patterns that matter visually to the streetscape. Matching
  a 3-over-1 or 4-over-4 SDL (simulated divided light) grille on a replacement
  window takes more specification work than ordering a stock unit off the shelf.
  South Hill and the plateau areas in 98374 and 98375 are mostly 1985-2005 tract
  construction — larger rough openings, standard-size vinyl, but with 20-30
  year old spacer bars, degraded low-e coatings, and hardware that's starting to
  bind. Pierce County PALS (Permit and License System) handles building permits
  for this area; a straight swap-for-swap window replacement in the same opening
  typically falls under exemption from full plan review, but any egress window
  that enlarges a rough opening always requires a Pierce County building permit
  because you're modifying the structure and must meet IRC Section R310
  net clear opening minimums.

commonProblems:
  - title: "Fogged Double-Pane Glass in South Hill's 1990s Builder Windows"
    description: |
      Fogged glass between the panes means the desiccant inside the spacer bar
      is saturated and the argon fill has leaked out — the IGU seal failed, and
      no amount of cleaning from either side fixes it. South Hill subdivisions
      built between 1988 and 2002 (zip 98374) came standard with builder-grade
      vinyl frames and aluminum spacer bars, which conduct cold and accelerate
      seal failure through years of condensation cycling. Replacing just the IGU
      glass pack in the existing frame is possible when the frame and sash are
      still square and the vinyl hasn't gone brittle — that typically runs
      $150-$250 per sash for a direct glass replacement. If the frame is racked
      or the hardware is failing too, a full unit replacement with a Milgard
      Tuscany or Simonton 5500 makes more sense and runs $400-$700 per window
      installed depending on size and series.

  - title: "Flashing Failure and Rot at the Head and Sill — Where Windows
      Actually Leak"
    description: |
      Water intrusion around windows in Puyallup almost never comes through the
      glass itself. It comes through the head flashing or the sill pan —
      Z-flashing lapped wrong, flexible flashing tape that delaminated after
      15 years, or a sill pan with no back-dam letting water pool against the
      framing. In a 1920s Craftsman bungalow near the Washington State
      Fairgrounds with the original wood lap siding, a failed sill pan can mean
      2-3 inches of saturated fiberglass batt insulation and soft king studs
      before any interior staining shows up. Replacing the window without
      addressing the rot just extends the damage cycle. The fix means pulling
      back the siding, sistering any compromised jack or king studs with
      pressure-treated lumber, installing a proper sill pan with back-dam, and
      running Huber ZIP System tape or DuPont FlexWrap at the rough opening
      corners before the new unit seats in.

  - title: "Egress Window Installs in Basement Bedrooms Need Pierce County
      Permits"
    description: |
      Calling a basement space a legal bedroom requires a code-compliant egress
      window. IRC Section R310 sets the minimum at 5.7 square feet net clear
      opening — 44 inches minimum height, 20 inches minimum width, sill no
      higher than 44 inches above finished floor. In a typical 1960s Puyallup
      rancher or a South Hill split-level, the existing basement windows are
      hopper or slider units around 12 by 24 inches. Nowhere near egress-
      compliant. Enlarging the rough opening requires cutting the foundation
      wall or rim joist area, which triggers a Pierce County PALS building
      permit without exception. Plan on a 2-4 week review timeline through the
      City of Puyallup permit center. TopVolk Construction is a WA Licensed
      Contractor — permit application, structural detail coordination, and
      inspection scheduling are included in the project scope. Budget
      $1,800-$3,500 per egress window, with window well excavation on the higher
      end.

  - title: "Vinyl vs. Fiberglass — Getting the Material Choice Right for
      Puyallup's Climate and Budget"
    description: |
      Vinyl wins on price; fiberglass wins on long-term dimensional stability.
      Puyallup sits at moderate elevation with more moisture than the Cascade
      foothills but real freeze-thaw cycling in winter — vinyl frames expand
      and contract measurably through seasons, which can work sash hardware
      loose over two decades. Fiberglass frames like Pella Impervia or Milgard
      Fiberglass Series have roughly the same thermal expansion coefficient as
      the glass itself, keeping the IGU seal tighter longer. For a full house
      of 15-20 windows in a South Hill home, vinyl typically runs $8,000-$14,000
      installed. Fiberglass runs 30-50% more — $12,000-$22,000 for the same
      count. For a mid-century rancher in 98371 where the existing windows are
      standard double-hung, vinyl is a reasonable 20-year decision. For a
      historic home near Pioneer Park where frame precision and divided-light
      detailing matter, the fiberglass premium is worth it.

  - title: "SR-512 and BNSF Rail Noise — When Standard Double-Pane Glass
      Isn't Enough"
    description: |
      The BNSF main line runs right through the Puyallup valley floor, and
      SR-512 cuts east-west across the city. Homes within a few blocks of
      either corridor — particularly older neighborhoods north of downtown near
      Riverside Drive — deal with low-frequency rail rumble and highway drone
      that standard double-pane IGUs handle poorly. A typical matched
      double-pane unit lands around STC (Sound Transmission Class) 28-30.
      Laminated acoustic glass, which sandwiches a PVB (polyvinyl butyral)
      interlayer between the panes, pushes that to STC 35-38 without going to
      triple-pane weight and cost. Milgard and Pella both offer laminated glass
      as an upgrade within their standard vinyl frame lines. The cost premium
      is roughly $60-$120 per window over standard IGU. For the 10-12 windows
      facing the noise source, that's a $700-$1,500 upgrade that makes a
      genuine difference in a bedroom or living room facing the tracks.

faq:
  - q: "How fast can you get to Puyallup for a window installation estimate?"
    a: |
      Puyallup is typically 35-45 minutes from our base, depending on I-5 and
      SR-512 conditions — we schedule estimates in Puyallup regularly and can
      usually get out within a week of your call. The on-site estimate is with
      Vladislav directly, not a salesperson, and you get a written line-item
      quote before any commitment is made. For a straight window swap-out with
      no structural work, installation typically starts 2-3 weeks after signing.
      Egress window projects or anything requiring Pierce County PALS permits
      add permit lead time on the front end, usually 2-4 weeks. Call
      (206) 591-1096 to schedule.

  - q: "What does window replacement cost in Puyallup?"
    a: |
      A single window replacement in an existing rough opening — same size,
      no structural changes — runs $400-$750 installed for a standard vinyl
      unit like Milgard Tuscany or Simonton 5500. Fiberglass units like Pella
      Impervia run $650-$1,100 per window installed. Full house replacement of
      15-20 windows typically comes in at $9,000-$18,000 depending on count,
      size, and material. Egress window installs that require opening enlargement
      and a window well start around $1,800 and reach $3,500 with significant
      concrete cutting or excavation. Pricing is fixed per the written quote —
      no change orders without a signed scope amendment. Schedule a free on-site
      estimate by calling (206) 591-1096.

  - q: "Do I need a permit for window replacement in Puyallup?"
    a: |
      A straight swap-for-swap replacement in the same rough opening — no
      structural changes, same unit type — typically doesn't require a City of
      Puyallup building permit. Any work that modifies the rough opening size,
      adds a new window where none existed, or requires header modification does
      require a permit through the City of Puyallup Building Department. For
      properties in unincorporated Pierce County surrounding Puyallup, Pierce
      County PALS handles permit review. Residential window permits in Puyallup
      typically clear plan review in 2-4 weeks. TopVolk Construction is a WA
      Licensed Contractor — we prep the permit application and handle inspection
      scheduling so you're not chasing the permit counter yourself.

  - q: "Can you match the divided-light window grilles on my older Puyallup
      Craftsman?"
    a: |
      Most major manufacturers offer SDL (simulated divided light) grille
      configurations in standard patterns — 3-over-1, 4-over-4, 6-over-6, and
      custom — with a spacer bar between the exterior and interior grille
      pieces that gives a deeper shadow line than a snap-in flat grille.
      Milgard, Pella, and Marvin all offer SDL options within their replacement
      window lines. For a downtown Puyallup Craftsman bungalow near Pioneer
      Park, getting the grille configuration correct is worth the added 2-3
      week lead time on a custom order — the detailing reads in that
      neighborhood. Grille pattern gets spec'd from your existing windows and
      confirmed before anything is ordered.

  - q: "What warranty comes with windows installed by TopVolk in Puyallup?"
    a: |
      Milgard windows — Tuscany, Style Line, and Fiberglass series — carry a
      Full Lifetime Warranty for the original purchaser in Washington State,
      covering glass seal failure, hardware, and frame defects. Pella and Marvin
      offer limited lifetime warranties with comparable seal and frame coverage.
      Our installation labor carries a separate 2-year workmanship warranty —
      if flashing fails or a window leaks due to installation detail, we return
      and correct it at no charge. What isn't covered by any manufacturer:
      damage from structural settlement, impact, or deteriorated adjacent siding
      that wasn't addressed at installation. That's why we document the rough
      opening condition in photos before closing anything up.

