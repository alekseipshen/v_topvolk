title: "Puyallup HVAC — Heat Pumps, Mini-Splits & Duct Work for 98371–98374"

intro: |
  State Fair weekend fills Puyallup every September, but the rest of the year
  this is a working residential city where a large share of the housing —
  especially in the Meeker District and the older blocks near Pioneer Park —
  was built without any cooling system at all. Gas furnace, floor registers,
  done. That design made sense in 1962, but Pierce County summers now push
  into the 90s regularly, and those crawlspace-heavy homes hold moisture from
  October through April. Vladislav Volkov at TopVolk Construction LLC has
  completed HVAC projects across Pierce, King, and Snohomish counties since
  2023, and Puyallup comes up often — particularly the 98372 corridor where
  post-war ranchers still run original ductwork that hasn't been touched in
  decades. A Mitsubishi MXZ multi-zone mini-split handles the cooling retrofit
  in those houses cleanly, because you're not fighting 60-year-old undersized
  ducts. South Hill residents in 98374 face a different problem: newer
  forced-air systems sized only for heat, with window units running every
  July. Call (206) 591-1096 to schedule a free on-site walk-through with
  Vladislav directly — no call center, no sales rep.

localContext: |
  Puyallup's housing breaks into two distinct eras. Everything within about a
  mile of downtown — zip code 98371, streets near the Ezra Meeker Mansion and
  the blocks running off Meridian Avenue — was built between roughly 1920 and
  1970. Those homes have crawlspace foundations, original sheet-metal ductwork
  in some cases, and gas furnaces that are frequently 20-plus years old. The
  north-facing lots near Bradley Lake Park stay wet through the rainy season,
  and that crawlspace moisture gets drawn up into ductwork, degrading
  insulation and growing mildew in the supply plenum. Out in 98373 and 98374
  — the South Hill and Canyon Road corridors — construction was mostly 1990s
  to early 2000s builder-grade: functional duct runs, gas furnace, no
  cooling, no zoning. Pierce County PALS handles mechanical permits for both
  city of Puyallup and unincorporated South Hill, and plan review for a heat
  pump installation typically runs two to four weeks. TopVolk pulls and
  manages those permits directly — homeowners don't have to navigate the PALS
  portal on their own.

commonProblems:
  - title: "Heat Pump Conversion on 1960s Gas Systems Near Downtown 98371"
    description: |
      Older homes in the Meeker District were built with gas furnaces and
      undersized return ducts — a combination that causes real problems when
      you retrofit a modern heat pump air handler. The existing return duct
      static pressure has to match the new air handler's ESP (external static
      pressure) rating, or you get airflow noise, hot spots, and reduced
      SEER2 efficiency from day one. TopVolk typically installs a Carrier or
      Lennox 18 SEER2 heat pump paired with duct modifications: adding a
      second return plenum, installing a new filter box, and rebalancing
      supply registers with a flow hood. With the Inflation Reduction Act 25C
      tax credit and Puget Sound Energy rebates, homeowners in 98371 can
      recover $2,000–$3,200 of the total install cost. Full gas-to-heat-pump
      conversions in this zip — including electrical panel work for the new
      240V circuit — typically run $12,000–$18,000.

  - title: "Ductless Mini-Splits for Additions and DADUs in South Hill (98374)"
    description: |
      South Hill additions and detached ADUs on existing lots can't easily
      tie into the main home's duct system. Trunk lines were sized to the
      original square footage, and extending them causes pressure drop
      throughout the whole house — the room farthest from the air handler
      stops getting adequate airflow. A Mitsubishi MXZ multi-zone system
      solves this cleanly: one outdoor condenser manages up to five indoor
      heads, each independently zoned, with no ductwork required at all.
      Installation involves mounting the indoor head, drilling a 3-inch core
      penetration through the rim joist or exterior wall for the refrigerant
      line set, and routing a condensate drain line. Under WA HB 1337, a
      new DADU qualifies as a separate dwelling, and Pierce County PALS
      requires its own mechanical permit for the HVAC scope. Single-zone
      Mitsubishi ductless installs run $4,500–$7,500. Multi-zone systems with
      three or four heads land in the $12,000–$18,000 range depending on
      line-set length and head placement.

  - title: "Ductwork Sealing and Rebalancing in 98372 Post-War Ranchers"
    description: |
      The 1950s and 1960s ranchers in 98372 — neighborhoods off Pioneer
      Avenue East and near Spinning Wheel Drive — have sheet-metal duct
      systems that were never sealed at the joints. Crimped connections open
      up over decades. A blower door test on a typical 1,400-square-foot
      rancher here will show duct leakage of 25–35%, meaning roughly a third
      of your heated air is going into the crawlspace instead of the rooms.
      TopVolk seals ducts with Aeroseal or mastic sealant applied at every
      boot, joint, and plenum seam, then rebalances supply registers using a
      flow hood to bring each room within 10% of its target CFM. The full
      process takes one to two days and typically costs $1,800–$3,500
      depending on duct access and complexity. Pierce County PALS doesn't
      require a permit for duct sealing alone, but replacing the air handler
      or furnace triggers a full mechanical permit — TopVolk handles that
      paperwork as part of the project scope.

  - title: "High-Efficiency Furnace Replacement and Condensing Vent Rerouting"
    description: |
      Swapping a 1990s 80% AFUE furnace for a 96% AFUE condensing unit sounds
      straightforward, but the venting changeover is where most jobs get
      complicated. An 80% furnace uses a B-vent flue running through the
      attic. A 96% condensing unit vents through PVC sidewall penetrations at
      the rim joist or foundation wall, with a separate condensate drain line
      routed to a floor drain. In Puyallup's crawlspace homes, routing that
      condensate drain is often the trickiest part of the rough-in. TopVolk
      handles the full mechanical rough-in, installs an Ecobee smart
      thermostat as standard for zoning compatibility, and coordinates the
      Pierce County PALS rough-in and final inspections. A 96% AFUE gas
      furnace replacement in a 1,600–2,200 square foot Puyallup home
      typically runs $5,500–$8,500, including permit and inspection fees.
      Missed inspection milestones are covered by a deadline penalty clause
      written into the contract.

  - title: "Adding Central AC to Existing Forced-Air Systems in 98373"
    description: |
      Canyon Road and South Meridian homeowners in 98373 call about adding
      central AC to an existing gas furnace fairly often. The problem is that
      1990s furnace contractors sized those duct systems for heating only.
      Dropping a 3-ton evaporator coil into a system with trunk lines rated
      for 2.5 tons creates airflow noise, compressor short-cycling, and
      premature equipment wear. TopVolk runs a Manual J load calculation and
      a duct leakage test before any equipment gets ordered — that determines
      the actual cooling load and whether the existing ductwork can carry it.
      In many 98373 homes, a 2-ton Daikin DX unit matches duct capacity
      better than the 3-ton the homeowner initially assumed they needed. AC
      addition on existing forced air in Puyallup runs $5,000–$9,000
      depending on equipment size, line-set length, and whether duct
      modifications are needed to properly support cooling airflow.

faq:
  - q: "How fast can you get to Puyallup for an HVAC estimate?"
    a: |
      Puyallup is roughly 35–45 minutes from the south end of King County via
      SR-167 — close enough that TopVolk schedules Puyallup estimates
      alongside South King County work without extra travel fees. Slots
      typically open within three to five business days for a free on-site
      walk-through, and Vladislav Volkov does the estimate himself, not a
      commissioned closer. No-heat calls in January and no-cooling calls in
      July move faster. Call (206) 591-1096 directly. Estimate-to-permit-
      submittal is usually within one week for straightforward furnace
      replacements; heat pump conversions take one to two weeks to scope once
      we have panel specs and utility account info confirmed.

  - q: "What does a heat pump installation cost in Puyallup?"
    a: |
      Full gas-to-heat-pump conversions in Puyallup's older housing — air
      handler, outdoor unit, 240V electrical circuit, and duct modifications
      — typically run $12,000–$20,000 depending on home size and duct
      condition. If leakage testing shows the existing ductwork is in decent
      shape, costs come in at the lower end of that range. Inflation Reduction
      Act 25C credits cover 30% of equipment costs up to $2,000, and Puget
      Sound Energy rebates can add another $800–$1,200 on top. Mitsubishi and
      Daikin ducted heat pumps are the most common choice in this price range.
      TopVolk provides a line-item quote before any work starts — equipment,
      labor, permit fees, and inspection costs all broken out separately. No
      vague estimates, no surprise line items at the end.

  - q: "Do you pull Pierce County PALS mechanical permits for HVAC work in Puyallup?"
    a: |
      Yes — on every job that requires one. Furnace replacements, heat pump
      installs, mini-split systems, and any ductwork tied to new equipment all
      trigger a mechanical permit through Pierce County PALS. TopVolk submits
      applications directly through the PALS portal, coordinates the rough-in
      inspection after refrigerant lines and electrical rough-in are complete,
      and schedules the final inspection once the system is commissioned and
      tested. Homeowners don't need to track any of that. Plan review for a
      new heat pump typically takes two to four weeks; simple furnace
      replacements sometimes move faster. TopVolk is a WA Licensed Contractor
      — mechanical permits pull under that license, and permit fees are
      included in the project quote upfront.

  - q: "Can you install a Mitsubishi mini-split without opening up finished walls or ceilings?"
    a: |
      Almost always, yes. A wall-mounted Mitsubishi MSZ head mounts high on
      an interior or exterior wall — the refrigerant line set runs through a
      3-inch core drill through the exterior wall to the outdoor condenser,
      and the penetration gets covered with a line-hide raceway on the outside
      for a clean finish. No ductwork, no ceiling demo, no drywall patching.
      Condensate drains by gravity in most cases; basement rooms may need a
      small condensate pump if there's no natural drain path. The 240V
      dedicated circuit requires coordination with a licensed electrician,
      which TopVolk handles as part of scheduling. A single-zone Mitsubishi
      MSZ installation typically takes one full day. Multi-zone systems with
      three or four heads run one to two days depending on line-set routing.

  - q: "What warranty covers a new heat pump or furnace installation in Puyallup?"
    a: |
      Equipment warranties are manufacturer-issued. Mitsubishi covers heat
      pump compressors for 12 years when installed by a registered contractor
      and registered in the homeowner's name — which TopVolk does on every
      job at installation, not in the contractor's name. Carrier and Lennox
      offer 10-year parts warranties on registered equipment. TopVolk's
      labor warranty covers installation workmanship for three years: if a
      refrigerant line connection leaks or a condensate drain was pitched
      wrong, that gets corrected at no charge. Manufacturer warranties don't
      cover freeze damage or power-surge damage, so adding a whole-home surge
      protector on heat pump installs is worth the $300–$500. TopVolk has
      completed 100+ projects across the Seattle Metro since 2023 — warranty
      calls are handled by the same person who did the install.

  - q: "Do you cover Tacoma and other nearby Pierce County cities for HVAC work?"
    a: |
      Yes — Tacoma, Fife, Milton, Edgewood, and Sumner are all within the
      regular service area. Bonney Lake and Buckley are at the eastern edge
      of the coverage zone; those jobs work but need a bit more lead time.
      Tacoma work inside city limits runs through the City of Tacoma's own
      permit center rather than Pierce County PALS — same process, different
      portal, and TopVolk handles both. Auburn and Renton on the King County
      side are also covered regularly. Call (206) 591-1096 or request a free
      on-site estimate through the website. Vladislav coordinates every
      project personally — if you have a heat pump question or need duct
      sealing anywhere in Pierce County, you're talking to the contractor who
      will be on site, not a dispatcher relaying messages.