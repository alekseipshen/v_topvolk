title: "Puyallup Deck Installation — Built for Pierce County Rain"

intro: |
  Pioneer Park anchors downtown Puyallup, and homes in 98371 show their age — cedar decks from the 1980s splitting at the grain, ledger boards pulling away from the rim joist, moss on north-facing surfaces by November. South Hill subdivisions from the 90s have the same problem with undersized builder framing. If you're putting a Weber grill and outdoor furniture on it year-round, TimberTech composite holds up to Pierce County rain without annual sealing.

localContext: |
  Puyallup's housing falls into two clear eras. In 98371 and 98372 — closer to downtown and the Puyallup River — homes from the 1950s through 1980s often sit on post-and-pier foundations with original ledger connections that predate modern flashing requirements. East into 98374 and 98375, South Hill subdivisions from the 1990s feature builder-grade pressure-treated decks: undersized joists, no blocking, no drainage planning. Both types need different structural approaches when it's time to rebuild.

commonProblems:
  - title: "Ledger Board Rot Where the Deck Connects to the House"
    description: |
      The ledger board carries deck load at the rim joist connection. Without Z-flashing or Vycor tape behind it, water infiltrates and rots the rim joist from the inside — often invisible until the deck shifts or separates. Pierce County PALS requires a ledger flashing inspection specifically because this failure mode is common in older Puyallup homes. Repairing a rotted rim joist adds $1,500–$3,000 before any decking goes down.
  - title: "Post Footings Installed Above the Frost Line"
    description: |
      Pierce County's frost depth runs 12–18 inches. Decks in South Hill's 98374 subdivisions often have posts set in surface concrete with no proper footings — they heave with freeze-thaw cycles and rack the structure over time. Correct installation means footings poured to depth, 6x6 ground-contact pressure-treated lumber, and Simpson Strong-Tie post bases keeping the wood above standing water.
  - title: "Cedar vs Composite — Which Actually Holds Up in Puyallup"
    description: |
      Cedar grays and checks within two to three seasons on north-facing surfaces without annual sealing. Trex composite doesn't require sealing, resists mold, and holds color over a decade. It runs roughly 30–40% more per square foot than cedar. For most homeowners in 98372 who realistically skip the yearly maintenance cycle, the math favors composite from year one.

faq:
  - q: "How fast can you get to Puyallup for Deck Installation?"
    a: "Puyallup is about 40 minutes south on SR-167. Consultations in the 98371–98375 corridor can usually be scheduled within a week. Call (206) 591-1096 to set something up with Vladislav directly — deadline penalties are written into every contract."
  - q: "Do you work with Trex or TimberTech composite decking?"
    a: "Both. Trex Enhance and Select are solid mid-range options for most budgets. TimberTech AZEK runs higher-end with better color retention over 15–20 years. The right call depends on how long you're staying in the house. Cedar is still available for clients who want natural wood and will maintain it."
  - q: "What does a deck permit in Pierce County involve, and how long does it take?"
    a: "Pierce County PALS handles permits for Puyallup addresses. A standard deck permit covers structural plan review, footing inspection, framing inspection, and final inspection — budget 4–8 weeks for approval. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023. Vladislav handles the permit application as part of the project scope."