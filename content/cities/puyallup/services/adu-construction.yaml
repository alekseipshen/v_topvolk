title: "Puyallup ADU Construction — DADU & Attached ADU Builds"

intro: |
  South Hill has some of the most affordable large-lot single-family housing left in Pierce
  County — and a lot of those 8,000-to-12,000-square-foot lots in 98374 and 98375 have enough
  room for a 600-square-foot DADU in the backyard without touching the main house. WA HB 1337,
  the 2024 statewide ADU law, opened the door further: most single-family lots in Puyallup now
  qualify for up to two ADUs — a detached unit out back, a basement conversion below, or an
  attached addition on the side. That's a meaningful shift for homeowners near Pioneer Park and
  throughout the Meeker district who've been sitting on rental demand and undersized income.
  Vladislav Volkov at TopVolk Construction LLC has built DADUs, basement conversions, and
  attached ADUs across Pierce, King, and Snohomish counties since 2017 — 100+ projects total.
  A Mitsubishi mini-split keeps a well-insulated ADU heated and cooled independently, no tie-in
  to your main house HVAC required. Call (206) 591-1096 to schedule a free on-site consultation
  directly with Vladislav.

localContext: |
  The housing stock in Puyallup spans a wide range. Downtown Puyallup (98371) holds Craftsman
  bungalows and post-WWII ranchers from the 1920s through 1950s — many with post-and-pier or
  poured concrete foundations that weren't designed for load additions. Those older structures
  often work better with an attached ADU or basement conversion than a new DADU tucked into a
  narrow backyard. South Hill (98374, 98375) reads differently: 1970s-1990s tract homes on lots
  that typically run 9,000 square feet or larger, with detached garages that either get converted
  in place or removed for a ground-up DADU build. Pierce County PALS handles ADU permits for
  unincorporated areas like much of South Hill, while properties inside Puyallup city limits go
  through the city's own permit center. Plan review for an ADU runs 8-12 weeks either way. PNW
  rainfall — roughly 37 inches annually — means vapor barriers in crawlspaces, PT lumber on any
  ground-contact framing, and proper drainage at the foundation are standard on every build here,
  not optional line items.

commonProblems:
  - title: "DADU vs. Attached ADU vs. Basement Conversion — Figuring Out What Actually Fits Your Lot"
    description: |
      Many Puyallup homeowners want a detached ADU until the setback math doesn't work. Pierce
      County's standard rear setback for a DADU typically runs 5 feet from the property line,
      with a 24-foot height limit, and lot coverage — including all existing structures — often
      caps at 35-40% in residential zones. On a South Hill lot in 98374 with an older detached
      garage already consuming backyard space, the buildable DADU footprint can shrink to under
      400 square feet after FAR calculations. An attached ADU or below-grade basement conversion
      sidesteps those footprint constraints entirely. Basement conversions require upgrading the
      existing rim joist and sill plate framing to current IRC egress standards — code-compliant
      window wells, minimum clear opening dimensions — plus a vapor barrier and DriCore subfloor
      panel system over the concrete slab if moisture is present. We pull the actual zoning data
      for your parcel before the first meeting. No surprises.

  - title: "Pierce County PALS Permit Timeline — What to Expect and How to Avoid Getting Kicked Back"
    description: |
      ADU permits in Puyallup run through two systems. Properties inside city limits use
      Puyallup's own Community Development permit center. Unincorporated South Hill — zip codes
      98374 and 98375 — goes through Pierce County PALS (Permit and License System). Either route
      requires a full submittal package: site plan showing setbacks and lot coverage, architectural
      drawings with floor plan and elevations, structural calculations for any LVL beam or PSL
      post work, and MEP (mechanical, electrical, plumbing) plans. Pierce County PALS plan review
      for an ADU currently runs 8-12 weeks on a complete package. Incomplete submittals get kicked
      back and reset the clock by a full cycle. TopVolk prepares permit documents in-house,
      coordinates directly with the AHJ, and schedules rough-in inspections. The permit submittal
      deadline is written into your contract — miss it, and there's a financial penalty on our
      end. That's in the paperwork, not a verbal promise.

  - title: "Separate Utility Connection vs. Shared Service — Real Cost Difference in Puyallup"
    description: |
      Separate water and sewer service for a DADU or sharing the existing connection — it's one
      of the larger cost decisions in any ADU project. Puyallup is served by Pierce County
      Utilities and the city's own water system. A separate meter requires a new tap at the main,
      which runs $8,000-$15,000 for just the utility connection and meter set before any interior
      rough-in plumbing work begins. Shared connections cost less upfront but complicate rental
      management and future property sale. For hot water service, a Navien NPE-series tankless
      water heater mounted in the ADU mechanical closet keeps everything independent without the
      footprint of a storage tank. Gas service extension requires a separate Pierce County utility
      coordination and its own permit. Both options get mapped out with actual line-item costs at
      the on-site estimate — specific numbers based on your lot and connection distance, not
      ranges that shift when the contract arrives.

  - title: "What ADU Construction Actually Costs in Puyallup — and What Moves the Number"
    description: |
      A detached ADU in Puyallup typically runs $180,000-$280,000 for a 600-800 square foot unit,
      fully permitted and finished. That range shifts based on lot conditions, utility connection
      distances, foundation type (slab vs. crawlspace with PT lumber stem walls), and finish
      level. A crawlspace foundation on a sloped South Hill lot adds cost over a flat slab — more
      concrete work, vapor barrier installation, and rim joist framing. Interior finish choices
      move the number significantly too: Bosch appliance packages versus builder-grade, Schluter
      Kerdi waterproofing membrane in the shower versus standard thinset, large-format porcelain
      tile versus ceramic — those decisions alone can shift cost by $15,000-$25,000. Attached ADU
      additions run $120,000-$180,000. Basement conversions typically land at $80,000-$140,000
      depending on scope and egress work. TopVolk provides line-item quotes with specific numbers,
      not ballpark figures you'll negotiate against later.

  - title: "PNW Climate and ADU Durability — What Gets Missed on Cheaper Builds"
    description: |
      Pierce County sees roughly 37 inches of rain per year, and Puyallup's proximity to the
      Cascade foothills means freeze-thaw cycles hit harder than they do closer to the Sound. A
      DADU built without correct flashing details at the ledger board connection, or with wood
      siding over inadequate housewrap, starts showing moisture infiltration within 3-5 years.
      Hardie cement-board siding holds up significantly better than vinyl or cedar in this
      climate — it doesn't absorb water, resists the mildew that accumulates on north-facing
      walls, and carries a 30-year manufacturer warranty. R-49 insulation in the ceiling and
      continuous exterior foam sheathing reduce heating loads, which matters when a Mitsubishi
      MXZ mini-split is the only mechanical system in an 800-square-foot DADU. Vapor barriers
      in the crawlspace, proper blocking at the rim joist, and sealed penetrations aren't extras
      here — they're what separates a 10-year building from a 40-year one.

faq:
  - q: "How fast can you get to Puyallup for an ADU consultation?"
    a: |
      Puyallup is about 30-35 minutes south of Seattle on I-5 or SR-167, so we're in the area
      regularly. Call (206) 591-1096 and the first step is a free on-site visit with Vladislav
      directly — not a call center, not a coordinator. That visit typically schedules within 3-5
      business days. From there, if the project moves forward, permit preparation takes 2-4 weeks,
      Pierce County PALS plan review runs 8-12 weeks, and construction on a new DADU takes 3-5
      months post-permit. Total end-to-end — first site visit through final inspection — is
      typically 5-7 months for a detached ADU. Basement conversions and attached ADUs move faster,
      often completing in 3-4 months total.

  - q: "What does ADU construction cost in Puyallup?"
    a: |
      A detached ADU in Puyallup typically runs $180,000-$280,000 for a 600-800 sq ft unit —
      permitted, finished, and ready to rent. Attached ADU additions come in at $120,000-$180,000,
      and basement conversions run $80,000-$140,000 depending on scope and required egress work.
      Utility connection costs — new water meter tap, gas extension — add $10,000-$20,000 on top
      of construction depending on distance from the main. Call (206) 591-1096 for a free on-site
      estimate. After seeing your lot and existing structure, TopVolk provides a line-item quote
      with specific numbers — not a range that shifts when the contract shows up.

  - q: "What's the permit process for an ADU in Puyallup or unincorporated Pierce County?"
    a: |
      Properties inside Puyallup city limits permit through the city's Community Development
      department. Unincorporated South Hill (98374, 98375) goes through Pierce County PALS. Both
      require a full package: site plan, architectural drawings, structural calculations for LVL
      beam or PSL post work, and MEP plans. WA HB 1337 (2024) removed most local barriers —
      nearly all single-family lots now qualify and jurisdictions can't use design review to block
      a standard ADU approval. Plan review typically runs 8-12 weeks. TopVolk is a WA Licensed
      Contractor and prepares the complete permit package in-house. We've run the Pierce County
      PALS process multiple times and know what gets kicked back versus what clears on the first
      submittal.

  - q: "Can a DADU in Puyallup have its own separate utility connection?"
    a: |
      Yes — and it's worth thinking through before committing to a shared connection. A separate
      meter makes the DADU fully independent: easier to rent, simpler to sell as a distinct unit
      later, and no shared billing disputes with tenants. In Puyallup, a new water meter requires
      coordinating a tap at the main through Pierce County Utilities or the city water system —
      that connection alone runs $8,000-$15,000 before any in-unit rough-in plumbing. For heating
      and hot water, a Navien NPE-series tankless unit handles domestic hot water independently and
      a Mitsubishi MXZ mini-split handles climate — neither requires tying into the main house
      mechanical system. Both connection scenarios get presented with full cost breakdowns at the
      site estimate.

  - q: "How long does a properly built DADU last in Puyallup's climate?"
    a: |
      Built to 2024 IRC standards with the right envelope details — Hardie cement-board siding,
      correct flashing at every penetration, vapor barrier under the crawlspace, R-49 ceiling
      insulation — a DADU in Puyallup should hold up 40+ years without major envelope repairs.
      Hardie carries a 30-year limited manufacturer warranty. Mitsubishi mini-splits carry a
      12-year compressor warranty when registered. Schluter Kerdi waterproofing membrane in the
      shower carries a lifetime warranty on the membrane itself. TopVolk's workmanship warranty
      covers a full year on all structural and finish work. Vladislav does the blue tape walkthrough
      personally at the end of every project — the punch list gets resolved before we call the
      job done.

  - q: "Do you build ADUs in cities near Puyallup?"
    a: |
      All of Pierce County falls within TopVolk's service area — Tacoma, Lakewood, Sumner, Bonney
      Lake, Auburn, and Federal Way are regular project locations. King County work includes Kent,
      Renton, and Bellevue. Snohomish and Kitsap counties are covered as well. For Puyallup and
      South Hill specifically, a site visit typically schedules within a week of first contact. ADU
      projects across 98374, 98375, and downtown Puyallup (98371) are familiar territory — we know
      the Pierce County PALS process and the typical lot conditions in this part of the county.
      Call (206) 591-1096 or schedule a free on-site consultation. You'll talk directly with
      Vladislav, not a coordinator.