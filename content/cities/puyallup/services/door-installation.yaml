title: "Puyallup Door Installation — Entry & Patio Doors Built for PNW Rain"

intro: |
  The Washington State Fairgrounds off Meridian Street fill up every September, but the homes on surrounding blocks in 98371 deal with a year-round problem: Pacific moisture that channels inland from Puget Sound and doesn't fully clear until June. Door frames absorb that exposure — wood sills rot, head flashing separates from the frame, and a draft gap that felt minor in August becomes a real heat-loss problem by February. Down near Pioneer Park, original entry doors from the 1940s and 1950s have often been patched so many times the jamb is no longer square. The door barely latches in wet weather. A properly flashed fiberglass entry door — a Therma-Tru Smooth-Star with Vycor Plus flashing tape at the head and a sloped metal sill pan below the threshold — solves all of that for the next 30 years. Vladislav at TopVolk has replaced doors across Puyallup since 2023: entry replacements, patio slider conversions, interior swing changes during remodels, and garage door swaps on 1990s tract homes out in 98374. Call (206) 591-1096 to get an on-site estimate scheduled.

localContext: |
  Puyallup's older residential core — the blocks closest to downtown in 98371 and portions of 98372 — carries a mix of 1920s through 1950s Craftsman bungalows and post-war ranchers. Door rough openings in those homes vary from what any modern prehung unit assumes: some run 34 or 35 inches wide, others are true 80-inch height but with a non-structural cripple header that was sistered onto original framing decades later. The growth areas filling in 98373 and 98374 toward the South Hill corridor are mostly 1985–2005 builder-grade construction — original entry doors there are typically steel 6-panel prehungs with foam compression weatherstrip that's been fully flattened for years. Puyallup sits low in the river valley where freeze-thaw cycling is real through December and January, and a door shimmed slightly out of plumb will rack further every season. City of Puyallup handles its own permit office for work inside city limits; structural modifications to a door opening — header replacement, rough-opening enlargement — require a permit and rough-in inspection before closing the wall. Projects in nearby unincorporated Pierce County fall under Pierce County PALS instead.

commonProblems:
  - title: "Rotted Sill Pans and Failed Head Flashing on Entry Doors Near Downtown Puyallup"
    description: |
      Entry doors on the older homes in 98371 — particularly the Craftsman-era builds near the Ezra Meeker Mansion historic district — see moisture intrusion that most homeowners don't catch until the threshold feels soft underfoot. The failure usually isn't the door slab itself. It's the head flashing separating from the door frame, or a sill pan that was never sloped toward the exterior, letting water wick behind the casing and into the king studs over two or three wet seasons. By the time rot is visible at the sill, the rough framing on both sides often needs sister repair before a new door can be set correctly. The fix is a full prehung replacement — Therma-Tru Smooth-Star or Benchmark series fiberglass — with Vycor Plus flashing tape wrapped at the head, a new sloped metal sill pan, and exterior casing reinstalled with a continuous sealant bead. Installed cost for a standard entry door with flashing correction runs $1,400–$2,600, with a two-to-three day turnaround including any minor framing repair.

  - title: "Non-Standard Rough Openings in Pre-1960 Homes Make Prehung Installation Complicated"
    description: |
      Homes built before 1960 on Puyallup's older grid streets — blocks running between Pioneer Avenue and 2nd Street NW in 98371 — were framed before modern rough-opening standards existed. A 36-inch prehung entry door today assumes a rough opening of 38 inches wide and 82.5 inches tall. In a 1940s bungalow, you might find a 35.5-inch actual opening, an out-of-plumb king stud, and a non-structural cripple header added at some point with no permit record. Getting a JELD-WEN or Therma-Tru prehung unit to fit, seal, and swing correctly means correcting all three dimensions before shimming and fastening. If the opening is undersized, the rough framing has to be trimmed back — pulling the king stud or cutting down the header assembly. That adds four to six hours of labor on a door-only project. If the original header was undersized for the span, an LVL header replacement is required before the new door goes in. Budget $400–$900 for rough-opening correction work on pre-1960 builds.

  - title: "Patio Slider Conversion to French Doors or Multi-Slide Requires Structural Header Upgrade"
    description: |
      A large share of the 1985–1995 tract homes in 98374 and 98373 came with a 6-foot aluminum-frame sliding patio door — standard builder spec at the time. Many homeowners want that converted to a 6-foot French door or, more often now, a 9- or 12-foot multi-slide system like an Andersen 400 Series or Milgard Thermally Improved aluminum unit. The issue is the load path. Widening the rough opening to accommodate a larger system means pulling the existing header and installing an LVL beam sized for the new span — typically a 3.5x9.25 or 3.5x11.25 LVL depending on load above. That work requires a permit through the City of Puyallup and a rough-in inspection before framing closes. TopVolk is a WA Licensed Contractor and handles the permit application as part of the project scope. Full conversion — demo, LVL header, enlarged rough opening, door supply and install, interior casing, exterior flashing and trim — runs $4,500–$9,000 depending on the door system and interior finish work included.

  - title: "Garage Door Replacement with Insulated Panels on Attached Garages in 98374"
    description: |
      Attached garages on Puyallup's 1990s and 2000s tract builds often share a wall with finished living space — a bonus room above, or a family room on the same floor. The original garage door on those homes is almost always non-insulated steel with an R-value somewhere around R-4. Through a PNW winter — when Puyallup temperatures sit in the high 20s to mid-30s for weeks at a stretch — that uninsulated door is a direct thermal bridge into conditioned space. Swapping to a Clopay Gallery Series with polystyrene-injected insulated panels at R-12 to R-16 cuts that heat transfer measurably. The new door also needs a continuous bottom weather seal and fresh perimeter vinyl stop molding if the existing stops have compressed flat against the panel face. Installed cost for a standard 16x7 single-car insulated door runs $1,600–$2,800; a double-car 18x7 opening runs $2,200–$3,800. Torsion spring vs. extension spring configuration affects labor time slightly but not the panel supply cost.

  - title: "Smart Lock Integration During Entry Door Replacement"
    description: |
      Planning for a Schlage Encode Plus or August Wi-Fi Smart Lock during an entry door installation is straightforward when the door prep is specified up front — correct bore size, backset, and latch strike plate location all dialed in before the door ships. Retrofitting onto an existing older door is where complications surface. Pre-1970 homes in Puyallup's 98371 zip sometimes have a 1.5-inch deadbolt bore rather than the standard 2-1/8-inch, or a non-standard backset that doesn't align with modern latch geometry. Recutting the bore, adjusting the strike plate, and reinforcing the door edge with a steel strike box takes two to three hours of added labor. Paired with a new entry door installation, all of that work happens during the main scope — no separate trip, no patchwork. Adding smart lock supply and prep integration to a door replacement runs $180–$360 depending on the lock model selected.

faq:
  - q: "How fast can you get to Puyallup for door installation?"
    a: |
      Puyallup is a straightforward run from the South King County area — SR-512 off I-5 puts us on Meridian Street in under 45 minutes from most of the Seattle Metro on a typical weekday. Vladislav schedules first on-site estimates within three to five business days of your call in most cases. Once the door is ordered and confirmed, standard entry door replacements are completed in one to two on-site days; patio conversions with structural header work run two to four days. Call (206) 591-1096 to get a date on the calendar and check current scheduling availability.

  - q: "What does entry door replacement in Puyallup cost?"
    a: |
      A standard fiberglass or steel prehung entry door — supply and installation including head flashing, sill pan, threshold, weatherstrip, and interior and exterior casing — runs $1,200–$2,800 in Puyallup depending on door size, material grade, and existing rough-framing condition. Therma-Tru Smooth-Star and Benchmark fiberglass doors land in the $1,200–$1,900 range installed; solid wood entry doors start around $2,500. If the rough opening needs correction or the header requires an LVL upgrade, add $400–$900 to that number. Vladislav provides a line-item quote on-site — not a bracket, an actual number tied to your specific opening, door choice, and any conditions found during the walk-through. No charge for the estimate.

  - q: "Does door replacement in Puyallup require a permit?"
    a: |
      Straight door-for-door replacement in the same rough opening typically doesn't require a permit under Puyallup's building code or the IRC. The permit threshold kicks in when the rough opening changes — widening it, adding or replacing an LVL header, or converting a single door to a wider multi-slide system. That work needs a permit through the City of Puyallup permit office and a rough-in inspection before framing closes. For jobs in unincorporated Pierce County nearby, the AHJ shifts to Pierce County PALS — same general rules, different intake process. TopVolk is a WA Licensed Contractor and pulls all required permits as part of the project; homeowners don't have to navigate the portal on their own.

  - q: "Can you convert a patio slider to French doors or a multi-slide system?"
    a: |
      Yes — it's one of the more common scopes on the 1985–1995 tract builds in 98374 and 98373. The deciding variable is the header above the existing opening. A 6-foot slider has a header sized for that span; going to a 9-foot Andersen 400 Series or Milgard multi-slide requires a new LVL beam at the correct depth for the wider span and load above. That triggers a permit, a rough-in inspection, and typically two to three days of framing work before the door goes in. On a single-story home with only roof load above, the structural scope is usually contained. Call (206) 591-1096 and Vladislav will assess the framing situation during the on-site estimate before anything is quoted.

  - q: "What warranty covers door installation work in Puyallup?"
    a: |
      Manufacturer warranties cover the product: Therma-Tru's limited lifetime warranty applies to fiberglass door slabs including finish and glass; Andersen 400 Series carries a 10-year glass warranty and 20-year wood component warranty; Clopay garage door panels carry a limited lifetime warranty on steel. Those cover product defects, not installation. TopVolk's installation work is covered separately — if a threshold seal fails, flashing lifts, or a door binds due to shimming, that gets corrected at no added cost. Every TopVolk contract also includes a deadline penalty clause: if the project runs past the agreed completion date due to our scheduling, Vladislav pays a daily penalty. That's written into the contract, not a verbal commitment.

  - q: "Do you cover Tacoma, Bonney Lake, and other cities near Puyallup?"
    a: |
      Pierce County falls squarely within the regular service area — Tacoma, Bonney Lake, Sumner, Auburn, and unincorporated zones along the SR-167 corridor are all covered. Scheduling in Puyallup and neighboring cities is typically two to three weeks out for new projects depending on current workload. For a straightforward entry door swap with no structural work, estimate to completed install usually runs two to three weeks total. Custom-order doors — Andersen, Pella, Marvin — add two to four weeks for the door to arrive before installation begins. Call (206) 591-1096 to check current availability and get the estimate on the books.