      County PALS review add 3–5 weeks for permit processing. Call
      (206) 591-1096 to get on the calendar — Vladislav will show up
      for the estimate himself, not a salesperson running a pitch.

  - q: "What does fence installation cost per linear foot in Puyallup?"
    a: |
      Cedar dog-ear privacy fence — 6 feet tall, PT posts, concrete
      footings — runs $35–$55 per linear foot installed in Pierce
      County. Vinyl privacy fence (CertainTeed Bufftech or comparable)
      runs $55–$85 per linear foot. Horizontal cedar slat fencing
      requires more labor for consistent spacing and blocking, landing
      at $55–$75 per linear foot. Gates add $400–$900 each depending
      on width and hardware grade. Sloped lots, rocky or clay soil
      requiring equipment, and corner configurations with multiple gates
      all push pricing toward the high end. TopVolk provides line-item
      written quotes — posts, concrete, pickets, rails, and hardware
      are broken out separately. Free on-site estimate: call
      (206) 591-1096.

  - q: "Do I need a permit to build a fence in Puyallup or Pierce County?"
    a: |
      Most residential fences in Puyallup — 6 feet or under on side
      and rear property lines, no retaining wall involved — do not
      require a building permit. Front yard fences at 4 feet or under
      are also permit-free. Permit triggers include: a fence combined
      with a retaining wall exceeding 7 feet total height, locations
      within the Puyallup River flood zone, and commercial properties.
      HOA approval is a separate track — most Puyallup HOA review
      boards take 2–4 weeks to respond to fence submittals and often
      want a materials sample or color spec sheet. TopVolk handles the
      permit documentation and can prepare the HOA submittal package.
      All permitted work is pulled under TopVolk's WA Licensed
      Contractor registration.

  - q: "Can you install horizontal slat cedar fences in Puyallup?"
    a: |
      Yes — horizontal cedar or composite slat fencing is one of the
      more common requests across Puyallup's 98371 and 98373 zip codes
      right now, especially on newer infill lots that want a
      contemporary look. The installation is more involved than
      standard picket: horizontal boards need blocking between posts
      every 24–36 inches to prevent bowing, and a 1/8 to 1/4-inch gap
      between boards is required for drainage — water trapped against
      rails accelerates rot fast in this climate. Western red cedar at
      1x6 or 5/4x6 works well; Trex Seclusions composite is the
      low-maintenance path with the same clean look. Post spacing stays
      6–8 feet on center with 4x4 or 4x6 PT posts depending on fence
      height. We can show you photos from recent Pierce County
      horizontal slat projects before you commit to anything.

  - q: "What warranty comes with a fence installation from TopVolk?"
    a: |
      Vinyl fence panels from CertainTeed carry a lifetime limited
      manufacturer warranty against cracking, fading, and peeling —
      registered in the homeowner's name after installation. Cedar
      fencing carries a three-year workmanship warranty on labor and
      installation; premium #2 cedar should hold 15–20 years with
      proper staining on a 3–4 year cycle. Trex Seclusions composite
      fencing carries a 25-year fade-and-stain warranty directly from
      Trex. Gate hardware — hinges, latches, post caps — falls under
      the respective manufacturer warranty, typically 1–5 years by
      grade. TopVolk's installation warranty covers post settling, rail
      failure, and workmanship defects for 2 years post-completion.
      Any deadline penalties agreed to in the contract are also written
      in — not verbal assurances.

  - q: "Do you install fences in South Hill, Sumner, and nearby Pierce County cities?"
    a: |
      Yes — TopVolk regularly works in South Hill (98374), Sumner
      (98390), Bonney Lake, Auburn's Pierce County sections, and
      Tacoma's eastern neighborhoods. Unincorporated areas fall under
      Pierce County PALS permit jurisdiction; incorporated cities like
      Sumner and Bonney Lake have their own permit counters. Drive
      time between those areas is 10–25 minutes from Puyallup, so
      scheduling works the same way. King and Snohomish County
