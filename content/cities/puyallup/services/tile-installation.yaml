title: "Puyallup Tile Installation — Waterproofing, Large-Format, and Heated Floors Done Right"

intro: |
  The Craftsman bungalows clustered around Pioneer Park in downtown Puyallup (98371) were built for a different era of bathrooms — 4×4 ceramic on greenboard was as far as most of them got during their last update. Now homeowners are pulling those dated tiles and asking for 24×48 large-format porcelain, curbless showers, and Schluter Ditra-Heat under the floor. Getting that right on a 1920s post-and-pier house with a bouncy subfloor takes more than fresh tile and new grout. The Puyallup River valley traps moisture year-round — this isn't a climate where you skip the vapor barrier or cut corners on waterproofing membrane. TopVolk Construction has completed 100+ projects since 2017 across Pierce and King counties, including tile scopes inside full bathroom remodels and kitchen renovations where the backsplash comes down and electrical gets relocated in the same pass. Vladislav handles the estimate himself — no sales staff, no handoff. Call (206) 591-1096 to schedule a free on-site walk-through.

localContext: |
  Puyallup's housing stock splits pretty cleanly by location. The older neighborhoods between downtown and Clark's Creek Park (zip 98371) run 1910s through 1940s — Craftsman bungalows and early ranchers where the bathroom subfloor is often 1×6 diagonal sheathing over floor joists, not OSB. That kind of substrate needs sistered joists and a Schluter Ditra uncoupling membrane before any large-format tile goes down. The newer subdivisions east toward zip 98374 — built mostly 1990s through 2010s — have slab-on-grade first floors in many cases, which simplifies substrate prep but creates different challenges: radiant heat cable routing and proper expansion joints at slab transitions. The South Puyallup corridor (98373) is the wildcard: mid-century ranchers from the 1960s with original vinyl-over-plank floors and plumbing that hasn't been touched in decades. City of Puyallup permit center handles projects inside city limits; unincorporated Pierce County work routes through Pierce County PALS — plan review for a full bathroom remodel with plumbing and electrical typically runs 4-8 weeks. That timeline needs to be built into your project schedule from the start.

commonProblems:
  - title: "Shower Tile Failing Because There's No Real Waterproofing Behind It"
    description: |
      This is the most common tile problem in Puyallup homes, especially in the 1960s-1980s ranchers throughout the 98373 zip. Original builders used standard drywall or greenboard behind shower tile — neither is waterproof. Over time, water migrates through grout joints, soaks the substrate, and the whole assembly delaminates. The fix isn't just retiling. It means tearing out to studs, installing Schluter Kerdi waterproofing membrane over cement board, and rebuilding from scratch. Kerdi sheet is adhered with unmodified thinset; every seam, corner, and transition gets Kerdi-Band before a single tile goes up. On a standard 3×5 shower, that substrate work alone runs 2-3 days. Budget roughly $4,500-$8,000 for a full shower retile including Kerdi waterproofing, depending on tile selection and how many niches are in the scope. Cutting that number by skipping the membrane means doing it again in five years.

  - title: "Large-Format Porcelain Cracking Because the Subfloor Wasn't Prepped"
    description: |
      Twenty-four-by-forty-eight porcelain requires substrate deflection no greater than L/360 — that's a structural spec, not a suggestion. In the older Craftsman homes near Pioneer Park, floor joists are often 2×8 at 16-inch centers with no mid-span blocking. That's marginal for large-format tile even before you factor in decades of seasonal movement. The fix involves sistering floor joists, adding blocking, and installing Schluter Ditra or floating the floor with a self-leveling compound before tile starts. Laser-level in both directions; any variation beyond 3/16 inch over 10 feet needs to be floated out. Skipping this step is exactly why tile cracks at grout joints within a year of installation. It shows up in both 98371 older joisted floors and 98374 newer OSB-over-engineered-lumber builds. The substrate prep often runs 1-2 days before the first tile is set.

  - title: "Heated Floor Systems Installed Without the Right Decoupling Layer"
    description: |
      Schluter Ditra-Heat and Warmup systems are popular upgrades in Puyallup bathroom remodels, particularly in master baths getting a full gut. The failure point is almost always the same: heat cable embedded directly in thinset over concrete or OSB, with no decoupling membrane underneath. Thermal cycling — the floor heating and cooling daily — creates shear stress at the tile bond. Over 12-18 months, tiles start to tent and pop. The correct sequence is Ditra-Heat mat over the prepared substrate, heat cable routed into the mat's fleece cavities, then large-format tile set in large-format unmodified thinset like Mapei Ultralite S2. Thermostat rough-in is part of the scope — a Schluter Ditra-Heat-E-R WiFi thermostat needs a dedicated junction box and a GFCI-protected circuit. TopVolk coordinates the electrical rough-in so wiring is stubbed in before tile starts. A heated floor bathroom remodel in Puyallup typically runs 3-5 weeks start to finish.

  - title: "Natural Stone Staining in Puyallup's Year-Round Moisture Climate"
    description: |
      Marble and travertine look sharp in a master bath, but natural stone is porous — unsealed or under-sealed stone in a PNW bathroom will stain within a few months. Puyallup averages over 40 inches of rain annually, and interior bathroom humidity from October through May is relentless. Travertine needs to be back-buttered with epoxy-modified thinset to fill the voids, grouted with non-sanded grout in the natural vein lines, and treated with a penetrating impregnator sealer — Miracle Sealants 511 or equivalent — before the first use. Resealing every 12-18 months is maintenance, not optional extra work. For shower floors specifically, honed marble is a safer call than polished; polished marble in a wet area becomes a genuine slip hazard in a humid PNW bathroom. Stone choices get discussed during the initial consultation so the spec is locked before materials are ordered.

  - title: "Shower Niche Framing and Waterproofing Details That Don't Hold Up"
    description: |
      A recessed shower niche looks like a simple carpentry detail but causes chronic leaks when it's built wrong. The niche box needs blocking at top and bottom between studs, and the entire interior gets wrapped in Kerdi membrane with overlapping Kerdi-Band at every inside corner before any tile touches it. In Puyallup homes where the shower lands on an exterior wall — common in the 1970s-1990s ranchers in the 98374 zip — there's another issue: a niche on an exterior wall displaces insulation in that stud bay. That cavity needs closed-cell spray foam before waterproofing goes on, or you end up with a cold spot that condenses moisture inside the wall cavity all winter. Tile selection for the niche matters too: a large-format 12×24 piece in a standard 12-inch-wide niche means precise cuts and back-buttering every piece individually. Budget 1-2 additional days for niche framing and waterproofing detail work on any shower remodel where the niche is in play.

