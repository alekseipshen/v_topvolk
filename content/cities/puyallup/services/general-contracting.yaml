title: "Puyallup General Contracting — Permits, Trades, Results"

intro: |
  Downtown Puyallup's pre-war Craftsman blocks near the Ezra Meeker Mansion are a
  different job than the 1990s tract houses in zip 98373. Both have complications.
  Older homes hide galvanized plumbing and undersized panels; newer ones need
  structural work nobody planned for. Routing a Bosch dishwasher rough-in through
  a remodel that also needs a new LVL beam and Pierce County PALS permits is the
  kind of multi-trade coordination Vladislav Volkov has been managing since 2017.

localContext: |
  Zip codes 98371 and 98372 cover most of older Puyallup — 1920s through 1950s
  bungalows with post-and-pier foundations and original cedar siding. South Hill
  in 98374 and 98375 shifts to 1980s-2000s builder-grade construction along the
  main arterials. Clay soils across the Puyallup River valley mean drainage has
  to be part of any foundation or addition scope. The PNW's 37-inch annual
  rainfall doesn't forgive shortcuts on vapor barriers or exterior framing details.

commonProblems:
  - title: "Pierce County PALS Plan Review Adds Weeks Most GCs Don't Account For"
    description: >-
      A full kitchen or bathroom remodel in Puyallup requires mechanical,
      electrical, and plumbing permits through Pierce County PALS — each with
      its own inspection cycle. Miss a rough-in inspection window and your
      finish date slips two to three weeks. Permit submittals need to go in
      before demo starts, not after the framing crew shows up.

  - title: "Demo Day in a 1940s Bungalow Reveals What the Blueprints Don't"
    description: >-
      Rot in rim joists, undersized headers, knob-and-tube wiring behind walls
      — these are standard discoveries in downtown Puyallup's housing stock.
      Replacing a rotted rim joist means sister joisting the full run, not just
      the damaged section. Any honest estimate includes a contingency line
      before demo, because it will come up.

  - title: "Kitchen Remodels Stall When MEP Trades Miss Their Scheduling Windows"
    description: >-
      A KitchenAid range hood at 600 CFM triggers makeup air requirements under
      IRC Section M1503. That pulls in the HVAC sub, the framer, and sometimes
      a structural modification to the exterior wall. If the HVAC rough-in
      isn't complete before drywall hang, the entire punch list shifts.
      Sequencing those trades is the actual job.

faq:
  - q: "How fast can you get to Puyallup for General Contracting?"
    a: >-
      Puyallup is about 35 miles south of Seattle via SR-167 or I-5 — typically
      45-60 minutes from the north end of the service area. Vladislav can
      usually schedule a free on-site walkthrough within a week. Call
      (206) 591-1096 to set it up.

  - q: "Do you work with mid-range appliance brands like Samsung or Bosch on kitchen remodels?"
    a: >-
      Yes. Samsung ranges, Bosch dishwashers, and KitchenAid ventilation all
      have specific rough-in requirements that have to be built into the permit
      drawings before plan review. Appliance specs drive the mechanical and
      electrical scope — getting that coordination right early prevents
      expensive change orders mid-project.

  - q: "What does a $100K+ remodel actually look like from start to finish in Puyallup?"
    a: >-
      Start with a free on-site walkthrough and a line-item quote — no vague
      ranges. Permit submittals go to Pierce County PALS after you approve
      scope. Plan review runs 4-8 weeks for major work. Rough-in, framing, MEP,
      and finish work follow inspection milestones in sequence. Most full
      remodels wrap in 3-5 months. Deadline penalties are written into the
      contract. Vladislav Volkov — WA Licensed Contractor, 100+ projects since
      2017 — runs every project directly. Call (206) 591-1096.