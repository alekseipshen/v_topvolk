title: "Puyallup Kitchen Remodel — Opening Up 60s Ranchers Right"

intro: |
  Ranchers along the older blocks of 98371 near the Washington State Fairgrounds were built when cooking happened behind closed doors — galley kitchen, narrow counter, one 15-amp circuit. Adding a KitchenAid range today means rewiring, a new hood with proper CFM venting, and usually a wall coming out. TopVolk Construction has handled 100+ projects like this across Pierce County since 2023. That combination of structural work, electrical service, and permit coordination is where most remodels go sideways.

localContext: |
  The homes in central Puyallup — 98371 and 98372 — skew heavily toward 1950s through 1970s construction: ranch-style and bi-level layouts with load-bearing walls running through the kitchen zone. Blocks east of Pioneer Avenue toward the South Hill boundary have the densest concentration of these closed-off kitchens. Electrical panels from this era run 100 amps — not enough for induction cooking, and the original exhaust venting, usually 3-inch duct through an exterior wall, doesn't meet current IRC hood requirements.

commonProblems:
  - title: "Load-Bearing Wall Between Kitchen and Dining Room"
    description: "Puyallup ranchers from the 1960s-70s almost always have a load-bearing wall separating the kitchen from the dining room. Removing it means a structural engineer's stamp, an LVL beam sized to the span, and a PSL post at each end. Pierce County PALS requires a permit and rough-in inspection before drywall goes up."
  - title: "Undersized Electrical Panel and Inadequate Venting"
    description: "A 100-amp panel, standard in pre-1975 Puyallup homes, can't reliably run an induction range alongside a GE Profile refrigerator and Bosch dishwasher simultaneously. Upgrading to 200-amp service means coordinating with Puget Sound Energy for meter disconnect plus a separate electrical permit. Range hood venting — minimum 400 CFM ducted outside — also matters in Puyallup's wet winters to prevent moisture buildup overhead."
  - title: "Cabinet Footprint Incompatible With Modern Appliance Dimensions"
    description: "Original 1960s cabinetry was built around appliances with completely different dimensions. Fitting a standard 30-inch KitchenAid range or a French-door Samsung refrigerator into the old footprint usually means full cabinet replacement — IKEA semi-custom boxes with custom fronts, or full semi-custom from a cabinet shop. Either way, the countertop template happens after demo, not before."

