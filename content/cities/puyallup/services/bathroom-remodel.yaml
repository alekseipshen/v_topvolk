title: "Puyallup Bathroom Remodel — Tile, Showers & Pierce County Permits"

intro: |
  South Hill's 1980s ranchers and the split-levels near downtown Puyallup in 98371
  came with the same bathroom package: one-piece fiberglass surround, a Moen chrome
  faucet that drips, and 4-inch ceramic tile set directly over drywall backer. That
  combination wasn't designed to last 40 years in a wet climate. TopVolk has completed
  bathroom remodels across Puyallup and unincorporated Pierce County since 2023 —
  100+ projects, permits pulled through Pierce County PALS, WA Licensed Contractor.

localContext: |
  The tract builds in 98374 — South Hill east of 112th St E — run mostly late 1980s
  through late 1990s. Fiberglass surrounds, no waterproofing membrane, builder-grade
  fixtures. Closer to the Puyallup Fairgrounds in 98371, you'll find 1960s and 1970s
  ranchers with cast-iron drain stacks and galvanized supply lines that restrict flow
  and corrode from the inside. Both eras share the same outcome: the original bathroom
  materials are past their useful life.

commonProblems:
  - title: "Fiberglass Surrounds Delaminating and Letting Water Into the Framing"
    description: "One-piece fiberglass tub surrounds in Puyallup's South Hill tract homes flex at
      the seams over time. Moisture migrates through to wood framing — by the time mold
      appears on the drywall surface, it's usually already in the studs. Proper replacement
      means Schluter Kerdi waterproofing membrane over cement backer board, not new tile
      over old greenboard. Skipping the membrane creates the same problem in five years."

  - title: "Inadequate Exhaust Ventilation Feeding Mold Regrowth"
    description: "Builder exhaust fans in 1980s-90s Puyallup homes typically run 50 CFM or less —
      not enough for a master bath in a climate that runs wet from October through May.
      Mold comes back within months of cleaning if the ventilation isn't fixed. The fix is
      a properly rated exhaust fan, RedGard membrane on wet wall surfaces, and routing the
      vent duct to a real exterior exit — not dumping into the attic."

  - title: "Drain Rerouting When Converting Tub-and-Surround to Walk-In Shower"
    description: "Converting a fiberglass tub combo to a curbless walk-in shower means relocating
      the drain — which triggers a rough-in inspection through Pierce County PALS before
      any tile goes down. The subfloor gets sloped to a 1/4-inch-per-foot pitch toward a
      linear drain, mud-bedded and set with large-format porcelain. Kohler or Moen
      thermostatic valve finishes the plumbing. Scope the drain reroute before demolition
      starts — surprises get expensive once the floor is open."

faq:
  - q: "How fast can you get to Puyallup for Bathroom Remodel?"
    a: "Vladislav works regularly in Puyallup and South Hill — typically 25-35 minutes from
      our King County base. Call (206) 591-1096 to book a free on-site consultation. Most
      first visits happen within the week, and we bring a written line-item quote to the
      walkthrough — not a ballpark range."

  - q: "What fixture brands do you typically use for Puyallup bathroom remodels?"
    a: "Kohler and Moen cover most mid-range projects — solid quality, readily available
      parts, and familiar to every plumber in Pierce County. Delta and American Standard
      are common alternatives in the same tier. For higher-end finishes, we spec Brizo or
      Rohl. We match the fixture to the project budget, not to what has the biggest margin."

  - q: "What does a full bathroom remodel cost and how long does it take in Puyallup?"
    a: "A master bath gut-and-redo in Puyallup — curbless shower with Schluter Kerdi
      waterproofing, large-format porcelain tile, updated Kohler fixtures, new vanity,
      and a properly rated exhaust fan — typically runs $22,000-$48,000 depending on
      layout changes and material tier. Timeline is 4-7 weeks once Pierce County PALS
      clears the permit. Deadline penalty is written into the contract. Call
      (206) 591-1096 — owner Vladislav handles the quote directly."