title: "Puyallup Home Additions — Expanding Craftsman and Ranch-Era Homes"

intro: |
  The 900-square-foot Craftsman bungalows sitting a few blocks from Pioneer Park weren't
  built with a third bedroom in mind — they were built when Puyallup was still a farm town
  straddling the river. Those same houses are now holding families that have outgrown them,
  and the math on moving versus building rarely favors moving right now. In the 98371 zip
  code, rear additions onto original post-and-pier foundations require a foundation capacity
  check before any structural engineer will sign off on new load-bearing walls. South Hill
  homeowners along Meridian Avenue East in 98374 face a different constraint: large lots
  with room for a DADU under WA HB 1337, but setback requirements and lot coverage limits
  that don't leave as much buildable area as the raw square footage suggests. TopVolk
  Construction LLC has completed home additions across Pierce County since 2023 — second
  stories, attached in-law suites, rear expansions, and full detached ADUs. Vladislav
  Volkov handles every consultation in person, no sales staff involved. Call (206) 591-1096
  to schedule a site visit.

localContext: |
  Puyallup's housing stock splits pretty cleanly along geography. The older core — roughly
  98371 and parts of 98372 — holds 1910s through 1940s Craftsman bungalows and foursquares
  built when the Puyallup Fairgrounds were the town's social center. These homes typically
  have post-and-pier or concrete block foundations, original Douglas-fir framing, and lots
  running 6,000–7,500 square feet. Adding onto them means matching cedar or Hardie
  cement-board siding on an exterior that's been weathering PNW rain for eighty-plus years —
  not a straightforward drywall-and-paint operation. South Hill and the 98374 zip code are
  an entirely different animal: 1980s and '90s tract construction, hillside lots, and more
  room on paper for ADU builds. The City of Puyallup has its own Building Division and
  permit process, completely separate from Pierce County PALS, which handles unincorporated
  county parcels. Plan review for a major addition runs six to ten weeks for structural
  submittals. Freeze-thaw cycles between Puyallup and the Orting Valley affect concrete
  footings on any new addition, which is why PT lumber at ground contact and proper vapor
  barriers under slab matter more here than in, say, Sammamish.

commonProblems:
  - title: "ADU Builds Under WA HB 1337 — Lot Coverage and Setback Conflicts"
    description: |
      WA HB 1337 (effective 2024) lets most Puyallup single-family lots have up to two
      ADUs — an attached unit and a detached one. The law sounds straightforward until you
      start pulling site plans. Standard Puyallup R-1 zoning still enforces rear and side
      setbacks, and a 5-foot side setback on a 50-foot-wide lot eats into DADU footprint
      faster than most homeowners expect. The City of Puyallup Building Division requires
      a site plan showing all existing structures, proposed footprints, and lot coverage
      calculations before issuing an ADU permit — that documentation prep alone takes two
      to three weeks before submittal. Getting through plan review typically adds another
      eight to twelve weeks. Once structural is approved, a 500-square-foot detached ADU
      with a Mitsubishi mini-split, separate electrical sub-panel, and Hardie lap siding
      runs $140,000–$180,000 in current Puyallup labor and material costs. Tighter sites
      or hillside lots in 98374 push that number higher.

  - title: "Second-Story Additions — Foundation Capacity on 1920s and '30s Homes"
    description: |
      Adding a full second floor onto a 1,000-square-foot Craftsman in downtown Puyallup
      isn't just a framing job. Original post-and-pier foundations on pre-1940 homes
      weren't engineered for two-story loads — they were built to rules of thumb that
      predate modern structural codes. Before any permit application goes to the Puyallup
      Building Division, a licensed structural engineer needs to assess the existing
      foundation, check pier diameter and soil bearing capacity, and typically specify a
      shear wall layout for the new upper floor. LVL beams replace what were originally
      solid-sawn headers, and new joist hangers with blocking get added at the existing
      roof line to carry the new floor system. Expect the engineering phase alone to take
      four to six weeks and add $4,000–$8,000 to the budget. The full second-story addition
      from permit submittal through final inspection typically runs five to seven months on
      a downtown Puyallup bungalow.

  - title: "Matching Exterior Finishes — Siding and Roofline on Craftsman Profiles"
    description: |
      One of the most underestimated problems with a rear or side addition on a pre-war
      Puyallup home is matching the exterior. Original cedar siding has weathered, shrunk,
      and settled into a profile that no off-the-shelf board replicates directly. Hardie
      cement-board lap siding — James Hardie or CertainTeed, 6-inch reveal — comes close
      and handles PNW moisture far better than new cedar, but the trim details (corner
      boards, frieze, rake trim) need custom milling or careful selection to match the
      original Craftsman lines. Roofline ties are equally tricky: a rear gable addition
      joining the existing roof at a valley requires careful step flashing and counter
      flashing to prevent water intrusion during heavy rain from October through May.
      This is the kind of detail that surfaces at the blue tape walkthrough — or shows
      up as a warranty call two rainy seasons later if the flashing was cut short. Getting
      it right at rough-in is cheaper than fixing it after drywall is hung.

  - title: "Mother-in-Law Suite Additions — MEP Coordination and Separate Entrance"
    description: |
      A proper in-law suite — not just a bedroom with a lock — needs a separate entrance,
      a kitchenette, its own electrical sub-panel, and typically its own HVAC zone. Tying
      that into existing mechanical is where cost surprises happen. If the existing furnace
      is undersized or the ductwork doesn't reach the addition side of the house, running
      new duct to a new zone isn't always feasible in the framing that's there. A Daikin
      or Mitsubishi mini-split handles the new zone cleanly without touching existing
      ductwork — typical installed cost for a 9,000–12,000 BTU unit in a 400-square-foot
      suite runs $3,500–$5,500. Plumbing rough-in for a kitchenette and full bath adds
      another $6,000–$10,000 depending on how far the drain line runs to the existing
      sewer lateral. Total cost for a 450-square-foot attached in-law suite in Puyallup's
      98372 zip code typically lands between $90,000 and $130,000 with permits included.

  - title: "FAR Limits and Permit Compliance — What the Zoning Actually Allows"
    description: |
      Puyallup's zoning code caps Floor Area Ratio and lot coverage differently by zone,
      and the gap between what a homeowner thinks they can build and what the city will
      permit is often 200–300 square feet. R-1 zoning in the older parts of 98371 is more
      restrictive on building height and FAR than the newer subdivisions in 98374 or 98375.
      A story-and-a-half dormer addition — common on 1920s bungalows near the Puyallup
      River — can sometimes be done within the existing footprint by converting attic space,
      which sidesteps lot coverage limits entirely. Converting attic space still requires a
      full permit through the Puyallup Building Division, including structural review for
      floor load capacity (existing ceiling joists are almost never sized for bedroom live
      loads), electrical rough-in, and egress window compliance per IRC. TopVolk is a
      WA Licensed Contractor — we pull all permits, submit structural drawings, and manage
      the plan review process through rough-in and final inspection. You don't chase the
      city's plan review queue. We do.

faq:
  - q: "How fast can you get to Puyallup for a home addition consultation?"
    a: |
      Puyallup sits about 35 miles south of Seattle on SR-167 — typically a 45-minute
      drive from our home base, longer during afternoon congestion on the SR-167/I-405
      interchange. We schedule on-site consultations in Puyallup and South Hill weekly
      and can usually get out within five to seven business days of your call. The
      consultation is free, done on-site by Vladislav directly, and ends with a written
      scope and line-item estimate — not a ballpark range. There are no commissioned
      salespeople, no follow-up pitch calls. Just an actual contractor walking your
      property. Call (206) 591-1096 to get on the schedule.

  - q: "What does a home addition in Puyallup typically cost?"
    a: |
      Rough ranges based on 100+ completed projects since 2023: a 300–450 square foot
      attached in-law suite runs $85,000–$130,000 depending on finish level and MEP
      complexity. A detached ADU under WA HB 1337 runs $140,000–$185,000 for a 500–600
      square foot unit with a full kitchen and bath. Second-story additions over an
      existing footprint run $200,000–$300,000+ once you factor in structural engineering,
      temporary shoring during framing, and full interior and exterior finish work. These
      numbers include permits and materials. What moves the number up: hillside lots,
      older foundations needing reinforcement, and premium finish selections like Bosch
      appliances or Kohler plumbing fixtures. Call (206) 591-1096 for a free on-site
      estimate with exact line-item pricing.

  - q: "What permits are required for a home addition in Puyallup, and how long does it take?"
    a: |
      Puyallup has its own Building Division — this is separate from Pierce County PALS,
      which handles permits for unincorporated county parcels like those in parts of South
      Hill. A standard addition permit requires a site plan, architectural drawings, and
      structural engineering calculations stamped by a WA-licensed engineer. Plan review
      for a major addition runs six to ten weeks at the City of Puyallup. ADU permits
      under WA HB 1337 follow the same submittal process and can take eight to twelve
      weeks when structural review is required. TopVolk is a WA Licensed Contractor — we
      prepare all documentation, coordinate with the engineer of record, and manage the
      process through rough-in inspection and final inspection. You don't manage that
      paperwork.

  - q: "Do you assess the existing structure before designing a second-story addition?"
    a: |
      Yes — and skipping that step is how projects fail. Adding a second floor onto a
      1920s or '30s Puyallup bungalow without a structural review first leads to failed
      rough-in inspections or, worse, foundation movement after the fact. The assessment
      starts on-site: checking existing pier diameter, foundation type, wall framing
      species and dimension, and header sizes in load-bearing walls. If the foundation
      needs reinforcement, that work gets scoped and priced before we submit for permits.
      Structural engineering fees for a residential addition typically run $3,000–$6,000
      depending on complexity. LVL beams and engineered rim joist material get specified
      where solid-sawn lumber won't meet current IRC load requirements. That upfront cost
      protects you from a structural callback after the project closes.

  - q: "What warranty does TopVolk provide on home additions?"
    a: |
      Workmanship is warranted for one year from the date of final inspection — anything
      that fails due to installation error gets corrected on our cost. Material warranties
      pass through from the manufacturer: James Hardie siding carries a 30-year
      transferable warranty, Mitsubishi mini-splits carry a 12-year limited compressor
      warranty when professionally installed, and structural framing materials carry
      standard manufacturer coverage. The more durable protection, honestly, is how the
      work was done: correct step flashing at roof-to-wall intersections, properly
      installed vapor barrier in the crawlspace, and permit-inspected structural
      connections that hold up through years of PNW rain. Deadline penalties are also
      written into every TopVolk contract — if we miss a committed completion date, there
      are financial consequences on our end.

  - q: "Do you handle home addition projects in cities near Puyallup?"
    a: |
      Yes — Sumner, Orting, Fife, Milton, Auburn, Federal Way, and Tacoma are all within
      regular rotation. Sumner and Orting projects are permitted through Pierce County
      PALS for unincorporated parcels, or through each city's own building department for
      in-city-limit properties. Federal Way and Auburn projects fall under King County DPER
      for unincorporated parcels or their respective city permit centers. Scheduling for
      South Pierce County is typically combined with other active projects in the area —
      we're down in Puyallup and Sumner regularly enough that response time stays fast.
      Call (206) 591-1096 or reach out online to check current availability and get a
      site visit scheduled.