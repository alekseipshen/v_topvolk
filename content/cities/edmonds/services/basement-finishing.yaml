      Call (206) 591-1096 to get on the calendar.

  - q: "What does basement finishing cost in Edmonds, and what drives the price?"
    a: |
      A basic 600-square-foot basement finish — one room, no bathroom, just
      framing, insulation, drywall, and flooring — runs around $35,000–$50,000
      in Edmonds including permits. Add a full bathroom and the range climbs to
      $55,000–$85,000 depending on tile, fixture grade, and whether egress window
      installation is needed. The biggest cost variables are existing moisture
      conditions (remediation scope), ceiling height complications from low-hanging
      ductwork, and how much electrical panel capacity is available. We provide
      exact line-item quotes after the on-site visit — not ranges, but actual
      numbers for each scope item broken out separately. Call (206) 591-1096 or
      schedule a free consultation to get a real number for your specific
      basement.

  - q: "Do I need a permit to finish my basement in Edmonds?"
    a: |
      Yes, and skipping the permit is a problem when you go to sell. Finishing a
      basement in Edmonds requires a building permit through the City of Edmonds
      Community Development Department — and if the scope includes new electrical
      circuits, a bathroom rough-in, or any structural framing changes, you'll
      need sub-permits for those trades as well. Plan review currently runs 3 to
      6 weeks for this type of work. TopVolk handles all permit applications as
      the WA Licensed Contractor of record — you don't have to navigate the City's
      online portal or track inspection scheduling yourself. The permit covers
      rough-in inspection, egress compliance, smoke and CO detector placement, and
      the final inspection required before the space is legally occupied or counted
      as a bedroom on an appraisal.

  - q: "How do you handle moisture and mold before you start framing?"
    a: |
      Moisture gets measured before any framing plan gets drawn up, not assumed.
      A calcium chloride test on the slab and a moisture meter reading on the
      foundation walls gives a baseline. If the slab is reading high, the fix is
      6-mil poly vapor barrier lapped and taped at seams, then DriCore subfloor
      panels to create an air gap — that combination handles the majority of what
      Edmonds slabs see between October and April. For walls, Schluter
      waterproofing membrane goes in any tile wet area, and paperless
      mold-resistant drywall is standard throughout the below-grade space. If
      there's active hydrostatic water intrusion — water visibly pushing through
      the foundation wall rather than vapor migrating through the slab — a
      perimeter drain tied to a sump basin has to be part of the scope before any
      finishes go in. That's a larger conversation, but it needs to happen before
      framing, not after.

  - q: "What warranty comes with the finished basement work?"
    a: |
      The workmanship carries a three-year warranty — if something fails because of
      how it was installed, TopVolk comes back and fixes it. Material warranties
      are separate and pass directly to you: DriCore subfloor carries a 25-year
      manufacturer warranty, CertainTeed AirRenew mold-resistant drywall has its
      own coverage, and Milgard or Pella windows carry limited lifetime warranties
      on frame and glass seal. What falls outside workmanship coverage: damage
      from a new moisture source that didn't exist at the time of installation —
      a failed sump pump during a power outage, a new foundation crack, a plumbing
      leak from above. Vladislav's direct contact information goes into your
      project documentation at close, so if something comes up, you're not calling
      an 800 number.

