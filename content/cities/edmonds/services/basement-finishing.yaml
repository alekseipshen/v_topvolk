title: "Edmonds Basement Finishing — Split-Level Lower Floors Done Right"

intro: |
  Yost Park runs along a wooded ravine through the center of Edmonds, and the
  streets climbing west and north from there — through the Seaview neighborhood
  and up toward Westgate — are dense with 1960s and early-1970s split-levels
  sitting on raw or partially roughed-in concrete basements. Those homes went up
  fast when Boeing employment was peaking, poured on hillside lots with foundations
  that nobody touched after the framing crew left. Most have 6'8" to 7'2" of
  clearance below the joists, a furnace and water heater taking up a corner,
  galvanized drain lines sweeping low across the ceiling, and hopper windows that
  don't come close to current egress code. Finishing that space into a legal
  bedroom, home office, or family room is genuinely achievable — but the moisture
  problem has to be solved before a single stud goes up. A DriCore subfloor panel
  system installed over the slab, paired with a vapor barrier and proper perimeter
  drainage, is what separates a basement finish that lasts from one that gets
  ripped out in three years.

localContext: |
  The 98020 zip covers most of Edmonds proper — downtown, the waterfront
  neighborhood near the Edmonds-Kingston ferry terminal, and the residential
  streets climbing toward 9th Avenue North — with a heavy concentration of
  mid-century construction on poured concrete or concrete block foundations.
  The 98026 zip picks up the eastern edge of town and the Perrinville area,
  where 1980s and 90s tract development brought more walk-out basements on
  sloping lots. Homes in the older 98020 core were typically built with 4-inch
  floor drains and no sump system — meaning any water that gets in during a
  heavy October storm just sits until it evaporates, usually after doing damage
  to anything stored on the floor. Edmonds is an incorporated city, so permits
  run through the City of Edmonds Community Development Department rather than
  Snohomish County PDS — and their plan review for a basement finish with
  electrical and mechanical scope currently takes 3 to 6 weeks. Lots on the
  western, waterfront-facing slopes see the water table rise noticeably from
  November through March, which means a passive perimeter drain often isn't
  enough by itself on those sites.

commonProblems:
  - title: "Vapor Intrusion and Mold on Slabs in the 98020 Core"
    description: |
      Poured concrete foundations in Edmonds's older neighborhoods absorb moisture
      from the surrounding soil continuously, especially on north-facing slopes
      where the exterior walls never fully dry out between fall rains. Before
      any framing goes up, the slab should be tested with a calcium chloride
      moisture emission test — readings above 3 lbs per 1,000 square feet per
      24 hours will cause most adhesive flooring to fail within a year or two.
      The fix is a two-layer system: 6-mil poly vapor barrier lapped and taped
      at seams against the slab, then DriCore subfloor panels on top to create
      an air gap that lets the concrete breathe below the finished floor. For
      active water intrusion, a Zoeller M53 sump pump in a perimeter-drained
      basin handles what Edmonds's 35-plus inches of annual rainfall sends
      toward the foundation from October through April. Framing directly against
      a damp wall — without vapor barrier or thermal break — is the single most
      common reason basement finishes fail and require a full demo and restart.

  - title: "Hopper Windows That Don't Meet Egress Code for Bedrooms"
    description: |
      IRC Section R310 requires any basement sleeping room to have an egress
      window with a minimum clear opening of 5.7 square feet, a minimum clear
      width of 20 inches, and a sill height no more than 44 inches above the
      finished floor. Most 1960s and 70s Edmonds basements have small hopper
      windows — typically 16 x 24 inches — that fall well short of that
      requirement. Installing a proper egress window means cutting through the
      concrete foundation wall, setting a window well (usually a 36-inch or
      48-inch radius steel well), and backfilling with drain rock to manage
      the rainfall that would otherwise pond in a shallow well during a heavy
      November storm. Milgard's egress-rated slider works well for this
      application and carries a solid warranty for northwest exposures; Pella
      also makes a casement option with tighter weatherstripping if the opening
      faces prevailing weather. The City of Edmonds requires egress window work
      to be included in the main building permit scope — it cannot be pulled
      separately without triggering a separate permit fee.

  - title: "City of Edmonds Inspection Sequencing for Basement Builds"
    description: |
      A basement finish that includes framing, electrical, and mechanical changes
      requires a full building permit through the City of Edmonds Community
      Development Department — not just an electrical or mechanical-only permit.
      The inspection sequence matters practically: rough-in inspection happens
      after framing is complete but before insulation or drywall goes up, and
      the electrical rough-in typically gets scheduled at the same visit. Calling
      for rough-in inspection too early — before all mechanicals are stubbed —
      means a failed inspection and a re-inspection fee; calling too late, after
      drywall is already hung, means cutting it back open. TopVolk is a
      WA Licensed Contractor and pulls all permits in-house; Vladislav coordinates
      directly with the City to sequence inspections so the project doesn't sit
      idle waiting on the AHJ calendar. The final inspection covers egress
      compliance, smoke and CO detector placement, GFCI protection in wet areas,
      and insulation R-value — all of it documented and signed off before the
      blue tape walkthrough and punch list.

  - title: "What a Full Basement Finish Actually Costs in Edmonds"
    description: |
      Finishing a 600–900 square foot basement in Edmonds — the typical footprint
      on a 1960s or 70s split-level — runs $45,000 to $90,000 for a full
      build-out with a bathroom, a legal bedroom, and family room space. Egress
      window installation adds $3,500–$6,000 depending on foundation wall depth
      and soil conditions; a rough-in bathroom with tile, vanity, and shower adds
      $12,000–$22,000 depending on finish level. Mold remediation before framing
      — if there's existing growth on the slab or rim joist — adds $2,000–$8,000
      as a separate scope item. On the upper end, homeowners in the 98020 zip are
      putting Schluter Kerdi waterproofing membranes in their basement shower
      builds and specifying large-format porcelain tile over ceramic, which adds
      cost but holds significantly better in a below-grade moisture environment.
      Edmonds home values are high enough that a permitted, legal bedroom in the
      basement typically adds more than its cost in appraised value per square foot.

  - title: "Low Headroom and Duct Conflicts in 1960s Split-Levels"
    description: |
      Many mid-century split-levels in Edmonds have a floor-to-joist clearance
      of only 7'2" to 7'4" before any existing ductwork or plumbing is accounted
      for. The IRC requires a minimum 7-foot finished ceiling height in habitable
      rooms, which means you need at least 7'4" of rough clearance once you
      account for DriCore subfloor height and a drywall ceiling. A 10-inch or
      12-inch rectangular HVAC trunk line running across the full span can eat
      4 to 6 inches of that clearance right in the middle of the room. The two
      options are rerouting the duct into a perimeter soffit along the wall or
      replacing the rectangular duct with a round spiral duct at smaller diameter
      and higher velocity to recover 2 to 3 inches of headroom. Rim joist
      inspection and sister joist assessment run alongside this scope — if past
      repairs added sistered joists, that affects where recessed lighting can be
      cut in without compromising structure. Mapping the ceiling before framing
      starts prevents a lot of reframing later.

faq:
