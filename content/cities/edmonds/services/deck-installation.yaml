title: "Edmonds Deck Installation — Built for Puget Sound Weather"

intro: |
  From the ferry terminal at the foot of Main Street, Edmonds' hillside addresses look straight out over Puget Sound. Those grade changes mean drainage planning matters before the first post goes in.

  Thirty-seven inches of annual rain will work its way under an improperly flashed ledger board within two or three seasons.

  Composite decking from Trex or TimberTech handles the moisture and moss cycle better than cedar in the 98020 zip code. Cedar starts graying and checking by year three — north-facing surfaces are already collecting moss by year two. Composite costs more at install, but you're not sanding and sealing every spring or replacing boards at the eight-year mark. For Edmonds hillside lots with sightlines over the Sound, that long-term math tends to be easy.

  Drainage planning is deck planning here.

localContext: |
  Most of the residential stock near Sunset Avenue North and the Edmonds Bowl was built between 1960 and 1985 — ranchers and split-levels with rim joists that were never designed with ledger attachment in mind. Blocking needs to be added between existing joists before a ledger can be properly fastened and flashed. Skip that step and you're replacing framing, not just decking. On split-levels near Beach Street and Caspers, that framing review runs before any permit submittal.

  Grade is the defining variable on most Edmonds hillside lots.

  The Meadowdale neighborhood — 98026 addresses west of 76th Avenue West along the Puget Sound bluff — has rear yards that drop 6 to 14 feet across a single lot depth. Post heights on those hillside decks regularly hit 8 to 10 feet, which changes the footing layout, beam sizing, and puts you past the 30-inch IRC guardrail threshold before you've chosen a decking material. Perrinville addresses north of 196th Street show the same grade conditions. Early 1970s construction throughout this stretch often has galvanized joist hanger hardware that's corroded past reliable load transfer — that gets caught on the site walk before permits are pulled, not after the rough-in inspector shows up.

  City of Edmonds runs its own permit center for addresses inside city limits. Snohomish County PDS handles unincorporated parcels nearby — different jurisdiction, different plan review queue. Knowing which counter your address falls under saves two to three weeks at the start of a project.

  Homes on the hillside above the BNSF rail line often have significant grade changes at the rear yard. That affects footing layout, post height, and whether the deck triggers the 30-inch guardrail threshold under IRC. It usually does.

commonProblems:
  - title: "Ledger Flashing Failure on 1970s Rim Joists"
    description: "Water gets behind the ledger board, sits against the rim joist, and rots the framing from inside. Most common structural failure on older Edmonds decks by a wide margin. Proper attachment requires through-bolts, Simpson Strong-Tie hardware at correct spacing, and flashing that kicks moisture away from the house wrap. Skip any of those steps and you are replacing framing within five years, not just the decking. On split-levels in the 98020 zip, the rim joist is often undersized for the span — that gets addressed during framing review before permits are pulled, not after the inspector shows up."
  - title: "Post Footing Depth and Ground-Contact PT Lumber Grade"
    description: "Snohomish County requires footings to frost line — typically 12 to 18 inches depending on the site. Pressure-treated lumber rated UC4B or UC4C is required for any post in ground contact. Standard PT lumber sold at big-box stores is UC3B, which is correct for above-ground applications and wrong for posts buried in grade. Using the wrong treatment grade is the single most common fail point on DIY builds that later need professional correction. Inspectors check this at rough-in."
  - title: "Guardrail Post Attachment and Stair Stringer Code Compliance"
    description: "Any deck surface 30 inches or higher above grade triggers the 36-inch guardrail requirement under IRC. That threshold gets hit constantly on Edmonds hillside lots. Stair stringers must meet rise/run standards — max 7.75-inch rise, minimum 10-inch run — and handrails need to be graspable. A 2x6 flat top rail does not qualify. Snohomish County PDS inspectors check guardrail post attachment and stair framing at rough-in inspection. Corrections after framing is enclosed cost real time and real money."

