title: "Edmonds Deck Installation — Puget Sound Views, Built to Last"

intro: |
  Hillside lots along Sunset Avenue and the bluffs above the Edmonds-Kingston ferry dock sit exposed to six months of sustained rain and salt-tinged air off Puget Sound. Homeowners in 98020 often have views worth building a deck to capture, but cedar weathers fast in that humidity — moss on the north face by October, warped boards by year five. Vladislav has installed Trex composite and cedar decks on Edmonds properties since 2017, and material choice comes up on every single estimate.

localContext: |
  The housing stock in Edmonds skews toward 1950s and 1960s ranchers in the Five Corners and Firdale neighborhoods, with 1970s-80s split-levels filling in the hillside streets across the 98020 and 98026 zip codes. Those older homes predate current IRC ledger flashing requirements — the rim joist behind a decades-old deck attachment is routinely punky from moisture intrusion. City of Edmonds Development Services requires a ledger flashing inspection before deck framing proceeds, and pre-1980 homes here almost always need rim joist work before that inspection passes.

commonProblems:
  - title: "Moss and Rot on Cedar Decking: North-Facing Lots Near Firdale and the Waterfront"
    description: "Shaded lots between Firdale Avenue and the Edmonds shoreline keep cedar permanently damp from October through May. By year three, moss fills the gaps between boards; by year eight, you're replacing planks. TimberTech and Trex composite profiles solve the moisture problem outright — no sealing, no pressure washing, no annual board checks. On a north-facing Edmonds lot, composite at $8-12 more per square foot installed is usually the right call."
  - title: "Ledger Attachment Failure and Rim Joist Rot on Pre-1980 Ranchers"
    description: "City of Edmonds requires a ledger flashing inspection before any deck framing can proceed. On 1960s ranchers in the 98020 zip code, that inspection frequently exposes a soft rim joist — decades of moisture wicking through an unflashed ledger board have taken the wood down to nothing. Sistering new framing and replacing the damaged rim joist section adds scope to the project, but a permitted deck cannot pass without it."
  - title: "Post Footing Depth and Ground-Contact PT Lumber at Grade"
    description: "Edmonds sits near sea level, so the frost line is around 12 inches — but footings must reach undisturbed soil, which on hillside lots sometimes means digging 24 inches through fill. Any post base and framing within 6 inches of grade requires UC4B-rated pressure-treated lumber, not standard above-ground PT. Using the wrong treatment class at grade fails the rough-in inspection; the footings come out and get reset."

faq:
  - q: "How fast can you get to Edmonds for Deck Installation?"
    a: "Edmonds is 30-40 minutes up I-5 or Hwy 99 from Seattle. Vladislav does every consultation personally — no sales staff, no middlemen. Call (206) 591-1096 to schedule a free on-site estimate, usually available within the week."
  - q: "Do you install Trex and TimberTech composite decking, or only wood?"
    a: "Both. Trex Select and Transcend are the most-requested composite profiles on Edmonds jobs — good UV stability, hidden fastener options. TimberTech works well where homeowners want a wood-grain appearance without the maintenance cycle. Cedar is still viable on south-facing, sun-exposed decks with owners committed to annual upkeep. Vladislav walks through samples on-site. WA Licensed Contractor, 100+ projects completed since 2017."
  - q: "What does the deck permit process look like in Edmonds, and how long does it take?"
    a: "Permits for Edmonds residential decks go through City of Edmonds Development Services. Plan review for a standard attached deck runs 4-8 weeks. Construction — footings, framing, decking, guardrails to 36-inch code height, stair stringers — takes 1-3 weeks. Budget 3-5 months total from design to final inspection. Call (206) 591-1096 to get the permit drawings started. Deadline penalties are written into every contract."