    a: "Edmonds is a straightforward run from Shoreline via Highway 99 or I-5 north to 196th. Vladislav typically books on-site consultations within a week of first contact — no sales staff, you talk directly to the person doing the work. Call (206) 591-1096 to schedule."
  - q: "Trex, TimberTech, or cedar — which material holds up better in Edmonds?"
    a: "Trex and TimberTech composite both outperform cedar in sustained PNW wet seasons. Cedar looks good at install, then grays, cracks, and collects moss on north-facing surfaces within a few years. Composite costs more upfront but eliminates annual sealing, sanding, and the 8-to-10-year replacement cycle most cedar decks hit in this climate. For Edmonds hillside lots with drainage complexity, composite is the easier long-term call."
  - q: "What does the permit process look like and what does a deck project cost?"
    a: "City of Edmonds plan review on a standard attached deck typically runs 3 to 6 weeks. Unincorporated parcels go through Snohomish County PDS — similar timeline, different application portal. TopVolk handles permit application through final inspection. WA Licensed Contractor, 100+ projects completed since 2023. Missed deadline means a penalty clause written into the contract. On-site quotes are line-item, not vague ranges. Call (206) 591-1096 to set up a free on-site visit with Vladislav directly."
  - q: "Do I need an engineer for a deck in Edmonds?"
    a: "Depends on the span and the framing. Most standard attached decks under 200 square feet with conventional post-and-beam framing clear plan review on prescriptive code — no engineer stamp required. LVL beam spans, unusual cantilevers, or rooftop decks on older homes typically trigger an engineered drawing. Vladislav reviews that during the site walk so there are no surprises at permit submission."