title: "Edmonds Tile Installation — Waterproof Showers & Kitchens"

intro: |
  Salt air off Puget Sound pushes inland past the ferry terminal year-round, and
  the homes within walking distance of the Edmonds waterfront carry that moisture
  in every wall cavity and crawlspace. That matters for tile work — specifically
  for shower enclosures, where a contractor who skips proper waterproofing is
  setting up a callback in three years. The Craftsman bungalows and split-levels
  along the Seaview neighborhood hillside and down near Brackett's Landing see
  heavy humidity from October through April, and a greenboard substrate behind
  shower tile doesn't survive that cycle. TopVolk Construction has completed tile
  projects across Edmonds since 2023 — curbless shower conversions with Schluter
  Kerdi membrane, large-format 24×48 porcelain in master baths, kitchen
  backsplashes timed to electrical relocation during full remodels, and Schluter
  Ditra-Heat radiant floor systems under bathroom tile. Vladislav Volkov runs the
  operation and handles every consultation personally — 100+ projects completed,
  and no commissioned closer is walking through your door for the estimate.

localContext: |
  Most of the renovation-ready housing in Edmonds sits in two clusters. The first
  is the older stock west of 9th Avenue N in zip code 98020 — mid-century ranchers
  and Craftsman homes built between 1952 and 1972, originally tiled with 4×4
  ceramic in bathrooms and basic quarry tile in kitchens. The second is the
  eastern neighborhoods in the 98026 corridor near Five Corners and Perrinville,
  where 1970s–1980s split-levels and two-story colonials are common — builder-
  grade finishes throughout, often with original fiberglass surrounds that
  homeowners are finally replacing with tile. Substrate condition varies widely in
  both areas. The older 98020 homes frequently have post-and-pier foundations with
  uninsulated crawlspaces and no vapor barrier, which means subfloor moisture is
  an issue and joist deflection often exceeds the L/360 tolerance required for
  large-format tile. Snohomish County PDS handles permits for unincorporated
  county land nearby, but in-city Edmonds projects fall under City of Edmonds
  Development Services — and any shower remodel that moves a drain or adds a
  radiant heat circuit requires a permit, a rough-in inspection, and a final
  before tile is set over the new system.

commonProblems:
  - title: "Shower Tile Delaminating — Waterproofing Membrane Was Never Installed"
    description: |
      The most common tile call from Edmonds homeowners involves a shower where
      grout is cracking, tile sounds hollow when tapped, or water has migrated to
      the adjacent wall. The cause is almost always the same: greenboard or
      standard drywall used as the substrate behind tile, instead of a bonded
      waterproofing membrane. Greenboard absorbs moisture over time — and in a
      home near the Edmonds ferry terminal where the air is damp from fall through
      spring, that process runs faster than it would inland. The correct repair
      means full tile demo, substrate replacement with Hardiebacker cement board,
      and a continuous Schluter Kerdi membrane applied with unmodified thinset
      before any new tile goes up. Kerdi creates a true waterproof layer bonded to
      the framing, not just a moisture-resistant drywall product. Budget
      $4,500–$9,000 for a full shower teardown and retile depending on the
      enclosure size, niche count, and tile selection.

  - title: "Large-Format Porcelain Cracking — Subfloor Wasn't Brought to Spec"
    description: |
      24×48 and 32×32 rectified porcelain requires a substrate flat to within
      1/8 inch over 10 feet — that's the TCNA (Tile Council of North America)
      standard, and it's also what the IRC specifies for ceramic tile installation.
      Most Edmonds split-levels and ranchers from the 1960s have subfloor
      deflection that exceeds that tolerance. The result, when large-format tile
      is set on a flex-y floor, is grout joint cracking within 12 months and
      eventually tile delamination at the thinset bond. The fix is a self-leveling
      underlayment pour — Ardex K-15 or Mapei Ultraplan are the two products we
      use most often — to float the floor to tolerance before tile goes down.
      Schluter Ditra uncoupling membrane is then installed over the leveled slab
      to absorb minor seasonal movement. Substrate correction and floor tile in an
      80–100 sq ft bathroom typically adds 2–3 days to the schedule and $900–$1,800
      in materials before the tile itself.

  - title: "Heated Floor Left Unwired — Permit Was Never Pulled"
    description: |
      Radiant floor tile systems are popular in Edmonds master baths — the two we
      install most are Schluter Ditra-Heat and Warmup, both embedded in the mortar
      bed under the tile and connected to a dedicated thermostat. The problem we
      see regularly is an incomplete installation: a previous contractor laid the
      heating mat but never finished the electrical connection and never pulled the
      required permit. In Edmonds, a heated floor circuit requires an electrical
      permit from the City of Edmonds Development Services, a rough-in inspection
      before the thermostat is wired, and a final sign-off. Unpermitted radiant
      systems show up on home inspection reports and create liability at resale.
      TopVolk, as a WA Licensed Contractor, submits the permit application and
      coordinates the licensed electrician sub for the GFCI-protected 120V circuit.
      A complete heated-floor tile installation in a 60 sq ft bathroom runs
      $3,400–$6,200 depending on tile selection and panel capacity.

  - title: "Natural Stone Etching and Staining — No Penetrating Sealer at Install"
    description: |
      Marble and travertine backsplashes and shower surrounds look striking in
      Edmonds kitchen and bathroom remodels, but both materials are porous enough
      to absorb water, soap minerals, and cleaning products if they weren't sealed
      at installation. Travertine is a calcium-based limestone — it etches on
      contact with acidic cleaners and stains from hard water, which Edmonds has
      in abundance on municipal supply. In a shower that runs daily, unsealed
      travertine grout joints start to open within two years. The remediation is
      a pH-neutral stone cleaner, mechanical grout joint restoration, and a
      penetrating impregnator sealer (Tenax Proseal or Aqua Mix Sealer's Choice
      Gold applied to the dry stone surface). New natural stone installations get
      back-buttered with polymer-modified thinset, sealed before grouting, and
      resealed on a 12–18 month schedule. Restoration of a stained or etched
      natural stone shower surround in a mid-size Edmonds bathroom: $900–$2,400
      depending on square footage and grout damage severity.

  - title: "Tile-to-Hardwood Transition Failing — Expansion Gap Was Skipped"
    description: |
      Kitchen remodels in Edmonds 98020 frequently combine porcelain or stone tile
      in the kitchen with hardwood or engineered flooring in the adjacent dining
      room. That transition line is where problems develop. Tile doesn't move;
      wood expands and contracts seasonally — particularly in older homes without
      vapor barriers in the crawlspace, where subfloor moisture fluctuates
      significantly between the dry summer months and the wet season. If the
      installer didn't leave a 3/16-inch expansion gap between the tile edge and
      the wood, the hardwood eventually pushes against the tile and cracks the
      adjacent grout joint — or buckles away from it. The correct detail uses a
      Schluter Reno-T transition strip or a matching T-molding over a flexible
      silicone caulk joint at the tile edge, color-matched to the grout. Repairing
      a failed transition and replacing cracked tile typically runs $450–$950
      depending on linear footage and tile availability.

faq:
  - q: "How fast can you get to Edmonds for a tile installation consultation?"
    a: |
      Edmonds is a direct shot from our service base — typically 25–40 minutes
      depending on SR-99 traffic or whether I-5 north of Lynnwood is moving. We
      park in your driveway, walk the bathroom or kitchen, and leave you with a
      written line-item quote the same visit. No vague ballpark figures, no follow-
      up call from a salesperson. Vladislav handles every consultation personally.
      For most Edmonds tile projects, we can schedule the on-site estimate within
      3–5 business days of your call. Permit applications, where required by City
      of Edmonds Development Services, are submitted digitally — plan review on a
      bathroom remodel typically runs 3–6 weeks before demo can start. To get on
      the calendar: call (206) 591-1096.

  - q: "What does tile installation cost for a bathroom remodel in Edmonds?"
    a: |
      A standard 5×8 tub-to-shower conversion with Schluter Kerdi waterproofing,
      subway tile walls, and a new floor typically runs $4,500–$7,500 in Edmonds —
      materials and labor combined. A full master bath with 24×48 rectified
      porcelain, curbless shower, built-in niche and bench, and Ditra-Heat radiant
      floor lands between $12,000 and $21,000 depending on tile cost and substrate
      condition. The big variables are tile material ($2–$4/sq ft ceramic vs.
      $8–$18/sq ft large-format porcelain), whether subfloor leveling is required,
      and whether the drain needs relocating. Natural stone adds labor for sealing
      and back-buttering. Call (206) 591-1096 for a free on-site estimate with
      actual line-item pricing — the number you get at the consultation is the
      number on the contract.

  - q: "Does tile work in Edmonds require a permit from the city?"
    a: |
      Replacing tile in kind — same drain, same footprint, no electrical changes —
      generally doesn't require a permit in Edmonds. Add a heated floor circuit,
      move a drain, or change any rough-in plumbing and you're into permit
      territory. City of Edmonds Development Services handles residential building
      and electrical permits; their online portal accepts digital submissions and
      review time on bathroom remodels runs 3–6 weeks. TopVolk, as a WA Licensed
      Contractor, prepares the permit application, coordinates rough-in
      inspections with the plumbing and electrical subs, and schedules the final
      inspection before tile covers any new waterproofing or radiant heat system.
      Homeowners in the 98020 and 98026 zip code areas don't need to navigate that
      process themselves — we handle the paperwork.

  - q: "Can you install a curbless shower with large-format tile in an Edmonds bathroom?"
    a: |
      Curbless showers work well in Edmonds remodels — popular for aging-in-place
      design and visually cleaner than a traditional curbed enclosure. The
      structural requirement is a linear drain (Schluter Kerdi-Line is the one we
      specify most often, with Infinity Drain as an alternative for custom looks)
      and a floor sloped at 1/4 inch per foot toward it. Large-format 24×48
      porcelain is compatible with a curbless floor if the substrate is leveled to
      TCNA tolerance first — which on most Edmonds split-levels means a self-
      leveling pour before Ditra goes down. Waterproofing runs Kerdi membrane on
      all walls, minimum 6 inches above the finished floor height. A complete
      curbless shower conversion with a linear drain and large-format porcelain
      runs $7,000–$15,000 depending on enclosure size and tile selection.

  - q: "How long does tile installation last, and what does TopVolk warranty?"
    a: |
      A properly installed tile job — correct membrane waterproofing, substrate
      prepped to deflection spec, full thinset coverage on the back of each tile —
      should run 20–30 years without structural failure. Grout joints in high-use
      showers benefit from resealing every 3–5 years; natural stone needs more
      frequent attention. TopVolk warranties all tile installation workmanship for
      2 years — if grout cracks, a tile delaminates, or a niche leaks within that
      window, we return and fix it at no charge. Beyond the warranty language,
      every contract includes a deadline penalty clause: if we miss the agreed
      completion date, there's a financial consequence written into the paperwork.
      That's a concrete commitment, not a verbal reassurance. The tile
      manufacturer's warranty (typically 10 years to lifetime on rectified
      porcelain) covers material defects separately.

  - q: "Does TopVolk do tile installation in other Snohomish County cities near Edmonds?"
    a: |
      Regularly. From Edmonds we take tile projects in Lynnwood, Mountlake
      Terrace, Shoreline, Mill Creek, Bothell, and Kenmore. Larger projects in
      Mukilteo or Everett are evaluated case by case. Permit jurisdictions vary —
      Snohomish County PDS covers unincorporated county land, while cities like
      Lynnwood and Bothell run their own permit centers with slightly different
      review timelines. Scheduling for Edmonds and nearby cities typically runs
      3–5 business days for the initial consultation, with project start dates
      2–4 weeks out for smaller bathroom jobs and 4–8 weeks out for larger
      kitchen or master bath remodels that include permit applications. If you're
      in the ferry corridor between Edmonds and Lynnwood, call (206) 591-1096 —
      Vladislav comes out personally, walks the space, and gives you a written
      quote the same day.