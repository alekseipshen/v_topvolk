  - q: "What does drywall installation cost for a room remodel in Edmonds?"
    a: |
      Full drywall hang, tape, mud, and Level 4 finish on a standard bedroom or living
      room typically runs $1.80-$2.80 per square foot installed — a 200 SF room comes
      in around $360-$560 in board, compound, and labor, not counting demo or disposal.
      Bathrooms with purple board, Schluter Kerdi in the shower niche, and Level 5
      finish run higher, often $800-$1,500 for the drywall scope alone on a full
      bathroom remodel. Popcorn ceiling removal adds $1.50-$2.50 per square foot before
      skim-coating. TopVolk provides a line-item quote — exact board count, compound
      type, and labor cost — before you sign anything. Call (206) 591-1096 or schedule
      a free on-site estimate to get a number specific to your project.

  - q: "Do I need a permit for drywall work in Edmonds, and who handles that?"
    a: |
      Straight drywall repair and finish work — patching, skim-coating, swapping out
      damaged sections — does not require a permit in Edmonds. If the drywall is part
      of a larger scope touching electrical, plumbing, or structural elements, the
      whole project needs a permit through the City of Edmonds Development Services
      Department. For garage-to-ADU conversions, the 5/8-inch Type X firecode drywall
      is specifically called out on the approved plans, and the inspector checks it at
      rough-in before anything gets covered. TopVolk is a WA Licensed Contractor and
      manages the permit application, plan submission, and inspection coordination as
      part of the project scope. City of Edmonds permit review for a mid-size remodel
      typically runs 3-6 weeks; Vladislav accounts for that lead time in the project
      schedule from day one.

  - q: "Can you match the original wall texture on a partial repair in an older Edmonds home?"
    a: |
      Texture matching is genuinely one of the harder parts of drywall repair, and the
      answer depends on the original application method. Orange-peel and knockdown
      textures from the 1980s and 1990s were sprayed with a hopper gun, and replicating
      them by hand almost never looks right in natural light — you need the same
      equipment to get a real match. For skip-trowel texture common in some of the
      older mid-century homes near the Edmonds waterfront, the match comes down to
      blade angle and compound viscosity. Vladislav brings a hopper rig on remodel
      jobs for exactly this scenario. For homes that have original smooth plaster walls,
      a veneer plaster skim coat over blue board — USG Fiberock is a solid substrate
      choice — gets closer than any straight drywall compound finish.

  - q: "What warranty does TopVolk provide on drywall work in Edmonds?"
    a: |
      Drywall finish defects — tape popping, nail pops, visible seam cracking — typically
      show up within the first heating season as the house cycles through temperature
      swings. TopVolk's contracts include a three-year workmanship warranty on all finish
      work: any tape failure, fastener pop, or cracking that appears within 12 months
      gets repaired at no charge. Manufacturer warranties on board and compound are
      separate. Moisture intrusion from an unrelated source after project completion —
      a roof leak, a plumbing failure — voids the drywall warranty on the affected
      sections, which is a separate repair scope. Deadline penalties are written into
      every contract, so if the project runs over the agreed schedule, there is a
      financial consequence built into the agreement — not a verbal apology.

