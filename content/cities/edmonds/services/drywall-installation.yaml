title: "Edmonds Drywall Installation — Mid-Century Walls Done Right"

intro: |
  Split-levels and ranchers from the 1960s and early 1970s line the hillside blocks
  above the Edmonds waterfront — and inside many of them, the original drywall work
  hasn't been touched since it was hung. That becomes obvious fast when you open a
  wall for a kitchen remodel or start pulling ceiling texture in prep for recessed
  lighting. Near Puget Sound-facing exposures along the Brackett's Landing corridor,
  ambient moisture is a real variable: standard 1/2-inch board in a bathroom or
  laundry room will start showing mold at the taped seams within a few years. USG
  Sheetrock Mold Tough purple board is the baseline spec for those spaces in this
  climate, not a premium add-on. TopVolk Construction has completed 100+ projects
  across Snohomish and King counties since 2023, including full drywall scopes on
  remodels from the Meadowdale area down through the Seaview neighborhood — owner
  Vladislav Volkov handles the estimate himself, and the project timeline is written
  into the contract with a penalty clause if it slips.

localContext: |
  Most of the residential stock in 98020 was built between 1955 and 1978 — ranchers,
  split-levels, and a scattering of two-story colonials on the ridges above Olympic
  View Drive. Zip code 98026, where the Edmonds-Lynnwood border blurs, catches
  1980s and 1990s tract homes with orange-peel texture on every wall and popcorn on
  every ceiling. Both eras present their own drywall challenges. The mid-century
  homes often have original 3/8-inch rock that telegraphs every stud under paint —
  those walls need either full replacement or a Level 5 skim coat to hold up under
  today's LED sidewall lighting. Permits for interior remodel work in Edmonds route
  through the City of Edmonds Development Services Department, not Snohomish County
  PDS — plan on 3-6 weeks for a standard review on anything that touches structural
  or MEP systems. For a garage conversion or ADU project under WA HB 1337, 5/8-inch
  Type X firecode drywall on the separation wall is a hard IRC requirement, and the
  inspector checks it at rough-in before anything gets covered.

commonProblems:
  - title: "Mold at Drywall Seams in Bathrooms and Below-Grade Spaces"
    description: |
      Edmonds pulls around 37 inches of rain per year, and below-grade spaces in the
      hillside homes off 9th Avenue North stay damp well into June. Standard 1/2-inch
      gypsum board in a basement bathroom or laundry room will start showing black mold
      at the taped joints within a few years — the paper facing absorbs moisture and the
      core follows. The fix is purple board: USG Sheetrock Mold Tough or National Gypsum
      Gold Bond XP, installed with fiberglass mesh tape and a setting-type compound on
      the first coat rather than all-purpose. In shower niches and wet walls, Schluter
      Kerdi membrane or RedGard waterproofing applied over the board adds a second
      barrier. Budgeting for this upgrade on a full bathroom remodel typically adds
      $300-$600 over standard board — and it eliminates a mold remediation callback
      that can cost far more than the original drywall scope.

  - title: "Popcorn Ceiling Removal and Skim-Coat Finish in 1970s Homes"
    description: |
      A large share of the homes in the Seaview neighborhood and along the 196th Street
      SW corridor in 98026 were finished with spray-applied acoustic texture during the
      1970s and 1980s. Removing it in homes built before 1979 requires an asbestos test
      first; Snohomish County has specific disposal requirements if the sample comes back
      positive. Once the ceiling is scraped, the original drywall underneath is rarely
      in good shape — the surface paper tears, and you end up with a substrate that
      won't hold flat paint cleanly. Skim-coating the entire ceiling with two passes of
      lightweight all-purpose compound, then sanding to a Level 4 or Level 5 finish, is
      the right path forward. A standard 12x14 bedroom ceiling runs $400-$700 in labor
      plus materials when done as part of a larger remodel scope, asbestos abatement
      billed separately if needed.

  - title: "Type X Firecode Drywall for Garage Conversions and ADU Separation Walls"
    description: |
      WA HB 1337 opened the door for two ADUs per single-family lot statewide, and
      Edmonds homeowners in 98020 are actively converting attached garages into AADUs
      to generate rental income. The IRC requires 5/8-inch Type X drywall on the wall
      and ceiling between the garage and habitable space — one layer on the garage side,
      taped and finished. Inspectors with the City of Edmonds Building Division check
      this at rough-in, and they are not forgiving about substituting standard 1/2-inch
      board to save money. The same firecode rule applies to the ceiling assembly if
      there is a habitable room directly above. TopVolk is a WA Licensed Contractor and
      handles the full drywall scope on ADU conversions, coordinating with electrical
      and mechanical rough-in so the board goes up after every inspection sign-off.
      Typical firecode drywall scope on a two-car garage conversion runs $2,200-$4,500
      depending on ceiling height and linear footage.

  - title: "Level 5 Finish for Kitchens and Baths Under Recessed and Sidewall Lighting"
    description: |
      Remodeled kitchens in Edmonds are increasingly spec'd with recessed LED arrays and
      undercabinet lighting — both of which rake light across the wall at a low angle
      and make every trowel mark and fastener dimple visible. A Level 3 or Level 4
      finish, standard on most new construction, will not hold up under that lighting
      in a freshly painted kitchen. Level 5 requires a full skim coat of joint compound
      over the entire taped surface, sanded flat, before primer goes on. That process
      adds roughly $0.75-$1.25 per square foot to the drywall scope — for a typical
      200-square-foot kitchen gut-and-rebuild, the Level 5 upcharge runs $400-$800.
      Vladislav walks every scope with a raking light source during the blue tape
      walkthrough to catch surface issues before paint, so the punch list doesn't
      include finish problems the client has to point out themselves.

  - title: "Soundproofing Between Bedrooms and Shared Walls in Multi-Story Homes"
    description: |
      Split-level homes in the Meadowdale area and the older two-story colonials near
      Yost Park have notoriously thin interior walls — 2x4 framing with a single layer
      of 1/2-inch drywall and no insulation between rooms. Adding QuietRock 530 or
      installing resilient channel with an additional layer of 5/8-inch board drops
      sound transmission significantly. Resilient channel decouples the drywall from
      the stud, breaking the direct path for impact noise; QuietRock 530 uses a
      constrained-layer damping compound bonded to the gypsum core. For a primary
      bedroom sharing a wall with a family room or home office, either approach costs
      $800-$1,800 for a single wall depending on dimensions and whether the existing
      layer stays or comes off. Rockwool Safe'n'Sound batt insulation packed into the
      stud cavity compounds the effect — this scope pairs naturally with second-floor
      remodels where MEP rough-in is already opening the ceiling.

faq:
