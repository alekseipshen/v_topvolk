title: "Edmonds Carpentry — Millwork for Waterfront-Era Homes"

intro: |
  The streets running uphill from the Edmonds ferry landing — through The Bowl, the old
  heart of downtown — hold some of the most intact early Craftsman housing in Snohomish
  County. These 1910s and 1920s bungalows have original Douglas-fir window casings, built-in
  bookcases flanking brick fireplace surrounds, and wainscoting that was milled on-site when
  the house went up. A century of Pacific Northwest rain has done what it always does:
  exterior cedar fascia has checked and split, door casings have swelled and paint-peeled
  where the drip edge was never detailed right, and more than a few window seats have
  developed soft spots from water infiltrating through original single-pane glazing. Up
  through the Five Corners neighborhood and along the hillside streets above 9th Avenue
  North, the housing shifts to 1960s ranchers and split-levels — different style, but the
  carpentry needs run just as deep. Matching an interior door to an existing Craftsman
  casing profile requires the same precision a Marvin window rough-in demands: get the
  reveal off by an eighth inch, and it reads wrong every time you walk past it.

localContext: |
  Most of the residential stock in 98020 — the zip covering downtown Edmonds, Brackett's
  Landing, and the waterfront neighborhoods — was built between 1910 and 1955. Original
  post-and-pier foundations, knob-and-tube wiring in attics, and fir subfloors are common.
  That construction era means built-ins and millwork with profiles that can't be matched off
  a lumber yard shelf; they were custom-milled locally from species that matter when you're
  doing restoration work that has to read as original. The 98026 corridor — covering the
  Perrinville area and the neighborhoods that blur into the Lynnwood border — runs more
  mid-century ranchers and early-1980s tract construction, where the carpentry problems
  shift toward builder-grade trim that's never held paint well, hollow-core door
  replacements, and closet systems that were nothing more than wire shelving on anchored
  standards. Edmonds sits in a genuine marine climate: 37-plus inches of rain annually,
  north-facing exterior surfaces that grow moss from October through April, and enough
  humidity cycling to work any wood joint loose over time. Pressure-treated (PT) lumber at
  any ground-contact nailer, proper vapor barriers in crawlspaces, and thoughtful species
  selection aren't optional here — they're the difference between work that lasts twenty
  years and work that needs redoing in five.

commonProblems:
  - title: "Cedar Fascia and Exterior Trim Decay on Edmonds Marine-Climate Homes"
    description: |
      Exterior trim on homes from The Bowl up through the waterfront streets takes a
      sustained beating. The marine exposure — persistent rain, high humidity through
      winter, and that north-facing moss problem — accelerates what happens to cedar fascia
      that wasn't back-primed at installation. Checking starts at the cut ends, water
      tracks into the grain, and eventually the board goes soft behind the paint film. The
      fix isn't just slapping new boards up; you need to address why the original failed.
      That means replacing the drip-edge flashing detail at the top, back-priming new
      clear-heart cedar on all four faces before install, and setting fasteners with
      exterior-grade stainless ring-shank nails — not galvanized box nails that will bleed
      rust streaks inside two rainy seasons. On dormers and gable ends where the original
      fascia ties into a rake board, the miter detail matters: open miters wick water
      straight into the joint. Expect $800–$2,200 for a full fascia run on a typical 1920s
      Edmonds bungalow, depending on linear footage and how much rot has migrated into the
      sub-fascia or rafter tails behind.

  - title: "Craftsman Built-In Window Seats and Bookcases — Repair and Matching New Work"
    description: |
      The Craftsman built-ins in the older homes near downtown Edmonds — window seats with
      storage compartments below, flanking bookcases with plate rails and leaded glass
      uppers — are often the primary reason someone bought the house. When a built-in needs
      repair or extension, matching the original is harder than it looks. Most profile work
      was done with custom-ground router bits or shapers running quarter-round, cove, and
      bead combinations that don't exist in any big-box catalog today. Getting it right
      means taking direct templates off existing millwork, sourcing clear vertical-grain
      fir — not the flat-sawn fir at the lumber yard — and running sample profiles before
      touching anything original. For full built-in fabrication with face-frame construction,
      adjustable shelving, and a painted finish, budget $4,500–$9,000 depending on linear
      footage and whether you're adding a base with raised-panel detail. The rough-in needs
      to account for blocking behind the drywall for case and base nailers, and the window's
      rough opening clearances if the seat runs under a sill.

  - title: "Interior Door Replacement When Original Craftsman Casing Profiles Must Match"
    description: |
      Swapping an interior door in a 1920s Edmonds Craftsman isn't a quick hardware store
      trip. Original Craftsman door casings run wide — typically 3¼ to 3½ inches — with a
      back-band profile and a specific reveal off the jamb that modern pre-hung doors don't
      accommodate. If existing casing is original fir and in decent shape, new casing has
      to be profiled from stock or ordered as custom millwork. Hollow-core slabs won't hold
      a mortised hinge or a strike plate worth anything on doors over 32 inches wide —
      solid-core slabs are the right call on any primary passage door. For a single door
      with new jamb, matching casing, and a Schlage or Baldwin hardware set, installed cost
      typically runs $850–$1,600 depending on door width and casing profile complexity. For
      City of Edmonds purposes, door replacements in existing openings are generally exempt
      from building permits as long as the structural header isn't being modified — but any
      header work triggers a plan review through Edmonds Development Services. TopVolk is
      a WA Licensed Contractor and handles permit applications directly when that threshold
      is crossed.

  - title: "Stair Stringer Rebuilds and Tread Replacement in Edmonds's Hillside Homes"
    description: |
      Stair work in the hillside homes above Edmonds — particularly the 1940s–1960s stock
      on the streets north of Sunset Avenue — shows a predictable failure pattern. Original
      stringers were cut from solid fir at nominal 2x12 stock, but notching for treads and
      risers reduces net depth below what IRC §R311.7 requires for adequate section strength.
      When treads cup or a riser cracks, it looks cosmetic. Often it's not. A stringer that's
      lost section depth deflects under load, and the whole stair starts to move. Rebuilding
      means either sistering new LVL stringer stock alongside the existing cut stringer or
      full replacement with new 2x12 Douglas-fir stringers cut to proper geometry — minimum
      3½-inch tread run above the stringer cut, maximum 8¼-inch riser height, no
      tread-to-tread variance exceeding 3/8 inch per IRC. New treads in ¾-inch white oak or
      1-inch fir, routed with a nosing profile and finished with Rubio Monocoat for
      durability, run $3,800–$7,500 for a typical 12-to-14 riser stair, not including
      painting the risers and skirt board.

  - title: "Wainscoting and Beadboard Installation — Period-Appropriate Details in 98020 Homes"
    description: |
      A number of the bungalows and early Colonials near Edmonds's railroad district had
      wainscoting as an original construction detail that was stripped out during 1970s
      renovations when paneling and wallpaper were fashionable. Installing new wainscoting
      that reads period-appropriate takes more than running beadboard up to a chair rail.
      The profile work at the base cap, chair rail, and any raised-panel sections needs to
      be consistent — same reveal, same setback from the drywall face, corners mitered (not
      coped) for painted work this wide. For standard beadboard wainscoting at 42 inches
      with a 3½-inch base cap and 2¾-inch chair rail, expect $18–$28 per linear foot
      installed, depending on corner count and whether there's an inside-corner scribing
      situation. Bathrooms add cost: moisture-tolerant MDF or PVC-based trim products are
      required, and any penetrations through the wainscot panel for outlets or switches need
      to be cut tight and caulked with a paintable silicone. A full dining room perimeter
      at roughly 50 linear feet runs $1,100–$1,600 in combined materials and labor.

faq:
  - q: "How fast can you get to Edmonds for a carpentry estimate?"
    a: |
      Edmonds is a straightforward drive from where most of our Seattle Metro work is
      concentrated — up I-5 or SR-99 to SR-104, typically 30–40 minutes from central
      Seattle depending on traffic. Vladislav does the on-site estimate himself, so you're
      not talking to a scheduler or a sales rep — you get the contractor who will actually
      look at the built-in or trim detail and give you a number on the spot. For Edmonds
      and the surrounding 98020 area, we can usually schedule an estimate within 3–5
      business days. Call (206) 591-1096 to set that up directly.

  - q: "What does custom built-in or finish carpentry cost in Edmonds?"
    a: |
      Scope drives cost more than anything else. A single window seat with a hinged lid and
      face-frame construction, painted, runs $1,800–$3,200 installed. Full flanking
      bookcases with face-frame, adjustable shelving, and a period-appropriate molding
      profile — the kind you'd see in a 1920s Craftsman in The Bowl — run $4,500–$9,000
      depending on height, width, and complexity of the top molding work. Those numbers
      come from actual Edmonds projects completed since 2017, not off a price list.
      Vladislav provides a line-item quote — not a range — after the on-site visit. Call
      (206) 591-1096 to schedule a free consultation.

  - q: "Do you pull permits for carpentry work through the City of Edmonds?"
    a: |
      Most interior carpentry — built-ins, trim, door replacements in existing openings,
      wainscoting — doesn't require a permit under Edmonds Development Services guidelines.
      The threshold is crossed when structural work is involved: modifying a header, moving
      a load-bearing wall to accommodate a built-in alcove, or rebuilding a stair that
      requires a new landing or egress change. In those cases, TopVolk handles the permit
      application through the City of Edmonds Building Division, prepares the required
      drawings, and manages the inspection schedule. As a WA Licensed Contractor, we pull
      permits directly — you don't have to chase paperwork. Plan review for minor structural
      work in Edmonds typically runs 2–4 weeks.

  - q: "Do you work with both painted and stained finishes, or just one?"
    a: |
      Both — and they require different material choices from the start. Painted millwork
      typically uses finger-jointed pine or moisture-resistant MDF for flat surfaces:
      cost-effective and takes paint cleanly when primed correctly. For Craftsman
      restoration work where the profile needs to match original fir, we use clear
      vertical-grain fir or specify poplar for painted applications with complex profiles.
      Stained work on stairs or built-ins is usually white oak or clear fir, finished with
      Rubio Monocoat or Bona Traffic HD for high-wear surfaces. The finish spec affects
      both the material cost and the labor time, so it's worth nailing down before the
      quote is written.

  - q: "How long does a carpentry project typically take in Edmonds?"
    a: |
      Interior trim and door replacement in a single room: 1–3 days on-site. A built-in
      window seat with flanking bookcases: 4–7 days on-site, plus 1–2 weeks for shop
      fabrication of face frames and doors if they're being built off-site first. A full
      stair rebuild runs 3–5 days. Those timelines assume material lead time is coordinated
      before the start date — some hardwood species and custom-milled profiles carry a
      1–2 week lead. Missed deadlines aren't just a conversation at TopVolk; a penalty
      clause is written into the contract. Over 100 projects completed since 2017 across
      King, Snohomish, Pierce, and Kitsap counties — the schedule gets kept.

  - q: "Do you cover areas near Edmonds — Shoreline, Lynnwood, Mountlake Terrace?"
    a: |
      Yes. From Edmonds (98020), TopVolk regularly works in Shoreline, Lynnwood (98036,
      98037), Mountlake Terrace, Mukilteo, and south into Kenmore and Bothell. The
      Snohomish County PDS jurisdiction covers unincorporated areas north of Edmonds;
      incorporated cities like Lynnwood and Mountlake Terrace have their own permit centers.
      Scheduling across those jurisdictions isn't an issue — we know the permit processes
      for each. To get on the calendar for Edmonds or any nearby community, call
      (206) 591-1096 or schedule a free on-site estimate with Vladislav directly.