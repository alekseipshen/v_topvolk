title: "Edmonds Kitchen Remodel — Open Layouts for Waterfront-Era Homes"

intro: |
  The ramblers and split-levels through Five Corners and above the Edmonds ferry terminal in 98020 were built when cooking was hidden work — galley kitchen, door closed, separated from the dining room. Opening that up means a load-bearing wall analysis and an LVL beam before anything cosmetic happens. If you're fitting a Bosch induction range or building around a Thermador column fridge, the structural rough-in has to come first.

localContext: |
  Homes in 98020 near the waterfront — from the blocks above Brackett's Landing beach park down through the Puget Sound-facing streets toward the Edmonds-Kingston ferry dock — and through the Meadowdale area in 98026 follow a familiar pattern: 1,400–1,800 sq ft ramblers and split-levels with original 100-amp electrical panels and kitchens never designed for modern appliances. The hillside streets above downtown Edmonds and the single-family blocks around Five Corners hold the highest concentration of this mid-century housing stock. Mid-century here means crawlspaces, not basements — and crawlspace moisture is common on north-facing lots a few blocks off the water. Vapor barrier work under the subfloor often surfaces during a full kitchen gut. Snohomish County PDS handles permits for both city-limit and unincorporated parcels in 98026; plan review runs 4–8 weeks when structural or gas changes are on the drawings.

commonProblems:
  - title: "Load-Bearing Walls Blocking the Open-Concept Layout"
    description: |
      Most 1960s Edmonds ramblers have a wall between the kitchen and dining room that carries roof load directly. Removing it requires engineering a proper LVL beam — typically 3.5" x 9.5" or deeper depending on span — with PSL posts bearing down to the foundation. Skipping the structural calculation is how remodels get red-tagged at rough-in inspection under Snohomish County PDS.

  - title: "100-Amp Panels That Can't Handle Modern Kitchen Loads"
    description: |
      Induction ranges from Bosch or KitchenAid draw 40–50 amps on a dedicated circuit. Add a Sub-Zero column refrigerator, a dishwasher, and undercabinet LED dimmers, and a 100-amp main panel runs out of capacity fast. Most Edmonds kitchen remodels over $60K include a panel upgrade to 200A as part of MEP coordination before the electrical rough-in inspection.

  - title: "Gas Line Relocation When the Range Moves to an Island"
    description: |
      Moving a range from an exterior wall to a center island means rerouting the gas supply line — permit-required work under Snohomish County PDS. The existing stub-out is often undersized for a Wolf or Thermador range running at 15,000+ BTU. Range hood venting changes trigger a separate mechanical permit review, so both need to be on the drawings from the start.

faq:
  - q: "How fast can you get to Edmonds for Kitchen Remodel?"
    a: |
      Edmonds is typically 25–35 minutes depending on I-5 and SR-99 traffic. Vladislav can usually schedule an on-site walk-through within a week. Call (206) 591-1096 — TopVolk is WA Licensed, owner-led, and has completed 100+ projects across the Seattle metro since 2023.

  - q: "Do you work with Bosch, Thermador, and Sub-Zero specs during the remodel?"
    a: |
      Yes. Rough-in dimensions, ventilation CFM requirements, and dedicated circuit specs vary significantly between brands. Bosch dishwashers have specific opening heights, Sub-Zero column units need precise cabinet depth clearance, and Thermador ranges require custom hood sizing. Appliance specs get reviewed before framing so nothing gets rebuilt.

  - q: "What does a full kitchen remodel cost in Edmonds, and how long does it take?"
    a: |
      Most full kitchen remodels in Edmonds run $45K–$120K depending on layout changes, cabinet tier (IKEA vs. semi-custom vs. full custom), and appliance package. Construction takes 6–10 weeks once permits clear. Snohomish County PDS plan review adds 4–8 weeks up front for structural or gas work. Deadline penalties are written into every TopVolk contract.