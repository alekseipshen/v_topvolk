title: "Edmonds Fence Installation — Cedar, Vinyl & PNW Weather"

intro: |
  Puget Sound fog rolls through Edmonds every morning from October through April, and that sustained coastal moisture does a specific thing to fence posts: it accelerates rot at ground level, particularly in the clay-heavy soil along the bluffs above Brackett's Landing. A 4x4 Douglas-fir post set without a proper gravel drainage bed in that soil can start checking and softening within three to four years — well before the fence looks obviously bad from the street. Homeowners in the Bowl, the older residential core of 98020, usually call us after a gate stops latching or a panel leans, not when the fence first looks weathered. Vladislav Volkov has built cedar privacy fences, horizontal-slat designs, Trex composite rail, and vinyl privacy panels across Edmonds since 2023, completing 100+ projects across Snohomish, King, Pierce, and Kitsap counties. Call (206) 591-1096 for a free on-site estimate — no salesperson, just the contractor who'll build the fence.

localContext: |
  Most Edmonds residential lots were developed between the 1950s and the 1980s. Split-levels and ranchers dominate in zip codes 98020 and 98026, particularly in Westgate and the Perrinville area near the city's eastern edge. These older lots run narrow — 50-foot frontages are common — and a single 6-foot cedar privacy fence can involve multiple neighbors and a property survey conversation before the first post goes in. Horizontal-slat cedar fences are popular here, matching the Pacific Northwest aesthetic, but cedar on north-facing runs stays shaded and wet from October through May, which accelerates graying and surface checking. The salt air coming off Puget Sound is harder on galvanized gate hardware than most product specs account for — zinc-plated hinges start surface-rusting within 18 months. And Edmonds sits in a moderate coastal wind corridor, which means post spacing and concrete footing depth matter more than they do on jobs farther inland.

commonProblems:
  - title: "Post Rot and Gate Sag on Edmonds's North-Facing Fence Lines"
    description: |
      Cedar and Douglas-fir posts set directly in Edmonds clay soil — without a gravel collar and proper concrete footing — absorb ground moisture continuously from October through May. The rot typically starts six inches below grade, invisible until the post wobbles or the gate drops on one side. By that point, the rail brackets and picket attachment points are already pulling loose from softened wood fiber. Fixing a leaning 6-foot cedar fence typically means pulling and resetting posts in 80-pound concrete footings at 28–36 inches of depth — Snohomish County's frost depth requirements plus the added load of saturated soil. Pressure-treated (PT) lumber at ground contact is the right call for posts. It adds $8–12 per post over untreated cedar but extends service life from roughly 8 years to 20+. Budget $400–800 per section for full post replacement depending on panel width and site access.

  - title: "Cedar Weathering Versus Vinyl Panel Performance in PNW Rain"
    description: |
      Cedar fencing looks clean for the first two or three seasons in Edmonds, then starts graying and checking on north-facing runs where the shaded fence line stays wet too long. Horizontal-slat designs are even more vulnerable — water sits on the top edge of each slat rather than shedding off, and the end grain soaks in moisture from both sides. Applying a penetrating oil sealer every two years helps substantially; Cabot Australian Timber Oil performs well in high-moisture PNW conditions and soaks into the grain rather than sitting on the surface. Vinyl fencing — CertainTeed Bufftech profiles are a common choice — eliminates that maintenance cycle entirely. Cedar runs $28–42 per linear foot installed; vinyl runs $38–55 per linear foot. On a 150-foot fence perimeter in Westgate, that's a $1,500–$2,000 premium for vinyl over cedar. Some homeowners split the approach: vinyl on the shaded north run, cedar on the sunny south and west sides.

  - title: "Permits, Property Lines, and Survey Requirements in Edmonds"
    description: |
      Fences under 7 feet in Edmonds typically don't require a building permit from the City of Edmonds Building Division. That said, height limits apply regardless: 6 feet maximum on side and rear property lines, 4 feet in the front yard setback. Fences placed directly on the property line — rather than set back 6 inches — require a survey to confirm the line, particularly on the older platted lots in 98020 where corner pins are frequently missing or offset. Unincorporated parcels near the city's eastern edge in Perrinville fall under Snohomish County PDS rather than City of Edmonds, and the permit process differs. Retaining wall-integrated fences over 4 feet of retained height require a permit and engineered drawings under either jurisdiction. Vladislav Volkov is a WA Licensed Contractor and handles the permit paperwork when it's required — call (206) 591-1096 to walk through what your specific lot needs before any work begins.

  - title: "What Fence Installation Actually Costs in Edmonds"
    description: |
      Material grade, site slope, and gate count drive the final number more than anything else. Pressure-treated wood fencing on a flat 150-linear-foot lot in 98020 runs $22–30 per linear foot installed. Cedar privacy panels — vertical boards — run $28–42 per linear foot. Horizontal-slat cedar designs with post caps and stainless hardware land at $45–58 per linear foot. Vinyl privacy panels (CertainTeed Bufftech) run $38–55 per linear foot depending on height and post spacing. Composite rail fencing — Trex Seclusions is a common backyard privacy choice — runs $45–65 per linear foot. Every gate adds $350–700 depending on width and hardware spec. A lot with 2 feet of grade change across 100 feet requires step-racking or stair-stepping the fence line, which adds labor beyond the per-foot rate. A 200-foot cedar privacy fence with two walk gates in Edmonds typically lands between $9,500 and $14,000 all-in. TopVolk provides line-item quotes — not vague ranges.

  - title: "Gate Hardware Failure and Maintenance Near Puget Sound"
    description: |
      Gate hardware degrades faster in Edmonds than in dry inland areas. Standard zinc-plated hinges show surface rust within 18 months of salt air exposure. Self-closing spring hinges — required for pool barrier gates per IRC pool fence code — seize in that environment if they're not stainless steel or powder-coated aluminum. D&D Technologies TruClose self-closing hinges and Lokk-Latch magnetic latches hold up consistently in coastal PNW conditions; the $35–60 per gate premium over box-store hardware is worth it on a fence you'll use daily. Gate sag is almost always a diagonal brace problem or an undersized post sleeve at the hinge post — a 4-foot gate needs a 6x6 post, not a 4x4. Annual maintenance: inspect and re-torque hinge screws, check latch alignment, re-oil cedar slats each spring. Budget $150–300 for a full hardware refresh at year 5 on a wood gate.

