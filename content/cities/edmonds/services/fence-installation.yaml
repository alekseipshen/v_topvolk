  - q: "Do I need a permit to install a fence in Edmonds, WA?"
    a: |
      Most residential fences under 7 feet in Edmonds don't require a building permit from the City of Edmonds Building Division — but height limits apply in every yard zone regardless of permit status. Side and rear fences max out at 6 feet; front yard fences are limited to 4 feet. On the older lots in 98020, where corner pins may be missing from the original plat, a quick survey review before setting posts is worth the cost. Retaining wall-integrated fences over 4 feet of retained height require a permit and engineered drawings under both City of Edmonds and Snohomish County PDS rules. Vladislav Volkov, WA Licensed Contractor, handles permit applications when they're required — you don't have to navigate the City of Edmonds permit portal alone.

  - q: "Can you install horizontal-slat cedar fences like the ones common in Ballard and Capitol Hill?"
    a: |
      Horizontal-slat cedar is one of the more frequent requests in Edmonds, especially in the Bowl neighborhood and along the bluff properties above Brackett's Landing. The construction differs meaningfully from vertical board fencing: slats attach through a dado or router-cut groove in the post, spacing matters for both appearance and drainage, and end grain needs sealing before install. Standard 1x6 or 1x4 cedar slats with 1/4-inch gaps give solid privacy while allowing airflow that slows moisture buildup. Stainless steel screws — not galvanized — are the right call for horizontal-slat work near Puget Sound to prevent rust staining on the cedar face. Post spacing goes to 6 feet on center with 6x6 posts for structural rigidity on longer runs. This style typically prices between $45–58 per linear foot in Edmonds.

  - q: "How long will a cedar fence last in Edmonds, and what warranty do you provide?"
    a: |
      A cedar fence built with pressure-treated posts, proper concrete footings, and stainless hardware should last 15–20 years in Edmonds with basic maintenance: re-oil the wood every two years, inspect and re-torque gate hardware annually. Cedar boards will gray and surface-check on shaded north-facing runs — that's weathering, not structural failure. TopVolk provides a 2-year workmanship warranty on all fence installations; posts that shift, rails that pull, or gates that sag due to our work get fixed at no cost. Manufacturer warranties cover material defects separately — CertainTeed Bufftech vinyl carries a limited lifetime warranty. Vehicle impacts, tree falls, and vandalism aren't covered by either. Vinyl holds up longer with less maintenance: 25+ years is realistic for a properly set vinyl privacy fence in Edmonds' climate.

