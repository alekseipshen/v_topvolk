title: "Edmonds ADU Construction — Two ADUs Now Legal on Your Lot"

intro: |
  The Edmonds-Kingston ferry run fills up fast on weekday mornings — which tells
  you something about how many people want to live near this waterfront. Rental
  vacancy in the 98020 zip stays low year-round, and under WA HB 1337 (2024),
  most single-family lots in Edmonds now qualify for up to two ADUs. That means
  a property owner near Brackett's Landing or up in the Meadowdale neighborhood
  can legally add a detached ADU in the backyard and convert a basement to an
  attached unit simultaneously — a combination that wasn't possible here three
  years ago. TopVolk Construction has been building ADUs across Snohomish County
  since 2023; Vladislav Volkov handles each project directly, from permit
  drawings through rough-in inspection to the blue tape walkthrough. A recent
  Meadowdale DADU included a Navien tankless water heater and a Mitsubishi
  mini-split, keeping the utility footprint compact without cutting corners on
  livability. Call (206) 591-1096 to schedule a free on-site consult with
  Vladislav — not a sales rep, not an estimator.

localContext: |
  Most of Edmonds was built out between 1955 and 1980 — ranchers, split-levels,
  and two-story colonials on 7,000–9,500 sq ft lots running on gentle-to-moderate
  slopes toward Puget Sound. Those lot dimensions work well for DADUs. The 98020
  zip covers Downtown Edmonds and the western residential blocks closest to the
  water; the 98026 zip picks up the inland sections through the Five Corners area
  toward the Lynnwood border. Both zones fall under City of Edmonds Development
  Services for permitting — not Snohomish County PDS, which handles unincorporated
  parcels outside city limits. Plan review in Edmonds currently runs 6–10 weeks
  for a complete ADU submittal. Lot coverage limits cap total impervious surface,
  so a 500–600 sq ft DADU footprint is usually achievable on a standard Edmonds
  lot without triggering a variance — but corner lots in the Seaview area near
  the waterfront need individual setback review. Edmonds also averages close to
  37 inches of rain annually, which makes proper vapor barrier installation and
  site drainage planning non-negotiable for any ground-level ADU build.

commonProblems:
  - title: "DADU vs. AADU vs. Basement Conversion: Which Makes Sense on Your Lot"
    description: |
      Most Edmonds homeowners assume they want a detached ADU because it feels
      most like an independent rental — and they're often right, but not always.
      A basement conversion in a 1965 split-level on the east side of 98026 can
      run $40,000–$70,000 less than new detached construction, because the shell
      already exists. The trade-off is shared-wall sound transmission and a less
      independent feel for tenants. A DADU gives you a proper separate structure —
      typically 400–800 sq ft, with its own entrance, sub-panel, and outdoor
      space — but requires meeting Edmonds' 24-foot height limit and FAR
      calculations. WA HB 1337 removed minimum lot size requirements statewide
      in 2024, so the real decision comes down to your specific lot coverage,
      slope, and budget. TopVolk does a free site walk to show you which option
      pencils out before you spend money on drawings.

  - title: "Utility Separation: Shared vs. Independent Water and Sewer Connections"
    description: |
      City of Edmonds requires an early decision on whether your ADU will share
      the main home's water and sewer lateral or get a separate connection. Shared
      is cheaper upfront — roughly $3,000–$6,000 in plumbing rough-in work — but
      puts both units on one meter, which complicates billing for an unrelated
      tenant. A separate connection means cutting into the street lateral and
      paying a new hookup fee to Olympic View Water and Sewer District or Edmonds'
      own utility, depending on your block; that can run $8,000–$15,000 based on
      distance and depth. On sloped Meadowdale lots where sewer laterals run deep,
      the cost climbs further. Either path requires a rough-in inspection that
      passes before walls close — something TopVolk coordinates directly with the
      AHJ. Budget this line item before finalizing your project number; it's where
      ADU projects most often get surprised mid-build.

  - title: "Navigating City of Edmonds Permit Review for a New ADU"
    description: |
      Edmonds runs its own permit queue through City of Edmonds Development
      Services — separate from Snohomish County PDS, which covers unincorporated
      areas like parts of Lynnwood and Mill Creek. A new DADU submittal needs
      architectural drawings, a site plan showing setbacks and lot coverage, and
      energy compliance documentation. Plan review takes 6–10 weeks from a
      complete package; incomplete submittals restart the clock. Pre-approved ADU
      plan sets exist through state programs, but Edmonds still requires
      site-specific review for setbacks, grading, and utility connections even
      when you use a pre-approved floor plan. TopVolk is a WA Licensed Contractor
      with multiple completed Edmonds submittals — Vladislav prepares the package
      and tracks it through the queue so you're not calling the permit counter
      every other week. Once the permit issues, active construction on a 500–600
      sq ft DADU typically runs 3–5 months. Call (206) 591-1096 if you want to
      know where your specific lot stands before spending on drawings.

  - title: "What an Edmonds ADU Actually Costs — and What Moves the Number"
    description: |
      A straightforward 500 sq ft detached ADU in Edmonds runs $140,000–$185,000
      all-in, covering permit fees, site work, framing, MEP coordination,
      insulation, and finishes. Slope is the biggest variable: a flat Five Corners
      backyard is cheaper to build on than a sloped Seaview lot requiring a stem
      wall or helical piers. Finish level moves the number too — builder-grade LVP
      flooring and stock cabinets land at the lower end; LVL beam spans for an
      open-plan layout, quartz counters, and a Bosch appliance package push toward
      $185K and above. Soft costs add up fast: Edmonds permit fees run $3,000–
      $6,000, engineering (if required) adds $2,000–$4,000, and utility connection
      fees vary by hook-up type. TopVolk provides direct line-item quotes — not
      ranges — after the site visit. The contract includes a deadline penalty
      clause: if we miss the agreed completion date, there's a financial
      consequence on our end, in writing, before work starts.

  - title: "Older Edmonds Lots: Drainage, Crawlspace Moisture, and Soil Conditions"
    description: |
      Edmonds sits on a mix of glacial till and alluvial soils, with grades that
      run toward the Sound, and drainage is real work here — not an afterthought.
      A 1968 rancher in the 98020 zip often has an existing crawlspace with a
      failing vapor barrier. Building a new DADU adjacent to that structure means
      addressing the moisture problem first: installing fresh 6-mil poly vapor
      barrier, improving site drainage with perforated drain tile, and potentially
      regrading the adjacent yard. For ground-level ADU slabs, DriCore subfloor
      panels above the concrete add a thermal and moisture break that makes a
      meaningful difference in livability during Edmonds' long wet season. Any
      PT (pressure-treated) lumber in ground contact needs to be spec'd correctly
      for this climate. On north-facing ADU walls, Hardie cement-board siding
      holds up far better than cedar or LP SmartSide — it simply doesn't absorb
      the moisture that accumulates on shaded surfaces from October through April.

faq:
  - q: "How fast can you get to Edmonds for an ADU consultation?"
    a: |
      Edmonds is a regular service area for TopVolk Construction. From King County,
      it's roughly 25–30 minutes up I-5 or Highway 99 without traffic — no
      extended travel fees apply. Vladislav Volkov does the site visit personally;
      you're meeting the person who will run the project, not someone whose job
      is to close the sale. Scheduling typically runs 3–7 business days out for
      an initial consult. A detailed line-item quote follows within 5–7 days of
      that meeting. Evening and Saturday appointments are available for homeowners
      who can't do weekday visits. Call (206) 591-1096 to get on the calendar.

  - q: "What does building an ADU in Edmonds cost per square foot?"
    a: |
      For a detached ADU in Edmonds, budget $260–$340 per square foot for the
      finished structure, excluding permit fees and utility connection costs. A
      500 sq ft DADU runs roughly $130,000–$170,000 in hard construction costs
      before soft costs are added. Basement conversions come in lower —
      $80,000–$130,000 depending on how much structural and MEP work the existing
      space requires. Foundation type moves the number most on sloped lots:
      a slab pour is cheapest, a stem wall or helical pier system on a grade adds
      $8,000–$18,000. TopVolk provides exact line-item pricing after the site
      visit, not a range estimate from a phone call.

  - q: "Does Edmonds require a separate building permit for an ADU?"
    a: |
      Yes — City of Edmonds Development Services issues its own building permits,
      and an ADU goes through a full plan review cycle, not an over-the-counter
      approval. For a new DADU, allow 6–10 weeks from a complete submittal.
      Attached ADUs and basement conversions sometimes move faster if no
      structural modifications are involved. The application requires a site plan,
      architectural drawings, energy code compliance documentation (IRC-compliant,
      R-49 attic insulation minimum), and utility connection details. TopVolk
      handles the permit package as part of the project — as a WA Licensed
      Contractor with multiple Edmonds submittals completed, Vladislav knows what
      the city reviewers flag and what slows packages down.

  - q: "Can the ADU have a full kitchen, laundry, and separate HVAC in Edmonds?"
    a: |
      Yes. Edmonds allows full kitchen and laundry in both attached and detached
      ADUs, with no city-specific restrictions on appliance type beyond standard
      IRC code compliance. A typical ADU kitchen we'd build includes an induction
      or gas range, a range hood rated 400+ CFM vented to the exterior (not
      recirculating), and a Bosch or LG dishwasher. Laundry rough-in is a matter
      of running the correct drain, supply, and 240V outlet during the MEP phase —
      straightforward when planned from the start, expensive to retrofit later.
      For heating and cooling, a Mitsubishi mini-split handles an ADU efficiently
      without requiring ductwork, which simplifies the mechanical rough-in and
      keeps ceiling heights intact.

  - q: "How long does an Edmonds ADU take from start to move-in?"
    a: |
      End-to-end — design, permit, and construction — plan on 7–10 months for a
      new DADU in Edmonds. Permit preparation and plan review account for roughly
      2–3 months of that. Active construction on a 500–600 sq ft detached ADU
      runs 3–5 months after permit issuance: foundation and framing (4–6 weeks),
      MEP rough-in and rough-in inspection (3–4 weeks), insulation and drywall
      hang/tape/mud (2–3 weeks), finish work and final inspection (3–5 weeks).
      Exterior work scheduled through the October–March rainy stretch needs
      careful sequencing for framing and dry-in. The completion date goes into
      the contract with a penalty clause — that deadline is a real commitment,
      not an estimate with a disclaimer attached.

  - q: "Do you build ADUs in Mountlake Terrace, Lynnwood, and Shoreline too?"
    a: |
      Yes. TopVolk covers the full Snohomish and King County service area.
      Mountlake Terrace (98043) and Lynnwood (98036, 98037) are regular project
      areas — incorporated Lynnwood runs its own permit queue, while unincorporated
      parcels nearby fall under Snohomish County PDS. Shoreline (98133, 98155)
      is in King County and permits through the City of Shoreline's own center.
      Each jurisdiction has its own plan review timeline and fee schedule, but
      the build sequence is the same. If your property sits anywhere in the
      Edmonds–Lynnwood–Mountlake Terrace corridor, call (206) 591-1096 and
      Vladislav will confirm whether your lot qualifies under WA HB 1337 and
      what the permit path looks like.