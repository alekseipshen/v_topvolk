title: "Edmonds Handyman Services — Punch List, Repairs & Upgrades"

intro: |
  Salt air off Puget Sound does things to caulk joints and exterior trim that Seattle rain alone takes years to accomplish. Near the Edmonds ferry dock and along the waterfront blocks in 98020, northwest-facing facades get hammered by moisture from October through April — and the repair list grows whether homeowners are paying attention or not. Further east toward Five Corners, the houses are newer but the deferred work is similar: a Moen kitchen faucet dripping since the last remodel, a Nest thermostat still in its box, a handful of drywall patches left over when the plumber finished and the GC moved on. TopVolk Construction LLC handles exactly this kind of work. Vladislav Volkov has completed 100+ projects across Snohomish and King counties since 2023, and handyman work is often how larger renovation relationships get started. Call (206) 591-1096 to schedule a free on-site estimate with the person who will actually do the work.

localContext: |
  Housing in Edmonds covers a wide span of eras. Downtown and the waterfront blocks — zip code 98020 — hold a mix of 1940s and 1950s cottages, craftsman-influenced post-war homes, and 1960s split-levels. Galvanized supply lines are still common in properties that haven't had full replumbing; original cedar and Douglas-fir exterior trim has often been painted over multiple times, and the paint is failing rather than the wood underneath. East into the Esperance and Seaview areas (98026), the housing stock shifts toward 1970s and 1980s builder-grade construction — original fixtures either still in place or swapped once with cheap hardware in the late 1990s. Snohomish County PDS handles permits for unincorporated addresses, while the City of Edmonds has its own Development Services permit center for properties inside city limits. For most handyman-scope repairs, no permit is required at all — but when one is, pulling it through the correct jurisdiction from the start matters.

commonProblems:
  - title: "Punch List Buildup After Remodels and Partial Renovations"
    description: |
      Remodels rarely wrap up clean. The GC finishes the structural and finish work, the trades pull out, and you're left with a list: door hardware still in the packaging, a gap in the caulk at the tub-to-tile transition, recessed lights with mismatched trim rings, a Schluter edge strip at the shower threshold lifting at one corner. In older Edmonds homes around 98020 that have been renovated in pieces, those lists layer up over years into something substantial. A blue tape walkthrough before final billing is supposed to catch all of it — but it doesn't always. Vladislav works through punch lists with a written itemized scope agreed on before any work starts. Most visits run a half to full day and cost $350-$700 depending on how many items are on the list and whether any require materials to be sourced ahead of time.

  - title: "Drywall Patches and Texture Matching on Mid-Century Ceilings"
    description: |
      Holes accumulate in any lived-in home. A TV mount that moved, a doorknob that punched through the wall because the doorstop was never installed, a plumber's access hole cut in the wrong spot. Patching the drywall itself is straightforward — fill, mud, sand. Matching the existing texture is where most DIY repairs fall apart, especially on ceilings in 1960s and 1970s Edmonds homes that have skip-trowel or hand-applied knockdown texture. A spray can of orange peel doesn't replicate hand-troweled work applied 50 years ago. Proper texture matching means feathering the joint compound out wide, letting it dry completely between coats, and applying texture in layers until it blends at arm's length and under raking light. Patch repairs typically run $150-$350 depending on hole count, size, and texture complexity. Repainting after is quoted separately.

  - title: "Fixture Replacement — Faucets, Toilets, and Recessed Lighting"
    description: |
      Fixture-for-fixture replacements — swapping a dripping Moen faucet, replacing a running toilet's fill valve and flapper, upgrading recessed can lights to LED trim housings — generally don't require a permit from the City of Edmonds or Snohomish County PDS when no new wiring or supply lines are being added. The complications are in the details. Kohler and Moen faucets use specific cartridge types; going from a two-handle to a single-handle configuration requires a deck plate to cover the extra holes or a different sink entirely. Under-sink shutoffs that haven't turned in 20 years may need replacing before the faucet swap can even start. Fixture replacement is scoped by item: $175-$350 per fixture depending on access and whether shutoffs or supply lines are also due. TopVolk is a WA Licensed Contractor — when a fixture swap does cross into permit territory, the right paperwork gets pulled before work starts.

  - title: "Deck Board Replacement and Composite Upgrades"
    description: |
      North-facing deck surfaces in Edmonds barely dry out between October and May. Cedar deck boards on 1970s and 1980s homes in the Seaview neighborhood hold up 15-20 years on average, but once they start checking and delaminating, individual board replacement beats full re-decking — provided the structural framing (joists, rim joist, ledger board) is still solid. Composite boards like Trex Enhance or TimberTech AZEK are the right replacement material in the PNW climate: they don't absorb moisture, won't grow moss the way raw wood does through a wet winter, and carry 25-year warranties against fade and staining. Loose deck railings are often a post-base problem — the post sleeve or blocking at the rim joist corrodes and the post works free over time. Composite board replacement typically runs $18-$26 per linear foot installed, materials included. Structural repairs to joists or ledger are quoted separately after inspection.

  - title: "Weatherstripping Failures and Minor Exterior Repairs"
    description: |
      Original weatherstripping on 1960s and 1970s exterior doors in Edmonds has been failing for decades — most of it was replaced at some point with foam tape, which compresses and stops sealing within 2-3 years. The correct fix is an interlocking metal threshold and jamb seal, or a high-quality EPDM bulb strip on the jamb sides paired with a proper door sweep at the bottom. That combination lasts 10+ years. Salt air from Puget Sound accelerates corrosion on exterior trim fasteners and metal door hardware near the waterfront. Rotted trim at window casings and soffit boards on north-facing walls is common throughout the older 98020 zip. Hardie cement-board trim or clear-primed vertical-grain cedar are the right replacement materials — both handle the moisture load far better than finger-jointed pine. Weatherstripping a single door typically runs $150-$275 in labor and materials. Exterior trim repairs are quoted per linear foot after a visual inspection.

faq:
  - q: "How fast can you get to Edmonds for handyman work?"
    a: |
      Edmonds is about 15 miles north of Seattle — typically a 25-35 minute drive off I-5 at 76th Ave W or via Highway 99 depending on traffic. Most consultation visits can be scheduled within 3-5 business days, and the majority of handyman jobs in the area run 1-2 days of on-site work once materials are sourced. Vladislav comes out, walks through the full list, and writes a line-item quote before anything starts — no commissioned estimators, no back-and-forth with a scheduling coordinator. Deadlines and completion dates get written into the contract; if a scheduled completion date is missed on TopVolk's end, there's a financial penalty built in, not just an apology. Call (206) 591-1096 to get on the calendar.

  - q: "What does handyman work in Edmonds typically cost?"
    a: |
      Most handyman jobs are scoped and quoted by the project, not by the hour. A punch list visit after a remodel — caulking, hardware installation, fixture touchups, minor drywall patches — typically runs $400-$800 for a full day of work. Individual fixture replacements like a Kohler toilet or Moen faucet run $175-$350 per item depending on complexity and whether shutoffs or supply lines also need replacing. Composite deck board replacement with Trex or TimberTech runs $18-$26 per linear foot installed. Weatherstripping a door is $150-$275. The on-site estimate is free, and the quote is fully itemized — every line gets its own number. No vague ranges, no scope creep after the fact.

  - q: "Do handyman repairs in Edmonds require permits from the City or Snohomish County PDS?"
    a: |
      Most standard handyman work doesn't require a permit. Fixture-for-fixture plumbing replacements, drywall patches, weatherstripping, hardware installation, and smart home device swaps all fall below the permit threshold for both the City of Edmonds Development Services and Snohomish County PDS. Where permits come into play: running a new electrical circuit, adding a junction box where one didn't exist, or any structural modification. TopVolk is a WA Licensed Contractor, so when a repair does cross into permit territory, paperwork gets pulled through the correct jurisdiction — City of Edmonds for in-city addresses, Snohomish County PDS for unincorporated addresses like parts of Esperance — before work starts. Skipping permits on work that requires them creates real problems when you go to sell.

  - q: "Can you install smart home devices like Nest or Ring in older Edmonds homes?"
    a: |
      Smart thermostats, Ring or Nest doorbell cameras, smart dimmer switches, and smart lock installations are all standard handyman work. The most common complication in pre-1990 Edmonds homes is the C-wire (common wire) that Nest and ecobee thermostats require to power the display continuously — many older HVAC systems in the Seaview and Westgate neighborhoods were wired without a C-wire at the thermostat. The fix is usually a C-wire adapter kit installed at the air handler, a 1-2 hour job that needs to be done correctly to avoid short-cycling the furnace. For Ring doorbell installations, verifying the existing doorbell transformer outputs 16-24V AC first saves a wasted trip. Vladislav confirms wiring compatibility as part of the scope before quoting the job.

  - q: "How long do handyman repairs hold up in Edmonds's wet climate?"
    a: |
      Material choice matters more than anything else for longevity here. Composite deck boards — Trex and TimberTech both — carry 25-year fade and stain warranties and won't check, rot, or grow moss the way cedar does through a wet PNW winter. High-quality silicone caulk at tub surrounds and window joints lasts 10-15 years before reapplication; standard latex caulk starts peeling at 3-5 years in areas with seasonal movement. Hardie cement-board trim carries a 15-year warranty and doesn't absorb water the way wood does. For weatherstripping, EPDM bulb seal or interlocking metal lasts 10+ years; foam tape needs replacement every 2-3 years. The goal is to fix it once with the right material — not to fix it cheap and be back next season.

  - q: "Do you cover Lynnwood, Mountlake Terrace, and other areas near Edmonds?"
    a: |
      Lynnwood, Mountlake Terrace, Shoreline, Kenmore, Bothell, Mukilteo, and Brier are all in regular rotation — full coverage across Snohomish and King counties. Scheduling windows are typically 1-2 weeks out for handyman visits, though the timeline depends on current project load. Vladislav handles the work directly on smaller jobs, meaning one person who knows exactly what was quoted, what materials are on site, and what the punch list says. No dispatcher, no handoff to a sub you've never met. Call (206) 591-1096 or schedule a free on-site consultation to check availability. 100+ projects completed across the Seattle metro since 2023.