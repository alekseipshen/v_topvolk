  - q: "Do I need a permit for window replacement in Edmonds?"
    a: |
      Like-for-like replacement — same rough opening size, same window type — is permit-exempt in most cases under City of Edmonds Building Division adopted codes. Swap out an old aluminum slider for a new vinyl slider of identical size and you typically don't need a permit.

      Change the RO size, add an egress cut, or convert a fixed unit to operable and a permit is required. Unincorporated parcels in the 98026 Esperance area go through Snohomish County PDS rather than the city — different portal, slightly different timeline, but similar overall process.

      City of Edmonds online portal handles residential window permit applications. Plan review runs two to three weeks for standard residential projects. Vladislav handles the permit application as part of the project scope. Permit fee is included in the quote upfront — it doesn't appear as a surprise line item later. TopVolk is a WA Licensed Contractor.

  - q: "Does laminated acoustic glass actually make a difference for train noise?"
    a: |
      Yes. Measurably. Standard double-pane vinyl sits around STC 26-28. Milgard Quiet Line with an acoustic PVB interlayer hits STC 35-38. At train-pass frequencies — roughly 80 to 100 Hz — that's 8 to 12 dB of actual reduction inside a bedroom. That's not a small increment. It's genuinely audible.

      The installation detail carries equal weight. Foam backer rod fills the gap between the window frame and the rough opening before acoustically-rated sealant goes over it. Standard exterior caulk doesn't seal air gaps the same way, and air gaps transmit noise efficiently regardless of what glass you've specified.

      Homes on Dayton St, Sunset Ave, or anywhere within two blocks of the BNSF mainline in 98020 should specify acoustic glass by default. Milgard Quiet Line and Pella's laminated acoustic option are both available. Vladislav will quote both so you can see the per-window cost difference and decide.

  - q: "What warranty covers windows TopVolk installs in Edmonds?"
    a: |
      Milgard's Full Lifetime Warranty covers glass seal failure, hardware, and frame for the original purchaser's ownership period. Pella and Marvin offer limited lifetime warranties on comparable terms. Those are manufacturer warranties on the product itself.

      None of them cover installation defects or improper flashing. A failed sill pan isn't Milgard's problem under their warranty — it's a workmanship issue. That's why RO prep and flashing details matter as much as the window specification.

      TopVolk provides a separate one-year workmanship warranty on labor, sill pan installation, and flashing. If a seal fails under the manufacturer's warranty, Vladislav coordinates the claim and the replacement directly. You're not navigating a manufacturer's 1-800 line on your own. Owner-operated means one person accountable for the install and the follow-through.

