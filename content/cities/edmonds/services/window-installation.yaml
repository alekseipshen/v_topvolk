title: "Edmonds Window Installation — Rail Noise, Rain & Rot"

intro: |
  The BNSF mainline runs right along the Edmonds waterfront, and if you live near Olympic Beach in 98020, you already know what train vibration does to old glazing compound — it works the putty loose over years until the glass rattles in the frame. Milgard Quiet Line acoustic glass with a PVB interlayer is the specific fix for that problem, pushing STC ratings into the 35-38 range where standard double-pane vinyl sits around 26-28.

  Move east and uphill to the Westgate neighborhood and the problem shifts. North-facing wood windows on those hillside homes stay damp. They don't dry between rain events October through May. The rot starts at the sill corner where the back-dam should be but usually isn't.

  TopVolk Construction LLC has been doing window work in Edmonds and across Snohomish County since 2017 — over 100 projects. Vladislav Volkov owns the company and does the work. One person accountable from estimate to final inspection. WA Licensed Contractor.

localContext: |
  The downtown 98020 grid between Sunset Ave and 9th Ave N is mostly 1950s and 1960s wood-frame construction. Post-and-pier foundations are common. Original wood double-hung windows in those homes are now 60-70 years old — the glazing compound has hardened and cracked, the sash ropes are long gone, and the wood itself is often soft at the corners. Replacement in that zone is straightforward: the rough openings are standard sizes, the framing is accessible, and like-for-like vinyl units go in without structural work in most cases.

  The story is different east of Highway 99 in the 98026 overlap zone — the Esperance area, which is unincorporated Snohomish County, not city-jurisdiction Edmonds. Tract homes from the 1970s and 1980s out there came with builder-grade aluminum sliders. Those units are now 40 to 50 years old. The aluminum frames never had a thermal break, so they conduct cold directly to the glass edge. IGU seals fail. Condensation builds between the panes. Nothing fixes fogged glass except replacing the unit.

  City of Edmonds Building Division processes residential window permits through their online portal. Plan review for a standard window project runs two to three weeks. Snohomish County PDS handles permits for Esperance parcels — slightly different portal, similar timeline.

commonProblems:
  - title: "Failed IGUs in 1960s–70s Aluminum-Frame Windows"
    description: |
      Aluminum frames from that era have no thermal break — the metal runs continuously from outside to inside, conducting cold straight to the glass edge. That temperature differential stresses the IGU seal. Once the seal fails, argon escapes, moisture enters, and the pane fogs permanently. No amount of cleaning fixes it. The unit needs replacement.

      Mid-century ranchers in the flat 98020 grid are full of these windows. Standard openings, typically 3050 or 2846 rough opening sizes. Milgard Tuscany vinyl or Pella 250 Series double-hung units are the practical replacement — vinyl frames with actual thermal breaks, dual-pane low-e glass, and factory-applied weatherstripping.

      Installed cost for a standard 3050 opening runs $600 to $900. That includes the window unit, jamb extensions to match your wall depth (common in older construction where the rough opening depth varies), exterior trim, and flashing. No surprises if the framing is solid. Add $300-$600 per opening if the sill plate or king stud has rot damage.

  - title: "BNSF Rail Noise Penetrating Downtown Edmonds Homes"
    description: |
      The BNSF mainline parallels the shoreline through downtown 98020. Trains run at speed multiple times per hour. Standard double-pane vinyl windows have an STC rating in the mid-20s — that does almost nothing for low-frequency train noise in the 80 to 100 Hz range.

      Milgard Quiet Line uses an acoustic PVB interlayer laminated between the glass lites. STC climbs to 35-38. Pella offers comparable laminated acoustic glass options. The difference inside a bedroom during a train pass is genuinely audible — 8 to 12 dB of reduction at the frequencies trains actually produce.

      The window spec alone isn't enough. Installation detail matters equally. Foam backer rod fills the gap between the window frame and rough opening before acoustically-rated caulk goes over it. Standard exterior caulk doesn't perform the same way. Homes on Dayton St, Sunset Ave, or within two blocks of the tracks should specify acoustic glass. Budget $900 to $1,400 per window installed in that zone.

  - title: "Egress Window Code Compliance in Basement Bedrooms"
    description: |
      IRC Section R310 is direct: a basement bedroom window needs 5.7 square feet of net clear opening, at least 24 inches of clear height, and a sill no higher than 44 inches from the finished floor. Small hopper windows installed in 1970s Edmonds homes in 98026 typically hit none of those numbers. They were never code-compliant as egress.

      Cutting a new rough opening in a foundation wall requires LVL header sizing to maintain the load path above the opening. A Bilco steel window well surround handles drainage and soil retention on the exterior. The window well grate keeps debris out.

      City of Edmonds Building Division requires a permit for this work — it's a structural modification. Timeline from application to final inspection runs three to five weeks. Vladislav pulls the permit as part of the project. It's included in the quote, not added later. TopVolk is a WA Licensed Contractor, and the permit gets filed under that license.

  - title: "Flashing and Back-Dam Details That Actually Keep Water Out"
    description: |
      Edmonds averages 37 inches of rain annually, mostly October through May. Horizontal-driven rain hits west and southwest-facing windows hard. The window itself rarely causes rot. Missing or incorrect flashing does.

      Builder-grade homes from the 1980s and 1990s in Edmonds typically got a caulk bead at the exterior window perimeter and nothing else. No back-dam sill pan. No head flashing. That caulk lasts five to eight years before it splits, and water tracks behind the casing into the rough opening framing. King studs and sill plates rot from the inside out.

      Correct installation uses a pre-sloped sill pan — metal or vinyl — that directs any water that gets past the window back to the exterior. Huber ZIP flashing tape or Protecto Wrap laps over the WRB (weather-resistive barrier) at all four sides. A drip edge at the head jamb sheds water away from the top of the frame. This detail adds $75 to $150 per opening. It's not optional.

  - title: "Vinyl vs Fiberglass — Which Frame Survives Edmonds' Climate"
    description: |
      Vinyl is the dominant window frame material in the PNW for a reason. Milgard Tuscany and Style Line are assembled regionally, the supply chain is short, and vinyl performs well in wet climates. For most Edmonds homes — ranchers, split-levels, builder-grade construction — vinyl is the right call.

      Fiberglass changes the math in specific situations. Marvin Integrity and Pella Impervia have a coefficient of thermal expansion much closer to glass than vinyl does. That means the frame and the IGU expand and contract at similar rates over decades, keeping seal failure rates lower. Craftsman-influenced homes north of downtown, where divided-light units matter aesthetically, often benefit from factory-finished fiberglass that holds paint without peeling.

      Fiberglass costs 30 to 50 percent more than comparable vinyl. Full-house replacement on a 1970s Edmonds rancher with 12 to 16 windows runs $9,000 to $18,000 depending on product selection. Vinyl is correct for most projects. Fiberglass is justified for statement windows, high-exposure elevations, or historic character districts.

