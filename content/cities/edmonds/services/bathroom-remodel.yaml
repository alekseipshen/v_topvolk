title: "Edmonds Bathroom Remodel — Mid-Century Homes, PNW Moisture Fixed"

intro: |
  Perrinville ranchers and the hillside colonials near Five Corners in 98026 were built mostly in the 1960s and 70s — single Kohler pedestal sink, 4-inch ceramic tile set over drywall backer, and a shower/tub combo that made sense when the house was new. Puget Sound sits two miles west, and that marine humidity has been working through grout lines for decades. By the time you see staining on the tile face, the damage behind the backer board is usually already there.

localContext: |
  Downtown Edmonds (98020) holds most of the city's oldest housing — Craftsman bungalows from the 1910s-30s with original cast-iron drain stacks and post-and-pier foundations a block from the ferry landing. Inland Edmonds toward the Lynnwood border (98026) is mostly 1960s-80s ranchers and split-levels with builder-grade finishes. Both eras show up on our work orders regularly. The problems differ — cast-iron drain rerouting vs. waterproofing membrane upgrades — but both require permits through Snohomish County PDS.

commonProblems:
  - title: "Moisture Behind 1960s-70s Tile in 98026 Rancher Bathrooms"
    description: |
      Forty-plus years of shower steam with no real exhaust fan means moisture has been migrating behind 4-inch ceramic set directly over paper-faced drywall. By the time grout starts failing, the substrate underneath is soft. A proper fix strips to the studs, installs Schluter Kerdi waterproofing membrane over cement board, and resets with large-format porcelain. Moen valve rough-ins behind the wall usually need replacement at the same time.
  - title: "Cast-Iron Drain Stacks Corroding in Older Waterfront-Area Craftsmans"
    description: |
      Pre-1950 homes near downtown Edmonds and the ferry terminal (98020) still have 3- or 4-inch cast-iron drain stacks corroding from the inside out. You won't see it until a drain snake hits a partial blockage or a belly in the line causes standing water in the pan. Rerouting to ABS requires opening walls, coordinating a rough-in inspection with Snohomish County PDS, and repositioning fixture layout to reach new drain locations.
  - title: "Master Bath Stuck in a 1975 Layout — No Walk-In Shower"
    description: |
      The standard 1970s master bath in Edmonds ranchers is a 5×8 room with a tub/shower combo and a single-sink vanity. Converting to a curbless walk-in shower — or a shower with a curb, bench, and recessed niche — requires relocating the drain, applying RedGard waterproofing on the pan, and installing a Schluter linear drain or traditional center drain. That plumbing work triggers a permit through Snohomish County PDS.

faq:
  - q: "How fast can you get to Edmonds for a bathroom remodel consultation?"
    a: |
      Edmonds is about 30 minutes from most of our active job sites — I-5 north to exit 177 or Highway 99 through Lynnwood. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017 across King and Snohomish counties. Free on-site consultation, no sales staff — you talk directly to Vladislav. Call (206) 591-1096 to schedule.
  - q: "Do you work with Kohler and Moen fixtures, or can homeowners choose higher-end brands?"
    a: |
      Both brands are standard in Edmonds homes and we work with them regularly. For clients who want to step up, we've installed Brizo, Grohe, and Rohl fixtures — and we're familiar with Schluter trim kits for tile-in valve installations. Vladislav can walk through specific options and rough-in compatibility at the site visit.
  - q: "What does a full bathroom remodel cost in Edmonds, and how long does it take?"
    a: |
      A full bath gut-and-rebuild in Edmonds typically runs $25K-$60K depending on scope — layout changes, plumbing relocation, and tile selection move the number most. Timeline is usually 4-6 weeks from demo to final inspection. Snohomish County PDS plan review adds 2-4 weeks before we can break ground. Deadline penalties are written into the contract. Call (206) 591-1096 to get a line-item quote for your specific project.