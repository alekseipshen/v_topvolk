title: "Edmonds Plumbing — Old Pipes, New Standards Near the Sound"

intro: |
  Puget Sound views come at a cost most buyers don't think about until they're
  mid-remodel. The houses closest to the Edmonds waterfront in 98020 — blocks off
  Sunset Avenue and around the Brackett's Landing area — were mostly built between
  1945 and 1965, which means galvanized steel supply lines and cast-iron drain stacks
  are common finds once walls open up. Further inland toward Five Corners and the
  Seaview neighborhood, the housing stock shifts: 1980s construction with polybutylene
  supply lines, which the industry stopped using by the mid-1990s for good reason.
  Vladislav at TopVolk Construction has run into all of it — rusted galvanized lines
  choking flow to Kohler shower fixtures, poly pipe gone brittle near the water heater,
  and Navien tankless units that couldn't get enough gas pressure because the original
  half-inch line was undersized. Edmonds is a working waterfront town with real housing
  age, and the plumbing reflects that. WA Licensed Contractor, 100+ projects completed
  since 2023.

localContext: |
  Zip code 98020 covers the established core of Edmonds — downtown, the waterfront
  streets, and the hillside neighborhoods above the Kingston ferry terminal. Most of
  those homes date from the 1940s through the 1970s. Beneath updated kitchens and
  finished basements, galvanized water supply lines are still common; galvanized
  corrodes from the inside out, and by the time you notice restricted flow or
  discolored water at a Moen kitchen faucet, the pipe wall is already compromised.
  Zip code 98026 takes in the inland and northern sections — parts of Esperance and
  the neighborhoods near Five Corners — where housing shifts to 1980s and early-1990s
  tract construction. That era brought polybutylene supply piping into thousands of
  Snohomish County homes, and those lines are now at the end of their reliable service
  life. Edmonds also sits on a hillside with significant grade changes, which pushes
  municipal water pressure above 80 psi at lower-elevation homes near the Sound —
  accelerating fixture wear and causing water hammer at shutoff valves. Permits for
  plumbing work here run through the City of Edmonds Development Services department,
  not Snohomish County PDS, since Edmonds is incorporated with its own permit center.

commonProblems:
  - title: "Galvanized Supply Lines in Pre-1960 Edmonds Homes"
    description: |
      In the older blocks near downtown Edmonds and the waterfront streets in 98020,
      galvanized steel supply lines were standard through the early 1960s. These pipes
      corrode internally — the zinc lining breaks down, mineral deposits accumulate, and
      over 60-plus years the interior bore can shrink from three-quarters of an inch to
      barely a quarter inch. You'll see it as low pressure at a Kohler or Moen
      showerhead, rust-tinted hot water first thing in the morning, or a washing machine
      that takes twice as long to fill. The fix is a full repipe with half-inch and
      three-quarter-inch PEX-A — Uponor is the standard — or Type L copper depending on
      run lengths and access. On a typical two-bath home, a galvanized repipe runs
      $8,000–$15,000 depending on crawlspace clearance and whether walls need to open
      for vertical drops. City of Edmonds Development Services requires a plumbing
      permit, rough-in inspection, and final inspection before walls close.

  - title: "Polybutylene Pipe Failure in 1980s Edmonds Construction"
    description: |
      Poly pipe — polybutylene, commonly called PB — was installed in thousands of
      Edmonds homes built from the late 1970s through about 1995, particularly in the
      98026 zip code where most of the area's 1980s subdivision development happened.
      PB reacts poorly to chlorine in treated municipal water; the inner wall oxidizes
      and becomes brittle, and the acetal plastic fittings crack under pressure. Failure
      often happens at fittings near a shutoff valve or at a branch tee, and the leak
      can run for hours inside a wall before anyone notices. Full replacement with
      PEX-B or PEX-A supply lines is the answer — not a spot repair of the failed
      fitting, because the rest of the pipe is in the same condition. A three-bedroom,
      two-bath home in Edmonds typically runs $6,500–$12,000 for a PB repipe including
      drywall access patching. Active work takes two to three days. TopVolk pulls the
      permit and schedules inspections through the City of Edmonds.

  - title: "Tankless Water Heater Conversion — and the Gas Line Nobody Budgets For"
    description: |
      Switching from a 40-gallon tank to a Rinnai RU199iN or Navien NPE-240A is a
      popular upgrade in Edmonds remodels — on-demand hot water and 16 square feet of
      mechanical room back. The catch: a high-output condensing tankless unit requires a
      three-quarter-inch or one-inch gas supply line, and most Edmonds homes built before
      1990 were roughed in with half-inch black iron from the meter. Undersizing the gas
      line means the unit throttles back, and you'll never get the rated flow rate.
      Gas line upsizing, new Category III stainless exhaust venting (required for
      condensing units — the existing B-vent flue won't work), seismic strapping per WA
      code, and the tankless installation itself all fall under one combined plumbing and
      mechanical permit through City of Edmonds Development Services. Budget $3,500–$6,500
      all-in. TopVolk is a WA Licensed Contractor managing the full scope — Vladislav
      coordinates scheduling, and deadline commitments are written into the contract.

  - title: "High Water Pressure Damaging Fixtures at Lower-Elevation Homes"
    description: |
      Edmonds drops sharply from the inland plateau down to the waterfront, and homes at
      lower elevations — particularly on the waterfront streets east of the ferry terminal
      in 98020 — regularly see municipal water pressure above 80 psi. The IRC
      (International Residential Code) requires a pressure-reducing valve when service
      pressure exceeds 80 psi, and there's a practical reason beyond code: high pressure
      blows out fill valves in Kohler and American Standard toilets, wears out the
      cartridge in a Moen or Delta faucet years early, and causes water hammer loud
      enough to sound like a pipe burst. A PRV installation runs $350–$600 for parts and
      labor on a main-line installation. The valve — typically a Watts 25AUB or Caleffi
      535 series — is set to 60–70 psi at startup. Small fix. Pays for itself in avoided
      fixture repairs within a few years, and it's something to address before spending
      money on new fixtures in a kitchen or bathroom remodel.

  - title: "Drain Line Rerouting for Kitchen Islands and Basement Bathrooms"
    description: |
      Open-concept kitchen remodels in Edmonds often move the sink to an island, which
      means routing a new two-inch P-trap drain through floor framing — or cutting a
      slab trench — to reach the main stack. In older 98020 homes with original
      cast-iron drain lines, connecting new ABS to an existing cast-iron stack requires
      a no-hub coupling and properly maintained slope. The IRC minimum is one-quarter
      inch of drop per foot of horizontal run; short on that, and you get chronic slow
      drains and buildup. Basement bathroom additions add another layer: if the drain
      can't gravity-feed to the main sewer line, a sewage ejector pump — Zoeller M53 or
      equivalent — goes in, with its own dedicated electrical circuit and roof
      penetration for the vent stack. Rough-in inspection is required before any
      concrete or framing gets closed. Plan review for this scope through City of Edmonds
      Development Services typically runs two to four weeks. Budget $2,500–$6,000 for a
      drain reroute, more if an ejector system is involved.

faq:
  - q: "How fast can TopVolk get to Edmonds for a plumbing consultation?"
    a: |
      Edmonds is a straightforward drive from Seattle — SR-99 north through Shoreline
      and Mountlake Terrace gets us there in about 25–30 minutes under normal traffic,
      with I-5 to Exit 177 or 179 as an alternate when 99 slows down. Street parking
      in Edmonds residential neighborhoods is usually fine for a consultation visit.
      From first call to on-site estimate, we can typically schedule within the week.
      Call (206) 591-1096 and Vladislav sets it up directly — no intake call center,
      no salesperson. You're talking to the contractor who will run the job from the
      first conversation.

  - q: "What does a full repipe cost in Edmonds?"
    a: |
      A galvanized repipe on a two-bath Edmonds home runs $8,000–$15,000. Polybutylene
      replacement for a similar home is typically $6,500–$12,000. What moves the number:
      crawlspace clearance (tight 18-inch spaces add significant labor time), how many
      wall openings are needed for vertical drops, and whether you're running PEX-A or
      Type L copper — copper costs more in material but often needs fewer wall
      penetrations in finished spaces. On-site estimates are free and fully itemized.
      You get a line-item quote with hard numbers, not a vague range. Deadline
      commitments are written into the contract. Call (206) 591-1096 to schedule.

  - q: "Does plumbing work in Edmonds require a permit, and who handles that?"
    a: |
      Yes — water heater replacements, repiping, drain reroutes, gas line work, and
      tankless conversions all require permits in Edmonds. The authority having
      jurisdiction (AHJ) here is City of Edmonds Development Services, not Snohomish
      County PDS. Plan review for straightforward work like a water heater swap takes
      a few days to a week; more complex scope like a drain reroute or gas line upsizing
      runs two to four weeks. TopVolk, as a WA Licensed Contractor, prepares and submits
      the permit application, manages the plan review process, and schedules the
      required rough-in and final inspections — the homeowner doesn't need to navigate
      the permit portal alone.

  - q: "Can you install a Rinnai or Navien tankless unit in a home that currently has a tank water heater?"
    a: |
      Yes, and it's one of the more common upgrades on Edmonds remodels. The existing
      tank location works in most cases, but the gas supply line and flue venting almost
      always need to change. Condensing tankless units — Navien NPE series and Rinnai RU
      series — exhaust at lower temperatures and require Category III stainless steel
      vent pipe; the original B-vent flue for a tank heater won't cut it. Gas line
      sizing also needs confirming: a 199,000 BTU unit needs adequate pressure and pipe
      diameter at the appliance, which usually means upsizing from the existing
      half-inch line. WA code requires seismic strapping on all water heaters. The job
      typically takes one to two days of active work once the permit is in hand.

  - q: "What warranty comes with TopVolk's plumbing work?"
    a: |
      Workmanship on all plumbing installations is warranted for one year from final
      inspection. Materials carry manufacturer backing — PEX-A tubing from Uponor is
      covered by a 25-year warranty; Rinnai and Navien units carry five-year heat
      exchanger warranties, extending to 12 years with registration. Kohler and Moen
      fixtures carry lifetime limited warranties on finish and internal parts for
      residential use. If something fails because of an installation error on our side
      within the warranty period, we come back and fix it. The contract also includes
      deadline penalty terms — if a committed completion date is missed, there's a
      financial penalty written in, not just an apology.

  - q: "Do you serve other cities near Edmonds, and what's the typical scheduling window?"
    a: |
      Lynnwood, Mountlake Terrace, Shoreline, Kenmore, Bothell, and Kirkland are all
      regular job sites — along with the full Eastside and Seattle proper. TopVolk covers
      King, Snohomish, Pierce, and Kitsap counties, with 100+ projects completed since
      2023. Scheduling a free on-site consultation in Edmonds or nearby Snohomish County
      cities is usually within five to seven business days. For remodel projects starting
      within 60 days, we can often slot the work in without much wait. Call
