title: "Edmonds Door Installation — Entry & Patio Doors in 98020"

intro: |
  The Edmonds-Kingston ferry terminal sits at the foot of Main Street, and the
  homes climbing the hillside above it in 98020 get the full force of westerly
  weather rolling off Puget Sound. Salt-laden air, steady rain from October
  through April, and the occasional hard freeze hit exterior doors harder than
  most homeowners realize — especially the original wood and hollow-core steel
  units still hanging on 1960s and 1970s ranchers throughout Seaview and
  Perrinville. A Therma-Tru fiberglass pre-hung door handles that exposure far
  better than painted wood, which cups and swells in the Seattle area's humidity
  cycles until the deadbolt barely catches the strike plate. TopVolk Construction
  has completed door work across Edmonds — single entry replacements with proper
  kick-out flashing, patio sliding door conversions to French door systems,
  interior door swing changes during full remodels. Owner Vladislav Volkov
  handles every estimate in person; the contractor measuring your rough opening
  is the same person managing the install. Call (206) 591-1096 to schedule a
  free site visit.

localContext: |
  Edmonds housing splits into a few recognizable eras. The streets between the
  waterfront and Edmonds Way — most of them in 98020 — carry a lot of 1940s to
  1960s construction: single-story homes with post-and-pier foundations, settled
  framing, and wood entry doors where the jamb has absorbed decades of moisture.
  Getting a new door to hang plumb and latch cleanly in those openings takes real
  carpentry, not just dropping in a pre-hung unit. Up the hill toward Five Corners
  and the 98026 boundary near Lynnwood, the stock shifts to 1970s and 1980s
  ranchers where the entry door is typically a 32-inch steel pre-hung with foam
  weatherstripping that compressed flat years ago. Both eras share the same
  Snohomish County PDS permit requirement: enlarging an opening, adding a
  structural header, or converting a window to a door triggers a building permit.
  The damp Edmonds summers also accelerate rot in wood door frames faster than
  most people expect — particularly on north-facing entries that see almost no
  direct sun between October and March.

commonProblems:
  - title: "Racked Frames and Out-of-Square Openings in Edmonds's Older Ranchers"
    description: "The 1960s and 1970s ranchers throughout Seaview and the streets
      just west of Edmonds Way have settled enough that entry door rough openings
      are rarely plumb anymore. Installing a new pre-hung unit into a racked
      opening without correcting the framing first means the door will bind
      within a season. The fix starts with sistering the king and jack studs if
      they've twisted, shimming the hinge-side jamb plumb, and confirming the
      sill is level before the new door unit goes in. Therma-Tru and JELD-WEN
      both make fiberglass pre-hung units that hold up well in PNW conditions —
      the fiberglass skin doesn't absorb moisture the way painted wood does.
      Budget $1,200–$2,500 for a standard 36-inch entry replacement including
      framing corrections, a new Schluter threshold, and labor. That range
      climbs if existing framing shows rot that has spread into the rim joist
      or subfloor at the sill."

  - title: "Replacing 1980s Aluminum Patio Sliders with French Doors in Perrinville"
    description: "A lot of Edmonds homes built in the 1980s and early 1990s —
      particularly in Perrinville and the neighborhoods east of Olympic View
      Drive — came with aluminum-frame sliding patio doors. Thermal performance
      on those original units is poor by current energy standards, and once the
      pile weatherstripping in the track wears down, there is effectively no
      seal left. Converting to a Milgard or Pella French door system requires
      reframing the rough opening and installing an LVL header sized for the
      new span. That structural work triggers a Snohomish County PDS building
      permit — plan on 3–6 weeks for plan review on a residential structural
      alteration. Installed cost runs $3,500–$8,500 depending on door unit
      cost, header size, and whether exterior Hardie cement-board trim needs
      to be rebuilt around the new opening."

  - title: "Snohomish County PDS Permits — What Door Work Actually Requires One"
    description: "Straight door-for-door swaps — same rough opening size, no
      structural changes — are typically permit-exempt in both the City of
      Edmonds and unincorporated Snohomish County. The moment the scope shifts
      to enlarging an opening, cutting through a load-bearing wall section, or
      converting a window to a door, a building permit with structural plans is
      required. City of Edmonds work goes through the city's own permit portal;
      unincorporated parcels outside city limits submit through Snohomish County
      PDS. TopVolk Construction is a WA Licensed Contractor and handles permit
      drawings, plan submittal, and inspection scheduling — homeowners do not
      need to coordinate with the AHJ directly. Rough-in inspection is required
      before framing gets covered by drywall or exterior sheathing. A permitted
      framed-opening conversion typically runs 6–10 weeks from PDS submittal
      to final inspection, depending on the current review queue."

  - title: "What Door Installation Actually Costs in Edmonds — What Moves the Number"
    description: "A fiberglass entry door — Therma-Tru Fiber-Classic or comparable
      — installed in an existing opening runs $1,100–$2,500 in Edmonds, covering
      removal, framing adjustments, new weatherstripping, threshold, and labor.
      A patio door conversion with an LVL header and a Milgard or Pella
      multi-slide unit is a different budget tier: $4,500–$9,000 depending on
      door width and finish level. Interior door replacements during a remodel —
      changing swing direction, swapping hollow-core for solid-core, updating
      casing — run $350–$700 per door including hardware. Rot damage found
      during demo, out-of-square framing, and exterior trim rebuilding all push
      cost upward. TopVolk provides exact line-item quotes after a site visit,
      not vague phone ranges — and deadline penalties for missed completion dates
      are written into every contract. Call (206) 591-1096 to schedule a free
      on-site estimate with Vladislav."

  - title: "Weatherstripping Failure, Threshold Gaps, and Smart Lock Retrofits"
    description: "Edmonds averages around 37 inches of annual rainfall, with most
      of it falling between October and April. A door that leaked only slightly
      last spring will be noticeably drafty by December if the compression
      weatherstripping on the door stop or the sweep at the threshold has worn
      flat. Replacing weatherstripping on a standard 36-inch entry runs
      $150–$400 in materials and labor — but if the door is more than 15 years
      old, a full unit replacement usually makes more financial sense than
      rebuilding the seals on a deteriorating frame. Adding an August Wi-Fi
      Smart Lock Pro or Schlage Encode Plus to an entry door requires a
      solid-core door with a reinforced lock block and correct backset
      measurement. Older wood entry doors with soft stiles and original mortise
      hardware do not support keypad deadbolts reliably over time. New fiberglass
      and steel pre-hung units come factory-prepped for these smart lock systems."

faq:
  - q: "How fast can you get to Edmonds for a door installation estimate?"
    a: "Edmonds is about 20 miles north of Seattle via I-5 or SR-99, and TopVolk
      schedules site visits in Snohomish County multiple days per week. Getting
      out to 98020 typically means a 3–5 day wait for an estimate appointment,
      not weeks. Vladislav handles every estimate directly — no salesperson,
      no scheduling layer between you and the person doing the work. Permit-exempt
      door swaps can start within 1–2 weeks of signing. Projects requiring a
      Snohomish County PDS permit add plan review time before the schedule
      locks. Call (206) 591-1096 to check current availability."

  - q: "What does door installation or replacement cost in Edmonds?"
    a: "Fiberglass entry door replacement in an existing opening — pre-hung unit,
      new threshold, weatherstripping, and labor — runs $1,100–$2,500 in Edmonds
      depending on door spec and framing condition. Patio door conversions with
      an LVL header and a Milgard or Pella French door or multi-slide system run
      $4,500–$9,000. Interior door replacements during a remodel average
      $350–$700 per door including casing and hardware. Those are ranges — what
      actually matters is the site measurement and what is found behind the
      existing door frame. TopVolk provides exact line-item pricing after a free
      on-site visit with no pressure to sign. Call (206) 591-1096 or reach out
      online to schedule."

  - q: "Do I need a permit to replace a door in Edmonds or Snohomish County?"
    a: "Replacing a door in the same rough opening — no structural changes — is
      generally permit-exempt in both City of Edmonds and unincorporated
      Snohomish County. Enlarging an opening, removing part of a load-bearing
      wall, or converting a window to a door requires a building permit with
      structural drawings. City of Edmonds permits go through the city's permit
      portal; parcels outside city limits submit through Snohomish County PDS.
      TopVolk Construction is a WA Licensed Contractor and prepares permit
      documents and manages AHJ submittals as part of the project scope. Plan
      review at Snohomish County PDS for a residential structural alteration
      typically runs 3–6 weeks."

  - q: "Can you match original door hardware and trim profiles in a 1950s or 1960s Edmonds home?"
    a: "Older homes in downtown Edmonds and the streets near Brackett's Landing
      often have original door casing profiles — ogee, colonial, or beaded trim
      — that flat modern casing will not match without looking out of place.
      TopVolk sources custom-milled casing to match existing profiles when the
      rest of the interior trim is worth preserving. For hardware, Emtek and
      Baldwin both offer mortise and knob sets in period-appropriate styles that
      fit standard modern backset dimensions. The door unit itself can be ordered
      with a period-appropriate panel layout in fiberglass or solid wood. It
      takes more lead time than a standard swap, but the finished result looks
      like it belongs in the house rather than sitting in front of it."

  - q: "What warranty covers a new door installation from TopVolk?"
    a: "Therma-Tru and Milgard both carry limited lifetime warranties on fiberglass
      and vinyl door units against delamination and warping. Schlage Encode Plus
      includes a lifetime mechanical and finish warranty on the hardware itself.
      TopVolk's workmanship warranty covers the framing, flashing, and
      installation labor separately — if a door binds, the threshold fails, or
      weatherstripping pulls away within the warranty period, the correction
      costs nothing. In Edmonds's climate — persistent fall and winter rain,
      occasional hard freezes — proper kick-out flashing and a continuous sill
      pan under the threshold are what actually determine whether that
      workmanship warranty ever gets tested."

