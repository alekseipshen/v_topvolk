title: "Edmonds Painting — Cedar, Salt Air & Lead Paint Done Right"

intro: |
  Salt air off Puget Sound doesn't give exterior paint much of a break in Edmonds. The craftsman-era houses and mid-century ranchers clustered around downtown 98020 — on streets like Dayton Avenue and the blocks running back from Brackett's Landing — carry cedar lap siding and window trim that fade, chalk, and start trapping moisture within five to seven years of the last coat. North-facing walls near the Edmonds Marsh are especially prone to moss colonization by late October, right when paint adhesion is weakest heading into the wet season. Sherwin-Williams Duration Exterior handles that cycle better than most builder-grade products, but only if the surface prep is right — power wash, dry time, back-caulking at butt joints, and spot-prime on any bare wood before the finish coats go on. Vladislav Volkov at TopVolk Construction has managed full exterior repaint schedules across 100+ projects since 2023, including homes in the Meadowdale neighborhood where dense tree canopy keeps siding damp well into June.

localContext: |
  Edmonds housing falls into two distinct bands that affect painting scope in different ways. The older downtown core — zip code 98020, the blocks between the ferry terminal and Highway 99 — holds homes built between 1940 and 1970. A meaningful portion of those predate 1978, which means EPA RRP lead-paint protocols apply to any surface prep involving sanding or mechanical scraping. Further inland toward 98026 and the Seaview neighborhood, housing shifts to 1980s and 1990s wood-frame construction: T1-11 panel siding, early fiber cement, and builder-grade trim that's now aging into its first or second repaint cycle. Those substrates behave differently — fiber cement needs a bonding primer before topcoat adhesion holds properly through a PNW winter. Permit authority for painting work inside city limits runs through the City of Edmonds building department; parcels at the city edge in unincorporated Snohomish County fall under Snohomish County PDS. Interior repaints after kitchen and bathroom renovations are increasingly common here as homeowners invest in semi-custom cabinetry and full-tile wet areas that need coordinated wall and trim work to look intentional.

commonProblems:
  - title: "Cedar Siding Repaint Cycles — Timing It Before Boards Split"
    description: |
      Cedar lap siding on 98020 homes needs attention on a 5-to-7-year repaint cycle — shorter on north-facing elevations where moss and mildew get established between coats. Missing that window isn't just cosmetic. Moisture penetrates weathered wood grain, swells the fibers, and eventually splits boards that now need replacement rather than paint. The prep sequence matters more than the product: power wash first, then a TSP rinse to cut grease and mildew residue, a minimum 48-hour dry window, back-caulking all butt joints and window perimeters, and spot-priming bare wood with Kilz Original before any finish coat. Two coats of Sherwin-Williams Duration Exterior deliver a measurable dry mil thickness that holds through a full Puget Sound rainy season. A standard two-story cedar-sided exterior near the Edmonds waterfront typically runs $5,500–$9,500 depending on square footage, surface condition, and how many trim details require hand-brush work.

  - title: "Lead-Based Paint in Pre-1978 Edmonds Homes — EPA RRP Compliance"
    description: |
      A significant portion of homes in the downtown 98020 zone were built before 1978, which means lead-based paint is a real possibility on any surface being sanded, scraped, or heat-stripped. EPA RRP rules — the Renovation, Repair, and Painting regulation — require certified renovators to follow specific containment, HEPA vacuum, and waste disposal protocols. This isn't optional, and it applies regardless of project size. XRF testing or 3M LeadCheck swab kits confirm lead presence before any mechanical prep begins. If lead is confirmed, the scope changes: plastic containment sheeting on the ground and around windows, HEPA-filtered vacuums for all dust, and documented disposal of contaminated debris. Stable lead paint on intact surfaces can qualify for encapsulation with a penetrating product like Sherwin-Williams EncapsuLock rather than full removal — a faster, less disruptive path when the substrate is in good shape. EPA violations for non-compliant lead work start at $37,500 per violation per day.

  - title: "Interior Repaints After Kitchen and Bathroom Renovations"
    description: |
      Completing a kitchen renovation with new semi-custom cabinets and a tile backsplash — then leaving the walls in their original flat paint — looks unfinished. Sheen mismatches, old wall colors clashing with new cabinet tones, and fresh drywall mud showing through flat paint under recessed lighting all signal that the paint was an afterthought. Getting it right means selecting sheen levels deliberately: eggshell on walls, semi-gloss on trim and doors, satin in wet areas. Benjamin Moore Aura is a strong interior choice here — it covers in fewer coats, holds color depth, and doesn't chalk or yellow on trim the way cheaper interior paints do over time. A coordinated kitchen and adjacent dining area repaint, including ceiling, trim, and blue tape walkthrough punch list, typically takes 3–5 business days from drop-cloth setup to final touch-up. TopVolk handles painting as part of full renovation scopes or as a standalone finish phase — direct communication with Vladislav either way, no middlemen involved.

  - title: "Cabinet Repainting and Refinishing — A Fraction of Replacement Cost"
    description: |
      Full kitchen cabinet replacement in an Edmonds home runs $18,000–$45,000 depending on configuration and material grade. Cabinet repainting with proper prep and a sprayed finish costs $2,800–$6,500 depending on door count, drawer fronts, and whether the box interiors need cleaning and deglazing. The prep work is the whole job: doors and drawer fronts come off, hinges are pulled, all surfaces get scuff-sanded and deglazed with a TSP wash, and a bonding primer goes on before any topcoat. Sprayed finish coats give a harder, smoother surface than rolled or brushed application — far closer to a factory finish. For homeowners in Seaview or the Meadowdale neighborhood looking to update dated oak or honey-maple cabinets without a full gut renovation, repainting paired with new Moen or Kohler hardware covers most of the visual impact at a fraction of the cabinet replacement budget. The full process typically runs 5–8 business days including door dry time between coats.

  - title: "Moisture-Resistant Paint in Bathrooms and Laundry Rooms"
    description: |
      Standard interior latex fails fast in Edmonds bathrooms — chronic ambient humidity plus inadequate ventilation means mold shows up at paint seams and ceiling corners within a year or two. The product matters, but so does the substrate condition. Mold-resistant primer goes on first: Kilz Mold & Mildew formula or Benjamin Moore's Mooreguard Interior line, followed by a satin or semi-gloss finish with a mildewcide additive. Exhaust fan capacity is worth evaluating at the same time — a fan rated under 50 CFM in a 60-square-foot bathroom can't move enough air volume, and no paint holds up to chronic condensation. For older 98020 homes with original tile surrounds, applying RedGard behind any new backer substrate and using Schluter Kerdi transitions at wet-area perimeters keeps adjacent painted drywall genuinely dry rather than just coated. A full bathroom repaint with moisture prep typically runs $800–$1,600 depending on room size and surface condition.

