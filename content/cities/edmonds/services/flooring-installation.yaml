title: "Edmonds Flooring Installation — Puget Sound Humidity, Real Hardwood Decisions"

intro: |
  The ferry terminal at Brackett's Landing sits less than half a mile from some of
  Edmonds's oldest residential blocks, and the air coming off Puget Sound carries
  enough moisture to cause problems with solid hardwood that most homeowners never
  anticipate. Homes in the 98020 zip code — particularly the 1940s and 1950s bungalows
  near downtown — regularly test subfloor relative humidity above 75%, which is well
  past the threshold most hardwood manufacturers will warranty against. Skip that
  moisture test before installation and you're looking at cupped boards within a season.
  TopVolk Construction has completed 100+ flooring projects across Edmonds and southern
  Snohomish County since 2023, including hardwood restoration in older Five Corners
  homes and engineered Kahrs plank installations in mid-century ranchers closer to
  Meadowdale. Vladislav Volkov does the on-site consultation himself — no sales rep,
  no hand-off to a crew you've never met.

localContext: |
  Edmonds housing splits into roughly two generations, and each one creates a different
  flooring conversation. The older stock — downtown bungalows and Craftsman-era homes
  concentrated around 3rd and 4th Avenues in 98020 — typically has original 2-1/4"
  select oak strip flooring over diagonal board subfloor, post-and-pier or concrete
  perimeter foundations with open crawlspaces, and enough ambient moisture blowing in
  off the Sound to make solid hardwood a real long-term commitment. Farther east, in
  the Five Corners and Westgate neighborhoods around 98026, you hit 1960s through 1980s
  tract construction: slab-on-grade in some cases, OSB subfloors in others, and
  occasional 9x9 resilient tile in kitchens that needs asbestos testing before any
  demo begins. Permit-wise, Edmonds is an incorporated city — any structural subfloor
  work, floor joist sistering, or rim joist repair goes through the City of Edmonds
  Building Division, not Snohomish County PDS. Straight flooring replacement with no
  structural changes typically requires no permit, but TopVolk documents that scope in
  writing before work starts.

commonProblems:
  - title: "Solid Hardwood Cupping in Crawlspace Homes Near the Edmonds Waterfront"
    description: |
      Open crawlspaces that vent toward Puget Sound are one of the most common subfloor
      moisture sources in 98020. Before installing any solid hardwood — 3/4" nail-down
      oak or maple — subfloor moisture content needs to read below 12% with a pin-type
      meter, and crawlspace relative humidity should be under 60%. Skipping this step is
      exactly how a homeowner ends up with cupped boards by January and a flooring
      contractor who stops returning calls. On projects where crawlspace humidity is
      running high, a 6-mil poly vapor barrier gets laid across the full crawlspace
      floor and passive ventilation gets added before hardwood ever arrives at the
      address. The hardwood itself then acclimates in the living space for 4-7 days
      before any nailing begins. This adds 1-2 weeks to the timeline but protects a
      $12,000-$18,000 floor from failing in its first wet season — which in Edmonds runs
      October through May.
  - title: "Matching Existing 2-1/4 Inch Oak Strip in Craftsman-Era Partial Restorations"
    description: |
      A lot of Edmonds's downtown Craftsman homes still have their original 2-1/4"
      select oak strip flooring — most of it structurally sound, some of it patched
      over the decades with mismatched boards and different stain tones. When a kitchen
      gut-and-rebuild needs to flow back into the living room without a hard visual
      break, finding matching 2-1/4" solid oak isn't the problem. Bruce and Mirage both
      manufacture it in current production. Getting the finish to blend is the real
      challenge. Original oil-based polyurethane from the 1940s has aged to an amber
      tone that water-based Bona finishes won't replicate off the shelf. The actual
      solution is sanding and refinishing the entire continuous floor area — new boards
      and old — together. Patching in new product and refinishing only the repaired
      section almost always reads as a patch. Plan for a whole-room sand and refinish,
      roughly $3-$5 per square foot for refinish work alone, whenever you're restoring
      partial sections in an open plan.
  - title: "Vinyl Asbestos Tile Removal in 1960s Edmonds Kitchens Before New Flooring"
    description: |
      Mid-century homes in Five Corners and the Westgate neighborhood — particularly
      those built between 1958 and 1972 in zip code 98026 — frequently have 9x9 or
      12x12 resilient tile in the kitchen that tests positive for chrysotile asbestos.
      Vinyl asbestos tile (VAT) was standard-issue construction across King and Snohomish
      County in that era. You cannot grind it, sand it, or chip it dry. Washington State
      requires abatement by a licensed asbestos contractor before any new flooring
      installation begins. TopVolk coordinates the abatement sub — typically a one-to-
      two-day process — before subfloor prep and new flooring install starts. Total cost
      including abatement typically runs $800-$1,800 depending on the area. Floating new
      LVP over existing VAT to "encapsulate" it is not a code-compliant permanent fix
      and creates subfloor height problems at Schluter transition strips and door
      thresholds. TopVolk is a WA Licensed Contractor and handles this coordination
      start to finish — call (206) 591-1096 to discuss scope before demo begins.
  - title: "Engineered Hardwood vs Solid Hardwood on Slab-on-Grade Floors in Edmonds"
    description: |
      Some of the 1970s and 1980s ranchers in Edmonds's eastern neighborhoods were built
      slab-on-grade rather than over crawlspaces, and that changes the hardwood
      conversation entirely. Solid 3/4" hardwood requires nail-down installation into
      wood subfloor — you cannot nail into concrete. Glue-down solid hardwood directly
      on slab is technically possible, but moisture migration through concrete in the
      Pacific Northwest makes it a long-term risk in any home that sees 37+ inches of
      rain per year. Engineered hardwood — a real wood wear layer over a dimensionally
      stable plywood core, like Kahrs or Lauzon's click-lock lines — handles the
      moisture cycling that concrete slabs experience between October and May. A DriCore
      subfloor panel system installed above the slab adds a thermal break and a drainage
      plane beneath the flooring. DriCore adds roughly $2.50-$3.50 per square foot to
      the project but protects a $6,000-$10,000 engineered hardwood floor from the
      moisture it would otherwise absorb from below.
  - title: "Underlayment Upgrades for Sound Transmission in Edmonds Two-Story Homes"
    description: |
      Two-story homes in the Westgate and Five Corners areas — many built in the 1990s
      and early 2000s — have OSB subfloor over floor joists, and hard flooring surfaces
      without adequate underlayment transmit impact noise directly to the ceiling below.
      A 2mm attached underlayment that comes factory-bonded to most LVP products is not
      enough in bedroom-over-living-room configurations. Upgrading to a 6mm cork
      underlayment — products like Acousticork R-10 — reduces impact sound transmission
      by roughly 20-22 IIC points over the bare subfloor baseline. For engineered
      hardwood floating over joisted subfloor, a 3/8" cork underlayment with an
      integrated vapor retarder handles both sound and minor subfloor flatness variation.
      The subfloor itself needs to be flat within 3/16" over a 10-foot span before any
      underlayment or flooring goes down — low spots get shimmed or filled with
      floor-leveling compound first. Budget an extra $1.50-$2.50 per square foot for
      proper underlayment; it is significantly cheaper than pulling up the floor to
      redo it.

faq:
  - q: "How fast can you get to Edmonds for a flooring consultation?"
    a: |
      Edmonds is roughly 25 minutes north of Seattle via I-5 or Highway 99, and TopVolk
      serves Snohomish County projects regularly — Edmonds, Lynnwood, Mountlake Terrace,
      and Mukilteo are all on the standard rotation. Scheduling an on-site consultation
      with Vladislav typically runs 3-7 days out depending on current project load. The
      visit is free, done at the house so subfloor conditions can actually be assessed
      in person, and ends with a written line-item quote — not a vague range. Call
      (206) 591-1096 to get on the schedule. No sales staff involved, no follow-up
      pressure after the estimate.
  - q: "What does hardwood floor installation cost in Edmonds?"
    a: |
      Solid 3/4" nail-down hardwood in a standard Edmonds home — pre-finished select oak,
      600-900 square feet — typically runs $8-$13 per square foot installed, including
      demo of existing flooring and basic subfloor prep. Engineered hardwood floating
      over a DriCore subfloor system on slab runs $11-$16 per square foot including the
      panels. LVP installation with no structural subfloor work generally lands between
      $5-$8 per square foot installed. What moves the number: subfloor condition, stair
      nosing and transition work, VAT abatement needs, and whether any floor joist
      sistering is required. Call (206) 591-1096 — the on-site estimate from TopVolk
      comes with exact line-item pricing.
  - q: "Do I need a permit for flooring installation in Edmonds?"
    a: |
      Straight flooring replacement — pulling old carpet or LVP and installing new
      material with no structural changes — does not require a permit through the City
      of Edmonds Building Division. The line gets crossed when structural subfloor work
      is involved: sistering floor joists, replacing rim joist sections, or cutting
      through the subfloor for plumbing or HVAC access. Those scopes require a permit
      through the City of Edmonds Community Development Department. TopVolk is a WA
      Licensed Contractor and pulls all required permits directly — the homeowner does
      not navigate the City of Edmonds plan review process. If the scope is permit-free,
      that gets documented in writing before work begins.
  - q: "Can you match my existing hardwood floors in an older Edmonds home?"
    a: |
      Matching existing hardwood in Edmonds's older homes is one of the most common
      requests on the job — a bathroom or kitchen expansion that needs to read as one
      continuous floor with the original 1940s or 1950s oak strip. Board width and
      species matching is straightforward with current product from Bruce or Mirage.
      The bigger variable is finish tone. Original oil-based polyurethane has aged to
      amber over 70 years; water-based Bona finishes applied to new boards won't match
      that out of the can. The real solution is sanding the entire connected floor area
      and refinishing everything together. Blending a spot refinish into aged original
      flooring almost always shows — the whole-area approach is the one that actually
      holds up long-term.
  - q: "How long does a flooring project in Edmonds typically take?"
    a: |
      A straightforward LVP installation in a 1,000-square-foot Edmonds rancher —
      demo, subfloor prep, install, Schluter transition strips at tile thresholds —
      typically runs 3-5 days of active work. Solid hardwood nail-down with a 4-7 day
      acclimation period adds almost a week before the install starts. A full hardwood
      restoration including refinish, transitions, and stair nosing on a two-story home
      runs 8-12 days total. If VAT abatement is required, add 2-3 days for the abatement
      contractor before flooring work begins. All of this goes into the written contract
      — TopVolk includes a penalty clause for missed completion deadlines, not just a
      vague promise about timing. Call (206) 591-1096 to talk through your specific
      scope.
  - q: "Do you handle flooring in other nearby Snohomish County cities?"
    a: |
      Yes — TopVolk covers the full Snohomish County service area including Lynnwood,
      Mountlake Terrace, Kenmore, Bothell, Mill Creek, and Mukilteo, along with Shoreline
      which sits right on the King-Snohomish County line. Edmonds is a frequent stop —
      the combination of older housing stock and Puget Sound humidity keeps the flooring
      work consistent year-round. King County projects in Seattle, Bellevue, Kirkland,
      and Redmond are also in regular rotation. Scheduling windows for Snohomish County
      projects typically run 1-3 weeks out. Call (206) 591-1096 or schedule a free
      on-site consultation — Vladislav does the site visit and writes the quote himself.