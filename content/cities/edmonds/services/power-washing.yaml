title: "Edmonds Power Washing — Moss, Algae & Cedar Surface Prep"

intro: |
  The north-facing slopes above downtown Edmonds — from the ferry terminal corridor up toward
  Sunset Avenue N — sit in shadow for close to seven months straight. Cedar decks, concrete
  driveways, and board-on-board fences in the 98020 zip code accumulate moss, algae, and
  organic staining faster than almost anywhere else in Snohomish County. Brackett's Landing
  draws people to the waterfront, but the craftsman-era homes a few blocks inland near 4th
  Ave N are dealing with green-black algae that only comes off with the right chemistry and
  the right pressure — not a garden hose. Pre-wash surface prep before applying Armstrong
  Clark or TWP 1500 deck stain means a sodium percarbonate-based wash at low PSI, not
  blasting raw cedar grain and calling it ready. Concrete driveways in the Perrinville
  neighborhood, meanwhile, carry tire marks and oil runs that need a hot-water surface
  cleaner and degreaser pre-soak to actually lift — a quick rinse moves them around but does
  not remove them.

localContext: |
  Edmonds's housing stock divides pretty cleanly by location. The downtown core and hillside
  neighborhoods above the ferry terminal — zip 98020 — hold a concentration of 1940s through
  1960s Cape Cods, craftsman bungalows, and two-story colonials, many with original cedar
  shake roofs that carry substantial moss mats on north-facing sections. The Perrinville area
  near the Edmonds-Lynnwood boundary, running through parts of zip 98026, shifts to 1970s
  and 1980s ranchers and split-levels: concrete driveways, pressure-treated wood fences, and
  aggregate patios that often haven't been cleaned in years. Older concrete flatwork here
  shows efflorescence — the white powdery mineral deposit that migrates through the slab as
  groundwater evaporates at the surface — a direct product of Snohomish County's wet winters.
  Snohomish County PDS handles permits for any unincorporated pockets at the Edmonds city
  boundary, though the City of Edmonds runs its own building department for work inside city
  limits. For exterior surface cleaning specifically, no permits are required — but if
  cleaning reveals rot or structural damage, that repair work enters a different conversation.

commonProblems:
  - title: "Moss-Matted Cedar Decks That Won't Accept Stain"
    description: |
      Cedar decks on north and northeast exposures in Edmonds develop moss-and-algae layers
      that go well beyond cosmetic. Applying a penetrating finish like Armstrong Clark or
      TWP 1500 over a mossy surface means the stain sits on top of organic material, peels
      within a season, and traps moisture underneath — which accelerates rot at the joist
      hangers and rim joist. The correct sequence is a sodium percarbonate-based deck wash
      applied at low pressure (under 600 PSI on cedar), a 15-to-20-minute dwell, then a
      thorough rinse. After the surface dries — 48 to 72 hours minimum in Edmonds's humid
      spring, sometimes longer — an oxalic acid wood brightener neutralizes the pH and opens
      the grain for proper stain absorption. A 400 sq ft cedar deck wash and brighten runs
      $350–$550 depending on moss thickness and deck height. Skipping the brightener step
      is one of the most common reasons a deck stain job fails inside two seasons.

  - title: "Hardie Siding With Mildew Film Before an Exterior Repaint"
    description: |
      James Hardie cement-board siding handles PNW moisture better than wood, but the
      painted surface still accumulates mildew, oxidized chalk, and airborne grime over
      time — particularly on west-facing walls exposed to rain off Puget Sound and north
      faces that stay damp well into spring. Before any repaint, that surface needs to be
      genuinely clean, not just wet. Soft washing — a sodium hypochlorite solution applied
      at low pressure, allowed to dwell, then rinsed — kills mildew spores at the surface
      rather than pushing them to the next wall section. High-pressure blasting on Hardie
      risks chipping factory-cut lap edges or forcing water behind the joint and into the
      sheathing layer. For a 2,000 sq ft home in the Seaview area, an exterior pre-paint
      soft wash runs $400–$650. Most painting contractors in Edmonds require documented
      surface prep before they'll stand behind their finish work — and for good reason.

  - title: "Oil-Stained Concrete Driveways in Perrinville and Five Corners"
    description: |
      Embedded oil, tire rubber oxidation, and the gray-brown biological crust that forms
      on concrete in wet climates are standard on driveways throughout the Perrinville and
      Five Corners neighborhoods. A consumer pressure washer moves surface dirt but will
      not pull embedded oil from concrete pores. Effective removal requires a degreaser
      pre-soak — a commercial alkaline product like Simple Green Concrete Cleaner or a
      stronger industrial degreaser for older stains — applied, agitated with a stiff brush,
      and allowed to dwell before a surface cleaner attachment runs across the slab. That
      rotating bar inside a shroud cleans flat concrete evenly; a raw pressure wand leaves
      alternating light and dark stripes instead. Edmonds concrete also shows efflorescence
      from groundwater cycling through the slab, which responds to a dilute muriatic acid
      treatment after the organic layer is cleared. A standard two-car driveway plus front
      walkway runs $250–$400. TopVolk Construction LLC is a WA Licensed Contractor, so if
      cleaning reveals slab cracking or drainage issues, that scope gets handled in-house.

  - title: "Cedar Fence Prep Before the 3-to-5-Year Staining Cycle"
    description: |
      Board-on-board cedar fences throughout 98020 follow a 3-to-5-year staining cycle —
      skip it, and the wood deteriorates at the surface layer, making future stain adhesion
      progressively worse. Gray, weathered cedar is oxidized at the surface; stain applied
      over that layer sits on top rather than penetrating into the wood fiber. The correct
      prep involves an initial low-pressure wash to remove loose organic material, followed
      by an oxalic acid brightener application that restores natural wood pH and opens the
      grain for proper absorption. High-pressure blasting on cedar pickets raises the grain
      and creates a fuzzy surface that drinks stain unevenly without binding. For a 150
      linear foot fence, a wash-and-brighten prep runs $300–$500, and that cost needs to
      be factored into the overall staining budget from the start. Done properly, this adds
      one to two full staining cycles of life to whatever finish coat goes on afterward.

  - title: "Lichen-Covered Pavers and Patio Slabs That Become Slip Hazards"
    description: |
      Concrete pavers and natural stone patios in Edmonds build up algae, moss, and lichen
      from late October through April — and lichen is a different problem than moss alone.
      Unlike algae, lichen bonds physically to porous surfaces including Belgard and Unilock
      concrete pavers, travertine, and tumbled slate, requiring a longer chemical dwell time
      and more aggressive surface work to fully release. After organic removal, polymeric
      sand in the paver joints often needs to be swept back in and re-compacted, since the
      cleaning process disturbs the joint fill. Working at 1,500–2,000 PSI with the correct
      nozzle angle lifts the organic crust without eroding the joint edges or dishing the
      paver surface. Finishing with a penetrating paver sealer extends the interval before
      the next major growth cycle significantly. A 300 sq ft paver patio with full organic
      removal, joint sand replacement, and sealer application runs $350–$600 depending on
      paver type and buildup severity.

