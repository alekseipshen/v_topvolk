  - q: "What does power washing a cedar deck or concrete driveway cost in Edmonds?"
    a: |
      Cedar deck washing with a brightener step runs $350–$550 for a standard 300–500 sq
      ft deck. A two-car concrete driveway plus front walkway runs $250–$400. Larger
      surfaces, significant lichen or moss buildup, elevated deck access, and add-on sealer
      application all affect the final number. These are real line-item figures — the quote
      after an on-site visit breaks each task out separately with no bundled estimates or
      vague ranges. Call (206) 591-1096 or schedule a free on-site consultation. The
      estimate comes from Vladislav directly, and the written quote is what you pay —
      no surprises on invoice day.

  - q: "Do I need a permit for power washing or exterior cleaning in Edmonds?"
    a: |
      No permit is required for exterior surface cleaning. Pressure washing, soft washing,
      and deck or driveway cleaning are maintenance activities under both the City of
      Edmonds building code and Snohomish County PDS standards — no plan review, no
      inspection. If cleaning uncovers structural issues that need repair — rotted deck
      boards, a damaged ledger board connection, deteriorated rim joist — that repair work
      may require a City of Edmonds building permit depending on scope. TopVolk Construction
      LLC is a WA Licensed Contractor, so if the surface cleaning leads into a repair or
      exterior restoration scope, the permit process and the work both get handled in-house.
      Minor repair permit review through the City of Edmonds typically runs 2 to 4 weeks.

  - q: "Do you soft wash or use high pressure — and does it matter for my house?"
    a: |
      It matters considerably. Soft washing — low pressure under 500 PSI combined with a
      chemical solution — is the correct approach for cedar shake roofs, Hardie siding,
      painted wood exteriors, and board-on-board cedar fences. High pressure (2,500–3,500
      PSI) with a surface cleaner attachment is appropriate for concrete driveways,
      walkways, aggregate patios, and brick. Applying high pressure to wood surfaces raises
      the grain, damages paint film, and can drive water through lap joints into wall
      cavities behind the sheathing. The downstream injector method for soft washing
      delivers sodium hypochlorite solution for mold and algae — or sodium percarbonate
      for organic staining on wood — at the nozzle rather than through the pump, which
      keeps pressure low and chemical concentration consistent across the full surface.

  - q: "How long does a power wash stay clean given Edmonds's rainfall?"
    a: |
      Edmonds gets roughly 37 inches of rain annually, with the wet season running October
      through May and overcast conditions that limit UV exposure and surface drying time
      for most of the year. A cleaned concrete surface in a sunny south-facing location
      stays visibly clean for two to three years. North-facing cedar decks under a
      Douglas-fir canopy start showing algae regrowth within 12 to 18 months without a
      post-clean sealant applied. Adding a penetrating concrete sealer after driveway
      cleaning, or a UV-stable deck stain after wood prep, significantly extends the
      clean interval. Most Edmonds homeowners on a biennial maintenance schedule avoid
      the deeper lichen bonding that makes future cleaning far more labor-intensive —
      and far more expensive.

