title: "Edmonds General Contracting — Permits, Trades, and Real Timelines"

intro: |
  From the waterfront blocks near Brackett's Landing up through the residential streets around Edmonds College, the housing stock in zip 98020 is almost entirely mid-century — split-levels and ranchers built between 1958 and 1978. Pull the ceiling on one of those kitchens and the surprises stack up fast: notched joists, galvanized supply lines, panels that can't support a Thermador range hood without an upgrade. Getting that work through City of Edmonds plan review takes a contractor who knows the sequence, not just the finish work.

localContext: |
  Zip 98020 runs from the Sound up to the 98026 edge near the Lynnwood border, and the housing character barely changes across that corridor. Ranchers and split-levels from the early 1960s dominate the neighborhoods off Puget Drive and along 9th Avenue North — original post-and-beam framing, crawlspaces that trap moisture from the October-to-May rain cycle, and no vapor barrier to speak of. Sister joists and subfloor repairs are routine on first-floor additions here.

commonProblems:
  - title: "MEP Sequencing on 1960s Split-Level Renovations"
    description: "Split-levels in Edmonds pack electrical, plumbing, and HVAC into the same tight utility chases. Rough-in inspections require a specific order: framing, then MEP rough-in, then insulation before drywall hang. Booking trades out of sequence means returning to the AHJ for re-inspection — that adds 2-4 weeks to a project with a fixed move-in date."
  - title: "City of Edmonds Plan Review and Structural Engineering"
    description: "Edmonds runs its own permit counter — not Snohomish County PDS — and plan review on structural work typically takes 4-8 weeks. Projects requiring an LVL beam replacement or a new dormer need stamped engineering drawings before submission. Submitting an incomplete package extends that window. We handle permit acquisition as part of the project scope."
  - title: "Structural Surprises Behind Walls on Demo Day"
    description: "A 1965 Edmonds rancher that looks solid from the outside routinely hides missing blocking, undersized rim joists, or notched floor framing where someone previously ran ductwork. A Bosch appliance layout that moves an island 4 feet can expose all of it at once. Every project we run over $100K includes a contingency line for exactly this reason."

faq:
  - q: "How fast can you get to Edmonds for a general contracting consultation?"
    a: "Edmonds is 30-40 minutes from Seattle via Hwy 99 north — straightforward access off the Edmonds Way exit. Call (206) 591-1096 to schedule a free on-site walkthrough directly with Vladislav. No salesperson, no intake form — just the contractor who will actually quote the work."
  - q: "Do you handle Thermador and Sub-Zero installations in kitchen remodels?"
    a: "Yes. Kitchens in 98020 frequently spec Thermador ranges, Sub-Zero refrigeration, and Bosch dishwashers. We coordinate rough-in — gas or electric, ventilation CFM sizing, and cabinet cutouts — before appliances arrive, so the final install matches what the manufacturer requires. No guesswork on dimensions."
  - q: "What's a realistic budget for a full remodel in Edmonds, and what does the process look like?"
    a: "$90K-$175K covers most full kitchen-plus-bath remodels in 98020 when structural scope is accounted for. We provide line-item bids, not ranges. Missed deadline penalties are written into the contract. WA Licensed Contractor, 100+ projects completed since 2017. Call (206) 591-1096 for a free on-site estimate."