title: "Edmonds Garage Construction — Built for Puget Sound Lots and PNW Weather"

intro: |
  Salt air off Puget Sound doesn't just wear on siding — it accelerates wood rot in any garage
  structure that wasn't built with proper drainage and flashing details. Most of the residential
  streets between downtown Edmonds and the Five Corners area (zip 98020) were developed in the
  1950s and '60s, when a narrow one-car carport or a cramped attached garage was considered
  sufficient. That was before two-car households, electric vehicles, and ADU income potential
  changed what a garage actually needs to do. TopVolk Construction has been completing garage
  builds on these lots since 2023 — 100+ projects across Snohomish, King, Pierce, and Kitsap
  counties — and most Edmonds projects involve either a new detached build with living space
  above (a DADU, now permitted statewide under WA HB 1337) or an attached conversion where the
  slab and foundation need to be brought up to current IRC standards. During rough-in, a
  Mitsubishi mini-split pre-wire and a 60-amp EV circuit are near-standard requests here. Call
  (206) 591-1096 to talk through your site conditions before anything goes to the permit desk.

localContext: |
  Edmonds sits between the Puget Sound shoreline and the hillside streets climbing toward
  Lynnwood and Mountlake Terrace, with housing that spans several development eras. The older
  blocks in zip 98020 — from the waterfront near Brackett's Landing running up through the
  Westgate neighborhood — are primarily mid-century construction from the late 1940s through
  the early 1970s, much of it with post-and-pier foundations and minimal lot coverage by current
  standards. The Perrinville neighborhood, near the northern edge of the city toward the 98026
  corridor, skews toward 1970s and early '80s construction where builder-grade single-car garages
  were common but are now undersized. City of Edmonds Development Services handles all permitting
  within city limits — not Snohomish County PDS, which covers unincorporated areas — and their
  plan review timeline for a new detached structure runs six to ten weeks. Setbacks in Edmonds'
  RS-6 and RS-8 zones generally require five feet from side and rear property lines for a
  detached accessory structure, but corner lots trigger a flanking street setback that catches
  people by surprise. Lot coverage limits, FAR, and a 15-foot height restriction for accessory
  structures in most Edmonds zones all need to be confirmed before design starts.

commonProblems:
  - title: "Building a DADU Above a Detached Garage Under WA HB 1337"
    description: |
      WA HB 1337 (effective 2024) removed the old owner-occupancy requirement for accessory
      dwelling units statewide, which means an Edmonds homeowner can now build a detached garage
      with a rentable one-bedroom loft above it without having to live on the property. The
      structural implications are significant. A garage carrying living space above needs LVL beam
      headers at the garage door opening — typically a 3-1/2 × 11-7/8 LVL or deeper depending on
      span — along with engineered I-joist floor framing for the loft and point loads carried
      through the concrete slab to continuous spread footings below. On older Edmonds lots near the
      waterfront where fill soils are sometimes present, a soils report before footing design is
      worth the $800-$1,200 cost. The ADU above adds roughly $60,000-$100,000 to a basic garage
      build, but in a zip code where one-bedroom rents run $1,600-$2,000/month, the income
      potential often pays back the premium within five to seven years.

  - title: "Concrete Slab Failures on Older Edmonds Lots"
    description: |
      Edmonds averages close to 37 inches of rain annually — nearly all of it between October and
      May — and many of the older lots near Five Corners have clay-heavy subsoil that holds water
      against any concrete slab edge. A 3-inch slab over a poorly-prepared base will crack within
      a decade, and the freeze-thaw cycles that hit Edmonds two or three times each winter
      accelerate that failure. Current IRC requirements specify a minimum 4-inch slab for garage
      applications, and TopVolk specs fiber-reinforced concrete (polypropylene fiber at 1.5 lb/cy
      minimum) over 4 inches of compacted 5/8-inch crushed rock. For sloped lots — common on the
      hillside streets above SR-99 — a trench drain at the apron using an NDS Pro Series 4-inch
      channel drain tied into the yard drainage system prevents the standing water that shows up
      every November on slab garages without perimeter drainage. That drainage package adds
      $3,500-$6,000 to the project depending on slope and trench length.

  - title: "Permit Setbacks and Plan Review Through City of Edmonds"
    description: |
      City of Edmonds Development Services — not Snohomish County PDS — handles all building
      permits within city limits, and their zoning requirements differ meaningfully from the
      county's. In RS-6 and RS-8 zones, a detached garage needs five-foot side and rear setbacks,
      but alley lots and corner lots add flanking street setback requirements that often reduce
      the buildable footprint significantly. The full permit package for a new detached garage
      includes a site plan showing all setbacks, a dimensioned floor plan, a structural plan with
      connection details (joist hangers, hold-downs, post base hardware), and — if the garage will
      be conditioned — an energy code compliance form. TopVolk, as a WA Licensed Contractor
      operating across Snohomish County, prepares and submits the full package on your behalf.
      Vladislav Volkov handles the AHJ coordination directly, which means a faster response when
      plan reviewers send correction notices. Expect six to ten weeks for plan review; ADU-over-
      garage projects run eight to twelve weeks.

  - title: "What a New Detached Garage in Edmonds Actually Costs"
    description: |
      A basic two-car detached garage in Edmonds — 20×22 footprint, standard 9-foot sidewalls,
      two insulated steel doors, 100-amp subpanel — runs $55,000-$75,000 fully permitted and
      built. That number moves depending on site conditions: a sloped lot requiring excavation and
      retaining adds $8,000-$15,000, an engineered pier foundation instead of a poured perimeter
      footing adds $10,000-$14,000, and a workshop-grade build with a Mitsubishi MXZ mini-split
      for climate control and an epoxy slab finish adds another $12,000-$18,000. Door
      specification alone affects the budget noticeably — a Clopay R-12 insulated steel door runs
      $900-$1,100 installed per section versus $1,400-$1,800 for a carriage-style R-18 door with
      battery-backup opener. Garage-over-DADU projects in the Westgate area typically land
      $130,000-$185,000 depending on ADU finish level. TopVolk contracts include a fixed price
      with a written penalty clause for missed completion milestones — not something most GCs in
      Snohomish County put in writing.

  - title: "Workshop Insulation, Door Seals, and Long-Term Performance in the PNW"
    description: |
      An uninsulated garage door in Edmonds' climate drops interior temperature to ambient within
      an hour — fine for storage, miserable for workshop use. Standard spec for a workshop-grade
      garage build is a Clopay Premium Series or Wayne Dalton 9100 series door with R-18
      insulation and a bottom seal rated for driving rain rather than the standard rubber wipe
      seal. Side weatherstripping on a workshop door should be a brush-type seal rather than the
      j-type vinyl strip that ships standard, since frequent operation wears vinyl faster in a
      damp climate. Wall framing goes to 2×6 with R-21 fiberglass batts and a 6-mil poly vapor
      barrier on the interior face — required under Snohomish County energy code for any
      conditioned accessory space. Ceiling insulation runs R-49 for a flat ceiling assembly.
      Torsion springs on a two-car door are rated for roughly 10,000-15,000 cycles (about 7-10
      years of daily use) and should be inspected annually. Budget $800-$1,200 per year for a
      maintenance check covering spring tension, weatherstrip condition, threshold seal, and
      subpanel breaker testing.

faq:
  - q: "How fast can you get to Edmonds for a garage consultation?"
    a: |
      TopVolk Construction is based in the Seattle Metro area — Edmonds is a straightforward
      20-30 minute run up I-5 or SR-99 from North Seattle. Vladislav typically schedules on-site
      consultations within a week of first contact for Snohomish County projects. The consultation
      is free, happens at your property, and produces a written preliminary scope and pricing —
      not a sales pitch. From first call to signed contract usually takes one to two weeks on
      well-defined projects. Call (206) 591-1096 to get on the calendar. If your timeline is
      tight, mention it when you call — scheduling moves faster for projects with a clear scope
      and a firm start date in mind.

  - q: "What does a new garage build in Edmonds cost?"
    a: |
      A basic two-car detached garage (20×22 footprint, insulated doors, 100-amp subpanel) runs
      $55,000-$75,000 fully permitted in Edmonds. Sloped lots, engineered foundations, or
      workshop-grade finishes push that higher — a full workshop build with a Mitsubishi mini-
      split for climate control and an epoxy slab can reach $85,000-$110,000. Garage-over-DADU
      projects — a two-car garage with a rentable one-bedroom loft above — typically land
      $130,000-$185,000 depending on ADU finish level and foundation requirements. TopVolk
      provides line-item quotes after the on-site visit: specific numbers for each scope item,
      not ballpark ranges designed to grow after contract signing. Schedule a free on-site
      estimate by calling (206) 591-1096.

  - q: "What permits does a new garage require in Edmonds, and how long does it take?"
    a: |
      New garage construction in Edmonds requires a building permit through City of Edmonds
      Development Services. The application package includes a site plan showing setbacks and lot
      coverage, a dimensioned floor plan, structural drawings with connection details, and an
      energy compliance form for conditioned spaces. Plan review typically runs six to ten weeks
      for a standard detached garage; an ADU-above build takes closer to eight to twelve weeks
      and requires a separate address assignment process. TopVolk, as a WA Licensed Contractor,
      prepares and submits the full permit package on your behalf. Vladislav handles direct
      communication with plan reviewers — which matters when correction notices come back and
      need a fast response to keep the build schedule from slipping.

  - q: "Do you pre-wire for EV chargers during garage construction?"
    a: |
      Yes — EV pre-wiring at rough-in is one of the highest-value additions to a garage build.
      Running a 60-amp dedicated circuit from the main panel (or new subpanel in a detached
      garage) to a capped junction box on the wall costs roughly $400-$800 extra at rough-in
      stage. Adding the same circuit after drywall and the slab are finished typically runs
      $2,500-$4,000. For detached garages in Edmonds, the underground feed runs in Schedule 40
      PVC conduit — 24 inches deep under any driveway per NEC requirements. Common charger
      pairings include the Bosch EV200 and ChargePoint Home Flex; specify the charger model
      before rough-in so breaker sizing is confirmed before the panel is energized. Call
      (206) 591-1096 to discuss panel capacity before finalizing the garage design.

  - q: "What warranty comes with a new garage build from TopVolk?"
    a: |
      TopVolk's workmanship warranty covers structural and framing defects for three years from
      project completion, with subcontractor work covered under the same terms. Manufacturer
      warranties run separately — Clopay garage doors carry a limited lifetime warranty on steel
      sections, and Hardie cement-board siding (the standard exterior choice in Edmonds for rot
      resistance against the PNW climate) carries a 30-year limited warranty against fiber cement
      defects. For a garage built in Edmonds — 37 inches of rain annually, occasional frost — the
      durability factors that matter most are flashing details at roof-to-wall transitions, proper
      drainage at the slab perimeter, and pressure-treated lumber for any framing within 6 inches
      of grade. These are standard on every TopVolk build, not upgrade options. A properly built
      detached garage here should need nothing beyond hardware adjustments and weatherstrip checks
      for the first decade.

