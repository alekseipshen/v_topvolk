title: "DuPont Kitchen Remodel — Breaking Out of 1990s Builder-Grade"

intro: |
  Planned from scratch on land that used to be the DuPont powder company site, the Centennial
  neighborhood and surrounding streets filled in between 1996 and 2008 — which means every
  kitchen in 98327 started with the same builder spec: particleboard boxes, laminate counters,
  and a 30-inch range cavity sized for a basic appliance, not a Bosch 800 Series or KitchenAid
  range. Vladislav Volkov (WA Licensed Contractor) handles kitchen remodels throughout DuPont,
  pulling permits through Pierce County PALS and sizing rough-in dimensions around actual
  appliance specs before a single cabinet is ordered.

localContext: |
  DuPont (98327) is one of the few Pierce County cities that built out almost entirely in a
  single decade. The DuPont Historical Museum district anchors the old company town core, but
  the residential stock is almost entirely 1996-2008 production homes — no knob-and-tube wiring
  or galvanized supply lines, but plenty of 100-amp panels, thermofoil cabinet fronts beginning
  to delaminate, and closed-off kitchen layouts that weren't designed for open-concept living.
  Permit jurisdiction here runs through Pierce County PALS, not a city building department.

commonProblems:
  - title: "Thermofoil Cabinet Fronts Delaminating After 20-Plus Years"
    description: |
      Builder-grade particleboard cabinets from the late 1990s follow a predictable failure pattern
      in PNW humidity — thermofoil peels from the edges, drawer slides strip out, and the box
      interiors swell at the joints. Semi-custom replacements (Kraftmaid, Aristokraft) require
      stripping back to the studs, releveling the toe-kick zone, and establishing a plumb
      reference line before the new run goes in.

  - title: "100-Amp Panels Can't Handle Modern Appliance Loads"
    description: |
      A KitchenAid double wall oven, a Bosch dishwasher, and an induction cooktop running
      simultaneously push well past the capacity most 1990s DuPont kitchens were wired for.
      Moving to induction requires a dedicated 240V circuit — often a full 200A panel upgrade.
      Pierce County PALS issues the electrical permit; rough-in inspection comes before cabinet
      installation begins, not after.

  - title: "Load-Bearing Walls Blocking the Open Layouts Homeowners Want"
    description: |
      The wall between kitchen and dining room in DuPont's standard two-story plan is often
      structural. Removing it means a structural engineer's stamp, an LVL beam sized to the span,
      and PSL posts carrying the load to the foundation. Skipping the engineer to save $800
      creates a PALS red flag at final inspection — and reopened walls cost far more than the
      fee did.

faq:
  - q: "How fast can you get to DuPont for a kitchen remodel consultation?"
    a: |
      DuPont is about 35 miles south of Seattle via I-5 — roughly 40 minutes from central King
      County. Vladislav comes to the site directly, not an estimator who hands the job off
      afterward. Call (206) 591-1096 to book a free on-site visit, usually available within
      a week.

  - q: "Do you plan kitchen layouts around Bosch, KitchenAid, or Thermador appliances?"
    a: |
      Yes. Appliance specs drive the rough-in dimensions before a single cabinet is ordered.
      Bosch undercounter units have specific depth and clearance requirements; Thermador ranges
      need gas line positioning and range hood CFM matched to BTU output. KitchenAid wall ovens
      require exact cutout heights. Spec sheets come first — cabinet layout follows.

  - q: "What does a kitchen remodel cost in DuPont, and how long does the project take?"
    a: |
      Most DuPont projects run $50K-$100K depending on structural scope, appliance tier, and
      cabinet selection. Pierce County PALS plan review adds 4-8 weeks for gas line changes or
      wall removal. Construction typically runs 8-12 weeks post-permit. Deadline penalties are
      written into every contract. TopVolk is a WA Licensed Contractor — 100+ projects completed
      since 2023 across King, Snohomish, Pierce, and Kitsap counties.