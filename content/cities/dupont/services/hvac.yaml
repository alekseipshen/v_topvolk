  - q: "What does a heat pump conversion cost in DuPont?"
    a: "A full gas-to-heat-pump conversion runs $9,000-$16,000 before rebates, depending on the unit — Bosch and Mitsubishi cold-climate models sit at the higher end but perform better below freezing. Line set length, electrical panel capacity, and whether existing ductwork needs resizing all move the price. TopVolk provides a line-item quote after the site visit, not a phone estimate, and walks through what portion of the job qualifies for IRA rebates. Call (206) 591-1096 for a free on-site quote."
  - q: "Do I need a permit for HVAC work in DuPont?"
    a: "Yes — furnace, heat pump, and most ductless mini-split installs require a mechanical permit pulled through the City of DuPont's building division, not Pierce County PALS, since DuPont is its own incorporated jurisdiction with a smaller permit counter and faster review. TopVolk pulls the permit, schedules the rough-in inspection, and handles the final inspection so the paperwork doesn't fall on the homeowner. As a WA Licensed Contractor, TopVolk handles this on every applicable job. Typical review-to-final-inspection timeline runs 2-4 weeks depending on scope."
  - q: "What's the difference between a single-zone and multi-zone mini-split?"
    a: "A single-zone system runs one indoor air handler off one outdoor condenser — the common setup for a DADU or a single-room addition, usually LG or Daikin. A multi-zone system, typically Mitsubishi, runs two to four indoor heads off one larger outdoor unit, which suits an addition with several rooms or a whole upper floor needing separate temperature control. Multi-zone costs more upfront but avoids running multiple outdoor condensers along the property line. TopVolk sizes the system with a load calc rather than guessing off square footage."
  - q: "How long does a new HVAC system last in DuPont's climate?"
    a: "Heat pumps and ductless mini-splits typically run 12-15 years in the Puget Sound climate, a bit less if the outdoor condenser sits on a north-facing wall collecting moss and debris without regular clearing. High-efficiency furnaces run 15-20 years with annual filter changes and a clean flue. TopVolk backs installation labor with a 1-year warranty, separate from manufacturer coverage on the equipment itself, which typically runs 10-12 years on parts. Regular coil cleaning and duct inspection extend the life of either system noticeably."
