title: "Dupont Home Additions — DADUs & In-Law Suites Near JBLM"

answer: "TopVolk builds second-story additions, DADUs, and in-law suites in Dupont, Washington — WA Licensed Contractor, 100+ projects since 2023, line-item quotes."

intro: |
  Vladislav Volkov quotes most Dupont home additions with a line-item breakdown before a shovel touches the ground — no range, no "starting at," an actual number tied to the drawings. That matters more here than in most Pierce County towns because Dupont is a strange mix: brand-new construction in Northwest Landing sitting a quarter mile from company cottages built when the DuPont Powder Works was still running black powder out to Puget Sound. A family near Village Green recently wanted a DADU with a full kitchen for an aging parent — Bosch range, LG fridge, the works — and the lot size in that section of Northwest Landing meant checking FAR before drawing a single wall. Another job near Powder Works Park needed a second-story addition on a 1918 company house, which meant confirming the original foundation could carry new floor loads before anyone talked finishes. Dupont's small — under 10,000 people — but the housing stock spans over a century, and that spread changes how every addition gets engineered.

localContext: |
  Most of DuPont falls inside 98327, and that single zip code covers two very different building eras. Northwest Landing, built out steadily since the late 1990s as a new-urbanist master-planned community, uses standard modern framing, alley-loaded garages, and lot lines tight enough that setback compliance is the first thing we check for any addition or DADU. The older village core near Barksdale Avenue and Powder Works Park has original company cottages from the DuPont Company's gunpowder-works era — some still on original footings, a few with balloon framing that needs sistering before a second story goes on top. Properties along the southern edge, near where Dupont blends into Steilacoom's 98388, get folded into the same permit review since the City of DuPont's Community Development Department handles plans regardless of which side of that line a lot sits on. Joint Base Lewis-McChord borders the city directly, which means a fair number of clients are military families needing a mother-in-law suite or rental DADU built fast, on a schedule tied to PCS orders rather than the seasons.

commonProblems:
  - title: "DADU or AADU builds hitting HB 1337 lot limits in Northwest Landing"
    description: "WA HB 1337 lets a single-family lot in Dupont carry up to two ADUs, but Northwest Landing's compact New Urbanist lots often can't fit a second full-size unit once setback and lot coverage limits get applied. The fix usually means shrinking the footprint and going vertical instead — a two-story DADU with a smaller slab, capped at the 24-foot height limit most jurisdictions allow for detached units. We run the FAR math against the city's zoning table before drawing anything, then size the unit around a compact kitchen layout with LG or Samsung appliances instead of full-depth cabinetry. A typical 600-800 sq ft DADU here runs 4-6 months from design through final inspection, including the separate utility connection trenching."
  - title: "Second-story additions on 1910s-1920s company cottages"
    description: "The original cottages built for DuPont Powder Works employees near the historic village used undersized joists and post-and-pier foundations never meant to carry a second floor. Adding one means running actual load calculations, then usually installing an LVL beam over the main span and sistering the existing rim joist with new lumber tied in with joist hangers. Some of these homes also still have galvanized plumbing stacks that need rerouting once you open the ceiling for structural work. Budget for foundation reinforcement on top of the framing budget — it's rarely optional once an engineer looks at the actual joist spacing. Full second-story additions on these older homes typically run $150K-$220K and take 5-7 months including plan review."
  - title: "City of DuPont plan review and JBLM-adjacent height restrictions"
    description: "Building permits for additions in Dupont go through the city's Community Development Department rather than Pierce County PALS, since Dupont is incorporated — that trips people up who assume unincorporated Pierce County rules apply. Plan review for a second-story addition or DADU typically runs 6-10 weeks depending on how busy the department is that quarter, and anything near the JBLM boundary sometimes needs an extra sign-off pass for height and setback near the base line. We prepare full construction drawings, structural calcs stamped by an engineer when required, and the HB 1337 ADU checklist up front so the plan reviewer isn't sending it back for missing pages. TopVolk is a WA Licensed Contractor and handles the permit submission directly — no separate permit-expediter fee tacked on."
  - title: "What actually drives the cost on a Dupont home addition"
    description: "Additions here run anywhere from $30K for a simple bump-out to $200K+ for a full second story with a new kitchen and bath. The big cost swings come from foundation work — reinforcing a 100-year-old footing costs more than building on a modern Northwest Landing slab — plus appliance selections, since a lot of Dupont clients want Bosch or KitchenAid in a new in-law kitchen instead of builder-grade. Utility trenching for a detached DADU (water, sewer, electrical run from the main panel) adds $8K-$15K depending on distance from the house. Every quote from TopVolk is line-item, not a range, and the contract includes a penalty clause if we miss the agreed completion date — that's written in, not just promised."
  - title: "Matching siding, roofing, and insulation on an addition without it looking bolted-on"
    description: "A new second story or DADU that doesn't match the original exterior sticks out fast, especially against the cedar-and-shingle look common in Dupont's older village homes. We typically spec Hardie fiber-cement siding on additions since it holds paint and resists the rot that hits real cedar after a few Pacific Northwest winters, and we match reveal and trim profile to the existing house rather than defaulting to a flat modern look. New roof sections tie into R-49 attic insulation and a proper vapor barrier at the crawlspace, which matters given how much rain this area gets October through May. For heating and cooling the new space, a Mitsubishi mini-split zone is usually cheaper and less invasive than extending existing ductwork. Expect a 30-year warranty on Hardie product and standard workmanship coverage from TopVolk on the framing and finish work."

