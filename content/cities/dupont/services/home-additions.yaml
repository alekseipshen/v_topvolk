  - q: "How does the permit process work for an addition in Dupont?"
    a: "Permits for additions and ADUs in Dupont go through the City of DuPont Community Development Department, not Pierce County PALS, since the city is incorporated. Plan review typically takes 6-10 weeks for a second-story addition or DADU, and HB 1337 ADU applications need the separate utility connection plan attached. TopVolk prepares the full drawing set, structural calculations, and permit paperwork as part of the project and is a WA Licensed Contractor handling submission directly with the AHJ. Rough-in and final inspections get scheduled once framing and MEP work reach the right milestone."
  - q: "Can an existing foundation handle a second-story addition on an older Dupont home?"
    a: "Not always — the company cottages built during the DuPont Powder Works era used post-and-pier foundations and joist spacing that weren't designed for a second floor. We bring in an engineer to run load calculations before finalizing the design, and it's common to add an LVL beam, sister the existing joists, and reinforce footings before framing starts. Homes built during Northwest Landing's later phases usually have modern slab or perimeter foundations that carry a second story with less reinforcement work. This gets confirmed during the design phase, before permit submission, so there are no surprises mid-framing."
