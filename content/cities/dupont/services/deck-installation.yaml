title: "DuPont Deck Installation — PNW Rain, Pierce County Code"

intro: |
  Tucked between JBLM and I-5, DuPont's neighborhoods pull 40+ inches of rain annually
  from October through May — the same wet cycle that turns untreated cedar gray and
  moss-covered within three seasons. Composite decking like Trex Transcend handles that
  moisture without the annual sanding and sealing. Vladislav Volkov, WA Licensed
  Contractor, has completed 100+ projects since 2023 across the Seattle metro and handles
  the full permit package through Pierce County PALS.

localContext: |
  Zip code 98327 splits between Center Square's historic company-town homes — some built
  in the 1910s and 1920s — and the 1990s–2000s tract subdivisions that filled in around
  the JBLM perimeter. The older Center Square houses often have post-and-pier foundations
  with minimal lateral attachment points; the newer builds carry rim joists sized for ledger
  connections but need structural assessment before Pierce County PALS will approve a
  permit. Both housing eras show up on our project list regularly.

commonProblems:
  - title: "Cedar vs Composite: The Wrong Call Costs $10K–$18K at Replacement"
    description: "Cedar planks look sharp year one. By year three, north-facing boards in DuPont's
      damp climate have moss colonies and surface checking from the freeze-thaw cycles that
      hit the Pierce County lowlands through February. TimberTech Azek composite costs more
      upfront but carries a transferable warranty and holds its surface through 15+ PNW
      winters without sealing."
  - title: "Ledger Flashing Failures: The Rot Starts Behind the Siding"
    description: "The ledger board bolts your deck to the house's rim joist, and that joint traps
      water when the flashing is wrong. Pierce County PALS inspectors flag ledger flashing
      as a required inspection point — it fails more often on 1990s DuPont-area builds where
      the original contractor skipped step flashing entirely. Caught late, it rots the band
      joist, the sill plate, and the framing behind."
  - title: "Post Footings: Pierce County Code Requires Below Frost Depth"
    description: "Deck posts set on surface pads or in shallow poured concrete drift when the
      ground saturates and settles through wet seasons. Pierce County requires footings at
      minimum 12 inches below grade in the Tacoma-area lowlands — and every post must use
      ground-contact pressure-treated lumber rated PT-0.40 or higher. Simpson Strong-Tie
      post bases keep the wood out of standing water and pass rough-in inspection cleanly."

faq:
  - q: "How fast can you get to DuPont for a deck consultation?"
    a: "DuPont is about 35 minutes south of Seattle via I-5 — straightforward drive, no ferry.
      Call (206) 591-1096 to schedule an on-site visit with Vladislav directly. Most
      consultations happen within the week, and you get a line-item quote, not a ballpark
      range."
  - q: "Which composite decking brands do you work with in DuPont?"
    a: "Trex Transcend and TimberTech Azek are the two systems we spec most often for Pierce
      County clients. Both use hidden fastener systems that work cleanly with standard joist
      spacing. We walk through board profiles and color options on-site so you're not choosing
      off a brochure."
  - q: "How long does the permit and build process take for a deck in DuPont?"
    a: "Plan review at Pierce County PALS typically runs 3–5 weeks for an attached deck.
      Construction itself — framing, decking, guardrails, stair stringers — adds 1–3 weeks
      depending on size. Total timeline from permit submission to final inspection: roughly
      6–9 weeks for a mid-size deck. Deadline penalties are written into our contract."