  - q: "Does a fence in DuPont need HOA or permit approval?"
    a: "Homes in Northwest Landing fall under an active HOA with a design review committee that approves fence height, material, and color before any post goes in the ground — plan on 1-3 weeks for that review. Fences under 6 feet generally don't need a Pierce County PALS permit, but a retaining wall fence over 4 feet does trigger plan review. We pull the current HOA covenant sheet and prepare the submission drawings as part of the quote. As a WA Licensed Contractor, we've been through this DRC process on multiple Northwest Landing jobs already."
  - q: "Should I go with cedar or vinyl for a DuPont fence?"
    a: "Cedar picket fits the historic company-town character near the DuPont Historical Museum and takes a stain well, but it needs restaining every 3-4 years as it grays on north-facing runs. Vinyl privacy panels cost more up front but need almost no maintenance beyond a hose-down, which matters if you're not planning to repaint every few summers. Horizontal-slat cedar is the modern option we're installing more often in Northwest Landing's newer sections. We'll walk the yard with you and lay out the real cost difference over 15 years, not just the install price."
  - q: "What's the warranty on a TopVolk fence in DuPont's climate?"
    a: "Post-setting and structural work carry a workmanship warranty, and we stand behind the concrete footing and post depth against the leaning and heaving that shows up after wet Pierce County winters. Cedar panels typically hold 15-20 years with regular staining; vinyl runs past 25 years with basically no upkeep. Gate hardware — hinges and latches — is the first thing to wear, so we spec soft-close hardware rated for daily use instead of the builder-grade kits that sag in two years. Manufacturer warranties on vinyl panel systems apply on top of our install warranty."
