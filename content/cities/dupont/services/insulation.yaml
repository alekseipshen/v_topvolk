title: "DuPont Insulation — R-49 Attics & Crawl Space Fixes"

answer: "Owner-led insulation upgrades to R-49 attics, encapsulated crawl spaces, and closed-cell rim joists in DuPont, Washington — quoted on-site by Vladislav."

intro: |
  Homes built during DuPont's Northwest Landing boom in the late 1990s and 2000s meet current energy code on paper, but the R-30 fiberglass batt most builders stapled into those attics back then has settled and gapped enough to lose real R-value — Washington State Energy Code now calls for R-49 in this climate zone. A few streets over, in the older townsite core near the DuPont Historic Museum, houses built for Powder Works employees a century ago have no attic insulation at all above the kneewalls, just open framing and knob wiring nobody's touched since Truman was president. Vladislav Volkov has run TopVolk Construction's crews through both housing stock types — new-build tract homes off Barksdale Ave and the handful of pre-1920s cottages closer to Sequalitchew Creek. A Sub-Zero wine fridge in a finished bonus room over an unheated garage is a common trigger call: the room won't hold temperature because the rim joist underneath is bare. Same story with KitchenAid and LG appliance packages set against an exterior wall in a remodeled kitchen — the compressor runs constantly fighting heat loss it shouldn't have to fight. Call (206) 591-1096 and get a real number, not a phone estimate.

localContext: |
  DuPont sits mostly in zip code 98327, with a sliver of homes near JBLM's boundary sharing service with 98388 addresses in neighboring Steilacoom. Northwest Landing's builder-grade construction — vinyl siding over OSB sheathing, R-30 blown fiberglass in attics, minimal crawl space vapor barrier — dominates the newer sections west of I-5. The historic core near Center Drive and the old DuPont company town grid has original wood-frame cottages with post-and-pier foundations and dirt-floor crawl spaces that soak up moisture every winter off Puget Sound. DuPont's Community Development Department handles permits for anything touching electrical or structural framing (spray foam near knob-and-tube wiring qualifies); straight insulation swaps in attics and crawl spaces usually don't need a permit pull, but we file one anyway when the scope crosses into rim joist air sealing. PSE offers rebates on attic and floor insulation upgrades for homes in its Pierce County service territory, and most DuPont households qualify. Given the median household income here runs well above the county average, plenty of homeowners are also pairing insulation upgrades with a Mitsubishi mini-split or a Rinnai tankless retrofit in the same project — the insulation work is what makes those systems actually perform at their rated efficiency instead of fighting a leaky envelope.

commonProblems:
  - title: "Settled fiberglass batt in Northwest Landing attics"
    description: "Builder-installed R-30 fiberglass batt from the original Northwest Landing construction run compresses over 20-plus years, especially where it's been walked on near the attic hatch or HVAC platform. Compressed batt loses 30-40% of its rated R-value, which is why upstairs bedrooms run hot in August and cold by January even with a newer heat pump. The fix is pulling the old batt and blowing in Owens Corning ProPink or CertainTeed InsulSafe cellulose to hit R-49, which runs about $1.80-$2.40 per square foot installed depending on attic access. A 1,400 sq ft attic typically takes one day. We check for existing bath fan ducting and re-baffle vents before blowing anything in, so soffit airflow isn't blocked."
  - title: "Uninsulated crawl spaces near Sequalitchew Creek"
    description: "The older cottages closer to the creek and the historic townsite sit on post-and-pier foundations with open, vented crawl spaces — no vapor barrier, no rigid foam, just dirt and bare Douglas-fir joists. Puget Sound's wet season pushes ground moisture straight up into the subfloor, and we've pulled black mold off joist bays on more than one DuPont job. Crawl space encapsulation means a 10-mil vapor barrier sealed to the foundation wall, 2-inch rigid foam board on the perimeter, and sealing the vents — sometimes paired with a dehumidifier if the water table sits high. Full encapsulation on an average 1,000 sq ft crawl space runs $4,500-$7,500 depending on how much old batt and debris has to come out first."
  - title: "Rim joist heat loss around bonus rooms and additions"
    description: "Anywhere a finished room sits over an unheated garage or crawl space, the rim joist is usually the weak point — it's a single band of framing that most builders never insulate beyond a thin strip of fiberglass. That's the exact gap behind the Sub-Zero or Thermador appliance runs staying warm while the room above never holds temperature. Closed-cell spray foam, 2 inches minimum, air-seals and insulates the rim joist in one pass and stops the cold-air infiltration that batt insulation can't touch. Icynene or Demilec closed-cell runs about $1.50-$2.25 per board foot. On a typical 40 linear foot rim joist run, that's a half-day job, and it pairs well with a broader attic or crawl space visit since we're already on site."
  - title: "Kneewall gaps in the older DuPont cottages"
    description: "The pre-1920s townsite homes with 1.5-story layouts have kneewalls tucked behind the upstairs bedroom slopes, and in most of these houses that cavity was never insulated — it's just open stud bays venting straight into the unconditioned attic above. Cold air pools behind the kneewall and drafts through outlet boxes and baseboards all winter. We insulate the kneewall itself with R-21 fiberglass batt or Rockwool mineral wool where sound control matters too, then seal the attic-side access door with weatherstripping and rigid foam board. Because DuPont's Community Development office treats kneewall work as a straightforward insulation retrofit, no permit review is required unless we're opening up wiring behind it, which keeps the project moving in under a week."
  - title: "When to re-insulate vs. top off existing insulation"
    description: "Cellulose settles about 20% over its lifespan and fiberglass batt sags where it's been disturbed by wiring or plumbing work, so a 15-year-old attic usually needs a full pull-and-replace rather than just topping off. Spray foam, by contrast, doesn't settle and typically holds its R-value for 25-plus years without touch-up. We check with an infrared camera during the free consultation to show exactly where heat is escaping before quoting anything — no guessing based on the attic's age alone. Most DuPont attic jobs land in the $3,000-$6,000 range for full R-49 coverage on an average 1,500-1,800 sq ft footprint, and PSE rebates typically knock $500-$1,200 off that depending on the measured improvement."

faq:
  - q: "How fast can you get to DuPont for Insulation?"
    a: "DuPont sits about 10 minutes off I-5 near JBLM, so most attic and crawl space jobs get scheduled within a week of the on-site walkthrough. Vladislav does the estimate himself — no sales rep, no dispatcher relay. Parking in Northwest Landing and the historic core is straightforward driveway access for the crew truck, and attic-only jobs usually wrap in a single day. Call (206) 591-1096 to get on the schedule."
  - q: "What does attic insulation cost in DuPont?"
    a: "Most DuPont attics run $3,000-$6,000 to go from sagging R-30 batt to code-current R-49 blown cellulose, depending on square footage and how much old material has to be removed first. Crawl space encapsulation adds separately, usually $4,500-$7,500 for a typical 1,000 sq ft space with vapor barrier and rigid foam. We give a line-item quote on-site, not a phone range, and PSE rebates get applied before you sign anything."
  - q: "Do I need a permit for insulation work in DuPont?"
    a: "Straight attic or crawl space insulation swaps usually don't require a permit through DuPont's Community Development Department, but spray foam work near knob-and-tube wiring or anything touching structural framing does. TopVolk is a WA Licensed Contractor, and we pull the permit whenever the scope crosses that line so the final inspection isn't a surprise later. Most permitted insulation jobs clear plan review and inspection within two to three weeks."
  - q: "Blown-in cellulose or fiberglass batt — which is better for a DuPont attic?"
    a: "For open attic floors with irregular joist spacing, like most Northwest Landing homes, blown-in cellulose (Owens Corning or CertainTeed) fills gaps around wiring and framing that batt just bridges over, so it hits true R-49 coverage more reliably. Batt still makes sense for kneewalls and tight cavities where blowing equipment can't reach. We'll walk your attic and tell you which one actually gets you to code, not just whichever's cheaper to install that day."
  - q: "How long does spray foam or blown insulation actually last?"
    a: "Closed-cell spray foam on rim joists holds its R-value 25-plus years without settling, since it's a rigid, air-sealed product rather than loose fill. Blown cellulose settles roughly 20% over 15-20 years and eventually needs a top-off, especially in a damp Puget Sound climate. We back our insulation installs with a workmanship warranty, and material warranties come direct from the manufacturer — Owens Corning and CertainTeed both cover material defects for the life of the product."
  - q: "Do you cover areas near DuPont, or just the city itself?"
    a: "Yes — TopVolk works all of Pierce County plus King, Snohomish, and Kitsap, so Steilacoom, Lakewood, and the JBLM-adjacent neighborhoods are all in normal rotation alongside DuPont. Scheduling windows run about one to two weeks out for insulation-only jobs, sooner if it's bundled into a larger remodel already on the books. Call (206) 591-1096 or ask for a free on-site consultation — Vladislav will walk the attic or crawl space with you and quote it that day, with a deadline penalty written into the contract if we're the ones who fall behind."