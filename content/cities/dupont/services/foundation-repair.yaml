    a: "Yes — we regularly work DuPont, Steilacoom, Lakewood, and the JBLM housing perimeter as part of our Pierce County service area. Scheduling windows run 2-3 days out for estimates and 1-3 weeks for the actual repair depending on permit needs. Call (206) 591-1096 or ask for a free on-site consultation; Vladislav does the walkthrough himself, and 100+ projects completed since 2023 means he's seen most of what DuPont's soil can throw at a foundation."