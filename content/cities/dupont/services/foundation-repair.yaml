  - q: "What does foundation crack repair cost in DuPont?"
    a: "Straightforward epoxy injection on a hairline stem wall crack runs $800-$2,000; wider structural cracks needing carbon-fiber reinforcement or excavation push toward $3,500-$6,000. Cost swings mainly on crack width, whether we're working from the interior or need exterior digging, and current soil saturation. We give you a line-item quote at the free consultation, not a ballpark range over the phone. Call (206) 591-1096 to get an actual number for your house."
  - q: "Do I need a permit for foundation work in DuPont?"
    a: "Most structural repairs — mudsill bolting, post replacement, shear wall additions — need a permit through the City of DuPont's building division, which follows Pierce County and IRC standards. Smaller cosmetic crack sealing usually doesn't require one, but we check before quoting so there are no surprises mid-job. As a WA Licensed Contractor, TopVolk pulls the permit, schedules the rough-in and final inspection, and handles the paperwork directly. Typical plan review takes 2-4 weeks depending on scope."
  - q: "What's the difference between epoxy injection and polyurethane foam for crack repair?"
    a: "Epoxy injection is a structural fix — it bonds the concrete back together and works best on cracks that have stopped moving. Polyurethane foam flexes slightly and seals out water faster, which is the better call on active or still-widening cracks common in freshly settled Northwest Landing lots. We test crack width and movement at the estimate before recommending either one. Both methods get applied the same day once we've confirmed which one your crack actually needs."
  - q: "How long does a foundation repair last in DuPont's climate?"
    a: "A properly executed epoxy or polyurethane crack repair typically holds 15-20+ years if the underlying drainage issue gets fixed at the same time. Post replacement with pressure-treated lumber and steel jack posts should outlast the original cedar posts by decades, especially paired with a new vapor barrier. What's not covered under warranty is new movement caused by a drainage problem we flagged but the homeowner chose to skip. We stand behind the structural work itself with a written warranty at signing."
