title: "DuPont General Contracting — Northwest Landing Whole-Home Remodels"

intro: |
  Northwest Landing's rows of late-1990s colonials and craftsman-style tract homes in 98327
  were built for military families rotating through JBLM — and most haven't had a structural
  upgrade in decades. A full kitchen gut with a Bosch dishwasher, quartz countertops, and a
  relocated island wall means pulling a Pierce County PALS permit and coordinating four
  separate trades. That's where a general contractor earns their keep.

localContext: |
  The bulk of DuPont's residential stock sits in Northwest Landing — phased construction
  from 1997 through 2008, builder-grade framing, vinyl siding, and minimal insulation by
  today's energy-code standards. Zip code 98327 covers most of it. Some older parcels near
  the historic DuPont town center predate the planned development entirely. Renovating those
  structures often surfaces original galvanized plumbing or undersized electrical panels that
  need full replacement before finish work can begin.

commonProblems:
  - title: "Builder-Grade Framing Hidden Behind Updated Finishes"
    description: |
      Homes built in Northwest Landing between 1997 and 2005 typically have 2x4 exterior
      walls with R-11 insulation behind vinyl siding. Add a Thermador hood and you're pulling
      an electrical rough-in inspection before drywall goes back. Structural headers above
      openings are sometimes undersized — doubled 2x6 where an LVL beam should carry the
      load — and that discovery mid-demo rewrites the budget fast.

  - title: "Multi-Trade Scheduling Gaps That Stall Projects"
    description: |
      Plumbing, electrical, and mechanical rough-ins all need to pass inspection before
      insulation goes in — Pierce County PALS inspection slots book 5–10 days out during busy
      season. A homeowner managing their own subs gets stuck when one trade no-shows and the
      whole schedule blows. MEP coordination is the most common reason $120K remodels drag
      four months past the original timeline.

  - title: "Permit Applications for Additions and ADUs Under WA HB 1337"
    description: |
      DuPont falls under Pierce County PALS jurisdiction — not a city permit office. An ADU
      or addition still requires a full plan review: site plan, floor plan, electrical,
      mechanical. Plan review runs 6–12 weeks for additions. Requesting a pre-application
      meeting with Pierce County can cut that wait. Most homeowners don't know that option
      exists until they've already lost two months.

faq:
  - q: "How fast can you get to DuPont for General Contracting?"
    a: |
      DuPont is roughly 20 miles south of Tacoma via I-5 — typically 25–35 minutes. Call
      (206) 591-1096 to set up a free on-site consultation. Vladislav comes out, walks the
      scope with you, and returns a written line-item estimate within a week.

  - q: "What brands do you commonly install during DuPont kitchen remodels?"
    a: |
      Bosch and KitchenAid are the most common in Northwest Landing homes. Thermador and
      Sub-Zero show up in higher-end builds around the historic town center. Each brand has
      different rough-in requirements — cabinet cutouts, dedicated circuits, gas line sizing —
      and those specs get locked in before cabinets go in, not after.

  - q: "How do you prevent budget overruns on larger remodels?"
    a: |
      Demo always surfaces surprises — galvanized pipe, undersized headers, outdated wiring.
      Every contract includes a contingency line and requires written sign-off before any
      scope change hits the budget. Deadline penalties are written into the contract too.
      Call (206) 591-1096 — WA Licensed Contractor, 100+ projects completed since 2023.