  - q: "Do I need a permit for a panel upgrade in DuPont, and does the HOA get involved?"
    a: "Yes — any service panel swap or upgrade needs a permit through the City of DuPont Building Division, plus scheduled coordination with Puget Sound Energy for the disconnect and reconnect. If you're in Northwest Landing, the HOA architectural review can also apply to anything visible from the street, like a relocated meter base. TopVolk, as a WA Licensed Contractor, prepares and submits both sets of paperwork and books the rough-in and final inspections. Expect 2-3 weeks from application to final sign-off on a standard upgrade."
  - q: "Can I add a dedicated circuit for my Tesla or ChargePoint charger without replacing the whole panel?"
    a: "Often, yes — it depends on what your load calculation shows once we account for existing heat pump, range, and dryer circuits. If there's headroom, we run a dedicated 50A or 60A circuit straight from the existing panel to a hardwired ChargePoint, JuiceBox, or Tesla Wall Connector. If the panel's already maxed by an induction range and mini-split, a service upgrade becomes the more honest answer. We'll tell you which situation you're in during the free consultation, not after the invoice."
  - q: "What's the warranty on panel and wiring work, and how long does it last in this climate?"
    a: "TopVolk backs the workmanship on panel upgrades and rewiring with a written warranty, and Square D or Eaton breakers carry their own manufacturer coverage on top of that. In DuPont's damp, close-to-the-Sound air, outdoor meter bases and disconnects see more corrosion than inland Pierce County, so we spec weatherproof enclosures rated for it. A properly installed 200A panel should run 30-40 years with normal maintenance — monthly GFCI testing, keeping the enclosure sealed, and not ignoring repeated AFCI trips."
