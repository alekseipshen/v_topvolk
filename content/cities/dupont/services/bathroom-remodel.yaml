title: "DuPont Bathroom Remodel — Past the Builder-Grade Era"

intro: |
  The subdivisions running off Palisade Boulevard and Center Drive in 98327 were platted
  fast in the late 1990s. Those bathrooms are showing their age now. Fiberglass surrounds,
  cultured-marble tops, and 4-inch tile grout lines that wicked moisture for 25 years are
  standard across DuPont. Vladislav has torn out and rebuilt dozens of those setups,
  replacing them with curbless showers, large-format porcelain, and Kohler fixtures
  spec'd for Pierce County's sustained humidity.

localContext: |
  DuPont's residential buildout ran from 1995 to roughly 2008 — right after the city
  incorporated and developers filled land around the historic village near Sequalitchew
  Creek. The Joint Base Lewis-McChord corridor drove population growth here, and the
  pace of that development shows in the mechanicals: fiberglass pan-and-surround combos,
  1990s Moen cartridge valves, and exhaust fans sized for a coat closet rather than a
  full bath.

  Most of the housing stock in 98327 concentrates in three distinct pockets. The
  Heritage Hill section north of Center Drive has the tightest lots — townhome-style
  builds where the primary bath shares a wall with a neighbor. NorthShore, closer to
  Sequalitchew Creek Park, skewed toward larger single-family homes on 7,000–9,000
  sq-ft lots, typically built 2000–2005. The older blocks near the DuPont Historic
  Village — along Wilmington Drive and McNeil Street — predate the boom and have
  different issues: original cast-iron tubs, 3-inch galvanized drains, and subfloors
  that were never shimmed level. Each zone has its own set of surprises once demo
  starts.

  The 98327 zip sits close to the Nisqually Delta, with the Nisqually National Wildlife
  Refuge just east of I-5. October through April, that proximity means sustained
  humidity — roughly 37 inches of rain annually, with the moisture load heaviest in
  the shoulder seasons. Without a proper vapor barrier and Schluter Kerdi liner behind
  the tile assembly, shower walls in DuPont homes absorb water season after season.
  That's not a caulk problem. It's a waterproofing problem.

  Permits for DuPont bathrooms run through Pierce County PALS — not the City of DuPont
  directly. Budget 2–4 weeks for plan review on a full gut-and-rebuild. Scopes limited
  to fixture swaps without structural changes can sometimes skip the permit queue
  entirely, but any drain relocation or wall removal triggers a full mechanical and
  structural review. Vladislav walks every client through what will and won't require
  filing before a single thing gets pulled.

commonProblems:
  - title: "Shower Surrounds Delaminating at the Pan Joint"
    description: >-
      Fiberglass one-piece surrounds flex with temperature changes, and the caulk joint
      at the pan fails first. Water migrates into the subfloor silently — sometimes for
      months before anyone notices soft spots underfoot. By the time you do, the rim joist
      underneath may already need sistering. Full tear-out to bare studs, RedGard membrane
      over cement board, then tile sets the problem right for good. Not a patch. A rebuild.

  - title: "Exhaust Fans Too Weak for PNW Humidity"
    description: >-
      Builder-installed fans in DuPont's 90s-era homes typically ran 50–70 CFM — below
      the IRC minimum for bathrooms over 50 square feet. Black grout lines follow. So does
      peeling paint at the ceiling and mildew behind towel bars. Upgrading to a 110-CFM
      Panasonic WhisperCeiling unit with a humidity sensor or a Bosch ventilation fan with
      timer control is standard on every full bath remodel we run in this zip code.

  - title: "Corroded Supply Lines and Worn Cartridge Valves"
    description: >-
      Homes in 98327 built before 2000 commonly have galvanized supply lines showing rust
      scale at the shutoffs. Moen and Delta cartridge valves from that era drip or fail to
      balance temperature. During the rough-in phase we pull those supply lines, swap to
      ball-valve shutoffs, and install a new pressure-balanced Kohler or Moen valve —
      before a single tile goes on the wall. Call (206) 591-1096 to schedule a free on-site
      look at what you're actually working with before committing to a scope.

faq:
  - q: "How fast can you get to DuPont for a bathroom remodel consultation?"
    a: >-
      DuPont is a straight I-5 run to Exit 119 — roughly 35 minutes from our usual South
      King and North Pierce work zone. Vladislav comes out directly, measures the space,
      and hands you a line-item estimate. No commissioned closer. No vague ballpark.
      Call (206) 591-1096 to set up a free on-site visit.

  - q: "Which fixture brands do you typically install in DuPont bathroom remodels?"
    a: >-
      Kohler and Moen handle most of our shower valve and faucet installs — Kohler
      Rite-Temp and Moen Posi-Temp are the reliable workhorses. Clients going for a
      rain-head setup often land on Kohler Choreograph or a Delta Trinsic system. For
      ventilation, Bosch and Panasonic both perform well against DuPont's humidity load.
      Tile and waterproofing goes through Schluter Kerdi kits sourced at supply houses
      rather than big-box retail, which keeps lead times predictable.

  - q: "What does a full bathroom remodel cost in DuPont and how long does it take?"
    a: >-
      A gut-and-rebuild primary bath in 98327 — curbless shower with Schluter Kerdi liner,
      large-format porcelain, new vanity, Kohler toilet, and ventilation upgrade — typically
      runs $25,000–$45,000 depending on fixture spec. Timeline is 5–8 weeks from permit
      issuance. Pierce County PALS reviews DuPont bathroom permits; budget 2–4 weeks for
      plan review before demo starts. Deadline penalty is written into the contract.
      TopVolk Construction is a WA Licensed Contractor with 100+ projects completed since
      2017 across Pierce and King counties. Owner-led — Vladislav handles the project
      directly, not a rotating crew you've never met.