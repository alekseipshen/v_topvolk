  - q: "What does full-house window replacement cost in DuPont?"
    a: "Most DuPont jobs land between $14,000 and $30,000 for a full house of 15-20 windows, or $700-$1,800 installed per window depending on vinyl versus fiberglass or wood-clad. Custom grille patterns, upper-story access, and sound-rated glass near I-5 push costs toward the higher end. We quote line-item pricing after the walkthrough — no vague ranges. Ask for the free estimate and you'll see exactly what each window and each line of labor costs before signing anything."
  - q: "Do I need a permit to replace windows in DuPont?"
    a: "Straight retrofit replacements in the same rough opening usually don't require a separate permit, but any structural change — enlarging an opening for egress, adding a new opening, or altering a header — goes through the city's permit review, handled through Pierce County PALS. Typical review on that kind of job runs 2-4 weeks. As a WA Licensed Contractor, we handle the permit application and inspection scheduling directly so you're not the one on hold with the county."
  - q: "Vinyl or fiberglass — which holds up better this close to Puget Sound?"
    a: "Fiberglass, like Marvin Elevate, expands and contracts less with temperature swings and handles wind-driven rain off the Sound better over 20-plus years. Vinyl, such as Milgard Tuscany, costs less upfront and performs fine on walls without direct water exposure. We spec low-E glass with argon fill either way to hit Washington's energy code targets. For a west-facing wall catching weather straight off the water, we'll usually recommend fiberglass or a wood-clad option like Pella Reserve."
  - q: "What warranty comes with a new window installation?"
    a: "Milgard backs its vinyl windows with a Full Lifetime Warranty covering glass and hardware; Pella and Marvin carry their own manufacturer warranties, typically 10-20 years on glass seals. On top of that, TopVolk warranties the installation labor separately, and there's a deadline penalty built into every contract if we miss the promised completion date. In DuPont's rain, most seal failures show up as fogging between panes within the first decade if flashing wasn't done right — which is why we don't skip that step."
