  - q: "Can you match drywall texture on an old patch job?"
    a: "Yes — matching knockdown or orange peel texture is standard on Sedro-Woolley homes built anywhere from the 1970s through today. The process runs mesh tape over the patch, a few coats of joint compound, a texture pass matched to the surrounding wall, then priming before paint. CertainTeed compound and board blend cleanly on most repairs. A well-matched patch is invisible under normal room lighting once the paint sheen is matched too."
  - q: "How long will a deck railing or board repair last in this climate?"
    a: "Pressure-treated lumber typically lasts 10-15 years at ground contact here before rot sets in, less on exposed railings that take direct rain. Composite options like Trex or TimberTech run longer — 25+ years — and skip the annual sealing PT lumber needs. Workmanship on repairs is backed by TopVolk directly, and any missed completion date carries a penalty written into the contract, not just a verbal promise."
