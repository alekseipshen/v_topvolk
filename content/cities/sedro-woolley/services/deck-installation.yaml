    a: "Coverage extends beyond Sedro-Woolley to Mount Vernon, Burlington, and the unincorporated edges out toward Concrete and the Prairie area, plus the rest of the King, Snohomish, Pierce, and Kitsap county service area. Scheduling usually opens within a week or two of first contact, and Vladislav does the site walkthrough himself rather than sending a salesperson. Call (206) 591-1096 or ask for a free consultation to get a date on the calendar."