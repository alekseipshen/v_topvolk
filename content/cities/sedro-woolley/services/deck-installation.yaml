    a: "Sedro-Woolley sits about 20 minutes north of Mount Vernon off SR 20, and TopVolk schedules jobs there the same as anywhere else in the Skagit-to-King County corridor — usually within 1-2 weeks of a signed contract for the site walkthrough. Most attached decks run 3-5 weeks from permit approval to final inspection; a full second-story deck with drainage systems underneath can run 6-8 weeks. There's no dispatch fee for driving out, and parking on residential streets near downtown or out toward Fruitdale hasn't been an issue on past jobs. Call (206) 591-1096 to get on the schedule."
  - q: "What does a new deck cost in Sedro-Woolley?"
    a: "Most attached decks here run $35-$65 per square foot installed depending on decking material — pressure-treated framing with cedar boards on the low end, Trex or TimberTech composite with metal or cable railing on the high end. Footing depth, stair count, and whether the deck sits over a walkout basement or living space all move the number. TopVolk gives a line-item quote after an on-site walkthrough, not a phone estimate, so the price reflects the actual lot and framing needed. Schedule a free consultation to get exact numbers."
  - q: "Do I need a permit for a deck in Sedro-Woolley, and who issues it?"
    a: "Yes — any deck attached to the house or more than 30 inches off grade needs a permit, and almost every deck TopVolk builds falls into one of those categories. Inside city limits that's the City of Sedro-Woolley Building Department; just outside the city boundary it's Skagit County PDS, and the two offices don't always run on the same review timeline. TopVolk is a WA Licensed Contractor and handles the permit application, footing plan, and both the framing and final inspections directly. Plan on 2-4 weeks for plan review before framing can start."
  - q: "Cedar or composite — which one actually holds up better here?"
    a: "Composite decking like Trex Transcend or TimberTech AZEK handles Skagit Valley's rain and moss better than cedar, plain and simple, and it doesn't need annual sealing. Cedar looks better to some homeowners and costs less upfront, but on shaded lots near tree cover or facing north it can show moss within a single wet season. TopVolk installs both, framed the same way with PT lumber joists at code-compliant spacing and Simpson Strong-Tie hardware at every connection. The framing underneath matters more for longevity than which decking goes on top."
  - q: "What's the warranty on a new deck, and how long should it last?"
    a: "TopVolk backs the framing and installation workmanship, and materials carry their own manufacturer warranty — Trex and TimberTech both run 25-50 year limited warranties on the decking itself, and PT lumber framing typically holds up 20-25 years if the ledger flashing was done correctly. What's not covered is UV fading on cedar or normal wear on high-traffic boards; that's maintenance, not a defect. A properly flashed ledger board and correctly sized footings are what actually determine whether a deck lasts 15 years or 30."
