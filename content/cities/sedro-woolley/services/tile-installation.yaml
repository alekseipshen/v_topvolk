    a: "Sedro-Woolley falls within TopVolk Construction's Skagit County service radius alongside Burlington, Mount Vernon, and Clear Lake, so scheduling and travel time work the same way across that area. Most weeks have openings 1-3 weeks out for tile jobs, tighter during peak remodel season in spring and early summer. Vladislav Volkov runs every consultation personally, so there's no sales rep handing the job to someone else after the estimate. Call (206) 591-1096 to check the current schedule for your area."