  - q: "Do I need a permit for a water heater or repipe in Sedro-Woolley?"
    a: "Yes — inside city limits, plumbing and water heater permits go through the City of Sedro-Woolley Building Department; properties in unincorporated areas near Cokedale or Prairie fall under Skagit County PDS. Both require seismic strapping on tank-style water heaters and a final inspection before the system's signed off. TopVolk pulls the permit, schedules the rough-in and final inspection, and keeps the paperwork on file as part of the project. As a WA Licensed Contractor, TopVolk handles this coordination on every remodel that touches plumbing, not just the plumbing scope itself."
  - q: "Should I switch to a tankless water heater during my remodel?"
    a: "If your household regularly runs multiple showers or a dishwasher and laundry back-to-back, a Rinnai or Navien tankless unit solves the run-out problem tank-style heaters have — but it needs a gas line sized for the higher BTU draw and a dedicated vent run. During a kitchen or bath remodel, that gas line and vent work gets scoped alongside the rest of the mechanical rough-in, which is cheaper than retrofitting it later. Electric tankless is an option too, but most Sedro-Woolley homes on natural gas or propane get better recovery from a gas-fired unit."
  - q: "How long do PEX and copper repipes last in this climate?"
    a: "PEX-A holds up 40-50 years when it's properly supported and kept out of direct sunlight and rodent-accessible crawlspaces; copper often outlasts the house if the water chemistry isn't aggressive. Skagit County's wet winters mean crawlspace and exterior-wall runs need real insulation and, in the colder foothill stretches, heat tape to avoid freeze-splits. TopVolk backs installation work under the general contract warranty, and any manufacturer warranty on fixtures like Moen or Kohler hardware carries through separately. Galvanized pipe, by contrast, is already past its useful life if the house predates 1960."
