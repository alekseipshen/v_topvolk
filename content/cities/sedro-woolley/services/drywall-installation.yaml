  - q: "Do I need a permit for drywall work in Sedro-Woolley?"
    a: "Straight drywall repair or a bathroom refinish generally doesn't need a permit, but anything involving a fire-rated wall — garage separation, a DADU, or structural changes tied to a remodel — does. Jobs inside city limits go through the Sedro-Woolley building department on Ferry Street; unincorporated addresses in Prairie or Cokedale go through Skagit County PDS instead. Plan review for a fire-rated wall typically adds two to four weeks before board can go up. As a WA Licensed Contractor, TopVolk pulls the permit and schedules the rough-in and final inspections directly, so the paperwork doesn't fall on the homeowner."
  - q: "What's the difference between Level 4 and Level 5 drywall finish?"
    a: "Level 4 is standard — two coats of mud over the tape, sanded smooth, fine for most walls and flat-lit ceilings. Level 5 adds a full skim coat of thinned compound over the entire surface, which is what stops every seam and screw dimple from shadowing under recessed LED cans or sidewall lighting in a remodeled kitchen. It costs more and adds a day or two, but skipping it under strong lighting means visible flashing within months. We use setting-type compound for the base coats and a lighter topping compound for the final skim to keep sanding manageable."
  - q: "How long does drywall last, and what's covered under warranty?"
    a: "Properly installed drywall with the right board — mold-resistant purple board in wet areas, 5/8-inch type-X where fire code requires it — holds up 25-plus years with normal wear. Skagit Valley's humidity and seasonal flooding are the main threats, so nail pops and cracked tape near exterior walls are the most common issue we see on older homes. TopVolk backs workmanship on drywall installation and stands behind any deadline penalty written into the contract if the job runs late through our own fault. Manufacturer board warranties from brands like CertainTeed cover material defects separately."
