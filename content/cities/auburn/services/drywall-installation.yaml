title: "Auburn Drywall Installation — Fixing What 1970s Builders Left Behind"

intro: |
  The ranchers and split-levels off Auburn Way South and along the 98002 corridor went up fast
  between 1968 and 1985 — 3/8-inch gypsum on interior walls, zero fire separation in garages,
  popcorn on every ceiling. After a GE dishwasher line fails behind a cabinet or plumbing rough-in
  opens up a wall during a bathroom remodel, you find out how little thought went into the original
  install. TopVolk Construction handles drywall work across Auburn's housing stock — hang, tape,
  finish, and patching — owner-led by Vladislav Volkov, WA Licensed Contractor.

localContext: |
  Auburn's residential base splits between pre-1980 tract housing in the 98002 zip code and
  newer Lakeland Hills development around 98092 built from the mid-1990s onward. The older
  stock near Les Gove Park is predictable: galvanized plumbing, no blocking in walls, 1/2-inch
  standard drywall in places that now require 5/8-inch type-X firecode drywall by code. Lakeland
  Hills homes are better framed but still show Level 5 finish gaps once recessed lighting goes in.
  The October-through-April rain that saturates the White River drainage corridor makes moisture
  management in below-grade spaces non-negotiable across both eras. Crawlspaces in the older
  98002 stock regularly show failed vapor barriers — 4-mil poly installed over bare dirt in 1975
  that's long since torn or shifted — and that moisture migrates into the lower wall cavities.
  Once the paper face on standard gypsum starts delaminating from below, patching over it
  doesn't hold. The whole section comes out, vapor barrier gets replaced with 6-mil continuous
  sheeting, and mold-resistant board goes back in. That's a two-day job minimum before any
  finish work starts.

commonProblems:
  - title: "Garage-to-Living-Space Fire Separation Missing or Wrong Gauge"
    description: "A lot of Auburn's 98002-era construction never put 5/8-inch type-X firecode drywall
      on the garage side of the separation wall — standard 1/2-inch went in instead. Converting a
      garage into living space or building out an AADU triggers a King County DPER plan review, and
      the inspector will catch it at rough-in inspection. It comes off and gets redone correctly
      before framing gets covered. No shortcuts get past that inspection."
  - title: "Below-Grade Moisture and Standard Drywall Failing in Basements"
    description: "Finished basements in Auburn's older ranchers often used regular gypsum — no vapor
      barrier, no mold-resistant board. Five Seattle winters later, the paper face is bubbling and
      the seams are black. The fix is mold-resistant purple board (USG Sheetrock Mold Tough) on
      exterior-facing walls with a 6-mil poly vapor barrier behind it. Anything less and the same
      problem returns by year three. We see this in laundry rooms and utility areas constantly.
      In some 98002 homes with concrete block foundations, the wall framing sits directly on the
      slab with no pressure-treated bottom plate — water wicks up, the framing rots, and the
      drywall is the last thing to show symptoms. The full repair means pulling back to studs,
      replacing the bottom plate with PT lumber, and restarting the assembly correctly."
  - title: "Popcorn Ceiling Removal Before Level 5 Finish for New Lighting"
    description: "Recessed lighting in a remodeled Lakeland Hills kitchen or bath changes everything
      about how the ceiling reads. Sidewall light shows every ridge, roll mark, and joint under
      spray texture. Popcorn comes off first — skim-coat over it isn't a real option — then
      Level 5 finish goes on with a final skim coat and sanding before prime. Skipping Level 5 on
      a freshly lit ceiling produces a result that looks worse than the popcorn did. QuietRock
      panels also come into play on shared bedroom walls in the same remodel scope."

faq:
  - q: "How fast can you get to Auburn for drywall installation?"
    a: "Auburn sits 35 minutes south of Seattle via SR-167, and we work the 98002 and 98092 zip
      codes regularly. Call (206) 591-1096 to book a free on-site walkthrough — Vladislav comes
      out himself, not a salesperson or estimator."
  - q: "Do you handle soundproofing between rooms or shared walls in Auburn homes?"
    a: "Yes. Resilient channel with QuietRock or a double-layer assembly with Green Glue compound
      between sheets — we spec based on the actual wall framing and what's behind it. Common on
      Auburn split-levels where a bedroom shares a wall with a garage or laundry room. Older
      98002-era framing sometimes runs 2x3 interior walls instead of 2x4, which limits cavity
      depth for insulation batts. That affects the soundproofing assembly choice. We look at
      what's there before spec-ing anything."
  - q: "What's the permit situation for drywall work in Auburn?"
    a: "Cosmetic drywall patching and finish work typically don't require a permit. Structural
      changes, fire-separation walls, or drywall as part of a larger remodel pull through King
      County DPER or Auburn's own permit center depending on scope. King County DPER plan review
      on a garage conversion or AADU addition runs 6-10 weeks on average — longer if the
      application needs revisions. Vladislav handles permit coordination on projects where it's
      required, and deadline commitments are written into the contract with penalties for missing
      them. Call (206) 591-1096 to discuss your scope and get a line-item quote from the person
      who will actually do the work."