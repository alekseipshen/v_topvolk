title: "Auburn Handyman Services — Punch List Done Right in 98002"

intro: |
  Down near Les Gove Park and through the Lakeland Hills neighborhoods, Auburn's split-levels and ranchers have been quietly stacking up deferred small jobs. A dripping GE bathroom faucet. Weatherstripping that failed two winters ago. These aren't contractor-scale problems — but they still need someone who actually shows up and finishes them.

  TopVolk handles the handyman list in Auburn: fixture swaps, drywall patches, deck board replacement, smart home installs, and everything else that never makes it onto a remodel scope. Vladislav Volkov — WA Licensed Contractor, 100+ projects completed since 2017 — takes the call himself. No dispatcher. No sales rep quoting a day rate and disappearing.

  Call (206) 591-1096 to get on the schedule.

localContext: |
  Most of Auburn's residential core — zip codes 98001 and 98002 — is builder-grade 1980s to early-90s tract construction that filled the Kent Valley. These homes typically have hollow-core doors with compressed weatherstripping, skip-trowel or popcorn texture ceilings that make drywall patches a matching challenge, and wood decks that have absorbed enough PNW rain to start losing boards.

  Lakeland Hills came later — early 2000s construction — but it's now old enough to have its own growing punch list. Window seals fogging. Bathroom exhaust fans that rattle or stopped pulling air. Deck railings that flex when you lean on them.

  These Auburn homes run solidly mid-range. Samsung and LG appliances alongside older Whirlpool and GE units. Owners here typically want the work done once, done right, without a second callback.

commonProblems:
  - title: "Drywall Patches That Don't Match 1980s Texture Ceilings"
    description: "Auburn's 98002-era builders loved skip-trowel and orange-peel texture. Patch a hole with fresh compound and it reads flat against the surrounding ceiling — the repair is visible from across the room. Proper texture matching means feathering the mud, letting it flash, then hand-troweling or spraying to blend. It's a real skill most homeowners underestimate until they've made three attempts. For popcorn ceilings in pre-1980 sections of Auburn North, there's also a testing step before any sanding happens."

  - title: "Weatherstripping Failure on Exterior Doors in High-Rain Zones"
    description: "Auburn gets heavy rain from October through May — roughly 37 inches per year. Original foam-bulb weatherstripping on 1985-1998 exterior doors has long since compressed flat. Cold air pulls in at the threshold and both jamb sides. Replacing the door sweep, installing new compression weatherstripping on the stop, and adjusting the strike plate typically solves the draft without touching the door itself. Two hours on a standard 32-inch exterior door."

  - title: "Deck Board Replacement After Repeated PNW Winters"
    description: "Pressure-treated lumber decks in Lakeland Hills and Auburn North absorb moisture all winter. Boards cup and split, fasteners back out, and railing posts work loose where they meet the rim joist. Replacing individual boards and re-securing the railing is usually a half-day job — unless the rim joist or ledger board underneath has also rotted, which changes the scope fast. We assess the ledger attachment and rim joist condition before quoting so there are no surprises mid-job."

  - title: "Undersized Bathroom Exhaust Fans in 1990s Builder-Grade Homes"
    description: "Builder-grade exhaust fans from the early 90s were spec'd at 50 CFM for bathrooms that need 80-110 CFM based on square footage. They also rattle, which is usually a worn motor mount. Swapping in a Broan or Panasonic unit with the correct CFM rating takes most of an afternoon. That includes routing the duct to a proper exterior termination — not into the attic, which is how the original builders cut corners and how mold problems start in Auburn's humid winters."

