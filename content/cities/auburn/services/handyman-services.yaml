title: "Auburn Handyman Services — Small Repairs Done, Not Deferred"

intro: |
  Down along the Green River corridor and into the neighborhoods off Auburn Way
  North, most homes were built between 1983 and 1997 — builder-grade throughout.
  A Moen hall-bath faucet that's started dripping. Weatherstripping on the back
  slider compressed flat after years of use. A drywall patch from last year's
  plumber visit, still unpainted.

  TopVolk handles exactly this: repairs too small for a remodeling contractor
  but specific enough to need someone who actually knows what they're doing.
  Vladislav Volkov takes the call directly — no dispatcher, no estimator who
  doesn't own tools.

localContext: |
  The 98001 and 98002 zip codes cover most of Auburn's residential core —
  split-levels and two-story production homes from the late 1980s and early
  1990s. Builder-grade fixtures, hollow-core interior doors, and original
  aluminum-frame windows are standard. Galvanized supply lines under sinks
  and to hose bibs are the norm on anything built before 1995.

  Many of these homes also have aging decks on south and west elevations.
  Original pressure-treated (PT) lumber that's been splitting and checking
  after 30-plus years of PNW rain cycles and winter freeze-thaw in the Green
  River Valley.

  The 98092 area — farther east toward the Lea Hill and Academy neighborhoods
  — runs slightly newer stock, mid-1990s into early 2000s. Still builder-grade.
  Still the same deferred punch list: caulk failures around tubs, loose
  toilet flanges, exhaust fans that vent into the attic instead of outside.

commonProblems:
  - title: "Drywall Patches That Never Got Textured"
    description: |
      After plumbers or HVAC crews cut access holes, someone has to close them
      up properly. Auburn's 1980s homes typically have knock-down or orange-peel
      texture on the walls — not a flat surface you can feather with joint
      compound and call done.

      Matching it takes a practiced hand with a hopper gun or aerosol texture,
      then a careful paint blend so the patch disappears rather than announces
      itself. Getting the sheen level right on the finish coat matters just as
      much as the texture pattern. A flat paint over a satin wall reads wrong
      even in low light.

  - title: "Weatherstripping and Deck Board Replacement Before the Rains Hit"
    description: |
      Auburn averages over 35 inches of rain annually. Original door
      weatherstripping on patio sliders fails after 10 to 15 years of
      compression — the foam core compresses permanently and the seal is gone.

      Deck boards — especially older pressure-treated (PT) lumber — check and
      split through the freeze-thaw cycles that hit the Green River Valley from
      November through February. Replacing individual boards and re-securing
      loose railings is far cleaner and cheaper than waiting until the whole
      structure needs a rebuild. Composite decking like Trex holds up better
      in Auburn's climate, but PT replacement boards are still the right call
      when only a few are failing and the framing underneath is sound.

  - title: "Fixture Swaps and Appliance Hookups on Older Plumbing"
    description: |
      Swapping a builder-grade faucet for a new Moen or Delta seems
      straightforward. On Auburn's older homes, the supply lines are often
      1/2-inch galvanized — corroded at the shutoff valve — and need
      replacement before the new fixture connects cleanly.

      Toilet replacements hit the same issue: the floor flange sometimes needs
      a repair ring before a new Kohler or American Standard sets level and
      seals correctly. Appliance hookups follow the same pattern. A Samsung
      or LG dishwasher swap on a 1990 home often reveals a worn shutoff valve
      under the sink that needs replacing before the new unit goes in. That's
      not a surprise — it's a standard part of the job in Auburn's housing stock.

faq:
  - q: "How fast can you get to Auburn for handyman work?"
    a: |
      Auburn is a regular stop — we cover the 98001, 98002, and 98092 zip codes
      routinely. Parking is straightforward in most residential areas off Auburn
      Way and down into the Lea Hill neighborhoods. Non-urgent jobs typically
      schedule within a week. Call (206) 591-1096 or book a free on-site
      consultation at a time that works for you.

  - q: "Do you handle appliance hookups — like installing a new GE or Bosch dishwasher?"
    a: |
      Yes. Dishwasher swaps, over-the-range microwave installs, and refrigerator
      water line connections are standard jobs. GE, Bosch, Samsung, Whirlpool —
      the hookup process is similar across brands, but the condition of the
      supply valve and the drain loop setup varies by home age.

      On Auburn's 1990s production homes, plan for the shutoff valve under
      the sink to need replacement as part of the job. We confirm the electrical
      circuit, water supply, and drain connection are correct before calling it
      done. WA Licensed Contractor, 100+ projects completed since 2017.

  - q: "Do you charge by the hour, and what does a typical job cost in Auburn?"
    a: |
      TopVolk prices by the job, not the hour. A drywall patch and texture match
      is a different scope than replacing five door weatherstrips — Vladislav
      quotes each after a free on-site look. No salesperson relaying information.

      Small repairs in Auburn typically run $300–$900 depending on scope and
      whether hidden conditions — like a corroded valve or rotted subfloor under
      a toilet — add work. Deadline penalties are written into every contract.
      Call (206) 591-1096 to get on the schedule.