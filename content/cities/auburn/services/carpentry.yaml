title: "Auburn Carpentry — Built-ins, Trim & Stair Rebuilds"

intro: |
  Along A Street SE and the older blocks near Auburn's downtown core sit
  post-WWII ranchers and early 1960s split-levels where the Douglas-fir trim
  has been painted over five or six times. It shows — casing profiles are soft
  at the edges, window seats are plywood boxes built in 1978, and built-in
  bookcases were never fastened to studs correctly. TopVolk Construction LLC,
  WA Licensed Contractor, has handled carpentry across Auburn since 2017: 100+
  projects completed, trim restoration, custom built-ins, stair rebuilds, and
  interior millwork that actually matches the house.

  Auburn's split across two zip codes — 98002 and 98092 — means the carpentry
  problems aren't uniform. The downtown corridor runs older housing with original
  millwork details that need preservation work. Lea Hill runs tract construction
  from the 1970s and '80s that needs replacement rather than restoration. Same
  city, completely different scope.

localContext: |
  Lea Hill (98092) runs mostly 1970s and '80s tract construction — builder-grade
  finger-jointed pine trim, hollow-core doors, and closets designed around a
  four-inch rod and shelf. Downtown Auburn (98002) carries older housing where
  original casing profiles, plinth blocks, and rosette corners are either missing
  or buried under caulk. Both situations call for custom carpentry. Neither one
  gets solved by a box of flat casing from the home center.

  The housing near Auburn High School and along Auburn Way North tends toward
  mid-century ranchers — low ceilings, minimal trim detail, and additions built
  without a permit that left mismatched framing behind every wall. Lakeland Hills,
  further south into Auburn's newer development, runs 1990s and early 2000s
  construction where builder-grade MDF baseboard is delaminating and the
  stair systems were framed cheap. Different era, same outcome: the original
  carpentry doesn't hold up past twenty-five years.

  King County DPER covers the unincorporated pockets around Auburn. For work
  inside Auburn city limits, permits go through the City of Auburn's own building
  department. Built-in cabinetry and millwork typically don't require a permit.
  Structural stair rebuilds sometimes do, depending on scope. Vladislav will tell
  you what needs a permit before the project starts — not after.

commonProblems:
  - title: "Stair Stringer Rot and Tread Failures on Pre-1980 Auburn Homes"
    description: "Exterior stairs on Auburn homes built before 1980 frequently use solid
      lumber stringers without pressure-treated (PT) lumber at the base. Auburn's
      October-through-May rain — over 40 inches annually — wicks into the stringer
      ends and rots them from inside. Replacing treads alone fixes nothing. The
      stringer needs to come out and be rebuilt to IRC requirements, with PT material
      at every ground-contact point.

      Interior stairs on split-levels in the Lea Hill area are a separate issue:
      undersized stringers, treads that were never properly glued and nailed, and
      balustrade posts surface-mounted to a rim joist that flexes. A blue tape
      walkthrough on any pre-1980 Auburn stair system usually reveals three or four
      things that need fixing before the finish work even starts."
  - title: "Mismatched Casing Profiles After Window Replacement"
    description: "Milgard and Pella replacement windows get installed across Auburn
      constantly, but window crews rarely do finish carpentry. The result is a
      modern window sitting in a 1965 opening with no matching casing — just a
      strip of caulk and flat board that looks wrong against the existing trim.
      Cutting matching profiles and fitting them back to original plinth blocks
      requires a finish carpenter, not the window installer.

      Colonial and craftsman casing profiles from Auburn's older downtown housing
      can usually be matched on a router table or sourced through a millwork shop.
      The harder cases are mid-century profiles that don't correspond to anything
      currently stocked. Those get custom-routed from clear pine or poplar, primed,
      and fitted back to the existing wall condition."
  - title: "IKEA Cabinet Surrounds and Custom Pantry Framing"
    description: "IKEA SEKTION cabinet boxes hold up well at the price point, but they
      need custom filler panels, scribe molding, and face-frame wraps to read as
      built-in rather than freestanding. Auburn kitchens being updated around
      KitchenAid or Bosch appliances often have out-of-plumb walls where the
      scribing and blocking work takes more time than the cabinets themselves —
      and that's the part that gets skipped when you hire the wrong crew.

      Blocking matters. So does shimming the cabinet run level before scribing.
      A pantry cabinet that's racked a quarter-inch off plumb will gap at the
      top rail no matter how much caulk you run. Doing it right the first time
      takes longer on day one and saves a callback six months later."

faq:
  - q: "How fast can you get to Auburn for a carpentry estimate?"
    a: "Auburn falls within our regular King County schedule. On-site consultations
      are free — Vladislav comes out himself, not a salesperson. Call
      (206) 591-1096 to set a time. Most visits happen within the week."
  - q: "Can you match original trim profiles in older Auburn homes?"
    a: "Yes. Colonial, craftsman, and ogee casing profiles from 1940s-1960s Auburn
      homes can usually be matched or custom-routed. We've done this work on
      older housing in West Seattle, Ballard, and through the Auburn area. Bring
      a sample piece or photos and we'll match from that profile.

      For homes near Auburn's downtown core where original plinth blocks and
      backband detail are intact, the goal is matching what's there — not
      substituting a modern flat casing and calling it close enough."
  - q: "What does a stair rebuild cost in Auburn, and how long does it take?"
    a: "A single-flight stair rebuild — stringer replacement, new treads and risers,
      balustrade work — typically runs $4,000–$9,000 depending on materials and
      rail scope. Timeline is usually one to two weeks on-site. Deadline
      commitments are written into our contracts with penalty clauses. Call
      (206) 591-1096 for a free on-site consultation with Vladislav directly."
  - q: "Do built-in bookcases or window seats require a permit in Auburn?"
    a: "Built-ins are typically non-structural and don't require a permit through
      the City of Auburn's building department. The exception is if the work
      involves cutting into load-bearing walls for a pass-through or built-in
      with structural modification. Vladislav will identify that during the
      initial walk-through before any scope is written. No surprises mid-project."