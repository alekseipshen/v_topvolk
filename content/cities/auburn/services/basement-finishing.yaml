title: "Auburn Basement Finishing — Waterproof, Code-Ready, Livable Space"

intro: |
  The Green River Valley drops right through Auburn's older westside neighborhoods, and the water table in 98001 shows it every October. Walked a 1978 split-level on West Hill last fall where the homeowner had a Whirlpool dehumidifier running on a cycling timer just to keep the storage corner tolerable. That's not a finished basement — that's a wet basement with furniture in it. Real finishing starts with drainage and vapor control, not drywall. Skipping that sequence costs far more to fix later than doing it right the first time.

localContext: |
  West Hill and the Auburn Way South corridor carry homes from the 1960s through the mid-1980s — poured concrete walls, minimal sub-slab drainage, and ceiling heights that shift depending on where the mechanical equipment landed. Many of those older foundation walls also have original galvanized drain lines that need assessment before new basement plumbing rough-in begins. Lea Hill and Lakeland Hills (zip 98092) skew later, mostly 1990s to early 2000s tract construction with taller ceiling clearances and cleaner concrete pours. Those newer builds are generally easier to frame out. The older 98002 stock needs significantly more prep before framing can begin — sometimes two to three weeks of moisture mitigation and structural review before a single stud goes up.

commonProblems:
  - title: "Water Intrusion and Missing Perimeter Drainage"
    description: "Valley-floor lots along Auburn Way and in the 98001 corridor collect lateral groundwater fast after heavy rain. Paint and sealant don't solve hydrostatic pressure against a foundation wall — that takes an interior perimeter drain channel tied to a sump pump with battery backup. Install this before framing, never after. Auburn loses power in winter storms exactly when the sump is working hardest. A battery backup unit rated for at least 2,000 gallons per hour is worth the cost here. Finish waterproofing first, then think about walls."

  - title: "Egress Windows for a Legal Bedroom Count"
    description: "Auburn's building code requires a minimum 5.7 square feet net clear opening for any bedroom in a finished basement. Most split-levels and ranchers in the 98002 and 98092 zips came with narrow hopper windows that don't pass that test. Cutting an oversized window well, framing in the new egress unit, and waterproofing the well liner adds a week to the schedule — but without it, the room can't be listed as a bedroom or used as an ADU under WA HB 1337."

  - title: "Moisture Trapped Behind Framing"
    description: "Framing 2x4 walls directly against concrete is a mold factory. Auburn's wet winters mean that wall is rarely fully dry, and any wood or paper-faced drywall in contact will trap moisture. Right sequence: vapor barrier across all below-grade walls, DriCore subfloor panels over the slab, mold-resistant drywall throughout. IRC requirements call for a minimum R-15 continuous insulation value on below-grade walls in climate zone 4C — which covers Auburn — so rigid foam board behind the framed wall is code, not optional. For mechanical, a Mitsubishi mini-split keeps the basement on its own climate zone — the main HVAC almost never covers a finished basement adequately, and the ducting to get there usually isn't worth the sheet metal work."

faq:
  - q: "How fast can you get to Auburn for a basement finishing consultation?"
    a: "Auburn is a straightforward drive from Kent — same week availability for most schedules. Vladislav does the site visit himself, not a salesperson. WA Licensed Contractor, 100+ projects completed since 2017 across King and Pierce counties. Call (206) 591-1096 to set up a time."

  - q: "What materials and products do you spec for Auburn basement finishes?"
    a: "DriCore subfloor panels over the slab are standard given the water table here. Mold-resistant CertainTeed drywall throughout, Schluter Kerdi membrane on any shower or wet-wall areas. For insulation, rigid foam board continuous against the foundation wall meets the R-15 requirement for climate zone 4C before the framed wall goes up. For HVAC, Mitsubishi or Bosch mini-splits — both handle PNW humidity well and give the basement its own thermostat independent of the main system. Recessed LED lighting on dimmer-compatible circuits finishes the ceiling without eating into headroom."

  - q: "How long does a basement finish take in Auburn, and what does the permit process look like?"
    a: "Auburn runs its own permit center — separate from King County DPER. Plan review for a basement bedroom addition typically takes 4-8 weeks. Construction after permit: 6-10 weeks, with rough-in inspection mid-project and final inspection at completion. Egress window cuts add roughly a week if the schedule lines up with window delivery. Total end-to-end runs 3-5 months. Deadline milestones go into the contract — if we miss them, we pay a penalty. Call (206) 591-1096 or schedule a free on-site consultation directly with Vladislav."