title: "Auburn Basement Finishing — Built for the Green River Valley Floor"

intro: |
  Auburn sits low in the Green River Valley — and basements in the 98001 and 98002 zip codes know it. Walked a 1978 rancher off Auburn Way South last fall where a Samsung front-load unit had rusted through its feet from moisture wicking up through an unsealed slab. The homeowner wanted a home office. First conversation was about a sump pit. Finishing a basement here means dealing with the ground first.

localContext: |
  Lea Hill and the older Auburn grid east of Auburn Way carry most of the 1960s-1980s housing stock — poured concrete slabs, minimal insulation, no vapor barrier to speak of. Lakeland Hills (98092), developed through the 1990s, is better built but still sits in terrain that absorbs over 37 inches of rain annually. Both areas show the same patterns: efflorescence on block walls, condensation at slab edges, and original HVAC trunks run low enough to force the ceiling height conversation before anything else gets planned.

  The Green River itself has shaped Auburn's soil profile. Army Corps levee work stabilized the floodplain, but the clay and silty loam underneath hasn't changed. Hydrostatic pressure builds against poured walls and older CMU block foundations through every wet season — typically October through April. A basement on the valley floor near A Street SE or near the Auburn Community and Event Center behaves differently than one on the Lea Hill bench above 277th, even half a mile apart. The elevation difference affects drainage strategy and what kind of waterproofing system makes sense.

commonProblems:
  - title: "Perimeter Drain Failure and Active Seepage"
    description: "Clay soils under Auburn's valley floor compact over decades, collapsing old perimeter drain tile and pushing groundwater back toward the foundation. Interior French drain installation — channel cut at the slab perimeter, rigid perforated pipe, gravel bed, and a Zoeller sump pump in a lined pit — is the baseline fix before DriCore subfloor panels go down. Without it, finished walls absorb moisture through winter and mold establishes behind the drywall by March. In homes with block foundation walls rather than poured concrete — common in Auburn neighborhoods built before 1975 — water enters through the mortar joints, not just the slab. That changes the waterproofing spec: injected hydraulic cement at active joints before any framing goes up, not just a surface-applied RedGard coat."
  - title: "Egress Windows for Legal Bedroom Count"
    description: "King County DPER requires egress windows meeting IRC minimums: 5.7 sq ft net clear opening, sill no higher than 44 inches from finished floor. Most Lea Hill homes from the 1970s have 14-inch hopper windows that don't come close. Cutting the opening, installing a properly-sized window well with a drainage connection, and pulling the egress-specific permit adds $2,500–$4,500 to the project. That's what separates a storage room from a legal bedroom."
  - title: "Low Ceiling Height After Duct Rerouting"
    description: "Older Auburn homes run main HVAC trunks at 6'8\" or lower — below IRC's 7-foot finished ceiling minimum for habitable space. Rerouting ductwork is one path. A Mitsubishi mini-split is another, eliminating overhead runs entirely and recovering a full foot of headroom. The mechanical permit from King County DPER runs concurrently with the building permit. This coordination has to happen before drywall hang, not after someone frames the ceiling. On 1980s Auburn homes where the original furnace was replaced with a larger unit, the supply trunk sometimes drops even lower to compensate for reduced airflow — 6'4\" clearance in some cases. That makes rerouting mandatory, not optional."

faq:
  - q: "How fast can you get to Auburn for a basement consultation?"
    a: "Auburn is 35–40 minutes via SR-167 south from Seattle. Vladislav does the walk-through himself — WA Licensed Contractor, 100+ projects completed since 2023. Call (206) 591-1096 to schedule. No estimator handoff, no sales call."
  - q: "What materials do you spec for wet Auburn basements — DriCore, vapor barrier, what else?"
    a: "DriCore subfloor panels over the slab, 6-mil poly vapor barrier on walls before framing, USG Sheetrock Mold Tough on all exterior-adjacent drywall. Active mold gets remediated and documented before a stud goes up. On valley-floor Auburn lots with confirmed hydrostatic pressure, we add a dimple mat between the vapor barrier and the framing wall — that air gap lets moisture migrate to the drain channel instead of sitting against the studs. Skipping the vapor barrier to cut budget costs more to fix later — that's not an option we offer."
  - q: "What's the King County permit timeline for a basement finish in Auburn, and what does it cost?"
    a: "King County DPER plan review for a basement finish with egress, electrical, and mechanical typically runs 4–8 weeks. Full project — permit to final inspection — is 3–5 months. Budget $45,000–$90,000 for a code-compliant finish depending on scope. If the project includes an egress window cut and a sump system, those permits run in parallel where possible to compress the schedule. Missed deadline? Penalty is written into the contract. Call (206) 591-1096 for a line-item quote."