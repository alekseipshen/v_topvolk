  - q: "What bathroom fixture brands do you typically replace in Auburn homes?"
    a: "Most 1980s-90s Auburn builds came with Moen or Delta faucets and American
      Standard toilets. We replace with Kohler, Moen, or Delta depending on what
      the existing plumbing rough-in supports — moving supply lines adds cost and
      a permit line item, so we spec to the layout first."
  - q: "How long does a bathroom remodel take in Auburn, and what does the permit
      process look like?"
    a: "A straightforward tile-vanity-fixture refresh runs 3-5 weeks. A full master
      bath reconfiguration with a curbless shower conversion is 6-10 weeks,
      including City of Auburn or King County DPER plan review depending on
      jurisdiction. TopVolk is a WA Licensed Contractor — Vladislav handles
      permit submittals directly, and deadline penalties are written into the
      contract."