title: "Auburn Bathroom Remodel — Fixing What Tract Builders Left Out"

intro: |
  Les Gove Park anchors Auburn's 98002 zip, and the residential blocks
  spreading east toward Lea Hill tell a familiar story. The late-1980s and
  early-1990s tract construction that defines most of West Hill — builder-grade
  everything, including that single-handle Moen fixture still dripping at 3 a.m.
  The tile was set without a waterproofing membrane. The fan barely moves air.
  TopVolk Construction LLC has remodeled bathrooms across Auburn since 2023,
  100+ projects completed, owner-operated by Vladislav Volkov.

localContext: |
  Auburn's 98001 and 98002 zip codes hold the highest concentration of
  1980s-90s tract construction in King County — West Hill, Lakeland off Auburn
  Way South, and older pockets near downtown along B Street NW. These aren't
  Craftsman bungalows with cast-iron drain stacks. They're builder-special
  ranchers and two-stories where crawlspace vapor barrier was an afterthought
  and cement board was glued directly over OSB subfloor. PNW humidity finds
  every gap. After 30-plus years, it usually has.

commonProblems:
  - title: "No Waterproofing Membrane Behind the Tile"
    description: "Tract builders in the late 1980s routinely set tile over greenboard
      or plain drywall in shower surrounds — no Schluter Kerdi, no RedGard,
      nothing rated for wet areas. After 25-35 years of Auburn's 37-inch annual
      rainfall cycling through grout joints, that backing rots. By the time tile
      starts popping loose, the mortar bed and subfloor underneath are already
      compromised."
  - title: "Exhaust Fans That Can't Handle PNW Humidity"
    description: "Builder-grade fans from 1988-1992 are typically rated at 50 CFM —
      barely adequate for a powder room, not a master bath with a shower running
      daily. In Auburn's wet winters, undersized ventilation means mold on
      north-facing walls and ceiling corners. Replacing the unit with a Panasonic
      or Broan fan rated 80-110 CFM, vented through the roof deck rather than
      into the attic, stops the regrowth cycle."
  - title: "Walk-In Shower Conversions in Tight Tract Master Baths"
    description: "Most Auburn tract master baths pack a tub-shower combo into 35-40
      square feet — functional in 1990, cramped now. Converting to a curbless
      walk-in shower means relocating the drain, resizing blocking around the
      new rough-in, and pulling a permit from the City of Auburn building
      department. Rough-in inspection happens before any Schluter membrane or
      large-format porcelain goes down."

faq:
