title: "Auburn Door Installation — Builder-Grade Doors That Have Earned Replacement"

intro: |
  Green River Valley gets roughly 37 inches of rain a year, and the 1980s builder homes
  spread across Lakeland Hills and near the Green River Trail in 98092 show it first at
  the entry door. Steel prehung units from that era came with polystyrene cores barely
  rated R-2 and weatherstripping that compresses flat within ten years of PNW moisture
  cycling. Upgrading to a fiberglass Pella or Milgard entry door means re-flashing the
  rough opening and checking for rot before the new unit ever goes in — the framing work
  matters as much as the door itself.

localContext: |
  Auburn's housing stock runs heavily 1978–1998 — two-story colonials near downtown in
  98002, split-levels off Auburn Way North, and the newer Lakeland Hills neighborhoods
  in 98092 built into the mid-2000s. Builder-grade prehung doors from the 1980s used
  hollow steel skins over minimal insulation cores, and the clay-heavy soils of the
  Green River Valley cause enough foundation movement over 30 years to rack door frames
  slightly out of square. Threshold gaps and sticky latches are the first symptom;
  visible rot at the sill is usually the second.

commonProblems:
  - title: "Rotted rough openings hiding behind failing entry doors"
    description: |
      Threshold seal failures on 1980s steel entry doors are quiet damage — water migrates
      into the rough opening for years before it shows up inside. In 98002 homes near
      downtown Auburn, we regularly find soft OSB sheathing and compromised pressure-treated
      lumber at the sill plate. Re-framing with new PT stock, flashing the opening with
      drip cap and properly lapped housewrap, and then setting the new door unit is the
      correct sequence. Installing a new door over a wet rough opening just delays the
      problem by a few years.

  - title: "Patio slider upgrades where the existing header wasn't built for a heavier unit"
    description: |
      Original 6-foot aluminum sliders in Lakeland Hills homes were framed for single-pane
      aluminum — not a modern Milgard or Pella multi-slide system carrying tempered safety
      glass panels. Before ordering the new door, we verify whether the existing doubled-lumber
      header or LVL beam is sized for the added dead load. Skipping that check is how a
      new patio door ends up binding in the frame within a year. We size it right the first
      time.

  - title: "Smart lock deadbolts stalling because the door racks in the frame"
    description: |
      August and Schlage Encode deadbolts require a door that sits square. Auburn's clay-soil
      foundation movement over three decades leaves many 1980s entry doors slightly out of
      plumb — the strike plate shifts, and the smart lock motor stalls trying to throw a bolt
      into an off-center mortise. The door stop alignment and strike plate position have to be
      corrected before any smart lock hardware goes in. The deadbolt is the last step of the
      project, not the first.

faq:
  - q: "How fast can you get to Auburn for door installation?"
    a: |
      Auburn is 30–35 minutes from South Seattle via SR-167 south. We cover 98001, 98002,
      and 98092 regularly — straightforward run with no bridge or ferry complications.
      Call (206) 591-1096 to schedule a free on-site consultation. Vladislav comes out
      personally; there's no dispatcher, no sales staff, no callback queue.

  - q: "Do you handle both entry and interior door replacements in the same project?"
    a: |
      Yes. In Auburn remodels, entry door replacements frequently pair with interior door
      swing changes — especially in open-floor conversions where walls are moving. Milgard
      or Pella for exterior units; Masonite solid-core or paint-grade wood for interior
      swings. Casing, jambs, and finish work are part of the scope. We do not quote the
      door and then hand you a separate line item for the trim work.

  - q: "Does door replacement in Auburn require a permit, and what does it typically cost?"
    a: |
      Same-size entry door replacements — swapping a 36-inch door for a 36-inch door in the
      existing rough opening — do not require a permit through the City of Auburn's permit
      center or King County DPER. Widening an opening or structural header changes do require
      plan review, typically 3–6 weeks for residential work in Auburn. Entry door replacements
      with rough opening repairs run $1,200–$3,500 depending on the unit and framing condition.
      TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023 across King
      County. Deadline penalties are written into every contract — not a verbal promise.