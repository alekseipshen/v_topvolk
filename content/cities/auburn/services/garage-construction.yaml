title: "Auburn Garage Construction — Slabs, ADUs, and Real Permits in King County"

intro: |
  Green River Valley lots in zip 98002 sit on expansive clay soil that shifts
  measurably between dry summers and wet winters — a garage slab without
  compacted gravel sub-base and a vapor barrier underneath will show cracking
  within two or three frost cycles. Vladislav Volkov has built detached garages
  and garage-top ADUs across Auburn, from the older blocks near Les Gove Park
  to the hillside subdivisions out along Lea Hill Road. Bosch Level 2 EV
  charger rough-in is going into nearly every new garage build now — a 50A
  circuit before the slab is poured costs a fraction of retrofit wiring later.

localContext: |
  Auburn's housing splits into two clear eras. The older core around downtown
  — zip 98001 — holds post-war and 1960s homes, often with a single-car
  detached garage or no garage at all. East toward Lea Hill and the
  Auburn-Black Diamond Road corridor (zip 98092), dominant stock is 1980s-90s
  tract construction: attached two-car garages, builder-grade finishes, and
  layouts that don't accommodate today's two-SUV households plus a workshop.
  Both situations fall under City of Auburn building jurisdiction — not King
  County DPER, which only handles unincorporated parcels outside city limits.
  That distinction matters when you're timing your permit submittal.

commonProblems:
  - title: "Setback Math That Kills Designs Before Permits Are Submitted"
    description: "Auburn's standard residential zoning requires a detached structure to sit at least 5 feet from the side lot line and 20 feet from the rear property line. On the narrower in-fill lots near downtown Auburn, that leaves far less buildable envelope than most homeowners expect. A FAR calculation and a formal boundary survey before design avoids multiple rounds of plan-review comments at the City of Auburn Building Division — and the weeks of delay that come with them."
  - title: "Slab Cracking on Green River Valley Clay Soil"
    description: "Valley floor soils in zip 98001 expand during wet months and contract in summer. A 4-inch fiber-reinforced concrete slab poured over 4 inches of compacted gravel handles the seasonal movement. Skip the vapor barrier below the slab and moisture wicks up into finished flooring, subfloor framing, and drywall — especially relevant if you're finishing the space above as a habitable DADU under WA HB 1337."
  - title: "Exterior Mismatch on 1980s and 1990s Tract Homes"
    description: "Most East Hill and Lea Hill ranchers were sided in T-111 plywood or vinyl profiles that have since been discontinued or recolored. Hardie cement-board siding on the new garage sidesteps the matching problem entirely — it accepts custom paint, holds finish through Auburn's roughly 38 inches of annual rainfall better than wood, and doesn't require hunting a dead SKU. The header over the garage door opening also needs sizing: a properly spec'd LVL beam for the span prevents header sag that racks the door frame over time."

faq:
  - q: "How fast can you get to Auburn for Garage Construction?"
    a: "Auburn sits about 30-35 minutes south of Seattle via SR-167 or I-5 — Vladislav covers Auburn regularly. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017 across King and Pierce counties. Call (206) 591-1096 to schedule a free on-site walkthrough."
  - q: "Do you pre-wire for EV chargers and workshop power during the build?"
    a: "Rough-in for a 50A or 60A dedicated circuit happens before the insulation and drywall go up — that's the only cost-effective window. Works with Bosch, ChargePoint, and Grizzl-E Level 2 chargers. Adding a subpanel in the garage is also worth doing if you plan on running 240V tools or a Mitsubishi mini-split for a conditioned workshop space."
  - q: "How long does a detached garage or garage-top ADU take in Auburn?"
    a: "A straightforward detached garage runs 4-6 weeks of construction after permits clear. Add a DADU above under WA HB 1337 and you're looking at 4-6 months total — Auburn's permit review for ADU projects alone runs 8-12 weeks. Deadline penalties are written into the contract. Call (206) 591-1096 to talk through your lot and specific timeline."