title: "Auburn Electrical — 200A Upgrades & EV Charger Circuits"

intro: |
  Lea Hill's 1980s ranchers were wired for a much simpler world. No heat pumps, no induction ranges, no Level 2 chargers for a Tesla parked in the garage. Homeowners in the 98092 zip are hitting this wall constantly — the 100A panel that came with the house can't handle a ChargePoint Home Flex and a Bosch induction range without tripping the main breaker. Auburn's PSE-served neighborhoods run into this same ceiling. Electrical load has tripled for the average household since these homes were built, and the wiring hasn't kept up.

  That mismatch shows up in tripped breakers. Nuisance trips. Outlets that go dead mid-cycle. The electrical system isn't broken — it's just undersized for 2024 appliances.

localContext: |
  Auburn's residential stock spans several eras. Split-levels and ranchers along Auburn Way South in 98002 date mostly from 1965 to 1980 — the exact window when aluminum branch wiring was common. Older blocks near downtown Auburn in 98001 have Craftsman-era houses with original service panels well below today's load requirements. Some of those homes still have fuse boxes. The electrical infrastructure never got upgraded when kitchens did.

  Newer Lea Hill development in 98092 is generally fine on amperage, but still lacks dedicated circuits for EV charging or modern kitchen equipment. A GE Profile induction range pulls 40-50A on its own. Add a mini-split, a home office on a shared circuit, and a JuiceBox EV charger, and the math stops working on a standard 100A service. Auburn's permit center handles electrical permits separately from King County DPER — the jurisdiction matters for scheduling and rough-in inspections.

  Heavy rain and PNW humidity compound electrical problems in older Auburn homes. Crawlspace wiring in 1970s ranchers degrades faster without proper vapor barriers, and aluminum connections oxidize more aggressively in damp conditions.

commonProblems:
  - title: "100A Panels Maxing Out in Auburn's 1970s Split-Levels"
    description: "A 1972 rancher off Auburn Way South was never designed for a heat pump, a Bosch induction range, and a 60A EV charger circuit running simultaneously. The 100A main breaker becomes a bottleneck. A 200A service upgrade — which requires coordinating a PSE utility disconnect and a new meter base — is the only real fix. The electrical service entrance cable, weather head, and grounding electrode system all get replaced in the same job. It's a full-day pull minimum, plus utility scheduling."

  - title: "Aluminum Branch Wiring in 1965-1973 Homes Near Downtown Auburn"
    description: "Homes built during that stretch in 98001 and 98002 frequently have aluminum branch wiring throughout. Standard wire nuts oxidize over decades and create resistance at terminations — that's how you get warm outlet covers and flickering lights with no obvious cause. The NEC-compliant solution is AlumiConn connectors at every receptacle, switch, and fixture — or full copper pigtailing — before any new electrical circuits are added. Skipping this step and running new circuits into an aluminum system creates a fire risk at every termination point."

  - title: "AFCI and GFCI Requirements Triggered by Remodel Permits in Auburn"
    description: "Pull a kitchen or bathroom permit through Auburn's own permit center, and current NEC code requires AFCI breakers in bedrooms and GFCI protection at all wet locations. Older Square D or Eaton panels from the 1980s often can't accept AFCI breakers without a panel swap — worth scoping in pre-construction review before demo begins. This catches homeowners off guard mid-remodel. The electrical rough-in inspection won't pass without it, which stalls the whole project."

