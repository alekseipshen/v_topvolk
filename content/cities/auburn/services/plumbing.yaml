title: "Auburn Plumbing — Old Pipes, Pressure Problems, and Permits"

intro: |
  Downtown Auburn near Auburn Ave N — zip 98002 — still has blocks of 1940s and 50s
  housing running original galvanized supply lines. Rust at the tap, dropping pressure,
  pinhole leaks behind walls: that's iron pipe past its service life. Up on Lea Hill,
  homes from 1985 to 1993 ran polybutylene, and those gray acetal fittings are cracking
  at the joints now. Navien tankless swaps are popular in both neighborhoods, but the
  gas supply line has to be upsized to ¾" first — that step gets skipped constantly.

  Auburn plumbing problems trace back to decade and subdivision. Know the era, know
  the failure point.

localContext: |
  Zip codes 98001 and 98092 cover Auburn's newer growth corridors — West Auburn and
  the Kersey Way area — with 1990s and early-2000s tract homes that skipped galvanized
  and poly but now carry 25-year-old builder-grade fixtures ready to be replaced. The
  Green River valley location puts some Auburn zones at city water pressure above 80 psi.
  A pressure regulator valve (PRV) original from 1988 construction is often undersized
  or seized completely — most homeowners don't find out until a dishwasher supply hose
  lets go or a fixture valve cracks. Static pressure that high stresses every shutoff
  valve, angle stop, and flex connector in the house simultaneously.

  Plumbing permits in Auburn split by jurisdiction: homes inside city limits go through
  the City of Auburn building department, unincorporated parcels through King County DPER.
  That distinction changes the permit turnaround by 5-10 business days — worth knowing
  before you schedule.

commonProblems:
  - title: "Galvanized Supply Lines in Pre-1960 Downtown Auburn Homes"
    description: |
      Galvanized iron pipe corrodes from the inside out — mineral scale and rust
      accumulate inside the pipe walls over decades, throttling flow and discoloring Moen
      and Kohler fixtures. A nominal ¾" supply line is functionally running at ½" after
      60 years of buildup. Full repipe with PEX-A or copper is the fix.

      That plumbing job pulls a permit through King County DPER, covering rough-in
      inspection through final sign-off. Plan review on a full repipe typically runs
      2-3 weeks. Call (206) 591-1096 — Vladislav walks the crawlspace and gives you a
      line-item quote before any work starts.
  - title: "Polybutylene Pipe Failures on Lea Hill Subdivisions"
    description: "Homes built between 1978 and 1995 on Lea Hill used polybutylene supply lines —
      gray flexible pipe with acetal push-fit fittings that municipal chlorine degrades
      over time. Failures happen without warning, usually at a fitting joint behind drywall.
      A full-house PEX-A repipe is the only real solution: walls open, new lines run,
      King County DPER plumbing permit pulled, rough-in inspection completed before
      anything closes."
  - title: "Tankless Water Heater Conversion — Gas Supply Is the Bottleneck"
    description: "Switching from a 40-gallon tank to a Rinnai or Navien unit makes sense on
      energy cost, but the existing ½\" flex gas supply line almost never keeps up.
      Navien's NRC199 and Rinnai's RU199iN both require ¾\" minimum gas supply at the
      appliance connection. WA code also mandates seismic strapping on every water heater
      installation. The plumbing permit runs through the City of Auburn building department —
      typically a 2-3 day turnaround for a straightforward swap, longer if the gas
      supply line needs re-routing through the utility room."

