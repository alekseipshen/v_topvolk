title: "Auburn Plumbing — Pipe Replacement & Water Heater Work"

intro: |
  The streets near Les Gove Park in 98001 — the older blocks tucked off Auburn Way North — have homes from the late 1930s and early 40s still running original galvanized supply lines. Those pipes have been corroding from the inside for 80-plus years. Brown water at the tap, pressure that drops when two fixtures run at once, fixtures that look fine while the supply lines behind the wall are near collapse.

  A Moen faucet swap won't fix that. The plumbing repipe has to come first.

localContext: |
  Auburn's plumbing picture splits pretty cleanly by decade. Older downtown-adjacent streets (98001, 98002) have pre-war and mid-century homes — galvanized or early copper supply lines running through damp crawlspaces that collect moisture eight to nine months a year, accelerating corrosion on anything uninsulated. That's a structural plumbing problem, not a symptom you chase at the fixture level.

  Lea Hill and the subdivisions off Auburn-Black Diamond Road (98092) filled in between 1983 and 1995: polybutylene supply lines throughout, gray push-fit fittings now 30-plus years old and oxidizing at every union and elbow. The West Hill tracts and east Auburn subdivisions off Kersey Way tell the same story — builder-grade plumbing from that era is reaching end of life across the board. Auburn gets roughly 36 inches of rain annually, and crawlspaces that stay damp from October through May accelerate corrosion on anything not properly vapor-barriered and insulated.

commonProblems:
  - title: "Galvanized Pipe Replacement in Pre-1960 Auburn Homes"
    description: |
      Cut a section of 80-year-old galvanized open and you'll find orange corrosion buildup narrowing what used to be a 3/4-inch bore down to a pencil-width opening. Whole-house repiping to PEX-A or Type L copper resolves pressure and water quality in one project. King County DPER requires a permit for full repiping work — plan for plan review plus rough-in and final inspections before walls close back up. This is plumbing work that pays off immediately: water pressure restores, water quality clears, and the next owner doesn't inherit an emergency.

  - title: "Polybutylene Pipe Failure in Lea Hill and West Auburn Subdivisions"
    description: |
      Gray poly pipe was standard issue in King County tract construction from 1978 to 1995. Chlorine in municipal water degrades the plastic over time, oxidizing at the acetal push-fit connectors before the pipe itself fails.

      Homes in 98092 built during that window are past the point where spot patches make sense. Full plumbing replacement with PEX-B runs through a typical Auburn rancher in one to two days.

  - title: "Tankless Water Heater Conversion — Gas Line Upsize Is Not Optional"
    description: |
      Rinnai and Navien units are the most common upgrade request on Auburn kitchen and bathroom remodels. Both pull significantly more gas volume than the tank they're replacing — a Rinnai RU199iN needs 3/4-inch gas line minimum, and most Auburn homes still have 1/2-inch stub-outs at the old tank location. Skipping the upsize means fault codes and cold water inside six months. City of Auburn Building Division requires a permit, with seismic strapping of the unit per WA code.

      The plumbing rough-in and gas line work happen together in Auburn projects. Splitting them into separate visits adds cost and stretches the timeline.

