title: "Auburn Insulation — R-49 Attics and Crawl Space Encapsulation"

intro: |
  Lea Hill and West Auburn (98092) built up fast through the 1980s and 90s — ramblers
  and split-levels designed when natural gas was cheap and R-19 satisfied code. A
  Rinnai tankless heater or a Mitsubishi mini-split running hard all winter to hold
  68°F is usually fighting a building envelope that was never properly sealed. TopVolk
  Construction has completed 100+ projects across King County since 2023, including
  attic blow-ins to R-49, full crawl space encapsulation, and rim joist air sealing
  as part of whole-home remodels. Vladislav Volkov handles every consultation directly.

localContext: |
  Auburn's housing spans several eras. Downtown-adjacent blocks in zip 98001 include
  post-war homes with shallow attics and crawl spaces that haven't been touched in
  decades. Zip 98092 carries the heaviest concentration of 1985-2000 tract construction
  — split-levels along Kersey Way and ramblers near Lakeland Hills that shipped with
  R-19 or R-21 attic insulation. Under current Washington State Energy Code, the attic
  minimum is R-49. Most of these homes are running 30 to 50 percent below that number,
  and the heating bills show it.

commonProblems:
  - title: "Compressed Fiberglass Batts That No Longer Hit R-49 Code Minimums"
    description: |
      Attic batts compact over time, especially after HVAC equipment sits on top of
      them or after a re-roof compresses the deck. A batt rated R-30 at install can
      test at R-22 after 20 years of moisture cycling. The standard fix for Auburn
      split-levels and ramblers is blown-in cellulose — Owens Corning or CertainTeed
      product — netted and blown directly over the existing material to reach R-49
      without tearing out the old batt unless it is wet or molded.

  - title: "Vapor Barrier Failure Under Homes Near the Green River Corridor"
    description: |
      Auburn's lower-elevation lots in zip 98001 see persistent ground moisture from
      October through May, near the Green River and White River floodplain. Original
      4-mil poly shifts and splits over time, leaving bare earth exposed to crawl space
      air. Moisture migrates up into subfloor sheathing and bottom plates, shows up as
      elevated humidity readings inside. We install reinforced 12-mil barrier with
      fully lapped and taped seams, then add rigid foam on the stem walls to stop
      thermal bridging through the concrete foundation.

  - title: "Uninsulated Rim Joists Bleeding Heat at the Foundation Perimeter"
    description: |
      Rim joists — the framing members sitting on top of the foundation wall — are
      among the highest air-leakage points in Auburn's older construction, and almost
      always skipped in builder-grade builds. Closed-cell spray foam addresses both
      air sealing and insulation in a single application, hitting R-6 or better per
      inch. Knee walls in 1.5-story homes get Rockwool mineral wool batts: non-
      combustible, dimensionally stable, and they don't compress the way fiberglass
      does after a few seasons.

faq:
  - q: "How fast can you get to Auburn for an insulation consultation?"
    a: |
      Auburn is a straightforward run via SR-167 or I-5 — Vladislav makes regular
      site visits throughout King County with no travel surcharge. Call (206) 591-1096
      to schedule a free on-site walk-through. TopVolk is a WA Licensed Contractor.
      You will get a written line-item quote after the visit, not a range over the phone.

  - q: "Do you use blown-in cellulose or fiberglass batts for Auburn attic retrofits?"
    a: |
      Blown-in is the default for occupied attics with existing material — it fills
      around joists and penetrations without leaving voids. CertainTeed and Owens
      Corning blown-in cellulose are what we typically spec. Open bays and knee walls
      often get Rockwool batts for fire resistance and better sound performance between
      floors. The choice depends on attic geometry and whether the existing batt is
      worth keeping.

  - q: "Does insulation work in Auburn require a permit, and what does it cost?"
    a: |
      Standalone insulation — attic top-off, crawl space encapsulation, rim joist
      spray foam — generally does not require a permit under City of Auburn or King
      County DPER jurisdiction. Rolled into a larger remodel it goes on the main
      building permit. Costs typically run $2,500–$4,000 for a focused rim joist and
      vapor barrier job, up to $8,000–$14,000 for full attic blown-in plus crawl space
      on a 2,000 sq ft home. PSE offers rebates up to $1,500 for qualifying upgrades.
      Project timeline is written into the contract — with penalties if we run over
      without cause.