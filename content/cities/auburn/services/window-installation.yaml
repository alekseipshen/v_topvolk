title: "Auburn Window Installation — Replacing 1980s Builder Vinyl"

intro: |
  The subdivisions east of SR-167 in 98092 — Lea Hill, the cul-de-sacs that filled in around
  Green River College through the early 1990s — went up fast on builder budgets. Vinyl double-pane
  units were spec'd cheap and installed without sloped sill pans or drainage holes. Those windows
  are now 30-plus years old. Seals fail, frames bow outward from seasonal moisture cycling, and
  standing water collects against the rough opening until rot starts behind the siding. Vladislav
  has handled 100+ King County projects since 2023 as a WA Licensed Contractor and knows exactly
  what that era of Auburn construction left behind.

localContext: |
  Auburn's residential stock splits into two generations: 1980s-to-1990s tract builds concentrated
  in the 98092 and 98001 zip codes, and a belt of 1960s ranchers along Auburn Way South closer to
  downtown. The tract homes used aluminum-spaced IGUs with aluminum spacer bars that are long past
  seal life. The older 98001 stock sometimes still has original aluminum single-pane frames. The
  Green River Valley floor stays foggy from October through May, so north-facing assemblies on
  slab-on-grade homes collect condensation even when the seals are technically intact — masking
  early failure until water is already in the wall.

commonProblems:
  - title: "Failed IGU Seals on 1980s-90s Builder Vinyl"
    description: "Insulated glass units from that era used aluminum spacer bars packed with desiccant. Once
      the perimeter silicone seal fails — and 30 years of PNW moisture cycling will fail it — argon
      bleeds out, desiccant saturates, and fog locks between the panes permanently. Milgard's Tuscany
      series handles direct-set replacement in most standard rough openings without disturbing the
      exterior siding, interior trim casings, or existing structural header. Lead time on non-stock
      sizes runs 3-5 weeks, so plan accordingly."

  - title: "Basement Bedrooms Missing Code-Compliant Egress"
    description: "King County DPER requires a minimum 44-square-inch clear opening — sill height no greater
      than 44 inches from finished floor — for any room classified as a sleeping area. A large share
      of Auburn's 1990s ranchers finished their basements without egress windows. Installing them now
      means cutting the foundation, framing a window well, waterproofing the well perimeter with
      RedGard membrane or a dimple-mat drainage layer, and pulling a permit through Auburn's Building
      Division. Plan review typically runs 2-4 weeks for residential egress work."

  - title: "SR-167 Traffic Noise Through Standard Double-Pane Glass"
    description: "A standard ½-inch air-gap double-pane unit attenuates roughly 26-28 STC points — not
      enough for bedrooms facing the Peasley Canyon Road interchange. Pella's Lifestyle series and
      Marvin's Integrity line both offer laminated acoustic IGU options. Asymmetric glass thickness —
      one ⅛-inch pane and one 3/16-inch pane — disrupts the resonance frequency that matched-pane
      standard units vibrate at. In a quiet Auburn bedroom at 11pm, the difference is immediately
      noticeable."

faq:
  - q: "How fast can you get to Auburn for Window Installation?"
    a: "Auburn is about 30 minutes south via SR-99 or I-5 depending on traffic. We schedule
      Tuesday through Saturday, mornings preferred. Vladislav does the site visit himself — no
      commissioned closer, no middleman. Free on-site consultation with a written, line-item quote.
      Call (206) 591-1096 to set a time."

  - q: "Which window brands do you install in Auburn homes?"
    a: "Milgard, Pella, and Marvin cover most situations. Milgard's Tuscany is the practical
      choice for 1980s-90s direct-set replacements — solid quality at a price that makes sense for
      Auburn's market. Pella and Marvin make more sense where divided-light grille character matters,
      like the older Craftsman-influenced homes near downtown Auburn. We source direct and include
      installation in every quote."

  - q: "Does window replacement in Auburn require a permit, and what's the typical timeline?"
    a: "Like-for-like replacement in the same rough opening usually skips the permit requirement
      in Auburn. Cutting a new opening, installing basement egress, or modifying a structural header
      requires Auburn Building Division approval — plan review runs 2-4 weeks. After permit, a
      standard 6-to-10 window replacement on a rancher takes 2-3 days on site. Deadline for
      completion is written into every contract — if we miss it, we pay a penalty."