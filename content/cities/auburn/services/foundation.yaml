  - q: "Do you handle seismic retrofits and pier work on Auburn's older homes?"
    a: |
      Yes — mudsill bolting, shear wall plywood, and Simpson Strong-Tie hardware are
      standard scope on Craftsman-era and mid-century crawlspaces. Perma-Column precast
      posts and Quikrete structural mix for footing pours round out post-and-pier
      replacement work. TopVolk is a WA Licensed Contractor and has completed 100+
      projects since 2017 across King and Pierce counties.

  - q: "What does foundation repair cost in Auburn, and how long does the permit take?"
    a: |
      A crawlspace pier replacement on a 1,200 sf ranch typically runs $15K-$40K
      depending on access, bearing conditions, and whether seismic work is bundled in.
      King County DPER plan review for structural work runs 4-8 weeks. Once permits
      are in hand, most projects finish in 3-6 weeks on site. The quote you get is
