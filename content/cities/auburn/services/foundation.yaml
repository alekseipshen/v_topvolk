title: "Auburn Foundation Repair — Green River Valley Settling"

intro: |
  Green River alluvial soils run deep under Auburn's valley floor, and houses in 98001 and 98002
  built on that ground move differently than homes up on Lea Hill's glacial till. Post-and-pier
  crawlspace foundations in the older neighborhoods near Auburn Way South show settlement in their
  mid-life — sticky doors, sloping subfloors, floors unlevel enough that a Whirlpool washer
  vibrates hard and walks sideways across the utility room.

  That's a soil problem, not a framing problem.

  Vladislav Volkov has been doing this work across Auburn and King County since 2023 — 100+
  projects completed, WA Licensed Contractor, direct line to the person on-site. No call center,
  no salesperson quoting work they've never seen.

localContext: |
  Downtown Auburn and the Green River corridor (98001, 98002) have some of the softest residential
  soils in King County — alluvial deposits from river migration over centuries, topped by decades
  of residential fill. Homes from the 1960s through the 1980s in this zone typically sit on
  post-and-pier crawlspace foundations with Douglas-fir girders and original concrete piers that
  weren't designed for continuous saturation. October through May, the water table under these
  lots stays high. The soil stays soft. The piers keep moving — slowly, but they move.

  Lakeland Hills (98092) is a different story. Newer slab construction from the late 1990s and
  2000s means a different soil profile and different failure modes entirely. Step cracks at
  control joints, corner lifting near the garage slab — that's engineered fill compressing
  post-construction, not river alluvium.

  Lea Hill (98092 upper elevations) sits on glacial till that's comparatively stable. Still not
  immune to frost heave or poorly drained perimeter conditions — but the settling patterns look
  nothing like the valley floor below.

commonProblems:
  - title: "Post-and-Pier Settlement Under Valley-Floor Homes"
    description: |
      Concrete piers poured in the 1960s and 1970s under Auburn valley homes often didn't reach
      stable bearing soil — just compacted fill that keeps compressing under load. The result is
      uneven girder beam height, sagging mid-span floors, and interior walls cracking at the
      corners.

      Shimming existing posts buys time. It doesn't fix the problem.

      The lasting repair means adding supplemental piers down to competent material and replacing
      undersized posts with engineered PSL columns sized for the actual tributary load — calculated
      from the floor framing span and live load above, not estimated by eye. Simpson Strong-Tie
      post bases with positive attachment keep the new column from drifting laterally once the
      load transfers.

  - title: "Concrete Crack Propagation in Lakeland Hills Slabs"
    description: |
      Slab foundations in 98092 develop step cracks at corners and control joints as engineered
      fill settles post-construction. Epoxy injection with a low-viscosity product like Sikadur
      seals cracks against water intrusion. But if the crack is still moving — widening or
      shifting between wet and dry seasons — the structural cause has to be identified before
      injection.

      Patching an active crack is money spent twice.

      Monitoring crack width across a full seasonal cycle (wet winter versus dry summer) tells
      you whether differential settlement is ongoing or has stabilized. That assessment drives
      the repair scope. Jumping straight to injection on a moving crack skips the diagnostic
      step that actually determines whether the fix will hold.

  - title: "High Water Table Undermining Crawlspace Bearing Soil"
    description: |
      The Green River keeps the water table within a few feet of grade through the October–May
      rain season. Crawlspace flooding saturates soil around perimeter piers and accelerates rot
      in unprotected Douglas-fir girders. A sump pump with properly sloped drain tile — tied into
      the perimeter framing with Simpson Strong-Tie hardware — redirects subsurface water before
      it softens the bearing soil and begins shifting piers laterally.

      A vapor barrier alone won't cut it in a valley-floor crawlspace. You need active drainage.

      Six-mil poly on the ground slows moisture vapor transmission from the soil surface. It does
      nothing for standing water or hydrostatic pressure against the perimeter stem wall. Those
      are two different problems with two different solutions — and conflating them is a common
      mistake in crawlspace bids.

faq:
  - q: "How fast can you get to Auburn for foundation repair?"
    a: |
      Auburn is a straight run down Highway 167 or Auburn Way South from our South King County
      coverage area. Most sites in 98001, 98002, and 98092 are reachable same day for an initial
      site visit. Call (206) 591-1096 — Vladislav picks up directly, not a call center or
      scheduling service.

  - q: "Does foundation repair in Auburn require a building permit?"
    a: |
      Structural foundation work — adding piers, mudsill bolting, shear wall plywood installation
      — requires a permit. Auburn city parcels go through Auburn's own permit center; unincorporated
      King County parcels go through King County DPER. Vladislav handles the permit submittal as
      part of the project scope. Structural plan review in Auburn's jurisdiction typically runs
      4–8 weeks. Once permits are issued and the schedule is set, the completion deadline goes
      into the contract with penalties written in if we miss it.

  - q: "What does foundation repair in Auburn typically cost?"
    a: |
      Crawlspace re-leveling on a single-story rancher — shimming girder beams, adding PSL posts
      where needed — usually runs $8,000–$18,000 depending on pier count and crawlspace access.
      Full seismic retrofits with mudsill bolting and shear wall panels run $12,000–$30,000+
      depending on lineal footage.

      Every quote is written and line-item specific. No vague ranges, no surprise change orders.

      The on-site inspection is free. That's when Vladislav walks the crawlspace, probes for
      rot, measures girder deflection, and puts actual numbers to the scope — not after you've
      signed anything. Schedule that visit at (206) 591-1096.