title: "Auburn Foundation Repair — Green River Valley Soil & Settlement"

intro: |
  The Green River valley floor under 98001 and 98002 isn't bedrock — it's alluvial
  fill and soft glacial till deposited over centuries of flooding. When that soil
  saturates through a wet winter, it moves. Lea Hill homeowners on the 98092 clay
  bench watch it happen when their LG refrigerator door stops latching because the
  slab shifted a quarter inch. Foundation work here means drainage management, pier
  reinforcement, and seismic bracing — not a someday project. Auburn averages
  close to 37 inches of rain annually, and most of that falls October through May
  — the same window when groundwater beneath the valley floor climbs highest.
  Crawlspace foundations that went in without a vapor barrier in 1968 aren't designed
  for that load cycle. They show it.

localContext: |
  Most of Auburn's residential stock is 1960s and 1970s ranch homes and split-levels
  built fast on post-and-pier crawlspace foundations across the valley floor. Near
  downtown at 98002, a stretch of older Craftsman-era properties has been carrying
  loads on original post-and-pier systems for 80-plus years — galvanized plumbing,
  post-and-pier foundations, the works. Groundwater elevation fluctuates with the
  river, so crawlspace posts in these areas spend months in seasonal moisture with no
  vapor barrier protection. Up on Lea Hill along 124th Ave SE, the soil profile
  shifts to compacted clay over glacial outwash — different failure modes than the
  valley floor, but still active. Clay expands when saturated and shrinks in dry
  summers, cycling the foundation up and down a fraction of an inch each year until
  something gives. The Auburn Golf Course corridor and the residential blocks
  east of Auburn Way N show this pattern clearly on homes built in the mid-1970s.

commonProblems:
  - title: "Post-and-Pier Settlement on 1960s Valley-Floor Ranch Homes"
    description: |
      Valley soils in 98002 compress under load over decades. Original wood posts rot
      at grade, or the concrete piers crack and shift. The fix is installing precast
      Perma-Column concrete posts on poured footings at proper bearing depth, or
      sistering new posts to existing framing where access allows — a structural scope
      that requires a permit through King County DPER and a rough-in inspection before
      the crawlspace gets closed back up. Access in these crawlspaces is often tight —
      18 inches of clearance is common — so joist hanger placement and blocking
      installation happen in confined conditions. That changes the labor math on every
      estimate. Vladislav walks the crawlspace before quoting, not after.

  - title: "Mudsill Rot and Crawlspace Moisture on Auburn's West Side"
    description: |
      North-facing crawlspaces near the Green River corridor stay wet from October
      through May. Without vapor barrier and cross-ventilation, mudsills absorb
      moisture and rot from below. Simpson Strong-Tie joist hangers and blocking carry
      the load while a new pressure-treated mudsill is set and anchor-bolted to the
      foundation wall — typically bundled into a full seismic retrofit scope that
      includes mudsill bolting and shear wall plywood per WA seismic code. A 20-mil
      vapor barrier across the crawlspace floor, sealed at seams and lapped up the
      stem wall, is part of every mudsill scope. Skipping it means redoing the work
      in five years.

  - title: "Concrete Crack Repair and Differential Settlement on Older Slabs"
    description: |
      Diagonal cracks extending from door corners are the classic sign of differential
      settlement on valley-floor slabs. Low-viscosity Sika epoxy injection fills
      structural cracks in poured concrete and restores load transfer across the break.
      On deeper failures, polyurethane foam lift under the slab brings it back to plane
      before finish floors go in — quicker and less invasive than full slab replacement.
      Rim joist gaps and foundation wall cracks that let soil gas in get addressed in
      the same mobilization. Bundling scope saves permit cycles and keeps the project
      on a single inspection timeline with King County DPER.

