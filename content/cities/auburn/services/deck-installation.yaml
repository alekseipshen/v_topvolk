title: "Auburn Deck Installation — Ledger Rot and Real Permits"

intro: |
  Post-and-pier homes on Lea Hill and in the Lakeland Hills neighborhoods (98092) are
  replacing decks at a higher rate than anywhere else in south King County right now.
  Failed ledger flashing against unprotected rim joist is the reason — the White River
  corridor keeps ambient moisture elevated even in July, and cedar deteriorates from
  the attachment point outward before the surface boards show anything. Trex and
  TimberTech composite hold up significantly better in that environment. TopVolk
  Construction has completed 100+ projects across Auburn and the King County metro
  since 2023 — Vladislav Volkov does the site visits himself, not a salesperson.

localContext: |
  Auburn's 98002 and 98092 zip codes are dominated by 1980s-90s two-story colonials
  and ranch-style tract homes — the same building era that used ledger-to-rim-joist
  attachments with caulk instead of flashing membrane. Crawlspace clearance on the
  older split-levels near Auburn Way South is tight, which complicates ledger removal
  and sistering work. Ground-contact PT lumber rated .40 CCA minimum is required for
  any post in direct soil contact, and frost-line footings run 18 inches here — both
  enforced at rough-in inspection by the City of Auburn's permit center.

commonProblems:
  - title: "Rim Joist Rot from Ledger Flashing Failures on Tract Homes"
    description: "Most 1980s decks in Lea Hill and Auburn Meadows were attached with
      lag screws driven directly into the rim joist — no flashing, no membrane,
      just caulk that failed inside five years. Water wicks behind the ledger board
      and saturates the rim joist from the inside. By the time the surface shows
      rot, the structural connection is gone. The fix requires sistering new framing,
      installing self-adhering flashing membrane, and reattaching the ledger board
      with Simpson Strong-Tie structural screws at proper spacing."

  - title: "Post Footings Too Shallow for King County's 18-Inch Frost Line"
    description: "Older Auburn decks frequently have posts set in surface-mount hardware
      or shallow poured footings that stop at 8-10 inches — well short of the 18-inch
      frost-line depth King County enforces under IRC. Shallow footings heave over wet
      winters, which causes deck bounce and guardrail loosening. New installs require
      tube-formed concrete footings drilled to minimum 18 inches, deeper on low-lying
      lots near the Green River floodplain, using pressure-treated posts rated for
      ground contact."

  - title: "Guardrail Height and Stair Stringer Compliance at Permit Inspection"
    description: "Decks above 30 inches require 36-inch minimum guardrails — Auburn's
      plan reviewers measure this at final inspection. Equally flagged: stair stringers
      with inconsistent rise-and-run cuts, and handrails that don't meet the 1.25- to
      2-inch graspable profile the IRC requires. TimberTech railing systems come
      pre-engineered to code dimensions, which simplifies the inspection; custom-fab
      railings need dimensioned drawings submitted with the permit application."

faq:
  - q: "How fast can you get to Auburn for a deck project?"
    a: "Auburn is a straightforward run south via Highway 167 or Auburn Way — most
      Lea Hill and Lakeland Hills addresses are within 25-30 minutes of our regular
      route. We can usually schedule an on-site estimate within the week. Call
      (206) 591-1096 to set something up."

  - q: "Cedar or composite — which makes more sense for an Auburn backyard?"
    a: "Composite wins on 10-year maintenance math for most Auburn lots. Cedar looks
      good for 3-4 seasons, then needs sanding and re-sealing every couple of years
      in this climate — and shaded north-facing yards moss over even faster. Trex
      and TimberTech cost more upfront ($38-55/sq ft installed vs. $26-36 for cedar)
      but hold their structure and color without annual attention."

  - q: "Does a new deck in Auburn require a permit, and how long does it take?"
    a: "Yes — any deck attached to the house needs a building permit through the City
      of Auburn. Plan review typically runs 3-6 weeks for a standard project. The
      City requires a ledger flashing inspection before decking goes down and a final
      inspection once railings and stairs are complete. TopVolk, WA Licensed
      Contractor, handles permit submittal as part of the project — missed deadlines
      have a penalty clause written into the contract. Call (206) 591-1096."