title: "Auburn Tile Installation — Shower Waterproofing for PNW Homes"

intro: |
  Game Farm Park sits in the middle of Auburn's older residential grid — 1970s and
  1980s ranch homes in 98002 where original 4x4 ceramic tile in showers and kitchens
  has been slowly failing for decades. PNW humidity does that: grout turns black,
  shower niches leak into the framing, and kitchen backsplash mastic lets go the
  moment you pull out an aging Bosch dishwasher. Auburn gets roughly 37 inches of
  rain per year, and that moisture finds every gap in a 40-year-old tile install.
  TopVolk handles the full tile scope, from substrate tear-out to final grout seal —
  100+ projects completed since 2017 across King County, Vladislav on-site directly.

localContext: |
  Auburn's housing stock splits between downtown-adjacent homes in 98001 (built
  1960s–1980s) and newer subdivisions east toward 98092 in the Lea Hill corridor,
  mostly 1990s–2000s construction. Older downtown homes often have original poured
  concrete shower pans that have cracked, or galvanized plumbing patched around
  rather than replaced — both situations requiring full tile demo, not just regrout.
  The homes near Auburn Way South and F Street SE are a good example: ranch layouts
  with single bathrooms that haven't been touched since original construction, running
  on slab-on-grade foundations that move just enough over 40 years to crack grout
  lines and pop tiles off shower walls.
  East Auburn's newer builds are structurally sound but finished with builder-grade
  ceramic that homeowners replace once they do a real remodel. Permit pulls for tile
  work involving structural substrate changes or heated floor systems go through King
  County DPER for unincorporated parcels — plan on a few weeks for review if you're
  adding in-floor heat or reconfiguring a wet area.

commonProblems:
  - title: "Shower waterproofing failures in 1980s Auburn bathrooms"
    description: "Original shower installations in Auburn's 98002 and 98001 homes
      typically used foam backer board with basic thinset — no Schluter Kerdi membrane,
      no RedGard coating, no secondary waterproofing layer behind the tile. In a climate
      averaging 37 inches of annual rain, that's a slow leak into the framing. Moss and
      mildew start showing on the exterior wall below the shower before most homeowners
      notice anything inside. By that point the blocking and rim joist behind the shower
      wall are often already compromised. We demo the failed tile, inspect studs for rot,
      sister any damaged joists where needed, and install a proper Schluter Kerdi
      waterproofing system before any new tile goes up. The substrate has to be right
      before a single tile gets set."
  - title: "Large-format porcelain on out-of-flat subfloors"
    description: "24x48 and 32x32 porcelain tiles are popular in Auburn remodels right
      now — clean look, easy to keep grout joints tight. But Auburn's older ranch homes
      have subfloor deflection that shows up immediately under large-format tile:
      lippage, cracked tiles at grout joints within months. A DriCore subfloor
      assessment and a laser-leveled substrate with a self-leveling compound pour is
      required before any large-format installation goes down. Skipping that step costs
      double when tile cracks in year one."
  - title: "Kitchen backsplash sequencing during GE and KitchenAid appliance swaps"
    description: "Auburn kitchen remodels that include GE or KitchenAid appliance
      upgrades often involve a range hood CFM increase — which means electrical
      relocation behind the tile field. That sequencing matters. Tile needs to go in
      after rough-in is done and inspected by the AHJ, not before. MEP coordination
      with the tile schedule prevents demoing a backsplash twice because an electrician
      needed access. Recessed lighting above the range is usually part of the same rough-in
      pass — dimmer-compatible LED placement gets confirmed before drywall and tile lock
      everything in."

faq:
  - q: "How fast can you get to Auburn for tile installation?"
    a: "Auburn is a regular part of our King County schedule — consultations typically
      happen within the same week. Call (206) 591-1096 to set up a free on-site visit
      with Vladislav directly. He's the one doing the estimate and running the job, not
      a sales rep. A small bathroom tile scope typically runs 3–5 weeks from demo to
      final grout seal, assuming no hidden rot in the substrate."
  - q: "Do you install Schluter Ditra-Heat and Warmup heated floor systems?"
    a: "Yes — both Schluter Ditra-Heat and Warmup uncoupling membrane systems with
      in-floor electric heat. We rough in the thermostat location, install the heating
      element properly embedded in thinset, and coordinate the rough-in inspection
      before tile covers it. King County DPER requires that inspection sign-off before
      the floor gets tiled over. Skipping that inspection means tearing out finished
      tile for re-inspection — not a mistake we make."
  - q: "What does a full bathroom tile installation cost in Auburn?"
    a: "A complete bathroom tile scope — shower walls, curbless floor, niche, bench —
      typically runs $8K–$18K depending on tile selection and substrate conditions
      found during demo. Quote is line-item, not a vague range. If the studs behind
      the shower are rotted from years of waterproofing failure, that gets priced
      separately and honestly before work starts — no surprise change orders mid-job.
      TopVolk is a WA Licensed Contractor; deadline penalty is written into the
      contract. Call (206) 591-1096 or schedule a free consultation to get actual numbers."