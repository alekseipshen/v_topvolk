title: "Auburn Tile Installation — Kerdi Showers & Heated Floors"

intro: |
  Lea Hill's late-1990s subdivisions fill Auburn's 98092 zip code with homes where shower tile
  was set over cement board — no Schluter Kerdi, no waterproof membrane — and twenty-five years
  of PNW rain have had time to work behind that grout. Kitchen remodels in these homes tell a
  similar story: mastic-set ceramic backsplashes around original KitchenAid appliance packages
  pulling away at the countertop edge, tiles cracking at the wall-to-counter transition.

  TopVolk handles tile installation as part of complete bathroom and kitchen remodels in Auburn —
  start to finish, not patch-jobs over failing assemblies.

localContext: |
  Auburn's housing breaks into two main eras: mid-1960s ranchers concentrated near downtown and
  the Green River corridor in 98002, and late-1990s-to-early-2000s tract homes climbing Lea Hill
  in 98092. The older 98002 housing commonly sits on crawlspace foundations — vapor barrier
  failures there feed persistent moisture into everything above, including tile substrate. Lea
  Hill builds are typically slab-on-grade, which removes the crawlspace problem but creates
  another: builder-grade 12x12 ceramic that was never designed for the large-format porcelain
  most Auburn homeowners want in a full remodel.

  That 12x12 ceramic also skips the uncoupling membrane entirely — no Ditra, no Kerdi-Board
  under the floor tile. Large-format porcelain on top of an unbonded slab assembly will
  crack inside two winters.

commonProblems:
  - title: "Shower waterproofing failures in Auburn's 1990s tract homes"
    description: |
      Homes in Auburn's 98092 zip from 1990-2005 used cement board without a bonded waterproof
      membrane behind the tile assembly. PNW humidity works through micro-cracks in grout and
      migrates into wall framing — the region averages 37 inches of annual rain, and that
      moisture load is relentless. Full remediation means tile removal, Schluter Kerdi or RedGard
      membrane over new cement board, and re-tiling from scratch. Most homeowners take the open
      wall as an opportunity to upgrade to a curbless shower with niche and bench.

  - title: "Large-format porcelain cracking on deflecting subfloors"
    description: |
      24x48 and 32x32 porcelain tiles are the current standard request on Auburn bathroom
      remodels. The problem: they crack when subfloor deflection exceeds L/360. Lea Hill's
      1990s platform framing can be marginal at that tolerance. Subfloor deflection gets checked
      before any tile is ordered. Sistering floor joists or installing Schluter Ditra uncoupling
      membrane addresses the root issue — substantially cheaper than tearing out large-format
      tile and starting over eighteen months later.

  - title: "Heated floor systems and MEP coordination"
    description: |
      Schluter Ditra-Heat and Warmup electric mat systems come up on almost every Auburn bathroom
      remodel — especially in 98001 and 98002 slab-on-grade homes where tile floors are cold from
      October through April. Both systems require a specific mortar bed thickness over the heating
      cables before any tile gets set, and the thermostat rough-in has to happen before drywall
      closeout. MEP sequencing on these installs is not optional and cannot be coordinated
      after the fact.

      Ditra-Heat typically adds $800-$1,500 to a bathroom remodel budget, depending on floor
      square footage. That cost is a fraction of tearing out tile to fix a cracked heating
      cable or flooded subfloor discovered after closeout.

