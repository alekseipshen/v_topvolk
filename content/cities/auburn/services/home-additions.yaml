title: "Auburn Home Additions — Build Out Before You Move Out"

intro: |
  Ranchers and split-levels on Lea Hill's wide parcels in 98092 were sized for smaller households — 1,100 square feet was standard when those streets were platted in the 1970s. Now that same footprint holds two adults, two kids, and a home office that used to be a dining room. Space runs out fast.

  A main-floor addition with a proper KitchenAid-ready prep kitchen or a detached ADU out back adds the square footage without the disruption of moving. TopVolk Construction LLC has completed 100+ projects across King County since 2023. Vladislav Volkov handles the consultation personally — no sales rep filters the conversation.

localContext: |
  Auburn's east side — Lea Hill, Auburndale, the blocks around 98092 — sits on deeper lots than anything you'd find in Seattle proper. That gives genuine room for a DADU or a rear bump-out. Most homeowners here don't realize how much buildable area they're sitting on until someone actually measures the rear setback.

  Incorporated Auburn parcels run through the City of Auburn building department. Unincorporated pockets near the Green River Valley fall under King County DPER, which has its own plan review queue and submission requirements. The housing stock runs from 1960s single-story ranchers to 1990s tract builds, and most of it wasn't engineered with a second floor or ADU in mind. That gap between what the structure was designed for and what homeowners now need is exactly where additions come in.

commonProblems:
  - title: "Structural Load Path Review Before Any Second-Story Work"
    description: "Auburn's 1960s and 1970s ranchers were built on post-and-pier foundations with framing sized for a single story. Adding above means verifying existing footing width, beam spans, and wall stud spacing before a permit set gets drawn. In most cases, we specify an LVL beam or PSL post to redirect new loads cleanly down to the foundation.

    That structural review is what separates a project that passes rough-in inspection from one that doesn't. Skipping it means the AHJ flags the work mid-build — and reframing after drywall is already up costs far more than getting the engineering right in the drawing phase."

  - title: "ADU Setbacks and FAR Compliance Under WA HB 1337"
    description: "WA HB 1337 (2024) allows up to two ADUs per single-family lot statewide — a DADU plus an AADU if the lot can support it. On Lea Hill, many parcels can.

    The catch is rear setback distance, lot coverage limits, and the City of Auburn's height limit for accessory structures (typically 24 feet for a DADU). King County DPER plan review for ADU projects runs 6-10 weeks. Getting the site plan geometry right the first time avoids resubmittal fees and schedule slippage that turns a 5-month build into a 7-month one. A separate utility connection may also be required depending on the utility provider serving that specific parcel — worth confirming before the design gets finalized."

  - title: "Matching Exterior on 1980s Tract Homes During Additions"
    description: "Auburn's 1980s and early-90s builder homes typically have LP SmartSide or early fiber cement that's been repainted multiple times. Tying a new addition to the existing roofline requires careful detailing at the connection point — matching pitch, overhang depth, fascia profile, and ridge height so the seam disappears.

    Hardie cement-board siding is the current standard for durability in the PNW's 37-plus inches of annual rain. Cedar shake holds up on protected elevations but weathers unevenly on north-facing walls where moss and mildew accumulate between dry seasons. Done right with the correct material choices, the new section reads as original from the street."

faq:
  - q: "How fast can you get to Auburn for Home Additions?"
    a: "Auburn is roughly 30-35 minutes from the Seattle Metro core via SR-167 or Auburn Way South. On-site consultations get scheduled within the week — call (206) 591-1096 to set a time. Vladislav comes out directly. No sales rep, no handoff to someone who wasn't part of the estimate conversation."

  - q: "Do you work with KitchenAid and Bosch appliances when building kitchen additions?"
    a: "Yes. Kitchen additions in Auburn commonly spec KitchenAid or Bosch ranges and dishwashers — mid-range brands that need proper rough-in clearances, 240V circuits for induction, and range hood CFM calculations tied to the duct run length and any makeup air requirements. We coordinate that with the electrician and HVAC sub before drywall goes up, not after. Retrofitting electrical for an induction range after the walls are closed is avoidable work — getting the rough-in right during the MEP coordination phase keeps the schedule clean."

  - q: "What does a home addition in Auburn cost and how long does the full project take?"
    a: "Room additions typically run $80K-$160K depending on scope and structural complexity. ADUs range $120K-$200K+ end-to-end, with a significant portion of that timeline sitting in permit review. Plan review alone runs 6-10 weeks through the City of Auburn; total timeline from permit submission to final inspection is typically 5-8 months for a DADU. Deadline penalties are written into the contract — if we miss agreed milestones, there's a financial consequence on our side, not just a vague apology. WA Licensed Contractor. 100+ projects completed since 2023. Call (206) 591-1096 for a line-item quote."