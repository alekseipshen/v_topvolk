title: "Auburn Painting — cedar, lead compliance, interior repaints"

intro: |
  Lead paint is a real issue in Auburn's older core. The blocks around Les Gove Park and
  along Auburn Way North are dense with 1940s-60s ranchers — built before the 1978 federal
  ban — and exterior work on those homes requires EPA RRP-compliant prep before any coating
  goes on. Fresh KitchenAid kitchen installs are another common trigger: grease-stained walls
  and soot around the hood need a proper moisture-resistant finish, not just a rollover with
  flat ceiling white.

  Valley humidity is the other variable that most Auburn homeowners underestimate. Auburn sits
  below the surrounding hills in the Green River watershed — that low elevation traps moisture
  longer than eastside neighborhoods, which means paint film failure here runs 1-2 years ahead
  of what you'd see on a Sammamish or Issaquah lot at higher elevation.

localContext: |
  The 98002 zip around downtown Auburn has the highest concentration of pre-1978 housing —
  craftsman bungalows from the 1920s-40s mixed with post-war ranchers. Out on Lea Hill
  (98092), the stock shifts to 1970s-80s tract construction: cedar siding that's absorbed
  40-plus rainy winters and is typically overdue for power-wash, prime, and two-coat acrylic.

  The 98001 corridor along Auburn Way South adds another layer. It's a mix of
  commercial-adjacent residential — older single-family homes that often skipped one or two
  repaint cycles during ownership transitions. Fungal staining on north-facing walls is
  common there, and you can't just paint over it; mildewcide wash first, then prime, then
  topcoat. Auburn also falls under King County DPER for permit review on unincorporated
  parcels at the city's edge — worth confirming jurisdiction before pulling any exterior
  work permit.

commonProblems:
  - title: "EPA RRP compliance on pre-1978 homes in 98001 and 98002"
    description: "Any scraping or sanding on Auburn homes built before 1978 falls under the federal
      EPA RRP rule — that means HEPA vacuum containment, lead test swabs before work starts, and
      certified disposal of debris. Missing this step isn't just a liability risk; violations carry
      fines up to $37,500 per day. Confirm RRP certification from any contractor before work begins
      on these properties. TopVolk handles this correctly — 100+ projects completed since 2017,
      WA Licensed Contractor, owner-operated."

  - title: "Cedar siding repainting cycles on Lea Hill's 1970s-80s tract homes"
    description: "North-facing cedar shake in the 98092 area holds moisture through Auburn's Oct-May
      rain season — moss and mildew form between paint cycles, typically every 5-7 years in this
      valley climate. Correct sequence: pressure wash to strip biological growth, oil-based primer
      on any bare spots, then two-coat Sherwin-Williams Duration or Benjamin Moore Aura exterior
      acrylic. Skipping primer is the most common reason repaints fail within 2-3 years in the PNW.

      Hardie cement-board siding — more common on post-2000 construction near Auburn's east edge
      toward the 98092 boundary — has a different failure mode. The factory primer coat degrades
      at cut ends and butt joints first, letting moisture wick into the substrate. Those spots need
      spot-prime with oil-based before any topcoat goes on, or the finish blisters off in a single
      wet season. Two different materials, two different prep sequences — that's the part many
      painting quotes skip over."

  - title: "Interior repaints after kitchen and bathroom remodels"
    description: "A new range hood, Bosch dishwasher, or tile surround replacement leaves smoke-stained
      walls, grease ghosting behind appliances, and bare drywall patches that need feathered primer
      before topcoat. Moisture-resistant satin or eggshell finish is the correct sheen for kitchens
      and laundry rooms — flat paint absorbs steam and never cleans properly. Bathrooms without
      adequate ventilation need Benjamin Moore Aura Bath & Spa or equivalent mold-resistant
      formulation."

faq:
  - q: "How fast can you get to Auburn for a painting consultation?"
    a: "Auburn is about 30-35 minutes south from our central King County base via SR-167.
      We cover 98001, 98002, and 98092 regularly. Residential street parking is generally easy.
      Call (206) 591-1096 to schedule a free on-site consultation — Vladislav comes out directly,
      no sales rep."

  - q: "Do you handle cabinet repainting on IKEA or builder-grade kitchens in Auburn?"
    a: "Yes. Cabinet refinishing is a common alternative to full replacement. IKEA Sektion and
      builder-grade box construction usually has sound structure — the finish is the issue.
      Proper prep means deglosser, light sanding, and an oil-based primer before topcoat.
      Sherwin-Williams Emerald Urethane gives durable results on cabinet faces."

  - q: "What does a full exterior repaint cost and how long does it take in Auburn?"
    a: "A 1,500-2,000 sq ft rancher typically runs 5-8 days: pressure wash day, spot prime day,
      two finish coat days, plus drying time between.

      Homes in the 98002 zone where the original cedar or hardboard siding hasn't been touched
      in 15-plus years often need extra prep — additional scraping, more spot priming, sometimes
      caulk replacement at window and door trim. That adds days and cost up front but prevents
      the cycle of repainting every 3-4 years because the substrate was never properly addressed.
      Lead abatement requirements on pre-1978 siding add another line item on top. Vladislav
      gives a written line-item quote after seeing the house — not a ballpark over the phone.
      Call (206) 591-1096 to set that up. Deadline commitments are written into the contract
      with penalties if we miss them."