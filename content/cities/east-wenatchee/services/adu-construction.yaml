title: "East Wenatchee ADU Construction — DADUs Under WA HB 1337"

answer: "TopVolk Construction builds detached and attached ADUs in East Wenatchee, Washington — WA Licensed Contractor, 100+ projects since 2023."

intro: |
  Building a detached or attached accessory dwelling unit in East Wenatchee runs $140,000 to $210,000 depending on square footage and finish level, and TopVolk Construction handles design, permitting, and framing start to finish under Vladislav Volkov's direct supervision. A lot near Eastmont Community Park with a detached garage sitting empty is a common starting point — tear it down, pour a new slab, and frame a 600 to 800 square foot DADU with its own address. Another common call comes from families near the Wenatchee Valley Mall corridor who want a basement or garage conversion instead, since East Wenatchee's high-desert summers push past 95 degrees and a Mitsubishi mini-split handles both heating and cooling in a space that size without ductwork. Washington's 2024 ADU law (HB 1337) lets most single-family lots here add two units, whether that's a rental for extra income or a place for aging parents. TopVolk has completed 100+ projects since 2023, and missed deadlines come with a penalty written into the contract, not an apology.

localContext: |
  East Wenatchee's housing stock leans mid-century — plenty of 1960s and '70s ranch homes on quarter-acre-plus lots in the 98802 zip, especially along the Grant Road and Kentucky Avenue corridor, where detached garages built decades ago are prime DADU conversion candidates. Newer construction on Badger Mountain and in Grandview Heights, built since the 2000s, tends to carry tighter lot coverage limits and HOA covenants that require design review before a detached unit gets approved. Out toward Rock Island (98850), lots run bigger and some parcels fall under Douglas County's jurisdiction instead of the City of East Wenatchee, which changes which permit desk reviews your plans and how long that review takes. The region's high-desert climate — hot, dry summers and cold, snowy winters with maybe 10 inches of rain a year — means footings still need to sit below the local frost depth, but there's none of the constant moss and mildew battle contractors deal with on the west side of the Cascades. Douglas-fir framing remains the standard here, same as everywhere else in Washington.

commonProblems:
  - title: "HB 1337 Opens the Door to Two ADUs, But Sewer Capacity Doesn't Always Agree"
    description: "Washington's 2024 ADU law (HB 1337) lets most single-family lots in East Wenatchee add a DADU and an AADU, or two detached units in some cases — but the law doesn't override what's already in the ground. A lot along the Grant Road corridor built in 1968 may still run on a 4-inch sewer lateral sized for one household, and adding a second kitchen means Douglas County or the City of East Wenatchee wants proof the line can handle it before permits get approved. TopVolk pulls the as-built plumbing records first, checks setback and lot coverage against the parcel's actual FAR, and flags any upsizing needed before the estimate goes out. Skipping that step is how a $160,000 DADU project turns into a $180,000 one mid-permit. Call (206) 591-1096 for a site walk before you fall in love with a floor plan."
  - title: "DADU, Attached Conversion, or Basement Suite — Rock Island Grade Lots Push the Decision"
    description: "A flat quarter-acre in Grandview Heights makes a detached ADU straightforward — pour a slab, frame with Douglas-fir, done. Out toward Rock Island and the Rock Island Grade, though, lots slope enough that a detached unit needs a retaining wall and extra excavation, which can add $15,000 to $25,000 before framing even starts. That's when a basement conversion under the existing house, using an LVL beam to open up the space and sistered joists to carry the new load, often pencils out cheaper than digging into a hillside. Attached additions (AADUs) split the difference — shared foundation, separate entrance, less site work overall. TopVolk walks the lot with a level before quoting either option, because guessing on grade is how contractors blow both budget and timeline on hillside parcels."
  - title: "Permit Review Splits Between City of East Wenatchee and Douglas County — Know Which Desk You're In"
    description: "Inside city limits, plans go through the City of East Wenatchee's building department; step outside city boundaries toward Fairview Canyon or unincorporated pockets near Sunset Highway, and it's Douglas County's land services office reviewing the same drawings under the same IRC code, just a different queue. Plan review on a straightforward DADU typically runs 4 to 8 weeks here — faster than the west side, but rough-in and final inspections still have to pass before anyone moves in. TopVolk is a WA Licensed Contractor and handles the permit application, site plan, and utility separation paperwork directly — no separate permit expediter, no runaround. Vladislav submits the plans and sits through the plan review comments himself, since he's the one who has to build off them."
  - title: "What Actually Drives the Price on an East Wenatchee ADU"
    description: "Line-item quotes for East Wenatchee ADUs run $140,000 to $210,000+, and the swing comes down to a handful of decisions: slab-on-grade versus crawlspace with a vapor barrier, shared versus separate water and sewer connections, and whether the kitchen gets a semi-custom cabinet package or stock IKEA boxes. HVAC matters too — a Mitsubishi mini-split runs $6,000 to $9,000 installed and handles the high-desert temperature swings fine, while a Rinnai tankless water heater adds upfront cost but saves floor space in a 700-square-foot unit. Every TopVolk quote is line-item, not a range pulled from a phone call, and the contract includes a deadline penalty if the project runs long. Schedule a free on-site consultation and get actual numbers instead of a guess."
  - title: "High-Desert Sun and Winter Freeze Both Take a Toll on ADU Exteriors"
    description: "East Wenatchee summers push 95-100 degrees with almost no humidity, and that UV load fades cedar siding and checks trim faster than it would on the wetter west side — Hardie cement-board siding holds paint longer out here and is what most DADUs get finished with now. Winters swing back to snow and hard freezes, so any deck attached to the unit does better in composite decking like Trex or TimberTech than in untreated lumber, since freeze-thaw cycling opens up wood grain over a few seasons. Inside, R-49 insulation in the ceiling keeps the swing between a 100-degree July afternoon and a 10-degree January night from hammering the mini-split. Expect a repaint or recoat cycle on Hardie around year 12-15, versus 5-7 years for cedar left unfinished."

faq:
  - q: "How fast can you get to East Wenatchee for Adu Construction?"
    a: "TopVolk takes on select ADU projects in Douglas County alongside the core King, Snohomish, Pierce, and Kitsap coverage area, with Vladislav making the drive over Highway 2 for the initial site walk and permit prep. ADU work is scheduled project by project, not a same-day service call, so the first step is a phone consultation, usually followed by an on-site visit within 1-2 weeks. Site access in East Wenatchee is easy compared to tighter Seattle lots — most parcels have room for a mini-excavator without alley or street permits. Call (206) 591-1096 to get a project on the calendar."
  - q: "What does an Adu Construction project in East Wenatchee cost?"
    a: "Detached ADUs here run $140,000 to $210,000+ depending on size, foundation type, and finish level, while a basement or garage conversion can land $20,000 to $40,000 lower since it skips new foundation work entirely. Utility separation — a new water meter and sewer tap versus sharing the existing service — is one of the bigger cost swings, and it gets confirmed during the site visit, not guessed over the phone. Every quote from TopVolk is a line-item breakdown tied to the actual plan, not a ballpark range pulled from an average. Schedule a free on-site consultation for exact numbers before committing to a floor plan."
  - q: "Do I need a permit from the City of East Wenatchee or Douglas County?"
    a: "It depends on the parcel — inside city limits it's the City of East Wenatchee building department, and outside city limits, toward Fairview Canyon or Rock Island, it's Douglas County's land services office handling plan review under the IRC. Plan review for a standard DADU typically takes 4 to 8 weeks here, followed by rough-in and final inspections once framing and MEP work are done. TopVolk, a WA Licensed Contractor, prepares and submits the full permit package — site plan, utility separation details, setback verification — so Vladislav answers the plan review comments directly, not a third-party expediter. HOA design review adds time in newer developments like Grandview Heights, so that gets flagged early."
  - q: "Can I put a full kitchen in a basement or garage ADU conversion?"
    a: "Yes — a basement or garage conversion in East Wenatchee can get a full kitchen as long as it meets IRC egress requirements (a code-compliant window or door) and has mechanical and utility connections separate from the main house. Garage conversions typically need a new slab section poured to match finish floor height, plus an LVL beam if the garage door opening is being framed in. For the kitchen itself, most homeowners land on semi-custom cabinets with a quartz countertop, an induction or gas range, and a range hood sized for real CFM, not the builder-grade fan that came with the garage. A Bosch or KitchenAid appliance package fits the mid-range budget most families here are working with."
  - q: "How long does an ADU built by TopVolk last in East Wenatchee's climate?"
    a: "Framed with Douglas-fir and finished in Hardie siding, an ADU built to current IRC and energy code standards should perform 40+ years structurally, with exterior finishes needing attention on a normal cycle — recoat or repaint around year 12-15, roofing replacement around year 25-30. The high-desert freeze-thaw cycle here is milder on framing than the constant wet-dry cycling on the west side of the state, but foundations still need footings poured below frost depth. TopVolk's contract includes a deadline penalty for missed completion dates, and any workmanship issue gets addressed directly by Vladislav, not routed through a call center."
