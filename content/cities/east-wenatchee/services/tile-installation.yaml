title: "East Wenatchee Tile Installation — Shower to Kitchen Work"

answer: "TopVolk Construction installs Schluter Kerdi showers, large-format porcelain floors, and kitchen tile in East Wenatchee, WA — owner-led, 100+ jobs since 2017."

intro: |
  Lippage on a 24x48 porcelain floor almost always comes back to one thing: nobody ran a laser level across the subfloor before the thin-set went down. A homeowner off Grant Road near Eastmont Community Park called us in April after a big-box install left every seam in her kitchen floor standing proud enough to catch a mop bucket wheel — the slab had a quarter-inch dip nobody measured for. Across the bridge in Sunset Highlands, a different kind of call: a walk-in shower where the Schluter Kerdi membrane was never carried up behind the niche, and six months in, the drywall behind it was already soft. East Wenatchee sits on a mix of older ranch-style homes and newer builds up on the bench, and both types throw curveballs at tile work — old slab, new slab, doesn't matter, the substrate always has to be checked first. Vladislav Volkov runs these jobs himself, from tear-out to grout, with a phone call, not a call center: (206) 591-1096.

localContext: |
  Most of the tile calls we get in 98802 split between two housing types: ranch homes built in the 60s and 70s down near the flats along Highway 2/97, and newer construction up on the Sunset Highlands and Fountain Hills bench where lots are bigger and kitchens tend to run larger islands with more backsplash square footage. The older ranches often still have the original mortar-bed shower pans — nobody's touched them since Ford was president — and once we open the wall, the CDX subfloor underneath is usually not flat enough for today's large-format porcelain without a self-leveling pour first. Newer builds on the bench have flatter concrete slabs but tighter HOA covenants around exterior tile and entryway finishes, so we check those before ordering material. Freeze-thaw swings here are real — East Wenatchee runs colder and drier than the west side, and an unheated tile entryway can see 40-degree temperature shifts in a single January week, which is exactly what cracks grout lines at the threshold. Anything touching plumbing or electrical relocation in a wet area goes through the City of East Wenatchee building department or Douglas County if the lot's unincorporated.

commonProblems:
  - title: "Large-Format Porcelain Lippage from an Unchecked Substrate"
    description: "A 24x48 or 32x32 porcelain tile needs a substrate flat to within 1/8 inch over 10 feet — most subfloors in East Wenatchee's older ranch homes aren't close to that without work. Skip the laser level and you get lippage: tile edges standing proud of each other, which catches feet, mop heads, and eventually chips the corners. The fix is a self-leveling underlayment poured over the CDX subfloor, sometimes with DriCore board first if the joists are bouncy, then thin-set applied with a notched trowel sized for the tile format. On a typical 200 sq ft kitchen floor, leveling adds $800-$1,500 to the job but prevents a callback in a year. We check flatness with a laser before we ever open a box of tile."
  - title: "Kerdi Membrane Gaps Behind the Shower Niche"
    description: "The niche is where most shower waterproofing fails — installers run Schluter Kerdi across the main walls, then forget to fully seal the inside corners and back panel of the niche itself. Water gets behind the backer board through that gap, and within a year or two the drywall or green board behind it goes soft, even in a dry climate like East Wenatchee's, because shower steam doesn't care what the weather's doing outside. We build niches with the same cement board or foam-backed panel as the rest of the pan, wrap every seam with Kerdi-Band, and pressure-test the pan before a single tile goes up. A full walk-in shower with a curb, bench, and niche runs $9,000-$16,000 depending on tile selection and whether it's curbless."
  - title: "Backsplash Tile During a Kitchen Remodel That Touches Electrical"
    description: "Backsplash jobs sound simple until you're relocating outlets behind a new range hood or moving a switch for under-cabinet lighting — that triggers an electrical permit through the City of East Wenatchee building department, or Douglas County if you're outside city limits. GFCI-protected outlets are required within 6 feet of a sink, and inspectors check that before drywall or backer board goes back up. We coordinate the electrical rough-in, get it inspected, then close it up with cement board and tile — usually large-format porcelain or a mosaic accent behind a range with a 400+ CFM hood. TopVolk is WA Licensed Contractor and pulls the permit before work starts, not after."
  - title: "What Actually Drives Tile Installation Cost Here"
    description: "Line-item quotes for East Wenatchee tile jobs run on a few real variables: square footage, tile format, and whether waterproofing or heat is involved. A basic 12x24 ceramic floor runs $9-14/sq ft installed; step up to large-format porcelain or natural stone like travertine and material plus labor pushes $16-24/sq ft. Adding a Schluter Ditra-Heat or Warmup electric mat under a bathroom floor adds roughly $15-20/sq ft for the heated zone plus the thermostat wiring. Natural stone sealing runs $300-600 depending on square footage and stone type. Every quote from TopVolk is line-item, not a range pulled out of the air, and missed deadlines carry a penalty written into the contract."
  - title: "Grout, Sealant, and When to Replace Instead of Patch"
    description: "Cementitious grout needs resealing every 12-18 months in a shower, longer on kitchen floors that see less water — skip it and hard water minerals from the local supply etch into the grout lines and stain permanently. Natural stone like travertine or marble needs a penetrating sealer reapplied roughly once a year or it'll etch from anything acidic that touches it, including lemon juice on a kitchen floor. Tile-to-hardwood transitions need a proper expansion gap and a T-molding or reducer strip, not caulk jammed in the seam — hardwood moves seasonally and tile doesn't. A well-installed tile floor with Mapei or Laticrete grout lasts 20-plus years; regrouting a shower runs $600-1,200 versus $9,000+ to tear out and redo the whole pan."

faq:
  - q: "How fast can you get to East Wenatchee for Tile Installation?"
    a: "We're typically on-site within a week of the free consultation for scoping and measurements, whether the address is 98802 or across the river in 98801. Most projects start within 2-4 weeks after the quote is signed, depending on tile lead time from the supplier. A shower remodel usually runs 2-3 weeks start to finish; a kitchen backsplash tied to a full remodel adds time for the electrical and cabinet coordination. Call (206) 591-1096 to get on the schedule."
  - q: "What does a tiled shower cost in East Wenatchee?"
    a: "A full shower remodel with Schluter Kerdi waterproofing, a curb or curbless pan, niche, and bench runs $9,000-$16,000 depending on tile selection — large-format porcelain runs less than natural stone like marble or travertine. Heated floor add-ons with Ditra-Heat or Warmup run another $1,500-$2,500 for a standard bathroom footprint. Every quote is line-item, not a ballpark range, so you know exactly what you're paying for before demo starts. Schedule a free on-site consultation and we'll give you exact numbers, not guesses."
  - q: "Do I need a permit for tile work in East Wenatchee?"
    a: "Tile itself usually doesn't require a permit, but anything touching plumbing (moving a shower drain) or electrical (relocating outlets for a backsplash) does, through the City of East Wenatchee building department or Douglas County for unincorporated addresses. We pull those permits as part of the job and schedule the rough-in inspection before backer board goes up. TopVolk is a WA Licensed Contractor, so the paperwork is handled start to finish, not left for the homeowner to chase down."
  - q: "What's the difference between Schluter Kerdi and a traditional mortar-bed shower pan?"
    a: "A mortar-bed pan relies on a sloped bed of deck mud with a liner underneath — it works, but it's heavy and takes days to cure before tile goes on. Schluter Kerdi uses a foam-core pan and membrane that waterproofs the surface directly, so there's no waiting on a mortar cure and less risk of a hidden leak behind the wall. We use Kerdi on most showers now because it's faster and easier to inspect for gaps before tile covers it up. Either method works when installed correctly — the failures come from skipped steps, not the system itself."
  - q: "How long does a tile installation last in East Wenatchee's climate?"
    a: "A properly waterproofed shower and a well-set floor should last 20-plus years — tile itself doesn't wear out, but grout and sealant do. Freeze-thaw swings here mainly affect unheated exterior or entryway tile, where grout can crack at the threshold if it wasn't set with a flexible thin-set. Interior showers and kitchen floors aren't exposed to that swing, so the bigger factor is resealing grout and natural stone on schedule. We stand behind the installation and the waterproofing detailing, not just the tile itself."
  - q: "Do you cover areas near East Wenatchee, like Rock Island or Wenatchee?"
    a: "Yes — we take tile jobs across the valley including Rock Island, Wenatchee, and out toward Waterville, in addition to East Wenatchee itself. Scheduling windows run about 2-4 weeks out depending on the season, with spring and early summer booking up fastest. Vladislav handles the consultation and the install directly — no sales rep, no subcontracted crew you've never met. Call (206) 591-1096 to check current availability."