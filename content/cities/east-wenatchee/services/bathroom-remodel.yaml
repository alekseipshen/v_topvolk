title: "East Wenatchee Bathroom Remodel: Ranch Homes to Sage Hills"

answer: "Bathroom remodels in East Wenatchee, WA run $18K-$45K and 3-6 weeks, done by WA Licensed Contractor Vladislav Volkov — 100+ projects completed."

intro: |
  A full bathroom remodel in East Wenatchee runs $18,000 to $45,000 and takes 3 to 6 weeks from demo to final inspection, with Vladislav Volkov on site running the job instead of handing it off to a rotating sub crew. Pull up the vinyl sheet flooring in a lot of Grant Road-area bathrooms and you'll find the particleboard subfloor gone soft around the toilet flange — a problem practically baked into the ranch and split-level homes built through Eastmont between the 1960s and 1980s. Near Eastmont Community Park and out toward Sage Hills, the newer builds have a different issue: builder-grade Moen fixtures and thin fiberglass shower pans that were never meant to last twenty years. Hard water off the municipal supply doesn't help either — it chews through chrome finishes and clogs low-flow showerheads faster than most homeowners expect. Either way, the fix usually starts with tearing out the old shower pan and finding out what's underneath before pricing the rest of the job.

localContext: |
  East Wenatchee's housing stock splits pretty cleanly by decade. Down along Grant Road and through the older sections near 98802, you've got ranch homes and split-levels from the 1960s and '70s with cast-iron drain stacks, galvanized supply lines, and bathrooms that haven't been touched since Nixon was president. Across the Odabashian Bridge toward 98801, some of the older Wenatchee-side properties share the same bones. Out in Sage Hills and the newer Eastmont subdivisions, homes built after 2000 come with PEX plumbing and code-compliant ventilation, but the finishes — laminate vanity tops, builder-grade single-pane shower doors — are due for an upgrade the owners didn't plan on when they bought the house. City of East Wenatchee Building Department handles permits for anything inside city limits; if the property sits in unincorporated Douglas County toward Rock Island or Orondo, it routes through Douglas County Transportation & Land Services instead. Either way, a wet-wall relocation or a new shower drain triggers plan review under the IRC, and that adds a week or two to the schedule most homeowners don't budget for.

commonProblems:
  - title: "1960s-70s Ranch Bathrooms Stuck With Pink Tile and Failing Wax Rings"
    description: "A good chunk of the ranch homes off Grant Road and through central Eastmont still have the original 1968 pink or seafoam tile, and underneath it, a cast-iron drain stack that's rusted thin at the base. Pull the toilet and you'll usually find a wax ring that's been replaced two or three times because the flange sits too low after multiple layers of flooring. We cut back to a proper flange height, swap in a Toto or Kohler comfort-height toilet, and replace the P-trap while the floor's open — cheaper to handle now than to open the ceiling below later. Retiling with large-format porcelain over a Schluter Kerdi waterproofing membrane instead of old mortar-bed construction cuts both material cost and labor time. Budget $6,000-$9,000 for tile and plumbing work alone if the stack needs partial rerouting."
  - title: "Steam Damage in a Climate That's Supposed to Be Dry"
    description: "East Wenatchee sits on the dry side of the Cascades — this isn't Puget Sound with 150 rainy days a year — but a bathroom without real ventilation still grows mold, especially once outdoor temps drop into the 20s in January and every hot shower turns into a condensation event on the mirror, the ceiling drywall, and the top plate of the exterior wall. Builder-grade 50-CFM fans from the 1980s move almost no air and usually vent into the attic instead of outside, which just relocates the moisture problem. We swap those for a Panasonic WhisperQuiet unit sized to the room, typically 80-110 CFM, duct it straight through the roof or gable wall, and tie it to a humidity-sensing switch. Behind the tile, RedGard liquid membrane on the wet walls stops any moisture that does get through from reaching the framing. That upgrade alone runs $600-$1,200 depending on duct routing."
  - title: "Tub-to-Shower Conversions and the Permit Step Nobody Mentions"
    description: "Converting a garden tub to a curbless walk-in shower means moving the drain, and moving a drain means a permit — whether the house sits inside East Wenatchee city limits or out toward Rock Island in unincorporated Douglas County. We pull the permit, get through plan review, and schedule the rough-in inspection before any tile goes up, then the final inspection once plumbing and electrical are buttoned up. For homeowners planning to age in place, that same shower gets a bench, a recessed niche, and blocking built into the studs now for grab bars later — cheap to add during framing, expensive to retrofit after the drywall's taped and mudded. A curbless pan with a linear drain typically adds $1,500-$2,500 over a standard shower base, but it's the difference between a bathroom that works at 45 and one that still works at 75."
  - title: "What Actually Drives the Price on an East Wenatchee Bathroom Remodel"
    description: "A like-for-like bathroom refresh — same layout, new tile, new vanity, new fixtures — runs closer to $18,000-$25,000. Move the plumbing, expand the footprint into a closet, or convert a tub to a curbless shower with a linear drain, and the number climbs toward $35,000-$45,000, mostly from the added framing, PEX repiping, and extra inspection cycles. Fixture tier matters too: mid-range Moen or Delta trim runs a few hundred dollars a piece, while a quartz vanity top costs more upfront than laminate but doesn't stain or need resealing like natural stone. Every quote from TopVolk is a line-item breakdown, not a range — you see the cost of the shower pan, the tile, the vanity, and the labor separately before signing anything. The contract also has a deadline penalty clause built in, so a missed completion date costs Vladislav money, not just an apology."
  - title: "Grout Lines, Hard Water, and When to Repair vs. Replace"
    description: "Standard cement grout needs resealing every 12-18 months to keep water out, and most homeowners skip it until the grout lines are black and the subfloor underneath is already soft. Epoxy grout, which we use on new installs, doesn't absorb water the same way and skips the annual resealing step entirely. East Wenatchee's hard water leaves mineral scale on shower heads and faucet aerators fast enough that a five-year-old Delta faucet can look twice its age; a Kohler fixture with a self-cleaning nozzle head or an inline softener cuts that buildup down. If the tile is cracked in more than a couple spots, or the shower pan has any soft flex underfoot, that's a replace decision, not a repair — patching around a failing pan just delays the subfloor damage. A properly waterproofed shower with Schluter Kerdi membrane and porcelain tile should go 20-25 years before it needs anything more than grout touch-up."

faq:
  - q: "How fast can you get to East Wenatchee for Bathroom Remodel?"
    a: "East Wenatchee sits about 2.5 to 3 hours from the Seattle side of TopVolk's service area over Highway 2 through Stevens Pass, so on-site consultations and project scheduling get planned in blocks rather than same-week drop-ins. Once a project is booked, Vladislav is on site for the full job — demo, rough-in, tile, and finish work — rather than juggling multiple East Wenatchee jobs at once. Most bathroom remodels here start within 3-5 weeks of the signed contract, depending on material lead times on tile and vanities. Call (206) 591-1096 to get on the schedule and talk through timing before you commit to a date."
  - q: "What does a full bathroom remodel in East Wenatchee cost?"
    a: "A full bathroom remodel in East Wenatchee typically runs $18,000 to $45,000 depending on whether the layout changes, the tile is porcelain or natural stone, and whether plumbing needs to be rerouted. A simple refresh — new vanity, new toilet, new tile on the same footprint — sits at the lower end; a curbless shower conversion with a relocated drain and expanded footprint sits at the higher end. Every quote is a line-item breakdown covering demo, plumbing, electrical, tile, and fixtures, not a rough range. Call (206) 591-1096 or schedule a free on-site consultation for exact numbers on your bathroom."
  - q: "Do I need a permit to remodel my bathroom in East Wenatchee?"
    a: "Cosmetic work — new tile, new vanity, new fixtures on the same plumbing — usually doesn't require a permit. Moving a drain, relocating a wall, or changing the shower footprint does, and that permit routes through the City of East Wenatchee Building Department for in-city addresses or Douglas County Transportation & Land Services for properties out toward Rock Island or Orondo. Plan review typically adds 1-2 weeks before the rough-in inspection can be scheduled, and a final inspection closes out the permit once everything's buttoned up. TopVolk is a WA Licensed Contractor and handles the permit paperwork and inspection scheduling as part of the job."
  - q: "Can you convert my tub to a curbless walk-in shower?"
    a: "Yes — it's one of the more common requests in East Wenatchee's older ranch homes, especially from owners planning to stay long-term. The conversion means cutting the subfloor to drop a linear drain, waterproofing the pan and walls with Schluter Kerdi membrane, and tiling with large-format porcelain sloped correctly to the drain. We typically add a recessed niche and a built-in bench, and if you want grab bars later, we install blocking in the studs now so there's solid wood behind the tile instead of hollow drywall. Fixtures usually land in the Kohler or Moen mid-range line unless you want to spec something higher-end."
  - q: "How long will a new bathroom hold up in East Wenatchee?"
    a: "A properly waterproofed shower — Schluter Kerdi or RedGard membrane behind porcelain tile — should run 20-25 years before anything more than grout maintenance is needed. Grab bars, GFCI outlets, and exhaust fan ducting are all installed to current IRC code, which matters if you sell the house later and it goes through a home inspection. Hard water in the Wenatchee Valley is harder on chrome and nickel finishes than glass or matte black, so we'll talk through finish options that hold up better against mineral buildup during the estimate. Workmanship is covered, and TopVolk stands behind the job after final inspection."
  - q: "Do you work outside East Wenatchee too?"
    a: "TopVolk covers the greater Wenatchee Valley out of East Wenatchee, including Wenatchee, Rock Island, and Orondo, alongside the core King, Snohomish, Pierce, and Kitsap County service area. Scheduling for Douglas County projects typically runs a few weeks out since Vladislav travels over for the full job rather than splitting time across multiple sites in a week. Most homeowners book their consultation a month or two before they want demo to start, which lines up well with material lead times on tile and vanities anyway. Call (206) 591-1096 or ask about a free consultation to get a firm start date and line-item quote."