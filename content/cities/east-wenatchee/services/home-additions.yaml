title: "East Wenatchee Home Additions — DADUs & Second Stories"

answer: "DADUs, second-story additions, and in-law suites in East Wenatchee, WA run through TopVolk Construction, owner-led, with 100+ projects completed since 2023."

intro: |
  Three kinds of home additions come up again and again in East Wenatchee: a detached ADU tucked behind the house, a second story stacked on top of a single-level ranch, and an in-law suite with its own entrance and kitchenette. Vladislav Volkov builds all three, and he's the one on site pulling permits, running the LVL beam calcs, and walking the punch list at the end — not a project manager handing you off. Lots near Grant Road and the Eastmont Community Park area tend to have the room for a backyard DADU under WA HB 1337, while older ranch homes closer to Pangborn Memorial Airport usually need footing work before a second story is even possible. A Samsung range and an LG stackable washer/dryer show up in almost every in-law suite kitchen TopVolk has framed out here — mid-range, reliable, and priced for what East Wenatchee households actually spend on appliances. Every addition gets a written deadline with a penalty clause attached, so the schedule isn't just a promise on paper.

localContext: |
  East Wenatchee sits mostly in zip code 98802, with a sliver of homes near the Odabashian Bridge sharing the 98801 boundary with Wenatchee across the river. Housing stock runs from 1960s and '70s single-story ranches near Grant Road to newer split-level and two-story builds going in on the benches above Eastmont Community Park. The older ranches were framed with single 2x8 or 2x10 joists sized for one story of load — fine for the original house, not fine for a second story without a PSL post or LVL beam carrying weight down to a new footing. Permits inside city limits go through the City of East Wenatchee Community Development Department; anything in unincorporated Douglas County, including some parcels toward Rock Island, falls under Douglas County Planning and Development Services instead. The high-desert climate here matters too — dry summers, cold snaps down into the teens, and big daily temperature swings that stress siding joints and roof flashing differently than the wet west side of the Cascades.

commonProblems:
  - title: "Two ADUs Per Lot Under WA HB 1337 — What East Wenatchee Actually Allows"
    description: "State law now lets most single-family lots in East Wenatchee carry up to two ADUs — a detached DADU, an attached AADU, or one of each, depending on lot size and setback. City zoning still caps DADU height around 24 feet and requires a separate utility connection for water and sewer, sometimes a separate electrical meter too. Plan review through the City of East Wenatchee typically runs 6-10 weeks for a straightforward detached unit. TopVolk frames these with PT lumber at any ground-contact points and heats them with a Mitsubishi mini-split instead of running new ductwork back to the main house. A basic 600-800 sq ft DADU lands somewhere around $130,000-$180,000 depending on finish level."
  - title: "Second Stories on Ranches Never Built to Carry One"
    description: "Most East Wenatchee ranches from the 1960s and '70s were framed with joists and footings sized for a single story, nothing more. Adding a second floor means an engineer stamps calculations for an LVL beam or PSL post that carries the new load down to a footing that can actually take it — sometimes an existing footing needs underpinning first. Rim joist blocking and sistered joists get added where the old framing falls short of current IRC span tables. The City of East Wenatchee won't issue a framing permit without that engineering stamped and attached. Structural engineering alone typically runs $2,500-$4,000 before framing even starts, and that number surprises people every time."
  - title: "Setbacks, FAR, and the City Review Nobody Reads Ahead of Time"
    description: "Lot coverage and Floor Area Ratio limits catch people off guard, especially on the smaller lots near downtown East Wenatchee where a second story or bump-out can push a house past what the zoning code allows. Setback requirements from the property line differ between city limits and unincorporated Douglas County, so the same addition plan can get approved on one lot and rejected two streets over. Checking setbacks and FAR against the actual parcel happens before anything gets drawn, then the plan review submission goes in directly with the City of East Wenatchee Community Development Department or Douglas County Planning, whichever the site falls under. A rough-in inspection happens after framing and MEP rough-in, a final inspection closes the permit. TopVolk Construction is a WA Licensed Contractor, and Volkov handles every inspector walkthrough himself, blue tape and all."
  - title: "What a Home Addition Actually Costs in East Wenatchee"
    description: "Pricing runs roughly $130-$250 a square foot depending on scope — a simple bump-out with no new plumbing sits at the low end, a second story with a full bath and kitchenette runs toward the top. Foundation type is the biggest cost driver: a slab addition tied into an existing crawlspace costs less than one requiring new footings dug below frost depth. Finish level matters too — semi-custom cabinets and quartz counters cost more than laminate and stock cabinet boxes, and a Bosch or KitchenAid appliance package runs higher than a basic Whirlpool set. Every quote from TopVolk is line-item, not a vague range, and the contract includes a penalty if the finish date slips past what's written down."
  - title: "Siding and Roofing That Actually Hold Up to Desert Sun and Winter Swings"
    description: "East Wenatchee's climate isn't the wet west-side weather most Washington construction advice is written for — it's dry, sunny, and swings from summer heat into hard freezes fast. South and west-facing Hardie siding fades and chalks faster here than on the coast, so color-matching an addition to 10-year-old siding on a Grant Road ranch takes more than ordering the same product number. CertainTeed shingles matched to an existing roof slope hold up better against the UV exposure than cheaper three-tab options. R-49 attic insulation and a proper vapor barrier in the crawlspace matter more here too, given how far the temperature swings between January and July. A Mitsubishi mini-split zoned to the addition handles both the summer heat and winter cold without touching the existing furnace ductwork."

faq:
  - q: "How fast can you get to East Wenatchee for Home Additions?"
    a: "TopVolk is based on the west side, so a first consultation gets scheduled in advance rather than same-day — the drive over Stevens Pass on US-2 or Blewett Pass runs about 2.5-3 hours depending on the season and whether either pass is chained up. Additions are project-based work measured in weeks and months, not emergency repair calls, so site visits get batched with framing trips and inspection walkthroughs to keep travel time worth it. Free on-site consultations are available for East Wenatchee projects over $30,000, and Vladislav Volkov does the walkthrough himself instead of sending a rep. Call (206) 591-1096 to get a visit on the calendar."
  - q: "What does a home addition cost per square foot in East Wenatchee?"
    a: "Most additions run $130-$250 a square foot, with the low end covering a simple bump-out and the high end covering a second story with a full bathroom and kitchenette. Foundation work, structural engineering for a second story, and finish level (semi-custom cabinets vs stock boxes, quartz vs laminate) push the number up or down fast. A detached ADU with its own utility connection typically lands in the $130,000-$180,000 range total, not per square foot, since it includes a full kitchen and bath from scratch. TopVolk provides a written, line-item estimate after the site visit, not a ballpark range — call (206) 591-1096 to schedule one."
  - q: "Do I need a City of East Wenatchee permit or a Douglas County permit for my addition?"
    a: "It depends on the parcel — homes inside East Wenatchee city limits go through the City of East Wenatchee Community Development Department, while unincorporated parcels toward Rock Island or the Waterville Plateau fall under Douglas County Planning and Development Services. Plan review typically takes 6-10 weeks for a second story or DADU, sometimes longer if structural engineering revisions come back from the reviewer or the survey doesn't match the parcel record. TopVolk handles the permit submission, the rough-in inspection, and the final inspection directly since Vladislav Volkov is a WA Licensed Contractor. No middleman files the paperwork, and no one but Volkov shows up for the inspector walkthrough."
  - q: "Should I tie a new addition into my existing ductwork or add a mini-split?"
    a: "For most East Wenatchee additions, a dedicated Mitsubishi mini-split zone works better than extending old ductwork sized for a smaller house — the existing furnace often can't handle the extra square footage without a full HVAC load recalculation, and running new supply trunk lines through a finished attic gets expensive fast. A mini-split also avoids cutting into finished ceilings to route new supply runs. MEP coordination happens during framing so electrical, plumbing, and the mini-split line set all land before drywall goes up, not after. TopVolk walks through both options with actual equipment pricing at the estimate stage, not a generic recommendation."
  - q: "How long will a home addition hold up in East Wenatchee's climate?"
    a: "Framing, siding, and roofing on a TopVolk addition are built to current IRC standards, which handle East Wenatchee's freeze-thaw swings and dry summer heat without issue for decades. Hardie siding and CertainTeed roofing carry manufacturer warranties in the 30-50 year range, though direct south and west sun exposure will fade color faster than on a shaded elevation facing Grant Road's tree cover. Workmanship on framing, rough-in, and finish work is covered under the project contract, separate from the manufacturer material warranties on siding, roofing, and windows. Expect to repaint or recoat exposed trim every 7-10 years given the UV exposure and dry heat out here."
  - q: "Do you cover Wenatchee, Rock Island, and other towns near East Wenatchee?"
    a: "TopVolk takes on addition projects across Douglas and Chelan County alongside its core Seattle Metro service area, including Wenatchee, Rock Island, Malaga, and Waterville. Scheduling for a project this size typically runs a few weeks out from the initial estimate to the start of framing, since permits have to clear first and material orders like windows and cabinets need lead time. Vladislav Volkov handles every estimate personally, with no commissioned sales rep involved and no call center in between. Call (206) 591-1096 or ask for a free consultation to get on the schedule."