title: "East Wenatchee Garage Builds: Detached, DADU-Ready"

answer: "TopVolk Construction builds detached, attached, and DADU-ready garages in East Wenatchee, Washington — owner-led, WA Licensed Contractor, 100+ projects since 2023."

intro: |
  Detached garages, attached-to-living-space conversions, and DADU-ready garage builds under WA HB 1337 go up across East Wenatchee through TopVolk Construction, owner-led by Vladislav Volkov, with most single-bay slabs poured and framed within four to six weeks once permits clear. This isn't Seattle rain country — East Wenatchee sits in the Columbia River basin, and the ground here freezes hard enough most winters that a footing poured too shallow near Eastmont or the Grant Road corridor will heave by February. Homeowners near Pangborn Memorial Airport often want a workshop bay with a Mitsubishi mini-split and a real 240V circuit, not just an unheated box. Others near the Eastmont Community Park area are converting a two-car garage into a mother-in-law suite now that HB 1337 allows a second ADU on the same lot. Either way, the slab, the framing, and the permit path all have to match what the site and the code actually require — not a generic plan pulled off the internet.

localContext: |
  Housing stock around 98802 skews older — 1960s-70s ranch homes with single-car garages built for one sedan, not two trucks and a boat trailer, which is the norm now near Grant Road and Fairview. Newer construction closer to 98807 and the Eastmont bench tends to have three-car garages already, but those still get retrofitted for EV charging or workshop use. Permits inside city limits run through the City of East Wenatchee Building Department; anything in unincorporated Douglas County — parts of the Sunset Highway corridor and areas bordering Rock Island — go through Douglas County Land Services instead, and the plan review timeline differs between the two. Frost depth matters here in a way it doesn't on the west side of the state — footings need to sit below the local frost line or slabs and stem walls crack the first hard winter. Summers bring wildfire smoke season, which changes how we spec garage ventilation and door seals for anyone using the space as a shop.

commonProblems:
  - title: "Slab cracks from a footing poured too shallow"
    description: "East Wenatchee winters drop well below freezing more nights than people expect for this part of the state, and a 4-inch slab poured without fiber-reinforced concrete and a footing below the local frost line will crack corner to corner within a year or two. We pour a minimum 4-inch fiber-reinforced slab, set footings to code depth, and put a vapor barrier under the slab before pouring so moisture from the ground doesn't work its way up through the concrete. PT lumber goes under any sill plate touching concrete. Fixing a cracked slab after the fact means saw-cutting and repouring sections — figure $2,500-$6,000 depending on garage size, versus doing it right the first time for a fraction of that in added labor."
  - title: "DADU-above-garage builds hit structural limits fast"
    description: "Building living space over a garage under WA HB 1337 means the garage below has to carry real load, and a lot of older single-car garages near Grant Road were never framed for it. We typically spec an LVL beam over the garage door opening instead of a standard header, tie it into PSL posts at the corners, and use joist hangers and blocking to keep the floor above from bouncing. Rim joist condition matters too — if it's rotted from decades of splash-back at the slab edge, we sister new material in before framing continues. Height limit for a DADU is generally capped around 24 feet, and R-49 insulation in the ceiling keeps heating costs down once someone's actually living up there."
  - title: "Setback and FAR limits catch people off guard"
    description: "A homeowner near Fairview measures their lot, figures a 24x24 detached garage fits, then finds out setback requirements from the property line push the footprint smaller once Douglas County Land Services or the City of East Wenatchee Building Department reviews the plan. FAR — floor area ratio — also caps how much building coverage a lot can carry once you add a garage to an existing house. We run the setback and FAR math before drawing anything, submit for plan review with the correct jurisdiction (city limits vs. unincorporated county), and schedule rough-in and final inspection dates around the AHJ's actual turnaround, which usually runs 3-6 weeks for a straightforward detached garage."
  - title: "Garage builds range $45K to $130K, and size isn't the only driver"
    description: "A basic detached two-car garage with a 4-inch slab, standard framing, and an insulated overhead door runs toward the lower end of that range. Add a DADU above, a bathroom, plumbing rough-in, and siding that matches the main house — CertainTeed or Hardie board to blend with existing cedar shake or lap siding — and the number climbs fast. Utility trenching for a separate electrical and water connection to a detached structure adds cost too, especially if the run from the house is long. Every quote from TopVolk is line-item, not a range, and the contract includes a penalty clause if we miss the agreed completion date — that's written in, not a verbal promise."
  - title: "Insulated doors, weatherstripping, and EV pre-wire pay off over time"
    description: "A workshop garage without proper weatherstripping loses heat fast once temperatures drop into the 20s, and an uninsulated steel door doesn't help. We install insulated garage doors with quality weatherstripping and pair a LiftMaster opener with a Mitsubishi mini-split for anyone using the bay as a real workshop rather than just parking. EV charger pre-wire during construction — a dedicated 50A or 60A circuit run to the garage panel — costs a fraction of what it costs to open a finished wall and add it later. Expect 15-20 years out of a quality overhead door and opener with basic yearly maintenance; the slab and framing should outlast the house."

faq:
  - q: "How fast can you get to East Wenatchee for Garage Construction?"
    a: "TopVolk is based on the west side but runs regular jobs into Central Washington, so scheduling a site visit usually means a 1-2 week lead time rather than same-week. Once a project is scoped, framing crews are typically on-site within four to six weeks after permits clear, weather and material lead times depending. Access for equipment is rarely an issue on East Wenatchee lots — most have driveway or side-yard access wide enough for a mixer truck. Call (206) 591-1096 to get a site visit on the calendar and talk through your specific lot."
  - q: "What does a detached garage build in East Wenatchee cost?"
    a: "A standard detached two-car garage with a 4-inch fiber-reinforced slab, framed walls, and one insulated overhead door generally runs $45,000-$70,000 depending on finish level and utility hookups. Add a DADU above under WA HB 1337, plumbing, and matching exterior siding, and total cost can push past $130,000. Site conditions — excavation, slope, and how far utilities need to run — move the number more than square footage alone. Every job gets a free on-site estimate with line-item pricing, not a ballpark range."
  - q: "How does the permit process work for a garage in East Wenatchee?"
    a: "Projects inside city limits go through the City of East Wenatchee Building Department; anything in unincorporated Douglas County goes through Douglas County Land Services instead, and the plan review timeline can differ between the two by a couple of weeks. We prepare the site plan, structural drawings, and setback/FAR calculations before submitting, then schedule rough-in and final inspection with whichever AHJ has jurisdiction over the lot. TopVolk is a WA Licensed Contractor and handles the permit submission directly — no third party managing the paperwork. Typical plan review runs 3-8 weeks depending on scope and whether a DADU is involved."
  - q: "Can you pre-wire a garage for EV charging during construction?"
    a: "Yes — we run a dedicated 50A or 60A circuit to the garage sub-panel during framing, before drywall goes up, so the charger install later is a straightforward connection instead of an opened-up wall. Most Level 2 home chargers want a 50A circuit minimum; we size it based on the charger spec the homeowner plans to use, whether that's a Tesla wall connector or another brand. This gets coordinated with the electrician during rough-in, before the rough-in inspection is scheduled. Adding this later after drywall and finish work typically costs three to four times more than doing it during the original build."
  - q: "What's the expected lifespan on a new garage in this climate?"
    a: "A properly poured 4-inch fiber-reinforced slab on a footing below the frost line should last the life of the structure with no major cracking. Framing lumber, R-49 insulation, and a vapor barrier under the slab handle the freeze-thaw cycles Douglas County sees most winters without issue. Insulated garage doors and weatherstripping typically need replacing every 15-20 years; openers like LiftMaster units run about that long with basic maintenance. TopVolk's contract includes a penalty clause for missed deadlines, and any workmanship issue found after completion gets addressed directly with Vladislav — no call center in between."
  - q: "Do you cover areas near East Wenatchee, and how do I schedule?"
    a: "TopVolk covers East Wenatchee along with surrounding Douglas County and Chelan County areas including Wenatchee proper and Rock Island. Scheduling usually opens up within one to two weeks for an initial site visit, with construction start dates set once permits are submitted and approved. There's no sales staff involved — you're talking directly with Vladislav Volkov about the actual scope and price. Call (206) 591-1096 or schedule a free consultation to get a firm quote for your lot."