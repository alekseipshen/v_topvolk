  - q: "What does attic insulation cost in East Wenatchee?"
    a: "Blown-in attic insulation across the Wenatchee Valley typically runs $1.50 to $2.75 per square foot depending on whether it's cellulose over existing batt or a full Owens Corning fiberglass fill, with crawl space encapsulation running $4,500 to $9,000 for an average-size home. Pricing depends on square footage, attic access, whether old insulation needs removal, and if baffles or extra venting are needed. TopVolk gives a written, line-item quote after the free on-site walkthrough — no ballpark number over the phone. Call (206) 591-1096 to get a firm price before any work is scheduled."
  - q: "Does insulation work in East Wenatchee need a permit through Douglas County?"
    a: "Standalone attic or crawl space insulation usually doesn't trigger a separate Douglas County permit, but any insulation tied to a room addition, DADU, or structural remodel goes through the county building department's plan review alongside framing. That means an insulation rough-in inspection has to pass before drywall gets hung, checking R-values against the IRC and confirming vapor retarder placement. TopVolk is a WA Licensed Contractor and pulls those permits directly, coordinating inspection dates so the schedule doesn't stall waiting on paperwork. Homeowners never have to call the county themselves."
  - q: "Blown-in cellulose or fiberglass batt for an older East Wenatchee attic?"
    a: "Cellulose wins for topping off an older attic because it settles into gaps around wiring and old ductwork that a fiberglass batt can't reach, and it packs a slightly higher R-value per inch. Batt still makes sense for new construction or a gutted attic where the joist bays are open, and TopVolk uses Owens Corning or CertainTeed batt in those cases. For rim and band joists, closed-cell spray foam like Demilec beats either one because it air-seals and insulates in the same pass. The right call depends on what's already in the attic and whether it's staying exposed or getting covered."
  - q: "How long does insulation actually last in East Wenatchee's climate?"
    a: "Fiberglass batt and cellulose don't degrade chemically, but cellulose settles 15-20% over 15-20 years and batt sags once facing paper breaks down, so most East Wenatchee attics need a top-off by the 20-year mark given the summer heat and winter freeze cycles this valley sees. Closed-cell spray foam holds its R-value for 20-plus years per most manufacturers and doesn't settle at all. TopVolk backs installation labor with a written warranty, separate from the manufacturer's material warranty on products like Rockwool or Owens Corning. Moisture damage from a failed water heater or a leaking GE dishwasher line isn't covered — that's a separate repair, not a warranty claim."
