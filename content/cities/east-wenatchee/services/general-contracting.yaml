title: "East Wenatchee General Contracting — Direct From the Owner"

answer: "General contractor for East Wenatchee remodels, additions, and ADUs — owner-led by Vladislav Volkov, WA Licensed, 100+ projects completed since 2023."

intro: |
  TopVolk Construction LLC, run directly by owner Vladislav Volkov, takes on full remodels, additions, and ADU builds in East Wenatchee — not spot repairs, and never with a sales rep standing between the homeowner and the person actually holding the LVL beam calculations. That distinction matters here because East Wenatchee's mix of postwar ranch homes near the Grant Road grid and newer view lots up in Fancher Heights each come with their own structural quirks, and a remodel touching framing, electrical, plumbing, and HVAC in the same six weeks needs one person accountable for how those trades line up. A common call: a homeowner near Pangborn Memorial Airport wants a Mitsubishi mini-split added during a kitchen remodel because the original ranch never had air conditioning and the attic insulation doesn't come close to R-49. TopVolk has completed 100+ of these projects — remodels, additions, ADUs — since 2023, working project by project rather than chasing repair calls, with a WA Licensed Contractor standing and a deadline penalty built into the contract itself.

localContext: |
  Housing stock here splits pretty cleanly by elevation. Down near the river in 98802 — the older grid along Grant Road and 9th Street — most homes went up between the 1950s and 1970s, modest ranches and split-levels with galvanized plumbing and, in some cases, aluminum branch wiring from the 1965-1973 run that needs a look before any panel upgrade. Head up the hill into Fancher Heights and the newer view lots, and the builds run 1990s-2000s, better insulated but still often stuck with builder-grade fixtures and a furnace sized for a climate that's changed. South toward Rock Island (98850), TopVolk pulls permits through Douglas County Community Development for anything outside city limits; inside East Wenatchee proper, it's the City of East Wenatchee Building Department, working off the IRC like most of the state. The climate here isn't the Seattle rain problem — it's closer to high desert, summers pushing past 100°F, winters with real freeze-thaw cycles, and annual precipitation under 10 inches, which changes what holds up on a deck (composite over untreated wood) and what a crawlspace vapor barrier actually needs to handle.

commonProblems:
  - title: "Opening up a 1960s ranch without knowing what's holding the roof up"
    description: "A lot of East Wenatchee's ranch homes near the Grant Road grid have a load-bearing wall separating the kitchen from the living room, and homeowners want it gone for an open layout. Pull the wall and it's not just framing — an LVL beam or PSL post has to be sized off span tables and tied into the existing rim joist before drywall gets scheduled. Half the aluminum-wire ranches from the 1965-73 window also need an electrician to check the panel first, since rerouting circuits through a new header changes the load path. Skip that step and the rough-in inspection fails, adding 1-2 weeks. TopVolk prices this as one line item — beam, post, electrical rerouting — usually $8K-$15K depending on span, not three separate change orders."
  - title: "Framing, electrical, plumbing, and HVAC crews showing up on the wrong day"
    description: "Whole-house remodels fail on scheduling more often than on workmanship. A plumber shows up to rough-in a bathroom before the electrician has moved a junction box out of the wall cavity, or an HVAC sub runs line set for a Mitsubishi mini-split before the framer closes in the soffit it passes through. On a $30K-plus remodel with four trades touching the same square footage, MEP coordination has to happen on paper before anyone shows up with a saw. TopVolk sequences it: demo, rough framing, electrical and plumbing rough-in together, then mechanical — often a Rinnai or Navien tankless swap alongside the mini-split — then insulation and drywall. That sequencing is why a mid-size remodel runs 6-10 weeks instead of stretching to four months waiting on trades."
  - title: "Permits from the City of East Wenatchee vs. Douglas County — and getting the ADU rules right"
    description: "Anyone building inside East Wenatchee city limits pulls permits through the City of East Wenatchee Building Department; a lot just south in Rock Island or out toward Baker Flats falls under Douglas County Community Development instead, and plan review isn't identical between the two. Add a DADU under Washington's 2024 statewide ADU law (HB 1337) and there's a separate checklist — height limit around 24 feet, its own utility connection, lot coverage and setback math specific to the parcel. Fancher Heights lots on the hillside often need a setback review before a detached ADU gets sited at all. TopVolk handles the application, attends plan review, and schedules rough-in and final inspections directly with the AHJ — homeowners don't file paperwork themselves. WA Licensed Contractor status is on file with the state; permit timelines here typically run 4-8 weeks for a standard addition, longer for a full ADU."
  - title: "Bids that don't match because nobody wrote line-item pricing"
    description: "A remodel quote that says '$45,000-$65,000' isn't a bid, it's a guess, and it's how homeowners end up arguing about change orders halfway through demo. TopVolk quotes by line item — framing, electrical rough-in, plumbing, finish work, permit fees — so a kitchen remodel landing at $55K shows exactly where that number came from, and an addition or ADU running $120K-$180K breaks down the same way. Structural surprises behind 1960s plaster or in a crawlspace still happen, but they show up as a documented change order with a price, not a blown budget. The contract also includes a penalty TopVolk pays if a completion deadline gets missed — not a scheduling suggestion, a dollar figure in the agreement."
  - title: "Decking, siding, and HVAC picked for the wrong climate"
    description: "East Wenatchee sun is harder on materials than people expect — untreated wood decking checks and grays within a few summers under that much UV, which is why composite decking (Trex, TimberTech) shows up in most of TopVolk's addition and remodel bids instead of cedar. Hardie fiber-cement siding holds up better than wood lap siding through the freeze-thaw cycle and the occasional wildfire-smoke season, and it doesn't need repainting every 5 years like the original siding on a lot of Fancher Heights homes from the 1990s. Inside, appliance upgrades during a kitchen remodel usually land mid-range — KitchenAid, Bosch, GE — matching the roughly $61K median household income here rather than jumping straight to Sub-Zero and Wolf. A deck or siding job done right should run 20-25 years before it needs more than routine maintenance."

faq:
  - q: "How fast can you get to East Wenatchee for General Contracting?"
    a: "TopVolk is based in Seattle, so this isn't a same-day repair call — East Wenatchee runs about 3 to 3.5 hours away via US-2 over Stevens Pass or US-97 through Blewett Pass, depending on season and snow level. Because TopVolk only takes on project-based work here — remodels, additions, ADUs starting around $30K — site visits get batched: one trip for the initial walkthrough and quote, one for the blue tape walkthrough at rough-in, one for the final inspection and punch list, with photo updates in between. Most East Wenatchee projects get an on-site consultation scheduled within 1-2 weeks of the first call. Call (206) 591-1096 to get a project on the calendar."
  - q: "What does a full kitchen or whole-house remodel in East Wenatchee cost?"
    a: "A full kitchen remodel in East Wenatchee typically runs $35K-$70K depending on layout changes, cabinet grade (semi-custom vs. IKEA cabinets), and whether a load-bearing wall comes out. Whole-house renovations touching framing, electrical, plumbing, and HVAC together usually land between $100K and $200K+, and additions or DADUs follow a similar range depending on square footage and utility hookups. What moves the number most is structural work hidden behind drywall — an undersized rim joist or old wiring nobody budgeted for. TopVolk provides a free on-site estimate with line-item pricing before any contract gets signed, not a ballpark range over the phone."
  - q: "Do I need a permit from the City of East Wenatchee or Douglas County for my remodel?"
    a: "Most remodels and additions inside East Wenatchee city limits need a permit through the City of East Wenatchee Building Department, reviewed against the IRC; projects just outside city limits, toward Rock Island or Baker Flats, go through Douglas County Community Development instead. A kitchen or bath remodel that doesn't touch structure sometimes qualifies for a simpler over-the-counter permit, but anything moving a wall, adding square footage, or building a DADU needs full plan review, typically 4-8 weeks before a permit issues. TopVolk prepares the application, submits plans, and schedules rough-in and final inspections directly — homeowners aren't the ones calling the permit desk. WA Licensed Contractor standing is on file for every application."
  - q: "Can you build a DADU or add a mother-in-law unit under Washington's new ADU law?"
    a: "Yes — Washington's 2024 statewide ADU law (HB 1337) allows up to two accessory units on most single-family lots in East Wenatchee, including a Detached ADU (DADU) behind an existing house or an Attached ADU (AADU) built onto it. DADUs typically max out around 24 feet in height, need a separate utility connection or a sized-up service from the main house, and have to clear the parcel's setback and lot coverage limits — something that takes real thought on the sloped Fancher Heights lots. TopVolk can work from a pre-approved plan set where the lot allows it, which shortens plan review, or design one from scratch. A full DADU project, permit to move-in, generally runs 4-7 months end to end."
  - q: "What kind of warranty do you offer, and how do materials hold up in East Wenatchee's climate?"
    a: "TopVolk backs workmanship on every project, and material warranties pass through from the manufacturer — Hardie siding, CertainTeed roofing, Trex or TimberTech decking, and fixtures from brands like Moen and Kohler all carry their own coverage on top of that. East Wenatchee's climate is tougher on materials than people expect: summer heat past 100°F fades and checks untreated wood, while winter freeze-thaw cycles stress anything not properly flashed or drained. Composite decking and fiber-cement siding get specified on most TopVolk projects here for exactly that reason. Expect 20+ years out of siding and decking done right, versus resurfacing every 7-10 years with cheaper materials."
  - q: "Do you also work in Wenatchee, Rock Island, or Waterville?"
    a: "TopVolk's primary service area is Seattle Metro — King, Snohomish, Pierce, and Kitsap counties — but the company takes on select larger projects across the Wenatchee Valley, including East Wenatchee, Wenatchee, Rock Island, and Waterville, when the scope justifies the drive: additions, ADUs, and full remodels rather than small repairs. Scheduling on this side of the mountains usually books 2-4 weeks out depending on season, since mountain pass travel gets planned around weather. Owner Vladislav Volkov handles the walkthroughs personally rather than sending a rep. Call (206) 591-1096 or ask about scheduling a free consultation to see if your project fits the calendar."