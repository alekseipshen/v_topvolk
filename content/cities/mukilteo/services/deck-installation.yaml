title: "Mukilteo Deck Installation — Puget Sound Lots, PDS Permits"

intro: |
  The view lots above the Mukilteo Ferry Terminal sit in full southwest exposure — Puget
  Sound weather hits them directly from October through May. That means 37+ inches of
  annual rain working into deck framing without much drying time between storms. Cedar
  ages fast under those conditions without consistent sealing. TimberTech and Trex
  composite boards handle sustained moisture differently, and for 98275 lots that face
  the water, the material decision is a 20-year maintenance calculation, not just
  aesthetics.

localContext: |
  Residential construction in 98275 breaks into two main generations: 1960s–70s
  ranchers and split-levels near the waterfront and downtown Mukilteo, and the Harbour
  Pointe planned community to the north, where 1980s–90s homes sit on graded hillside
  lots. The older homes near the ferry terminal area commonly have original ledger
  attachments that predate modern flashing requirements. Rim joist condition varies
  considerably on pre-1980 construction — finding rot behind an old ledger is a regular
  finding on redecking projects here.

commonProblems:
  - title: "Cedar Decking Grays and Splits Fast in Southwest Puget Sound Exposure"
    description: >-
      Cedar checks and loses surface integrity within 3–5 years on southwest-facing lots
      in Mukilteo without annual treatment. Moss colonizes horizontal boards that stay
      damp between storms — a standard condition here October through May. Trex Transcend
      and TimberTech Azek use four-sided capping that blocks moisture absorption.
      Upfront cost runs 30–40% higher on materials, but there is no refinishing cycle.
  - title: "Ledger Board Rot on Pre-1980 Homes Near Downtown and the Ferry Terminal"
    description: >-
      Deck ledger attachment without proper flashing was standard practice through the
      1970s. Water tracks behind the ledger board and sits against the rim joist —
      sometimes for years before anyone notices. Redecking projects on older Mukilteo
      homes regularly uncover rotted rim joist that needs sistering before a new ledger
      attaches to sound framing. Simpson Strong-Tie hardware cannot compensate for
      compromised structure behind it.
  - title: "Post Footings and Frost Line Under Snohomish County PDS Requirements"
    description: >-
      Snohomish County PDS requires deck post footings to extend 12–18 inches to frost
      line. Ground-contact PT lumber is required for any post within 6 inches of soil —
      above-grade rated PT will not pass the footing inspection. Inspections happen
      before concrete is poured, and scheduling through Snohomish County PDS runs 5–10
      business days out. Missing that window pushes your project timeline by weeks, not
      days.

