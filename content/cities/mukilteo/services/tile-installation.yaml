localContext: |
  Most of Mukilteo sits in zip code 98275, though a narrow strip of properties along the northeastern edge toward Everett occasionally falls under 98204 for mailing and sometimes permit jurisdiction. The housing mix creates two distinct tile job profiles. Harbour Pointe — the 1990s planned development north of Mukilteo Speedway — runs largely on slab-on-grade construction, which simplifies heated floor installs considerably since there's no wood subfloor assembly between the heating cable and the concrete. The Lighthouse District and blocks near Mukilteo State Park are a different story: post-and-pier or raised-wood foundations from the 1960s and 70s that need a deflection check before large-format tile goes down. IRC table R301.7 limits floor deflection to L/360 under live load, and floor systems of that age rarely meet that spec without sister joisting first. Permit jurisdiction for tile work inside Mukilteo city limits runs through the City of Mukilteo Community Development department; parcels in unincorporated Snohomish County near the city border file through Snohomish County PDS. Bathroom remodels that include a heated floor circuit or plumbing rough-in changes require a permit regardless of how the tile scope is described.

commonProblems:
  - title: "Shower Waterproofing Failures — Why Cement Board Alone Doesn't Cut It in Mukilteo"
    description: |
      Mukilteo's waterfront location keeps ambient moisture elevated even in summer, which accelerates what happens when a tiled shower relies on cement board as the sole moisture barrier. Cement board is a substrate — not a waterproofing membrane. The actual barrier needs to be Schluter Kerdi sheet membrane or a fluid-applied product like RedGard, properly lapped at seams and corners, and bonded at the drain flange. On a recent Harbour Pointe bathroom rebuild, the original installer had used standard drywall behind wainscoting tile — completely saturated in under eight years, with rot in the framing behind it. Kerdi membrane on a standard 3x5-foot shower adds roughly $600-900 in material and labor but prevents the $8,000-12,000 remediation that follows a failed conventional build. Every TopVolk shower gets a flood test — 24-hour standing water in the pan — before a single tile goes down.

  - title: "Large-Format Porcelain on Uneven Subfloors — Lippage and How to Prevent It"
    description: |
      Thirty-two-by-thirty-two-inch porcelain panels are popular in Mukilteo bathroom remodels right now, and with good reason — fewer grout joints, cleaner look. But tolerance is the issue. Large-format tile requires a substrate flat to 1/8 inch over 10 feet per TCNA F-125 guidelines, and most existing subfloors in 1990s Harbour Pointe homes aren't within that spec without prep work. The fix is self-leveling underlayment — Mapei Planipatch or a comparable product — poured and screeded before tile goes down. On wood subfloor systems, Schluter Ditra uncoupling membrane also handles minor seasonal movement between the tile and framing, reducing cracked grout from wood expansion and contraction. Laser-leveling and underlayment typically adds $400-700 to the scope, but it's the only thing that prevents lippage — visible tile-edge variation underfoot — and early grout failure.

  - title: "Heated Tile Floor Installation — What Goes Wrong Under the Porcelain"
    description: |
      Electric radiant heat under bathroom tile is a clean upgrade — if the heating element installs correctly before tile goes down, because there's no fixing it afterward without full demo. Schluter Ditra-Heat combines the uncoupling membrane with integrated cable channels, which simplifies layout considerably versus embedding a Warmup mat in thinset and hoping nothing shifts during the pour. Cable spacing matters (typically 3-inch centers for efficient coverage), and the thermostat wiring needs a dedicated 20-amp circuit from the panel — which requires an electrical rough-in inspection before tile covers the work. In older Lighthouse District homes with undersized panels, that circuit addition can mean a sub-panel upgrade; budget $1,200-2,000 additional when that comes up. Full heated floor install in a standard 60-square-foot bathroom, including Ditra-Heat membrane, cable, thermostat, and tile labor, runs $2,800-4,500 depending on tile selection and electrical scope.

  - title: "Tile Installation Costs in Mukilteo — What Drives the Price Up or Down"
    description: |
      Standard bathroom tile installation in Mukilteo — walls and floor in a 5x8 space with a 36-inch tiled shower — typically runs $5,500-9,000 for materials and labor when the substrate is in decent shape. Add Schluter Kerdi waterproofing, a framed shower niche, and large-format 24x48 porcelain, and the range shifts to $8,000-14,000. Kitchen backsplash tile behind a range, including electrical outlet relocation, runs $1,800-4,200. Natural stone — marble, travertine — adds material cost and requires penetrating sealer (Miracle 511 or StoneTech BulletProof) at installation plus annual resealing. Heated floors are a separate line item at $2,800-4,500 installed. TopVolk provides written quotes after a free on-site consultation — Vladislav measures the actual scope and breaks out demo, substrate prep, waterproofing, and tile work as separate line items, not a blended number. Call (206) 591-1096 to schedule.

  - title: "Tile-to-Hardwood Transitions and Stone Sealing — Long-Term Maintenance in PNW Conditions"
    description: |
      Tile and grout installed correctly last 25-30 years, but the transition zones fail first — where tile meets hardwood flooring, or where an unglazed travertine entry floor absorbs six months of wet-weather foot traffic near Mukilteo's famously soggy fall season. Tile-to-hardwood transitions need an expansion gap (minimum 1/8 inch) filled with flexible silicone sealant rather than grout; grout at that joint cracks as the wood expands seasonally. Natural stone near Japanese Gulch — where north-facing surfaces collect moss and mildew particulates year-round — needs a penetrating sealer at installation and annual re-application to stay ahead of moisture absorption. Grout resealing in wet showers makes sense every 3-5 years. Cracked grout in a contained area is often patchable with an oscillating tool, typically $300-800 for a standard shower; widespread cracking across floor tile usually signals substrate movement, not a surface repair.

