  - q: "What's the difference between Schluter Kerdi and RedGard for shower waterproofing?"
    a: |
      Kerdi is a sheet membrane — polyethylene with fleece bonding on both faces — set into thinset directly on the framing or cement board substrate, with seams overlapped and pre-formed corners at transitions. RedGard is a fluid-applied membrane painted or rolled onto the substrate in two coats, curing to a continuous pink barrier. Both systems work. Kerdi is faster in standard rectangular showers because the membrane and bond coat go down in the same step. RedGard suits complex geometry better — custom curbs, unusual angles, off-center drains — since it conforms without cutting and lapping sheet material. For shower niches specifically, Schluter prefab niche inserts keep the waterproofing plane continuous behind the niche tile without depending on a fluid seam inside a permanently damp cavity.

  - q: "How long does tile installation last in Mukilteo, and what warranty do you provide?"
    a: |
      Properly installed porcelain tile on a correctly prepped substrate lasts 25-30 years without replacement — it's one of the most durable finishes a bathroom or kitchen can have. Grout in a wet shower needs resealing every 3-5 years; the tile itself rarely needs intervention. Schluter Kerdi waterproofing membranes carry a manufacturer limited lifetime warranty when installed to Schluter's published specs. TopVolk provides a 2-year workmanship warranty on all tile installation — grout cracking or tile lifting within that window due to installation defects gets repaired at no charge. Project deadlines are written into the contract with a penalty clause for missed completion dates. PNW humidity cycling and occasional winter freeze-thaw conditions are factored into how expansion joints and perimeter sealant lines get detailed, which is where most long-term tile failures begin.

