title: "Mukilteo General Contracting — Permits, Trades, Owner-Led Work"

intro: |
  The split-levels and 1960s ranchers tucked below the Mukilteo Lighthouse bluff in 98275 were built before modern energy codes, and they show it — galvanized supply lines, undersized panels, and framing that surprises demo crews on day one. Coordinating a full renovation here means pulling permits through Snohomish County PDS while keeping framing, electrical, plumbing, and HVAC on the same calendar. Vladislav Volkov has run 100+ of these projects since 2023 — homeowners talk directly to him, not a project manager reading from a file.

localContext: |
  Harbour Pointe's 1990s subdivisions look newer but carry their own issues — builder-grade OSB sheathing with marginal vapor barriers, original Moen fixture packages, and kitchen layouts that were never designed for the Thermador or Bosch appliances today's owners want to drop in. The older homes near Lighthouse Park, many on hillside lots with tight setbacks, require FAR calculations and careful plan review before a single board comes off the wall. Snohomish County PDS, not Seattle SDCI, handles permits here — a distinction that changes both the timeline and the submittal checklist.

commonProblems:
  - title: "Snohomish County PDS Plan Review Adds 6-10 Weeks Before Work Starts"
    description: "A full gut renovation or addition in Mukilteo means submitting to Snohomish County PDS — plan review for major structural work routinely runs 6-10 weeks. Scheduling rough-in inspection windows around that delay, while keeping electrical, plumbing, and HVAC subcontractors available, is where self-managed projects stall. A misaligned inspection sequence costs more calendar time than the permit itself."
  - title: "Demo on 1960s Homes Near Mukilteo Beach Road Hits Structural Surprises"
    description: "Strip drywall on a 1962 home and you often find notched joists, sister joist patches done without proper blocking, or a load-bearing wall absent from any original drawing. Replacing with an LVL beam or PSL post is straightforward — budgeting for it upfront is the part that catches homeowners off guard. Structural surprises add cost; late discovery of them adds weeks."
  - title: "Multi-Trade Scheduling Collapses Without One Person Watching the Seams"
    description: "Framing wraps, and the electrician's slot slipped two weeks. Now the plumber can't rough in, and the Mitsubishi mini-split crew dropped their window. Each sub covers their own scope — nobody watches the handoff between them. That gap is what a general contractor closes, and it's why $150K projects drag past 18 months when homeowners try to coordinate trades themselves."

faq:
  - q: "How fast can you get to Mukilteo for General Contracting?"
    a: "Mukilteo is roughly 25 minutes from our Snohomish County base via SR-525. Vladislav comes to the site for the first consultation — no scheduler, no rep. Call (206) 591-1096 to set a time."
  - q: "Do you coordinate premium appliance installs like Thermador or Sub-Zero?"
    a: "Yes. Mukilteo kitchens increasingly spec Thermador ranges, Bosch dishwashers, and Sub-Zero refrigerators. Rough-in coordination — gas line sizing, dedicated circuits, panel capacity — happens before cabinets go in, not after the appliance arrives on a truck."
  - q: "What does a full renovation cost and how long does it take in Mukilteo?"
    a: "A full kitchen gut with MEP coordination and finish work typically runs 6-10 weeks after permits clear. Whole-house projects add Snohomish County PDS review time — budget 2-3 months before demo starts. Projects range $30K-$200K+. Call (206) 591-1096 for a line-item quote, not a ballpark range."