title: "Mukilteo Handyman Services — Fixture Swaps, Punch Lists & Exterior Repairs"

answer: "TopVolk Construction LLC handles handyman repairs in Mukilteo (98275) — owner-operated by Vladislav Volkov, WA Licensed Contractor, 100+ projects since 2023."

intro: |
  Salt air off Puget Sound does a number on exterior wood trim around Mukilteo's waterfront neighborhoods — rotted fascia boards, peeling caulk at window frames, weatherstripping that failed two winters ago and never got replaced. TopVolk Construction LLC handles exactly this kind of work in Mukilteo (98275): punch-list completion after remodels, fixture swaps, drywall patches, deck board replacement, and minor exterior repairs — managed directly by Vladislav Volkov, WA Licensed Contractor, with 100+ projects completed since 2023. Down near the Mukilteo Lighthouse, older 1960s homes sit close enough to the Sound that cedar trim absorbs moisture year-round; up in Harbour Pointe, the 1980s–90s tract construction means builder-grade Moen faucets and light fixtures well past their service life. A Kohler toilet fill valve failing after midnight, a bathroom exhaust fan that rattles every cycle, a smart doorbell camera the previous installer abandoned mid-job — that work gets scheduled, priced line by line, and finished. Vladislav takes the call and shows up. No sales staff, no hand-off.

localContext: |
  Mukilteo's housing stock breaks into two main eras, both within zip code 98275. The older core near the ferry terminal and Lighthouse Park holds homes built between the late 1950s and mid-1970s — original galvanized supply lines, single-pane aluminum windows, and post-and-pier foundations that shift seasonally. Harbour Pointe, the large planned community that developed through the 1980s and 1990s along the hillside northeast of SR-525, runs on builder-grade Delta and Moen fixtures, hollow-core interior doors, and PT lumber decks now showing 30-plus years of PNW rain cycles. Snohomish County PDS handles permit review for Mukilteo; most handyman-scope repairs — fixture replacements, drywall patches, weatherstripping, deck board swaps, railing repairs — are permit-exempt. Electrical panel work or structural framing changes are not. Harbour Pointe's HOA also enforces exterior appearance standards, meaning trim repairs and deck work need to match existing material and paint spec before sign-off. That's worth confirming before you order materials.

commonProblems:
  - title: "Punch-List Backlog Piling Up After a Kitchen or Bath Remodel"
    description: |
      After a major remodel wraps, the list is real: door hinges that need adjustment, missing outlet cover plates, a tile backsplash edge left un-caulked, cabinet hardware ordered late still sitting in a box. In Harbour Pointe homes, post-remodel punch lists typically include Schluter Jolly trim strips not seated flush at tile transitions, recessed lighting trim rings that don't sit tight against 5/8" drywall ceilings, and touch-up paint on baseboard corners scuffed during demo. Vladislav works through the list item by item with clear pricing upfront — a full punch-list visit for a kitchen or bath remodel typically runs $300–$600 and covers everything in a single day. Hardware installation like Bosch dishwasher kick panels, cabinet pulls, and towel bar anchors gets done in the same visit. Those blue-tape walkthrough items that sit open for months get cleared.

  - title: "Weatherstripping Failure and Air Leaks in Older Mukilteo Homes"
    description: |
      Homes near the Mukilteo ferry terminal and along Harbour Pointe Drive lose serious heat through door gaps every winter — the kind of draft you feel at floor level when wind comes off Puget Sound during a November storm. Compression weatherstripping on exterior doors compresses and cracks after 10–15 years; the Q-Lon bulb seal and door sweeps on late-1980s Harbour Pointe homes are nearly all past service life at this point. Getting the replacement right means matching the door frame rabbet depth and choosing the correct profile — pile weatherstripping for sliding glass doors, foam backer rod for window sashes, V-seal tension strips for double-hung windows. Each installation method is different, and a mismatched profile either sticks or leaks. Materials run $40–$80 per door; labor and materials for three exterior doors typically lands at $350–$500 total.

  - title: "Drywall Patches and Texture Matching After Plumbing or Cable Access"
    description: |
      A plumber cuts a 12-inch access hole in a bathroom wall to reach the shutoff valve. A cable installer routes coax through three bedroom ceiling penetrations. The wall gets patched — but the orange-peel or skip-trowel texture doesn't match, and the repair reads like a repair from across the room. Texture matching is harder than it looks because it requires reading the original application angle, air pressure, and compound viscosity before any material touches the wall. In Mukilteo's Harbour Pointe homes built through the 1980s, the original finish is almost always orange-peel applied with a hopper gun. Patches use 5/8" drywall for wall repairs, mesh tape, and three coats of all-purpose joint compound feathered 8–10 inches past the opening. Priming with shellac-based Zinsser BIN prevents flashing under the texture coat. Single patch with texture match and prime: $200–$350 depending on size and access.

  - title: "Faucet, Toilet, and Light Fixture Replacements Without a Full Trade Call"
    description: |
      Swapping a Moen or Kohler kitchen faucet is not a 20-minute job in a 1980s Harbour Pointe home where the under-sink cabinet is tight, the angle stops are original compression fittings, and the old deck plate has corroded onto the sink. Same deal with toilet replacements — wax ring condition, flange height, supply angle, and the new toilet's footprint all need to line up before the first bolt tightens. For light fixtures, the junction box rating matters: a flush mount rated at 35 lbs installs as-is, but a ceiling fan requires blocking in the ceiling framing, and older Mukilteo homes frequently have undersized boxes. Vladislav brings a torque driver, basin wrench, and voltage tester on every fixture call. Single faucet replacement: $175–$275. Toilet swap: $200–$350. Light fixture on an existing rated box: $100–$175. Ceiling fan with blocking: $250–$400.

  - title: "Deck Board Replacement and Railing Repair for 30-Year-Old PNW Decks"
    description: |
      Mukilteo decks absorb 37-plus inches of rain annually, develop moss on north-facing boards by February, and take freeze-thaw stress in colder winters. PT lumber decks built in the early 1990s are now showing cupped, checked, and splitting boards — especially the outer rim joist boards and stair treads where water pools longest. Replacing individual boards with PT #2 lumber or Trex Enhance composite stops the rot cycle without a full deck rebuild. Railing repairs — loose posts, cracked balusters, failing post base hardware — are worth catching early; a railing that fails a lateral pull test is a liability, and Snohomish County inspectors do notice during other permit inspections. Board-for-board replacement doesn't require a Snohomish County PDS permit, which keeps the job fast. Pricing runs $15–$25 per linear foot for PT lumber replacement and $25–$40 per linear foot for Trex.

faq:
  - q: "How fast can you get to Mukilteo for handyman repairs?"
    a: |
      Mukilteo sits about 25 miles north of Seattle, a 35–40 minute drive via I-5 north to SR-526 or SR-525. Scheduling a first visit typically takes 3–7 days depending on current project load — not same-day emergency work, but not a month-long wait either. Most handyman visits run 2–5 hours on-site depending on the scope. For a punch-list call or two-to-three fixture replacements, the job is usually done in a single day. Call (206) 591-1096 to check current availability and get a rough timeframe before booking the on-site estimate.

  - q: "What does handyman work in Mukilteo typically cost?"
    a: |
      Pricing is by the job, not by the hour. Single fixture replacements (faucet, toilet, light fixture on an existing junction box) run $100–$350 each. Drywall patches with texture match: $200–$400 per patch depending on hole size and ceiling versus wall access. Weatherstripping three exterior doors: $350–$500 materials and labor. A full post-remodel punch-list visit: $300–$800 depending on the item count. The quote from the on-site estimate is the number on the invoice — no hourly billing that runs over. Free on-site estimates with line-item pricing; call (206) 591-1096 to schedule.

  - q: "Do handyman repairs in Mukilteo require permits from Snohomish County PDS?"
    a: |
      Most don't. Fixture replacements (faucet, toilet, light fixture on an existing rated box), drywall patching, weatherstripping, deck board replacement, and railing repairs are all permit-exempt under Snohomish County PDS guidelines — no permit application, no inspection, no wait. The threshold for permits kicks in with structural framing changes, electrical panel modifications, or new plumbing rough-in work. If a repair uncovers something that does require a permit — a ceiling fan installation that needs a new circuit, for example — Vladislav identifies that before starting and explains the right path forward. TopVolk Construction LLC is a WA Licensed Contractor operating in Snohomish County.

  - q: "Can you actually match the existing drywall texture in my Mukilteo home?"
    a: |
      Yes, and it takes a test pass on scrap drywall before touching the wall. The dominant texture in Harbour Pointe homes from the 1980s–90s is orange-peel, applied with a hopper gun at a specific pressure and distance that varies by the original crew and equipment. Matching it means dialing in the compound dilution and spray distance on a test board first. Skip-trowel and knockdown finishes, more common in some 1990s custom builds near the waterfront, are hand-applied and take a bit longer to blend at the perimeter. Every patch gets primed with Zinsser BIN shellac-based primer before the texture coat to prevent flashing once the final paint goes on. The goal is a patch you stop noticing after a week.

  - q: "What warranty does TopVolk offer on handyman repairs in Mukilteo?"
    a: |
      All workmanship carries a 1-year warranty — if a fixture install fails or a drywall patch cracks at the seam within a year of completion, it gets fixed at no charge. Materials carry their own manufacturer coverage: Moen and Kohler faucets include lifetime warranties on cartridges and finish; Trex composite decking carries a 25-year fade and stain warranty. The PNW climate is hardest on exterior repairs, so deck board and weatherstripping work gets a one-year check-in if there are any concerns. If a repair fails due to a pre-existing condition that wasn't visible at the estimate — like a rotted subfloor under a toilet — that's a separate job, and Vladislav flags it before starting, not after the invoice.

  - q: "Does TopVolk cover Edmonds and Everett for handyman work, or just Mukilteo?"
    a: |
      Mukilteo sits in the middle of TopVolk's Snohomish County corridor. Edmonds (98020, 98026) is about 10 minutes south on SR-524; Everett (98201, 98203) is roughly 15 minutes north on I-5; Lynnwood and Mountlake Terrace are 20 minutes southeast. All fall within regular scheduling range. If you have a property in Mukilteo and a second job in Edmonds the same week, those get combined into a single trip. Coverage also extends south into King County — Shoreline, Kenmore, Bothell — and west into Kitsap County via the ferry. Call (206) 591-1096 to confirm availability for your area and get the on-site estimate scheduled.