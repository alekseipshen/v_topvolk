  - q: "Do I need a permit for exterior painting or cabinet refinishing in Mukilteo?"
    a: |
      Standard residential painting — interior or exterior — doesn't require a building permit in Mukilteo. No plan review, no Snohomish County PDS filing, no AHJ sign-off. The regulatory layer that does apply is EPA RRP compliance: if lead paint is present in a pre-1978 home and surfaces are being disturbed (scraped, sanded, heat-stripped), a certified renovator must be on-site with proper containment and documentation. TopVolk, a WA Licensed Contractor, coordinates that process as part of the project scope — not as a surprise add-on. HOA color restrictions are a separate matter; some older CC&Rs in Mukilteo's waterfront-view neighborhoods require written approval before an exterior color change, and we flag that during the initial walk.

  - q: "How long does exterior paint last on cedar shake in Mukilteo's climate?"
    a: |
      On well-prepped cedar shake with two coats of Benjamin Moore Aura Exterior or Sherwin-Williams Duration, expect 6–8 years on south and west exposures. North-facing walls in Mukilteo — particularly those shaded by the bluff or mature Douglas-fir trees — may show moss and chalking in 4–5 years because they dry slowly after the rainy season. An annual light cleaning with diluted sodium hypochlorite solution extends the paint life meaningfully. The most common early failure point is bare cedar knots that weren't spot-primed with oil-based primer before the finish coats — resin bleeds through and lifts the topcoat in 2–3 years. Hardie cement-board siding holds exterior coatings noticeably longer than cedar — 8–10 years is realistic with proper surface prep.

  - q: "What warranty do you offer on painting work in Mukilteo?"
    a: |
      TopVolk provides a written workmanship warranty on all painting projects — 2 years on exterior work, 1 year on interior. The warranty covers peeling, blistering, or adhesion failure caused by application error, not mechanical damage or normal weathering. Paint manufacturer warranties are separate: Sherwin-Williams and Benjamin Moore both carry product warranties on their premium lines covering material defects. In Mukilteo's wet climate, exterior paint longevity comes down to prep quality — that's where time gets spent, because a warranty that's never called is better than one that is. Deadline penalties are also written into the contract: if agreed milestones are missed, there's a financial penalty on our end, not an apology.

