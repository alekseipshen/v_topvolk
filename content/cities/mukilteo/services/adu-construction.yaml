  - q: "What permits are required for a DADU in Mukilteo, and how long does it take?"
    a: |
      A new DADU in Mukilteo requires a building permit through the City of Mukilteo Community Development department — not Snohomish County PDS, unless your parcel sits in an unincorporated pocket outside city limits. The permit package needs architectural drawings, a structural engineering package with LVL beam and foundation schedules, a site plan documenting setbacks and lot coverage, and an energy code compliance report. Plan review currently runs 8-14 weeks. Once permits are issued, construction on a standard 600 sq ft DADU takes 4-5 months through final inspection. Total end-to-end from first consultation to final inspection typically runs 7-9 months. TopVolk handles permit submission as a WA Licensed Contractor — no separate permit expediter needed.

  - q: "Should I build a detached DADU or convert my basement to an ADU in Mukilteo?"
    a: |
      Lot size is the first filter. If your rear yard has the setback clearance and remaining lot coverage for a freestanding structure, a DADU provides better separation, stronger rental appeal, and more privacy for both occupants. If the lot is tight — which is common near the Mukilteo waterfront and on older 1960s parcels in the 98275 zip — a basement conversion or attached ADU typically makes more practical sense. Basement conversions cost less upfront but demand diligent moisture control (vapor barrier, DriCore subfloor, proper drain tile) to pass rough-in inspection and stay rentable long-term. A Mitsubishi mini-split handles heating and cooling efficiently in either scenario. TopVolk models both options with real cost estimates after the site visit.

