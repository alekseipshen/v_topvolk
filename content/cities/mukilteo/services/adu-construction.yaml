title: "Mukilteo ADU Construction — Add Rental Income on Your Existing Lot"

answer: "TopVolk Construction builds DADUs and attached ADUs on Mukilteo lots — WA Licensed Contractor with 100+ projects completed since 2023."

intro: |
  Paine Field's ongoing expansion has made the Mukilteo rental market one of the tighter submarkets in Snohomish County — and a detached ADU in your rear yard is one of the few ways to add legal rental income without subdividing your lot. WA HB 1337 (2024) now allows most single-family lots in the 98275 zip code to carry up to two ADUs: a DADU, an attached ADU above the garage, or a basement conversion. TopVolk Construction, owner-operated by Vladislav Volkov, has built ADUs across Snohomish County since 2023 — 100+ projects, direct communication with the contractor who actually does the work, no sales staff in the middle. Harbour Pointe lots along the 84th Street SW corridor typically have the rear yard depth for a freestanding DADU, while parcels near the Mukilteo Lighthouse and ferry landing tend toward tighter footprints where a basement or attached ADU makes more financial sense. Standard TopVolk ADU spec includes a Mitsubishi mini-split for zoned climate control and a Navien tankless water heater — no undersized mechanical systems that generate tenant complaints six months after move-in.

localContext: |
  Mukilteo's residential stock falls almost entirely within zip code 98275, with homes ranging from late-1960s split-levels near the Rosehill Community Center to 1990s two-story colonials in Harbour Pointe. The older 1960s and 1970s builds frequently carry 100-amp electrical panels — a real problem when City of Mukilteo requires a documented separate or sub-panel electrical arrangement before ADU occupancy can be approved. Lot coverage rules here cap total impervious surface, so the DADU footprint, existing house, driveway, and patios all count together — a 6,000 sq ft lot has less buildable room than most homeowners assume. City of Mukilteo Community Development handles permits for most residential parcels inside city limits; Snohomish County PDS covers the handful of unincorporated pockets at the city's edges. Hardie cement-board siding holds up far better than LP SmartSide on Mukilteo's northwest-facing lots, which take the brunt of Puget Sound winter storms rolling in off the water. Any below-grade ADU space also requires a proper vapor barrier — with roughly 37 inches of annual rainfall and a high water table in low-lying areas, moisture control isn't optional, it's what passes inspection.

commonProblems:
  - title: "Rear Yard Setbacks and Lot Coverage Limits That Kill a DADU Before Permits Are Filed"
    description: |
      The most common DADU problem in Mukilteo isn't the construction — it's discovering mid-design that your rear yard doesn't have the setback clearance or remaining lot coverage to fit the unit you had in mind. City of Mukilteo typically requires a 5-foot rear setback and a 5-foot side setback for a DADU, plus a 24-foot height limit to the ridge. Add lot coverage restrictions — usually 45-55% of lot area — and a 600 sq ft DADU footprint on a 6,000 sq ft lot leaves almost no buffer. TopVolk does a full site analysis before any design work begins: FAR calculations, setback measurements, and an existing coverage inventory of the house, garage, and hardscape. Catching these conflicts at the consultation stage saves 2-3 months compared to finding them after permit submittal. Call (206) 591-1096 to schedule an on-site review of your lot.

  - title: "Undersized Electrical Panels in 1970s Mukilteo Homes Blocking ADU Utility Connections"
    description: |
      Split-levels and ranchers built in Mukilteo between 1965-1978 commonly carry 100-amp main panels — adequate for the original house, but not when you're adding an ADU with its own electrical service. City of Mukilteo requires either a separate meter for the ADU or a properly documented sub-panel arrangement that meets current NEC code requirements. Upgrading from a 100-amp to a 200-amp panel runs $3,500-$5,500 with permit; adding a second meter point through Snohomish County PUD adds another $1,500-$3,000 depending on transformer proximity. Some owners opt for a shared 400-amp service split between the main house and ADU — cleaner long-term if you plan to rent to an unrelated tenant. TopVolk coordinates MEP rough-in sequencing so the electrical upgrade happens before framing inspection, not after, avoiding costly re-inspection delays that push timelines by weeks.

  - title: "City of Mukilteo Plan Review: What the Permit Process Actually Looks Like"
    description: |
      A DADU permit in Mukilteo requires architectural drawings, a site plan with setback and lot coverage calculations, structural engineering (LVL beam schedule, foundation design), and an energy code compliance report. The City of Mukilteo Community Development department currently runs 8-14 weeks for plan review on new DADU applications — longer if the first submission comes back with corrections that require a resubmittal round. TopVolk prepares complete permit packages — drawings, calculations, site plan — so the first submittal is as clean as it can be. For reference, Snohomish County PDS, which handles unincorporated parcels at Mukilteo's edges, runs a similar 6-12 week plan review. TopVolk is a WA Licensed Contractor and files the permit application directly; you're not navigating the portal alone. Deadline penalty clauses are written into every TopVolk contract — if construction milestones are missed, there are real financial consequences, not verbal reassurances.

  - title: "DADU vs. Attached ADU vs. Basement Conversion: Which One Pencils Out in Mukilteo"
    description: |
      The cost gap between ADU types is significant and worth mapping before committing to a design. A freestanding DADU in Mukilteo typically runs $180,000-$320,000 for 400-800 sq ft, depending on foundation type, finish level, and site conditions like slope or utility run length. An attached ADU above a garage or as a home addition comes in at $120,000-$200,000. A basement conversion — with at least 7-foot ceiling height and proper moisture control using a DriCore subfloor and vapor barrier — can start around $75,000 and reach $140,000 with a full kitchen and Bosch appliances. Rental yield near Paine Field and the ferry corridor typically runs $1,600-$2,200 per month for a well-finished 1-bedroom unit. At those rents, even a $260,000 DADU has a reasonable payback horizon. TopVolk provides line-item pricing after an on-site consultation — not a vague range to get you in the door.

  - title: "Moisture Control in Basement ADU Conversions: The Step Most Contractors Skip"
    description: |
      Many of Mukilteo's older homes have crawlspaces or basements that show seasonal moisture intrusion — not a surprise given ~37 inches of annual rainfall and heavy Oct-May rain seasons. Converting a basement to a livable ADU without addressing the moisture problem first guarantees mildew, failed inspections, and tenant health issues within 2-3 years. The proper sequence: French drain or interior drain tile if there's active water, then a vapor barrier on all below-grade walls and slab, then DriCore raised subfloor panels to create an air gap above the concrete. Shower areas require Schluter Kerdi or an equivalent waterproofing membrane behind the tile. City of Mukilteo inspectors check moisture management as part of the rough-in inspection on ADU conversions — skipping it doesn't just risk tenant complaints, it risks failing inspection entirely. Cutting corners here to save $10,000 upfront typically costs $30,000-$50,000 to remediate later.

