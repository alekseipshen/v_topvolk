title: "Mukilteo Door Installation — Waterfront Exposure, Energy-Tight Seals"

answer: "TopVolk Construction replaces entry, patio, interior, and garage doors in Mukilteo, WA — WA Licensed Contractor, 100+ projects since 2023."

intro: |
  Waterfront exposure at Mukilteo does things to exterior doors that inland homes don't
  see — salt-laden air off Puget Sound accelerates threshold corrosion, driving rain from
  October through April saturates wood sill pans, and the southwest-facing entries near
  the Mukilteo Lighthouse area take constant weather loading on their head flashing.
  TopVolk Construction handles door replacement and installation across Mukilteo (98275)
  as a WA Licensed Contractor, with 100+ projects completed since 2023 across King,
  Snohomish, Pierce, and Kitsap counties. Vladislav Volkov runs the operation directly —
  call (206) 591-1096 and you're talking to the person actually doing the work, not a
  scheduler reading from a script. Harbour Pointe homes built from the late 1990s through
  early 2000s frequently show builder-grade fiberglass doors that have gone soft at the
  corners and lost their foam-core compression, so the seal leaks and the threshold pan has
  corroded through. Getting the rough opening flashed correctly on a replacement — head
  flashing lapped over the housewrap, sill pan sloped to drain — is the step most
  contractors skip on a door swap, and that's where the rot problems start five years later.

localContext: |
  The 98275 zip code covers a narrow coastal strip from the ferry terminal and Lighthouse
  Landing north toward the Snohomish County line, then rises sharply to the hilltop
  neighborhoods sitting above Mukilteo Speedway. Down near the waterfront, homes date from
  the 1940s through 1970s with post-and-beam construction and original wood-frame openings
  — rough openings that shift over decades and often need re-shimming before a new door unit
  can hang plumb and square. The Harbour Pointe planned community, up on the plateau, has a
  different problem: 1990s-era vinyl-clad wood doors that have delaminated at the bottom
  rail after years of standing water from PNW freeze-thaw cycles. Adjacent unincorporated
  pockets near the 98203 Everett border fall under Snohomish County PDS jurisdiction, but
  Mukilteo proper goes through the City of Mukilteo Building Department for anything
  involving framing. A standard same-size door swap typically doesn't require a permit in
  Mukilteo, but widening a rough opening for a French door conversion, replacing an LVL
  header, or adding side-lites does — and the city's review turnaround for minor residential
  structural work runs two to four weeks.

commonProblems:
  - title: "Entry Door Threshold Failure and Rot at Waterfront-Exposed Homes"
    description: |
      On Mukilteo homes facing Puget Sound — especially the lower Lighthouse Landing streets
      — the threshold pan takes a sustained beating. Blowing rain sits against the door sill,
      the aluminum threshold cap corrodes, and water migrates under the door sweep into the
      subfloor framing. By the time the interior floor feels soft near the entry, the sill
      plate and sometimes the trimmer stud below the rough opening have rotted through. The
      fix isn't just a new door — it's pulling the unit, replacing the sill plate with
      pressure-treated (PT) lumber, installing a full sill pan flashing (Schluter Kerdi-Band
      works well here, same waterproofing used in curbless shower applications), and
      re-flashing the head before the new unit goes in. A fiberglass door with a composite
      threshold — ProVia and Therma-Tru both offer solid options in the $1,200–$2,200
      door-only range — handles moisture far better than wood or hollow steel in this climate.
      Full replacement including framing repair: $3,500–$6,500 depending on rot extent.

  - title: "Patio Sliding Door Conversion to French or Multi-Slide System"
    description: |
      Harbour Pointe homes were commonly built with 6-foot aluminum-frame sliding patio doors
      that are now drafty, running on worn rollers, with failed insulated glass unit (IGU)
      seals that fog up every fall. Converting a 6-foot slider to a Milgard or Pella French
      door system isn't a straight swap — the rough opening dimensions change, and the header
      span may need to step up from a doubled 2×10 to a proper LVL beam if the clear span
      increases. If the deck ledger board is PT lumber in good condition, the exterior
      transition works cleanly; a rotted ledger is a separate repair that has to happen first.
      Multi-slide systems — four-panel pocket or stacking configurations — are popular in
      Mukilteo's hilltop market but require a structural check to confirm the wall segment can
      carry the larger header load. Milgard Tuscany and Trinsic series handle PNW rain seasons
      well and carry a lifetime hardware and glass warranty. Budget $6,000–$14,000 installed
      depending on size, panel count, and glass package.

  - title: "Interior Door Swing and Casing Work During Whole-Home Remodels"
    description: |
      Interior door replacement during a kitchen or bath remodel in Mukilteo almost always
      surfaces hidden issues — original 1960s–1970s homes near the Speedway corridor have
      2×4 partition walls with 1⅜-inch hollow-core doors hung in openings that are out of
      plumb by ¾ inch or more. New 1¾-inch solid-core prehung units (better acoustics,
      better fire separation at the garage-to-house door) need to be shimmed plumb in the
      rough opening before the casing goes on. IRC requires a minimum 1⅜-inch solid wood or
      honeycomb steel door between the garage and living space; 1¾-inch solid-core is the
      standard move since you're already doing the labor anyway. Casing profile — simple ranch
      or a built-up craftsman detail — gets installed after drywall mud is fully dry, so
      sequencing within the overall remodel matters. Interior door installation runs
      $350–$650 per door including prehung unit, casing, and hardware. A full interior package
      for a 4-bedroom Mukilteo home (8–10 doors) typically runs $4,500–$7,000 installed.

  - title: "Garage Door Replacement with Insulated Panels for PNW Winters"
    description: |
      Single-skin uninsulated garage doors in Mukilteo's climate create a cold buffer zone
      that pulls 10–15 degrees out of any bonus room or utility space above the garage, and
      the gap between the bottom astragal and the concrete slab lets in both rodents and
      wind-driven rain. An insulated panel garage door — R-12 or better — makes a real
      difference when the garage is attached and the floor above is conditioned space. Clopay
      and Wayne Dalton both make steel insulated doors in the $900–$1,800 door-only range.
      LiftMaster jackshaft openers work better than overhead rail systems in low-clearance
      garages common in Mukilteo's older split-level homes near the waterfront. The bottom
      seal and side weatherstripping need to be matched to the actual concrete slab condition
      — an uneven slab requires a custom-width bulb astragal, not the standard flat rubber
      strip that gets sold at the big-box stores. Full garage door replacement including
      haul-away of the old door runs $1,800–$3,500 depending on door size and opener type.

  - title: "Smart Lock Integration and Weatherstripping Tune-Up on Existing Entry Doors"
    description: |
      Schlage Encode and August Wi-Fi Smart Lock Pro are the two units requested most often
      on Mukilteo entry door jobs — both retrofit into the existing deadbolt prep hole
      (2⅛-inch bore) without replacing the door slab, but both require the door to latch
      smoothly under all weather conditions. A door that's swollen from moisture absorption
      or has a hinge bind won't hold its smart lock alignment through a wet PNW winter, and
      the latch bolt won't engage cleanly when the deadbolt throw is off. The standard fix:
      reset the hinges with 3-inch screws into the framing (not just the jamb), adjust the
      strike plate, and replace the weatherstripping with a compression bulb door sweep that
      actually seats at 45 degrees rather than dragging. Pemko manufactures reliable threshold
      and sweep combinations built for Pacific Northwest moisture loads. Smart lock
      integration with a weatherstripping tune-up on an existing door runs $400–$800
      depending on lock hardware selected — Schlage Encode Plus deadbolts retail around
      $250–$300, and August Wi-Fi models run $200–$280.

faq:
  - q: "How fast can you get to Mukilteo for Door Installation?"
    a: |
      Mukilteo sits about 25 minutes north of Seattle via I-5 to SR-525, and TopVolk
      schedules Snohomish County work primarily on Tuesday through Thursday to avoid commute
      stacking on I-5. For the waterfront streets near the Mukilteo Ferry Terminal, weekday
      scheduling also avoids the afternoon ferry-traffic backup that can slow delivery vehicles.
      A standard entry door swap — same-size replacement with no structural framing work —
      typically runs one day on site. Call (206) 591-1096 to schedule a free on-site
      consultation; Vladislav will come out, measure the rough opening, assess the flashing
      condition, and give you a line-item quote the same week.

  - q: "What does door installation cost in Mukilteo?"
    a: |
      Entry door replacement with proper sill pan flashing and head flashing runs $2,500–$5,500
      installed for a standard 3-0 × 6-8 fiberglass unit, depending on door grade, glass
      package, and whether framing repairs are needed. Patio sliding-to-French-door conversions
      start around $6,000 and reach $14,000-plus for multi-panel systems with structural header
      work. Interior prehung doors run $350–$650 each installed. Garage door replacement with
      insulated panels comes in at $1,800–$3,500. Every quote from TopVolk is line-itemized —
      door unit, hardware, flashing materials, framing if needed, and labor as separate line
      items. Call (206) 591-1096 or schedule a free on-site estimate to get exact numbers for
      your project.

  - q: "Do I need a permit to replace a door in Mukilteo?"
    a: |
      A straight same-size door replacement — identical rough opening, no framing changes —
      generally doesn't require a building permit from the City of Mukilteo. But widening the
      opening for a French door conversion, swapping out or upsizing the LVL header, or adding
      side-lites that change the opening width all require a permit and trigger a rough-in
      framing inspection before the wall closes. Snohomish County PDS handles unincorporated
      areas nearby, but Mukilteo proper runs through the city's own building department.
      TopVolk, as a WA Licensed Contractor, handles permit applications and inspection
      coordination — homeowners don't need to navigate the portal themselves. City of Mukilteo
      review for minor residential structural work typically runs two to four weeks.

  - q: "Fiberglass vs. solid wood entry door — which holds up better in Mukilteo's climate?"
    a: |
      Fiberglass is the right call for any weather-exposed location in Mukilteo, especially
      waterfront-facing entries. Solid wood doors absorb moisture through the rail-and-stile
      joints, swell in winter, and shrink in dry summer months — in a climate with 37+ inches
      of annual rainfall, that cycle degrades the exterior finish and eventually compromises the
      glazing seal. Fiberglass doors like the Therma-Tru Smooth-Star and Fiber-Classic series,
      or ProVia's Embarq line, hold their dimension year-round and accept paint or gel-stain
      finishes that convincingly replicate wood grain. For Harbour Pointe homes where the HOA
      requires a specific wood-look aesthetic, a fiberglass door stained to match surrounding
      cedar trim is the practical answer. Solid wood is appropriate only for protected interior
      entries with minimal direct moisture exposure.

  - q: "What warranty comes with door installation from TopVolk?"
    a: |
      Door unit warranties depend on the manufacturer — Milgard and Therma-Tru both offer
      lifetime limited warranties on their fiberglass slabs and hardware, covering delamination,
      warping, and insulated glass unit seal failure. Flashing and installation workmanship
      carries a separate warranty from TopVolk, written into the contract before work starts.
      What's not covered: finish wear from direct UV and salt air (a southwest-facing door in
      Mukilteo realistically needs repainting every 7–10 years), damage from impact, or hardware
      wear on high-use entries. TopVolk's contracts also include a deadline penalty clause — if
      the project runs past the agreed completion date due to contractor scheduling, there's
      financial compensation built in. That's in the written contract, not a verbal assurance
      at the estimate meeting.

  - q: "Does TopVolk cover nearby cities, and how far out do you schedule?"
    a: |
      Mukilteo is within TopVolk's core Snohomish County service area. Nearby Everett (98203),
      Edmonds, Lynnwood, Mill Creek, and Bothell are on the regular schedule. Across the county
      line, Shoreline, Kenmore, and Kirkland are also covered in King County. Standard door
      replacement projects typically book two to four weeks out; permit-required structural
      openings or header work may run six to eight weeks depending on the City of Mukilteo's
