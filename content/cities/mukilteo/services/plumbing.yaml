  - q: "Do plumbing projects in Mukilteo require building permits?"
    a: |
      Water heater replacements, repiping, and new drain tie-ins all require permits through Mukilteo's city building department. Mukilteo is an incorporated city, so these permits go directly to the city's building counter — not Snohomish County PDS, which handles unincorporated areas like Mill Creek or parts of Lynnwood. Water heater replacements require documentation of seismic strapping compliance under WA State IRC amendments. Repipe permits require a rough-in inspection before walls are closed and a final inspection at project completion. As WA Licensed Contractor, TopVolk pulls all required permits and schedules inspections — that process is handled entirely on our end. Plan review for standard plumbing work in Mukilteo typically runs one to two weeks.

  - q: "Should I repipe with copper or PEX-A in a Mukilteo home?"
    a: |
      For most Mukilteo homes, PEX-A with Uponor ProPEX expansion fittings is the stronger choice over Type L copper. PEX-A is more flexible in tight crawlspaces, handles freeze-thaw stress better than rigid copper — it expands rather than splitting — and ProPEX joints don't carry the dezincification risk that brass compression fittings can develop in high-chlorine municipal water. Copper is still a valid spec, particularly where resale buyers expect it, but installed cost runs 20-30% higher than PEX-A for equivalent coverage. Both materials carry long manufacturer warranties when installed correctly. Vladislav walks through the trade-offs on-site based on your home's specific layout, crawlspace access, and budget before any decision gets made.

  - q: "How long does a repipe last, and what warranty does TopVolk provide?"
    a: |
      Properly installed PEX-A supply lines carry manufacturer warranties of 25 years or more — Uponor warrants AquaPEX tubing for 25 years. Type L copper, when installed correctly, routinely lasts 50 years or longer in residential supply applications. The bigger long-term risk in Mukilteo is cast iron drain line corrosion in pre-1960 homes: crawlspaces with inadequate vapor barriers and seven months of annual rain cycle humidity accelerate interior pitting. TopVolk's workmanship warranty covers labor defects for one year from project completion; material warranties pass through directly from the manufacturer. Deadline penalty terms are written into every contract — if the project runs past the agreed completion date, there's a financial penalty built into the agreement, not just an apology.

