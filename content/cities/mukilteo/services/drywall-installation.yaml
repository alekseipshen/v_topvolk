intro: |
  Drywall installation and finishing on Mukilteo remodels is handled by Vladislav Volkov at TopVolk Construction — WA Licensed Contractor, owner-operated, with 100+ projects completed across Snohomish and King counties since 2023. Harbour Pointe's late-1980s housing stock is where most of that Mukilteo scope falls: homes built between 1987 and 1993 that are now hitting their first serious renovation cycle, with popcorn ceilings, builder-grade tape-and-texture walls, and attached garages being converted to ADUs under WA HB 1337. Puget Sound proximity brings real moisture pressure — the October-through-May rain season Mukilteo shares with the broader Seattle metro keeps relative humidity elevated in north-facing rooms, below-grade spaces, and bathroom walls, making board selection matter from the first day of the hang. The Mukilteo Lighthouse area near the waterfront has a handful of older homes that predate the Harbour Pointe development, some requiring veneer plaster matching or careful texture blending to keep remodeled rooms consistent with the original character. Call (206) 591-1096 to schedule a free on-site consultation — you'll talk directly to Vladislav, not a scheduling service.

localContext: |
  Most residential drywall work in Mukilteo falls within 98275, covering Harbour Pointe, the Chennault Beach area closer to the Sound, and the neighborhoods running inland along Mukilteo Speedway. A smaller pocket of Mukilteo-area addresses uses 98203, shared with south Everett — older construction there, mostly 1970s ranchers and split-levels with heavily textured walls that are strong candidates for skim-coat refinishing before any paint refresh. Snohomish County PDS (Planning and Development Services) handles building permits for unincorporated parcels at the Mukilteo city fringe, but most in-city work routes through Mukilteo's own building department. Straightforward drywall patching and finish work inside existing wall cavities typically requires no permit; adding new walls, modifying fire-rated assemblies, or framing an ADU separation structure does trigger a building permit and rough-in inspection before board goes up. The coastal exposure at this end of Snohomish County means paperless mold-resistant gypsum board — Georgia-Pacific DensArmor Plus or USG Sheetrock Mold Tough — is a practical specification in any bathroom, laundry room, or below-grade space, not an optional upgrade.

commonProblems:
  - title: "Skim-Coating Popcorn Ceilings in Harbour Pointe's 1987–1993 Construction"
    description: |
      Popcorn texture was standard spec in Harbour Pointe through the early 1990s, and most of those ceilings are now stained, cracking, or visually out of place in a remodeled interior. Wet-scraping over unpainted drywall pulls face paper — the paper and the texture compound bond together, and aggressive scraping creates a rough, pitted substrate that telegraphs through any finish coat. The correct sequence is a diluted PVA primer applied first to consolidate the paper, a skim scrape, then two passes of setting-type compound: Durabond 45 as the base coat for its crack resistance, followed by finish-grade joint compound for the skim layer. A standard living room or primary bedroom ceiling runs $800–$1,400 depending on square footage and existing substrate condition. Timeline is typically one to two days for the compound work, plus 24-hour drying between coats before the ceiling can be primed and painted.

  - title: "5/8-Inch Type-X Firecode Drywall for Garage ADU Separation Walls"
    description: |
      Attached garage conversions to living space have increased significantly in Mukilteo since WA HB 1337 passed in 2024, allowing up to two ADUs per single-family lot statewide. The IRC requires a fire-rated separation assembly between a garage and any attached dwelling — specifically 5/8-inch type-X firecode drywall on the garage-facing side, continuous from foundation to the underside of the floor or roof above, with PT blocking installed in the stud cavity where the board terminates at the top plate. Mukilteo's building department enforces this at rough-in inspection; undersized or incomplete assemblies get flagged and require a re-inspection before the project can proceed. The firewall scope for a single-car garage wall and ceiling typically runs $1,800–$3,200, depending on linear footage, ceiling configuration, and whether blocking needs to be added to existing framing. Plan on 2–4 weeks for permit review before the work can start.

  - title: "Mold-Resistant Purple Board in Bathrooms and Below-Grade Spaces"
    description: |
      Standard 1/2-inch drywall in a Mukilteo basement bathroom has a short service life. Ground moisture, limited ventilation, and the region's persistent humidity — Mukilteo's coastal position adds Puget Sound marine air on top of the Seattle metro's ~37 annual inches of rain — degrades paper-faced gypsum within a few years, showing as face-paper mold behind baseboard or in corners near the shower. Georgia-Pacific DensArmor Plus (the paperless fiberglass-mat "purple board") or National Gypsum Hi-Moisture eliminates that failure mode — both boards have inorganic glass-mat facers that give mold nothing to consume. In shower alcoves, TopVolk installs Schluter Kerdi membrane or RedGard liquid waterproofing over cement backer board rather than any gypsum product in the wet zone. The material cost difference over standard drywall runs approximately $0.35–$0.55 per square foot — negligible relative to the cost of demo and re-installation two years down the line.

  - title: "Level 5 Finish for Kitchens and Baths with Directional Lighting"
    description: |
      Pendant lights, wall sconces, and under-cabinet LED strips expose every trowel ridge and skim variation in the wall surface. Level 4 — the standard residential finish spec — shows those imperfections clearly under raking light, which becomes a visible problem in higher-end Mukilteo kitchens where homeowners are already investing in Wolf ranges, Sub-Zero refrigerators, or Bosch appliance suites. Level 5 adds a full skim coat of finish-grade joint compound across the entire taped wall surface before priming, creating a flat, even substrate that holds paint consistently under directional fixtures. The cost premium over Level 4 is roughly $0.75–$1.25 per square foot. On a 400-square-foot kitchen scope, that's $300–$500 additional — worth specifying in the written contract before the board goes up, because retrofitting Level 5 after the fact means re-skimming installed walls and re-painting entirely.

  - title: "Soundproofing Shared Walls with Resilient Channel and QuietRock"
    description: |
      Bedroom-to-bedroom sound transmission comes up regularly in Harbour Pointe's attached two-story homes and in multi-room remodels where a primary suite shares a wall with a home office or media room. Standard drywall over wood-stud framing delivers an STC (Sound Transmission Class) rating in the 33–36 range — enough to muffle conversation, not enough to block a television or instrument practice. Adding resilient channel to decouple the drywall layer from the framing raises the STC to roughly 45–50. QuietRock 525, a mass-loaded specialty gypsum board, achieves STC 52+ without resilient channel, which simplifies the install in tight framing situations. Soundproofing is scoped as part of a whole-room remodel at TopVolk — it requires removing existing drywall, installing the channel or specialty board, and refinishing to Level 4. Budget $20–$30 per square foot for a full soundproofed wall assembly including demo, materials, taping, and finish. Add 3–5 days to the remodel timeline.

