title: "Mukilteo Bathroom Remodel — Paine Field-Era Baths Rebuilt"

intro: |
  Harbour Pointe and the neighborhoods fanning inland from SR-526 in 98275 are
  mostly 1985–1995 builds — the same era that filled bathrooms with 4×4 ceramic
  tile over greenboard, builder-grade Moen single-handle valves, and a Broan
  exhaust fan rated at 50 CFM. Adequate in 1990. Marginal now. Puget Sound
  humidity doesn't care about original intent. Vladislav Volkov at TopVolk
  Construction has handled 100+ remodels across Snohomish and King counties
  since 2023, and he'll walk your bathroom himself — not send a salesperson.

localContext: |
  The older pocket near Mukilteo's lighthouse district — also 98275, closer to
  the ferry terminal — has 1960s construction with cast-iron drain stacks, post-
  and-pier foundations prone to moisture migration, and bathrooms that have
  never been touched since original build. Inland toward Paine Field, the tract
  homes share a common defect: single-hung windows trapping condensation,
  inadequate blocking behind tile backer, and subfloors that have absorbed years
  of slow seepage around the toilet flange. City of Mukilteo building department
  handles permits here; Snohomish County PDS covers unincorporated parcels at
  the city edges.

commonProblems:
  - title: "Failed Fiberglass Surrounds and Rotted OSB Subfloor"
    description: >
      Builder-grade fiberglass surrounds in 1990s Harbour Pointe homes crack at
      the pan seam over time — water migrates under the shower pan long before
      tile pops. By the time you notice, the OSB subfloor is saturated. Correct
      fix: full tear-out, DriCore subfloor replacement, Schluter Kerdi
      waterproofing membrane over cement backer, new curb or curbless pan.
      Re-caulking the seam is not a fix.

  - title: "Ventilation Failure and Mold Behind Tile in PNW Bathrooms"
    description: >
      Most builder exhaust fans in 1990s Mukilteo homes push 50–70 CFM — not
      enough for a master bath over 50 square feet in a climate averaging 37
      inches of rain annually. North-facing bathrooms near the Mukilteo bluffs
      dry slowly. Upgrading to a Panasonic WhisperCeiling rated at 110 CFM,
      combined with RedGard applied across all wet-zone backer board, stops
      mold regrowth at the substrate rather than bleaching the grout surface.

  - title: "Curbless Shower Conversions in 1960s Lighthouse-Area Homes"
    description: >
      Converting a curbed tub-shower to a curbless walk-in shower in homes near
      the Mukilteo waterfront often means rerouting the p-trap and resetting the
      linear drain slope across a joist bay. When original framing runs the
      wrong direction, sister-joisting is required to reestablish pitch. A Kohler
      curbless drain system needs 2 inches of drop over 4 feet — that math
      doesn't work in a 1965 crawlspace foundation without structural prep.

faq:
  - q: "How do I get a bathroom remodel consultation in Mukilteo?"
    a: >
      Vladislav covers 98275 as a regular service run — SR-99 or SR-525 from
      South Snohomish County. Call (206) 591-1096 to schedule a free on-site
      visit. He'll check subfloor condition, review your layout, and return a
      line-item quote — not a rough estimate range.

  - q: "What fixture brands do you spec for Mukilteo bathroom remodels?"
    a: >
      Kohler, Toto, and Moen cover most installs at this income level. Toto
      Drake II or Ultramax for toilets. Kohler Rite-Temp or Moen Posi-Temp
      pressure-balance valve with volume control for showers. Large-format
      porcelain from MSI or Daltile for floor and wall tile. TopVolk is a WA
      Licensed Contractor — no inventory markup, you source the fixture, we
      install it to code.

  - q: "How long does a full bathroom remodel take in Mukilteo, and who pulls permits?"
    a: >
      Full master bath gut-and-rebuild: roughly 6–9 weeks total. City of
      Mukilteo plan review runs 2–4 weeks for major scope; construction through
      rough-in inspection and final takes another 3–5 weeks. TopVolk pulls all
      permits. Deadline commitments — including the penalty clause for delays on
      our end — go into the contract in writing before work starts. Call
      (206) 591-1096 to get the process started.