  - q: "Should I add a Mitsubishi mini-split or pre-wire for an EV charger during garage construction?"
    a: "Both. Pre-wiring a 50A or 60A EV circuit rough-in during framing adds $400–$700 to the build. Doing the same work after drywall and insulation are closed costs $1,500–$3,000 depending on panel location and conduit routing. The rough-in goes in during the electrical framing phase: conduit, appropriately sized wire to the panel, and a junction box sized for a Bosch EV800 or comparable Level 2 charger. The Mitsubishi MSZ mini-split installs after rough-in inspection and before drywall on conditioned builds — it handles Mukilteo's damp winters and keeps humidity low enough for workshop use. Both get scheduled into the same construction sequence at no additional mobilization cost."

  - q: "What's the warranty on a new garage build in Mukilteo's wet climate?"
    a: "Structural framing and foundation work carry a three-year workmanship warranty with TopVolk. Manufacturer warranties on Hardie siding run 30 years; Mitsubishi mini-splits carry a 12-year compressor warranty when registered. The real durability test in Mukilteo is moisture management — PT lumber at all ground-contact framing, 6-mil vapor barrier under the slab, and proper flashing at the roof-to-wall transition are what separate a 15-year garage from a 40-year garage in this climate. Deadline penalties are written into every TopVolk contract — if the agreed completion date is missed, there are financial consequences, not just an apology."

