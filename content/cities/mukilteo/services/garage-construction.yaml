title: "Mukilteo Garage Construction — DADUs, Setbacks & EV Pre-Wire"

answer: "TopVolk Construction LLC builds new garages and DADU-above builds in Mukilteo, WA — WA Licensed Contractor, 100+ projects across Snohomish County."

intro: |
  Most Mukilteo lots in 98275 — especially the 1990s-era builds in Harbour Pointe — can fit a detached two-car garage with a DADU above under WA HB 1337, but FAR limits and rear setbacks determine exactly what footprint pencils out before any design work starts. Vladislav Volkov at TopVolk Construction LLC handles garage builds from permit submittal through final inspection, WA Licensed Contractor, 100+ projects completed since 2023. A basic detached two-car shell runs $45,000–$65,000; add a finished DADU above and total cost lands at $145,000–$195,000 depending on bathroom count, kitchen allowance, and finish level. Down near the Mukilteo Lighthouse waterfront, older 1950s and 1960s lots tighten rear setbacks further — sometimes forcing a design revision after initial plan review. Every garage TopVolk builds gets a 50A EV circuit rough-in during framing, Bosch-compatible EVSE stub-out positioned before insulation goes in, because retrofitting it afterward costs two to four times more.

localContext: |
  Mukilteo's 98275 ZIP covers the bulk of the city — the Harbour Pointe planned community off Harbour Pointe Boulevard, mid-century neighborhoods near the ferry terminal, and newer infill closer to Paine Field. The 98203 ZIP touches Mukilteo's northeastern edge near the Everett border, where parcels sometimes fall under Snohomish County PDS jurisdiction rather than the City of Mukilteo's Community Development Department. Those are two different plan review timelines and submittal checklists, and mixing them up costs weeks. Housing near the lighthouse and Mukilteo Beach Park dates to the 1950s and early 1960s — ranch-style and split-level construction on smaller platted lots with correspondingly tighter setbacks. Harbour Pointe ran through the late 1980s into the early 2000s; those homes have HOA Architectural Review Committees layered on top of city permit requirements. Concrete slabs here require 6-mil poly vapor barriers and compacted crushed-rock subbases — Mukilteo's clay-heavy soils trap moisture under slabs year-round, and the October-through-April rain cycle accelerates what happens when that's skipped.

commonProblems:
  - title: "DADU-Above-Garage Setback and FAR Conflicts on Mukilteo Lots"
    description: "WA HB 1337 allows up to two ADUs per single-family lot statewide — but local setback rules still apply. Mukilteo typically requires 5-foot minimum side and rear setbacks for accessory structures, and older plat conditions sometimes impose more. FAR limits constrain the total square footage allowed on the lot, which determines how large the DADU above the garage can be before a variance is needed. A standard 24x24 two-car footprint with a studio DADU above usually clears setbacks on Harbour Pointe lots, but anything wider needs early-stage lot coverage math. Vladislav reviews FAR, setback, and lot coverage before any design work begins — catching conflicts at the consultation stage rather than after plan submittal. City of Mukilteo plan review for new accessory structures with DADU components currently runs 6-10 weeks."

  - title: "Concrete Slab Failure in Mukilteo's High-Moisture Soil Conditions"
    description: "Garage slabs poured on unprepared native soil crack and heave within a few seasons in Mukilteo's clay-heavy ground. The correct spec is a 4-inch minimum fiber-reinforced slab over 4 inches of compacted crushed rock, with a 6-mil poly vapor barrier between the rock and the concrete. That's the IRC-compliant minimum, and Mukilteo Community Development's AHJ confirms it at rough-in inspection before the pour. Skipping the vapor barrier is the most common shortcut — it shows up two or three wet seasons later as efflorescence, concrete spalling, and rust on anchored shelving and cabinets. For workshop or hobby-garage builds (common among Paine Field and Boeing engineering staff in this area), a thickened perimeter edge beam handles heavier equipment loads without cracking at the anchor points. Fiber reinforcement runs throughout the full slab — not just rebar at the door threshold."

  - title: "Permit and HOA Approval Sequencing in Harbour Pointe"
    description: "Harbour Pointe carries active CC&Rs requiring Architectural Review Committee approval for new accessory structures. The ARC process needs elevation drawings, material specifications, and a written color-match confirmation showing the garage matches the primary residence — and it runs 2-6 weeks independently of the city building permit. Both have to be approved before construction starts, so running them in parallel from day one matters. Permit submittal to the City of Mukilteo Community Development Department requires a site plan with setback dimensions, architectural drawings, and energy code compliance documentation. Vladislav, WA Licensed Contractor, prepares the full permit package and the ARC elevation drawings in the same submittal phase. Homeowners who apply to the city first and the HOA second routinely lose 4-6 weeks they didn't need to lose."

  - title: "Cost Drivers: What Moves the Price on a Mukilteo Garage Build"
    description: "A basic detached two-car shell — slab, framing, OSB sheathing, roofing, two garage doors, and a pedestrian entry — runs $45,000–$65,000 in Mukilteo. Add Hardie lap siding to match a 1990s Harbour Pointe home, a finished interior with R-21 batts and drywall, and a sub-panel for EV and shop circuits, and that climbs to $75,000–$95,000. Stack a DADU above with a full bathroom, kitchen, and Mitsubishi mini-split for heating and cooling, and the total lands at $145,000–$195,000 depending on finish level. Key cost drivers: lot prep and existing grade, permit fees (typically $3,500–$7,000 for a DADU build), siding match complexity, and whether the DADU gets a separate utility connection. Every TopVolk quote is line-item — materials, labor, and permit fees broken out separately, not bundled into a vague lump sum. Call (206) 591-1096 for a free on-site estimate."

  - title: "Insulating and Conditioning a Garage for Year-Round Workshop Use"
    description: "An uninsulated garage in Mukilteo is cold and damp eight months of the year — not a functional workshop or hobby space. The right build for workshop use means R-21 insulation in 2x6 walls, R-38 in the ceiling, and a Mitsubishi MSZ or MXZ-series mini-split for year-round conditioning. That system also dehumidifies during the long rainy season, which matters for woodworking and finishing work where shop humidity ruins glue joints and warps stock. CertainTeed ProRoc drywall throughout keeps the space washable. Insulated garage doors — R-16 or higher polyurethane-injected panel construction — eliminate the biggest thermal gap in the building envelope. A LiftMaster 84501 belt-drive opener with Wi-Fi integration runs quietly enough that an adjacent DADU above doesn't register the door cycle. Proper weatherstripping at the door threshold and jamb seals the last gaps that insulation alone misses."

