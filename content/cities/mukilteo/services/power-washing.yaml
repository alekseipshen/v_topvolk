  - q: "Do I need a permit or HOA approval for power washing in Mukilteo?"
    a: |
      Power washing doesn't require a building permit in Mukilteo or anywhere in Snohomish County — it's a cleaning service, not a structural modification, so Snohomish County PDS has no involvement. What does matter is HOA covenants if you're in Harbour Pointe or another managed community; many HOA documents in that area specifically require exterior surfaces to be maintained in clean condition, which makes periodic washing a compliance item rather than optional. Some HOA rules also restrict wastewater runoff near storm drains. We contain and recover wash water when working near drains that discharge to Puget Sound, following Snohomish County stormwater guidelines. TopVolk is a WA Licensed Contractor — no permit paperwork on cleaning jobs, but we handle the environmental compliance side without being asked.

  - q: "What pressure do you use on cedar siding or decks — won't high pressure damage the wood?"
    a: |
      High pressure on cedar causes real, lasting damage. Cedar's soft grain opens under direct spray above 1,200 PSI, raising fibers and creating a rough surface that absorbs moisture faster and holds stain worse afterward. The correct approach for cedar siding or decking is soft-washing: a sodium hypochlorite or sodium percarbonate solution applied at low pressure via downstream injection, a 10-15 minute dwell time to break down biological material, then a low-pressure rinse at 500-800 PSI with a 40-degree nozzle to clear the loosened growth. Concrete and pavers handle direct pressure fine — we switch to a surface cleaner attachment at 2,500-3,000 PSI for flat hardscape. The equipment setup and pressure settings change with every surface type on the same job.

  - q: "How long does power washing last before moss comes back in Mukilteo's climate?"
    a: |
      On a cedar deck or north-facing surface in Mukilteo's 98275 zip, moss begins re-establishing within 12-18 months without a post-treatment preventive — Puget Sound humidity makes recolonization fast. Applying a moss inhibitor after cleaning — products like Wet & Forget left to dry on the surface, or a dilute sodium percarbonate solution — extends the clean appearance to 2-3 years on most surfaces. On properly stained cedar, the stain itself slows moss growth significantly by closing the wood grain. We write deadline commitments and scope protections into every contract; if conditions require additional passes or a follow-up visit, that gets agreed in writing before work starts. Most Mukilteo homeowners settle into a 3-year cleaning and restaining cycle as the practical maintenance schedule for cedar surfaces.

