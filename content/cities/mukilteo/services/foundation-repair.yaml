  - q: "What does foundation repair cost in Mukilteo?"
    a: |
      Concrete crack injection runs $900–$3,500 for most Mukilteo residential scopes, depending on crack length, depth, and whether movement is still active. Post-and-pier crawlspace leveling with post replacement lands between $4,000–$12,000 — the range reflects whether floor framing needs additional sister joist or LVL beam work above. Full seismic retrofits with mudsill bolting and shear wall plywood run $6,500–$18,000 for a standard single-story home. Drainage correction adds $2,000–$6,000 and is often necessary to keep the structural repair from recurring. All quotes are written and line-item after an on-site visit — no ballpark estimates over the phone. Call (206) 591-1096 to schedule a free on-site estimate with Vladislav.

  - q: "Does foundation repair in Mukilteo require a permit?"
    a: |
      Most structural foundation work in Mukilteo requires a building permit through the City of Mukilteo Community Development Department. Seismic retrofits, footing repairs, post replacements that affect the load path, and any excavation adjacent to the foundation are all permit-required scopes. Epoxy injection of non-structural shrinkage cracks typically does not require a permit, but anything involving framing or structural anchoring does. TopVolk handles permit application and plan preparation as part of the project scope; city plan review for residential structural work typically runs 3–6 weeks. Vladislav Volkov is a WA Licensed Contractor and carries all required documentation for the permit package — no extra legwork on your end.

  - q: "How do helical piers work, and when does a Mukilteo home need them?"
    a: |
      Helical piers are steel shafts with spiral helical plates that screw down through unstable surface soils to competent bearing material below — bypassing the problematic layer rather than trying to stabilize it in place. In Mukilteo, they're specified when a post-and-pier footing has settled into loose outwash soil and a simple post replacement won't hold long-term, or when an existing concrete pier has undermined from repeated water infiltration. Chance helical piers, manufactured by Hubbell Power Systems, are a standard product for residential work across the Puget Sound region and can be installed from the crawlspace or exterior without major excavation. Individual pier installation runs $900–$1,600 per pier; most jobs addressing a settling corner or room section require 4–8 piers total.

  - q: "What warranty covers foundation repair work in Mukilteo?"
    a: |
      Material warranties depend on the product used. Sika epoxy injection carries the manufacturer's material warranty; TopVolk provides a one-year labor warranty on injection work. Post-and-pier replacement and structural leveling includes a two-year labor warranty on the repair scope. Chance/Hubbell helical piers carry a 25-year manufacturer warranty on the pier hardware itself, which transfers with the property at sale. What no warranty covers: continued settlement caused by drainage problems that weren't corrected as part of the scope — which is why Vladislav typically recommends pairing structural repair with drainage correction when both issues are present. Every warranty term is written into the contract, not stated verbally at the close of a site visit.

