  - q: "Do I need a permit to install a fence in Mukilteo, and does TopVolk handle that?"
    a: |
      Standard residential fences — 6 feet or under on side and rear yards, 4 feet or under facing
      the street — generally don't require a permit in Mukilteo. The exception is fences that
      incorporate a retaining wall, or situations where the grade differential triggers engineering
      review; those projects go through the City of Mukilteo's building department or Snohomish
      County PDS depending on parcel location. Permit fees typically run $150 to $400; engineer-
      stamped drawings for wall-fence combinations add more. TopVolk manages permit applications,
      plan submissions, and AHJ inspections as part of the project — WA Licensed Contractor,
      so the pull process is handled without the homeowner chasing paperwork.

  - q: "What post depth is needed for fence posts in Mukilteo's soil?"
    a: |
      Mukilteo's clay-heavy hillside soil and year-round saturation from October through May demand
      posts set at minimum 36 inches deep — 42 inches on exposed or wind-prone lots near the bluff.
      The International Residential Code (IRC) references a frost depth of around 12 inches for the
      Seattle metro, but soil movement from moisture cycling in clay is a bigger concern here than
      frost heave. Concrete tube forms (Quikrete Fast-Setting or comparable) backfilled around
      ground-contact PT posts are the standard. For composite or steel posts, Simpson Strong-Tie
      ABA post bases anchored to a cast concrete footing above grade keep all wood out of the
      soil entirely — worth considering on lots with poor drainage.

  - q: "How long does a cedar fence last in Mukilteo, and what warranty does TopVolk provide?"
    a: |
      Cedar fence panels last 15 to 25 years in Mukilteo when installed correctly — ground-contact
      PT posts in deep concrete footings, proper board spacing, and a penetrating oil finish
      maintained every 3 to 4 years. Vinyl fence (Bufftech) carries a manufacturer lifetime
      warranty; cedar is a natural product and not covered by manufacturer warranty, but the
      workmanship itself matters more than the material warranty. TopVolk's installation workmanship
      warranty covers post lean, panel pull-through, and hardware failure for 2 years from project
      completion. Project deadlines are written into the contract with a penalty clause — if the
      job runs over schedule, there's a financial consequence on TopVolk's end, not just
      a verbal apology.

