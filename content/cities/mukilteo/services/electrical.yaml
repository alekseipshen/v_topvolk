  - q: "What does a 200A panel upgrade cost in Mukilteo?"
    a: |
      Most panel upgrades in Mukilteo fall between $2,800 and $4,500. That covers the new Square D or Eaton panel, service entrance cable, updated grounding, the City of Mukilteo permit fee, and PSE coordination for the meter pull. A detached panel location, conduit relocation, or Federal Pacific Stab-Lok removal and disposal can push the number higher. All quotes from TopVolk are line-item — no vague estimates, no demo-day surprises. The quote is free and done on-site by Vladislav, the WA Licensed Contractor doing the actual work. Call (206) 591-1096 to schedule.

  - q: "Do I need a permit for electrical work in Mukilteo, and who handles it?"
    a: |
      Yes — the City of Mukilteo Building Division requires permits for panel replacements, new dedicated circuits (EV chargers, AFCI retrofits spanning multiple circuits), and any new wiring. TopVolk pulls the permit as the WA Licensed Contractor of record; that process is not on you to navigate. Plan review for typical residential electrical work runs 1-2 weeks through the city's permit portal. PSE coordinates separately when a meter disconnect is needed during a panel swap. Permit fees are included in the project quote upfront, not added as a surprise line item at completion.

  - q: "My Harbour Pointe home has aluminum branch circuit wiring — does it need to be replaced?"
    a: |
      Not necessarily replaced — properly terminated is the goal. AlumiConn connectors at every outlet, switch, and fixture connection point, combined with CO/ALR-rated devices throughout, bring aluminum branch circuits up to current NEC without opening every wall in the house. The right first step is an audit: checking which circuits actually have aluminum conductors, inspecting connection condition at a sample of devices in each room, and verifying panel lugs are torqued correctly. Harbour Pointe homes from the late 1980s through early 1990s are the most common candidates for this work in Mukilteo. A half-day audit gives a clear picture before any remediation scope or budget is committed.

  - q: "What warranty covers electrical work done in Mukilteo?"
    a: |
      Labor is warranted for three years on all electrical work TopVolk completes in Mukilteo. Panels, breakers, and devices carry their own manufacturer warranties — Square D breakers run 10 years, Leviton and Hubbell receptacles typically 5 years, and the Tesla Wall Connector or ChargePoint unit carries its own separate terms. In Mukilteo's coastal environment, exterior connections, weatherproof fittings, and meter enclosures are checked at the 2-year labor warranty visit if any moisture concerns have come up. The project contract also includes a written deadline penalty clause — if the agreed completion date is missed, a financial penalty is owed to you. That's in writing, not a verbal reassurance.

