title: "Yelm ADU Construction — Built Around Your Septic System"

answer: "TopVolk Construction builds permitted DADUs and AADUs in Yelm, Washington — WA Licensed Contractor, 100+ projects completed since 2017."

intro: |
  Septic capacity decides more Yelm ADU projects than the building code does. TopVolk Construction designs and builds detached and attached accessory dwelling units across Thurston County, working directly with Vladislav Volkov from the first site visit through final inspection — no sales rep, no rotating project managers. A rural half-acre lot off Yelm Prairie might have room for an 800-square-foot DADU, but if the existing drainfield was sized for a three-bedroom house back in 1978, adding a rental unit means a septic evaluation before permits even get pulled. Families near Cochrane Memorial Park and along the Yelm-Tenino Trail corridor are asking for the same thing this year: a mother-in-law unit or a rental that works for JBLM families rotating through, built with a Mitsubishi mini-split instead of ducted forced air so utility costs stay separate and predictable. WA HB 1337 opened the door statewide in 2024. Getting a permit that actually clears Thurston County review is the harder part.

localContext: |
  Yelm's housing stock in 98597 runs from 1930s prairie farmhouses on acreage to manufactured homes on permanent foundations and 1990s-2000s tract homes in subdivisions off Cullens Road and the Prairie Village area near downtown. Outside city limits, in unincorporated pockets bordering 98589 toward Tenino, most lots run on private septic and well rather than municipal sewer and water — that changes the whole ADU conversation. Thurston County Environmental Health has to sign off on drainfield capacity before Thurston County Community Planning & Economic Development or the City of Yelm's own permit counter will issue a building permit for a second unit. Older homes built before 1985 often have undersized drainfields designed for the original house alone, with no reserve area ever mapped for expansion. Homes inside Yelm city limits on municipal sewer near Yelm Avenue and downtown skip the septic step entirely, which usually shaves three to five weeks off the permit timeline.

commonProblems:
  - title: "Septic Drainfield Capacity Stops ADU Plans Before They Start"
    description: "Most ADU conversations in Yelm hit a wall at the septic tank, not the setback line. Thurston County requires an on-site sewage system (OSS) evaluation before issuing an ADU permit on any lot without municipal sewer, and a lot of Yelm Prairie properties were permitted decades ago with drainfields sized for the original house only — no reserve area on file anywhere. A failed evaluation doesn't kill the project, but it adds a step: either a drainfield expansion or a supplemental unit like a Bio-Microbics aerobic system to handle the added bedroom load. Budget $1,200-$2,500 for the evaluation itself and plan on 2-3 weeks for Thurston County Environmental Health to review it. Skip this step and the building permit application won't move past intake."
  - title: "DADU, Attached ADU, or Basement Conversion — the Math Changes Fast"
    description: "A detached unit sounds simple until the drainfield math above pushes the budget past what a basement conversion would cost. Converting a daylight basement in a 1990s Yelm rancher usually means cutting an egress window — a Milgard or Pella unit sized to IRC code, at minimum 5.7 square feet of clear opening — plus running a new sub-panel for a separate electrical circuit. A detached DADU needs its own foundation, its own LVL beam header over any garage-facing opening, and typically its own utility trench. Attached ADUs split the difference: shared walls cut framing costs but still require fire separation between units. Vladislav walks every option on-site during the free consultation, because the cheapest square footage on paper isn't always the cheapest permit."
  - title: "Permits, Utility Separation, and the WA HB 1337 Question"
    description: "WA HB 1337 legalized up to two ADUs on most Yelm single-family lots starting in 2024, but the state law doesn't decide whether your unit needs a separate water meter and sewer lateral or can run off the existing service. Thurston County and the City of Yelm both allow shared utility connections for a smaller DADU, which saves the cost of a new tap fee, but a shared connection means the county sizes your existing septic or water meter for both households combined. Parking minimums are waived for lots within a half-mile of a transit stop, which covers a chunk of in-city Yelm addresses near SR-507. TopVolk Construction is a WA Licensed Contractor and handles the permit set — site plan, floor plan, utility diagram — for submittal to whichever office holds jurisdiction over your parcel."
  - title: "What a Yelm ADU Actually Costs, Line by Line"
    description: "Detached ADUs in Thurston County typically run $180-$260 per square foot once septic or utility work, foundation type, and finish level are factored in — a 600-square-foot unit lands somewhere between $130,000 and $180,000 all-in, permits included. Basement conversions run cheaper, often $90-$130 per square foot, since the foundation and roof already exist. The line items that move the number most: drainfield expansion or a new OSS, an electrical service upgrade to 200 amps if the main panel is already maxed out, and whether the kitchen gets semi-custom cabinets or IKEA boxes under a quartz counter. Every quote from TopVolk is line-item, not a range, and the contract includes a penalty clause if the finish date slips — that's written in, not promised verbally."
  - title: "Building for 37 Inches of Rain a Year"
    description: "An ADU built for Yelm's climate needs to survive wet Octobers through Mays without the moss and rot problems that show up on older prairie homes with cedar siding. Hardie cement-board siding handles that exposure better than wood over the long run, and a proper vapor barrier in the crawlspace keeps humidity out of R-49 attic insulation from underneath. For heating and cooling, a Mitsubishi mini-split outperforms a window unit through both July heat spikes and damp winters, and a Rinnai tankless water heater keeps a rental unit's utility bill separate and predictable from the main house. Expect 20-25 years out of the siding and roofing before a repaint or reroof, and budget for gutter maintenance every fall before the rains hit."

