  - q: "How fast can you get to Yelm for Adu Construction?"
    a: "Yelm sits about an hour south of Seattle down I-5 and SR-510, and Vladislav schedules on-site consultations directly — no dispatch office in between. Most Yelm and greater Thurston County ADU consultations get booked within a week of the first call, since a site visit here usually needs a look at the septic setup and well location before any design work starts. Rural driveways and gravel access roads aren't a problem; plenty of Yelm Prairie lots are already set up that way. Call (206) 591-1096 to get a date on the calendar."
  - q: "What does an ADU cost in Yelm?"
    a: "Detached ADUs in the Yelm area run $180-$260 per square foot depending on septic or utility work, foundation type, and finish package, putting a typical 600-800 square foot unit between $130,000 and $200,000 complete. Basement conversions cost less, generally $90-$130 per square foot, since the existing foundation and roof structure carry over. Site conditions swing the number more out here than in the city — a lot needing a drainfield expansion or a new well pump adds real dollars before framing even starts. TopVolk provides a free on-site estimate with line-item pricing, not a phone quote, so call (206) 591-1096 for exact numbers on your parcel."
  - q: "Do I need a permit for an ADU in Yelm, and who reviews it?"
    a: "Yes — every ADU in Thurston County needs a building permit, and which office reviews it depends on the parcel. Lots inside Yelm city limits go through the City of Yelm's own permit counter; unincorporated lots nearby go through Thurston County Community Planning & Economic Development, with Thurston County Environmental Health added in if septic is involved. Plan review typically takes 6-10 weeks for a DADU once the application is complete, longer if a septic evaluation or well test is still pending. TopVolk Construction is a WA Licensed Contractor and prepares the full permit package — site plan, floor plan, utility diagram — before submittal."
  - q: "Can my ADU run off the main house's water and septic, or does it need separate utilities?"
    a: "Depends on size and existing capacity. Thurston County allows a shared water and septic connection for smaller DADUs and basement conversions, provided the existing well flow rate and drainfield were sized (or can be re-rated) for the added bedroom load. Larger detached units, or any AADU with its own kitchen, often need a separate sewer lateral or a new septic component like a Bio-Microbics aerobic unit. TopVolk coordinates the well flow test and septic evaluation up front, before the floor plan gets finalized, so the utility question is answered before drawings are locked in, not after."
  - q: "What kind of warranty comes with an ADU build, and how long will it last?"
    a: "TopVolk backs workmanship on every ADU, and the contract includes a penalty if the completion date slips — that's a real deadline, not a soft promise. Structural components like the LVL beams, foundation, and framing are built to IRC code and should outlast the 30-year asphalt shingle roof covering them. Hardie siding and Trex or TimberTech composite decking, both common choices out here given the rain, typically go 20-30 years with basic maintenance. Mechanical equipment like a Mitsubishi mini-split or Rinnai tankless water heater carries its own manufacturer warranty on top of that, usually 10-12 years."
