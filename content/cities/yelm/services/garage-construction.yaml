title: "Yelm Garage Construction: Detached Builds & Garage DADUs"

answer: "TopVolk Construction builds and converts garages in Yelm, WA — owner-led by Vladislav Volkov, WA Licensed Contractor, 100+ projects since 2023."

intro: |
  A 24x24 detached garage in Yelm generally runs six to eight weeks from footing inspection to final sign-off once the City of Yelm Community Development Department clears the plan set, and TopVolk Construction bids every job on that real timeline instead of a guess. Vladislav Volkov owns the company and runs the estimates himself — no sales rep, no call center, just the guy who'll be on the jobsite for rough-in and framing. Out toward Tahoma Terra, half-acre and full-acre lots are common, and garage additions there usually clear setback requirements without a fight; closer to Yelm City Park and the older lots near downtown, plenty of single-car garages built in the 1970s sit too close to the property line to widen without a variance. TopVolk has built and converted garages across Thurston County since 2023, more than 100 projects total, and the LiftMaster opener and 60A EV charger circuit that go into new builds now are standard line items, not upgrades homeowners have to ask twice for.

localContext: |
  Most of Yelm proper sits inside 98597, and the service area stretches south toward 98576 near Rainier, where lots get bigger and septic systems get older. Housing stock splits pretty clean: older farmhouses and ramblers on the Yelm Prairie side with post-and-pier foundations and galvanized plumbing, and newer builder-grade homes in developments like Tahoma Terra put up after 2005 to current energy code. Because Yelm is its own incorporated city — not unincorporated Thurston County — garage permits route through the City of Yelm Community Development Department rather than Thurston County CPED, and that catches people off guard if they've pulled permits elsewhere in the county before. The prairie soil out here is clay-heavy and holds water, so footings need to sit deeper than what a lot of pole-barn outfits bid for, and standing water after a wet November is common enough that we spec a vapor barrier and a PT lumber sill plate on every slab-on-grade garage. Rainfall runs close to 50 inches a year in this part of Thurston County, so Hardie siding and a proper drip edge over the garage door matter more than most homeowners expect.

commonProblems:
  - title: "Setbacks and Property Lines Nobody Verified Before Design"
    description: "Half the garage projects that stall in plan review at the City of Yelm come down to one thing: nobody pulled a current survey before the design got drawn. A detached garage near Yelm City Park that looked fine on Google Maps came in eight inches over the side setback once the surveyor set new pins, forcing a redesign that added three weeks. TopVolk pulls a boundary survey or confirms an existing one before finalizing the plan set, checks FAR and lot coverage against the parcel, and builds the footprint the AHJ will actually approve. A survey runs $600-$1,200 depending on parcel history, cheaper than a redesign after a rejected permit."
  - title: "Converting an Attached Garage Into a Bedroom or Office"
    description: "Turning an attached garage into living space means the slab has to come up or get insulated, the overhead door opening needs a properly sized LVL beam header, and the whole space needs R-49 ceiling insulation plus wall insulation that was never there before. We've done this conversion in older Yelm ranch homes where the original rim joist and floor framing weren't sized for a habitable room, requiring sistered joists and blocking before drywall goes up. Milgard windows usually replace the old service door for code-required egress, and a Mitsubishi mini-split handles heating and cooling since the space isn't tied into the home's ductwork. Budget six to nine weeks and $28,000-$55,000 depending on finish level and whether plumbing gets added."
  - title: "Garage-Top DADUs Under WA HB 1337"
    description: "Since the 2024 statewide ADU law, a good number of Yelm homeowners want a detached garage with a livable unit built above it instead of a plain storage garage — up to two ADUs per lot is now allowed regardless of what the old city code said. That means the ground-floor slab, the ledger board and joist hangers supporting the second floor, and the stair stringer all get engineered as one structure, not tacked on after the garage is framed. Height limit for a DADU tops out around 24 feet, so roof pitch and dormer placement get worked out early with the City of Yelm plan reviewer. A kitchenette upstairs usually goes in with GE or Whirlpool appliances to keep the unit's cost reasonable. Expect four to six months start to finish including permitting."
  - title: "What Actually Drives the Price on a Yelm Garage Build"
    description: "A basic detached two-car garage runs $45,000-$70,000 in Yelm; add a DADU above it and total project cost climbs to $130,000-$200,000+ depending on finishes and utility hookups. Concrete work is the first cost driver — a 4-inch fiber-reinforced slab with proper vapor barrier costs more than the bare minimum but resists cracking through freeze-thaw cycles better. Matching Hardie siding and roofline to the existing house adds labor versus a mismatched pole-barn look. Every TopVolk quote is line-item, not a vague range, and the contract includes a penalty for missed deadlines — Vladislav eats the cost if the schedule slips on our end, not you."
  - title: "Garage Doors, Weatherstripping, and Workshop Use in a Wet Climate"
    description: "An insulated garage door matters more in Yelm than people assume, especially for anyone running a workshop or heated shop space through a Thurston County winter. Cheap weatherstripping fails within two or three winters here, letting moisture and cold air track in around the door frame and rot the jamb underneath. We install insulated steel doors rated for the opening, pair them with a LiftMaster opener wired on its own circuit, and pre-wire a 50A or 60A EV charger circuit during framing so there's no need to open drywall later for that upgrade. A well-built door and frame should last 15-20 years; the seals need checking every couple of winters."

