title: "Yelm Bathroom Remodel — Built for Well Water & Septic Homes"

answer: "A full bathroom remodel in Yelm runs $17,000-$42,000 and takes 3-6 weeks — owner-run by Vladislav Volkov, 100+ projects completed since 2017."

intro: |
  Open a wall behind a shower valve in a Yelm Prairie rancher and you'll usually find one of two things: a Moen cartridge fused solid with mineral scale from well water, or a galvanized supply line rusted down to a pinhole leak. Both are normal out here — a lot of Yelm sits outside city water service, so private wells feed the plumbing, and hard water chews through fixtures twice as fast as it does in Seattle proper. Homeowners near the Prairie Line Trail and out toward Yelm City Park call us with the same complaint: a shower that's five years old already looks and drains like it's twenty. TopVolk Construction Vladislav Volkov handles these jobs directly — no project manager relay, no sales rep upselling tile you don't need. We've run 100+ remodels since 2017 across Thurston, Pierce, King, and Snohomish counties, and a good chunk of them involve re-plumbing for hard water before we even get to the tile.

localContext: |
  Yelm's housing stock is a mix — 1970s-80s ranch homes on acreage, manufactured and mobile homes on leased or owned lots, and newer tract construction from the 2000s built out around the 98597 zip as the town grew past Yelm Prairie. Out toward 98576 near Rainier and the unincorporated county pockets, septic and well systems are the norm, not the exception, which changes how we plan a bathroom remodel — drain line slope and venting matter more when you're tied to a septic field instead of city sewer. In-city Yelm addresses pull permits through the City of Yelm Community Development office; parcels outside city limits go through Thurston County Community Planning & Economic Development (CPED) instead, and the plan review clock runs differently for each. Manufactured homes near McKenna and the JBLM-adjacent neighborhoods often have ABS drain lines and undersized subfloor framing that needs correcting before new tile goes down. None of this is exotic — it's just what building here actually requires.

commonProblems:
  - title: "Well water is destroying your shower valve and showerhead"
    description: "Most Yelm properties outside the city core run on private wells, and iron or calcium content builds up fast inside a Moen Posi-Temp cartridge or a Kohler mixing valve, causing temperature swings and eventual seizure. We usually find showerheads clogged solid within three to four years instead of the ten you'd expect on city water. The fix is a ceramic disc cartridge swap plus a showerhead rated for hard water, and if the whole house is affected we'll talk to you about a softener loop before we close the wall. Cartridge and valve replacement during a full remodel adds about $600-$900 to the job and doesn't extend the 3-6 week timeline."
  - title: "Manufactured home bathrooms with undersized framing and ABS lines"
    description: "A lot of homes around McKenna and the rural stretches near JBLM are manufactured or mobile units with 2x4 wall framing and shallow floor joists that weren't built to carry a cast-iron tub or large-format porcelain. ABS drain lines are common instead of PVC or cast iron, and they're often undersized for a new walk-in shower's drain fixture unit (DFU) load. We reframe the wet wall, add blocking for grab bars or a fixed glass panel, and upgrade the subfloor to PT plywood or DriCore before the Schluter Kerdi membrane goes in. This adds a few days to the rough-in phase but prevents soft spots and leaks down the road."
  - title: "Permit confusion between City of Yelm and Thurston County CPED"
    description: "Where your address sits matters more than most homeowners expect. Inside Yelm city limits, plumbing and structural permits route through the City of Yelm; a property a half-mile out near Yelm Prairie or toward Rainier falls under Thurston County CPED instead, with its own plan review queue and inspector schedule. Moving a toilet drain or reconfiguring a shower's DFU count triggers a plumbing permit under IRC either way — we pull it, schedule the rough-in inspection, and handle the final inspection walkthrough. TopVolk is a WA Licensed Contractor, and we prep the permit paperwork before demo starts so the project doesn't stall waiting on the AHJ."
  - title: "What actually drives bathroom remodel cost in Yelm"
    description: "A gutted 5x8 typically lands at $17,000-$25,000; a full master bath with a curbless shower, bench, and niche runs $30,000-$42,000. Tile choice moves the number more than anything else — large-format porcelain runs cheaper per square foot installed than mosaic, and a Schluter Kerdi shower pan system costs more upfront than a standard RedGard liquid membrane pan but holds up better long-term. Vanity choice matters too: semi-custom cabinets versus an IKEA base with a quartz top can swing a couple thousand dollars either way. Every quote from us is line-item, not a range, and if we miss the agreed deadline, the penalty is written into the contract."
  - title: "Exhaust fans and grout failure from PNW humidity"
    description: "Yelm doesn't get Seattle's rain totals, but Thurston County still runs damp eight months a year, and an undersized bath fan lets moisture sit in grout lines and behind drywall long enough to grow mold. Builder-grade fans from the 1990s-2000s tract era are usually rated 50-70 CFM when the room actually needs 80-110 CFM to clear humidity fast enough. We swap in a properly sized Panasonic WhisperFan tied to a humidity sensor, reseal grout with a mildew-resistant formula, and check the vapor barrier behind the shower surround. Grout should get resealed every 12-18 months; tile itself, done right with Schluter or RedGard underneath, lasts 20+ years."

faq:
  - q: "How fast can you get to Yelm for a bathroom remodel?"
    a: "We cover Yelm as part of our South Sound service area, reachable off SR 507 and SR 510 without much trouble outside JBLM commute hours. Site visits and free consultations typically get scheduled within a few days of your call. Once a contract's signed, most bathroom remodels start demo within two to three weeks depending on material lead times. Call (206) 591-1096 and Vladislav will walk the site with you directly — no sales rep in between."
  - q: "What does a full bathroom remodel cost in Yelm?"
    a: "Most jobs run $17,000-$42,000 depending on scope — a straight fixture and tile refresh sits at the low end, while a full gut with a curbless walk-in shower, new vanity, and reconfigured plumbing sits at the high end. Well water issues, septic tie-in requirements, and manufactured-home framing corrections can add cost that a city-water, standard-frame house wouldn't need. We give you a line-item quote after the on-site walkthrough, not a phone estimate. Schedule a free consultation and we'll price it exactly."
  - q: "Do I need a permit for a bathroom remodel in Yelm?"
    a: "Yes, if you're moving plumbing fixtures, changing the drain layout, or doing electrical work — cosmetic swaps like a new vanity top usually don't trigger one. In-city Yelm addresses go through the City of Yelm; unincorporated parcels near Rainier or McKenna go through Thurston County CPED. We're a WA Licensed Contractor and we handle the permit application, rough-in inspection scheduling, and final inspection so you're not chasing the AHJ yourself. Typical plan review takes one to three weeks depending on the jurisdiction's queue."
  - q: "Should I go with a curbless shower or a standard walk-in shower with a curb?"
    a: "Curbless costs more upfront because it requires reframing the subfloor for a sloped drain pan, usually with a Schluter Kerdi system, but it's the better call for aging-in-place and ADA-style access. A standard walk-in with a low curb and RedGard waterproofing runs cheaper and is fine for most households. We'll size a bench, niche, and drain placement to your layout during the consultation rather than guessing off a floor plan. Both options hold up fine against Thurston County's humidity when the membrane's installed correctly."
  - q: "What's the warranty on a TopVolk bathroom remodel?"
    a: "Workmanship is warrantied for one year after final inspection, covering things like grout cracking, caulk failure, or fixture issues tied to our install. Manufacturer warranties on items like Moen or Kohler fixtures and Schluter membrane products run separately through those brands, typically 5-25 years depending on the part. In Thurston County's humid stretch of the year, proper ventilation and sealed grout are what actually determine whether a remodel lasts 10 years or 25. We'll flag maintenance items like resealing grout before we leave the job."
  - q: "Do you cover areas near Yelm, or just the city itself?"
    a: "We work Yelm along with Rainier, McKenna, Roy, and the unincorporated Thurston County stretches around JBLM, plus our broader King, Snohomish, Pierce, and Kitsap county footprint. Scheduling windows run a few days out for consultations and two to three weeks out for project start. Every job is quoted with a deadline, and missed deadlines carry a contract penalty — not a vague apology. Call (206) 591-1096 to get on the schedule."