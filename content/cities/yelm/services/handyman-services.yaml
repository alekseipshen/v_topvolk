  - q: "Do I need a permit for a deck rail or fixture swap in Yelm?"
    a: "Basic repairs like fixture swaps, drywall patches, and railing hardware replacement generally don't need a permit under Thurston County rules, since they don't touch structural framing or add new electrical circuits. Anything involving a new circuit, moved plumbing supply lines, or structural deck framing gets pulled through the Thurston County Community Planning & Economic Development office first. TopVolk is a WA Licensed Contractor and handles that paperwork when a job crosses that line, so nothing gets flagged later during a home sale inspection."
  - q: "Can you texture-match a drywall patch on an older Yelm home?"
    a: "Yes — older farmhouses and post-war ranches near downtown Yelm often have hand-applied orange peel or knockdown texture that box-store patch kits don't replicate well. The patch gets built up with USG setting compound, sanded in stages, then matched with a hopper gun before primer and paint go on. Done right, the repair disappears even under raking light from a window. This same process applies to ceiling patches after a light fixture or smart smoke detector swap."
  - q: "What's the warranty on handyman repairs and installed parts?"
    a: "Workmanship on handyman repairs is warrantied for one year against installation defects — a leaking cartridge, a loose railing post, a patch that cracks along the seam. Material warranties follow the manufacturer: a Kohler or Moen fixture typically carries a limited lifetime warranty on the part itself, and Trex composite decking carries a 25-year fade and stain warranty. Given Thurston County's wet season, exterior wood repairs get flagged if a customer picks untreated lumber instead of PT stock, since that shortens lifespan regardless of installation quality."
