  - q: "What does a shower tile remodel cost in Yelm?"
    a: "A full shower tile rebuild, including Schluter Kerdi waterproofing, a niche, and a bench, typically runs $4,500-$8,000 depending on tile size and glass enclosure choice. Standard porcelain keeps costs on the lower end; large-format tile or natural stone with sealing pushes it higher. Well water conditions here also factor into grout selection, since epoxy grout costs more upfront but holds up far better against mineral staining. Every quote comes as a line-item breakdown with a free on-site estimate first — no vague ranges."
  - q: "Do I need a permit for tile work in Yelm?"
    a: "Simple tile-over-existing-substrate jobs usually don't need a permit, but anything touching plumbing, electrical for a heated floor mat, or a shower pan rebuild does. Inside city limits, that goes through the City of Yelm; addresses in unincorporated Thurston County route through Thurston County Resource Stewardship instead. TopVolk is a WA Licensed Contractor and handles the permit paperwork and inspection scheduling as part of the project, so the homeowner isn't stuck figuring out which office to call."
  - q: "What waterproofing do you use for showers in a PNW climate?"
    a: "Schluter Kerdi membrane over Kerdi-Board is the standard for tiled showers here, since it seals seams and corners better than old-school RedGard-and-cementboard setups, especially in a climate with humid winters and moss creeping across north-facing exteriors. Curbless showers get a Kerdi-Drain assembly built into a sloped mortar bed. For anyone adding a heated floor, Ditra-Heat integrates directly under the same waterproofing layer without adding extra height to the transition."
  - q: "How long does tile installation actually last?"
    a: "Properly installed porcelain tile with a Schluter waterproofing system underneath will easily run 25+ years before anything needs redoing, especially with epoxy grout resisting the mineral content in well water common around Yelm. Natural stone needs resealing every 12-18 months to hold up against etching and staining. Workmanship on waterproofing and substrate prep is warrantied — grout color fading from hard water isn't a defect, it's a maintenance item, and TopVolk explains that difference upfront."
