title: "Port Angeles Bathroom Remodel — Built for Marine Air and Older Homes"

intro: |
  The Strait of Juan de Fuca runs right past Port Angeles's front door, and that
  marine air doesn't stop at the siding. Inside older homes on the east side near
  Peabody Creek and up in the hillside neighborhoods above Lincoln Park, bathroom
  walls absorb moisture day after day — behind the tile, under the vanity, in the
  subfloor. Most homeowners don't notice until grout goes black or a baseboard
  starts to sponge. By then, drywall has usually wicked enough water to need full
  demo before any new tile can go in. TopVolk Construction has done bathroom
  remodels across the Olympic Peninsula — full gut-and-rebuild jobs where the
  previous "waterproofing" was a layer of standard drywall behind a Moen
  showerhead. Vladislav pulls the backer, applies Schluter Kerdi membrane to the
  shower walls, resets the drain with a proper Kerdi-Drain assembly, and builds it
  back so moisture has somewhere to go instead of into the framing. Port Angeles
  bathrooms need that level of waterproofing. Caulk alone won't cut it here.

localContext: |
  Port Angeles housing stock splits pretty cleanly between pre-1960s homes near
  downtown (zip 98362) and the postwar ranch-style builds that spread east and west
  from there through the 1960s and 70s. The downtown-adjacent blocks — running
  inland from the waterfront toward the community college — hold a lot of older
  Craftsman-era homes with original cast-iron drain stacks, galvanized supply
  lines, and floor drains that haven't been touched in decades. West Port Angeles
  (zip 98363), out toward the Joyce Road corridor, carries a heavier concentration
  of 1970s–80s construction: builder-grade tub surrounds, single-basin vanities,
  exhaust fans that vent into the attic instead of to the exterior. That's a mold
  setup waiting to close the loop. Clallam County's maritime climate keeps relative
  humidity elevated from October through May, and north-facing bathroom windows
  collect condensation every morning. Ventilation that meets current IRC
  requirements — 50 CFM minimum continuous or 110 CFM spot, ducted to the exterior
  — is the first thing addressed before tile work starts. Remodeling a bathroom
  without fixing airflow first just delays the next mold problem by a few years.

commonProblems:
  - title: "Failed Tub Surround Waterproofing in 1970s Ranch Homes"
    description: |
      A lot of the ranchers built between 1965 and 1982 in Port Angeles used
      one-piece fiberglass tub surrounds or individual plastic wall panels set over
      standard drywall. Both fail the same way — seams open up, water gets behind
      the panel, and the drywall disintegrates. By the time the adjacent wall shows
      moisture staining, the framing studs have been wet for a year or more. The fix
      isn't patching the seam. Full demo to the studs is required, the framing needs
      to dry out, then cement board goes up with RedGard liquid waterproofing membrane
      applied to every surface before any tile is set. A full tub-to-shower conversion
      with Schluter Kerdi waterproofing, cement board substrate, and large-format
      porcelain tile typically runs $6,500–$11,000 in the Port Angeles area, depending
      on plumbing rerouting and tile selection. Active construction time is 2–3 weeks
      after demo is complete.

  - title: "Exhaust Fans Venting Into the Attic — Mold Follows Every Time"
    description: |
      This shows up constantly in older Port Angeles homes, especially in the 98362
      zip where the housing stock is dense and mostly pre-1975. The original exhaust
      fan dumps humid air into the attic cavity instead of pushing it through a duct
      to the exterior. Attic insulation soaks it up, roof decking goes dark, and
      eventually the bathroom ceiling starts to stain or bubble. IRC requires bath
      exhaust to vent outside — no exceptions. Replacing the fan itself with a Broan
      or Panasonic unit rated at 110 CFM is a $200–$400 material cost. The duct run
      to an exterior soffit or roof cap is where the labor sits. In a one-story ranch
      with attic access, that's roughly a half-day job. In a two-story hillside home,
      it can run a full day with ceiling patching afterward. Fix the ventilation
      before putting in new tile — humidity destroys grout faster than anything else
      in this climate.

  - title: "Cast-Iron Drain Stack Rerouting in Pre-1950s Downtown Homes"
    description: |
      The older homes near downtown Port Angeles — the blocks between First and Eighth
      Streets in the 98362 zip — commonly have original cast-iron drain stacks running
      vertically through interior walls. Cast iron lasts, but rerouting it for a modern
      bathroom layout is a real trade job. Moving a toilet 12 inches or converting from
      a tub to a walk-in curbless shower means cutting into the stack and tying in with
      PVC or ABS through a proper wye fitting at the correct angle. That requires a
      permit through the City of Port Angeles Building Division and a rough-in
      inspection before the walls close. TopVolk is a WA Licensed Contractor —
      Vladislav pulls the permit, coordinates the inspection schedule, and builds the
      timeline around inspector availability, which typically runs 1–2 weeks for
      rough-in in Port Angeles. Skipping that step creates an unpermitted plumbing
      condition that flags at resale and voids coverage on subsequent water damage
      claims. It's not a corner worth cutting.

  - title: "Walk-In Shower Conversions and Layout Reconfigurations: Real Cost Breakdown"
    description: |
      Converting a standard 5-foot tub to a walk-in shower in a Port Angeles home
      isn't a flat-rate job. A basic conversion — demo the tub, set a new drain, tile
      the walls with 12x24 porcelain, install a Moen or Kohler pressure-balance valve,
      hang a frameless glass panel — runs roughly $7,500–$13,000. Add a curbless
      threshold with a Schluter Kerdi-Line linear drain, and budget another
      $1,000–$1,800 for the drain assembly and the floor slope work. Master bath
      reconfigurations that move walls — absorbing a hallway closet for a double
      vanity, for example — add structural work, possible LVL header installation,
      drywall, and electrical. Those jobs start around $18,000 and reach $35,000-plus
      for a full reconfigure. Vladislav does the on-site estimate himself — no
      salesperson, no vague ballpark. The quote is line-item so you can see exactly
      where the money goes. Call (206) 591-1096 to schedule that visit.

  - title: "Vanity and Fixture Upgrades: Where to Spend and Where It Doesn't Matter"
    description: |
      Not every Port Angeles bathroom needs a ground-up rebuild. Sometimes it's a
      30-year-old single-basin vanity with a builder-grade cultured marble top that's
      delaminating at the backsplash, and the Whirlpool or Moen cartridge faucet has
      been dripping for two years. Replacing a 36-inch vanity with a new cabinet,
      quartz top, and undermount sink runs $1,200–$2,800 in materials — less if you go
      IKEA cabinet with a custom top, more with semi-custom cabinetry. Add a Kohler
      elongated toilet (12-inch rough-in fits most Port Angeles homes), a single-handle
      Moen faucet, and recessed LED lighting on a dimmer-compatible switch, and you
      have a meaningful visual upgrade for $4,500–$8,000 installed. One non-negotiable:
      the vapor barrier behind the vanity wall and under any new flooring still goes in.
      Cosmetic upgrades over compromised substrate just delay the next failure.

faq:
  - q: "How far is Port Angeles from your base, and how does scheduling work?"
    a: |
      Port Angeles is roughly 80 miles from Seattle — about 1.5 to 2 hours depending
      on whether the Bainbridge or Kingston ferry fits the schedule, or driving around
      through US-101. For bathroom remodels, Vladislav does an on-site consultation
      before any commitment on either side. Call (206) 591-1096 to book that visit.
      Once a contract is signed and permits applied for (if needed), materials are
      ordered and work is scheduled — typical lead time is 3–5 weeks from signed
      contract to start date. Travel time is factored into the project bid upfront,
      not added as a line item surprise at invoicing.

  - q: "What does a full bathroom remodel in Port Angeles cost?"
    a: |
      Full bathroom remodels in the Port Angeles area — zip codes 98362 and 98363 —
      run from about $12,000 for a straightforward gut-and-redo (new tile, vanity,
      toilet, fixtures, lighting, vapor barrier) up to $35,000 or more for a master
      bath reconfiguration with a curbless walk-in shower, double vanity, and
      structural changes. The biggest cost drivers are plumbing relocations, whether
      the drain stack needs rerouting, and how much of the waterproofing substrate
      needs to be rebuilt from scratch. On-site estimates with Vladislav are free, and
      every quote is line-item — you see material costs, labor, and permit fees broken
      out separately. No vague ranges. Call (206) 591-1096 to set it up.

  - q: "Do you pull permits for bathroom remodels in Port Angeles, and what does that process look like?"
    a: |
      Plumbing reroutes, structural changes, and electrical work all require permits
      through the City of Port Angeles Building Division. Purely cosmetic work —
      swapping a vanity, replacing fixtures, retiling over solid existing substrate —
      typically doesn't require a permit. Anything touching the drain stack, moving a
      toilet, or reconfiguring a shower definitely does. TopVolk is a WA Licensed
      Contractor and handles permit applications directly — Vladislav prepares the
      drawings and submits to the city. Port Angeles Building Division typically
      reviews residential bathroom permits in 2–4 weeks. Rough-in inspection happens
      before walls close; final inspection wraps the job. Unpermitted plumbing work
      shows up at every resale inspection. It's not worth the risk.

  - q: "What waterproofing systems do you use in Port Angeles showers, and why does it matter here specifically?"
    a: |
      Cement board alone is not a waterproof substrate — water migrates through the
      joints and the board absorbs moisture over time. In Port Angeles's climate, with
      marine humidity running high most of the year, that failure mode is faster than
      in drier regions. For shower walls, Schluter Kerdi membrane gets bonded directly
      to cement board, with Kerdi-Band at all seams and inside corners. Shower floors
      use either Kerdi or a hot-mopped liner tied into the drain body. For curbless
      designs, a Schluter Kerdi-Line linear drain is set with the floor sloped 1/4
      inch per foot toward the drain. RedGard liquid membrane works well for smaller
      applications and secondary waterproofing on niche backs. Both systems are
      reliable — the failure point is always the transitions and corners, which is
      exactly where the time gets spent on installation.

  - q: "How long does a Port Angeles bathroom remodel take from start to finish?"
    a: |
      A mid-size bathroom gut-and-rebuild — demo, waterproofing membrane, tile, vanity,
      fixtures, paint — takes 3–5 weeks of active construction once permits are issued
      and materials are on-site. If plumbing or electrical permits are required, add
      2–4 weeks before work starts for City of Port Angeles plan review. Full master
      bath reconfigurations with layout changes run 6–10 weeks of construction. Tile
      and semi-custom vanity lead times add another 2–4 weeks depending on supplier.
      End-to-end, from signed contract to blue tape walkthrough, a complex Port Angeles
      bathroom remodel realistically runs 3–4 months. That timeline goes into the
      contract — and if TopVolk misses a milestone without a documented reason, there
      are penalty provisions written in.

  - q: "Do you work in Sequim, or other parts of Clallam County?"
    a: |
      Yes. TopVolk takes projects across Clallam County — Sequim, Joyce, Agnew, and
      unincorporated areas along the US-101 corridor. Sequim has its own permit center
      for city-limits work; unincorporated Clallam County goes through the Clallam
      County Department of Community Development. Western Clallam County (Forks area)
      is case-by-case based on project scope and logistics. Olympic Peninsula projects
      run from the same scheduling queue as King and Snohomish County work — a few
      weeks of flexibility on start date usually makes it workable. Call (206) 591-1096
      to talk through timing and whether the project scope fits what TopVolk does.