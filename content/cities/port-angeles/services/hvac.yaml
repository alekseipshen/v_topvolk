title: "Port Angeles HVAC — Heat Pumps Built for the Rain Shadow"

answer: "HVAC contractors in Port Angeles install heat pumps, ductless mini-splits, and furnaces — WA Licensed, free on-site estimates, most jobs booked within a week."

intro: |
  A 1948 mill-town bungalow near Race Street with a wheezing oil furnace and a 60-amp electrical panel is the single most common HVAC call in Port Angeles — the furnace is dying, the panel can't handle a heat pump without an upgrade, and the homeowner wants both fixed before the first cold snap off the Strait. Heat pumps, ductless mini-splits, and 95%+ AFUE furnace swaps make up most of the work here, not because Port Angeles freezes like a mountain town, but because the Olympic rain shadow keeps winters mild enough that a cold-climate heat pump — a Mitsubishi Hyper-Heat unit, say — can carry a whole house without ever firing a backup strip. Homes near Lincoln Park and out toward Deer Park Heights still run on baseboard electric or propane wall furnaces from the Rayonier mill-town era, and converting those to heat pumps is where the Inflation Reduction Act rebate money is actually landing. Call (206) 591-1096 and get a load calc and a real number, not a phone-quote guess.

localContext: |
  Port Angeles housing splits pretty cleanly by era. Down near downtown and the Eastside, in the 98362 zip, you've got mill-town cottages and bungalows from the 1920s-1940s — knob-and-tube long since replaced in most, but plenty still running a 60- or 100-amp panel that won't support a heat pump without a service upgrade. Out toward Deer Park Heights and the west side near the airport, also mostly 98362 with some 98363 mailing addresses, ranch homes from the 1960s-70s dominate, usually with galvanized forced-air ductwork that's never been resized even after additions. The Olympic rain shadow means Port Angeles gets maybe 25 inches of rain a year — roughly half of Seattle's — but the humidity off the Strait of Juan de Fuca still corrodes outdoor condenser coils faster than inland installs, and crawlspace ductwork needs a real vapor barrier or it sweats all winter. Any furnace or heat pump swap over a certain BTU threshold needs a mechanical permit through the City of Port Angeles Building Division, with Washington State Energy Code load calcs on file before the rough-in inspection.

commonProblems:
  - title: "Baseboard Electric and Oil Furnace Conversions to Heat Pumps"
    description: "Most pre-1980 homes near downtown and the Eastside were built with electric baseboard heat or an oil-fired furnace tucked in a crawlspace closet, and both are expensive to run compared to a modern heat pump. Converting means running a new 240V circuit from the panel to an outdoor condenser — often a Mitsubishi or Amana cold-climate unit — plus a refrigerant line set through the exterior wall to a wall-mounted air handler. Homes with a 60- or 100-amp panel usually need a service upgrade to 150 or 200 amps before the dedicated circuit will pass inspection. A single-zone Mitsubishi Hyper-Heat conversion typically runs $6,500-$9,500 installed before IRA heat pump rebates, which can knock $2,000+ off the total. Most jobs take two to three days once the panel work is scheduled."
  - title: "Ductless Mini-Split Installs for ADUs and Additions"
    description: "West side and Deer Park Heights homeowners adding a DADU or finishing a bonus room over the garage almost always need a standalone heating and cooling source, since tying into the main ductwork isn't practical for a detached structure. A single-zone Daikin or Samsung mini-split — outdoor compressor, wall-mounted head unit, and a condensate pump if there's no gravity drain — handles a 400-600 sq ft ADU without touching the main system's static pressure. Line sets get routed through a 3-inch wall penetration, brazed and pressure-tested before the line is charged with refrigerant. Multi-zone systems, two or three heads off one outdoor unit, run $9,000-$14,000 depending on head count and line length. Installs generally take three to four days including electrical for a dedicated disconnect box."
  - title: "Permits and Venting Code on Furnace and Heat Pump Replacements"
    description: "Swapping a furnace or adding a heat pump in Port Angeles requires a mechanical permit through the City of Port Angeles Building Division, or Clallam County Department of Community Development for homes outside city limits toward Dry Creek and Agnew. A 95%+ AFUE furnace vents through PVC as a Category IV appliance, a different penetration and clearance than the old metal B-vent it's replacing, and inspectors check that clearance and the condensate line slope at rough-in. Washington State Energy Code requires a Manual J load calculation on file before the permit is issued, not just a rule-of-thumb sizing. Plan review usually clears in one to two weeks for a straightforward swap, and the final inspection gets scheduled once the gas line, venting, and electrical disconnect are all in place. Skipping the permit is the most common reason a home sale gets held up at inspection."
  - title: "AC Added to Old Ductwork That Was Never Sized For It"
    description: "Bolting a Goodman or Rheem AC condenser onto ductwork that was only ever sized for a gravity gas furnace is the fastest way to end up with a system that's short-cycling and still leaves upstairs bedrooms warm. Static pressure testing at the plenum tells us whether the existing trunk and branch runs can actually handle the added airflow, or whether a return needs to be added before the condenser goes in. A basic AC add-on with adequate existing ductwork runs $4,500-$6,500; homes needing duct modifications or a larger air handler coil run closer to $7,500-$9,500. Every quote is a line-item number after the on-site visit, not a phone-quote range, and equipment carries a manufacturer parts warranty, typically 10 years registered, plus a labor warranty on the install itself."
  - title: "Filter Neglect, Coil Corrosion, and When to Repair vs. Replace"
    description: "Salt air off the Strait and Ediz Hook shortens the life of outdoor condenser coils compared to inland installs — expect to rinse coils and check refrigerant charge annually, especially on units within a mile or two of the water. A Kenmore or Frigidaire furnace from the 2000s can usually be patched for another few winters with a new igniter or blower motor, but once the heat exchanger cracks, replacement is the only code-legal fix. Ductless mini-split filters need washing every 4-6 weeks in a dusty household, and a neglected filter is still the number one reason a Mitsubishi or Daikin head unit starts icing over in January. Most forced-air furnaces last 15-20 years here; heat pumps in this mild climate often outlast their 12-15 year rated life if the coil stays clean."

faq:
  - q: "How fast can you get to Port Angeles for Hvac?"
    a: "Port Angeles sits at the end of Highway 101, and most service calls in the 98362 area get scheduled within the same week — sooner for a furnace that's fully down in winter. Access around downtown and the Eastside is straightforward; ranch homes further out toward Deer Park Heights or Dry Creek just mean a longer driveway to haul equipment up. Emergency no-heat calls get priority scheduling, and everything else gets booked around a normal work week rather than an on-call rush fee. Call (206) 591-1096 to get on the schedule or ask about same-week openings."
  - q: "What does a heat pump conversion in Port Angeles cost?"
    a: "A single-zone cold-climate heat pump conversion — a Mitsubishi Hyper-Heat or Amana system, for example — typically runs $6,500-$9,500 installed, depending on whether the electrical panel needs upgrading from 60 or 100 amps to handle the new circuit. Multi-zone systems for larger homes or full oil-to-heat-pump conversions usually land between $12,000-$18,000. Inflation Reduction Act rebates can offset $2,000 or more depending on household income and the equipment's efficiency rating. A free on-site visit gets you a line-item quote based on the actual panel, ductwork, and square footage, not a phone-quote guess."
  - q: "Do I need a permit for a furnace or heat pump replacement in Port Angeles?"
    a: "Yes — a mechanical permit goes through the City of Port Angeles Building Division for anything inside city limits, or Clallam County Department of Community Development for homes out past Dry Creek and Agnew. Permits require a Manual J load calculation and typically clear plan review in one to two weeks for a straightforward swap. A rough-in inspection checks venting and the condensate line before drywall or siding closes anything up, and a final inspection signs off before the system runs. Paperwork for the permit application, including equipment specs and the load calc, gets prepared as part of the quote."
  - q: "What's the difference between a heat pump and a ductless mini-split?"
    a: "A central heat pump ties into existing ductwork and an air handler, heating and cooling the whole house through the same supply and return system a furnace would use. A ductless mini-split — Mitsubishi, Daikin, and Samsung all make solid cold-climate versions — skips ductwork entirely, using a wall-mounted head unit connected to an outdoor compressor by a refrigerant line set, which is why they're the standard fix for additions, ADUs, and rooms a furnace's ductwork never reached. Both qualify for the same efficiency-based rebates. Which one makes sense depends on whether the ductwork already exists and can handle the added static pressure."
  - q: "How long do heat pumps and furnaces last in Port Angeles's climate?"
    a: "Forced-air furnaces typically last 15-20 years here, and cold-climate heat pumps often reach 15 years or more since the mild rain-shadow climate means the compressor isn't working as hard as it would east of the mountains. Manufacturer parts warranties on Amana, Samsung, and Goodman equipment usually run 10 years when the unit is registered within 60 days of install, and installation labor carries its own separate warranty. Coastal salt air near Ediz Hook and the waterfront shortens condenser coil life somewhat, so annual coil rinsing is worth doing even without a full service plan. Skipping filter changes is still the single biggest cause of early compressor failure."
  - q: "Do you cover areas outside Port Angeles, like Sequim or Joyce?"
    a: "Yes — Sequim, Port Townsend, and the smaller communities out toward Joyce and Beaver on Highway 112 are all within the regular service area, along with Clallam County's unincorporated pockets. Travel time from Port Angeles out to Sequim or Joyce is usually under 30 minutes, so multi-property jobs for landlords with rentals across Clallam County are easy to bundle into one visit. Scheduling generally runs on a one-to-two-week window for non-emergency work, tighter for a no-heat call in the middle of winter. Call (206) 591-1096 to check current openings for your area."