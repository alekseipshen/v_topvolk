  - q: "What does power washing a house exterior in Port Angeles cost?"
    a: "A full exterior wash — siding, driveway, and a deck or fence section — usually runs $400-$800 total, depending on square footage and whether we're soft-washing cedar shake versus straight pressure on concrete. Homes with stucco or EIFS finishes sometimes cost more since those need a slower, low-pressure chemical process instead of a quick blast. We give a line-item price on-site, not a phone estimate, so nothing changes once the truck shows up. Call (206) 591-1096 and we'll set a time to walk the property."
  - q: "Does power washing in Port Angeles require a permit or HOA approval?"
    a: "The City of Port Angeles doesn't require a permit for exterior pressure washing on a single-family home. Some HOA-governed areas near Del Hur do specify runoff containment or approved wash windows to protect shared landscaping, so we check that during the initial call if the property's in one of those developments. TopVolk Construction is a WA Licensed Contractor, and any repair work uncovered during the wash — rotted trim, a failing ledger board — gets scoped and permitted separately if it crosses into King County DPER or local jurisdiction requirements."
  - q: "Will pressure washing damage my cedar shake roof or Hardie siding?"
    a: "Not if the pressure and nozzle are matched to the material — that's the actual risk, not power washing itself. Cedar shake gets a soft wash with a sodium hypochlorite solution through a downstream injector, never direct high-PSI spray, since granule and shake damage happens fast otherwise. Hardie siding tolerates moderate pressure but we still keep it under 1,500 PSI near caulk joints and J-channel trim. We adjust nozzle and chemical mix per surface, not one setting for the whole house."
  - q: "How long does a power wash last in Port Angeles's climate?"
    a: "Roofs and decks on shaded, north-facing exposures typically need a rewash every 12-18 months because of how much moss regrows in this rain-shadow-but-still-humid climate. Sunnier siding and driveways can stretch to 2-3 years, especially if we seal concrete or apply a stain after washing the deck. Salt air off the Strait speeds up regrowth on waterfront-facing homes compared to inland properties. We don't warranty against new organic growth since that's a maintenance cycle, not a workmanship issue, but the wash and prep work itself is guaranteed."
  - q: "Do you cover areas outside Port Angeles too?"
    a: "Yes — we run jobs through Sequim, Port Townsend, and other Clallam County communities on the same scheduling loop as Port Angeles, so bundling a wash with a neighbor or nearby property sometimes shortens the wait. Typical scheduling window across the peninsula runs 1-2 weeks, occasionally faster in shoulder season. TopVolk Construction has completed 100+ projects since 2023 across the greater service area, all owner-led with Vladislav on-site. Call (206) 591-1096 or ask about a free consultation to get on the calendar."