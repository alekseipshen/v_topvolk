title: "Port Angeles Plumbing — Repipes, Tankless & Fixture Work"

answer: "TopVolk repipes galvanized lines and installs Rinnai/Navien tankless systems during remodels in Port Angeles — WA Licensed, 100+ projects since 2023."

intro: |
  Old galvanized supply lines rust from the inside out, and by the time a Port Angeles homeowner notices low pressure at the kitchen sink, the pipe is usually 70% closed off with rust scale. TopVolk Construction handles this the way it should be handled — as part of a full bathroom or kitchen remodel, not a quick patch job. Vladislav Volkov, the owner, has pulled galvanized branch lines out of houses near Downtown Port Angeles and the older blocks off Race Street where homes were built before city water pressure got regulated. A lot of these houses still run a Whirlpool tank water heater from a decade-plus ago, feeding fixtures that were never meant to handle 90+ psi off the main. Near Lincoln Park and the Eastside neighborhoods, the mix of 1940s bungalows and 1970s additions means every remodel turns up something different behind the wall — sometimes copper, sometimes galvanized steel, occasionally both spliced together. TopVolk prices the plumbing scope with line items, not a guess, and the deadline written into the contract carries a penalty if it slips.

localContext: |
  Port Angeles splits mainly across 98362 and 98363, and the housing stock reflects the timeline of the mill town itself — a good share of homes near the downtown core and the Westside, closer to Peninsula College, date to the 1940s and 50s with galvanized steel supply lines and cast iron drains still in the crawlspace. Newer construction toward the eastern edge of town, out past Golf Course Road, tends to run copper or PEX from the start. Rain here isn't Seattle-heavy but it's constant enough — crawlspaces along Dry Creek and the lower Westside stay damp from October through May, which means vapor barriers and proper crawlspace access matter more than people think when a repipe or drain reroute is underway. Any water heater swap or gas line upsize for a tankless unit needs a permit through the City of Port Angeles building department, and seismic strapping is required by WA state code regardless of tank size. TopVolk builds permit time into every project timeline instead of treating it as an afterthought.

commonProblems:
  - title: "Galvanized supply lines choking off water pressure"
    description: "Galvanized steel pipe corrodes internally over decades, and by the time a home near downtown Port Angeles is 60-70 years old, the inside diameter of a 3/4-inch line can be cut nearly in half by rust scale (tuberculation is the technical term). TopVolk repipes these runs in PEX or copper during a bathroom or kitchen remodel, swapping out old shutoff valves and installing Moen or Kohler fixtures at the same time so the new pressure doesn't just expose a worn-out faucet cartridge. A full-house repipe on a single-story home usually runs $8,000-$14,000 depending on access and fixture count. Crawlspace access on Westside homes tends to be tight, which adds labor time versus a home with a full basement."
  - title: "Tankless conversion needs a bigger gas line, not just a new unit"
    description: "Swapping a Whirlpool or GE tank water heater for a Rinnai or Navien tankless unit sounds simple until the gas line gets measured. Most older Port Angeles homes were plumbed with 1/2-inch gas line sized for a 40,000 BTU tank heater, and a tankless unit pulling 150,000-199,000 BTU needs a larger trunk line, sometimes CSST run from the meter, to fire properly under load. Skip that step and the unit will throttle or trip on low gas pressure the first time someone runs the dishwasher and a shower at once. TopVolk sizes the gas line as part of the tankless install, not as a change order discovered mid-project, and coordinates the mechanical inspection with the City permit."
  - title: "Water heater replacement without a permit is a real problem, not a formality"
    description: "Washington state code requires a permit and seismic strapping on any water heater replacement, tank or tankless, and the City of Port Angeles building department checks for both at inspection. Homeowners who swap a unit themselves or hire an unlicensed handyman often skip the strapping — two straps, one in the upper third of the tank and one in the lower third, both anchored to framing. TopVolk is a WA Licensed Contractor and pulls the permit before work starts, not after a neighbor complains or a home sale inspection flags it. Rough-in and final inspection typically add 3-5 business days to the timeline, and that's built into the schedule up front rather than treated as a surprise delay."
  - title: "What a repipe or fixture remodel actually costs, and why the range is wide"
    description: "Pricing on plumbing scope depends on three things: how much pipe has to come out, how many fixtures get replaced, and how hard the access is. A single bathroom remodel with new supply lines, a Kohler toilet, and a Moen shower valve runs $4,500-$9,000 as part of the broader project; a kitchen island drain reroute with a new P-trap and vent run adds $1,500-$3,000 depending on joist layout underneath. TopVolk gives a written quote with line items — pipe, fixtures, permit fees, labor — instead of a range that leaves the homeowner guessing. Deadlines are in the contract with a penalty attached if TopVolk misses them, which isn't standard in this trade."
  - title: "Drain reroutes and fixture upgrades during a remodel — what holds up over time"
    description: "Rerouting a drain line for a kitchen island or a basement bathroom means cutting into floor joists, and that work has to respect load-bearing framing — sistering a joist or adding blocking where a drain run crosses structural members. PEX supply lines run 40+ years without the corrosion problem galvanized pipe has, and PT lumber gets used anywhere framing sits near a crawlspace vapor barrier or ground contact. Moen and Kohler fixtures installed during a remodel typically carry manufacturer warranties of 5-10 years on cartridges and finishes, longer than most builder-grade fixtures already in Port Angeles homes from the 80s and 90s. TopVolk replaces old shutoff valves at the same time, since a valve that won't fully close is often the reason a small leak turns into a bigger repair later."

