title: "Port Angeles ADU Construction: DADUs & Basement Units"

answer: "TopVolk Construction builds DADUs, attached ADUs, and basement conversions in Port Angeles, WA — WA Licensed Contractor, owner-led, permits handled directly."

intro: |
  A legal second unit on a standard Port Angeles lot can go in as a detached backyard cottage, an addition over the garage, or a finished basement with its own entrance — and under WA HB 1337, most single-family parcels here qualify for two. Port Angeles doesn't have Seattle's land prices, but it has something almost as valuable for a landlord: Peninsula College pulls in students who need housing every fall, and the paper mill and Coast Guard Air Station keep a steady stream of workers looking for a rental near downtown or the Ediz Hook waterfront — the kind of tenant who wants a stacked GE washer/dryer and a full kitchen, not a shared laundry room down the hall. A lot of the housing stock near Lincoln Park and the Race Street corridor was built for mill families in the 1940s and 50s, with detached garages and crawlspace basements that were never meant to be lived in — which means before framing starts, most of these projects need new footings, a sistered joist or two, and a proper vapor barrier. TopVolk Construction has handled ADU projects like this since 2023, working directly with owner Vladislav Volkov from the first sketch through the final inspection. Call (206) 591-1096 to talk through what your lot can legally hold.

localContext: |
  Most of Port Angeles falls under zip code 98362, with 98363 covering the PO boxes downtown near the courthouse — but the housing behind both numbers tells a similar story. East Port Angeles, out past Golf Course Road, has more 1970s and 80s ranch homes with attached garages that convert well into an AADU with a shared electrical panel. West Port Angeles and the blocks up toward Mount Angeles Road still have a good number of 1940s mill-era cottages on post-and-pier foundations, which need cripple wall bracing and a real footing before you can stack a second story or tie in a DADU's utility line. Permits here run through the City of Port Angeles Community & Economic Development Department, not King County DPER or Seattle SDCI — a smaller office, but plan review still takes 6-10 weeks for a detached unit. Olympic Peninsula rain — over 25 inches a year, with moss creeping across every north-facing roof by February — means Hardie siding and a real vapor barrier get specced in every crawlspace conversion, not just the ones with obvious rot.

commonProblems:
  - title: "Deciding Between a DADU, an Attached Unit, and a Basement Conversion"
    description: "WA HB 1337 lets most Port Angeles lots carry two ADUs — a detached unit plus an attached one, or a DADU plus a basement conversion — but the right call depends on your foundation and your budget. A detached unit behind a 1950s cottage on Front Street needs new footings and often a PSL post and LVL beam to carry the roof load, which adds $15K-$25K before framing even starts. A basement conversion under an existing ranch on the east side can be cheaper if the crawlspace already has 7-foot ceilings, but it still needs a sistered joist here and there and a proper egress window cut into the foundation wall. We run the numbers on all three options — DADU, AADU, basement — during the free on-site walkthrough, with Vladislav pricing each one separately instead of quoting one option and hoping it fits."
  - title: "Separate Water, Sewer, and Electrical Hookups for a Legal Rental"
    description: "A DADU that's going to earn rent needs its own utility connection, or at least a code-compliant shared one, and Port Angeles City Light and the city's water division both have their own application process separate from the building permit. Running a new water line usually means trenching from the main to a stub near the rim joist of the existing house, then tying in a Rinnai or Navien tankless unit in the new unit so you're not sharing hot water capacity with the main house. Electrical is its own subpanel, sized for a mini-split and a kitchen circuit, not just an extension cord run from the garage. Skipping this step is the fastest way to fail a final inspection — inspectors here check the meter setup before they'll sign off. Budget another $8K-$14K for utility separation on top of the shell, depending on how far the unit sits from the existing service line."
  - title: "Height Limits, Setbacks, and Lot Coverage Under Port Angeles's Municipal Code"
    description: "Port Angeles caps most detached units at 24 feet and requires a minimum setback from the rear and side property lines — usually 5 feet, though corner lots and anything near the bluff above the Strait get extra scrutiny. Lot coverage matters too: older lots in West Port Angeles were platted small, and adding a 600-square-foot DADU can push a property close to its maximum coverage once you count the existing house, garage, and any deck. The city's Community & Economic Development Department handles plan review, and WA HB 1337 also waives the off-street parking requirement for ADUs within a half-mile of a transit stop, which helps on some of the tighter downtown-adjacent lots. TopVolk pulls the survey and checks setback and height against your specific parcel before drawing anything, so the plan review doesn't bounce back with a redline on page one. As a WA Licensed Contractor, TopVolk handles the permit application and the AHJ correspondence directly — no separate permit expediter fee."
  - title: "What an ADU Actually Costs in Port Angeles"
    description: "Basement conversions here typically run $60K-$95K, and a ground-up DADU runs $130K-$180K once utility hookups and site work are included — lower than the same unit costs in King County, but still a real number against a median household income under $50K in Port Angeles. That's why most of these projects get financed against future rental income rather than paid in cash upfront, and it's also why the quote comes back line-item instead of a range: you need to see what the footings and ledger board cost versus what cabinets and quartz counters cost before deciding where to trim scope. Every contract carries a written deadline with a penalty if we miss it — not standard in this market, but it should be."
  - title: "Keeping a New Unit Dry and the Appliances Running in Peninsula Weather"
    description: "Port Angeles sits right on the Strait, and a north-facing wall on a new DADU will grow moss within two winters if it's not detailed right — Hardie cement-board siding with a proper rain screen gap and PT lumber gets used for anything within 6 inches of grade. Inside, an R-49 attic and a vapor barrier in the crawlspace keep the humidity from turning into mold behind the drywall, which matters more here than it does on the drier east side of the Cascades. For heat, a single Mitsubishi mini-split head handles most 600-800 square foot units without needing a full duct system. On appliances, most of these units spec GE, Whirlpool, Frigidaire, or Amana — solid mid-range units that keep a renter's utility bills reasonable and don't push the project budget past what the rental income can support. Expect 20+ years out of the siding and roofing if it's maintained, and call back under warranty if anything in our scope fails early."

faq:
  - q: "How fast can you get to Port Angeles for ADU Construction?"
    a: "Port Angeles sits outside our core King-Snohomish-Pierce-Kitsap service loop, reached by Highway 101 over the Hood Canal Bridge — figure 2.5 to 3 hours from Seattle, longer if the bridge is under maintenance closures, which happen a few times a year. Because ADU work runs for months rather than a single afternoon, the site visit and the framing, rough-in, and inspection trips get scheduled around milestones instead of driving out for small tasks. Most driveways and backyards here have enough room for a materials drop without blocking the street, which helps keep the schedule on track. Expect an on-site consultation within 1-2 weeks of calling — call (206) 591-1096 to set a date and talk through your lot."
  - q: "What does a DADU or basement conversion in Port Angeles cost?"
    a: "A basement conversion typically runs $60K-$95K and a ground-up detached ADU runs $130K-$180K in Port Angeles, depending on foundation work, finish level, and how far utilities have to run from the main house. Site access, soil conditions on sloped lots near the bluff, and whether you want a full kitchen versus a kitchenette all move the number. Nobody gets a range and a handshake — the free on-site consultation ends with a line-item estimate covering framing, MEP, and finish work separately, so you can see exactly where the money goes and adjust the scope before signing anything."
  - q: "What permits does the City of Port Angeles require for an ADU?"
    a: "An ADU in Port Angeles needs a building permit through the city's Community & Economic Development Department, plus separate applications for the water and electrical hookups if the unit gets its own service. Plan review typically takes 6-10 weeks for a detached unit and a bit less for a basement conversion, since there's no new foundation footprint to review. WA HB 1337 already presumes two ADUs are allowed on most single-family lots, so the review mostly checks setback, height, and lot coverage rather than whether you're allowed to build at all. TopVolk, a WA Licensed Contractor, prepares the plan set and handles all AHJ correspondence directly with the city."
  - q: "Does an ADU need its own water heater and electrical panel?"
    a: "Most lenders and the city both want to see the new unit function independently, which means a dedicated electrical subpanel and, in almost every case, its own water heater rather than sharing capacity with the main house. TopVolk typically installs a Rinnai or Navien tankless unit in the mechanical closet, sized for one bathroom and a kitchen, paired with Moen or Kohler fixtures that hold up under daily rental use. The subpanel gets sized for the mini-split, the range, and general lighting circuits with room to spare. Skipping a dedicated panel is the most common reason a final inspection gets flagged and rescheduled."
  - q: "How long will a new ADU hold up in Port Angeles weather?"
    a: "With over 25 inches of rain a year and plenty of grey, damp stretches from October through May, the siding and roofing detail matter more than the square footage. Hardie cement-board siding with a proper rain screen and correctly flashed windows should run 25-30 years before it needs attention, well past the point most wood siding starts showing rot on a north wall. TopVolk stands behind the workmanship on framing, roofing, and siding, and comes back under warranty if flashing or trim fails early — normal wear from years of Peninsula rain isn't included, but installation defects are. Ask about the specific warranty terms during your consultation."
  - q: "Do you build ADUs outside Port Angeles on the Peninsula?"
    a: "ADU projects in Sequim and Port Townsend are also within reach, alongside regular work across King, Snohomish, Pierce, and Kitsap counties — these are project-based jobs measured in months, not single-visit repairs, so the extra drive time works out over the length of a build. Scheduling for the Peninsula fills up a few weeks in advance, especially through spring and summer when the city's plan review office is busiest. Vladislav handles every consultation himself, so you're talking to the person who'll be on-site during framing and final inspection, not a sales rep. Reach out early, even before deciding between a DADU and a basement conversion, and call (206) 591-1096 to check current availability."