title: "Port Angeles Home Additions — ADU & Second-Story Builds"

answer: "TopVolk Construction LLC builds ADUs, second-story additions, and in-law suites in Port Angeles, Washington — owner-led, 100+ projects since 2023."

intro: |
  Two ADUs on one Port Angeles lot became legal under WA HB 1337. TopVolk Construction LLC has been designing and building exactly that — DADUs, second-story additions, and mother-in-law suites. It's owner-operated work run directly by Vladislav Volkov, with 100+ projects completed since 2023 across the Olympic Peninsula and greater Puget Sound. Downtown near the City Pier, plenty of mill-worker cottages from the 1920s-40s sit on post-and-pier foundations. Those foundations need real engineering before a second story goes on top. Out toward Lincoln Park and the west side near Peninsula College, 1960s-70s ranch homes usually have more foundation capacity to start with. One recent ADU near Ediz Hook replaced a detached garage. It still had a working GE washer plumbed into it. We kept the water line and built the unit around it instead of starting the utility work from scratch. Every quote is line-item pricing, and missed deadlines carry a contract penalty in writing.

localContext: |
  Zip code 98362 covers nearly all of Port Angeles proper, from the bluff neighborhoods above the harbor down to the flats near Front Street. Zip code 98363 is the PO-box-only zip used by some downtown businesses. Housing here skews older and modest. 1920s-1950s mill-worker cottages with post-and-pier foundations cluster near downtown and the City Pier. 1960s-70s ranch homes spread toward Lincoln Park and the west side by Peninsula College. Additions on the older cottages usually mean sistering joists and adding blocking before a second story goes on. The original Douglas-fir framing was sized for one floor, not two. Permits inside city limits go through the City of Port Angeles Community & Economic Development building division. Anything in unincorporated Clallam County — out toward Agnew or Joyce — falls under Clallam County DCD instead, with its own setback and lot coverage rules. The Olympic rain shadow keeps annual rainfall closer to 25 inches instead of Seattle's 37. Wind off the Strait of Juan de Fuca still drives moisture into north-facing walls, though. That's why Hardie siding gets specced over cedar on additions more often than not.

commonProblems:
  - title: "ADU Permits Under WA HB 1337 — Two Units Where One Used to Be Allowed"
    description: "Washington's HB 1337 lets most Port Angeles lots build a DADU and an AADU together. But the zoning math still has to work. Height limit is 24 feet, and lot coverage and setbacks from the property line all get checked during plan review at the City of Port Angeles building division. We've pulled permits for DADUs behind cottages near downtown where the existing garage footprint didn't leave room for the required setback. The unit got redesigned narrower with a shed roof instead of a gable. Utility connections are usually the bigger cost driver than framing. Running a separate water line and electrical subpanel to a detached unit can add $15,000-$25,000 depending on trench length. Full DADU builds here run $130,000-$180,000 and take 4-7 months including permit review."
  - title: "Second-Story Additions on Foundations Built for One Floor"
    description: "A lot of mill-town houses near the City Pier were framed with 2x6 Douglas-fir joists. Those joists were sized for one story and a light attic, not a second floor with a bathroom on it. Before we touch the roofline, a structural engineer checks the existing footing capacity. They usually spec an LVL beam or PSL post to carry the new load down to a widened footing. Skip that step and you get bounce in the floor and cracked drywall within a year. On a recent addition off Lauridsen Boulevard, we ended up sistering three joists and pouring a new footing before framing could start. Expect $40,000-$70,000 just for the structural work on a typical second-story addition. That's on top of finish costs."
  - title: "Mother-In-Law Suites With a Separate Entrance and Real Kitchen"
    description: "A real mother-in-law suite needs its own egress window and a kitchen with a working range hood. Ideally it also gets a separate entrance, so nobody's walking through someone's bedroom to reach the driveway. Plumbing is usually the sticking point. Tying a new sink and bath into the existing waste stack means opening a wall or crawlspace to find the right tie-in. Clallam County DCD or the city building division wants that shown on the plan set before permits get issued. We spec budget-friendly, reliable appliances for these units. A Frigidaire range, Whirlpool fridge, and Kenmore washer/dryer set cover most tenant or family needs without inflating the build cost. A 500-600 sq ft attached in-law suite conversion runs $85,000-$120,000. The exact number depends on how much new plumbing is required."
  - title: "Matching Siding and Roofing on a 1930s Mill Cottage or 1960s Ranch"
    description: "Cedar shake on a 1930s cottage near downtown weathers to gray fast in the wind off the Strait. Matching a 15-year-old roof to new addition roofing almost never looks right with off-the-shelf shingles, either. We usually push clients toward Hardie fiber-cement siding on the new section instead of matching cedar exactly. It holds paint longer, and it doesn't feed the moss problem this coastal air causes on north-facing walls. For roofing, CertainTeed architectural shingles in a close-match color blend in better than people expect once weathered a season. Full re-siding to match an addition on a 1,400 sq ft house runs $12,000-$22,000. Roofing tie-ins add another $6,000-$10,000, depending on pitch and how much tear-off is needed."
  - title: "Heating the New Space Without Rebuilding the Whole System"
    description: "Extending existing ductwork into a new second story or ADU usually means the old furnace can't keep up with the added square footage. The static pressure math just doesn't work once you add another zone. On additions under 600 sq ft, a Mitsubishi mini-split head is usually cheaper and faster to install than extending ductwork. It doesn't touch the existing system at all. For a mother-in-law suite with its own kitchen and bath, we'll often add a Rinnai tankless unit instead of tying into the home's existing water heater. That way, hot water supply doesn't get stretched thin. Mini-split installs run $4,500-$7,500 per zone. Full ductwork extension with a new zone damper runs closer to $9,000-$14,000."

faq:
  - q: "How fast can you get to Port Angeles for Home Additions?"
    a: "Port Angeles sits about 2.5-3 hours from the Seattle side, depending on ferry timing. Edmonds-Kingston or the Hood Canal Bridge route both work. We schedule site visits around ferry sailings, so there's no wasted time standing on a dock. Once a project starts, work stays on-site continuously rather than dropping in and out, so parking and material staging get worked out during the first walkthrough. Design and permit prep typically takes 4-8 weeks before construction starts, depending on whether the lot falls under city or Clallam County DCD review. Call (206) 591-1096 to get a site visit on the schedule."
  - q: "What does a home addition in Port Angeles cost?"
    a: "Home additions in Port Angeles typically run $85,000 to $180,000+. The number depends on the project type — a mother-in-law suite conversion, a full second story, and a detached ADU under HB 1337 all price out differently. Utility runs, foundation work, and how much of the existing structure needs reinforcing move that number more than finish selections do. A detached unit needing a new water and sewer tap costs meaningfully more than one that can share an existing line. We give line-item quotes after a free on-site consultation, not a phone estimate. Footing conditions and existing framing vary house to house. Call (206) 591-1096 for exact pricing on your lot."
  - q: "Which permit office handles my Port Angeles addition — city or county?"
    a: "Anything inside Port Angeles city limits goes through the City of Port Angeles Community & Economic Development building division. If your address falls in unincorporated Clallam County — out past the city line toward Agnew or Joyce — Clallam County DCD reviews the plan set instead, with its own setback and lot coverage rules. Plan review typically takes 4-8 weeks for an addition or DADU. It can run longer if structural calculations need engineer stamping. We prepare the full plan set, site plan, and structural details before submission so review doesn't stall on missing paperwork. TopVolk Construction LLC is a WA Licensed Contractor and handles permit submission directly."
  - q: "Can my existing foundation support a second-story addition?"
    a: "It depends on what's under the house. A lot of Port Angeles cottages near downtown sit on post-and-pier foundations that were never poured for a second floor's load. Before any framing, we bring in a structural engineer to calculate footing capacity. They usually spec an LVL beam or PSL post to carry the new load to a widened footing or added pier. Homes on continuous poured foundations from the 1960s-70s ranch era near Lincoln Park usually have more capacity to start with. That can shave real money off the structural scope. We won't frame a second story on assumption — the engineering gets done first, every time."
  - q: "How long does a home addition hold up in Port Angeles weather?"
    a: "Framing and structural work is built to IRC code and should outlast the original house. Exterior finishes take the brunt of it, though — the wind off the Strait of Juan de Fuca and the wet months between October and May wear on siding fastest. Hardie siding and CertainTeed architectural shingles on an addition typically run 30-40 years with basic upkeep. That's well past what cedar siding manages on a north-facing wall in this climate. We warranty workmanship on every addition. Manufacturer warranties on materials like Hardie and CertainTeed cover product defects separately. Missed deadlines carry a contract penalty — that's written into every agreement, not just promised verbally."
  - q: "Do you build additions outside Port Angeles too?"
    a: "We cover the Olympic Peninsula alongside our regular service area of King, Snohomish, Pierce, and Kitsap counties. Sequim, Port Townsend, and unincorporated Clallam County job sites are all in reach. Scheduling for peninsula projects usually books 3-5 weeks out for the initial site visit. After that, it follows the same permit and construction timeline as anywhere else — 4-8 weeks of design and permitting before work starts. Vladislav handles every consultation personally. No sales rep, no subcontracted closer quoting the job over the phone. Call (206) 591-1096 or ask for a free consultation to get a date on the calendar."