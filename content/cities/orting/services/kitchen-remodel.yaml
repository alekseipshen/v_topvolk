  - q: "Do I need a permit for a kitchen remodel in Orting?"
    a: "Yes — moving plumbing, electrical, or gas lines, or touching a load-bearing wall, requires a permit whether the house is inside Orting city limits or out toward unincorporated Kapowsin and McMillin. In-town work goes through the City of Orting building department; unincorporated parcels route through Pierce County PALS instead, and the two don't always accept the same drawing set. TopVolk is a WA Licensed Contractor and handles the submittal, plan review, and inspection scheduling as part of the contract — typically 2-4 weeks of review time before demo starts on anything structural or mechanical."
  - q: "Can you convert my closed-off kitchen to an open floor plan?"
    a: "Most of the time, yes — it depends on whether the wall between the kitchen and dining room is load-bearing, which we confirm during the free walkthrough before pricing anything. If it is, we size an LVL beam and PSL posts to carry the load, coordinate the structural plan review, and frame in blocking for recessed lighting and dimmer-compatible LEDs once the ceiling's open. Homes in the older Orting Valley farmhouse stock and 1990s tract houses near Whitehawk both come up regularly for this exact change. It adds cost and 1-2 weeks of schedule time but it's the single biggest layout upgrade most homeowners ask for."
