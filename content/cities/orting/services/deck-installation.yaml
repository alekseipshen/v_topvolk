  - q: "Do I need a permit for a deck in Orting, and who handles it?"
    a: "Yes — any deck attached to the house or built more than 30 inches above grade needs a permit; inside city limits that goes through the City of Orting building department, while lots out toward South Prairie fall under Pierce County PALS. Plan review typically takes 2 to 4 weeks for a standard residential deck, and the inspector checks footing depth, ledger flashing, and guardrail height before decking boards go on. TopVolk prepares the plan set, pulls the permit, and schedules both the rough-in and final inspection as part of every contract, and is a WA Licensed Contractor for this kind of work."
  - q: "Should I go with cedar or composite decking for an Orting yard?"
    a: "Composite — Trex Transcend or TimberTech AZEK — holds up better against the moss and mildew that build up on shaded decks through an Orting winter, and it skips the sanding and re-staining cedar needs every two to three years. Cedar still looks warmer and costs less upfront, and some homeowners want that look near an older farmhouse-style home downtown. Either way, the framing underneath, joist spacing, and PT lumber post sizing need to match the decking weight and span, which TopVolk sizes per board choice rather than using one generic framing plan."
  - q: "How long will a new deck actually last here?"
    a: "A composite deck built on properly flashed framing with galvanized Simpson Strong-Tie hardware should run 25 to 30 years before the boards need replacing, matching the manufacturer warranty on Trex and TimberTech products. Footings and framing, built to code with PT lumber rated for ground contact, typically outlast the decking itself. What actually shortens a deck's life around Orting is skipped ledger flashing or shallow footings in soft valley soil — both are covered under the workmanship guarantee TopVolk includes on every contract, separate from the manufacturer's material warranty."
