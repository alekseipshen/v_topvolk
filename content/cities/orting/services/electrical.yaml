  - q: "Can you wire a circuit for a Sub-Zero or Thermador appliance during a kitchen remodel?"
    a: "Yes — dedicated circuits for Sub-Zero refrigeration, Thermador or Bosch induction ranges, and range hoods rated above standard CFM are standard on TopVolk's kitchen remodel scope. Each appliance manufacturer specifies amperage and dedicated-circuit requirements, and those get built into the load calculation before the panel schedule is finalized. Dimmer-compatible LED recessed lighting gets specified at the same time so nothing conflicts at trim-out. This gets coordinated with the general kitchen remodel timeline, not scheduled as a separate visit."
  - q: "How long does new electrical work last in Orting's climate?"
    a: "A properly permitted 200A panel with copper branch wiring and AFCI/GFCI breakers typically runs 25-30 years without major service, even with Pierce County's wet winters and crawlspace moisture. Outdoor EV charger circuits and exterior fixtures need corrosion-rated conduit and connectors given the roughly 37 inches of annual rain here. TopVolk's work includes a workmanship warranty, and the contract carries a deadline penalty if the job overruns the agreed schedule. Materials carry manufacturer warranties on top of that — Bosch, Mitsubishi, and Tesla equipment each have their own coverage terms."
