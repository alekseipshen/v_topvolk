  - q: "What's the ADU permit process like in Orting?"
    a: "Orting's building department handles ADU permits directly, reviewing against the 2021 IRC and the state's HB 1337 allowance for up to two ADUs per single-family lot. Plan review generally runs 6-10 weeks for a detached unit with its own foundation and utility connections, shorter for attached conversions. TopVolk prepares the full submittal — site plan, structural calcs, energy code forms — as part of the project, and we're a WA Licensed Contractor so the paperwork side is straightforward. Rough-in and final inspections get scheduled once framing and MEP work are complete."
  - q: "Can I put a detached ADU on my lot under HB 1337?"
    a: "Most single-family lots in Orting now qualify for at least one DADU under the 2024 statewide law, and many qualify for two ADUs total including an attached or basement unit. The main limiting factors are lot coverage, the 24-foot height cap for a detached structure, and rear setback, usually 5 feet from the property line. TopVolk checks your specific parcel against city zoning and HOA covenants (common in newer plats like Trilogy) before drawing plans. That site check happens during the free consultation, before any design fee is charged."
  - q: "How long will the ADU hold up in this climate, and what's covered?"
    a: "Built with Hardie siding, properly flashed windows (Milgard or Pella depending on budget), and R-49 attic insulation, a detached ADU should perform well for decades in Pierce County's wet winters and freeze-thaw swings near the foothills. TopVolk backs workmanship on structural and MEP work, and manufacturer warranties cover appliances and mechanical equipment like a Rinnai water heater or Mitsubishi mini-split separately. What's not covered is normal wear on finishes or damage from gutters that aren't maintained. A 12-month follow-up walkthrough is standard on every project."
  - q: "Do you cover areas near Orting, and how do I get on the schedule?"
    a: "Yes — TopVolk builds ADUs across Pierce, King, Snohomish, and Kitsap counties, including Bonney Lake, Buckley, Sumner, and Puyallup near Orting. Scheduling windows run a few weeks out depending on season, since permit-heavy ADU work gets booked ahead of summer construction. The free consultation is with Vladislav directly, not a sales team, and covers site feasibility plus a real cost estimate. Call (206) 591-1096 or ask about a free consultation to get started."