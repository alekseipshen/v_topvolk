title: "Seattle Insulation — Attic R-49, Crawl Space & Rim Joist Sealing"

intro: |
  Older homes in Ballard and Queen Anne — built between 1910 and 1930 — lose
  30-40% of their conditioned air through the attic and rim joists. That's a
  Mitsubishi mini-split working two hours longer every day to compensate for
  insulation that's compressed to half its original R-value. Vladislav Volkov at
  TopVolk Construction, WA Licensed Contractor, has handled insulation scopes on
  100+ projects across Seattle since 2017 — from blown-in cellulose attic
  upgrades to full crawl space encapsulation with vapor barrier.

localContext: |
  Zip codes 98107 (Ballard) and 98116 (West Seattle) are dense with Craftsman
  bungalows built between 1910 and 1940 — post-and-pier foundations, original
  board sheathing, and in most cases no vapor barrier in the crawl space. Those
  crawl spaces draw cold, moist air up through the subfloor from October through
  May. Add 1.5-story homes in Fremont and Wallingford (98103) with uninsulated
  knee walls, and you've got a direct cold-air path behind second-floor walls
  nobody's touched since the Eisenhower administration.

commonProblems:
  - title: "Attic Insulation Below Seattle Energy Code R-49 Minimums"
    description: >-
      Many Seattle attics in Capitol Hill (98122) and Beacon Hill (98118) still
      sit at R-19 to R-25 from fiberglass batt installed decades ago. Seattle
      Energy Code requires R-49 for attic floors in substantially renovated
      homes. Blown-in cellulose from Owens Corning or CertainTeed fills
      irregular joist bays better than batt in framing that rarely runs true —
      and both Seattle City Light and PSE offer rebates for qualifying upgrades.
  - title: "Crawl Space Moisture With No Vapor Barrier or Encapsulation"
    description: >-
      Unencapsulated crawl spaces under pre-1960 Seattle homes draw ground
      moisture through the subfloor year-round — Seattle averages 37 inches of
      rain annually, concentrated October through May. The fix: 20-mil poly
      vapor barrier on the ground, rigid foam insulation on the perimeter walls,
      and sealed vents. Without it, subfloor sheathing deteriorates and DriCore
      panels delaminate on north-facing crawl space walls that never fully dry.
  - title: "Rim Joist Air Leaks and Uninsulated Knee Walls in 1.5-Story Homes"
    description: >-
      The rim joist — where floor framing meets the foundation wall — is one of
      the largest air leakage points in Seattle's older homes. Two inches of
      closed-cell spray foam bonds directly to concrete or pressure-treated sill
      plate, sealing both air and moisture at R-12. Knee walls in 1.5-story
      bungalows across West Seattle (98116) and Ballard (98117) need mineral
      wool batt in the stud cavity plus rigid foam on the interior kneeboard
      face to stop the attic cavity behind from acting as a heat sink.

faq:
  - q: "How fast can you get to Seattle for insulation work?"
    a: >-
      TopVolk serves all Seattle zip codes out of a King County base — Capitol
      Hill, Ballard, West Seattle, Beacon Hill, Magnolia, and south toward
      Renton. Parking in denser neighborhoods can be tight; call ahead and
      Vladislav coordinates. Reach him directly at (206) 591-1096 or schedule a
      free on-site consultation — no sales rep, and deadline penalties are
      written into every contract.
  - q: "What's the difference between blown-in cellulose and fiberglass batt for a Seattle attic?"
    a: >-
      Blown-in cellulose settles around obstructions and fills irregular joist
      bays without gaps — critical in Craftsman attics where framing isn't
      perfectly square. Fiberglass batt leaves voids around penetrations and
      framing edges that show up as cold spots on an energy audit. Owens Corning
      and CertainTeed both make quality blown-in product; the result depends more
      on installation technique than brand. For pre-1940 Seattle attics, blown-in
      reliably reaches R-49 in a single pass.
  - q: "Does insulation work in Seattle require a permit from SDCI?"
    a: >-
      Standalone insulation — attic blow-in, crawl space encapsulation, rim joist
      spray foam — typically doesn't require a Seattle SDCI permit; it falls under
      routine building maintenance. When insulation is part of a larger permitted
      remodel, addition, or ADU, it rolls into the main building permit. King
      County DPER has similar rules for unincorporated areas. Typical timelines:
      attic blow-in runs one day; full crawl space encapsulation with vapor barrier
      and rigid foam takes two to three days; rim joist spray foam is usually a
      half-day scope.