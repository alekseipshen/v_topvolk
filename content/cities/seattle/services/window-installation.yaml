title: "Seattle Window Installation — Flashing and Fit for PNW Rain"

intro: |
  The craftsman bungalows running along NE 65th in Ravenna and the Colonials scattered through Mount Baker are where window replacement jobs get complicated. Original single-pane wood frames have been re-caulked until the sill is half paint, half sealant. Seattle pulls 37 inches of rain annually — a Milgard or Marvin retrofit without proper flashing membrane lapped over the housewrap means framing rot shows up in two winters. TopVolk has completed 100+ projects across King County since 2017.

localContext: |
  In zip code 98103 — Fremont and Wallingford — most of the housing stock dates to 1908-1935. Craftsman bungalows with original divided-light windows sitting on post-and-pier foundations that have shifted for a century. Rough openings in these homes are almost never perfectly square, which matters for frame shimming and interior trim fit. Down in 98118 (Rainier Valley, Columbia City), mid-century ranchers from the 1950s carry aluminum single-pane frames that turn into cold bridges every November through March.

commonProblems:
  - title: "Vinyl vs. Fiberglass: What Seattle's Climate Actually Does to Window Frames"
    description: |
      Vinyl expands and contracts more aggressively than fiberglass under the freeze-thaw cycles that hit foothill areas like North Bend and Snoqualmie — and even Shoreline sees enough cold to stress the frame corners over time. Once the geometry shifts, the seal around the insulated glass unit (IGU) fails and the window fogs permanently. Milgard's Ultra series (fiberglass) and Pella's 350 series hold their profile better through repeated wet-cold cycling. For Kirkland or Edmonds homes that see real frost, fiberglass is the defensible spec.
  - title: "Basement Egress Windows: Code, Excavation, and Lintel Work"
    description: |
      IRC Section R310 requires a minimum 5.7 sq ft net clear opening — at least 20 inches wide, 24 inches tall — with a sill no higher than 44 inches from finished floor. Cutting a new opening in a concrete or CMU foundation wall means temporary shoring, a new LVL lintel above the rough opening, and a window well with gravel drainage below. Seattle SDCI requires a permit for this scope. Plan review runs 4-8 weeks. This is not an afternoon job.
  - title: "Sound-Attenuating Glass for Homes Near I-5, I-405, and SR-520"
    description: |
      Houses in Capitol Hill (98122), Eastlake, and Montlake sit close enough to the I-5 and SR-520 interchange that standard double-pane at roughly 26 STC isn't enough. Laminated glass with an STC rating of 38+ makes a real, daily difference. Marvin's Elevate line and Milgard's SoundStar series use an acoustic interlayer bonded into the glass unit. Gaps at the jamb extension and missing acoustic backer rod kill STC performance just as fast as the wrong glass spec.

faq:
  - q: "How fast can you get to Seattle for Window Installation?"
    a: |
      All of Seattle is covered — from Magnolia (98199) to Rainier Beach (98178). Most on-site consultations get scheduled within 3-5 business days. Street parking in Capitol Hill and Queen Anne can be tight, so call (206) 591-1096 and we'll coordinate timing. Window quotes require an in-person look at existing rough openings and current flashing condition — no ballpark estimates for this kind of work.
  - q: "Milgard, Pella, or Marvin — which brand makes sense for a Seattle home?"
    a: |
      All three hold up well in PNW conditions. Milgard (originally Tacoma-based, strong dealer network across King County) is the most common call on mid-range projects here. Pella 350 and Marvin Elevate are the right move for older Craftsman homes in Wallingford or Ballard where the divided-light profile and interior wood finish need to match existing trim. The window style and budget drive the final spec — Vladislav doesn't push a single brand.
  - q: "Do I need a permit for window replacement in Seattle, and how long does the project take?"
    a: |
      Standard same-size replacements in existing openings typically skip the permit requirement at Seattle SDCI. Structural changes — new openings, egress cuts, header modifications — require a permit and plan review. A full house replacement of 10-15 windows runs 2-4 days of install once materials arrive; Milgard and Marvin lead times are currently 4-8 weeks from order. TopVolk is a WA Licensed Contractor — permits are pulled in TopVolk's name when required, and Vladislav's contracts include a penalty clause for missed deadlines. Call (206) 591-1096 to get the timeline laid out.