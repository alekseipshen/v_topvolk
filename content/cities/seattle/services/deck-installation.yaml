title: "Seattle Deck Installation — Built for PNW Rain and Code"

intro: |
  Moss colonizes north-facing cedar boards in Ballard and Capitol Hill within 18 months — faster on shaded lots near Volunteer Park. That drives most of the material conversation on every deck job in Seattle: Trex and TimberTech composite hold up through 37 inches of annual rain without spring sealing. TopVolk Construction has built permitted decks across King County since 2023. Vladislav Volkov handles every job personally, not a sales rep.

localContext: |
  The 98107 zip — Ballard, Crown Hill, Whittier Heights — has some of Seattle's densest stock of 1920s Craftsman bungalows. Those homes carry Douglas-fir rim joists that are now 80 to 100 years old, and rot hides where water shed from old rooflines into the band joist. Before any ledger board goes on, the rim condition gets checked. Seattle SDCI requires a dedicated ledger flashing inspection on permitted deck work — it catches problems invisible from the yard.

commonProblems:
  - title: "Cedar vs. Composite — The Wrong Choice Costs You Every Spring"
    description: |
      North-facing backyards in 98118 — Beacon Hill, Rainier Valley, Columbia City — stay wet October through April. Cedar without annual sealing develops moss in two seasons and starts checking by year five. Trex Transcend and TimberTech AZEK use a capped polymer surface that repels moss far better. The composite premium typically pays back in maintenance costs within four years in this climate.
  - title: "Rim Joist Rot Found at Ledger Attachment — Common on Pre-War Seattle Homes"
    description: |
      Structural deck attachment means bolting the ledger board through the rim joist with flashing membrane — Vycor or similar — at every seam. On 1920s Craftsman homes in Madrona and Mount Baker, that rim joist is often punky behind the siding. Damaged sections need sister joists or full rim replacement before the ledger goes on. Seattle SDCI inspects ledger flashing specifically — it is a required inspection stop, not a suggestion.
  - title: "Footings Too Shallow and Guardrails Out of Code"
    description: |
      Seattle's frost line is 12 inches, but SDCI plan review often specifies 18-inch footings on sloped lots in West Seattle and Beacon Hill. Ground-contact PT lumber rated .40 or higher is required for any post in soil contact. Decks above 30 inches need 36-inch guardrails with 4-inch max baluster spacing. Simpson Strong-Tie post bases and joist hangers are standard on every permitted deck — IRC load requirements are not negotiable.

faq:
  - q: "How fast can you get to Seattle for Deck Installation?"
    a: |
      Vladislav covers all of Seattle — Magnolia to Rainier Valley, Fremont to Beacon Hill. Site visits typically happen within 3 to 5 business days of your call. Call (206) 591-1096 to schedule. Permit lead times and material orders mean the earlier you call, the earlier you build.
  - q: "Trex or TimberTech — which composite deck boards hold up better in Seattle rain?"
    a: |
      Both perform well in PNW conditions. Trex Transcend is capped composite — durable and widely stocked locally. TimberTech AZEK is full cellular PVC — lighter and more stain-resistant on heavily shaded lots. Vladislav brings samples to the site visit. The right call depends on your grade, shade exposure, and budget.
  - q: "How long does a deck permit take through Seattle SDCI, and what is the full project timeline?"
    a: |
      SDCI plan review for a standard attached deck runs 4 to 8 weeks. Construction adds 2 to 4 weeks depending on size. Total end-to-end: 10 to 14 weeks from first call to final inspection. WA Licensed Contractor, 100+ projects completed since 2023. Deadline penalties are written into the contract. Call (206) 591-1096 to start.

