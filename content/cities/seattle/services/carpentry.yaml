title: "Seattle Carpentry — Craftsman Built-ins, Trim & Cedar Repair"

intro: |
  Ballard and Wallingford hold some of the best-preserved Craftsman millwork in Seattle — and some of the worst patched repairs. The blocks between Leary Way and Green Lake are full of 1920s bungalows where the original fir built-ins, window seats, and coved ceilings are either gone or badly filled with caulk and MDF. Restoring period-correct trim profiles around new Pella or Milgard window replacements requires real joinery skill. TopVolk Construction, WA Licensed Contractor, has completed 100+ projects across Seattle zip codes 98103, 98107, and 98112 since 2023. Vladislav does every site visit himself — no salesperson, no handoff.

localContext: |
  Seattle's residential stock runs old. Capitol Hill (98102), Queen Anne, and Mount Baker are dense with Craftsman and Colonial Revival homes built between 1905 and 1945 — Douglas-fir trim, post-and-pier foundations, and original millwork that's either immaculate or badly reworked by past renovations. The climate accelerates any damage: 37 inches of rain annually, heavy from October through May, means north-facing cedar fascia and unprotected exterior trim rot faster than most homeowners expect. A cracked paint film on a butt joint becomes active water intrusion by February.

commonProblems:
  - title: "Cedar fascia and soffit rot from Seattle's sustained rain season"
    description: "North-facing soffits and fascia boards on Queen Anne, Fremont, and Phinney Ridge homes absorb months of standing moisture every year. Cedar outlasts pine but still fails when step flashing is absent or the paint film breaks at a butt joint. Full replacement with new cedar stock — back-primed on all four sides before install — stops the cycle. We've also spec'd Hardie cement-board trim where owners want zero-maintenance exterior. Either way, the rafter tail connection has to be solid before any new board goes up."

  - title: "Missing or mismatched Craftsman built-ins from 1980s remodels"
    description: "Remodelers in the 1980s pulled out original window seats and flanking bookcases to open floor plans. Homeowners in Madrona (98122) and Madison Park now want them rebuilt to match the existing casing profiles in the same room. That means routing custom profiles — the 3.5-inch colonial casing at a big-box store won't match a 1925 bead-and-flat Craftsman trim. Components get fabricated in-shop and final-fit on-site. For a kitchen pantry surround around a Sub-Zero refrigerator column, that also means scribe molding and panel-ready framing built to exact appliance tolerances."

  - title: "Cracking stair stringers and loose treads in pre-war Capitol Hill homes"
    description: "A squeaking stair in a Capitol Hill or Mount Baker bungalow almost always traces to a cracked stringer, a failed glue joint between tread and riser, or both. We sister the stringer where it's compromised, replace individual treads and risers, and fasten the rebuilt assembly with construction adhesive and structural screws — not just re-nailed with 16d sinkers. Original fir treads thicker than 1-1/4 inch can usually be resurfaced rather than replaced. The finish work matters: new risers need to align with the existing painted profiles so the repair doesn't read as patched."

faq:
  - q: "How fast can you get to Seattle for a carpentry project?"
    a: "Carpentry work runs across Seattle and King County regularly — Capitol Hill, Queen Anne, Madrona, Ballard. Vladislav schedules site visits within a week of first contact. Call (206) 591-1096 to set it up. The visit is free, and you get a written line-item quote — not a verbal range that shifts after scope discovery."

  - q: "Can you build custom pantry cabinetry or built-in surrounds around a Sub-Zero or Wolf appliance?"
    a: "Yes, and it comes up often in Bellevue and Sammamish kitchens. Panel-ready integration for Sub-Zero columns and scribe molding around Wolf range hoods requires precise fitting — standard cabinetry isn't cut to those tolerances. The surround framing and custom shelving get fabricated in-shop, then final-fit on-site. Reveal dimensions get locked in at the site measure, not estimated."

  - q: "Does carpentry work in Seattle require permits, and what's the realistic timeline?"
    a: "Interior trim, built-ins, and closet organizers generally don't trigger a Seattle SDCI permit. Structural stair stringer work sometimes does — we assess that during the walkthrough and handle the filing if needed. Timeline: built-in fabrication and install typically runs 3–5 weeks; a full stair rebuild is 1–2 weeks. Deadline commitments go into the contract in writing — if we miss the agreed date, there's a financial penalty, not just an apology."