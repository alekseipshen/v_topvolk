title: "Seattle General Contracting — Permits, Trades & Real Coordination"

intro: |
  Capitol Hill Craftsman bungalows, Ballard mid-century ranchers, new construction in South Lake Union — Seattle's housing stock is wildly varied, and so are the problems that come up mid-remodel. A kitchen gut in a 1910 Queen Anne might uncover knob-and-tube wiring the moment the Bosch range hood gets roughed in. Vladislav Volkov has been managing exactly these situations since 2017, across 100+ projects in King, Snohomish, Pierce, and Kitsap counties.

localContext: |
  Seattle's zip codes tell the story: 98103 (Wallingford, Fremont) is dense with pre-1930 Craftsman homes sitting on post-and-pier foundations with galvanized plumbing still intact. Over in 98125 (Pinehurst, Meadowbrook), you're looking at 1960s split-levels where original aluminum wiring is a real concern the moment you start moving walls. Seattle SDCI handles permits for all of it — and plan review on major work runs 4 to 12 weeks depending on project scope.

commonProblems:
  - title: "Structural Surprises During Demo Blow Up the Budget"
    description: "Pull down a ceiling in a 1920s Wallingford house and you might find undersized joists, no blocking between bays, and a load-bearing wall that wasn't on any drawing. Sistering the existing joists with new lumber and installing an LVL beam to carry the load adds cost fast. Getting a structural engineer's stamp and resubmitting to SDCI adds time. Both happen more than homeowners expect."
  - title: "Multi-Trade Scheduling Falls Apart Without One Person Owning It"
    description: "Electrical rough-in can't happen until framing is done. Plumbing rough-in inspection has to clear before drywall goes up. HVAC duct runs need to be coordinated before the ceiling is closed. When a homeowner is trying to manage three separate subs — each booking their own schedule — MEP coordination breaks down fast, and inspections get missed. One missed rough-in inspection can push a project two to three weeks."
  - title: "SDCI Plan Review Delays Stall Projects Before They Start"
    description: "Seattle SDCI's online portal is the entry point for any permitted work — additions, ADUs, structural changes, full kitchen relocations. Plan review for major projects currently runs 6 to 10 weeks for a first response, sometimes longer. Submitting incomplete drawings or missing site plan details triggers a correction notice and restarts the clock. Getting the permit application right the first time is the only way to avoid that."

faq:
  - q: "How fast can you get to Seattle for a general contracting consultation?"
    a: "Vladislav covers all of Seattle — from Magnolia to Beacon Hill, West Seattle to Madison Park. Parking and traffic vary by neighborhood, so consultations are typically scheduled mornings on weekdays. Call (206) 591-1096 to set something up directly — no scheduling software, no callbacks from a receptionist."
  - q: "Do you manage projects that include Sub-Zero, Wolf, or Bosch appliance installations?"
    a: "Yes. A lot of Seattle kitchen remodels in the $80K–$150K range include Sub-Zero refrigeration, Wolf ranges, or Bosch dishwashers. Appliance rough-in — electrical circuit sizing, gas line placement, ventilation CFM for the range hood — gets coordinated with the trade subs before any finish work starts. Appliance specs drive the mechanical layout, not the other way around."
  - q: "What does the general contracting process actually look like from first call to final inspection?"
    a: "First step is an on-site walkthrough with Vladislav — not a sales rep. You get a line-item estimate, not a vague range. If you move forward, permit drawings get submitted to SDCI (or King County DPER for unincorporated areas). Once permits are issued, trade scheduling starts: demo, framing, rough-in inspections, insulation, drywall hang and tape, finish work, blue tape walkthrough, punch list, final inspection. A full kitchen remodel typically runs 6 to 10 weeks in the field after permits clear. A whole-house renovation is 4 to 8 months depending on scope. Deadline commitments are written into the contract — if TopVolk misses a milestone, there are financial penalties. That's not a talking point. It's in the paperwork."
  - q: "Can you handle ADU projects in Seattle under the new state law?"
    a: "WA HB 1337 (effective 2024) allows up to two ADUs on a single-family lot statewide — that means a DADU in the backyard plus an attached AADU, or two DADUs depending on lot coverage and setback compliance. Seattle has its own ADU design standards layered on top of state law. SDCI plan review for a new DADU typically runs 3 to 5 months end-to-end including permits and construction. Call (206) 591-1096 to talk through what your lot can actually support."
  - q: "How do you handle budget overruns when unexpected issues come up during demo?"
    a: "Every project carries a contingency line in the estimate — typically 10 to 15 percent on older Seattle homes, higher if the house predates 1940. When something unexpected turns up (and in a 98107 Ballard bungalow, it usually does), Vladislav walks you through the scope change, the cost, and the options before any work proceeds. No surprise invoices after the fact. Changes get documented in writing."