title: "Seattle Kitchen Remodel — Open-Concept Layouts for PNW Homes"

intro: |
  Craftsman bungalows through Ballard and Wallingford were built with kitchens tucked
  behind walls — tight, closed-off spaces that made sense in 1912 but fight against
  how people actually live now. Homeowners in 98117 are ripping out those galley walls
  and installing LVL beams to carry the load where a partition used to be. A Bosch
  induction range in a proper open layout performs completely differently than the same
  appliance crammed into a 9x10 box with one narrow doorway.

localContext: |
  Seattle's residential grid runs the full range — knob-and-tube-era Craftsmans on
  Capitol Hill (98102), 1960s split-levels in Shoreline, mid-century ramblers through
  Beacon Hill, and newer construction pushing into Rainier Valley. The 1960s-70s homes
  cause the most friction in kitchen remodels: 100-amp panels that can't handle modern
  induction cooking, original cabinet boxes sometimes nailed to structural framing, and
  plumbing stacks located exactly where a homeowner wants an island.

commonProblems:
  - title: "Load-Bearing Walls Blocking an Open-Concept Layout"
    description: |
      Pulling out the wall between a kitchen and dining room hits a structural question
      almost every time in Seattle's pre-war housing stock. Green Lake bungalows and
      Queen Anne Craftsmans routinely carry roof load through interior walls that look
      decorative. The solution is an engineered LVL beam or PSL post sized by a
      structural engineer — then a building permit through Seattle SDCI, followed by
      rough-in inspection before any drywall goes back up. Skipping the permit on this
      one is genuinely risky.
  - title: "100-Amp Electrical Service Too Small for Modern Appliances"
    description: |
      A Wolf dual-fuel range, Sub-Zero refrigerator, Bosch dishwasher, and undercabinet
      microwave on a 100-amp panel will trip breakers and potentially overheat wiring.
      Mid-century homes in Shoreline (98133) and Burien hit this wall constantly.
      Upgrading to 200-amp service requires a separate electrical permit coordinated with
      Seattle City Light, and the panel work needs roughed-in and inspected before
      finish work begins. Catching it during demolition costs far less than opening
      finished walls later.
  - title: "Gas Line Rerouting When the Range Changes Locations"
    description: |
      Moving a range from a back wall to a kitchen island means extending the gas line —
      and that triggers a permit and inspection through Seattle SDCI every time. The
      original flex connector serving a 1975 cooktop won't reach, and current AHJ
      requirements specify rigid black iron pipe to within six inches of the appliance.
      Wolf and Thermador ranges with high-BTU burners also require verifying the
      existing gas meter has adequate capacity. This is one step that cannot be
      improvised after the counters are in.

faq:
  - q: "How long does a kitchen remodel take in Seattle?"
    a: |
      A mid-range kitchen gut-and-rebuild typically runs 8-12 weeks from demolition to
      blue tape walkthrough. That timeline includes 6-10 weeks for Seattle SDCI plan
      review if the project involves structural changes, electrical upgrades, or gas
      line work. Cosmetic-only jobs move faster — 4-6 weeks if permits aren't required.
      Call (206) 591-1096 to walk through your scope with Vladislav directly.
  - q: "Do you work with Sub-Zero, Wolf, and Bosch appliances in Seattle kitchens?"
    a: |
      Yes — regularly. Sub-Zero refrigerators require precise cabinet cutout dimensions
      and a dedicated 20-amp circuit. Wolf ranges need gas pressure and BTU capacity
      verified against the supply line before rough-in. Bosch dishwashers are particular
      about drain height and door clearance. Vladislav reviews appliance specs before
      any rough-in work so nothing needs redoing at install. WA Licensed Contractor,
      100+ projects completed since 2017 across King and Snohomish counties.
  - q: "What permits does a Seattle kitchen remodel actually require?"
    a: |
      Structural work — removing load-bearing walls, installing LVL beams — needs a
      building permit through Seattle SDCI. Gas line modifications and panel upgrades
      each require separate trade permits. Cosmetic work like cabinet replacement, new
      countertops, and flooring typically needs no permit. Plan review for structural
      projects runs 6-10 weeks in Seattle. TopVolk handles the permit application and
      coordinates all inspections. Deadline penalties are written into every contract —
      not a talking point, an actual clause.