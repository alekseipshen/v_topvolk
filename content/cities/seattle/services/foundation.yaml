title: "Seattle Foundation Repair — Seismic Retrofits & Crawlspace"

intro: |
  Post-and-pier crawlspaces under Seattle's Craftsman bungalows weren't built for a century of Pacific Northwest rain. The city averages over 37 inches of annual precipitation, and King County's clay-heavy soils swell and shift with every wet season — October to May, without fail. One Magnolia homeowner called TopVolk after noticing her Sub-Zero refrigerator door had stopped sealing flush against the cabinet frame. The cause: her 1922 Craftsman had settled nearly 2 inches at the northeast crawlspace corner. Foundation problems announce themselves in places you'd never expect. TopVolk is a WA Licensed Contractor — Vladislav Volkov handles the assessment himself, not a salesperson. Call (206) 591-1096 to schedule a free on-site consultation.

localContext: |
  Seattle's residential housing falls into readable eras. Before-1940 homes — concentrated in zip codes 98107 (Ballard), 98103 (Wallingford and Fremont), and 98122 (Capitol Hill) — sit on post-and-pier foundations with no continuous concrete perimeter. Original wood posts, zero anchor bolts, open crawlspace framing underneath. The 1955–1975 split-levels in Shoreline (98133) and ranch homes in Kenmore (98028) added poured concrete perimeter walls, but those develop cracks as Seattle's seasonal freeze-thaw cycles apply sustained pressure through each winter. Homes near Puget Sound — Magnolia, West Seattle, and Alki — contend with elevated groundwater during the rainy season, which amplifies hydrostatic pressure on any concrete perimeter wall. Both eras have predictable, addressable vulnerabilities.

commonProblems:
  - title: "Sagging Floors from Rotted Post-and-Pier Supports"
    description: |
      Pre-1940 homes across Capitol Hill, Beacon Hill, and Queen Anne regularly have original wood posts in the crawlspace that have rotted at grade or lost bearing from shifting soil. Replacing them with adjustable steel columns — properly blocked and bearing on new concrete pads — stops the floor movement. Seattle SDCI requires permits and a rough-in inspection before crawlspace access is sealed back up. Not a DIY scope. TopVolk has completed 100+ projects since 2023 across King, Snohomish, Pierce, and Kitsap counties — this repair type comes up constantly in the pre-1940 zip codes.
  - title: "Concrete Perimeter Cracks and Water Infiltration in Mid-Century Foundations"
    description: |
      Poured concrete perimeter walls in 1960s–1970s homes across Shoreline, Kenmore, and north Seattle develop hairline to quarter-inch cracks as soil shifts seasonally. Left unaddressed through Seattle's October–May rainy season, water infiltrates and undermines the footing. Epoxy injection seals structural cracks; larger voids take polyurethane foam. Exterior French drains eliminate the hydrostatic pressure that drove the cracking to begin with.
  - title: "Missing Seismic Bracing on Pre-1980 Craftsman and Rancher Foundations"
    description: |
      Washington's Cascadia Subduction Zone risk is not hypothetical. Most Craftsman-era homes in 98107, 98117, and 98119 have no mudsill anchor bolts and no shear wall plywood panels in the cripple wall — the wood framing above the stem wall has no mechanical connection to the concrete below. A seismic retrofit installs anchor bolts, hold-down hardware, and structural plywood per WA seismic code. Seattle SDCI permits and inspections are required for all of it. Deadline penalties are written into every TopVolk contract — if the project runs long on our end, there's a documented financial consequence.

faq:
  - q: "How long does a foundation repair project in Seattle take from start to finish?"
    a: |
      Post-and-pier fieldwork on a standard Seattle Craftsman runs 2–4 days. The slow part is permitting: Seattle SDCI plan review for foundation scope currently takes 4–8 weeks before work can legally begin. A seismic retrofit adds another 5–7 fieldwork days. Call (206) 591-1096 — Vladislav will walk your crawlspace and deliver a line-item quote, not a range.
  - q: "Do you install sump pumps in Ballard or Magnolia as part of foundation work?"
    a: |
      Yes. High water table zones — Ballard (98107), Magnolia (98199), and South Park near the Duwamish River — frequently need sump pump systems as part of the foundation scope. TopVolk installs Zoeller and Wayne submersible units in gravel-bedded sump pits, integrated with the crawlspace vapor barrier. Exterior drainage redirection usually gets added at the same time to eliminate the water source.
  - q: "Does TopVolk pull the permits for foundation work, or does the homeowner handle that?"
    a: |
      TopVolk pulls all permits as part of every project scope. That's standard practice for a WA Licensed Contractor with 100+ projects completed since 2023 across King, Snohomish, Pierce, and Kitsap counties. Seattle SDCI plan review runs 4–8 weeks for foundation work. Deadline penalties are written into the contract — if the project runs long on our end, there's a documented financial consequence, not just an apology.