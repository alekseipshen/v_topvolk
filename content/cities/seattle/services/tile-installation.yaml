title: "Seattle Tile Installation — Waterproofed for PNW Humidity"

intro: |
  Craftsman bungalows in Wallingford and Capitol Hill hide a lot beneath original hex tile
  floors — rotted subfloor from dripping plumbing, moisture damage worked in behind fiberglass
  shower pans installed in the '70s, sometimes decades of it before anyone notices. Seattle's
  37 annual inches of rain gets blamed for everything, but bathroom humidity and inadequate
  ventilation cause more tile failures than weather does. TopVolk has completed 100+ remodeling
  projects across King County since 2023, including full bathroom tile scopes and kitchen
  backsplash installations around Bosch and Sub-Zero appliance setups where electrical
  relocation is part of the work. Every tile project starts with substrate assessment,
  not tile selection.

localContext: |
  Pre-1940s homes in Fremont (98103) and Beacon Hill (98144) typically have old-growth fir
  subfloors over post-and-pier foundations. Deflection in that framing — even minor seasonal
  movement from Seattle's wet winters — causes grout cracks within a few years, faster when
  the original installer skipped uncoupling membrane. Mid-century ranchers in West Seattle
  (98116) and Rainier Valley often sit on concrete slab on grade, more dimensionally stable
  but still requiring moisture vapor transmission testing before large-format porcelain goes
  down. Building age and construction type determine how much substrate work happens before
  a single piece of tile is set — and that prep is what determines whether the finished tile
  holds for a decade or for four.

commonProblems:
  - title: "Shower Waterproofing Failures Hidden Behind Tile"
    description: |
      Seattle showers built before 1985 were often tiled directly over felt paper or basic
      cement board — no true waterproofing membrane. Grout cracks open eventually. Water
      migrates behind the tile assembly and into wood framing, sometimes for years before
      visible damage appears. Schluter Kerdi sheet membrane applied over cement backer board
      stops this cycle. RedGard liquid membrane handles simpler geometries. Without a
      continuous vapor barrier behind the tile assembly, relaying tile just puts new work
      on top of whatever rot already started.

  - title: "Large-Format Porcelain on Out-of-Plane Subfloors"
    description: |
      24x48 and 32x32 porcelain slabs need a substrate flat to 1/8 inch over 10 feet —
      the ANSI A108.02 floor flatness standard. Most pre-1970 Seattle homes don't meet
      that without self-leveling underlayment first. Laser-leveling the substrate adds
      half a day of prep but eliminates lippage and prevents cracking. A Schluter Ditra
      uncoupling membrane then manages the seasonal movement common in older fir-framed
      homes in Ballard, Queen Anne, and Madrona — floors that shift with humidity cycles
      every winter.

  - title: "Electric Heated Floor Systems Under Bathroom Tile"
    description: |
      Schluter Ditra-Heat electric mats and Warmup heated floor systems come up frequently
      in Seattle bathroom remodels — especially in Magnolia and Madison Park homes where
      cold tile floors in winter are a consistent complaint. Mat layout has to account for
      fixture footprints; no heating element should run beneath a toilet flange or the base
      of a vanity. Thermostat wiring also requires an electrician's rough-in before
      installation starts. Vladislav coordinates MEP sequencing as part of the full
      remodel contract — no separate subcontractor handoffs.

