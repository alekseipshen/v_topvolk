  - q: "What tile work is included in a kitchen remodel?"
    a: |
      Backsplash tile, floor tile, and tile surrounds around ranges and hoods. Installing
      a new Bosch or Sub-Zero appliance often shifts the layout — sometimes an outlet or
      range hood circuit needs relocation before backsplash tile goes up. All of that is
      coordinated within the same contract. Deadline penalties are written in — if the
      schedule slips on Vladislav's end, he pays, not you.

  - q: "How long does a full bathroom tile job take, and when does Seattle require a permit?"
    a: |
      A shower surround with Schluter Kerdi waterproofing, a framed niche, and floor tile
      typically runs 2-3 weeks for a standard 80-100 square foot bathroom. Heated floor
      mat systems add a few days. Seattle SDCI requires a permit when structural or MEP
      work is part of the scope; plan review runs 4-8 weeks for most bathroom projects.
      Vladislav provides line-item quotes, not ballpark ranges. Call (206) 591-1096 to
      schedule a site visit.