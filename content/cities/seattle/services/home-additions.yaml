title: "Seattle Home Additions — ADUs, Second Stories & Room Expansions"

intro: |
  Ballard Craftsman owners adding a mother-in-law suite. Capitol Hill homeowners
  going up a second story. Queen Anne lots getting a DADU in the backyard under
  WA HB 1337. Seattle's housing market makes adding on the practical math —
  buying bigger here means bidding wars in the 98102-to-98112 corridor.
  Vladislav Volkov has handled 100+ addition projects across King County since
  2023, including ADU builds where clients spec'd a Bosch 800 Series dishwasher
  and full kitchen rough-in for the new unit. Additions in Seattle require
  real permit coordination and structural knowledge of the housing stock —
  not a crew that figured out additions last year.

localContext: |
  Most of Seattle's residential stock in Ballard (98107) and Wallingford (98103)
  went up between 1905 and 1940. These Craftsman bungalows sit on post-and-pier
  foundations with narrow lots — any addition triggers setback compliance reviews,
  FAR limit checks in SF zones, and a Seattle SDCI plan review that runs 4–12
  weeks for major work. Knob-and-tube wiring is still live in some of these homes,
  and walls can't close until an electrician signs off on the rough-in inspection.
  TopVolk is a WA Licensed Contractor that handles all permit coordination directly
  with the AHJ, not through a third-party expediter.

commonProblems:
  - title: "ADU Construction Under WA HB 1337 — Lot Coverage and Utility Separation"
    description: |
      Seattle allows up to two ADUs per single-family lot under the 2024 statewide
      law — but lot coverage limits, height caps (24 ft max for a DADU), and
      separate utility connections still apply. SDCI requires a full plan review
      for any new structure. Review queues run 4–12 weeks, and projects that
      trigger third-party structural review add more time before permits issue.

      Most homeowners underestimate that timeline. Building the unit is often
      faster than getting it approved. A separate electrical meter, water service
      tap, and sewer connection for the DADU each have their own inspections —
      MEP coordination has to be mapped out in the design phase, not improvised
      once framing is up.

  - title: "Foundation Capacity for Second-Story Additions"
    description: |
      Adding a second story to a 1920s Craftsman on a post-and-pier foundation
      requires a structural engineer to verify bearing capacity before design gets
      locked. LVL beams replace undersized dimensional lumber at all header
      locations. If the existing rim joist is deteriorated from decades of Seattle
      moisture, that's remediation work scoped before framing starts — not a
      surprise mid-project when walls are already open.

      Sister joists and blocking get installed wherever spans exceed code minimums
      for the added load. The engineer stamps the drawings; SDCI reviews them.
      Skipping the structural assessment to save a few weeks almost always costs
      more time later when the inspector flags it during rough-in.

  - title: "Matching Exterior Siding and Rooflines on Craftsman and Mid-Century Homes"
    description: |
      Hardie cement-board siding matches existing profiles on older Seattle homes
      and won't grow moss the way cedar shake does on north-facing walls after
      five wet winters. Dormer additions require careful flashing and ice-and-water
      shield at the valley — Seattle averages 37+ inches of rain annually. Marvin
      windows are a common spec for matching original divided-light grid patterns
      on 1920s bungalows in Magnolia and Mount Baker. A vapor barrier in the
      new crawlspace or subfloor assembly is not optional here — the climate
      demands it, and inspectors check.

faq:
  - q: "How fast can you get to Seattle for Home Additions?"
    a: |
      TopVolk is Seattle-based and covers all of King County — West Seattle to
      Northgate, Capitol Hill to Beacon Hill. On-site consultations happen within
      a few business days of your first call. You'll talk directly to Vladislav,
      not a scheduler or sales rep. Call (206) 591-1096 to set up a free site
      visit. WA Licensed Contractor, 100+ projects since 2023.

  - q: "Mini-splits or extended ductwork — what do you use for heating new addition space?"
    a: |
      Depends on the home. For most 1920s bungalows in Ballard and Fremont,
      existing ductwork doesn't reach cleanly into an addition — Mitsubishi
      mini-splits are the practical choice. Newer homes with forced-air systems
      often support a new zone with extended ductwork. MEP coordination runs
      through licensed subs with rough-in inspections scheduled before drywall
      closes. We spec this during the design phase, not after framing.

  - q: "How long does a home addition take start to finish, including Seattle permits?"
    a: |
      Seattle SDCI plan review runs 4–12 weeks depending on scope. Construction
      on a standard room addition takes 8–14 weeks after permits issue. A DADU
      built from the ground up typically runs 4–7 months end-to-end, permits
      included. TopVolk's contract includes a written deadline penalty clause —
      if we miss agreed milestone dates, that cost falls on us. Call
      (206) 591-1096 for a timeline specific to your project and lot.