title: "Seattle ADU Construction — DADU & AADU Permits, Built Right"

intro: |
  Ballard and Wallingford are packed with 1910s Craftsman bungalows sitting on
  5,000–6,000 sq ft lots — exactly the housing stock Seattle SDCI's MAP
  pre-approved ADU program was designed for. WA HB 1337 (2024) now allows two
  ADUs per single-family lot statewide, so your backyard unit or basement
  conversion is legal before you even call.

  Vladislav Volkov has completed ADUs across ZIP codes 98103, 98107, and 98115,
  with Bosch kitchenette packages spec'd for long-term rentability. Permit
  history on those parcels matters — and we pull it before the first site visit.

localContext: |
  Seattle's older housing in ZIP 98103 — the 1905–1925 post-and-pier Craftsmans
  along NW 65th — often need a vapor barrier upgrade and foundation assessment
  before any DADU goes up. Crawlspace moisture is a real constraint in a city
  that gets 37 inches of rain a year. Moss on north-facing sill plates is a
  symptom, not the problem; the problem is standing water under the slab after
  every November storm.

  Lots under 4,000 sq ft face tighter FAR and setback math.

  Meanwhile, 1980s-built ranchers in ZIP 98178 near Renton Avenue South
  typically have more usable backyard depth for a code-compliant 24-foot detached
  unit. Builder-grade framing from that era is usually sound, but original
  galvanized supply lines and undersized electrical panels need assessment before
  MEP rough-in begins. The permit jurisdiction there is still Seattle SDCI — but
  the lot geometry and existing structure change what's actually buildable.

commonProblems:
  - title: "SDCI Plan Review Delays Eating Into Rental Income"
    description: "Seattle SDCI plan review for a new DADU runs 6–12 weeks on a
      standard submittal — longer if drawings come back with red tags for missing
      setback callouts or incomplete site plans. TopVolk uses SDCI's MAP
      pre-approved plan set to cut that window to 3–4 weeks on qualifying lots.
      We've pulled permits in 98107 and 98115 using this path. The difference
      between a clean first submittal and a resubmittal cycle is often one
      thorough pre-application meeting with the AHJ. WA Licensed Contractor on
      file. Call (206) 591-1096 to check if your parcel qualifies."
  - title: "Utility Separation: Shared vs. Independent Service Line"
    description: "Every Seattle ADU project hits this fork: share the main
      dwelling's water and sewer, or run a separate service. A new line adds
      $8,000–$18,000 but makes the unit fully independent for sale or financing.
      That's a real number, not a ballpark — it depends on trench distance to
      the city main and whether you're crossing a driveway or alley. For
      shared-hot-water setups we spec a Navien NPE-180S tankless water heater —
      wall-mounted, right-sized for a studio or one-bed unit, and efficient
      enough to keep utility bills honest for your tenant."
  - title: "Setback and Lot Coverage Math Killing the Build Envelope"
    description: "A DADU in Seattle must clear 5-foot side and rear setbacks —
      but north-facing lots in Capitol Hill (98122) often have alley easements
      that shrink the buildable footprint further. Single-family zones typically
      cap lot coverage at 35%. Before a shovel moves, we run your parcel's FAR
      and lot coverage numbers with actual site data, not estimates. LVL beam
      sizing for the roof structure depends on confirmed spans — rough
      engineering happens early, not as an afterthought. Skipping that step is
      how projects hit costly change orders mid-framing."

faq:
  - q: "How fast can you start an ADU project in Seattle?"
    a: "Design and permit prep starts within two weeks of signing. SDCI plan
      review adds 4–12 weeks depending on which path your lot qualifies for —
      MAP pre-approved plans compress that significantly on standard 5,000 sq ft
      lots. Construction on a DADU typically runs 10–16 weeks after permit
      issuance. Four to seven months end-to-end is realistic for most Seattle
      parcels. Call (206) 591-1096 to schedule a free on-site walkthrough with
      Vladislav directly."
  - q: "What finishes do Seattle ADU renters expect in 2025?"
    a: "Renters in Eastside ZIP codes — Bellevue 98033, Kirkland 98034 — expect
      quartz counters, a Bosch or Samsung stainless kitchenette, and a
      Mitsubishi mini-split for year-round comfort. Units in Greenlake and
      Fremont skew toward design-forward buyers; induction ranges and
      large-format porcelain tile move the needle on rent. We've spec'd Kohler
      fixtures and LVL-framed cathedral ceilings in units now renting at
      $2,200–$2,800/month. Finish level should match the neighborhood — we'll
      tell you where the line is."
  - q: "What does a Seattle DADU cost and what's included?"
    a: "A 400–600 sq ft detached ADU in Seattle typically runs $180,000–$280,000
      — covering design, permits, foundation, framing, MEP rough-in, R-49
      insulation, drywall hang and finish, and a blue tape walkthrough before
      handover. That range shifts based on site conditions: a Craftsman lot in
      98103 with a failing crawlspace vapor barrier adds remediation cost up
      front. Utility connection costs are quoted separately. You get a
      line-item estimate, not a vague range, and deadline penalties are written
      into the contract. 100+ projects completed since 2017 across King,
      Snohomish, Pierce, and Kitsap counties."