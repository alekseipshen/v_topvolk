title: "Seattle Flooring — Hardwood & LVP Built for PNW Humidity"

intro: |
  Capitol Hill and Ballard see nearly 37 inches of rain annually, and that humidity works into your subfloor whether you notice it or not. Every hardwood install TopVolk does in Seattle starts with a moisture meter reading — skipping that step is how you end up with cupped planks by November. Homeowners in 98107 swapping out tile for engineered hardwood next to a Wolf range or Sub-Zero fridge call us when they want the job done right the first time, not twice.

  Moisture control isn't a premium add-on. It's the baseline.

localContext: |
  Seattle's housing stock runs from post-and-pier Craftsman bungalows in Wallingford (98103) to 1980s tract construction in Rainier Valley and Renton. Pre-1940 homes in Capitol Hill and Beacon Hill often have original fir subfloors with significant seasonal movement — that's a fundamentally different install than a poured slab in a newer Sammamish build. The 1960s-era split-levels in Shoreline and Kenmore frequently have old vinyl asbestos tile (VAT) buried under kitchen linoleum, which requires professional abatement before any new flooring goes down.

  Madison Park and Madrona bungalows built before 1930 often have diagonal subfloor boards running at 45 degrees — original construction technique. Installing engineered hardwood perpendicular to those boards without adding a 3/4" OSB layer first creates bounce and telegraphing. That extra layer matters. So does blocking between joists where the subfloor is soft from decades of point loads near exterior walls.

commonProblems:
  - title: "Hardwood Cupping from Skipped Acclimation"
    description: "Solid hardwood needs 4-7 days to acclimate to your home's ambient moisture before installation — rushing that step causes cupping and gapping during Seattle's wet season. In Craftsman homes on Queen Anne (98109) and Wallingford, where post-and-pier foundations allow air movement beneath the floor, moisture readings swing 8-12% between dry and wet seasons. A Wagner Meters moisture meter on both the subfloor and incoming hardwood planks is the first step before any nailing starts."
  - title: "Vinyl Asbestos Tile Found Mid-Demo"
    description: "Homes built between 1955 and 1975 in Shoreline, south Seattle, and Renton routinely have 9×9 VAT tiles under layered flooring. Disturbing asbestos-containing materials without abatement violates Seattle SDCI regulations — licensed abatement contractors are required before demolition on regulated materials. Vladislav identifies VAT during the initial site walk so abatement gets scheduled ahead of demo, not discovered after the subfloor is already exposed."
  - title: "Delaminating Engineered Hardwood Over a Wet Subfloor"
    description: "Engineered hardwood installed over a compromised subfloor — from a slow crawlspace leak or a failed vapor barrier — develops delamination at the core ply within a year. Shaw and Kahrs both void their warranties outside specified moisture ranges. That's not a technicality — it's a real cost. In Seattle crawlspaces, a 6-mil poly vapor barrier stapled to the joists and sealed at seams is the minimum before any floating floor goes down. Skip it under a 98116 West Seattle crawlspace and you'll see the core ply separate from the face veneer by the following fall. A DriCore subfloor panel or foam underlayment system over concrete adds another layer of buffer between ground moisture and the finish floor. Fixing delaminated flooring after the fact costs 2-3x what proper subfloor prep would have run."

faq:
  - q: "How fast can you get to Seattle for a flooring consultation?"
    a: "TopVolk covers all Seattle zip codes and most of King County. Consultations are typically available within the week — call (206) 591-1096 to set one up. Vladislav comes to the site directly, not a salesperson. WA Licensed Contractor, 100+ projects completed since 2017 across the Seattle Metro."
  - q: "Can you match the existing 2-1/4 inch oak strip flooring in our older Seattle home?"
    a: "Yes — this comes up constantly in pre-1940 homes in Ballard, Madrona, and Beacon Hill. We source matching 2-1/4\" select red oak, nail it down with the same fastener pattern, then sand and finish the entire floor as one surface. Bona Traffic HD is the finish we reach for most — durable, low-sheen, holds up in high-traffic entryways."
  - q: "What does hardwood flooring installation cost in Seattle, and how long does it take?"
    a: "A full install in a 1,200-1,800 sq ft home typically runs $12,000-$22,000 depending on species, subfloor condition, and demo scope. Engineered white oak in a Ballard bungalow runs toward the higher end when subfloor leveling and old VAT abatement are in the scope. Timeline is 1-2 weeks of active work plus finish cure time — Bona finish needs 24 hours before foot traffic, 7 days before area rugs go back down. Seattle SDCI doesn't require a permit for flooring-only projects — no 4-week plan review delay. Deadline is written into the contract with a penalty clause. Call (206) 591-1096 for a line-item quote."