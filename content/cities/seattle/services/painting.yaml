title: "Seattle Painting — Cedar Shake, Lead Prep & Exterior Cycles"

intro: |
  Capitol Hill craftsmans built around 1915 look solid until the cedar shake starts
  cupping and the north-facing gables go dark with mildew. Seattle averages 37 inches
  of rain a year — and that moisture doesn't forgive a skipped primer coat on wood
  siding. Exterior painting on these homes isn't just cosmetic; it's the primary
  moisture barrier between the framing and the Pacific Northwest weather cycle.
  After a Bosch-equipped kitchen remodel in Wallingford, the adjacent pantry
  trim and soffit almost always need matching interior painting work too. TopVolk
  folds that into the same project so there's one estimate, one painting schedule.
  Vladislav Volkov handles the walkthrough himself, not through a coordinator.

localContext: |
  The 98103 zip — Fremont, Wallingford, Green Lake — holds one of the densest
  concentrations of pre-1940 wood-frame homes in King County. Exterior painting
  here means dealing with lead-based paint in almost every house built before 1978,
  making EPA RRP compliance a legal requirement before any sanding or scraping begins.
  Down in Beacon Hill (98108), mid-1950s bungalows have accumulated five or six
  layers of oil-based trim paint over the decades. That buildup needs chemical
  stripping or thorough mechanical prep before modern latex will bond — skip that
  step and a fresh painting job starts peeling within a year. Seattle's painting
  season runs roughly May through September when sustained dry days let exterior
  coats cure properly; rushing painting work into October means trapping moisture
  under the film.

commonProblems:
  - title: "Cedar Shake and Hardie Siding Repaints Failing at 3-4 Years"
    description: |
      Seattle's sustained rain from October through May accelerates paint film
      degradation on wood siding — especially north-facing walls that never fully
      dry between storms. Skipping a tannin-blocking oil-based primer on bare cedar
      causes tannin bleed through the finish coat within one season. A proper
      exterior painting sequence means power washing, spot-priming bare wood with
      Zinsser Bulls Eye 1-2-3 or an oil-based primer, then two coats of
      Sherwin-Williams Duration exterior acrylic. Done correctly, that painting
      cycle runs 7-10 years instead of 3-4. Hardie siding painting is more
      forgiving on prep time, but cedar shake requires significantly more labor
      per square foot to do right.
  - title: "Lead-Based Paint in Pre-1978 Homes Requires More Than a Roller"
    description: |
      Homes in Capitol Hill (98102), Queen Anne (98109), and Ballard (98107) almost
      universally carry lead-based paint on window sashes, door casings, and exterior
      trim. Washington State law requires EPA RRP-certified contractors for any
      disturbance of more than 6 square feet indoors or 20 square feet outdoors.
      Any painting contractor working on pre-1978 Seattle homes and skipping this
      step is exposing the homeowner to liability too. TopVolk tests first with
      3M LeadCheck swabs, sets up poly containment, and follows wet-scraping with
      HEPA vacuum collection before any topcoat is applied. No shortcuts here —
      it's a legal and health issue, not just a painting preference.
  - title: "Cabinet Repainting vs. a $15K-$40K Box-and-Door Replacement"
    description: |
      After installing a KitchenAid or Wolf range, homeowners sometimes find the
      cabinet boxes are structurally sound but the finish looks dated. Full cabinet
      replacement in Seattle typically runs $15,000-$40,000 depending on size and
      material. A proper cabinet painting job — TSP substitute degreasing, 150-grit
      scuff sand, two coats of Sherwin-Williams Emerald Urethane Trim Enamel with
      a light scuff between coats — delivers a factory-smooth finish at a fraction
      of that cost. The cured urethane enamel holds up to daily contact better than
      the lacquer on most stock cabinets. Cabinet painting is one of the highest
      ROI projects in Seattle kitchens right now, given how far replacement costs
      have climbed since 2021.

faq:
  - q: "How fast can you get to Seattle for a painting estimate?"
    a: |
      TopVolk operates out of the Seattle metro and covers neighborhoods from
      Magnolia to Rainier Valley. Painting estimates are typically available within
      2-4 business days on-site. Street parking is workable in most residential
      areas. Call (206) 591-1096 — Vladislav answers directly, not a scheduling
      service. The estimate covers surface prep requirements, not just paint costs,
      which is where most painting quotes in Seattle leave homeowners surprised later.
  - q: "What paint brands do you use — Sherwin-Williams, Benjamin Moore, or PPG?"
    a: |
      For Seattle exterior painting, Sherwin-Williams Duration and Benjamin Moore
      Aura Exterior hold up best in this climate — both are 100% acrylic with strong
      moisture resistance. Interior painting on trim gets Sherwin-Williams Emerald
      Urethane or PPG Breakthrough on surfaces that take daily contact. Product
      choice depends on surface type, existing paint condition, and how much wear
      the area takes. No upselling products for their own sake.
  - q: "What does an exterior painting job cost in Seattle, and how long does it take?"
    a: |
      A typical Seattle single-family exterior painting project — power wash, prime,
      two-coat application on 1,800-2,200 sq ft of Hardie or wood siding — runs
      $6,000-$12,000 depending on siding type and prep complexity. Cedar shake
      painting takes more labor than Hardie board. Spring slots book out 4-8 weeks;
      fall has more availability. Call (206) 591-1096 for a line-item painting quote —
      100+ projects completed since 2017, WA Licensed Contractor, deadline penalty
      written into every contract.