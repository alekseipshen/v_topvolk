title: "Seattle Plumbing — Galvanized Lines, Tankless Installs, Remodel Rough-In"

intro: |
  Craftsman bungalows in Wallingford and Queen Anne were built long before PEX tubing existed —
  most still run galvanized steel supply lines that are 60 to 80 years old and choking on rust.
  Vladislav handles full plumbing scopes tied to kitchen and bathroom remodels: pipe replacement,
  Rinnai tankless conversions, and new drain runs for basement bathrooms. The plumbing rough-in
  on a Seattle remodel is where schedules get made or broken — undersized stacks, unlicensed
  prior plumbing work, and surprise cast iron runs all show up once walls open. For mid-century
  ranchers in Bellevue and Kirkland — built when copper was standard but joints were soldered by
  whoever showed up — dezincification at brass fittings causes the same pressure drop symptoms as
  galvanized. Direct line to the owner: (206) 591-1096.

localContext: |
  In ZIP 98103 — Fremont, Wallingford — pre-1950 homes routinely show galvanized supply lines with
  heavy mineral buildup and sluggish flow at upper-floor fixtures. The plumbing in these houses was
  never touched since original installation. Across Beacon Hill and Mount Baker (98118), the pattern
  repeats: post-and-pier foundations, undersized drain stacks, and copper retrofits done poorly in
  the 1970s. Seattle SDCI requires permits for water heater replacements, gas line work, and seismic
  strapping — plumbing permits we pull before the first wrench turns.

  East of the lake, Bellevue and Kirkland run their own permit centers separate from SDCI, with
  slightly different plan review timelines for plumbing work. Bellevue typically clears a
  straightforward repipe or water heater permit in 2-3 weeks. For unincorporated King County —
  Vashon Island, Snoqualmie Valley — plumbing permits go through King County DPER instead, which
  adds a step most homeowners don't anticipate until the job is already on the schedule.

commonProblems:
  - title: "Galvanized Supply Lines Failing in Pre-1960 Seattle Homes"
    description: "Galvanized steel plumbing pipe corrodes from the inside out. Ballard bungalows
      and Capitol Hill four-squares often show pressure dropping to a trickle at second-floor
      fixtures — not a city supply issue, but a clogged interior bore from 70 years of scale.
      Replacing galvanized plumbing runs with PEX-A or copper means rerouting through crawlspaces
      and wall cavities during the remodel rough-in phase. PEX-A is the better call in crawlspaces
      on north-facing lots — it expands rather than splits at the fitting during freeze events.
      Beacon Hill and Magnolia both see January temperatures drop into the low 20s during cold snaps,
      and crawlspace plumbing there is more exposed than most homeowners realize. Seattle's ~37
      inches of annual rainfall keeps those crawlspaces damp, which accelerates corrosion on any
      remaining metal plumbing components."

  - title: "Polybutylene Pipe Cracking in 1980s King County Homes"
    description: "Grey polybutylene plumbing pipe — common in Kent, Renton, and Auburn homes built
      between 1978 and 1995 — becomes brittle over time. The acetal plastic fittings crack first,
      often behind finished walls, undetected until drywall shows water staining. Partial plumbing
      fixes just relocate the failure point. Full repipe with PEX or copper is the only reliable
      solution. After rough-in, WA residential code requires a pressure test at 100 PSI for new
      supply lines before wall close-in — that plumbing inspection gets scheduled through Seattle
      SDCI or the local AHJ depending on jurisdiction. Some homeowner's insurance carriers in King
      County require documentation of polybutylene plumbing removal before renewing a policy.
      We provide a written scope summary after the job so you have something to hand to your insurer."

  - title: "Tankless Water Heater Conversion Requiring Gas Line Upsize"
    description: "Switching from a 40-gallon tank to a Rinnai RU199 or Navien NPE-240A2 is not a
      straight plumbing swap. Both units draw 199,000+ BTU on demand — most Seattle-area homes have
      a 3/4-inch gas supply line sized for the old tank, not a high-output appliance. Upsizing to
      1-inch black iron or CSST, running new Category III stainless vent, and coordinating the
      Seattle SDCI mechanical permit is all part of the plumbing scope. Bosch tankless units are
      another option for homes with lower simultaneous demand; the plumbing rough-in requirements
      differ slightly from the Rinnai RU-series but gas line sizing math is the same."

faq:
  - q: "How fast can you get to Seattle for plumbing work?"
    a: "TopVolk works across Seattle city limits and King County. Most plumbing sites are within
      30-45 minutes of each other. Plumbing is scheduled as part of the remodel phase — call
      (206) 591-1096 or schedule a free on-site consultation to talk through your timeline."

  - q: "Do you install Rinnai and Navien tankless water heaters?"
    a: "Yes — Rinnai RU-series and Navien NPE-series are the two plumbing installs we do most.
      Both need proper gas line sizing and Category III venting. We also rough-in Moen and Kohler
      fixtures during bathroom remodels and handle supply and drain hookups for Delta and Bosch
      appliances in kitchen plumbing work."

  - q: "What does a permit-required water heater replacement involve in Seattle?"
    a: "Seattle SDCI requires a permit for any water heater plumbing swap, plus seismic strapping
      per WA residential code. Straightforward plan review typically runs 2-4 weeks. We pull the
      plumbing permit, schedule the inspection, and handle gas line resizing if you are switching
      to tankless. Call (206) 591-1096 for a line-item quote — no vague ranges, no sales staff."

  - q: "Can you rough-in plumbing for a bathroom addition or ADU?"
    a: "That is most of what we do. Adding a bathroom in a basement or a DADU under WA HB 1337
      requires new plumbing drain lines tied into the existing stack, vent runs through the roof,
      and supply branches off the main. On older Seattle homes that means relocating or upsizing
      an existing 3-inch cast iron stack before anything else happens. Rough-in plumbing inspection
      through Seattle SDCI is scheduled before drywall closes the walls. Timeline for a standalone
      bathroom plumbing rough-in scope is typically 2-4 weeks of on-site work once permits are in
      hand. TopVolk has completed 100+ projects since 2017 across King, Snohomish, Pierce, and
      Kitsap counties — WA Licensed Contractor, owner-led."