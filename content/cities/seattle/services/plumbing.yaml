title: "Seattle Plumbing — Old Pipes, Permits, and Proper Rough-In"

intro: |
  Galvanized supply lines in Capitol Hill bungalows don't fail all at once — they
  narrow slowly, cutting pressure until a Kohler shower valve can barely push enough
  flow for a decent shower. Seattle's core neighborhoods run heavy on pre-1960
  housing stock, which puts galvanized-to-PEX retrofits on nearly every full bathroom
  or kitchen remodel we run. TopVolk handles rough-in plumbing as part of the full
  project scope, permitted through Seattle SDCI. WA Licensed Contractor, 100+
  projects completed since 2017 across King County.

localContext: |
  Zip codes 98102 and 98112 — Capitol Hill and Madison Park — are packed with
  1910–1930 Craftsman bungalows that have never had supply lines touched since
  original construction. Wallingford and Fremont (98103) layer in post-war ranchers
  from the late 1940s and early 1950s, with original galvanized drain lines that
  corrode from the inside out over decades of Seattle's mineral-heavy city water.
  Those same Wallingford homes often run 2-inch cast iron vents that are partially
  blocked at the stack — slow drains in the kitchen and bath on the same wall is
  usually the tell. Seattle's 37 inches of annual rainfall keeps crawlspace moisture
  an ongoing concern; vapor barrier replacement is frequently added to scope once
  we open walls on a full plumbing rough-in.
  King County DPER requires permits for water heater replacements and any supply
  line rerouting — factor 3–5 weeks for plan review when scheduling your project start.

commonProblems:
  - title: "Galvanized Pipe Rust Restricting Flow in Pre-1960 Homes"
    description: |
      Homes in 98107 (Ballard) and 98115 (Greenwood) built before 1960 almost always
      have galvanized steel supply lines that leave orange sediment at fixtures and
      choke flow to Moen and Delta faucets. Forty-year-old galvanized pipe can be
      down to a 1/8-inch opening where 3/4-inch flow used to run. Replacing with
      PEX-A from the main shutoff to each fixture clears the pressure problem for
      good. Seattle SDCI requires a rough-in inspection before walls close — that
      needs to be in the schedule before drywall goes up.
  - title: "Polybutylene Supply Lines Failing at the Fittings"
    description: |
      Gray polybutylene supply lines were standard in Kent, Federal Way, and south
      Renton homes built between 1978 and 1995. Chlorine in Seattle's municipal
      water supply degrades the plastic at the brass compression fittings — not a
      matter of if they fail, but when. Full repipe to PEX-B or Type L copper, with
      new ball valves at every branch point and pressure testing before inspection,
      is the only fix that holds. Sleeve repairs on failed poly fittings don't last.
  - title: "Tankless Water Heater Conversion Requires Gas Line Upsize"
    description: |
      A Rinnai RU199iN or Navien NPE-240A2 draws 199,000–240,000 BTU at peak
      demand. Most Seattle homes were plumbed with a 3/4-inch gas line sized for a
      40-gallon tank heater running around 40,000 BTU — the existing line starves
      a tankless unit and triggers error codes. Upsizing to 1-inch black iron from
      the meter is typically required, plus a gas pressure test, seismic strapping
      per WA code, and condensate drain routing before the permit closes with
      Seattle SDCI. Hill neighborhoods like Queen Anne and Beacon Hill also
      frequently need a pressure reducing valve (PRV) set to 60–70 psi before the
      new water heater goes in — city supply pressure on those grades regularly
      hits 90 psi, which shortens fixture and appliance life on Rinnai, Navien,
      Moen, and Kohler equipment alike.

faq:
  - q: "How fast can you get to Seattle for plumbing work?"
    a: |
      King County is our primary service area — most Seattle neighborhoods are
      reachable same day for a site walk. Parking in Capitol Hill, Ballard, and
      Fremont is tight; we plan around it. Call (206) 591-1096 to schedule directly
      with Vladislav. No sales staff, no callbacks from a dispatcher.
  - q: "Do you work with Rinnai and Navien tankless systems on remodels?"
    a: |
      Both brands are on projects regularly. Rinnai and Navien installs involve gas
      line resizing, venting, and condensate drain routing — handled in scope.
      Moen and Kohler fixtures get rough-in coordinated at the same time. Vladislav
      works directly with subs on each job, so nothing gets missed before drywall
      closes.
  - q: "What does plumbing rough-in cost on a Seattle bathroom remodel, and do you handle the permit?"
    a: |
      Full bathroom plumbing rough-in typically runs $4,000–$9,000 depending on
      drain rerouting complexity and whether supply lines need full replacement.
      Pressure regulator installation — required when city water exceeds 80 psi,
      which is common in Seattle hill neighborhoods — adds to that scope. Seattle
      SDCI plan review adds 4–8 weeks for major work. Vladislav provides a
      line-item quote after the site walk — call (206) 591-1096. Deadlines for
      rough-in inspections are written into the contract.