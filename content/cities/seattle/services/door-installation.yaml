title: "Seattle Door Installation — Flashing, Fit, and Rot Prevention"

intro: |
  Ballard and Queen Anne homes built before 1930 have Doug-fir door frames that look solid until you pull back the exterior trim and find the framing soaked through from failed Z-bar flashing. Seattle averages about 37 inches of rain a year, concentrated between October and May — water drives hard against every threshold and door jamb on the west and north faces of a house for six months straight. Vladislav has replaced Marvin and Therma-Tru entry doors on homes across the 98117 to 98122 corridor where the original wood entry was rotting behind three coats of exterior paint. Adding a Schlage Encode deadbolt at entry door replacement takes 20 minutes and avoids cutting into finished casing later.

localContext: |
  Zip code 98107 in Ballard and 98103 in Wallingford and Fremont run heavy with Craftsman bungalows from 1905 through the 1920s. Rough openings in these homes shift over a century of settlement — the post-and-pier foundation moves, the Doug-fir framing follows, and what was once a plumb 3/0 door opening becomes a parallelogram that needs careful shimming and custom-built casing to hang correctly and seal. Original millwork on these pre-war homes — the wide Doug-fir base casings and thick brick mould common on streets near Green Lake and the Fremont Canal — is often worth matching rather than replacing wholesale. That takes a different eye than hanging a builder-grade door in a 1980s tract house.

  The 1960s-70s builder ranchers in Shoreline (98133) and the Skyway corridor (98178) have a different failure mode: steel threshold pans that corrode and allow moisture to wick up into the subfloor framing. Homes in those zip codes also saw a lot of aluminum-frame sliding glass doors installed between 1965 and 1973. Those sliders are now 50-plus years old and the thermal break is long gone. Replacing them with a Pella or Andersen fiberglass unit makes a measurable difference in heating bills.

  Mid-2000s construction in Sammamish (98074) and Redmond Ridge (98053) is energy-code compliant but often uses builder-grade fiberglass doors that homeowners want upgraded — better glass packages, different hardware finishes, or a more substantial slab for curb appeal on streets where neighbors just did a full exterior refresh.

commonProblems:
  - title: "Head Flashing Failures Behind Painted Brick Mould"
    description: |
      North and west-facing entry doors on Capitol Hill and Wallingford Craftsman homes — zip codes 98112 and 98103 — fail at the head flashing first. Water infiltrates behind the brick mould, saturates the king stud, and spreads to the jack stud before it shows on the interior. By the time a homeowner notices, the rough opening often needs partial reframing before a new Therma-Tru or ProVia fiberglass door can be installed correctly. Sloped pan flashing, a drip cap, and proper Z-bar integration at the top of the opening prevent the same failure on the replacement unit.
  - title: "Racked Rough Openings in Pre-1940 Queen Anne and Beacon Hill Homes"
    description: |
      Post-and-pier foundations common in Seattle homes built before 1940 — Queen Anne, Beacon Hill, Madison Park — allow lateral racking that a poured perimeter does not. The result is a door that won't latch, a gap at the strike plate, or a threshold that rocks against the floor. Before hanging a Pella or Marvin entry unit, the rough opening gets checked with a 6-foot level and a plumb bob. Minor shimming handles up to 1/4 inch of deviation. Anything racked more than 3/8 inch means correcting the framing first — otherwise the new door binds within a year.
  - title: "Structural Header Upgrade When Converting to French or Multi-Slide Doors"
    description: |
      Upgrading a standard 6-foot aluminum slider to a French door pair or a multi-slide system in West Seattle (98116) or Madison Park means widening the rough opening. That triggers a structural calculation — a longer LVL beam or a PSL post may be required depending on the load path above. The work requires a Seattle SDCI building permit and a rough-in inspection before the new frame gets trimmed out. Fiberglass Pella and Andersen units hold up well through PNW winters because they don't swell or warp the way painted wood does after six months of heavy rain exposure.

faq:
  - q: "How fast can TopVolk get to a Seattle address for a door installation consult?"
    a: |
      Vladislav covers the full city — Capitol Hill, Ballard, West Seattle, Beacon Hill, Magnolia — and schedules on-site consultations within a few business days. Call (206) 591-1096. You talk directly to the contractor doing the work, not a salesperson. Free consultation, no commitment. 100+ projects completed across Seattle Metro since 2017.
  - q: "Which door brands do you install — Pella, Marvin, Andersen, or Therma-Tru?"
    a: |
      All four, plus ProVia fiberglass for projects where budget matters more than interior wood finish. The right unit depends on rough opening size, whether the interior needs a stainable wood profile to match existing millwork in a pre-war home, and exterior casing profile requirements. Smart lock rough-in for Schlage Encode or August deadbolts is handled at the same time as the door installation.
  - q: "Does widening a door opening in Seattle require a permit, and how long does the project take?"
    a: |
      Straight replacement in the same rough opening requires no permit in Seattle. Widening a structural opening for a French door or multi-slide system triggers a Seattle SDCI building permit — plan review typically runs 4 to 8 weeks. TopVolk handles permit filing. Actual construction from permit approval to final inspection runs about 2 to 3 weeks for a single opening. WA Licensed Contractor. Completion deadline is written into the contract, with penalties if we miss it.