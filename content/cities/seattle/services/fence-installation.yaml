title: "Seattle Fence Installation — Cedar, Permits & Shared Lines Done Right"

intro: |
  Capitol Hill's dense lots and Ballard's alley-accessed backyards create fence challenges that don't show up in suburban Redmond. Post depth is a real engineering decision here — Seattle's heavy clay soils need 30-36 inch post holes set in concrete, or posts start heaving after the first two or three wet winters. Magnolia and West Seattle hillside lots add slope to that equation, which means stepped fence panels and longer posts on the downhill side. Vladislav Volkov at TopVolk Construction handles full fence installations across the Seattle metro, WA Licensed Contractor, 100+ projects completed since 2023.

localContext: |
  Craftsman bungalows in Wallingford and Queen Anne (zip 98103) often have 80-plus-year-old cedar or chain-link fencing that has shifted with decades of soil movement and root growth. Replacing it means re-establishing the property line — old fence lines don't always match legal lot boundaries. Under Seattle SDCI rules, standard residential fences under 6 feet on side and rear lines don't need a permit, but a fence-retaining wall combination over 4 feet tall triggers plan review, which runs 4-8 weeks. In Beacon Hill and Mount Baker, many lots have grade changes of 3-5 feet across a standard 100-foot side yard, which turns a simple fence project into an engineered retaining-wall-and-fence combination requiring SDCI review. That review timeline matters — budget for it before lining up materials.

commonProblems:
  - title: "Post Rot and Ground Heave in Seattle's Clay Soil"
    description: "Seattle gets 37-plus inches of rain annually, and heavy clay soils trap moisture around post bases year-round. Even pressure-treated (PT) lumber degrades at grade contact faster than most homeowners expect. Simpson Strong-Tie ABA post bases — cast into the concrete footing with the post elevated above grade — add 10-15 years of service life. Skipping that $12-per-post detail is the most common reason replacement jobs come up early. On north-facing lots in Greenlake or Madrona, moss colonizes untreated wood within two seasons. PT lumber rated for ground contact (UC4B) is the baseline; Trex or TimberTech composite rail systems eliminate the rot risk entirely on the above-grade framing."
  - title: "Height Limit Confusion: Seattle SDCI vs King County DPER"
    description: "Seattle SDCI allows 6-foot fences on side and rear property lines and 4 feet along the front yard setback — no permit under those heights. The catch: any fence doubling as a retaining wall over 4 feet tall requires a full permit and plan review. Properties in unincorporated King County route through DPER instead, where setback rules differ from Seattle's municipal code. Smaller incorporated cities like Shoreline and Burien have their own permit centers with slightly different height allowances — what's legal in Seattle city limits may require a variance half a mile away."
  - title: "Horizontal Slat Fences Miss a Critical Structural Detail"
    description: "The horizontal board-on-board look is everywhere in Capitol Hill and Fremont, and composite options from Trex Fencing or TimberTech hold up better through Seattle's mold-and-mildew season than raw cedar. The structural issue: horizontal rails carry lateral load differently than vertical boards. Posts need 30-plus inches of depth, and rail-to-post blocking must be solid — a fence that racks in the first windstorm is a framing failure, not a material failure. Joist hanger-style blocking at each rail connection point is the fix most DIY builds skip."

faq:
  - q: "How fast can you get to Seattle for Fence Installation?"
    a: "TopVolk serves all Seattle neighborhoods — Capitol Hill (98102), Ballard (98107), West Seattle (98116), and Beacon Hill (98118) — as well as Shoreline, Burien, and unincorporated King County. Call (206) 591-1096 to schedule a free on-site consult. Vladislav comes out personally, not a commissioned salesperson. WA Licensed Contractor, deadline penalty written into the contract. Most residential fence projects — standard 6-foot cedar or composite on a flat lot — run 2-4 days of installation once materials are staged."
  - q: "Cedar or composite fencing — which holds up better in Seattle's rain and moss?"
    a: "Cedar ages to a natural gray in PNW conditions but north-facing lots in Greenlake or Madrona grow moss fast — expect to seal every 2-3 years. Composite options like Trex Fencing and TimberTech require zero sealing and won't crack in freeze-thaw cycles. For a 20-year fence with no maintenance upkeep, composite wins in Seattle's climate. Cedar still makes sense where the budget is tighter or the aesthetic is a priority — a 6-foot cedar dog-ear fence built correctly and sealed at installation will last 15+ years in Seattle with annual maintenance."
  - q: "Do we need a survey before putting up a fence on a shared property line?"
    a: "Yes — always. In Seattle neighborhoods like Beacon Hill or Mount Baker, old fence lines often run 6-12 inches off the true lot boundary. A survey runs $900-1,500 in King County — far cheaper than dismantling a fence after a neighbor dispute. TopVolk won't start shared-line work without documented survey pins in place. If your lot is in an older platted Seattle neighborhood and the last survey predates 2000, there's a real chance the boundary markers have shifted or were never set with precision. Call (206) 591-1096 to walk through the full timeline and what to request from a licensed surveyor before the first post goes in."