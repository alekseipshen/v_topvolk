title: "Seattle Handyman Services — Punch Lists & Post-Remodel Repairs"

intro: |
  Capitol Hill Craftsman bungalows and Ballard rowhouses rack up small repairs that major remodel contractors don't stay to finish — caulk lines at Schluter tile joints, cabinet hardware installs, a Bosch dishwasher that shifted during delivery and needs its mounting clips re-seated. Vladislav Volkov at TopVolk has been handling punch list work and targeted repairs across Seattle since 2023. Over 100 projects in. Call (206) 591-1096 and you reach Vladislav directly — no dispatcher, no commissioned closer.

localContext: |
  Seattle's 98103 zip — Wallingford, Fremont, parts of Greenwood — is dense with Craftsman homes built between 1905 and 1930. Original plaster walls. Trim profiles that haven't been manufactured in decades. Over in 98116, West Seattle split-levels from the 1960s show different problems: compressed threshold weatherstripping, loose deck boards from freeze-thaw cycles near Lincoln Park. Even 2000s-era builds in Issaquah Highlands and Sammamish Plateau need work as builder-grade hardware ages out faster than homeowners expect.

commonProblems:
  - title: "Post-Remodel Punch List Items Left Unfinished by the GC"
    description: |
      After a kitchen or bathroom remodel, the final stretch — caulking the Schluter Kerdi joint where tile meets fixture, adjusting European hinges on cabinet doors, matching drywall texture where the electrician cut for recessed lighting — gets dropped when the general contractor moves to the next job. That's not small. A missing caulk line at a shower curb lets water reach the subfloor. Two Seattle rainy seasons later, you're looking at rot and a real repair bill.

  - title: "Drywall Patches That Show in Older Capitol Hill and Queen Anne Homes"
    description: |
      Plaster-and-lath walls in 98112 Capitol Hill and 98109 Queen Anne carry textures — skip trowel, sand float, hawk-and-trowel swirl — that don't come on standard drywall sheets. Patching a hole where a Samsung TV wall mount or towel bar pulled out requires floating multiple coats of joint compound, feathering the edges carefully, and recreating the original pattern before priming. Get it wrong and the patch telegraphs under raking light across the whole room.

  - title: "Smart Thermostat and Doorbell Camera Installs in Homes With Old Wiring"
    description: |
      Ecobee and Nest thermostats in Ballard or Wallingford Craftsman homes commonly lack a C-wire — the common wire that powers the thermostat's always-on display. Without it, the device pulls from the furnace transformer and eventually kills it. Ring doorbell cameras in 98103 often hit the same wall: original 1920s doorbell transformers run 8–10V, not enough to power a modern camera. Getting the junction box and transformer right the first time avoids warranty-voiding workarounds.

  - title: "Weatherstripping Failures Ahead of Seattle's Rainy Season"
    description: |
      Seattle averages 37 inches of rain annually, the bulk arriving October through May. Milgard sliding door seals compress over years of use; exterior door thresholds lose their vinyl bulb insert; north-facing wood jambs accumulate moss that holds moisture against the framing. Replacing EPDM bulb weatherstrip and installing a door sweep is a two-hour job. Skipping another winter means escalating heating bills and — eventually — rot in the rim joist area below the sill.

