title: "Seattle Bathroom Remodel — Waterproofing, Layouts & Permit-Ready Builds"

intro: |
  Craftsman bungalows in Wallingford and Capitol Hill are beautiful — until you pull the tile and find the original 1920s cast-iron drain stack corroded behind the wall. Seattle bathrooms deal with a lot: 37 inches of rain a year, chronically humid interior air, and housing stock ranging from century-old post-and-pier homes to 1990s tract builds in Renton where builder-grade Moen fixtures are finally giving out. Vladislav Volkov at TopVolk Construction has completed 100+ bathroom and whole-home remodels across King County since 2023.

localContext: |
  Zip codes like 98103 (Fremont/Wallingford) and 98118 (Beacon Hill/Mount Baker) are packed with pre-1930 Craftsman bungalows — narrow bathrooms, galvanized supply lines, and zero vapor barrier behind the original subway tile. Further south in Kent (98031) and Federal Way (98003), the 1980s-90s tract builds have dated cultured-marble vanities, low-CFM exhaust fans, and shower pans that were never properly waterproofed. Both housing eras have real problems, just different ones.

commonProblems:
  - title: "PNW Moisture Getting Behind Tile — No Waterproofing Membrane"
    description: "Seattle's humidity doesn't forgive shortcuts. Older bathrooms — especially in Queen Anne and Ballard — were tiled directly over drywall or green board, neither of which stops water long-term. Once moisture gets into the framing, you're looking at rot, mold, and eventually structural damage. Every shower we build now uses Schluter Kerdi membrane or RedGard applied over cement board before a single tile goes up. That's not optional here — it's what the PNW climate demands."
  - title: "Cast-Iron Drain Stacks in Pre-War Homes"
    description: "Craftsman bungalows in Capitol Hill, Madrona, and Beacon Hill frequently have the original cast-iron drain stack still in place — 80 to 100 years old. These corrode from the inside out, and a bathroom remodel is often when the problem finally surfaces. Rerouting to ABS or PVC requires a rough-in inspection through Seattle SDCI, and the permit plan review typically runs 4 to 8 weeks for work involving drain rerouting. Factor that into your timeline from the start."
  - title: "Outdated Layout — Tub-Only Bathrooms That Need Walk-In Showers"
    description: "A lot of 1950s-70s homes in Shoreline, Edmonds, and south Bellevue have master baths with a 5-foot alcove tub and nothing else. Homeowners want a curbless walk-in shower with a Schluter linear drain, a built-in niche, and a bench. That conversion usually means relocating the drain, resizing the rough-in, and sometimes moving a wall to get a usable shower footprint. Doable — but it requires permits and coordination between plumbing and tile work."
  - title: "Ventilation Failures Causing Mold Regrowth"
    description: "Builder-grade exhaust fans in Kent and Federal Way tract homes are often 50 CFM or less — nowhere near enough for a bathroom that sees daily showers in a humid climate. Mold on the ceiling isn't a cleaning problem, it's an airflow problem. Upgrading to a properly sized exhaust fan (80-110 CFM minimum for most Seattle bathrooms) vented directly to the exterior — not into the attic — stops the cycle. Some installs require patching the exterior wall or roof penetration, which adds a day to the job."
  - title: "ADA Accessibility Retrofits for Aging Homeowners"
    description: "Grab bar blocking, curbless shower conversions, and wider doorway framing are increasingly common requests in established neighborhoods like Madison Park, Magnolia, and Mercer Island. Blocking needs to be installed inside the wall framing before drywall goes up — retrofitting after the fact means opening the wall. A curbless shower also needs a properly sloped mud-bed floor to direct water to a linear drain, which is a tile-setter skill, not a DIY job. Seattle SDCI may require permits depending on scope."

faq:
  - q: "How long does a bathroom remodel take in Seattle, and what's the permit process?"
    a: "A straightforward tile-and-fixture refresh with no layout changes runs 3 to 5 weeks on-site. A full master bath reconfiguration — new layout, curbless shower, relocated plumbing — is typically 6 to 9 weeks once permits are in hand. Seattle SDCI permit plan review for bathroom work involving drain relocation or structural changes runs 4 to 8 weeks, sometimes longer for older homes in historic neighborhoods. Budget permit time into your overall project schedule, not as an afterthought. Call (206) 591-1096 to walk through what your specific scope actually needs."
  - q: "Do you work on higher-end bathroom finishes — large-format porcelain, Kohler, Moen, custom tile work?"
    a: "Yes. Most projects in Seattle's upper-middle-income neighborhoods involve large-format porcelain (24x48 or larger), Kohler or Moen plumbing fixtures, Schluter Kerdi membrane systems, and semi-custom or custom vanities. Large-format tile requires a flat, properly prepared substrate — lippage on a 24x48 slab is obvious and unacceptable. Schluter Kerdi-Board and Kerdi membrane are standard on every shower we build. Fixture brands like Kohler and Moen are specified early so rough-in dimensions match — not swapped in at the end."
  - q: "What does a bathroom remodel actually cost in Seattle, and how do you price it?"
    a: "A mid-range full bathroom remodel in Seattle — new tile, curbless shower, vanity, fixtures, exhaust fan, permit — typically runs $30,000 to $60,000 depending on layout complexity and finish level. A cosmetic refresh (tile overlay, new vanity, fixture swap, no layout changes) can come in under that. TopVolk provides a line-item quote after an on-site walkthrough — not a vague range over the phone. Vladislav does the consultation himself. Deadline commitments are written into the contract with penalty clauses. Call (206) 591-1096 or schedule a free on-site consultation."
  - q: "My 1910 Craftsman in Wallingford has the original bathroom layout. What should I expect when opening the walls?"
    a: "Expect surprises — that's honest. Pre-1930 homes in Wallingford, Fremont, and Ballard regularly have knob-and-tube wiring in the bathroom wall, galvanized supply lines that are partially blocked with mineral buildup, and no vapor barrier behind the tile. The cast-iron drain stack may be original. None of that is a dealbreaker, but it changes the scope and cost. A good contractor prices a contingency into the contract for exactly this reason. Vladislav has worked through these conditions in dozens of Capitol Hill and Wallingford homes — call (206) 591-1096 to talk through what a realistic budget looks like for your house."