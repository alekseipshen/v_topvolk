title: "Seattle Basement Finishing — Converting Wet Crawlspace Into Livable Rooms"

intro: |
  Craftsman bungalows built in the 1910s through 1930s — common on Capitol Hill, in
  Wallingford (98103), and throughout Ballard — almost always have unfinished basements.
  Most get groundwater intrusion by November. Finishing that space starts not with drywall,
  but with a perimeter drain, a sump pump, and a vapor barrier system sized for Seattle's
  37-inch annual rainfall. Vladislav Volkov, WA Licensed Contractor, has completed 100+
  basement projects across King County since 2017 — including conversions with egress
  bedrooms and Mitsubishi mini-split systems for year-round temperature control. Call
  (206) 591-1096 to schedule a free on-site walkthrough.

localContext: |
  Pre-1940 homes in Queen Anne (98119) and Beacon Hill (98108) typically have ceiling
  heights between 6'4" and 6'8" below the floor joists — under the IRC minimum of 7 feet
  for habitable space. Cast-iron drain stacks run through the center of the slab. Ductwork
  drops low off the first-floor framing. All of that has to move before the space reads
  livable. Newer builds in Rainier Valley and Mount Baker have better clearance but still
  need egress compliance under Seattle SDCI rules if you're adding a bedroom.

commonProblems:
  - title: "Persistent Moisture Through the Slab and Stem Walls"
    description: |
      Seattle's clay-heavy soil holds water from October through April, and that moisture
      migrates laterally through concrete block and poured foundation walls. A properly
      sloped interior perimeter drain — tied to a Zoeller M53 submersible sump pump with a
      battery backup float switch — captures that water before it reaches the framing plane.
      DriCore subfloor panels float over the slab and create an air gap that interrupts
      capillary moisture transfer, keeping the finished floor dry through a wet winter.
  - title: "Egress Window Cuts for Code-Legal Bedrooms"
    description: |
      Seattle SDCI requires a minimum 5.7 square feet of net clear opening for any egress
      window in a basement bedroom — 20-inch clear width, 24-inch clear height. Cutting
      through a poured concrete or concrete block foundation wall means core drilling or saw
      cutting, then sizing the rough opening, installing a window well with gravel drainage,
      and tying back to the existing rim joist. On pre-1930s homes with 8–10-inch foundation
      walls, that cut alone takes most of a day.
  - title: "Low Ceilings and Mechanical Conflicts in Pre-War Seattle Homes"
    description: |
      Homes in Magnolia and Queen Anne built before 1945 often land at 6'4" to 6'6" below
      the joists. Gas supply lines, cast-iron sanitary stacks, and undersized duct runs
      compete for every inch of that headroom. Rerouting mechanical before the rough-in
      inspection — coordinated with an HVAC sub and licensed plumber — can recover four to
      six inches. Spans that need more than that sometimes get a sistered joist run or an LVL
      beam replacement to raise a section of the first-floor system.

faq:
  - q: "How does permitting work for basement finishing in Seattle?"
    a: |
      Seattle SDCI handles all basement finish permits within city limits. A basic finish with
      no new bedrooms or bathrooms can sometimes qualify for over-the-counter review. Adding a
      bedroom, bathroom, or egress window triggers full plan review — typically 4 to 8 weeks.
      Vladislav (WA Licensed Contractor) pulls all permits directly on every project. Call
      (206) 591-1096 and he will tell you exactly what your scope triggers before you commit
      to anything.
  - q: "What's the typical project timeline from permit to punch list?"
    a: |
      Permit review runs 4 to 8 weeks. Once permits clear, rough framing, electrical
      rough-in, plumbing, and insulation take 2 to 3 weeks. After rough-in inspection,
      drywall hang, tape, mud, and finish work adds another 3 to 4 weeks. Total from permit
      submission to punch list walkthrough: 3 to 5 months for a standard 700–900 square foot
      basement with one bedroom and one bathroom. Deadline commitments are written into the
      contract — with penalties if TopVolk misses them.
  - q: "Do you handle mold and moisture before framing starts?"
    a: |
      Always. Finishing over an active moisture source is the fastest way to destroy your
      investment. Mold-resistant drywall like CertainTeed AirRenew and DriCore subfloor both
      help with ambient humidity — but neither fixes water migrating through the foundation.
      The sump, drain, and vapor barrier system goes in first. The assembly dries out and
      gets tested before framing starts. If you're seeing efflorescence or black staining on
      the walls, call (206) 591-1096 before any other contractor touches it.