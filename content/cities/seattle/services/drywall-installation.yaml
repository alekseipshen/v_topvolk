title: "Seattle Drywall Installation — Older Homes, Level 5 Finish"

intro: |
  Capitol Hill and Wallingford Craftsman bungalows, built between 1910 and 1928, hide their
  character behind layers of horse-hair plaster and lath. Open a wall for a kitchen remodel —
  even just to run a dedicated 240V circuit for a Bosch induction range — and you're looking
  at exposed framing that needs new drywall: hung, taped, mudded, and finished to Level 5
  before the painter arrives. Seattle's wet winters add another layer. Heavy rain from October
  through May pushes moisture into crawlspaces and exterior walls, so board selection and
  vapor barrier placement aren't afterthoughts.

localContext: |
  Homes in the 98103 zip — Fremont, Wallingford, and the blocks south toward Green Lake —
  sit on post-and-pier foundations typical of pre-war construction. Crawlspace moisture
  migrates upward into wall cavities here year-round, which makes mold-resistant purple board
  mandatory in bathrooms and laundry rooms, not just an upgrade. East Seattle neighborhoods
  like Madison Park (98112) and Madrona present a different issue: 1960s split-levels with
  original popcorn ceilings on aging 1/2-inch drywall that is cracking at the seams and
  pulling away from the taped joints.

commonProblems:
  - title: "Popcorn Ceiling Removal Exposes Failed Tape — Skim Coat to Level 5 Required"
    description: "Spray texture from the 1970s was applied directly over taped drywall joints in homes
      across Shoreline (98133) and south Renton. Scrape it off and you will find lifted seams,
      nail pops, and surface voids underneath. A full skim coat to Level 5 finish is the only
      correct fix — especially in kitchens and baths where sidewall lighting grazes the ceiling
      at a shallow angle and exposes every ridge. Painting over a raw scraped surface without
      skim-coating just makes the damage more visible."
  - title: "5/8-Inch Type-X Firecode Required for ADU Separation Walls and Garage Conversions"
    description: "Seattle SDCI requires 5/8-inch Type-X firecode drywall on every wall and ceiling plane
      separating an ADU from the main dwelling unit — whether that is a garage conversion in
      West Seattle or a basement apartment below a Ballard rental. Standard 1/2-inch board
      fails this requirement. Miss it at rough-in inspection and the walls come back open.
      WA HB 1337 made ADU conversions more common across King County since 2024; the firecode
      separation requirement applies to every one of them."
  - title: "Soundproofing Between Bedrooms — Resilient Channel and QuietRock for Dense Seattle Housing"
    description: "ADU conversions and basement bedroom additions in Capitol Hill (98102), Beacon Hill, and
      Columbia City frequently fail sound transmission requirements between sleeping rooms.
      Resilient channel breaks the direct structural path for airborne sound by decoupling the
      drywall plane from the studs. Pair it with QuietRock 510 for added mass and you push the
      assembly's STC rating into the mid-50s — the threshold Seattle SDCI requires for occupancy
      separations in multi-family and ADU work."

faq:
  - q: "How fast can you get started on a drywall project in Seattle?"
    a: "For addresses in Seattle proper — Queen Anne, Ballard, Beacon Hill — an on-site walkthrough
      can usually be scheduled within a few business days. Patch-and-finish work after a plumbing
      rough-in typically needs no permit and moves quickly. Full drywall scope tied to an ADU or
      addition permit goes through Seattle SDCI; plan review runs 4-12 weeks. Call (206) 591-1096
      to map out the realistic schedule for your project."
  - q: "What drywall brands does TopVolk use, and does the brand actually matter?"
    a: "USG and CertainTeed board go in for standard work — both widely available from local
      distributors and code-compliant. For sound-sensitive assemblies, QuietRock 510 is the
      specification. Purple board (mold-resistant) goes into every bathroom, laundry room, and
      below-grade ceiling, regardless of what the original builder installed. Material selection
      gets settled at the site visit, not after the contract is signed."
  - q: "What does drywall work cost in Seattle, and how does the process work?"
    a: "Scope sets the price. Patching after electrical or plumbing rough-in in a kitchen remodel
      might run $2,000-$5,000 for a typical Craftsman-era home. A full basement finish — purple
      board, blocking, Level 5 skim coat throughout — runs considerably more. Vladislav visits
      the site and delivers a line-item quote, no vague estimates. 100+ projects completed since
      2023 across King County. WA Licensed Contractor. Deadline penalty is written into
      every contract."