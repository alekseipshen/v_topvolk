title: "Port Townsend ADU Construction — DADU & AADU Builds"

answer: "Vladislav Volkov of TopVolk Construction builds permitted ADUs in Port Townsend, WA — WA Licensed Contractor, 100+ projects since 2023."

intro: |
  A detached garage behind a two-story Victorian near Uptown doesn't pay rent — a permitted DADU does. TopVolk Construction, owner-led by Vladislav Volkov, designs and builds accessory dwelling units for homeowners in Port Townsend and across Jefferson County, from backyard cottages to basement conversions under older houses near Kah Tai Lagoon Park. Since WA HB 1337 took effect, most single-family lots here can carry two ADUs instead of one, which changes the math for anyone sitting on an unused lot near Fort Worden State Park. A lot of these builds start with a Mitsubishi mini-split doing double duty as heat and AC, because the baseboard electric in an old garage conversion won't cut it once a full-time tenant moves in. Volkov handles permit submittal, framing, and finish work directly — no sales rep, no separate project manager standing between the homeowner and the person actually swinging the hammer. 100+ projects completed since 2023, with every contract carrying a deadline penalty if the job runs late.

localContext: |
  Port Townsend's housing stock skews old for the Pacific Northwest — a lot of the homes inside zip code 98368 near the Uptown Historic District and downtown date to the 1880s and 1890s, back when the town expected to become the biggest seaport on Puget Sound, and many still sit on original post-and-pier foundations. Out past the city core, in Glen Cove and toward Kala Point, houses run newer — 1960s-80s ranch construction on slab or crawlspace foundations, which makes DADU siting simpler since there's no historic foundation to work around. Zip code 98339 covers Port Hadlock and unincorporated Jefferson County parcels where DCD (Department of Community Development) reviews permits instead of the city, and septic systems are common instead of a sewer main. Marine exposure matters more here than in most Puget Sound cities — wind off Admiralty Inlet drives rain sideways into north-facing walls, so siding choice and flashing detail on a new ADU get checked during framing inspection, not just at final walkthrough.

commonProblems:
  - title: "Basement Conversions Under a Victorian: Post-and-Pier Foundations and Low Ceilings"
    description: "A lot of Port Townsend's older stock near Uptown and downtown sits on post-and-pier foundations from the 1880s and 1890s, and that's exactly where homeowners want to put a basement conversion ADU. Problem is, ceiling height under those joists rarely clears the 7-foot minimum the IRC wants for habitable space, and the rim joist and sister joist framing underneath is often undersized for a new egress window cut. TopVolk's fix is usually a combination: excavate the crawlspace where soil allows, sister joist the existing framing with new Douglas-fir members, run a proper vapor barrier, then lay DriCore subfloor panels to stop moisture wicking up from the ground. Budget $45K-$70K depending on excavation depth and how much original framing needs reinforcement."
  - title: "HB 1337 Changed the Math, But Setbacks and the 24-Foot Height Limit Still Rule"
    description: "HB 1337 lets most Port Townsend lots carry two ADUs now, but the City's Development Services Department still checks setback and lot coverage before anything gets a permit stamp. A standard lot inside city limits typically allows 8 feet off the rear property line and 5 feet off the side, and a DADU can't exceed the 24-foot height limit measured from average grade — that rules out a full second story on some of the steeper lots near Cape George. Lot coverage caps matter too: add up the existing house, garage, and driveway before assuming there's room for an 800-square-foot detached unit. TopVolk runs the lot coverage math during the free consultation, before drawing a wall, so the design matches what gets approved on first plan review instead of bouncing back for revisions."
  - title: "Separate Water, Sewer, and Electrical Service — Or Share the Main Line?"
    description: "Renting out a DADU means deciding whether it gets its own water meter and sewer lateral or shares the house's existing connection, and that decision drives the MEP coordination from day one. Inside Port Townsend city limits, a separate water meter is common for rental units and adds $6K-$12K in trenching and tap fees; out toward Glen Cove or Port Hadlock on a shared well and septic system, DCD wants a septic capacity letter before permits move forward. Electrical almost always needs a new subpanel fed off the main service, sized for a Rinnai tankless water heater and a Mitsubishi mini-split rather than baseboard heat. Volkov coordinates the electrician and plumber directly so rough-in inspection happens once, not three times because trades didn't talk to each other."
  - title: "What a Permitted ADU Actually Costs in Port Townsend"
    description: "Detached ADUs in Jefferson County typically land between $180K and $260K for a permitted 600-900 square foot unit with a full kitchen and bath — basement conversions run less, $45K-$90K, since the shell already exists. Cost drivers are site work (a sloped lot near Kala Point costs more to excavate and pour footings than a flat lot), foundation type, and finish level: IKEA cabinets and laminate counters versus semi-custom cabinets with quartz will swing a bid by $15K-$25K on a kitchenette alone. TopVolk gives a direct quote with line-item pricing, not a range pulled out of thin air, and every contract has a deadline penalty written in — if the job runs past the agreed date, Vladislav pays. Call (206) 591-1096 for a line-item estimate before committing to a design."
  - title: "Rain, Moss, and Marine Air: Building an ADU That Survives a Seaport Climate"
    description: "Port Townsend sits right on the water, and that means wind-driven rain and salt air hit north-facing walls harder than they would 20 miles inland. Cedar shake looks right on a seaport ADU next to a Victorian, but it needs re-staining every 3-4 years or it goes gray and starts holding moisture against the sheathing; Hardie cement-board siding costs more up front but holds up with just a rinse and paint touch-up every 8-10 years. R-49 insulation in the attic and a properly lapped vapor barrier in the crawlspace keep the mildew that shows up on north-facing surfaces from October through May out of the wall cavity. A Mitsubishi mini-split, sized to the square footage rather than oversized, runs efficiently through the mild-but-humid summers and handles the damp cold without cycling constantly."

faq:
  - q: "How fast can you get to Port Townsend for ADU Construction?"
    a: "Port Townsend sits about 90 minutes from the Kitsap Peninsula via the Hood Canal Bridge on Highway 104, and TopVolk already works job sites across Kitsap County, so it's a straight shot for site visits and material deliveries. On-site consultations typically get scheduled within a week of a call. Once permits clear, a detached ADU build runs 4-7 months end-to-end including plan review; a basement conversion is faster, closer to 8-12 weeks. Call (206) 591-1096 to get a visit on the calendar."
  - q: "What does a permitted ADU cost in Port Townsend?"
    a: "Detached units run $180K-$260K depending on size, foundation, and finish level, while basement conversions land between $45K and $90K since the existing shell cuts out site work and framing costs. Utility separation — a new water meter, sewer lateral, or septic capacity upgrade — can add $6K-$15K depending on whether the lot is on city water or a shared well. Every quote from TopVolk is a direct, line-item breakdown, not a ballpark range, after Vladislav walks the lot in person. Schedule a free consultation to get exact numbers for your property."
  - q: "Who handles ADU permits in Port Townsend — the city or the county?"
    a: "It depends on the lot. Properties inside Port Townsend city limits go through the City's Development Services Department, which runs plan review for ADUs in roughly 6-10 weeks for a complete application. Lots in unincorporated Jefferson County — Port Hadlock, Chimacum, Glen Cove — go through Jefferson County DCD instead, and septic-served properties need a capacity letter before submittal. TopVolk is a WA Licensed Contractor and handles the permit application, plan set, and AHJ correspondence directly, so the homeowner isn't the one chasing down missing documents."
  - q: "Can I add a DADU behind my house without giving up my whole backyard?"
    a: "Usually, yes — a typical DADU footprint runs 600-800 square feet, and the 24-foot height limit means going up instead of out is often the better move on a tight lot. Setbacks (commonly 5 feet side, 8 feet rear inside city limits) and lot coverage caps set the real boundary, and TopVolk checks those numbers against your survey before drafting a design. Pre-approved plan sets can speed up review on straightforward lots, but most Port Townsend properties near the historic core need a custom layout because of odd lot shapes or existing outbuildings. A free on-site visit settles what actually fits."
  - q: "How long does an ADU actually last in this climate?"
    a: "Built correctly, a detached ADU with Hardie siding, a properly vented roof, and R-49 attic insulation should perform for 40+ years with normal maintenance — the same as a well-built primary house. Cedar shake and wood trim need more attention here given the rain and marine air, typically restaining every 3-4 years. TopVolk's work carries a workmanship warranty, and manufacturer warranties on windows (Milgard), water heaters (Rinnai), and mini-splits (Mitsubishi) carry through separately. Moisture problems from a missed vapor barrier or bad flashing detail are the main thing that shortens a building's life out here, which is why crawlspace and roof details get checked before drywall goes up."
  - q: "Do you cover areas near Port Townsend too?"
    a: "Yes — TopVolk already works throughout Kitsap County and takes on jobs across the Olympic and Kitsap Peninsulas as they come up, including Port Hadlock, Chimacum, and Port Ludlow around Port Townsend. Scheduling windows run 2-4 weeks out for a first site visit during busier stretches. Vladislav handles every consultation personally, so what gets discussed on-site is what ends up in the quote. Call (206) 591-1096 or request a free consultation to get on the schedule."