  - q: "What does a kitchen remodel cost in Port Townsend?"
    a: "A full kitchen remodel in Port Townsend typically runs $35,000 to $85,000, with the spread driven by cabinet tier, whether a load-bearing wall or gas line moves, and appliance choices like Bosch versus GE Profile. Smaller cosmetic refreshes — new counters, cabinet fronts, backsplash — land closer to $15,000 to $25,000. Every estimate from TopVolk is a line-item quote after an on-site walkthrough, not a phone-quoted range, so you see beam cost, cabinet cost, and finish cost separately before signing. That written quote also carries a deadline penalty clause. Call (206) 591-1096 for a free estimate."
  - q: "Do I need a permit for a kitchen remodel in Port Townsend?"
    a: "Yes — any kitchen remodel touching electrical, plumbing, or a load-bearing wall needs permits through the City of Port Townsend Development Services Department if you're inside city limits, or Jefferson County DCD if you're out in Port Hadlock or Kala Point in the 98339 area. If your house sits in the Victorian historic district uptown, interior kitchen work doesn't trigger design review — that only applies to street-facing exterior changes. Plan review typically takes 3 to 6 weeks for a remodel with structural or gas scope. TopVolk Construction is a WA Licensed Contractor and handles the permit application and inspections directly."
  - q: "Should I choose quartz or granite for a Port Townsend kitchen?"
    a: "Quartz is the better call for most kitchens out here — it's non-porous, so it won't absorb moisture or stain from berry juice and salmon prep the way granite can if the sealer's overdue. Granite still has fans for the natural variation and heat resistance near a gas range, and it runs slightly cheaper per square foot installed. We template after cabinets are set and lay a full plywood substrate underneath either material, since older Victorian subfloors aren't always level. Either way, we bring samples to the on-site walkthrough so you're choosing under your own kitchen light, not showroom light."
  - q: "What's the warranty on a Port Townsend kitchen remodel?"
    a: "TopVolk backs cabinetry, countertop installation, and finish carpentry with a one-year workmanship warranty, on top of whatever the manufacturer covers on appliances like KitchenAid or Samsung. In this climate, the biggest long-term risk to a kitchen isn't the cabinets — it's moisture intrusion from an unsealed exterior wall or a crawlspace without a proper vapor barrier, so we address those before finish work goes in. A well-built kitchen out here should go 20-plus years before another full remodel, with routine caulk and hardware maintenance in between. Ask about specific warranty terms during your free consultation."
