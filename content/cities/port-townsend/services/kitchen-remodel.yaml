title: "Port Townsend Kitchen Remodel — Victorian Bluff Homes"

answer: "Vladislav Volkov of TopVolk Construction handles full kitchen remodels in Port Townsend, WA — $35K-$85K typical cost, 100+ projects completed since 2017."

intro: |
  A full kitchen remodel in Port Townsend runs about 6 to 10 weeks from demo to final inspection, and Vladislav Volkov handles the whole job himself instead of routing you through a call center. Ask anyone who's tried to slide a 30-inch GE range into a 1890s Victorian kitchen on the Uptown bluff near Chetzemoka Park — the doorway's too narrow, the wall between the kitchen and the old butler's pantry is framed with full-dimension Douglas-fir studs, and nothing in the house is square. Down toward Kala Point and North Beach, the housing stock skews newer — 1970s-90s ranch-style homes with drop ceilings and laminate counters that mostly just need a smarter layout. Either way, TopVolk Construction has completed 100+ remodels across the Puget Sound since 2017, with a deadline penalty written into every contract. Call (206) 591-1096 for a free on-site walkthrough.

localContext: |
  Most of Port Townsend proper falls under zip code 98368, from the Victorian storefronts on Water Street up to the bluff neighborhoods in Uptown and out toward Fort Worden State Park. Head south toward Port Hadlock and Kala Point and you're in 98339, still Jefferson County but permitted through the Jefferson County Department of Community Development instead of the city's own Development Services Department. The housing stock splits into two eras that matter for kitchen work: pre-1910 Victorian-era homes with post-and-pier foundations and knob-and-tube wiring still lurking in some walls, and 1960s-90s ranch and split-level construction with more forgiving stud spacing but original galvanized plumbing. Marine air off Admiralty Inlet keeps humidity high year-round, so any crawlspace access under an older kitchen needs a proper vapor barrier before cabinets go back in, or moisture wicks straight up into new subfloor. Permit review through the city typically runs 3 to 6 weeks for a kitchen remodel with electrical and plumbing changes.

commonProblems:
  - title: "Load-bearing walls hiding behind plaster in Uptown Victorians"
    description: "Plenty of Uptown Victorians built between 1890 and 1910 have a load-bearing wall separating the kitchen from the dining room, usually carrying full-dimension old-growth Douglas-fir joists overhead instead of modern engineered lumber. Pull that wall without a plan and the bedroom floor above starts sagging within a year. We size an LVL beam and PSL post to carry the load, pull a structural permit through the City of Port Townsend Development Services Department, and use Simpson Strong-Tie joist hangers to tie the new beam into the existing rim joist. Shoring the ceiling during the cut usually adds two to three days to the schedule. Total cost for the wall removal and beam package typically runs $6,000 to $11,000 depending on span length, separate from cabinet and finish budget."
  - title: "Galvanized supply lines choke water pressure at the sink"
    description: "Ranch homes built in the 1960s and 70s around Kala Point and Glen Cove often still run galvanized steel supply lines to the kitchen, and forty-plus years of mineral buildup inside the pipe wall chokes flow down to a trickle right when you install a new Moen pull-down faucet or a Bosch dishwasher that needs steady pressure. We repipe from the water heater to the sink in PEX, add a new shutoff valve, and pressure-test before drywall goes back up. Where old galvanized ties into copper further down the line, we swap the dielectric union too, since galvanized-to-copper contact corrodes fast in this area's humid marine air. Repiping the kitchen run alone adds roughly $1,200 to $2,800 to a remodel, depending on wall access."
  - title: "Permit-required gas line moves and range hood venting"
    description: "Moving a gas range six feet to open up the layout means moving the gas line, and that triggers mechanical permit review, not just a building permit, through the city's Development Services Department. Any new run needs a sediment trap, correct pipe sizing for BTU load, and a pressure test before the AHJ signs off on rough-in inspection. Ducted range hoods need it too — code calls for makeup air once a hood pulls past 400 CFM, which matters if you're upgrading to a 36-inch KitchenAid or GE Café range with a high-output hood. TopVolk Construction is a WA Licensed Contractor and pulls mechanical and gas permits before any line gets cut, not after. Plan review for a kitchen remodel with gas and electrical changes typically takes 3 to 6 weeks in Port Townsend, so we build that into the schedule up front, with a deadline penalty in the contract if we run past it."
  - title: "What actually drives the price of a Port Townsend kitchen remodel"
    description: "Full kitchen remodels in Port Townsend run $35,000 to $85,000 depending on three things: cabinet tier, whether structural work is involved, and appliance package. Semi-custom cabinets or IKEA cabinet boxes with upgraded fronts both come in well under full custom, and for household budgets in this area that gap often decides the project. Quartz counters run $65-$110 per square foot installed versus granite at $50-$90, but quartz doesn't need sealing and handles tannin stains from salmon and blackberries better over time. Electrical panel upgrades from 100A to 200A service add $2,800-$4,500 when a homeowner wants an induction range and a heat pump water heater on the same panel. Every quote from TopVolk is line-item, not a lump-sum guess, so you know what the beam costs versus the backsplash before signing."
  - title: "Cabinet boxes and countertops taking on marine-climate moisture"
    description: "Cabinet boxes and countertops in a marine climate take more abuse than people expect — condensation on a north-facing kitchen window drips onto the sill and rots particleboard cabinet bases within five to eight years if there's no flashing or vapor barrier behind the wall. We spec moisture-resistant plywood boxes and finish exposed ends with cabinet-grade laminate instead of raw MDF for that reason. A Bosch or Whirlpool dishwasher installed with a proper air gap and braided supply line typically runs 10-12 years before the pump wears out; the ones that fail early usually got installed without one. Quartz counters need zero maintenance beyond regular cleaning, while butcher block needs oiling every few months near the sink or it checks and cups. We back cabinetry and countertop installation with a one-year workmanship warranty on top of manufacturer coverage."

