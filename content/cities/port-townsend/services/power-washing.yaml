title: "Port Townsend Power Washing — Victorian Siding & Sea Fog"

answer: "TopVolk Construction soft-washes roofs, siding, decks, and driveways in Port Townsend, Washington. Same-day jobs. Free on-site quotes. Owner-run since 2023."

intro: |
  TopVolk Construction runs soft-wash and pressure-washing jobs on roofs, siding, decks, fences, and concrete throughout Port Townsend, Washington. Most single-family properties wrap up in one day. You get a free on-site quote before any chemical touches the house.

  Water Street's old brick storefronts collect the same salt haze and diesel soot off Admiralty Inlet that settles on the cedar shake roofs up in Uptown Port Townsend. Left alone, that mix turns dark green within two or three seasons.

  Up near North Beach and around Kah Tai Lagoon, houses built during the 1890s land boom still wear their original cedar siding or clapboard. A lot of it has never seen anything harsher than rainwater. Blast that wood at full pressure and you'll do more damage than the moss ever would.

  Vladislav Volkov bids these jobs himself, not a sales rep reading off a script. He'll say straight up when a roof needs a Wet & Forget treatment instead of a pressure washer. WA Licensed Contractor, 100+ projects completed since 2023, and the estimate you get is the price you pay.

localContext: |
  Most of Port Townsend sits inside 98368. The edge of the service area bleeds into Port Hadlock's 98339 along Oak Bay Road. The Victorian core — the National Historic Landmark District downtown, plus the bluff above it in Uptown — means a lot of siding is original T1-11 cedar or true clapboard from the 1880s and 90s. That's not what you'd find on a newer build out past Discovery Road, where Hardie fiber-cement siding is standard.

  Fog off the Strait of Juan de Fuca and Admiralty Inlet rolls through most mornings from October through May. It sits longest on north-facing walls and roof slopes. Chetzemoka Park and the lower blocks toward Point Hudson Marina get it worst. That's exactly where moss and black algae streaks show up first.

  So many structures here fall inside the historic district. Exterior work on a designated building runs past the Jefferson County Historic Preservation Committee before repainting. The wash itself doesn't need that review. Crawlspaces under these older homes are usually vented, not sealed. Heavy runoff near the foundation has to be routed away from those vents, not just hosed downhill.

commonProblems:
  - title: "Moss packed into cedar shake roofs above Uptown and Fort Worden"
    description: "Cedar shake absorbs the fog that sits over Uptown most mornings. Moss rhizoids work down into the butt joints between shakes faster than they would on composition shingle. Left alone two winters, that moss lifts the shakes and backs water up under the ridge cap — that's how a $400 cleaning turns into a $6,000 roof section replacement. TopVolk uses a low-pressure soft wash, a sodium hypochlorite mix, not a 3000 psi wand, applied with a Wet & Forget style treatment that keeps spores from coming back for 12-18 months. Gutter and downspout clearing is part of the same visit since moss debris clogs both. Average job runs $350-$650 depending on roof pitch and shake condition."
  - title: "Cedar deck boards graying and cracking before staining season"
    description: "Original cedar decks around North Beach and Cape George take a beating. Fog moisture sits between the deck boards and the joists underneath. Mildew builds in the grain before anyone notices the color change. Pressure washing that gray layer off requires a fan-tip nozzle at low PSI. A turbo nozzle here will feather the wood fibers and ruin the surface for stain adhesion. TopVolk brightens with an oxalic-acid wood brightener, then lets the deck dry 48 hours. Next comes Cabot or Thompson's WaterSeal, whichever matches what's already on the boards. Deck cleaning and brightening runs $250-$500 for an average 300 sq ft deck. Staining is quoted separately."
  - title: "Siding wash before a historic-district repaint"
    description: "Newer infill homes near Glen Cove use Hardie fiber-cement siding. It handles pressure better than old clapboard, but still needs a bleach-based soft wash to kill mildew before Sherwin-Williams paint will bond right. Older Victorian-district homes with true wood clapboard or stucco need a gentler approach: low pressure, wider fan tip, no direct blast at butt joints or window trim. Forcing water behind old caulking causes rot nobody sees until the next dry-rot inspection. If a house is a designated structure in the National Historic Landmark District, the repaint itself, not the wash, goes through the Jefferson County Historic Preservation Committee. TopVolk builds that review timeline, usually 2-4 weeks, into the project schedule. Wash-only jobs before a DIY repaint run $300-$550."
  - title: "Driveway oil stains and tire marks on Discovery Road and Hastings Avenue homes"
    description: "Concrete driveways collect brake dust, motor oil drips, and tire rubber. Over a few winters that residue bonds with efflorescence, the white mineral bloom that rises out of the slab itself. A regular garden-hose rinse won't touch either one. It takes a rotary surface cleaner at 3000-3500 PSI plus a degreaser like Krud Kutter or Simple Green worked into the stain before rinsing. Pricing runs by square footage — a typical two-car driveway runs $150-$300, a full driveway-plus-walkway job runs $250-$450. Heavier oil staining or a first-time cleaning on a driveway that's never been washed adds time and usually lands at the top of that range. Sealing after cleaning is optional and quoted separately."
  - title: "Fence boards due for the 3-5 year restaining cycle"
    description: "Cedar and PT lumber fences around Kah Tai and the residential streets off Sims Way go through the same weathering cycle as decks. UV graying hits the south side. Moss builds on the north side. Dry rot creeps up from the ground-contact posts if the original PT lumber wasn't rated for it. TopVolk washes both faces of the fence at low pressure, checks for soft spots at the post bases, and flags any board that needs swapping before restaining instead of after. Sherwin-Williams and Behr solid-body stains hold up best here, given the freeze-thaw swings out toward Cape George. Fence washing runs $2-$4 per linear foot depending on height and board spacing. Most residential fences land in the $300-$700 range."

faq:
  - q: "How fast can you get to Port Townsend for Power Washing?"
    a: "Most Port Townsend jobs get scheduled within a week. The crew comes over Highway 20 or across the Hood Canal Bridge, depending on the day's route through Kitsap. Access is usually simple — most driveways and yards here have room for the equipment trailer. Tight lots in the historic district sometimes need hose extensions instead of parking right at the house. A typical roof-and-siding job finishes same day. A full property with deck, fence, and driveway can run into a second day. Call (206) 591-1096 to get on the schedule."
  - q: "What does roof and siding washing cost in Port Townsend?"
    a: "Roof soft-washing runs $350-$650 depending on pitch, shake condition, and moss buildup. Siding washing runs $300-$550 depending on square footage and whether it's original clapboard or Hardie fiber-cement. Combined roof-plus-siding jobs usually land in the $600-$1,000 range. Pricing is affected by how long it's been since the last cleaning — a house that's never been washed takes longer and needs a heavier chemical treatment. TopVolk gives a free on-site quote with exact line-item pricing, not a phone estimate, so call (206) 591-1096 to set up a walkthrough."
  - q: "Does a Victorian-district wash in Port Townsend need a permit?"
    a: "No. The wash itself doesn't need a permit or Historic Preservation Committee review. That review only kicks in when the exterior finish changes — a repaint or re-stain on a designated structure. TopVolk handles wash-only jobs on historic-district homes all the time. Vladislav knows which methods are gentle enough not to strip old paint or damage clapboard joints. If a project moves into repainting a designated building, he handles the Jefferson County Historic Preservation Committee timeline himself. WA Licensed Contractor. No middleman handling the paperwork."
  - q: "What PSI and chemicals do you actually use on cedar shake and old siding?"
    a: "Cedar shake roofs and original wood siding get a soft wash. That's under 500 PSI, wide fan tip, sodium hypochlorite mix diluted for wood. Never a turbo nozzle or rotary tip — those strip fibers. Concrete and pavers get the higher end: 3000-3500 PSI with a rotary surface cleaner for even coverage without streaking. Decks get an oxalic-acid brightener before any stain goes on. Cabot and Thompson's WaterSeal both need a clean, open wood grain to bond. The method changes by surface. It's never a one-setting wand for everything."
  - q: "How long does a power wash last before moss comes back in this climate?"
    a: "A soft wash with a moss-inhibiting treatment like Wet & Forget typically holds 12-18 months on roofs before moss comes back. North-facing sections near Fort Worden or Chetzemoka Park's tree cover trend toward the shorter end. Driveways and siding generally go 2-3 years between washes, unless there's heavy tree canopy overhead. There's no product warranty on moss regrowth, since that's driven by shade and moisture, not workmanship. TopVolk stands behind the wash itself and the surface prep before any staining or sealing work."
  - q: "Do you cover areas near Port Townsend, and how far out do you book?"
    a: "Yes. Port Hadlock, Chimacum, and the Quimper Peninsula are all part of the regular route. Sequim and Poulsbo runs get added on the same trip when scheduling allows. Booking is usually 3-7 days out depending on season. Spring is the busiest stretch, since everyone tackles the winter moss buildup at once. Vladislav quotes and runs the job himself — no sales rep, no subcontracted crew showing up instead of the person who bid it. Call (206) 591-1096 to check the current schedule."