title: "Port Townsend Door Installation — Fort Worden to Uptown"

answer: "TopVolk replaces entry, patio, and garage doors in Port Townsend, WA — WA Licensed Contractor, 100+ projects completed, owner-led by Vladislav Volkov."

intro: |
  Nine times out of ten, a sticking front door in Port Townsend traces back to a house that was framed before 1910 and has been settling — a little more every wet winter — ever since. TopVolk gets calls from Uptown and the Cape George area for the same reason: original solid-fir doors swollen tight against jambs that are no longer square. A fiberglass replacement with a proper sill pan and PVC threshold solves the swelling for good, and it holds up better against wind off Admiralty Inlet than old-growth cedar ever did. Other jobs are simpler — a homeowner near Fort Worden State Park wants a Schlage Encode smart lock added to a new entry door, or a Kala Point condo needs a sliding patio door swapped for a Milgard French door before winter storms roll in. Either way it's Vladislav on site measuring the rough opening, not a sales rep, and TopVolk has handled 100+ door and remodel projects across the Puget Sound area since 2017.

localContext: |
  Zip code 98368 covers almost all of Port Townsend proper, from the bluff above Point Hudson down through Uptown and out past Kah Tai Lagoon; 98358 picks up Nordland and the Marrowstone Island side of the service area. Downtown and Uptown still carry a lot of the original Victorian building stock — homes built 1880-1910 with true 2x4 old-growth framing and door openings that rarely match a standard 36-inch slab anymore. Out toward Kala Point and Cape George you'll find more 1970s-90s construction, plus newer infill near Discovery Road that already meets current energy code. Any exterior door change on a house inside the Port Townsend National Register Historic District — most of downtown and a chunk of Uptown — gets reviewed by the city's Historic Preservation Committee before a permit is issued, and that review looks hard at door style, panel configuration, and hardware. Add in wind-driven rain off Admiralty Inlet and the Strait, and flashing detail at the header matters more here than in a lot of inland King County towns.

commonProblems:
  - title: "Original Fir Entry Doors Swelling in Victorian Homes"
    description: "A lot of the entry doors on the Uptown bluff and around Franklin Street are still the original solid-fir slabs from the 1890s-1900s, hung on true-dimension jambs that don't match anything at the lumber yard today. Decades of wet winters swell the stiles, the door drags on the sill, and the finish coat cracks at the panel joints faster than it should. Pulling the old slab and setting a Therma-Tru fiberglass door with a wood-grain panel profile that matches the original — over a new sill pan and self-adhered flashing membrane at the header — stops the swelling for good and holds paint another decade. Budget $2,200-$4,200 installed depending on hardware and whether the jamb needs full replacement; most of these jobs run two to three days including trim carpentry."
  - title: "Interior Doors Out of Square After Foundation Settling"
    description: "Plenty of the craftsman and Victorian-era homes off Lawrence Street and near Chetzemoka Park still sit on original post-and-pier foundations, and a century of settling means almost no interior doorway is actually square anymore. That shows up as a door that swings open on its own, a latch that never quite catches the strike plate, or a gap at the top of the jamb wide enough to see daylight. During a remodel, TopVolk resets the jamb legs plumb with cedar shims, cuts a new mortise for the hinges, and hangs a JELD-WEN or Masonite slab sized to the actual opening instead of forcing a stock door to fit. Casing gets replaced to hide the shim gaps rather than caulked over. A single interior door runs $450-$900 with casing; a whole-house pass during a remodel (8-10 doors) typically runs $4,500-$7,500."
  - title: "Patio Slider to French Door Conversions Near the Historic District"
    description: "Swapping a tired aluminum slider for a Milgard or Pella multi-slide door sounds simple until the house sits inside the Port Townsend Historic District, which covers most of downtown and a chunk of Uptown. Any exterior door change there needs a permit application through the City of Port Townsend Development Services Department, and if the house is a contributing structure, a quick review by the Historic Preservation Committee before the permit gets issued — usually a 1-2 week add-on, not a redesign. Outside the district, in Kala Point or Cape George, it's a standard building permit with no design review at all. Either way, TopVolk pulls the permit, handles the rough opening framing (new king studs, header sized for the span, PT sill plate), and flashes the opening before the new door goes in. Plan on 2-3 weeks total from order to install, longer if the header needs an LVL upsize."
  - title: "Garage Door Replacement Costs and What Actually Drives the Price"
    description: "Garage door jobs in Port Townsend usually land between $1,800 and $4,200 installed, and the spread comes down to panel construction more than anything else. A single-layer steel door is the cheap option, but it dents easily and does nothing for the shop or bonus room behind it; a Clopay or Amarr door with R-12+ polyurethane-backed panels holds heat a lot better through a Jefferson County winter and resists the dents that show up from a bike or kayak rack. Pricing also moves with torsion spring size, whether the old track and drum need replacing, and whether you want a Wi-Fi opener instead of a basic chain-drive unit. TopVolk gives a line-item quote before any work starts — spring, track, panel, opener broken out separately, not a lump number. Most insulated doors carry a 10-year manufacturer warranty on the panel core."
  - title: "Weatherstripping, Thresholds, and Smart Locks — When to Repair vs Replace"
    description: "Weatherstripping is the cheapest fix that gets skipped the most. A door that still hangs straight but lets in a draft off the Strait usually just needs new kerf-in foam weatherstrip and an adjustable aluminum threshold — a $150-$350 fix that stops the cold-air leak at the bottom corners where it's worst. If the slab itself is delaminating, cupped, or the bottom rail is soft from years of splashback, that's a replacement job, not a repair, and no amount of caulk fixes rotten composite. TopVolk installs Schlage Encode or August smart locks on new or existing entry doors during the same visit, since the wiring and deadbolt bore usually need to be redone anyway. A well-installed fiberglass or steel entry door with proper flashing should last 20-30 years out here; a builder-grade hollow-core slab exposed to weather might not make it past 10."

faq:
  - q: "How fast can you get to Port Townsend for Door Installation?"
    a: "Port Townsend sits about a 90-minute drive from the Seattle side once you cross the Hood Canal Bridge on Highway 104, or a shorter run off the Kingston ferry. TopVolk schedules Jefferson County jobs in blocks — usually one or two site visits a week out this way — so the first step is a call to lock in a measure date. Most standard entry, interior, or garage door installs go from measure to finished install in 2-3 weeks once materials are ordered; French door and multi-slide conversions run closer to 4-5 weeks. Call (206) 591-1096 to check the current schedule and get a firm date."
  - q: "What does entry door replacement in Port Townsend cost?"
    a: "A straight entry door swap — same size opening, no jamb or framing changes — usually runs $1,800-$3,200 installed with a mid-range fiberglass slab, deadbolt, and new threshold. Add a sidelight, a custom size to match an original Victorian opening, or a smart lock, and it climbs toward $4,000-$5,000. Interior doors run $450-$900 each including casing; garage doors run $1,800-$4,200 depending on insulation and opener. TopVolk gives a written, line-item quote after an on-site measure — no vague 'starting at' number — and the estimate is free. Call (206) 591-1096 to set one up."
  - q: "Do I need a permit to replace a door in Port Townsend?"
    a: "Most straightforward door swaps — same size, same location — don't need a permit unless the house sits inside the Port Townsend Historic District downtown or in parts of Uptown, where exterior door changes go through the city's Historic Preservation Committee before Development Services issues a permit. Structural work — a wider opening, a new header, a patio door conversion — needs a building permit either way, city or Jefferson County DCD depending on the address. TopVolk handles the application and drawings and is a WA Licensed Contractor, so the paperwork side is already covered. Typical turnaround is 1-2 weeks for a standard permit, longer if Historic Preservation review is required."
  - q: "Fiberglass vs solid wood entry door — which holds up better here?"
    a: "Fiberglass wins for most Port Townsend entry doors because it doesn't swell, cup, or need repainting every few years the way old-growth fir does once the finish starts failing. A Therma-Tru or Simpson fiberglass slab with a wood-grain texture can still match the look of a Victorian original close enough that most Uptown homeowners are happy with it, and it takes a smart lock bore just as well as wood does. Solid wood is worth keeping only when the house is a contributing structure in the historic district and the door itself has historic value — in that case TopVolk repairs and re-flashes rather than replaces."
  - q: "How long does a new entry or garage door last in Port Townsend's climate?"
    a: "A properly flashed fiberglass or steel entry door typically lasts 20-30 years here, even with wind-driven rain off Admiralty Inlet, as long as the sill pan and threshold stay sealed. Insulated garage doors carry a 10-year manufacturer warranty on the panel core, longer on the torsion spring with regular service. TopVolk backs installation work with a workmanship warranty separate from the manufacturer's coverage, and on scheduled, remodel-scale door packages, missed deadlines come with a penalty written into the contract — not just a promise. Weatherstripping wears out faster, usually every 8-10 years, and is a cheap swap when it does."
  - q: "Does TopVolk cover areas outside Port Townsend, like Sequim or Chimacum?"
    a: "Jefferson County jobs get bundled with the rest of the Kitsap and Olympic Peninsula service area, so TopVolk also covers Chimacum, Port Ludlow, Quilcene, and as far as Sequim on the same trip when schedules line up. Since this side of the water means a ferry or bridge crossing either way, most Jefferson County work gets grouped into a two-day visit — measure and material pickup one day, install the next. Vladislav handles every site visit himself, so there's no subcontractor guessing at the original opening size. Call (206) 591-1096 or ask for a free on-site consultation to get on the schedule."