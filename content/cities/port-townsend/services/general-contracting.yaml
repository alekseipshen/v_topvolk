title: "Port Townsend General Contracting — Historic Home Remodels"

answer: "TopVolk Construction runs full remodels, additions, and ADUs in Port Townsend, WA — owner-led by Vladislav Volkov, 100+ projects since 2017."

intro: |
  TopVolk Construction handles the full scope of general contracting in Port Townsend — permits, framing, MEP coordination, and finish work — as one point of contact, owner-led by Vladislav Volkov since 2017. Most whole-house projects here start with a plaster and lath teardown in an Uptown Victorian and end with a punch list nobody argues about. The housing stock near Fort Worden State Park and Kah Tai Lagoon runs from 1880s balloon-framed originals to 1970s ranchers, and each era hides its own surprises: knob-and-tube wiring, galvanized supply lines, undersized electrical panels. A recent kitchen gut in a Cape George rancher swapped a failing Whirlpool range and a 30-amp circuit for a proper 50-amp run and a Bosch induction cooktop — the kind of change that only makes sense once the wall's already open. Direct quotes with line items, a deadline penalty written into the contract, and no sales rep standing between the homeowner and the person swinging the hammer.

localContext: |
  Port Townsend's building stock splits pretty cleanly by decade. Inside the 98368 core — Uptown and the Water Street historic district — the construction is Victorian-era, 1880s and 1890s, balloon framing, post-and-pier foundations, and plaster walls that don't take kindly to modern HVAC runs without some creative chase work. Out toward Cape George and Kala Point, still zip 98368, the housing shifts to 1960s-80s ranchers and split-levels, with aluminum wiring in some of the 1965-73 builds and galvanized-to-copper plumbing retrofits still pending in more than a few. Head down toward the Port Hadlock corridor, 98339, and Jefferson County's Department of Community Development takes over permitting instead of the City of Port Townsend's Development Services office — different application, different fee schedule. Rain off the Strait of Juan de Fuca runs heavy October through May, and homes on the bluffs near Fort Worden see enough wind-driven moisture that Hardie siding has mostly replaced cedar shake on re-sides. Anything inside the historic district also clears a design review layer most other Jefferson County parcels skip entirely.

commonProblems:
  - title: "Coordinating framing, rough-in, and finish work without a general contractor"
    description: "A homeowner in an Uptown Victorian who tries to run the electrician, plumber, and HVAC sub separately usually ends up with a Mitsubishi mini-split line set fighting for the same joist bay as a new drain stack. Framing has to go in a specific order — LVL beam and PSL post placement first, then rough electrical, then plumbing, then mechanical — or someone's drilling through someone else's blocking. TopVolk sequences all of it on one schedule, with the rough-in inspection and final inspection booked before demo even starts. A full whole-house remodel here typically runs 5-7 months once permits, framing, and finish work are stacked correctly. Skipping that sequencing on a DIY-managed job usually adds 6-8 weeks of rework."
  - title: "Opening up an 1890s wall and finding a bigger problem than expected"
    description: "Pull the plaster off a wall in a Water Street-era Victorian and it's common to find a rotted rim joist, a sistered floor joist from a repair nobody documented, or a post-and-pier foundation that's shifted a half-inch since the last freeze-thaw cycle. Structural surprises like this show up in roughly one out of three demo openings on pre-1920s houses in Port Townsend. The fix is usually a sistered joist with PT lumber and new joist hangers, or in worse cases a partial foundation repour — figure $4,000-$15,000 depending on how much of the crawlspace is affected. Line-item quotes build in a structural contingency up front instead of a change-order surprise mid-project. Call (206) 591-1096 for a free on-site walkthrough before demo starts, not after."
  - title: "Getting permits approved when the house sits inside the historic district"
    description: "Anything visible from the street inside Port Townsend's National Historic Landmark district — new windows, siding, roofline changes — needs sign-off from the city's Historic Preservation Committee before Development Services will issue a building permit, on top of standard IRC plan review. Outside city limits, toward Cape George or the Hadlock area, Jefferson County DCD handles it instead, with its own application and a different fee schedule. Plan review for a full remodel typically runs 4-8 weeks in Port Townsend depending on scope; additions that touch FAR or setback lines take longer. TopVolk prepares the full permit package — site plan, structural detail, energy code compliance — and manages the back-and-forth with the AHJ directly, WA Licensed Contractor, so the homeowner isn't the one on hold with the permit desk. Most jobs clear plan review and reach a blue tape walkthrough before the six-month mark."
  - title: "What a real Port Townsend remodel budget looks like, line by line"
    description: "Median household income in Port Townsend sits around $53,700, and it shows in what gets prioritized — a kitchen remodel here is more likely to swap a tired GE or Whirlpool range for a mid-range KitchenAid or Bosch than jump straight to a Sub-Zero package. Full kitchen remodels typically land $45,000-$85,000 depending on cabinet grade — semi-custom versus IKEA — and whether the layout moves plumbing. Bathroom gut-and-rebuilds with a curbless shower, Schluter Kerdi waterproofing, and large-format porcelain run $28,000-$45,000. Every quote is line-item, not a vague range, and the contract includes a penalty TopVolk pays if the deadline slips — not a verbal promise. That structure matters more in a market where a mismanaged sub can add weeks nobody budgeted for."
  - title: "Composite decking and DADU builds holding up to Strait weather"
    description: "Wood decks facing the water near North Beach or Fort Worden take a beating from wind-driven rain and salt air — cedar decking left unsealed for even one winter starts graying and cupping. Composite decking, Trex or TimberTech over a PT lumber frame with a properly flashed ledger board, holds up considerably better and needs no annual sealing. On the addition side, WA HB 1337 now allows up to two ADUs per single-family lot statewide, and a DADU in the backyard — capped around 24 ft in height, with its own utility connection — is a common way to add rental income or space for aging parents without touching the historic structure up front. A detached ADU here typically runs $180,000-$240,000 and 4-7 months end to end including permits. Composite decking runs $45-$65 per square foot installed, roughly double PT lumber but with a 25-year warranty instead of a repaint every three years."

faq:
  - q: "How fast can you get to Port Townsend for General Contracting?"
    a: "Port Townsend sits about two hours from Seattle by way of the Hood Canal Bridge out of Kitsap County, or a shorter hop off the Coupeville ferry from Whidbey Island. Vladislav handles the free on-site consultation in person — no call center scheduling, no commissioned closer — usually within a week of the first call. Access on Uptown's narrow, older streets sometimes means coordinating a smaller delivery truck or a street-parking permit during demo, which TopVolk sorts out ahead of time so it's not a surprise on day one. Call (206) 591-1096 to get a walkthrough on the calendar."
  - q: "What does a full home remodel in Port Townsend cost?"
    a: "Whole-house remodels in Port Townsend generally run $80,000-$220,000+ depending on square footage, whether structural work is involved, and finish-level choices like quartz versus granite counters or semi-custom versus IKEA cabinets. Additions and DADUs price separately, usually $180,000-$240,000 for a detached unit, and smaller single-room remodels start closer to $30,000. Structural surprises inside older Victorian framing are the most common reason a number moves after the walkthrough, which is why TopVolk builds a contingency line into the quote instead of adding it later as a change order. Schedule a free consultation at (206) 591-1096 for exact, line-item numbers before signing anything."
  - q: "Do I need a permit for a remodel in Port Townsend?"
    a: "Nearly any remodel that touches structure, electrical, plumbing, or mechanical systems needs a permit — inside city limits that's the City of Port Townsend's Development Services Department, and for county parcels around Cape George or Port Hadlock it's Jefferson County DCD. Houses inside the historic district also need Historic Preservation Committee sign-off before a building permit gets issued, which adds a review cycle most other projects skip. TopVolk, WA Licensed Contractor, prepares the site plan, structural details, and energy code documents and files directly with the AHJ. Plan review typically takes 4-8 weeks for a full remodel, longer if the project touches setback lines or FAR."
  - q: "How do you handle subcontractor scheduling on a big remodel?"
    a: "Framing, electrical, plumbing, and HVAC subs get sequenced on one master schedule instead of homeowners juggling four separate phone numbers — MEP coordination happens before rough-in starts, not after someone's already run a Rinnai tankless line through a joist bay that needed an LVL beam instead. Every phase closes with an inspection before the next trade starts, which keeps the AHJ from red-tagging work down the line. Near the end, the whole house gets a blue tape walkthrough to flag anything before it turns into a punch list item after move-in. Vladislav is on site for the sequencing calls himself, not a project manager reading off a spreadsheet."
  - q: "What's the warranty on a TopVolk remodel, and how does PNW weather affect it?"
    a: "Workmanship is warrantied for one year after final inspection, and manufacturer warranties on things like Milgard windows, Moen fixtures, or a Mitsubishi mini-split carry separately, often 10-25 years depending on the product. Port Townsend's climate — heavy rain October through May and salt air off the Strait — is hard on unsealed cedar and standard asphalt shingle roofing, which is why Hardie siding and composite decking come up so often in quotes here instead of cheaper original-spec materials. Vapor barrier and R-49 attic insulation upgrades are usually recommended on anything built before 1990, since older homes rarely meet current code minimums. Anything installed wrong that fails inside the warranty period gets fixed at no charge."
  - q: "Do you work outside Port Townsend too?"
    a: "Jobs in Port Townsend get bundled with nearby work in Port Hadlock, Chimacum, and the greater Jefferson County area, plus the rest of TopVolk's Seattle Metro service territory across King, Snohomish, Pierce, and Kitsap counties. Scheduling a free consultation usually happens within a week of the first call, and project start dates depend more on permit timelines than crew availability since it's owner-led with subs brought in as needed rather than a standing crew. Most homeowners here book their walkthrough in late summer to get permits filed before the rainy season slows down site work. Call (206) 591-1096 to check current openings."