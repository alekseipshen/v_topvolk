title: "Port Townsend Flooring Installation — Rain-Shadow Ready"

answer: "Flooring installers serving Port Townsend, WA test subfloor moisture, acclimate hardwood 4-7 days, and quote free on-site estimates before any job starts."

intro: |
  A moisture meter reading of 14% under the subfloor in an Uptown Victorian tells a different story than the same reading in a newer build off Hastings Avenue, and that difference decides whether solid oak gets nailed down or engineered hardwood gets glued instead. Port Townsend sits inside the Olympic rain shadow, so annual rainfall runs closer to 19-20 inches instead of Seattle's 37 — but marine air off the Strait of Juan de Fuca still pushes humidity into crawlspaces near Point Hudson and the Fort Worden bluff, which is exactly where solid hardwood swells if it goes down too fast. Vladislav Volkov's crews run a 4-7 day acclimation period on every hardwood job here, checking boards with a pin meter before a nail gun ever fires. Homeowners near Chetzemoka Park with a 1970s GE range still parked over old asbestos tile call before they call a demo crew — for good reason. Call (206) 591-1096 for a free on-site estimate before ordering a single box of Mohawk or Shaw flooring.

localContext: |
  Most of the housing stock inside 98368 dates to two very different eras — hand-built Victorians from the 1880s-1900s clustered around the Uptown Historic District and Water Street, and single-story mid-century and manufactured homes scattered along San Juan Avenue and out toward Discovery Road. The Victorians usually sit on post-and-pier foundations with vented crawlspaces that pull in damp air straight off the harbor, which means a 6-mil poly vapor barrier and a moisture reading come before any oak strip goes down. Out past city limits in 98339 (Port Hadlock), Jefferson County's Dept of Community Development handles permitting instead of the city, though most flooring jobs don't trigger a permit at all unless subfloor framing gets replaced or a load-bearing wall opens up for a new layout. Homes inside the Uptown historic overlay only face design review on exterior changes, so interior flooring swaps move fast. Median household income here runs under $54,000, so a lot of these houses still carry original 1960s finishes nobody's touched since the GE range was new.

commonProblems:
  - title: "Solid hardwood that gets nailed down too soon"
    description: "Solid oak T&G flooring wants to sit inside the house, banded and unwrapped, for 4 to 7 days before installation — longer if the job's near the water in Point Hudson or Fort Worden, where marine air keeps ambient humidity higher than the rest of town. Skip that step and boards read 6% moisture at delivery, jump to 9-10% two weeks after installation, and you get cupping along the seams by spring. TopVolk checks every bundle with a pin meter against the subfloor reading before a nail gun ever touches a Mohawk or Bruce strip. Rushing the schedule to hit a move-in date is the single biggest reason hardwood floors fail here in year one. Redoing a cupped floor runs $8-12 per square foot on top of the original job — acclimation itself costs nothing but a few days of patience."
  - title: "Slab-on-grade additions can't take solid hardwood, period"
    description: "A handful of newer additions and in-fill homes near Kah Tai Lagoon sit on slab-on-grade foundations instead of the crawlspaces common in older Port Townsend housing, and solid hardwood simply can't go over a slab — moisture wicking up through concrete will destroy it inside two years. TopVolk runs a calcium chloride test on any slab before quoting the job; readings over 3 lbs per 1,000 sq ft per 24 hours mean a vapor barrier membrane goes down first, then engineered hardwood or click-lock LVP gets glued or floated on top. Engineered product like COREtec holds up fine on a slab because the plywood core doesn't move the way solid oak does. Skipping the moisture test to save a $150 fee is how a $9,000 floor turns into a warranty claim."
  - title: "Old vinyl asbestos tile under a 1960s GE range"
    description: "Kitchens built in the 1960s inside older Port Townsend neighborhoods and out toward Port Hadlock often hid 9-inch vinyl asbestos tile (VAT) under the linoleum, especially in houses that still have the original GE or Hotpoint range parked in the corner. WA Dept of Labor & Industries requires an AHERA-certified abatement contractor before that tile or the black mastic underneath gets disturbed — TopVolk pulls a sample, sends it to a certified lab, and waits for results before any demo starts. Abatement runs roughly $8-15 per square foot depending on how much mastic has to come up, and it adds 1-2 weeks to the schedule for testing and disposal paperwork. Skipping this step isn't a fine you want to risk — it's a health hazard for whoever's swinging the pry bar. Call (206) 591-1096 before pulling up old kitchen flooring yourself."
  - title: "What actually moves the price per square foot"
    description: "Flooring quotes in Port Townsend swing from $6 a square foot for basic click-lock LVP to $14-18 for solid oak strip milled to match an existing 2-1/4 inch pattern in a restoration project. Matching old-growth Douglas-fir or oak in a century-old Uptown Victorian usually means a custom mill run, since big-box stores don't stock that width anymore — that alone can add $3-4 a square foot over a standard install. Subfloor condition matters too: sistering a few joists or replacing a rotted rim joist section near a leaky exterior wall costs more than the flooring itself in some older homes. TopVolk gives a line-item quote after a free on-site visit, not a phone estimate, so the number doesn't move once the crew shows up. Every hardwood job carries a manufacturer finish warranty plus a labor warranty backed by an owner who's still doing the work himself."
  - title: "Sound-dampening underlayment and hardwood-to-tile transitions"
    description: "A few of the multi-family conversions near Uptown and the old mill buildings run flooring jobs where a condo association requires a minimum sound rating (IIC) before anyone installs hardwood or LVP over a shared floor — that means a cork or rubber underlayment goes down first, not the builder-grade foam pad most stores push. In the Craftsman and Victorian entries around Franklin and Taylor Street, the old transition from oak strip to a tiled mudroom or bath is usually just a warped wood threshold; TopVolk swaps those for a Schluter Reno-Ramp or Jolly profile that won't crack with seasonal movement. Solid hardwood with an aluminum oxide finish holds up 30-40 years between refinishing sand jobs; LVP wear layers are rated for 20-25 years of foot traffic. Refinishing an existing oak floor instead of replacing it usually runs $3-5 a square foot — worth checking before tearing anything out."

