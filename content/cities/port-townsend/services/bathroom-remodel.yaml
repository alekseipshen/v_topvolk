title: "Port Townsend Bathroom Remodel — Victorian Homes to Ranch Retrofits"

answer: "TopVolk Construction remodels bathrooms in Port Townsend, Washington for $18,000-$45,000, most jobs done in 3-6 weeks, owner-run by Vladislav Volkov."

intro: |
  Most bathroom remodels in Port Townsend run $18,000 to $45,000, and the number swings hard depending on whether we're gutting a 5x7 down to the studs or just swapping a tub for a curbless shower. Well water is common outside city limits, and hard water scale eats chrome Moen fixtures faster than you'd expect — a homeowner near Kah Tai Lagoon called us in because her shower valve seized up after eight years, not twenty. Uptown Port Townsend still has a good stock of Victorian-era homes from the 1880s-90s boomtown days, and their bathrooms were often squeezed into old closets or pantries during a 1970s or 80s update, which means tight framing and galvanized pipe we have to work around. Closer to Fort Worden, we've opened up walls and found cast-iron drain stacks that have been draining fine for a hundred years but won't pass a modern rough-in inspection without rerouting. Every job gets a line-item quote before demo starts, not a ballpark guess.

localContext: |
  Port Townsend sits almost entirely in one zip code, 98368, though we also pull jobs from Chimacum and Port Hadlock (98325 and 98339) on the edge of the county. Downtown and Uptown Port Townsend carry the Victorian housing stock the city is known for — steep gable roofs, horsehair plaster, and bathrooms that got shoehorned in decades after the house was built. Out toward North Beach and Cape George you'll find more 1960s-80s ranch construction with fiberglass tub surrounds original to the house, plus a fair number of homes on private wells with iron and mineral staining in the tile grout. Permits for work inside city limits go through the City of Port Townsend Development Services Department; anything in unincorporated Jefferson County — Chimacum, Discovery Bay, Cape George — runs through Jefferson County DCD instead, and the two offices don't always move at the same speed. Marine air off Port Townsend Bay keeps humidity high year-round, so exhaust fan sizing and vapor barrier detailing matter more here than in a drier inland town.

commonProblems:
  - title: "1980s vanities and fiberglass tub surrounds past their service life"
    description: "A lot of North Beach and Cape George homes got a bathroom facelift sometime in the 80s or 90s and haven't been touched since — cultured marble vanity tops, a one-piece fiberglass tub surround, and a PVC trap that's cracked at the joint. The cultured marble chips and yellows, and the surround flexes when you lean on it, which tells us the backer board behind it is soft. We pull it to the studs, run new PEX supply lines, set a Kohler or Moen valve, and tile with large-format porcelain over Schluter Kerdi board. That phase alone runs $9,000-$14,000 depending on footprint, and it's usually done in two weeks once demo starts."
  - title: "Moisture damage behind tile from marine humidity"
    description: "Port Townsend sits right on the water, and that marine layer works its way into bathrooms that don't have a properly sized exhaust fan or any vapor barrier behind the tile. We've pulled surrounds off tubs in Uptown homes and found black mold staining climbing the studs because a builder-grade fan was moving maybe 50 CFM in a room that needed 80-110. The fix is a Broan or Panasonic fan sized to the room, RedGard or Schluter Kerdi liquid membrane under the tile, and a proper vapor barrier lapped correctly at the wall-ceiling joint. That waterproofing upgrade adds roughly $1,500-$3,000 to a remodel but stops the mold from coming back."
  - title: "Walk-in shower conversions and the permit sequence"
    description: "Converting a tub to a curbless or low-curb walk-in shower means moving drain lines, which triggers a permit review whether you're inside Port Townsend city limits or out in unincorporated Jefferson County. We draw the layout, submit for plan review with the City of Port Townsend Development Services Department or Jefferson County DCD depending on the address, and schedule the rough-in inspection before any tile goes down. In older homes near Kah Tai, that shower conversion sometimes means rerouting a cast-iron drain stack that's a century old — we'll sister in PVC or ABS at the transition and reinforce framing with blocking. Plan review typically adds one to three weeks to the schedule before we can start."
  - title: "What actually drives the cost of a Port Townsend bathroom remodel"
    description: "A straight cosmetic refresh — new vanity, toilet, fixtures, same layout — lands around $12,000-$18,000. A full gut with layout changes, a curbless shower with a Schluter Kerdi pan, niche, and bench, plus new plumbing runs, pushes into the $30,000-$45,000 range. Tile choice moves the number too — large-format porcelain costs less to install than small mosaic, but quartz vanity tops cost more than laminate. We give an itemized quote up front, not a range, and if we miss the completion date we agreed to, there's a penalty written into the contract. Call (206) 591-1096 for a free on-site estimate with Vladislav directly, no sales rep involved."
  - title: "Ventilation, ADA retrofits, and aging-in-place upgrades"
    description: "Port Townsend has a higher share of retirees than most Puget Sound towns, and a lot of our calls here are homeowners planning ahead — grab bars, a curbless shower entry, and blocking installed in the wall before drywall goes up so the bars are anchored into framing, not just drywall anchors. We also see plenty of ventilation retrofits on their own: swapping a tired 1990s fan for a quieter, properly vented Broan unit ducted straight outside instead of dumping into the attic, which is a mold problem waiting to happen on the Olympic Peninsula. A grab bar and blocking package runs $600-$1,200; a full ADA-style curbless shower conversion runs closer to $10,000-$16,000. Expect the tile and grout to hold up 15-20 years before regrouting is worth doing."

faq:
  - q: "How fast can you get to Port Townsend for a bathroom remodel?"
    a: "We cover Jefferson County out of our Seattle Metro base, so we schedule Port Townsend jobs in blocks rather than one-off trips — usually a same-week site visit once you call. Parking downtown and in Uptown can be tight on Victorian-era lots, so we plan material staging and dumpster placement during the estimate, not on day one. Most bathroom remodels start within 2-4 weeks of signing. Call (206) 591-1096 to get on the schedule or ask for a free on-site consultation."
  - q: "What does a full bathroom remodel cost in Port Townsend?"
    a: "Most jobs run $18,000 to $45,000. A fixture refresh — new vanity, toilet, faucet, same footprint — sits at the low end; a full gut with a layout change and walk-in shower conversion pushes toward $45,000. Tile selection, vanity material, and whether we're rerouting plumbing (common in Victorian homes near Uptown) all move the number. You get a line-item quote after the on-site visit — not a phone estimate and not a vague range. Call (206) 591-1096 for a free walkthrough with Vladislav Volkov directly."
  - q: "Do I need a permit for a bathroom remodel in Port Townsend?"
    a: "If you're moving plumbing, changing the footprint, or converting a tub to a shower, yes — that goes through the City of Port Townsend Development Services Department if you're inside city limits, or Jefferson County DCD if you're out in Chimacum or Cape George. A cosmetic swap of the same fixtures in the same spot usually doesn't need one. We handle the permit application, plan drawings, and inspection scheduling as part of the job. TopVolk is a WA Licensed Contractor, so the paperwork and inspections are on us, not you."
  - q: "What's the difference between RedGard and Schluter Kerdi for waterproofing?"
    a: "RedGard is a liquid-applied membrane you roll or trowel on over cement board — it's fast and works well on walls and tub surrounds. Schluter Kerdi is a bonded sheet membrane, usually the better call for a full curbless shower pan or a bench and niche where you need a guaranteed watertight seam. We pick based on the shower design, not just habit — a walk-in with a niche and bench almost always gets Kerdi. Either way, marine humidity here means we're not skipping this step."
  - q: "How long will a new bathroom hold up in Port Townsend's climate?"
    a: "Porcelain tile and a properly waterproofed shower pan should last 20+ years with no issues if the exhaust fan is sized right and actually gets used. Grout lines are the weak point — expect to regrout or reseal every 8-12 years given the marine humidity here. Fixtures on well water systems with hard minerals may need valve service sooner than city-water homes. We warranty our workmanship, and Kohler and Moen fixtures carry their own manufacturer warranties on top of that."
  - q: "Do you cover areas near Port Townsend too?"
    a: "Yes — Chimacum, Port Hadlock, Port Ludlow, and Discovery Bay are all within our regular Jefferson County service area. Scheduling works the same way: free on-site estimate, line-item quote, and a start date with a deadline penalty built into the contract if we're late. Call (206) 591-1096 or ask for a consultation and we'll get a date on the calendar."