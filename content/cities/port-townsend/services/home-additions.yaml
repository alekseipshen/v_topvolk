title: "Port Townsend Home Additions — Second Stories & DADUs"

answer: "TopVolk Construction designs and builds permitted home additions and DADUs in Port Townsend, Washington — owner-led, 100+ projects since 2017."

intro: |
  Squeezing a second story onto a 100-year-old Victorian near Uptown means checking the post-and-pier foundation before anyone draws a floor plan, and that kind of add-on work — design through final inspection — is exactly what Vladislav Volkov handles personally for homeowners across Port Townsend and the rest of Jefferson County. A lot of the housing stock here goes back to the 1880s-1900s townsite boom around the Downtown and Uptown historic district, so additions in those areas usually start with a foundation and framing assessment instead of a design sketch. Out toward Glen Cove and Cape George, newer 1990s and 2000s builds already sit close to their setback lines, which changes the conversation to lot coverage and where a DADU can legally go. One recent mother-in-law suite near Fort Worden State Park got its own entrance, a Bosch range in a small kitchenette, and a Mitsubishi mini-split instead of new ductwork tied into the main house. WA HB 1337 now allows two ADUs per single-family lot statewide, which is opening up options on narrower in-town parcels that couldn't fit an addition before.

localContext: |
  Most of Port Townsend's in-town lots, 98368, are narrow and platted from the original 1880s townsite survey, so a second-story addition on a North Beach cottage often runs into a 25-foot height limit and tight side setbacks that leave almost no room for a bump-out at grade — going up, not out, ends up being the only real option. Homes out toward Cape George and the unincorporated edges near 98325 in Chimacum sit on larger parcels under Jefferson County DCD jurisdiction instead of city Development Services, which changes the permit path and, in some cases, adds a septic capacity review before a bedroom gets added. Add a design review layer if the lot falls inside the Port Townsend Historic District — exterior additions visible from the street get reviewed for material and massing match, which is why cedar shake and clapboard siding matching matters more here than in a typical suburban remodel. The Olympic rain shadow keeps annual rainfall lower than Seattle, around 19 to 20 inches a year, but wind off the Strait of Juan de Fuca is the bigger factor — flashing details at new roof-wall intersections and dormer cheeks need to be done right or they'll leak within a season or two. Older post-and-pier foundations under 1900s-era homes also need a structural engineer's sign-off before a second story goes on, since most were never sized for that kind of load.

commonProblems:
  - title: "A 1900s Post-and-Pier Foundation Wasn't Built for a Second Story"
    description: "Plenty of the Craftsman and Victorian homes near Uptown and North Beach are still sitting on the original post-and-pier foundation, sometimes with rot showing at the mudsill after 120 years of Olympic Peninsula moisture. Before TopVolk frames a second story, a structural engineer runs the numbers on the existing footing and rim joist to see what load they can actually carry — usually the answer is 'not much,' which means new concrete footings, PSL posts, and an LVL beam to carry the new floor loads down to grade. Simpson Strong-Tie hardware ties everything together at the connections so the inspector signs off at rough-in instead of sending you back for rework. That engineering report runs roughly $1,500-$3,000 depending on span, and it's money spent before a permit even gets submitted — skip it and Jefferson County DCD or city plan review will just bounce the application back anyway."
  - title: "Fitting a DADU on a Narrow In-Town Lot Under HB 1337"
    description: "WA HB 1337 opened the door to two ADUs on a single-family lot statewide, but a lot of Port Townsend's in-town parcels near Kah Tai Lagoon were platted in the 1880s and are barely 5,000 square feet — lot coverage and the 24-foot DADU height limit eat into the buildable footprint fast. TopVolk works through the City of Port Townsend Development Services portal, or Jefferson County DCD for lots outside city limits like parts of Chimacum and Cape George, to confirm setbacks, parking exemptions near transit, and separate utility connection requirements before drawing anything. A mother-in-law suite layout with its own entrance, a small kitchen with IKEA or semi-custom cabinets, and a Rinnai tankless water heater instead of a shared tank usually gets approved faster than a design that tries to tie into the main house's systems. Plan on 8-12 weeks just for plan review on a DADU here, longer if the lot needs a septic capacity letter."
  - title: "Matching Cedar Shake and Clapboard Siding on a Victorian Bump-Out"
    description: "Add a bump-out or dormer to a Victorian near the historic district and the new wall has to match 100-year-old cedar shake or clapboard close enough that the Historic Preservation Committee doesn't send the drawings back. Original siding has usually weathered to a silver-gray that new cedar won't match for a few years, so TopVolk sources matching profile stock and sometimes pre-tones it, or switches to Hardie cement-board siding on non-visible elevations where the review board allows it — Hardie holds up better against wind-driven rain off the Strait anyway. Flashing at the new roof-to-wall intersection matters as much as the siding choice; a poorly flashed dormer cheek is the number one callback on additions in this climate. Budget an extra 1-2 weeks in the schedule just for the historic design review step if your lot falls inside the district boundary."
  - title: "Heating and Cooling a New Addition Without Tearing Into Existing Ductwork"
    description: "Tying a new bedroom or in-law suite into a 1960s rancher's original forced-air ductwork usually means the existing furnace can't keep up, and running new trunk lines through a finished ceiling isn't worth the drywall repair. TopVolk typically specs a Mitsubishi mini-split head for the addition instead — it's a cleaner install, keeps the new space on its own zone, and doesn't touch the mechanical system heating the rest of the house. For a DADU or full mother-in-law suite with a kitchen, a Rinnai or Navien tankless unit handles hot water without needing a second water heater closet. Mini-split installs run about $4,000-$7,000 per zone installed, and MEP coordination — electrical, plumbing, mechanical — gets mapped out during design so the electrical panel has capacity before framing starts, not after."
  - title: "What a Home Addition in Port Townsend Actually Costs"
    description: "A straightforward second-story addition or full-footprint bump-out runs $150-$250 per square foot once foundation work, framing, MEP, and finish work are priced in, while a detached DADU with its own kitchen and bath typically lands between $180,000 and $260,000 depending on finishes — Kohler or Moen fixtures and quartz counters cost less than Sub-Zero and Wolf appliances, and that spread shows up fast in a line-item quote. TopVolk prices every addition with a line-item quote, not a range, so you know what the LVL beam, the electrical panel upgrade, and the siding package each cost before signing anything. Deadline penalties are written into the contract, which matters more on additions than most projects since a missed framing date pushes the whole permit-inspection sequence back. Call (206) 591-1096 for a free on-site estimate with actual numbers, not a guess over the phone."

faq:
  - q: "How fast can you get to Port Townsend for Home Additions?"
    a: "Port Townsend sits at the end of WA-20 on the Quimper Peninsula, about two and a half hours from Seattle around Hood Canal, or a shorter trip off the Coupeville-Whidbey Island ferry. TopVolk Construction LLC has completed 100+ projects since 2017 across the Puget Sound region and now regularly works in Jefferson County, scheduling site visits and design meetings in blocks so the drive doesn't slow down framing once permits clear. A free on-site consultation usually gets booked within 1-2 weeks of your call, and most additions start construction 6-10 weeks after permit submittal. Call (206) 591-1096 to get a date on the calendar."
  - q: "What does a home addition in Port Townsend cost?"
    a: "Most second-story additions and full-footprint bump-outs run $150-$250 per square foot once foundation reinforcement, framing, MEP, and finish work are figured in, and a detached DADU with its own kitchen and bathroom typically lands between $180,000 and $260,000 depending on finish level. Fixture choice moves the number a lot — Kohler and Moen versus Sub-Zero and Wolf is a real difference on a line-item quote. Lot condition matters too: a post-and-pier foundation that needs new footings before a second story goes up adds cost a slab-on-grade home wouldn't have. TopVolk provides a free on-site estimate with actual line-item pricing, not a phone quote."
  - q: "Who handles permits for a home addition in Port Townsend?"
    a: "Additions inside city limits go through City of Port Townsend Development Services, while lots in unincorporated Jefferson County — Cape George, Chimacum, parts of Discovery Bay — go through Jefferson County DCD instead, and the two departments don't always want the same drawings. Add a Historic Preservation Committee review if the property sits inside the Uptown or Downtown historic district, since exterior changes visible from the street get reviewed separately. Plan review typically runs 4-12 weeks depending on scope and department. TopVolk Construction LLC is a WA Licensed Contractor and prepares the full permit set — structural, site plan, and energy code compliance — so nothing bounces back for missing paperwork."
  - q: "Can you add a second story onto our existing foundation?"
    a: "Sometimes, but not without a structural engineer running the numbers first — a lot of Port Townsend's older homes are on post-and-pier foundations never sized for a second floor's load. TopVolk typically adds new concrete footings, PSL posts, and an LVL beam to carry the new floor down to grade, with Simpson Strong-Tie connectors tying it all together at inspection points, plus sister joists and added blocking to reinforce the existing floor framing. That engineering evaluation runs $1,500-$3,000 and happens before the permit set gets drawn, not after."
  - q: "How long will a Port Townsend addition hold up in the local weather?"
    a: "Wind off the Strait of Juan de Fuca is the bigger threat here, more than rain — Port Townsend actually sits in the Olympic rain shadow and gets less annual rainfall than Seattle. Flashing at roof-wall intersections and dormer cheeks gets detailed to handle wind-driven rain, and Hardie cement-board siding holds up better than raw cedar on exposed elevations. TopVolk backs workmanship with a written warranty and deadline penalties are built into the contract; manufacturer warranties on materials like CertainTeed roofing or Hardie siding run 30-50 years separately. Expect a well-built addition to outlast the original 1900s framing it's tied into."
  - q: "Do you cover areas outside Port Townsend?"
    a: "Jefferson County projects extend out to Chimacum, Port Ludlow, Discovery Bay, and Quilcene, and TopVolk also covers the Seattle Metro side — King, Snohomish, Pierce, and Kitsap counties — for anyone splitting time between properties. Scheduling for Jefferson County work groups site visits and design meetings together on the same trip, so response time on a first consultation is usually 1-2 weeks from the initial call. There's no sales staff or call center here — every call goes to Vladislav directly, and he's the one who shows up to the site walk. Call (206) 591-1096 or ask for a free consultation to get your project scoped."