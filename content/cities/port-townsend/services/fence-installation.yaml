  - q: "What does a fence installation in Port Townsend cost?"
    a: "Cedar picket runs $35-$55 per linear foot installed, vinyl privacy $45-$70, and composite options land near the top of that range once gate hardware is included. Slope, post count, and whether old fencing needs demo and haul-off move the total more than material grade does. Every estimate comes as a written, line-item quote — not a phone-quoted range — after Vladislav walks the property in person. Call (206) 591-1096 to schedule the free on-site estimate."
  - q: "Do I need a permit for a fence in Port Townsend or Jefferson County?"
    a: "Inside city limits, standard fences under the 6 ft rear/side and 4 ft front height limit generally don't need a building permit through Port Townsend Development Services, but anything in the Uptown or Downtown historic district may still need a Certificate of Appropriateness for the design. Outside city limits, Jefferson County DCD reviews setbacks separately, and retaining-wall fences over 4 feet typically need engineering review either way. TopVolk, a WA Licensed Contractor, handles the paperwork and jurisdiction check as part of the estimate."
  - q: "Cedar or vinyl — which holds up better on a Port Townsend lot near the water?"
    a: "Western red cedar looks right for the Victorian-era homes around Uptown but needs a Cabot oil stain every 2-3 years to fight the graying and splitting that salt air and sun accelerate. CertainTeed vinyl or Trex Seclusions composite cost more upfront but need no staining and hold their color for 20-plus years. Wind off the Strait matters more than moisture here, so post depth and rail spacing matter regardless of which material gets picked. TopVolk quotes both so the comparison is a real number, not a guess."
  - q: "How long will a fence actually last in Port Townsend's climate?"
    a: "A properly set cedar fence with PT posts and a Simpson Strong-Tie post base typically lasts 15-20 years with regular staining; vinyl and composite runs closer to 25-30 years with essentially no upkeep. TopVolk backs post-setting and structural work with a written workmanship guarantee, separate from manufacturer material warranties from CertainTeed or Trex. What's not covered is storm damage to a fence installed by someone else with shallow footings — that's a repair job, not a warranty claim. Ask about specific coverage when the estimate gets written up."
  - q: "Do you cover areas near Port Townsend like Chimacum or Port Hadlock?"
    a: "Yes — TopVolk covers Chimacum, Port Hadlock, and the rest of Jefferson County on the same trip out from the Seattle side, along with jobs across King, Snohomish, Pierce, and Kitsap counties. Scheduling a consultation on the Peninsula usually works best bundled with a set travel day, so booking a week or two ahead gets the fastest date. Vladislav handles the site visit and the install personally — no sales rep, no subcontracted crew doing the estimate. Call (206) 591-1096 to check the next open date."