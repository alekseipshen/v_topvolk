title: "Port Townsend Tile Installation — Built for Salt Air & Old Homes"

answer: "TopVolk Construction installs tile floors, showers, and backsplashes in Port Townsend, Washington — Schluter Kerdi waterproofing, laser-leveled substrates, free on-site quotes, owner-led by Vladislav Volkov."

intro: |
  TopVolk Construction handles tile installation for showers, kitchens, and floors throughout Port Townsend, working directly with Vladislav Volkov from the first site visit to the final grout line — no sales rep, no subcontracted crew you've never met. A lot of the calls we get here start with a Victorian-era bathroom near Uptown, original hex tile crumbling around a clawfoot tub, or a kitchen off Water Street where the homeowner wants a full-height backsplash behind a new range instead of the builder-grade laminate that's been there since the 80s. Port Townsend's marine layer and salt air off Admiralty Inlet do real damage to grout and metal trim over time, which changes how we detail a shower — Schluter Kerdi membrane and stainless or PVC edge profiles hold up better here than standard bullnose. We also see a fair number of heated-floor requests, especially in homes near Fort Worden and Kala Point where the crawlspace runs cold most of the year. Call (206) 591-1096 for a free consultation if any of this sounds familiar.

localContext: |
  Port Townsend's housing stock skews old — a good share of the homes in the 98368 zip code date back to the Victorian seaport boom of the 1880s-1900s, especially around the Uptown and Downtown historic districts, with balloon-frame construction, original fir subfloors, and plumbing that's been re-routed more than once. Out toward Kala Point and Cape George you'll find newer construction, 1980s-2000s, on slab or standard joist framing, which is a much easier substrate for large-format porcelain. Salt air off Port Townsend Bay accelerates corrosion on unsealed metal transition strips and cheap grout sealers faster than you'd see inland in places like Chimacum. Any tile work tied to a remodel that touches plumbing or electrical — a shower reconfiguration or a backsplash with relocated outlets — needs a permit through the City of Port Townsend Building & Community Development Department if the property's inside city limits, or Jefferson County DCD if you're out past the city line toward Discovery Bay. We pull those permits as part of the job, not as an add-on.

commonProblems:
  - title: "Original hex tile and horsehair plaster don't mix with modern waterproofing"
    description: "A lot of the Victorian homes near Uptown still have their original 1-inch hex floor tile in the bathroom, set directly over a horsehair-and-lath subfloor with zero moisture barrier underneath. When that tile cracks or the grout fails, water gets into century-old lath and the floor starts to spring. We pull the old tile, install cement backer board or a Schluter Ditra uncoupling membrane over new plywood, then reset either matching hex porcelain or a large-format replacement. Expect $2,800-$4,500 for a small Victorian bath floor depending on subfloor repair, done in about a week."
  - title: "Salt air corrodes cheap shower trim and edge profiles"
    description: "Standard aluminum or plastic tile edging doesn't hold up long this close to Admiralty Inlet — we've pulled out corroded Schluter Jolly trim in showers less than eight years old in homes near the waterfront. The fix is stainless steel or PVC profile trim paired with a proper Schluter Kerdi waterproofing membrane behind the tile field, not just a paint-on sealant. RedGard is a fine budget substitute on interior walls away from direct spray, but we don't use it inside a shower pan or curb here. Upgrading trim during a shower remodel adds maybe $300-$600 to the job but saves a full tear-out in five years."
  - title: "Large-format porcelain needs a flatter substrate than these old floors provide"
    description: "24x48 and 32x32 porcelain tile requires the floor flat within about 1/8 inch over 10 feet, and most homes built before 1920 in the Downtown historic district have settled unevenly over a century. We laser-level the subfloor and use a self-leveling underlayment before backer board goes down, which prevents lippage — the edge-catching ridge between tiles that shows up within months on an out-of-flat floor. Skipping this step is the single biggest reason tile jobs get callbacks. Permits for floor tile alone usually aren't required unless it's part of a larger remodel through City of Port Townsend BCD or Jefferson County DCD."
  - title: "What tile installation actually costs in Port Townsend"
    description: "A standard shower retile with Schluter Kerdi waterproofing runs $6,000-$9,500 depending on size, niche count, and whether we're adding a bench or curbless entry. Kitchen backsplashes run $1,200-$2,800, more if we're relocating outlets behind a new range hood. Floor tile in porcelain or large-format runs $12-$18 per square foot installed, natural stone like travertine or marble runs higher because of sealing and slower setting. We give a line-item quote before any work starts — no vague ranges — and the contract includes a penalty clause if we miss the agreed deadline."
  - title: "Grout sealing and heated floor maintenance in a damp climate"
    description: "Even with Port Townsend sitting in the Olympic rain shadow, humidity off the bay works grout lines loose over 5-7 years, especially in showers without a Kerdi membrane behind them. We recommend resealing cementitious grout annually, or installing epoxy grout up front so it's a non-issue. For heated floors — we install Schluter Ditra-Heat or Warmup systems under bathroom tile near Kala Point and Fort Worden where crawlspaces run cold — expect 15-20 years out of the mat itself if the thermostat and sensor wire are installed correctly the first time."

faq:
  - q: "How fast can you get to Port Townsend for Tile Installation?"
    a: "We're on-site within a week for most quotes, sooner if it's a shower leak that's actively damaging a subfloor. Port Townsend sits at the end of Highway 20, roughly an hour from the Kingston or Bainbridge ferry depending on your route, and we factor that drive time into scheduling rather than padding the quote. Most tile jobs — shower, backsplash, or floor — run 1-3 weeks depending on size and whether we're waiting on tile material to ship. Call (206) 591-1096 and we'll set a free on-site consultation."
  - q: "What does a shower retile cost in Port Townsend?"
    a: "A full shower retile with Schluter Kerdi waterproofing, a niche, and standard porcelain tile runs $6,000-$9,500 here. Cost swings on size, whether you want a curbless entry, natural stone versus porcelain, and if the existing pan or plumbing needs replacement too. Homes near the water sometimes need extra corrosion-resistant trim, which adds a few hundred dollars. We give a written, line-item quote on the free consultation — no ballpark ranges after the fact."
  - q: "Do I need a permit for tile work in Port Townsend?"
    a: "Tile installation alone typically doesn't require a permit, but if the job involves moving plumbing, electrical, or reconfiguring a shower pan, it does — through the City of Port Townsend Building & Community Development Department if you're inside city limits, or Jefferson County DCD for areas like Discovery Bay or unincorporated Kala Point. We handle the permit application and inspection scheduling as part of the contract. As a WA Licensed Contractor, we prepare the paperwork so it's ready before the crew ever shows up."
  - q: "Can you install heated floors under tile in an older home?"
    a: "Yes — we run Schluter Ditra-Heat or Warmup electric mats under bathroom tile regularly, including in Victorian homes near Uptown where the original subfloor needs leveling first anyway. The mat sits on top of cement backer board or directly over Ditra, wired to a dedicated thermostat with a floor sensor. It adds roughly $12-$18 per square foot to a standard tile floor install. Most homeowners run it seasonally given Port Townsend's cold, damp winters."
  - q: "How long does tile last in Port Townsend's climate before it needs redoing?"
    a: "Porcelain tile itself easily lasts 25+ years; grout and waterproofing membrane are what fail first, usually in the 10-15 year range if the shower wasn't built with a proper Schluter Kerdi system underneath. Salt air near the bay shortens the life of cheap metal trim specifically, which is why we spec stainless or PVC profiles on waterfront jobs. We stand behind our waterproofing work and address callbacks directly — you're calling Vladislav, not a call center."
  - q: "Do you cover areas outside Port Townsend proper?"
    a: "We cover Jefferson County generally, including Kala Point, Discovery Bay, Chimacum, and Port Hadlock in the 98339 area, plus our broader service area across King, Snohomish, Pierce, and Kitsap counties. Scheduling windows run about 1-2 weeks out for non-emergency tile work. Call (206) 591-1096 or ask for a free on-site consultation and we'll get a firm date on the calendar."