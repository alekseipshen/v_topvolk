title: "Lakewood Bathroom Remodel — Waterproofing & Layout Fixes That Last"

intro: |
  American Lake sits at the west edge of Lakewood, and the ranch homes spreading east from it toward Gravelly Lake Drive in 98499 have a consistent bathroom story: 1960s hex tile, a 36-inch tub-shower combo, and a 50 CFM exhaust fan that's been cycling the same damp air since the Carter administration. Pierce County rain runs October through May. Without a proper vapor barrier and adequate ventilation, those walls stay wet. Schluter Kerdi-lined tile showers and upgraded Moen pressure-balance valves are what actually fix the problem.

localContext: |
  Most of Lakewood's remodel work comes from three housing waves: 1960s ranch homes near Fort Steilacoom Park (98498), 1970s split-levels off Steilacoom Boulevard, and 1980s-90s tract builds in the Clover Creek corridor (98499). The ranch homes are the most demanding — original cast-iron drain stacks, galvanized supply lines, and no blocking in the walls for grab bars. The 1980s-90s builds have different issues: builder-grade acrylic surrounds that have cracked along the seam, and grout that was never sealed against PNW humidity. Permits go through Pierce County PALS; plan review on a bathroom with a layout change typically runs 3–6 weeks.

commonProblems:
  - title: "Rotted Drywall Backer Behind 1960s Tile in American Lake-Area Ranchers"
    description: "Pre-1975 bathrooms used paper-faced gypsum as a tile substrate — before cement board was standard. After decades of shower steam and Lakewood's wet winters, that drywall delaminates behind the tile. The fix is full demolition to the studs, RedGard waterproofing membrane on all wet surfaces, then large-format porcelain set over Schluter Kerdi-Band at the tub-to-wall transition. No shortcuts."
  - title: "Galvanized Supply Lines Throttling Pressure on Kohler and Moen Fixtures"
    description: "Homes built before 1975 in the Tillicum and Lakewood proper areas frequently have galvanized steel supply lines corroded to near-blockage. Kohler pressure-balance valves require 45 PSI minimum to thermostatic-cycle correctly — galvanized lines in this condition rarely hit that. A bathroom remodel is the right time to repipe to PEX or copper before closing the walls. Replumbing adds 1–2 days; ripping out finished walls later costs far more."
  - title: "Under-Spec Ventilation Causing Mold Regrowth in Clover Creek Tract Homes"
    description: "The 1980s-90s builder-spec exhaust fans in Clover Creek ran at 50 CFM or less — adequate for a code minimum in 1988, not for a PNW bathroom used daily. Mold reappears on grout lines near the ceiling and along north-facing exterior walls within a season. A full remodel includes a 110 CFM fan ducted directly to a roof or soffit penetration, plus a vapor barrier in the wall assembly per IRC requirements. Bosch ventilation fans work well where ceiling depth allows direct runs."

faq:
  - q: "How fast can you get to Lakewood for a bathroom remodel consultation?"
    a: "Lakewood is about 40 minutes from our Seattle base — we're in Pierce County regularly. Call (206) 591-1096 to schedule a free on-site consultation. Vladislav comes out personally, looks at the space, and gives you a line-item quote. No commissioned closer, no vague estimate ranges."
  - q: "Do you work with Kohler and Moen plumbing fixtures, and can you source Schluter shower systems?"
    a: "Both Kohler and Moen are the dominant fixture brands in Lakewood's housing stock and we install them routinely. For walk-in shower builds we use Schluter Kerdi as the waterproofing system — it's what holds up against PNW humidity long-term. Rinnai tankless water heaters are worth discussing if your current tank is near end-of-life and you want to reclaim the closet space."
  - q: "What's the real timeline for a master bath remodel in Lakewood, and who handles permits?"
    a: "Permitting goes through Pierce County PALS — building and plumbing permits required for any layout change, plan review runs 3–6 weeks. After permit approval, a full master bath reconfiguration with a walk-in shower conversion runs 6–10 weeks on-site. We handle all permit applications. TopVolk is a WA Licensed Contractor, 100+ projects completed since 2023, and missed-deadline penalties are written into the contract."