title: "Lakewood Deck Installation — Built for Pierce County Rain"

intro: |
  Gravelly Lake Drive in 98499 has homes from the early 1960s where the original PT lumber deck is still hanging off the back — barely. Pierce County averages around 38 inches of rain annually, and moss colonizes an untreated cedar surface within two seasons facing north. Last fall we rebuilt a deteriorated rear deck for a family near Clover Park, swapping out the rotted cedar for Trex Select composite with proper ledger flashing — no annual sealing, no return call since.

localContext: |
  Most of Lakewood's housing stock dates to 1955-1985: ranchers, split-levels, and post-war builds spread across 98498 and 98499. Older Douglas-fir rim joists are often structurally sound but show dry rot exactly where previous ledger boards were fastened without Z-flashing or any weather barrier. Neighborhoods west toward American Lake have steeper rear-yard grades — longer posts, more concrete, sometimes engineered footings where the soil stays saturated nine months a year near JBLM's western edge.

commonProblems:
  - title: "Ledger rot from missing flashing on Lakewood's 1960s-70s ranchers"
    description: "Homes built before 1985 in 98498 routinely have ledger boards toe-nailed straight to the rim joist with no Z-flashing and no weather-resistant barrier underneath. Pierce County PALS flags this on every ledger inspection now. We demo the failed connection, evaluate the rim joist for sistering if needed, install proper flashing per IRC Section R507.2, and re-fasten with Simpson Strong-Tie structural screws — not lag bolts into soft old framing."

  - title: "Post footings that shift in Lakewood's rain-saturated clay soils"
    description: "Pierce County soils near the lake shorelines hold water most of the year. Footings that don't reach undisturbed soil at 12-18 inches minimum move after a wet winter — decks rack, boards gap, railings fail. All our post footings use tube-form concrete piers sized to the tributary load, set with ground-contact rated PT lumber posts as required by IRC Section R317. Shallow pre-cast blocks don't belong in this climate."

  - title: "Guardrail height and stair stringer code failures on pre-2000 decks"
    description: "Decks built in the 1980s and 90s across the 98499 zip code commonly have 32-inch guardrails — Pierce County now requires 36 inches minimum for decks above 30 inches off grade. Stair stringers need to be checked for consistent rise-run ratios, and handrails must be graspable (round or oval profile, not a flat 2x4). These are automatic failure items at a Pierce County PALS rough-in or final inspection."

faq:
  - q: "How fast can you get to Lakewood for a deck consultation?"
    a: "Typically within 2-3 business days — we cover all of Pierce County. Lakewood off I-5 Exit 122 or 127 is straightforward. The on-site visit is free, and you meet Vladislav directly, not a salesperson. Call (206) 591-1096 to schedule."

  - q: "Trex or TimberTech — which composite holds up better in Pierce County's rain?"
    a: "Both perform well in the PNW. Trex Select has a more matte finish that hides foot traffic scuffs; TimberTech Terrain Series shows more natural grain depth. The bigger factor is joist spacing — composite requires 12-inch on-center for diagonal runs, 16-inch for perpendicular. We've installed both in Lakewood and Tacoma. Either outperforms cedar here by a wide margin."

  - q: "What does a deck permit cost and how long does it take in Lakewood?"
    a: "City of Lakewood issues its own building permits for most addresses; unincorporated parcels near the JBLM edge go through Pierce County PALS. Plan review runs 3-6 weeks for a standard attached deck. TopVolk handles the full permit application, ledger flashing inspection, and final sign-off — WA Licensed Contractor, 100+ projects completed since 2017. Permit fees typically run $400-900 depending on deck square footage. Deadline for completion is written into the contract with penalty clauses."