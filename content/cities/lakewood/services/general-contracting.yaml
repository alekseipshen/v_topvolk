title: "Lakewood General Contracting — Full Remodels, Permits to Punch List"

intro: |
  The blocks around American Lake in 98499 were built up fast during the Fort Lewis expansion
  years — 1950s and 60s ranchers, solid Douglas-fir framing, but kitchens that haven't
  been touched since the original Kenmore range was delivered. Swapping in a panel-ready
  Bosch or a Thermador column fridge isn't a weekend project: it means circuit upgrades,
  coordination with the City of Lakewood's Community Development department for permits,
  and someone who can keep three trades on schedule. That's what TopVolk Construction
  handles — WA Licensed Contractor, 100+ projects completed since 2023.

localContext: |
  Zip codes 98498 and 98499 cover most of Lakewood's residential core: post-war ranchers
  and split-levels from the 1948–1975 era, with 1980s–90s infill filling gaps along
  Gravelly Lake Drive and near Fort Steilacoom Park. Original 100-amp panels are common.
  Galvanized supply lines show up constantly during demo. Pierce County's wet winters —
  over 38 inches of rain annually — accelerate moisture damage in crawlspaces that weren't
  vapor-barriered to modern code when they were poured.

commonProblems:
  - title: "Permit Pull With City of Lakewood vs. Pierce County PALS"
    description: "Lakewood has its own permit center, separate from Pierce County PALS. Load-bearing
      wall removals, electrical service upgrades from 100-amp to 200-amp, and structural
      additions all need plans submitted for AHJ review before a shovel touches anything.
      Plan review runs 4–8 weeks for structural scope. Miss that window and your contractor
      queue gets pushed out another month. Vladislav handles the permit application as part
      of the project scope — no homeowner chasing inspectors."
  - title: "Multi-Trade Scheduling Falls Apart Mid-Project"
    description: "A full gut-rehab in a 1960s Lakewood split-level means sequencing framing
      (LVL beam for any load-bearing removal), rough-in electrical and plumbing, mechanical
      HVAC, drywall hang and tape, and finish work — with inspections between phases. One
      sub slips a week, the cascade hits everyone behind them. Subcontractor scheduling and
      quality control on $100K+ projects is the part homeowners most consistently
      underestimate. Vladislav manages MEP coordination directly, not through a project
      manager who's never been on site."
  - title: "Structural Surprises Inside 1950s–70s Walls"
    description: "Post-war framing in the Fort Lewis-era neighborhoods doesn't always follow
      IRC conventions: non-standard stud spacing, galvanized drain lines routed through
      walls, PSL post substitutions added by previous owners without permits. Demo opens
      the wall and the original quote changes. Line-item pricing and a written deadline
      penalty clause — built into every TopVolk contract — protect against the scope creep
      that kills budgets on older Pierce County stock."

faq:
  - q: "How far does TopVolk travel for projects in Lakewood?"
    a: "Lakewood is covered — about 40 minutes down I-5 from the Seattle core. TopVolk
      works Pierce County projects regularly. Call (206) 591-1096 to schedule a free
      on-site estimate with Vladislav directly, not a sales rep."
  - q: "Do you handle panel-ready appliance installs — Bosch, Sub-Zero, Thermador — during a kitchen remodel?"
    a: "Yes. Panel-ready Bosch and Sub-Zero column units require custom cabinet framing
      to exact millimeter tolerances and dedicated 20-amp circuits. Thermador ranges need
      range hood CFM matched to the linear feet of cooking surface. Spec work happens
      before framing starts so nothing gets rebuilt. KitchenAid suite installs are
      straightforward by comparison."
  - q: "What's a realistic timeline for a full remodel or ADU in Lakewood?"
    a: "Full kitchen in a 98499 rancher: 6–10 weeks of construction after permit approval.
      City of Lakewood plan review adds 4–8 weeks upfront for structural scope. A DADU
      under WA HB 1337 — which allows two ADUs per single-family lot statewide now —
      runs 4–7 months end-to-end including permits. Deadline penalty is written into
      the contract. Call (206) 591-1096 or schedule a free consultation to get an
      actual line-item quote."