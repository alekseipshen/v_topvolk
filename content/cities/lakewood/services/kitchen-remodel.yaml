title: "Lakewood Kitchen Remodel — Opening Up 1960s Ranch Kitchens"

intro: |
  Around American Lake and the older residential blocks near Fort Steilacoom Park, Lakewood's housing stock runs heavy on 1950s and 1960s ranch-style homes.

  Those kitchens were built for galley layouts and wall ovens — not a 36-inch Bosch induction range or an island with seating for four.

  Zip code 98499 alone has dozens of these houses where the kitchen is the last room to catch up to how the family actually uses the space. The subdivisions between Gravelly Lake Drive SW and Steilacoom Boulevard SW, the streets east of American Lake near the Clover Park neighborhoods — same story, block after block. The original footprint made sense in 1963. Today it doesn't.

localContext: |
  Most of Lakewood's established neighborhoods — Tillicum near 98498, the streets running west of I-5 toward American Lake in 98499, the Clover Park residential blocks south of Lakewood Towne Center — were platted and built between 1950 and 1975.

  Concrete slab foundations are common here, which matters for plumbing rough-in placement when moving a sink.

  Original electrical panels in these homes typically run 100A service — not enough for induction cooking and a double wall oven running simultaneously. Before we write a scope of work, we assess the panel, the slab, and the structural walls, because all three affect budget and timeline in ways that don't show up in a photo.

  The blocks along Gravelly Lake Drive SW tend to have the most intact original kitchens — untouched since the Eisenhower era, with cast-iron drain stacks still buried in the slab.

commonProblems:
  - title: "Load-Bearing Walls Blocking the Open-Plan Layout"
    description: |
      Ranch homes in 98499 and 98498 often have a wall between the kitchen and dining room that carries roof load.

      Removing it requires a structural engineer's stamp, an LVL beam sized to span the opening, and PSL posts at each end.

      Pierce County PALS requires a permit for structural work — plan on 4–6 weeks for plan review before demolition starts. That timeline isn't optional. Contractors who skip it put your project at risk of stop-work orders from the county inspector.

  - title: "100A Electrical Panels Can't Keep Up With Modern Appliances"
    description: |
      A Bosch induction range draws 50 amps on its own.

      Add a KitchenAid double wall oven and under-cabinet LED circuits, and the original 100A panel hits capacity fast. Upgrading to 200A service means coordinating with Puget Sound Energy for meter work plus a separate Pierce County PALS permit for the panel replacement. Two parallel permit tracks — both need to be scheduled from day one, not sorted out when the electrician shows up on rough-in day.

  - title: "Slab Foundations Make Plumbing Moves Expensive"
    description: |
      Moving a sink more than 18 inches on a slab foundation means cutting concrete to reroute drain lines.

      In Lakewood's older ranchers — especially the 98498 blocks near Tillicum and the streets running behind Fort Steilacoom Park — original cast-iron stacks are common. We transition to PVC and pour new concrete over the trench.

      Three to five days added to the rough-in phase before cabinet installation can begin.

      Not a detail to discover mid-project when the schedule is already committed.

faq:
  - q: "How fast can you get to Lakewood for a Kitchen Remodel consultation?"
    a: |
      Lakewood is 35–45 minutes via I-5 South from our main service corridor. Free on-site consultations run Tuesday through Saturday.

      Vladislav comes to the house — not a scheduler or sales rep. Call (206) 591-1096 to set a time directly.

  - q: "Do you build around Bosch and Thermador appliances in Lakewood kitchens?"
    a: |
      Bosch is the most common brand we spec around in this area — ranges, dishwashers, refrigerators. KitchenAid and Thermador show up frequently too.

      Cabinet cutouts and electrical rough-in get sized to the exact appliance model before anything gets ordered. No surprises on delivery day when a 36-inch range arrives and the opening was framed for 30.

  - q: "What does a kitchen remodel cost in Lakewood, and how long does it take?"
    a: |
      A mid-range remodel — semi-custom cabinets, quartz countertops, new appliances, tile backsplash — typically runs $45,000–$85,000 in this market.

      Active construction takes 6–10 weeks. Add 3–6 weeks for Pierce County PALS plan review before the first tool hits the wall. TopVolk is WA Licensed Contractor, owner-operated since 2017 with 100+ projects across Pierce and King counties. Deadline penalties are written into every contract — not a verbal promise.