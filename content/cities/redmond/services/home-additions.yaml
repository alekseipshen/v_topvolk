title: "Redmond Home Additions — ADUs & Second Stories Built to Code"

intro: |
  Education Hill in 98052 sits on some of the roomier residential lots in
  Redmond — but the houses built here between 1978 and 1992 were sized for
  smaller households than the ones living in them now. Aging parents moving
  in, a home office that needs to be separate from the main house, a proper
  guest suite with its own entrance — these are the real reasons people call.
  Installing a Mitsubishi mini-split in a new addition handles heating and
  cooling without fighting the original ductwork. Vladislav Volkov has
  completed 100+ projects across King County since 2017, working directly
  with homeowners, no sales staff involved. Redmond's position between Lake
  Sammamish and the Microsoft campus draws a lot of dual-income households
  who want additions done properly — engineered drawings, pulled permits,
  inspections passed — not a fast flip on a handshake deal.

localContext: |
  The 98052 zip — Education Hill, Overlake, the neighborhoods between
  NE 24th Street and the Sammamish River Trail — was almost entirely built
  between 1975 and 1995. Original foundations were sized for the footprint
  that existed then, not for additions. Bear Creek Road and the Grass Lawn
  neighborhood fall in the same era; lots are generous but the homes
  themselves are often undersized for families living in them today.
  In 98053 (Redmond Ridge), newer construction from the 2000s has better
  bones but tighter subdivision setbacks that require careful lot coverage
  math before any ADU or bump-out can go to Redmond's permit center for
  plan review. FAR calculations matter here — a lot already at 35% coverage
  has little room for a DADU without first confirming impervious surface rules
  with the city.

commonProblems:
  - title: "Foundation and beam capacity for second-story additions"
    description: "Split-levels and ranchers in 98052 weren't engineered for
      vertical expansion. A second story means calculating live and dead loads
      on the existing foundation — and frequently sistering or replacing
      undersized posts with PSL posts, or splicing in LVL beams to carry the
      new floor system. Rim joist reinforcement and solid blocking between
      floor joists are standard steps in these retrofits before any sheathing
      goes on. Skip the structural math and the city's plan reviewer sends
      the application back. Redmond's permit center requires stamped
      engineering drawings for vertical additions, and the rough-in inspection
      covers structural framing before insulation is installed."
  - title: "ADU permitting under WA HB 1337 and Redmond's local standards"
    description: "The 2024 statewide ADU law (WA HB 1337) allows up to 2
      ADUs per single-family lot — AADU plus DADU on the same property — but
      Redmond's own development standards still govern setbacks, lot coverage,
      and height limits. Plan review through Redmond's permit center runs
      6-10 weeks. Pre-approved plans can shorten that. Call (206) 591-1096
      to walk through your specific lot before anything gets drawn."
  - title: "Matching exterior siding and roofline on 1980s-era homes"
    description: "Homes in the Education Hill and Bear Creek Road corridors
      used wood lap siding or T1-11 panels — materials that are nearly
      impossible to match four decades later. Most addition tie-ins now use
      Hardie cement-board siding, which holds paint and resists the rot that
      comes with 37 inches of annual rain hitting north-facing walls. Getting
      the roofline transition right — ridge height, fascia profile, overhang
      depth — is where experience shows."

faq:
  - q: "How fast can you get to Redmond for Home Additions?"
    a: "Redmond is a regular service area — from Seattle via SR-520 it's
      25-30 minutes off-peak. Vladislav can typically schedule a free
      on-site consultation within a week of first contact. Call
      (206) 591-1096 to set it up — no sales rep, you talk to the
      contractor directly."
  - q: "Does TopVolk handle the Redmond permit application for additions?"
    a: "Yes — permit drawings, application submission, and coordination
      with Redmond's permit center are included in the project scope.
      For room additions and ADUs, budget 6-10 weeks for plan review.
      Smaller additions under 200 sq ft sometimes qualify for
      over-the-counter review. Vladislav walks you through what applies
      to your lot before design starts."
  - q: "What does a home addition in Redmond cost and how long does it take?"
    a: "Room additions in 98052 typically run $150-$280 per square foot
      depending on finish level — a kitchen addition with a Wolf range
      and Sub-Zero refrigerator panel costs more than a bedroom-and-bath.
      Timeline: 4-6 months for a room addition (permits included), 5-7
      months for a DADU end-to-end. Deadline penalties are written into
      the contract — not a verbal promise, an actual clause with teeth.
      TopVolk is a WA Licensed Contractor; 100+ projects completed
      since 2017."
  - q: "What inspections happen during a Redmond addition build?"
    a: "Redmond's permit center requires staged inspections through the
      project — footing inspection before concrete is poured, rough-in
      covering framing, mechanical, electrical, and plumbing before walls
      close, and a final inspection before occupancy. DADUs with separate
      utility connections get an additional service inspection. Vladislav
      schedules all of these directly with the city; homeowners don't have
      to track the inspection calendar themselves."