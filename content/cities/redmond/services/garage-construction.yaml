title: "Redmond Garage Construction — ADU, EV Pre-Wire & Workshop Builds"

intro: |
  Overlake and Education Hill sit on lots platted in the 1980s and 1990s —
  attached garages sized for one car and a lawnmower, not two EVs and a
  home workshop with a living space above. Marymoor Park-area homes in zip
  98052 run into this ceiling constantly. Getting the garage right means
  spec'ing a 60-amp circuit rough-in for a Tesla Wall Connector or
  LiftMaster jackshaft system before the concrete slab is poured — not as
  an afterthought when the walls are already up. Vladislav Volkov handles
  the site visit and the quote — no sales staff, no guessing on scope.

localContext: |
  Builder-grade attached garages from the 1985–2005 construction wave cover
  most of zip 98052 and 98053 — single-car, uninsulated, undersized slabs
  built for a buyer who didn't own two EVs or need a home office overhead.
  Redmond Ridge and Education Hill lots often clear the WA HB 1337 threshold
  for a DADU above a new detached garage, but King County DPER plan review
  adds 6–10 weeks before a footing is dug. Setback minimums, lot coverage
  caps, and FAR limits all need to be confirmed at the parcel level before
  drawings go to a structural engineer. Redmond's 37 inches of annual rain
  also means moisture management starts at the foundation — a 6-mil vapor
  barrier under the slab is not optional on these soils.

commonProblems:
  - title: "Setback and Lot Coverage Math Kills Garage Designs Before Permits"
    description: |
      King County DPER enforces rear setbacks — often 5 feet for detached
      structures — and FAR limits that can make a planned 2-car garage
      footprint non-compliant before a permit application is filed. Redmond
      Ridge parcels sometimes carry HOA overlay requirements on top of county
      minimums. A redesign after permit submission costs 8–12 weeks and a
      second plan review fee. Getting the site plan confirmed during
      pre-application is the move, not an assumption.

  - title: "Slab Failure on Clay-Heavy Glacial Till Beneath Zip 98052"
    description: |
      Parts of zip 98052 sit on glacial till that holds water and shifts
      seasonally between Redmond's wet winters and dry summers. A 4-inch slab
      without compacted gravel sub-base and a 6-mil vapor barrier underneath
      will crack within a few winters. Fiber-reinforced concrete with a full
      sub-base spec is standard on any garage build here — not an upgrade
      tier, just how it has to be done on these soils. The same freeze-thaw
      dynamic that affects North Bend foothills shows up at lower intensity
      in Redmond's inland neighborhoods during cold snaps.

  - title: "Matching Hardie Siding and Roofline to a 1990s House"
    description: |
      Redmond's rain hits north-facing surfaces hard from October through May.
      Cedar shake siding added to a detached garage to match a 1992 original
      house will start delaminating in 5 years on the shaded elevation.
      Hardie cement-board siding holds better in PNW conditions and comes in
      profiles that approximate most cedar patterns — but corner trim, fascia,
      and soffit details during finish work determine whether the addition
      looks intentional or like it was bolted on later.

faq:
  - q: "How fast can you get to Redmond for a garage construction consultation?"
    a: |
      Redmond is straightforward from our base — SR-520 or NE 40th Street
      depending on traffic. Vladislav handles all site visits personally, no
      salespeople. Call (206) 591-1096 to book a free on-site consultation;
      most Overlake and Education Hill addresses are available within 3–5 days.

  - q: "Do you pre-wire for Tesla Wall Connector and Level 2 EV charging during the build?"
    a: |
      Yes. A 60-amp circuit rough-in for a Tesla Wall Connector or ChargePoint
      Level 2 home charger gets spec'd into the permit drawings before the
      slab is poured. Clopay insulated garage doors and LiftMaster Wi-Fi
      openers are coordinated during the finish phase. Running that circuit
      after the pour costs 3–5x more and means cutting finished concrete.
      It goes into the drawings at the start — that's the only way to do it
      cleanly on a King County DPER-permitted build.

  - q: "What does a detached garage with DADU above cost in Redmond, and how long does the process take?"
    a: |
      End-to-end — King County DPER plan review through rough-in inspection
      and final inspection — typically runs 4–7 months. Construction alone is
      2–3 months once permits are in hand. A 2-car detached garage with DADU
      above generally lands at $120K–$200K+ depending on finish level. TopVolk
      is a WA Licensed Contractor with 100+ projects completed since 2023.
      Vladislav provides a line-item quote after the on-site visit — not a
      vague range — and deadline penalties are written into the contract.