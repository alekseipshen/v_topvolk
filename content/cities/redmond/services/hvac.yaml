title: "Redmond HVAC — Heat Pump Conversions & Mini-Splits, 98052"

intro: |
  Microsoft's campus growth pulled buyers into Redmond's Overlake and Education Hill neighborhoods
  throughout the 1990s and 2000s — most of those homes came equipped with gas furnaces now 15-25
  years old. PSE's heat pump rebates under the Inflation Reduction Act have made the conversion
  math genuinely compelling in the 98052 and 98053 zips, especially for homeowners whose equipment
  is failing anyway. A Mitsubishi Hyper-Heat cold-climate unit, paired with properly corrected
  ductwork, delivers real efficiency gains without the combustion venting complications of a
  furnace swap.

localContext: |
  The 98052 zip code spans a wide spread — older split-level homes near downtown Redmond from the
  late 1970s, mid-century ranchers tucked off Union Hill Road, and the larger colonials on Redmond
  Ridge and Bear Creek built between 2000 and 2010. Builder-grade ductwork in that mid-2000s
  housing stock was rarely balanced for individual zone loads, which is why cold second floors
  and short-cycling equipment are so common here. Crawlspace moisture on the older homes is
  a real factor too — vapor barrier condition affects how the HVAC system handles indoor
  humidity from October through April. ADU projects near Marymoor Park almost always call for
  ductless systems — tapping into existing ductwork in an occupied home means structural demo
  most homeowners aren't expecting.

commonProblems:
  - title: "Gas Furnace-to-Heat Pump Conversion — Duct Compatibility in 98052"
    description: "Redmond homes built between 1985 and 2005 typically have 80% AFUE gas furnaces
      paired with undersized return ductwork that was never sized for heat pump airflow.
      Converting to a Carrier or Mitsubishi system requires evaluating static pressure across
      the existing air handler — a return plenum that's too restrictive chokes the new
      equipment, and the efficiency gains on the spec sheet don't materialize in practice.
      Duct corrections and a fresh Manual J recalculation get scoped before any equipment
      is ordered."
  - title: "Hot and Cold Zones After Whole-Home Equipment Replacement"
    description: "Replacing a furnace without recalculating Manual J load is how a lot of
      Redmond homeowners end up with a cold second floor despite a brand-new system.
      Education Hill's elevation and the north-facing exposures on Redmond Ridge lose heat
      faster than the flatter Overlake lots below. Adding a Daikin or Mitsubishi ductless
      head to the problem zone — individually BTU-sized per room — resolves it cleanly
      without upsizing the main unit and overloading trunk line capacity."
  - title: "Ductless Mini-Split Systems for DADUs Under WA HB 1337"
    description: "Washington's 2024 ADU law allows Redmond homeowners to add up to two ADUs per
      single-family lot. Detached ADUs almost never connect to the main home's duct system —
      a 1.5-ton Mitsubishi or Daikin ductless unit on a dedicated 240V circuit handles both
      heating and cooling without routing ductwork through shared structure. Redmond's permit
      center reviews mechanical plans as part of the building permit package, so equipment
      sizing gets locked in during plan review, not discovered at rough-in inspection."

faq:
  - q: "How fast can you get to Redmond for an HVAC consultation?"
    a: "Redmond's 98052 and 98053 zips are part of our regular King County coverage. For
      non-emergency HVAC assessments, Vladislav typically schedules an on-site visit within
      a week. TopVolk is a WA Licensed Contractor with 100+ projects completed across King
      County since 2023. Call (206) 591-1096 — you talk to the contractor running the job,
      not a scheduler."
  - q: "What HVAC brands do you install in Redmond homes?"
    a: "Mini-split work runs primarily Mitsubishi and Daikin — both have cold-climate inverter
      compressor models built for PNW winters without heavy electric resistance backup. For
      ducted heat pump systems, Carrier and Trane are the standard choices. Smart thermostat
      integration — Nest, ecobee — gets handled as part of any full system replacement."
  - q: "What does HVAC permitting look like in Redmond and how long does it take?"
    a: "Redmond runs its own permit center — separate from King County DPER. A standalone
      mechanical permit for HVAC replacement typically clears plan review in 2-4 weeks.
      ADU and addition projects bundle mechanical plans with the building permit. Missed
      submission milestones carry penalties written into the contract. Call (206) 591-1096
      to walk through your project scope."