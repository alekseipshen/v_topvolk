title: "Redmond Kitchen Remodel — Open Layouts for 98052 Homes"

intro: |
  Overlake and Education Hill neighborhoods hold hundreds of 1985–2000 builder-grade homes — kitchens that were fine for the era but are now walled off, cramped, and sized for appliances a quarter the quality of what Redmond homeowners are buying today. Fitting a 36-inch Wolf range with proper 600 CFM ventilation into a cabinet run designed for a basic 30-inch slot takes structural and electrical planning before a single cabinet is touched. TopVolk Construction has been doing this kind of work across the 98052 zip code since 2017, 100+ projects completed, WA Licensed Contractor.

localContext: |
  The 98052 zip runs from Overlake near SR-520 north through Education Hill — mostly 1985–2000 tract construction with oak cabinets, laminate tops, and drop-in ranges that were never spec'd for today's cooking appliances. Up in 98053, Redmond Ridge homes from the early 2000s have better bones but face the same limitation: kitchens laid out for standard 30-inch appliances, not Thermador or Sub-Zero columns. Load-bearing wall removal, structural header installation, and electrical panel upgrades to 200A service are common starting points before cabinetry planning even begins.

commonProblems:
  - title: "Load-Bearing Walls Locking In the Closed-Off Kitchen Layout"
    description: "A significant portion of Education Hill homes from the late 1980s through mid-1990s have structural walls directly between the kitchen and main living area. Removing one requires a load path analysis, an engineered LVL beam sized for the span, and a permit pulled through the City of Redmond permit center. Plan review typically runs 4–8 weeks for structural work. Skipping the permit creates real problems at resale — title companies flag unpermitted structural changes."
  - title: "100-Amp Panels That Can't Handle Modern Appliance Loads"
    description: "A Wolf CT36I/S induction cooktop pulls 50 amps on its own. Add a Sub-Zero 36-inch column refrigerator and a dishwasher and a 100-amp panel is already past capacity. Most Redmond homes built before 1995 came with 100A or 150A service — adequate then, not now. Electrical rough-in for the panel upgrade runs concurrently with demo and framing to keep the overall timeline to 6–10 weeks, not 14."
  - title: "Cabinet Runs That Don't Fit 36-Inch and 48-Inch Appliance Footprints"
    description: "A 48-inch Sub-Zero panel-ready column pair or a 36-inch Thermador range does not drop into a 1990s cabinet layout without modifications. The original runs were designed around 30-inch ranges and top-mount refrigerators. Choosing between IKEA, semi-custom, and full custom cabinetry determines how precisely you can size around the appliance specs — semi-custom handles most panel-ready fitments, full custom is the right call for a 48-inch Sub-Zero installation with integrated panels."

faq:
  - q: "How fast can you get to Redmond for a kitchen consultation?"
    a: "Redmond is straightforward from Seattle or Bellevue — SR-520 to 148th Ave NE gets us there without traffic. Vladislav does all consultations personally, in person. Call (206) 591-1096 to schedule a free on-site visit and a line-item quote — not a ballpark estimate."
  - q: "Do you work with Wolf, Thermador, and Sub-Zero appliances?"
    a: "Yes. Most Redmond projects in the upper price range involve Wolf ranges, Thermador column refrigerators, or Sub-Zero panel-ready units. Appliance rough-in dimensions get confirmed from the manufacturer spec sheets before a single cabinet is ordered — fitment errors on a $12,000 range are not recoverable."
  - q: "What does a Redmond kitchen remodel cost, and how long does it take?"
    a: "A mid-range Redmond kitchen — semi-custom cabinets, quartz counters, structural wall removal, new layout — typically runs $65,000–$120,000 all-in. City of Redmond permit review adds 4–8 weeks to the front end; construction itself runs 6–10 weeks depending on structural scope. Vladislav Volkov, WA Licensed Contractor, walks through every line item at the consultation. Deadline penalty is written into the contract — not just promised."