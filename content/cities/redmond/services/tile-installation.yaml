title: "Redmond Tile Installation — Kerdi Showers & Heated Floors"

intro: |
  Education Hill and Bear Creek in 98052 have a lot of 1995-2010 homes where the original shower tile was set over greenboard — not a waterproofed substrate, just moisture-resistant drywall. After a decade of Redmond's ~37 inches of annual rainfall, grout cracks, water gets behind the wall, and you're looking at a full demo and rebuild. Kitchen remodels in this area frequently include a Wolf range or Sub-Zero refrigerator — and the tile backsplash needs to be planned around electrical relocation before any tile layout begins. These jobs need proper sequencing, not patchwork.

localContext: |
  Zip 98052 covers Education Hill, Bear Creek, Overlake, and neighborhoods just north of Marymoor Park — a mix of 1990s colonials, townhomes, and larger custom homes built for the first tech-sector wave in King County. Zip 98053 runs east into Redmond Ridge, where homes built 2003-2015 have larger master baths and open kitchens that homeowners are now upgrading with 24x48 or 32x32 large-format porcelain. Both zips fall under City of Redmond permitting — separate from King County DPER — with their own plan review queue for structural tile work involving subfloor replacement or shower niche framing.

commonProblems:
  - title: "Shower Waterproofing Failures in 1990s–2000s Construction"
    description: |
      Greenboard was the standard shower substrate in homes built through the early 2000s across Education Hill and Overlake. It holds moisture resistance, not waterproofing — and there's a difference. Over time, grout cracks, water infiltrates, and the board deteriorates behind the tile. Some homeowners regrout and recaulk to buy time, but if the substrate is already compromised, that buys maybe a year. The actual fix is full demo down to studs, Schluter Kerdi membrane over cement board, and a complete retile with back-buttered large-format tile. Skipping the membrane resets the same failure timeline.
  - title: "Large-Format Porcelain Telegraphs Every Subfloor Imperfection"
    description: |
      24x48 and 32x32 porcelain tiles look clean in a Redmond master bath — fewer grout lines, more open visual. The problem is lippage: tile edges sitting at slightly different heights, visible from across the room. These tile sizes require the substrate to be laser-leveled within 1/8 inch over 10 feet. Schluter Ditra uncoupling membrane handles minor subfloor flex after installation, but the flatness work — shimming, floating, or sistering joists — has to happen first. You can't compensate for an uneven floor with extra thinset.
  - title: "Heated Floor Systems Require the Right Sequence With Tile"
    description: |
      Schluter Ditra-Heat and Warmup heated mat systems come up in nearly every Redmond master bath remodel. The heating cables embed in the Ditra-Heat uncoupling membrane channels — not in mortar. Setting tile directly over cables without the uncoupling layer risks cable damage during installation and uneven heat distribution once the floor is finished. The thermostat rough-in also has to coordinate with the electrician before tile layout starts, not after the fact. Doing it out of order means tearing up finished tile to add a junction box.

