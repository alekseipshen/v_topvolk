      Redmond — both 98052 and 98053 — is in the regular weekly schedule. SR-520 from Seattle and the 202 from the east side both reach the area cleanly. Initial consultations typically open up within a week of first contact. Vladislav does the site visit himself — not a project manager relay, not a salesperson. Call (206) 591-1096 to set up a free on-site estimate. TopVolk is a WA Licensed Contractor operating across King County.
  - q: "Do you work with natural stone — marble and travertine — in Redmond tile projects?"
    a: |
      Both materials show up regularly in Redmond remodels at this price point, and they need different handling than porcelain. Marble and travertine require a penetrating sealer before grouting and again at the final punch list — PNW humidity accelerates staining on unsealed stone. Travertine has natural voids that need filling before installation or grout cracks into them within a year. Schluter Kerdi waterproofs behind natural stone the same way it does behind porcelain. Edge profiles handle tile-to-hardwood transitions cleanly where a marble bath floor meets the hallway.
  - q: "What does a tile remodel cost in Redmond, and what does the permit process look like?"
    a: |
      A full master bath tile scope — demo, Schluter Kerdi waterproofing, Ditra-Heat system, and 24x48 large-format porcelain — typically runs $15K–$35K depending on square footage and materials. City of Redmond plan review for a bathroom remodel takes 3–6 weeks. Tile work itself runs 2–4 weeks on site. TopVolk has completed 100+ projects since 2017 across King County — every contract includes a deadline penalty clause and a line-item quote with no vague ranges. Call (206) 591-1096 to schedule a free estimate with Vladislav.