title: "Redmond Foundation Repair — Glacial Soils & Seismic Gaps"

intro: |
  Clay-heavy soils near Bear Creek and the Sammamish River corridor move
  differently through a wet King County winter than the glacial till up
  on Education Hill. Homes in 98052 built on those lower clay pockets
  have been shifting slowly for decades. A Zoeller sump pump handles
  standing water, but if the foundation itself is settling or cracking,
  that requires a different fix entirely.

  The clay in the Bear Creek floodplain expands when saturated — roughly
  37 inches of rain between October and May will do that. Then it shrinks
  again in August. That cycle, repeated over 20 or 30 years, is what
  cracks concrete walls and tilts posts. It's not dramatic. It's just slow
  and relentless.

  Call (206) 591-1096 to schedule an on-site walk with Vladislav. He'll
  tell you what's moving, what's dormant, and what actually needs work.

localContext: |
  Much of Redmond's housing stock in 98052 dates to the 1980s and
  1990s — builder-grade construction that met code at the time but
  wasn't engineered with long-term soil movement in mind.
  Post-and-pier crawlspaces show up regularly in older pockets near
  Overlake and Grass Lawn. Homes further out on Redmond Ridge (98053)
  sit on more stable ground, but steep lot grades there push drainage
  pressure directly against below-grade walls.

  Redmond Ridge is a different problem set entirely. Lots carved out of
  the hillside in the early 2000s have retaining walls and curtain drains
  that need maintenance. When those fail, hydrostatic pressure builds
  against the foundation wall. The soil isn't clay — it's mostly glacial
  till and decomposed granite — but slope drainage failures cause just as
  much damage.

  Overlake and the neighborhoods between NE 24th Street and SR-520 are
  older. Some of those homes have original post-and-pier systems with wood
  still sitting on concrete piers poured in the 1970s. Forty years of
  wet crawlspace air takes a toll on Douglas-fir posts, even treated ones.

commonProblems:
  - title: "Post-and-Pier Settlement in Overlake Crawlspaces"
    description: |
      Concrete piers crack and wood posts rot at grade when soil
      saturates repeatedly — which happens every October through May
      here. Floors start sagging first, then interior doors stick.
      Shimming buys time; replacing deteriorated posts with PSL
      columns and adding blocking between them solves it for the
      long term.

      The tell is usually a soft spot in the floor near the center of the
      house, away from the perimeter walls. Perimeter beam issues show up
      differently — doors that were fine last spring now won't latch. Both
      are crawlspace problems, but the fix is different. PSL posts with
      proper beam seats and joist hangers at every connection point, with
      a vapor barrier to keep the new work dry.

  - title: "Concrete Wall Cracking Near the Sammamish River Corridor"
    description: |
      High water table along the Sammamish River Trail puts constant
      lateral pressure on below-grade walls in 98052. Horizontal
      cracks mean soil is pushing in — vertical cracks usually mean
      settlement. Carbon fiber straps stop active movement; Sika
      epoxy injection seals dormant cracks that just need to be
      closed before water finds a path in.

      Stair-step cracking in block walls is a separate pattern —
      that's usually differential settlement, not lateral pressure.
      Redmond has both, sometimes in the same house. Diagnosis first,
      then repair. Throwing carbon fiber at a settlement crack doesn't
      help. The fix has to match what's actually happening.

  - title: "Seismic Retrofit Gaps in 1980s–90s Tract Homes"
    description: |
      Redmond's building boom produced a lot of homes with minimal
      mudsill bolting — sometimes none at all. WA seismic code now
      requires anchor bolts every 6 feet along the mudsill, plus
      shear wall plywood with Simpson Strong-Tie hardware on cripple
      walls. City of Redmond Building Division handles permits here;
      plan review typically runs 2–4 weeks for a standard retrofit.

      Cripple wall height matters too. Short cripple walls — under
      14 inches — are stiffer and often pass as-is. Taller ones need
      full plywood sheathing with 8d nails at 4-inch spacing per the
      IRC shear wall schedule. Vladislav is WA Licensed Contractor of
      record on all permit pulls. You don't deal with the Building Division.

  - title: "Drainage Failures on Redmond Ridge Slopes"
    description: |
      Steep grades in 98053 concentrate runoff at the downhill side of
      the foundation. French drains and curtain drains that weren't
      installed with cleanouts get root-bound over time.

      Once drainage fails, the water finds the wall. Below-grade walls
      on downhill sides of Redmond Ridge lots show efflorescence and
      seepage first, then spalling concrete, then active cracking.
      Interior drainage systems with a sump are sometimes the only
      practical answer when exterior excavation is impossible — but
      exterior waterproofing with a dimple mat and proper daylight drain
      is the right fix when access allows it.

faq:
  - q: "How fast can you get to Redmond for Foundation Repair?"
    a: |
      Redmond is a regular stop — we work throughout 98052 and 98053.
      SR-520 puts us there in under 30 minutes from most of our
      Seattle-side work. Call (206) 591-1096 and we can usually
      schedule an on-site assessment within a few days.

  - q: "Who pulls permits for foundation work in Redmond?"
    a: |
      City of Redmond Building Division — not Seattle SDCI. Seismic
      retrofits, foundation replacement, and structural drainage work
      all require permits here. Vladislav pulls them as WA Licensed
      Contractor of record. You don't manage the paperwork. Plan
      review runs roughly 2–4 weeks for most foundation scopes.

      Structural work sometimes requires stamped engineering drawings
      before the Building Division will issue the permit. That adds
      time and cost — typically $800–$2,000 for a structural engineer's
      letter or drawings, depending on scope. We coordinate that directly.
      You get one point of contact.

  - q: "What does foundation repair cost in Redmond and how long does it take?"
    a: |
      Seismic retrofit on a 1,500 sq ft crawlspace typically runs
      $8K–$15K and takes 1–2 weeks of on-site work after permits
      clear. Full post-and-pier replacement or wall repair can reach
      $30K–$60K+. We've done 100+ projects since 2023 across King
      County and provide line-item quotes — no vague ranges. Deadline
      penalties are written into every contract. Call (206) 591-1096
      to schedule a free on-site consultation with Vladislav directly.

      Drainage work is usually on the lower end — a French drain
      installation with a sump on a standard 98052 lot runs $6K–$12K.
      What drives cost up is access. Tight crawlspaces under 18 inches,
      steep Redmond Ridge lots that need shoring before excavation, or
      concrete flatwork that has to come up first — those add time and
      materials. The on-site walk is how we find out which situation you're in.