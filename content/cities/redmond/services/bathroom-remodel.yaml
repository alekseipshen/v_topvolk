title: "Redmond Bathroom Remodel — From Builder-Grade to Modern Bath"

intro: |
  Marymoor Park sits about a mile from the Overlake corridor in 98052, and the split-levels spreading north up Education Hill carry a consistent problem: master bathrooms built in 1987 that haven't changed since. Original builder tile, plastic shower surrounds without a real waterproofing membrane, single-handle Moen faucets that drip. Redmond's Oct-May rain season turns cosmetic neglect into structural damage — rotted framing, cracked grout, water working its way behind the tile and into the subfloor below.

localContext: |
  Redmond's housing breaks into two distinct bands by zip. The 98052 zip — Overlake, Education Hill, Bear Creek — is heavy on 1980s and early-1990s construction: ranchers and split-levels with original tile surrounds and greenboard substrates instead of true waterproofing membranes. Redmond Ridge (98053) runs newer — mostly 2000s Pacific Northwest contemporary — but those homes often need layout reconfigurations and finish-quality lifts to match current expectations. Different problems, same permit jurisdiction: City of Redmond Building Division.

commonProblems:
  - title: "No Waterproofing Membrane Behind the Shower Tile"
    description: "Late-1980s Overlake construction used greenboard or standard drywall behind shower tile — not cement board, not a real waterproofing layer. Water migrates through grout joints, saturates the substrate, and rots the rim joist and subfloor below. We demo down to studs, install Schluter Kerdi membrane or RedGard over cement board, then retile. Doing it correctly adds about a week to the timeline. Skipping it means a full tear-out later."

  - title: "Undersized Exhaust Fans Feeding Mold in North-Facing Baths"
    description: "Builder-installed 50 CFM exhaust fans from 1988 can't move enough air for Redmond's humidity load — especially in north-facing bathrooms where moss shows up on the siding outside by November. The fix isn't just swapping the fan. It means properly sizing the duct run, adding a damper, and terminating at the exterior. We typically spec a Panasonic WhisperCeiling unit on a humidity-sensing switch rather than a wall timer."

  - title: "Tub-Shower Combos That No Longer Work for How People Live"
    description: "Education Hill master baths with a single tub-shower combo were standard in 1989. Most homeowners want it gone — replaced with a walk-in curbless shower, large-format porcelain, and a built-in bench. That means relocating the drain, pouring a sloped mortar bed, and roughing in a new Kohler or Moen pressure-balance valve. City of Redmond requires a rough-in inspection before tile goes on the wall — we schedule it, not you."

faq:
  - q: "How fast can you get to Redmond for a bathroom remodel consultation?"
    a: "Redmond is a regular stop in our King County schedule. We're typically out via SR-520 and can usually book an on-site walk-through within a few days. Call (206) 591-1096 — you'll talk to Vladislav directly, not a scheduler."

  - q: "What fixture and waterproofing brands do you work with on Redmond remodels?"
    a: "Most Redmond master bath remodels at this price point use Kohler or Toto fixtures, Moen or Grohe pressure-balance valves, and Schluter Kerdi or RedGard for waterproofing. On tile, large-format porcelain is the current standard. We can also work with client-supplied materials from specialty tile showrooms."

  - q: "What does a bathroom remodel cost in Redmond, and how long does the permit process take?"
    a: "Full master bath remodel in Redmond typically runs $35K–$80K depending on layout changes, plumbing relocation, and finish level. City of Redmond Building Division handles permits; plan review for work involving plumbing changes usually takes 3–6 weeks. Total timeline from permit submission to final inspection: 8–14 weeks. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023 — and deadline penalties are written into the contract. Schedule a free on-site consultation at (206) 591-1096."

