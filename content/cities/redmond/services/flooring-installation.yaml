title: "Redmond Flooring Installation — Hardwood & LVP for 98052 Slab Homes"

intro: |
  Education Hill homes in 98052 sit a few miles east of Marymoor Park on terrain
  that drains unevenly, and the marine moisture off Puget Sound that settles in from
  October through May makes hardwood acclimation a real requirement — not a suggestion.
  A lot of Redmond kitchens are getting Wolf ranges and Sub-Zero refrigerators during
  full remodels, and flooring almost always goes in last. That sequence works fine if
  the subfloor moisture content gets tested first. Skip that step and the hardwood
  cups before winter is over. Vladislav Volkov has led 100+ renovation and flooring
  projects across King and Snohomish counties since 2023 — the most common callbacks
  he takes over from other contractors are failures that came from skipped prep.

localContext: |
  Redmond's housing stock breaks into two very different construction eras. Older
  ranchers and split-levels from the 1960s-70s on Education Hill and Rose Hill
  frequently have concrete slab foundations — that rules out solid hardwood as a
  direct-to-slab install and pushes the spec toward engineered hardwood or quality
  LVP. Zip code 98053 covers Redmond Ridge and Bear Creek, where 2000s-era
  construction typically has OSB subfloors over crawlspaces with different moisture
  dynamics. The Overlake corridor also has condos where underlayment selection for
  sound dampening matters — HOAs in those buildings enforce noise standards and the
  wrong product fails an inspection. Two different flooring problems depending on
  which part of Redmond you're in.

commonProblems:
  - title: "Slab Moisture Wrecking Hardwood in 1960s-70s Education Hill Ranchers"
    description: |
      Slab-on-grade foundations in homes built on Education Hill and Rose Hill between
      1955 and 1975 pass ground moisture upward continuously. During Redmond's wet
      season — October through May — that rate climbs. Installing solid 3/4-inch red
      oak directly on a slab without a proper vapor barrier or DriCore subfloor panel
      system leads to cupping, buckling, and finish separation within one heating
      season. Repair costs more than doing it right the first time. Engineered hardwood
      with a glue-down method over 6-mil poly vapor barrier is the standard spec for
      these slabs.

  - title: "Acclimation Skipped in Winter — Gaps and Crowning Open by March"
    description: |
      Flooring delivered to a Redmond jobsite in January arrives considerably drier
      than the house will be by late February. Mirage and Shaw engineered planks both
      require 4-7 days of on-site acclimation in the actual room where they'll be
      installed — not stacked in the garage, not left on the truck. Skipping that
      window causes joint separation, squeaking, and crowning as the wood takes on
      ambient humidity. Moisture meter readings on both the wood bundle and the
      subfloor surface need to land within 2 percentage points of each other before
      the first plank gets fastened.

  - title: "Vinyl Asbestos Tile Hidden Under Linoleum in 1960s Kitchen Footprints"
    description: |
      Redmond homes built in the 1960s — particularly on Education Hill and in the
      Willows neighborhood — frequently have VAT (vinyl asbestos tile) buried under
      one or two later linoleum layers in the original kitchen footprint. Nine-by-nine
      inch tiles in muted browns, greens, or yellows are the giveaway. Cutting,
      grinding, or stapling through this material without testing violates EPA and WA
      Department of Ecology regulations. Lab sampling has to happen first. A positive
      result means licensed abatement before any new flooring goes down — that adds
      1-2 weeks and a real cost line to the project.

faq:
  - q: "How fast can you get to Redmond for a flooring project?"
    a: |
      Redmond — both 98052 and 98053 — is a regular part of the King County service
      area. The SR-520 corridor and NE 8th Street make routing predictable from most
      locations, and residential neighborhoods like Education Hill usually have
      accessible driveways for material delivery. Call (206) 591-1096 to set up a
      free on-site walkthrough with Vladislav directly — no sales staff involved.

  - q: "Do you install engineered hardwood and LVP on concrete slab floors?"
    a: |
      Yes. Slab-on-grade is standard in most 1960s-70s Redmond ranchers and it
      eliminates solid 3/4-inch hardwood as a direct-install option. Engineered
      hardwood — Mirage, Shaw, or a comparable line — with a glue-down method and
      vapor barrier is the correct spec for those slabs. Floating LVP with built-in
      underlayment is a strong second option. Subfloor moisture testing happens before
      either product goes down — no exceptions.

  - q: "What does flooring installation cost in Redmond and how long does it take?"
    a: |
      LVP runs lower per square foot than engineered hardwood, and VAT abatement
      adds a separate line item if the tile tests positive. A 1,000-square-foot
      flooring project typically takes 1-2 weeks on-site after the acclimation period.
      TopVolk Construction is a WA Licensed Contractor — call (206) 591-1096 for a
      line-item quote with real numbers, not vague ranges. Deadline commitments go
      into the contract with penalties for missing them.