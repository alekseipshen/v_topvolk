  - q: "Can you clean Trex and TimberTech composite decking without damaging the surface?"
    a: "Yes. Composite decking from Trex and TimberTech requires lower PSI than cedar —
      high pressure damages the capped surface layer. Soft wash technique with
      manufacturer-approved solutions removes mold and algae without stripping the
      protective cap. Treated wood framing and Trex boards need different approaches
      on the same deck. TopVolk has handled this on Redmond Ridge properties where the
      2010-era decks mix composite boards with PT lumber substructure."
