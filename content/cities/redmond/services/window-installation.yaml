title: "Redmond Window Installation — Noise, Rain & Energy Code"

intro: |
  The homes off Education Hill Road in 98052 face two overlapping problems: wind-driven rain working behind old aluminum frames from October through May, and SR-520 noise cutting through single-pane glass in the Overlake corridor near the Microsoft campus. Vladislav has installed Milgard and Marvin windows across Redmond since 2017 — retrofits, egress cuts in finished basements, and full frame-out installs built to current Seattle Energy Code requirements. WA Licensed Contractor, 100+ projects completed.

localContext: |
  Redmond splits into two clear housing bands. Overlake and Willows — in 98052, closer to downtown and Marymoor Park — are mostly 1960s-1980s ranchers and split-levels with original aluminum frames that were single-pane from the factory. Redmond Ridge and Education Hill built out through the 1990s and 2000s with vinyl double-pane that's now aging past warranty in 98053. Bear Creek Trail properties add another layer: shade on north elevations, high year-round humidity, and almost no UV drying — all of which accelerate frame deterioration and IGU seal failure faster than sunnier exposures across the county.

commonProblems:
  - title: "Failed IGU Seals and Head Flashing Failure in 1990s–2000s Homes"
    description: |
      Broken seals inside the IGU (insulated glass unit) let argon gas escape and allow condensation to form between the panes — units go hazy, then opaque. In Redmond's wet winters, failed head flashing above the window opening is often the root cause: water migrates into the rough opening, saturates the sill plate, and compromises the frame from inside before the glass fails visibly. Milgard and Pella vinyl units installed in the late 1990s and early 2000s are hitting this spacer bar failure window right now. Full sash or full-frame replacement is the fix — not resealing.

  - title: "SR-520 Road Noise in Overlake and Willows"
    description: |
      Overlake and Willows homes in 98052 sit within a mile of SR-520's on- and off-ramps. Standard double-pane delivers about 26 STC (Sound Transmission Class). Laminated acoustic glass — available through Pella Impervia and Milgard Quiet Line configurations — pushes that to 34-36 STC. The difference is real in bedroom and home-office use. Frame installation is equally important: a proper sill pan with back-dam and backer rod closure around the rough opening stops noise from flanking the glass entirely and entering through the gap between window and framing.

  - title: "Egress Cuts in Finished Basements Require a Building Permit"
    description: |
      A basement room can't be called a legal bedroom without egress per IRC Section R310: 5.7 sq ft net clear opening, 24-inch minimum height, 20-inch minimum width. In Redmond's 1970s split-levels in 98052, that means cutting a new rough opening through existing framing — structural work that requires a building permit from City of Redmond's permit division, not just a window swap. Permit review typically runs 2-4 weeks for residential scope. King County DPER handles identical work on unincorporated parcels just outside the city boundary.

faq:
  - q: "How fast can you get to Redmond for Window Installation?"
    a: |
      Redmond — Education Hill, Overlake, Redmond Ridge, the Marymoor Park area — is a regular stop. Same-week consultation availability across King County is typical. Vladislav does the site walk himself: real measurements, written line-item quote, no commissioned estimator in between. Call (206) 591-1096 to schedule.

  - q: "Which window brands do you install in Redmond?"
    a: |
      Milgard, Pella, and Marvin cover most of what we install here. Milgard Tuscany for standard vinyl retrofits; Pella Impervia fiberglass where moisture exposure is heavy; Marvin Elevate for wood-clad work in homes where matching original divided-light grilles matters. Fiberglass performs better than vinyl in Redmond's wet climate — lower expansion coefficient, better dimensional stability over years of rain cycling. Frame depth compatibility with existing rough openings is always confirmed on site before ordering.

  - q: "What does window installation cost in Redmond, and how long does the project take?"
    a: |
      A full retrofit with permit typically runs $800–$2,200 per window depending on size, glass spec, and whether structural work is involved. A 10-window whole-house project is usually 2-3 days of installation once materials are on-site. Egress cuts add framing labor. City of Redmond permit review runs 2-4 weeks for standard residential window scope. Free on-site quote from Vladislav directly. Deadline penalties written into every contract — not just a verbal promise.