title: "Redmond Window Installation — SR-520 Noise & PNW Rain"

intro: |
  The split-levels and colonials around Education Hill and Overlake in 98052 were built mostly
  in the late '70s and early '80s — most still have the original aluminum frames or builder-grade
  vinyl units that came with them.

  SR-520 runs less than a mile from many of these neighborhoods, and single-pane glass does
  nothing for freeway noise. Vladislav Volkov at TopVolk handles window replacement across Redmond,
  from Milgard and Pella selections to permit submittal through the city's permit center and
  finished flashing detail. Projects run across 98052 and 98053 — from the older blocks near the
  Microsoft campus on 156th Ave NE to the newer tract homes up in Redmond Ridge, each with
  different window problems and a different cost profile to fix them correctly.

localContext: |
  Over in 98053 — Redmond Ridge and the Bear Creek corridor — housing is mostly 2000s construction,
  meeting earlier energy codes but not today's Seattle Energy Code U-factor requirements (0.28 or
  better for replacement windows).

  The older neighborhoods in 98052 near Marymoor Park carry a different problem set entirely.
  Post-and-pier foundations with unvented crawlspaces push moisture upward, accelerating rot in
  wood window frames. Aluminum single-panes in these homes often show 50-year-old glazing compound
  crumbling at the sash corners. That moisture moves up through floor joists and into the wall
  cavity — by the time the interior sill feels soft underfoot, the rough opening king studs are
  already compromised and a sash swap alone won't hold.

  The blocks closest to Redmond Town Center, along NE 85th Street and around the Overlake
  Transit Center, are a different mix: 1990s townhomes with fogged double-panes, newer
  Craftsman-style detached homes where the energy performance is fine but owners are upgrading
  to Milgard Fiberglass or Marvin Elevate for aesthetics and resale. All permit work — regardless
  of neighborhood — routes through Redmond's city permit center, not King County DPER.

  North-facing elevations on Education Hill colonials are the worst offenders for frame rot.
  Shade keeps the Hardie or cedar siding from drying between rain events, and moss accumulates
  at the sill line through the wet season.

commonProblems:
  - title: "Flashing failures letting rain into the rough opening framing"
    description: |
      Redmond sees roughly 37 inches of rain annually, most of it arriving October through May in
      sustained sheets, not brief downpours.

      Missing sill pan flashing or improperly lapped head flashing lets water sit against the rough
      opening framing. Douglas-fir framing standard in PNW construction rots fast once the moisture
      barrier fails — sometimes two wet seasons is enough. Replacing a window without pulling the
      exterior casing, checking the king studs, and resealing every joint is a repair that revisits
      itself in five years. The split-levels off 148th Ave NE in 98052 show this pattern constantly:
      original '80s vinyl installed over felt paper with no pan flashing, now sitting on punky sill
      framing.

  - title: "SR-520 and I-405 noise penetrating through original single-pane units"
    description: |
      Homes along NE 24th Street and in Overlake in 98052 sit within a mile of SR-520. Single-pane
      aluminum units transmit freeway noise almost unimpeded — particularly in the 3am hours when
      highway rumble is loudest inside a quiet house.

      Upgrading to a laminated or acoustic-rated double-pane unit in the STC 30-35 range makes a
      measurable difference in sleeping rooms. Milgard Tuscany Series and Marvin Elevate both offer
      acoustic glazing options sized to fit standard retrofit rough openings without enlarging the
      framing.

  - title: "Basement egress windows that don't meet IRC minimum dimensions"
    description: |
      Converting a basement room to a legal bedroom in Redmond requires a minimum 44-square-inch
      net clear opening per IRC egress code — enforced at rough-in inspection by Redmond's city
      permit center. Most hopper windows installed before 1990 fall short of that dimension by half
      or more. Enlarging the rough opening into a concrete or CMU foundation wall adds concrete saw
      cutting to the scope, which changes the project cost considerably compared to a straight
      sash swap.

      This comes up often in the '80s split-levels near the Microsoft campus, where owners are
      finishing basements to add a bedroom without expanding the footprint.

faq:
  - q: "How fast can you get to Redmond for Window Installation?"
    a: |
      From Seattle, Redmond is 20-25 minutes via SR-520 or I-405 with normal traffic — closer to
      30 from South Seattle during evening rush. Vladislav schedules on-site consultations within a
      few days of your call. Reach him directly at (206) 591-1096. No call center, no commissioned
      closer — just the contractor who will actually run the project. TopVolk has completed 100+
      projects across King and Snohomish counties since 2017.

  - q: "Milgard or Marvin for an Education Hill colonial — which fits better?"
    a: |
      Depends on what you're matching. Milgard Trinsic fiberglass suits the newer 2000s builds in
      98053 — slim sightline, solid PNW humidity resistance. Marvin Elevate is the better pick where
      you need to match original divided-light grilles on an older Education Hill colonial. TopVolk
      works with both product lines and brings samples to the site visit so you compare actual sash
      profiles before anything gets ordered.

  - q: "Does window installation in Redmond require a permit, and how long does it take?"
    a: |
      Retrofit replacements in the same rough opening are typically permit-exempt in Redmond when no
      structural work is involved. Enlarging an opening for egress compliance or adding a new window
      location does require a permit through Redmond's city permit center — plan review typically
      runs 2-4 weeks for window scope. WA Licensed Contractor status is required for any permitted
      installation. Deadline commitments are written into the contract with penalties for missed
      dates. Call (206) 591-1096 to confirm what your specific scope triggers before scheduling.