title: "Redmond Insulation — Attic R-49, Crawlspace & Rim Joists"

intro: |
  Education Hill and Overlake homes built in the late 1970s through early 90s — most
  of them in zip 98052 — got R-19 fiberglass batts in the attic at construction. That
  satisfied code then. Seattle's current energy code targets R-49, and the difference
  shows up on every PSE bill from October through March.

  A Mitsubishi heat pump running against a half-empty attic floor never reaches its
  rated efficiency. The system cycles harder, runtime climbs, and the indoor temperature
  still swings. TopVolk Construction LLC has handled this upgrade on 100+ Seattle Metro
  projects since 2017 — WA Licensed Contractor, owner-led, no sales staff between you
  and the person doing the work.

localContext: |
  Zip 98053 — Redmond Ridge, Bear Creek, Novelty Hill — is mostly 2000s-era
  construction. Many of those homes have decent attic insulation but skipped crawlspace
  encapsulation entirely.

  Zip 98052 runs older. Education Hill and Southeast Redmond ranchers and split-levels
  from the 1970s and 80s have original fiberglass batts that have compressed over four
  decades and now perform well below their labeled R-value. A batt that started at R-19
  in 1983 is often measuring closer to R-10 in the field today — not because the
  material failed catastrophically, but because it lost loft, shifted, and left gaps
  around ceiling penetrations.

  Redmond crawlspaces stay damp from October through May. That sustained moisture
  degrades batt performance and creates conditions for subfloor mold if the vapor
  barrier is missing or undersized — a common situation in homes that were never
  re-inspected after original construction.

commonProblems:
  - title: "Settled Fiberglass Batts in Education Hill Attics Delivering Half Their Rated R-Value"
    description: "Fiberglass batt insulation loses loft over 40 years. R-19 batts installed in a
      1981 Education Hill rancher are often performing at R-10 to R-12 by the time
      someone pulls back the attic hatch. Blown-in cellulose — Owens Corning or Johns
      Manville loose-fill — fills gaps around ceiling penetrations and recessed light
      cans that batts leave open, and holds its settled R-value more consistently over
      time. The air-sealing step before blowing in is critical: foam every penetration,
      box in recessed cans, and seal the attic hatch perimeter before a single bag of
      cellulose goes in. Skipping that step just buries the air leaks under insulation."

  - title: "Unencapsulated Crawlspaces Rotting Floor Insulation Through Redmond's Rain Season"
    description: "Crawlspaces without a proper vapor barrier pull ground moisture into the floor
      system every fall. Floor joists and OSB subfloor panels cycle through wet-dry
      stress all winter. CertainTeed rigid foam plus a 20-mil poly vapor barrier
      mechanically fastened to the stem wall stops the moisture cycle at the source —
      not just at the insulation layer sitting above the problem. In older homes with
      post-and-pier foundations common to Redmond's 1970s stock, the vapor barrier
      installation requires careful fitting around existing piers and blocking to
      eliminate any gaps where ground moisture can bypass the liner."

  - title: "Rim Joist Air Gaps Driving Up Heating Bills in 98052 Split-Levels"
    description: "The rim joist — where the floor framing sits on the foundation wall — is one of
      the worst air-sealing failures in Redmond's older housing stock. Two inches of
      closed-cell spray foam per IRC air-barrier requirements provides roughly R-13 and
      near-zero infiltration at that transition. Split-levels in 98052 also have knee
      walls behind finished spaces — those need rigid foam or mineral wool batted
      between studs, or the same heat loss repeats at a different elevation."

faq:
  - q: "How fast can you get to Redmond for an insulation consultation?"
    a: "Redmond is regular territory — we travel SR-520 and work throughout Education Hill
      and the Overlake corridor. Vladislav can usually schedule a site visit within one
      week. Call (206) 591-1096 to reach him directly, not a scheduler."

  - q: "What insulation brands and materials do you use for Redmond projects?"
    a: "Attic blown-in goes in as Owens Corning or Johns Manville loose-fill cellulose or
      fiberglass, depending on attic geometry and joist spacing. Crawlspace encapsulation
      uses 20-mil poly liner and CertainTeed rigid foam board. Rim joists get
      closed-cell spray foam. All materials qualify for PSE Home Energy Rebates where
      the project meets minimum R-value thresholds — we document the work for your
      rebate application."

  - q: "What does a full attic and crawlspace insulation project typically cost in Redmond?"
    a: "For a typical 98052 rancher — roughly 1,500 sq ft footprint, blown-in attic to
      R-49, crawlspace vapor barrier and rigid foam, plus rim joist spray foam — budget
      $8,000–$14,000 before PSE rebates. That range shifts based on crawlspace access,
      whether the existing batts need full removal, and how much air-sealing work the
      attic penetrations require before blowing in new material. Vladislav quotes
      line-item on-site after measuring the actual space, not a lump number over the
      phone. Deadline penalty is written into the contract. Call (206) 591-1096 to
      schedule the consultation."