    a: |
      Redmond is easy to reach via 520 or 202 from our base — no long haul. Free on-site
      consultations with Vladislav directly, typically within a week of your call.
      Reach him at (206) 591-1096 to set it up.
  - q: "Cedar or composite — what actually holds up in Redmond's climate?"
    a: |
      Trex and TimberTech composite outperform cedar here. Cedar looks sharp when new but
      moss colonizes north-facing surfaces within a couple of seasons and it needs annual
      sealing. Composite holds up through Redmond's wet winters with almost no maintenance
      and carries 25-30 year warranties on most product lines.
  - q: "What does the permit process look like for a deck in Redmond?"
    a: |
      Redmond runs its own permit center — separate from King County DPER. An attached
      deck typically needs a building permit and structural drawings, with plan review
      running 3-6 weeks. TopVolk handles the permit application as part of the project.
      WA Licensed Contractor. Call (206) 591-1096 — we'll walk through the full timeline
      at the consultation. Deadline penalties are written into our contracts.