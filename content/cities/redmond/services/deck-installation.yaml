title: "Redmond Deck Installation — Tech-Era Builder Decks Failing in 98052"

intro: |
  A lot of the homes off Marymoor Park on the west side of Redmond (98052) were built fast
  during the late 1990s Microsoft expansion — and the builder-grade PT lumber decks that came
  with them are now 25 years old. Ledger boards were face-bolted without flashing. Joist
  hangers were skipped at interior connections. Redmond pulls 37+ inches of rain annually,
  and that combination of age and moisture means structural failure is already underway on
  many of these decks, not just surface rot.

localContext: |
  Education Hill, Bear Creek, and the Grass Lawn neighborhoods (98052, 98053) are mostly
  1990s-2000s subdivisions built during the tech-sector housing surge. Foundation and framing
  quality varied by builder. Post footings on sloped lots were often undersized — King County
  requires footings to frost line, typically 12-18 inches depending on site exposure.
  Many Overlake-area homes also have second-story decks over finished living space, where
  drainage design matters as much as the decking material itself.

commonProblems:
  - title: "Ledger board rot from missing flashing — the silent killer on 90s Redmond builds"
    description: |
      Original construction in most 98052 subdivisions skipped Vycor flashing tape behind the
      ledger board. Water infiltrates the rim joist connection, soaks into the band joist, and
      rots the structural framing from behind. By the time the deck surface looks bad, the
      rim joist is often compromised. A proper replacement requires removing the ledger, assessing
      the rim joist damage, and installing kickout diverters before reattaching. Trex or
      TimberTech composite decking on top doesn't fix a rotted attachment point.
  - title: "Post footings that don't reach frost line on Bear Creek and Education Hill slopes"
    description: |
      Sloped lots throughout Bear Creek and Education Hill have variable frost exposure.
      King County DPER requires footings to frost line — 12 inches minimum, often 18 inches
      on exposed hillside sites. Builder-era footings from the late 90s frequently don't
      meet current standards. Freeze-thaw cycles in Redmond winters will heave an undersized
      footing, rack the post-and-beam frame, and eventually pull the ledger connection loose.
      Ground-contact pressure-treated (PT) lumber at posts is also non-negotiable.
  - title: "Guardrail height and stair stringer compliance on sloped Redmond lots"
    description: |
      Decks higher than 30 inches above grade require 36-inch minimum guardrails under IRC —
      and on the sloped lots common in 98052, "above grade" isn't always obvious. The grade
      drops away from the house, so a deck that looks low at the door can be 4 feet off the
      ground at the far corner. Redmond's permit center will flag this in plan review.
      Stair stringers need 7-3/4 inch maximum rise, 10-inch minimum run, and graspable
      handrails on both sides if the stair width clears 44 inches.

