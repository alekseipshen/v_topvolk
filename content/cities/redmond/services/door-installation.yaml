title: "Redmond Door Installation — Marvin Fit, Pan Flashing, Right"

intro: |
  Overlake and Education Hill homes in 98052 sit right in the path of northwest rain
  coming off the Cascades, and builder steel entry doors from the late-1980s
  construction boom on those streets are past their service life — pan flashing
  missing, thermal breaks gone, sill plates soft. Marvin's Elevate line handles this
  climate well, but the install determines whether a door lasts 30 years or leaks by
  year three.

  Redmond gets roughly 37 inches of rain annually, most of it falling between October
  and April. That's a long wet season for a threshold that wasn't flashed right the
  first time.

  Vladislav Volkov (WA Licensed Contractor, 100+ projects since 2017) handles door
  work across Redmond as part of full remodels and standalone replacements — 98052
  off Leary Way, 98053 along Redmond Ridge, and the newer infill near the Sammamish
  border in 98074. No salespeople. You talk to the person who actually scopes and
  builds the work.

localContext: |
  The 98053 corridor — Redmond Ridge and Novelty Hill — runs mostly 2000s-era
  construction with engineered lumber framing and cleaner rough openings, but
  builder-grade exterior doors were still specified cheap. Older blocks near Marymoor
  Park in 98052 have a different problem: late-1980s hollow-core interiors and
  prehung units set without proper casing reveals. Remodeling those houses usually
  means pulling the old frame entirely, confirming rough opening dimensions, and
  blocking the wall before hanging anything new.

  Southeast Redmond near 98074 — where Education Hill Drive meets the Sammamish
  Plateau edge — mixes 1990s tract homes with newer infill. Both eras share the same
  drainage problem on north-facing elevations: moisture collects at the threshold
  because the overhang is shallow. A correct install on those lots requires a back-dam
  at the sill, peel-and-stick membrane lapped over the rough sill plate, and
  elastomeric caulk at the brick mold. Skip any of that and you're looking at a rotted
  king stud within five years.

  Permits for door work in Redmond go through the City of Redmond permit center — not
  SDCI, not King County DPER. Straight swaps on existing openings usually don't
  require a permit. Header modifications do. Vladislav confirms scope before quoting
  so there are no surprises mid-project.

commonProblems:
  - title: "Steel Entry Doors from the '80s Redmond Build Wave — No Pan Flashing, Rotted Sill Plate"
    description: |
      Builder steel doors on late-1980s Education Hill and Overlake homes landed directly
      against OSB sheathing — no pan flashing, no back-dam. Water tracks behind the
      threshold, saturates the king stud, and eventually compromises the framing.

      Proper replacement means building the pan from scratch with Schluter Kerdi
      membrane or peel-and-stick weather barrier before the new Pella or Therma-Tru
      unit goes in. The rough opening gets inspected for rot first. Sometimes a sister
      joist or blocking repair is part of the scope. That's not an add-on — it's part
      of doing the install correctly so it doesn't fail again in ten years.

  - title: "Sliding Patio Door Replacement — Worn Rollers, Oxidized Frames, Moving to Multi-Slide"
    description: |
      Original aluminum sliders on 1990s Redmond tract homes had a 20-year service life
      at best. Worn rollers and failed weatherstripping let cold air in from October
      through April.

      Converting to a Milgard or Andersen multi-slide system requires verifying rough
      opening width or resizing the header with an LVL beam — neither is a one-day
      swap. On homes near Redmond Town Center in 98052, the patio wall often carries
      load from the floor above, which means the header engineering matters. Vladislav
      pulls the permit when structural work is involved and coordinates with a structural
      engineer when beam sizing requires a stamp.

  - title: "Smart Lock Integration — Backset Dimensions and Strike Plate Reinforcement"
    description: |
      Redmond homeowners upgrading to August Wi-Fi Smart Lock or Schlage Encode during
      door replacement need the bore prep done right. Standard backset runs 2-3/8
      inches, but older prehung units often sit at 2-3/4 inches.

      Getting the bore pattern correct, upgrading the strike plate with 3-inch screws
      into the stud, and confirming door thickness (1-3/4 inch standard) prevents lock
      failure later. On fiberglass doors — Therma-Tru or Pella — bore reinforcement
      plates matter more than on solid wood, because fiberglass compresses at the
      bore edge under deadbolt load if the backing isn't right.

faq:
  - q: "How fast can you get to Redmond for a door installation consult?"
    a: |
      Redmond is 20-25 minutes from the regular work zone — NE 8th to 520 depending
      on traffic. Consultations usually schedule within a week. Call (206) 591-1096
      and Vladislav comes out personally to look at the opening, measure the rough
      opening, and check the framing condition. Not a salesperson. The person who
      scopes it is the person who builds it.

  - q: "Do you install Pella, Marvin, or Andersen doors, or are you limited to specific brands?"
    a: |
      Pella, Marvin, Andersen, and Milgard are all options, plus Therma-Tru fiberglass
      for entry doors. Brand choice depends on budget, opening dimensions, and
      performance goals. Marvin Elevate handles the 98052 and 98053 climate exposure
      well for premium installs. Therma-Tru Pulse Series is a solid mid-range fiberglass
      option that holds up in the wet season without the price of a Marvin unit.
      Vladislav walks through the trade-offs on site — no preferred vendor to push.

  - q: "Does door replacement in Redmond require a permit, and how long does the job take?"
    a: |
      Straight door-for-door swaps on existing openings typically don't trigger the
      permit process through Redmond's permit center. Widening an opening or changing
      a structural header requires plan review — usually 2-6 weeks depending on scope.

      Door-only installs run 1-3 days once materials arrive. If framing repairs are
      needed — rotted sill plate, king stud damage, header replacement — add a day or
      two. Missed deadlines carry a penalty written directly into the contract. That's
      not a talking point; it's in the paperwork before work starts.