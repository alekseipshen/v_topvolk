title: "Redmond Door Installation — Weathertight Frames for 98052"

intro: |
  Homes around Marymoor Park and up through Education Hill in 98052 were built mostly
  between 1995 and 2015 — and builder-grade entry doors came standard with those packages.
  A decade of King County rain is enough to debond stick-on pan flashing at the sill,
  compress the threshold seal flat, and let water track into the subfloor framing before
  anyone notices.

  That water doesn't announce itself. By the time a Pella or Therma-Tru replacement gets
  quoted, the sill plate sometimes needs sister joists alongside the new door unit. TopVolk
  handles the full scope — door, flashing, and frame — not just the panel swap.

localContext: |
  Redmond's housing runs from 1960s-70s ranchers in Overlake (98052) to post-2000
  construction on Redmond Ridge (98053). Older Overlake homes frequently have 34-inch
  rough openings — too narrow for a standard 36-inch entry unit without header
  modification and re-shimming the jack studs.

  Education Hill builds from the early 2000s have code-compliant framing but original
  builder hardware that's now 20-plus years old and showing it. Even the newer Redmond
  Ridge homes are past the point where weatherstripping holds a seal through a King County
  winter without full replacement.

  Rim joist exposure at the sill is the real tell.

commonProblems:
  - title: "Pan Flashing Failure at the Entry Sill"
    description: "Stick-on pan flashing debonds after 8-12 years in King County's climate —
      especially on north-facing entries that stay wet October through April without drying
      between storms. Water wicks under the threshold and into the rim joist before showing
      up on interior flooring. By that point the sill plate often needs sister joists alongside
      the new door. The fix requires pulling the door unit entirely, replacing the flashing
      with a formed metal pan and fluid-applied membrane at the corners, then reinstalling
      with proper pressure-treated blocking at the sill. Therma-Tru and Pella door warranties
      don't cover rot that originated from failed flashing installation — and neither does
      homeowners insurance in most cases. Getting the flashing right the first time costs
      less than the callback."

  - title: "Undersized Headers in Overlake-Era Ranchers"
    description: "Widening a 32-inch opening to fit a modern 36-inch fiberglass door in 1960s
      Overlake homes often exposes a single 2x10 header where current IRC calls for an LVL
      beam. Installing the correct header, re-shimming the king and jack studs, and squaring
      the rough opening properly adds a day to the job but prevents callbacks. Skip it and a
      new Milgard or Andersen unit binds or stops weather-sealing correctly within a year."

  - title: "Smart Lock Incompatibility on Off-Square Door Frames"
    description: "Schlage Encode and August smart locks require a door that closes square and
      latches without lifting or binding at the strike plate. Redmond homeowners run into
      this constantly — the door sags, the deadbolt mid-throws under load, and the lock
      logs false 'door ajar' alerts through the night. Smart-lock troubleshooting won't fix
      a frame problem. The rough opening and door swing need to be right before any
      hardware goes on."

