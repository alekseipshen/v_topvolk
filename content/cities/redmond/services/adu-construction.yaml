title: "Redmond ADU Construction — Eastside Rental Income, Real Numbers"

intro: |
  Microsoft's Redmond campus and Nintendo of America's North American headquarters both sit in 98052, and the tech worker rental demand they generate is real and sustained. A 640-square-foot DADU on Education Hill — Mitsubishi mini-split, curbless shower, quartz countertops, separate utility metering — rents for $2,300-$2,500 per month. Most owners recover build costs in six to eight years. WA HB 1337 (2024) opened this to most single-family lots statewide, including throughout Redmond's residential zones. Vladislav Volkov has completed ADU projects across the Eastside since 2023 — TopVolk Construction LLC, WA Licensed Contractor, 100+ projects.

localContext: |
  Overlake's grid of 1980s two-story homes sits on lots typically ranging from 6,500 to 10,000 square feet — enough room for a legal DADU under Redmond's 24-foot height limit and rear setback requirements, provided lot coverage stays within the allowed percentage. Redmond's permit center handles ADU applications independently of King County DPER, and plan review for a new detached structure in 98052 runs 8-12 weeks on a complete submittal. Redmond Ridge and Bear Creek tend toward newer construction, but the lot math usually works out there too.

commonProblems:
  - title: "DADU, Attached ADU, or Basement Conversion — Which Path Fits Your Lot?"
    description: "A 7,500 sq ft lot in 98052 might look like straightforward DADU territory, but side setbacks and lot coverage calculations can close that option before design drawings start. Basement conversions bypass the footprint constraints entirely — they need egress windows sized to IRC code, a vapor barrier under the slab, occupancy-rated fire separation, and a standalone mechanical zone. Attached ADUs share a wall and often a utility connection, which reshapes the structural scope and the FAR calculation. We pull parcel data and evaluate all three paths before you spend on an architect."

  - title: "Utility Separation Adds $8K-$15K — But It's Not Always Required"
    description: "Running an independent water and sewer tap from the street adds $8,000-$15,000 depending on meter size and the distance to the main line. Owner-occupied ADUs can legally run on a shared connection in many Redmond configurations. Heating the unit is its own question: a Navien tankless water heater paired with hydronic radiant floor, or a Mitsubishi mini-split, keeps the ADU self-contained without extending the main house's aging ducted HVAC system. We map the utility strategy at the first site walk — changes mid-construction cost significantly more."

  - title: "Redmond Plan Review: 8-12 Weeks, and Incomplete Packages Restart the Clock"
    description: "Seattle SDCI offers a pre-approved ADU plan program (MAP) that compresses permitting timelines. Redmond's permit center doesn't have an equivalent — every DADU goes through full plan review, typically 8-12 weeks. Submit an incomplete package and you lose your queue position; that slip adds 4-6 weeks minimum. Structural drawings need LVL beam sizing, rim joist details, joist hanger callouts, and Hardie siding specifications from the first submission. Getting the initial package right is the only real way to protect a 4-7 month end-to-end build schedule from stretching."

faq:
