    a: "Redmond is a regular stop — active projects in 98052 and 98053 most months. Call (206) 591-1096 to schedule a free on-site walk with Vladislav directly. No sales staff, no commissioned closer — the person on the phone is the contractor doing the work. Overlake and Education Hill have straightforward residential parking for site visits."

  - q: "What brands and finishes do you specify for ADU kitchens and bathrooms in Redmond?"
    a: "Full-scope builds run foundation through finish — MEP rough-in, R-49 ceiling insulation, drywall hang/tape/mud, flooring, cabinetry, and all fixtures. Redmond's higher-budget ADU builds regularly spec Sub-Zero drawer refrigerators, Wolf induction ranges, and panel-ready Bosch dishwashers. Standard rental-grade builds use durable mid-range fixtures sized for long-term tenancy. Every completed unit gets a blue tape walkthrough and a formal punch list before handover."

  - q: "What does a DADU cost to build in Redmond, and what's the timeline?"
    a: "A 400-800 sq ft DADU in Redmond typically runs $180,000-$320,000 depending on finishes, utility separation requirements, and site conditions. Plan review adds 8-12 weeks before a shovel goes in the ground. Construction runs 4-5 months. End-to-end with a clean permit package: 4-7 months. Vladislav quotes line-item pricing at the on-site consultation — no vague ranges. Deadline penalties are written into every contract. Call (206) 591-1096 to start."