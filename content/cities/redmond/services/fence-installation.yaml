title: "Redmond Fence Installation — Cedar, Vinyl & Horizontal Slat"

intro: |
  Marymoor Park sits at the edge of 98052, and the residential streets radiating out from
  the Sammamish River Trail include some of Redmond's older housing stock — 1970s and early
  1980s ranchers with cedar fences now 40-plus years old and mostly past their useful life.
  But replacement in Redmond is never a simple swap. Education Hill homeowners frequently
  want horizontal cedar slat or composite fencing to match the modern PNW aesthetic, and
  that's a more demanding build than a standard board-on-board privacy fence. Posts need to
  be set at 36 inches minimum in Redmond's clay-heavy soils — not the 24-inch depth that
  plenty of installers cut corners on when the ground is saturated. TimberTech composite
  horizontal slats hold up significantly better than cedar through Redmond's heavy
  October-through-May rain cycle, with no annual sealing required. TopVolk Construction has
  completed 100+ projects across King County since 2023, and Vladislav can walk your Redmond
  property, assess drainage, and hand you line-item pricing at the first visit. Call
  (206) 591-1096 to get on the schedule.

localContext: |
  Redmond's 98052 zip covers the older subdivisions around Overlake and North Redmond —
  split-levels and ranchers from the late 1960s through 1980s where the original wood fences
  are long overdue. Most of those lots run 7,000-9,000 square feet with 6-foot privacy fences
  on side and rear property lines. Over in 98053, the Redmond Ridge and Sammamish Plateau
  developments from the early 2000s lean toward HOA-governed communities — CC&Rs in those
  neighborhoods often restrict fence materials, stain colors, and height independently of
  city code, sometimes tighter than what Redmond's municipal code actually requires. City of
  Redmond fence regulations follow standard residential limits: 6 feet maximum on side and
  rear, 4 feet maximum in the front yard setback. Any fence tied to a retaining structure
  holding back more than 4 feet of soil triggers a building permit through the City of
  Redmond permit center — that's handled locally, not through Seattle SDCI, and adds 4-8
  weeks to the project schedule. Shared property line fences require written neighbor
  agreement before post holes go in; skipping that step causes disputes that halt projects
  mid-build.

commonProblems:
  - title: "Cedar Posts Rotting in Redmond's Clay-Heavy Soil Near Bear Creek"
    description: |
      The Bear Creek watershed and lower-lying areas of North Redmond sit on compacted
      glacial till with poor drainage — cedar posts, even pressure-treated, begin to rot at
      ground contact within 8-12 years when set directly in wet clay without proper footings.
      The culprit is almost always a post set at only 24 inches depth with minimal concrete,
      leaving the wood-soil interface saturated from October through April. Fixing it right
      means setting 4x4 or 4x6 PT lumber posts at 36 inches minimum, pouring Quikrete
      Fast-Setting Concrete around the base, and using a Simpson Strong-Tie ABA post base
      bracket to lift the wood above grade in spots where drainage stays poor year-round.
      Replacing all posts on a 150-linear-foot fence typically runs $2,500-$4,500 depending
      on slope and site access. If three posts have gone soft, the rest aren't far behind —
      partial post replacement rarely buys more than 3-4 additional years.

  - title: "Horizontal Slat Fence Hardware Failing in PNW Humidity"
    description: |
      Horizontal cedar fence panels are common throughout Redmond Ridge and the newer
      Education Hill builds, but the installation demands more precision than vertical
      board-on-board. Rails need to be attached via steel U-channel rail systems or dadoed
      directly into the posts — otherwise the horizontal boards sag and pull away from the
      frame within a few wet seasons. Cheap zinc-plated carriage bolts oxidize fast in
      Redmond's wet winters, leaving orange rust streaks running down the cedar by year two.
      Hot-dipped galvanized or stainless steel fasteners throughout, no exceptions. Spacing
      the slats 1/8 inch apart allows air circulation and significantly reduces cupping.
      Trex Seclusions composite horizontal slats are worth the premium for homeowners who
      want zero seasonal maintenance — composite runs $35-55 per linear foot installed versus
      $22-32 for cedar, and doesn't need sealing every other season.

  - title: "Retaining Wall Fences and City of Redmond Permit Requirements"
    description: |
      Hillside lots on Education Hill and the terrain sloping toward Bear Creek frequently
      involve grade changes of 3-5 feet between neighboring properties. Build a fence on top
      of that slope and it can function as a retaining structure — which triggers a building
      permit through the City of Redmond permit center even if the fence itself is under 6
      feet tall. The IRC threshold is 4 feet of retained soil: exceed that, and the AHJ
      requires structural drawings and plan review before any work begins. A common approved
      approach is pressure-treated 6x6 posts set in Sonotube concrete forms at 48-plus
      inches depth, handling both the retaining load and fence attachment in a single
      structural member. City of Redmond plan review for a fence-retaining wall combination
      typically runs 4-8 weeks. TopVolk, a WA Licensed Contractor, handles permit submittal
      and coordinates the drawings so the homeowner doesn't have to manage AHJ correspondence
      independently.

  - title: "Cedar vs. Vinyl vs. Composite: Getting the Cost Math Right in 98052"
    description: |
      Cedar is the classic PNW privacy fence material — locally sourced, naturally
      rot-resistant, and architecturally appropriate for Redmond's housing stock. Installed
      cedar privacy fence runs $20-30 per linear foot. Vinyl fence with post caps runs
      $25-38 per linear foot and requires zero annual sealing, making it popular with Overlake
      homeowners managing rental properties or just minimizing upkeep tasks. Composite fencing
      like Trex Seclusions comes in at $35-55 per linear foot installed but carries a 25-year
      fade and stain warranty directly from the manufacturer. Gate count drives the final
      budget more than most homeowners expect — each walk gate adds $400-800, and double
      drive gates run $900-1,800 depending on frame gauge and self-closing latch hardware
      selection. Slope, rocky soil common in the foothills toward Snoqualmie, and corner
      count all affect total pricing. Free on-site estimates from TopVolk include a
      line-item breakdown, not a vague ballpark.

  - title: "Repair vs. Replace: Assessing Aging Cedar Fences in Redmond"
    description: |
      Most cedar fences in Redmond built between 1998 and 2008 are now 18-28 years old —
      beyond the 15-20 year lifespan typical for untreated cedar under PNW rain conditions.
      Individual pickets and rails can be replaced without pulling all the posts, saving
      significant cost if the post structure is still structurally sound. The field test is
      simple: grab each post and rock it. Movement over an inch means the concrete footing
      has failed and that post needs to come out entirely. Kiln-dried cedar pickets in 1x6
      run $2.50-4.50 per board at Dunn Lumber, which serves the Redmond corridor well.
      Replacing rails uses 2x4 pressure-treated lumber set in galvanized rail brackets for
      added structural life without full demo. Gate hardware — particularly self-closing
      hinges like D&D Technologies TruClose or Adjust-A-Hinge — should be upgraded during
      any repair project, especially on pool barrier gates where self-closing and
      self-latching hardware is code-required. Partial repair on a 100-linear-foot section
      typically runs $1,200-2,500 versus $6,000-9,000 for full replacement.

faq:
  - q: "How fast can you get to Redmond for a fence estimate?"
    a: |
      Redmond is about 16 miles east of Seattle via SR-520 — typically 25-35 minutes without
      peak-hour traffic, and we schedule around that realistically. TopVolk can usually get
      out for a site visit within 3-5 business days of your call. After the on-site estimate
      and any permit prep needed, installation on a standard 150-200 linear foot privacy fence
      runs 2-4 days of on-site work. Permit-required projects — retaining wall fences, for
      example — add 4-8 weeks for City of Redmond plan review before installation can start.
      Call Vladislav directly at (206) 591-1096; you'll be talking to the person who'll
      actually be on your property, not a dispatcher relaying messages.

  - q: "What does fence installation cost per linear foot in Redmond?"
    a: |
      Cedar privacy fence runs $20-30 per linear foot installed — that covers 6-foot boards,
      4x4 PT posts set at 36 inches, and standard rail attachment with hot-dipped galvanized
      hardware. Vinyl fence with post caps runs $25-38 per linear foot. Composite fencing
      (Trex Seclusions or TimberTech) runs $35-55 per linear foot. Walk gates add $400-800
      each; double drive gates run $900-1,800 depending on frame weight and self-closing latch
      hardware. Slope, gate count, and soil type all move the final number — clay-heavy lots
      near Bear Creek cost more to dig than level sandy-soil yards. Call (206) 591-1096 or
      schedule a free on-site consultation; Vladislav brings line-item pricing to the visit,
      not a range.

  - q: "Does my Redmond fence project need a permit from the city?"
    a: |
      Standard residential fences under 6 feet on flat lots in Redmond typically don't require
      a permit. The exception: any fence functioning as a retaining structure holding more than
      4 feet of soil triggers a building permit through the City of Redmond permit center, and
      structural drawings are required per IRC before the AHJ will sign off. HOA-governed
      neighborhoods like Redmond Ridge carry CC&Rs that can restrict fence materials, stain
      colors, and height independently of city code — HOA board review typically runs 2-4
      weeks. TopVolk, a WA Licensed Contractor, handles the permit application and HOA
      submittal paperwork as part of the project scope. No permit surprises discovered
      after installation.

  - q: "Do you build horizontal slat fences in Redmond?"
    a: |
      Yes — horizontal cedar and composite slat fences represent a significant share of
      TopVolk's Redmond work, and they're among the more technically demanding installs in
      residential fencing. Posts need tighter spacing (6 feet on center maximum) and deeper
      footings than vertical picket fences to handle the lateral load horizontal boards create.
      Steel U-channel rail systems keep slats straight over time and prevent the sagging that
      shows up on cheaper installations within 2-3 seasons. Stainless steel fasteners are
      standard throughout — galvanized screws leave rust streaks on cedar in Redmond's wet
      winters. TimberTech composite horizontal slats eliminate the annual sealing requirement
      entirely and carry a manufacturer warranty on fade and stain. Call (206) 591-1096 to
      discuss material options and post spacing for your specific lot.

  - q: "How long will a cedar fence last in Redmond's climate?"
    a: |
      Properly installed cedar fence with PT posts at 36 inches and sealed boards typically
      lasts 15-20 years in Redmond. The weak points are always the posts at ground contact —
      rot usually begins around year 10-12 in the wetter pockets near the Bear Creek
      watershed. Sealing the cedar every 2-3 years with a penetrating oil stain such as TWP
      100 Series or Olympic Maximum extends the lifespan meaningfully. Composite fence like
      Trex Seclusions or TimberTech carries a 25-year limited fade and stain warranty from
      the manufacturer and skips the seasonal maintenance cycle entirely. On all TopVolk fence
      projects, the completion deadline and a penalty clause for missed milestones are written
      directly into the contract — 100+ projects completed since 2023 across the Seattle Metro.

  - q: "Do you handle fence projects in Kirkland, Bellevue, and nearby cities?"
    a: |
      TopVolk works throughout King County and into Snohomish County — Kirkland, Bellevue,
      Sammamish, Issaquah, Bothell, and Woodinville are all regular project areas. Each city
      runs its own permit office: Kirkland and Bellevue both maintain separate permit centers
      from King County DPER, and Snohomish County uses PDS for unincorporated areas outside
      city limits. For Mercer Island and Vashon Island projects, King County DPER handles
      permitting. Scheduling for Redmond and surrounding areas typically means a site visit
      within 3-5 business days of your call, with installation starting within 2-4 weeks for
      non-permitted work. Call (206) 591-1096 — Vladislav answers directly, and the estimate
      visit is free with no commissioned sales pressure involved.