title: "Redmond Electrical — Panel Upgrades, EV Circuits & PSE Permit Work"

intro: |
  Half the driveways on Education Hill have a Tesla or Rivian plugged in overnight, and Level 2 chargers pull 48 amps continuous — more than most 1978 panels were ever sized to handle alongside a heat pump and a Mitsubishi mini-split. The older residential neighborhoods near downtown Redmond and around Overlake hit this wall constantly. TopVolk handles 200-amp service upgrades, load calculations, EV charger installs, and permit coordination directly with PSE so the electrical work gets done once and inspects clean. Every electrical project goes through Vladislav directly — no sales staff, no phone tag with a dispatcher.

localContext: |
  Most of the housing stock in 98052 and 98053 dates from the 1970s and 1980s — the same period when aluminum branch wiring was standard in residential construction across King County. Education Hill and the Overlake neighborhoods hold a significant share of these homes, with original 100-amp panels that were code-compliant in 1982 but weren't sized for today's loads. A cluster of streets near downtown Redmond goes back to the 1950s and early 1960s, where original service equipment still in place was never designed to support a modern tech household drawing power around the clock. Redmond's tech-heavy demographics mean households running dual home offices, EV charging, and whole-home backup power — electrical demand that pushes aging infrastructure well past its rated capacity.

commonProblems:
  - title: "Aluminum branch wiring in 1970s Education Hill and Overlake homes"
    description: "Homes built between 1965 and 1973 commonly used aluminum for 15- and 20-amp branch circuits. Aluminum expands and contracts differently than copper, and the connections at outlets and switches loosen over decades of heating and cooling cycles. The correct fix is AlumiConn connectors or CO/ALR-rated pigtailing at every device — not just the outlets that have already shown heat damage. That full scope requires a permit and a rough-in inspection through the City of Redmond's electrical division. Skipping devices to save money creates the exact failure point that causes arc faults and fires."
  - title: "100-amp panels tapped out by EV chargers, heat pumps, and induction ranges"
    description: "A JuiceBox or ChargePoint Level 2 charger pulls 48 amps at 240V — continuously. Add a heat pump, an induction range, and a home office with a dense equipment load, and a 100-amp main is done. A 200-amp service upgrade means a new meter base, properly sized service entrance conductors, and a new main breaker panel, with PSE coordinating the utility-side disconnect. Load calculation first, then rough-in, then final inspection. In Redmond's 98052 zip code, many of these electrical service upgrades also uncover undersized service entrance cable that was grandfathered in for decades."
  - title: "AFCI and GFCI compliance gaps flagged when remodel permits are pulled"
    description: "Current NEC requires arc-fault circuit interrupter (AFCI) breakers in every bedroom and GFCI protection in bathrooms, kitchens, garages, crawlspaces, and outdoor circuits. Most Redmond homes built before 2005 have neither. Any permit-required remodel in King County will trigger code compliance on the affected circuits — and if the existing panel is already at capacity or is a recalled brand, a full panel replacement gets added to the scope at the same time. The electrical rough-in inspection happens before any drywall closes up, so sequencing matters."

