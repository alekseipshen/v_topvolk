title: "Redmond Electrical — Panel Upgrades, EV Circuits & Wiring"

intro: |
  Tech households in Overlake and Education Hill are stacking electrical loads that 1970s homes were never designed to carry — dual workstation setups, Level 2 EV chargers, heat pumps, and Wolf or Thermador ranges all running off 100A service. Homes in 98052 near Marymoor Park get flagged during sales inspections constantly for aluminum wiring from the 1965-1973 construction wave. City of Redmond permits the panel work; PSE coordinates the meter upgrade. TopVolk handles both ends — WA Licensed Contractor, 100+ projects across King County since 2023.

  Vladislav takes the call himself. No estimator, no sales cycle, no handoff to a crew you've never met.

localContext: |
  Education Hill and older Overlake blocks in 98052 were built out heavily between 1965 and 1985 — exactly the window when aluminum branch-circuit wiring was standard. Those homes need AlumiConn connectors at every device box, or a full rewire depending on condition and how many termination points show oxidation. A visual inspection alone doesn't cut it; you need a load test at the panel and a device-by-device check in every room.

  Redmond Ridge and the Union Hill Road corridor in 98053 tell a different story. 200A service is already there, but panels fill up fast once someone adds a 60A EV circuit, a hot tub sub-panel, and a Mitsubishi mini-split all in the same permit season. Tandem breakers get crammed in. Double-tapped neutrals show up. The panel technically runs, until it doesn't.

  Off 148th Ave NE and the older streets near Redmond Town Center, we also see a lot of mid-1990s builder-grade panels — Federal Pacific Stab-Lok and Zinsco units that insurance carriers are now flagging. Those aren't panel upgrades. Those are panel replacements, full stop. City of Redmond's permit center is straightforward to work with; plan review on a residential electrical permit typically runs two to four weeks.

commonProblems:
  - title: "100A service maxed out by EV chargers and heat pumps"
    description: "A Tesla Wall Connector or JuiceBox 48 needs a dedicated 50A or 60A circuit. Run a load calculation on top of an existing 100A panel with a heat pump already on it and you're over before the charger even draws current. Upgrading to 200A service — with PSE pulling the meter and City of Redmond issuing the permit — is the only real fix. Some Overlake homes near 156th Ave NE are already at 150A service from a previous partial upgrade; those need a full entrance replacement, not just a panel swap, to hit 200A. The load calc drives everything. We do it before we quote."
  - title: "Aluminum branch wiring arcing at outlet and switch boxes"
    description: "Education Hill homes from 1965 to 1973 used aluminum branch-circuit wiring that oxidizes at every termination point and creates resistance. Wire nuts aren't code-compliant here — AlumiConn connectors are required at each device box, junction box, and fixture connection. We document every remediation point and walk it through City of Redmond's rough-in and final inspection. On a typical three-bedroom Education Hill rancher, that's 40 to 60 individual termination points. Each one gets photographed, replaced, and logged."
  - title: "AFCI and GFCI breakers required across the board at panel swap time"
    description: "Current NEC mandates AFCI protection in bedrooms and GFCI in kitchens, bathrooms, garages, and exterior circuits. A panel replacement triggers full compliance on every affected circuit — the AHJ calls it at final inspection, not us. A 200A Square D QO or Siemens PL panel swap in Redmond typically picks up 15 to 25 new AFCI and GFCI breakers in the process. Budget for it upfront. We include the full breaker count in the line-item quote so there are no surprises at rough-in."

faq:
  - q: "How fast can you get to Redmond for electrical work?"
    a: "Redmond is a regular part of our schedule — we work throughout 98052 and 98053 consistently. Call (206) 591-1096 to set up a site visit. Free on-site consultation with Vladislav directly, not a salesperson. Residential streets off 148th Ave NE and Education Hill Road are easy parking, and we know the City of Redmond permit portal well enough to avoid the delays that catch contractors unfamiliar with the jurisdiction."
  - q: "Do you install Tesla Wall Connectors, ChargePoint, and JuiceBox chargers?"
    a: "Yes — Tesla Wall Connector, ChargePoint Home Flex, and JuiceBox 48 are the three we install most often in Redmond. Each requires a dedicated circuit, a load calculation on the existing panel, and a permit through City of Redmond. We handle all three steps. For homes in 98053 where the panel already has capacity, installation moves fast. For older 98052 homes still on 100A service, we'll tell you before you buy the charger whether a service upgrade is unavoidable."
  - q: "What does a 200A panel upgrade cost in Redmond and how long does it take?"
    a: "Panel swaps typically run $4,000–$6,500 depending on service entrance location, PSE meter pull logistics, and AFCI/GFCI count the AHJ requires at inspection. Homes with an exterior service entrance on the garage wall tend to be simpler. Older Overlake homes where the entrance runs through the attic add complexity and cost. City of Redmond plan review adds 2–4 weeks before work starts. Deadline written into the contract — penalties paid if we miss it. Call (206) 591-1096 for a line-item quote with actual numbers, not ranges."
  - q: "What's involved in an aluminum wiring remediation versus a full rewire?"
    a: "Remediation with AlumiConn connectors is code-compliant and works well when the wiring itself is undamaged — just the terminations are the problem. Full rewire makes more sense when insulation is brittle, the home has been modified with unlicensed additions, or an insurance carrier is requiring it as a condition of coverage. We assess both options on-site and give you a written comparison. For most Education Hill ranchers in good condition, remediation is the right call."