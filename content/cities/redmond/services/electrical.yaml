  - q: "Do you install Tesla Wall Connectors and other Level 2 EV charger hardware?"
    a: "Yes — Tesla Wall Connector, ChargePoint Home Flex, and JuiceBox Pro are the three most common electrical installs in Redmond right now. Most require a dedicated 60-amp, 240V circuit. We pull the permit through the City of Redmond or King County DPER depending on jurisdiction, handle the electrical rough-in, and schedule the final inspection. One contractor, start to finish."
  - q: "What does a 200-amp panel upgrade cost in Redmond, and how long does the project take?"
    a: "Panel upgrades in King County typically run $3,500–$6,500 depending on service entrance complexity, whether the panel needs to relocate, and PSE's availability for the meter disconnect. Count on 2–4 weeks from permit submittal to final inspection sign-off. Vladislav puts every electrical line item in writing at the on-site consultation — no ballpark ranges, no change-order surprises. WA Licensed Contractor, 100+ projects completed since 2017. Deadline penalties are written into every contract."