title: "Redmond General Contracting — Permits & Trade Coordination"

intro: |
  The corridor between Overlake and Education Hill is packed with homeowners
  who bought in the late 1990s and are finally doing the remodel they put off
  for a decade. A Wolf range swap in a 98052 kitchen becomes a full gut once
  you open the walls — range hood venting that never hit 400 CFM, cabinets
  that haven't been touched since 2002, and a layout that made sense before
  open-concept became standard. Vladislav Volkov pulls the permits with the
  City of Redmond, coordinates every sub, and stays on-site through final
  inspection.

localContext: |
  Education Hill's 1970s–1980s split-levels and the newer Redmond Ridge
  developments in 98053 are both common project types. Older homes come with
  galvanized supply lines, undersized panels, and framing that needs upgrading
  before finish work can start. The 2000s-era construction on Redmond Ridge
  looks cleaner but often lacks the structural prep for second-story additions
  or the MEP coordination required for whole-house remodels with Thermador or
  Sub-Zero appliance packages.

commonProblems:
  - title: "City of Redmond Plan Review Adds Weeks If the Package Isn't Right"
    description: "Redmond runs its own permit center — separate from Seattle SDCI and
      King County DPER — and plan review for major remodels runs 6–10 weeks.
      Incomplete structural drawings, missing FAR calculations, or setback
      errors trigger another review cycle. Getting LVL beam specs and
      load path details correct on the first submission prevents months of
      delay before demo even starts."
  - title: "Multi-Trade Scheduling Falls Apart on $100K+ Projects Without a GC"
    description: "Framing rough-in, electrical, plumbing, and mechanical all need to
      sequence correctly to pass rough-in inspection. On Redmond Ridge and
      Sammamish Plateau projects, a Mitsubishi mini-split install that isn't
      coordinated with drywall hang adds real cost. A plumber who shows up a
      week late holds every other trade — and that's when budgets break."
  - title: "Structural Surprises Surface During Demo in Education Hill Split-Levels"
    description: "Heavy rain from October through May accelerates wood rot in
      crawlspaces and at the rim joist in homes built before 1985. Opening
      walls on Education Hill frequently reveals sistered joists that were
      someone's DIY fix, undersized headers, or a PSL post that was never
      connected to the footing. TopVolk budgets contingency into every
      contract — structural finds don't become a renegotiation."

faq:
  - q: "How fast can you get to Redmond for General Contracting?"
    a: "Redmond is 20–35 minutes from most active project sites. Free on-site
      consultation with Vladislav directly — not a salesperson, not a project
      manager you'll never see again. Call (206) 591-1096 to schedule."
  - q: "Do you handle high-end appliance installations — Sub-Zero, Thermador, Wolf?"
    a: "Yes. Sub-Zero refrigerator panel framing, Thermador column rough-ins,
      and Wolf ventilation with 600+ CFM makeup air requirements all need
      specific electrical and carpentry specs. We've handled panel-ready
      installs across multiple Overlake and Education Hill projects."
  - q: "What does a full remodel timeline look like for a Redmond home?"
    a: "City of Redmond permit review adds 6–10 weeks upfront. Construction
      runs 10–16 weeks for a whole-house scope. Deadline milestones are
      written into every contract — miss them, TopVolk pays a penalty.
      100+ projects completed since 2023 across King County. WA Licensed
      Contractor. Call (206) 591-1096 for a line-item quote."