title: "Redmond Plumbing — Pipe Replacement & Fixture Work in 98052"

intro: |
  Zip code 98052 — the Overlake neighborhood, the subdivisions between NE 40th Street and the Sammamish River Trail — holds a lot of 1980s construction. Those houses look solid from the street. Inside the walls, many of them still have polybutylene supply lines: the gray flexible pipe installed from the late 1970s through 1995, before the industry figured out that chlorinated municipal water slowly degrades the acetal fittings at every valve, tee, and elbow. Fittings fail inside walls, in crawlspaces, under cabinets. By the time water shows, drywall and subfloor are already damaged. Vladislav does this repipe work regularly in Redmond — full replacement with PEX-A using Uponor ProPEX expansion fittings, new angle stops at every fixture, and Moen or Kohler fixtures refreshed during the same project so walls don't get opened twice. A repipe in a 2,000-square-foot Overlake rancher typically runs $9,000–$15,000 depending on story count and access. WA Licensed Contractor, 100+ projects completed since 2017.

localContext: |
  Redmond's housing stock splits into two clear plumbing eras. The western half — Overlake, Grass Lawn, the streets near Marymoor Park in 98052 — is 1970s through early 1990s construction. Polybutylene is the primary concern there, but galvanized steel supply lines also appear in pockets of pre-1970 homes closer to downtown Redmond. Education Hill and Redmond Ridge in 98053 skew newer — mostly 2000s and 2010s — where PEX and copper are standard but homeowners are remodeling kitchens and adding Rinnai or Navien tankless units. City water pressure in parts of 98052 runs above 80 psi on elevated streets north of NE 51st, exceeding the IRC maximum and hammering fixture valves, washing machine supply hoses, and appliance warranties over time. PNW rain patterns compound crawlspace moisture conditions in older homes — vapor barriers deteriorate, and drain lines in pier-and-post foundations can shift slightly over decades, creating slow drain problems that only show up when multiple fixtures run simultaneously.

commonProblems:
  - title: "Polybutylene Pipe Failure in 1980s–90s Overlake and Bear Creek Homes"
    description: |
      Gray poly pipe — sold under brand names like Quest and Shield — ran through tens of thousands of Seattle-area homes built between 1978 and 1995. Redmond's Bear Creek and Overlake subdivisions got a lot of it. The pipe itself is not the primary failure point. The acetal plastic fittings — connectors at valves, tees, angle stops, and elbows — degrade under chlorinated municipal water exposure over 20–30 years. Failures happen inside finished walls and crawlspaces, often without visible warning until the damage is already done. Full repipe with PEX-A and Uponor ProPEX fittings is the standard fix: expansion-joint connections that won't crack from chlorine exposure and flex without splitting in freeze-thaw conditions. For a 2,000–2,400 sq ft two-story, plan 5–7 working days and $9,000–$15,000 depending on fixture count and crawlspace access. Permits required through the City of Redmond Building Division.

  - title: "Tankless Water Heater Conversion — Gas Line Sizing in Education Hill Homes"
    description: |
      Navien NPE and Rinnai RUR condensing tankless units are popular upgrades in Education Hill and Redmond Ridge homes where 40-gallon tanks can't keep up with two showers and a dishwasher running at the same time. The problem most homeowners don't anticipate: tankless units demand 150,000–200,000 BTU at peak draw. Most 1990s and 2000s homes have ½-inch gas feeds to the water heater location, sized for a tank pulling 40,000 BTU. That line needs to be upsized — sometimes back to the meter — or the unit short-cycles and produces lukewarm water under load. Add a new Category III stainless exhaust vent, gas line reroute, and City of Redmond permit: full project cost typically $3,500–$6,500. Puget Sound Energy requires all gas work to be permitted and inspected by a licensed contractor.

  - title: "Drain Line Rerouting for Kitchen Islands and Basement Bathrooms"
    description: |
      Adding a kitchen island sink or finishing a basement bathroom in a Redmond crawlspace home is plumbing work — not a handyman project. Island sinks need a proper trap arm with a minimum ¼-inch-per-foot fall to the stack and either an air admittance valve (AAV) or a loop vent back to a vented drain. The City of Redmond allows AAVs under current code in most accessible installations. Basement bathrooms sitting below the main drain elevation need an ejector pump — Zoeller M53 is the workhorse unit used in residential applications — or a macerating toilet where wet work must stay minimal. Both scenarios require permits through the City of Redmond Building Division, with plan review running 3–5 weeks. The actual drain rerouting, rough-in inspection, and final sign-off adds $4,500–$9,000 depending on layout. Call (206) 591-1096 to walk through the specific floor plan before making assumptions about what's involved.

  - title: "High Water Pressure Damage and PRV Replacement in 98052"
    description: |
      Sections of 98052 — particularly streets on higher elevations north of NE 51st — see municipal water pressure running 85–95 psi at the meter. The IRC caps residential service at 80 psi for a reason. Over time, excess pressure causes pinhole leaks in copper supply lines, fails washing machine hoses, destroys toilet fill valves, and voids appliance warranties — Bosch and Miele dishwashers, for instance, specify maximum 87 psi in their installation specs. A pressure regulator valve (PRV) at the main shutoff — Watts 25AUB or Wilkins 70XL are both well-proven choices — installed and set to 65 psi solves the problem for years. Installed cost: $350–$700 depending on whether the main shutoff valve itself needs replacing (galvanized shutoffs in pre-1990 homes are frequently corroded in the open position and should be swapped to ball valve during the same visit). Same-day job, no permit required for PRV replacement alone.

  - title: "Water Heater Replacement with Seismic Strapping — WA Code and Permit Requirements"
    description: |
      Washington State requires seismic strapping on every water heater — new and replacement. It is a code requirement, not a recommendation, and any licensed contractor includes it automatically. What surprises many Redmond homeowners is that a water heater swap also requires a permit through the City of Redmond, a licensed contractor on the permit application, and a final inspection sign-off. Vladislav pulls these permits routinely — homeowners don't navigate the city portal themselves. Standard 40–50 gallon units (Rheem Performance Platinum or Bradford White Re2H50S10 are reliable mid-market choices) run $900–$1,400 installed including permit. Hybrid heat pump water heaters — Rheem ProTerra or AO Smith Voltex — qualify for federal tax credits through 2032 under the Inflation Reduction Act and operate efficiently in Redmond's mild, humid climate where ambient temperatures stay above the heat pump's efficient operating range year-round. Budget $1,800–$2,800 installed for heat pump units. WA Licensed Contractor on every permit.

faq:
  - q: "How fast can you get to Redmond for a plumbing estimate?"
    a: |
      Redmond is a regular stop — on-site estimates typically schedule within 3–5 business days. From Vladislav's base, Redmond is accessible via SR-520 or NE 8th through Bellevue, and parking at single-family homes in Overlake, Grass Lawn, and Education Hill is generally straightforward. The estimate visit is free and involves actually looking at crawlspace access, pipe material, fixture locations, and any visible problem areas — not a phone quote with ranges. You get a line-item number, not a vague estimate. Call (206) 591-1096 to schedule. First call goes to Vladislav directly — not a dispatcher.

  - q: "What does a full repipe cost in Redmond?"
    a: |
      Cost depends on square footage, story count, and how many fixtures get refreshed alongside the pipe. A single-story 1,600 sq ft rancher in 98052 with standard crawlspace access runs $7,500–$11,000 for PEX-A repipe with new angle stops and supply tubes at each fixture. A two-story, 2,400 sq ft home with a finished basement — limited crawlspace clearance, ceiling drywall needs to be opened — runs $13,000–$18,000. Material choice affects price: PEX-A (Uponor ProPEX) costs more than PEX-B but performs better in freeze-thaw conditions and has a longer field track record in the Pacific Northwest. Permit fees through the City of Redmond add $300–$600. The on-site estimate is free and produces exact, line-item pricing. Schedule at (206) 591-1096.

  - q: "Do I need a permit for plumbing work in Redmond, and who handles that?"
    a: |
      The City of Redmond issues its own building permits — not King County DPER, which handles unincorporated areas. Redmond's Building Division processes plumbing permits for water heater replacements, repipes, new drain line additions, and gas line work. Minor repairs — swapping a toilet, replacing a faucet, fixing a leaking P-trap — don't require permits. For a repipe, plan review in Redmond's current queue runs approximately 3–6 weeks, followed by a rough-in inspection mid-project and a final inspection at completion. As a WA Licensed Contractor, Vladislav handles permit applications directly through the city's online portal. Permit cost is included in the project quote — no hidden fees added after contract signing.

  - q: "Can you add a sink to a kitchen island in my Redmond home?"
    a: |
      Yes, and it's a frequent request during kitchen remodels in Redmond. The key variable is whether the kitchen sits over a crawlspace or concrete slab. Crawlspace homes allow relatively clean drain and vent line runs — new 2-inch ABS drain line, proper trap arm slope, and an air admittance valve (AAV) where a direct vent stack tie-in isn't practical. Slab floors require saw-cutting through concrete to run drain lines, which adds cost and drying time. Crawlspace island sink tie-in: $1,200–$2,500 including permit. Slab: $2,500–$5,000 depending on cut length and concrete thickness. Both require a City of Redmond permit and rough-in inspection before the countertop goes in.

  - q: "How long does plumbing work actually take once you start?"
    a: |
      Scope determines timeline. A water heater swap is one day — demo the old unit, install and strap the new one, permit inspection scheduled within the same week. A Rinnai tankless conversion with gas line reroute runs 2–3 days. A full repipe in a 2,000 sq ft two-story takes 5–7 working days: water off, PEX-A lines run through walls and attic or crawlspace, new angle stops set, fixtures reconnected, pressure test, rough-in inspection, then drywall patch before final inspection. Vladislav coordinates drywall patch within the same project — you won't be left with open walls waiting on a second contractor to show up. The deadline penalty clause is in the contract in writing. Missed schedule = Vladislav pays. That's not a sales line, it's a contractual commitment.

  - q: "Do you handle plumbing in Kirkland, Bellevue, and Sammamish as well as Redmond?"
    a: |
      Yes — King County is the core service area. Kirkland, Bellevue, Sammamish, Issaquah, Mercer Island, and Renton are all regular project locations for TopVolk. Each city runs its own permit jurisdiction: Kirkland has its own Building Department, Bellevue processes permits through Bellevue Development Services, and unincorporated King County areas like Fall City or Vashon Island go through King County DPER. The permit process and review timelines differ city to city, but the approach on every project is the same — WA Licensed Contractor on the permit, inspections pulled and scheduled, no skipping sign-off. Call (206) 591-1096 or schedule a free on-site consultation. 100+ projects completed since 2017 across King, Snohomish, Pierce, and Kitsap counties.