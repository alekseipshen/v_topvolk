title: "Redmond Plumbing — Repiping & Tankless Upgrades (98052)"

intro: |
  The neighborhoods around Education Hill and Bear Creek in 98052 saw heavy construction through the 1980s and early 90s — fast builds that regularly used polybutylene supply lines, the gray plastic pipe insurers now flag and buyers reject at closing. Marymoor Park sits a mile from homes still running that same pipe today.

  Rinnai and Navien tankless conversions are common here too, as homeowners trade out aging 40-gallon tanks and reclaim the closet space. TopVolk handles the full scope: repipe, gas line upsize, and permit pull. Vladislav Volkov, who has run every project since 2017, responds directly when you call — not a dispatcher.

localContext: |
  Zip code 98052 holds a real mix: older ranchers near downtown Redmond, 1980s colonials off Avondale Road, and post-2000 construction in Redmond Ridge (98053).

  Education Hill homes from the 1960s and early 70s sometimes still have galvanized supply lines — corroded from the inside, dropping pressure at fixtures two rooms apart from the water heater. Crawlspace moisture during Redmond's rainy season accelerates corrosion on any exposed supply runs, especially in post-and-pier foundations common to older builds in that part of the city. The wet season runs October through May, and underslab or crawlspace lines take the hardest hit year after year.

  Redmond Ridge homes are generally copper or PEX but develop pressure problems when city supply exceeds 80 psi without a pressure regulating valve at the main entry. That's a different problem than deteriorating pipe — but the symptom at the fixture looks identical.

  Two separate diagnoses. Two completely different fixes.

commonProblems:
  - title: "Polybutylene Supply Lines in 1980s-Era Redmond Homes"
    description: "Gray poly pipe — installed throughout Redmond between 1978 and 1995 — fails at the acetal fittings first. Homes on Union Hill Road and around Education Hill came up fast during that period — poly was standard issue throughout the region. Chlorine in the municipal supply attacks both the fitting material and the pipe wall itself over time. Full repipe to PEX-A is the right fix: Uponor or Viega manifold-and-branch layout, run through walls with minimal drywall damage. King County DPER typically requires a plumbing permit and rough-in inspection for a full manifold system — plan on 2-3 weeks for residential review."
  - title: "Tankless Water Heater Conversion and Gas Line Upsize"
    description: "Rinnai RU199 and Navien NPE-240A both draw 199,000 BTU at peak load — more than most existing 3/4-inch gas lines can feed without pressure drop at the burner. Converting from a tank unit in a Redmond home built before 2000 typically means running a new 1-inch gas supply line back to the meter. Puget Sound Energy territory: all gas line work requires a permit and final inspection. The upsize is often the largest single cost in a tankless conversion — factor it in early before purchasing any unit. Call (206) 591-1096 and Vladislav will walk through the gas line scope on-site, line-item pricing included, before any commitment."
  - title: "Pressure Regulator Failure on High-PSI City Supply"
    description: "City water in parts of Redmond comes in at 90-110 psi — above the 80 psi ceiling in the IRC for residential supply systems. A failing or absent PRV puts constant stress on Moen cartridges, Kohler flush valves, and the inlet solenoids in dishwashers and washing machines until something fails. Standard fix: Watts 25AUB or Zurn Wilkins 70XL, set to 60-65 psi, installed at the main entry with isolation shutoffs on both sides. The whole job runs a few hours. Most homeowners notice quieter pipes immediately."

