title: "Redmond Painting — Cedar Repaints & PNW Moisture Protection"

intro: |
  Education Hill in 98052 runs a dense stretch of cedar-sided houses built between 1988 and 2002 — most are at or past their 7-year exterior repaint window.

  Redmond's north-facing walls stay wet from October through May. That sustained moisture drives moss and mildew penetration well beyond what a pressure wash alone fixes — spores work into the wood grain and require chemical treatment before any primer goes on. Missing that step means the new coat is going over a compromised surface.

  Vladislav recently wrapped a cabinet repaint in Overlake where the homeowner had just installed Sub-Zero refrigeration. Fresh appliances next to 25-year-old builder-coat cabinets make the dated finish impossible to ignore. That job used a waterborne alkyd finish coat over shellac-based spot prime — durable enough for daily kitchen use and color-matched to the new hardware without a full cabinet tear-out.

localContext: |
  Zip 98052 covers Education Hill, Grass Lawn, Overlake, and the Willows Road corridor — mostly 1985-2000 construction with cedar shake and cedar lap siding that is well into its second or third repaint cycle. Original builder adhesion is usually gone by now. The cedar has gone through enough freeze-thaw cycles and wet seasons that any remaining factory prime has long since failed at cut ends and seams.

  Up in 98053, Redmond Ridge and Bear Creek run newer Hardie cement-board from 2005-2015 builds. Different substrate, same annual rainfall.

  The recoat schedule to stay ahead of moisture infiltration near Marymoor Park and east toward Bear Creek Trail is roughly every 7-8 years. Hardie jobs require 100% acrylic finish per manufacturer spec — latex shortcuts void the warranty and fail faster in PNW humidity.

commonProblems:
  - title: "Cedar Tannin Bleed and Peeling on North-Facing Elevations"
    description: |
      Cedar shake on Education Hill and Grass Lawn takes the hardest rain exposure on north and west walls. Oil-based primer applied before any finish coat is non-negotiable on bare cedar — it seals tannin bleed that pushes straight through latex applied directly.

      Skipping primer means peeling within two seasons. Back-priming cut cedar ends is standard practice on any repaint. Where a previous crew skipped it, the evidence shows up immediately on the next job — lifting paint at trim joints, bubbling around window headers, and dark streaks at lap seams where tannin pushed through.

      Spot-treating active moss with a biocidal wash before any surface prep is equally important. Painting over live moss does not kill it.

  - title: "Cabinet Refinishing After Kitchen Upgrades — Thermador and Sub-Zero Kitchens"
    description: |
      Redmond kitchens frequently get Thermador ranges or Sub-Zero refrigerators installed alongside original 1990s cabinet boxes. The visual mismatch is sharp.

      Cabinet repainting involves full degreasing with TSP substitute, light sanding, shellac-based spot prime on any raw wood or previous silicone contamination, and a waterborne alkyd finish coat durable enough for daily kitchen use. Full cabinet replacement runs $15K-$40K+. A professional repaint solves the same visual problem for a fraction of that — and keeps the existing box layout intact when the carcasses are still structurally sound. Call (206) 591-1096 to get a line-item quote from Vladislav directly.

  - title: "EPA RRP Compliance in Pre-1978 Homes Near Old Redmond Road"
    description: |
      Redmond lacks the density of pre-1978 housing found in Capitol Hill or Ballard, but the older blocks near Old Redmond Road and the downtown core have 1960s ranchers that predate the federal lead paint ban.

      EPA RRP (Renovation, Repair, and Painting) regulations require certified contractors whenever lead-based surfaces are disturbed beyond 6 sq ft interior or 20 sq ft exterior. An XRF analyzer test before surface prep determines whether full containment protocol applies. Skipping that step on a pre-1978 job is not a technicality — it carries federal contractor liability.

faq:
  - q: "How fast can you get to Redmond for a painting estimate?"
    a: "Vladislav works the Eastside regularly — 98052 and 98053 are quick drives from active project areas in Kirkland and Bellevue. Education Hill, Overlake, and the Marymoor Park corridor are familiar territory. Call (206) 591-1096 to schedule a free on-site estimate; same-week availability is typical for Redmond addresses."
  - q: "What exterior paint products do you use on cedar and Hardie siding?"
    a: "Sherwin-Williams Duration and Benjamin Moore Aura are the standard two-coat acrylic lines for PNW conditions — both resist tannin bleed and moss when correctly primed. Farrow & Ball is available for color-specific interior and cabinet work. Hardie cement-board manufacturer specs require 100% acrylic finish; that requirement is matched on every Redmond Ridge job."
  - q: "What does exterior repainting cost for a typical Redmond house?"
    a: "A single-story cedar-sided Education Hill home typically runs $4,500-$7,500 for full exterior work — power wash, spot repairs, prime coat, and two finish coats included. Two-story homes and complex rooflines go higher. Pricing is written line-item into the contract before any work begins, and a deadline penalty clause is standard — not a verbal promise. Call (206) 591-1096. Vladislav quotes the job himself, WA Licensed Contractor, 100+ projects completed since 2017."