title: "Burlington ADU Construction — Flood Zone Ready"

answer: "TopVolk Construction builds permitted DADUs and AADUs in Burlington, WA — flood-zone foundation know-how, 100+ projects completed since 2017."

intro: |
  FEMA's flood insurance rate map puts a good chunk of Burlington inside the Skagit River's Zone AE, and that one line item changes how a detached ADU gets built here — not whether it gets built. TopVolk Construction designs and permits DADUs, AADUs, and basement conversions across Skagit County, with owner Vladislav Volkov running the job directly instead of a sales team. A homeowner near Cascade Meadows called us last spring wanting a rental unit over her garage; the lot sat below base flood elevation, so the plan shifted to a raised slab with engineered flood vents, PT lumber below that line, and a Mitsubishi mini-split for heat since there wasn't room for ductwork. Closer to downtown, off the historic grid near Skagit River Park, older parcels come with septic questions and shared water lines that need checking before any DADU gets a utility stub-out. WA HB 1337 now allows up to two ADUs on most single-family lots statewide, and calls to our office picked up once that became common knowledge. Call (206) 591-1096 before you draw anything.

localContext: |
  Most of Burlington's housing sits in 98233, though a handful of edge lots toward Bow spill into 98232 and fall under Skagit County Planning & Development Services instead of the City of Burlington's own building department — two different plan review queues for what looks like the same neighborhood. Cascade Meadows and the newer subdivisions off Peterson Road are mostly 1990s-2000s tract homes with attached two-car garages, roof framing already sized for a second floor, which is why an AADU over the garage pencils out cheaper there than a ground-up unit. Closer to the historic downtown grid and Skagit River Park, older post-war ranches sit on pier-and-beam or shallow slab foundations, many built before the county's current flood damage prevention ordinance existed. That matters for a DADU: anything in the mapped floodway needs its lowest floor above base flood elevation, which usually means a raised slab, flood vents, and PT lumber for framing below that line. Snowmelt runoff off the Skagit River, not roof load, is the bigger factor when we size footings out here.

commonProblems:
  - title: "Building a DADU on a Lot Inside the Skagit River's Flood Zone"
    description: "FEMA's flood map puts a lot of parcels near Skagit River Park and the lower end of town inside Zone AE, which changes the foundation before we ever talk finishes. Skagit County's flood damage prevention ordinance requires the lowest floor of a new DADU to sit above base flood elevation, usually meaning a raised slab or a crawlspace fitted with Smart Vent engineered flood vents instead of a standard perimeter wall. Framing below that line needs to be PT lumber, and any rim joist or ledger board tying into the existing house needs hardware rated for wet use. An elevation certificate from a surveyor typically adds $1,200-$2,000 and 1-2 weeks to plan review, but skipping it gets the permit kicked back by the AHJ. Budget $8K-$15K over a standard foundation for the flood-compliant package."
  - title: "DADU, AADU, or Garage Conversion — Picking the Right Structure"
    description: "Cascade Meadows homes built in the 1990s and 2000s usually have attached two-car garages with roof trusses already sized to carry a second floor, making an AADU over the garage the cheaper path — no new footprint, no new septic or utility trench. Older ranches near downtown often sit on lots too narrow for a detached unit once the required setback is applied, so a basement conversion or garage-to-AADU swap is the realistic option. Converting a garage means pulling the door header and replacing it with an LVL beam sized for the new wall load, sistering existing floor joists where plumbing crosses, and adding joist hangers at every new connection. A Whirlpool stackable washer/dryer and a two-burner induction cooktop fit the tight kitchenette footprint better than full-size appliances. Garage conversions run $65K-$95K; a ground-up DADU runs higher."
  - title: "Getting the Permit Right — City of Burlington vs Skagit County PDS"
    description: "Parcels inside Burlington's city limits go through the City of Burlington building department; a few lots on the edges, especially toward Bow and the 98232 boundary, fall under Skagit County Planning & Development Services instead, and the two offices don't review plans the same way. WA HB 1337 requires both jurisdictions to allow up to two ADUs per single-family lot as of right, but local height limits (24 feet for a DADU), lot coverage, and FAR still get checked, and a design review comment can add two to three weeks. TopVolk handles the plan set, files the utility separation application if you want a standalone water/sewer connection instead of a shared line, and schedules rough-in and final inspection directly with the AHJ. As a WA Licensed Contractor, Vladislav pulls the permit himself rather than handing it to an expediter. Plan review typically runs 6-10 weeks depending on which office has the file."
  - title: "What a Burlington ADU Actually Costs, and Why the Range Is Wide"
    description: "A detached ADU here typically lands between $140K and $220K, and a garage or basement conversion runs $65K-$110K — the spread comes from foundation type, utility separation, and finish level more than square footage. Flood zone lots add the foundation premium described above; lots that already have a spare water meter or a sewer stub near the property line save real money on trenching. Finish choices swing the number too: semi-custom cabinets and quartz counters cost more than IKEA cabinets and laminate, and a Rinnai tankless water heater paired with a Mitsubishi mini-split adds a few thousand over baseboard heat but cuts the utility bill a renter would otherwise complain about. Every TopVolk quote is line-item, not a range, and the contract includes a deadline penalty — miss the date, and the homeowner gets paid for it."
  - title: "Keeping a New ADU Dry Through Skagit Valley Winters"
    description: "Skagit Valley doesn't get Seattle's rain totals, but river fog and freeze-thaw swings across the valley floor in January still find any gap in the envelope. We spec Hardie cement-board siding over cedar on new DADUs because it doesn't need repainting every few years and it shrugs off the moss that collects on a north wall behind a garage. R-49 insulation in the attic and a continuous vapor barrier in the crawlspace keep the mini-split from fighting condensation, and CertainTeed underlayment handles wind-driven rain off the river valley. Expect 20+ years out of the siding and roofing before anything needs attention; a Mitsubishi mini-split compressor typically runs 12-15 years before a refrigerant-side service is worth considering. Workmanship carries its own warranty, separate from manufacturer coverage on the mini-split, water heater, and appliances."

faq:
  - q: "How fast can you get to Burlington for ADU Construction?"
    a: "Burlington sits about 65 miles north of Seattle off I-5 exit 227-230, roughly a 70-minute drive from our usual King County jobs and less from a Snohomish County site. We schedule the initial site walk within a week of your call, and there's no charge for it — Vladislav does the walkthrough himself, not a salesperson. Parking and equipment access on most Burlington lots is easy since it's a smaller town; permit review, not access, is usually the real timeline factor. Call (206) 591-1096 to get on the schedule."
  - q: "What does a detached ADU cost to build in Burlington?"
    a: "Ground-up DADUs in Burlington run $140K-$220K depending on foundation type, size, and whether the lot needs a new utility trench or already has a stub. Flood zone lots near Skagit River Park cost more upfront because of the raised foundation and Smart Vent flood venting, but that's disclosed in the quote, not buried in a change order later. A garage-to-AADU conversion is cheaper, usually $65K-$95K, since the roof and slab already exist. We give a free on-site estimate with real line-item pricing — labor, materials, permit fees — not a ballpark range."
  - q: "Do I need a City of Burlington permit or a Skagit County permit for my ADU?"
    a: "It depends on whether your parcel sits inside Burlington's city limits or in the unincorporated pocket near the 98232 boundary toward Bow — the city building department handles one, Skagit County Planning & Development Services handles the other, and the applications aren't identical. Both allow up to two ADUs per lot under WA HB 1337, but setback, the 24-foot height limit, and lot coverage still get checked in plan review. TopVolk pulls the permit as your WA Licensed Contractor and handles rough-in and final inspection scheduling. Plan review generally takes 6-10 weeks; full construction after that runs another 4-6 months for a detached unit."
  - q: "Do I need a separate water meter and sewer connection for my DADU?"
    a: "Not always — Burlington and Skagit County both allow a shared service line from the main house to the ADU if the existing meter and sewer lateral have capacity, which we check during design. A standalone connection costs more upfront but makes the unit easier to rent or sell as a separate legal unit later, since utility billing is cleaner. Either way the ADU needs its own shutoff valve and, for a gas appliance like a Rinnai tankless water heater, its own gas line sizing calculation. We lay out both options with real numbers before you decide."
  - q: "How long will my ADU hold up in Skagit Valley weather?"
    a: "Hardie siding and CertainTeed roofing on a Burlington DADU typically go 20+ years before they need real attention, well beyond the river valley's freeze-thaw swings and winter fog. The Mitsubishi mini-split compressor is rated for 12-15 years of regular use, and a Rinnai tankless unit usually outlasts a standard tank heater by a decade if it's flushed annually. Workmanship on the structure is warrantied separately from manufacturer coverage on appliances and mechanical equipment. Every contract also has a deadline penalty built in, so the completion date isn't just a verbal promise."
  - q: "Do you build ADUs outside Burlington, like Mount Vernon or Sedro-Woolley?"
    a: "Yes — we take ADU projects throughout Skagit County, including Mount Vernon, Sedro-Woolley, and Anacortes, alongside our regular work in King, Snohomish, Pierce, and Kitsap counties. Scheduling for a Skagit County project usually means grouping site visits so the drive up from Seattle makes sense, so book a consultation a week or two ahead if you can. We've completed 100+ projects since 2017, all owner-led with Vladislav on-site rather than a rotating crew. Call (206) 591-1096 to check the current schedule."