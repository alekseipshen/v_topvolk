title: "Burlington Bathroom Remodel — Skagit Valley Fixes"

answer: "Vladislav Volkov of TopVolk Construction remodels Burlington, WA bathrooms in 3-6 weeks, with penalties for missed deadlines in the contract."

intro: |
  Full bathroom remodels in this part of Skagit County usually run three to six weeks from demo to final inspection, with most jobs landing between $16,000 and $32,000 depending on whether the crawlspace holds any surprises. Vladislav Volkov, who owns and runs TopVolk Construction, has crawled under enough Old Town Burlington houses to know the ugly vanity is rarely the real problem — it's the galvanized supply line behind it, or the black mold growing where a fan vents into the attic instead of outside. Skagit County's housing stock skews older than people expect for a town this size. Ranch homes near Maiben Park and tract houses off Peterson Road still carry the same fiberglass tub-shower units and builder-grade Moen valves they shipped with back in the 1980s. Sitting in a river valley between the Skagit and the Cascade foothills doesn't help; bathrooms here stay damp longer than they should from October through May. This page covers what actually breaks in Burlington bathrooms, what it costs to fix, and how permitting works depending on which side of the city line your house sits.

localContext: |
  Burlington's zip code, 98233, stretches from the older mill-town grid of Old Town Burlington — plenty of 1940s-60s bungalows and post-war cottages — out to the builder subdivisions that went up east of I-5 near the Cascade Mall corridor through the 1990s and 2000s. Head a few miles out toward Bow, and you're often looking at a 98232 mailing address and a completely different permit desk: Skagit County Planning & Development Services instead of Burlington's own Building Department. A good chunk of the 1970s-80s ranch and split-level houses scattered around the Gages Slough area still vent bathroom fans straight into the attic rather than through a roof cap, which is fine until a wet Skagit Valley winter shows up and the sheathing starts to rot. Some of the older homes closer to the river still run on cast-iron drain stacks that have been quietly rusting from the inside for sixty-plus years. Any remodel that touches plumbing or moves a wall needs a permit pulled before the first swing of a demo hammer, whether that's through the city or the county.

commonProblems:
  - title: "1980s-90s Tract Bathrooms With Fiberglass Surrounds and Worn-Out Valves"
    description: "Plenty of the tract homes built through the 1980s and 90s east of I-5, near the Cascade Mall corridor and along Peterson Road, still have their original one-piece fiberglass tub-shower unit and a Formica vanity top with a chipped laminate edge. The Moen single-handle cartridge behind the tile has usually seized up from mineral buildup by now, and the shutoff valves under the sink are the old multi-turn type that don't fully close anymore. We tear the fiberglass unit out completely, frame in a proper curb, and set large-format porcelain tile over a Schluter Kerdi waterproofing system instead of just re-caulking around old cracks. A new pressure-balance valve and a semi-custom vanity with a quartz top usually round it out. This kind of job runs $14,000 to $22,000 and takes three to four weeks."
  - title: "Moisture Damage From Skagit Valley's Wet Winters"
    description: "A lot of bathrooms in this area were tiled straight over green board instead of cement board or a proper liquid membrane, which was common practice decades ago but doesn't hold up to seven months of PNW humidity a year. Once water gets behind the tile, it usually finds the subfloor around the toilet flange first, and by the time anyone notices a soft spot, the plywood underneath is already delaminating. We pull the tile back to the studs, install RedGard or Schluter Kerdi over cement board, and replace any rotten subfloor with DriCore or fresh treated plywood before setting new tile. Catching it early adds maybe $1,500 to $3,000 to a remodel; ignoring it usually means replacing floor joists too, which adds weeks, not days."
  - title: "Reconfiguring a Cramped 5x7 Layout for a Walk-In Shower"
    description: "Most original bathrooms in Burlington's older homes were built to a tight 5x7 footprint with a tub against the wall and barely enough room to bend over the sink. Converting that tub to a curbless or low-curb walk-in shower usually means relocating the drain, which means opening the floor and, in a lot of the Old Town Craftsman-style bungalows, dealing with a cast-iron drain stack that needs to be cut out and rerouted in PVC. Any job that moves plumbing or reworks a load-bearing wall needs a permit from the City of Burlington Building Department, or Skagit County PDS if the address falls outside city limits. Plan review typically takes one to three weeks for a straightforward bathroom, and TopVolk pulls the permit and handles the inspection scheduling directly — no runaround."
  - title: "What Actually Drives the Cost of a Bathroom Remodel Here"
    description: "Most full bathroom remodels in Burlington land between $16,000 and $32,000, and the spread comes down to a handful of things: whether the layout is staying put or the shower is moving, whether the subfloor is sound or needs replacing, and whether fixtures are mid-range (Kohler, Delta) or higher-end. A simple tile-and-vanity refresh on a bathroom with no hidden damage can come in under $15,000. A full gut with a curbless shower, new plumbing runs, and a heated floor pushes past $30,000 fast. TopVolk Construction gives a line-item quote after an on-site walkthrough with Vladislav Volkov directly — not a range pulled from a phone call — and the contract includes a penalty clause if the finish date slips past what's agreed. Call (206) 591-1096 for a free estimate."
  - title: "Bathroom Fans Vented Into the Attic Instead of Outside"
    description: "A surprising number of bathrooms around Gages Slough and the older parts of town have an exhaust fan that dumps humid air straight into the attic space instead of running it out through a roof cap or wall vent. That moisture condenses on the underside of the roof deck, and within a few winters you've got mold regrowth and soft sheathing that nobody sees until a re-roof crew finds it. We size a new fan — usually a Broan or Panasonic WhisperFan rated for the room's square footage — and run rigid or insulated flex duct straight outside. In bigger primary baths, a Mitsubishi mini-split or an in-line dehumidifying fan keeps humidity down year-round. A proper vent reroute runs $400 to $900 and typically gets done as part of the larger remodel, not as a separate trip."

faq:
  - q: "How fast can you get to Burlington for a bathroom remodel?"
    a: "Burlington sits right off I-5, about an hour north of Seattle and twenty minutes south of Bellingham, so getting a contractor out for a walkthrough isn't the hard part — scheduling the actual remodel is. Vladislav Volkov typically has a free consultation on the calendar within a week of the first call, and once a contract's signed, most bathroom jobs start within two to four weeks depending on material lead times on things like tile and vanities. Parking in most Burlington neighborhoods is easy enough for a truck and trailer; older Old Town streets sometimes need a quick heads-up to neighbors. Call (206) 591-1096 to get a date on the calendar."
  - q: "What does a bathroom remodel cost in Burlington?"
    a: "Most full remodels run $16,000 to $32,000 depending on whether the layout changes, whether the subfloor needs replacing, and the fixture tier — Kohler and Delta mid-range versus higher-end brands. A tile-and-fixture refresh with no structural changes can land under $15,000; a full gut with a curbless shower and new plumbing runs higher. TopVolk Construction gives a line-item quote after Vladislav walks the space himself, not a phone estimate. Ask for the itemized breakdown up front — it should list demo, rough-in, tile, fixtures, and labor separately, not one lump number."
  - q: "Do I need a permit to remodel my bathroom in Burlington?"
    a: "Anything that moves plumbing, relocates a wall, or changes the electrical usually needs a permit — a cosmetic swap of a vanity and toilet generally doesn't. Inside city limits, that permit goes through the City of Burlington Building Department; just outside city limits toward Bow or Alger, it's Skagit County Planning & Development Services instead, and the paperwork looks a little different. Plan review on a straightforward bathroom typically takes one to three weeks. TopVolk Construction is a WA Licensed Contractor and pulls the permit, schedules the rough-in and final inspections, and handles the AHJ paperwork directly so the homeowner isn't the one on hold with the county."
  - q: "Curbless shower or a standard curb — which one actually works better here?"
    a: "A curbless shower looks cleaner and is easier to access as homeowners age, but it needs the floor framing dropped or built up around the drain, which adds a few days of extra framing work compared to a standard 2-inch curb. We waterproof either option the same way, with a Schluter Kerdi membrane and a bonding flange at the drain, plus a sloped mortar bed so water actually runs where it's supposed to. For a straight-up tub-to-shower swap with no framing changes, a low-curb shower with a bench and a niche is usually the more budget-friendly call. Either way, large-format porcelain holds up better long-term than mosaic tile with lots of grout lines."
  - q: "How long does the waterproofing actually last in this climate?"
    a: "A properly installed Schluter Kerdi or RedGard membrane system should outlast the tile itself — twenty-plus years is normal as long as grout lines get resealed every couple of years and nobody drills into the wall for a towel bar without checking first. The bigger risk in Skagit County isn't the membrane failing, it's an old bathroom that never had one to begin with. Ventilation matters just as much as the membrane; an undersized or poorly vented fan will grow mold on grout and paint long before any waterproofing gives out. TopVolk backs workmanship on new installations, and fixtures carry their own manufacturer warranty — Kohler and Delta typically cover their valves and cartridges for the life of the product."
  - q: "Do you work outside Burlington too?"
    a: "TopVolk Construction covers the Seattle Metro counties along with Skagit County jobs like this one, so Mount Vernon, Sedro-Woolley, Anacortes, and Bow are all within reach without adding a big travel fee. Vladislav Volkov runs every job himself — there's no sales rep handing it off to a random crew once the contract's signed. Scheduling usually has a one to three week window before demo starts, tighter in the slower winter months. Since 2023, TopVolk has completed more than 100 projects across the region, most of them full bathroom or kitchen remodels rather than small repairs. Call (206) 591-1096 or ask for a free on-site consultation to get on the schedule."