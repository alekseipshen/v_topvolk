  - q: "Do I need a permit or HOA approval for power washing in Burlington?"
    a: "Washing itself doesn't require a City of Burlington permit — it's maintenance, not construction. If the job turns up rotten trim or siding that needs replacing before repaint, that work would need permit review through the city's Community Development department, and we flag that during the walkthrough, not after we've started. Some subdivisions near Skagit Meadows have HOA rules requiring exterior surfaces washed before repaint approval goes through the architectural committee — we can provide a receipt showing the work was done if your HOA asks for one."
  - q: "Will pressure washing damage my Hardie siding or cedar deck?"
    a: "Not if it's done right — we run a low-pressure soft-wash (under 600 PSI on siding) with a surfactant cleaner rather than blasting straight water, which is what actually causes damage by forcing moisture behind panels or splintering cedar grain. Fiber-cement siding and cedar decking both hold up fine to a properly mixed chemical wash. We adjust pressure and chemical ratio by surface — a Trex composite deck gets treated differently than raw cedar boards next to it."
  - q: "How long will surfaces stay moss-free after washing in this climate?"
    a: "Given Skagit Valley's roughly 35+ inches of rain a year, most roofs and north-facing siding start showing new moss growth in 12-18 months without a preventative treatment applied at the same visit. Decks and fences that get a fresh stain or sealer after washing hold up closer to the full 3-5 year cycle before needing another wash. We don't warranty against moss regrowth since that's a climate reality, not a workmanship issue, but the wash itself is guaranteed against surface damage."
