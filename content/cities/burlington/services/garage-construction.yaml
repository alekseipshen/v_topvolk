title: "Burlington Garage Construction — DADU & EV-Ready Builds"

answer: "TopVolk Construction builds detached, attached, and DADU garages in Burlington, Washington — WA Licensed Contractor, 100+ projects since 2023, line-item quotes."

intro: |
  Detached garage builds, attached-garage-to-living-space conversions, and garage-top DADUs in Burlington get designed, permitted, and built by TopVolk Construction, owner-led by Vladislav Volkov, usually in 8 to 14 weeks once the City of Burlington Building Department clears plan review. Skagit Valley floods the low ground near the river most winters, and a lot of homeowners around Maiben Park and the Old Town grid are finally pouring a real footing under a garage that's been sitting on cracked cinder blocks since the 1960s. One recent job off Gardner Road pulled a rotted hemlock header, replaced it with an LVL beam, and set a Clopay insulated garage door with a LiftMaster opener wired for a future EV charger circuit. Another, closer to Cascade Mall, converted a single-car attached garage into a mother-in-law suite with a Mitsubishi mini-split and Hardie siding to match the existing lap siding. Every quote is line-item, and missed deadlines carry a penalty written into the contract — not a verbal promise.

localContext: |
  Burlington sits mostly in zip 98233, with rural pockets near Bow and Edison spilling into 98232 and homeowners on the south edge sometimes sharing service with 98273 in Mount Vernon. Housing runs old-to-new fast here: Old Town Burlington has farmhouses and bungalows from the 1900s-1920s with post-and-pier foundations and undersized detached sheds, while the tract developments off Rio Vista and near North Burlington were built mostly in the 1970s-80s with attached single-car garages that feel tiny by today's standards. Newer construction near Sunset Avenue and the I-5 interchange skews 2000s-and-up, already IRC-compliant but often missing R-49 attic insulation in the garage itself if it was left unfinished. Skagit River floodplain mapping affects a chunk of the city, so foundation elevation and vapor barrier detailing at the slab matter more here than in most Skagit County towns. Permits for anything inside city limits go through the City of Burlington Building Department; a few rural parcels toward Edison fall under Skagit County PDS instead, and that changes the setback math and sometimes the FAR calculation for a DADU.

commonProblems:
  - title: "Detached garage with a DADU above, and the WA HB 1337 math"
    description: "Since WA HB 1337 took effect, a lot of Burlington lots can legally support a DADU over a detached garage, but the framing has to carry it — that means an LVL beam or PSL post at the garage bay openings instead of a standard header, plus a real stair with code headroom. Height limit tops out around 24 feet, and setback plus lot coverage still has to clear City of Burlington review before framing starts. We've seen homeowners near Gages Slough get a plan set rejected twice because the original garage footprint left no room for the required side setback once the second story got added. Budget an extra 3-4 weeks of design time to get the footing and shear wall schedule right the first time."
  - title: "Attached garage conversion turning into a moisture problem"
    description: "Converting an attached garage into living space means the old slab-on-grade almost never has a vapor barrier under it, and skipping that step shows up later as musty carpet or a warped DriCore subfloor. The fix is cutting to the rim joist line, adding a proper 6-mil vapor barrier or RedGard membrane at wet areas, and bringing insulation up to R-49 in the ceiling if it's tying into conditioned space. On a recent conversion near Maiben Park, the original galvanized water line feeding an old utility sink also had to be re-routed before drywall could go up. Plan on $18,000-$35,000 for a full conversion with a Mitsubishi mini-split added for heat, depending on plumbing and electrical scope."
  - title: "Setback surveys and permit delays through the Building Department"
    description: "Burlington's Building Department wants a site plan with setbacks called out before they'll even start plan review, and a garage built too close to a property line — common on the older Old Town lots — gets flagged immediately. Rural parcels toward Bow or Edison instead route through Skagit County PDS, which uses a different FAR and lot coverage formula and can add 2-3 weeks to the timeline. TopVolk pulls the survey and submits the full plan set as a WA Licensed Contractor, so there's no back-and-forth between a homeowner and the counter staff. Rough-in and final inspections get scheduled directly once footing inspection passes, keeping a standard detached garage on an 8-10 week track from permit issuance to close-in."
  - title: "What actually drives the price of a garage build in Burlington"
    description: "A basic detached two-car garage runs $45,000-$70,000, but a garage-top DADU with a kitchen and bath pushes that to $110,000-$180,000 once you add a separate utility connection, plumbing, and finish work. Matching the existing roofline and Hardie siding color on an older Old Town house often costs more than the framing itself, since factory-matched siding isn't always in stock locally. EV charger pre-wire for a 50A or 60A circuit adds a few hundred dollars now versus a full panel upgrade and trenching later. Every TopVolk quote breaks out labor, materials, and permit fees line by line, and the contract includes a penalty clause if the finish date slips — not just a verbal target."
  - title: "Slab cracking, garage door failure, and what actually needs replacing"
    description: "A garage slab poured under 4 inches thick, or without fiber-reinforced mix, tends to crack within a few winters once freeze-thaw cycling hits the foothills toward Sedro-Woolley and moisture wicks up from Skagit Valley's high water table. Our standard spec is a 4-inch fiber-reinforced slab over compacted base with proper drainage away from the door threshold. On the door side, a non-insulated garage door and worn weatherstripping let damp air into a workshop fast, fogging up tools and rusting a Bosch table saw within a season — swapping to a Clopay insulated door with new weatherstripping usually solves it for under $2,000. Expect 20+ years out of a properly poured slab and 15-20 years from a quality insulated door before hardware wears out."

