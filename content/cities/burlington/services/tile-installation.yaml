title: "Burlington WA Tile Installation — Schluter Systems Done Right"

answer: "TopVolk Construction installs and repairs tile floors, showers, and backsplashes in Burlington, Washington — owner-led by Vladislav Volkov, 100+ projects since 2023, WA Licensed Contractor."

intro: |
  Cracked grout lines running straight down a shower wall, six months after a bargain install, almost always trace back to one thing: no cement backer board or Schluter Kerdi membrane under the thinset, just drywall soaking up moisture behind the tile. That failure shows up constantly in Burlington, where Skagit River humidity and older housing stock don't leave much room for shortcuts. TopVolk Construction handles tile work — showers, kitchen backsplashes, heated bathroom floors — for homeowners from the neighborhoods off Burlington Blvd near the Fashion Outlets of Skagit Valley to the older streets closer to Little Mountain Park. Vladislav Volkov runs every job himself, from the first measurement to the final grout line, so there's no sales rep translating your scope to a crew you never meet. A recent job near Maiben Street replaced a failed fiberglass shower pan with a Schluter Kerdi-Board niche and curb, tied into a KOHLER drain — the kind of detail that separates a shower that lasts 20 years from one that leaks into the subfloor by year three.

localContext: |
  Burlington's housing stock in 98233 runs the gamut — 1970s-80s ranch homes near George Hopper Road, newer construction closer to I-5 and the outlet corridor, and a fair number of manufactured and mobile homes scattered through the older parts of town and out toward Bow in 98232. That mix matters for tile work because subfloor construction varies a lot: older ranches often have single-layer plywood subfloors that flex under large-format porcelain unless you add a layer of cement board or an uncoupling membrane first. Skagit County sits in a flood-prone river valley, and crawlspace moisture is a real factor in homes near the Skagit River corridor — vapor barriers and proper substrate prep aren't optional here. Burlington doesn't require a separate tile permit for a straightforward reface, but any shower remodel involving plumbing relocation or electrical work for a heated floor typically needs a permit through the city's building department. Homes built before the mid-90s also tend to have narrower bathrooms, which pushes a lot of clients toward curbless shower designs to make the space feel bigger.

commonProblems:
  - title: "Shower walls that leak behind the tile within a few years"
    description: "Most of these calls trace back to a shower built with green board or standard drywall instead of a proper waterproofing membrane. Water gets through the grout — it always does eventually — and without Schluter Kerdi or RedGard behind the tile, it soaks the framing and shows up as soft drywall or a moldy smell in the closet on the other side. The fix is a full tear-out down to the studs, then Kerdi membrane on the walls, a Kerdi-Board niche and bench, and a proper pre-sloped shower pan. On a standard 5x8 bathroom that's typically a 5-7 day job, and it runs $8,000-$14,000 depending on tile selection and whether we're moving the drain."
  - title: "Large-format porcelain that cracks or lips at the seams"
    description: "24x48 and 32x32 porcelain tile looks great, but it's unforgiving of an uneven substrate — even a 1/8 inch dip telegraphs as a cracked corner or a lippage ridge you can catch a sock on. This shows up a lot in older Burlington ranch homes where the subfloor has settled unevenly over 40-plus years. The fix is a self-leveling underlayment poured over the subfloor before setting tile, plus large-format-rated thinset and proper trowel notching to avoid voids under the tile. Skipping the leveling step is the single most common corner-cutting move we see in prior work, and it's why a floor that looked fine at install starts cracking within a year."
  - title: "Heated floor systems installed without a permit or proper thermostat wiring"
    description: "A Schluter Ditra-Heat or Warmup system under bathroom tile is a nice upgrade for Burlington's cold, damp winters, but the electrical circuit for it needs to be pulled and inspected — it's not just a plug-in accessory. We've been called into homes where a prior installer ran the heating cable on a shared circuit with no GFCI protection, which is both a code violation and a fire risk. Our process includes pulling the permit through the city, scheduling the rough-in inspection before tile goes down, and using a programmable thermostat with a floor sensor so the system doesn't run 24/7. As a WA Licensed Contractor, we handle that paperwork so it's not on the homeowner to track down."
  - title: "Tile quotes that balloon once demo starts"
    description: "A lot of Burlington homeowners get a verbal 'per square foot' number that doesn't survive contact with the actual job. Costs swing based on substrate condition, whether backer board or a mud bed is needed, tile size and material (large-format porcelain runs more labor than 12x12 due to leveling and handling), and any plumbing or electrical relocation for a backsplash or shower. A mid-size bathroom retile typically runs $6,500-$12,000; a kitchen backsplash with outlet relocation lands around $2,000-$4,500. TopVolk gives line-item written quotes before demo starts, and missed deadlines carry a penalty built into the contract — that's not a verbal promise, it's in writing."
  - title: "Grout and natural stone that stain or pit within a couple years"
    description: "Marble and travertine look sharp in a kitchen backsplash, but they're porous, and Skagit Valley's humid winters mean unsealed stone picks up water stains and etching from acidic spills fast. Sanded grout in a shower floor also breaks down over time if it wasn't sealed on a regular schedule. We recommend a penetrating sealer reapplied every 12-18 months on natural stone, and for showers, an epoxy grout like Schluter's system that doesn't need sealing at all. Expect 15-20 years out of a properly installed and maintained tile shower before a refresh is worth considering — most of what fails early is the substrate, not the tile itself."

faq:
  - q: "How fast can you get to Burlington for Tile Installation?"
    a: "Burlington sits right off I-5, so it's an easy trip from our Skagit and Snohomish County job sites — most consultations get scheduled within a few days of your call. Vladislav does the site visit himself, measures the space, and talks through tile options and substrate condition on the spot. A standard bathroom retile usually runs 5-7 working days once materials are in; a kitchen backsplash is often a 2-3 day job. Call (206) 591-1096 to get on the schedule."
  - q: "What does a shower tile installation in Burlington cost?"
    a: "A full shower retile with new waterproofing typically runs $8,000-$14,000, depending on tile size, whether we're relocating the drain, and whether you want a niche, bench, or curbless entry. A simple backsplash refresh runs closer to $1,800-$3,500. Pricing shifts with tile material — large-format porcelain and natural stone cost more in labor than standard ceramic. We give a written, line-item quote after the on-site walkthrough, not a phone estimate — call (206) 591-1096 for a free consultation."
  - q: "Do I need a permit for tile work in Burlington?"
    a: "A straightforward tile reface — swapping old tile for new on an existing shower pan or floor — usually doesn't require a permit in Burlington. Anything involving plumbing relocation, a new shower pan, or electrical work for a heated floor system does need a permit through the city's building department, with rough-in and final inspections along the way. TopVolk pulls those permits as part of the job as a WA Licensed Contractor, so the paperwork isn't left to the homeowner."
  - q: "What waterproofing system do you use for showers?"
    a: "For most Burlington showers we use the Schluter Kerdi system — Kerdi membrane on the walls, Kerdi-Board for niches and benches, and a Kerdi-Line linear drain or pre-sloped pan depending on the layout. It's a fully bonded, sheet-applied membrane rather than a liquid-applied coating, which gives more consistent coverage in corners and around the drain. For budget-conscious jobs we'll sometimes spec RedGard as a liquid membrane alternative, but Kerdi is our default for anything getting daily use."
  - q: "How long does tile installation last in this climate?"
    a: "A properly waterproofed and installed tile shower typically lasts 15-20 years before it needs more than routine grout maintenance, even with Skagit Valley's damp winters. Floor tile in kitchens and entries can outlast that if the substrate stays stable. What actually fails early is almost always the substrate or waterproofing, not the tile itself — that's why we don't cut corners on backer board or membrane prep. We stand behind our installation work, and any warranty terms are spelled out in the written contract before work starts."
  - q: "Do you cover areas near Burlington?"
    a: "Yes — alongside Burlington, we regularly work in Mount Vernon, Sedro-Woolley, and other Skagit County towns, plus our broader King, Snohomish, Pierce, and Kitsap County service area. Scheduling windows run a few days to a couple weeks out depending on season, and Vladislav handles every consultation and quote personally. Call (206) 591-1096 or ask about a free on-site consultation to get your project on the calendar."