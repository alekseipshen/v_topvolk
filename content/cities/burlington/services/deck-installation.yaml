title: "Burlington Deck Installation — Built to Skagit Codes"

answer: "TopVolk Construction builds permitted decks in Burlington, WA — footings to frost depth, code-height guardrails, cedar or Trex decking installed."

intro: |
  Ask any framer around Skagit County why a deck built on sandy river-bottom soil near the Skagit needs deeper footings than one up on Little Mountain, and you will get a straight answer about frost line and bearing capacity. TopVolk Construction builds permitted, code-compliant decks in Burlington, Washington — post footings dug below frost depth, guardrails set to code height, and decking material matched to the site, whether that is cedar, Trex, or TimberTech. A homeowner off Peterson Road recently swapped a rotted cedar deck for Trex Transcend after three seasons of scrubbing moss off the north-facing boards near the Gages Slough Trail. Another job near the Outlet Shoppes at Burlington needed a second-story deck rebuilt with proper drainage after water tracked back into the daylight basement below. Vladislav Volkov runs every project himself, from the first site visit through the final inspection, with a deadline penalty written into the contract.

localContext: |
  Burlington sits at the junction of I-5 and State Route 20, and that hub location shows up in the housing stock too — older farmhouses on acreage toward Bow and Alger (98232), 1960s and 70s ranch homes off Peterson Road and near Cascade Mall, and newer subdivisions built out through the 98233 zip since the 1990s growth years. Decks on the older ranch lots usually sit on undersized 4x4 posts with no proper footing at all, which does not pass a City of Burlington building inspection today. Anything within the Skagit River floodplain near downtown or the Skagit Valley College area may need elevated framing and documented drainage before the City signs off. Permits for in-city work go through the City of Burlington Community Development building counter; jobs just outside city limits toward Bow or Alger fall under Skagit County Planning & Development Services instead, with a different plan review queue. Roughly 37 inches of rain a year, most of it between October and May, means moss and mildew build up fast on any north-facing deck surface that does not get sun.

commonProblems:
  - title: "Cedar vs. composite in a wet climate"
    description: "Cedar looks right on a 1970s Burlington ranch home, but it is high maintenance in a climate that dumps 37 inches of rain most years. Boards left unstained past year two start graying and holding moisture, and moss takes over the north-facing sections fast, especially on lots shaded by mature Douglas fir near Little Mountain Park. Composite decking — Trex Transcend or TimberTech AZEK — costs more up front, roughly $9 to $14 per square foot in material versus $5 to $7 for cedar, but skips the annual scrub-and-stain cycle. TopVolk frames composite decks on 12-inch on-center joist spacing per manufacturer spec rather than the 16-inch spacing cedar allows, since composite boards flex more between supports. A full re-stain on an existing cedar deck runs $600-$1,200 depending on square footage and whether the old finish needs stripped first."
  - title: "Guardrail height and stair code on older decks"
    description: "Any Burlington deck built more than 30 inches above grade needs a guardrail at least 36 inches tall under the IRC, with balusters spaced so a 4-inch sphere cannot pass through. Older decks around town — especially split-level homes near Cascade Mall built before code updates tightened baluster spacing — often fail this on resale inspection. Stair stringers get flagged too: rise has to stay at or under 7.75 inches with a run of at least 10 inches, and any stair with four or more risers needs a graspable handrail, not the old 2x4 cap rail some 1980s decks still have. TopVolk rebuilds guardrail sections using Simpson Strong-Tie post bases and connectors rated for the load, not toe-nailed 4x4 posts. Bringing an existing deck up to current guardrail and stair code typically runs $1,500-$4,000 depending on linear footage and stair count."
  - title: "Permits and ledger flashing inspection"
    description: "Skipping the permit is the fastest way to end up tearing a deck apart later. Any attached deck over 200 square feet, or one more than 30 inches off grade, needs a building permit through the City of Burlington — and the inspector will specifically check ledger board attachment before the framing gets covered. The ledger has to bolt into the rim joist with lag screws or through-bolts, sit behind proper Z-flashing so water sheds away from the house band board, and never rest on a bead of caulk alone, which is a common shortcut TopVolk sees on older DIY decks near Peterson Road. A rough-in inspection happens after framing and before decking goes down; a final inspection closes out the permit. TopVolk Construction is a WA Licensed Contractor and pulls the permit itself, so the homeowner is not the one standing in line at the counter."
  - title: "What actually drives the cost of a deck"
    description: "A straightforward 12x16 ground-level deck in Burlington usually runs $12,000-$20,000 depending on decking material, footing count, and whether the old structure needs demolished first. Second-story decks over living space cost more — often $25,000-$45,000 — because they need proper drainage systems, sistered joists or an LVL beam to carry the load, and waterproof membrane under the decking so the room below stays dry. Post footings dug to frost line, generally 12-18 inches around Skagit County, and ground-contact pressure-treated posts add cost but skip the frost-heave problems that crack undersized footings after a hard winter. TopVolk gives a line-item quote after the site visit, not a ballpark range, and a deadline penalty is written directly into the contract. That is a different arrangement than a lot of Skagit Valley contractors offer, where the completion date is more of a suggestion."
  - title: "Maintenance schedule and when to rebuild vs. repair"
    description: "Cedar decks need a fresh coat of stain or sealant every 2-3 years to hold up against Skagit Valley rain — Cabot or Behr semi-transparent stain both work, but skipping a cycle lets water into the end grain and starts the boards checking. Composite boards from Trex or TimberTech carry 25-to-50-year fade and stain warranties and mainly need a seasonal wash to knock moss off shaded sections, no sanding or stripping involved. Structural lumber underneath — the joists, blocking, and rim joist connection — lasts 20-plus years if it was pressure-treated for ground contact and flashed correctly at install, regardless of which decking sits on top. A deck past 20 years old with soft spots near the ledger or wobble at the post bases is usually a rebuild candidate, not a repair. Call (206) 591-1096 for a free on-site look before deciding which way to go."

faq:
  - q: "How fast can you get to Burlington for Deck Installation?"
    a: "Burlington sits right off I-5 at the SR-20 interchange, so getting up from the Seattle Metro side or down from Bellingham is a straight shot for an on-site visit. Most consultations get scheduled within a few days of a call, and the initial site walk — checking grade, access for equipment along the driveway, and where the ledger board would attach to the rim joist — takes under an hour. Deck builds themselves typically run one to three weeks once permits clear the City of Burlington counter, longer for second-story decks that need structural framing and drainage work underneath. Vladislav Volkov handles the site visit personally, not a sales rep. Call (206) 591-1096 to get a visit on the calendar."
  - q: "What does deck installation in Burlington cost?"
    a: "Ground-level decks in Burlington generally land between $10,000 and $22,000 depending on square footage, framing complexity, and whether the decking is cedar or composite. Elevated or second-story decks run higher, often $25,000-$45,000-plus, because of added post footings, an LVL beam or sistered joists to carry the load, and a drainage system underneath to keep the space below dry. Material choice moves the total the most — Trex or TimberTech composite decking costs more per square foot than cedar or ground-contact PT lumber up front but needs far less maintenance over the life of the deck. A free on-site consultation gets you a line-item quote with real numbers, not a phone estimate."
  - q: "Do I need a permit for a deck in Burlington, and who handles it?"
    a: "Any Burlington deck attached to the house, over 200 square feet, or more than 30 inches above grade needs a building permit through the City of Burlington Community Development building counter, with plan review generally taking two to four weeks for a standard deck. Work just outside city limits toward Bow or Alger falls under Skagit County Planning & Development Services instead, with its own separate queue. TopVolk prepares the site plan, structural details for footings and ledger attachment, and pulls the permit directly — as a WA Licensed Contractor, that paperwork is handled without the homeowner standing in line. Rough-in and final inspections get scheduled as the build progresses."
  - q: "Should my deck attach to the house or stand freestanding?"
    a: "The main structural question is whether the deck attaches to the house with a ledger board or stands freestanding on its own posts. A ledger-attached deck bolts into the rim joist behind Z-flashing and needs a solid band board to carry the load; a freestanding deck uses double posts and its own beam, which is often the better call over a daylight basement or a rim joist that is not in great shape. Post footings get dug below frost depth, 12-18 inches around Skagit County, using ground-contact pressure-treated posts or PSL posts on concrete piers. TopVolk walks through both options during the site visit before drawing up plans."
  - q: "What kind of warranty do you offer on a new deck?"
    a: "Structural framing — posts, footings, joists, and ledger attachment — is warrantied against workmanship defects, and TopVolk stands behind the build with a deadline penalty written into the contract, not just a verbal promise. Composite decking from Trex or TimberTech carries its own manufacturer warranty, typically 25-50 years against fading, staining, and rot, since it does not absorb water the way wood does. Cedar and PT lumber decking do not carry that kind of warranty and depend on regular staining to hit a 15-20 year lifespan in this climate. Rot at the ledger or post base is almost always a flashing or drainage failure, not a material defect, which is why the flashing detail matters more than the wood species."
  - q: "Do you cover areas near Burlington, and how far out is scheduling?"
    a: "Skagit County work fits alongside jobs TopVolk already runs down toward Mount Vernon, Sedro-Woolley, and the Anacortes side of Fidalgo Island, so a Burlington deck often slots into the same trip as other work in the valley. Scheduling generally runs two to four weeks out for the initial site visit and design phase, with construction starting once the permit clears the City of Burlington counter. Vladislav Volkov confirms the schedule directly with the homeowner — no dispatcher, no call center, no sales staff following up afterward. Call (206) 591-1096 or ask for a free on-site consultation to get a build scheduled."