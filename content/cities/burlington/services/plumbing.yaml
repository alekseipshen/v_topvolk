  - q: "Do I need a permit to replace a water heater in Burlington?"
    a: "Yes — Washington's plumbing code requires a permit and inspection for water heater replacement, including seismic strapping. That applies to both tank and tankless units. Inside Burlington city limits, that permit goes through the City of Burlington building department. Just outside the city, it routes through Skagit County Planning & Development Services instead, and the two have different review windows and inspection scheduling. As a WA Licensed Contractor, Vladislav Volkov pulls the permit and schedules the rough-in and final inspection as part of the job, not as an add-on billed later. Typical turnaround is about a week from install to signed-off final inspection."
  - q: "Should I repipe with PEX or copper in an older Burlington home?"
    a: "PEX-A tubing (Uponor is the common brand used locally) handles freeze-thaw movement better than rigid copper. It installs faster through tight crawlspaces too, without soldering near old wood framing — that matters in the damp, low crawlspaces common near the Skagit River. Copper still makes sense for exposed runs, water heater connections, and anywhere local code or an HOA specifically requires it. Most full repipes on 1950s-60s homes here go PEX with short copper stub-outs at each fixture. The on-site estimate covers both options with real pricing side by side, not a guess over the phone."
  - q: "How long does a repipe or fixture install actually last here?"
    a: "A PEX or copper repipe should run 40-plus years without issues. Workmanship on any plumbing job comes with a deadline penalty written into the contract — not just a verbal promise made on the walkthrough. Zoeller ejector pumps typically last 7-10 years before the float switch needs replacing. PRVs generally hold for 10-15 years before the diaphragm wears out and pressure creeps back up. Skagit County's damp crawlspaces are harder on galvanized steel and polybutylene than on PEX or copper — that's part of why those older materials get flagged first during any inspection. Nothing here runs on a vague promise. It's written into the contract."
