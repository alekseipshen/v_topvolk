intro: |
  A rusted galvanized pipe under a 1958 rancher near Maiben Park explains most of the low-pressure complaints in Burlington's older blocks. Vladislav Volkov takes those calls directly. No dispatcher. No subcontractor bidding war. Just one WA Licensed Contractor who scopes the job and tells you the cost before work starts.

  Burlington's housing runs the gamut by decade. Galvanized steel shows up in the pre-1960 stock near downtown. Polybutylene hides in some 1980s additions off Cascade Mall Boulevard. Undersized gas lines turn up whenever someone wants a Rinnai or Navien tankless unit swapped in for an old 40-gallon tank.

  The Skagit River's flood history shapes what's happening below grade too. Crawlspace plumbing, sump pumps, and backwater valves matter more here than in the drier foothill towns toward Sedro-Woolley. Every quote is line-item, written on-site. That's backed by 100+ projects completed since 2023 across Skagit and the greater Seattle Metro area. Call (206) 591-1096 for a firm number instead of a phone guess.

localContext: |
  Most of Burlington's older housing sits close to downtown, inside the 98233 zip. Lots here were platted before 1960, and plumbing still runs on galvanized steel or early copper.

  Head west toward Bow and Edison. That area is technically 98233 in spots but slides into unincorporated Skagit County near 98232. Housing shifts to manufactured homes and acreage properties on private wells instead of city water. That changes the scope entirely — well pressure tanks and iron filtration come into play instead of city PRVs.

  Permits inside Burlington city limits go through the City of Burlington building department. Anything outside that boundary routes through Skagit County Planning & Development Services, and the review timeline differs between the two. Water heater swaps need seismic strapping and a permit either way under Washington's plumbing code. That part isn't optional. Skipping it tends to surface during a home sale inspection or refinance appraisal.

  The Skagit River's flood history also means crawlspaces here stay damp part of the year. That matters when deciding between PEX and copper for a repipe, and whether a sump pump belongs in the plan.

commonProblems:
  - title: "Galvanized Pipe Corrosion in Downtown Burlington's Pre-1960 Homes"
    description: |
      Homes built before 1960 near downtown Burlington were plumbed with galvanized steel pipe. That pipe rusts from the inside out. Corrosion narrows the pipe diameter over decades — that's why a shower that ran fine in 1995 barely trickles now. Rust flakes also clog aerators and cartridge valves in Moen and Kohler fixtures. They show up as reddish water after the city flushes hydrants nearby.

      A full repipe with PEX (Uponor) or copper replaces the horizontal runs and risers. SharkBite push-fit fittings speed up the connections in tight crawlspaces, no torch needed near old framing. For a typical 1,400-1,800 sq ft house, budget $8,000-$15,000 depending on fixture count and wall access. Most jobs finish in 3-5 days. Vladislav Volkov quotes the exact fixture count on-site, not a square-footage guess.
  - title: "Polybutylene Pipe Failures Behind 1980s Additions"
    description: |
      Polybutylene pipe shows up in additions and remodels built through the 1980s and early 90s around Burlington. It's usually gray plastic pipe joined with acetal fittings, hidden inside the wall cavity. Chlorine in treated water breaks down those fittings over time. The pipe itself turns brittle behind drywall, and nobody sees it crack until a ceiling stain shows up or a wall goes soft near the baseboard.

      Insurance companies flag polybutylene during claims. Some won't renew a homeowner's policy once they spot it on an inspection report. The fix is a full repipe with PEX-A tubing — Uponor is the brand most crews trust for cold-bend flexibility in a Northwest crawlspace. New lines run to every fixture, including the washing machine box and outdoor hose bibs. Plan on $7,500-$14,000 for an average house, and about a week of access to walls and ceilings for patching after.
  - title: "Tankless Water Heater Conversions and City of Burlington Permits"
    description: |
      Swapping a tank water heater for a Rinnai or Navien tankless unit sounds simple, until the gas line gets measured. Most older Burlington homes have a 1/2-inch gas line sized for a 40-gallon tank. A tankless unit needs 3/4-inch or larger CSST to hit the BTU demand. That upsize means opening a wall or crawlspace run, not just swapping the heater out at the closet.

      Washington code also requires seismic strapping, a T&P valve, and often an expansion tank on the cold side. Any of that triggers a City of Burlington permit, with a rough-in and final inspection before the gas company turns the meter back on. Installed cost runs $4,500-$7,500 including the gas line work. The permit adds roughly a week to scheduling, depending on inspector availability that time of year.
  - title: "High City Water Pressure and PRV Replacement Costs"
    description: |
      City water pressure on parts of Burlington's system tests above 80 psi. That's past what most fixture manufacturers rate for warranty coverage. Over time, that pressure wears out cartridges in Moen and Kohler faucets faster than normal. It stresses supply lines under sinks and toilets, and shortens water heater tank life by years.

      A pressure regulating valve (PRV) installed at the main, paired with an expansion tank on a closed system, brings pressure down to the 50-70 psi range plumbing code actually wants. It usually stops the water-hammer banging in the pipes too. Cost runs $650-$1,200, depending on whether the main shutoff valve also needs replacing and how accessible the meter and main line are under the house. Skipping this step after a repipe is a common reason brand-new fixtures fail early.
  - title: "Basement Bathroom and Kitchen Island Drain Rerouting"
    description: |
      Adding a basement bathroom or a kitchen island sink means running new drain lines that weren't part of the original layout. That's where venting gets complicated fast. A basement bathroom below the main sewer line usually needs an ejector pump — Zoeller is the brand most contractors reach for — to lift waste up to the existing drain. That pump has a working lifespan of roughly 7-10 years before the float switch or check valve fails and needs swapping.

      Kitchen islands need either a full vent stack tie-in through the roof or an air admittance valve (AAV) where code allows it. That avoids tearing open a finished ceiling below to run new venting. Budget $3,000-$6,000 for a basement bath drain and pump setup, or $800-$1,500 for an island sink reroute with an AAV instead.

