title: "Burlington WA Electrical — Panel & EV Upgrades"

answer: "Panel upgrades, EV charger circuits, and rewiring in Burlington, Washington — WA Licensed Contractor, 100+ projects completed since 2023."

intro: |
  Panel upgrades, EV charger circuits, and full rewires on older houses are the calls that keep TopVolk Construction busy in Burlington, and owner Vladislav Volkov handles the walkthrough and the install himself — no dispatcher, no subcontractor roulette. A lot of the housing near Old Town and the Allen neighborhood off Burlington Boulevard was wired when a 100A panel and a handful of 15-amp circuits covered a house just fine. That math stopped working the day someone brought home a Bosch induction range or ran a Mitsubishi mini-split off the garage sub-panel. Skagit River Park sits close enough to some of these older lots that flooding history and ground moisture have already taken a toll on buried conduit and outdoor panel boxes. TopVolk folds electrical scope into renovation and ADU projects across Skagit, King, Snohomish, and Pierce counties, with a WA Licensed Contractor pulling every permit and a deadline penalty written into the contract, not just promised at the sales pitch.

localContext: |
  Housing stock in Burlington covers more ground than you'd expect for a city just over 9,000 people. Down in 98233 near Old Town and the original railroad grid, plenty of stock dates to the early 1900s through the 1920s, and knob-and-tube still turns up in attics nobody's opened since the last owner painted the trim. Out toward the Allen neighborhood and the subdivisions that grew up around the Cascade Mall corridor and I-5, the housing shifts to 1970s-80s ranch and split-level builds, plus 1990s-2000s tract homes running 150A or 200A panels that were fine then and tight now with two EVs in the driveway. Closer to Bow-Edison and the 98232 edge, lots run bigger and lean on well pumps, shops, and barns that each need their own sub-panel. Burlington runs its own building permit desk for zoning and structural work, but electrical permits and inspections go through Washington State L&I, not a city electrical inspector, while PSE handles the actual meter and service drop. Flood history along the Skagit River means corroded panel boxes and damp crawlspace splices show up more here than in drier parts of the county.

commonProblems:
  - title: "100A Panels Choking on EV Chargers and Induction Ranges"
    description: "A 100A main breaker panel from the 1980s was sized for a gas furnace and an electric dryer, not a 60A circuit for a Tesla or ChargePoint charger plus a Bosch or Samsung induction range pulling 40-50A on its own. Load calculations on these Burlington houses routinely come back over capacity once we add up the existing circuits and the new ones. The fix is a 200A service upgrade — new meter base, new panel, often a new grounding electrode system tied to the water line and a ground rod. Budget $3,200 to $5,500 depending on whether the service entrance conductors need replacing too, plus a 1-2 week wait on the L&I inspection slot."
  - title: "Knob-and-Tube and Aluminum Branch Wiring"
    description: "Bungalows near Old Town from the 1910s and 1920s still hide knob-and-tube behind lath-and-plaster walls, ungrounded and often buried under blown-in insulation that isn't rated for it. Homes built between 1965 and 1973 out near Allen carry a different risk: aluminum branch wiring that loosens at the outlet screw over time and overheats. We fix aluminum circuits with AlumiConn connectors or copper pigtailing at every device, not just a wire-nut and a prayer. A single-story whole-house rewire runs $8,000 to $18,000 depending on square footage, wall access, and how much drywall patching comes with it."
  - title: "AFCI/GFCI Gaps on Permit-Required Remodels"
    description: "Current NEC rules require AFCI breakers on bedroom circuits and GFCI protection in kitchens, bathrooms, garages, and any outdoor receptacle. Once TopVolk pulls a permit for a kitchen or bath remodel in Burlington, the whole circuit gets brought up to code, not just the new outlets. L&I inspectors flag missing AFCI/GFCI protection at rough-in more than anything else on these jobs, and we run Square D or Eaton combination breakers to close the gap before that inspection happens. As the WA Licensed Contractor of record, Vladislav schedules rough-in and final inspection directly with L&I so the remodel doesn't stall waiting on paperwork."
  - title: "What Actually Drives the Price on a Panel Upgrade"
    description: "Quotes on a Burlington panel swap swing from $3,000 to $7,000, and the spread comes down to real factors: panel amperage (150A vs 200A), whether the meter base moves, how far the run is from the transformer, and whether PSE needs to upgrade the drop before we can tie in. A detached shop or barn near the Bow-Edison edge that needs its own sub-panel adds trenching and PT-lumber-rated conduit runs to the bid. TopVolk writes line-item quotes, not a vague range on a napkin, so you know what the meter base, the breakers, and the labor cost separately before signing anything."
  - title: "Repair vs Replace on Aging Panels and Circuits"
    description: "Federal Pacific and Zinsco panels — common in 1960s-70s Burlington remodels — have a documented history of breakers that fail to trip, and those get replaced outright, not repaired. A modern panel from Square D or Eaton runs 30-40 years before it's worth a second look. LED recessed lighting retrofits and dimmer-compatible LED swaps are a good add-on when we're already opening a ceiling for a kitchen remodel, since the labor overlap keeps the cost down. Expect a licensed inspection every few years on rental property, and a full panel inspection any time you're adding a heat pump, EV charger, or induction range circuit."

faq:
  - q: "How fast can you get to Burlington for Electrical?"
    a: "Burlington sits right off I-5, so a site visit from our Seattle Metro service area is a straightforward trip, usually scheduled within a few days of your call. Most of these houses have driveway or street parking that works fine for a walkthrough — no special access needed. Once the scope is set, panel upgrades typically install in 1-2 days with L&I inspection scheduled around that. Call (206) 591-1096 to get a free on-site consultation with Vladislav directly, not a salesperson."
  - q: "What does a panel upgrade cost in Burlington?"
    a: "Most 200A panel upgrades in Burlington run $3,200 to $7,000, with the final number depending on panel size, meter base relocation, and whether PSE has to touch the service drop. Homes near Old Town with older service entrance conductors sometimes need those replaced too, which adds to the bid. Sub-panels for a detached shop or ADU run separately, priced by circuit count and trench length. Call (206) 591-1096 for a free estimate with actual line-item pricing, not a ballpark guess."
  - q: "Do I need a permit for electrical work in Burlington?"
    a: "Yes — electrical permits and inspections in Burlington go through Washington State L&I, since the city doesn't run its own electrical inspection program, while building and zoning permits go through Burlington's city building desk. Panel upgrades, sub-panels, and new circuits all require a permit before work starts, plus a rough-in and final inspection. TopVolk Construction is a WA Licensed Contractor and pulls these permits directly, so there's no gap between the contractor and the inspector. Most straightforward panel jobs clear L&I inspection within 1-2 weeks of scheduling."
  - q: "Can you wire a circuit for a Tesla, ChargePoint, or JuiceBox charger?"
    a: "Yes, and the circuit size depends on the charger and the vehicle — most Level 2 units want a dedicated 50A or 60A circuit run in conduit or NM cable back to the panel. If your existing panel doesn't have the open breaker space or amperage, that's usually the point where a service upgrade makes more sense than squeezing in one more circuit. We size the wire gauge and breaker to the charger manufacturer's spec sheet, not a generic guess, and test the circuit under load before we call it done."
  - q: "What's the warranty on a panel upgrade or rewire?"
    a: "Workmanship on panel upgrades and rewiring is covered for one year after final inspection, and panel and breaker manufacturers like Square D and Eaton carry their own separate product warranties on top of that. Skagit Valley's damp winters are hard on outdoor panel boxes and buried splices, so anything installed outside gets a weatherproof, corrosion-rated enclosure as a baseline, not an upgrade option. Interior wiring and breakers in a properly grounded panel should outlast the house. Anything covered gets spelled out in writing before the job starts, not after."
  - q: "Do you cover areas near Burlington too?"
    a: "TopVolk covers Skagit County alongside King, Snohomish, and Pierce counties, so Mount Vernon, Sedro-Woolley, Anacortes, and the Bow-Edison area are all in range along with Burlington itself. Scheduling windows run a few days out for consultations and typically a few weeks out for the actual install once permits are filed, depending on the season. Spring and summer book up faster with remodel season in full swing. Call (206) 591-1096 to lock in a slot and get a free consultation on-site."