intro: |
  A punch list of ten small items after a bigger contractor left town. A corroded faucet cartridge dripping under the sink. A dead doorbell camera that needs to come down for a new Ring unit. That's the work TopVolk Construction picks up in Fife, and most of it gets scheduled within a few business days of the call. Vladislav Volkov runs the company himself. No dispatcher, no sales rep. He's completed 100+ projects since 2017 across Pierce County and the rest of Seattle Metro, so the guy who quotes the job on a ranch home near Dacca Park is the same guy who shows up with the ladder. Fife's housing stock skews older than most people expect. This is a city built around the Port of Tacoma and the Emerald Queen Casino off I-5, but plenty of streets still carry 1970s and '80s ranch and split-level homes along Pacific Hwy E. Newer infill has gone up closer to the Fife Community Center. A Whirlpool dishwasher installed during a remodel five years back still needs its trim kit screwed down. A GE range hood still needs venting through the wall. That's a handyman call, not a full remodel contract.

localContext: |
  Fife runs almost entirely on zip 98424. That zip stretches toward Fife Heights and up to the Milton border, where it shifts to 98354 — worth knowing, since a good chunk of service calls come from homeowners right on that line. The housing mix here splits three ways: older ranch and split-level homes built in the 1960s through 80s along 70th Ave E and Pacific Hwy E, manufactured home communities near that Milton edge, and newer infill going up closer to the Fife Community Center on 54th Ave E. Older ranch homes often still run galvanized supply lines feeding a single hose bib. Those lines corrode from the inside and choke water pressure long before anyone notices a leak. The fix is a straightforward swap to PEX, but it requires knowing where the shutoff actually lives. Fife issues its own permits through the City of Fife Community Development Department, not Pierce County PALS. Most handyman-scope work — fixture swaps, deck board replacement, drywall patching — doesn't trigger a permit at all unless it touches structural framing or a full electrical circuit. Rain off Commencement Bay keeps humidity high enough that exterior trim and siding near the Hylebos Nature Area take a beating every winter.

commonProblems:
  - title: "Punch List Cleanup After the Big Remodel Crew Leaves"
    description: "A general contractor finishes framing and drywall, then vanishes before the last ten items get done. A crooked cabinet hinge. GFCI cover plates still sitting in a drawer. Caulk that never got run along the tub surround. TopVolk picks up these punch lists across Fife regularly, usually after a kitchen or bath job wrapped by another crew. Common items: a Moen faucet that drips at the base because the cartridge wasn't seated right, KitchenAid dishwasher trim kits that were never screwed down, and a tub that needs mildew-resistant silicone instead of the painter's caulk someone used to save time. Most punch lists run $400 to $900 flat, done in a single day. Call (206) 591-1096 to get on the calendar."
  - title: "Drywall Patches That Actually Match the Existing Texture"
    description: "Fife homes built in the 70s and 80s mostly carry orange peel or knockdown texture. A bad patch job sticks out under any side light — you'll see a flat rectangle where a phone jack or old thermostat used to sit. The fix starts with corner bead where needed. Then two coats of joint compound, feathered wide. Then texture matched with a hopper gun, and primed with a Sherwin-Williams stain-blocking primer so the patch doesn't flash a different sheen once painted. Small patches — nail pops, doorknob holes, old cable outlets — run $150 to $350 depending on texture complexity and drying time between coats. Bigger sections, like where a TV bracket pulled anchors clean out of the wall, run closer to $400 to $600."
  - title: "Fixture Swaps Without Triggering a Full Trade Permit"
    description: "Swapping a Kohler toilet, replacing a Moen kitchen faucet, or hanging a new light fixture doesn't require a permit through the City of Fife Community Development Department. That's true as long as the work doesn't touch branch circuit wiring or move a drain line. What it does require is knowing where the shutoff valve actually is on a 1970s ranch. Plenty of homes near Pacific Hwy E still have the original angle stops, and those snap off when you try to turn them after forty years of mineral buildup. TopVolk, a WA Licensed Contractor, replaces those stops as part of the job instead of fighting a stuck valve. A toilet swap with a new wax ring and supply line runs about 1-2 hours. Both jobs get quoted flat rate on-site."
  - title: "Deck Board Replacement — What Actually Drives the Cost"
    description: "A lot of Fife decks went in during the 80s and 90s with standard PT lumber. After thirty-plus winters of Commencement Bay rain, the boards cup, the joist hangers rust, and railing balusters loosen past code spacing. Replacing individual boards runs $12 to $18 per linear foot, including PT lumber and fasteners. Switching to Trex or TimberTech composite runs $18 to $28 per foot, but it skips the yearly re-sealing PT lumber needs. Full resurfacing — boards plus railing — typically lands between $3,500 and $7,000, depending on square footage and whether the ledger board and blocking underneath need work too. Free on-site estimates give exact pricing, not a phone-quoted range."
  - title: "Weatherstripping, Trim, and Gutter Prep Before the Rain Starts"
    description: "October through May, Fife gets soaked. Doors and windows that sealed fine in July start whistling and leaking by November. Worn weatherstripping around exterior doors and older aluminum-frame windows lets cold air in. It also lets moisture sit against the jamb, which eventually rots the trim underneath. TopVolk replaces door and window weatherstripping with compression seals rated for PNW winters. Trim joints get re-caulked with paintable exterior sealant, and loose Hardie or wood siding panels get refastened before winter hits. Rotted trim gets cut back to solid wood and replaced with PT or cellular PVC trim, which won't absorb water the way old cedar trim does once the paint film fails. This kind of maintenance run costs $250 to $600, depending on how many doors, windows, and trim sections need attention."

