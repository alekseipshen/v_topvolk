  - q: "Do I need a permit to replace flooring in Fife?"
    a: "Straight flooring replacement — pulling old carpet or vinyl and installing LVP, tile, or hardwood — usually doesn't require a permit through the City of Fife's Building Division. That changes if the job involves subfloor structural repair, wall moves, or a full kitchen or bath remodel bundled with the flooring, which needs plan review through the city rather than Pierce County PALS, since Fife is incorporated. Condo and townhome projects often need HOA sign-off on underlayment sound ratings before work starts, separate from any city permit. TopVolk handles that paperwork trail and pulls permits when the scope calls for it. WA Licensed Contractor."
  - q: "Engineered hardwood or solid hardwood for my house?"
    a: "Depends on what's under your feet right now. Slab-on-grade construction, common in the newer builds around Fife Heights, needs glued-down engineered hardwood or floating LVP, since solid oak can't be nailed into concrete. Homes with a plywood subfloor over joists, more typical near the older part of town, can run either solid 2-1/4 inch oak strip or engineered. Engineered hardwood from Shaw or Mullican also handles PNW humidity swings better than solid oak, since the plywood core resists the cupping solid wood is prone to when moisture levels shift between the wet season and a dry, heated winter."
  - q: "How long does new flooring actually last in Fife's climate?"
    a: "LVP from Mohawk or COREtec typically carries a 15-25 year residential wear warranty and holds up fine in Fife's humidity as long as the subfloor was moisture-tested before install. Engineered hardwood runs 30-40 years with a couple of light refinishes if the wear veneer is at least 2mm thick. Solid oak strip, properly acclimated and finished with Bona products, can outlast the house itself — 60-plus years with periodic refinishing. What's not covered under any manufacturer warranty: water damage from a slab that was never tested, or gouges from movers dragging appliances across a brand-new floor."
