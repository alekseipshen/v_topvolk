title: "Fife Deck Installation — Composite Decks Built for Pierce County Rain"

intro: |
  Pacific Highway runs straight through 98424, and the residential blocks from the Milton Road area north toward the city limits are mostly split-levels and ranchers where the back door opens to grade or a short concrete step. Pierce County averages close to 40 inches of rain a year. A Trex composite deck on pressure-treated framing holds up without the annual maintenance cycle that cedar demands. TopVolk Construction has been building and permitting decks in this corridor since 2023 — 100+ projects across King, Pierce, and Snohomish counties.

localContext: |
  Most of Fife's housing stock in 98424 was built between 1975 and 1995 — contractor-grade construction with Hardie or vinyl cladding and sliding doors that drop to grade or a short platform. The rim joist on these homes is often a single 2×10 sitting behind cladding for 30-plus years with no flashing history. Before any ledger board goes on, that joist gets inspected for soft spots. Skipping that step is exactly why decks pull away from houses five years later.

  The Wapato Lake neighborhood and the streets running east toward Edgewood (98372) sit on a mix of glacial outwash and low-lying fill — the kind of soil that shifts under a surface-set post base. Homes backing up toward the Puyallup River floodplain near 54th Avenue E get particularly wet ground in winter, and footings here regularly need to go deeper than the minimum Pierce County PALS requirement to hit solid bearing. The subdivisions along Milton Road and near Alexander Avenue follow the same mid-'80s tract pattern as the rest of 98424 — slab-on-grade or shallow crawlspace, sliding patio door, no existing deck platform.

  Fife's location between Federal Way and Tacoma means permits run through Pierce County PALS rather than a city building department. Plan review for a standard attached deck currently runs 2-4 weeks from submittal. Vladislav handles the permit paperwork directly — homeowners don't have to track down a permit runner or figure out the PALS online portal on their own.

commonProblems:
  - title: "Ledger board rot on pre-1995 Fife homes"
    description: "Ledger rot starts behind the siding, not on the deck surface. In Fife's late-'70s and '80s ranchers — especially the streets between Pacific Highway and I-5 — the rim joist often has no flashing behind it. Attaching a ledger without double-barrier flashing — aluminum step flashing plus a self-adhering membrane — traps moisture and causes structural failure within 5-7 years. Rim joist inspection and sister-joist repair happen before any ledger bolts go in."

  - title: "Post footings and soil conditions in 98424"
    description: "Pierce County PALS requires footings that reach frost depth — typically 12-18 inches in this part of the county. Sandy and fill soils in parts of Fife, particularly near the Wapato Lake area and properties close to the Puyallup River corridor, won't support surface deck blocks; concrete footings poured to bearing capacity are required. All posts use ground-contact pressure-treated (PT) lumber rated for direct soil contact. Simpson Strong-Tie post bases keep the wood above the concrete surface to cut long-term moisture exposure."

  - title: "Cedar vs composite on north-facing decks in the Pierce County rain corridor"
    description: "North-facing deck boards in Fife collect moss by the second season regardless of what sealant goes on in spring. Trex and TimberTech composite boards resist moisture absorption, hold color, and need no annual treatment. Cedar still works well on covered structures with good airflow. The material choice changes the subframe spec too — composite requires 12-inch on-center joist spacing where cedar allows 16 inches."

