title: "Fife Bathroom Remodel — Fix the Moisture, Then the Tile"

intro: |
  Sandwiched between Tacoma and Milton along I-5, Fife's 98424 zip is mostly 1980s
  and early-'90s tract construction — builder-grade Kohler fixtures, 4×4 ceramic tile
  set over greenboard, and zero waterproofing membrane behind the shower walls.

  Grout cracks first. Then the caulk line separates.

  With Pierce County averaging 37+ inches of rain per year, that water goes straight
  into the wall cavity and subfloor. The damage accumulates for months — sometimes a
  full year — before a soft spot underfoot makes it undeniable. By that point, what
  started as a tile job has turned into subfloor replacement, stud repair, and a fresh
  plumbing rough-in. Most homeowners in Fife don't call until they're already standing
  on that soft spot.

localContext: |
  Fife's residential neighborhoods — particularly around 20th Street East and the 54th
  Avenue corridor in 98424 — run heavily toward 1980s-2000s builder-grade homes.

  These builds skipped the Schluter Kerdi and vapor barrier details that current code
  requires. The shortcuts show up fast in a wet climate: delaminating greenboard,
  corroded drain flanges, and exhaust fans that vent into the attic instead of through
  the roof cap.

  Pierce County PALS handles permit review for structural work and plumbing relocations.
  Plan review for a master bath reconfiguration typically runs 3–6 weeks.

  Older Fife homes near the Pacific Highway corridor may also carry cast-iron drain
  stacks that need evaluation before any layout change. Cast iron doesn't fail all at
  once — it scales internally until flow drops off, then cracks under demo. Worth
  scoping before demo day, not after.

commonProblems:
  - title: "Greenboard-Backed Tile Letting Moisture Into the Wall Cavity"
    description: |
      Builder installs from the '80s and '90s set tile directly over greenboard —
      not a waterproofing membrane.

      Once the grout joints crack, water migrates behind the tile for months before
      you see staining or soft drywall. By the time it's visible from inside the room,
      the cavity framing has usually taken on enough moisture to start growing mold.
      Fixing it means demo to the studs and a fresh start with Schluter Kerdi or
      RedGard before any new tile goes down. There's no patch that holds long-term
      once the substrate is compromised.

  - title: "Fiberglass Tub Surrounds That Have Shifted and Separated at the Deck Seam"
    description: |
      One-piece fiberglass inserts were standard on every tract home built in
      Fife between 1985 and 2000.

      The deck seam separates over time — especially with subfloor flex on slab
      foundations — and water gets underneath quietly. Replacing the surround usually
      means addressing OSB subfloor rot and rerouting the drain rough-in before the
      new shower pan goes in. Converting from a tub-surround to a curbless shower
      adds another rough-in inspection, but it's often the right call on a floor that's
      already open.

  - title: "Underpowered Exhaust Fans Venting Into the Attic Instead of Outside"
    description: |
      Pierce County's rainy season runs October through May. That's roughly seven
      months of elevated indoor humidity concentrated in a small, poorly ventilated room.

      Builder-installed fans in Fife's older homes are often 50 CFM units terminating
      into the attic cavity, not outdoors. Mold follows on the ceiling, then behind
      the vanity. Fixing it means a properly ducted 110 CFM fan, corrected vapor
      barrier details at the ceiling plane, and capping whatever the previous installer
      left open in the attic.

      It's a half-day job. And it changes the long-term outcome of everything else
      done in that bathroom.

faq:
  - q: "How fast can you get to Fife for a bathroom remodel estimate?"
    a: |
      Fife is 35–40 minutes from our main corridor via I-5 South — a straightforward
      drive. Vladislav (TopVolk's owner) runs the estimate personally, no sales rep
      involved.

      Call (206) 591-1096 to book a time.

  - q: "Do you work with Moen and Kohler fixtures, or do homeowners need to supply their own?"
    a: |
      Both work. Moen, Kohler, and Delta are the fixtures we see most in Fife homes.

      Rough-in plumbing gets sized to match whatever you choose — client-supplied from
      a showroom or sourced through us. No surprises at the final inspection.

  - q: "How long does a bathroom remodel take in Fife, and what's the permit process like?"
    a: |
      Structural or plumbing changes go through Pierce County PALS. Plan review
      typically runs 3–6 weeks.

      After permit approval, a standard master bath — demo through blue tape walkthrough
      — takes 4–7 weeks. Total end-to-end: roughly 2–3 months depending on scope,
      material lead times, and whether the rough-in inspection catches anything in the
      existing drain stack.

      TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017.
      The permit timeline and deadline penalties go into the contract before work
      starts — call (206) 591-1096 to talk through your project.