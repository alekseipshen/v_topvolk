title: "Fife Bathroom Remodel — Strip the 1980s Out of 98424"

intro: |
  Sandwiched between I-5 and the Puyallup River delta, Fife's residential blocks off 54th Avenue E and around Pacific Rim Park hold a dense run of 1980s ranchers with bathrooms nobody has touched in 30 years.

  Pink laminate counters. Fiberglass tub surrounds. Galvanized supply lines.

  Moen single-handle faucets that barely trickle — that's the baseline here. TopVolk Construction has pulled permits through Pierce County PALS on these exact houses and rebuilt them from the framing out. Owner Vladislav Volkov handles the consultation himself, not a salesperson, and deadline penalties are written into the contract before demo starts.

localContext: |
  Fife's residential stock splits into two distinct waves, and the problems differ by era.

  The older belt — 1975 to 1995 construction — runs along Pacific Highway E and east of 54th Avenue E toward Dacca Park. Historic streets near the Dacca Barn and south toward East Fife typically show fiberglass tub surrounds set directly over un-membraned greenboard drywall. That's a slow moisture failure in a climate delivering 37 inches of rain per year. North-facing walls collect mildew fast once that greenboard gets compromised.

  The newer subdivisions — Saddle Creek off Radiance Blvd E, the communities along 62nd Avenue E, and the 1990s ranchers filling in the Fife Heights corridor (zip 98422 bleeds across the city line near 20th Street E) — are a different story. Builder-grade fixtures from 2000–2010 hitting end of service life, shower surrounds that were never properly waterproofed with Schluter Kerdi, and exhaust fans still venting into attic space.

  Cast-iron drain stacks are standard in anything built before 1985.

  Rerouting around them adds a day to most rough-in schedules — sometimes more when the stack runs floor-to-ceiling through the wet wall. Pierce County PALS requires a rough-in inspection before any framing closes, so that's a scheduled hold point you plan around, not around. Vladislav factors it into every line-item quote upfront so the timeline doesn't shift on you mid-project.

commonProblems:
  - title: "Fiberglass Surround Failure With Wet Framing Behind the Wall"
    description: |
      1980s Fife ranchers used greenboard as shower backer — not a waterproof substrate.

      Pacific Northwest humidity works behind the seams for years before it shows. By the time you spot soft corners or peeling surround edges, the framing is already damp. Correct sequence: full tear-out to studs, RedGard membrane over cement board, then large-format porcelain set with modified thinset.

      Skipping any of those steps just resets the moisture clock.

  - title: "Cast-Iron Drain Stack Rerouting for Layout Changes"
    description: |
      Pre-1985 houses in 98424 commonly have 3- or 4-inch cast-iron drain stacks running floor-to-ceiling through the bathroom wall.

      Moving to a curbless shower or shifting the toilet location means cutting and rerouting that stack — rough-in plumbing that requires a Pierce County PALS inspection before any wall can close. Budget an extra day minimum when the stack is in the way. In tighter Fife floor plans where the stack is centered in the wet wall, that reroute sometimes forces a layout compromise on shower width. Vladislav maps this out during the on-site consultation so there are no surprises mid-demo.

  - title: "Inadequate Ventilation Feeding Chronic Grout Mold"
    description: |
      Broan 50 CFM fans from the 1980s — most vented into the attic, not outside — can't keep up with PNW humidity.

      North-facing bathrooms in Fife collect mildew on ceiling and grout joints fast. The fix: 110 CFM or higher fan vented through the roof decking, combined with Schluter Kerdi membrane on all shower walls and a full grout rekey in a non-sanded epoxy. That combination holds up. A 50 CFM fan exhausting into attic insulation just moves moisture from one problem zone to another.

faq:
  - q: "How fast can you get to Fife for a bathroom remodel consultation?"
    a: |
      Fife is about 35 minutes south of Seattle via I-5. Vladislav schedules free on-site consultations in 98424 typically within 3–5 business days — call (206) 591-1096 to pick a time directly with him, no scheduling staff in between.

      Homes near Fife High School on 20th Street E and the East Fife residential blocks are all on the same route south, so same-week scheduling is usually doable.

  - q: "What fixture brands do you typically replace in Fife bathroom remodels?"
    a: |
      Most original hardware here is Moen or American Standard tub-shower valves and Kohler toilets from the late 1980s.

      Common upgrade path: Moen Posi-Temp or Kohler Rite-Temp pressure-balancing valves, Kohler or American Standard elongated toilets, and Rinnai tankless water heaters when the original 40-gallon tank fails mid-project. LG and Kohler fixtures come up often in the mid-range remodels in this zip code — durable enough, priced realistically for the neighborhood. In the Saddle Creek and 62nd Avenue E subdivisions, builder-grade Samsung or Whirlpool jetted tubs from the early 2000s are a common swap-out too.

  - q: "What does a full bathroom remodel cost and how long does it take in Fife?"
    a: |
      A full master bath gut-and-rebuild in 98424 typically runs $22,000–$48,000 depending on layout changes, tile selection, and whether a cast-iron drain stack needs rerouting.

      Permit plan review through Pierce County PALS runs 3–6 weeks. Construction is 4–6 weeks after permit approval.

      Vladislav provides a line-item quote — no vague ranges. Deadline penalties are written into the contract, not just mentioned on a call. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2017 across King, Pierce, Snohomish, and Kitsap counties.