  - q: "What does a shower retile cost in Fife?"
    a: "A full shower tile job with Schluter Kerdi waterproofing, new niche, and bench typically runs $8,000-$14,000 in Fife, depending on tile size, shower footprint, and whether you're going curbless. Natural stone or large-format porcelain pushes the price up versus standard ceramic subway tile. Heated floor add-ons with Ditra-Heat run another $1,500-$2,500. We give a free on-site estimate with exact line-item pricing — no vague range quoted over the phone."
  - q: "Do I need a permit for tile installation in Fife?"
    a: "Straight tile-over-existing-substrate work usually doesn't need a permit, but any job touching plumbing rough-in (moving a shower drain) or electrical rough-in (relocating an outlet behind a backsplash) requires a permit through the City of Fife's building department, with inspections at rough-in and final. We pull those permits directly and schedule inspections around the work, so you're not tracking down paperwork mid-project. As a WA Licensed Contractor, TopVolk handles the inspection coordination as part of the quoted price."
  - q: "What's the difference between Schluter Kerdi and just using RedGard?"
    a: "Kerdi is a fabric membrane that gets embedded in thinset and physically bridges cracks and seams, while RedGard is a liquid-applied membrane that relies on even coverage and cure time — both work, but Kerdi handles corners, niches, and curbs more reliably in a full shower rebuild. We use Kerdi on tear-outs and full rebuilds, and RedGard on simpler floor waterproofing where there's no vertical wall assembly involved. Either way, it goes over cement backer board, never bare drywall, in a wet zone."
  - q: "How long does tile installation actually last in Fife's climate?"
    a: "Porcelain and ceramic tile itself will outlast the house — 30+ years isn't unusual — but the grout, caulk, and waterproofing membrane are the parts that wear out first, especially with our wet October-through-May stretch pushing moisture into any weak seam. Schluter Kerdi carries a lifetime warranty against water damage when installed to spec, which is how we install every shower. Epoxy grout holds up 8-10 years without resealing versus 12-18 months for standard sanded grout. We'll walk you through which grout and sealant options make sense for your specific bathroom's ventilation."
