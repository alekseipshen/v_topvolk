    a: "We cover Fife along with Milton, Edgewood, Tacoma, and the rest of Pierce County, plus King, Snohomish, and Kitsap counties — 100+ projects completed since 2017 across the Seattle Metro area. Scheduling windows run a few days out for estimates and 1-3 weeks for the actual tile work once materials are in. Vladislav handles every estimate personally, so what you're quoted is what you pay. Schedule a free consultation at (206) 591-1096."