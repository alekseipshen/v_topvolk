  - q: "Do you handle permits with the City of Sammamish Building Department?"
    a: |
      Yes. Structural foundation work in Sammamish — seismic retrofits,
      underpinning, shear wall additions — goes through the City of Sammamish
      Building Department, not Seattle SDCI or King County DPER (those cover
      different jurisdictions). TopVolk is a WA Licensed Contractor and prepares
      the complete permit application, including any structural drawings the AHJ
      requires during plan review. Straightforward mudsill bolt retrofits
      typically clear plan review in three to five weeks; scopes requiring
      structural engineering drawings run five to eight weeks. Rough-in and final
      inspections are coordinated directly with the city. Permit milestone
      deadlines are written into the contract — a missed inspection window
      triggers a financial penalty paid to you.

  - q: "Do you install interior drainage systems and sump pumps in crawlspaces?"
    a: |
      Yes, and interior drainage is often the right first move even before
      structural repair begins. A perimeter channel system installed along the
      crawlspace stem wall base captures groundwater before it builds hydrostatic
      pressure against the concrete. Zoeller and Liberty Pumps sump systems with
      battery-backup float switches are the standard spec — power outages during
      heavy October-April rain events happen on the Plateau, and a dead sump
      during a storm undoes a repair quickly. The sump pit goes at the lowest
      crawlspace point, and the discharge line runs to daylight at a storm drain
      or infiltration area well away from the foundation footprint. Full interior
      drainage installation on a 1,800-2,400 sf Sammamish home runs three to
      five days and typically costs $6,000-$12,000 depending on perimeter
      footage.

  - q: "What warranty comes with foundation repair work?"
    a: |
      Helical pier hardware from Chance and Hubbell carries a transferable
      manufacturer warranty on the steel components themselves. TopVolk's
      workmanship warranty on all foundation repair installation covers three years,
      including any movement beyond the tolerances agreed in the scope. CleanSpace
      vapor barrier carries a manufacturer's 25-year warranty against material
      defects. Epoxy crack injections — using Sika products — are essentially
      permanent at the repair point once the underlying movement is corrected;
      they don't re-crack at the injected location. Sump pump hardware is covered
      by the manufacturer, typically three to five years for Zoeller units.
      Workmanship coverage does not extend to new cracking caused by drainage
      failures outside the original repair scope — which is why drainage gets
      addressed as part of every structural repair, not as an optional add-on.

