title: "Sammamish Fence Installation — Cedar & Vinyl on the Plateau"

intro: |
  Klahanie's architectural review committee sends back more fence submittals than almost any HOA in King County — usually because the homeowner picked a stain color the ARC didn't pre-approve, or the site plan didn't show post spacing relative to the property line. That's a 3-4 week delay before a single post hole gets dug. Sammamish occupies the 98074 and 98075 zip codes almost entirely, and the housing here is predominantly 2000s-era Pacific Northwest construction: large lots, frequent grade changes, and backyard lines abutting greenbelt or natural drainage corridors. Fence runs on those lots require upfront planning — a 6-foot elevation drop across 80 linear feet means choosing between raked panels or stepped panels, and those are two completely different installation approaches with different post depths and blocking requirements. Over at the Sahalee neighborhood off 228th Ave NE, Western Red Cedar shadow-box fencing installed around 2006-2010 is now showing post rot at grade on north-facing runs. That's the most common starting point for a fence project on this plateau.

localContext: |
  Plateau geography defines nearly every fence project in Sammamish. Properties in 98074 — Klahanie, Pine Lake, the streets running east off East Lake Sammamish Parkway — frequently drop 6-10 feet across a standard fence run. Stepped panel installation requires blocking between the post and the bottom stringer at each tier, and post holes on sloped ground need to go deeper to keep the post plumb: 36 inches minimum in the wet glacial-till and clay-fill soil common across this area. In 98075, the Trossachs and Inglewood Hill areas have larger parcels and more custom fence work — board-on-board cedar, horizontal Western Red Cedar slat fences with concealed fasteners, and composite alternatives like TimberTech decking rail systems for low-maintenance performance. City of Sammamish code allows 6-foot fences on side and rear property lines, 4-foot maximum in the front yard setback zone. Most lots here also fall under HOA covenants that layer additional requirements on top of city code — material approval, post cap style, gate hardware finish — running on a separate review timeline from any city building permit.

commonProblems:
  - title: "Cedar Post Rot at Grade — The Most Common Call on the Plateau"
    description: |
      Western Red Cedar looks right on a 2005 Northwest-style home, and it's everywhere in Klahanie and Pine Lake. The problem is post rot at grade. Sammamish averages close to 37 inches of rain annually, and the clay-heavy soil holds moisture against the post base even between storms. Most cedar posts were originally set without a post sleeve or gravel drainage column, so the wood stays saturated from October through May every year. Once decay starts, it's typically 6-8 inches up the post before the lean becomes visible. Correct remediation: pull the old post, excavate to 36 inches, pour 6 inches of ¾-inch drain rock at the base, set a Simpson Strong-Tie ABA post base on a concrete footing, and reset the post so wood never contacts soil directly. That detail adds roughly $40-$60 per post but eliminates the problem recurring. On a typical 100-linear-foot replacement job in 98074, plan on $5,500-$8,000 all in.

  - title: "Shallow Post Setting in Wet Soil — Why the Fence Leans After One Winter"
    description: |
      A 6-foot cedar fence post needs 36 inches in the ground to stay plumb through a Sammamish winter. Most production fence crews set to 24 inches — adequate in dry climates, inadequate here. The Sammamish Plateau sits on saturated glacial till and modified clay fill, and waterlogged soil in December loses nearly all bearing resistance. Posts set at 24 inches will shift after the first significant wind event, pulling the top rail bracket and racking the panel out of plumb. Correct approach: 36-inch depth minimum, 80-pound bag of Quikrete Fast-Setting Concrete per post, poured dry and watered in, post braced plumb for 24 hours before any panel load. On sloped runs in Trossachs or along the East Lake Sammamish Parkway corridor, uphill posts often need 40 inches due to downhill soil creep loading. This is standard on every TopVolk fence project — not an upgrade.

  - title: "Dual Approval Delay — City Permit and HOA Review Running on Different Clocks"
    description: |
      Fence permits in Sammamish go through City of Sammamish Development Services — not King County DPER, since Sammamish incorporated in 1999 and handles its own permit intake. Fences over 6 feet, corner lots with sight-triangle concerns, or any fence functioning as a retaining wall above 4 feet all require a building permit. City processing typically runs 2-4 weeks for standard submittals. The real schedule risk is HOA review. Klahanie HOA and Sahalee Community Association both require architectural review committee approval before construction starts, and ARC meetings happen monthly. Submit incomplete drawings — missing post spacing dimensions, wrong material callout, no elevation detail — and the next review slot is 30 days out. TopVolk, a WA Licensed Contractor, prepares the full submittal package: dimensioned site plan showing fence location relative to property lines, material and finish spec sheet, elevation drawing, and the HOA application form. That coordination is part of the project scope, not a separate service charge.

  - title: "Sloped-Lot Pricing — What Grade Change Actually Adds to the Budget"
    description: |
      Flat-ground cedar board-on-board fencing in Sammamish runs $45-$65 per linear foot installed — posts, concrete, hardware, and labor included. Add significant slope and that number shifts. A stepped fence on a 6-foot grade change requires tier blocking, notched stringers, and additional labor time at each step; budget $60-$85 per linear foot on a sloped run. Horizontal Western Red Cedar slat fencing with concealed stainless fasteners and a top cap runs $70-$100 per linear foot — a popular choice in 98075 where the modern architecture calls for it. Gates are priced separately: a 4-foot walk gate with D&D Technologies TruClose adjustable self-closing hinges and a stainless magnetic latch runs $450-$650 installed. Double drive gates run $950-$1,400. Vladislav provides a line-item quote after the site visit — not a range, not a ballpark. Free on-site estimate before any commitment.

  - title: "Gate Hardware Failure — When the Hinge Is the Only Thing That Needs Replacing"
    description: |
      A gate used 6-10 times a day by a family with a dog puts serious cycle load on strap hinges. Cheap stamped-steel strap hinges fail within 3-5 years: the barrel bends, the lag screw holes strip out of the cedar post, and the gate starts dragging on the ground. Before quoting a whole fence replacement, check the hardware first. D&D Technologies TruClose adjustable self-closing hinges are rated for 500,000 cycles and adjust in three axes — useful when a gate sags over time due to wood shrinkage. Stripped post screw holes are repairable with a hardwood dowel and exterior-grade epoxy before resetting the hinge leaf. The latch is usually the second failure point: standard thumb-latches corrode quickly in the moist air coming off Puget Sound during westerly storm events. Stainless steel or hot-dipped galvanized latch hardware adds $40-$80 to a gate repair job and doesn't need replacing again.

faq:
  - q: "How fast can you get to Sammamish for a fence estimate?"
    a: |
      Sammamish is a straightforward drive from Bellevue via I-90 East, or from Kirkland down SR-202 — typically 20-30 minutes depending on where you sit on the plateau. Site visits are scheduled within 3-5 business days of your call, with same-week availability most of the year outside peak summer. After the visit, you get a written line-item quote within 48 hours — specific to your lot grade, material choice, gate count, and any HOA requirements. Installation scheduling typically runs 2-4 weeks out from signed contract, factoring in city permit and HOA approval timelines. Call (206) 591-1096 to get on the calendar.

  - q: "What does fence installation cost per linear foot in Sammamish?"
    a: |
      Cedar board-on-board on flat ground runs $45-$65 per linear foot installed — posts, concrete, hardware, all in. Horizontal Western Red Cedar slat fencing with concealed fasteners and a top cap runs $70-$100 per linear foot. Vinyl fence panels from CertainTeed or Bufftech typically land at $55-$80 per linear foot. Sloped lots add $10-$25 per linear foot depending on grade severity and whether stepped or raked installation makes more sense. Gates are quoted separately: a 4-foot walk gate with quality self-closing hardware runs $450-$650 installed; a double drive gate runs $950-$1,400. Exact pricing requires a site visit — no two Sammamish lots are the same. Free on-site estimate with line-item pricing, not ranges.

  - q: "Does Sammamish require a building permit to install a new fence?"
    a: |
      Most residential fences in Sammamish don't require a building permit if they're 6 feet or under on side and rear property lines, not located on a corner lot, and not functioning as a retaining wall. Corner lots trigger sight-triangle review, and any fence exceeding 6 feet requires a permit from City of Sammamish Development Services — not King County DPER. For properties inside HOA communities like Klahanie or Sahalee, HOA architectural review is a separate process that must be completed before installation begins. TopVolk is a WA Licensed Contractor and handles the full permit and HOA submittal preparation as part of every project — site plan, elevation drawings, material spec sheets, and the HOA application. That's included, not billed separately.

  - q: "Do you install horizontal slat fences? That style is everywhere in Sammamish right now."
    a: |
      Horizontal slat fencing is probably half the new fence work on the Sammamish Plateau right now, and it's a good fit for the 2000s-era architecture in 98075. The standard build is 1x4 or 1x6 Western Red Cedar slats, 3/8-inch gap, horizontal run, concealed stainless screws, with a beveled top cap that sheds water off the face boards. A few details matter for longevity: posts need to go deeper than with vertical board fencing because horizontal boards catch more lateral wind load; all cedar should be back-primed before install to slow weathering on north-facing surfaces; and the top cap overhang needs to be at least 1 inch to protect the top slat edge. Maintained with a biennial penetrating oil finish, this style holds up well in the PNW climate.

  - q: "What warranty comes with a new fence from TopVolk?"
    a: |
      Workmanship is covered for 2 years — if a post shifts, a rail bracket pulls loose, or a gate sags due to an installation error, it gets corrected at no charge. Material warranties vary by product: Western Red Cedar carries no manufacturer warranty, but properly installed and maintained cedar lasts 15-20 years in the Sammamish climate. CertainTeed vinyl fence panels carry a lifetime limited warranty against fading, cracking, and manufacturer defects. D&D Technologies TruClose gate hinges are rated for 500,000 cycles with no maintenance requirement. Beyond warranties, the contract includes a deadline penalty clause — if the agreed completion date slips due to TopVolk's scheduling, there's a financial penalty written in. Not a verbal commitment.

  - q: "Do you cover Issaquah, Redmond, and other cities near Sammamish?"
    a: |
      Coverage across the Seattle Metro east side is well established — Issaquah, Redmond, Kirkland, Bellevue, Mercer Island, and unincorporated King County including the Snoqualmie Valley are all in regular rotation. Permit jurisdictions vary: Issaquah has its own permit center, Redmond uses theirs, and some parcels east of Sammamish fall under King County DPER for unincorporated areas. Travel time is not a scheduling factor; Vladislav is on the plateau and the I-90 corridor regularly. Over 100 projects completed since 2017 across King, Snohomish, Pierce, and Kitsap counties — owner-operated, direct communication, no sales staff. Call (206) 591-1096 or request a free on-site consultation.