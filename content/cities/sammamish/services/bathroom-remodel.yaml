title: "Sammamish Bathroom Remodel — Plateau Homes, 1990s Build Problems Fixed"

intro: |
  Pine Lake sits in the middle of 98075, and the subdivisions ringing it — Klahanie, Trossachs, Inglewood Hill — share a bathroom problem nobody talks about at closing: builder-grade fiberglass surrounds and mortar-bed shower floors installed without a true waterproofing layer underneath. Twenty-five years of PNW humidity later, grout cracks, tile loosens, and the subfloor starts absorbing water long before the damage shows at the surface. Vladislav has retiled dozens of these showers across Sammamish since 2017 — 100+ projects completed in the Seattle Metro area — and the right fix always starts below the tile, not above it. Call (206) 591-1096 to schedule a free on-site walkthrough.

localContext: |
  The bulk of Sammamish's housing stock in 98074 and 98075 went up between 1996 and 2010 — large two-story homes with master baths sized for a luxury feel but finished with builder-grade materials. Klahanie-area homes from 1998-2005 are the most common candidates for full master bath reconfigurations right now. Original plumbing rough-ins in these houses often can't support a proper double-vanity or curbless shower conversion without moving supply and drain lines — work that requires a permit through King County DPER, not a DIY pull-and-replace. TopVolk Construction is a WA Licensed Contractor. Vladislav is your direct contact from first walkthrough to final inspection — no sales staff, no project manager relay.

commonProblems:
  - title: "No waterproofing membrane under original tile — mortar-bed construction from the 1990s"
    description: |
      Late-1990s Sammamish homes were built before Schluter Kerdi and RedGard became standard. Mortar-bed shower pans work until the grout fails — then water migrates straight to the plywood subfloor. The repair isn't cosmetic. Demo goes to studs, new cement board or foam backer goes in, and a proper waterproofing membrane system gets installed before a single new tile is set. Skipping that layer means repeating this job in five years. Deadline commitments are written into every TopVolk contract with a penalty clause — if the schedule slips, Vladislav pays, not you.

  - title: "Builder-grade vanities and inefficient layouts in oversized master baths"
    description: |
      A 120-square-foot master bath with one 36-inch vanity, a drop-in tub nobody uses, and a 3x3 shower feels cramped despite the square footage. Reconfiguring for a double-vanity with Kohler or TOTO fixtures and a curbless walk-in shower requires relocating the plumbing rough-in. In unincorporated Sammamish, that triggers a building permit through King County DPER — plan review runs 3-6 weeks. Factor that into the timeline from day one.

  - title: "Ventilation failures feeding mold growth behind large-format porcelain"
    description: |
      Builder-installed exhaust fans in Sammamish homes from this era run 50 CFM at best — not enough for a closed master bath on a north-facing wall. Sammamish averages 37+ inches of rain annually, and the plateau retains humidity longer than the valley floor. Mold colonizes the wall cavity behind tile before it appears at the grout line. Fix means upgrading to a 110+ CFM fan with humidity sensing, replacing the vapor barrier, and pulling all the tile that's been wicked through.

