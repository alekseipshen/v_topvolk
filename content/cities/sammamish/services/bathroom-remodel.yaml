  - q: "Do you work with Kohler, TOTO, and Grohe fixtures in Sammamish remodels?"
    a: |
      Yes — those three are the standard spec at this price point. Kohler for vanity faucets and toilets, TOTO for high-efficiency flush performance, Grohe for shower systems. All sourced from trade supply houses, not big-box retail, so lead times are predictable and product quality is consistent batch to batch.

  - q: "How long does a full master bath remodel take, and what's the permit process?"
    a: |
      A full scope — Schluter Kerdi waterproofing system, curbless shower conversion, double-vanity rough-in relocation, new tile, and finish work — runs 5-8 weeks of active construction. Add 3-6 weeks for King County DPER plan review if plumbing moves. Budget 10-14 weeks end-to-end from signed contract to blue tape walkthrough. TopVolk Construction LLC is a WA Licensed Contractor with 100+ projects completed since 2017 across King, Snohomish, Pierce, and Kitsap counties. Vladislav, not a project manager, is your direct contact throughout — and the deadline penalty clause means late delivery comes out of our pocket.