    a: "Sammamish is a straightforward run from Seattle via I-90 east, typically 35-45 minutes depending on traffic. For a panel upgrade or EV charger estimate, call (206) 591-1096 — Vladislav can usually schedule an on-site electrical visit within a few days. No call center, no sales staff, you talk directly to the contractor. He's pulled electrical permits through the City of Sammamish portal on projects in 98074 and 98075 both."
  - q: "Do you install Tesla Wall Connectors and ChargePoint EV chargers in Sammamish?"
    a: "Both Tesla Wall Connectors and ChargePoint units are common electrical installs in Sammamish. Vladislav runs the 50A or 60A dedicated circuit, handles the City of Sammamish electrical permit, and coordinates the PSE disconnect if a panel upgrade is part of the scope. JuiceBox and other NEMA 14-50 setups too. A standalone EV charger circuit permit often clears faster than a full panel upgrade — sometimes within a week if the load calculation is straightforward."
  - q: "What does a 200A panel upgrade cost in Sammamish, and how long does the project take?"
    a: "The physical electrical work on a panel swap typically runs one to two days. City of Sammamish plan review adds two to four weeks depending on load calculations and whether the meter base or service entrance cable also need replacing. Total cost varies — call (206) 591-1096 for a line-item quote specific to your address and existing service configuration. Deadline penalties are written into the contract. 100+ projects completed since 2017 across Seattle Metro."