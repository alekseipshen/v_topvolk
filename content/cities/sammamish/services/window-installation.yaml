  - q: "Which window brands do you install in Sammamish homes?"
    a: "Milgard Ultra fiberglass for high thermal performance, Pella Impervia for durability in
      wet exposure, Marvin Elevate when divided-light grilles and sightlines matter. Brand
      selection depends on your opening size, frame material compatibility, and Seattle Energy
      Code targets — we spec what fits the project, not what's cheapest to source."

  - q: "Does replacing windows in Sammamish require a permit, and what's the typical timeline?"
    a: "Retrofit replacements matching the existing rough opening are typically permit-exempt under
      King County DPER. Egress enlargements or new openings require a permit — plan 4–8 weeks
      for King County plan review. Full window replacement on a typical Sammamish two-story runs
      2–4 weeks from material delivery to final inspection, assuming no hidden rot in the rough
      openings. We handle the application as a WA Licensed Contractor and keep you updated
      directly — owner-led, no project managers relaying messages. Call (206) 591-1096 for
      project-specific answers."