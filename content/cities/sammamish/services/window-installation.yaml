title: "Sammamish Window Installation — IGU Seals, Egress & Rot Prevention"

intro: |
  Most homes on the Sammamish Plateau — subdivisions spreading east of Pine Lake in 98074 and
  98075 — were built between 2000 and 2015 with builder-grade double-pane Milgard vinyl windows.
  Twenty-plus years of PNW rainfall and those original frames are showing it: fogged glass from
  failed IGU seals, drafts at the sill plate, condensation tracking down interior glazing all
  winter. Vladislav at TopVolk handles the full scope — permit, flashing detail, and install —
  not just the swap. Direct quotes with line-item pricing, no vague ranges. Call (206) 591-1096
  to schedule an on-site look with the person doing the actual work.

localContext: |
  The 98074 and 98075 zip codes cover everything from the Trossachs neighborhood along East Lake
  Sammamish Parkway to the Timberline and Renaissance subdivisions further east. Most of the
  housing stock is two-story Pacific Northwest modern — 2,500 to 4,500 sq ft, often with large
  fixed-lite picture windows facing west toward Cascade views. Those oversized fixed units and
  flanking casements take sustained wind-driven rain off Lake Sammamish from October through
  March, stressing original frame weep holes and exterior flashing for months at a stretch.
  Neighborhoods near Inglewood Hill Road and the Issaquah Highlands border sit at slightly higher
  elevation, which adds freeze-thaw cycling to the stress — expansion and contraction that
  accelerates butyl spacer bar degradation faster than the lower plateau lots. Sammamish sits
  entirely in King County DPER jurisdiction, so permit timelines and plan review requirements
  follow their process, not the City of Seattle's SDCI portal.

commonProblems:
  - title: "Builder-Grade IGU Seal Failures in 2000s-Era Sammamish Homes"
    description: "Sammamish homes built 2000–2012 often shipped with builder-spec Milgard Tuscany or
      equivalent dual-pane units. Insulated glass units start failing around year 15–20 when the
      butyl spacer bar seal degrades, moisture infiltrates the airspace, and the glass fogs
      permanently. Frame condition determines whether IGU replacement alone works or full window
      replacement is the right call. On vinyl frames that have bowed or lost their compression
      seal at the sash corner welds, swapping just the IGU buys maybe two or three years before
      the next failure. Fiberglass frames — Milgard Ultra or Pella Impervia — hold dimension
      better in the thermal cycling Sammamish sees between summer and winter, and they're worth
      specifying on any full replacement project in this zip code."

  - title: "Egress Window Code Compliance for Finished Daylight Basements"
    description: "Sammamish has an enormous share of daylight basements finished as bonus rooms or
      legal bedrooms. IRC section R310 requires 44 sq inches minimum net clear opening height,
      20 inches width, and a sill no higher than 44 inches from the floor. King County DPER
      requires a permit for any egress enlargement — rough opening gets cut wider, a new LVL
      beam or double header goes in above, then a Pella or Marvin egress-rated unit drops in.
      The framing work is the bulk of the labor and cost here, not the window itself. Plan review
      at King County DPER typically runs 4–8 weeks for this scope. We handle the application as
      a WA Licensed Contractor and build the permit timeline into the project schedule."

  - title: "Hidden Rot at the Rough Opening Behind Improperly Flashed Frames"
    description: "The real damage usually isn't the glass — it's behind the frame. Rainwater wicking
      past a missing or misintegrated pan flashing soaks the OSB sheathing and king studs inside
      the rough opening. In Sammamish's ~37 inches of annual rainfall, that hidden rot can spread
      12–18 inches before it shows inside. Pulling back the exterior Hardie siding panel and
      repairing the framing before the new window goes in is standard scope on 10-plus-year
      installs. Proper flashing sequence matters: self-adhered membrane over the sill, pan
      flashing sloped to drain, face-sealed or back-dammed sill tape, then the new unit set into
      the opening with sill clips before the jamb extensions go on. Skipping steps here is how
      the next owner ends up with the same rot problem in another decade."

