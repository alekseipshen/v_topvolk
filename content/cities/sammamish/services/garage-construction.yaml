title: "Sammamish Garage Construction — ADU Builds, EV-Ready Slabs"

intro: |
  Most of the attached garages on the Sammamish Plateau were spec'd in 1998–2008
  — two-car bays with 7-foot doors, zero 240V capacity, and an attic above that
  nobody finished. That calculus has shifted hard. Under WA HB 1337, a
  single-family lot in Sammamish can now legally carry two ADUs, which means
  that same footprint can become a proper three-car detached garage with a legal
  dwelling unit above — and lots in Klahanie and Pine Lake are frequently large
  enough to make the numbers work. TopVolk Construction has been building
  garages across the plateau since 2017, including fiber-reinforced concrete
  slabs with 6-mil vapor barriers, Clopay insulated door packages for
  year-round workshop use, and 60A EV charger pre-wires during rough-in when
  the cost is a fraction of retrofitting through finished walls later.
  Vladislav Volkov handles each project directly — you're not talking to a
  salesperson or a project coordinator. The person quoting the job is the
  person building it.

localContext: |
  Sammamish sits almost entirely on plateau terrain at 400–500 feet elevation,
  with most residential lots platted between 1990 and 2012. Neighborhoods in
  zip code 98074 — Klahanie, Pine Lake — are dominated by 3,000–4,500 sq ft
  Craftsman-adjacent tract homes with attached two-car garages that are
  structurally integral to the main dwelling. Converting those spaces to
  living area means foundation work and structural modifications, not just
  drywall. Zip code 98075 covers the eastern plateau — Trossachs, Aldarra,
  East Lake Sammamish — where larger lots and more varied topography make
  detached builds more common but also more complex when slope requires
  retaining work before the foundation forms go in. Permit authority here
  is the City of Sammamish Building Division, not King County DPER (Sammamish
  incorporated in 1999 and runs its own permit center). Plan review timelines
  for a new detached garage with DADU run 8–12 weeks. The plateau receives
  roughly 37 inches of rain annually — vapor barrier under the slab and
  proper roof overhang on any accessory structure aren't optional in this
  climate. Water intrusion at the slab edge is the most common callback on
  under-detailed garage builds in this area.

commonProblems:
  - title: "Detached Garage Plus ADU Above: FAR Limits and Setback Compliance in Sammamish"
    description: |
      WA HB 1337 opened the door to DADU construction on Sammamish lots, but
      the City of Sammamish still enforces its own setback and lot coverage
      rules. Rear setbacks for a detached accessory structure are typically
      5 feet; side setbacks vary by lot width and can tighten on narrower
      parcels in Pine Lake and Klahanie. FAR calculations fold in both the
      garage floor area and the living space above — a 720 sq ft garage with
      a 650 sq ft unit overhead can exceed the allowable coverage on a
      smaller plateau lot without a variance. The AHJ requires permit-ready
      drawings including a dimensioned site plan, floor plans, and building
      elevations before plan review begins. TopVolk prepares that full package
      as part of the project scope — homeowners don't have to figure out what
      the reviewer needs. For a full detached garage-plus-DADU build in this
      zip code, budget $165,000–$230,000 depending on finishes, utility
      connection complexity, and site prep requirements.

  - title: "Matching the Exterior: Hardie Siding, Roof Pitch, and Trim on 2000s Plateau Homes"
    description: |
      Homes in Trossachs and Aldarra built between 1998 and 2010 almost
      universally used Hardie lap siding — often 6-inch exposure — with 4/12
      or 5/12 roof pitches and board-and-batten accents on gable ends. A new
      detached garage that doesn't replicate that pitch and profile looks like
      a storage unit dropped on the property. Sourcing the correct Hardie
      fiber-cement lap width, matching the fascia depth, and replicating the
      trim-band detail at the frieze requires measuring the existing house
      before framing begins, not during finish work. Roofing on the new
      structure typically matches in CertainTeed Landmark architectural
      shingle. Height also matters: DADU structures in Sammamish must stay
      under 24 feet at the ridge. Getting the roofline wrong can trigger a
      correction notice during the city's framing inspection. Exterior
      matching work adds roughly 10–15% to the siding and trim package versus
      a generic build, but it's the difference between a garage that reads
      as original and one that clearly wasn't.

  - title: "Concrete Slab Specs: Fiber Reinforcement, Vapor Barrier, and Drainage Grade"
    description: |
      A garage slab in Sammamish is the structural base for everything above
      it — door operation, long-term settlement, and moisture management all
      start here. Minimum spec is 4-inch thickness with fiber reinforcement
      throughout (not rebar alone on a residential pour), compacted gravel
      base, and a 6-mil poly vapor barrier between the gravel and the
      concrete. In this climate, drainage pitch matters: 1/8 inch per foot
      sloping toward the door opening keeps standing water from pooling at
      the back wall where a workbench or wall cabinet will eventually sit.
      The apron pour at the driveway transition needs fiber board expansion
      joints to prevent cracking at the threshold seam. The City of Sammamish
      requires a footing inspection before the slab pour — skipping that step
      means cutting up concrete to satisfy the inspector later. On sloped
      lots in Aldarra or East Lake Sammamish, retaining wall work before
      formwork can add $9,000–$20,000 depending on height and material
      selection.

  - title: "EV Charger Pre-Wire: Sub-Panel Sizing and 60A Circuit During Construction"
    description: |
      Sammamish has one of the highest EV ownership rates in King County —
      the Microsoft and Amazon workforce concentration here isn't coincidental.
      Roughing in a 60A dedicated circuit from the main panel to a sub-panel
      inside the garage during construction costs $1,200–$2,500 in added
      electrical work. Retrofitting that same circuit through a finished
      structure runs $3,500–$6,500 depending on panel location and wall
      assemblies. A 60A circuit handles a Level 2 hardwired charger — Bosch
      Power Max+ or a ChargePoint Home Flex unit — with enough capacity to
      add a second circuit for a second vehicle later. We also pre-wire a
      50A outlet on the opposite wall for workshop equipment or a future
      generator transfer switch. The electrical rough-in inspection is a
      required hold point before drywall hang under Sammamish's permit process,
      so the sequencing coordinates with the AHJ's inspection calendar from
      the start. Planning it at rough-in costs a fraction of what it costs
      to fix later.

  - title: "Insulation and Garage Door Selection for Year-Round Workshop Use on the Plateau"
    description: |
      A garage built only for parking needs minimal insulation. One built
      for a workshop, a home gym, or a conditioned space adjacent to living
      area above needs real thermal performance. Wall framing in 2x6 allows
      R-21 batts; the floor-ceiling assembly between the garage level and any
      living space above requires R-38 minimum per IRC, with acoustic
      consideration to reduce noise transfer from workshop tools. Standard
      steel garage doors with R-6 insulation lose heat through every panel
      seam — a real problem from October through April on the plateau.
      Clopay Gallery Series doors with R-16 polyurethane core and a dual-layer
      steel skin perform significantly better and meet the weatherstripping
      requirements for a conditioned space. For a heated workshop, a
      Mitsubishi mini-split on the garage level — typically a 9,000 or
      12,000 BTU unit — handles both heating and dehumidification. Installed
      cost runs $3,900–$5,400. MEP coordination for the mini-split happens
      during rough-in, when walls are open and line-set routing is simple.

faq:
  - q: "How fast can TopVolk get to Sammamish for a garage construction estimate?"
    a: |
      Sammamish is 30–40 minutes from our operating base — I-90 east to
      Issaquah-Sammamish Road, or SR-520 to Bellevue Way depending on traffic.
      We schedule free on-site consultations Tuesday through Saturday and can
      typically get out within 5–7 business days of your first call. The
      site visit is with Vladislav directly — not a sales rep. You get a
      written line-item quote within 48 hours of the walkthrough. If your
      project involves a DADU above the garage, bring your survey or plot
      plan to the consult if you have it — it saves 20 minutes on the setback
      conversation. Call (206) 591-1096 to get on the schedule.

  - q: "What does a new detached garage cost to build in Sammamish?"
    a: |
      A two-car detached garage in Sammamish — concrete slab, stick-frame
      walls, insulated Clopay door, basic electrical — runs $55,000–$88,000
      depending on size and site conditions. Add a finished DADU above and
      the range moves to $165,000–$230,000, including permits and utility
      connection. Sloped lots, complex soil, or custom exterior matching to
      an existing Hardie-clad house can move that figure higher. TopVolk
      provides fixed-scope contracts with line-item pricing — no vague
      ranges on a signed agreement. Deadline penalties are written into every
      contract. Schedule a free on-site estimate by calling (206) 591-1096
      and you'll have an actual number, not a ballpark.

  - q: "Does building a garage in Sammamish require a permit, and how long does that take?"
    a: |
      Any new garage structure in Sammamish requires a building permit through
      the City of Sammamish Building Division — this is not King County DPER
      territory, since Sammamish incorporated in 1999 and runs its own permit
      portal. For a standalone two-car garage, plan review typically runs
      4–8 weeks. Add a DADU above and expect 8–12 weeks, since the city
      reviews both the accessory structure and the ADU components separately.
      TopVolk handles the permit application, site plan, floor plans, and
      elevation drawings as part of the project scope. We're a WA Licensed
      Contractor with multiple permits submitted through Sammamish's system —
      we know what reviewers flag and how to avoid correction cycles that
      add weeks to the schedule.

  - q: "Can I add a living space or ADU above my new garage under Sammamish's zoning rules?"
    a: |
      Yes — WA HB 1337, effective 2024, allows up to two ADUs on a single-family
      lot statewide, including in Sammamish. A DADU above a detached garage
      counts as the detached unit. The full structure must stay under the
      24-foot height limit for accessory buildings, setbacks apply to the
      entire footprint, and a separate utility connection review is required
      if the DADU will have its own kitchen. Sammamish's FAR limits still
      apply, so a parcel-specific feasibility check is the right first step
      before drawing anything. That's part of what we cover at the initial
      consultation — free, no obligation. Call (206) 591-1096 and we'll
      walk through your site plan together.

  - q: "What insulation and weatherproofing do you include in a Sammamish garage build?"
    a: |
      Standard builds include a 6-mil poly vapor barrier under the slab, R-21
      batts in 2x6 walls, and a Clopay insulated door — R-12 minimum, R-16
      if the space will be used as a workshop or conditioned area. When living
      space sits above the garage, the floor-ceiling assembly gets R-38 batt
      insulation with a layer of acoustic-damping consideration between levels.
      Door perimeter weatherstripping and a threshold seal are included in the
      base scope. For heated garages, we rough in the Mitsubishi mini-split
      line set during framing so MEP coordination happens while walls are
      open. Sammamish's wet winters — 37 inches of rain, heavy mildew pressure
      on north-facing surfaces — make vapor management at the slab edge and
      rim joist blocking non-negotiable details, not upgrades.

  - q: "Does TopVolk build garages in nearby cities like Issaquah, Redmond, or Bellevue?"
    a: |
      Yes — garage construction is a core service across King and Snohomish
      counties. Issaquah and Redmond are direct neighbors to Sammamish, with
      similar housing stock and comparable permit processes through their own
      city building departments. Bellevue, Kirkland, and Renton are covered
      as well. Each city runs its own permit center with different review
      timelines — Bellevue and Redmond tend to be faster than Sammamish;
      Issaquah can run longer for ADU work. TopVolk has completed 100+
      projects since 2017 across this entire area. Call (206) 591-1096 —
      the initial consultation is free, and Vladislav handles every project
      personally from the first site visit through the final blue-tape
      walkthrough.