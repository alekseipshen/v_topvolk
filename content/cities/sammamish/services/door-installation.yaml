title: "Sammamish Door Installation — Beyond Builder-Grade Steel"

intro: |
  Pine Lake Road cuts through the denser residential buildout in 98075, and the entry doors on those 1998-2008 homes tell a consistent story: builder-grade steel skins, collapsed weatherstripping, and thresholds that no longer seat against the door bottom sweep. Soaring Eagle Regional Park funnels real wind in October and November — and at 450-plus feet in elevation, the Sammamish Plateau doesn't get the wind shelter that lowland neighborhoods do. The original OEM weatherstripping on a 2003 steel door has a 7-10 year lifespan under those conditions, and the sealing system fails silently until you're standing near the front entry in January feeling cold air moving across the floor. Vladislav Volkov at TopVolk Construction has completed 30+ door installations across Sammamish since 2017 — entry replacements, patio door conversions, and interior door packages during full remodels. A Therma-Tru or Pella fiberglass entry with proper pan flashing and a pressure-treated sill runs $2,500-$5,000 installed, well before you're paying to reframe a rotted rough opening.

localContext: |
  Most of Sammamish's housing stock falls into two rough buckets: the 98074 cluster of early-2000s developments around Inglewood Hill and the northern plateau, and the 98075 neighborhoods — Pine Lake, Trossachs, and the streets feeding off SE 8th Street — where building peaked between 2000 and 2010. Neither area has the century-old framing you'd deal with in Capitol Hill or Wallingford, but they have their own door-specific issues. Fiberglass exterior doors weren't standard spec on builder homes in 2003; most shipped with 24-gauge steel skins over polystyrene foam cores, and after 20 years of condensation cycling, the foam backer around the rough opening compresses and shrinks. Interior door packages from that era tend to be hollow-core slab doors with undersized casing profiles — fine for a $400,000 purchase price in 2003, less appropriate when the house appraises at $1.4 million and you're mid-remodel. The City of Sammamish Building Division handles permits locally; structural patio door conversions — widening an opening for a 12-foot multi-slide system, for instance — move through plan review before rough-in inspection can proceed.

commonProblems:
  - title: "Builder-Grade Steel Entry Doors Losing Their Weatherseal After 20 Years"
    description: |
      After two decades of King County rain cycling, the factory compression weatherstripping on a 2003-2006 builder steel door is typically beyond serviceability. The rubber bulb profile on the door stop compresses permanently, and the door bottom sweep either wears through the vinyl wiper or detaches from its aluminum carrier rail entirely. On homes in Trossachs and similar 98075 developments, the sill pan flashing — if there was any installed originally — often wasn't properly integrated with the housewrap, so when the sweep fails, water tracks along the threshold and soaks the OSB below the sill plate. A weatherstrip kit from a big-box store buys maybe one more season. The real fix is a full entry door replacement: a Therma-Tru Smooth-Star or Pella fiberglass pre-hung unit, a new pressure-treated sill, and a proper sill pan membrane lapped under the housewrap. Budget $2,800-$4,500 installed for a standard 3/0 x 6/8 opening, depending on hardware selection and whether the existing rough framing is square.

  - title: "Sliding Patio Door Replacement — Upgrading to Multi-Slide or French Systems"
    description: |
      A lot of Sammamish homes in 98074 and 98075 were built with 6-foot aluminum-frame sliding patio doors that made sense at a 2002 price point but feel dated once the rest of the house gets updated. Converting to a Milgard multi-slide or Andersen E-Series folding system in the 8-12 foot range means structural work: the existing rough opening gets widened, which requires an LVL beam properly sized to the new span, correct trimmer and king stud configuration, and a building permit from the City of Sammamish. Plan review for a structural alteration typically runs 3-6 weeks. The glass door system alone runs $6,000-$16,000 in materials depending on width and glass package; installed with structural framing, budget $14,000-$28,000. The structural rough-in takes 2-3 days on-site; finish work and final inspection follow 3-4 days after the door unit arrives — and Milgard lead times on multi-slide orders currently run 4-8 weeks, so project sequencing matters.

  - title: "Interior Door Swing Conflicts and Casing Work During Remodels"
    description: |
      During a full kitchen or bathroom remodel in Sammamish, interior door swings frequently conflict with the new layout. A bathroom door that previously cleared the vanity now swings into a larger cabinet run or a new shower wall, and changing the swing direction — or converting to a pocket door — requires rebuilding the rough opening, not just swapping the slab. Hollow-core doors from 2003 also have undersized jamb stock that doesn't accept the heavier solid-core pre-hung units most homeowners want in a higher-end remodel. Switching to a 1-3/8" solid-core slab with a craftsman or colonial casing profile requires verifying the rough opening is plumb and correctly dimensioned. TopVolk Construction holds a WA Licensed Contractor credential and handles interior door packages as part of broader remodel scopes; a like-for-like interior swap doesn't need a permit, but structural pocket door conversions go through City of Sammamish plan review. Timeline for an interior door package inside a remodel runs 1-2 days of finish work.

  - title: "Smart Lock Retrofit When the Door Hardware Doesn't Cooperate"
    description: |
      August Wi-Fi Smart Lock Pro and Schlage Encode are the two most common smart lock installs in Sammamish — both require a standard 2-1/8" deadbolt bore properly spaced from the edge bore. Most original builder doors have this right, but a 20-year-old door with multiple retrofit attempts often has an off-center bore from a previous hardware swap, or a latch plate that's stripped and no longer holds the throw cleanly against the strike plate. If the door skin is dented around the lockset or the door has racked enough that the deadbolt binds under load, a smart lock install turns into a door replacement conversation fast. On a new fiberglass door installation, bore locations get coordinated to the hardware spec before the unit ships — the Schlage Encode or August Pro goes in square the first time. Hardware runs $200-$600 for either unit; bundled with a full entry door replacement, the smart lock integration adds about 30 minutes of additional labor.

  - title: "Garage Door Replacement — Insulated Panels That Meet Current Energy Code"
    description: |
      Most garage doors on Sammamish homes from the early 2000s are single-layer or double-layer steel with minimal thermal performance — R-6 to R-9 is typical on those units. The current Washington State Energy Code references IRC requirements for R-12 or better on garage doors adjacent to conditioned living space, which covers most attached garages in 98074 and 98075. The correct fix is upgrading to a triple-layer insulated door with a polyurethane foam core — not polystyrene — in the R-16 to R-18 range. Clopay and Wayne Dalton both offer R-18 polyurethane-core panels fitting standard 9x7 and 16x7 openings without modifying the rough frame. Budget $1,200-$2,800 installed for a single door, $2,200-$4,500 for a double. Replace the perimeter weatherstripping and bottom seal at the same time — a new seal set runs $80-$120 in materials and closes the most common air infiltration paths. Torsion spring and opener systems past 15 years should be evaluated for replacement concurrently to avoid a callback inside year two.

faq:
  - q: "How fast can you get to Sammamish for a door installation consultation?"
    a: |
      Sammamish is about 25-30 minutes from Seattle via I-90 East — straightforward access to the plateau via SE 8th Street or Issaquah-Pine Lake Road depending on which part of town you're in. Same-day visits aren't typical, but a free on-site consultation is usually available within 3-5 business days. That visit is with Vladislav directly — you get a line-item written quote, not a vague estimate phoned in by a scheduler. Material lead times on fiberglass entry doors (Therma-Tru, Pella) run 2-6 weeks depending on the profile and hardware package; installation itself is 1-3 days once materials are staged on-site. Call (206) 591-1096 to get on the schedule.

  - q: "What does entry door installation cost in Sammamish?"
    a: |
      A fiberglass pre-hung entry door in a standard 3/0 x 6/8 rough opening runs $2,500-$5,000 installed, including pan flashing, new threshold, and hardware. Steel doors cost less ($1,800-$3,200) but develop rust around the deadbolt bore and edge trim after 15-20 years in King County conditions. Solid wood entry doors — common in higher-end Sammamish homes — run $4,000-$9,000 or more installed; they look excellent but move seasonally with the humidity cycle. Structural patio door conversions with LVL beam work and a new multi-slide system run $14,000-$28,000 depending on opening width. All pricing comes from a free on-site estimate with exact line items — no vague ranges, no surprise change orders mid-project. Call (206) 591-1096 to schedule.

  - q: "Does replacing an entry door in Sammamish require a permit from the city?"
    a: |
      A like-for-like door swap in the same rough opening — same size, no structural changes to the surrounding framing — typically does not require a building permit from the City of Sammamish Building Division. Structural work is a different situation: widening a rough opening, adding a new door where there wasn't one, or converting a wall section to a multi-slide patio system all require plan review. The City of Sammamish uses its own online permit portal, and plan review for a standard structural alteration runs 3-6 weeks. TopVolk Construction is a WA Licensed Contractor and handles the full permit application, drawings, and inspector coordination — rough-in and final inspections included. The homeowner doesn't need to manage the permit paperwork separately.

  - q: "Fiberglass vs. steel vs. wood — which entry door holds up best on the Sammamish Plateau?"
    a: |
      For the Sammamish climate — 37 inches of rain annually, plateau wind exposure, and humid summers — fiberglass outperforms both steel and wood over the long run. Steel doors are serviceable when the coating stays intact, but surface rust around the deadbolt bore and edge trim is common after 15-20 years in this environment. Wood doors expand and contract with the seasonal humidity swing; a door that latches perfectly in July can fight you every November. Fiberglass — Therma-Tru, Pella, or ProVia — doesn't rust, doesn't move with humidity, and holds paint or stain without the maintenance cycle wood demands. For homes in Trossachs or along the Inglewood Hill corridors where curb appeal is part of the investment, a fiberglass door with a factory woodgrain finish reads like real wood from the street. Pair it with Schlage or Baldwin hardware, not builder-grade.

  - q: "How long should a new entry door last, and what's covered under warranty?"
    a: |
      A fiberglass entry door with quality hardware runs 30-50 years with normal maintenance. Therma-Tru and Pella both carry limited lifetime warranties on the door slab itself. The components around the door have shorter service cycles: weatherstripping lasts 10-15 years, door bottom sweep inserts 5-10 years depending on traffic and threshold adjustment. The critical long-term detail is the sill pan below the threshold — if water is getting under the door bottom and sitting on the subfloor, the OSB and sill framing can fail well before the door does. A proper installation includes a sloped sill pan membrane lapped under the housewrap; that detail separates a door performing for 30 years from one creating a rot problem in 8. TopVolk Construction warranties the installation work separately from the manufacturer warranty, with deadline penalties written into the contract on project-scope work.

  - q: "Do you cover Issaquah, Redmond, and other cities near Sammamish?"
    a: |
      Sammamish sits between Issaquah to the south, Redmond to the north, and Bellevue to the west — all within the same service run. TopVolk Construction covers King County including Sammamish, Issaquah, Redmond, Kirkland, Bellevue, and Mercer Island for door installation projects. Snohomish County work in places like Woodinville and Redmond Ridge is also in range. Permit jurisdictions differ by city — Redmond, Kirkland, and Bellevue each have their own permit centers, and the AHJ for your project determines the application process; TopVolk handles that coordination regardless of jurisdiction. Scheduling typically runs 1-2 weeks out for initial consultations, with spring and fall slots filling fastest across the Seattle Metro. Call (206) 591-1096 to check current availability — Vladislav handles all scheduling calls directly.