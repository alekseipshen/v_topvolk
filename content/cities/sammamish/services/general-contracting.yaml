title: "Sammamish General Contracting — Whole-House Remodels on the Plateau"

intro: |
  Trossachs and Pine Lake were built out fast in the late 1990s. Douglas-fir framing, engineered floor systems — solid bones. But the kitchens are dated. The bathrooms haven't been touched since move-in. Homeowners in 98074 and 98075 are now doing full gut renovations: Sub-Zero column refrigerators replacing stacked side-by-sides, curbless showers where old tubs used to sit. TopVolk Construction is a WA Licensed Contractor with 100+ projects since 2017. Vladislav coordinates permits through the City of Sammamish and manages every trade from rough-in through blue tape walkthrough.

localContext: |
  Homes along Beaver Lake Road and near Lake Sammamish went up between 1995 and 2008. The framing holds. The rest hasn't aged as well. Crawlspaces are wet — the Plateau gets 40+ inches of rain a year, and a lot of these homes have no vapor barrier or a failed one. Original wood decks rotted out. Mechanical systems are overdue. Zip codes 98074 and 98075 are dense with two-story tract homes where a full renovation means vapor barriers, Trex composite decking, and complete kitchen and bath overhauls.

  The City of Sammamish runs its own permit portal. It's not King County DPER. Plan review for structural or multi-trade work takes 4–8 weeks. The building department is small. Submit an incomplete package and you wait another full cycle — not a quick fix.

commonProblems:
  - title: "City of Sammamish permit coordination on full-scope remodels"
    description: |
      Sammamish has its own building department — not King County DPER. A job touching structural framing, electrical, and plumbing means separate permit applications with concurrent plan review. That review runs 4–8 weeks. Submit an incomplete set and you add another full cycle. TopVolk submits complete drawings upfront. That alone prevents most delays. Missed rough-in inspection windows compress the drywall hang — and everything after it. Call (206) 591-1096 to go over what your scope will require before you pick a start date.

  - title: "Multi-trade scheduling gaps that stall a job mid-build"
    description: |
      Framing rough-in stays open until electrical, plumbing, and HVAC rough-ins are done and inspected. On homes getting a Mitsubishi mini-split or a Navien tankless water heater, the mechanical and plumbing subs hit narrow inspection windows in sequence. One missed appointment pushes drywall back a week. That week compounds through finish carpentry, tile, and cabinet installation. Vladislav manages the sub schedule directly. Deadline penalty terms go into every contract — the risk of that cascade falls on TopVolk, not the homeowner.

  - title: "LVL beam surprises when opening walls for an open-concept kitchen"
    description: |
      Most 1990s Sammamish tract homes have load-bearing walls between the kitchen and living space. Original headers were sized minimally. Demo regularly turns up an undersized span that needs a proper LVL beam and PSL post. That is a structural change order — typically $3K–$8K in materials and labor. Budget for it before demo starts, not after the wall is down. A pre-demo site walk with Vladislav catches these early.

faq:
  - q: "How fast can you get to Sammamish for a General Contracting consultation?"
    a: |
      Sammamish is 30–45 minutes from Seattle via SR-520 or I-90 through Issaquah. Vladislav schedules on-site walkthroughs directly — no scheduling staff, no phone tag. Call (206) 591-1096. Same-week availability is typical.

  - q: "Do you coordinate premium appliance integration — Wolf ranges, Thermador columns, Miele dishwashers?"
    a: |
      A Wolf 48" range needs reinforced countertop support and a correctly sized gas line. Those rough-in dimensions have to be set before the cabinet layout is finalized — not after delivery. Thermador column refrigerators and Miele dishwashers are panel-ready. Cabinet opening widths are spec'd to the quarter inch. TopVolk coordinates those dimensions with the cabinet installer before anything is built. Sammamish kitchens in the $150K+ range pair these appliances with semi-custom or full-custom cabinetry. There is zero tolerance for field adjustments once it's in.

  - q: "What does a full kitchen and primary bath remodel realistically cost in Sammamish, and how long does it take?"
    a: |
      Full kitchen and primary bath gut renovations in 98074 typically run $120K–$180K with high-end finishes. That includes quartz countertops, large-format porcelain tile, Schluter Kerdi waterproofing in the shower, and Kohler or Moen fixtures. City of Sammamish plan review adds 4–8 weeks before demo begins. Construction runs 10–16 weeks after permit issuance. End-to-end: roughly 5–6 months. Deadline milestones with penalty terms are written into every contract. Call (206) 591-1096 for a line-item estimate — no vague ranges.