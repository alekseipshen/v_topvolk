title: "Sammamish General Contracting — Built Right on the Plateau"

intro: |
  The Sammamish Plateau — zip 98074 and 98075, east of Lake Sammamish — runs on homes built between 2000 and 2015.

  Builder-grade cabinetry and a 30-inch entry-level range don't match the house price anymore. Vladislav Volkov handles general contracting on the Plateau. WA Licensed Contractor, 100+ projects since 2023. That includes Wolf range integrations requiring structural header work, dedicated circuits, and permit drawings before a single cabinet came out. Call (206) 591-1096 to schedule a free on-site walkthrough with Vladislav directly — no sales staff, no middlemen.

localContext: |
  Most homes in 98074 sit in master-planned neighborhoods — Trossachs, Pine Lake, Beaver Lake — with HOA rules affecting exterior changes, additions, and fence heights.

  Permits here go through the City of Sammamish Building Division. Not King County DPER.

  Plan review runs 6-10 weeks for major work. Mid-2000s construction means builder-grade framing throughout: undersized headers over openings, minimal attic insulation, and crawlspace vapor barriers that often fall short of current IRC energy requirements. Identifying those gaps before demo starts — not mid-project when the permit inspector shows up and the framing doesn't match the drawings — is the job of a general contractor who's actually read the plans before pricing the job.

commonProblems:
  - title: "Undersized Headers Found During Demo on Mid-2000s Plateau Homes"
    description: "Open a load-bearing wall in a 2005 Sammamish home. The original header is often a doubled 2x10 where an LVL beam is structurally required. Engineering review, revised permit drawings, and a structural inspection add 2-4 weeks and $3,000-$6,000 to the budget — before a single cabinet gets ordered. This pattern repeats across Trossachs, Beaver Lake, and Pine Lake homes that were framed fast during the mid-2000s building boom. A general contractor flags it during the walkthrough. Before the permit drawings go in. Before the schedule is locked. That's the difference between a project that finishes on time and a kitchen that sits open-framed for three extra months while revised structural drawings work through the City of Sammamish Building Division plan review queue — and a homeowner absorbs both the delay and the carrying cost."
  - title: "Multi-Trade Scheduling Gaps on $150K-Plus Remodels"
    description: "No single GC means no one owns MEP coordination. Framing, electrical rough-in, plumbing, and HVAC ductwork each need a separate inspection sign-off before drywall goes up. Sub availability gaps stretch a 10-week kitchen remodel into 20 weeks. Missed deadlines cost TopVolk money — that penalty is written into the contract."
  - title: "ADU Projects Hitting Lot Coverage Before Square Footage"
    description: "WA HB 1337 allows two ADUs per single-family lot. Sammamish zoning still enforces lot coverage maximums and setbacks — a DADU on a typical Plateau lot can hit 40% coverage before it reaches 800 sq ft. Permit drawings must show all existing impervious surface: driveways, patios, current footprint. The City rejects on first review if that math is missing. General contracting for ADUs here means submitting complete drawings the first time."

faq:
  - q: "How far is Sammamish from your base, and do you serve the Plateau regularly?"
    a: "30-40 minutes from Seattle via I-90 East. Sammamish is covered. Call (206) 591-1096 to schedule a free walkthrough with Vladislav."
  - q: "Do you handle kitchen remodels with Sub-Zero or Thermador integration?"
    a: "Yes. Sub-Zero refrigerator columns need panel-ready cabinet framing and a dedicated 240V circuit. Thermador ranges require proper CFM range hood calculation and sometimes a modified structural header depending on the opening width. Wolf and Miele dishwashers each have specific rough-in dimensions that affect cabinet layout before a single measurement goes on paper. All of that goes into permit drawings before demo starts — standard general contracting scope on a Sammamish kitchen remodel, not an afterthought discovered at rough-in inspection. Vladislav puts it in the drawings, not in a change order."
  - q: "What does the permit process look like for a major remodel in Sammamish?"
    a: "The City of Sammamish Building Division handles permits — not King County DPER. A full kitchen or whole-home remodel needs architectural drawings plus an engineer stamp for any beam work. Budget 6-10 weeks for plan review, then 4-7 months for construction including rough-in and final inspections. Missed deadlines cost us money — that penalty is written into the contract. Call (206) 591-1096 to talk through the timeline before anything gets scheduled."