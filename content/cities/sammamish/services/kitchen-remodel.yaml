title: "Sammamish Kitchen Remodel — Open Layouts for 1990s Plateau Homes"

intro: |
  Most of the Sammamish Plateau — from Klahanie near 98074 out toward the
  developments along East Lake Sammamish Parkway — was built between 1990 and
  2008. Wolf 36-inch dual-fuel ranges and Sub-Zero column refrigerators show
  up constantly in remodel wish lists out here, but the original 100A panels
  and closed galley layouts weren't designed for them. Getting from the current
  kitchen to the one clients actually want means structural work, electrical
  upgrades, and a permit — often all three at once.

localContext: |
  Zip code 98074 covers the east Sammamish Plateau — 1990s two-story colonials
  and split-levels with walled-off kitchen footprints and builder-grade finishes
  that were fine for 1997 and are now cramped by modern standards. Sammamish
  pulls the full 37 inches of annual rainfall; kitchen exhaust in many of these
  homes is undersized for the actual steam load. Most Sammamish permits run
  through the City's own building department — not King County DPER — which
  has its own plan review queue, typically 4–8 weeks for structural and
  electrical work.

commonProblems:
  - title: "Load-Bearing Walls Blocking Open-Concept Layouts"
    description: |
      A large share of homes in 98074 and 98075 have load-bearing walls
      between the kitchen and family room — walls that carry the original floor
      joists or roof truss load. Removing them requires a structural engineer's
      stamp, a permit through the City of Sammamish building department, and a
      properly sized LVL beam or PSL post set into the bearing plane. Skip the
      engineer and you're looking at settling, cracked drywall, or a failed
      rough-in inspection.
  - title: "Undersized Electrical Panels for Sub-Zero and Induction"
    description: |
      Wolf dual-fuel ranges pull 50 amps. A Sub-Zero 48-inch panel-ready
      column adds another 15. Add a Bosch dishwasher and recessed lighting
      on dimmer-compatible LED circuits, and a 100A panel is at its limit.
      Upgrading to 200A service requires a permit, coordination with PSE
      (Puget Sound Energy), and sequencing the electrical rough-in before
      cabinet installation — not something to figure out after demo.
  - title: "Builder Soffits Killing Cabinet Height and Range Hood CFM"
    description: |
      1990s Sammamish kitchens routinely have soffits above the upper cabinets
      — 12 to 16 inches of boxed-out framing that blocks taller cabinet runs
      and forces undersized range hoods with inadequate CFM for a Thermador or
      Wolf range. Tearing them out usually exposes old HVAC ducts or electrical
      runs that need rerouting before drywall hang and finish work can start.
      It's demo work, but it unlocks the whole layout.

faq:
  - q: "How fast can you get to Sammamish for a kitchen remodel consultation?"
    a: |
      Sammamish is an easy run from our base — SE 8th Street and
      Issaquah-Pine Lake Road are both direct routes in. Vladislav does
      on-site walkthroughs, not phone estimates. Call (206) 591-1096 to
      schedule — usually available within a few days.
  - q: "Do you work with Sub-Zero, Wolf, and Thermador appliances in remodels?"
    a: |
      Yes — all three show up regularly in Sammamish projects. Sub-Zero
      panel-ready columns require exact cabinet opening tolerances and
      dedicated circuits. Wolf dual-fuel ranges need properly sized gas lines
      and range hood CFM matched to BTU output. The rough-in gets spec'd
      before appliances arrive, not after cabinets are set.
  - q: "What does a full kitchen remodel cost and how long does permitting take?"
    a: |
      Full gut-and-remodel in Sammamish typically runs $80K–$160K depending
      on layout changes and appliance tier. The City of Sammamish permit
      center handles structural and electrical review — plan review runs 4–8
      weeks. Total timeline from permit submission to blue tape walkthrough:
      10–16 weeks. TopVolk is a WA Licensed Contractor with 100+ projects
      since 2017 — and missed deadlines carry penalties written into the
      contract. Call (206) 591-1096 for a line-item quote.