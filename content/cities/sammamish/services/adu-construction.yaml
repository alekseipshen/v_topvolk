title: "Sammamish ADU Construction — Plateau Lots, Real Returns"

intro: |
  The Sammamish Plateau has something most suburbs east of SR-520 don't — large, flat lots in 98074 and 98075 where a 640-square-foot DADU fits comfortably without hitting setback lines. WA HB 1337 passed in 2024 and cleared the way for two ADUs per single-family lot statewide. A finished detached unit with a Mitsubishi mini-split and Bosch appliances in this corridor rents for $2,200–$2,800 a month. That's real cash flow on land you already own — and Sammamish has some of the most buildable rear lots in King County.

localContext: |
  Most Sammamish homes were built 2000–2015 — modern Pacific Northwest construction with engineered lumber, energy-code insulation, and large footprint layouts that often include unfinished basements ideal for an AADU conversion. The 98075 zip code in the Beaver Lake and Education Hill corridors sees heavy DADU interest because rear lots frequently run 9,000–14,000 sq ft with accessible rear yards and manageable grade. No knob-and-tube wiring or post-and-pier foundations like the 1910 Craftsmans in Wallingford — utility separation for a detached unit here is significantly cleaner to engineer.

commonProblems:
  - title: "City of Sammamish Permit Review — Not King County DPER"
    description: "WA HB 1337 sets statewide minimums, but the City of Sammamish runs its own permit center — not King County DPER. A DADU requires a full building permit with site plan, foundation design, and MEP drawings. Plan review typically runs 4–8 weeks from a complete submission. Height stays capped at 24 feet, rear setbacks still apply under the new law, and FAR plus lot coverage need to be checked before plans are drawn — catching that early saves a redesign."
  - title: "Shared vs. Separate Utility Connection — The Decision That Moves Costs Most"
    description: "Not every DADU needs its own water and sewer tap. A shared connection with a sub-meter is often allowed and far cheaper than digging a new side sewer line to the street. But if the existing main is undersized — which shows up on Sammamish homes built before 2005 — a plumber needs to verify capacity before the City approves the permit. That step gets skipped more often than it should. Budget $8,000–$18,000 for utility work depending on your connection strategy."
  - title: "Finish Level vs. Vacancy Risk in a $181K Median Income Corridor"
    description: "Renters in 98074 and 98075 walk away from builder-grade units fast. A curbless shower with large-format porcelain tile, Bosch dishwasher, quartz counters, dimmer-compatible LED recessed lighting, and a Mitsubishi mini-split for year-round comfort — these details get a 3-to-5-year tenant instead of a 12-month renter. Sammamish DADUs with quality finishes have been renting at $2,200–$2,800/month. The upgrade pays back faster than the vacancy math suggests."

faq:
  - q: "How fast can you get to Sammamish for ADU Construction?"
    a: "From the Seattle metro, Sammamish is 25–35 minutes via SR-520 to 228th Ave NE, or I-90 to Issaquah then north. On-site consultations are with Vladislav directly — no sales staff or commissioned closer. Call (206) 591-1096 to schedule. TopVolk Construction LLC is a WA Licensed Contractor with 100+ projects completed since 2023 across King and Snohomish counties."
  - q: "Can I build a DADU if I already have an attached ADU on the lot?"
    a: "Yes — WA HB 1337 (2024) explicitly allows one AADU and one DADU on the same single-family lot statewide. The City of Sammamish reviews each structure under its own permit, but they can be sequenced separately rather than run simultaneously. We've navigated AADU-plus-DADU combinations in King County before and can walk through the order of operations with you on-site."
  - q: "What does a DADU in Sammamish typically cost, and how long does construction take?"
    a: "A 600–800 sq ft detached ADU on the Plateau typically runs $180,000–$280,000 fully finished. Foundation type, utility connection strategy, and finish level move the number — panel-ready Bosch appliances and Kohler fixtures push toward the top. Permitting adds 6–12 weeks before framing starts. Total timeline from first site visit to final inspection: 4–7 months. Deadline penalties are written into every TopVolk contract — not just mentioned in a handshake."