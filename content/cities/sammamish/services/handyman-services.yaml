title: "Sammamish Handyman Services — Punch Lists, Repairs & Smart Installs"

intro: |
  The Sammamish Plateau's large HOA subdivisions — Trossachs, Pine Lake, Eastridge — have a
  specific backlog problem that shows up in homes built between 1995 and 2010. A kitchen or
  bath remodel wraps up, the general contractor moves on, and a punch list of small items
  sits unfinished for months. The Moen Align faucet trim ring still needs silicone. The new
  cabinet pulls are installed crooked. The bathroom door won't latch because the strike plate
  shifted during demo. These aren't emergencies, but in a home where the countertops cost
  $14,000, they're not invisible either. TopVolk Construction LLC handles exactly this kind
  of work — owner-operated by Vladislav Volkov, WA Licensed Contractor, with 100+ projects
  completed since 2017 across King and Snohomish counties. Sammamish is about 25 minutes via
  SR-202 from our typical routing. Call (206) 591-1096 and you reach Vladislav directly — not
  a dispatcher, not a scheduler.

localContext: |
  Sammamish was incorporated in 1999, and most of its housing stock was built between 1992
  and 2014 — HOA subdivisions and custom builds on the Plateau, now hitting their 15-25 year
  mark where builder-grade fixtures, weatherstripping, and finishes need replacing. In 98074,
  neighborhoods like Trossachs and Eaglemont have homes with original foam door seals, first-
  generation recessed lighting trims, and drywall texture that was sprayed once in 1997 and
  never touched again. In 98075, the Pine Lake and Beaver Lake corridors skew newer and
  heavier on custom finishes — which means patch and texture work requires closer color and
  pattern matching to avoid obvious repairs. Pacific Northwest weather adds pressure: October
  through May, the Plateau gets sustained rain and humidity that compresses door sweeps flat
  within 8-10 years and causes minor ceiling drywall damage wherever a bathroom exhaust fan
  has been back-drafting into an attic cavity. Sammamish's incorporated city permit office
  handles any work that requires a permit — separate from King County DPER, which covers
  unincorporated areas nearby.

commonProblems:
  - title: "Remodel Punch Lists Left Unfinished After the GC Moves On"
    description: |
      Kitchen and bathroom remodels in Sammamish routinely end with a punch list nobody comes
      back to close out. The GC has moved to the next project. You're left with a Schluter
      Kerdi-Band tile transition that needs a final silicone bead, a recessed light trim ring
      sitting in its box on the counter, and a cabinet door that's off its hinge by 3mm.
      TopVolk specifically takes this work on. A typical punch list visit runs 4-6 hours; lists
      with drywall touch-ups plus hardware installs can stretch to a full day. Vladislav reviews
      the list before scheduling so the truck arrives with the right materials — no second trip
      because a screw size was wrong. Cost for punch list work generally falls between $450-$950
      depending on how many line items are involved. Call (206) 591-1096 to walk through your
      list and get a flat quote before anyone shows up.

  - title: "Drywall Patches That Don't Match the Existing Texture"
    description: |
      Homes in 98074 built in the late 1990s were finished with skip-trowel or orange-peel
      texture — applied with spray equipment and compound ratios that don't match what's on the
      shelf at the hardware store today. A patch over a cable hole or a door-handle impact can
      look visibly worse than the original damage if the texture isn't matched carefully. The
      correct process: cut the patch square, set drywall with appropriate screws into backing
      or a California patch, coat with joint compound, let it cure, apply PVA primer, then
      texture to match. After texture dries, feather the edges with a skim coat, re-prime, and
      paint. Getting the paint to blend on a wall that's been touched up twice over 25 years is
      often the harder step — test patches are done before committing. Single-patch repairs
      typically run $275-$475. Multiple patches on the same wall are quoted together.

  - title: "Fixture Swaps That Fall Into a Trade Gap"
    description: |
      Replacing a Kohler toilet, a Moen Arbor kitchen faucet, or a bathroom vanity light
      fixture is a two-hour job that most plumbers and electricians won't take as a standalone
      call — their minimums make it economically impractical for a homeowner. That gap is where
      handyman work fits. A faucet swap means shutting off the supply line, removing the old
      unit, cleaning the sink deck, setting the new faucet with correct supply line torque, and
      checking for leaks under load. Toilet replacement includes a new wax ring, supply line
      replacement, and seat install. Light fixture swaps involve capping existing wiring and
      mounting the new fixture — no panel work required. Most fixture installs are completed
      same day. Pricing runs $165-$325 per fixture depending on access conditions and whether
      shutoff valves need to be replaced because they've seized from years without being
      cycled.

  - title: "Weatherstripping Failures on Exterior Doors and Windows"
    description: |
      By year 20, the original foam weatherstripping on exterior doors in Sammamish is
      compressed flat and the door sweep is torn or missing sections entirely. October through
      April, that gap is measurable — a 36-inch front door with a failed sweep and compressed
      side seals can lose as much heat as leaving a window cracked. The right fix: remove the
      old sweep, clean the threshold surface, and install a heavy-duty aluminum door sweep with
      a replaceable rubber seal — not foam tape. For wood doors that have swollen or racked
      slightly, the strike plate may need repositioning and the door edge re-planed at the
      latch. Casement window weatherstripping replacement typically means pulling the sash and
      replacing the full perimeter bulb seal. A standard exterior door weatherstrip job runs
      $130-$220 per door, depending on door width and condition. Multi-door projects are quoted
      together and cost less per door.

  - title: "Smart Home Device Installs That Stall on Wiring Surprises"
    description: |
      Sammamish homeowners frequently buy a Ring Video Doorbell Pro 2 or an Ecobee SmartThermostat
      and discover the install is blocked by a wiring condition the product manual doesn't
      address. The existing doorbell transformer is 10V AC, not the 16-24V the Pro models need.
      The furnace control board is missing a common (C) wire, which the Ecobee requires for
      continuous power. These are fixable problems, but they require low-voltage wiring knowledge
      — not just app setup. TopVolk installs video doorbells with transformer upgrades if needed,
      smart thermostats with C-wire additions when required, and Lutron Caseta dimmer switches
      with neutral wire assessment before quoting. Pre-2005 Sammamish homes often have switches
      without a neutral wire — Lutron Caseta handles this with a no-neutral option in most
      cases, but it needs to be verified. Standard smart thermostat install including C-wire
      add: $160-$265. Doorbell camera with transformer upgrade: $180-$320.

faq:
  - q: "How fast can you get to Sammamish for handyman work?"
    a: |
      Sammamish is about 25-30 minutes from our typical routing via I-90 east to Issaquah-
      Sammamish Road, or SR-202 depending on starting point and traffic. Scheduling is direct —
      call (206) 591-1096 and you're talking to Vladislav, not a call center. For most handyman
      jobs in 98074 or 98075, we can typically get on-site for an estimate within 3-5 business
      days, with work scheduled 1-2 weeks after that. Pre-listing punch list jobs get
      prioritized when the calendar allows. Travel to Sammamish is factored into the job quote —
      no separate trip charge line item added after the fact.

  - q: "What does a typical handyman visit in Sammamish actually cost?"
    a: |
      Scope drives the number entirely. A single fixture swap — faucet, toilet, vanity light —
      typically runs $165-$325. A full punch list day covering 8-12 small items (caulking,
      hardware installs, drywall touch-ups, door adjustments) usually runs $500-$950 for a
      full work day. Weatherstripping on two exterior doors runs $275-$425. Smart device installs
      fall between $150-$320 depending on wiring conditions. There's no hourly rate — every
      job gets a written flat quote before work starts. Call (206) 591-1096 or schedule a free
      on-site consultation to get an exact number.

  - q: "Do Sammamish HOA communities require approval before exterior repairs?"
    a: |
      Many of Sammamish's subdivisions — Trossachs, Eastridge, Pine Lake — have Architectural
      Control Committees that review exterior changes. Interior work (fixture swaps, drywall
      patches, smart thermostat installs) doesn't require HOA review. Exterior work — replacing
      a front porch light fixture, repainting trim in a different sheen, repairing deck boards
      with a different lumber species — can trigger an ACC submittal, which typically takes
      2-4 weeks for review. For permit-required work, Sammamish is an incorporated city with
      its own permit portal — not King County DPER. TopVolk handles permit paperwork where
      required and can advise on what triggers a review versus what doesn't before the project
      starts.

  - q: "Can you repair deck boards and railings on older Sammamish decks?"
    a: |
      Yes — deck board and railing repairs are frequent requests in Sammamish, where pressure-
      treated (PT) lumber decks built in the mid-to-late 1990s are splitting, cupping, and in
      some cases showing rot at the rim joist or ledger board connection. Individual boards get
      replaced with matching PT lumber, or composite (Trex Select or TimberTech Azek) if the
      homeowner wants to upgrade worn sections. Railing repairs cover loose balusters, corroded
      post base hardware, and wobbly top rails. IRC code requires railing height of 36 inches
      minimum on decks over 30 inches above grade, with baluster spacing no more than 4 inches
      — any repair work has to meet that standard. Most board-and-railing repair jobs in
      Sammamish run $650-$2,400 depending on deck size and how much material needs replacing.

  - q: "Do you warranty your handyman work?"
    a: |
      Every job comes with a 12-month workmanship warranty — if something we installed, patched,
      or repaired fails within that window due to our work, we return and fix it at no charge.
      Material warranties depend on the product: Moen carries a lifetime limited warranty on
      faucets, Trex decking carries a 25-year fade and stain warranty, Lutron Caseta devices
      carry a 5-year manufacturer warranty. Pre-existing conditions — a racked door frame from
      foundation movement, original wiring that's undersized — get flagged before work starts
      and are noted in the contract as out of scope. The contract also includes a deadline
      penalty clause: if the job doesn't finish when we said it would, TopVolk pays the
      difference. That's written in, not a verbal assurance.

  - q: "Do you cover cities near Sammamish, and how do I schedule?"
    a: |
      TopVolk covers the full King County and Snohomish County service area — Issaquah,
      Redmond, Bellevue, Kirkland, Bothell, and Woodinville are regular stops. For handyman
      work specifically, the focus is on the Eastside and areas within a 45-minute drive.
      Snoqualmie, North Bend, and Maple Valley are 30-40 minutes out — call (206) 591-1096
      and we'll confirm if the schedule works for your location. Pierce County and Kitsap County
      handyman jobs are taken selectively based on project size. Scheduling is direct — no
      online booking system, no third-party coordinator. You talk to Vladislav, describe the
      work, and get a real answer about timing.