title: "Sammamish Tile Installation — Waterproofed Showers Built for 98074 Homes"

intro: |
  Sahalee Drive cuts through one of the Plateau's older sections — homes built between 1993 and 2007, most with original builder-grade tile set over greenboard, not a waterproof membrane. That's the setup for the most common call TopVolk gets from 98074: a retile quote that turns into a full substrate demo and rebuild. Those same kitchens now have Wolf or Thermador range suites sitting behind mismatched builder-grade backsplashes that were never meant to last this long. Both situations get fixed in the same renovation scope. Vladislav Volkov has completed 100+ projects across King County since 2023 — call (206) 591-1096 to schedule a free on-site visit.

localContext: |
  The Sammamish Plateau spans zip codes 98074 and 98075 — planned communities built mostly between 1988 and 2010. Neighborhoods near Beaver Lake Preserve and around Pine Lake are deep into their first renovation cycles right now. Builder-grade homes from this era have 3/4-inch OSB subfloors over 16-inch on-center joists — code-compliant, but marginal for large-format porcelain. A 32x32 or 24x48 slab tile will find every flex point in that substrate. Schluter Ditra uncoupling membrane is standard spec for Plateau housing stock, not an optional upgrade. Laser-leveling the subfloor before installation is part of the base scope, not a line item to negotiate away.

commonProblems:
  - title: "Shower Substrates Built for Moisture Resistance, Not Waterproofing"
    description: "Greenboard behind 1990s and 2000s tile was code-compliant at the time. But in PNW bathrooms — Sammamish logs 37+ inches of annual rainfall and interior humidity is a year-round condition — greenboard eventually saturates. Demo typically reveals soft drywall behind lower wall courses, sometimes black mold at the shower pan. The correct rebuild uses Schluter Kerdi foam board or standard CBU with full RedGard or Kerdi sheet membrane before a single tile goes up. Retiling over a wet, damaged substrate resets the clock on the same failure."
  - title: "Large-Format Porcelain Cracking at Subfloor Flex Points"
    description: "24x48 and 32x32 porcelain tiles bridge subfloor movements that 12x12 tile never notices. Plateau homes built between 1998 and 2010 have OSB subfloors that are borderline rigid for this format — especially in bathrooms over crawlspaces where joists deflect slightly under load. Schluter Ditra uncoupling membrane decouples the tile layer from that movement, preventing crack-back at grout joints. It also raises the finished floor about 3/8 inch, which directly affects tile-to-hardwood transitions at doorways. That height difference needs to be planned before demo, not resolved after tile is already set."
  - title: "Heated Floor Mat Height and the Doorway Transition Problem"
    description: "Ditra-Heat and Warmup electric mat systems are common in Sammamish master baths — mild but damp winters, high household incomes, and these homes have the electrical panel capacity to support them. The complication is height differential. Ditra-Heat plus thinset and large-format porcelain can raise the finished floor surface close to 1/2 inch above adjacent hallway hardwood. A Schluter Reno-T or Jolly aluminum transition strip handles it cleanly — but it has to be specced and ordered before demolition starts. Getting to that detail on punch list day, with tile already set, means living with a visible mismatch or tearing up finished work."

faq:
  - q: "How fast can you get to Sammamish for a tile project?"
    a: "Sammamish is a regular part of the project schedule — 98074 and 98075 are about 25 minutes from most of the Eastside via I-90 or SR-520 to Issaquah-Sammamish Road. Vladislav typically does site visits within the week. For renovation projects over $30K, the on-site consultation is free — you talk directly to the contractor, not a sales rep. Call (206) 591-1096 to get scheduled."
  - q: "Can you tile a kitchen backsplash around a Wolf or Thermador range during a remodel?"
    a: "Yes — sequencing matters here. Backsplash work around a Wolf range or Thermador wall oven typically requires relocating one or two electrical outlets first, coordinated with a licensed electrician before tile day. Natural stone backsplashes — marble, travertine — also need sealing for PNW kitchen humidity after grout cures. Tile gets templated after counters are set, installed in one session. Elapsed time is 3-5 days depending on scope."
  - q: "What does a full shower retile cost in Sammamish, and how long does the work take?"
    a: "A demo-and-rebuild — new CBU or Kerdi foam substrate, full RedGard or Schluter Kerdi membrane, large-format porcelain, custom niche framing and waterproofing — runs $7,000–$15,000 in 98074 and 98075 depending on shower size and tile selection. Labor is 7–10 business days after materials arrive on site. Vladislav writes the completion date into the contract; missed milestones come with financial penalties, not excuses. WA Licensed Contractor. Call (206) 591-1096 for a written line-item quote."