title: "Sammamish Power Washing — Plateau Moss & Cedar Prep"

intro: |
  Driving through Klahanie in late April, you can spot which driveways and fence boards haven't
  been touched since before the last rainy season — the gray-green film is unmistakable.
  Sammamish averages over 40 inches of rain annually, and homes on the Plateau sit under
  enough Douglas fir and cedar canopy that north and west-facing surfaces stay wet from
  October through May without interruption. Cedar decks that haven't been cleaned in two or
  three seasons develop a layer of oxidation and algae that blocks stain penetration entirely —
  moderate pressure washing alone won't fix it without downstream injection of a sodium
  hypochlorite solution at the right dilution. Concrete driveways in the Pine Lake corridor
  accumulate tire rubber transfer, oil spots, and efflorescence that need a surface cleaner
  attachment running at 3,000 PSI and 4 GPM to pull clean without etching. Every exterior
  repaint or deck stain project starts with surface prep — and a wash job done wrong is the
  most direct path to a stain coat that peels inside one season.

localContext: |
  Sammamish was developed heavily between 1990 and 2010, so the dominant housing type is
  large two-story Pacific Northwest colonials and craftsman-style homes — cedar shake accents,
  cedar or composite decking, and Hardie cement-board siding are everywhere. Those materials
  each respond differently to water pressure and cleaning chemistry. In 98075, neighborhoods
  around Pine Lake and Beaver Lake sit under mature tree canopy that keeps shaded elevations
  damp well into summer, accelerating moss colonization on roofs, fence boards, and concrete
  flatwork. The 98074 corridor through Inglewood Hill and along Issaquah-Pine Lake Road has
  similar conditions, and HOA communities including Klahanie maintain strict exterior appearance
  standards — visible moss or staining on fencing or driveways can trigger written violation
  notices from the association. Soft washing — lower PSI with a biocide solution rather than
  brute mechanical pressure — is the correct approach for cedar shake, Hardie fiber cement,
  and asphalt shingles to avoid blowing out caulk joints, damaging fiber cement edges, or
  voiding roofing warranties.

commonProblems:
  - title: "Cedar Deck Cleaning Before Staining — Actual Surface Prep, Not Just a Rinse"
    description: |
      A cedar deck that's survived two or three wet seasons in Sammamish has more going on than
      surface grime. Gray oxidation coats the top layer, algae threads into the wood grain, and
      residual old stain often clings in low-traffic spots beneath patio furniture. Running a
      wand at full pressure strips the gray layer but raises the wood grain badly, leaving a
      fuzzy texture that prevents even stain penetration. The right sequence: pre-treat with a
      sodium hypochlorite solution at 1–2% concentration — Sunbrite Supply's deck wash formula
      works well — dwell 10–15 minutes, then rinse at 1,200–1,500 PSI with a 25-degree fan tip,
      never a turbo nozzle on cedar. After 48–72 hours of drying time, the deck accepts a
      penetrating oil stain like Armstrong Clark or TWP 100 Series properly. Skipping that
      chemical pre-treat step is the main reason DIY stain jobs fail before the second winter.
      Timeline from wash to stain-ready: 3–5 days depending on weather and current temperatures.

  - title: "Hardie Siding Soft Washing Before Exterior Repaint"
    description: |
      Hardie cement-board siding holds up well structurally, but the factory finish on panels
      installed pre-2010 — common throughout the 98075 portion of Sammamish — fades and chalks
      over time. Chalked surfaces retain moisture, and moisture retention is what sustains algae
      and mildew colonies. Painting directly over a contaminated Hardie surface is the primary
      reason exterior paint failures happen prematurely on Sammamish homes. Soft washing at
      600–800 PSI with downstream-injected sodium hypochlorite kills organic growth at the
      surface and below. High-pressure washing on Hardie blows caulk out of butt joints and
      corner trim — once those joints open, you have a water intrusion path behind the fiber
      cement that creates far bigger problems than a dirty surface. After washing, allow 5–7
      full drying days in PNW conditions, then spot-caulk any open joints with NP1 or a
      comparable paintable polyurethane sealant before priming. The wash step typically adds
      $300–$600 to a Sammamish exterior paint prep scope, but skipping it cuts the new paint
      life roughly in half.

  - title: "Concrete Driveway and Paver Restoration — Oil, Tire Marks, and Efflorescence"
    description: |
      Concrete driveways in Sammamish's 1990s and 2000s subdivisions are at the age where
      surface staining from tire rubber transfer, oil drips, and efflorescence — the white
      mineral deposits that leach through as concrete absorbs and re-releases moisture — becomes
      hard to ignore. A surface cleaner attachment (spinning bar with dual nozzles, typically
      18–20 inches wide) covers a two-car driveway evenly and eliminates the stripe marks you
      get from wand work. For embedded oil spots, pre-treating with Simple Green Pro HD or
      Purple Power degreaser before the pressure wash pulls hydrocarbons out of the concrete
      pores rather than just redistributing them. Standard broom-finish concrete handles 3,000
      PSI through a surface cleaner without surface damage. Efflorescence needs a follow-up
      light acid wash — diluted muriatic acid or a commercial product like Sure Klean 600 —
      to neutralize the mineral deposits after pressure washing. A full two-car driveway plus
      front walkway typically runs $250–$450 for a standard Sammamish home, depending on
      square footage and stain severity.

  - title: "Fence Cleaning Before Staining — The 3–5 Year PNW Maintenance Cycle"
    description: |
      Cedar fencing in Sammamish follows a predictable pattern: install, let it weather gray
      for a season or two, then stain — or ignore it for five years and deal with significant
      algae and mildew before staining is even possible. Fence boards sitting near mulch and
      lawn edges retain moisture continuously through the rainy season, which accelerates
      biological growth into the wood fibers. Cleaning cedar fence correctly means hitting it
      at 1,000–1,200 PSI with a 25-degree fan tip, working with the grain direction, and
      pre-treating heavily mossed sections with a biocide that kills the root structure — not
      just the visible surface growth. A pressure wash that only removes surface material will
      see regrowth within 60–90 days. After cleaning, a penetrating oil stain — Ready Seal,
      Armstrong Clark, or Cabot Australian Timber Oil — applied within a week of the surface
      drying gives the wood a solid 3–4 year service window. Fence cleaning for 150–200
      linear feet of standard Sammamish backyard fencing runs $300–$500; combined wash-and-stain
      service runs $600–$1,100 depending on fence height and current condition.

  - title: "Roof Soft Washing — Removing Moss Without Voiding Shingle Warranties"
    description: |
      Asphalt shingle roofs on the Sammamish Plateau accumulate moss faster than almost any
      other surface type because shingles stay wet for months during the October–May rain
      season, especially on north and northwest exposures. The mistake homeowners make is
      pressure washing a shingle roof — even moderate PSI drives water under shingle tabs,
      breaks the granule bond, and voids most manufacturer warranties. Soft washing uses a
      low-pressure pump (under 100 PSI) combined with a sodium hypochlorite and surfactant
      solution, letting the chemistry kill moss and algae at the rhizoid level without
      mechanical damage. Dead moss sloughs off gradually over the next 30–60 days of rain
      events. Asphalt Roofing Manufacturers Association guidelines specifically endorse soft
      washing as the approved removal method — a detail worth having documented if a warranty
      claim ever comes up. Post-treatment zinc strips installed at the ridge create a
      slow-release zinc oxide coating down the roof with each rain, suppressing regrowth for
      several years. Roof soft washing on a typical 2,000–2,500 sq ft Sammamish home runs
      $400–$700 depending on pitch and site access.

