  - q: "Do Sammamish HOAs require approval or permits before power washing work?"
    a: |
      Power washing falls under routine exterior maintenance and doesn't require a building
      permit from the City of Sammamish — no plan review, no building department paperwork.
      HOA approval is a separate question. Communities like Klahanie have CC&Rs that sometimes
      require contractor credentials or proof of insurance before work proceeds, particularly
      for anything affecting shared fencing or visible front elevations. For standalone
      single-family work on private surfaces, HOA sign-off typically isn't required for
      washing — but if the wash is prep for a paint or stain color change, that color change
      itself may need HOA board approval first. TopVolk is a WA Licensed Contractor, and
      providing a scope-of-work letter, certificate of insurance, or contractor credentials
      for HOA submittals is standard and included at no additional cost.

  - q: "What's the difference between soft washing and pressure washing — and which method does my house need?"
    a: |
      Pressure washing uses high PSI (1,500–4,000+) to remove surface material mechanically.
      That's appropriate for concrete driveways, brick, pavers, and hardscape where the
      material can handle the force. Soft washing uses low pressure — under 300 PSI — combined
      with a sodium hypochlorite and surfactant biocide solution, letting the chemistry kill
      and release organic growth rather than blasting it off. Hardie siding, wood siding, cedar
      shake roofing, asphalt shingles, and painted surfaces all require soft washing — pressure
      washing those surfaces blows out caulk joints, damages fiber cement edges, or lifts paint.
      Cedar decks fall in the middle: 1,000–1,500 PSI with a fan-tip nozzle plus a chemical
      pre-treat. Applying the wrong method to the wrong surface causes damage that costs
      significantly more to repair than the wash job itself.

  - q: "How long before moss and algae come back after power washing in Sammamish?"
    a: |
      On concrete flatwork treated with a surface cleaner and sealed with a penetrating
      concrete guard like Rainguard Water Sealers after washing, expect 2–3 years before
      significant organic regrowth. Cedar decks and fences maintained on a regular stain
      cycle need cleaning and re-staining every 3–4 years — wood that stays sealed absorbs
      less moisture and supports less biological growth each cycle, so the maintenance
      interval actually improves when you stay on schedule. Roof moss soft washing typically
      lasts 2–4 years depending on roof exposure and whether zinc strip suppression is
      installed at the ridge after treatment. North and northwest-facing surfaces on the
      Sammamish Plateau regrow faster than south-facing ones — that's a direct function of
      40+ inches of annual rainfall and limited winter sun exposure. Preventive treatments
      extend the interval, but no wash solution makes PNW surfaces permanently maintenance-free.

