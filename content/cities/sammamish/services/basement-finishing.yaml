title: "Sammamish Basement Finishing — Slab to Livable Space"

intro: |
  The Sammamish Plateau — zip codes 98074 and 98075 — built out fast between 1995 and 2008, and nearly every one of those homes came with a full poured-concrete basement that builders left untouched. Pine Lake and Beaver Lake Road corridors see heavy clay-soil saturation from October through April, and a DriCore subfloor system is typically the first call before a single stud gets set.

  Vladislav Volkov has finished basements across the Plateau — some as legal bedroom suites, some as home theaters with a Sub-Zero wine column — and knows exactly what City of Sammamish inspectors want to see at rough-in. The permit portal here isn't Seattle SDCI; it runs through the City of Sammamish directly, and plan review for a full basement finish with a bathroom addition typically runs 4-8 weeks before a permit issues.

localContext: |
  Sammamish's 98074 zip holds tract-built two-stories from the late 1990s with 8-foot poured-concrete walls — a better starting point than a Capitol Hill Craftsman with rubble-stone footings, but still prone to lateral moisture intrusion along the footing where exterior waterproofing has degraded over 25 years. The 98075 side near the Issaquah Highlands boundary has more sloped lots where walkout configurations open the door for a full egress-compliant bedroom suite.

  MEP coordination before rough-in. That's the piece most homeowners don't see coming.

  Most Sammamish homes from this era have existing HVAC stub-outs but undersized ductwork runs for finished basement space — adding a heating zone means either rerouting trunk lines or dropping in a Mitsubishi mini-split, and that decision has to happen before framing goes up, not after it's closed.

commonProblems:
  - title: "Lateral Moisture Through Poured Walls — Sort It Before Framing"
    description: "Sammamish gets 35-40 inches of rain annually, and plateau clay soils hold water. Hydrostatic pressure pushes moisture through even solid poured-concrete walls. Installing a perimeter drain channel at the footing with a sump pump handles active intrusion before RedGard or a vapor barrier goes on. Frame into moisture without that drainage layer and you're pulling drywall inside three years. The DriCore subfloor follows once drainage is confirmed — that air gap between panel and slab prevents condensation from wicking up into finished flooring on a cold concrete surface, which is a real failure mode in PNW winters."
  - title: "Egress Windows for Code-Compliant Bedrooms in 1990s Basements"
    description: "The City of Sammamish enforces IRC minimums — 5.7 sq ft net clear opening, sill height no more than 44 inches from finish floor. Most 1995-2005 basement walls have no rough openings at all. Cutting into poured concrete, setting a proper window well with a drain, and clearing plan review through the City adds 2-3 weeks to the schedule but makes the bedroom legal on a resale listing. Sammamish homes on the Plateau regularly sell north of $1.4M — a permitted bedroom suite in the basement changes how appraisers treat that square footage."
  - title: "Duct Rerouting to Hit the 7-Foot Finished Ceiling Standard"
    description: "Sammamish homes built 1997-2005 frequently ran HVAC trunk lines low across the basement ceiling — code permits 6'8\" under beams, but 7 feet clear in habitable space is the livable standard. Rerouting supply and return ducts, then adding a Mitsubishi mini-split for zones the existing system can't reach, gets you there without a drop ceiling that eats headroom and shrinks the room visually. Most Sammamish basements have the wall height to pull this off — 8-foot poured walls leave real margin after slab-to-subfloor and drywall ceiling thickness."

faq:
  - q: "How fast can you get to Sammamish for Basement Finishing?"
    a: "Sammamish is a regular stop in our King County schedule — typically 20-30 minutes via I-90 East depending on traffic on the Plateau connector roads. Call (206) 591-1096 to book a free on-site walkthrough with Vladislav directly. No sales staff, no call center. You talk to the contractor who's going to run the job."
  - q: "What materials hold up in a Sammamish basement given the wet winters?"
    a: "DriCore subfloor panels are standard — the air gap they create between slab and flooring handles seasonal moisture without gluing anything to concrete. Schluter Kerdi membrane around all wet areas, mold-resistant drywall throughout, and aluminum-clad window frames that won't rot. These aren't upgrades for a PNW basement; they're baseline. Pressure-treated lumber at the bottom plate where it contacts concrete, and vapor barrier on the exterior side of batt insulation in the wall cavities — get that reversed and you trap moisture in the stud bay."
  - q: "What does a permitted basement finish run in Sammamish, and how long does the process take?"
    a: "Full finish — framing, MEP rough-in, egress window, bathroom, flooring, paint — typically runs $60K-$130K depending on scope and finishes. City of Sammamish plan review takes 4-8 weeks. Construction runs 8-14 weeks after permit issuance. Total timeline from first call to final inspection averages 5-7 months on a full finish. Vladislav is a WA Licensed Contractor with 100+ projects completed since 2017, and deadline penalties are written into every contract — not a vague guarantee, an actual clause with a dollar figure attached."