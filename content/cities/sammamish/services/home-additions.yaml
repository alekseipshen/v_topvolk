title: "Sammamish Home Additions — ADUs, Second Stories & Permits"

intro: |
  Plateau neighborhoods near Pine Lake and Beaver Lake in 98075 were built mostly between 1993 and 2008.

  Large lots, Pacific NW-style two-stories, houses sized for smaller households than the ones living in them now. Multi-generational living and home-office demands are pushing more of these projects: a Wolf range going into a new kitchen wing, a DADU with its own entrance, a second story over a single-level ranch. All of it starts with the same question — what will King County DPER actually approve on your specific parcel, and what does the existing structure support? That answer looks different on every lot, and it's not something you get from a phone estimate.

localContext: |
  Sammamish spans two zip codes: 98074 in the north near Redmond Ridge, and 98075 to the south bordering Issaquah.

  Homes built here from 1992 to 2005 were framed under older IRC editions — R-19 exterior walls, basic crawlspace vapor barriers, and mechanical systems sized for the original footprint. Adding 500-900 square feet means the electrical panel capacity, ductwork load, and sometimes the perimeter foundation all get reviewed before a permit application even goes in.

  Not optional reviews. Required ones.

  On a 98075 parcel with a 200-amp panel from 1999 and a 20-year-old air handler, a new 800 sq ft wing with a Thermador range almost always triggers a panel upgrade before rough-in inspection clears. King County DPER wants to see that MEP coordination addressed in the permit drawings — not discovered mid-project.

commonProblems:
  - title: "ADU Permitting Under WA HB 1337 on King County Parcels"
    description: |
      WA HB 1337 (2024) allows up to two ADUs per single-family lot statewide — one detached (DADU) and one attached (AADU).

      King County DPER still controls setback distances, FAR limits, and lot coverage on parcels in unincorporated Sammamish. A separate utility connection for a DADU adds $15K-$30K to project cost and requires its own plan review cycle.

      Typically 6-10 weeks after a complete application.

      That timeline matters when a family move-in date is already set. The application has to be complete — missing structural drawings or an incomplete site plan kicks it back and restarts the clock. Vladislav reviews the parcel constraints before the permit package gets assembled, not after.

  - title: "Second-Story Additions and Structural Engineering for 1990s Foundations"
    description: |
      Adding a second story over an existing footprint triggers a structural engineer's review of the poured concrete perimeter foundation, LVL beam sizing at the ridge line, and point loads through the floor system down to the footings.

      King County DPER requires stamped structural drawings before issuing a permit. On some 98075 homes with post-tensioned slabs — less common but not rare on lots developed by larger builders in the late 1990s — the slab constraints can determine the entire addition layout before a single framing decision gets made. The engineer's report isn't bureaucratic overhead. It's what tells you whether a 600 sq ft second story is straightforward or whether the perimeter needs reinforcement first.

      Some projects need that answer before a budget conversation makes sense.

  - title: "Matching 1990s Exterior After 30 Wet Sammamish Seasons"
    description: |
      Cedar siding from the mid-1990s has been through enough wet seasons to shift noticeably in color and texture. Sammamish pulls 37+ inches of rain annually, heavier on north-facing slopes above Beaver Lake.

      Hardie cement-board lap siding is the standard replacement: rot-resistant, dimensionally stable, holds paint through the freeze-thaw cycles that hit the Issaquah foothills every winter.

      Matching an existing profile that's been repainted four times usually means replacing adjacent runs on the original house, not just the new addition panels. The alternative — spot-matching weathered cedar — looks wrong within two seasons. Planning the full exterior transition upfront costs less than doing it twice.

faq:
  - q: "How fast can you get to Sammamish for a Home Additions consultation?"
    a: |
      Sammamish is a regular part of the King County schedule — roughly 30 minutes via I-90 from Seattle, less from the Eastside. Call (206) 591-1096 to schedule a free on-site walkthrough with Vladislav directly. You're talking to the contractor running the project, not a commissioned closer.

  - q: "Do you use Mitsubishi or Bosch mini-splits in new Sammamish additions, or extend existing ductwork?"
    a: |
      Depends on what the existing system can handle.

      On homes with 20-year-old air handlers already running near capacity, extending ductwork into new square footage rarely makes sense — a Mitsubishi or Bosch mini-split zoned for the addition runs more efficiently and doesn't stress aging equipment. Mechanical rough-in gets coordinated before drywall hang starts, so the decision is made with actual load calculations, not guesswork.

  - q: "What does a home addition cost in Sammamish, and how long does the full process take?"
    a: |
      Scope is everything.

      A finished bonus room over an attached garage is a different project than a full DADU with a separate entrance, kitchen, and utility connection. Typical range for project-based additions: $80K-$200K+. King County DPER plan review for structural work runs 6-12 weeks; budget 5-8 months total from permit submission to punch list and final inspection.

      TopVolk Construction is a WA Licensed Contractor with 100+ projects completed since 2017. Call (206) 591-1096 for a line-item quote — not a range, an actual number tied to your scope. Missed deadlines carry a penalty written into the contract.