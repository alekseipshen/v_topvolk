title: "Sammamish Plumbing — Poly-B Repipe & Tankless Conversions"

intro: |
  Poly-B supply lines — that gray plastic pipe stamped PB2110, installed through thousands of homes during the Sammamish Plateau building boom of the late 1980s — are failing at compression fittings across 98074 and 98075 right now. Chlorinated municipal water attacks the acetal fittings from the inside over decades; joints weep at elbows first, then blow.

  Klahanie and Pine Lake are the subdivisions where we get the most plumbing calls. On the newer end, post-2005 builds near Sammamish Town Center are converting aging 50-gallon tanks to Navien NPE-240A or Rinnai RU199 units as those original heaters age out and monthly gas bills climb.

localContext: |
  Sammamish incorporated in 1999, but construction on the Plateau started well before that.

  Homes in 98075 — Trossachs, Klahanie, Pine Lake — were built mostly 1984 through 1998, and polybutylene or early CPVC supply lines were standard on a lot of those builds. The area's heavy Oct-May rainfall means crawlspace drainage and vapor barriers are part of every plumbing scope in those older homes; condensate line routing from new Mitsubishi mini-split systems adds to that too. Zip code 98074, closer to Beaver Lake and Sammamish Town Center, skews newer — copper and PEX throughout — but those homes are now hitting the 20-year mark on original fixtures and valves. Kohler shutoffs installed in 2003 don't last forever, and Moen cartridges in high-pressure zones wear out faster than the spec sheet suggests.

  Crawlspace plumbing in 98075 is its own challenge. Low clearance, standing water after November storms, vapor barrier damage from previous repairs — all of it adds time compared to working a slab or full basement.

commonProblems:
  - title: "Polybutylene Supply Line Failure at Compression Fittings"
    description: "Poly-B pipe degrades specifically at the acetal compression fittings — chlorinated water attacks the fitting interior over 20–30 years, and joints start weeping at elbows, tees, and shutoff connections before a full failure. A complete plumbing repipe to PEX-A using expansion-style fittings solves it permanently. Homes in 98075 built between 1986 and 1996, particularly in the Klahanie subdivision off SE 8th St, are the most common candidates we pull permits for. Mineral staining around a supply fitting or water running when everything's shut off — both are early warnings worth taking seriously."
  - title: "Incoming Water Pressure Above 80 PSI Wearing Out Fixtures"
    description: "Eastside utility districts deliver water to Sammamish at pressures that routinely run 85–100 PSI on homes without a pressure regulating valve (PRV) on the main. That's a code violation under IRC, and it blows out Moen cartridges early, causes Kohler fill valves to chatter, and shortens the life of every supply-side plumbing component in the house. Installing a PRV at the main shutoff and dialing it to 60 PSI takes half a day and protects everything downstream."
  - title: "Tankless Conversion Requiring Gas Line Upsize and City Permit"
    description: "A Navien NPE-240A or Rinnai RU199 pulls up to 199,000 BTU at peak demand. Most 1990s builds in 98075 have a half-inch gas branch feeding the water heater — that can't deliver the volume a tankless unit needs at peak draw. Upsizing to three-quarter-inch or one-inch gas line is standard in the plumbing conversion scope. The City of Sammamish requires a mechanical permit for any water heater replacement, and WA code mandates seismic strapping even on a straight tank-for-tank swap."

faq:
  - q: "How fast can you get to Sammamish for plumbing work?"
    a: "Sammamish is on our regular route — SE 8th St and 228th Ave NE are familiar roads. From the west side of the lake, that's 25–40 minutes depending on 520 bridge traffic. Non-emergency plumbing site visits typically happen within 2–3 business days. Call (206) 591-1096 to get on the schedule."
  - q: "Do you work with Rinnai, Navien, Kohler, and Moen fixtures?"
    a: "All four, yes. Rinnai and Navien are what we spec for tankless conversions in Sammamish — parts availability and local service support matter if something goes wrong in year four. For plumbing fixtures, Kohler and Moen are standard on most bath remodels in 98074 and 98075; Delta shows up in the older builds and we work with that too. We do rough-in for any of them."
  - q: "What does a poly-B repipe cost in Sammamish, and how does permitting work?"
    a: "Full plumbing repipes typically run $9,000–$18,000 depending on square footage, number of stories, and how much framing is accessible behind finished walls. Permits pull through the City of Sammamish building department — not King County DPER — with plan review running 3–6 weeks for residential work. TopVolk is a WA Licensed Contractor with 100+ projects completed since 2023, and deadline commitments go into the contract in writing. Vladislav provides a line-item quote after a free on-site walkthrough — call (206) 591-1096 to set one up."