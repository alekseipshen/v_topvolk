title: "Sammamish Deck Installation — Plateau Lots, Grade Changes, Real Permits"

intro: |
  Plateau neighborhoods around Pine Lake (98074) have some of the best backyard views
  in King County — and some of the most complicated rear-yard grade changes to build
  over. A lot of 2003-2012 builds here came with a basic 10×12 patio slab that's
  already showing its age. TimberTech Azek or Trex Transcend composite holds up far
  better through 37+ inches of annual rainfall than raw cedar, and skips the seasonal
  staining cedar demands on north-facing exposures.

localContext: |
  Sammamish zip codes 98074 and 98075 cover the Plateau, Trossachs, Klahanie, and
  Beaver Lake areas — almost entirely built 2000-2015 on large lots with significant
  backyard slope. Deck permits go through the City of Sammamish Building Division,
  not King County DPER, and plan review for a standard attached deck typically runs
  4-8 weeks. Homes with wetland buffers — common across the Plateau — need a critical
  area setback review before any deck footprint is finalized.

commonProblems:
  - title: "North-Facing Exposures Turn Cedar Decks Green Within Two Seasons"
    description: "Cedar weathers well if maintained, but north-facing Sammamish decks collect
      moss and mildew from October through April. Many homeowners find Trex Transcend or
      TimberTech Legacy composite board eliminates annual staining cycles entirely. The
      material premium on a 400 sq ft deck often pays back inside five years of skipped
      maintenance and resealing."
  - title: "Ledger Board Flashing Failure Rots the Rim Joist From Inside"
    description: "Most 2000s-era Sammamish homes used OSB sheathing behind Hardie cement-board
      siding — if the ledger board isn't flashed with stepped metal flashing or a Vycor Plus
      membrane, water tracks behind the siding and sits against the rim joist. We've replaced
      ledgers in Klahanie where the rim joist required sistered floor joists before new
      framing could attach."
  - title: "Steep Grade Lots Need Engineered Post Footings, Not Just Poured Concrete"
    description: "Lots near East Lake Sammamish Trail drop 8-12 feet from the house pad to the
      property line. A deck over that grade requires post footings drilled to frost depth
      (12-18 inches minimum in King County) and often an LVL beam to achieve clear span
      without mid-deck posts blocking the view. The City of Sammamish requires engineered
      drawings for decks more than 30 inches above grade."

faq:
  - q: "How fast can you get to Sammamish for Deck Installation?"
    a: "The Sammamish Plateau is a 20-35 minute drive from Seattle or Bellevue, depending
      on SR-520 or I-90 conditions. Free on-site consultation with Vladislav directly —
      you're talking to the contractor, not a salesperson. Call (206) 591-1096 to schedule."
  - q: "What deck material holds up best in Sammamish's climate?"
    a: "For north-facing decks or anything under significant tree cover, composite outperforms
      cedar every time. Trex Transcend and TimberTech Azek both handle PNW moisture without
      splitting, warping, or moss buildup. Fiberon Horizon is a solid mid-range option when
      material cost starts scaling on larger footprints."
  - q: "How long does a deck permit and build take in Sammamish?"
    a: "Permits go through the City of Sammamish Building Division — plan review on a standard
      attached deck runs 4-8 weeks. Construction on a 400-500 sq ft deck takes 2-3 weeks
      after permit approval. TopVolk handles the permit application as WA Licensed Contractor,
      and missed deadlines carry a penalty written into the contract. Call (206) 591-1096
      to start the process."