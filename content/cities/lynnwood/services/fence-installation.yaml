  - q: "Does the City of Lynnwood require a fence permit, and who handles the paperwork?"
    a: |
      Standard 6-foot privacy fences on flat Lynnwood residential lots typically don't require a
      building permit. The exception is when a fence sits on top of a retaining wall and the combined
      height exceeds 6 feet measured from lower grade — that triggers a permit through the City of
      Lynnwood's building division, not Snohomish County PDS (which only covers unincorporated areas
      outside city limits). Plan review in Lynnwood runs 2–4 weeks for most residential fence and
      retaining wall combinations. TopVolk is a WA Licensed Contractor and handles permit applications,
      site plans, and submittal coordination. If your HOA also requires pre-approval — common in
      Alderwood-area associations — we prepare the material spec sheet and site plan for that
      submission as well.

  - q: "What gate hardware do you install, and do you do self-closing gates for pool barriers?"
    a: |
      Self-closing gates are standard practice for pool barriers under IRC Section R326, and we
      install them on any gate where the code requires it or clients want the reliability. For walk
      gates, D&D Technologies TruClose hinges provide adjustable spring-close action that holds up
      better long-term than the barrel hinges sold at hardware stores — tension is adjustable after
      installation as the gate settles. Gate latches matter too: the MagnaLatch from D&D Technologies
      is a child-resistant, self-latching latch rated specifically for pool barrier use. For heavier
      double drive gates, we spec heavy-duty weld-on hinges or aluminum gate frame kits depending on
      post material and gate weight. Hardware selection gets finalized at the site visit, where gate
      frequency of use and pool barrier requirements both factor into the spec.

  - q: "How long will a new cedar or vinyl fence last in Lynnwood's climate?"
    a: |
      A cedar fence built correctly — PT posts at 36-inch depth in concrete footings, cedar rails and
      pickets with end grain sealed at every cut — should last 20–30 years in Lynnwood before
      structural replacement is needed. Posts are always the weak link. Using PT 4x4 posts instead
      of cedar posts adds 10+ years of service life in Snohomish County's wet soil. Cedar boards
      need staining or oiling every 4–5 years to prevent checking, graying, and moss growth on
      north-facing exposures. Vinyl fencing — Bufftech products carry manufacturer warranties against
      fading, cracking, and peeling — typically lasts 30–40 years with minimal maintenance. TopVolk
      warranties installation workmanship on all fence projects; material warranty terms depend on
      the specific product installed.

