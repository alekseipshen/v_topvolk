title: "Lynnwood Fence Installation — Cedar, Vinyl, and Post Depth Realities"

intro: |
  Heavy clay-loam soil defines how fence posts behave in Lynnwood — and most of the 98036 zip around
  Alderwood Manor is sitting on exactly that. Rain soaks in from October through April, the ground
  stays saturated months longer than it looks, and a post set at only 24 inches will start rocking
  by year three or four. That's not a material problem; it's a depth problem. TopVolk Construction
  LLC has installed cedar privacy fences, vinyl panel fences, and horizontal slat cedar fences across
  Lynnwood since 2023 — including projects near Scriber Lake Park in the lower-lying sections of
  south Lynnwood and along residential corridors off Highway 99. Vladislav Volkov walks every site
  before a single post goes in. Call (206) 591-1096 and you're talking to the person doing the work,
  not a salesperson working from a catalog. 100+ projects completed across the Seattle metro since 2023,
  with deadline penalties written into every contract.

localContext: |
  Most of Lynnwood's fence-replacement calls come from the 1960s–1980s tract neighborhoods — the
  original cedar dog-ear fences are now 35–45 years old, and post bases have been rotting quietly
  at grade for years. In the 98036 zip around Alderwood Mall and north toward Mountlake Terrace,
  lots are typically 6,000–8,000 square feet with moderate slope and original builder-grade fencing
  that's long overdue. The 98037 zip covers south Lynnwood and the Meadowdale corridor, where grades
  steepen and proper post-setting depth and stepped-rail layout matter even more. City of Lynnwood
  enforces standard fence height limits: 6 feet maximum on side and rear property lines, 4 feet in
  front yards, both measured from finished grade. A fence sitting atop a retaining wall — common on
  sloped Lynnwood lots — can push effective height over 6 feet and trigger a permit requirement through
  Lynnwood's own building division, separate from Snohomish County PDS which handles unincorporated
  areas. Many Alderwood-area HOAs require written pre-approval on fence material and color before
  installation starts, so the sequencing of approvals matters.

commonProblems:
  - title: "Post Rot at Grade: The Actual Failure Point on Lynnwood Fences"
    description: |
      It's rarely the pickets that fail first. Post bases rotting at grade — that's what causes
      Lynnwood fences to lean and eventually collapse. Cedar posts in direct ground contact absorb
      moisture from Snohomish County's wet clay soil all winter, and the grade-level transition zone
      is where decay concentrates fastest. The fix isn't just swapping the post; it requires digging
      to 36 inches, removing the old concrete footing, and resetting with pressure-treated (PT) 4x4
      or 4x6 posts — the PT designation matters because standard cedar in ground contact will decay
      in 10–15 years in this climate. Simpson Strong-Tie ABA post bases work well for wood-to-concrete
      connections on flat sections where you want to keep the post end out of standing water. Budget
      $150–$250 per post replacement depending on concrete removal difficulty. Full fence resets with
      new post footings typically run $3,500–$7,000 for a standard 150-foot residential section.

  - title: "Cedar vs. Vinyl: What Actually Holds Up Through 37 Inches of Annual Rain"
    description: |
      Western Red Cedar is the traditional PNW choice — it takes stain well, it looks right on a
      1970s Lynnwood rancher, and it's locally available. Untreated cedar on a north-facing exposure
      in the 98037 zip will grow moss on the bottom rails by year two and need staining every 4–5
      years to stay structurally intact. Vinyl panel fencing — Bufftech by CertainTeed is worth
      specifying by name, not the builder-grade product off the home center shelf — won't rot, doesn't
      need painting, and handles the seasonal moisture cycle without swelling or checking. The tradeoff
      is real: vinyl costs about 20–30% more upfront, and it reads more suburban than the horizontal
      cedar slat fences common on remodeled mid-century homes. For Lynnwood homeowners who want
      low-maintenance side and rear yard privacy, vinyl is the smarter long-term call. Cedar makes
      sense when the design aesthetic matters and the owner will actually maintain it on schedule.

  - title: "Lynnwood Fence Permits, HOA Pre-Approval, and the Retaining Wall Trigger"
    description: |
      Standard 6-foot privacy fences on flat Lynnwood lots typically don't require a building permit —
      but that changes quickly with slope. If a fence sits atop a retaining wall and the combined
      structure exceeds 6 feet measured from lower grade, the City of Lynnwood's building division
      requires a permit before work starts. Plan review through Lynnwood's permit center runs 2–4
      weeks for straightforward fence and retaining wall combinations. Snohomish County PDS handles
      permit applications for unincorporated Snohomish County areas outside Lynnwood city limits —
      those are different jurisdictions with different submittal requirements. TopVolk is a WA Licensed
      Contractor and manages the permit application, site plan, and submittal process. HOA pre-approval
      in Alderwood-area associations typically requires a site plan, material spec sheet, and color
      sample — that review runs 2–4 weeks on its own. Sequence matters: HOA approval first, permit
      second, installation third. Starting out of order can mean forced removal.

  - title: "What Fence Installation Actually Costs in Lynnwood and What Moves the Number"
    description: |
      Cedar dog-ear privacy fence in Lynnwood runs $35–$55 per linear foot installed — that covers
      materials, concrete footings, posts set at 36-inch depth, rails, pickets, and site cleanup.
      Horizontal cedar slat fences run $55–$80 per linear foot because tighter post spacing and
      closer rail layout add both material and labor. Vinyl panel fence in a mid-grade product like
      Bufftech comes in at $45–$70 per linear foot. Gates are priced separately: a standard 4-foot
      walk gate with D&D Technologies TruClose self-closing hinges and a MagnaLatch child-resistant
      latch runs $400–$650 installed. Double drive gates for vehicle access start around $900–$1,400.
      Slope adds cost — posts need to be stepped or raked to follow grade, which adds layout time
      and labor. A typical Lynnwood residential project, 150–200 linear feet with one or two gates,
      runs $6,000–$14,000 depending on material and site conditions. Vladislav provides a written
      line-item quote after walking the site, not a per-foot range that shifts at invoice time.

  - title: "Horizontal Slat Fences: Installation Details and What Fails Over Time"
    description: |
      Horizontal slat cedar fences are popular in Lynnwood's newer-remodel crowd — they look
      intentional on a mid-century rancher renovation and photograph well. Horizontal boards don't
      drain water the way vertical pickets do, though. Moisture sits in the rail-to-post joint and
      between boards, and cedar will cup or check within 3–5 years without proper end-grain sealing
      at every cut. Post spacing matters equally: horizontal fence boards spanning more than 6 feet
      will deflect under their own weight plus wind load, particularly on west-facing fence lines
      exposed to Puget Sound corridor winds. The right build: posts at 6-foot intervals, 2x4 or 2x6
      horizontal cedar boards, end grain sealed with a penetrating oil finish like Penofin, and
      1/4-inch spacing between boards for drainage. Expect to restain or re-oil the fence every
      3–4 years. A well-built horizontal cedar fence in Lynnwood will last 20–25 years with that
      maintenance schedule — cut corners on the post depth or end-grain sealing and that number
      drops significantly.

