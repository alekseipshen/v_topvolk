title: "Lynnwood ADU Construction — Build Rental Income on Your Lot"

intro: |
  The Lynnwood City Center Station opened on the Link Light Rail's 2 Line extension in 2024 — and that changes the rental math for homeowners in 98036 and 98037 more than any policy shift could. Tenants commuting into Seattle or Bellevue will pay a real premium to live within walking distance of light rail. Under WA HB 1337 (2024), every single-family lot in Lynnwood can legally host up to two accessory dwelling units — a detached backyard cottage (DADU), an attached addition, or a basement conversion — without a variance or special hearing. TopVolk Construction has built ADUs across Snohomish County since 2017, including in Alderwood and Meadowdale, where 1960s ranch lots often have enough rear yard depth for a 600 sq ft DADU finished with Hardie cement-board siding that holds up through Lynnwood's wet winters without the rot issues cedar develops on north-facing walls. Vladislav Volkov handles every project directly — call (206) 591-1096 to set up a free on-site walkthrough where we measure your lot and tell you what's actually buildable.

localContext: |
  Most of Lynnwood's residential stock went up between 1958 and 1978 — single-story and split-level ranchers on lots ranging from 7,000 to 10,000 sq ft, concentrated in areas like Scriber Lake and the neighborhoods east of 196th St SW in 98036. Those lot sizes can support a DADU, but FAR (floor area ratio) calculations and the city's 24-foot height limit for detached structures narrow your footprint options quickly. Over in 98037 near the Meadowdale corridor, you'll find slightly larger lots with older Douglas-fir framing — some with crawlspaces that need vapor barrier upgrades before any attached ADU work touches the main structure. Lynnwood Development Services handles permitting inside city limits, not Snohomish County PDS, which only covers unincorporated areas — that distinction matters for timeline and submittal requirements. The Lynnwood Link extension also triggers a transit proximity exemption from parking minimums, which helps on tight lots where an extra off-street space simply doesn't fit.

commonProblems:
  - title: "Setback and Lot Coverage Conflicts on Lynnwood's 1960s Ranch Lots"
    description: |
      A lot that looks big enough for a backyard cottage often isn't once you apply Lynnwood's setback rules — typically 5 feet on the sides and 15 to 20 feet from the rear property line for a DADU. On a standard 7,500 sq ft lot in 98036, that math can leave a buildable footprint of 400 to 450 sq ft, which limits your unit layout considerably. Lot coverage limits compound the problem: Lynnwood caps total roofed coverage, so an existing attached garage and covered porch already eat into your allowance before the ADU is even drawn. Sloped lots add a third variable — retaining walls and grading push site costs up $8,000 to $20,000 before framing starts. TopVolk runs a full site analysis before any design work begins, measuring actual setbacks, calculating remaining FAR, and flagging easements recorded on the deed. That conversation is free. Finding the conflict during plan review costs weeks.

  - title: "Utility Connection Decisions: Separate Meter or Shared Service"
    description: |
      One of the bigger cost variables in a Lynnwood ADU build is whether you run a separate utility connection or share the main house service. A separate water and sewer tap through Olympic View Water and Sewer District can add $15,000 to $30,000 to the project depending on distance to the main line. Shared connections are cheaper upfront but complicate tenant billing and can create friction at resale. For mechanical, a Mitsubishi mini-split — the MZ-GL series handles a 600 sq ft DADU without extending the main home's duct system. Cleaner install, sub-panel metering, and no reliance on the aging forced-air systems common in Lynnwood's older stock. Electrical service upgrades at the main panel run $2,500 to $5,000 if the existing panel is at capacity, which it often is in a 1968 house that's never been touched. We spec both scenarios with real numbers so you decide with actual data, not a guess.

  - title: "Lynnwood Permit Process: What the City Actually Requires for a New DADU"
    description: |
      Lynnwood Development Services — not Snohomish County PDS — handles ADU permits for properties inside city limits. A new detached ADU requires full building permit submittal: site plan, architectural drawings, structural calculations if you're modifying load paths, and energy compliance documentation per Washington State Energy Code. Plan review currently takes 8 to 14 weeks for a first-pass response. City inspectors will call for a rough-in inspection covering framing, MEP rough-in, and insulation, then a final inspection before the certificate of occupancy issues. TopVolk prepares the permit package as part of the project contract — WA Licensed Contractor, so we pull the permit in our name. You don't need a separate architect for a straightforward single-story DADU. Total timeline from permit submittal to move-in typically runs 4 to 6 months on a 600 to 800 sq ft detached unit.

  - title: "DADU vs. Attached ADU vs. Basement Conversion: What the Numbers Look Like"
    description: |
      Detached ADUs cost more upfront but rent for more and create cleaner owner-tenant separation. A 600 sq ft DADU in Lynnwood typically runs $180,000 to $250,000 fully permitted and finished — site work, foundation, framing, MEP, R-49 ceiling insulation per energy code, Hardie siding, and finishes. Attached ADUs over an existing garage usually run $120,000 to $175,000 and reuse existing utility connections. Basement conversions are the cheapest entry point at $60,000 to $110,000, but they require egress windows, DriCore subfloor panels over the slab, and often a vapor barrier upgrade in the crawlspace — especially in Lynnwood's older homes where moisture management was never part of the original build. The right choice depends on your lot, your budget, and whether you want a separate-entrance rental unit or an in-law setup. TopVolk provides a detailed line-item quote after the site visit — no ballpark ranges designed to look low and grow mid-project.

  - title: "Structural Surprises in Older Lynnwood Homes During ADU Additions"
    description: |
      Attached ADU work on a 1965 Lynnwood split-level regularly turns up surprises: undersized floor joists, galvanized plumbing at end of life, and original wiring that doesn't meet current code for a second dwelling unit. Sistering floor joists with new lumber, installing LVL beams where load paths shift, and adding blocking at the rim joist isn't exotic work — but it adds cost that never appears in a quick ballpark. Budget a contingency of 10 to 15 percent on any ADU attached to a pre-1975 house in this area. A Navien tankless water heater is a smart spec for a shared-service ADU: it handles increased hot water demand without a larger tank and fits tight mechanical spaces common in older Lynnwood basements. TopVolk does a blue tape walkthrough with you before drywall closes, confirming every rough-in location and catching anything that needs to change while walls are still open. Deadline penalties are written into the contract — missed schedule milestones have a financial consequence, not just an apology.

faq:
  - q: "How fast can TopVolk get to Lynnwood for an ADU consultation?"
    a: |
      Lynnwood is a straightforward run north on I-5 or SR-99 — typically 25 to 35 minutes from our base, outside rush hour. On-site consultations are scheduled throughout the week, including Saturdays for homeowners who can't break away during the day. Vladislav comes out personally, not a salesperson running a script. From first call to on-site meeting is usually 3 to 5 business days. Call (206) 591-1096 to get on the calendar. We cover all of Snohomish County, so Edmonds, Mountlake Terrace, Mukilteo, and Kenmore are all regular service areas alongside Lynnwood.

  - q: "What does a new detached ADU cost to build in Lynnwood?"
    a: |
      A 600 to 800 sq ft single-story DADU in Lynnwood typically runs $180,000 to $260,000 fully permitted and finished. That range shifts based on site conditions — flat lot versus sloped — utility connection approach, and finish level. LVP flooring and stock cabinets land at the lower end; quartz countertops, semi-custom cabinetry, and a full tile bath push it higher. Attached ADUs over a garage run $120,000 to $175,000. Basement conversions with proper egress, DriCore subfloor, and vapor barrier work start around $65,000 and can reach $115,000 with a full bathroom. TopVolk provides a detailed line-item quote after the site visit — no vague ranges. Schedule a free estimate at (206) 591-1096.

  - q: "Which permits does Lynnwood require for an ADU, and how long does review take?"
    a: |
      Lynnwood Development Services processes ADU permits for properties inside city limits — not Snohomish County PDS, which only covers unincorporated areas. You'll need a full building permit: site plan, floor plan, elevations, structural drawings where applicable, and Washington State Energy Code compliance documentation. First-pass plan review typically takes 8 to 14 weeks. After approval, city inspectors call for rough-in inspection and final inspection before the certificate of occupancy issues. TopVolk prepares the permit package as part of the contract. WA Licensed Contractor — we pull the permit in our name, and the paperwork doesn't land on you to figure out.

  - q: "Does WA HB 1337 actually apply to my Lynnwood property?"
    a: |
      Yes — WA HB 1337 (2024) is a statewide law. It allows up to two ADUs on any single-family lot in Washington, including every parcel inside Lynnwood city limits. You can have a DADU in the backyard plus an attached or basement ADU simultaneously, as long as both meet setback, height, and lot coverage rules. The law also removed owner-occupancy requirements that previously limited ADU rentals and eliminated parking minimums for properties near transit — which applies directly to homes within a half-mile of Lynnwood City Center Station on the 2 Line. Call (206) 591-1096 if you want to walk through what your specific lot can support under current code.

  - q: "How long does a full ADU build take from start to move-in?"
    a: |
      Permit submittal to move-in on a new DADU typically runs 4 to 6 months: 8 to 14 weeks for Lynnwood Development Services plan review, then 6 to 10 weeks of active construction on a straightforward 600 to 800 sq ft single-story unit. Basement conversions run faster on the construction side — 5 to 8 weeks once permits clear, and permit review on a simpler scope often comes back in 4 to 6 weeks. Attached additions land in between. The permit timeline is built into the project schedule from day one. Deadline penalties are written into the contract — if construction runs past the agreed completion date, TopVolk pays a financial penalty. That commitment is in writing before we break ground.

  - q: "Do you build ADUs in Edmonds, Mountlake Terrace, and other nearby cities?"
    a: |
      Yes — TopVolk Construction covers all of Snohomish County, including Edmonds, Mountlake Terrace, Mukilteo, Bothell, Kenmore, and Mill Creek. Each city runs its own permit center with its own review timeline: Edmonds has its own building department, Mountlake Terrace processes permits in-house, and unincorporated Snohomish County parcels go through Snohomish County PDS. We handle the permit package for each jurisdiction as part of the project contract. 100+ projects completed since 2017 across the Seattle metro area. Call (206) 591-1096 to set up a free on-site consultation — no travel fee, no sales pitch.