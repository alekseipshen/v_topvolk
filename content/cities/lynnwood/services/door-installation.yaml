title: "Lynnwood Door Installation — Sealing Out 37 Inches of PNW Rain"

intro: |
  Interstate 5 splits Lynnwood roughly in half, and on both sides you'll find
  the same story: 1970s and 80s tract homes with original entry doors that were
  never built to last 40 years of Snohomish County rain. Those units have long
  since lost their weatherstripping contact, the threshold seal has compressed
  flat, and water has been wicking into the rough opening framing for years
  before anyone notices the damage. Around Alderwood and Meadowdale, that
  framing rot shows up at demo time — which is why proper door installation means
  pulling the old jamb, checking the king studs and jack studs for moisture,
  and flashing the rough opening with Huber ZIP System tape before the new door
  ever touches the opening. We install Therma-Tru and JELD-WEN fiberglass entry
  doors on most projects, along with Milgard and Andersen patio units for
  sliding door replacements. TopVolk Construction LLC has completed 100+
  projects across King and Snohomish counties since 2017, and every job is
  managed directly by owner Vladislav Volkov — no crew dispatch, no
  subcontracted project managers calling you with updates.

localContext: |
  Most of Lynnwood's residential housing was built between 1965 and 1995.
  That construction era — especially concentrated in 98036 and 98037 — relied
  on builder-grade hollow-core interior doors and pre-hung exterior units with
  minimal flashing detail at the rough opening sill. The 98087 zip code covers
  the northern section of the city near the Lynnwood Transit Center, where
  older split-levels sit alongside townhomes built after 2010; that mix means
  door rough opening conditions vary dramatically block to block. For the older
  stock, foundations have settled enough that hinge-side jambs are often no
  longer plumb — a pre-hung door set in an out-of-plumb rough opening will bind
  or gap within a few years. Lynnwood runs its own permit center for work within
  city limits; Snohomish County PDS handles parcels in unincorporated areas
  just outside the city boundary. A door replacement tied to a larger remodel
  goes through the permit process; a straight pre-hung swap in an unchanged
  rough opening typically does not — but the framing condition underneath always
  needs to be evaluated before that call is made.

commonProblems:
  - title: "Rotted Sill Framing Behind Entry Doors — 98036 Split-Levels"
    description: |
      The most consistent finding on 1970s Lynnwood homes is soft framing
      hidden behind a door that looks serviceable from the street. Original
      builders typically skipped self-adhering sill pan flashing at the rough
      opening, relying on caulk that dried out two decades ago. Water runs down
      the face of the door, hits the threshold, and if the threshold isn't
      making solid contact with the sill, it channels into the subfloor and rim
      joist. By the time a homeowner schedules a door replacement, the jack stud
      on one or both sides is already compromised. The fix means removing the
      old pre-hung unit, sistering the damaged framing with pressure-treated
      lumber where it contacts the sill, installing a sloped sill pan, and
      applying ZIP System flashing tape at all four sides of the rough opening
      before the new door goes in. We use Therma-Tru Smooth-Star fiberglass in
      most of these situations — it won't absorb moisture the way a solid wood
      door would if the flashing ever fails again. Entry door replacement
      including framing repair typically runs $2,800–$4,500 depending on how
      far the damage has spread.

  - title: "Patio Slider That Drags and Won't Latch — Alderwood-Area Homes"
    description: |
      Sliding glass doors from the 1980s use a roller-and-track system that
      wears out. The rollers flatten, the aluminum track corrodes, and eventually
      the door drags hard enough that the multi-point latch won't engage. A lot
      of Alderwood-area homes in 98036 still have original single-pane aluminum
      sliders — a real heat-loss problem across the six months of rain that run
      October through May. Replacing with a Milgard Tuscany series or an
      Andersen 200 Series unit solves both problems simultaneously: modern low-E
      glass, a proper thermal break in the frame, and a locking mechanism that
      engages reliably. Homeowners sometimes want to convert a slider opening to
      French doors or a bi-fold configuration; that requires verifying the
      existing header — most 1980s patio openings used a doubled 2x10 or an
      LVL beam depending on build year, and header sizing determines whether a
      wider unit is structurally feasible without additional work. A standard
      6-foot slider replacement typically runs $2,200–$3,800 installed,
      depending on the unit grade and whether any header modification is needed.

  - title: "Interior Door Replacements During Remodels — Permit and Scope Questions"
    description: |
      Interior door replacement gets complicated fast inside a larger remodel.
      Changing a door swing means modifying the rough opening — cutting back
      drywall, reframing one side, and patching. Adding a pocket door in a
      1970s partition wall often uncovers wiring that isn't routed where anyone
      expected, or a load-bearing condition that wasn't documented in the
      original plans. For projects within Lynnwood city limits, door work that
      is part of a larger permitted remodel flows through that same permit;
      standalone interior door swaps in unchanged rough openings don't typically
      require a permit unless structural modifications are involved. Parcels just
      outside the city boundary fall under Snohomish County PDS instead.
      TopVolk is a WA Licensed Contractor, and Vladislav coordinates permit
      applications directly — deadline penalties are written into every contract,
      so if a permit delay causes a schedule slip on our end, that's our
      problem, not yours. Interior door packages for a full home (typically
      8–12 doors) run $4,000–$9,000 depending on door style, casing profile,
      and how many rough openings need modification.

  - title: "What Door Installation Actually Costs in Lynnwood — Real Numbers"
    description: |
      Most pricing guides online are useless for Lynnwood's specific housing
      stock because they don't account for the framing conditions you actually
      find in 1970s and 80s construction. A straight pre-hung fiberglass entry
      door swap in an undamaged rough opening runs $1,800–$2,800 all-in. Add
      framing repair and you're looking at $3,000–$4,500. A patio door
      replacement — aluminum slider to a Milgard or Andersen French door unit
      — typically runs $2,500–$4,500 depending on the unit and whether the
      header needs to be upgraded to a properly sized LVL beam. Smart lock
      integration — Schlage Encode or August Wi-Fi Smart Lock — adds $200–$400
      to an entry door install and is best done at the same time rather than
      retrofitted later. Material grade is the biggest pricing variable: a
      mid-range fiberglass door in a standard paint color is a very different
      number from a wood-clad Marvin entry unit. TopVolk provides line-item
      quotes after an on-site visit — no allowance-based estimates that grow
      into change orders on day one. Call (206) 591-1096 to schedule a free
      consultation directly with Vladislav.

  - title: "Weatherstripping, Threshold Sealing, and Smart Lock Upgrades"
    description: |
      Not every door situation calls for full replacement. If the door slab is
      solid and the frame is dry, new weatherstripping and a Pemko or Endura
      threshold can resolve drafts and water infiltration on their own.
      The catch is that Lynnwood gets roughly 37 inches of rain per year,
      nearly all of it falling October through May, and a door that's been
      leaking even two or three seasons may have hidden sill damage that a
      fresh weatherstrip won't fix. We probe the sill framing and check the
      rough opening before recommending a repair-only approach — replacing
      weatherstripping over a rotted sill is money spent twice. Smart lock
      upgrades like the August Wi-Fi Smart Lock or Schlage Encode are worth
      combining with any entry door work; it's a one-hour addition when the
      door is already off the jamb. A weatherstrip and threshold replacement
      on an intact door runs $400–$800. If the sill pan or framing is
      compromised, full door replacement becomes more cost-effective than
      trying to seal around the damage. We'll tell you honestly which one
      your situation actually calls for.

faq:
  - q: "How fast can you get to Lynnwood for door installation?"
    a: |
      Lynnwood is a regular stop in our Snohomish County schedule — we're
      typically in the area multiple times a week, traveling I-5 north or I-405
      from King County jobs. A free on-site estimate is usually schedulable
      within 3–7 days. From there, a single entry door install with no framing
      repair can happen 1–2 weeks out; projects with framing damage or multiple
      doors take 2–4 weeks depending on material lead times for the selected
      unit. Call (206) 591-1096 and you'll reach Vladislav directly —
      not a scheduling coordinator, not a salesperson working toward a close.

  - q: "What does entry door installation cost in Lynnwood?"
    a: |
      A standard pre-hung fiberglass entry door in an undamaged rough opening
      typically runs $1,800–$2,800 all-in for Lynnwood homes. Framing repair —
      common on 1970s and 80s homes in 98036 and 98037 — adds $500–$1,500
      depending on how far the rot has spread. Sliding patio door replacements
      with Milgard or Andersen units run $2,200–$3,800 installed. Interior door
      packages for a full-home remodel are $4,000–$9,000. Every quote from
      TopVolk is line-item specific with no vague ranges. Call (206) 591-1096
      for a free on-site estimate and exact pricing from Vladislav.

  - q: "Do I need a permit for door installation in Lynnwood?"
    a: |
      A straight pre-hung door swap in the same rough opening — same dimensions,
      no structural changes — generally doesn't require a permit in Lynnwood.
      If you're enlarging the rough opening, adding a new door where one didn't
      exist, or the door work is part of a larger permitted remodel, then you'll
      go through Lynnwood's city permit center. Parcels in unincorporated
      Snohomish County just outside city limits fall under Snohomish County PDS
      instead. TopVolk is a WA Licensed Contractor and handles permit
      applications and coordination for all projects that require it — plan
      review for straightforward door work tied to a remodel typically runs
      2–4 weeks through either jurisdiction.

  - q: "Fiberglass vs. solid wood entry doors — which holds up better in Lynnwood?"
    a: |
      For most Lynnwood homes, fiberglass is the practical call. Solid wood
      doors look excellent when new, but Snohomish County's sustained rain from
      October through May puts real stress on painted wood — checking at the
      bottom rail, seasonal swelling that throws off the weatherstrip contact,
      and paint failure that opens the door to moisture. A quality fiberglass
      door like a Therma-Tru Smooth-Star or a Plastpro unit with a solid foam
      core holds its shape through humidity swings and won't rot if the
      weatherstripping fails for a season. Solid wood still makes sense on
      protected entries with a deep covered porch where the door sees minimal
      direct rain. For north-facing or exposed openings — common on Lynnwood's
      grid-street layouts — fiberglass is the durable choice without question.

  - q: "What warranty comes with a new door installation from TopVolk?"
    a: |
      Manufacturer warranties cover the door unit itself: Therma-Tru and
      JELD-WEN fiberglass entry doors carry lifetime limited warranties on the
      slab against warping and delamination; Milgard patio doors include their
      Full Lifetime Warranty for the original purchaser. Hardware — Schlage or
      Moen locksets, hinges, handles — typically carries 1–3 years from the
      manufacturer. Our installation labor is separately warranted: if a door
      we hung develops a swing or seal problem within a year due to our
      installation, we come back and address it at no charge. The bigger
      long-term risk in Lynnwood is the rough opening framing underneath the
      door, not the door itself — which is exactly why we assess that framing
      condition before the new unit ever goes in.

  - q: "Do you serve other cities near Lynnwood for door installation?"
    a: |
      Yes — TopVolk works throughout Snohomish County and King County on a
      regular basis. Mountlake Terrace, Edmonds, Mukilteo, Mill Creek, Bothell,
      Shoreline, and Kenmore are all within our standard service area and
      typically within 20 minutes of each other along I-5 and I-405.
      Unincorporated Snohomish County parcels adjacent to Lynnwood are also
      well within range — Snohomish County PDS permit coordination is something
      we handle routinely. Scheduling is coordinated directly with Vladislav, and
      we route nearby jobs together when possible. Call (206) 591-1096 to set up
      a free on-site estimate for your door project.