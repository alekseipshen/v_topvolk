  - q: "Do I need a permit for power washing in Lynnwood?"
    a: |
      No permit is required for exterior surface washing — it's maintenance work, not construction. If the power washing is prep for a project that does require permitting (deck rebuild, full re-side, structural fence replacement), those permits run through the City of Lynnwood's Community Development department for in-city properties, or through Snohomish County PDS for unincorporated parcels in the area. Lynnwood's in-city permit review for simple residential projects typically takes two to four weeks. TopVolk is a WA Licensed Contractor and handles all permit coordination for the construction phases of a project — the washing step runs ahead of that process and doesn't require its own filing.

  - q: "What's the difference between pressure washing and soft washing — and which does my Hardie siding need?"
    a: |
      Pressure washing removes surface material mechanically using high water pressure, typically 1,500-3,000 PSI or higher. Soft washing uses much lower pressure — 100-500 PSI — paired with a higher concentration cleaning solution, usually a sodium hypochlorite and surfactant mix, to kill and rinse biological growth chemically rather than blasting it off. Hardie cement-board siding needs soft wash or a controlled low-pressure pass below 1,500 PSI with a wide fan tip. Running high pressure at panel laps or around window and door penetrations forces water behind the siding, which can compromise the vapor barrier and eventually cause rot in the sheathing and framing. Composition shingle roofs always get soft wash only. Concrete and pavers handle higher pressure well. Cedar decking lands in the middle — 600-800 PSI with the correct tip angle prevents grain damage.

  - q: "How long before moss and algae grow back after power washing in Lynnwood?"
    a: |
      In Lynnwood's climate, biological growth re-establishes on untreated surfaces within one to two seasons — faster on north-facing areas with limited sun exposure. Washing removes existing growth; it doesn't prevent the next cycle on its own. The most effective long-term measure on composition roofs is a zinc strip installed at the ridge line, which releases zinc ions with every rain event and inhibits moss spore development. On cedar decks and fences, a stain or sealer with a built-in mildewcide additive extends the clean period considerably versus bare wood. Concrete and paver surfaces benefit from a penetrating silane-siloxane sealer applied after cleaning — this reduces moisture absorption, which is what algae and mold need to establish. Realistically, planning a rewash every two to three years is appropriate for most Lynnwood properties with significant tree coverage.

