title: "Lynnwood HVAC — Heat Pumps, Mini-Splits & Duct Rebalancing"

intro: |
  Most of Lynnwood's older residential blocks — the streets around Scriber Lake
  Park and the subdivisions running south off 196th Street SW — were built when
  natural gas was cheap and nobody ran central air conditioning. Those houses
  got single-zone furnaces with ductwork sized strictly for heating. Fifty years
  of additions, insulation upgrades, and room conversions have turned that
  original sheet metal into a system full of leaks and dead-end branches that
  barely deliver conditioned air to the far end of the house. Summers now push
  past 90°F more often than they used to, and the Alderwood area's mix of 1960s
  ranchers and 1980s two-stories is running on mechanical equipment that was
  never designed for a cooling load at all. A Mitsubishi ductless mini-split can
  handle an addition or garage conversion without touching the existing duct
  system — but if the main house has leaking trunk lines, new equipment will
  never hit its rated SEER efficiency. TopVolk Construction has managed HVAC
  projects across Lynnwood since 2023, pulling permits with the City of
  Lynnwood Building Division and coordinating MEP trades so homeowners aren't
  juggling three separate subcontractors.

localContext: |
  The 98036 zip code — west Lynnwood, running from Highway 99 toward the
  Mountlake Terrace border — is dense with 1960s and early-70s single-story
  ranchers on 7,000–9,000 sq ft lots. Original forced-air systems, gas furnaces
  with heat exchangers that are 20-plus years past their design life, and
  ductwork that was never air-sealed at the trunk connections. The 98037 zip,
  which covers the eastern half of the city toward the Interurban Trail corridor,
  skews slightly newer — more 1980s two-stories and 1990s townhome clusters with
  better-insulated envelopes but identical duct sealing problems. Lynnwood
  receives roughly 37 inches of rain annually, and attic spaces on north-facing
  roof slopes regularly develop moisture intrusion that degrades batt insulation
  and creates condensation around supply plenums. That moisture problem
  compounds any existing duct leakage: warm conditioned air hitting a cold,
  damp attic section means you're losing efficiency twice. Washington State's
  Energy Code (chapter 51-11C WAC) now mandates duct leakage testing at rough-in
  inspection for permitted HVAC work, so every job TopVolk pulls a permit on
  goes through that verification step. The City of Lynnwood Building Division
  handles mechanical permits inside city limits, with plan review typically
  running 2–4 weeks for a standard heat pump replacement or furnace swap.

commonProblems:
  - title: "Gas Furnace Past Its Life Expectancy in a 1960s Lynnwood Rancher"
    description: "A cracked heat exchanger in a 25-year-old furnace is a carbon monoxide
      risk, not just an efficiency problem — and it's a common find in 98036
      homes that never replaced original equipment. At 78% AFUE or lower, that
      furnace is wasting more than 20 cents of every gas dollar straight up the
      flue. Replacing it with a 96% AFUE condensing unit like a Carrier
      Performance 96 or Lennox EL296V cuts that waste significantly and qualifies
      for Puget Sound Energy's efficiency rebate program. Condensing furnaces
      produce acidic condensate, so the original B-vent chimney liner can't be
      reused — new PVC or CPVC venting has to be routed to an exterior wall. A
      City of Lynnwood mechanical permit, rough-in inspection, and final sign-off
      add about 2–3 weeks to the project timeline. Installed cost for a
      mid-efficiency gas furnace replacement in a 1,400–1,800 sq ft Lynnwood
      rancher typically runs $4,500–$7,000."

  - title: "Heat Pump Conversion Backed by Inflation Reduction Act Rebates"
    description: "HEEHRA — the High-Efficiency Electric Home Rebate Act under the
      Inflation Reduction Act — offers up to $8,000 toward a qualifying heat pump
      installation for households at or below 150% of area median income. At
      Snohomish County's AMI levels, a substantial share of Lynnwood homeowners
      fall within that range. Cold-climate heat pumps like the Mitsubishi Hyper
      Heat MXZ series or Daikin DZ20VC maintain full heating output down to 5°F,
      which matters during freeze events near the foothills side of Lynnwood along
      164th Street SW. Most homes running 100-amp electrical service will need a
      panel upgrade to 200 amp before a 240V heat pump circuit can be added — that
      cost needs to be factored in upfront. Refrigerant line set routing through
      the attic or exterior wall also needs to be planned before the permit package
      goes in. Total project cost before incentives typically runs $9,000–$14,000
      for a ducted whole-home conversion; after the 30% federal tax credit and
      HEEHRA rebates, out-of-pocket often drops below $5,000. Call (206) 591-1096
      to get a line-item estimate and confirm which incentive programs apply to
      your address."

  - title: "Ductwork Leaking 25–30% of Conditioned Air Into the Attic"
    description: "The biggest HVAC performance problem in Lynnwood's older housing stock
      isn't the equipment — it's the duct system. Homes built between 1960 and
      1985 typically have sheet-metal trunk lines with fiberglass duct tape at
      every connection. That tape fails within 10–15 years. A duct blaster
      pressurization test on a 98036 rancher will often show leakage rates of
      25–30% to outside — nearly a third of the air the furnace or heat pump
      conditions never reaches a single register. The fix involves mastic sealant
      at every trunk and branch connection, Aeroseal pressurized duct sealing for
      runs that aren't physically accessible, and R-8 duct insulation wrap on any
      supply duct running through unconditioned attic space. Washington State
      Energy Code requires duct leakage at or below 4 CFM25 per 100 sq ft of
      conditioned floor area on new and replacement systems. Hot rooms upstairs or
      cold bedrooms at the far end of the house almost always trace back to duct
      leakage, not undersized equipment — and swapping equipment without sealing
      ducts first is money wasted."

  - title: "Ductless Mini-Split for ADU, Garage Conversion, or Room Addition"
    description: "WA HB 1337 (2024) allows up to two ADUs per single-family lot statewide,
      and Lynnwood has seen a noticeable uptick in DADU and AADU permits since
      the law passed. The practical problem: a detached ADU or converted garage
      has no ductwork, and extending a duct branch from the main house across a
      crawlspace or overhead is expensive and often code-restrictive. A
      single-zone Mitsubishi MZ-FH15NA or Daikin FTXS series wall-mounted
      mini-split handles an 800–1,200 sq ft DADU efficiently, with SEER ratings
      of 18–22 — well above Washington's Energy Code minimum. Installation
      requires a dedicated 240V circuit, an exterior wall penetration for the
      refrigerant line set and condensate drain, and a City of Lynnwood mechanical
      permit. TopVolk coordinates the electrical subcontractor, pulls the permit,
      and handles inspection scheduling so homeowners aren't managing that
      independently. Installed cost for a single-zone 15,000 BTU system runs
      $3,800–$5,500 depending on line set length and any panel work required."

  - title: "Smart Thermostat Upgrades That Fight the Existing Wiring"
    description: "A Nest Learning Thermostat or ecobee SmartThermostat Premium sounds like
      a straightforward swap. In a 1972 Lynnwood split-level with a multi-zone
      damper board, it almost never is. The old zone control board may lack a
      C-wire terminal, the transformer may be undersized for the smart
      thermostat's continuous power draw, and existing dampers may be pneumatic
      rather than 24V electric. The ecobee with its SmartSensor room sensors and
      Power Extender Kit resolves the C-wire problem in most single-zone setups.
      For homes with a heat pump, the thermostat wiring needs to correctly map
      the auxiliary heat strip circuit to the W2/E terminal — otherwise the backup
      resistance heat runs simultaneously with the heat pump and doubles the
      electric bill during cold snaps. Full zoning upgrades with a Honeywell
      TruZONE or Ecojay SmartZone damper control board add $1,200–$2,500 to a
      thermostat project but consistently cut energy use 15–20% in two-story
      homes with a significant upstairs-downstairs temperature split."

faq:
  - q: "How fast can you get to Lynnwood for an HVAC estimate?"
    a: "Lynnwood is a straightforward drive up I-5 — typically 20–30 minutes from
      Seattle, less from Shoreline or Mountlake Terrace. Vladislav does the
      on-site consultations personally, so the estimate comes from the same person
      who runs the project, not a salesperson handing off to a crew you've never
      met. Project timelines are written into the contract with penalty clauses
      for missed deadlines — that's not a verbal commitment, it's an enforceable
      contract term. Most estimates schedule within a few days. For urgent no-heat
      situations, call (206) 591-1096 directly. Permit applications to the City
      of Lynnwood Building Division typically go in within a week of contract
      signing, with plan review running 2–4 weeks."

  - q: "What does a heat pump installation cost in Lynnwood?"
    a: "A full ducted whole-home heat pump conversion on a 1,500 sq ft Lynnwood
      rancher typically runs $9,000–$14,000 installed before incentives. What
      moves that number: whether the electrical panel needs a service upgrade to
      200 amp, how complex the refrigerant line set routing is through the attic
      or exterior walls, and whether existing ductwork needs mastic sealing or
      reconfiguration before new equipment goes in. The 30% federal tax credit
      and up to $8,000 in HEEHRA rebates bring out-of-pocket costs well below
      $6,000 for qualifying households. Ductless single-zone mini-splits for a
      room addition or ADU run $3,800–$5,500. Every TopVolk estimate is a
      line-item quote — no vague ranges, no surprises at final billing."

  - q: "Do you need a permit for HVAC work in Lynnwood?"
    a: "Yes, for any equipment replacement or new installation. The City of
      Lynnwood Building Division issues mechanical permits for work inside city
      limits; Snohomish County PDS handles anything in unincorporated pockets
      nearby. A heat pump replacement permit typically requires equipment
      specifications, a Manual J load calculation, and a duct leakage test report
      at rough-in inspection. TopVolk files the permit package, coordinates the
      duct blaster test, and schedules inspections — homeowners don't manage
      that paperwork. Plan review in Lynnwood generally takes 2–4 weeks, and
      we account for that in the project schedule. TopVolk is a WA Licensed
      Contractor; mechanical subcontractors we use are always pulled under a
      proper permit structure."

  - q: "Will a heat pump actually keep up during a Lynnwood winter?"
    a: "Standard heat pumps lose capacity below 35°F, which is why older installs
      in the Seattle area developed a reputation for inadequate heating — they
      were undersized for the climate or not rated for low-temperature operation.
      Cold-climate heat pumps certified on NEEP's qualifying list — the Mitsubishi
      Hyper Heat line and the Bosch IDS 2.0 series, for example — maintain 70–80%
      heating capacity down to 5°F. Lynnwood doesn't see prolonged deep freezes,
      but the occasional cold snap pulls temperatures into the low 20s,
      particularly during ridge-pressure weather events. Proper Manual J load
      calculation and equipment sizing to the actual house — not to whatever
      tonnage is easiest to stock — is what determines whether the system
      performs. We size to the structure, then select equipment."

  - q: "What warranty comes with a new heat pump or furnace?"
    a: "Manufacturer warranties depend on the brand and registration. Mitsubishi
      and Daikin mini-splits carry 12-year compressor and 12-year parts warranties
      when registered within 60 days of installation — Mitsubishi's Diamond
      Contractor program extends that further in some cases. Carrier and Lennox
      gas furnaces typically run 10-year parts warranties with lifetime heat
      exchanger coverage on qualifying models. TopVolk provides a 1-year labor
      warranty on the installation itself: if something in our scope causes a
      problem, we come back and fix it at no charge. Warranty registration is
      handled as part of the project closeout — homeowners don't need to chase
      that paperwork independently."

  - q: "Do you serve Edmonds, Mountlake Terrace, and other cities near Lynnwood?"
    a: "Yes — TopVolk covers all of Snohomish County including Edmonds,
      Mountlake Terrace, Mill Creek, Bothell, Mukilteo, and Kenmore, plus King
      County cities like Shoreline, Woodinville, and Kenmore. Lynnwood sits
      roughly in the middle of the Snohomish service area, so scheduling is
      straightforward. New HVAC projects are typically booking 1–3 weeks out,
      with summer and early fall being the busiest window for AC additions.
      Schedule a free on-site consultation or call (206) 591-1096 to get on the
      calendar. TopVolk has completed 100+ projects across the Seattle Metro
      since 2023, with direct owner communication throughout — no hand-offs to
      project managers or office coordinators."