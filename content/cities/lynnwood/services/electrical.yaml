  - q: "What does a 200-amp panel upgrade cost in Lynnwood?"
    a: |
      A standard 100A to 200A service upgrade in Lynnwood — new meter base, 200A
      main breaker panel, and PSE coordination for the meter pull — typically runs
      $3,500–$6,500. What moves that number: panel location (exterior wall vs.
      interior utility room), whether the meter base needs repositioning, and the
      condition of the existing service entrance conductors. If the home also needs
      AlumiConn remediation at devices at the same time, add $2,000–$5,000 to the
      total depending on circuit count. We provide a written line-item quote after the
      on-site walkthrough — no vague ranges and no surprises at invoice. Call
      (206) 591-1096 or schedule a free on-site estimate to get started.

  - q: "Does Lynnwood require permits for panel upgrades and EV charger circuits?"
    a: |
      Yes. The City of Lynnwood processes its own electrical permits through its
      permit center — this is separate from Snohomish County PDS, which handles
      unincorporated county areas like parts of Mountlake Terrace and Mill Creek
      that fall outside city limits. An electrical permit is required for service
      upgrades, any new dedicated circuit (including EV chargers), and rewiring work.
      Plan review for a straightforward panel upgrade typically runs 2-3 weeks.
      TopVolk handles permit applications as part of the project scope — you don't
      navigate the Lynnwood portal yourself. Work requires a rough-in inspection and
      a final inspection by the city's electrical inspector before the permit closes.
      TopVolk is a WA Licensed Contractor with all required documentation for permit
      submissions in Lynnwood and across Snohomish County.

  - q: "Can you install a Tesla Wall Connector or ChargePoint charger at my Lynnwood home?"
    a: |
      Yes — we install dedicated EV charger circuits for Tesla Wall Connectors,
      ChargePoint Home Flex, and JuiceBox 48 units. All three require a dedicated
      50A or 60A circuit with 6 AWG copper minimum for the run length involved.
      The first step is always a panel capacity check. A large portion of Lynnwood
      homes in 98087 built in the 1965-1975 window have 100A panels that are already
      running near capacity with electric heat or aging appliances — in those cases,
      the panel upgrade has to come first, which we scope and price together.
      If your panel has available headroom, the charger circuit with permit typically
      runs $800–$1,800. We pull the permit, schedule the city inspection, and
      coordinate with PSE when a service upgrade is part of the scope.

  - q: "How do I know if my Lynnwood home needs AlumiConn pigtailing or a full rewire?"
    a: |
      AlumiConn pigtailing at devices is a legitimate, code-accepted repair when the
      aluminum wiring itself is in good condition — no prior overheating events, no
      scorched insulation at junction boxes, no melted device contacts. It works well
      and is significantly less disruptive than opening walls. A full copper rewire
      makes more sense when there's evidence of heat damage, when a major remodel has
      walls open anyway, or when an insurance carrier specifically requires copper
      replacement rather than device-level remediation. For knob-and-tube, there's no
      halfway option — if it's active and load-bearing, it needs to be replaced
      entirely. We assess this during the on-site walkthrough and give written pricing
      for both paths where both are viable. No upsell to a full rewire when pigtailing
      is the right answer for the situation.

  - q: "Do you cover other Snohomish County cities near Lynnwood?"
    a: |
      TopVolk works throughout Snohomish County — Edmonds, Mountlake Terrace,
      Shoreline (King County border), Bothell, Mill Creek, Mukilteo, Marysville, and
      Everett are all regular service areas. Electrical work in unincorporated
      Snohomish County goes through Snohomish County PDS rather than a city permit
      center, which changes the plan review process and timeline slightly. No travel
