title: "Lynnwood Home Additions — Expanding 1960s Ranch Homes in Snohomish County"

intro: |
  The 1960s ranchers packed into the streets around Scriber Lake Park weren't built with a home
  office, an in-law suite, or a rental unit in mind. Back then, 1,100 square feet worked fine.
  Lynnwood's 98036 and 98037 zip codes are thick with these split-levels and single-story
  ranchers — solidly built on Douglas-fir framing, but sized for a different era. Rather than
  list and buy into Snohomish County's current market, where finished square footage costs
  $600–$900 to replace, Alderwood-area homeowners are increasingly choosing to build out or up.
  WA HB 1337, passed in 2024, made that calculation even better: up to two ADUs are now legal
  on a single-family lot statewide. When the addition needs its own HVAC zone, a Mitsubishi
  mini-split handles the new space without overloading the existing ductwork or ripping into
  1960s-era supply plenum. TopVolk Construction LLC has completed 100+ additions and ADUs across
  Snohomish County since 2023 — Vladislav Volkov runs every estimate and every job site
  directly, reachable at (206) 591-1096.

localContext: |
  Lynnwood's residential core — particularly the neighborhoods feeding into the 98036 zip code —
  runs heavily toward 1960s and early 1970s single-story ranchers and split-levels. Most sit on
  crawlspaces, which means any addition tying into the existing structure requires inspecting the
  rim joist condition first and confirming the vapor barrier is intact. Both often need attention
  before framing begins on new square footage. Over in the 98037 corridor near Alderwood Mall,
  you start seeing more 1970s-era two-stories, but the structural assumptions are similar and
  foundations still need assessment before a second-story load goes on them. Lynnwood's zoning
  allows 5-foot side yard setbacks and 20-foot front setbacks in most RS-8 and RS-10 zones, and
  FAR limits cap total finished area at roughly 40% of lot coverage depending on the zone — that
  math determines whether a second-story addition, a room addition, or a DADU pencils out on a
  given lot. Permit review runs through the City of Lynnwood Building Division; plan review for
  additions typically takes 6–10 weeks. PNW rain from October through May makes crawlspace
  moisture management a prerequisite — a 6-mil poly vapor barrier before any framing starts is
  non-negotiable here.

commonProblems:
  - title: "DADU Permitting and Lot Coverage — WA HB 1337 Changed the Rules, Not the Zoning Math"
    description: |
      Lynnwood homeowners got a green light from the state in 2024: WA HB 1337 legalized up to
      two ADUs per single-family lot statewide. The state law doesn't override Lynnwood's local
      FAR limits, though. Most RS-8 zones in 98036 allow roughly 40% lot coverage — on a
      7,500-square-foot lot, that's 3,000 square feet of footprint to work with, counting the
      existing house, garage, and any detached structure. A DADU in the backyard needs its own
      foundation (typically a 4-inch concrete slab or a PT lumber-framed floor system on piers),
      a separate electrical service panel, and an independent water and sewer connection in most
      cases. Height limits cap at 24 feet for detached structures. Parking exemptions apply if
      the lot sits within a half-mile of a transit stop — much of Lynnwood qualifies given the
      Link Extension. Plan review at the City of Lynnwood Building Division runs 6–10 weeks.
      End-to-end, budget 4–7 months from permit submittal to certificate of occupancy.

  - title: "Second-Story Additions — 1960s Lynnwood Foundations Weren't Designed for That Load"
    description: |
      Adding a second story to a 1960s Lynnwood rancher sounds manageable until the structural
      engineer looks at the foundation. Most of these homes were built on continuous concrete
      perimeter footings sized for a single-story load — adding 600 to 1,200 square feet of
      second-floor living space means calculating whether the existing footing width and depth can
      carry the new dead and live loads under IRC requirements. If they can't, the fix involves
      widening the footings or installing PSL posts and LVL beams to redirect load to new point
      supports. That means excavation, which adds both cost and timeline. Lynnwood averages 37
      inches of rain annually, and soil bearing capacity in some areas requires a formal soil
      report before the structural engineer can stamp the drawings. Budget $180,000–$280,000 for
      a full second-story addition on a 1,100-square-foot rancher depending on finish level.
      Structural work alone — footing upgrades, LVL beam installation, joist hangers, and
      blocking — can run $35,000–$55,000 before a stud goes up.

  - title: "Matching Mid-Century Exterior Siding — The Patchwork Problem on Lynnwood's Ranchers"
    description: |
      Lynnwood's mid-century ranchers were built with horizontal wood lap siding or early vinyl,
      most of it long out of production in the original profile and exposure. When an addition
      extends a wall or changes the roofline, the new siding has to tie into what exists — and a
      profile mismatch is visible from the street on day one. The practical fix for most 98036
      and 98037 homes is re-siding the entire main structure in Hardie cement-board (HardiePlank
      in a 7-inch exposure reads close to the original lap profile) while the addition framing is
      still open. Costs more upfront, but eliminates the patchwork look and adds long-term rot
      resistance — critical when north-facing wood surfaces in Lynnwood collect moss and mildew
      by year three. Roofing match follows the same logic: if the existing shingles are 15 or
      more years old, replacing the full roof while the addition ties in prevents a visible seam
      line. CertainTeed Landmark shingles in a neutral architectural tone handle that cleanly on
      most of these homes.

  - title: "HVAC for the New Square Footage — Why 1960s Forced-Air Systems Can't Just Stretch"
    description: |
      Extending the existing forced-air system into a Lynnwood addition sounds like the cheap
      path. It usually isn't. Most 1960s ranchers are running a furnace sized for the original
      footprint — adding 400 to 800 square feet of conditioned space means the system is
      undersized, and the new ductwork run increases static pressure enough to reduce airflow
      throughout the whole house. The cleaner solution for additions under 600 square feet is a
      ductless mini-split. A Mitsubishi MXZ or Bosch Climate 5000 handles the new zone
      independently, doesn't load the existing system, and qualifies for Snohomish County PUD
      rebates on heat pump units. MEP coordination — mechanical, electrical, plumbing — has to
      happen at rough-in, before drywall goes up; that's a hard sequencing constraint on the
      project schedule. Budget $3,500–$6,500 for a single-zone mini-split installed, or
      $9,000–$15,000 to upsize and extend the existing forced-air system. Getting the mechanical
      rough-in inspection signed off before insulation is a City of Lynnwood inspection
      requirement, not optional.

  - title: "Attached ADU Layouts — Separate Entrance, Kitchen Rough-In, and What the Code Actually Requires"
    description: |
      A mother-in-law suite attached to a Lynnwood rancher — technically an AADU (Attached ADU)
      — is a fundamentally different project than adding a bedroom. Lynnwood's code requires a
      separate entrance that doesn't route through the main unit's living space, a full bathroom,
      and a kitchen or kitchenette with its own dedicated circuits. The kitchen rough-in tends to
      be the most involved part: a 20-amp circuit for the refrigerator, a separate 20-amp circuit
      for the microwave, a range circuit, and a range hood sized for adequate CFM given the room
      dimensions. Plumbing for the kitchenette tees off the main supply and drain lines — but if
      the home is on galvanized pipe, common in pre-1975 Lynnwood construction, that's the right
      time to repipe in PEX or copper before closing walls. Budget $85,000–$145,000 for a full
      AADU conversion with separate entrance, bathroom, and kitchenette. That range shifts
      significantly depending on how much existing space converts versus how much is built new.

faq:
  - q: "How fast can you get to Lynnwood for a home addition consultation?"
    a: |
      TopVolk Construction is based in the Seattle metro area, and Lynnwood is a regular project
      corridor. I-5 north puts us in the 98036 and 98037 zip codes in 20–30 minutes from central
      Seattle — less from Shoreline or Edmonds. On-site consultations with Vladislav are free,
      and you're meeting with the person who will actually run the project, not a sales rep
      handing notes to someone else. After the site visit, a detailed, line-itemized quote comes
      back within 3–5 business days. Call (206) 591-1096 to book — weekday and Saturday
      appointments both available.

  - q: "What does a home addition in Lynnwood typically cost?"
    a: |
      TopVolk works on project-based additions, not hourly labor. The range runs $30,000 for a
      modest room addition on the small end up to $200,000+ for a full second-story or DADU with
      separate utilities. In Lynnwood's market specifically, a main-floor room addition of
      250–400 square feet typically runs $85,000–$130,000 all-in — permits, framing, MEP
      rough-in, drywall, and finishes included. An attached ADU with separate entrance and
      kitchenette runs $100,000–$160,000. A detached ADU with its own foundation and utilities
      starts around $150,000 and goes up from there based on size and finish level. Quotes are
      fully line-itemized. Call (206) 591-1096 for a free on-site estimate with specific numbers
      for your lot and project.

  - q: "What permits does a home addition require in Lynnwood, and how long does it take?"
    a: |
      Lynnwood additions run through the City of Lynnwood Building Division — not Snohomish
      County PDS, which only covers unincorporated areas. A building permit is required for any
      addition that adds square footage or modifies the structural system. Anything involving LVL
      beams, new foundation work, or a second-story load also requires a stamped structural
      engineering package. Plan review runs 6–10 weeks for addition projects. ADU applications
      under WA HB 1337 require a site plan showing lot coverage and setback compliance on top of
      the standard building permit package. TopVolk prepares all permit documentation and handles
      submittal and inspection coordination — rough-in through final — as a WA Licensed
      Contractor. Vladislav coordinates directly with the building department throughout; you
      aren't chasing status updates on your own.

  - q: "Can you build a detached ADU (DADU) on my Lynnwood property under WA HB 1337?"
    a: |
      Yes. WA HB 1337 (2024) allows up to two ADUs per single-family lot statewide, and Lynnwood
      implements the state law. The first step is a site analysis checking lot coverage, existing
      footprint, setback distances, and FAR — those variables determine what size DADU fits and
      where on the lot it can go. Most RS-8 lots in 98036 with a modest existing house can
      accommodate a 400–600 square foot detached unit in the backyard. Separate utility
      connections are required: a new electrical service panel and typically a new water meter.
      TopVolk has completed DADU projects across King and Snohomish counties and knows the
      Lynnwood plan review process well. Call (206) 591-1096 to schedule a site analysis and
      find out what your specific lot can support.

  - q: "What warranty comes with a TopVolk home addition?"
    a: |
      Workmanship warranty is 2 years on labor and installation, written into the contract.
      Material warranties pass through from the manufacturer: Hardie siding carries a 30-year
      limited warranty, Milgard windows come with a Full Lifetime Warranty, and CertainTeed
      Landmark roofing shingles carry a 25- to 50-year warranty depending on the product tier.
      Structural framing — LVL beams, PSL posts, joist hangers — is built to IRC standards and
      inspected by the AHJ at rough-in and final inspection. If something fails within the
      workmanship period, Vladislav handles it directly. Deadline penalties are also written into
      every TopVolk contract: if a project milestone is missed, there's a financial consequence
      built in — not a vague apology about scheduling.

  - q: "Do you work in other Snohomish County cities near Lynnwood?"
    a: |
      Lynnwood sits in the middle of a project corridor that runs north-south across Snohomish
      County. TopVolk regularly works in Edmonds, Mountlake Terrace, Bothell, Mill Creek, and
      Mukilteo. Everett and Marysville come up on a project-by-project basis for larger jobs. In
      King County, Shoreline and Kenmore are close enough to treat as local. Scheduling typically
      opens within 1–2 weeks of the on-site consultation for projects ready to move into design
      and permitting. Call (206) 591-1096 or schedule directly with Vladislav — he comes to the
      site himself, not a scheduler or a closer.