title: "Lynnwood Painting — Cedar, Hardie & Pre-1978 Home Repaints"

intro: |
  Scriber Lake Road and the blocks fanning out around 44th Ave W give you a
  pretty clear picture of Lynnwood's housing stock — mostly 1960s and early
  1970s ranchers, cedar trim that's been cycling through Snohomish County
  winters for 50-plus years, and exterior paint that started failing long
  before the current owners moved in. That rain from October through May,
  roughly 37 inches a year here, doesn't forgive deferred maintenance on wood
  surfaces. Cedar shake siding especially will go gray, check, and start
  drinking moisture in under five years without a proper two-coat acrylic
  application on a primed surface. The Alderwood corridor — running through
  98036 toward the mall and out into the subdivisions off 196th St SW — has a
  dense concentration of pre-1978 homes, which means lead-based paint testing
  under EPA RRP rules is part of the job before any sanding or scraping starts.
  Vladislav Volkov, WA Licensed Contractor, has handled exterior and interior
  painting projects on this exact housing stock since 2023. Call
  (206) 591-1096 to schedule a walk-through.

localContext: |
  Most of Lynnwood's residential core sits in 98036 and 98037, with the older
  tract development concentrated west of I-5 and newer infill running north
  toward Mountlake Terrace. The ranchers built through the 1960s in areas like
  Meadowdale and the Westgate neighborhoods typically have wood lap siding or
  cedar shake, and nearly all of them predate 1978 — which puts lead paint
  compliance front and center for any repaint or prep work involving sanding.
  Homes in the 98087 zip code, particularly the subdivisions that filled in
  during the 1980s and 1990s, shifted toward Hardie cement-board siding, which
  has its own repaint cycle: plan on a full exterior repaint every 8-10 years
  in this climate, and a spot prime-and-paint on south and west faces every
  5-7. North-facing walls in Lynnwood are particularly prone to moss and
  mildew accumulation because of the tree cover common in the older
  neighborhoods — power washing before any paint application isn't optional,
  it's structural prep. City of Lynnwood issues its own building permits
  through its permit center, separate from Snohomish County PDS, though
  painting work alone rarely triggers a permit unless it's folded into a
  larger remodel.

commonProblems:
  - title: "Cedar Shake Failing After 5-7 Years — Wrong Paint System Is Usually Why"
    description: |
      Cedar shake is the most common exterior cladding on Lynnwood's pre-1980
      homes, and it takes a sustained beating from fall through spring. The
      problem usually isn't the cedar itself — it's a failed paint system that
      let moisture penetrate the face grain and the butt edges. Once moisture
      gets in, the film lifts, checks form along the grain, and you're looking
      at rot in the lower courses within a season or two. The correct sequence
      is pressure wash, let dry 48-72 hours minimum, spot-prime all bare wood
      with an oil-based primer like Zinsser BIN or Cover Stain, then two coats
      of Sherwin-Williams Duration Exterior acrylic. Duration is formulated
      thick enough to bridge minor checking without building up a brittle,
      peeling film over subsequent seasons. Budget $4,500-$8,500 for a full
      exterior repaint on a 1,800-2,200 sq ft Lynnwood rancher depending on
      siding condition and how much prep the surface requires.

  - title: "Lead Paint in Pre-1978 Homes — EPA RRP Compliance Before Any Sanding"
    description: |
      A significant portion of homes in the 98036 and 98037 zip codes were
      built before 1978, which is the federal cutoff for lead-based paint in
      residential construction. Any contractor sanding, scraping, or otherwise
      disturbing more than 6 square feet of painted surface in these homes is
      legally required to follow EPA RRP (Renovation, Repair, and Painting)
      protocols — that means lead swab testing or XRF testing before work
      starts, physical containment setup, HEPA vacuum cleanup, and job
      documentation. Some contractors skip this step on smaller jobs. That's
      both a compliance risk and a real health exposure hazard, especially in
      homes with children. Testing adds $150-$300 to the project; proper
      containment adds roughly a day of setup labor. TopVolk follows EPA RRP
      procedures on all pre-1978 work and provides documentation on request.
      Most 1960s ranchers in the Alderwood corridor come back positive for lead
      in at least the original paint layers.

  - title: "Mildew and Moss on North-Facing Walls — Surface Prep Is the Actual Fix"
    description: |
      North-facing exterior walls in Lynnwood's tree-lined neighborhoods —
      Meadowdale especially — build up moss and mildew fast. Heavy canopy keeps
      those walls in shade most of the year, and with the rain volume this part
      of Snohomish County sees, biological growth takes hold within 2-3 years
      of a fresh topcoat if the surface wasn't properly cleaned first. Painting
      over mildew is the single most common reason exterior paint jobs fail
      early in the PNW — the new coat just gives the mildew a fresh surface to
      push through. Correct prep is a 3% sodium hypochlorite wash applied to
      all affected surfaces, a 15-minute minimum dwell time, thorough rinsing,
      and complete drying before any primer goes down. After topcoat
      application, a mildewcide additive blended into the finish coat —
      available for both Sherwin-Williams and Benjamin Moore exterior lines —
      meaningfully extends the clean surface life. Prep alone typically runs
      1-2 full days on a standard Lynnwood rancher.

  - title: "Cabinet Repainting vs. Full Replacement — What the Numbers Actually Show"
    description: |
      Kitchen cabinet replacement in a mid-range Lynnwood home runs
      $15,000-$35,000 for semi-custom boxes, doors, and installation. Cabinet
      repainting — done properly with a conversion varnish or waterborne alkyd
      topcoat — typically runs $1,800-$4,500 for a full kitchen, and the
      result on factory-painted MDF or solid maple doors can be close enough to
      new that full replacement is hard to justify. The process matters: doors
      and drawer fronts come off the boxes, surfaces get cleaned with TSP
      substitute, light-sanded, and sprayed with an HVLP sprayer for a
      factory-smooth finish — not brushed on. Benjamin Moore Advance in satin
      or semi-gloss is the go-to for cabinet work because of its self-leveling
      cure and hard film once fully dry. This is a realistic option for the
      1980s-1990s builder-grade kitchens common in 98087 subdivisions, where
      the box structure is sound but the finish looks dated.

  - title: "Moisture-Resistant Paint for Bathrooms and Laundry Rooms — Sheen and Product Both Matter"
    description: |
      Lynnwood's older ranchers often have original bathrooms with minimal
      ventilation — a single 50 CFM exhaust fan if they have one at all —
      which means humidity after showers runs high for extended periods.
      Standard interior flat or even eggshell paint starts peeling at the
      ceiling line within a year in that environment. The fix is a combination
      of correct primer and a paint with built-in mildew resistance in a
      sheen that allows moisture to shed rather than soak in. Zinsser Mold
      Killing Primer on any stained or previously affected ceilings, followed
      by Benjamin Moore Aura Bath & Spa or Sherwin-Williams Emerald Interior in
      satin, is the combination that actually holds up through seasons of
      repeated moisture exposure. Laundry rooms with steam from drying cycles
      need the same approach. One critical prep step: clean the ceiling surface
      with a diluted bleach solution before priming to kill existing mildew
      spores. Painting over live mildew is a guaranteed callback.

faq:
  - q: "How fast can you get to Lynnwood for a painting estimate?"
    a: |
      Lynnwood is a straightforward run from Seattle — I-5 north to the 196th
      St SW or 44th Ave W exits puts us right into the residential core of
      98036 and 98037. Morning appointments work well; afternoon traffic through
      Shoreline and Mountlake Terrace can add time. Call (206) 591-1096 and we
      can typically schedule an on-site walk-through within a week. The
      estimate is free, done by Vladislav directly — not a salesperson — and
      comes back as a line-item quote with specific product specs and scope
      details, not a vague range. From signed contract to paint start on a
      standard exterior project, plan on 2-3 weeks for scheduling and material
      lead time.

  - q: "What does an exterior repaint cost for a typical Lynnwood home?"
    a: |
      For a 1,600-2,400 sq ft rancher in Lynnwood with cedar or Hardie siding
      in fair condition, exterior repaints typically run $4,500-$9,500. That
      covers pressure washing, spot priming bare wood or damaged areas, two
      coats of Sherwin-Williams Duration or equivalent acrylic topcoat, and
      painting trim, soffits, and fascia. Homes with significant peeling,
      multiple unstable layers to stabilize, or EPA RRP lead paint requirements
      add cost — usually $500-$1,500 depending on scope. A phone number gives
      you a rough range; an on-site look gives you an actual price. Call
      (206) 591-1096 to set up a free consultation with exact line-item
      pricing.

  - q: "Do painting projects in Lynnwood require a permit?"
    a: |
      Painting alone — interior or exterior — doesn't require a permit from the
      City of Lynnwood building department in most cases. If painting is part
      of a broader remodel, such as a bathroom gut with new drywall or a
      kitchen renovation, the remodel work triggers the permit and painting
      falls under it. Lynnwood runs its own permit center; Snohomish County PDS
      handles unincorporated county areas, which Lynnwood is not. For pre-1978
      homes, the relevant compliance framework is federal EPA RRP rules — not a
      building permit, but mandatory regardless. TopVolk is a WA Licensed
      Contractor and handles EPA RRP documentation when applicable.

  - q: "Do you test for lead paint before starting work on older Lynnwood homes?"
    a: |
      On pre-1978 homes, yes — and it's not optional under federal EPA RRP
      rules. Any work disturbing more than 6 square feet of painted surface in
      a pre-1978 residence requires testing before sanding or scraping begins.
      We use lead swab test kits on site for initial screening. If a home warrants
      XRF testing — a more thorough scan with a handheld analyzer — we
      coordinate with a certified testing firm. The test cost ($150-$300) is
      included in the overall job quote so there are no surprise line items at
      project start. Most 1960s ranchers in the 98036 and 98037 corridor come
      back positive for lead in at least some original paint layers — so this
      isn't an edge case here, it's routine.

  - q: "How long will an exterior paint job actually last on a Lynnwood home?"
    a: |
      On properly prepped cedar or Hardie siding with a two-coat acrylic
      system, expect 7-10 years before the next full exterior repaint under
      Lynnwood's conditions. South and west faces fade faster from UV exposure;
      north faces pick up mildew faster from shade and moisture retention.
      Spot touch-up on trim and high-exposure areas at year 4-5 extends the
      full paint life noticeably. Jobs that skip prep — painting over mill
      glaze, dirty surfaces, or existing mildew — often fail in 3-4 years.
      Sherwin-Williams Duration carries a limited lifetime product warranty;
      TopVolk's workmanship warranty terms are written into every contract, not
      offered verbally after the fact.

  - q: "Do you work in cities near Lynnwood, or just within city limits?"
    a: |
      From Lynnwood, we regularly work in Edmonds, Mountlake Terrace, Kenmore,
      Bothell, Mill Creek, and Shoreline. Edmonds and Mountlake Terrace carry
      the same 1960s-70s rancher housing stock and pre-1978 lead paint
      considerations as Lynnwood. Mill Creek and Bothell trend newer — more
      Hardie siding, 1990s construction, fewer lead paint issues but the same
      mildew and repaint cycle questions. Scheduling from any of these areas
      typically runs 1-2 weeks out; summer and early fall book fast for
      exterior work. Call (206) 591-1096 to check current availability, or
      reach out to schedule a free on-site estimate with Vladislav.