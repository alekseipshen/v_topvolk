title: "Lynnwood Basement Finishing — Turn Dead Storage Into Real Living Space"

intro: |
  Half the ranchers and split-levels built along 44th Ave W and the streets
  feeding into Scriber Lake Park went up in the late 1960s — and almost every
  one of them has a full basement that's been storing camping gear and old paint
  cans ever since. That unfinished space is typically 800–1,100 square feet of
  potential living area sitting below a house where people are already cramped.
  In Lynnwood's climate — roughly 38–40 inches of rain annually, most of it
  falling between October and May — getting that space right requires more than
  drywall and carpet. Moisture management comes first: we typically install a
  DriCore subfloor panel system over the concrete slab before any framing goes
  up, creating an air gap that breaks the capillary transfer that turns
  concrete floors damp in wet years. TopVolk Construction has been finishing
  basements in the Alderwood corridor and out toward Meadowdale since 2017,
  pulling permits through Lynnwood's own permit center, not the county.

localContext: |
  The 98036 zip covers most of the western and central residential grid — the
  streets between Highway 99 and I-5 where 1960s–70s ranchers dominate the
  streetscape. The 98037 zip stretches east toward Alderwood Mall and the
  neighborhoods around 196th St SW, where you start seeing more split-levels
  with daylight basements that already have small windows on one or two walls.
  Both areas share a common problem: original basement construction from that
  era included no perimeter drainage or sump systems, because builders weren't
  required to install them. Forty-plus years of Pacific Northwest rainfall later,
  you'll find efflorescence on the concrete walls — that white chalky residue
  from mineral salts leaching through — plus occasional seepage after heavy
  storms and mold on the rim joist cavity. Lynnwood sits on soil with
  significant clay content in stretches, which holds groundwater near the
  foundation long after rain stops. Before any framing goes up, those moisture
  issues get addressed: vapor barrier on slab and walls, perimeter drain if
  seepage is active, mold-resistant drywall throughout.

commonProblems:
  - title: "Moisture Intrusion Through the Slab and Walls in 1960s Lynnwood Basements"
    description: |
      Concrete slabs poured in the 1960s weren't installed with the polyethylene
      moisture barriers required today — no sheet between the gravel bed and the
      concrete. In the 98036 zip, where clay-heavy soil holds water near the
      footing after heavy rain, that omission shows up as damp floors and wall
      seepage around years 30–40. The standard fix involves installing DriCore
      subfloor panels ($2.50–$3.50 per sq ft installed) before any flooring goes
      down, plus a vapor barrier system on the perimeter walls — 6-mil poly
      sheeted and sealed at seams. For active wall seepage, a perimeter drain
      channel cut into the slab edge and a sump pump adds $4,000–$7,000 to the
      project; we've used Zoeller M53 units reliably across multiple Lynnwood
      projects. This work adds 3–5 days before framing starts but prevents the
      entire finish from failing in the first wet season.

  - title: "Egress Window Rough-In for Code-Compliant Basement Bedrooms"
    description: |
      IRC requirements for sleeping room egress windows are specific: 5.7 square
      feet minimum net clear opening, 24-inch minimum clear height, 20-inch
      minimum clear width, and a maximum sill height of 44 inches from the
      finished floor. Most 1960s basement window openings in the Alderwood
      area don't meet those specs — they were sized for light and ventilation,
      not emergency egress. Cutting a new opening through a poured concrete or
      CMU block wall, framing with a proper lintel, installing a Bilco
      prefabricated steel window well with a 12-inch gravel drainage base, and
      fitting a Milgard casement window typically runs $2,500–$4,500 per
      opening depending on wall construction and soil depth. The rough-in
      inspection through Lynnwood's permit center requires the actual window on
      site — not just framing — so we coordinate delivery timing with the
      supplier to avoid stalling the inspection sequence.

  - title: "Low Ceiling Height and Duct Rerouting in 1960s–70s Split-Levels"
    description: |
      The IRC sets 7 feet as the minimum finished ceiling height in habitable
      basement rooms — 6 feet 8 inches in bathrooms and hallways. Lynnwood's
      split-levels from that era typically have 7-foot-2-inch to 7-foot-6-inch
      rough height, which sounds workable until you account for 2x10 floor
      joists above, HVAC ducts running 10–14 inches deep across the ceiling
      plane, and a drywall ceiling adding another inch and a half. The result
      is a finished room that technically passes but feels like a cave. Rerouting
      ductwork — either flexible insulated duct or rectangular sheet metal
      transitions — to run parallel between joists rather than perpendicular
      across them recovers 8–12 inches in targeted zones. In some cases we
      sister joists and reframe around existing mechanicals entirely. This MEP
      coordination adds $1,500–$4,000 to the project depending on scope, and
      it's the kind of thing you do before drywall goes up, not after.

  - title: "Permit Pull and Inspection Sequencing Through the City of Lynnwood"
    description: |
      Lynnwood is an incorporated city with its own permit center — this is not
      a Snohomish County PDS application, which covers unincorporated areas.
      For a standard basement finish with one or two bedrooms, a bathroom
      rough-in, and electrical, plan review typically runs 3–6 weeks. We submit
      architectural drawings showing egress window locations, ceiling heights in
      all habitable rooms, smoke and CO detector placement per IRC, and
      electrical layout. Required inspections follow a strict sequence: framing
      before insulation, rough-in electrical and plumbing before drywall hang,
      then final inspection after all finish work is complete. Skipping that
      sequence — or finishing a basement without a permit — creates problems
      at resale: home inspectors flag it, and lenders sometimes won't close.
      TopVolk Construction is a WA Licensed Contractor and handles the full
      permit application. Call (206) 591-1096 before you start planning finishes
      so we can scope the permit correctly from day one.

  - title: "Real Cost of Basement Finishing in Lynnwood: What Moves the Number"
    description: |
      A basic Lynnwood basement finish — drywall, DriCore subfloor, LVL beam
      if a load-bearing wall is involved, one egress window, standard electrical,
      no bathroom — typically runs $35,000–$55,000 depending on square footage
      and moisture scope. Add a bathroom with a curbless walk-in shower, Schluter
      Kerdi waterproofing membrane, large-format porcelain tile, and a Kohler
      fixture package and you're looking at $60,000–$85,000. Wet bar or second
      bedroom pushes further. Costs rise with active moisture requiring perimeter
      drain and sump, duct rerouting for headroom, egress window count, and any
      structural work above the basement. Costs come down with a dry slab, a
      daylight basement with windows already near egress spec, and a
      straightforward rectangular plan. Vladislav Volkov reviews every project
      on site and delivers a line-item quote — no vague ranges that expand
      mid-project. Deadline penalties are written into the contract. TopVolk
      has completed 100+ projects across the Seattle metro since 2017.

faq:
  - q: "How fast can you get to Lynnwood for a basement finishing consultation?"
    a: |
      Lynnwood is a straightforward run from Seattle — I-5 north to Exit 181
      puts you in the middle of the 98036 zip in about 25–30 minutes from
      Capitol Hill in normal traffic. On-site consultations are typically
      scheduled within 5–7 business days of your call. The visit runs about an
      hour and includes a moisture assessment of the slab and walls before we
      talk finishes — because what you do with the moisture problem determines
      everything else. You're talking directly with Vladislav, not a sales rep
      who hands the project off afterward. Call (206) 591-1096 to get on the
      schedule.

  - q: "What does basement finishing cost per square foot in Lynnwood?"
    a: |
      Finished cost typically lands between $45 and $90 per square foot for a
      Lynnwood basement, depending on bathroom count, egress window work, and
      whether moisture remediation is needed before framing. A 900-square-foot
      basement with one bedroom, one bathroom with large-format tile, and
      standard electrical runs around $60,000–$80,000 all-in, permit costs
      included. LVL beam work for load redistribution, wet bar rough-in, or
      a second egress window installation pushes that number higher. The
      on-site consultation produces a line-item quote with specific numbers,
      not a ballpark that shifts once demo starts. Schedule at (206) 591-1096.

  - q: "Do you pull permits for basement finishing through the City of Lynnwood?"
    a: |
      Yes — and it matters which jurisdiction you're in. Lynnwood has its own
      permit center; Snohomish County PDS handles unincorporated county areas,
      which is a different process entirely. We manage the permit application,
      architectural drawings, and inspection scheduling as part of every
      basement project. Plan review for a standard basement finish runs 3–6
      weeks; we factor that into the timeline so it doesn't create a
      dead-stop gap in the schedule. Required inspections include framing,
      rough-in electrical and plumbing, insulation, and final. TopVolk
      Construction is a WA Licensed Contractor — every project is permitted,
      which protects your resale value and keeps your homeowner's insurance
      valid on the finished space.

  - q: "Do you handle egress window installation as part of a basement bedroom project?"
    a: |
      Yes, and it's one of the more technically involved parts of a basement
      finish. Cutting through a poured concrete or CMU block wall requires
      core drilling, temporary shoring, and a proper lintel before any window
      goes in. The Bilco window well needs a gravel drainage base — typically
      12 inches of clean crushed rock — and must be sized to meet IRC depth
      and width requirements for egress clearance. For most Lynnwood projects
      we specify Milgard casement windows: they hold up well in PNW humidity,
      the frames don't rot, and they carry a limited lifetime warranty on
      hardware and glass. The rough-in gets inspected before framing continues,
      so we coordinate window delivery timing directly to keep the inspection
      sequence moving.

  - q: "What do you do if there's mold in an unfinished Lynnwood basement?"
    a: |
      Mold on the rim joist cavity, concrete walls, or existing wood framing
      is common in Lynnwood basements — especially on north-facing walls where
      condensation accumulates through the long wet season. Nothing gets framed
      over it. Remediation comes first: remove and bag affected material, treat
      concrete surfaces with Zinsser Mold Killing Primer and exposed framing
      with Concrobium, allow full cure time, then install continuous vapor
      barrier before any new framing goes up. If the source is active seepage
      through the wall or slab, a perimeter drain gets installed before
      remediation — otherwise you're treating symptoms while the cause
      continues. The process gets documented with photos, which matters when
      you're selling the house and a buyer's inspector starts asking questions.

  - q: "Do you finish basements in cities near Lynnwood, and how far out do you travel?"
    a: |
      TopVolk Construction works throughout Snohomish County and King County.
      Edmonds, Mountlake Terrace, Kenmore, Bothell, Shoreline, and Mill Creek
      are all regular service areas — all within 20–30 minutes of Lynnwood.
      Mukilteo and Everett come up regularly too. Beyond about 40 miles from
      Seattle, the project scope needs to be larger to make the logistics
      practical — an ADU or major addition rather than a standalone basement
      finish. Both the 98036 and 98037 zip codes in Lynnwood are frequent
      project locations; we know the permit process and the soil conditions
      here. Call (206) 591-1096 to set up an on-site visit and get a real
      scope before you commit to anything.