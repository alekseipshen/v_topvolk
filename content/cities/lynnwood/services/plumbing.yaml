  - q: "What does a full PEX repipe cost in a Lynnwood home?"
    a: |
      On a typical 1,200-1,600 SF Lynnwood ranch or split-level, a full PEX-A repipe
      using Uponor AquaPEX runs $8,000-$14,000 depending on fixture count, crawlspace
      access, and whether existing shut-offs need replacement along the way. Smaller
      homes or partial galvanized-to-PEX scopes can come in at $6,000-$8,500.
      Polybutylene replacement scopes price similarly. Every TopVolk quote is
      line-itemized — permit fee, materials, labor by phase — so you can see exactly
      where every dollar goes. Call (206) 591-1096 to set up a free on-site estimate
      with specific pricing, not a range pulled from thin air.

  - q: "Do I need a permit for plumbing work in Lynnwood, and who handles that?"
    a: |
      The City of Lynnwood Building Division requires permits for water heater
      replacements, full repiping, new fixture rough-ins, and gas line modifications —
      this is non-negotiable under WA state code and local ordinance. Water heater
      permits also trigger a seismic strapping inspection, which is a WA-specific
      requirement. Standard water heater permit turnaround in Lynnwood runs a few
      business days; a full repipe permit typically takes 1-2 weeks. TopVolk handles
      permit applications as part of the project scope — you don't manage that process
      separately. As a WA Licensed Contractor, we pull permits across Lynnwood,
      unincorporated Snohomish County (PDS), and throughout King, Pierce, and Kitsap
      counties depending on where the work lands.

  - q: "Can TopVolk handle plumbing as part of a larger kitchen or bathroom remodel?"
    a: |
      That's the most common way this work gets done. A bathroom remodel with a new
      walk-in curbless shower, Kohler pressure-balance valve, relocated toilet, and
      new vanity needs coordinated drain rough-in, supply rough-in, and finish
      plumbing — all sequenced with tile, drywall hang, and finish work so the
      rough-in inspection happens at the right phase, not after drywall is up and has
      to come back down. Kitchen remodels adding a Delta or Moen undermount island
      sink need drain rerouting and dishwasher supply additions. TopVolk coordinates
      MEP work under one contract. Call (206) 591-1096 to talk through how the
      plumbing scope fits your specific remodel sequence.

  - q: "How long does a full repipe take in a Lynnwood home?"
    a: |
      A PEX-A repipe on a 1,400 SF Lynnwood ranch takes 3-5 working days for the
      rough-in, with walls open for inspection, plus another 1-2 days for finish
      connections after drywall repair is complete. Add the City of Lynnwood permit
      review — typically 1-2 weeks — and the realistic start-to-finish window is
      3-5 weeks from contract signing. Polybutylene replacement scopes run similarly.
      Drywall cutting is unavoidable in most cases; access panels reduce but rarely
      eliminate it. The project deadline in TopVolk's contract carries a penalty clause
      — if the agreed completion date slips without a documented reason, there are real
      financial consequences written into the agreement, not just an apology.

  - q: "Does TopVolk cover other Snohomish County cities near Lynnwood?"
    a: |
      Yes — Edmonds, Mountlake Terrace, Kenmore, Bothell, Mill Creek, Mukilteo, and
      Shoreline are all in regular rotation. Unincorporated Snohomish County areas
