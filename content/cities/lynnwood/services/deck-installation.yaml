title: "Lynnwood Deck Installation — Built for Snohomish Rain"

intro: |
  Most of Lynnwood's residential blocks were built between 1965 and 1985 —
  the ranchers and split-levels in the 98036 zip code often have original PT
  lumber posts that have been sitting in Snohomish County soil for 40 years.
  North-facing decks here develop moss fast, and cedar boards start cupping or
  splitting within a decade of installation. Composite decking from Trex or
  TimberTech handles the rainfall without annual sealing or board replacement.
  Call (206) 591-1096 for a free on-site consultation with Vladislav directly.

localContext: |
  Lynnwood's housing stock skews heavily toward 1960s-80s ranchers and raised
  ranches — particularly in neighborhoods near the Interurban Trail and along
  44th Ave W in the 98036 zip. The 98037 zip covers the Alderwood corridor,
  where newer townhomes sit next to older single-family homes that were never
  engineered with deck loads in mind. City of Lynnwood building department
  handles permits here, separate from Snohomish County PDS, and they require
  a ledger flashing inspection before framing is closed.

commonProblems:
  - title: "Cedar on North-Facing Exposures Doesn't Last in Lynnwood's Climate"
    description: |
      Cedar boards on a north-facing deck in Lynnwood develop moss within two
      or three seasons and start cupping, splitting, or checking within a decade.
      Capped composite decking — Trex Transcend or TimberTech AZEK — doesn't
      absorb moisture and holds color without seasonal sealing. Code also requires
      36-inch guardrails on any platform over 30 inches off grade, regardless of
      material chosen.
  - title: "Ledger Board Rot Starts Where Flashing Gets Skipped"
    description: |
      Attaching a ledger board to the house rim joist without proper step
      flashing lets water migrate behind the connection and into the wall
      sheathing. In Lynnwood's wet winters — rain from October through May —
      that moisture can rot the rim joist and band joist within a few years.
      City of Lynnwood requires a ledger flashing inspection before framing is
      closed. Skipping it means re-inspection fees and re-exposing the
      attachment point.
  - title: "Post Footings That Miss Frost Line Shift and Crack the Frame"
    description: |
      Lynnwood footings need to reach 12-18 inches below grade to sit below the
      frost line. Ground-contact posts require pressure-treated lumber rated UC4B
      or better — not standard PT studs. Simpson Strong-Tie post bases tied into
      poured concrete footings are the standard connection detail here. A failed
      rough-in inspection means breaking out concrete and starting the footing
      work again from scratch.

faq:
  - q: "How fast can you get to Lynnwood for Deck Installation?"
    a: |
      Lynnwood is a straight shot up I-5 — typically 30-40 minutes depending
      on traffic. We cover all Snohomish County, including the 98036 and 98037
      zip codes. Call (206) 591-1096 to schedule directly with Vladislav, not
      a sales rep.
  - q: "Do you build with Trex and TimberTech composite decking, or only wood?"
    a: |
      Both. Trex Transcend and TimberTech AZEK are the two composite lines we
      use most in Snohomish County. For most Lynnwood homes, composite holds up
      better — cedar grays out and needs annual sealing in this climate. Cedar
      is still an option where the homeowner specifically wants natural wood.
  - q: "How long does deck permitting take in Lynnwood, and what's the process?"
    a: |
      City of Lynnwood handles its own plan review — typically 4-8 weeks for a
      standard deck. We prepare structural drawings, ledger attachment details,
      and footing specs. Budget 8-14 weeks total from permit submission to final
      inspection and blue tape walkthrough. TopVolk is a WA Licensed Contractor,
      100+ projects completed since 2017 — and Vladislav writes deadline
      penalties directly into the contract.