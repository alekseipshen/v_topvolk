title: "Lynnwood Bathroom Remodel — 1960s Ranch Baths Rebuilt Right"

intro: |
  Ranch homes built around Alderwood and Scriber Lake in the 1960s and '70s still dominate Lynnwood's 98036 zip. Those bathrooms came with the same package: a fiberglass surround, a 50 CFM exhaust fan, and a Moen chrome faucet that's been dripping since 2004. Lynnwood sits in Snohomish County where annual rainfall and humid summers turn inadequate ventilation into a real mold problem — and a cosmetic patch doesn't fix a structural moisture issue.

localContext: |
  Most of Lynnwood's housing stock in 98036 and 98037 was built between 1960 and 1985 — ranch-style single-family homes and split-levels along corridors like 196th Street SW and near Scriber Lake Park. These homes used standard drywall backer behind tile instead of cement board or a waterproofing membrane. Snohomish County PDS handles Lynnwood building permits. A full bathroom remodel — layout change, new shower, or tub removal — requires a building permit with rough-in and final inspections.

commonProblems:
  - title: "Drywall Backer Behind Tile Rotting Out in Lynnwood's Older Ranch Homes"
    description: "Homes in 98036 built before 1990 routinely used standard greenboard drywall behind tub and shower tile. Years of steam and splash work moisture behind the grout joints until the paper face breaks down and the wall deflects. You'll see cracked grout first, then loose tile. The fix is full demo down to studs, Schluter Kerdi membrane or cement board over the framing, and a complete re-tile — not a re-grout."
  - title: "Undersized Exhaust Fans Feeding Lynnwood's Year-Round Humidity Problem"
    description: "A 50 CFM exhaust fan in a 60-square-foot bathroom can't keep up with Snohomish County's wet winters. Condensation sits on mirrors and window frames from October through April. Current IRC requires exhaust fans sized at 1 CFM per square foot minimum. On a full remodel, installing a humidity-sensing Panasonic or Broan unit rated 80–110 CFM is standard. Skip it, and mold returns within two years."
  - title: "Galvanized Supply Lines and Corroded Drain Connections in Pre-1975 Builds"
    description: "Split-levels built near the Alderwood Mall corridor before 1975 often have galvanized steel supply lines narrowing from decades of mineral buildup — weak showerhead pressure is the first symptom. Cast-iron branch drain connections corrode at fittings and fail at the hub. Converting a tub alcove to a curbless shower requires drain rerouting, new rough-in plumbing, and a Snohomish County PDS rough-in inspection before walls close up."

