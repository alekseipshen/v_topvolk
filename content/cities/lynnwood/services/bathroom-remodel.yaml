  - q: "Do you work with Moen, Kohler, and Delta fixtures in Lynnwood bathroom remodels?"
    a: "Yes. Most Lynnwood homes came with Moen or Delta from original construction. We source and install Moen, Kohler, and Delta across mid-range and upgraded price points — Kohler Archer, Moen Genta, Delta Pivotal. Vladislav quotes line-item fixture pricing so nothing is hidden in a lump sum."
  - q: "How long does a Lynnwood bathroom remodel take, and what does the permit process look like?"
    a: "A full master bath remodel — demo, new shower conversion, tile, vanity, plumbing rough-in — runs 4 to 6 weeks in the field once permits are issued. Snohomish County PDS plan review for a bathroom with layout changes typically takes 2 to 4 weeks. A straight re-tile and fixture swap with no layout change often skips the permit entirely. TopVolk is a WA Licensed Contractor — 100+ projects completed since 2023. Call (206) 591-1096 and Vladislav will tell you exactly what triggers a permit on your specific scope. Deadline penalties are written into every contract."