title: "Lynnwood Garage Construction — New Builds & ADUs in 98036"

intro: |
  Most of the single-family lots in Lynnwood's 98036 zip code were platted
  in the 1960s and early 70s, when this stretch of Snohomish County was still
  transitioning from farmland to suburb. The garages that came with those homes
  were sized for one car and a lawnmower — not an F-150, two SUVs, and a Level 2
  charger. The Scriber Lake Road neighborhood and the residential blocks feeding
  into the Alderwood corridor are full of homeowners who want to replace a
  deteriorating single-car structure or build something detached from scratch.
  Since WA HB 1337 took effect in 2024, every single-family lot in Lynnwood
  can legally host two ADUs, which makes a DADU above a new garage one of the
  more financially practical moves available on a standard city lot right now.
  TopVolk Construction LLC has completed garage and accessory structure projects
  across the Snohomish County corridor since 2023. Vladislav Volkov runs every
  project directly — you call the owner, you get the owner, from the first
  site visit through final inspection.

localContext: |
  Lynnwood's housing breaks into two distinct bands. The 98036 zip covers most
  of the original city grid — 1960s ranchers and split-levels on 7,000-to-9,000
  square-foot lots with attached single-car garages that are technically
  functional but too narrow for modern vehicles. The 98087 zip, which runs north
  toward Mukilteo and the Picnic Point area, carries more 1990s and early-2000s
  construction with two-car garages builders considered adequate at the time.
  Neither era anticipated EV charging, dedicated workshop space, or the ADU
  rental income that WA HB 1337 now makes legally straightforward. Lot coverage
  limits in Lynnwood typically cap total structure footprint at 50% of the lot
  area, and setback requirements — usually 5 feet at the side and rear for
  detached accessory structures — get tight fast on the original 98036 plats.
  Lynnwood's Community Development Department handles building permits for
  incorporated parcels; land just outside the city boundary falls under
  Snohomish County PDS, which runs on a separate submittal portal and
  a slightly different plan review timeline.

commonProblems:
  - title: "Detached Garage with a DADU Above — Structural Requirements Under HB 1337"
    description: |
      A detached garage with a finished ADU above is no longer a special-use
      exception in Lynnwood — it's a standard permit application under WA HB
      1337. But the structural requirements jump significantly the moment
      habitable space enters the picture. We size LVL beams and engineered
      floor joists to carry the live load of an occupied apartment, not just
      roof snow load — these are not interchangeable calculations. Lynnwood
      requires engineered drawings stamped by a Washington-licensed structural
      engineer for any garage with habitable space above, and plan review
      typically runs 6-10 weeks for a project this size. Budget 4-7 months
      total, end-to-end including permits. A 20×24 detached garage with a
      400-to-500 square-foot DADU above typically lands between $180,000 and
      $250,000 depending on finish level, bathroom spec, kitchen layout, and
      whether a separate utility meter is part of the scope.

  - title: "Setback and Lot Coverage Conflicts on Tight 98036 Lots"
    description: |
      On a 7,200 square-foot lot — very common in the residential blocks west
      of Highway 99 in central Lynnwood — the lot coverage arithmetic gets
      uncomfortable quickly. An existing house footprint often consumes
      35-to-40% of lot area before any accessory structure is even sketched,
      leaving limited room before hitting the 50% cap. Setback conflicts pile
      on from there: a 5-foot side yard setback sounds generous until you
      account for the fence line, utility easements, and the gap between where
      a homeowner assumes the property line is and where the survey pins
      actually land. FAR calculations and parcel GIS data get pulled before
      we draw anything — that's the only way to know what's buildable before
      spending money on design. Surprises at plan submission are avoidable
      with 20 minutes of due diligence upfront.

  - title: "EV Charger Circuit Pre-Wire During Garage Construction"
    description: |
      Installing a 50A or 60A dedicated circuit for an EV charger during
      rough-in costs a fraction of retrofitting it after drywall and insulation
      are in place. On every new garage build, we coordinate the electrical
      sub to sleeve conduit from the main panel, land the breaker, and stub
      out either a NEMA 14-50 receptacle or a hardwired junction box before
      rough-in inspection. Lynnwood's building department requires EV
      infrastructure to be permitted as part of the structure's electrical
      plan — not added later as a separate pull. ChargePoint and JuiceBox
      both make solid Level 2 units in the $500-$700 hardware range; Tesla
      Wall Connectors are also common on the east side of the county. Adding
      the circuit pre-wire during construction typically runs $400-$800
      depending on panel distance. Doing it after the fact — cutting drywall,
      fishing wire, patching — runs $1,200-$2,500 or more.

  - title: "Concrete Slab Specifications for Pacific Northwest Ground Conditions"
    description: |
      The IRC minimum for a residential garage floor is a 4-inch concrete slab,
      but in Lynnwood that's the floor, not the target. The ground moves here
      October through April as saturation levels cycle — a slab poured without
      proper sub-base prep, vapor barrier, and fiber reinforcement will crack
      within a few winters. Our standard spec is a 4-inch fiber-reinforced slab
      on 4 inches of compacted crushed rock, 6-mil poly vapor barrier
      underneath, and 2-inch rigid foam at the perimeter to break the thermal
      bridge at the footing. Control joints get tooled or saw-cut at 10-foot
      intervals to manage shrinkage cracking. For workshop use or a garage with
      a DADU above — where the floor sees equipment weight and live load
      transfer — 5-inch thickness with #4 rebar on 24-inch centers is a
      better call and adds roughly $1,500-$2,000 to the slab budget on a
      standard two-car footprint.

  - title: "Matching Exterior Siding and Roofline to the Existing House"
    description: |
      A new garage that doesn't match the house reads as an afterthought and
      can complicate resale in Lynnwood's established neighborhoods. Most 1960s
      and 70s homes in the 98036 zip have either original cedar lap siding
      that's been repainted several times, faded T1-11 wood panels, or 1990s
      vinyl that's drifted from its original color. Hardie cement-board lap
      siding is the right call for new garage exteriors in this climate — it
      holds paint, resists the mold and mildew that accumulates on
      north-facing surfaces during the long wet season, and matches common
      existing profiles closely enough that the visual transition works.
      James Hardie's HZ5 product line is rated specifically for the Pacific
      Northwest climate zone and holds up better than LP SmartSide under
      sustained moisture exposure. Roofline matching means replicating the
      pitch from the existing structure and aligning shingle profile and
      color as closely as the current product line allows — we pull existing
      plans or measure on-site before any materials get ordered.

faq:
  - q: "How fast can you get to Lynnwood for a garage consultation?"
    a: |
      Lynnwood is an easy run from Seattle — I-5 north to Exit 181 or 182
      puts you in the middle of the city in under 30 minutes outside of peak
      commute windows. We serve the full 98036 and 98087 zip codes and
      typically schedule an on-site visit within a week of first contact.
      The consultation is free, and Vladislav comes out himself — you're
      talking to the person who will run the project, not a commissioned
      closer whose job ends when you sign. Call (206) 591-1096 to set up
      a time. A detailed line-item quote follows within 3-5 business days
      after the site visit.

  - q: "What does a new detached garage build cost in Lynnwood?"
    a: |
      A standard detached two-car garage in Lynnwood — 20×24 or 24×24
      footprint, 9-foot walls, insulated Clopay garage door, basic electrical
      panel and lighting — typically runs $65,000-$95,000 including permits
      and the concrete slab. Add a finished DADU above and the range jumps
      to $180,000-$250,000 depending on bathroom fixtures, kitchen
      configuration, finish materials, and whether a separate utility meter
      is in scope. Site prep on uneven lots adds cost, which matters on the
      older residential blocks in 98036. Exact pricing comes after an
      on-site visit — we don't quote by square foot until we've seen actual
      site conditions. Call (206) 591-1096 to schedule the free consult.

  - q: "What permits are required for a new garage in Lynnwood, and who handles the paperwork?"
    a: |
      A detached garage in Lynnwood requires a building permit through
      Lynnwood's Community Development Department. Structures under 200
      square feet may qualify for an exemption, but anything with electrical,
      an EV circuit, a garage door opener, or habitable space above requires
      a full permit with site plan, floor plan, and structural drawings.
      Plan review typically runs 6-10 weeks for accessory structures with
      engineered drawings. TopVolk Construction prepares and submits all
      permit documentation as the WA Licensed Contractor of record — you
      don't have to navigate the portal yourself. Parcels just outside the
      Lynnwood city boundary route through Snohomish County PDS instead,
      which runs on a different submittal system but similar timeline.

  - q: "Can you build a legal apartment above a garage in Lynnwood?"
    a: |
      Yes. Under WA HB 1337, every single-family lot in Lynnwood allows up
      to two ADUs by right, and a DADU above a detached garage qualifies.
      The structural and code requirements go up considerably: engineered
      LVL floor framing, R-49 ceiling insulation, R-21 wall insulation,
      egress windows sized to IRC minimums, interconnected smoke detectors,
      and a full bathroom are all required. A Mitsubishi mini-split is the
      standard HVAC solution for a garage ADU in this climate — low
      footprint, efficient, and it handles both heating and air conditioning
      in one unit. The permit process is the same whether you intend the
      space as a rental, a guest suite, or housing for a family member.
      Vladislav can walk you through what's feasible on your specific lot
      during the free on-site consultation.

  - q: "How long does a garage build take from start to finish in Lynnwood?"
    a: |
      Scope drives the timeline more than anything. A detached two-car
      garage without habitable space above — standard electrical, insulated
      door, no plumbing — typically takes 8-14 weeks from permit approval
      to final inspection. Add a DADU and construction alone runs 4-5
      months after permits clear. Plan review in Lynnwood runs 6-10 weeks
      for structures requiring engineered drawings. End-to-end on a
      garage-plus-DADU: budget 4-7 months total. Milestone deadlines are
      written into every TopVolk contract with a financial penalty if we
      miss them — not a verbal promise, an actual contractual clause.
      100+ projects completed across the Seattle metro since 2023, and
      we've never had to invoke it.

  - q: "Do you handle garage builds in cities near Lynnwood?"
    a: |
      TopVolk Construction covers the full Snohomish County corridor —
      Edmonds, Mountlake Terrace, Bothell, Mill Creek, Mukilteo, and
      Everett are all regular project areas. On the King County side of
      the line, we work in Shoreline and Lake Forest Park regularly. The
      process is the same in all of these areas: one call to
      (206) 591-1096, Vladislav is on-site within a week, line-item
