title: "Lynnwood Tile Installation — Waterproofing for PNW Shower Remodels"

intro: |
  Split-levels and ranch homes built through the 1960s and 70s around the Alderwood
  neighborhood (98036) got ceramic tile installed directly over greenboard — no
  waterproofing membrane, no slope to drain, just 4×4 tile set on material that
  absorbs moisture like a sponge. After forty-plus years of Lynnwood's rainfall,
  those substrates are compromised well before the surface gives any visible warning.
  Scriber Lake Park sits a half-mile from streets where we've pulled tile and found
  framing rotted halfway through the studs. Modern shower installation starts with
  Schluter Kerdi membrane or RedGard applied over cement board — that's the baseline
  for anything that will hold up in Snohomish County's climate. A recent Meadowdale
  kitchen remodel told the same story: the previous backsplash tile was set without
  a proper vapor barrier, and moisture had tracked behind the range for years before
  the homeowner noticed the grout cracking. Getting the substrate right before the
  tile goes down is what separates a ten-year installation from a thirty-year one.

localContext: |
  Lynnwood's housing inventory is mostly 1960s-1990s tract construction, concentrated
  in the 98036 and 98037 zip codes. Ranch homes and split-levels near Alderwood Mall
  tend to have original bathroom tile that's now 40-60 years old — grout cracked,
  tiles hollow-sounding when you tap them, and in some cases the subfloor has
  deflected enough to cause lippage problems you can't fix without pulling everything
  back to the joists. Homes along the 98087 corridor near Paine Field show a
  slightly later pattern: 1980s-90s builder-grade work with larger floor tiles set
  without proper expansion joints, which crack along control lines as the structure
  moves seasonally. Permit-wise, tile work in Lynnwood runs through the City of
  Lynnwood Building Division, not Snohomish County PDS — unless you're in
  unincorporated Snohomish County just outside city limits, where PDS handles plan
  review. Shower remodels that include electrical changes (GFCI circuits, exhaust
  fan relocation) or plumbing moves require permits pulled alongside the tile scope,
  and we coordinate all of that directly.

commonProblems:
  - title: "Rotted Substrates Behind Old Shower Tile in 1960s-70s Homes"
    description: |
      Tap the wall tile in most bathrooms built during Lynnwood's 1960s-70s
      construction boom and you'll hear that hollow thud — the bond has failed and
      moisture has been tracking behind the tile for years. Greenboard (water-resistant
      drywall, not waterproof) saturates and delaminates over decades of PNW shower
      use. By the time grout is cracking and caulk is pulling away at the corners,
      it's common to find framing that needs sistering before new tile can go on.
      The fix is a full demo to the studs, framing inspection, cement board re-sheathing,
      and full Schluter Kerdi membrane installation before any new tile touches the
      wall. In a standard 3×5 shower stall, budget $3,500-$6,500 for a complete
      tear-out and retile depending on tile selection and whether any framing needs
      repair. We've completed this exact scope in seven Lynnwood homes since 2022.

  - title: "Large-Format Porcelain Tile Lippage on Aging Subfloors"
    description: |
      Large-format tile — 24×48 or 32×32 porcelain slabs — demands a flat substrate
      to within 1/8 inch over a 10-foot span per ANSI A108 standards. Most 1960s
      subfloors in 98036 have enough seasonal deflection and localized unevenness to
      cause visible lippage within a year if the prep work is skipped. Before any
      large-format installation, we laser-level the floor and either pour self-leveling
      compound or sister the joists to reduce bounce. DriCore subfloor panels are
      useful in basement bath applications where moisture vapor rises from a crawlspace
      — a real consideration in Lynnwood's wet winters. A recent Meadowdale project
      required two full bags of self-leveler and a sistered joist before 32×32
      porcelain could go down clean. Timeline for floor prep and retile: typically
      3-5 days for a standard bathroom, longer when framing is involved.

  - title: "Shower Niche Framing and Waterproofing Done Wrong"
    description: |
      Shower niches are the single most common origin point for hidden water intrusion
      in tiled showers. A recessed niche cuts through at least one stud cavity, and
      without correct framing and waterproofing, water runs straight down inside the
      wall cavity with nothing to stop it. The niche needs pressure-treated (PT)
      blocking on all sides, a slight forward slope to drain toward the shower floor,
      and full Schluter Kerdi or RedGard coverage before any tile contact. City of
      Lynnwood Building Division doesn't require a permit for a straight tile
      replacement without plumbing or electrical changes, but when the scope includes
      drain relocation or a new exhaust fan circuit, permits are required and we pull
      them. As a WA Licensed Contractor, Vladislav handles permit coordination
      directly — no relay through a salesperson or sub. Niche installation adds
      roughly $400-$700 to a shower tile project depending on depth and tile choice.

  - title: "Heated Floor Systems — Sequencing and Sensor Placement"
    description: |
      Schluter Ditra-Heat and Warmup electric mat systems are a practical upgrade in
      Lynnwood bathrooms, particularly in homes getting full remodels ahead of the
      Lynnwood Link corridor's continued development. The installation sequence
      matters: the Ditra-Heat uncoupling membrane goes down first, heating cables
      run in the mat's channels, and tile sets on top with the thermostat sensor
      embedded at the correct depth in the floor assembly. Cables spaced incorrectly
      or a sensor buried too deep produces cold spots that no thermostat adjustment
      will fix. Cost for a heated floor in a 50-square-foot bathroom runs $1,800-$3,200
      installed, depending on mat brand and tile weight. Schluter Ditra-Heat is our
      default because it also functions as an uncoupling membrane, protecting tile
      from the seasonal subfloor movement that's common in older Lynnwood framing.
      Warmup is a strong alternative when the homeowner wants built-in WiFi
      thermostat control from the start.

  - title: "Natural Stone Sealing for PNW Interior Humidity"
    description: |
      Marble and travertine read beautifully in Lynnwood kitchen and bathroom remodels,
      but they're porous stones that need correct sealing to survive 37-plus inches
      of annual rainfall and the interior humidity that comes with it. Unsealed
      travertine in a shower absorbs water and soap residue, staining permanently
      within months. Setting natural stone differs from porcelain: every piece needs
      back-buttering, the mortar should be a white polymer-modified type to avoid
      telegraphing color through lighter stone, and a penetrating sealer (not topical
      wax) goes on after grout fully cures. Non-sanded grout is standard in tight
      marble joints to avoid surface scratching. Re-sealing natural stone every
      2-3 years is realistic in PNW conditions — initial sealing is included in our
      installation price, and we'll walk you through what to reapply yourself on
      the maintenance cycle.

faq:
  - q: "How fast can you get to Lynnwood for a tile installation estimate?"
    a: |
      Lynnwood is a straight shot north on I-5 — about 20-25 minutes from Fremont
      or Green Lake outside of peak traffic, longer during the northbound backup
      that builds from 4pm on weekdays. We schedule on-site estimates in Lynnwood
      most weeks and can typically get out within 3-5 business days of your call.
      Vladislav comes to the estimate himself, not a commissioned closer. Call
      (206) 591-1096 to schedule. Once you approve the written, line-itemized quote,
      most bathroom tile projects start within 2-4 weeks depending on material
      lead times and permit requirements.

  - q: "What does tile installation cost in Lynnwood?"
    a: |
      Bathroom floor tile in a standard 50-60 square foot room runs $1,800-$3,500
      installed, depending on tile size and what the substrate requires. A full shower
      retile — demo, Schluter Kerdi waterproofing, cement board, and new tile —
      runs $3,500-$7,500 depending on shower dimensions and tile selection.
      Large-format porcelain costs more to install than 12×12 because the substrate
      prep is more involved. Kitchen backsplash work typically falls between $800
      and $2,000. These are real ranges based on 100+ projects completed since 2017
      — the written quote after the site visit will be line-itemized with no
      surprise additions. Call (206) 591-1096 for a free on-site estimate.

  - q: "Do I need a permit for tile work in Lynnwood?"
    a: |
      Straightforward tile replacement — shower retile, floor tile, backsplash —
      generally doesn't require a permit in Lynnwood as long as you're not moving
      plumbing or adding new electrical circuits. The City of Lynnwood Building
      Division is the AHJ for work inside city limits; projects just outside in
      unincorporated Snohomish County go through Snohomish County PDS (Permit and
      Development Services) for plan review. Any scope that includes drain relocation,
      a new GFCI branch circuit, or a Schluter Ditra-Heat heated floor requires an
      electrical permit and rough-in inspection before tile closes everything in.
      As a WA Licensed Contractor, we pull all required permits and coordinate
      inspections — you don't have to manage that process. We've worked through
      both Lynnwood Building Division and Snohomish County PDS for projects across
      the 98036 and 98037 zip codes.

  - q: "Can you install a heated tile floor in an existing Lynnwood bathroom?"
    a: |
      Yes, and it fits more existing bathrooms than people expect. The Schluter
      Ditra-Heat mat assembly is roughly 1/4 inch thick total, which usually doesn't
      create door clearance problems the way thicker subfloor builds do. Warmup is
      another strong option if WiFi thermostat control is a priority. Both systems
      require a dedicated 120V or 240V GFCI circuit, which means an electrical
      permit and rough-in inspection through the City of Lynnwood before the tile
      goes down. We coordinate the electrical subcontractor, pull the permit, and
      sequence the work so the heating cable is inspected before tile closes it in.
      Call (206) 591-1096 to walk through the scope for your specific bathroom.

  - q: "How long does tile installation last, and what's the workmanship warranty?"
    a: |
      Tile set correctly on a solid, waterproofed substrate should hold 20-30 years
      without structural issues. Grout in a shower environment needs resealing every
      1-3 years; natural stone like marble or travertine needs a penetrating sealer
      refreshed every 2-3 years given PNW humidity levels. Schluter's Kerdi system
      carries a manufacturer warranty when installed to their specifications, and we
      install it that way. Our workmanship warranty is written into the contract —
      and so is a deadline penalty clause. If we commit to a completion date and
      miss it, there's a financial penalty written into the agreement before work
      starts. That's not a promise; it's a contract term.

  - q: "Do you handle tile work in other cities near Lynnwood?"
    a: |
      Tile installation is part of broader remodel scopes we run across King and
      Snohomish counties. Regular work areas include Edmonds, Mountlake Terrace,
      Bothell, Kenmore, Mill Creek, and Shoreline — all within 15-20 minutes of
      Lynnwood. Seattle proper (Ballard, Greenlake, Capitol Hill) means permits
      through Seattle SDCI, which we handle. For larger kitchen or bath remodels
      where tile is one part of the scope, we work throughout the Seattle Metro
      area. Scheduling windows for new projects are typically 2-4 weeks out.
      Call (206) 591-1096 or schedule a free consultation — Vladislav does the
      estimate himself, and 100+ completed projects since 2017 means we've seen
      most of what Snohomish County's housing stock can throw at a tile job.