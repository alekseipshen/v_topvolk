title: "Lynnwood Drywall Installation — Popcorn Removal, Type-X Board & Level 5 Finish"

intro: |
  Tract housing built during Snohomish County's late-1960s through 1980s expansion covers most of Lynnwood's residential grid — the blocks near Scriber Lake Park in 98036, the neighborhoods stretching toward the Alderwood Mall corridor in 98037. That era of construction meant one thing for interior finishes: sprayed acoustic (popcorn) ceilings, stippled wall texture, and drywall hung fast by volume builders who weren't designing for longevity. Homeowners remodeling kitchens and master baths are learning that smooth walls under new LED recessed cans on a dimmer circuit expose every imperfection — a Level 5 finish isn't optional in those situations. Add Lynnwood's persistent rainfall from October through May, and bathrooms and laundry rooms in these older homes are showing moisture damage behind original drywall that was never protected with mold-resistant board or a proper vapor barrier. PURPLE XP mold-resistant panels and Schluter Kerdi waterproofing membrane are now standard on bathroom rebuilds here. TopVolk Construction has completed 100+ projects since 2017 across Snohomish and King counties — owner Vladislav Volkov handles estimates in person, not over email with a sales coordinator.

localContext: |
  The split between 98036 and 98037 reflects two different eras of Lynnwood construction, and that difference matters for drywall work. The 98036 side — older ranchers and split-levels from the late 1960s through mid-1980s near the Scriber Lake area — tends to show the aftermath of decades of piecemeal repairs: walls patched in three different textures, galvanized pipe retrofits that left rough-ins open too long, and acoustic ceilings painted over multiple times. Getting a consistent finish after rough-in work in these homes often means skim-coating entire wall surfaces with USG Sheetrock All-Purpose joint compound, not just spot patching visible holes. Over in 98037, closer to the Alderwood Mall corridor, you find more 1990s-to-early-2000s builder-grade construction — standard 1/2-inch drywall with orange-peel texture that holds up reasonably well until someone opens a wall for HVAC or a panel upgrade. Lynnwood is an incorporated city and runs its own permit center, separate from Snohomish County PDS — a distinction that matters when a garage conversion or ADU project needs 5/8-inch Type-X firecode drywall and a rough-in inspection before walls close. Plan on 2-4 weeks for permit review on projects that touch fire-rated assemblies.

commonProblems:
  - title: "Popcorn Ceiling Removal and Level 5 Skim Finish in 1970s–80s Homes"
    description: |
      Acoustic spray texture was applied fast in Lynnwood's 98036 ranchers during the 1970s-80s building wave. Under flat paint it looked passable. Under LED recessed cans and dimmer switches homeowners are adding during kitchen and bath remodels, every ridge and bump throws shadows that make the ceiling look far worse than before the renovation started. Removing popcorn means scraping — which frequently tears the face paper on the underlying drywall — then skim-coating the entire ceiling surface with USG Sheetrock All-Purpose joint compound to achieve a true Level 5 finish, defined as a full skim coat over taped joints rather than just filling the tape lines. Sanding to Level 5 is time-intensive and generates significant dust; plan for 3-5 days on a typical room plus a day for prime coat before paint. Budget $3.50–$5.50 per square foot for scrape, skim, sand, and prime on a standard 8-foot ceiling. Taller ceilings or vaulted spaces in split-levels add scaffold time and cost.

  - title: "Moisture-Damaged Drywall in Bathrooms and Laundry Rooms — Replacing with Mold-Resistant Board"
    description: |
      Lynnwood averages over 37 inches of rain annually, and that ambient humidity finds its way into walls. Older homes in 98036 built before the mid-1990s routinely got standard 1/2-inch gypsum board installed in bathrooms and laundry rooms — no vapor barrier, no mold-resistant backing. Tile grout failures and steam accumulation push moisture into the wall cavity over years. By the time a homeowner sees soft spots or discoloration on the surface, mold is typically established on the back of the board and on the framing. Full demo is required: pull the damaged panel, treat any mold growth on studs with Concrobium Mold Control, inspect framing for rot, then reinstall with PURPLE XP mold-resistant drywall or USG Sheetrock Mold Tough board. In shower and tub surrounds, Schluter Kerdi membrane applied over the new board provides a fully waterproofed substrate before tile goes back on. Timeline typically runs 3-7 days depending on how much framing needs to dry out before new board goes up.

  - title: "5/8-Inch Type-X Firecode Drywall for Garage Conversions and ADU Separation Walls"
    description: |
      WA HB 1337 (2024) allows Lynnwood homeowners to add up to two ADUs per single-family lot, and garage-to-AADU conversions are one of the most common applications. What catches people off guard is the IRC requirement for fire-rated wall assembly: the partition separating a garage from living space — or an ADU from the primary unit — requires 5/8-inch Type-X firecode drywall on the garage-side surface, not standard 1/2-inch board. Miss that spec and you don't pass rough-in inspection through Lynnwood's permit center. TopVolk handles the full sequence: permit application, framing the separation wall to correct setback dimensions, hanging Type-X, scheduling the rough-in inspection, then finishing. The garage ceiling below a converted living space also needs fire-rated assembly per IRC. Vladislav Volkov is a WA Licensed Contractor who has worked through this permit process on multiple ADU projects in Snohomish County. Deadline penalties are written into every contract — if the project runs over schedule, there's a financial consequence built into the agreement, not a verbal apology.

  - title: "What Drywall Installation Actually Costs in Lynnwood — and What Moves the Number"
    description: |
      Square footage is the starting point, not the final answer. Hanging and finishing new 1/2-inch drywall to a Level 4 standard — hang, tape, three coats of mud, sand — runs roughly $2.50–$4.00 per square foot in Lynnwood, materials and labor combined. Level 5 skim finish adds $1.50–$2.50 per square foot on top of that. Specialty board costs meaningfully more per panel: standard 1/2-inch sheet runs $15–$20; 5/8-inch Type-X runs $22–$28; QuietRock 530 acoustic panels run $85–$95 each. Cathedral ceilings and stairwells in Lynnwood split-levels require scaffold or pump jacks, which adds to labor time. A typical bathroom gut-and-redrywall in a 98036 rancher — 200–350 square feet of board touched — usually lands between $1,500–$3,500 all-in depending on finish level and how much moisture remediation is needed before new board goes up. TopVolk provides line-item written quotes after the on-site walkthrough — not a vague per-room range delivered over the phone.

  - title: "Soundproofing Between Bedrooms and Shared Walls — Resilient Channel vs. QuietRock"
    description: |
      Standard 1/2-inch drywall with fiberglass batt insulation between studs gets you to roughly STC 33–35 — enough to reduce loud noise but not block conversation or TV audio through a shared bedroom wall. That's a common complaint in Lynnwood's 1980s-90s construction and new ADU projects where an attached unit shares a party wall with the primary residence. Real soundproofing requires decoupling the drywall from the framing entirely. Two proven approaches: resilient channel (RC-1 hat channel screwed to studs, drywall fastened to the channel only — never to the studs through the channel) combined with Rockwool Safe 'n' Sound in the cavity can get a wall assembly to STC 50+ with two layers of 5/8-inch board. QuietRock 530 panels use constrained-layer damping to reach STC 45+ in a single layer, which installs faster but costs roughly $90 per panel versus $22 for standard board. Both approaches deliver a real difference. Either way, the work is most cost-effective during a remodel when walls are already open after electrical rough-in — adding it later means full demo and redo.

