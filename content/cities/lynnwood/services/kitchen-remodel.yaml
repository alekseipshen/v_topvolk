title: "Lynnwood Kitchen Remodel — Walls Down, Modern Layout"

intro: |
  Scriber Lake Park sits at the center of Lynnwood's oldest residential grid, and most
  of the ranchers within half a mile were built between 1963 and 1978 with kitchens
  that were clearly an afterthought — one exterior window, a galley footprint, and
  a shared 20-amp circuit that can't power a modern Bosch induction cooktop without
  tripping the panel. We've worked on a dozen of these layouts in the 98036 zip code.
  The fix usually starts with figuring out what's in that center wall.

localContext: |
  The blocks along 196th St SW and 52nd Ave W (zip 98036) are predominantly 1960s-70s
  split-levels and ranchers — original 100-amp panels, galvanized supply lines, and
  kitchens carved out of the square footage as an afterthought. North toward 98087,
  the 1990s tract homes have more floor area but still came with builder-grade cabinetry
  and laminate counters. Both eras share the same core problems: inadequate electrical,
  poor layout flow, and cabinet boxes that didn't hold up to Lynnwood's wet winters.

commonProblems:
  - title: "Load-Bearing Walls Block the Open-Concept Conversion"
    description: "Most 1963-1978 Lynnwood ranchers have a structural wall between the kitchen
      and living area — not a simple partition. Removing it requires an engineer's stamp,
      an LVL beam sized to the span, and PSL posts carrying that load to the foundation.
      Lynnwood's building department requires a structural permit and a rough-in inspection
      before drywall closes. Skipping the permit creates title problems at resale."
  - title: "100-Amp Panels Can't Handle Modern Kitchen Loads"
    description: "A Bosch induction range, KitchenAid refrigerator with an ice maker, and
      a built-in microwave drawer will push a 100-amp panel past its safe limit — especially
      with the rest of the house running. Upgrading to 200A service is permit work through
      Lynnwood's building department: licensed electrician, rough-in inspection, final sign-off.
      Budget $3,500–$6,000 for the panel swap on top of the remodel scope."
  - title: "Particle-Board Cabinets Delaminating from Interior Moisture"
    description: "Lynnwood averages 37 inches of rain a year. Homes in 98036 with single-pane
      windows and no mechanical ventilation build up interior humidity all winter, and builder-grade
      particle-board cabinet boxes delaminate in 15–20 years under those conditions. Semi-custom
      cabinets with plywood boxes hold up significantly better. IKEA Sektion with the plywood
      box upgrade is a solid budget option if the layout is simple."

