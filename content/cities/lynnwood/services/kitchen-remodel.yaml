  - q: "Do you work with Bosch, KitchenAid, and GE appliances during a kitchen remodel?"
    a: "Yes. Most Lynnwood projects we spec around Bosch dishwashers, KitchenAid or GE ranges,
      and Samsung refrigerators. Appliance fitment gets locked in before cabinet installation —
      rough-in dimensions, dedicated circuits, and ventilation clearances are confirmed at the
      design stage, not discovered at delivery."
  - q: "What does the kitchen remodel permit process look like in Lynnwood, and how long does it take?"
    a: "Work inside Lynnwood city limits goes through the City of Lynnwood Building Department.
      Wall removal, electrical upgrade, and gas line changes each require separate permits —
      plan review on structural work typically runs 4–8 weeks. Full project timeline from permit
      submission to final inspection: 10–14 weeks for a complete kitchen remodel. TopVolk handles
      all permit applications directly — 100+ projects completed since 2017 across King and
      Snohomish counties. Deadline commitments are written into the contract with penalties.
      Call (206) 591-1096 or schedule a free consultation to walk through your scope."