title: "Centralia Home Additions — ADUs & Second-Story Builds"

answer: "TopVolk Construction LLC builds ADUs, second-story additions, and mother-in-law suites in Centralia, Washington — owner-led, 100+ projects since 2017."

intro: |
  Three generations sharing one bathroom is the most common reason homeowners in Centralia call about an addition. TopVolk Construction LLC builds detached ADUs, second-story additions, and mother-in-law suites across Lewis County and the I-5 corridor, with every contract written by owner Vladislav Volkov — no sales rep, no middleman answering the phone. Median household income here runs around $40,625, so most projects lean practical: a DADU built around a Whirlpool range and a stacked Amana washer/dryer instead of a full custom kitchen. Families near Fort Borst Park add suites so aging parents can move in without losing independence; others near Centralia College are converting attic or garage space into square footage they can actually rent out. A 2024 state law, WA HB 1337, now allows two ADUs on most single-family lots in Washington, and that includes standard residential zones inside Centralia city limits, which changes what's possible on a lot that used to only fit one house.

localContext: |
  Centralia's housing stock splits into two distinct eras. Downtown and the Fords Prairie area (98531) still have early 1900s timber-boom homes — balloon-framed, sitting on post-and-pier foundations that were never sized to carry a second story. West of I-5 toward the Chehalis city line (98532), postwar ranches and 1970s split-levels dominate, most on slab or shallow crawlspace foundations with more structural room to build out. The Chehalis River floods this valley most winters — 2007 and 2009 both put water in basements from Galvin Road down toward the fairgrounds — so any addition with a crawlspace needs a proper vapor barrier, sump provisions, and often a raised finish floor. City of Centralia Building Permits handles plan review inside city limits; anything toward Bucoda or Mineral falls under Lewis County Community Development instead, and that changes which setback and FAR rules actually apply to your lot.

commonProblems:
  - title: "Fitting a DADU on a Working-Class Lot Under HB 1337"
    description: "State law HB 1337 opened up two ADUs per single-family lot in 2024, and Centralia's smaller parcels — a lot of them 5,000 to 6,000 square feet in Fords Prairie — work fine for a detached ADU once the setbacks pencil out. The real catch is utilities: a DADU needs its own water and sewer lateral, or a shared line sized correctly, plus a separate electrical panel. We frame with Douglas-fir studs on a PT lumber mudsill, run PEX to a Rinnai tankless unit instead of a standard tank to save floor space, and spec a Whirlpool range with a stackable Amana washer/dryer to keep the build affordable. A 400-square-foot DADU typically runs $95,000-$140,000 depending on foundation type and utility runs. Permit review through the City of Centralia usually takes 6-10 weeks."
  - title: "Second-Story Additions on Homes Built for One Story"
    description: "Plenty of Centralia's older homes near downtown were framed light — thin rafters, shallow footings — because nobody planned for a second floor back when the mill was running three shifts and lumber was cheap. Before we touch the roof, a structural engineer calculates whether the existing footing and foundation wall can carry the new dead and live load, and it usually can't without help. That means widening footings, dropping a PSL post to new concrete, or running an LVL beam across the main floor to pick up the new load path. Skip that step and you get a sagging ridge line five years later. Expect $180-$220 per square foot for a full second-story addition once structural upgrades are priced in, and 10-14 weeks of construction once permits clear."
  - title: "Multigenerational Suites Need Their Own Kitchen and Entrance"
    description: "A mother-in-law suite sharing one entrance with the main house isn't really independent living, and most families calling us in Centralia want parents or adult kids to have their own door, their own kitchenette, and their own thermostat. That means new rough-in plumbing for a kitchenette sink and a compact Frigidaire or Kenmore fridge, a dedicated circuit for a two-burner induction cooktop, and a Mitsubishi mini-split so the suite isn't fighting the main house's HVAC zone for temperature. Egress windows matter too — any sleeping room needs a code-compliant escape window, and additions built before current IRC standards often lack one. Budget $45,000-$70,000 for a 400-500 square foot conversion with separate entrance, plumbing, and mini-split included."
  - title: "Permit Review and Matching Old Siding on a New Addition"
    description: "Anything touching the exterior of a pre-1930 home downtown gets checked against setback and lot coverage rules written for narrower lots than modern builders assume, so we confirm FAR and side-yard setbacks with the City of Centralia before drawing anything. Matching 90-year-old cedar clapboard to new construction rarely works — old wood weathers gray, new cedar reads orange for two years. We usually recommend Hardie fiber-cement lap siding painted to match instead, since it resists the moss and mildew that north-facing walls collect through Lewis County's wet winters. Roofing ties in with proper step flashing and a matched ledger board where the new roofline meets the old rafters. Plan review typically runs 4-8 weeks inside city limits, longer if a variance is needed."
  - title: "What Actually Drives the Price on a Centralia Addition"
    description: "Foundation type moves the number more than anything else — a slab addition off a 1970s rancher costs less per square foot than tying new framing into a 1910 post-and-pier home that needs sistered joists and new blocking just to meet current code. Utility runs are the second big factor: extending a sewer lateral 80 feet to a new DADU costs more than a suite tying into plumbing three feet away. We write a line-item quote, not a range, and every contract includes a penalty clause if we miss the completion date — that's not boilerplate, Vladislav pays it. Most full additions in Centralia land between $80,000 and $220,000 depending on scope, and every quote starts with a free on-site walkthrough before numbers get finalized."

faq:
  - q: "How fast can you get to Centralia for Home Additions?"
    a: "Centralia sits right off I-5, about 90 minutes south of the Seattle Metro area and 25 minutes from Olympia, so site visits get scheduled around that drive time — usually within a week of your call. Vladislav handles the initial walkthrough himself, measuring the lot, checking setbacks, and photographing the foundation before drafting a quote. Street parking gets tight near the downtown historic district, but most Centralia lots have driveway access wide enough for material delivery and a small dumpster. Call (206) 591-1096 to get a visit scheduled."
  - q: "What does a home addition in Centralia cost?"
    a: "Additions here run $80,000 to $220,000+ depending on square footage, foundation type, and whether new utilities need to run to a detached structure. A 400-square-foot DADU with its own kitchen and bath typically lands between $95,000 and $140,000, while a full second-story addition runs $180-$220 per square foot once structural upgrades are included. Every quote is line-item, not a ballpark range, so you know what you're paying for before signing. Call (206) 591-1096 for a free on-site walkthrough with exact pricing."
  - q: "Do I need a permit for an addition in Centralia?"
    a: "Yes — any addition, DADU, or second story needs plan review, and where you file depends on your address. Inside city limits that's City of Centralia Building Permits; outside city limits toward Bucoda or Mineral it's Lewis County Community Development, and setback and FAR rules differ between the two. TopVolk prepares the site plan, structural calcs, and HB 1337 ADU paperwork as part of the contract, with plan review typically taking 6-10 weeks depending on jurisdiction workload. TopVolk Construction LLC is a WA Licensed Contractor, so permit pulls and inspections are handled directly."
  - q: "Can I add a second ADU to my lot under the new law?"
    a: "Under WA HB 1337, most single-family lots in Washington — including standard residential zones in Centralia — now qualify for up to two ADUs, meaning one attached plus one detached, or two detached units depending on lot size. We check lot coverage, the 24-foot height limit standard for a DADU, and parking exemptions before drawing plans, since a lot near transit or downtown may qualify for reduced parking requirements. Separate utility connections are usually required for the second unit, which affects both cost and timeline. Call (206) 591-1096 and we'll walk your lot to confirm what actually fits."
  - q: "How long does an addition last in this climate?"
    a: "Framing built to current IRC standards with proper flashing and a real vapor barrier in the crawlspace should outlast the original house — Lewis County's wet winters are hard on anything installed wrong, not on lumber itself. We use Hardie siding over Douglas-fir framing specifically because fiber cement doesn't rot or feed moss the way old cedar does on north-facing walls. Workmanship is covered for one year after final inspection, and manufacturer warranties on items like the Rinnai water heater or Mitsubishi mini-split run 10-12 years separately. Ask about specific warranty terms during your free consultation."
  - q: "Do you build additions outside Centralia too?"
    a: "Yes — TopVolk covers the I-5 corridor from Centralia and Chehalis up through Lewis County, plus regular work across King, Snohomish, Pierce, and Kitsap counties. Scheduling typically runs 2-4 weeks out for a first site visit, less if the project is time-sensitive. Vladislav Volkov handles every consultation personally, with no sales staff involved, and TopVolk has completed 100+ projects since 2017. Call (206) 591-1096 or schedule a free consultation to get on the calendar."