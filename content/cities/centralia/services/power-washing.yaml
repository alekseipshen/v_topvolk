  - q: "Will pressure washing damage my Hardie siding or cedar deck?"
    a: "Not at the settings we run — Hardie fiber-cement and cedar both get a soft-wash approach under 500 PSI with a diluted sodium hypochlorite mix, never a turbo nozzle straight at the surface. Cedar decking gets an oxalic acid wood brightener pass afterward instead of just higher pressure, which is what actually removes the gray without gouging the grain. A rotary surface cleaner keeps pressure even across flat Hardie panels so you don't get the striped 'zebra' marks that come from a wand held too close in one spot. That's the difference between a wash that helps a repaint stick and one that voids the paint warranty."
  - q: "How long will the clean look last in Centralia's climate?"
