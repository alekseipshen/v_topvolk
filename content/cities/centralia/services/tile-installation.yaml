title: "Centralia Tile Installation — Kerdi Showers & Porcelain"

answer: "TopVolk Construction LLC installs Schluter Kerdi showers and large-format porcelain tile in Centralia, WA — owner-run, 100+ projects completed."

intro: |
  Schluter Kerdi membrane goes under every tiled shower pan TopVolk builds in Centralia. A laser-leveled substrate goes down before any large-format porcelain gets set. That's the baseline here, not an upsell. Moisture is a real problem in this region from October through May, and skipping either step is how showers fail early.

  Housing near Fords Prairie and the streets by Washington Park downtown often dates back to the coal-mining boom years. Original subfloors from that era are rarely flat enough for 24x48 porcelain planks. Most jobs need a leveling pour or a mud bed first.

  Other calls come from full kitchen remodels near Fort Borst Park. A homeowner wants to swap a builder-grade laminate backsplash for handset subway tile behind a new range. Often the outlet for the hood vent has to move first, before a single tile goes up. Mudroom and laundry-area tile is a common add-on too, especially in homes running an older Whirlpool or Kenmore washer setup where the floor around the drain pan has never been properly waterproofed.

  Vladislav Volkov runs every one of these jobs directly. No sales rep. No handoff to a sub you've never met. Call (206) 591-1096 and you're talking to the person actually setting the tile.

localContext: |
  Centralia's housing runs older than a lot of the Seattle suburbs TopVolk works in. Plenty of 98531 homes near downtown and the Edison area were framed before 1930. Many sit on post-and-pier foundations with crawlspaces that stay damp most of the winter.

  That matters for tile work. A proper vapor barrier and cement board setup underneath keep a bathroom floor from cupping or sounding hollow two years after installation. On manufactured and mobile homes, common throughout Lewis County, TopVolk often uses DriCore subfloor panels first to isolate the tile from any subfloor flex.

  Out toward Fords Prairie and the newer builds closer to 98532 near the Chehalis line, subfloors are plywood over joists instead of a mud-set base. The approach shifts there. Ditra or Ditra-Heat goes directly over ply instead of a traditional mortar bed.

  Lewis County's Community Development department handles permits for anything structural tied into a remodel here. Not Seattle SDCI. Not King County DPER. Plan review on straightforward bath or kitchen work usually clears in a couple weeks, faster than the bigger-county jurisdictions.

  Given the median income in this market, most jobs land on ceramic or mid-range porcelain rather than natural stone. That's durable and budget-friendly, as long as it's waterproofed correctly the first time. Fixtures follow the same logic — Moen or Kohler valves and trim kits instead of imported specialty brands, which keeps the plumbing side of a shower remodel in line with the rest of the budget.

commonProblems:
  - title: "Shower Pans That Stay Damp Days After Anyone's Showered"
    description: "Older Centralia bathrooms often have a shower pan liner that was folded instead of properly seamed at the corners. That lets water track down into the subfloor instead of out the weep holes, especially in bathrooms built before mudded pans went out of style. TopVolk tears the pan back to the studs and rebuilds it with a Schluter Kerdi pre-formed shower pan and Kerdi-Band at the seams. On curbs and niches where the membrane won't wrap cleanly, RedGard works as a trowel-applied alternative. A standard 5x8 bathroom runs roughly $6,500-$11,000 for a full shower rebuild, depending on tile choice. The wet work alone takes about a week before tile can even start. Skipping this step is the single biggest reason a shower gets redone twice, and it usually costs more the second time around."

  - title: "24x48 Porcelain Planks Won't Sit Flat Over a 1970s Ranch Subfloor"
    description: "Large-format porcelain needs a substrate flat within about 1/8 inch over 10 feet. Most existing subfloors in Fords Prairie ranches and the manufactured homes common around Lewis County aren't close. That gap shows up as lippage at every tile edge. TopVolk checks the floor with a laser level before ordering material. Then the floor gets floated with self-leveling underlayment or Ditra mat over plywood to get a true plane. Skip that step on a 32x32 or 24x48 tile job, and cracked corners show up within a year. Self-leveler adds roughly $2-$4 per square foot and a full day of cure time, cheaper than tearing out cracked porcelain later."

  - title: "Backsplash Tile Set Before the Electrical Gets Moved"
    description: "Kitchen remodels around Fort Borst Park and downtown Centralia often start with tile before anyone's confirmed where the new outlets, hood vent, or range connection actually land. That's a common mismatch when a GE or Whirlpool range gets swapped for something with different clearance needs, or when a Frigidaire or Samsung range hood needs a higher CFM rating than the old builder-grade unit. TopVolk sequences electrical rough-in and inspection through Lewis County before a single sheet of cement board goes up. Outlets and switch plates land in the grout joints, not mid-tile. As a WA Licensed Contractor, that permit coordination is built into the contract, not billed as a surprise change order later. A standard 30-square-foot backsplash with electrical relocation typically adds one to two days to the schedule."

  - title: "What Tile Installation Actually Costs in a Market Like Centralia"
    description: "Ceramic tile installed typically runs $9-$14 per square foot in this area, including thinset, backer board, and labor. Porcelain runs $12-$20. Natural stone with proper sealing pushes $18-$28. Cost drivers include the substrate condition, tile size, and whether waterproofing or heated floor systems like Warmup or Schluter Ditra-Heat are part of the scope. Large-format tile takes longer to set and level, which adds labor cost. TopVolk quotes line by line: material, labor, waterproofing, permit fees where they apply. There's no vague range to guess at. Deadline penalties are written into every contract, which matters more on a project-based remodel than a one-day repair."

  - title: "Grout and Natural Stone That Don't Hold Up Through a Lewis County Winter"
    description: "Unsealed grout and natural stone like travertine or marble pick up mildew fast in a climate that stays humid from fall through spring. North-facing bathroom walls that never get direct sun are hit hardest. A penetrating sealer reapplied every 12-18 months keeps porous stone from staining and slows efflorescence around grout lines. Porcelain tile itself typically lasts 25+ years with basic care. Grout and sealant are the parts that actually wear out first. TopVolk uses epoxy grout in wet areas specifically because it resists staining and doesn't need resealing like standard cementitious grout does."

