    a: "Centralia sits right off I-5 at Exit 82, about ninety minutes south of Seattle and under an hour from Tacoma, so TopVolk batches Lewis County plumbing calls into scheduled trips rather than one-off runs. For plumbing tied to an active remodel, work usually starts within three to five business days of the first call; a standalone water heater swap can often get scheduled faster if it lines up with a nearby job. Parking and access are easy outside the downtown core near Centralia Square. Call (206) 591-1096 and Vladislav will confirm a site visit window directly — no dispatcher, no answering service."
  - q: "What does a full repipe cost in Centralia?"
    a: "Most single-story repipes in Centralia's older cottages run $6,500 to $11,000 for a two-bath home, depending on wall access, crawlspace clearance, and whether the job uses PEX-A with SharkBite fittings or copper with soldered joints. Homes with finished basements or plaster walls cost more because of patch-and-repair after the lines go in. TopVolk gives a written, line-item estimate after walking the crawlspace and attic in person — not a phone quote — so the number on the contract matches the number on the invoice. Ask about a free on-site estimate when you call."
  - q: "Do I need a permit to replace a water heater in Centralia?"
    a: "Yes — Washington plumbing code requires a permit and inspection for every water heater replacement, including seismic strapping anchored to framing, correctly sized T&P relief valve piping, and an expansion tank on closed systems. Inside Centralia city limits, that permit runs through the City's Building Division; outside the limits, it's Lewis County Community Development. TopVolk pulls the permit under its WA Licensed Contractor status and schedules the final inspection as part of the job, so there's no unpermitted water heater sitting in the crawlspace when the house eventually sells. Turnaround on the permit itself typically runs a few business days in Centralia, longer for county review."
  - q: "Can my old gas line handle a Rinnai or Navien tankless water heater?"
    a: "Probably not without an upsize. Tankless units draw 150,000-199,000 BTU compared to roughly 40,000 BTU for a standard 40-gallon tank, and older black iron lines in Centralia homes were sized for the smaller draw. TopVolk runs the load calculation first, upsizes the branch line — often to CSST — from the meter or manifold, and coordinates the mechanical inspection before the unit goes live. Homes with older gas services near Harrison Avenue sometimes need a meter upgrade through Cascade Natural Gas first, which adds about a week to the schedule."
  - q: "How long does a PEX repipe hold up in a Centralia home?"
    a: "PEX-A runs installed correctly last 40-50 years, well past the copper and galvanized pipe it typically replaces, and it resists the freeze-crack failures that split rigid pipe in unheated Lewis County crawlspaces. TopVolk backs labor on repipe work for one year, and the PEX itself carries a manufacturer warranty separate from the install. What it won't cover is damage from a future remodel that nicks a line behind drywall — that's on whoever opens the wall next. Fittings matter too: crimp or expansion connections done to spec outlast push-fit fittings left exposed in a damp crawlspace."
  - q: "Do you cover areas outside Centralia?"
    a: "Yes — TopVolk works plumbing scope throughout Lewis County, including Chehalis, Napavine, Winlock, and Bucoda, usually batching those visits with Centralia jobs to keep drive time down and avoid a separate trip charge. Scheduling windows run similar across the area: a few business days out for remodel-tied plumbing, longer for a full repipe that needs multiple site visits to scope correctly. Call (206) 591-1096 to check the current schedule, or ask about a free consultation before committing to a repipe or water heater swap."