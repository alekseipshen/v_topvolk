title: "Centralia Kitchen Remodel — Older Homes, Real Budgets"

intro: |
  Most of the homes within walking distance of Fort Borst Park and the blocks
  surrounding Centralia College were built between 1920 and 1960 — and the
  kitchens inside them show it. Narrow galley layouts, a single 20-amp circuit
  running the refrigerator and the toaster off the same breaker, 30-inch base
  cabinets that were already undersized when they were new. Lewis County pulls
  close to 55 inches of rain a year, more than Seattle, and that moisture
  finds its way into laminate countertop edges, particleboard cabinet boxes,
  and subfloor sheathing beneath the sink. By the time most homeowners in the
  98531 zip code call us, the GE range is sitting on a floor that flexes, the
  cabinet toe kick is soft, and the countertop has been pulling away from the
  backsplash for two winters. Vladislav Volkov at TopVolk Construction has
  worked through this exact type of remodel since 2017 — owner-operated,
  100+ projects completed, and permits pulled through the City of Centralia's
  building department. Call (206) 591-1096 to schedule a free on-site
  consultation directly with Vladislav.

localContext: |
  Centralia's housing stock splits into two rough groups. The older inventory
  clusters near the historic downtown corridor — the blocks along Mellen
  Street, Tower Avenue, and the railroad district in zip code 98531 — and
  those homes come with post-and-pier foundations, original fir subfloors, and
  kitchens that rarely exceed 90 square feet. Post-1960 development pushed
  outward along roads feeding off Harrison Avenue toward the city's eastern
  edges, and those houses landed builder-grade everything: 100-amp panels,
  galvanized supply lines under the sink, and vinyl-wrapped particleboard
  cabinets that hold up fine until the first serious water intrusion. Both
  types share the same core problem — the kitchen was designed for one person
  working alone, not for a family that actually uses the space. The most
  common structural request on these jobs is removing a wall between the
  kitchen and the adjacent dining room, which means tracing the load path from
  the ridge down, engineering the beam sizing, and installing an LVL beam with
  proper bearing at each end. Lewis County's rainfall also makes crawlspace
  vapor barrier condition a real concern before any new subfloor or flooring
  goes down.

commonProblems:
  - title: "Load-Bearing Wall Removal in Pre-1950 Centralia Bungalows"
    description: |
      The Craftsman bungalows and early ranchers along Tower Avenue and Mellen
      Street almost universally have a load-bearing wall between the kitchen
      and the dining room. Homeowners discover this mid-demo when a ceiling
      joist starts to deflect. Before any wall comes down, the load path needs
      to be traced from the ridge to the foundation — in a single-story
      Centralia bungalow that typically means a temporary shoring wall during
      demolition, ceiling opened to expose the framing, and an LVL beam sized
      for the span. On a 10- to 12-foot opening, the LVL beam runs $600–$1,200
      in materials. PSL posts or doubled king studs carry the beam ends, with
      joist hangers on both sides to meet IRC framing requirements for lateral
      connection. Budget $3,500–$6,500 for the structural phase alone — that
      number doesn't include drywall, paint, or any finish work. The City of
      Centralia requires a permit and structural detail for this scope, so plan
      for a 3–5 week plan review window before demo starts.

  - title: "100-Amp Panel Insufficient for Modern Kitchen Loads"
    description: |
      A 100-amp service panel — standard in Lewis County homes built before
      1970 — cannot reliably carry a modern kitchen. An induction range pulls
      40–50 amps by itself. Add a Whirlpool dishwasher, a refrigerator with
      an ice maker, recessed lighting on a dimmer circuit, and a range hood
      running 400 CFM, and you're tripping breakers before dinner is halfway
      done. Upgrading from 100 to 200 amps typically runs $2,800–$4,500 in
      the Centralia area, depending on whether the meter base needs replacement
      and how far the panel sits from the exterior disconnect. This requires a
      separate electrical permit through the City of Centralia and a licensed
      electrician. TopVolk coordinates rough-in inspection scheduling so
      electrical work and cabinet installation happen in the right sequence —
      a detail that gets skipped on a lot of jobs and causes delays when the
      inspector finds a cabinet blocking an electrical box that hasn't been
      signed off yet.

  - title: "Cabinet Replacement: IKEA vs. Semi-Custom on a Centralia Budget"
    description: |
      At a median household income around $40,000, most Centralia homeowners
      aren't shopping full-custom cabinetry. IKEA SEKTION boxes are a
      legitimate option — solid carcase construction, 25-year warranty, and
      total material cost for a 10x10 kitchen in the $2,500–$5,000 range.
      Semi-custom lines add 40–80% to that figure but deliver real dovetail
      drawer boxes, soft-close hardware, and better finish durability. What
      trips both up in older homes is wall condition. Plaster walls in pre-1950
      Centralia houses are rarely plumb or flat — cabinet installation requires
      shimming, scribing filler strips, and sometimes furring the wall surface
      before a single box goes up. Pulling a building permit through the City
      of Centralia for a full kitchen remodel — one that includes structural,
      electrical, and plumbing changes — triggers a plan review cycle running
      3–6 weeks. TopVolk, as a WA Licensed Contractor, prepares the permit
      documents and submits them so homeowners aren't navigating the process
      cold.

  - title: "Countertop and Sink Replacement on a Working Budget"
    description: |
      Quartz countertops are popular, but at $60–$100 per square foot
      installed, they stretch most Centralia kitchen budgets. Laminate has
      improved — Formica's 180fx series mimics stone convincingly and runs
      $15–$30 per square foot installed. Solid-surface options like Corian
      sit in between at $40–$65 per square foot and can be routed for an
      undermount Moen or Kohler sink without the sealing requirements natural
      stone demands. For homeowners who want a stone look without the full
      price, quartz at the perimeter and butcher block on an island runs
      roughly $2,800–$4,200 for a typical Centralia kitchen layout. The
      substrate matters too — in Lewis County homes where galvanized pipes
      have already left rust stains on interior framing, a Schluter Kerdi
      membrane behind the tile backsplash prevents moisture from tracking
      behind the wall and staying there. Getting that waterproofing detail
      right during rough-in avoids a callback two years out.

  - title: "Subfloor Rot and Flooring Replacement After Decades of PNW Moisture"
    description: |
      Lewis County's rainfall — nearly double Seattle's average in a wet year
      — finds every gap in an older home's building envelope. In kitchens, the
      damage concentrates beneath the sink cabinet and along exterior walls.
      Before new flooring goes down, every soft spot gets checked and any
      compromised sheathing gets replaced with new plywood, sistered to
      adjacent joists for full bearing. DriCore subfloor panels over a vapor
      barrier add a thermal break above crawlspaces in homes with no floor
      insulation — common in pre-1960 Lewis County builds. LVP (luxury vinyl
      plank) is the practical flooring choice for most Centralia kitchens:
      waterproof core, 20-mil wear layer options that hold up to actual use,
      and forgiving enough to install over the minor surface irregularities
      common in older subfloor systems. Budget $4–$8 per square foot installed
      for mid-grade LVP, plus subfloor repair costs that vary depending on what
      demo reveals — something TopVolk factors into the written scope before
      work starts, not after.

faq:
  - q: "How fast can you get to Centralia for a kitchen remodel consultation?"
    a: |
      Centralia sits about 80 miles south of Seattle on I-5 — roughly 90
      minutes depending on traffic near Tacoma and JBLM. Vladislav Volkov
      makes the drive for free on-site consultations, typically scheduling
      within 5–10 business days of first contact. The visit covers a full
      kitchen walk-through, a preliminary scope discussion, and an honest
      assessment of structural and mechanical conditions before any numbers go
      on paper. Parking isn't a problem in most Centralia neighborhoods.
      Call (206) 591-1096 directly — you'll reach Vladislav, not a call
      center or sales coordinator.

  - q: "What does a full kitchen remodel in Centralia typically cost?"
    a: |
      Full kitchen remodels in Centralia — cabinets, countertops, appliances,
      flooring, and any structural or electrical work — run $35,000–$90,000
      depending on scope. A cabinet-and-countertop refresh with no structural
      changes sits lower, around $18,000–$35,000. Add a load-bearing wall
      removal, a panel upgrade to 200 amps, and new plumbing rough-in and
      you're in the upper range. Appliance packages matter: a Frigidaire or
      Samsung suite runs $2,500–$4,500, versus $8,000+ for higher-end brands.
      TopVolk provides line-item quotes — no vague allowance ranges, no
      surprises at the final invoice.

  - q: "Do I need a permit for a kitchen remodel in Centralia, WA?"
    a: |
      Cosmetic work — paint, hardware, replacing cabinet doors — doesn't
      require a permit. Structural changes (wall removal), electrical upgrades
      (new circuits, panel replacement), or plumbing modifications (moving the
      sink, adding a gas line) all require a building permit through the City
      of Centralia's building department. Plan review for a full kitchen
      remodel typically runs 3–6 weeks in Centralia. TopVolk, as a WA
      Licensed Contractor, handles permit application preparation, document
      submission, rough-in inspection scheduling, and final inspection
      coordination. Skipping permits on MEP or structural work creates
      problems at resale and can void insurance claims on future water or
      structural damage.

  - q: "Can you open up a closed-off kitchen in an older Centralia home?"
    a: |
      This is the most common structural request on Centralia jobs. The first
      step is confirming whether the wall is load-bearing — in pre-1950 homes,
      most walls running perpendicular to the floor joists carry load. Demo
      starts with a temporary shoring wall in place, then the ceiling opens to
      expose framing, and an LVL beam sized to the span gets installed with
      proper end bearing and blocking at each post. Joist hangers on both ends
      are required for rough-in inspection sign-off under current IRC
      requirements. The City of Centralia requires a permit and structural
      detail for this work — budget 3–5 weeks for plan review before demo
      begins, and 2–3 weeks for the structural phase itself once permits
      are issued.

  - q: "What warranty comes with a TopVolk kitchen remodel?"
    a: |
      TopVolk provides a written 2-year workmanship warranty on labor and
      installation. Material warranties pass through from manufacturers —
      IKEA SEKTION cabinets carry a 25-year limited warranty, most countertop
      fabricators offer 1–2 years, and appliances like Whirlpool and GE carry
      standard 1-year parts-and-labor coverage. Structural work — LVL beam
      installation, subfloor repair, framing modifications — carries its own
      written workmanship warranty separate from finish items. Deadline
      penalties are also written into every contract: if a milestone date
      gets missed, there's a financial consequence, not just a phone call
      with an apology.

