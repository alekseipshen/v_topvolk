title: "Centralia Carpentry — Trim, Stairs & Built-Ins Done Right"

answer: "TopVolk Construction handles trim, stair, and built-in carpentry in Centralia, Washington — owner-led, 100+ projects completed since 2023."

intro: |
  A mismatched door casing — one board that doesn't match the rounded 1940s profile running through the rest of the house — is often the detail that finally gets a Centralia homeowner to call a carpenter. TopVolk Construction handles that kind of matching work along with stair tread replacement, built-in pantry cabinets, and cedar fascia repair across Lewis County. Centralia's older homes near downtown and Fords Prairie still carry original fir trim and pine baseboard from the mill-town era, and a lot of that stock is either painted over a dozen times or cracked from decades of settling. Out past Fort Borst Park, newer additions from the '70s and '80s often used builder-grade MDF casing that's already swelling at the joints from crawlspace moisture. One recent job involved building a pantry cabinet around a Kenmore side-by-side fridge in a kitchen where the old closet door frame had rotted at the base. Vladislav Volkov runs every one of these jobs personally — call (206) 591-1096 for a free on-site estimate.

localContext: |
  Centralia's housing stock breaks into a few clear waves. Down near 98531's core and the blocks around Fords Prairie, you'll find early 1900s mill-worker cottages and 1920s bungalows with original fir door casing, plaster walls, and post-and-pier foundations that have shifted enough to throw every miter joint out of square. Out toward the Oakview area and the edges of 98532 near Chehalis — the two towns run together along I-5 — ranch-style homes from the 1960s and '70s dominate, usually with painted pine trim and stair stringers built to a shallower rise than current IRC standards allow for new work. Lewis County's building department requires a permit for structural stair rebuilds and any load-bearing header work, though most trim, casing, and built-in carpentry falls outside permit review. Winters here bring sustained rain off the Chehalis and Skookumchuck rivers, and that moisture works into exterior fascia and untreated jamb material faster than people expect, especially on north-facing walls that don't get afternoon sun.

commonProblems:
  - title: "Craftsman Window Seats and Bookcases That Don't Match the Room"
    description: "A built-in bookcase that doesn't sit flush against a Craftsman-era wall usually means the wall itself isn't square — common in Fords Prairie bungalows built before 1930. We scribe the face frame to the actual wall line instead of forcing a factory-square cabinet into an out-of-square opening, then join corners with pocket screws and glue rather than nails alone so the joints don't open up when the house settles further. Solid poplar face frames hold paint better than MDF in Centralia's humidity, though we'll use prefinished MDF panel stock for the cabinet box to keep costs down. A typical window seat with flanking bookcases runs $3,200 to $6,500 depending on cushion and shelving detail, and most jobs finish in seven to ten working days."
  - title: "Painted-Over Trim and Casing Losing Their Original Profile"
    description: "Layers of paint on original fir baseboard and door casing in a 1920s Centralia bungalow can add an eighth of an inch of buildup per coat, which is why coped joints at inside corners stop closing tight after enough repaints. We strip back to bare wood on pieces worth saving, re-cut the coped joint with a coping saw rather than just caulking the gap, and splice in matching profile stock — usually finger-jointed primed pine unless the homeowner wants to match original fir grain for a stain-grade look. Where casing is too far gone, we run new stock on a router table to match the existing ogee or bullnose profile board-for-board. Restoration work like this typically runs $18 to $28 per linear foot depending on profile complexity and how much of the original material survives."
  - title: "Stair Stringers Built Below Current Code"
    description: "Stair stringers on homes built before the 1970s in Centralia were often cut with a shallower rise-to-run ratio than the current IRC allows, and once the treads start flexing or the stringer itself splits near a notch, patching it with construction adhesive doesn't hold for long. A proper rebuild means sistering new LVL or doubled 2x12 stringers alongside the original, resetting risers to a consistent 7-3/4 inch max rise, and anchoring with Simpson Strong-Tie stair angle brackets instead of toe-nailing. Structural stair rebuilds fall under Lewis County's building permit requirements when they involve altering the load path, so we pull that permit and schedule the inspection ourselves. Most interior stair rebuilds take two to three weeks including the permit turnaround, and run $4,000 to $9,000 depending on tread material and railing scope."
  - title: "Pricing a Pantry or Closet Organizer the Right Way"
    description: "Pricing a pantry or closet organizer build in Centralia depends mostly on face frame material, shelf adjustability, and whether we're working around an existing appliance like a Whirlpool or Kenmore refrigerator that limits the opening width. A basic melamine-panel closet system with adjustable shelving starts around $900, while a full face-frame pantry cabinet with soft-close hardware, pull-out shelving, and a stain-grade poplar frame runs $2,800 to $5,500. We quote every job as a fixed line-item price after the on-site visit — not a range — so there's no guessing what the drawer slides or the crown cap on top actually cost. Warranty on the carpentry itself is two years on workmanship, and cabinet hardware carries the manufacturer's own warranty, typically five to ten years on soft-close hinges."
  - title: "Cedar Fascia Failing After a Decade of Lewis County Winters"
    description: "Cedar fascia on Centralia homes takes a real beating from the rain coming off the Chehalis and Skookumchuck watersheds, especially on north-facing eaves that stay damp for days after a storm. Once cedar starts cupping or the nails start backing out, water gets behind the board and starts rotting the sub-fascia and the ends of the rafter tails underneath. We're replacing more cedar fascia with Azek PVC trim or CertainTeed cellular PVC boards these days — same profile, but it won't check, cup, or feed moss the way cedar does after year eight or nine. Expect a fascia replacement on an average single-story home to run $1,800 to $3,500 for materials and labor, and budget for a repaint or re-caulk every four to five years if you stick with cedar instead."

faq:
  - q: "How fast can you get to Centralia for Carpentry?"
    a: "Centralia sits just off I-5 exit 82, about an hour south of Tacoma and roughly 90 minutes from Seattle, so project-based carpentry work here gets scheduled in blocks rather than same-day service calls. Vladislav drives down for the initial on-site consultation, then blocks out consecutive work days once material — casing stock, cedar fascia boards, cabinet panels — is ordered and on hand. Parking is rarely an issue outside downtown Centralia, and most residential streets have room for a work trailer. Call (206) 591-1096 to get a project scheduled or ask about the next open week."
  - q: "What does trim and casing replacement cost in Centralia?"
    a: "Trim and casing work is priced per linear foot once we've seen the existing profile and condition — figure $18 to $28 per linear foot for baseboard or door casing restoration, and $12 to $18 per linear foot for new construction-grade trim install. A full interior trim package for an average 3-bedroom bungalow typically lands between $6,000 and $14,000 depending on how much original material can be saved versus replaced outright. Stair and built-in work is quoted as a fixed project price, not an hourly rate. Every quote comes with a line-item breakdown after the free on-site walkthrough, so there's no rounding up on materials."
  - q: "Do carpentry projects need a permit in Lewis County?"
    a: "Trim, casing, wainscoting, and built-in cabinetry generally don't require a permit in Lewis County since they're non-structural finish work. Stair stringer rebuilds, header changes, or anything altering a load path do need a permit through the Lewis County Building Department, and we handle that application and the rough-in and final inspection scheduling directly. TopVolk Construction is a WA Licensed Contractor, so the permit paperwork lists our license and the homeowner isn't the one navigating the county portal alone. Typical permit turnaround for a straightforward stair rebuild runs one to three weeks depending on the department's current queue."
  - q: "Can you match trim profiles in an older Centralia home?"
    a: "Yes — most original casing and baseboard in Centralia's older bungalows uses a simple ogee or colonial profile that we can match on a router table with the right bit set, or order as custom milled stock if the profile is unusual. We'll pull a sample piece, trace the profile, and either match it in finger-jointed primed pine for a paint-grade job or solid fir if you want a stain-grade match. For beadboard and wainscoting, we typically run MDF beadboard panel with a poplar cap rail and baseboard, which holds paint better than the original tongue-and-groove ever did."
  - q: "What's the warranty on trim and built-in carpentry work?"
    a: "Workmanship on all carpentry — trim, built-ins, stair rebuilds — carries a three-year warranty against joint separation, warping, or hardware failure tied to installation. Cedar fascia and exterior trim are the pieces most exposed to Centralia's wet winters, so we'll flag upfront if a homeowner should budget for PVC trim like Azek instead of cedar if they want to skip repainting every few years. Interior trim and built-ins, kept dry, typically outlast the warranty period by decades — it's mostly a matter of paint maintenance, not structural failure. Manufacturer warranties on cabinet hardware and hinges are separate and handled directly through the hardware maker."
  - q: "Do you cover areas near Centralia, and how far out is scheduling?"
    a: "Centralia work gets grouped with jobs in Chehalis, Napavine, and other Lewis County communities along the I-5 corridor to keep travel efficient, alongside our regular project schedule across the Seattle Metro area. Scheduling windows run two to four weeks out for trim and built-in work, longer for stair rebuilds that need a permit first. Vladislav Volkov handles every consultation and every job personally — no sales staff, no subcontracted estimators — and deadline penalties are written into the contract once a project starts. Call (206) 591-1096 or ask for a free on-site consultation to get on the schedule."