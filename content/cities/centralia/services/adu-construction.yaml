title: "Centralia ADU Construction — Backyard Units, HB 1337"

answer: "TopVolk Construction builds detached and attached ADUs in Centralia, Washington — WA Licensed Contractor, 100+ projects completed since 2023."

intro: |
  TopVolk Construction designs and builds detached ADUs (DADUs), attached additions, and basement conversions for homeowners in Centralia, working under WA HB 1337, which now allows up to two accessory units on most single-family lots statewide. A lot of the interest we see comes from families near Fort Borst Park and the older homes along Cooks Hill Road who want rental income, or space for a parent, without selling the main house. Median household income in Centralia runs around $40,625, so most owners we talk with are budgeting a practical build in the $90K-$150K range rather than a custom architect showpiece — that means a Whirlpool range and Frigidaire fridge in the ADU kitchen, laminate counters, vinyl plank flooring, not imported stone. Lots near downtown and Centralia College often have alley access, which works well for a detached unit with its own driveway and doesn't eat into the front yard. Vladislav Volkov walks every site personally before writing a quote, and the contract includes a penalty clause if the project runs past deadline.

localContext: |
  Centralia's housing stock splits pretty evenly between early-1900s foursquare and craftsman homes near downtown (98531) and newer ranch and split-level construction built after the 1960s further out toward Fords Prairie and the edge of unincorporated Lewis County (98532 covers part of the Chehalis side of the twin-city split, and a lot of our ADU calls come from that corridor too). Older lots in the historic district off Pearl Street or near Washington Park often sit on post-and-pier foundations with knob-and-tube wiring still live in the walls, which changes how we run a new electrical sub-panel out to a detached unit. Homes inside city limits go through the City of Centralia Building Division for ADU permits; anything just outside the line — Salzer Creek Road, parts of Fords Prairie — falls under Lewis County Community Development instead, and the two offices don't always read setback rules the same way. Centralia sits in the Chehalis River flood corridor, so any DADU or basement conversion near the river bottom needs a flood-zone determination before plan review starts, not after. Winter freeze-thaw cycles mean footings for a new unit have to go below frost depth, same as the main house foundation.

commonProblems:
  - title: "DADU vs. Attached ADU vs. Basement Conversion for Rental Income"
    description: "A detached unit in the backyard rents for more and keeps the tenant separate from the main house, but it means new footings, a new sewer lateral tie-in, and a full electrical sub-panel run from the main service. A basement conversion is cheaper to build but needs an egress window with a proper window well cut into the foundation, plus sister joists or an LVL beam if we're opening up the ceiling for headroom. Attached additions split the difference — shared foundation, separate entrance. Basement conversions run $55K-$85K here; a stand-alone DADU with its own kitchen (GE range, Whirlpool fridge) runs $120K-$170K and takes 4-7 months including permitting."
  - title: "Septic Capacity and Water Meters Outside City Limits"
    description: "Inside Centralia city limits, tying a new ADU into municipal sewer is straightforward — one more sewer lateral off the main line. Outside the city, in unincorporated Lewis County, most homes run on a septic tank and drain field sized for the original house only, and a second unit can push that system past its design capacity fast. We pull septic records before quoting and, where the system can't handle a second bedroom count, size a supplemental field or a separate tank. Water is its own question too: sharing one meter works for a basement conversion, but a detached unit usually needs its own meter pit, built with PT lumber blocking and a frost-proof shutoff, running $6K-$12K depending on trench distance from the street."
  - title: "Permit Review Through City of Centralia vs. Lewis County"
    description: "Centralia doesn't run a pre-approved plan program like Seattle's MAP process, so every ADU here goes through full plan review — figure 6-10 weeks for the City of Centralia Building Division, longer if Lewis County Community Development is involved for an unincorporated lot. HB 1337 sets the height limit at 24 feet for a detached unit and removes most parking minimums for lots within a quarter mile of a Twin Transit route, which covers a good chunk of central Centralia. Setbacks, lot coverage, and FAR still apply and get checked at rough-in inspection and again at final inspection. TopVolk Construction is a WA Licensed Contractor and handles the application, plan set, and inspection scheduling directly — no separate permit-expediting fee tacked on."
  - title: "What a Centralia ADU Actually Costs"
    description: "Three things move the price more than anything else: foundation type, utility distance, and finish level. A slab-on-grade DADU close to the existing sewer and water lines costs less than one set on a crawlspace foundation at the back of a deep lot, where trenching alone can add $10K-$15K. Hardie siding to match the main house runs more than vinyl but holds up better against Centralia's wet winters. Realistic range for a full detached unit: $110K-$180K; a basement conversion with a code-compliant egress window and its own mini-split runs $55K-$90K. Every quote from TopVolk Construction is line-item, not a ballpark range, and the deadline penalty is written into the contract, not just promised on a sales call."
  - title: "Siding, Insulation, and What Holds Up in Lewis County Rain"
    description: "Centralia gets roughly 45-50 inches of rain a year, more than Seattle, and it shows on the north side of anything built with untreated cedar within a decade. We spec Hardie cement-board siding on most ADU builds now because it doesn't rot or need repainting every 5 years like cedar lap siding does. Crawlspace vapor barrier is non-negotiable under IRC requirements here — skip it and you're fighting mold under the subfloor within two winters. Attic insulation goes in at R-49 minimum to keep heating costs down for a tenant running a Mitsubishi mini-split through January. Expect 30+ years out of Hardie siding and a standard 40-year composition roof if gutters get cleaned twice a year."

faq:
  - q: "How fast can you get to Centralia for Adu Construction?"
    a: "Centralia sits about 90 minutes south of Seattle and 25 minutes north of Chehalis off I-5, and Vladislav handles site visits and consultations there directly — no dispatcher, no sales rep. A first walk-through and rough scope usually happens within a week of the call. Once permits clear the City of Centralia Building Division, a DADU typically takes 3-4 months to build; a basement conversion runs 5-7 weeks. Call (206) 591-1096 to get a visit scheduled."
  - q: "What does a detached ADU cost in Centralia?"
    a: "Most detached ADU builds here land between $110K and $180K depending on foundation type, distance to existing water and sewer lines, and finish level — GE or Whirlpool appliances and vinyl plank flooring keep costs down versus higher-end finishes. Basement conversions run $55K-$90K instead. Pricing depends heavily on whether the lot is on municipal sewer or septic, and how far utilities have to run. TopVolk Construction provides a free on-site estimate with exact line-item pricing, not a phone-quoted range — call (206) 591-1096 to set one up."
  - q: "Do I need a permit from the City of Centralia or Lewis County for an ADU?"
    a: "It depends on the address: inside city limits, permits go through the City of Centralia Building Division; outside the line, it's Lewis County Community Development instead, and the setback and lot-coverage rules aren't identical between the two. Plan review generally takes 6-10 weeks once a complete application is submitted. TopVolk Construction, a WA Licensed Contractor, prepares the site plan, structural drawings, and utility plan and handles the submission directly with whichever office has jurisdiction over the parcel."
  - q: "Can a Centralia ADU have a full kitchen, or does it need to stay a kitchenette?"
    a: "Under current WA rules a detached or attached ADU can have a full kitchen — range, refrigerator, sink, cabinets — there's no kitchenette-only restriction left in the state code. Most Centralia builds get a GE or Frigidaire range and a Whirlpool fridge to keep appliance costs reasonable, with a Mitsubishi mini-split handling heating and cooling since running new ductwork off the main house isn't practical for a detached unit. Basement conversions sometimes reuse an existing furnace zone if the ductwork routes cleanly."
  - q: "What warranty do you offer on a new ADU build in Centralia's climate?"
    a: "Workmanship is covered for one year after final inspection, and manufacturer warranties on siding, roofing, and appliances pass through separately — Hardie siding typically carries a 30-year product warranty, which matters here given how much rain the region sees. Foundation and structural work is built to current IRC standards for frost depth and drainage, which matters on the freeze-thaw edges of Lewis County. The contract also includes a penalty clause if we miss the agreed completion date, which isn't standard with most local contractors."
  - q: "Do you build ADUs outside Centralia, in Chehalis or Winlock?"
    a: "Yes — TopVolk Construction covers Centralia, Chehalis, Napavine, Winlock, and the rest of Lewis County, plus King, Snohomish, and Pierce counties further north. Scheduling for a first consultation usually opens up within a week, and site visits get booked around existing project timelines since Vladislav runs estimates and builds personally rather than through a sales team. Call (206) 591-1096 or ask about a free consultation to get on the schedule."