title: "Centralia Bathroom Remodel — Waterproofing Old PNW Homes"

intro: |
  The bathroom walls in a lot of Centralia's older homes along Harrison Avenue and near
  Fort Borst Park tell the same story once you open them up — sand-mortar tile beds from
  the 1950s, galvanized drain lines that barely flow, and zero waterproofing membrane
  behind the tub surround. Lewis County pulls close to 50 inches of rain per year, and
  that persistent humidity finds every gap in an older bathroom envelope. A surface that
  looked fine to the previous owner can hide three inches of black mold and a rotted
  subfloor once you pull the first tile. One house near Fort Borst Park we walked through
  had a Kohler cast-iron tub sitting directly on a deteriorated subfloor — visible only
  after pulling up vinyl sheet flooring that had masked the damage for years. Centralia's
  housing stock runs the full spectrum: pre-war Craftsman bungalows in the 98531 core,
  1960s ranch homes at the edges of town, and 1980s tract builds now hitting 40 years
  old. Each era has a different bathroom failure mode, but all of them share the same PNW
  moisture problem.

localContext: |
  The 98531 zip code covers most of Centralia's established residential neighborhoods,
  including older blocks between Harrison Avenue and Eckerson Road where post-and-pier
  foundations and original plumbing are still common. Out toward the 98532 boundary near
  Chehalis, you find more mid-century ranchers — 1960s and 1970s builds with galvanized
  supply lines corroding from the inside out. These homes typically have 5x8 bathrooms,
  one tub-shower combo, a single undersized vanity, and a 50 CFM exhaust fan that cannot
  keep pace with Lewis County's seven-month rainy season. Poor ventilation in PNW
  bathrooms is not a cosmetic issue — without upgrading to at least 110 CFM with a
  humidity sensor, fresh tile and grout will start showing mold regrowth at the ceiling
  within two to three years. The City of Centralia building department handles residential
  permits for in-town projects, and a rough-in inspection is required any time plumbing
  or electrical gets touched. For homes in unincorporated Lewis County just outside city
  limits, permitting routes through the Lewis County permit center with a similar review
  timeline.

commonProblems:
  - title: "Forty-Year-Old Builder Fixtures Starting to Fail"
    description: |
      Centralia's 1980s and early 1990s tract homes — particularly east of Interstate 5
      — have original builder-grade fixtures hitting the end of their service life. Toilet
      flanges corrode through, single-handle faucets develop chronic drips, and fiberglass
      tub inserts from that era crack at the flange-to-drywall joint where flex stress
      concentrates over decades. A typical scope for this housing era: remove the failed
      tub insert, install cement board substrate, apply Schluter Kerdi waterproofing
      membrane on all wet walls, set large-format porcelain tile, and replace the vanity
      with a 36-inch freestanding unit and a Moen or Kohler single-handle faucet. Full
      5x8 bathroom rebuild in this tier lands between $12,000 and $20,000 depending on
      tile selection and whether drain lines need rerouting. Timeline from demo to blue
      tape walkthrough runs 3 to 4 weeks when permits are pulled in advance. Vladislav
      reviews the scope directly with homeowners before a single thing gets torn out — no
      project manager relaying phone messages.

  - title: "PNW Moisture Damage Behind the Tile"
    description: |
      Centralia's wet season runs October through May — seven months of elevated ambient
      humidity. Fiberglass tub surrounds installed in the 1980s and 1990s flex over time,
      opening gaps at corners and along caulk joints where the surround meets the tub
      deck. Water infiltrates, saturates the greenboard drywall behind it — standard
      substrate through the early 2000s — and damage spreads silently for years. By the
      time homeowners notice, tile is popping off the wall, grout has turned black, and
      there are soft spots at the tub ledge. Typically, 12 to 24 square feet of wet
      drywall and subfloor rot at the deck edge need to come out. The fix starts with full
      demo, antimicrobial primer on any affected framing, replacement of greenboard with
      cement board or Schluter Kerdi-Board, and RedGard liquid waterproofing membrane
      applied at all seams, corners, and transitions before tile goes up. Skip the
      membrane and the same problem returns in under a decade. No shortcuts in the wet
      area substrate — that is exactly where remodels fail.

  - title: "Cast-Iron Drain Stack Rerouting in Pre-War Centralia Homes"
    description: |
      Craftsman bungalows in Centralia's historic core — homes built between 1910 and the
      late 1940s — often still have original 3- or 4-inch cast-iron drain stacks in
      service. Moving a toilet even 18 inches in one of these bathrooms means rerouting
      that stack, which in a post-and-pier foundation requires working in a crawlspace
      with 18 to 30 inches of clearance. Drain rerouting requires proper slope — minimum
      1/4 inch per foot per IRC requirements — and a City of Centralia rough-in inspection
      before walls close. TopVolk is a WA Licensed Contractor and coordinates licensed
      plumbing subs directly; Vladislav stays on-site during rough-in so the inspection
      passes clean the first time. Drain rerouting adds $2,500 to $4,500 to a typical
      remodel budget depending on run length, access difficulty, and whether the existing
      cast-iron stack needs full replacement or just extension. Full master bath
      reconfiguration in a pre-war Centralia home, including drain work, typically runs
      5 to 7 weeks start to final inspection.

  - title: "Realistic Bathroom Remodel Costs for Centralia Homeowners"
    description: |
      Centralia's median household income sits around $40,000, which means most
      homeowners here are working with real budget constraints. A solid, practical full
      bathroom remodel in the 98531 zip code breaks down roughly like this: demo and
      disposal ($800–$1,500), plumbing rough-in ($1,200–$3,000 depending on rerouting
      scope), cement board and Schluter Kerdi waterproofing ($700–$1,100), tile labor at
      $18–$28 per square foot installed, vanity and Moen or Kohler fixtures ($700–$2,500),
      and finish work including paint, trim, and accessories. A complete 5x8 bathroom
      remodel lands around $12,000 to $20,000. A master bath with a curbless walk-in
      shower, large-format porcelain, and a double vanity runs $24,000 to $38,000.
      TopVolk provides line-item quotes after an on-site visit — not a vague ballpark over
      the phone. A deadline penalty is written into every contract: miss the agreed
      completion date and you do not pay for that day's labor. That commitment is in
      writing, not a sales pitch.

  - title: "Ventilation Upgrades — The Fix Most Bathroom Remodels Miss"
    description: |
      A standard 50 CFM exhaust fan does not move enough air to manage moisture in a Lewis
      County bathroom. At 50% or higher outdoor relative humidity for seven months of the
      year, the original builder fan is close to decorative. Mold regrowth at ceiling
      drywall seams and inside walk-in shower niches is almost always a ventilation failure
      before it is a cleaning failure. The right fix: pull the existing unit, upsize the
      exhaust duct from 3-inch to 4-inch insulated flex, install a Panasonic WhisperCeiling
      or Broan-NuTone unit rated for 110 to 130 CFM with an integrated humidity sensor, and
      confirm the duct terminates at a proper exterior soffit cap — not into the attic, which
      is a code violation and a moisture problem in its own right. This upgrade costs $400
      to $800 installed and extends the service life of tile grout, caulk joints, and drywall
      by years. Every bathroom remodel TopVolk completes in Centralia includes this upgrade
      or a documented homeowner refusal. It is that consequential in this climate.

faq:
  - q: "How far out does TopVolk travel for bathroom remodels in Centralia?"
    a: |
      Centralia sits about 85 miles south of Seattle on I-5 — roughly 90 minutes
      depending on traffic through Tacoma and Olympia. TopVolk serves the full Lewis
      County corridor for bathroom remodel projects in the $12,000-and-up range, and
      Vladislav schedules on-site consultations directly. With 100+ projects completed
      across the Seattle Metro since 2023, the south Sound corridor is well-traveled
      territory. Expect 3 to 7 business days to get an on-site visit on the calendar,
      then 2 to 4 weeks from signed contract to project start to allow time for permit
      pull and material lead time. Call (206) 591-1096 to get scheduled.

  - q: "What does a full bathroom remodel cost in Centralia, WA?"
    a: |
      A complete 5x8 bathroom remodel — demo, cement board, Schluter Kerdi waterproofing,
      tile, new vanity, and Moen or Kohler fixtures — typically runs $12,000 to $20,000 in
      the Centralia market. A master bath with a curbless walk-in shower, large-format
      porcelain, and a double vanity lands between $24,000 and $38,000. Plumbing rerouting
      on pre-war homes can add $2,500 to $4,500 on top of base scope. TopVolk provides a
      free on-site estimate with a full line-item quote after seeing the space — not a
      range pulled from thin air over the phone. Call (206) 591-1096 to schedule a
      no-cost consultation.

  - q: "Does TopVolk handle the permit process with the City of Centralia building department?"
    a: |
      Yes. Any bathroom remodel that touches plumbing, electrical, or structural elements
      requires a permit through the City of Centralia building department for in-city
      projects. TopVolk pulls the permit as the WA Licensed Contractor of record,
      coordinates the rough-in inspection after plumbing and electrical are roughed in but
      before walls close, and schedules the final inspection after the punch list is
      complete. Plan on 2 to 3 weeks for permit review on a standard bathroom scope. For
      homes in unincorporated Lewis County outside city limits, the permit routes through
      the Lewis County permit center with a similar timeline — different counter, same
      process.

  - q: "Can you convert a standard tub to a curbless walk-in shower?"
    a: |
      Yes, and it is one of the most common requests in Centralia — particularly from
      homeowners planning to age in place. A curbless shower conversion requires rerouting
      the existing drain to a linear drain or center-point drain flush with the finished
      floor, building a properly sloped mud bed or using a Schluter Kerdi-Shower tray,
      and waterproofing the full wet area with RedGard or Kerdi membrane before any tile
      goes up. The opening needs to be at least 36 inches wide to meet IRC accessibility
      guidance. Grab bars get blocked into the framing during rough-in — not surface-mounted
      after the tile is set. Total cost for a tub-to-curbless-shower conversion runs
      $7,500 to $14,000 depending on tile complexity and drain rerouting requirements.

  - q: "What warranty does TopVolk provide on bathroom remodel work?"
    a: |
      All labor carries a three-year workmanship warranty — tile installation, waterproofing
      membrane application, plumbing connections, drywall hang and mud, and finish work.
      Manufacturer warranties on fixtures pass through directly: Kohler and Moen both carry
      limited lifetime warranties on their faucets; Schluter Kerdi membrane has its own
      manufacturer coverage when installed per spec. The most meaningful warranty protection
      comes from getting the waterproofing right during installation. Before tile goes up,
      the wet area substrate and membrane application get a photo-documented review. That
      documentation protects you if there is ever a warranty question two or three years
      down the road — and it keeps everyone honest during the build.

  - q: "Do you work in Chehalis and other Lewis County areas near Centralia?"
    a: |
      Yes. Centralia and Chehalis are a regular service corridor for TopVolk — the two
      cities are essentially adjacent, and projects in both fall under the same scheduling
      window. For bathroom remodel projects in Napavine, Winlock, or Pe Ell, scope and
