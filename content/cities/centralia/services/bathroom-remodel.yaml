      and the Lewis County line is a regular run for projects in the $12,000-and-up range.
      Typical scheduling lead time in Centralia and Chehalis is 2 to 4 weeks for an
      on-site consultation depending on current project load. Call (206) 591-1096 to check
      availability and book a free estimate.