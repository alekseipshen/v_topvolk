title: "Centralia HVAC — Heat Pump, Furnace & Mini-Split Service"

answer: "Local HVAC techs repair and install heat pumps, mini-splits, and furnaces in Centralia, Washington — same-week scheduling and on-site quotes within 24 hours."

intro: |
  Furnace trouble in Centralia usually shows up the same way: a 20-year-old Kenmore or GE unit short-cycling and blowing lukewarm air on a 28-degree January morning, right when fog off the Chehalis River settles into the valley. Local HVAC work here covers heat pump conversions, ductless mini-split installs, furnace swaps, and duct sealing on homes from Fords Prairie to the streets around Fort Borst Park. A lot of the housing stock dates back to the timber and coal era — small forced-air systems retrofitted decades ago, ductwork that was never sized right, and electrical panels that top out at 100 amps. That matters when a homeowner near downtown Centralia wants a Mitsubishi ductless mini-split for a garage conversion or an Amana heat pump to replace an aging propane furnace. Summers have gotten hotter too — the 2021 heat dome pushed valley temps past 100 — so AC addition requests on existing forced-air systems have picked up fast, right alongside calls to swap out old Samsung and Frigidaire window units for something that actually keeps up on the next 95-degree stretch.

localContext: |
  Centralia's housing runs from early-1900s mill worker cottages near downtown (98531) to 1970s ranch homes and manufactured housing out toward Grand Mound and Bucoda along the 98531/98532 corridor. A good share of the older homes still run galvanized ductwork and undersized returns, which means a hot upstairs bedroom and a cold living room even after a brand-new furnace goes in — the duct sizing, not the equipment, is usually the real problem. Lewis County doesn't run a dedicated energy code office the way Seattle SDCI does; HVAC permits here go through Lewis County Community Development for unincorporated areas, or the City of Centralia building department inside city limits, and a gas-to-electric heat pump conversion often needs an electrical permit too if the panel needs upgrading past 100 amps. Flood risk along the Chehalis River means outdoor heat pump condensers on lower-lying lots near Mellen Street usually get set on elevated pads. Manufactured and mobile homes, common at this income level, need HVAC equipment rated for mobile home duct systems — not every mini-split or furnace on the shelf is approved for that install.

commonProblems:
  - title: "Old Ductwork Choking Airflow in Mill-Era Homes"
    description: "A lot of the cottages near downtown Centralia still run original sheet-metal trunk line from the 1950s, with a return plenum sized for half the house. Drop a new 80,000 BTU Amana furnace onto that old ductwork and rooms still run hot and cold — the equipment isn't the bottleneck, the duct sizing is. The fix is duct sealing with mastic (not just tape) at the plenum and takeoffs, plus adding a return in the back bedrooms and a manual damper to balance airflow room by room. On a typical 1,400 sq ft home this runs $1,200-$3,000 depending on how much duct needs replacing versus resealing. Homeowners usually notice the difference by the first hard cold snap."
  - title: "Heat Pump Conversions Stalled by a 100-Amp Panel"
    description: "Swapping a propane or oil furnace for an Amana or Mitsubishi heat pump sounds simple until the electrician checks the panel and finds 100 amps with no room for a 30-amp heat pump circuit. That's common in the ranch homes off Kresky Avenue and the older stock near Fords Prairie, built before central air was standard. The fix usually means a panel upgrade to 150 or 200-amp service before the outdoor condenser and air handler go in — budget another $2,500-$4,000 on top of the $9,000-$16,000 heat pump conversion itself. Inflation Reduction Act rebates can offset $2,000-$8,000 of that depending on household income, which matters in a county where the median sits near $40,625. An electrician has to sign off before the mechanical permit closes."
  - title: "Permits and Inspections for Furnace and Heat Pump Swaps"
    description: "Lewis County requires a mechanical permit for furnace replacement, heat pump installs, and ductless mini-split systems outside city limits, while homes inside Centralia proper go through the city building department alongside county mechanical review. A 95%+ AFUE furnace needs Category IV venting run in PVC to an exterior wall or roof — old masonry chimney venting doesn't work with high-efficiency units, and inspectors flag it every time. Expect plan review and a rough-in inspection before drywall or siding closes around the vent line, then a final inspection once the unit is running and tested. We're a WA Licensed HVAC Contractor and pull the permit as part of the quote, so homeowners aren't filing paperwork themselves. A straightforward furnace permit usually clears in 5-10 business days."
  - title: "What Actually Drives the Price on a Mini-Split or Furnace Job"
    description: "A single-zone Mitsubishi or Daikin ductless mini-split runs $4,500-$8,500 installed, and the price swings mostly on line-set length, whether the electrical circuit already exists, and how far the condenser sits from the indoor air handler. Furnace replacement with a mid-efficiency Amana or Frigidaire unit lands closer to $5,500-$9,000, while a 95%+ AFUE unit with new venting pushes toward the top of that range. Ductless systems tend to hold value better in older homes without existing ductwork, since there's no duct sealing or plenum rework to add on. Most installs carry a 10-year parts warranty and a 1-year labor warranty, and every quote is line-item — condenser, air handler, line set, electrical, permit — not one vague number."
  - title: "Maintenance, Lifespan, and When to Replace Instead of Repair"
    description: "A well-maintained furnace or heat pump in this climate runs 12-18 years; the compressor and evaporator coil are usually what fail first, especially on units that never got an annual refrigerant check or filter change. If a 15-year-old GE or Whirlpool-branded system needs a new compressor, that repair often runs 40-50% of a full replacement — the point where replacing makes more sense than fixing. Ductless mini-splits from Mitsubishi or Daikin tend to outlast ducted systems since there's no conditioned air leaking into a crawlspace or attic through old duct joints. A basic annual tune-up — coil cleaning, condensate line check, refrigerant charge — runs $150-$250 and catches most problems before a mid-winter breakdown. Adding a Nest or ecobee thermostat during a furnace swap also cuts down on short-cycling that wears parts out early."

faq:
  - q: "How fast can you get to Centralia for HVAC work?"
    a: "Centralia sits right off I-5 at exit 82, about 25 minutes from Chehalis and 45 minutes from Olympia, so most service calls and installs get scheduled within 2-3 business days. Parking and equipment staging is usually easy on residential lots here, even with the narrower older driveways near downtown. Furnace and heat pump installs typically take 1-2 days on-site once permits clear; a single-zone mini-split often finishes in a day. Schedule a free on-site estimate this week to get a firm install date."
  - q: "What does a heat pump conversion cost in Centralia?"
    a: "A full heat pump conversion — outdoor condenser, indoor air handler, line set, and controls — runs $9,000-$16,000 installed, with panel upgrades adding $2,500-$4,000 more if the home is still on 100-amp service. Pricing depends mostly on ductwork condition, panel capacity, and whether the old propane or oil equipment needs removal. Inflation Reduction Act rebates can knock $2,000-$8,000 off depending on income. Ask for a free on-site estimate with exact line-item pricing before signing anything — no vague ranges."
  - q: "Do I need a permit for a furnace or heat pump swap in Centralia?"
    a: "Yes — inside city limits it goes through Centralia's building department, and unincorporated Lewis County addresses go through Lewis County Community Development for mechanical permits. A gas-to-electric conversion often needs an electrical permit too if the panel is upgraded. Straightforward furnace permits typically clear in 5-10 business days; heat pump conversions with panel work can run closer to 2-3 weeks. As a WA Licensed HVAC Contractor, we pull the permit and schedule inspections as part of the job."
  - q: "Can a ductless mini-split actually handle a Centralia winter?"
    a: "Cold-climate rated units from Mitsubishi and Daikin are built for this — they hold full heating output down into the low 20s°F, which covers the coldest mornings the Chehalis Valley sees. Most installs still keep a backup source, whether that's the existing furnace or an electric heat strip, for the rare hard freeze. Sizing matters more than brand loyalty here; an oversized unit short-cycles and an undersized one runs constantly without keeping up. A proper manual J load calc during the free estimate settles that before equipment gets ordered."
  - q: "What's the warranty on a new furnace or heat pump?"
    a: "Most Amana, Frigidaire, and Mitsubishi equipment installed here carries a 10-year parts warranty when registered within 60 days, plus a 1-year labor warranty on the install itself. Expected lifespan runs 12-18 years with annual maintenance — humidity and duct leakage in older Centralia homes are what typically shorten that. Compressor and coil failures are the most common warranty claims; refrigerant lines and electrical connections aren't usually covered if a homeowner alters them after install. Ask for the manufacturer warranty paperwork at closeout, not just a verbal promise."
  - q: "Do you cover areas outside Centralia too?"
    a: "Yes — Chehalis, Napavine, Winlock, Toledo, and Grand Mound are all a short drive down I-5 and get the same scheduling window as Centralia itself. Most weeks have openings within 2-3 business days for estimates, with installs booked out roughly 1-2 weeks depending on equipment lead time. Emergency furnace repair in freezing weather gets bumped ahead of standard scheduling. Call to check this week's availability and get a free on-site quote."