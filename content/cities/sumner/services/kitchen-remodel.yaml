title: "Sumner Kitchen Remodel — Open Layouts for 98390 Ranchers"

intro: |
  Behind the rhubarb fields and along Ryan Avenue, most of the homes in 98390
  were built between 1958 and 1982 — ranch-style layouts with closed galley
  kitchens that weren't designed for the way families use them now. A 30-inch
  Whirlpool, maybe 15 feet of counter space, and a wall cutting off the living
  room. TopVolk Construction LLC, WA Licensed Contractor and 100+ projects
  completed since 2023, handles the full remodel: structural demo, LVL beam
  installation, cabinets, countertops, electrical — permitted through Pierce
  County PALS start to finish.

localContext: |
  The residential blocks off Main Street and near Loyalty Park hold a lot of
  1965–1980 construction — single-story ranchers and modest split-levels that
  haven't seen a kitchen update in decades. In 98390, original 100A electrical
  panels are the norm, which creates problems when a homeowner wants to add an
  induction range or a KitchenAid dishwasher on a dedicated circuit. Crawlspace
  foundations are common here too, and vapor barriers in those spaces matter
  more than most contractors mention — Seattle's rain shadow doesn't quite
  reach Sumner, and ground moisture shows up in subfloor rot under old kitchens.

commonProblems:
  - title: "Load-Bearing Wall Between Kitchen and Living Room"
    description: >
      In Sumner's postwar ranchers, the kitchen-to-living-room partition is
      structural more often than not. Removing it requires a site-specific
      engineering calculation, an LVL beam sized to the clear span, PSL posts
      at each bearing point, and Pierce County PALS approval on the structural
      drawings before any demo work starts. Skipping the permit on this one
      creates title problems when you sell.
  - title: "100A Panels That Can't Feed a Modern Kitchen"
    description: >
      A 1970s Sumner kitchen was built around a 240V range circuit and not much
      else. Add a Bosch induction cooktop, an under-cabinet microwave, and LED
      dimmer circuits, and a 100A main panel hits its limit fast. Upgrading to a
      200A service is permit-required work in Pierce County — plan for it in the
      budget upfront, not as a change order mid-project.
  - title: "Cabinet Box Sizes That Don't Fit the Actual Wall"
    description: >
      IKEA base cabinets come in fixed increments. Sumner ranchers built in the
      1960s and 70s have walls that are rarely plumb or square after five
      decades of settling. Standard 36-inch box runs leave gaps that require
      filler strips — which look fine on the showroom floor and less fine after
      two years in your kitchen. Semi-custom cabinets built to field dimensions
      solve this; they cost more than IKEA and less than full custom.

faq:
  - q: "How fast can you get to Sumner for Kitchen Remodel?"
    a: >
      Sumner is roughly 35 minutes from our usual work corridor. Vladislav
      does the consultation in person — measures the space, identifies structural
      and electrical constraints, and delivers a line-item quote. Call
      (206) 591-1096 to schedule. No middlemen, no commissioned closer.
  - q: "Do you work with KitchenAid, Bosch, and Samsung appliances in remodels?"
    a: >
      Yes — KitchenAid, Bosch, and Samsung are the brands we see most in
      Sumner kitchens at this price point. We confirm rough-in locations,
      dedicated circuit specs, and cabinet cutout dimensions before anything
      ships. Appliance fitment errors cost real money; we coordinate that
      before demo starts, not after delivery.
  - q: "How long does a kitchen remodel take in Sumner, and is a permit required?"
    a: >
      Full kitchen remodel — cabinets, countertops, electrical, and wall
      removal — runs 6–10 weeks of construction once permits clear. Pierce
      County PALS plan review adds 3–5 weeks depending on scope. Any
      structural or electrical work is permit-required. Deadlines are written
      into the contract with penalties — if we miss the schedule, you're
      compensated. Call (206) 591-1096 or schedule a free on-site consultation.