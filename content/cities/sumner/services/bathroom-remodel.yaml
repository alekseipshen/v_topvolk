title: "Sumner Bathroom Remodel — Tract Tile, Moisture & Permits Done Right"

intro: |
  The Puyallup River corridor runs right alongside Sumner's older Main Street
  blocks, and a wave of 1980s-90s tract subdivisions fans out from there across
  most of 98390. Those builder-era bathrooms — 4×4 ceramic tile, greenboard
  backer, Moen chrome fixtures dripping for a decade — are exactly what we gut
  and rebuild. TopVolk Construction has completed 100+ projects across Pierce and
  King counties since 2017, including full master bath reconfigurations in
  communities throughout East Pierce County.

localContext: |
  Sumner's housing stock spans two distinct eras. Downtown-adjacent streets hold
  1920s-1940s craftsman-style homes with cast-iron drain stacks and galvanized
  supply lines corroding from the inside out — bathrooms untouched since the
  original owners. Head east into 98391 toward the Lake Tapps area and you're
  in 1990s-2000s builder construction: better bones, but equally dated finishes.
  Builder-grade Kohler vanities, fiberglass tub surrounds, and exhaust fans
  venting directly into attic space are standard finds.

commonProblems:
  - title: "Waterproofing Failures Behind Tract-Era Tile"
    description: "Most 1980s-90s Sumner bathrooms used greenboard drywall as
      shower backer — a material that absorbs moisture rather than blocks it.
      Once grout cracks, water migrates behind tile and into framing. We strip
      to studs, install Schluter Kerdi membrane or RedGard liquid waterproofing,
      then set large-format porcelain over a proper substrate. This is not a
      surface fix — it's a rebuild."
  - title: "Cast-Iron Drain Stacks in Craftsman-Era Homes Near Downtown"
    description: "Homes on Sumner's older streets often have original cast-iron
      drain stacks from the 1920s-40s. Interior corrosion narrows pipe diameter
      and causes slow drains that no amount of snaking resolves. A master bath
      reconfiguration in these houses requires rerouting the drain to PVC — which
      means a Pierce County PALS permit, a rough-in inspection, and coordinating
      before any tile is set."
  - title: "Exhaust Fans That Recirculate Rather Than Vent"
    description: "Pierce County averages 38+ inches of rain annually. A
      surprising number of exhaust fans in 98390 homes terminate in the attic
      or a soffit cavity — pushing humid air into the framing instead of out.
      We run properly sized duct, typically 4-inch or 6-inch, directly to an
      exterior penetration, matched to the fan's CFM rating for the actual
      square footage of the bathroom."

faq:
  - q: "How fast can you get to Sumner for Bathroom Remodel?"
    a: "Sumner is about 35 miles from Seattle — SR-167 south to SR-512, roughly
      45-60 minutes depending on traffic. We schedule on-site consultations
      across Pierce County regularly. Call (206) 591-1096 and Vladislav comes
      out to walk the space and price it in person, not over email."
  - q: "What fixture and tile brands do you typically spec in these remodels?"
    a: "Common specs: Kohler or Moen plumbing fixtures, TOTO or American Standard
      toilets, Schluter edge trim and waterproofing, and large-format porcelain
      from local suppliers. Mid-range finishes hold up better against Pierce
      County humidity than builder-grade chrome. Every line item goes on the
      quote — no vague 'allowances.'"
  - q: "How does the permit process work for a Sumner bathroom remodel?"
    a: "Sumner falls under Pierce County PALS for permit review. Any work touching
      plumbing relocation or electrical changes typically requires a building
      permit — plan review runs 3-6 weeks. We handle the application. Full master
      bath remodel timeline: 4-6 weeks once permits clear, longer if the drain
      stack needs rerouting. Deadline commitments are written into the contract
      with penalties if we miss them. WA Licensed Contractor."