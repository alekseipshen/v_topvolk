title: "Sumner ADU Construction — Backyard Cottages Built to Code"

answer: "TopVolk Construction designs and builds permitted DADUs, AADUs, and basement conversion ADUs in Sumner, WA — plans to final inspection in 4-7 months."

intro: |
  TopVolk Construction builds permitted detached ADUs (DADUs), attached ADUs (AADUs), and basement conversions for homeowners in Sumner, with Vladislav Volkov handling design coordination, permit submittal, and framing through final inspection directly — no project managers relaying messages. TopVolk has completed 100+ projects across Pierce and King County since 2017. Sumner's small in-town lots near downtown and the larger parcels out toward Sumner Meadows produce two very different ADU conversations: a 700-square-foot DADU behind a Craftsman near Loyalty Park has to work around a tight setback and an existing garage, while a rancher off East Valley Highway usually has enough side yard for a full detached unit with its own driveway. WA HB 1337, passed in 2024, lets most Sumner homeowners build up to two ADUs per lot — a DADU plus a basement conversion, for example — which changes the math on a rental unit or in-law suite fast. One recent Sumner client wanted a full kitchen with a Bosch induction range and a stackable washer/dryer in 380 square feet; that's a real layout problem, not a Pinterest board. Call (206) 591-1096 for a free on-site walkthrough.

localContext: |
  Most of Sumner splits between 98390 and 98352, and the building stock tracks the city's growth rings pretty clearly. Downtown and the blocks around Sumner Meadows still have Craftsman and post-war bungalows from the 1920s-40s sitting on post-and-pier foundations with galvanized plumbing that hasn't been touched since Eisenhower — a basement conversion ADU here usually means new copper or PEX runs and a sump pump before drywall goes up. Out toward Daffodil Valley and the newer plats near the Bonney Lake edge, you're looking at 1990s-2010s stick-frame homes on slab or standard crawlspace, which simplifies utility tie-ins for a DADU considerably. Sumner sits low in the White River valley, so several neighborhoods carry FEMA floodplain overlay — that affects finished floor elevation and foundation type on any detached unit, and it's something the City of Sumner Community Development Department checks during plan review before anything gets recorded. Permits here run through the city, not Pierce County PALS, since Sumner is incorporated. Add the usual Western Washington rain — 40+ inches a year — and you need real drainage detailing around any new foundation, not just a French drain afterthought.

commonProblems:
  - title: "DADU, AADU, or Basement Conversion — Picking the Right Unit for a Sumner Lot"
    description: "A detached unit behind a Daffodil Valley rancher and a basement conversion under a downtown Craftsman solve completely different problems. DADUs need a new foundation, a ledger board tied into an LVL beam header if you're building over a garage, and full mechanical — usually a Mitsubishi mini-split for heat since running new ductwork from the main house isn't practical. Basement conversions skip the foundation work but almost always need R-49 insulation upgrades, a new egress window, and a sister joist or two where the old floor framing sags. Sumner clients renting long-term usually want the DADU for separation; family members living on-site often prefer the basement option because it's cheaper — $90K-$140K versus $180K-$260K for a detached unit with its own kitchen and bath."
  - title: "WA HB 1337 Lets You Stack Two ADUs, But Setbacks and the 24-Foot Height Limit Still Apply"
    description: "WA HB 1337 opened the door to two ADUs on most Sumner single-family lots — a DADU and a basement conversion, or an AADU and a detached unit — but the city still enforces its own setback and lot coverage rules on top of the state law. A 24-foot height limit applies to most detached units, and on the smaller in-town lots near 98390 that pushes the second-story loft option out and keeps the footprint single-story with a steeper roof pitch instead. FAR calculations and rear/side setbacks get checked during City of Sumner plan review, and a survey showing existing lot coverage is usually the first thing we pull before drawing anything. Skipping that step is how homeowners end up redesigning a floor plan mid-permit."
  - title: "Separate Water and Sewer Connections vs. Shared Lines"
    description: "Sumner's permit center wants a decision early on whether a new ADU gets its own water meter and sewer lateral or shares the main house's connection — shared lines are cheaper up front but cap how the unit can be sold or refinanced separately later. A shared connection means the plumber cuts in behind the water heater with new PEX runs and a backflow preventer; a separate connection means trenching to the street, a new meter, and coordinating with Sumner Public Works on timing, which usually adds three to five weeks to the schedule. Either way, MEP coordination happens before the rough-in inspection, not after — moving a joist hanger or blocking around a drain line after drywall is up costs more than getting the layout right the first time."
  - title: "Building in the White River Floodplain Overlay"
    description: "Parts of Sumner sit inside the White River floodplain overlay, and that changes foundation design on any detached ADU before framing starts. Instead of a standard slab, you're often looking at a raised foundation on PSL posts with the finished floor set above base flood elevation, plus a vented crawlspace with a proper vapor barrier over the ground to keep humidity out from under the framing. Pressure-treated (PT) lumber gets used for any framing member within 18 inches of grade, and the City of Sumner requires an elevation certificate before final inspection on any unit built in the overlay. It adds real cost — usually $8K-$15K over a standard slab — but skipping it means an insurance and resale headache later."
  - title: "What a Sumner ADU Actually Costs, and Why the Range Is So Wide"
    description: "Sumner ADU pricing runs $90K-$140K for a basement conversion and $180K-$260K+ for a detached unit with a full kitchen and bath, and the swing comes down to foundation type, utility separation, and finish level. Appliance packages move the number too — a mid-range kitchen with a GE or Whirlpool range and a Samsung fridge prices differently than one with a KitchenAid suite and a Bosch dishwasher, and both are common choices for Sumner's income range. Every TopVolk quote is line-item, not a ballpark range, and the contract carries a penalty clause if we miss the agreed completion date — that's written in, not a verbal promise. Call (206) 591-1096 and Vladislav will walk the lot and give you real numbers, not a phone estimate."

faq:
  - q: "How fast can you get to Sumner for Adu Construction?"
    a: "Sumner sits right off SR-410 and close to Highway 167, roughly 25-35 minutes out depending on Puyallup traffic, and we schedule the first on-site walkthrough within a few days of your call. Once the City of Sumner clears the permit, framing crews are usually on-site within a week or two of the notice to proceed. Access on most Sumner lots — whether downtown near Loyalty Park or out toward Daffodil Valley — is straightforward for standard equipment, no crane or special street-use permit needed on a typical single-family lot. Call (206) 591-1096 and Vladislav will get a walkthrough on the calendar, usually within the same week."
  - q: "What does an ADU cost in Sumner?"
    a: "A basement conversion ADU in Sumner typically runs $90K-$140K, and a detached DADU with its own kitchen and bath runs $180K-$260K or more depending on size and finish level. Foundation type drives a lot of the swing — a floodplain lot near the White River needs a raised foundation on PSL posts, which adds $8K-$15K over a standard slab. Utility separation (a new water meter and sewer lateral versus a shared connection) is another factor, along with appliance and cabinet selection. We give a free on-site estimate with exact line-item pricing, not a phone quote — call (206) 591-1096 to set it up."
  - q: "How do ADU permits work in Sumner, and who handles them?"
    a: "Sumner is an incorporated city, so ADU permits go through the City of Sumner Community Development Department, not Pierce County PALS — that trips up homeowners who assume the whole county uses the same office. Plan review for a detached ADU typically takes 6-10 weeks, and WA HB 1337 makes the two-ADU allowance clear on paper, but the city still checks setbacks, lot coverage, and — for floodplain parcels — an elevation certificate before issuing anything. We prepare the full submittal package: site plan, structural sheets for the LVL beam and foundation, and the energy code forms. TopVolk is a WA Licensed Contractor and handles the submittal directly with the city, no third-party expediter."
  - q: "Can I put a full kitchen in a Sumner ADU, and what about venting and waterproofing?"
    a: "Yes — Sumner follows the state building code, which allows a full kitchen in any legal ADU, detached or basement. Most clients choose a compact induction range from GE or Bosch to keep the electrical panel upgrade smaller, paired with a range hood sized for real CFM, not just the cheapest unit that fits the cabinet opening. Bathrooms usually get a curbless or curb shower with Schluter Kerdi waterproofing under large-format porcelain, since that holds up better than a standard pan in a small footprint. Heat comes from a single Mitsubishi mini-split head in most units under 600 square feet, which keeps mechanical costs down."
  - q: "What's the warranty on a Sumner ADU, and how long does it last in this climate?"
    a: "TopVolk backs workmanship on a Sumner ADU for one year after final inspection, and manufacturer warranties on big-ticket items — the Mitsubishi mini-split, Rinnai tankless water heater, Moen or Kohler fixtures — run separately, typically 5-12 years depending on the part. Western Washington's wet winters are hard on exterior details, so we detail flashing and use Hardie siding or cedar with proper rainscreen gaps rather than caulking the problem shut. A well-built DADU should last as long as the main house; the parts that fail first are usually sealants and gutters, not framing. We walk the punch list with you before calling the job done."
  - q: "Do you cover the area around Sumner, and how far out can I book?"
    a: "Along with Sumner, we cover Puyallup, Bonney Lake, Auburn, and the rest of Pierce and King County for ADU work, and scheduling usually opens up within one to two weeks for a first walkthrough. Design and permit prep run in parallel where the city allows it, so the 4-7 month timeline from first call to final inspection holds up even with the City of Sumner's review queue. Call (206) 591-1096 or ask for a free consultation — Vladislav handles the walkthrough and the quote personally, no sales rep involved, and the contract includes a penalty clause if we miss the completion date we agree on."