title: "Sumner WA Insulation — R-49 Attics, Crawl Space Fixes"

answer: "TopVolk upgrades attic, crawl space, and rim joist insulation in Sumner, WA — R-49 retrofits, vapor-barrier crawl spaces, owner-led since 2017."

intro: |
  A heat pump running nonstop through a January cold snap usually points to one culprit: sagging R-13 batts in a Sumner attic. Code wants R-49 up there now. Vladislav Volkov and the TopVolk crew see this constantly — in the older farmhouses near historic downtown Sumner, and in the ranch homes scattered toward the plateau bordering Bonney Lake. A crawl space under a house near Fryar Park with no vapor barrier at all is just as common. The White River sits close enough that ground moisture creeps upward all fall and winter. One recent job: lining a crawl space with 12-mil reinforced poly and rigid foam board, while a Mitsubishi mini-split went in upstairs to take load off the old furnace. Call (206) 591-1096 for a free on-site walkthrough before the next PSE bill comes in higher than expected.

localContext: |
  Housing in Sumner splits into two categories. Down near the historic core along Main Street (98390), a lot of the housing stock dates to the early 1900s. Farmhouses and Craftsman-style cottages, mostly, with original board sheathing and next to no attic insulation to speak of. Up toward the plateau bordering Bonney Lake (98391), subdivisions went up from the 1990s through the 2010s. They meet a newer energy code baseline. But gaps still show up around can lights, bath fans, and rim joists that never got air-sealed at framing. Pierce County sits close to the Puyallup and White River valleys, so crawl spaces here run damp from October through May. That's exactly when an uninsulated or poorly vapor-barriered crawl space starts growing mildew on the floor joists. Sumner's Building Division reviews permits for structural and electrical work. Standalone insulation — batts, blown-in, or crawl space vapor barrier — usually doesn't need one, unless it's tied into a larger remodel.

commonProblems:
  - title: "Attic R-13 to R-49: Craftsman Cottages Near Downtown Sumner"
    description: "Cottages built before 1930 near Main Street often have R-13 fiberglass batts, stuffed between 2x6 rafters decades ago. That's nowhere close to the R-49 the Washington State Energy Code now calls for on attic floors. Blown-in cellulose is usually the better fix here. It fills irregular framing bays and old knob-and-tube wiring runs better than a rigid batt. CertainTeed fiberglass batt still works fine in open attics with standard truss spacing, though. Baffles get installed at the eaves first, so soffit vents stay clear and the roof deck can still breathe. A straightforward attic top-up runs about $1.50-$2.50 per square foot. Most 1,200-1,800 square foot footprints get done in a day. Call (206) 591-1096 to get it scoped."
  - title: "Crawl Space Moisture Off the White River Bottomland"
    description: "Homes closer to the White River floodplain, especially in the older sections toward Elhi Hill, often sit on crawl spaces with bare dirt and no ground cover at all. Moisture wicks up through the soil every winter and condenses on the underside of the subfloor. That eventually rots the rim joist and invites mold across the floor joists. The fix is a full encapsulation: 12-mil reinforced vapor barrier lapped up the foundation walls, seams taped, and Owens Corning FOAMULAR rigid foam board on the perimeter to stop the cold transfer. A sealed crawl space on an average Sumner rancher runs $4,500-$9,000, depending on footprint and whether a sump pump gets added. This work often gets bundled into a larger remodel scope."
  - title: "Knee Wall Gaps in 1.5-Story Farmhouses"
    description: "Older 1.5-story farmhouses scattered around Sumner's historic district often have knee walls in the upstairs bedrooms. Behind that short wall — separating living space from the unconditioned attic triangle — there's often just a thin fiberglass batt, or nothing at all. Closed-cell spray foam, like Demilec Heatlok, is the better call here. It air-seals and insulates in one pass, along the studs and attic floor behind the knee wall, cutting drafts fiberglass batt alone can't stop. Standalone spray foam work doesn't trigger a City of Sumner building permit. But if the project also converts the attic to living space, with new electrical or egress, a permit through Sumner's Building Division is required before rough-in inspection. TopVolk coordinates that paperwork directly with Vladislav on-site."
  - title: "What Drives the Cost of an Insulation Upgrade Here"
    description: "Pricing swings on three things: attic accessibility, whether the crawl space needs full encapsulation or just a vapor barrier refresh, and how much old insulation has to come out first. A rancher near Ryan Park with a walkable attic and simple gable venting costs less than a farmhouse with a cut-up hip roof and multiple knee walls. Removing moisture-damaged fiberglass batt or rodent-contaminated blown-in adds $500-$1,500 before new material even goes in. PSE offers rebates on qualifying attic and floor insulation upgrades. That can knock a few hundred dollars off the invoice, and TopVolk handles the rebate paperwork. Every quote is a line-item number, with a penalty clause written into the contract if the completion date slips."
  - title: "Mineral Wool Between Floors — And When Insulation Actually Wears Out"
    description: "Insulation doesn't fail the way a roof or water heater does. But it compresses, settles, and gets pushed aside by attic storage or rodent activity over ten to fifteen years. That quietly drops an attic from R-49 back toward R-30 before anyone notices the heating bill creeping up. During interior remodels — turning a bonus room into a home office, for example — Rockwool mineral wool batt is the standard call between floor joists for sound control. It handles moisture better than fiberglass and doesn't sag over time. Crawl space vapor barrier typically lasts 20+ years, as long as it isn't punctured by later plumbing or pest work. TopVolk backs the installation, and material warranties from Owens Corning and CertainTeed carry on top of that."

