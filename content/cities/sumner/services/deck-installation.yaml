answer: "Deck installation in Sumner, WA: Seattle-area 2025 averages are about $20K for a 16x20 wood deck and about $29K in composite; a roof cover or pergola is priced on top. Building usually takes 1-3 weeks after the permit. Free on-site estimate: (206) 591-1096."

title: "Sumner Decks, Deck Covers and Pergolas: Permits and Cost"

intro: |
  Most deck projects in Sumner start with one question: will it need a city
  permit? For an attached deck the answer is yes regardless of size, and a
  covered deck needs one too. A freestanding pergola or arbor under 200
  square feet usually does not. That decides the schedule more than the
  choice of boards does.

  For the budget, Remodeling magazine's 2025 Cost vs. Value report prices a
  16 by 20 foot deck with railing and steps in the Seattle market at about
  $20,000 in pressure-treated wood and about $29,000 in composite. A roof
  over the deck, a taller structure or stairs down a slope add to that.
  These are averages, not a quote, so call for a written quote after a free
  on-site estimate. Building usually takes about one to three weeks on site
  once the permit is issued.

localContext: |
  Sumner issues its own building permits, and you apply and schedule
  inspections through the city's Self Service online portal. Electrical
  work, such as lights or a ceiling fan under a deck cover, is permitted
  and inspected by the Washington State Department of Labor & Industries.
  The city publishes no fixed review time, so the schedule is confirmed
  once the application is in.

  Sumner sits on the Puyallup River valley floor and uses FEMA's 2017 Flood
  Insurance Rate Map. Building in a mapped special flood hazard area
  requires a floodplain development permit, so check your address on FEMA's
  Flood Map Service Center before the design is drawn. State geologists
  note that low spots on the valley floor, especially old Puyallup and
  White river channels, are likely to have a shallow groundwater table,
  which matters for footing holes and for drainage under a low deck.

  The housing is older than in most nearby suburbs: Census estimates show
  about one in eight Sumner homes built before 1940 and about a quarter
  before 1960. On those houses the rim board where a new deck attaches is
  opened and checked before a ledger goes on.

commonProblems:
  - title: "Deck covers: the permit and the lot coverage limit"
    description: |
      Sumner lists covered decks among the projects that need a deck
      permit. A deck cover also counts against lot coverage: the combined
      footprint of the house, other structures, covered areas and decks 36
      inches or more above the ground cannot exceed a set percentage of the
      lot, and that percentage depends on the zone. On a smaller lot with a
      garage or shed already in place, the cover may need to be sized to
      fit that limit. The city's permit center can tell you your zone and
      the number before the design is final.
  - title: "Pergola or roof: which one you are building"
    description: |
      An open pergola and a solid roof are different projects under
      Sumner's rules. The city says arbors and other open-framed landscape
      structures that do not exceed 200 square feet usually do not need a
      permit, while a covered deck does. If the pergola sits on a deck that
      needs a permit, ask the city whether it goes on the same application.
      If you want
      shade now and rain cover later, say so at the estimate, because posts
      and footings sized for a roof are cheaper to build once than to
      replace.
  - title: "Attaching to an older house"
    description: |
      Sumner requires a permit for any deck attached to the house,
      whatever its size. On an older home the ledger is fastened to framing
      that may have been wet for decades, so the siding at the ledger line
      comes off, the rim board is checked for rot, and flashing goes in
      before the ledger is bolted on. In a house built before 1978, removing
      painted siding or trim must be done by a firm certified under
      Washington's lead-safe Renovation, Repair and Painting program.
  - title: "Wet valley soil under the footings"
    description: |
      Where the groundwater table is shallow, footing holes can fill with
      water and soft soil needs a larger footing to carry the same post. The
      deck frame stays off the ground with airflow underneath, posts sit on
      concrete rather than in soil, and grading moves water away from the
      house. If the lot is in a mapped flood hazard area, the floodplain
      permit is part of the same application.

faq:
  - q: "Do I need a permit for a deck cover in Sumner?"
    a: |
      Yes. Sumner lists covered decks among the projects that need a deck
      permit, and the covered area counts toward the lot coverage limit for
      your zone. Wiring for lights or a fan under the cover needs a separate
      electrical permit from Labor & Industries.
  - q: "Does a pergola need a permit in Sumner?"
    a: |
      A freestanding arbor or open-framed structure of 200 square feet or
      less usually does not, according to the city. A pergola with a solid
      roof, one larger than 200 square feet, or one built on a deck that
      needs a permit is a different case, so check with the city permit
      center before you order materials.
  - q: "How much does a deck cost in Sumner?"
    a: |
      The 2025 Cost vs. Value report puts a 16 by 20 foot deck in the
      Seattle market at about $20,000 in wood and about $29,000 in
      composite. A cover, extra height or long stairs raise it. Call for a
      written quote after a free on-site estimate; 0% financing for 24
      months is available, subject to credit approval.
  - q: "Who builds it and who do I talk to?"
    a: |
      Call (206) 591-1096 and you reach Vladislav Volkov, the owner of
      TopVolk, a licensed and insured Washington general contractor. The
      contract includes a written warranty and $100 for every day past the
      agreed deadline. Any electrical work under the cover is done by a
      licensed electrical subcontractor.
