title: "Sumner Deck Installation — Built for White River Valley Weather"

intro: |
  Homes along Ryan Avenue and near Sumner's historic downtown sit on lots where a deck
  doubles usable outdoor space — but only when it's built to last. The White River valley
  pulls rain from October through May, which means untreated cedar starts cupping and going
  green by year three. Most homeowners in 98390 end up on Trex or TimberTech composite for
  that reason, but the framing underneath determines whether it holds up for decades or starts
  pulling away from the house.

localContext: |
  Sumner's housing runs from 1940s-50s bungalows near Main Street to 1980s-90s tract homes
  east along Traffic Avenue toward the commercial corridor. Older homes in the 98390 core
  sometimes have rim joists showing decay at the ledger attachment point — usually from a
  previous deck installed without flashing. Newer construction east of downtown typically
  uses engineered LVL rim joists that make ledger attachment cleaner. Either way, the permit
  goes through the City of Sumner's own building department, not Pierce County PALS.

commonProblems:
  - title: "Ledger Rot from Missing Flashing on Pre-1995 Sumner Homes"
    description: "Older homes often had ledger boards bolted directly to the rim joist with
      no weather barrier behind them. Water wicks in, sits against the framing, and by the
      time the deck wobbles, the rim joist needs to be sistered or replaced entirely. We strip
      back siding at the ledger zone, install continuous Vycor flashing, then attach the new
      ledger board with structural LedgerLOK screws — before any decking goes down."
  - title: "Shallow Post Footings That Shift With Saturated Soil"
    description: "Sumner's wet winters saturate ground and create seasonal movement that
      shallow footings can't handle. City of Sumner building code requires footings to reach
      frost-free depth — 12-18 inches minimum here. Ground-contact PT lumber rated UC4B goes
      in wherever posts contact soil. Cutting corners on footing depth means the deck shifts
      annually and the ledger connection loosens over time."
  - title: "Guardrail Height and Stair Stringer Compliance at Final Inspection"
    description: "IRC requires 36-inch guardrails on any deck surface over 30 inches off
      grade. Stair handrails also have to be graspable — a flat 2x4 top rail fails final
      inspection in Sumner. Stair stringers need to stay within the allowable rise/run range
      (7-3/4-inch max rise, 10-inch min run). The city inspector checks all three points at
      final; a failure means a re-inspection fee and a scheduling delay that can push your
      project out by weeks."

faq:
  - q: "How fast can you get to Sumner for a deck consultation?"
    a: "Sumner is 35-40 minutes from Seattle via SR-167 South. We schedule on-site visits
      within about a week — Vladislav comes out personally, not a sales rep. Call
      (206) 591-1096 to set a time. TopVolk is WA Licensed Contractor with 100+ projects
      completed since 2023 across King, Pierce, and Snohomish counties."
  - q: "Cedar or composite — which holds up better in 98390's wet winters?"
    a: "Composite is the better long-term call for Sumner's climate. Trex and TimberTech both
      carry solid warranties and skip the every-two-year sealing cycle cedar needs. Cedar
      looks great freshly installed, but PNW moss takes hold fast on north-facing surfaces.
      We quote both with full line-item pricing so you can compare the real cost difference
      over ten years."
  - q: "Does a deck in Sumner need a permit, and how long does that process take?"
    a: "Yes. Sumner is an incorporated city — permits go through the City of Sumner's building
      department directly, not Pierce County PALS. Any deck over 200 square feet or more than
      30 inches off grade requires a permit and plan review, typically 2-6 weeks. We handle
      the application, coordinate the ledger flashing inspection, and schedule the final.
      Deadline penalties are written into every contract. Call (206) 591-1096 for a quote
      that includes permit costs."