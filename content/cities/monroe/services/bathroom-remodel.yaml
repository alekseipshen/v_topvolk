title: "Monroe Bathroom Remodel — Built for the Skykomish Valley"

intro: |
  The Skykomish River valley funnels consistent rain from October through April, and a good portion of Monroe's 1985-2000 builds weren't waterproofed to handle it long-term.

  Paper-faced drywall as shower backer. No Schluter Kerdi membrane. Builder-grade Moen single-lever valves past their service life — Vladislav walks these bathrooms regularly in 98272, and the failure pattern is consistent enough to quote before demo even starts. Heavy rain from October to April means that moisture doesn't just fall outside; it works its way through every gap in the building envelope, every failed caulk joint, every unvented exhaust run.

  What starts as cracked grout typically ends with soft subfloor and mold behind the tile by year 15.

localContext: |
  Monroe's housing stock runs from original Craftsman-era homes near Lewis Street in the old town core to the Fryelands planned community that built out through the early 2000s. The bulk of remodel calls come from 1985-2000 single-story ranchers and two-story colonials scattered through 98272 — builder-grade 4x4 ceramic tile, fiberglass tub surrounds, and 50 CFM exhaust fans that were barely adequate when new. Monroe sits at the convergence of the Skykomish and Snoqualmie valleys, where humidity doesn't let surfaces dry out between rain events the way east-side suburbs like Sammamish or Redmond do.

  Those fans have been losing for 25 years.

  Fryelands colonials off W. Main Street — the mid-to-late 1990s builds — show the most consistent waterproofing failures: original 1/2-inch drywall behind fiberglass surrounds, no cement board, no membrane. It holds up fine in a dry climate. In 98272, that assembly starts failing around year 12 to 15, right when homeowners notice the grout cracking and assume it's a cosmetic problem.

commonProblems:
  - title: "Waterproofing Failures Behind Shower Tile"
    description: "Paper-faced drywall was standard backer on 1980s and 90s Monroe builds — not cement board, not a membrane. Once the caulk at the tub surround delaminates, water gets behind the tile and into the blocking and rim joist. By the time tile feels soft underfoot, the subfloor is usually compromised too. A full tear-out with Schluter Kerdi or RedGard applied over cement board stops the cycle permanently."
  - title: "Corroded Galvanized Drain Lines in Pre-1975 Homes"
    description: "Older homes near Monroe's original town center frequently have galvanized steel drain lines corroded closed from the inside out. A walk-in shower conversion or master bath layout reconfiguration surfaces this during rough-in. Rerouting to ABS or PVC at that point adds minimal cost and avoids a failed drain hidden inside a wall cavity after the finish tile is up."
  - title: "Undersized Exhaust Fans Fueling Mold Regrowth"
    description: "A 50 CFM fan was code-minimum in 1992. Monroe's valley humidity — layered on top of heavy shower steam in a curbless shower or large-format porcelain enclosure — overwhelms that spec fast. After demo, we install 110 CFM or higher units with timer switches and passive duct dampers to prevent backdraft. Persistent mold at shower niches and ceiling corners almost always traces back to an underpowered fan, and it comes back within 18 months if you tile over the problem without fixing the airflow first. In Fryelands colonials with 2x4 exterior walls and no continuous vapor barrier, exhaust ducts running through unconditioned attic space create backdraft pressure that works against the fan year-round — not just in winter when temperature differential is highest."

