title: "Monroe ADU Construction — Backyard Units Under HB 1337"

answer: "TopVolk Construction builds DADUs, AADUs, and basement-conversion ADUs in Monroe, Washington — WA Licensed Contractor, 100+ projects since 2017."

intro: |
  Converting a detached garage or building a new backyard cottage into a legal rental unit takes a general contractor who can carry the project from site plan through final inspection — that's the work TopVolk Construction does for ADU projects in Monroe, where WA HB 1337 now allows up to two accessory dwelling units on most single-family lots. A property near Fryelands might have the depth for an 800-square-foot DADU behind the existing house, while a rancher closer to Lake Tye Park could make more sense as a basement conversion given the crawlspace height and the slope toward the Skykomish. Either layout needs real appliances in the kitchenette, and a lot of Monroe clients are speccing an LG combo washer-dryer and a 24-inch Bosch range instead of the cheap builder-grade units you'll find in most ADU kits. Vladislav Volkov, the owner, walks every lot personally before pricing it, because setback and height limits shift block to block and sometimes lot to lot. Call (206) 591-1096 for a free on-site consultation.

localContext: |
  Monroe's housing stock runs from 1970s and '80s split-levels near Old Town to newer tract construction going up around Fryelands and Chain Lake, plus a fair number of larger rural parcels along Tester Road and the Tualco Valley that still run on septic instead of city sewer. Inside city limits — 98272 covers essentially all of Monroe — ADU permits route through the City of Monroe Community Development Department, not Snohomish County PDS, and plan review typically runs 4-8 weeks depending on the queue. Step outside the city boundary toward unincorporated pockets closer to 98290 territory near Snohomish, and the project falls under Snohomish County PDS instead, with different setback and lot coverage math. Lots that back up to the Skykomish River floodplain sometimes need a raised foundation or engineered fill before a DADU can go in, which changes both the timeline and the budget. A DADU on a septic lot also needs a side sewer or septic capacity evaluation before the health district signs off, since most systems were sized for the main house only, not an extra bedroom or two.

commonProblems:
  - title: "DADU, Attached ADU, or Basement Conversion — Picking the Right Layout"
    description: "Lot size and Floor Area Ratio decide more of this than most homeowners expect. A detached unit behind a Fryelands rambler usually pencils out fine on a quarter-acre lot, but a narrow in-city parcel near downtown Monroe often can't clear both the DADU setback and the required parking exemption distance to a transit stop. Basement conversions skip the excavation cost but need an LVL beam or PSL post to open up a real living space, plus sister joists and joist hangers where the existing floor framing wasn't built to carry a kitchen. Basement units also usually need a Mitsubishi mini-split added since most Monroe basements have no ductwork run to them. Expect 2-3 weeks just to model the framing options before pricing lands."

  - title: "Utility Separation: Does the ADU Need Its Own Water Meter and Sewer Line?"
    description: "Some Monroe lots can share the main house's water and sewer connection with a sub-meter; others require a full separate side sewer tap, which means trenching across the yard and tying into the city main at the property line. That trenching alone runs $8,000-$15,000 depending on distance and whether we hit rock or old fill. A tankless Rinnai or Navien unit in the ADU mechanical closet solves the hot water problem without stealing capacity from the main house's tank. Electrical is its own decision too — most DADUs get a dedicated 100-amp sub-panel fed from the main panel rather than a whole new utility drop, which keeps the SnoPD interconnection paperwork simpler."

  - title: "Monroe's Permit Process and the 24-Foot Height Limit"
    description: "City of Monroe caps most detached ADUs at 24 feet measured from average grade, and setbacks typically run 5 feet from side and rear property lines unless the lot backs an alley. Plan review checks the site plan, structural drawings, and energy code compliance against the IRC before anything gets a permit number, and rough-in and final inspections follow the same city inspector through the build. TopVolk is a WA Licensed Contractor, and missed deadlines cost us money — it's written into the contract as a penalty, not a promise. Call (206) 591-1096 and Vladislav will walk the specific setback and height math for your parcel before you pay for a design."

  - title: "What a DADU or Basement ADU Actually Costs in Monroe"
    description: "A detached ADU with its own foundation, utilities, and finish work generally runs $180,000-$240,000 in the Monroe area; a basement conversion that already has walls and a roof usually lands between $70,000 and $120,000. What moves the number most is excavation and grading — sloped lots near the river valley cost more to level than flat parcels off Chain Lake Road — plus foundation type, slab versus crawlspace, and finish level. Semi-custom cabinets and quartz counters push a kitchenette budget up fast compared to IKEA cabinets with laminate. TopVolk quotes line-item pricing, not a range, so you know what the appliance package (KitchenAid versus Bosch, for example) actually adds before you commit."

  - title: "Weatherproofing a Standalone Structure Through the Rain Season"
    description: "Snohomish County gets roughly 37 inches of rain a year, most of it October through May, and a new detached structure with no mature landscaping around it takes the brunt of that runoff differently than the main house does. Hardie cement-board siding holds up better than raw cedar on north-facing walls that never fully dry out, though plenty of Monroe clients still want cedar shake for the look and accept the maintenance trade-off. R-49 insulation in the ceiling and a proper vapor barrier in the crawlspace keep the unit code-compliant and cut condensation risk. CertainTeed roofing with the gutter system tied into existing drainage, not just daylighted onto the lawn, keeps water away from the new foundation long term."

faq:
  - q: "How fast can you get to Monroe for Adu Construction?"
    a: "Monroe sits about 35-45 minutes from Seattle or Everett via US-2 or Highway 522, and most site visits for an ADU consultation get scheduled within a week of the call. Parking and staging are rarely an issue on Monroe's larger residential lots, which actually helps keep excavation and framing on schedule once permits clear. A detached ADU typically runs 4-7 months end to end including permitting; a basement conversion is closer to 8-14 weeks. Call (206) 591-1096 and Vladislav will set up a free on-site walkthrough."

  - q: "What does building an ADU in Monroe cost?"
    a: "Detached units generally run $180,000-$240,000 and basement conversions run $70,000-$120,000, with the spread driven by excavation, foundation type, and finish level. Sloped lots near the Skykomish floodplain or septic-served parcels on Tester Road tend to land at the higher end because of extra site work. TopVolk gives a written, line-item quote after the on-site visit — no vague per-square-foot estimate. The consultation itself is free."

  - q: "Do I need a City of Monroe permit or a Snohomish County permit for my ADU?"
    a: "If the lot sits inside Monroe city limits — most of the 98272 zip code — the permit goes through the City of Monroe Community Development Department, with plan review usually taking 4-8 weeks. Parcels in unincorporated pockets near the Tualco Valley or toward the 98290 side fall under Snohomish County PDS instead, and the setback and lot coverage rules differ slightly. TopVolk handles the site plan, structural drawings, and inspection scheduling either way as a WA Licensed Contractor. We'll confirm which jurisdiction applies before drawing anything."

  - q: "Can I build two ADUs on the same Monroe lot under WA HB 1337?"
    a: "Yes — HB 1337 allows up to two accessory dwelling units on most single-family zoned lots statewide, including a DADU paired with a basement or attached conversion, as long as setbacks, height limits, and lot coverage math still work for both. Not every Monroe parcel has room for two once you factor in the septic drain field or existing driveway. Vladislav reviews the actual lot dimensions on-site before quoting a two-unit plan. That review is part of the free consultation."

  - q: "What's the warranty on a new ADU build?"
    a: "TopVolk backs the structural and workmanship side of the build, and manufacturer warranties carry through separately on appliances and mechanical equipment — a Rinnai tankless unit or a Mitsubishi mini-split each come with their own multi-year coverage. Hardie siding and CertainTeed roofing both carry long manufacturer warranties well suited to Snohomish County's wet winters. Expect a punch list walkthrough with blue tape before final sign-off, so nothing gets missed before the crew leaves the site. Any deadline penalty written into the contract applies regardless of warranty terms."

  - q: "Do you build ADUs outside Monroe too?"
    a: "TopVolk covers Snohomish, King, Pierce, and Kitsap counties, so Sultan, Snohomish, Duvall, and Woodinville are all in range along with Monroe. Scheduling windows run a few weeks out for design and site planning, tighter for straightforward basement conversions. Vladislav handles every project directly — no sales staff, no middlemen passing the job around. Call (206) 591-1096 to get on the schedule."