title: "Monroe Deck Installation — Built for Skykomish Valley Rain"

intro: |
  The Skykomish River valley pushes over 45 inches of rain through Monroe every year,
  and 98272 neighborhoods east of US-2 near the Evergreen State Fairgrounds are full of
  1990s homes where wood decks are rotting at the ledger. Composite decking holds up to
  PNW moss and moisture far better than cedar does after a decade. More homeowners here
  are also adding outdoor kitchens with Sub-Zero built-in coolers — that load needs a
  structurally engineered deck beneath it, not a builder-grade platform.

localContext: |
  Monroe's 98272 housing runs from 1970s-80s ranchers near downtown Lewis Street to
  early-2000s tract builds around Lake Tye. The older ranchers have original rim joists
  that weren't built for today's ledger loads — and Snohomish County PDS requires plan
  review for any attached deck over 200 square feet. The foothills east of town toward
  US-2 also see freeze-thaw cycles that heave shallow post footings every winter.

commonProblems:
  - title: "Ledger Rot at the Rim Joist — Monroe's Most Expensive Surprise"
    description: "Improper ledger flashing lets moisture wick straight into the rim joist.
      On Monroe's 1990s homes near the Fairgrounds, rim joist rot can run 6-8 inches deep
      behind the ledger board. The fix: pull the old deck, sister the rim joist with fresh
      Douglas-fir framing, and install Z-flashing with Simpson Strong-Tie joist hangers
      before the new ledger goes on."
  - title: "Shallow Post Footings That Move Every Winter"
    description: "Monroe's frost line sits at 12 inches minimum, but footings on older decks
      around Lake Tye often sit on 6-inch pads poured directly on grade. Freeze-thaw cycles
      along the US-2 corridor heave them every season. New footings need to reach 18 inches
      with ground-contact PT lumber posts and Simpson post bases set off the concrete —
      no shortcuts under Snohomish County PDS."
  - title: "Guardrail Height and Stair Handrail Code Compliance"
    description: "Decks over 30 inches above grade require guardrails at 36 inches minimum
      under IRC. Stair handrails must be graspable — a flat 2x4 cap rail won't pass final
      inspection. Snohomish County PDS checks both. Trex and TimberTech both offer
      code-compliant railing systems; we spec the one that fits your design and include
      dimensions in the permit drawings."

faq:
  - q: "How fast can you get to Monroe for Deck Installation?"
    a: "Monroe is about 35 minutes from Everett on US-2. We serve 98272 regularly.
      Call (206) 591-1096 — Vladislav schedules consultations personally. TopVolk is a
      WA Licensed Contractor with 100+ projects completed since 2023."
  - q: "Trex or TimberTech — which composite holds up better in Monroe's rain and moss?"
    a: "Both outperform cedar in the PNW. Trex Transcend handles UV and moisture well;
      TimberTech's Terrain collection is popular locally for its wood-grain look without
      the annual maintenance. We quote both materials with line-item pricing so you see
      the actual cost difference before deciding."
  - q: "What does the Snohomish County permit process look like for a deck in Monroe?"
    a: "Attached decks over 200 sq ft go through Snohomish County PDS — plan review
      typically takes 3-6 weeks. We handle the application, coordinate rough-in and final
      inspections, and build to pass first time. Total timeline from permit submission to
      punch list: 8-12 weeks. Missed deadlines cost us money — that clause is written
      into the contract."