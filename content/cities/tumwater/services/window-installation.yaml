  - q: "Do I need a permit to replace windows in Tumwater?"
    a: "Same-size, same-location replacements — where the rough opening isn't touched — typically don't require a City of Tumwater permit. Any work that enlarges the opening, adds an egress window in a basement bedroom, or modifies structural framing (header, king stud, trimmer) does require a permit through City of Tumwater Community Development. Plan review for residential window work runs approximately 2–4 weeks. TopVolk is a WA Licensed Contractor and handles the permit application and submittal as part of the project scope — no need to create a portal account or figure out which documents the city needs."

  - q: "Should I choose vinyl or fiberglass windows for my Tumwater home?"
    a: "Mid-grade vinyl — Milgard Style Line, Pella 250 Series — performs well in most Tumwater applications and costs less. Fiberglass makes more sense on large picture windows where sash deflection under load is a concern, on south and west elevations that see significant temperature swings, or in older homes where painted exterior profiles need to match original Craftsman or Tudor trim details. Fiberglass expands and contracts at nearly the same rate as glass, which keeps the IGU seal intact longer in Thurston County's wet, temperature-variable winters. The price premium over vinyl is real — plan on 30–50% more — but so is the longevity difference on exposed elevations."

