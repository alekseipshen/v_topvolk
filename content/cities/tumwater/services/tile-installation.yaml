  - q: "Do I need a permit for tile installation in Tumwater?"
    a: |
      Straightforward tile replacement in an existing shower or on an existing floor typically doesn't require a permit from the City of Tumwater Building Division. The exceptions are clear: moving plumbing (relocating a drain, adding a second showerhead), adding electrical for a heated floor system, or structural changes like converting a tub surround into a full walk-in shower with a new pan. Schluter Ditra-Heat and Warmup systems both require a 240V dedicated circuit and an electrical permit — simple residential electrical permits in Tumwater typically process same-day or within 2–3 business days. TopVolk (WA Licensed Contractor) manages required permit applications as part of the project. We don't skip electrical permits on heated floor installations.

  - q: "What's the difference between Schluter Kerdi and RedGard for shower waterproofing?"
    a: |
      Kerdi is a bonded sheet membrane — polyethylene with fleece laminate on both sides — that bonds directly to cement board using unmodified thinset. RedGard is a liquid-applied membrane rolled or troweled onto cement board in two coats, then cured before tiling. Both are code-compliant waterproofing methods. Kerdi's advantage in Tumwater's heavy-use shower applications: it creates a continuous bonded barrier immediately, allows tiling the same day once thinset cures, and comes with purpose-built Schluter accessories (Kerdi-Band for seams, Kerdi-Kereck for inside corners) that eliminate the weak points where liquid membranes tend to fail over time. RedGard gets used when a Kerdi application isn't practical for the geometry or budget. For primary shower waterproofing in a bathroom that will see daily use for 20 years, Kerdi is the default at TopVolk.

  - q: "How long does tile installation hold up in Tumwater's climate, and what's the warranty?"
    a: |
      A properly detailed shower installation — cement board substrate, Schluter Kerdi membrane, quality unmodified thinset, sanded grout, and penetrating sealer — holds up 20+ years in western Washington's persistent humidity. The failure mode in the Pacific Northwest isn't usually the tile or grout themselves; it's the substrate or membrane detailing at seams and corners where moisture eventually finds a path. TopVolk provides a 2-year workmanship warranty on tile installations. Grout joints on bathroom floors should be resealed every 1–2 years with a penetrating silicone sealer; shower floors annually. Natural stone requires yearly sealer reapplication. Porcelain tile itself is essentially impervious to moisture and won't degrade from Tumwater's climate regardless of rainfall.

