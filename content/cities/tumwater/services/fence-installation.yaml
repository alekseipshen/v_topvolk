  - q: "Does a fence in Tumwater require a city permit?"
    a: |
      For most residential privacy fences under 6 feet in side and rear yards, the City of Tumwater's Building Division does not require a building permit. Front yard fences over 4 feet, fences exceeding 6 feet anywhere, and fence-retaining wall combinations over 4 feet in total wall height do trigger a permit requirement. Tumwater also has setback rules that govern how close a fence can sit to the property line — confirming with a plat map or survey pins before installation avoids costly disputes. TopVolk reviews the permit situation on every project before writing a contract, and Vladislav, a WA Licensed Contractor, handles all permit submittals and coordinates with the Building Division directly when required.

  - q: "How deep do fence posts actually need to be set in Tumwater soil?"
    a: |
      In Tumwater's clay-heavy, high-moisture soil, standard fence posts for a 6-foot fence should be set at a minimum 30 inches, with 36 inches preferred for gate posts, corner posts, and end posts that take the most lateral load. The general Washington State guideline is post depth equal to one-third of the above-grade post height — but in clay that retains water and experiences freeze-thaw movement, deeper always wins. TopVolk uses 8-inch diameter tube forms with 60-80 lbs of Quikrete per standard post hole, and more on gate and corner posts. Shallow footings in saturated Thurston County soil are the single most common cause of leaning fences; correcting them later means pulling posts and re-pouring from scratch.

  - q: "How long will a fence last in Tumwater's climate, and what does TopVolk warrant?"
    a: |
      A properly installed cedar board-on-board fence with PT ground-contact posts in Tumwater should deliver 15-20 years before boards need significant replacement — assuming the posts were set deep enough and the boards are stained or sealed every 2-3 years. The PT posts themselves, poured in concrete at proper depth, typically outlast the cedar boards by a decade. CertainTeed vinyl fencing carries a manufacturer's limited lifetime warranty against cracking, peeling, and color fade under normal conditions. TopVolk warrants all labor for three years from installation — if a post heaves, a board warps due to installation error, or gate hardware fails within that window, it gets corrected at no additional charge. Normal weathering of cedar boards is not a warranty item, but the maintenance schedule gets covered at the final walkthrough.

