title: "Tumwater Carpentry — Custom Built-ins, Trim & Stair Work"

answer: "TopVolk Construction does custom carpentry in Tumwater, WA — built-ins, trim work, stair rebuilds — WA Licensed Contractor, 100+ projects since 2023."

intro: |
  Stair stringers in 1960s split-levels don't last forever — and in Tumwater's wet winters, the damage compounds when water intrudes through a leaking threshold or uncaulked exterior casing. TopVolk Construction, owner-operated by WA Licensed Contractor Vladislav Volkov, handles carpentry throughout Tumwater: custom floor-to-ceiling built-ins near Tumwater Falls Park, stair tread and stringer rebuilds, trim restoration in the mid-century ranchers along Capitol Boulevard, and exterior cedar fascia replacement on homes that have been absorbing 50+ inches of annual rain for decades. The Tumwater Hill neighborhood has a lot of 1955–1970 ranchers with original Douglas-fir trim that's been painted over so many times the profile is barely readable anymore. Getting those details right — scribing a built-in to an out-of-plumb wall, or milling custom casing to match a backband profile that no lumberyard stocks — is the difference between a renovation that looks finished and one that looks retrofitted. Vladislav is on every job. You talk to the person doing the work, not a project coordinator who's never picked up a saw.

localContext: |
  Homes in zip code 98512 — the core of Tumwater proper — range from postwar Cape Cods and 1950s ranchers near lower Tumwater to newer subdivisions off Littlerock Road SW. The 98501 corridor along Capitol Way mixes craftsman-influenced construction from the 1940s with some commercial-to-residential conversions. Both areas tend to have non-standard trim profiles, older fir flooring, and closets sized for 1960s wardrobes — not modern storage demands. Most interior carpentry in Tumwater doesn't require a permit: built-ins, trim, door replacements, and closet systems all fall under finish work. Structural scopes — stair stringer replacement, header modifications, anything affecting load path — go through the City of Tumwater Building Division. Properties sitting in unincorporated Thurston County rather than within city limits use the Thurston County Building Department instead. Exterior wood trim here faces real stress: moss establishes on north-facing cedar surfaces by mid-October, and any fascia that's lost its paint seal will check and begin to rot within two or three wet seasons. Pressure-treated (PT) lumber is required wherever wood contacts concrete or soil.

commonProblems:
  - title: "Stair Tread and Stringer Failure in Mid-Century Tumwater Homes"
    description: |
      Split-level and raised-rancher homes in the Tumwater Hill area — mostly built between 1958 and 1975 — typically have stair assemblies with a single-ply stringer and 1-inch treads. Once the tread-to-riser joint opens and moisture works in, the stringer notch begins to split and the whole assembly goes soft underfoot. A full stair rebuild means pulling old treads and risers, sistering or replacing the stringers with LVL stock or solid Douglas-fir, and installing new treads — usually 1-1/8" red oak for stained finishes or paint-grade poplar when the stairs will be painted white. Tread replacement on a standard 12-step interior stair runs $1,800–$3,200 in materials and labor depending on species and whether the skirt board needs replacement too. Full stringer replacement adds to that. Budget 3–5 days of on-site work for a complete stair rebuild with new treads, risers, and newel cap detail.

  - title: "Exterior Cedar Fascia Rotting at Rafter Tails"
    description: |
      Tumwater gets rain from October through May with almost no dry-out window, and fascia boards are typically the first exterior carpentry element to fail. The rafter tail cut-off exposes end grain directly to weather — end grain absorbs water faster than face grain and stays wet far longer. Once rot gets past the fascia into the rafter tail itself, the scope shifts from carpentry to framing repair. Catching it at the fascia stage means cutting back to clean wood, treating the rafter tail with a consolidant like LiquidWood, and installing new cedar or Hardie cement-board fascia with the back face primed before the board goes up. A 100-linear-foot fascia replacement with cedar runs roughly $2,000–$3,500 installed depending on profile complexity and ladder access. Hardie fascia costs more upfront but eliminates the rot cycle entirely on north-facing or permanently shaded runs — worth the premium.

  - title: "Custom Built-ins That Actually Fit Older Wall Conditions"
    description: |
      Floor-to-ceiling built-in bookshelves and window seats look straightforward on paper. In a 1955 Tumwater rancher, the wall may be 1/2 inch out of plumb over eight feet, the floor may crown in the middle, and the corner isn't 90 degrees. The fix is scribing — fitting the face frame and cabinet sides to the actual wall condition rather than nominal dimensions. We build carcasses from cabinet-grade Baltic birch plywood, apply hardwood face frames in paint-grade maple or poplar, and detail window seat lids with Blum lift hardware for storage access. For craftsman-influenced homes near Tumwater Falls Park, we can match existing window casing profiles so the built-in reads as original rather than added-on. These jobs typically run $4,000–$9,000 depending on linear footage and finish complexity, with 5–10 days of combined shop and field work. Permits are not required for this scope in Tumwater.

  - title: "Interior Trim Matching and Door Casing Replacement in Older Homes"
    description: |
      Replacing a hollow-core door in a 1940s home sounds routine until you pull the existing casing and find a custom backband profile that no big-box lumberyard stocks. Most contractors stop there and install whatever approximate match they can find — which is why mismatched trim shows up in so many older Tumwater homes. We run custom profiles on a router table or shaper when necessary and source reproduction millwork from suppliers like House of Antique Hardware for shorter runs. Installing a solid-core door with custom-matched casing — shimming the jamb, routing for new hinges, mortising a lockset — runs $800–$1,800 per door depending on profile complexity. Wainscoting and beadboard installation with miter-returned chair rail adds $12–$22 per linear foot installed. Getting the reveal at the door jamb right matters as much as matching the profile — a mismatched reveal is what the eye catches first every single time.

  - title: "Kitchen Pantry and Closet Systems: Custom vs. Flat-Pack"
    description: |
      IKEA PAX and similar flat-pack systems work well in standard spaces with square walls and full-height clearance. Most Tumwater homes built before 1980 don't have standard spaces — sloped ceilings in Cape Cods, angled soffits in ranchers, and closets that are 20 inches deep instead of 24. Custom fabrication is often the only way to actually use the space rather than work around it. We build pantry and closet systems from cabinet-grade Baltic birch plywood with adjustable shelf pin systems, full-extension Blum Tandem drawer slides, and dovetail drawer boxes for high-use areas. A custom pantry cabinet in the 98512 area — 36 inches wide, floor to ceiling with pull-out shelving — typically runs $1,200–$2,400 fabricated and installed. Full walk-in closet systems with mixed hanging, shelving, and drawers run $3,500–$7,000 depending on square footage. Custom shop lead time is 2–4 weeks from signed contract.

