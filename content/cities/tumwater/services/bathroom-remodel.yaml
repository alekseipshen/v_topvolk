title: "Tumwater Bathroom Remodel — Moisture-Proof Upgrades for PNW Homes"

intro: |
  The subdivisions stacked along Tumwater Boulevard and up into Tumwater Hills shipped with bathrooms that were already cutting it close in 1992. Builder-grade fiberglass surrounds, 4-inch tile set in organic mastic, and ventilation fans rated at 50 CFM — not enough for a region that sees rain from October through May. Thurston County's valley climate holds moisture longer than Seattle proper, and north-facing bathrooms near the Deschutes River corridor show it in the grout lines first. The mastic delaminates, the fiberglass cracks at the shelf corners, and suddenly you're looking at a gut-and-rebuild rather than a simple refresh. TopVolk Construction LLC has handled this exact scenario in Tumwater — including full walk-in shower conversions with Schluter Kerdi membranes and large-format porcelain — since 2023. If the fan in your master bath sounds like it's struggling to move air, the damage behind the wall has probably already started.

localContext: |
  Most of Tumwater's residential stock breaks into two eras. The older neighborhoods clustered around 98501 — close to Tumwater Falls Park and the historic brewery district along Capitol Boulevard — have homes from the 1940s through early 1960s. Those bathrooms often still have cast-iron drain stacks, galvanized supply lines, and floor tile set directly on the subfloor without a waterproofing layer underneath. The newer subdivisions in 98512, including Tumwater Hills and the developments off Littlerock Road, run mostly 1980s to mid-1990s construction with fiberglass tub-shower combos and particle-board vanity bases. Humidity from the Deschutes valley accelerates delamination on both types. The City of Tumwater issues its own permits — not Thurston County — so plan review runs through Tumwater's Community Development department. Typical review for a bathroom remodel with plumbing reroutes takes 3-5 weeks. We prepare the permit package, pull it under our WA Licensed Contractor status, and handle rough-in inspection and final inspection scheduling.

commonProblems:
  - title: "Fiberglass Surround Failure in 1980s–90s Tumwater Tract Builds"
    description: |
      The one-piece fiberglass tub-surround units installed in Tumwater's 98512 subdivisions have a practical lifespan of about 20-25 years under normal use. Most are well past that now. Failure usually starts at the ledge corners and the molded soap shelf where water sits continuously. Mastic behind the surround stays wet, the surround flexes, and the seal at the tub deck breaks. Water migrates into the subfloor. By the time you feel soft spots near the toilet, you're dealing with subfloor replacement on top of the shower conversion. We remove the unit, sister any compromised joists, install DriCore subfloor panels where needed, then build a tiled walk-in shower with a Schluter Kerdi membrane on walls and floor. Material costs alone for Kerdi plus large-format porcelain run $4,000–$7,000 before labor. Total project timeline: 3-4 weeks including permit and rough-in inspection.

  - title: "Grout and Tile Failure from Inadequate Waterproofing Below"
    description: |
      Tile set over standard drywall backer — not cement board, not a waterproofing membrane — was common practice in Tumwater through the 1990s. It's a code violation under current IRC standards, but it was done constantly during the tract-build era. The grout cracks, water migrates behind the tile, and the backer softens. By year 20, you're pulling tile off walls that crumble. The fix requires full demo down to the studs, vapor barrier inspection on the exterior wall — critical for north-facing bathrooms along the Deschutes corridor — and a fresh substrate: typically Schluter KERDI-BOARD or cement board coated with RedGard. Large-format porcelain (24x24 or 12x24) goes on top, set in modified thinset with proper back-buttering. Grout joints get a sanded polymer grout with a penetrating sealer applied at completion. This holds. The original mastic-over-drywall system simply wasn't designed for PNW humidity levels.

  - title: "Plumbing Reroutes in Pre-1965 Tumwater Homes Near the Falls"
    description: |
      The older homes in 98501 near Tumwater Falls Park and the brewery-district blocks often have cast-iron drain stacks and galvanized supply lines that are functionally at end of life. Galvanized corrodes from the inside out — you lose flow before you see a visible leak. Rerouting to copper or cross-linked polyethylene (PEX) requires opening walls and sometimes ceiling access from below. The City of Tumwater requires a separate plumbing permit for any supply or drain reroute, and a licensed plumber pulls that permit concurrently with the general building permit. TopVolk coordinates the full MEP — mechanical, electrical, plumbing — so you're not managing three separate subs and three separate inspection schedules. Rough-in inspection happens after framing and plumbing are in but before drywall hang. Timeline for a full bathroom remodel with plumbing reroutes: 5-7 weeks from permit submission to punch list closeout. WA Licensed Contractor, all permits included.

  - title: "Ventilation Failures and Mold Behind Walls in Tumwater Bathrooms"
    description: |
      A 50 CFM exhaust fan — code minimum in the 1990s — is genuinely inadequate for Tumwater's climate. The Deschutes valley holds humidity well past when other parts of the region dry out, and any bathroom without a properly sized, ducted fan will grow mold behind the drywall within 5-7 years. We've pulled tile in Tumwater Hills bathrooms and found active mold colonies on the stud faces. That requires mold remediation before the remodel even begins. Proper spec: a Panasonic WhisperCeiling or Broan unit rated 80 CFM minimum for a standard 5x8 bath, or 110 CFM for master baths over 100 square feet. The duct runs directly to the exterior — not into the attic chase. Recessed lighting gets IC-rated, air-sealed housings. Dimmer-compatible LED trim throughout. Not the most visible line item, but it's why the tile and grout don't fail again in year three.

  - title: "ADA Accessibility Retrofits for Long-Term Tumwater Homeowners"
    description: |
      Tumwater has a significant population of homeowners who bought in the 1980s and are now in their 60s and 70s. A standard 32-inch doorway, 5-inch tub threshold, and towel bar anchored into drywall alone don't work once mobility becomes an issue. ADA retrofits in an existing bathroom involve widening the rough opening to 36 inches (often requiring an LVL beam or doubled header if it's a load-bearing wall), converting the tub to a curbless walk-in shower with a linear drain, and installing Kohler or Moen grab bars anchored into blocking between studs — not toggle bolts. A fold-down teak bench in the shower adds functional safety without making the room feel institutional. Any doorway or wall modification requiring structural work triggers a City of Tumwater building permit. Vladislav Volkov walks through these layouts on-site, assesses the framing directly, and delivers a line-item quote — not a rough range. Call (206) 591-1096 to schedule a free site visit.

faq:
  - q: "How fast can TopVolk get to Tumwater for a bathroom remodel estimate?"
    a: |
      Tumwater is roughly a 50-minute drive from the Seattle metro via I-5 south. Scheduling a site visit typically takes 3-7 days from first contact, depending on current project load. Vladislav comes to the site himself — not a commissioned closer — and walks the bathroom to assess framing, plumbing access, and waterproofing conditions before quoting. Most on-site consultations run 45-60 minutes and result in a written, line-item estimate within 48 hours. Call (206) 591-1096 to get on the calendar. Free consultation, no commitment required.

  - q: "What does a bathroom remodel in Tumwater typically cost?"
    a: |
      A cosmetic refresh — new tile, vanity, and fixtures with no layout changes or plumbing reroutes — runs $18,000–$28,000 for a standard 5x8 bathroom. A full gut-and-rebuild with a walk-in shower conversion, plumbing reroutes, and a Schluter Kerdi waterproofing system typically lands between $32,000 and $55,000 depending on tile selection and fixture grade. ADA retrofits with structural header work add $8,000–$15,000 on top of either scenario. What drives cost up: cast-iron drain stack reroutes, load-bearing wall modifications, and large-format porcelain with complex layouts. We write fixed-price contracts — not time-and-materials — with financial penalties for missed deadlines. Call (206) 591-1096 for a free on-site estimate with exact line-item pricing.

  - q: "Do I need a permit for a bathroom remodel in Tumwater, WA?"
    a: |
      For most remodels, yes. The City of Tumwater's Community Development department requires building permits for any work involving plumbing reroutes, new or modified electrical circuits, structural changes like doorway widening, or wall moves. Purely cosmetic work — swapping a vanity on existing supply connections, retiling without a substrate change — typically doesn't trigger a permit. We pull all required permits under our WA Licensed Contractor status, prepare the permit application package, and schedule the rough-in inspection and final inspection. Plan review at Tumwater's building department runs 3-5 weeks for bathroom projects with plumbing modifications. That timeline gets built into the project schedule from day one, so construction start dates don't slip while we wait on permit approval.

  - q: "Can you convert a tub-shower combo to a walk-in shower in Tumwater?"
    a: |
      Yes — it's one of the most common requests from 1980s and 1990s Tumwater homes. The existing fiberglass tub-shower unit gets removed, the subfloor inspected for soft spots or joist damage, and a fully tiled walk-in shower built in its place. We use a Schluter Kerdi membrane on the walls and a Schluter KERDI-SHOWER pan on the floor — bonded directly to the subfloor, not floating. Large-format porcelain or stone tile goes on top. A Moen or Kohler pressure-balance valve with rain head and handheld combination is standard. Master baths with extra square footage often get a niche, a fold-down bench, and a linear drain for a fully curbless entry. Timeline: 3-5 weeks including City of Tumwater permit and inspections.

  - q: "How long does a bathroom remodel take in Tumwater from start to finish?"
    a: |
      Scope determines timeline. A tile-and-fixture refresh with no plumbing changes takes 3-4 weeks once materials are ordered and on-site. A full gut-and-rebuild with a walk-in shower conversion, plumbing reroutes, and permit — the majority of what we do in Tumwater — runs 6-9 weeks from permit submission to final inspection. That includes 3-5 weeks for City of Tumwater plan review, 2-3 weeks of active construction, and 1-2 weeks for finish work, blue tape walkthrough, and punch list closeout. Subfloor or structural surprises — not uncommon in the older 98501 homes near the falls — get documented immediately, with a revised scope and timeline delivered in writing the same day. Missed deadlines carry financial penalties written into the contract.

  - q: "Does TopVolk cover Tumwater and surrounding Thurston County cities?"
    a: |
      Yes. Tumwater, Olympia, Lacey, and unincorporated Thurston County parcels are all within the service area. Each jurisdiction handles permits differently — City of Tumwater, City of Olympia, and Thurston County each have their own plan review process and AHJ (authority having jurisdiction) — and we're familiar with all three. Most of the Thurston County work involves 1980s–2000s residential bathrooms with moisture issues, outdated fiberglass surrounds, or galvanized plumbing that needs a full reroute. Historic homes in the older Olympia neighborhoods around 98501 sometimes still have original subway tile work worth preserving. Schedule a free site visit at (206) 591-1096 — Vladislav covers Thurston County on specific days to keep drive time manageable, so booking a few days out is typical.