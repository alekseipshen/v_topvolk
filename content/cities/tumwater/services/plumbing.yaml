intro: |
  Plumbing remodel and pipe replacement work in Tumwater is handled by TopVolk Construction, a WA Licensed Contractor owner-operated by Vladislav Volkov with 100+ projects completed since 2023. Tumwater's housing mix runs from 1950s and earlier homes near Tumwater Falls Park — with original galvanized supply lines and cast-iron drain stacks — to 1980s and early 1990s subdivisions off Capitol Boulevard where gray polybutylene pipe is still under a lot of sinks. Two completely different problems in the same city. Homes in the Trosper Road corridor often turn up pressure regulator valves that are 25 years past their service life, which quietly ruins Moen cartridges and Kohler flush valves over and over until someone checks the incoming psi. Vladislav does the on-site consultation himself — not an estimator, not a salesperson — so the quote you get is from the person pulling the City of Tumwater permit and doing the work.

localContext: |
  Tumwater spans zip codes 98501 and 98512, and plumbing conditions shift considerably between the two. The older 98501 corridor near the Deschutes River and Tumwater Falls tends to be pre-1960 construction — galvanized iron or lead-jointed copper supply lines, ceramic fixture rough-ins, and in some cases, original cast-iron drain stacks that have scaled to a fraction of their original diameter. Over in 98512, out toward the Littlerock Road and Bush Prairie areas, the stock runs 1970s–90s ranchers with copper supply lines in reasonable shape but aging pressure regulator valves and water heaters well past their warranty period. The City of Tumwater Community Development Department requires permits for water heater replacements, gas line work, and any drain line rerouting — and WA state code mandates seismic strapping on all water heater tanks regardless of capacity. Thurston County averages close to 50 inches of rain annually, and that moisture load keeps crawlspaces damp from October through May, accelerating corrosion on any ferrous supply lines and making vapor barrier condition critical when accessing underfloor plumbing.

commonProblems:
  - title: "Galvanized Supply Line Replacement in Pre-1960 Tumwater Homes"
    description: |
      Galvanized iron supply pipe corrodes from the inside out — by the time pressure drops noticeably at a Kohler or Delta shower valve, the pipe interior has typically narrowed 50–70% from mineral scale and rust buildup. Homes near Tumwater Falls with original post-and-pier foundations often have tight crawlspace clearance under 18 inches, which adds labor time to any repipe. Full replacement from the meter to every fixture, swapping galvanized for PEX-A or Type L copper, typically runs $8,000–$18,000 on a 1,400–2,200 sq ft home depending on access and story count. Uponor AquaPEX is the go-to for long trunk lines — the expansion fittings outperform crimp connections in cold crawlspace conditions. Plan on 3–5 working days for the repipe itself, plus a City of Tumwater rough-in inspection before any walls or subfloor close back up.

  - title: "Polybutylene Pipe Failure in 1985–1995 Tumwater Subdivisions"
    description: |
      Gray poly-b supply lines show up regularly in Tumwater homes built during the late 1980s and early 1990s, particularly in the subdivisions off Capitol Boulevard and Trosper Road that went up fast during the regional building boom. Polybutylene reacts with chlorine and chloramine in municipal water — the pipe becomes brittle over time and splits at acetal fittings first, usually inside wall cavities or under-slab, before the homeowner notices anything. Thurston County's water systems run chloramine treatment, which degrades poly-b faster than older chlorine-only systems. Patch repairs using push-fit fittings on existing poly-b are a short-term stopgap; full replacement with PEX-B or copper is the only permanent solution. A complete repipe on a 1,400 sq ft rancher runs 2–3 days of work, with the City of Tumwater permit and rough-in inspection adding roughly one week to the overall schedule.

  - title: "Tankless Water Heater Conversion and Gas Line Upsize"
    description: |
      Converting from a 40- or 50-gallon tank to a Rinnai RU199 or Navien NPE-240A condensing tankless unit in Tumwater involves more than swapping the appliance. Tankless units draw 150,000–199,000 BTUs at peak load — the ¾-inch gas line that fed the old tank heater is almost always undersized and needs to be upgraded to 1-inch diameter or larger depending on total run length and other appliance loads on the same meter. The City of Tumwater requires a permit for every water heater replacement, including tankless conversions, and seismic strapping is required by WA code for any tank-style unit. Condensing models also require a Category IV stainless steel vent liner or dedicated PVC exhaust run — if the existing B-vent chase is shared with the furnace, that changes the scope. Budget $3,500–$6,500 for a complete conversion including gas line upsize, venting, and permit fees.

  - title: "Pressure Regulator Valve Failure and Its Downstream Damage"
    description: |
      City water pressure in parts of Tumwater runs above 80 psi, which exceeds the IRC maximum and wears out Moen cartridges, Kohler ceramic disc valves, and washing machine supply hose fittings in 2–3 years instead of a decade. The pressure regulator valve — a brass bell-shaped fitting installed on the cold supply where it enters the structure — is the first line of defense, and most are rated for 15–20 years. Failed or missing PRVs also cause water hammer, that banging noise in the pipes when a valve closes fast. Replacement runs $350–$650 in most Tumwater homes, depending on pipe material and access at the meter entry. Setting the new valve to 55–65 psi extends fixture life significantly and quiets hammer noise. This is not a permit-required repair under most conditions, but Vladislav checks incoming pressure on every first visit. Call (206) 591-1096 to schedule an assessment.

  - title: "Drain Line Rerouting for Kitchen Islands and Basement Bathrooms"
    description: |
      Adding a kitchen island sink or a basement bathroom in Tumwater means rerouting drain lines — and drain lines only flow one direction, so the geometry has to work before anything is framed. A kitchen island drain typically requires a 2-inch ABS or PVC branch running back to a 3-inch main stack at ¼-inch-per-foot slope per IRC, plus a venting solution: either a code-approved air admittance valve (AAV) or a wet vent tie-in to an existing vent stack. Basement bathrooms sitting below the city sewer connection need a sewage ejector pump — a Zoeller M53 or equivalent submersible unit in a sealed pit — unless the sewer grade allows gravity drainage. Both scenarios require a City of Tumwater permit and rough-in inspection before concrete or subfloor closes. Labor for a basement bathroom rough-in runs $4,500–$9,000 depending on whether an ejector pit is required. Timeline from permit application to final inspection is typically 3–6 weeks.

