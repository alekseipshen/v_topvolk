  - q: "Does plumbing work in Tumwater require a permit, and who handles that?"
    a: |
      Most plumbing work beyond a straight fixture swap requires a permit through the City of Tumwater Community Development Department. Water heater replacements, gas line modifications, drain line rerouting, and new fixture rough-ins all require both a permit and a scheduled inspection. Seismic strapping for water heaters is mandatory under WA state code — inspectors verify it on every final. Permit fees for typical residential plumbing work in Tumwater run $150–$400, and plan review on straightforward jobs takes 1–2 weeks. TopVolk is a WA Licensed Contractor and submits permit applications directly — homeowners don't need to navigate the paperwork. The permit timeline is built into the project schedule from day one, not treated as an afterthought.

  - q: "Is PEX or copper the better choice for repiping a Tumwater home?"
    a: |
      Both are solid options, but they fit different situations. PEX-A — Uponor AquaPEX specifically — is flexible enough to snake through existing wall cavities without opening every wall, and the expansion fittings create a connection that actually strengthens in cold conditions rather than loosening. Type L copper is the better call at exposed fixture connections and anywhere the pipe runs through an unconditioned attic or uncovered crawlspace section. In a typical Tumwater crawlspace repipe, the approach is PEX-A for the main trunk lines and copper or brass fittings at fixture tie-ins. For a pre-1960 home near Tumwater Falls, PEX-A usually cuts total labor time 20–30% compared to a full copper repipe on the same floor plan.

