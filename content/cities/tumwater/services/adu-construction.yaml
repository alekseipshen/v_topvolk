title: "Tumwater ADU Construction — Add a Rental Unit on Your Thurston County Lot"

answer: "TopVolk Construction builds DADUs and attached ADUs in Tumwater, WA — WA Licensed Contractor, 100+ projects completed, owner Vladislav Volkov on every job."

intro: |
  Under WA HB 1337 (2024), most Tumwater single-family lots can now support up to two ADUs — and for properties inside city limits, permits run through the City of Tumwater Community Development department, not Thurston County. The 98512 zip code has a run of 1970s ranchers near Tumwater Valley Golf Course and newer split-levels toward the Tumwater Historical Park corridor, where lots frequently clear the 5,000-square-foot threshold for a workable DADU footprint. State agency workers from the Olympia Capitol Campus and JBLM-area commuters fuel consistent rental demand along this I-5 stretch — a real, local driver that makes the ADU math work here. A finished 600-square-foot DADU with a Mitsubishi mini-split and Navien tankless water heater can realistically rent for $1,200–$1,500/month in the current Thurston County market. Vladislav Volkov at TopVolk Construction handles ADU projects here from first site visit through final inspection — 100+ projects completed since 2023 across Thurston, King, and Pierce counties, and you talk directly to the person running the job from the first call.

localContext: |
  Tumwater's core residential stock in the 98512 zip skews 1960s–1980s — rambler-style and split-level homes on 7,000–10,000 square foot lots, which gives most parcels enough room for a detached ADU within the city's setback and lot coverage limits. The 98511 zip, which covers portions of the Tumwater valley near the Deschutes River and Capitol Lake, trends toward mid-century ranchers on slightly larger parcels, sometimes with mature Douglas-fir trees that affect ADU siting and foundation placement decisions. Tumwater's wet season runs October through May, and the city's clay-heavy soils stay saturated longer than the glacial soils further north in King County — vapor barrier and drainage design are non-negotiable parts of any slab-on-grade ADU foundation. Homes built before 1975 in both zip codes commonly have galvanized water supply lines; a plumbing permit for a new ADU utility connection will trigger review of the existing service, and Vladislav accounts for that in the scope before drawings are commissioned. The City of Tumwater allows ADUs ranging from 300 to 800 square feet, with a 4-foot minimum setback from rear and side yard boundaries for detached units.

commonProblems:
  - title: "Setbacks and Lot Coverage: Making a DADU Footprint Fit a Tumwater Lot"
    description: |
      Tumwater's 4-foot rear and side yard setback for detached ADUs sounds generous until you run the actual lot coverage math on a 7,500-square-foot parcel. If the primary home already covers 1,800–2,100 square feet, the remaining buildable envelope shrinks fast once setbacks are applied on all sides — and an existing driveway, patio slab, or detached garage eats further into the FAR limit under Tumwater's R-4 and R-6 residential zoning. Designing a 700-square-foot DADU before verifying that the lot can actually support it is a common and expensive mistake. Before any drawings are commissioned, Vladislav pulls the zoning map, reviews plat dimensions, and calculates the real buildable footprint on the first site visit. That 30-minute calculation shapes everything that follows — size, placement, orientation, and setback strategy — and it costs nothing upfront.

  - title: "Utility Connections: Shared vs. Separate Water and Sewer for the ADU"
    description: |
      Most Tumwater residential lots were built with a single water meter and one sewer lateral serving the primary home. Adding a detached DADU forces a concrete decision: share the existing connection under one meter, or run a separate water meter and sewer tap to the new unit. Separate meters add $4,000–$7,000 depending on distance to the main and required meter size, but they simplify billing and prevent financing complications if the ADU is ever refinanced or sold independently. For a detached unit 50-plus feet from the main house, the supply line run also requires proper burial depth and PT conduit protection. Navien tankless water heaters are standard on TopVolk's ADU builds — compact enough for a utility closet, and properly sized for a 400–600 square foot unit rather than over-spec'd from a generic catalog template. Vladislav reviews existing utility stub locations at the site visit before the scope is written.

  - title: "City of Tumwater Permit Process: What a Complete ADU Submittal Actually Requires"
    description: |
      For ADU projects inside Tumwater city limits, all permits go through the City of Tumwater Community Development department — not Thurston County Resource Stewardship. A complete submittal requires a site plan showing setbacks and lot coverage calculations, architectural floor plans, structural drawings with LVL beam sizing at header spans, energy compliance documentation per Washington State Energy Code, and MEP (mechanical, electrical, plumbing) plans. Under state law, compliant ADU applications must receive a decision within 60 days of a complete submittal — but the clock only starts on a complete package, so a partial submittal that gets kicked back resets that timeline. Rough-in inspection happens after framing, plumbing, and mechanical rough-in are in but before drywall. Final inspection closes the permit after finish work and utility connections are confirmed. TopVolk is a WA Licensed Contractor; Vladislav prepares the full submittal package in-house so nothing falls through the gap between the homeowner and the permit counter.

  - title: "What ADU Construction Costs in Tumwater — and What Actually Drives the Number"
    description: |
      A detached DADU in Tumwater — 500 to 800 square feet, slab-on-grade, full bathroom, kitchenette — typically runs $110,000–$160,000 depending on finish level, utility separation scope, and mechanical choices. Attached AADUs and basement conversions start lower, around $60,000–$90,000, because the foundation and exterior shell costs drop significantly when you're working inside or adjacent to an existing structure. The real cost drivers: foundation type (slab vs. crawlspace adds $10,000–$18,000), utility separation, and finish package — Milgard windows, semi-custom cabinets, and Bosch appliances sit comfortably at mid-range without pushing the budget the way a Pella wood-clad window spec or full custom millwork would. Every TopVolk contract includes a penalty clause for missed milestones — written in, not a verbal assurance. Quotes break out every trade line by line so there are no surprises on the invoice.

  - title: "Foundation and Moisture Control: Building on Tumwater's Clay Soils"
    description: |
      Thurston County averages close to 50 inches of rain annually, and Tumwater's clay-heavy soils hold surface moisture well into spring. A slab-on-grade ADU foundation needs a minimum 6-mil vapor barrier under the slab, rigid foam insulation at the perimeter to hit WA energy code's R-10 slab-edge requirement, and properly compacted sub-base — skipping any of those steps shows up as moisture intrusion within a couple of winters. If the lot grades toward the ADU footprint, a French drain or surface swale belongs in the design from day one, not as a retrofit. PT (pressure-treated) lumber is required for all bottom plates within 8 inches of grade, and rim joist blocking at the foundation perimeter gets treated as well. Hardie cement-board siding is the standard exterior spec on Tumwater ADU builds — it handles the moss and mildew accumulation that north-facing wood siding collects by year two in this climate, and it doesn't need repainting every three years.

faq:
  - q: "How fast can you get to Tumwater for ADU construction?"
    a: |
      Tumwater sits right off I-5 at Exits 101 and 102 — from the South King County area, that's roughly 55–70 minutes without heavy southbound traffic. From Tacoma and Pierce County, it's closer to 35–45 minutes. Initial site consultations in Tumwater are typically scheduled within the same week of the first call. Call Vladislav directly at (206) 591-1096 to set up a free on-site walkthrough — bring your survey plat if you have one, and we'll walk the lot, confirm setbacks, check utility stub locations, and work through feasibility before any drawings are commissioned.

  - q: "What does a detached ADU in Tumwater cost?"
    a: |
      A detached DADU in Tumwater — 500 to 800 square feet, full bath, kitchenette, slab-on-grade — typically runs $110,000–$160,000 all-in. Attached AADUs and basement conversions come in lower, $60,000–$90,000, since foundation and exterior shell costs drop substantially. Finish choices, utility separation scope, and window package — Milgard Tuscany series vs. Pella fiberglass casements — shift the number by $15,000–$25,000 on a mid-sized unit. TopVolk provides a free on-site estimate with full line-item pricing: call (206) 591-1096 to schedule a site visit and get actual numbers for your specific lot and program.

  - q: "Do I permit through the City of Tumwater or Thurston County for an ADU?"
    a: |
      Properties inside Tumwater city limits permit through the City of Tumwater Community Development department — Thurston County Resource Stewardship handles unincorporated parcels outside city limits. A complete city ADU submittal requires site plan with setback calculations, structural drawings, energy compliance documentation, and MEP plans. State law requires a compliant-application decision within 60 days — but the clock starts only when the submittal is complete, so a partial package that bounces back resets the timeline. Vladislav prepares the full permit submittal package in-house as a WA Licensed Contractor, which means one point of contact from drawing to permit issuance.

  - q: "Should I build a detached DADU, an attached AADU, or convert my basement?"
    a: |
      It depends on your lot, your budget, and what rent premium you're targeting. Basement conversions are the lowest-cost path — $55,000–$85,000 — but they require minimum 7-foot ceiling height under the IRC, egress windows, and if the existing slab has any moisture history, a vapor barrier and DriCore subfloor before any finish work. Detached DADUs cost more upfront but give tenants full separation from the primary home, typically commanding $150–$300/month more in rent. Garage conversions land in the middle — existing footprint reduces cost, but you lose covered parking. Vladislav walks through all three options with real numbers and lot constraints on the first site visit, not after you've already committed to a design.

  - q: "What warranty comes with a TopVolk ADU build in Tumwater?"
    a: |
      Structural framing and waterproofing are warranted for 2 years after the final inspection. Hardie cement-board siding carries a 30-year manufacturer warranty. Mechanicals — Mitsubishi mini-split systems and Navien tankless water heaters — come with manufacturer warranties of 5–12 years depending on unit and registration. Cosmetic items flagged during the blue tape walkthrough but deferred by the homeowner at punch list are not covered post-closeout. In Tumwater's wet climate, the highest long-term risk is water intrusion at the roof-to-wall transition on a detached DADU — that flashing connection is inspected and photo-documented before drywall goes up on every job.

  - q: "Do you cover Olympia and Lacey for ADU projects, or just Tumwater?"
    a: |
      TopVolk covers Tumwater, Olympia, Lacey, and the surrounding Thurston County area as part of the regular Pierce and South King County I-5 corridor. Olympia ADU permits run through City of Olympia Development Services; Lacey through the City of Lacey Community Development department — both have distinct plan review timelines and fee schedules, and Vladislav knows both counters. Scheduling from first call to site visit typically runs 3–5 business days. Call (206) 591-1096 to get on the calendar — Vladislav makes the site visit himself, not an estimator filling out a form.