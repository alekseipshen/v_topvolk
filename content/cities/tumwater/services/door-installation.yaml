  - q: "Do I need a permit to replace a door in Tumwater, WA?"
    a: |
      A like-for-like entry door replacement — same rough opening size, no structural changes — typically doesn't need a permit inside Tumwater city limits. Converting a sliding patio door to a French door system, enlarging an opening, or cutting in a new door where a window previously existed does require a permit through the City of Tumwater Community Development department. Work in unincorporated Thurston County just outside city limits goes through Thurston County's Permit Assistance Center. TopVolk is a WA Licensed Contractor and handles permit applications and coordination on all work that requires them — you won't be managing paperwork or chasing plan review status.

  - q: "What is a sill pan, and why does it matter for my new entry door?"
    a: |
      The threshold is the visible piece you step over — the adjustable sill plus the door sweep on the bottom of the door slab. The sill pan sits underneath it inside the rough opening, and its job is to catch any water that gets past the weatherstripping and route it outward before it reaches the framing. Most entry doors that develop rot within 5–10 years either skipped the sill pan entirely or used a thin plastic pan that cracked and pooled water against the framing. A proper install uses a sloped aluminum sill pan with end dams, integrated with self-adhering flashing membrane like Vycor across the rough sill before the door unit is set. That detail is standard practice on every door TopVolk installs — not an upgrade.

  - q: "What warranty comes with a new door installation in Tumwater?"
    a: |
      Therma-Tru and ProVia both offer limited lifetime warranties on their fiberglass door slabs covering structural integrity, with 10-year warranties on the insulated glass unit seals. Finish warranties on painted or stained fiberglass typically run 5–10 years depending on orientation and weather exposure — South-facing doors in Tumwater hold up better than West-facing entries that take direct prevailing rain. Workmanship on the installation itself — flashing, casing, and rough opening prep — is covered under TopVolk's own workmanship warranty. A properly installed fiberglass door in this climate should give you 30+ years without frame rot issues. Full warranty terms are covered during the free on-site consultation.

