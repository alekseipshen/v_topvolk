  - q: "What does a heat pump installation in Tumwater cost?"
    a: |
      Whole-home heat pump conversions in Tumwater run $10,000–$16,000 installed — that covers
      equipment, refrigerant, electrical, and labor. The range reflects ductwork condition, whether
      the existing air handler can stay, and whether the electrical panel needs a sub-panel upgrade
      to support the new load. Ductless mini-splits for a single room or ADU run $3,500–$6,500 per
      zone. High-efficiency gas furnace replacements run $4,500–$8,000. The free on-site
      consultation includes a Manual J load calculation and a line-item written quote with specific
      numbers — not ranges. Deadline penalties are written into every TopVolk contract, and
      100+ projects have been completed since 2023. Call (206) 591-1096 to set up the site visit.

  - q: "Does HVAC replacement in Tumwater require a permit from the city?"
    a: |
      Yes — City of Tumwater Community Development Department requires a mechanical permit for
      heat pump replacements, new mini-split installs, and furnace swaps that change fuel type,
      venting configuration, or refrigerant circuit. Straight like-for-like furnace replacements
      in the identical location with the same venting may qualify for a simplified over-the-counter
      permit, but any refrigerant work or equipment type change goes through full plan review.
      As a WA Licensed Contractor, TopVolk pulls the permit on your behalf — the cost is included
      in the project quote. Residential mechanical plan review at Tumwater typically runs two to
      four weeks, with rough-in and final inspections scheduled through the city's permit portal.

  - q: "How do I know if my existing ductwork can actually handle a heat pump?"
    a: |
      The two-part diagnostic is a Manual J load calculation combined with a duct blaster test.
      Manual J establishes how many BTUs the home needs at design temperature; the duct blaster
      measures how much conditioned air reaches the living space versus escaping into the
      crawlspace. Heat pumps deliver supply air at 95–105°F versus 125–140°F on a gas furnace,
      so they need more airflow to move the same heat. Undersized 1980s six-inch trunk lines in
      98512 homes are the most common bottleneck — they often need duct modifications or a
      variable-speed air handler swap to match the heat pump's airflow curve. Vladislav runs both
      tests during the site visit and includes the findings in the written quote.

  - q: "What warranty comes with HVAC equipment installed in Tumwater?"
    a: |
      Brand warranties vary: Mitsubishi covers compressors for 12 years when registered at install
      (6 years unregistered), Daikin offers a similar 12-year parts warranty on registered
      equipment, and Carrier Infinity systems carry 10-year parts coverage. All three require
      documented annual maintenance — in Tumwater's humid climate, skipping the annual coil
      cleaning or refrigerant check is the most common reason manufacturers deny compressor
      claims. TopVolk's workmanship warranty covers the installation itself for three years:
      refrigerant fittings, line set connections, electrical work, condensate drainage, and
      startup settings. After year one, parts fall to the equipment manufacturer under their
      registered warranty terms.

