  - q: "What PSI and cleaning solution do you use — and will high pressure damage my siding or deck?"
    a: |
      Surface type determines both pressure and chemistry — there's no single setting that works everywhere. Cedar siding and decks: 1000–1500 PSI with a 40-degree tip and a wood cleaner pre-treatment (Defy Wood Cleaner or TWP prep solution). Hardie fiber cement siding: 500–800 PSI, low-pressure house wash with a surfactant-based Sodium Hypochlorite mix. Concrete driveways: 2500–3500 PSI with a Surface Cleaner attachment to prevent stripe marks. Roofs use a soft-wash method only — under 100 PSI with downstream SH solution — because anything higher on CertainTeed Landmark or similar architectural shingles voids the manufacturer's warranty. Using one pressure setting across different surfaces is exactly how cedar grain gets blown out or Hardie's factory finish gets lifted.

  - q: "How long does power washing last before moss and algae come back in Tumwater?"
    a: |
      Results depend on surface type and site conditions. Concrete driveways stay clean 1–2 years before organic matter and oil accumulation rebuild — faster under heavy tree canopy. Cedar decks maintained with a penetrating stain need re-cleaning every 2–4 years; untreated cedar may need attention annually. Soft-washed roofs in Thurston County's climate typically see moss return in 3–5 years, which lines up with the standard maintenance cycle. Biological regrowth isn't something any contractor can warranty — moss spores settle regardless of how thorough the cleaning was. The workmanship itself is guaranteed: if a surface isn't cleaned to the agreed standard, we return and correct it at no charge.

