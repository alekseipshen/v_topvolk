commonProblems:
  - title: "North-Facing Roof and Deck Moss Removal"
    description: |
      Moss colonies on north-facing roofs and cedar decks don't just look bad — the rhizoids physically push between shingle tabs and deck board gaps, creating water channels that bypass surface waterproofing. In Tumwater's 98511 zip, homes with Douglas-fir canopy overhead stay shaded October through May, which is exactly the temperature and moisture window where Gloeocapsa magma algae and bryophyte moss establish fast. High-pressure blasting is the wrong approach — it strips surface fibers and voids CertainTeed shingle warranties. The correct method is downstream injection of a 3–5% Sodium Hypochlorite solution with a dwell time of 15–20 minutes, followed by a low-pressure soft-wash rinse under 100 PSI at the surface. This kills biological matter at the root level without mechanical damage. Budget $350–$700 for a single-story roof soft-wash depending on square footage and pitch, with cedar deck moss removal running $200–$400 separately.

  - title: "Cedar Deck Surface Prep Before Stain Application"
    description: |
      Applying TWP 1500 Series or Defy Extreme over a surface with biological contamination or gray oxidation is one of the most common project mistakes — stain won't penetrate correctly and peels within 12–18 months. Cedar decks in older Tumwater neighborhoods near Deschutes Parkway absorb moisture year-round, pushing tannins to the surface and causing gray discoloration that signals oxidation. The prep sequence matters: first apply a wood cleaner (Defy Wood Cleaner or TWP's prep solution) at the correct dilution, then a brightener (oxalic acid solution) to restore wood pH and open the grain, then a light 1000–1200 PSI rinse with a 40-degree tip to avoid raised grain. Dry time of 48–72 hours is required before any stain goes on — in May or early September that window is realistic, but November through January it's nearly impossible to hit. Coordinate the wash date with your stain schedule upfront, not as an afterthought.

  - title: "Hardie Cement-Board Siding Cleaning Before Exterior Repaint"
    description: |
      James Hardie fiber cement siding needs cleaning every 5–8 years before repaint — the manufacturer recommends it, and most paint contractors in Thurston County won't warranty their work over a contaminated surface. Algae, mold, and mildew get into the texture of HardiePanel or HardieShingle products and block primer adhesion entirely. The right process is a low-pressure house wash at 500–800 PSI using a diluted Sodium Hypochlorite solution with a surfactant like Simple Green, working bottom to top to avoid streaking and rinsing top to bottom. High pressure on Hardie panels can breach the factory finish and void the 30-year product warranty. Thurston County doesn't require a permit for exterior cleaning itself, but if the repaint involves siding replacement or scaffolding above a certain height, that's a separate scope. TopVolk is a WA Licensed Contractor — not just a wash crew — so those downstream permit questions get flagged before they become problems. Cleaning a 1,500–2,000 sq ft home exterior runs $400–$900.

  - title: "Concrete Driveway and Walkway Cleaning: Cost and What Drives the Price"
    description: |
      Concrete driveways in Tumwater's newer subdivisions — particularly 1990s and 2000s construction in the 98511 zip — accumulate oil drip stains, tire rubber marks, and organic matter from years of wet PNW winters. Standard hose pressure won't move embedded oil. Effective cleaning starts with a commercial degreaser pre-treatment — ZEP Industrial Purple or a similar alkaline degreaser — applied and left to dwell 10–15 minutes before washing. Then a Surface Cleaner attachment at 2500–3500 PSI on an 8–10 GPM commercial machine pulls the staining evenly without the stripe marks a standard wand leaves behind. A two-car driveway plus front walkway runs $250–$500 depending on staining severity and total square footage. Add a back patio or garage apron and the range moves to $400–$750. Annual maintenance cleaning costs less than the first full cleanup. Long-term, clean concrete also resists surface spalling during the freeze-thaw cycles Thurston County sees in colder winters.

  - title: "Cedar Fence Cleaning Before Staining: The PNW 3–5 Year Maintenance Cycle"
    description: |
      Cedar fencing in Tumwater turns gray and develops surface mold within 2–3 years without maintenance — Thurston County's wet winters and humid summers accelerate the process faster than in drier climates. The standard maintenance cycle for cedar fencing is a wash-and-restain every 3–5 years. Before any stain goes on, the fence needs power washing: apply a wood cleaner (Ready Seal Wood Cleaner or Armstrong Clark's equivalent), let it dwell, then rinse at 1200–1500 PSI with a 25-degree tip on individual boards — excess pressure splinters cedar surface fibers. After washing, apply a wood brightener (oxalic acid solution) to neutralize pH and open the grain for stain penetration. Ready Seal or Armstrong Clark Stain applied at the correct mil thickness holds 4–5 years in Thurston County conditions. A typical 150–200 linear feet of cedar fence wash runs $300–$500. Plan 48 hours of dry time before staining — coordinate both services upfront to avoid a scheduling gap between the two trades.

