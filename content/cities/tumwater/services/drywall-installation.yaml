localContext: |
  Tumwater's housing stock breaks down cleanly by decade. The 98512 zip covers most of the city's residential core — ranch homes and split-levels built between 1965 and 1985, where original 3/8-inch or 1/2-inch gypsum board was hung in bathrooms and laundry rooms without moisture-resistant backing or vapor barriers behind the tile. The 98501 zip, which straddles the Tumwater-Olympia border near the Capitol Campus area, holds a mix of mid-century homes from the 1950s alongside newer infill construction. Thurston County logs roughly 50 inches of rain annually — wetter than Seattle — and crawlspace assemblies and exterior walls in older homes were not engineered for that sustained moisture load. It shows up as soft spots at floor level, delaminating tape seams in bathrooms, and mold bloom on paper facing in laundry rooms. The City of Tumwater runs its own building department; structural work or ADU additions require a permit, while purely cosmetic drywall with no framing changes typically does not.

commonProblems:
  - title: "Mold-Resistant Board in Bathrooms and Laundry Rooms — Getting the Substrate Right"
    description: |
      Bathrooms in Tumwater's 1970s ranchers were hung with standard 1/2-inch gypsum board — paper-faced, no moisture resistance, just drywall behind the tile. After two or three decades, steam from showers and Thurston County's persistent humidity work into the seams, and the paper facing delaminates or molds. The fix starts with tearing back to framing, treating any mold on studs with Concrobium or Zinsser Mold Killer, then hanging National Gypsum XP or USG Sheetrock Mold Tough as the tile backer — not standard green board, which the IRC no longer recognizes as an approved wet-area substrate. Add a Schluter Kerdi membrane at curb-to-wall transitions in walk-in showers, and you have a substrate that holds up under daily use. Demo-to-hang-to-tape on a standard 60 sq ft shower surround runs about 3–5 trade days, with labor in the $800–$1,400 range depending on tile layout complexity.

  - title: "Level 5 Finish — The Standard for Kitchens and Baths Under Modern Lighting"
    description: |
      Level 5 finish means skim coating the entire drywall surface before priming — not just feathering the seams. Sidewall sconces, under-cabinet LED strips, and raking natural light will telegraph every trowel mark on a Level 3 or Level 4 hang. Tumwater's 1970s and 1980s homes got Level 3 at best — seams finished, surface knocked down, done. Upgrading to Level 5 during a kitchen or bath remodel adds one full skim pass, a prime coat, and a second skim before final paint; it is the only practical finish under dimmer-compatible LED recessed cans or pendant lighting. Expect a $1.50–$2.50 per square foot upcharge over Level 4, depending on ceiling height and surface condition — on a standard 12x14 kitchen, that is roughly $400–$700 added to the hang-and-tape scope.

  - title: "5/8-Inch Type-X Firecode Drywall for Garage Separations and ADU Fire-Rated Assemblies"
    description: |
      Washington's IRC Section R302 requires a 1/2-hour fire-rated assembly between an attached garage and living space — that means 5/8-inch Type-X gypsum board on the garage ceiling and all shared walls, taped and mudded with no gaps at penetrations. ADU conversions under WA HB 1337 carry the same fire-separation requirement for any attached unit. Type-X is not standard 5/8-inch board — the glass fiber reinforcement in the core is what earns the fire rating, and that distinction matters at the rough-in inspection. USG Sheetrock Firecode C and National Gypsum Fire-Shield are the two panels used on these assemblies. The City of Tumwater requires a permit for garage-to-living or ADU work; the rough-in inspection checks penetration sealing before wall close-up. Hang and tape on a typical two-car garage separation runs $1,200–$2,200 depending on ceiling height and shared wall footage.

  - title: "Popcorn Ceiling Removal and Skim Coat in Tumwater's Pre-1985 Ranch Homes"
    description: |
      Popcorn ceilings in pre-1980 construction require asbestos testing before any scraping starts — chrysotile asbestos was a common additive in spray texture applied before 1978. A certified inspector samples and lab-tests for about $30–$75 per sample; abatement, if results come back positive, runs $2–$7 per square foot. Once cleared: wet-scrape the texture, let the ceiling dry, skim coat in two passes with all-purpose joint compound, sand, and prime before paint. Level 4 finish is standard for most ceilings; upgrade to Level 5 where pendant lights or recessed cans create directional lighting that will expose every imperfection. A 1,200 sq ft single-story ranch in the 98512 zip — the most common housing type in Tumwater's older subdivisions — typically runs $2,800–$5,500 for full popcorn removal and skim coat. Call (206) 591-1096 to schedule a scope review before committing to a whole-house scrape.

  - title: "Soundproofing Between Bedrooms and Shared Walls — Resilient Channel vs. QuietRock"
    description: |
      Standard drywall hung direct to studs does almost nothing for airborne sound transmission between rooms. Two approaches that actually work: resilient channel with standard 5/8-inch board, or QuietRock 510 or 530 panels. Resilient channel decouples the drywall from the framing so vibration cannot transfer directly through the stud; QuietRock uses a constrained damping layer inside the panel that reduces sound transmission without the complexity of a fully decoupled assembly. For Tumwater homes with a bedroom above a home theater or a shared wall adjacent to a noisy kitchen, TopVolk typically specs resilient channel plus 5/8-inch board plus acoustic sealant at every penetration. STC ratings in practice: standard 1/2-inch drywall on studs runs roughly STC 33–35; resilient channel with 5/8-inch board reaches STC 45–50; QuietRock 530 hits STC 50–52. Labor to demo, install resilient channel, hang, tape, and finish a 12x14 bedroom wall runs $2,000–$4,000 depending on wall configuration.

