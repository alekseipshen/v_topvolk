  - q: "Does drywall work in Tumwater require a building permit?"
    a: |
      Cosmetic drywall work — patching, skim coating, replacing damaged board without changing framing — does not require a permit from the City of Tumwater, but new walls, structural changes, or drywall in a garage-to-ADU conversion under WA HB 1337 do. The fire-rated 5/8-inch Type-X assembly at the separation wall gets inspected at both rough-in and final by Tumwater's building department, while unincorporated areas just outside city limits fall under Thurston County's jurisdiction instead. TopVolk prepares permit applications, drawings, and inspection scheduling as part of full renovation scopes, with WA Licensed Contractor status on record for all permitted work.

  - q: "What's the difference between Level 3, Level 4, and Level 5 drywall finish?"
    a: |
      Level 3 is the minimum for texture applications — tape embedded, two coats of compound, tool marks acceptable under a spray coat — while Level 4 is the standard for most painted interior surfaces, with three coats of compound smooth enough for flat or eggshell paint. Level 5 adds a full skim coat over the entire panel face before priming, required under semi-gloss or gloss paint or in any room with sidewall sconces and raking light from pendant fixtures. In practice, Level 4 holds up fine under standard interior paint; Level 5 is the spec for kitchens, baths, and principal bedroom suites where lighting angles will expose every surface imperfection — most Tumwater remodels call for Level 4 on new hang and Level 5 on kitchen and bath walls.

  - q: "What warranty do you offer on drywall installation in Tumwater?"
    a: |
      TopVolk warranties drywall labor for one year against defects — cracking at seams, nail pops, joint failures not caused by settlement or water intrusion — with material warranties running separately through the manufacturer, as USG and National Gypsum both carry limited product warranties on their board. In Thurston County's wet climate — roughly 50 inches of annual rain, with humidity running high from October through April — the biggest long-term risk is moisture intrusion behind the drywall, not the drywall itself, so warranty coverage does not apply to damage from roof leaks, plumbing failures, or bulk water events that occur after project completion. A no-charge punch list walkthrough 6–12 months post-completion is offered to catch anything that warrants a warranty call.

